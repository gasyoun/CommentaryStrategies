# guarding test — grep-only / create-not-gate": errata notes existed only as
# CHANGELOG prose (v1.15.1), invisible to any check. This file is the register;
# tests/test_errata_registry.py is the guard. Every published-figure erratum
# gets ONE entry here: what was printed, what is true, and the data file that
# arbitrates. Schema is enforced by the guard — add entries WITH all fields.

name: CI

# Baseline CI for Python tooling repos.
# Lint (ruff) + format-check (black) + pytest + YAML lint.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Critical errors (non-blocking warnings)
        run: ruff check --select=E9,F63,F7,F82 --output-format=github .
      - name: Style report (warnings only)
        run: ruff check --output-format=github . || true

  format-check:
    name: Format check (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install black
        run: pip install black
      - name: black --check (warn only initially)
        run: black --check --diff . || echo "::warning::Formatting drift — run 'black .' locally to fix"

  test:
    name: Pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
      - name: Run pytest
        run: |
          if find tests test -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q . || compgen -G "test_*.py" > /dev/null || compgen -G "*_test.py" > /dev/null; then
            pytest -v --tb=short
          else
            echo "::warning::No tests directory or test_*.py files found. Add tests/ to enable test coverage."
          fi

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: pip install pyyaml
      - name: Validate all YAML
        run: |
          python -c "
          import sys, glob, yaml
          fail = 0
          for f in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              if '.git' in f: continue
              try:
                  with open(f, encoding='utf-8') as fh: yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  print(f'::error file={f}::{e}'); fail = 1
          sys.exit(fail)
          "

  corpus:
    name: Corpus integrity
    runs-on: ubuntu-latest
    # Schema-driven guards (the checks that catch vasilkov/poetics-style drift) +
    # full artifact reproducibility for ALL data-derived generators.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        # indic-transliteration is needed by profile_nilakantha.py (Dev→IAST);
        # the rest of the corpus scripts are stdlib-only.
        run: pip install -r requirements.txt
      - name: Schema + content validation
        run: python scripts/validate.py
      # B6 (roadmap 2026H2): релизные метаданные не дрейфуют — версия в
      # .zenodo.json обязана совпадать с CITATION.cff (ловушка «cff-version
      # вместо релиза», найденная drain A05 29-08-2026); теги сверяются
      # мягко — в этом job'е checkout неглубокий, без тегов.
      - name: Release metadata parity (CITATION.cff ↔ .zenodo.json)
        run: python scripts/check_release_meta.py
      - name: CTS-URN cross-check (book ↔ number)
        run: python scripts/derive_urn.py --check
      # B2 (roadmap 2026H2): crosswalk на ID параллельного корпуса samskrtam.ru
      # должен воспроизводиться из urn байт-в-байт (derive, не ручная разметка).
      - name: samskrtam.ru ID mapping parity
        run: python scripts/samskrtam_map.py --check
      # Mixed-script words hide from every search that assumes one alphabet per
      # word (issue #173). 643 of them were found once someone looked; the
      # h2864 vote settled all but three declared exceptions, so this can gate.
      - name: Transliteration hygiene (no undeclared mixed-script words)
        run: python scripts/translit_hygiene.py --check
      # Corpus-truth gate (H2872): committed census stays internally consistent
      # and no surface re-asserts the reconciled defects (Erman 1977/SPb imprint,
      # Kalyanov 1950-1992, unqualified snapshot totals). The live recount half
      # runs only where ../SamudraManthanam exists (not in CI).
      - name: Corpus-truth reconciliation gate
        run: python scripts/corpus_truth_census.py --check
      - name: All generated artifacts reproducible from data
        run: |
          python scripts/export_tei.py
          python scripts/build_pages.py
          python scripts/parse_formulas.py
          python scripts/profile_nilakantha.py
          python scripts/extract_false_friends_profile.py
          python scripts/build_visualizations.py
          git diff --exit-code -- \
            tei/ pages/ visualizations.html \
            data/ramayana_epithets.json data/nilakantha_profile.json data/false_friends_profile.json \
            || { echo "::error::Generated artifacts are stale — re-run the generators and commit."; exit 1; }

  review-platform:
    name: Review platform contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: review-tests/package-lock.json
      - name: Python contracts and immutable evidence
        run: |
          python scripts/gate_ledger_selftest.py
          python scripts/validate_adjudication_policy.py
          python scripts/build_apparatus_review_portal.py --check
          python scripts/validate_apparatus_submission.py tests/fixtures/apparatus_submission_valid.json
          python scripts/import_apparatus_submission.py tests/fixtures/apparatus_submission_valid.json --dry-run
          python scripts/build_gate_disagreement_queue.py --check
          python scripts/review_platform_selftest.py
          python scripts/validate_submission_changes.py
      - name: Browser install
        working-directory: review-tests
        run: npm ci
      - name: Chromium install
        working-directory: review-tests
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        working-directory: review-tests
        run: npx playwright test --project=desktop --project=mobile
      - name: Worker/D1 acceptance
        working-directory: review-api
        run: |
          npm ci
          npm test

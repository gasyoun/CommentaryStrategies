<script>window.APPARATUS_DATA={"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 32, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 15, "verses_with_notes": 12, "notes_by_layer": {"tier1": 5, "lexical": 5, "phase2": 4, "edition": 3, "crosstext": 0}, "built_for_reviewer": "Костина", "source_hash": "f8e1498745a850c3b158e61c834866e18428d9eccfea08e84d0150e7e86dd571"}, "sarga": 32, "verses": [{"verse_id": "5.32.1", "verse": "1", "sanskrit_iast": "tataḥ śākhāntare līnaṃ dṛṣṭvā calitamānasā । veṣṭitārjunavastraṃ taṃ vidyutsaṃghātapiṅgalam ॥1॥", "leonov_ru": "Тогда устроившегося среди ветвей увидев, [она] с взволнованной душой, Одетого в белую одежду ту обезьяну, желтую, подобно блеску молнии.", "commentary": {"bhusana": "ततः शाखान्तरे लीनमित्यादि श्लोकद्वयमेकान्वयम् । दृष्ट्वा पूर्वं सामान्यतो दृष्ट्वा भयाच्चलितमानसा सती विशेषतो ददर्श । वेष्टितार्जुनवस्त्रं वेष्टितधवलवस्त्रम् । तं पूर्वोक्तम्\nनमो ऽस्तु वाचस्पतये सवज्रिणे स्वयम्भुवे चैव हुताशनाय च ।\n\nअनेन चोक्तं यदिदं ममाग्रतो वनौकसा तच्च तथा ऽस्तु नान्यथा\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे द्वात्रिंशः सर्गः ।। 5.32।।\n\nअनेनोक्तं सत्यमस्त्विति देवताः प्रार्थयते नम इति । हुताशनाय च अग्नये च\nततः शाखान्तरे लीनं दृष्ट्वा चलितमानसा ।\n\nवेष्टितार्जुनवस्त्रं तं विद्युत्सङ्घातपिङ्गलम्", "siromani": "हनुमद्वचनश्रवणानन्तरकालिकं सीतावृत्तान्तमाह तत इत्यादिभिः । ततः हनुमद्वचनश्रवणसमये वेष्टितं धृतमर्जुनवस्त्रम् अर्जुनवर्णसदृशवर्णविशिष्टपटो येन तं विद्युत्संघातवत् पिङ्गलं शाखान्तरे शाखामध्ये लीनं हनूमन्तं दृष्ट्वा चलितमानसा ऽभवदिति सीतेति च शेषः"}, "has_tier1": false, "notes": [{"id": "lexical:5.32.1:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "piṅgala", "note_ru": "Пингала (piṅgala, adj.) — «рыжевато-бурый, тёмно-золотистый, тёмно-рыжий»: от корня, связанного с piṅga / √piñj «красить в жёлто-красный цвет». MW: piṅgala «reddish-brown, tawny, yellow, gold-coloured» (AV, и далее). В 32.1 vidyutsaṃghātapiṅgalam (букв. «рыжий, как скопление молний») — двойная отсылка: piṅgala — природный цвет обезьян-ванаров (ср. piṅgādhipati «владыка рыжих» = Сугрива), но здесь сравнение с молнией добавляет грозовой, небесный план. Это Хануман явлен Сите сразу в двух регистрах: как обезьяна (piṅgala) и как сверхъестественное существо (vidyut).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:piNgala"}]}, {"verse_id": "5.32.2", "verse": "2", "sanskrit_iast": "sā dadarśa kapiṃ tatra praśritaṃ priyavādinam । phullāśokotkarābhāsaṃ taptacāmīkarekṣaṇam ॥2॥", "leonov_ru": "Она увидела обезьяну там укрытую, приятно-говорящую, Блеском (внешностью) подобную массе цветущей ашоки, с глазами, подобными плавленому золоту.", "commentary": {"bhusana": "सा ददर्श कपिं तत्र प्रश्रितं प्रियवादिनम् ।\n\nफुल्लाशोकोत्कराभासं तप्तचामीकरेक्षणम्", "siromani": "सेति । फुल्लाशोकोत्करवदाभासो यस्य तं तप्तचामीकरेक्षणं तप्तसुवर्णवर्णवन्नेत्रविशिष्टं हनुमन्तं ददर्श निरन्तरमवलुलोके"}, "has_tier1": true, "notes": [{"id": "tier1:5.32.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «2» Строфа есть не во всех редакциях"}]}, {"verse_id": "5.32.3", "verse": "3", "sanskrit_iast": "sātha dṛṣṭvā hariśreṣṭhaṃ vinītavad upasthitam । maithilī cintayām āsa svapno 'yam paraṃ gatā ॥3॥", "leonov_ru": "Тогда она, увидев лучшего из обезьян, скромно стоящего перед нею, Майтхили подумала: «Это сон», придя в величайшее [изумление].", "commentary": {"bhusana": "[साथ दृष्ट्वा हरिश्रेष्ठं विनीतवदवस्थितम् ।]\n\nमैथिली चिन्तयामास विस्मयं परमं गता ।\n\nअहो भीममिदं रूपं वानरस्य दुरासदम् ।\n\nदुर्निरीक्ष्यमिति ज्ञात्वा पुनरेव मुमोह सा", "siromani": "सेति । विनीतवत् आविनीतोक्त्या अवस्थितं हरिश्रेष्ठं दृष्ट्वा परमं विस्मयं गता मैथिली चिन्तयामास"}, "has_tier1": false, "notes": [{"id": "lexical:5.32.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "svapna", "note_ru": "Свапна (svapna, m.) — «сон (состояние), сновидение»: от √svap- (класс II, Whitney #628, «спать»), с производительным суфф. -na. MW: svapna «sleep, sleeping; a dream». В индийской эпистемологии (ньяя, веданта) svapna — второй из четырёх состояний сознания (avasthā): jāgrat (бодрствование) → svapna (сон со сновидениями) → suṣupti (глубокий сон) → turīya. Сита применяет эту категорию к восприятию Ханумана (32.3, svapno 'yam): увидев говорящую обезьяну, она прибегает к философской рамке — это должно быть сновидение. Внутренний монолог 32.9–32.13 разворачивает дилемму svapna / na-svapna как эпистемическую проблему.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:svapna (нояяическая классификация avasthā)"}]}, {"verse_id": "5.32.4", "verse": "4", "sanskrit_iast": "ahō bhīmamidaṃ sattvaṃ vānarasya durāsadam । durnirīkṣamidaṃ matvā punareva mumoha sā ॥4॥", "leonov_ru": "«О ужасное это создание из обезьян, к которому опасно приближаться, На которое неприятно смотреть» - думая [так], она снова пришла в растерянность.", "commentary": {"tilaka": "वानरस्य निर्धारणे षष्ठी जातावेकवचनम् वानराणां मध्ये इदं सत्वं जीवः, भीमं प्राकृतप्राणिभयावहम्, अत एव तैर्दुरासदं दुर्निरीक्ष्यं चेति मत्वा पुनरपि मायैवेयमिति भयान्मुमोह", "siromani": "चिन्ताकारमाह अहो इति । वानरस्य इदं सत्वं शरीरं भीमं रक्षसां भयंकरम् अत एव दुरासदं ग्रहीतुमशक्यम् अत एव दुर्निरीक्ष्यमिदमिति मत्वापि पुनर्मुमोह रामातिस्मृत्या वैचित्यं प्राप । एवो ऽप्यर्थे"}, "has_tier1": false, "notes": [{"id": "phase2:5.32.4:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "punareva mumoha", "note_ru": "Комментаторы расходятся в причине повторной растерянности Ситы: по Тилаке, она вновь пугается, заподозрив, что перед ней очередная иллюзия (māyā) — как некогда олень-Маричи; по Широмани же, помрачение вызвано нахлынувшей тоской по Раме (rāmātismṛtyā vaicittyam). Подстрочник фиксирует лишь сам факт растерянности, не называя её причины.", "type": "Б", "source_commentary": ["tilaka", "siromani"], "why_proposed": "два комментатора дают разные психологические причины повторного помрачения Ситы (страх перед иллюзией vs. тоска по Раме), не названные в подстрочнике", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "edition:5.32.4:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.32.4–5 (2 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.32.4–5", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.32.4", "iast": "ahō bhīmamidaṃ sattvaṃ vānarasya durāsadam । durnirīkṣamidaṃ matvā punareva mumoha sā ॥4॥"}, {"verse_id": "5.32.5", "iast": "vilalāpa bhṛśaṃ sītā karuṇaṃ bhayamohitā । rāma rāmēti duḥkhārtā lakṣmaṇēti ca bhāminī ॥5॥"}]}]}, {"verse_id": "5.32.5", "verse": "5", "sanskrit_iast": "vilalāpa bhṛśaṃ sītā karuṇaṃ bhayamohitā । rāma rāmēti duḥkhārtā lakṣmaṇēti ca bhāminī ॥5॥", "leonov_ru": "Запричитала испуганная Сита громко и жалостно, Удрученная горем красавица: «Рама! Рама! Лакшмана!»", "commentary": {"bhusana": "विललाप भृशं सीता करुणं भयमोहिता ।\n\nरामरामेति दुःखार्ता लक्ष्मणेति च भामिनी\nरुरोद बहुधा सीता मन्दं मन्दस्वरा सती", "tilaka": "अथ भयमोहिता सती भृशं करुणं दीनं विललाप । विलापप्रकारः-- रामेत्यादि", "siromani": "विललापेति । भयमोहिता भयं मोहितं यया सापि सीता दुःखार्ता सती भृशं विललाप"}, "has_tier1": true, "notes": [{"id": "tier1:5.32.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «bhāminī» Опущено"}]}, {"verse_id": "5.32.6", "verse": "6", "sanskrit_iast": "ruroda sahasā sītā mandamandasvarā satī । sātha dṛṣtvā harivaraṃ vinītavad upagatam । maithilī cintayām āsa svapno 'yam iti bhaminī ॥6॥", "leonov_ru": "Заплакала тут Сита тихо-тихо верная мужу (праведная) Увидев лучшего из обезьян, скормно представшего [перед ней], Майтхили прекрасная подумала: «Сон это».", "commentary": {"tilaka": "लीनं दृष्ट्वा ऽस्फुरन्तं दृष्ट्वा चलितमानसा ऽदृष्टरूपो ऽयमपि मायामृगो वेति चलितचित्ता । पुनः सम्यङ्निरीक्ष्योच्यमानविशेषणं कपिं ददर्श । वेष्टितं परिहितमर्जुनवर्णं वस्त्रं येन तम्\nअथ मनोरथमात्रमेतदिति संभाव्य तदपि नेति निश्चिनोति मनोरथ इति । मनोराज्यमित्यर्थः । स नेत्याह तथापीति । तथैवेत्यर्थः । यथा मनोरथोन्नीतो ऽर्थस्तं तथैव बुद्ध्यापि निश्चयात्मकान्तःकरणवृत्त्यापि विषयीकृतं तर्कयामि । मनोराज्यं सङ्कल्पविकल्पपरं चञ्चलवृत्तिरूपम्, बुद्धिस्तु निश्चयात्मिका स्थिरा चेति विरुद्धमित्यर्थः । ननु तर्हि मनोराज्यत्वमेवास्त्वितरदेवारोपितं तत्राह किं कारणमिति । मनोराज्यत्वाभाव इति शेषः । उत्तरं तस्य हि मनोराज्यभूतार्थस्य नास्ति रूपमनुभवार्हं रूपं नास्तीति हि प्रसिद्धम् । प्रकृते तु दृश्यं रूपमस्तीत्याह सुव्यक्तेति । यो मां वदति सुव्यक्तरूपो दृश्यते सुव्यक्तरूपं च वदति यत इत्यर्थः । मनोराज्यार्थो दृष्टनष्टो बाह्येन्द्रियजस्थिरानुभवानर्हः । अतो वास्तव एवायमिति भावः\nमन्दमन्दस्वरा । अस्य दैवगत्या वास्तवत्वे राक्षस्यो मा जानन्त्वित्यतिमन्दस्वररोदनम् । विनीतवद्विनीततयोपस्थितम् । स्वप्नः जाग्रत्कल्पः स्वप्न इत्यर्थः", "bhusana": "सा तं दृष्ट्वा हरिश्रेष्ठं विनीतबदुपस्थितम् ।\n\nमैथिली चिन्तयामास स्वप्नो ऽयमिति भामिनी", "siromani": "रुरोदेति । मन्दत्वरा सती मन्दं मन्दं रुरोद अर्धं पृथक् । मन्दस्वरेत्यनेनेमं वानरं राक्षस्यो न जानन्त्वित्यभिप्रायः सूचितः । सेति । विनीतवदुपागतं हरिवरं दृष्ट्वा स्वप्नो ऽयमिति चिन्तयामास तर्कयामास । अर्धद्वयमेकान्वयि"}, "has_tier1": false, "notes": [{"id": "phase2:5.32.6:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mandamandasvarā", "note_ru": "По Тилаке и Широмани, Сита плачет нарочито тихо не от слабости, а из осторожности: она опасается, что громкий плач привлечёт внимание ракшаси, которые могут заметить незнакомую обезьяну рядом с ней. Подстрочник передаёт «тихо-тихо» как чисто описательную деталь, не раскрывая её как сознательную меру предосторожности.", "type": "Б", "source_commentary": ["tilaka", "siromani"], "why_proposed": "вскрывает мотивацию тихого плача Ситы как осознанную осторожность перед ракшаси, а не просто физическую слабость, как можно понять из подстрочника", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.32.7", "verse": "7", "sanskrit_iast": "sā vīkṣamāṇā pṛthubhugnavaktraṃ । śākhāmṛgendrasya yathoktakāram । dadarśa piṅgpravaraṃ mahārhaṃ । vātātmajaṃ buddhimatāṃ variṣṭham ॥7॥", "leonov_ru": "Глядела она на широкое и искривленное лицо Послушного слуги владыки обезьян, Увидела лучшего из обезьян, наделенного великими достоинствами, Сына Ветра, лучшего из мудрецов.", "commentary": {"tilaka": "स्वप्नत्वचिन्तापूर्वकमेव पुनर्दर्शनमुपन्यस्यति सेति । किमिदं वाक्यं राक्षस्यः श्रुतवत्य इति परितो वीक्षमाणा सा पृथुभग्नं वज्रप्रहाराद्वक्त्रं यस्य तम् । शाखामृगेन्द्रस्य यथोक्तकारमाज्ञाकरम् । यद्वा यथोक्तवेष्टितार्जुनवस्त्राद्याकारम् छान्दसो ह्रस्वः पिङ्गप्रवरं कपिश्रेष्ठमिति निश्चयेन ददर्श", "bhusana": "सा वीक्षमाणा पृथुभुग्नवक्त्रं शाखामृगेन्द्रस्य यथोक्तकारम् ।\n\nददर्श पिङ्गधिपतेरमात्यं वातात्मजं बुद्धिमतां वरिष्ठम्\nसेति । वीक्षमाणा विचारयन्ती । ददर्श पुनरनुकूलो ऽयं स्यादिति ददर्शेत्यर्थः । भुग्नवक्त्रं वक्रमुखम् । यथोक्तकारम् आज्ञाकरम्", "siromani": "सेति । पृथु अधिकं भग्नं वज्रेण कृतव्रणं वक्रं यस्य तं मृगेन्द्रस्य सुग्रीवस्य यथोक्तकारम् अज्ञापितमात्रकारकं पिङ्गप्रवरं वानरश्रेष्ठं महार्हं वातात्मजं वीक्षमाणा सा सीता ददर्श केनोक्तमिति विचारयामास"}, "has_tier1": true, "notes": [{"id": "tier1:5.32.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Увидела широкую рассеченную морду (sā vīkṣamāṇā pṛthubhugnavaktraṃ) – в комментариях «Широмани» и «Тилака» отмечается, что на морде Ханумана был шрам от раны, нанесенной важрой Индры. В 35-й песне «Уттараканды» рассказывается о том, как Хануман сражался с Индрой, и тот ранил его в левую сторону челюстей."}, {"id": "edition:5.32.7:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.32.7 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.32.7", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.32.7", "iast": "sā vīkṣamāṇā pṛthubhugnavaktraṃ । śākhāmṛgendrasya yathoktakāram । dadarśa piṅgpravaraṃ mahārhaṃ । vātātmajaṃ buddhimatāṃ variṣṭham ॥7॥"}], "collision_tier1": true}]}, {"verse_id": "5.32.8", "verse": "8", "sanskrit_iast": "sā taṃ samīkṣyaiva bhṛśaṃ vipannā । gatāsukalpeva babhūva sītā । cireṇa saṃjñāṃ pratilabhya caivaṃ । vicintayām āsa viśālanetrā ॥8॥", "leonov_ru": "Она, глядя на него, потеряла сознание И стала подобной мертвой Сита. Спустя долгое время придя в себя, Так подумала широкоглазая:", "commentary": {"tilaka": "सा तं कपिरूपं रावणमित्येव समीक्ष्य भृशं विसञ्ज्ञा चित्तक्षोभाद्गतासुकल्पेव", "bhusana": "सा तं समीक्ष्यैव भृशं विसंज्ञा गतासुकल्पेव बभूव सीता ।\n\nचिरेण संज्ञा प्रतिलभ्य भूयो विचिन्तयामास विशालनेत्रा\nसा तमिति । विसंज्ञा मूर्च्छिता । गतासुकल्पा मृतप्राया । इवशब्दो वाक्यालङ्कारे । चिरेण संज्ञां प्रतिलभ्य कालेनैव प्रबोधकेन प्रबुद्धवतीत्यर्थः । विकृतवानरवेषदर्शनेन मूर्च्छिता पुनः कालेन प्रबुद्धेत्यर्थः", "siromani": "सेति । सा सीता तं हनूमन्तं समीक्ष्य रावणत्वेन वितर्क्य गतासुकल्पा गतप्राणसदृशी भृशमत्यन्तं विपन्ना चेष्टारहिता बभूव चिरेण किंचिद्विलम्बतः संज्ञां प्रतिलभ्य विचिन्तयामास"}, "has_tier1": false, "notes": [{"id": "phase2:5.32.8:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "gatāsukalpeva babhūva", "note_ru": "По Тилаке и Широмани, Сита теряет сознание не просто от вида странной обезьяны, а от конкретной мысли: она принимает Ханумана за Равану, вновь принявшего чужой облик — тот же испуг, что уже возникал у неё раньше при звуках чужой речи. Подстрочник объясняет обморок только самим фактом созерцания, не называя эту узнаваемую причину.", "type": "Б", "source_commentary": ["tilaka", "siromani"], "why_proposed": "называет конкретную причину обморока (отождествление с переменившим облик Раваной), которую подстрочник не раскрывает, и которая продолжает мотив страха Ситы перед обликом Раваны, отмеченный отдельно при 5.30.18", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.32.9", "verse": "9", "sanskrit_iast": "svapno mayāyaṃ vikṛto 'dya dṛṣṭaḥ । śākhāmṛgaḥ śāstragaṇair niṣiddhaḥ । svasty astu rāmāya salakṣmaṇāya । tathā pitur me janakasya rājñaḥ ॥9॥", "leonov_ru": "Привиделся мне сейчас ужасный сон. Обезьяна [увиденная во сне] согласно шастрам [означает] неблагополучие (досл. «обезьяна шастрами запрещена»). Да будут благополучны Рама с Лакшманой, А также мой отец, царь Джанака».", "commentary": {"bhusana": "स्वप्ने मया ऽयं विकृतो ऽद्य दृष्टः शाखामृगः शास्त्रगणैर्निषिद्धः ।\n\nस्वस्त्यस्तु रामाय सलक्ष्मणाय तथा पितुर्मे जनकस्य राज्ञः\nस्वप्ने इति । स्वप्ने वानरदर्शनं बन्धुविनाशकरमिति भावः", "siromani": "विचिन्ताकारमाह-- स्वप्न इत्यादिभिः । विकृतः चित्तविकारेणोत्पन्नः शास्त्रगणैर्वचनसमूहैर्निषिद्धः शाखामृगः शाखामृगदर्शनादिमयः अयं स्वप्नो मया दृष्टः । एतेन स्वप्नश्चेदयमनिष्टकारको भविष्यतीति सूचितम् । दुःस्वप्नजनितारिष्टनिवारणायाह रामादये स्वस्त्यस्तु"}, "has_tier1": true, "notes": [{"id": "tier1:5.32.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Обезьяна во сне предвещает недоброе (śākhāmṛgaḥ śāstragaṇair niṣiddhaḥ) – букв. «обезьяна [во сне] возбраняется собранием шастр». В следующих строках Сита произносит благословение (svasty astu), чтобы отвести от своих близких беду, которую предвещает увиденная во сне обезьяна.[Claude.AI — желательно] [термин] (учтено) Первое появление в кн. V; введено в Рамаяна I. 1. 15: Шастры (śāstra) — первоначально священные книги, излагающие религиозные установления индусов; позже (начиная с первых веков н. э."}, {"id": "lexical:5.32.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śākhāmṛga", "note_ru": "Ветвелаз / обезьяна (śākhāmṛga) — поэтическое обозначение обезьяны: śākhā-mṛga «ветвяной зверь» (букв. «зверь ветвей»).", "type": "А", "subtype": "base", "trigger": "term", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "collision_tier1": true}, {"id": "lexical:5.32.9:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śāstragaṇa", "note_ru": "Шастраганa (śāstra-gaṇa, m.) — «множество предписаний/традиций»: śāstra (от √śās- «наставлять, повелевать, предписывать») «наука, авторитетный текст» + gaṇa «группа, множество». В 32.9 svapno mayāyaṃ vikṛto dṛṣṭaḥ / śākhāmṛgaḥ śāstragaṇair niṣiddhaḥ — Сита ссылается на авторитет традиционных текстов, запрещающих видеть обезьян во сне. В онирокритике (svapnaśāstra) и пуранических списках сновидений обезьяна действительно входит в категорию неблагоприятных или нечистых образов. Это тонкий нарративный ход: та же логика, которую Сита использует для отрицания (это запрещённый сон), одновременно является аргументом против сна — запретный сон не должен быть столь ясным.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "MW:SAstra + индийская традиция svapnaśāstra", "collision_tier1": true}]}, {"verse_id": "5.32.11", "verse": "11", "sanskrit_iast": "rāmeti rāmeti sadaiva buddhyā । vicintya vācā bruvatī tameva । tasyānurūpāṃ ca kathāṃ tadartham । evaṃ prapaśyāmi tathā śṛṇōmi ॥11॥", "leonov_ru": "«Думая всегда «Рама, Рама» О нем только все мои речи, И речи [мои] следуют за ним. От этого Так я вижу, так слышу.", "commentary": {"tilaka": "एवं चिन्तयामासेत्यत्रैवंशब्दार्थः-- स्वप्न इत्यादि । दृश्यमानो ऽयं स्वप्नो मया विकृत एव दृष्टः । कुतस्तत्राह शाखामृग इत्यादि । एवं दुःस्वप्नं मत्वा स्वस्ति प्रार्थयते । जनकस्य तद्वंश्यस्य\nसदा रामेति विचिन्त्य वाचा तमेव ब्रुवन्त्यहं तस्य चिन्तनादेरनुरूपं यथा तथा शृणोमि । श्रूयमाणां च कथं तथा तेन प्रकारेण तदर्थामेव चिन्ताद्यनुरूपार्थामेव पश्यामि", "bhusana": "रामेति रामेति सदैव बुद्ध्या विचिन्त्य वाचा ब्रुवती तमेव ।\n\nतस्यानुरूपां च कथां तमर्तमेव प्रपश्यामि तथा श्रृणोमि\nरामेति । सदैव बुद्ध्या विचिन्त्य तमेव राममेव वाचा ब्रुवती । तस्यानुरूपां विचिन्तितस्याभिवदनस्यानुरूपां कथां तथा श्रृणोमि । तमर्थं कथार्थमेवं प्रपश्यामि । एवम् उक्तप्रकारेण जानामीत्यन्वयः । तदर्थामिति पाठे अयमर्थः । तस्यानुरूपां रामकीर्तनस्यानुरूपाम् । तदर्थां स रामो ऽर्थो ऽभिधेयो यस्याः ताम्", "siromani": "ननु एवं दुःखप्राप्तौ कथं तव जीवनमित्यत आह-- रामेतीति । तं राममेव बुद्ध्या विचिन्त्य संस्मृत्य सदैव रामेति रामेति ब्रुवती अहं तस्य रामस्य अनुरूपं योग्यं वस्तु प्रपश्यामि विचारयामि मनसा रामाय समर्पयामीत्यर्थः । तदर्थां रामबोधिकां कथां वचनं शृणोमि । एतेनेदमेव मम जीवनमिति सूचितम् । कथां शृणोमीत्यस्य नाप्रसिद्धिः त्रिजटया कदाचिदागतविभीषणानुचरीभिश्च रामकथायाः कथ्यमानत्वात्"}, "has_tier1": false, "notes": [{"id": "phase2:5.32.11:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tathā śṛṇomi", "note_ru": "Широмани поясняет, почему слова Ситы «я слышу [рассказы о нём]» — не пустая фраза: сказания о Раме ей в плену пересказывали Триджата и, по случаю, служанки из свиты Вибхишаны — то есть у героини действительно был источник этих рассказов. Подстрочник передаёт только сам факт «так слышу», не объясняя, откуда у пленницы вообще берутся вести о Раме.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "заземляет фразу Ситы «так слышу» конкретным нарративным источником (рассказы Триджаты и служанок Вибхишаны), отсутствующим и в подстрочнике, и в остальных примечаниях", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "edition:5.32.11:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.32.11 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.32.11", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.32.11", "iast": "rāmeti rāmeti sadaiva buddhyā । vicintya vācā bruvatī tameva । tasyānurūpāṃ ca kathāṃ tadartham । evaṃ prapaśyāmi tathā śṛṇōmi ॥11॥"}]}]}, {"verse_id": "5.32.13", "verse": "13", "sanskrit_iast": "manorathaḥ syād iti cintayāmi । tathāpi buddhyāpi vitarkayāmi । kiṃ kāraṇaṃ tasya hi nāsti rūpaṃ । suvyaktarūpaś ca vadaty ayaṃ mām ॥13॥", "leonov_ru": "Думаю я, что то [мое] желание Однако в мыслях сомневаюсь – В чем причина? Ведь нет у него (желания) формы, Оно же обладает явной формой и говорит со мной.", "commentary": {"bhusana": "मनोरथः स्यादिति चिन्तयामि तथापि बुद्ध्या च वितर्कयामि ।\n\nकिं कारणं तस्य हि नास्ति रूपं सुव्यक्तरूपश्च वदत्ययं माम्\nप्रथमम् इदं रामनामकथयितृदर्शनं मनोरथः अभिलाषमात्रमिति चिन्तयामि । तथापि तथा चिन्तायां सत्यामपि बुद्ध्या वितर्कयामि । मनोरथो न भवतीति विचारयामि । किं कारणमिति चेत् तस्य मनोरथस्य रूपं नास्ति । अयं वानरस्तु सुव्यक्तरूपश्च मां वदति च । तस्मान्मनोरथो न भवेदेवेत्यर्थः", "siromani": "ननु स्वाप्निकत्वाभावे ऽपि मनोरथो ऽयं भवेदित्यतो निराकुर्वती आह मनोरथ इति । अयं मनोरथः स्यात् इति चिन्तयामि तर्कयामि तथापि बुव्द्या निश्चयात्मकान्तःकरणवृत्त्या वितर्कयामि विचारेण निश्चिनोमि । तदाकारमाह तस्य मनोरथस्य रूपं चकारेण वचनाद्यपि नास्ति अयं वानरस्तु सुव्यक्तरूपः सन् मां वदति अतः किं किमपि कारणं मनोरथत्वे हेतुर्नास्ति\nननु तर्हि किमर्थं शोचसीत्यत आह-- अहमिति । तं राममेव विचिन्तयन्ती अहं मनोभवेन मनोनिष्ठभावनया तस्य रामस्य यद्यपि पश्यामि शृणोमि च तथापि तद्गतसर्वभावा तस्मिन् रामे गतः सन्निविष्टः सर्वः प्रत्यक्षादिना संपादितो भावो भावना यस्याः सा ऽहमद्य पीडितास्मि । एतेन प्रत्यक्षतो रामलाभमन्तरा दुःखनिवृत्तिर्न भविष्यतीति सूचितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.32.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…а незнакомца / Я различаю и слышу ясно (suvyaktarūpaś ca vadaty ayaṃ mām) – букв.: «Он имеет четкую форму и говорит со мной»."}]}, {"verse_id": "5.32.14", "verse": "14", "sanskrit_iast": "namo 'stu vācaspataye savajriṇe । svayambhuve caiva hutāśanāya । anena coktaṃ yad idaṃ mamāgrato । vanaukasā tac ca tathāstu nānyathā ॥14॥", "leonov_ru": "Хвала Вачаспати, Ваджродержцу (Индре) Самосущему (Брахме), Жертв пожирателю (Агни) Пусть будет правдой то, что передо мной Сказано этим лесным жителем, а не ложью (не чем-либо иным).", "commentary": {"siromani": "नम इति । अनेन वनौकसा ममाग्रतो ऽग्रं यदुक्तं तत्तथास्तु अन्यथा न भवेत् । एतदर्थमेव वाचस्पत्यादिभ्यो नमो ऽस्तु"}, "has_tier1": false, "notes": [{"id": "lexical:5.32.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vācaspati", "note_ru": "Вачаспати (vācas-pati, букв. «господин/владыка слова») — ведийское имя Брихаспати, жреца и наставника богов: vāc- (от√vac- «говорить», Whitney #245) + pati «господин». MW: vācaspati «lord of speech», N. of Bṛhaspati (RV.). Молитва Ситы (32.14) начинается именно с Вачаспати-Брихаспати, «вооружённого ваджрой» (savajriṇe) — нестандартная эпитетология: ваджра — оружие Индры, но Брихаспати как военный советник богов временами наделяется этим атрибутом. Выбор Вачаспати в молитве о достоверности услышанного слова логичен — he is the very lord of speech.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:vAcaspati"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"Костина",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

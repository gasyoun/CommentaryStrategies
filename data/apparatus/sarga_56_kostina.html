attachment, confidence'. Апте подчёркивает: praṇaya — «intimacy based on confidence», contrasted with kāma. В стихе: praṇeṣv api na viśvāso — «даже в поклонах (от вождей) я не доверяю»: Сита описывает фундаментальный кризис доверия — praṇaya как «то, что ведёт вперёд к близости» — сломан. Это более глубокий план, чем простое «недоверие»: разрушена онтологическая связь через доверие.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:praRaya+dic_apte:praRaya", "source_links": [{"label": "MW praRaya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=praRaya"}, {"label": "APTE praRaya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=praRaya"}], "seq": 6}, {"id": "edition:5.56.5:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.56.5–6 (2 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.56.5–6", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.56.5", "iast": "gate hi hariśardūla punaḥ samprāptaye tvayi । praṇeṣvāpi na viśvāso mama vānarapuṃgava ॥5॥"}, {"verse_id": "5.56.6", "iast": "adarśanaṃ ca te vīra bhūyo māṃ dārāyiṣyati । duḥkhād dyḥkhataraṃ prāptāṃ durmanaśśokakarśitām ॥6॥"}], "seq": 7}], "verse_not_segmented": true, "empty_reason": "Шлока есть в нумерации примечаний, но отсутствует в сегментированном корпусе (data/analysis/sundara_commentary_segmented.json), поэтому санскрит и подстрочник здесь не показаны. Примечание сохранено и голосуется; текст стиха нужно досегментировать."}, {"verse_id": "5.56.9", "verse": "9", "sanskrit_iast": "trayāṇāṃ eva bhūtānāṃ sāgarasyāpi laṅghane । śaktiḥ syād vainateyasya tava vā marutasya vā ॥9॥", "leonov_ru": "Из живых существ только трое способны Переправиться через океан – Вайнатейя (Гаруда), ты и бог ветра.", "commentary": {"bhusana": "एवमाश्वास्य वैदेहीं हनुमान् मारुतात्मजः ।\n\nगमनाय मतिं कृत्वा वैदेहीमभ्यवादयत्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "lexical:5.56.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vainateya", "note_ru": "Вайнатея (vainateya, m.) — «сын Винаты» = Гаруда, metronymic от Vinatā (мать Гаруды, жена Кашьяпы): vi+natā, «согнувшаяся вниз» (p.p.p. от √nam-). MW: vainateya 'son of Vinatā, Garuḍa or an eagle'. В стихе Сита называет лишь трёх существ, способных перелететь океан: Гаруду, Хануман и Ваю. Отождествление через матроним (а не собственное имя) — типичный эпический приём обозначения могущественных персонажей через генеалогию. Vainateya одновременно означает «орёл вообще» (as any bird of Vinatā's line), что подчёркивает надчеловеческую природу Гаруды.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:vEnateyA", "source_links": [{"label": "MW vEnateyA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=vEnateyA"}], "seq": 8}]}, {"verse_id": "5.56.11", "verse": 11, "sanskrit_iast": "", "leonov_ru": "", "commentary": {}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "crosstext:5.56.11:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "tathā abhivāday - eva", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.56.11–14,21", "work_label": "Rām", "verse_address": "Rām 5.37.13,27,29,30,46 (крит. изд.)", "parallel_sa_iast": "balaistu saṁkulāṁ kṛtvā laṅkāṁ parabalārdanaḥ |māṁ nayed yadi kākutsthastat tasya sadṛśaṁ bhavet ||", "sun नम् । तस्य काकुत्स्थस्य । सदृशम् । एतदेव ममाभिलषितम्, अन्यथा मे कथं वीरपत्नीत्वमिति भावः\nततः स कपिशार्दूलः स्वामिसन्दर्शनोत्सुकः ।\n\nआरुरोह गिरिश्रेष्ठमरिष्टमरिमर्दनः\nअरिष्टम् अरिष्टाख्यम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "phase2:5.56.12:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tasya tat sādṛśaṃ bhavet", "note_ru": "Бхушана поясняет мотив отказа Ситы от предложения Ханумана унести её: для неё важно само освобождение силой Рамы («иначе как я буду зваться женой героя?»), а не факт спасения как таковой.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "подстрочник передаёт лишь условное согласие («это было бы достойно его»), не раскрывая, что за этим стоит забота Ситы о собственном статусе супруги героя, а не только желание вырваться из плена", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 11}]}, {"verse_id": "5.56.14", "verse": "14", "sanskrit_iast": "tad arthopahitaṃ vākyaṃ praśritaṃ hetusaṃhitam । niśamya hanumān vīro vākyam uttaram abravīt ॥14॥", "leonov_ru": "Тогда, слова, исполненные смысла, скромные и разумные Услышав, Хануман в ответ сказал последние слова:", "commentary": {"bhusana": "स तदा पीडितस्तेन कपिना पर्वतोत्तमः ।\n\nररास सह तैर्भूतैः प्रविशन् वसुधातलम् ।\n\nकम्पमानैश्च शिखरैः पतद्भिरपि च द्रुमैः\nतैर्भूतैः तत्रत्यजन्तुभिः", "tilaka": "कल्लोलैरास्फाल्यते स्पृश्यते तादृशो वेलान्तस्तीरप्रान्तो यस्य तं सागरं लिलङ्घयिषुर्नभ उत्पपातेति संबन्धः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "tier1:5.56.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабоч accounted": "не учтено", "text": "Первое появление в кн. V; введено в Рамаяна I. 14. 51: Коти (koṭi) — десять миллионов.", "incomplete": false}], "seq": 14}]}, {"verse_id": "5.56.20", "verse": "20", "sanskrit_iast": "nihate rākṣasendre ca saputrāmatyabandhave । tvaṃ sameṣyasi rāmeṇa śaśaṅkeneva rohiṇī ॥20॥", "leonov_ru": "Когда будет убит владыка ракшасов с сыновьями, советниками и близкими, Ты соединишься с Рамой, как Рохини – с месяцем.", "commentary": {"bhusana": "व्याघ्रसङ्घसमाकीर्णं स्वादुमूलकफलद्रुमम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "lexical:5.56.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "rohiṇī", "note_ru": "Рохини (rohiṇī, f.) — «красно-рыжая», от √ruh- («подниматься, расти», Whitney #765) с суффиксом цвета -iṇī: «восходящая, рдеющая». Rohiṇī — любимая жена Луны (Candra), соответствующая созвездию Альдебаран (α Tauri). MW: rohiṇī 'the favorite wife of the moon'. Сравнение Ситы с Рохини, воссоединившейся с Месяцем (śaśāṅkena) — точная астрономическая метафора: Луна движется по эклиптике и «возвращается» к каждому наксхатре; Рохини — наксхатра, в которой Луна «останавливается» дольше всего. Воссоединение = небесный порядок, восстановленный после разлуки.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:rohiRI", "source_links": [{"label": "MW rohiRI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=rohiRI"}], "seq": 15}]}, {"verse_id": "5.56.23", "verse": "23", "sanskrit_iast": "rākṣasān pravarān hatvā nāma viśrāvya cātmanaḥ । samāśvāsya ca vaidehiṃ darśayitvā paraṃ balam ॥23॥", "leonov_ru": "Убив лучших ракшасов и прославив свое имя, Ободрив Вайдехи, показав выдающуюся силу,", "commentary": {"tilaka": "तदेव दर्शयति-- दशेति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "edition:5.56.23:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.56.23–24 (2 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.56.23–24", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.56.23", "iast": "rākṣasān pravarān hatvā nāma viśrāvya cātmanaḥ । samāśvāsya ca vaidehiṃ darśayitvā paraṃ balam ॥23॥"}, {"verse_id": "5.56.24", "iast": "nagarīm ākulāṃ kṛtvā vañcaitvā ca rāvaṇam । darśaitvā balaṃ ghoraṃ vaidehīm abhivādya ca ॥24॥"}], "seq": 16}]}, {"verse_id": "5.56.26", "verse": "26", "sanskrit_iast": "āruroha giriśreṣṭham ariṣṭam arimardanaḥ । tuṅgapadmakajuṣṭābhir nīlābhir vanarājibhiḥ ॥26॥", "leonov_ru": "Поднялся на Аришту, лучшую из гор, губитель врагов, Поросшую темными лесами, изобилующими высокими деревьями падмака,", "commentary": {"tilaka": "अरिष्टं तदाख्यम् । नीलाभिर्वनराजिभिः सपरिधानमिवेति शेषः", "siromani": "गिरिमेव वर्णयन्नाह तुङ्गेत्यादिभिः । तुङ्गाः उन्नताः ये पद्मकाः तैर्जुष्टाभिः वनराजिभिः शृङ्गान्तरविलम्बिभिः", "bhusana": "तुङ्गपद्मकजुष्टाभिर्नीलाभिर्वनराजिभिः ।\n\nसोत्तरीयमिवाम्भोदैः श्रृङ्गान्तरविलम्बिभिः\nअथैनं गिरिं चतुर्दशधोत्प्रेक्षते-- तुङ्गेत्यादिना । पद्मकाः पद्मवर्णवृक्षाः । परिधानालेख्यस्थानीयतया विशेषणमिति बोध्यम् । सपरिधानमिव, स्थितमिति शेषः । उत्तरार्धे सोत्तरीयत्वोत्प्रेक्षणात्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "tier1:5.56.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "На прекрасную гору Аришта (giriśreṣṭham ariṣṭam) - букв. “на Аришту, лучшую из гор”. Аришта - вероятно, одна из вершин Трикуты.", "service": [], "suggestions": [], "seq": 17}, {"id": "lexical:5.56.26:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ariṣṭa", "note_ru": "Аришта (ariṣṭa, adj./n.) — «невредимый; вещун; дерево neem», от a- (отриц.) + √riṣ- («вредить»). MW: ariṣṭa 'unhurt; a raven or crow (as a bird of ill omen); the nim-tree'. Название горы Ariṣṭa («не знающий вреда, нетронутый») — апотропеическая семантика: гора, неуязвимая для любого вреда. Одновременно ariṣṭa — «предзнаменование» (особенно дурное, от вороны) и дерево neem (Azadirachta indica), которое считалось священным оберегом. Три значения накладываются: гора одновременно «неуязвимая», «пророческая» (место отправки Ханумана) и «священная».", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:arizwa+dic_apte:arizwa", "source_links": [{"label": "MW arizwa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=arizwa"}, {"label": "APTE arizwa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=arizwa"}], "collision_tier1": true, "seq": 18}, {"id": "crosstext:5.56.26:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "hanumant mad vā", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.56.26–27", "work_label": "Rām", "verse_address": "Rām 5.1.141 (крит. изд.)", "parallel_sa_iast": "atha vā maithilīṁ dṛṣṭvā rāmaṁ cākliṣṭakāriṇam |āgamiṣyāmi te vaktraṁ satyaṁ pratiśṛṇomi te ||", "sundara_sa_iast": "atha maithilīṁ dṛṣṭvā rāmaṁ cākliṣṭakāriṇam |āgamiṣyāmi te vaktraṁ satyaṁ pratiśṛṇoti me ||", "quality": "PARTLY", "source": "DCS parallel-search (PARTLY); Rām 5.1.141 (крит. изд.)", "source_links": [], "edition_flag": "critical", "shloka_critical": "V.56.26–27", "verse_address_vulgate": "Rām V.1.155 (вульгата)", "collision_tier1": true, "seq": 19}]}, {"verse_id": "5.56.27", "verse": "27", "sanskrit_iast": "sottarīyam ivāmbhodaiḥ śṛṅgāntaravilambibhiḥ । bodhyamānam iva prītyā divākarakair śubhaiḥ ॥27॥", "leonov_ru": "С облаками, которые, подобно верхней одежде, висели между пиками, Словно бы пробуждаемую с радостью солнечными лучами,", "commentary": {"tilaka": "सोत्तरीयमिव कण्ठासक्तोत्तरीयधारिणमिव । बोध्यमानमिव रविकिरणस्पर्शेन सर्वेषां तत्रत्यवस्तूनां विकासादिति भावः", "siromani": "शृङ्गमध्ये स्थितैरम्भोदैर्मेघैः सोत्तरीयम् उत्तरीयधारिणमिव दिवाकरैर्बोध्यमानमिव", "bhusana": "बोध्यमानमिव प्रीत्या दिवाकरकरैः शुभैः ।\n\nउन्मिषन्तमिवोद्धूतैर्लोचनैरिव धातुभिः\nशुभैः तरुणैः । करैः अंशुभिः हस्तैश्च । बोध्यमानमिव स्थितम् । तत्र ज्ञापकमाह उद्धूतैरिति । उद्धूतैः उद्गतैः लोचनैरिव स्थितैः धातुभिः उन्मिषन्तं पश्यन्तमिव स्थितम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "tier1:5.56.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "27", "kind": "note", "text": "сверка"}], "suggestions": [], "seq": 20}, {"id": "lexical:5.56.27:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "uttarīya", "note_ru": "Уттарийя (uttarīya, n.) — «верхнее одеяние, накидка, шаль»: uttara «верхний, северный» + суфф. -īya (принадлежность). MW: uttarīya 'an upper garment'. В экфрасисе горы Ариштха пелена облаков вокруг вершин уподоблена uttarīyam iva — «как накидка (над морем)». Uttarīya — деталь дворянского костюма (см. Manusmṛti), брошенная небрежно на плечо; образ гор, «закутанных» в облака, проецирует на природу образ аристократического достоинства. Тонкий пример эпической упамы (upamā), работающей через материальную культуру.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:uttarIya", "source_links": [{"label": "MW uttarIya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=uttarIya"}], "collision_tier1": true, "seq": 21}, {"id": "edition:5.56.27:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.56.27–33 (7 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.56.27–33", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.56.27", "iast": "sottarīyam ivāmbhodaiḥ śṛṅgāntaravilambibhiḥ । bodhyamānam iva prītyā divākarakair śubhaiḥ ॥27॥"}, {"verse_id": "5.56.28", "iast": "unmiṣantam ivoddhūtair locanair iva dhātubhiḥ । toyaughaniḥsvanair mandraiḥ prādhītam iva parvatam ॥28॥"}, {"verse_id": "5.56.29", "iast": "pragītam iva vispaṣṭam nānāprasravaṇasvanaiḥ । devadārubhir uddhūtair ūrdhvabāhumiva sthitam ॥29॥"}, {"verse_id": "5.56.30", "iast": "prapātajalanirghoṣair prākṛuṣṭam iva sarvataḥ । vepamānam iva śyāmaiḥ kampamānaiḥ śaradvanaiḥ ॥30॥"}, {"verse_id": "5.56.31", "iast": "veṇubhir mārutoddhūtaiḥ kūjantam iva kīcakaiḥ । niḥśvasantam ivāmarṣād ghorair āśīviṣottamaiḥ ॥31॥"}, {"verse_id": "5.56.32", "iast": "nīhārakṛtagambhīrair dhyāyantam iva gahvaraiḥ । meghapādanibhaiḥ pādaiḥ prakrāntamiva sarvataḥ ॥32॥"}, {"verse_id": "5.56.33", "iast": "jṛmbhamāṇam ivākāśe śikharair abhrāmālibhiḥ । kūṭaiś ca bahudhā kīrṇaṃ śobhitam bahukandaraiḥ ॥33॥"}], "collision_tier1": true, "seq": 22}]}, {"verse_id": "5.56.29", "verse": "29", "sanskrit_iast": "pragītam iva vispaṣṭam nānāprasravaṇasvanaiḥ । devadārubhir uddhūtair ūrdhvabāhumiva sthitam ॥29॥", "leonov_ru": "Поющую голосами множества потоков (водопадов), С высящимися деодарами, словно стоящую с поднятыми вверх руками,", "commentary": {"tilaka": "उद्धूतैर्लोचनसदृशैर्धातुभिरुन्मिषन्तमिवेत्युत्प्रेक्षा । प्राधीतमिवोच्चैः प्रारब्धाध्ययनमिव तत्स्वनानां महत्त्वात्\nप्रगीतमिव प्रारब्धगानमिव तत्स्वनानां मन्दत्वात्", "siromani": "उद्धूतैरुद्गतैः पक्ष्मरहितैरित्यर्थः । लोचनैरिव धातुभिः उन्मिषन्तं विलोकयन्तमिव मन्दैः तोयौघनिः स्वनैः प्राधीतं प्रकृष्टाध्ययनविशिष्टमिव\nनानाप्रस्रवणस्वनैः निर्झरशब्दैः विस्पष्टं प्रगीतमिव उद्धूतैः उद्गतैः देवदारुभिः स्थितमूर्ध्वबाहुमिव", "bhusana": "देवदारुभिरत्युच्चैरूर्ध्वबाहुमिव स्थितम् ।\n\nप्रपातजलनिर्घोषैः प्राक्रृष्टमिव सर्वतः\nऊर्ध्वबाहुमिवेति तपोविशेष उच्यते । प्रपातजलनिर्घोषैः प्रपाताः भृगवः ।\n\n\"प्रपातस्त्वतटो भृगुः \" इत्यमरः । तेषां जलानि तेभ्यः पतन्तो निर्झरा इत्यर्थः । तेषां निर्घोषैः प्राक्रुष्टमिव आक्रोशन्तमिव । पूर्ववत् क्तः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "phase2:5.56.29:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "prāgītam iva ... prādhītam iva", "note_ru": "Тилака поясняет логику двойного сравнения: громкий шум водопадов уподоблен «громкому чтению вслух» (прадхита), а более тихие звуки — «пению» (прагита); гора описана как одновременно штудирующая Веды и поющая, в зависимости от силы звука.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "подстрочник передаёт оба сравнения («поющую», «читающую») как данность, не раскрывая, что комментатор различает их по громкости звука как основание для разных метафор", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 23}]}, {"verse_id": "5.56.31", "verse": "31", "sanskrit_iast": "veṇubhir mārutoddhūtaiḥ kūjantam iva kīcakaiḥ । niḥśvasantam ivāmarṣād ghorair āśīviṣottamaiḥ ॥31॥", "leonov_ru": "С бамбуками, колеблемыми ветром, словно бы чирикающую [голосами] кичак, Словно вздыхающую в нетерпении (в гневе) ужасными лучшими из ядовитых змей,", "commentary": {"bhusana": "निःश्वसन्तमिवामर्षाद्घोरैराशीविषोत्तमैः ।\n\nनीहारकृतगम्भीरैर्ध्यायन्तमिव गह्वरैः\nआशीविषोत्तमैः निश्वसन्तमिव सर्पश्रेष्ठनिश्वासैर्निश्वसन्तमिव । अमर्षात् हनुमति क्रोधादित्यर्थः । नीहारकृतगम्भीरैः नीहारपूर्णैः गम्भीरैश्च । गह्वरैः गुहाभिः ध्याननिरुद्धेन्द्रियस्थानीयैः ध्यायन्तमिव स्थितम् । निरुद्धेन्द्रियद्वारा ध्यानारूढमिव स्थितमित्यर्थः", "siromani": "मारुतोद्धूतैः वायुकम्पितैः अत एव कीचकैः सशब्दैर्वेणुभिः कूजन्तमिव आशीविषोत्तमैः निःश्वसन्तमिव"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "tier1:5.56.31:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Словно бы трель издающую / Бамбуками, ветром колеблемыми (veṇubhir mārutoddhūtaiḥ kūjantam iva kīcakaiḥ) - букв. “бамбуками-кичаками, взволнованными ветром, словно бы издающую трель”. Игра слов: veṇu означает и “бамбук”, и “флейта”. Кичака (kīcaka) - полый бамбук (Arundo Karka).", "service": [{"author": "Е. Костина", "lemma_iast": "гневно", "kind": "note", "text": "Бхушана поясняет, что гнев был вызван действиями Ханумана (ст. 15)"}], "suggestions": [], "seq": 24}, {"id": "lexical:5.56.31:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kīcaka", "note_ru": "Кичака (kīcaka, m.) — «полый бамбук, свисток», этимология: возможно от *kī- (звукоподражательный корень «свистеть»). MW: kīcaka 'a hollow bamboo; a musical pipe'. Апте: kīcaka «name of a hollow bamboo, in the hollows of which the wind causes a sound». В пассаже ветер играет на kīcaka как на флейте (mārutoddhūtaiḥ kūjantam iva kīcakaiḥ — «кричащий словно бамбуки, раздуваемые ветром»). Kīcaka — постоянный образ природной музыки в Махабхарате и Рамаяне; Кичака в МБх — персонаж, чья полость/пустота становится его судьбой.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:kIcaka+dic_apte:kIcaka", "source_links": [{"label": "MW kIcaka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=kIcaka"}, {"label": "APTE kIcaka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=kIcaka"}], "collision_tier1": true, "seq": 25}]}, {"verse_id": "5.56.32", "verse": "32", "sanskrit_iast": "nīhārakṛtagambhīrair dhyāyantam iva gahvaraiḥ । meghapādanibhaiḥ pādaiḥ prakrāntamiva sarvataḥ ॥32॥", "leonov_ru": "Словно бы предающуюся созерцанию глубокими пещерами, заполненными туманом, Словно бы собирающуюся двинуться в путь своими подножьями, подобными стопам облаков (низко опустившимся облакам),", "commentary": {"tilaka": "प्रपातजलनिर्घोषैः प्रपातेभ्यो भृगुदेशेभ्यः पतज्जलशब्दैः प्राक्रुष्टमिवारब्धाक्रोशमिव । सर्वत्रादिकर्मणि कर्तरि क्त इत्याहुः । शरद्वनैः सप्तपर्णादिशारदवृक्षसङ्घैः ।। 5.56.30,31 ।।\n\nनीहारकृतगम्भीरैः । नीहारवशेन तत्तद्दर्शनात्तत्कृतगम्भीरत्वं गह्वराणाम् । ध्यायन्तमिव मुद्रितेन्द्रियद्वारम् ध्यानारूढमिव स्थितमित्यर्थः । मेघपादा मेघप्ररोहास्तन्निभैः पादैः प्रत्यन्तपर्वतैः प्रक्रान्तमिवारब्धगमनमिव", "siromani": "नीहारेण कृतो गम्भीरः गाम्भीर्यं येषां तैः निश्चलैरित्यर्थः, गह्वरैः ध्यायन्तमिव मेघपादाः मेघप्ररोहाः तन्निभैः तत्सदृशैः पादैः प्रत्यन्तपर्वतैः सर्वतः प्रक्रान्तमिव"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "tier1:5.56.32:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Подножьями-облаками (meghapādanibhaiḥ pādaiḥ) - букв. “подножьями, подобными низко лежащим облакам”.", "service": [{"author": "Е. Костина", "lemma_iast": "Пещерами, туманом полными,", "kind": "note", "text": "Эти пещеры кажутся более глубокими из-за тумана"}, {"author": "Е. Костина", "lemma_iast": "Подножьями", "kind": "note", "text": "По Бхушане и Г-пр это находящиеся рядом горы"}], "suggestions": [], "seq": 26}]}, {"verse_id": "5.56.36", "verse": "36", "sanskrit_iast": "maharṣiyakṣagandharvakiṃnaroragasevitam । latāpādapasaṃbādhaṃ siṃhādhiṣṭhitakandaram ॥36॥", "leonov_ru": "Населенную великими риши, якшами, гандхарвами, киннарами и змеями, Заросшую лианами и деревьями, с пещерами, в которых обитали львы,", "commentary": {"bhusana": "महर्षियक्षगन्धर्वकिन्नरोरगसेवितम् ।\n\nलतापादपसङ्घातं सिंहाध्युषितकन्दरम्", "siromani": "महर्ष्यादिभिः सेवितं सिंहैरधिष्ठिता कन्दरा यस्य तम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "lexical:5.56.36:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kinnaroragagandharva", "note_ru": "Киннарорагагандхарва (kiṃnara-uraga-gandharva, cpd.) — стандартная триада полубожественных существ в горных пейзажах: kiṃnara «что-за-человек?» (буквально: kim + nara, «как бы человек» — существо с человеческим телом и конской головой или наоборот); uraga «ползущий по (своей) груди» = змей (ura «грудь» + ga «идущий»); gandharva «небесный музыкант» (этим. спорна; MW: gandharva «a celestial musician»). Все три существа обитают в горах согласно эпической космографии. Enumeration в данном стихе функционирует как топографический маркер: «здесь — переход в нечеловеческое пространство».", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:kiMnara+dic_mw:uraga+dic_mw:ganDarva", "source_links": [{"label": "MW kiMnara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=kiMnara"}, {"label": "MW uraga", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=uraga"}, {"label": "MW ganDarva", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ganDarva"}], "seq": 27}, {"id": "edition:5.56.36:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.56.36–37 (2 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.56.36–37", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.56.36", "iast": "maharṣiyakṣagandharvakiṃnaroragasevitam । latāpādapasaṃbādhaṃ siṃhādhiṣṭhitakandaram ॥36॥"}, {"verse_id": "5.56.37", "iast": "vyāghrādibhiḥ samākīrṇaṃ svādumūlaphaladrumam । ārurohānilasutaḥ parvataṃ plavagottamaḥ ॥37॥"}], "seq": 28}]}, {"verse_id": "5.56.39", "verse": "39", "sanskrit_iast": "saghoṣāḥ samaśīryanta śilāś cūrṇīkṛtās tataḥ । sa tam āruhya śailendraṃ vyavardhata mahākapiḥ ॥39॥", "leonov_ru": "С шумом крошились камни, распадаясь на куски. Та великая обезьяна, взобравшись на владыку гор, увеличилась в размерах.", "commentary": {"siromani": "धातुनिष्यन्दैर्धातुस्थिरताभिर्भूषितं शिलासंचयेन शिलानां समूहेन संकटं निबिडम्\nस्वादुमूलफलाः द्रुमाः यस्मिन् तं पर्वतं रामदर्शनाय शीघ्रं शीघ्रत्वं यस्मिन् तेन प्रहर्षेण अभिचोदितः प्लवगोत्तमो हनूमान् आरुरोह । त्रयोदशानामेकत्रान्वयः", "bhusana": "स तमारुह्य शैलेन्द्रं व्यवर्धत व्यवर्धत महाकपिः ।\n\nदक्षिणादुत्तरं पारं प्रार्थयन् लवणाम्भसः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "phase2:5.56.39:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "trayodaśānām ekatra anvayaḥ", "note_ru": "Широмани отмечает, что тринадцать полустиший (описание горы Ариштха, начиная от «увенчанной пиками») составляют единую синтаксическую конструкцию — отсюда нанизывание эпитетов через весь фрагмент воспринимается как одно длинное перечисление, а не серия отдельных фраз.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "подстрочник дробит длинное описание горы на отдельные предложения по строфам; сиромани поясняет, что в оригинале это единая синтаксическая цепь из тринадцати полустиший", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 29}]}, {"verse_id": "5.56.42", "verse": "42", "sanskrit_iast": "prapede hariśārdūlo dakṣiṇād uttarāṃ diśam । sa tadā pīḍitas tena kapinā parvatottamaḥ ॥42॥", "leonov_ru": "Взлетел, тигр среди обезьян, с юга в северную сторону. Тогда лучшая из гор, на которую надавила та обезьяна,", "commentary": {"tilaka": "स हनुमान्मारुत आकाशमिवोत्तरां दिशं प्रपेदे मनसा प्राप ।। 5.56.41,42 ।।\n\nकम्पविशिष्टशिखरपतद्द्रुमोपलक्षितो वसुधां प्राविशदित्यन्वयः", "siromani": "स इति । स हनूमान् मारुत आकाशमिव दक्षिणात् उत्तरां दिशं प्रपेदे"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "tier1:5.56.42:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "pīḍitas", "kind": "note", "text": "\"под тяжестью Х, закричав, опустилась\" - складывается картинка, что он на ней стоит, а она его не выдерживает и падает (а он вроде как уже взвился)"}], "suggestions": [], "seq": 30}, {"id": "tier1:5.56.42:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Помчался в сторону севера (prapede... dakṣiṇād uttarāṃ diśam) - букв. “направился с юга в северную сторону”. Автор комментария “Тилака” объясняет слово prapede как “мысленно достиг” (manasā prāpa).", "service": [], "suggestions": [], "seq": 31}]}, {"verse_id": "5.56.43", "verse": "43", "sanskrit_iast": "rarāsa vividhair bhūtaiḥ prāviśad vasudhātalam । kampamānaiś ca śikharaiḥ patadbhir api ca drumaiḥ ॥43॥", "leonov_ru": "Завопила различными существами [на ней обитающими] и вошла в землю, С дрожащими вершинами и падающими деревьями.", "commentary": {"bhusana": "सवृक्षशिखरोदग्रः सवृक्षैः शिखरैः उदग्रः श्रेष्ठः ।। 5.56.32,33 ।।\n\nस लिलङ्घयिषुर्भीमं सलीलं लवणार्णवम् ।\n\nकल्लोलास्फालवेलान्तमुत्पपात नभो हरिः\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे षट्पञ्चाशः सर्गः ।। 5.56 ।।\n\nकल्लोलास्फालवेलान्तं तरङ्गैरास्फाल्यपानतीरोपान्तम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "edition:5.56.43:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.56.43 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.56.43", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.56.43", "iast": "rarāsa vividhair bhūtaiḥ prāviśad vasudhātalam । kampamānaiś ca śikharaiḥ patadbhir api ca drumaiḥ ॥43॥"}], "seq": 32}]}, {"verse_id": "5.56.44", "verse": "44", "sanskrit_iast": "tasyoruvegān mathitāḥ pādapāḥ puṣpaśālinaḥ । nipetur bhūtale bhagnāḥ śakrāyudhahatā iva ॥44॥", "leonov_ru": "От его (Ханумана) силы сотрясенные деревья, изобилующие цветами, Рухнули на землю, словно поваленные оружием Индры.", "commentary": {"bhusana": "तस्योरुवेगोन्मथिताः पादपाः पुष्पशालिनः ।\n\nनिपेतुर्भूतले रुग्णाः शक्रायुधहता इव\nरुग्णाः शीर्णा इति यावत् । शक्रायुधहताः वज्रहताः", "siromani": "स इति । कपिना पीडितः कम्पमानैर्भूतैर्मृगादिभिः शिखरैश्च पतद्भिर्द्रुमैश्च उपलक्षितः पर्वतोत्तमः ररास वसुधातलं प्राविशच्च । सार्धश्लोक एकान्वयी ।। 5.56.42,43 ।।\n\nतस्येति । तस्य हनूमतः उरुवेगेन उन्मथिताः प्रकम्पिताः अत एव भग्नाः पादपाः शक्रायुधहता इव भूतले निपेतुः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "tier1:5.56.44:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Как от перуна Индры (śakrāyudhahatā iva) - букв. “словно ударенные оружием Индры”. Композит śakrāyudha в комментарии “Тилака” объясняется как “ваджра”.", "service": [], "suggestions": [], "seq": 33}, {"id": "lexical:5.56.44:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śakrāyudha", "note_ru": "Шакраюдха (śakra-āyudha, n.) — «оружие Индры» = радуга: śakra «мощный» (эпитет Индры, от √śak-, «быть способным, мощным») + āyudha «оружие» (ā+√yudh-, «сражаться»). MW: śakrāyudha 'Indra's weapon, the rainbow'. Деревья, сломанные Хануманом, сравниваются с «поражёнными оружием Индры», т.е. ударом молнии/радуги. Śakrāyudha как «радуга» — образ, восходящий к РВ: Парджанья (дождевое облако) метает молнии-стрелы. Контекст показывает разрушительный аспект Ханумана: он буквально «разит как Индра».", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:SAkrAyuDa", "source_links": [{"label": "MW SAkrAyuDa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=SAkrAyuDa"}], "collision_tier1": true, "seq": 34}]}, {"verse_id": "5.56.47", "verse": "47", "sanskrit_iast": "atipramāṇā balino dīptajihvā mahāviṣāḥ । nipīḍitaśirogrīvā vyaveṣṭanta mahāhayaḥ ॥47॥", "leonov_ru": "Огромные (безмерные), могучие великие весьма ядовиты с пылающими языками С придавленными головами и шеями свернулись в кольцо великие змеи", "commentary": {"bhusana": "निपीडितशिरोग्रीवाः, शिथिलपतिताशिलातलैरिति शेषः ।। 5.56.30,31 ।।\n\nस च भूमिधरः श्रीमान् बलिना तेन पीडितः ।\n\nसवृक्षशिखरोदग्रः प्रविवेश रसातलम्\nअतिप्रमाणा बलिनो दीप्तजिह्वा महाविषाः ।\n\nनिपीडितशिरोग्रीवा व्यवेष्टन्त महाहयः", "tilaka": "व्यवेष्टन्त कुण्डलीकृतशरीरा अजायन्त । \"व्यचेष्टन्त\" इति पाठे पीडया लुठन्नित्यर्थः ।। 5.56.47,48 ।।\n\nसवृक्षशिखरैरुदग्र उन्नतो रसातलं प्रविवेश अंशेन भूसमशिखराग्रवृक्षो जात इत्यर्थः", "siromani": "अतिप्रमाणा इति । निपीडितं शिलासंघर्षादिना प्राप्तं बहुपीडं शिरोग्रीवं येषां ते अतिप्रमाणाः महाहयः महोरगाः व्यवेष्टन्त कुण्डलीकृतदेहा अभवन् । \"व्यचेष्टन्त\" इति  पाठे पीडया लुठन्नित्यर्थ इति भट्टाः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "lexical:5.56.47:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mahāhi", "note_ru": "Махахи (mahā-hi, m.) — «великий змей», в стихе nipīḍitaśirogrīvā vyaveṣṭanta mahāhayaḥ — «великие змеи, чьи головы и шеи придавлены, извивались». Примечательна форма mahāhayaḥ: если читать не mahā-hi (змей), а mahā-haya (великий конь) — «великие кони», то перед нами видение существ, прижатых к земле весом Ханумана. Критическое издание поддерживает mahāhi (змеи). MW: mahāhi 'a large serpent, a boa'. Данный вариант указывает на то, что гора населена великими змеями-нагами — тема нага-паддинга как знака священного статуса горы.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:mahAhi", "source_links": [{"label": "MW mahAhi", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=mahAhi"}], "seq": 35}, {"id": "phase2:5.56.47:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vyaveṣṭanta / vyaceṣṭanta", "note_ru": "Тилака и Широмани приводят вариант чтения «вьячештанта» вместо «вьявештанта»: вместо «свернулись кольцом» — «извивались от боли». Разные глаголы дают разный образ страдания змей под тяжестью горы.", "type": "Б", "source_commentary": ["tilaka", "siromani"], "why_proposed": "подстрочник даёт только один образ («свернулись в кольцо»); оба комментатора фиксируют альтернативное чтение, меняющее образ на «корчились от боли»", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 36}]}, {"verse_id": "5.56.50", "verse": "50", "sanskrit_iast": "daśayojanavistāras triṃśadyojanam ucchritaḥ । dharaṇyāṃ samatāṃ yātaḥ sa babhūva dharādharaḥ ॥50॥", "leonov_ru": "Протяженностью в десять йоджан, возвышавшаяся на тридцать йоджан, Сравнялась с землей та гора.", "commentary": {"bhusana": "दशयोजनविस्तारस्त्रिंशद्योजनमुच्छ्रितः ।\n\nधरण्यां समतां यातः स बभूव धराधरः", "siromani": "तदेव स्पष्टयति दशेति । दशयोजनानि विस्तारो यस्य स धराधरः धरण्याः समतां यातः प्राप्तो बभूव"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "lexical:5.56.50:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dharaṇīdhara", "note_ru": "Дхарани-дхара (dharaṇī-dhara, m.) — «держатель земли» = гора: dharaṇī «земля» (от √dhṛ-, «держать», с суфф. -aṇī; «то, что держит [всё]») + dhara «держащий» (от того же √dhṛ-). MW: dharaṇīdhara 'a mountain'. Тавтологическая этимология — «держатель-держателя» — указывает на устойчивость горы как опоры мироздания; ведийская концепция гор как «столпов земли» (пилонов, держащих небо и землю). В данном стихе гора, которую Хануман «придавил» (pīḍita), в итоге ушла под землю (dharaṇyāṃ samatāṃ yātaḥ) — разрушение самого «держателя».", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:DaraRIDara", "source_links": [{"label": "MW DaraRIDara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=DaraRIDara"}], "seq": 37}]}, {"verse_id": "5.56.51", "verse": "51", "sanskrit_iast": "sa lilaṅghayiṣur bhīmam salīlam lavaṇārṇavam । kallolāsphālavelāntam utpapāta nabho hariḥ ॥51॥", "leonov_ru": "Та обезьяна, желающая переправиться через грозные соленые воды океана, С берегами, в которые бились волны, взлетела в небо.", "commentary": {"siromani": "स इति । कल्लोलास्फालवेलान्तं तरङ्गैः स्फालिततीरोपान्तं भीमं लवणार्णवं सलीलं लीलापूर्वकं लिलङ्घयिषुः हरिः स हनूमान् नभः उत्पपात"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-56", "notes": [{"id": "lexical:5.56.51:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kallola", "note_ru": "Каллола (kallola, m.) — «волна, прибой», этимология неясна (возможно дравидийского происхождения или звукоподражательная: *kall- «шуметь, плескаться»). MW: kallola 'a large wave'. Апте: kallola «a wave, billow; sport, frolicking». В стихе kallolāsphālavelāntam — «до прибрежной черты, где хлещут волны» — перед прыжком Ханумана. Редкое слово (в отличие от стандартного taraṅga/ūrmi), выбранное, вероятно, ради звукового эффекта: kallola имитирует звук прибоя. Последнее слово в описании моря перед новым прыжком — мотив завершения / нового начала.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:kallola+dic_apte:kallola", "source_links": [{"label": "MW kallola", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=kallola"}, {"label": "APTE kallola", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=kallola"}], "seq": 38}, {"id": "edition:5.56.51:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.56.51 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.56.51", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"ve

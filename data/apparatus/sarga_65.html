igger": "etymology", "source": "dic_mw:puraskftya", "source_links": [{"label": "MW puraskftya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=puraskftya"}], "seq": 1}]}, {"verse_id": "5.65.3", "verse": "3", "sanskrit_iast": "rāvaṇāntaḥpure rodhaṃ rākṣasībhiś ca tarjanam । rāme samanurāgaṃ ca yathā ca niyamaḥ kṛtaḥ ॥3॥", "leonov_ru": "О том, как она плачет в покоях Раваны, о том, как угрожают ей ракшаси, И о ее любви к Раме, и о назначенном ей сроке.", "commentary": {"bhusana": "रावणान्तःपुरे रोधं राक्षसीभिश्च तर्जनम् ।\n\nरामे समनुरागं च यश्चायं समयः कृतः ।\n\nएतदाख्यान्ति ते सर्वे हरयो रामसन्निधौ"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "tier1:5.65.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Как плачет она у Раваны (rāvaṇāntaḥpure rodham) - букв. “в женских покоях (антахпуре) Раваны”.", "service": [], "suggestions": [], "seq": 2}, {"id": "lexical:5.65.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "antaḥpura", "note_ru": "Антахпу́ра (antaḥ-pura, n.) — «внутренний город / женская половина дворца», antaḥ («внутри») + pura («город, укреплённое место»). MW: antaḥpura 'the inner apartments of a palace, gynaeceum'. Термин обозначает строго охраняемую зону дворца, доступную только царю, доверенным евнухам и женщинам. В правовом смысле antaḥpura — пространство, где действуют особые нормы: вход без разрешения — тягчайшее преступление. Нахождение Ситы в antaḥpura Раваны — это прежде всего юридически и ритуально заряженная ситуация, не только физическое заключение.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:antaHpura", "source_links": [{"label": "MW игодно богам. Применительно к Сите akṣatā несёт двойное значение: физически неповреждённая И ритуально незапятнанная (pativratā-dharma сохранён). Это ключевое юридически-ритуальное слово: Рама слышит не просто «жива», а «нетронута» — что определяет всё дальнейшее.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:akzatA", "source_links": [{"label": "MW akzatA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=akzatA"}], "seq": 5}]}, {"verse_id": "5.65.5", "verse": "5", "sanskrit_iast": "kva sītā vartate devī kathaṃ ca mayi vartate । etan me sarvam ākhyāta vaidehīṃ prati vānarāḥ ॥5॥", "leonov_ru": "«Где находится Сита? Как относится ко мне царевна? Все это расскажите мне о Вайдехи, обезьяны».", "commentary": {"siromani": "वैदेहीमिति । अक्षताम् अहिंसितां वैदेहीं श्रुत्वा उत्तरं श्रेष्ठं वचनं रामो ऽब्रवीत् । अर्धं पृथक् । तद्वचनाकारमाह क्केति । सीता क्क वर्तते मयि कथं केन भावेन वर्त्तते वैदेहीं प्रति वैदेहीसंबन्धि एतत्सर्वं यूयमाख्यातं केन भावेन इत्युक्त्या द्रुतस्वकर्तृकरावणवधाभावजनितसीतामर्षविषयकसंभावना सूचिता । अर्धद्वयमेकान्वयि ।। 5.65.4,5 ।।\n\nरामस्येति । रामस्य वचनं श्रुत्वा हरयो वानराः सीतावृत्तान्तकोविदं हनूमन्तं चोदयन्ति वृत्तान्तकथनाय प्रैरयन्त", "bhusana": "क्व सीता वर्तते देवी कथं च मयि वर्तते ।\n\nएतन्मे सर्वमाख्यात वैदेहीं प्रति वानराः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "tier1:5.65.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Помнит ли меня Сита? (kathaṃ ca mayi vartate) - букв. “и как относится ко мне”. Автор комментария “Широмани” поясняет: “с каким чувством”?", "service": [], "suggestions": [], "seq": 6}, {"id": "phase2:5.65.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kathaṃ ca mayi vartate", "note_ru": "«Как относится ко мне» (kathaṃ ca mayi vartate) — по Широмани, за этим вопросом Рамы стоит не праздное любопытство, а скрытое опасение: не держит ли Сита на него обиду за то, что он до сих пор не убил Равану и не освободил её. Подстрочник передаёт лишь сам вопрос, не раскрывая тревогу, которая за ним стоит.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "Широмани вскрывает психологический подтекст вопроса Рамы — скрытую тревогу о возможной обиде Ситы — который не передаёт ни подстрочник, ни собственное примечание Леонова/Костиной (то отмечает лишь грамматический смысл фразы).", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 7}]}, {"verse_id": "5.65.6", "verse": "6", "sanskrit_iast": "rāmasya gaditaṃ śrutva harayo rāmasaṃnidhau । codayanti hanūmantaṃ sītāvṛttāntakovidam ॥6॥", "leonov_ru": "Услышав слова Рамы, обезьяны в присутствии Рамы Побудили [рассказать] Ханумана, знающего о том, как обстоят дела с Ситой.", "commentary": {"tilaka": "रामसंनिधौ । स्थिता इति शेषः ।। 5.65.4,5 ।।\n\nचोदयन्ति प्रेरयन्ति स्म", "bhusana": "रामस्य गदितं श्रुत्वा हरयो रामसन्निधौ ।\n\nचोदयन्ति हनूमन्तं सीतावृत्तान्तकोविदम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "lexical:5.65.6:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vṛttānta", "note_ru": "Врттанта (vṛttānta, m.) — «происшедшее, повествование о случившемся», vṛtta (p.p.p. от √vṛt-, «совершаться, происходить») + anta («конец, завершение»). MW: vṛttānta 'what has occurred, an account, report'. Технически: полный нарратив от начала до конца события. Hanuman назван sītā-vṛttānta-kovida — «знаток истории Ситы»: не просто очевидец, а specialist по полному нарративу. Kovida (√ku-/vid-, «знать») = expert witness, знаток по всему делу.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:vfttAnta", "source_links": [{"label": "MW vfttAnta", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=vfttAnta"}], "seq": 8}]}, {"verse_id": "5.65.8", "verse": "8", "sanskrit_iast": "uvāca vākyaṃ vākyajñaḥ sītāyā darśanaṃ yathā । taṃ maṇiṃ kāñcanaṃ divyaṃ dīpyamānaṃ svatejasā ॥8॥", "leonov_ru": "Рассказал, красноречивый, о том, как нашел он Ситу, И о той заколке, украшенной золотом, дивной, сияющей собственным светом.", "commentary": {"siromani": "तदेव भङ्ग्यन्तरेणाह तमिति । तं सीतया दत्तं मणिं रामाय दत्त्वा हनूमानब्रवीत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "tier1:5.65.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "заколке", "kind": "note", "text": "Не уверена, что это заколка. См. ранее"}], "suggestions": [], "seq": 9}, {"id": "lexical:5.65.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "maṇi", "note_ru": "Мани (maṇi, m.) — «самоцвет, драгоценный камень; амулет». MW: maṇi 'a jewel, gem, pearl'. Помимо физического значения maṇi имеет устойчивое значение апотропеического амулета (защитного талисмана). Украшение, которое Сита передаёт Хануману, — чудамани (cūḍāmaṇi), «венечный камень», подаренный отцом Джанакой. Это не просто ювелирное изделие — это родовой амулет, опознавательный знак и вещественное воплощение идентичности Ситы.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:maRi", "source_links": [{"label": "MW maRi", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=maRi"}], "collision_tier1": true, "seq": 10}]}, {"verse_id": "5.65.12", "verse": "12", "sanskrit_iast": "tvayi saṃnyasya jīvantī rāmā rāma manoratham । dṛṣṭā me rākṣasīmadhye tarjyamānā muhur muhuḥ ॥12॥", "leonov_ru": "Живет прекрасная, возложив на тебя надежду, Рама. (Жива она только надеждой на тебя) Увидел я ее среди ракшаси, которые то и дело ей угрожают.", "commentary": {"tilaka": "हे राम, रामा सा सीता त्वयि मनोरथं सम्यङ् न्यस्य त्वदतिरिक्तविषयमनोरथाभाववती भूत्वा जीवन्ती धृतप्राणा मया दृष्टा", "bhusana": "हे राम  रामा सीता त्वयि मनोरथं स्वाभिलाषम् संन्यस्य जीवन्ती, त्वदभिलाषेण धृतजीवितेत्यर्थः ।। 5.65.10,11 ।।\n\nदुःखमासाद्यते देवी तथा ऽदुःखोचिता सती\nदुःखमित्यर्धम् । आसाद्यते आसीदिति । आर्षो यत्", "siromani": "तदेव भङ्ग्यन्तरेणाह त्वयीति । राक्षसीमध्ये मुहुर्मुहुस्तर्ज्यमाना मनोरथं त्वयि संन्यस्य जीवन्ती रामा सीता मया दृष्टा"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "tier1:5.65.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Одной на тебя надеждой / Жизнь сохраняет прекрасная (tvayi saṃnyasya jīvantī rāmā rāma manoratham) - букв. “На тебя возложив желание, жива прекрасная, Рама”. В оригинале - звуковой повтор (rāmā rāma).", "service": [{"author": "Е. Костина", "lemma_iast": ",", "kind": "note", "text": "Если говорим про звуковой повтор, надо расписать подробнее значение слов, которые его создают, иначе читатель останется в недоумении"}], "suggestions": [], "seq": 11}, {"id": "lexical:5.65.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "manoratham", "note_ru": "Манорат (mano-ratha, m.) — «колесница ума», manas «ум» + ratha «колесница» = «желание». MW: manoratham 'wish, desire (as the car of the mind)'. Поэтическая метафора: желание мчится, как колесница — образ ведического происхождения, где ratha — первейшая метафора действия и движения. В сочетании saṃnyasya manoratham — «отложив колесницу ума» (т.е. личных желаний) — фраза несёт смысл дхармического само-отречения: Сита живёт ради Рамы, а не ради себя.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:manoraTa", "source_links": [{"label": "MW manoraTa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=manoraTa"}], "collision_tier1": true, "seq": 12}]}, {"verse_id": "5.65.13", "verse": "13", "sanskrit_iast": "rākṣasībhir virūpābhī rakṣitā pramadāvane । duḥkham āpadyate tvayā vīra suḥkhocitā ॥13॥", "leonov_ru": "Надежно стерегут ее уродливые ракшаси в роще рядом с женскими покоями. Страдает она, привыкшая к счастью с тобой, о отважный.", "commentary": {"siromani": "राक्षसीभिरिति । त्वया सुखोचिता अक्षता अहिंसिता सीता प्रमदावने राक्षसीभिः करणैर्दुःखमापद्यते प्राप्नोति"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "tier1:5.65.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "привыкшая", "kind": "note", "text": "или достойная счастья?"}], "suggestions": [], "seq": 13}]}, {"verse_id": "5.65.15", "verse": "15", "sanskrit_iast": "adhaḥśayyā vivarṇāṅgī padminīva himāgame । rāvaṇād vinivṛttārthā martavyakṛtaniścayā ॥15॥", "leonov_ru": "Спит она на земле, тело ее бледно словно лотосовый пруд после наступления холодов, Отвергла она Равану и потому обречена на смерть.", "commentary": {"bhusana": "अधःशय्या विवर्णाङ्गी पद्मिनीव हिमागमे ।\n\nरावणाद्विनिवृत्तार्था मर्तव्यकृतनिश्चया ।\n\nदेवी कथंचित् काकुत्स्थ त्वन्मना मार्गिता मया"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "lexical:5.65.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "adhaḥśayyā", "note_ru": "Адхашаяя (adhaḥ-śayyā, f.) — «лежание на земле / постель внизу», adhas «вниз, на земле» + śayyā «постель, лёжанка». MW: adhaśśayyā 'lying on the ground'. Спать на голой земле — аскетическое или траурное действие; ритуальное унижение для человека царского происхождения. Для Ситы это добровольный знак: она отвергает ложе в гинекее Раваны, предпочитая землю. Образ прямо противопоставлен роскоши раванова дворца — и связан с padminīva himāgame (следующее слово): лотос в зимний период тоже «ложится» под воду, сохраняя корень.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:aDaHSayyA", "source_links": [{"label": "MW aDaHSayyA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=aDaHSayyA"}], "seq": 14}, {"id": "lexical:5.65.15:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "padminī", "note_ru": "Падмини (padminī, f.) — «лотосный пруд, поле лотосов; лотосоносная». MW: padminī 'full of lotuses; a lotus plant or pond'. Образ padminīva himāgame — «как лотосный пруд при наступлении зимы» — один из классических śleṣa-образов: зимой лотос закрывается, теряет цвет, кажется мёртвым — но жив. Аналогия с Ситой строжайшая: она внешне истощена и поблёкла, но внутренне сохраняет жизненную силу (tejas). Этот же образ встречается в описании угасающей Кайкейи и страдающей Дамаянти (Нала).", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:padminI", "source_links": [{"label": "MW padminI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=padminI"}], "seq": 15}]}, {"verse_id": "5.65.18", "verse": "18", "sanskrit_iast": "rāmasugrīvasakhyaṃ ca śrutvā harṣam upāgatā । niyataḥ samudācāro bhaktiś cāsyāḥ sadā tvayi ॥18॥", "leonov_ru": "Обрадовалась она, услышав о дружбе Рамы и Сугривы. Неизменна ее добродетель и всегда она предана тебе.", "commentary": {"bhusana": "नियतः समुदाचारो भक्तिश्चास्यास्तथा त्वयि", "tilaka": "नियत इति । समुदाचारो गोत्रास्खलनादिव्यवहारो भक्तिश्च त्वय्येव सदा नियतः । नान्यत्रेत्यर्थः", "siromani": "रामेति । रामसुग्रीवसख्यं श्रुत्वा हर्षं प्रमोदमुपागता प्राप्ता । अर्धं पृथक् नियत इति । अस्याः मद्बुद्धिस्थायाः सीतायास्त्वयि भक्तिः परप्रीतिः तथा समुदाचारः तदनुकूलानुचरणं नियतः नियमेन वर्तमानो ऽस्तीति शेषः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "lexical:5.65.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bhakti", "note_ru": "Бхакти (bhakti, f.) — «причастность, доля; преданность», от √bhaj- («делить, принимать участие, почитать», Whitney #742). MW: bhakti 'distribution; devotion, loyalty'. Исходное значение √bhaj-: делить пищу между участниками трапезы — тот, кто получает свою долю (bhāga), тот и участвует. Bhakti = «делание себя частью», «причастность» — до позднего бхакти-движения, где слово получает теологическое значение «любовного богопочитания». Здесь niyataḥ samudācāro bhaktiś ca — «постоянно упорядоченное поведение и bhakti к тебе» — ещё в доклассическом значении верной преданности.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:Bakti+warnemyr(Baj)", "source_links": [{"label": "MW Bakti", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=Bakti"}], "seq": 16}, {"id": "edition:5.65.18:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.65.18 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.65.18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.65.18", "iast": "rāmasugrīvasakhyaṃ ca śrutvā harṣam upāgatā । niyataḥ samudācāro bhaktiś cāsyāḥ sadā tvayi ॥18॥"}], "seq": 17}]}, {"verse_id": "5.65.19", "verse": "19", "sanskrit_iast": "evaṃ mayā mahābhāga dṛṣṭā janakanandinī । ugreṇa tapasā yuktā tvadbhaktyā puruṣarṣabha ॥19॥", "leonov_ru": "Так мной, о наделенный великой долей, найдена дочь Джанаки. Совершает она суровое подвижничество с преданностью к тебе, о бык среди мужей.", "commentary": {"tilaka": "उग्रेण तपसा त्वद्भक्त्या च युक्ता ।। 5.65.19,20 ।।\n\nयथा दृष्टं राक्षसीतर्जनादि तद्विज्ञाप्येत्यन्वयः", "siromani": "एवमिति । उग्रेण तपसा त्वद्भक्त्या च युक्ता जनकनन्दिनी एवमुक्तप्रकारेण मया दृष्टा"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "lexical:5.65.19:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ugra", "note_ru": "Угра (ugra, adj.) — «жестокий, пламенный, мощный». MW: ugra 'mighty, powerful; harsh, cruel'. Ugra в сочетании с tapas = «неистовая аскеза» — tapas высшей степени интенсивности. Интересно применение ugra tapas к состоянию Ситы: она не совершает добровольной аскезы, но её страдание квалифицируется как ugra tapas — духовная практика вынужденного очищения. Эта квалификация Ханумана («вижу её стойкость как ugra tapas») морально возвышает Ситу и объясняет её неприкосновенность.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:ugra", "source_links": [{"label": "MW ugra", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ugra"}], "seq": 18}]}, {"verse_id": "5.65.20", "verse": "20", "sanskrit_iast": "abhijñānaṃ ca me dattaṃ yathāvṛttaṃ tavāntike । citrakūṭe mahāprājña vāyasaṃ prati rāghava ॥20॥", "leonov_ru": "Дала она мне тайный знак – рассказ о том, что произошло в твоем присутствии С вороном на горе Читракуте, о мудрый Рагхава.", "commentary": {"bhusana": "समुदाचारः परपुरुषाचिन्तकत्वादिः । त्वयि भक्तिश्च, वर्तत इति शेषः । तपसा अनशनेन ।। 5.65.17,18 ।।\n\nअभिज्ञानं च मे दत्तं यथा वृत्तं तवान्तिके ।\n\nचित्रकूटे महाप्राज्ञ वायसं प्रति राघव\nअभिज्ञानं चिह्नभूतं वाक्यम्, तवान्तिके पूर्वं यथा येन प्रकारेण जातं तथा दत्तमित्यर्थः । तदेव दर्शयति चित्रकूट इति, सदस्यवक्तव्यत्वात् सूचनोक्तिः", "siromani": "अभिज्ञानमिति । चित्रकूटे वायसं जयन्तं प्रति तवान्तिके यद्वृत्तं वृत्तान्तं तदभिज्ञानं मत्संवादचिह्नं मे मह्यं दत्तं कथितमित्यर्थः\nताविति । जाताश्वासौ प्राप्ताश्वासनौ राजपुत्रौ विदित्वा सर्वम् अभिज्ञानं प्रदाय देव्या सीतया आख्यातं संपूर्णं वायुपुत्रो वाचा शशंस"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "tier1:5.65.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Между тобой и ворономНа горе Читракуте.", "kind": "note", "text": "Нужна ссылка на соответствующий стих"}], "suggestions": [], "seq": 19}, {"id": "phase2:5.65.20:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vāyasa", "note_ru": "Ворон (vāyasa) на Читракуте — по Широмани, это конкретно ворон по имени Джаянта (vāyasaṃ jayantam), сын Индры, некогда клевавший Ситу и раненный Рамой божественным оружием. Подстрочник и собственное примечание Костиной (отметившей нехватку ссылки на этот эпизод) не называют ворона по имени.", "type": "В", "source_commentary": ["siromani"], "why_proposed": "Широмани называет ворона по имени (Джаянта), закрывая именно тот пробел, на который указала Костина в собственном примечании Леонова/Костиной («нужна ссылка на соответствующий стих»).", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 20}]}, {"verse_id": "5.65.25", "verse": "25", "sanskrit_iast": "jīvitaṃ dhārayiṣyāmi māsaṃ daśarathātmaja । ūrdhvaṃ māsān na jīveyaṃ rakṣasāṃ vaśam āgatā ॥25॥", "leonov_ru": "Жить мне осталось [только] месяц, о сын Дашаратхи. После того, как истечет этот месяц, умру я, попавшая во власть ракшасов».", "commentary": {"bhusana": "इति मामब्रवीत्सीता कृशाङ्गी धर्मचारिणी ।\n\nरावणान्तःपुरे रुद्धा मृगीवोत्फुल्ललोचना\nमृगीवोत्फुल्ललोचना, त्रासातिशयादिति भावः", "siromani": "जीवितमिति । मासादूर्ध्वं न जीवेयम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "phase2:5.65.25:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mṛgīvotphullalocanā", "note_ru": "«Подобно олене с широко раскрытыми глазами» (mṛgīvotphullalocanā) — по Бхушане, сравнение указывает не на красоту, а на испуг (trāsātiśayāt): расширенные глаза Ситы — не портретная деталь, а знак предельного ужаса, как у пойманной лани. Подстрочник передаёт образ буквально, не поясняя, что за ним стоит именно страх, а не красота.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "Бхушана уточняет функцию сравнения с ланью как знака ужаса, а не красоты — смысловой сдвиг, отсутствующий в подстрочнике и не отмеченный ни у Леонова/Костиной, ни в Phase-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 21}]}, {"verse_id": "5.65.28", "verse": "28", "sanskrit_iast": "tau jātāśvāsau rājaputrau viditvā । tac cābhijñānaṃ rāghavāya pradāya । devyā cākhyātaṃ sarvam evānupūrvyād । vācā sampūrṇaṃ vāyuputraḥ śaśaṃsa ॥28॥", "leonov_ru": "Поняв, что оба царевича ободрились, Тот тайный знак отдав Рагхаве Все сказанное царевной по порядку Полностью рассказал сын ветра (Хануман).", "commentary": {"bhusana": "तौ जाताश्वासौ राजपुत्रौ विदित्वा तच्चाभिज्ञानं राघवाय प्रदाय ।\n\nदेव्या चाख्यातं सर्वमेवानुपूर्व्याद्वाचा सम्पूर्णं वायुपुत्रः शशंस\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे पञ्चषष्टितमः सर्गः ।। 5.65 ।।\n\nताविति । पूर्ववद्वैश्वदेवीवृत्तम् । समुद्रतरणे सुरसानिरसनादिकम् अक्षवधलङ्कादहनादिकं सजातीयेभ्यः पूर्वमुक्तमपि प्रभुसन्निधावात्मश्लाघायां पर्यवस्येदिति नोक्तमिति ध्योयम् । स्ववृत्तान्तं सर्वमाख्यातवानिति सामान्येन वक्तुं युक्तत्वे ऽप्यङ्गदसन्निधौ प्रपञ्चनं गोप्यविशेषगोपनार्थम् । अत्र त्वप्रपञ्चनम् अकथनीयाकथनार्थं चेति ज्ञेयम् । अस्मिन्सर्गे सार्धसप्तविंशतिश्लोकाः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-65", "notes": [{"id": "phase2:5.65.28:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "anupūrvyāt", "note_ru": "«По порядку, полностью» (anupūrvyād... sampūrṇam) — по Бхушане, здесь Хануман впервые рассказывает всё без утайки, тогда как перед Ангадой и отрядом он ранее пересказывал те же события в сокращении, опуская то, что не подобает разглашать при всех (gopyaviśeṣagopanārtham). Подстрочник этой разницы в полноте двух рассказов Ханумана не отмечает.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "Бхушана поясняет нарративную экономию эпоса: сокращённый рассказ Ханумана перед отрядом и полный — перед Рамой суть сознательный выбор сказителя, а не случайность; наблюдение отсутствует в подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 22}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_C

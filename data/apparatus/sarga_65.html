<script>
const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 65, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 32, "verses_with_notes": 14, "notes_by_layer": {"tier1": 6, "lexical": 11, "phase2": 4, "edition": 1, "crosstext": 0}}, "sarga": 65, "verses": [{"verse_id": "5.65.2", "verse": "2", "sanskrit_iast": "yuvarājaṃ puraskṛtya sugrīvam abhivādya ca । pravṛttam atha sītāyāḥ pravaktum upacakramuḥ ॥2॥", "leonov_ru": "Во главе с наследным царевичем (Ангадой) поприветствовав почтительно Сугриву, Стали они рассказывать о том, что произошло с Ситой,", "commentary": {"bhusana": "युवराजं पुरस्कृत्य सुग्रीवमभिवाद्य च ।\n\nप्रवृत्तिमथ सीतायाः प्रवक्तुमुपचक्रमुः\nप्रवृत्तिं वार्ताभ्"}, "has_tier1": false, "notes": [{"id": "lexical:5.65.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "puraskṛtya", "note_ru": "Пуракртья (puras-kṛtya, abs.) — «выдвинув вперёд, поставив во главе», puras («перед, впереди») + kṛtya (abs. от √kṛ-). MW: puraskṛta 'placed in front; honoured'. Puraskāra / puraskṛ — протокольный глагол церемониального старшинства: поставить кого-то впереди значит признать его приоритет. Вандары идут к Раме, поставив впереди Ангаду-юварадже: жест политической осторожности — дать первому слово тому, кто имеет на него ритуальное право.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:puraskftya"}]}, {"verse_id": "5.65.3", "verse": "3", "sanskrit_iast": "rāvaṇāntaḥpure rodhaṃ rākṣasībhiś ca tarjanam । rāme samanurāgaṃ ca yathā ca niyamaḥ kṛtaḥ ॥3॥", "leonov_ru": "О том, как она плачет в покоях Раваны, о том, как угрожают ей ракшаси, И о ее любви к Раме, и о назначенном ей сроке.", "commentary": {"bhusana": "रावणान्तःपुरे रोधं राक्षसीभिश्च तर्जनम् ।\n\nरामे समनुरागं च यश्चायं समयः कृतः ।\n\nएतदाख्यान्ति ते सर्वे हरयो रामसन्निधौ"}, "has_tier1": true, "notes": [{"id": "tier1:5.65.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Как плачет она у Раваны (rāvaṇāntaḥpure rodham) - букв. “в женских покоях (антахпуре) Раваны”."}, {"id": "lexical:5.65.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "antaḥpura", "note_ru": "Антахпу́ра (antaḥ-pura, n.) — «внутренний город / женская половина дворца», antaḥ («внутри») + pura («город, укреплённое место»). MW: antaḥpura 'the inner apartments of a palace, gynaeceum'. Термин обозначает строго охраняемую зону дворца, доступную только царю, доверенным евнухам и женщинам. В правовом смысле antaḥpura — пространство, где действуют особые нормы: вход без разрешения — тягчайшее преступление. Нахождение Ситы в antaḥpura Раваны — это прежде всего юридически и ритуально заряженная ситуация, не только физическое заключение.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:antaHpura", "collision_tier1": true}, {"id": "lexical:5.65.3:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tarjana", "note_ru": "Тарджана (tarjana, n.) — «угроза, устрашение», от √tarj- («угрожать, грозить пальцем»). MW: tarjana 'threatening, menacing'. Глагол √tarj- описывает именно вербально-жестовую угрозу — звуком и жестом — в отличие от прямого физического воздействия. Ракшасини угрожают Сите тарджаной — регулярной, систематической. В арсенале давления на пленника тарджана есть отдельная техника: сломать дух, не трогая тела. Ханман описывает это Раме как систематическое психологическое насилие.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:tarjana", "collision_tier1": true}]}, {"verse_id": "5.65.4", "verse": "4", "sanskrit_iast": "etad ākhyāya te sarvaṃ harayo rāmasaṃnidhau । vaidehīm akṣatāṃ śrutvā rāmas tūttaram abravīt ॥4॥", "leonov_ru": "Все это рассказали обезьяны в присутствии Рамы. Услышав, что Вайдехи невредима, Рама в ответ сказал:", "commentary": {"bhusana": "वैदेहीमक्षतां श्रुत्वा रामस्तूत्तरमब्रवीत्"}, "has_tier1": false, "notes": [{"id": "lexical:5.65.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "akṣatā", "note_ru": "Акшата (a-kṣatā, f.) — «неповреждённая, нетронутая», a- + kṣata (p.p.p. от √kṣan- «ранить, повреждать»). MW: akṣata 'uninjured, unhurt'. В ритуальном словаре akṣata (n.pl.) = целые, неповреждённые зёрна риса, используемые в жертвоприношении — только нетронутое пригодно богам. Применительно к Сите akṣatā несёт двойное значение: физически неповреждённая И ритуально незапятнанная (pativratā-dharma сохранён). Это ключевое юридически-ритуальное слово: Рама слышит не просто «жива», а «нетронута» — что определяет всё дальнейшее.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:akzatA"}]}, {"verse_id": "5.65.5", "verse": "5", "sanskrit_iast": "kva sītā vartate devī kathaṃ ca mayi vartate । etan me sarvam ākhyāta vaidehīṃ prati vānarāḥ ॥5॥", "leonov_ru": "«Где находится Сита? Как относится ко мне царевна? Все это расскажите мне о Вайдехи, обезьяны».", "commentary": {"siromani": "वैदेहीमिति । अक्षताम् अहिंसितां वैदेहीं श्रुत्वा उत्तरं श्रेष्ठं वचनं रामो ऽब्रवीत् । अर्धं पृथक् । तद्वचनाकारमाह क्केति । सीता क्क वर्तते मयि कथं केन भावेन वर्त्तते वैदेहीं प्रति वैदेहीसंबन्धि एतत्सर्वं यूयमाख्यातं केन भावेन इत्युक्त्या द्रुतस्वकर्तृकरावणवधाभावजनितसीतामर्षविषयकसंभावना सूचिता । अर्धद्वयमेकान्वयि ।। 5.65.4,5 ।।\n\nरामस्येति । रामस्य वचनं श्रुत्वा हरयो वानराः सीतावृत्तान्तकोविदं हनूमन्तं चोदयन्ति वृत्तान्तकथनाय प्रैरयन्त", "bhusana": "क्व सीता वर्तते देवी कथं च मयि वर्तते ।\n\nएतन्मे सर्वमाख्यात वैदेहीं प्रति वानराः"}, "has_tier1": true, "notes": [{"id": "tier1:5.65.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Помнит ли меня Сита? (kathaṃ ca mayi vartate) - букв. “и как относится ко мне”. Автор комментария “Широмани” поясняет: “с каким чувством”?"}, {"id": "phase2:5.65.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kathaṃ ca mayi vartate", "note_ru": "«Как относится ко мне» (kathaṃ ca mayi vartate) — по Широмани, за этим вопросом Рамы стоит не праздное любопытство, а скрытое опасение: не держит ли Сита на него обиду за то, что он до сих пор не убил Равану и не освободил её. Подстрочник передаёт лишь сам вопрос, не раскрывая тревогу, которая за ним стоит.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "Широмани вскрывает психологический подтекст вопроса Рамы — скрытую тревогу о возможной обиде Ситы — который не передаёт ни подстрочник, ни собственное примечание Леонова/Костиной (то отмечает лишь грамматический смысл фразы).", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.65.6", "verse": "6", "sanskrit_iast": "rāmasya gaditaṃ śrutva harayo rāmasaṃnidhau । codayanti hanūmantaṃ sītāvṛttāntakovidam ॥6॥", "leonov_ru": "Услышав слова Рамы, обезьяны в присутствии Рамы Побудили [рассказать] Ханумана, знающего о том, как обстоят дела с Ситой.", "commentary": {"tilaka": "रामसंनिधौ । स्थिता इति शेषः ।। 5.65.4,5 ।।\n\nचोदयन्ति प्रेरयन्ति स्म", "bhusana": "रामस्य गदितं श्रुत्वा हरयो रामसन्निधौ ।\n\nचोदयन्ति हनूमन्तं सीतावृत्तान्तकोविदम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.65.6:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vṛttānta", "note_ru": "Врттанта (vṛttānta, m.) — «происшедшее, повествование о случившемся», vṛtta (p.p.p. от √vṛt-, «совершаться, происходить») + anta («конец, завершение»). MW: vṛttānta 'what has occurred, an account, report'. Технически: полный нарратив от начала до конца события. Ханuman назван sītā-vṛttānta-kovida — «знаток истории Ситы»: не просто очевидец, а specialist по полному нарративу. Kovida (√ku-/vid-, «знать») = expert witness, знаток по всему делу.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:vfttAnta"}]}, {"verse_id": "5.65.8", "verse": "8", "sanskrit_iast": "uvāca vākyaṃ vākyajñaḥ sītāyā darśanaṃ yathā । taṃ maṇiṃ kāñcanaṃ divyaṃ dīpyamānaṃ svatejasā ॥8॥", "leonov_ru": "Рассказал, красноречивый, о том, как нашел он Ситу, И о той заколке, украшенной золотом, дивной, сияющей собственным светом.", "commentary": {"siromani": "तदेव भङ्ग्यन्तरेणाह तमिति । तं सीतया दत्तं मणिं रामाय दत्त्वा हनूमानब्रवीत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.65.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «заколке» Не уверена, что это заколка. См. ранее"}, {"id": "lexical:5.65.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "maṇi", "note_ru": "Мани (maṇi, m.) — «самоцвет, драгоценный камень; амулет». MW: maṇi 'a jewel, gem, pearl'. Помимо физического значения maṇi имеет устойчивое значение апотропеического амулета (защитного талисмана). Украшение, которое Сита передаёт Хануману, — чудамани (cūḍāmaṇi), «венечный камень», подаренный отцом Джанакой. Это не просто ювелирное изделие — это родовой амулет, опознавательный знак и вещественное воплощение идентичности Ситы.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:maRi", "collision_tier1": true}]}, {"verse_id": "5.65.12", "verse": "12", "sanskrit_iast": "tvayi saṃnyasya jīvantī rāmā rāma manoratham । dṛṣṭā me rākṣasīmadhye tarjyamānā muhur muhuḥ ॥12॥", "leonov_ru": "Живет прекрасная, возложив на тебя надежду, Рама. (Жива она только надеждой на тебя) Увидел я ее среди ракшаси, которые то и дело ей угрожают.", "commentary": {"tilaka": "हे राम, रामा सा सीता त्वयि मनोरथं सम्यङ् न्यस्य त्वदतिरिक्तविषयमनोरथाभाववती भूत्वा जीवन्ती धृतप्राणा मया दृष्टा", "bhusana": "हे राम  रामा सीता त्वयि मनोरथं स्वाभिलाषम् संन्यस्य जीवन्ती, त्वदभिलाषेण धृतजीवितेत्यर्थः ।। 5.65.10,11 ।।\n\nदुःखमासाद्यते देवी तथा ऽदुःखोचिता सती\nदुःखमित्यर्धम् । आसाद्यते आसीदिति । आर्षो यत्", "siromani": "तदेव भङ्ग्यन्तरेणाह त्वयीति । राक्षसीमध्ये मुहुर्मुहुस्तर्ज्यमाना मनोरथं त्वयि संन्यस्य जीवन्ती रामा सीता मया दृष्टा"}, "has_tier1": true, "notes": [{"id": "tier1:5.65.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Одной на тебя надеждой / Жизнь сохраняет прекрасная (tvayi saṃnyasya jīvantī rāmā rāma manoratham) - букв. “На тебя возложив желание, жива прекрасная, Рама”. В оригинале - звуковой повтор (rāmā rāma).[Е. Костина] «,» Если говорим про звуковой повтор, надо расписать подробнее значение слов, которые его создают, иначе читатель останется в недоумении"}, {"id": "lexical:5.65.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "manoratham", "note_ru": "Манорат (mano-ratha, m.) — «колесница ума», manas «ум» + ratha «колесница» = «желание». MW: manoratham 'wish, desire (as the car of the mind)'. Поэтическая метафора: желание мчится, как колесница — образ ведического происхождения, где ratha — первейшая метафора действия и движения. В сочетании saṃnyasya manoratham — «отложив колесницу ума» (т.е. личных желаний) — фраза несёт смысл дхармического само-отречения: Сита живёт ради Рамы, а не ради себя.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:manoraTa", "collision_tier1": true}]}, {"verse_id": "5.65.13", "verse": "13", "sanskrit_iast": "rākṣasībhir virūpābhī rakṣitā pramadāvane । duḥkham āpadyate tvayā vīra suḥkhocitā ॥13॥", "leonov_ru": "Надежно стерегут ее уродливые ракшаси в роще рядом с женскими покоями. Страдает она, привыкшая к счастью с тобой, о отважный.", "commentary": {"siromani": "राक्षसीभिरिति । त्वया सुखोचिता अक्षता अहिंसिता सीता प्रमदावने राक्षसीभिः करणैर्दुःखमापद्यते प्राप्नोति"}, "has_tier1": true, "notes": [{"id": "tier1:5.65.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «привыкшая» или достойная счастья?"}]}, {"verse_id": "5.65.15", "verse": "15", "sanskrit_iast": "adhaḥśayyā vivarṇāṅgī padminīva himāgame । rāvaṇād vinivṛttārthā martavyakṛtaniścayā ॥15॥", "leonov_ru": "Спит она на земле, тело ее бледно словно лотосовый пруд после наступления холодов, Отвергла она Равану и потому обречена на смерть.", "commentary": {"bhusana": "अधःशय्या विवर्णाङ्गी पद्मिनीव हिमागमे ।\n\nरावणाद्विनिवृत्तार्था मर्तव्यकृतनिश्चया ।\n\nदेवी कथंचित् काकुत्स्थ त्वन्मना मार्गिता मया"}, "has_tier1": false, "notes": [{"id": "lexical:5.65.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "adhaḥśayyā", "note_ru": "Адхашаяя (adhaḥ-śayyā, f.) — «лежание на земле / постель внизу», adhas «вниз, на земле» + śayyā «постель, лёжанка». MW: adhaśśayyā 'lying on the ground'. Спать на голой земле — аскетическое или траурное действие; ритуальное унижение для человека царского происхождения. Для Ситы это добровольный знак: она отвергает ложе в гинекее Раваны, предпочитая землю. Образ прямо противопоставлен роскоши раванова дворца — и связан с padminīva himāgame (следующее слово): лотос в зимний период тоже «ложится» под воду, сохраняя корень.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:aDaHSayyA"}, {"id": "lexical:5.65.15:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "padminī", "note_ru": "Падмини (padminī, f.) — «лотосный пруд, поле лотосов; лотосоносная». MW: padminī 'full of lotuses; a lotus plant or pond'. Образ padminīva himāgame — «как лотосный пруд при наступлении зимы» — один из классических śleṣa-образов: зимой лотос закрывается, теряет цвет, кажется мёртвым — но жив. Аналогия с Ситой строжайшая: она внешне истощена и поблёкла, но внутренне сохраняет жизненную силу (tejas). Этот же образ встречается в описании угасающей Кайкейи и страдающей Дамаянти (Нала).", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:padminI"}]}, {"verse_id": "5.65.18", "verse": "18", "sanskrit_iast": "rāmasugrīvasakhyaṃ ca śrutvā harṣam upāgatā । niyataḥ samudācāro bhaktiś cāsyāḥ sadā tvayi ॥18॥", "leonov_ru": "Обрадовалась она, услышав о дружбе Рамы и Сугривы. Неизменна ее добродетель и всегда она предана тебе.", "commentary": {"bhusana": "नियतः समुदाचारो भक्तिश्चास्यास्तथा त्वयि", "tilaka": "नियत इति । समुदाचारो गोत्रास्खलनादिव्यवहारो भक्तिश्च त्वय्येव सदा नियतः । नान्यत्रेत्यर्थः", "siromani": "रामेति । रामसुग्रीवसख्यं श्रुत्वा हर्षं प्रमोदमुपागता प्राप्ता । अर्धं पृथक् नियत इति । अस्याः मद्बुद्धिस्थायाः सीतायास्त्वयि भक्तिः परप्रीतिः तथा समुदाचारः तदनुकूलानुचरणं नियतः नियमेन वर्तमानो ऽस्तीति शेषः"}, "has_tier1": false, "notes": [{"id": "lexical:5.65.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bhakti", "note_ru": "Бхакти (bhakti, f.) — «причастность, доля; преданность», от √bhaj- («делить, принимать участие, почитать», Whitney #742). MW: bhakti 'distribution; devotion, loyalty'. Исходное значение √bhaj-: делить пищу между участниками трапезы — тот, кто получает свою долю (bhāga), тот и участвует. Bhakti = «делание себя частью», «причастность» — до позднего бхакти-движения, где слово получает теологическое значение «любовного богопочитания». Здесь niyataḥ samudācāro bhaktiś ca — «постоянно упорядоченное поведение и bhakti к тебе» — ещё в доклассическом значении верной преданности.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:Bakti+warnemyr(Baj)"}, {"id": "edition:5.65.18:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.65.18 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.65.18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.65.18", "iast": "rāmasugrīvasakhyaṃ ca śrutvā harṣam upāgatā । niyataḥ samudācāro bhaktiś cāsyāḥ sadā tvayi ॥18॥"}]}]}, {"verse_id": "5.65.19", "verse": "19", "sanskrit_iast": "evaṃ mayā mahābhāga dṛṣṭā janakanandinī । ugreṇa tapasā yuktā tvadbhaktyā puruṣarṣabha ॥19॥", "leonov_ru": "Так мной, о наделенный великой долей, найдена дочь Джанаки. Совершает она суровое подвижничество с преданностью к тебе, о бык среди мужей.", "commentary": {"tilaka": "उग्रेण तपसा त्वद्भक्त्या च युक्ता ।। 5.65.19,20 ।।\n\nयथा दृष्टं राक्षसीतर्जनादि तद्विज्ञाप्येत्यन्वयः", "siromani": "एवमिति । उग्रेण तपसा त्वद्भक्त्या च युक्ता जनकनन्दिनी एवमुक्तप्रकारेण मया दृष्टा"}, "has_tier1": false, "notes": [{"id": "lexical:5.65.19:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ugra", "note_ru": "Угра (ugra, adj.) — «жестокий, пламенный, мощный». MW: ugra 'mighty, powerful; harsh, cruel'. Ugra в сочетании с tapas = «неистовая аскеза» — tapas высшей степени интенсивности. Интересно применение ugra tapas к состоянию Ситы: она не совершает добровольной аскезы, но её страдание квалифицируется как ugra tapas — духовная практика вынужденного очищения. Эта квалификация Ханумана («вижу её стойкость как ugra tapas») морально возвышает Ситу и объясняет её неприкосновенность.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:ugra"}]}, {"verse_id": "5.65.20", "verse": "20", "sanskrit_iast": "abhijñānaṃ ca me dattaṃ yathāvṛttaṃ tavāntike । citrakūṭe mahāprājña vāyasaṃ prati rāghava ॥20॥", "leonov_ru": "Дала она мне тайный знак – рассказ о том, что произошло в твоем присутствии С вороном на горе Читракуте, о мудрый Рагхава.", "commentary": {"bhusana": "समुदाचारः परपुरुषाचिन्तकत्वादिः । त्वयि भक्तिश्च, वर्तत इति शेषः । तपसा अनशनेन ।। 5.65.17,18 ।।\n\nअभिज्ञानं च मे दत्तं यथा वृत्तं तवान्तिके ।\n\nचित्रकूटे महाप्राज्ञ वायसं प्रति राघव\nअभिज्ञानं चिह्नभूतं वाक्यम्, तवान्तिके पूर्वं यथा येन प्रकारेण जातं तथा दत्तमित्यर्थः । तदेव दर्शयति चित्रकूट इति, सदस्यवक्तव्यत्वात् सूचनोक्तिः", "siromani": "अभिज्ञानमिति । चित्रकूटे वायसं जयन्तं प्रति तवान्तिके यद्वृत्तं वृत्तान्तं तदभिज्ञानं मत्संवादचिह्नं मे मह्यं दत्तं कथितमित्यर्थः\nताविति । जाताश्वासौ प्राप्ताश्वासनौ राजपुत्रौ विदित्वा सर्वम् अभिज्ञानं प्रदाय देव्या सीतया आख्यातं संपूर्णं वायुपुत्रो वाचा शशंस"}, "has_tier1": true, "notes": [{"id": "tier1:5.65.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Между тобой и ворономНа горе Читракуте.» Нужна ссылка на соответствующий стих"}, {"id": "phase2:5.65.20:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vāyasa", "note_ru": "Ворон (vāyasa) на Читракуте — по Широмани, это конкретно ворон по имени Джаянта (vāyasaṃ jayantam), сын Индры, некогда клевавший Ситу и раненный Рамой божественным оружием. Подстрочник и собственное примечание Костиной (отметившей нехватку ссылки на этот эпизод) не называют ворона по имени.", "type": "В", "source_commentary": ["siromani"], "why_proposed": "Широмани называет ворона по имени (Джаянта), закрывая именно тот пробел, на который указала Костина в собственном примечании Леонова/Костиной («нужна ссылка на соответствующий стих»).", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.65.25", "verse": "25", "sanskrit_iast": "jīvitaṃ dhārayiṣyāmi māsaṃ daśarathātmaja । ūrdhvaṃ māsān na jīveyaṃ rakṣasāṃ vaśam āgatā ॥25॥", "leonov_ru": "Жить мне осталось [только] месяц, о сын Дашаратхи. После того, как истечет этот месяц, умру я, попавшая во власть ракшасов».", "commentary": {"bhusana": "इति मामब्रवीत्सीता कृशाङ्गी धर्मचारिणी ।\n\nरावणान्तःपुरे रुद्धा मृगीवोत्फुल्ललोचना\nमृगीवोत्फुल्ललोचना, त्रासातिशयादिति भावः", "siromani": "जीवितमिति । मासादूर्ध्वं न जीवेयम्"}, "has_tier1": false, "notes": [{"id": "phase2:5.65.25:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mṛgīvotphullalocanā", "note_ru": "«Подобно олене с широко раскрытыми глазами» (mṛgīvotphullalocanā) — по Бхушане, сравнение указывает не на красоту, а на испуг (trāsātiśayāt): расширенные глаза Ситы — не портретная деталь, а знак предельного ужаса, как у пойманной лани. Подстрочник передаёт образ буквально, не поясняя, что за ним стоит именно страх, а не красота.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "Бхушана уточняет функцию сравнения с ланью как знака ужаса, а не красоты — смысловой сдвиг, отсутствующий в подстрочнике и не отмеченный ни у Леонова/Костиной, ни в Phase-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.65.28", "verse": "28", "sanskrit_iast": "tau jātāśvāsau rājaputrau viditvā । tac cābhijñānaṃ rāghavāya pradāya । devyā cākhyātaṃ sarvam evānupūrvyād । vācā sampūrṇaṃ vāyuputraḥ śaśaṃsa ॥28॥", "leonov_ru": "Поняв, что оба царевича ободрились, Тот тайный знак отдав Рагхаве Все сказанное царевной по порядку Полностью рассказал сын ветра (Хануман).", "commentary": {"bhusana": "तौ जाताश्वासौ राजपुत्रौ विदित्वा तच्चाभिज्ञानं राघवाय प्रदाय ।\n\nदेव्या चाख्यातं सर्वमेवानुपूर्व्याद्वाचा सम्पूर्णं वायुपुत्रः शशंस\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे पञ्चषष्टितमः सर्गः ।। 5.65 ।।\n\nताविति । पूर्ववद्वैश्वदेवीवृत्तम् । समुद्रतरणे सुरसानिरसनादिकम् अक्षवधलङ्कादहनादिकं सजातीयेभ्यः पूर्वमुक्तमपि प्रभुसन्निधावात्मश्लाघायां पर्यवस्येदिति नोक्तमिति ध्योयम् । स्ववृत्तान्तं सर्वमाख्यातवानिति सामान्येन वक्तुं युक्तत्वे ऽप्यङ्गदसन्निधौ प्रपञ्चनं गोप्यविशेषगोपनार्थम् । अत्र त्वप्रपञ्चनम् अकथनीयाकथनार्थं चेति ज्ञेयम् । अस्मिन्सर्गे सार्धसप्तविंशतिश्लोकाः"}, "has_tier1": false, "notes": [{"id": "phase2:5.65.28:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "anupūrvyāt", "note_ru": "«По порядку, полностью» (anupūrvyād... sampūrṇam) — по Бхушане, здесь Хануман впервые рассказывает всё без утайки, тогда как перед Ангадой и отрядом он ранее пересказывал те же события в сокращении, опуская то, что не подобает разглашать при всех (gopyaviśeṣagopanārtham). Подстрочник этой разницы в полноте двух рассказов Ханумана не отмечает.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "Бхушана поясняет нарративную экономию эпоса: сокращённый рассказ Ханумана перед отрядом и полный — перед Рамой суть сознательный выбор сказителя, а не случайность; наблюдение отсутствует в подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s65_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

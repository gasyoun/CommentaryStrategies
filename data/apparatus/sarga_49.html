<script>
const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 49, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 27, "verses_with_notes": 11, "notes_by_layer": {"tier1": 6, "lexical": 6, "phase2": 3, "edition": 0, "crosstext": 0}}, "sarga": 49, "verses": [{"verse_id": "5.49.1", "verse": "1", "sanskrit_iast": "tataḥ sa karmaṇā tasya vismito bhīmavikramaḥ । hanumān krodhatāmrākṣo rakṣo'dhipam avaikṣata ॥1॥", "leonov_ru": "Тогда деяниями его изумленный, наделенный грозной мощью Хануман, глаза которого покраснели от гнева, смотрел на владыку ракшасов.", "commentary": {"bhusana": "ततः स कर्मणा तस्य विस्मितो भीमविक्रमः ।\n\nहनुमान् रोषताम्राक्षो रक्षोधिपमवैक्षत\nततः स इत्यादि । कर्मणा तस्य विस्मितः, युद्धार्थं रावणेनागन्तवन्यमिति यत्नः कृतः । स तु नीतिज्ञ आसनस्थ एव इन्द्रजिन्मुखेन मां निबध्यानीतवानित्यानयनकर्मणा जातविस्मय इत्यर्थः", "siromani": "हनुमतो वृत्तमाह तत इत्यादिभिः । ततः तस्मिन् समये तस्य इन्द्रजितः कर्मणा विस्मितः तस्य रावणस्य कर्मणा सीतापहरणक्रियया क्रोधताम्राक्षः स हनूमान् रक्षोधिपं रावणमवैक्षत । कर्मणेति तस्येति चावृत्त्योभयान्वयि"}, "has_tier1": true, "notes": [{"id": "tier1:5.49.1:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Изумленный его деяниями (karmaṇā tasya vismito) – средневековые комментаторы расходятся во мнении о том, какие именно деяния Раваны здесь имеются в виду. Особняком стоит мнение автора комментария «Тилака», который считает, что под «владыкой ракшасов» здесь подразумевается не Равана, а Индраджит.[Е. Костина] «.» Г-пр в объединяет обе версии: удивленный искусными деяниями Индраджита и разгневанный похищением Ситы и другими поступками Раваны"}, {"id": "lexical:5.49.1:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "krodhatāmrākṣa", "note_ru": "Кродхатамракша (krodha-tāmra-akṣa, adj.) — тройной бахуврихи: krodha «гнев» + tāmra «медно-красный» (MW: tāmra 'copper-coloured, red') + akṣa «глаз». Сложное передаёт физиологию гнева: в аюрведической теории (Caraka-saṃhitā) пылающий pitta при гневе приливает к глазам и краснит их. MW: krodha 'anger, wrath'; tāmra 'copper, red'. Подстрочник нейтрально: «глаза которого покраснели от гнева» — физиологическое объяснение остаётся за кадром.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:kroDatAmrAkza", "collision_tier1": true}]}, {"verse_id": "5.49.2", "verse": "2", "sanskrit_iast": "bhājamānaṃ mahārheṇa kāñcanena virājatā । muktājālāvṛtenātha mukuṭena mahādyutim ॥2॥", "leonov_ru": "Сияющего, наделенного великим сиянием короны, Украшенной жемчужными нитями, сияющей золотом,", "commentary": {"bhusana": "भ्राजमानं महार्हेण काञ्चनेन विराजता ।\n\nमुक्ताजालावृतेनाथ मुकुटेन महाद्युतिम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.49.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mukuṭa", "note_ru": "Мукута (mukuṭa, m./n.) — «корона, диадема»; специфически — высокая конусовидная корона царей и богов в иконографии. MW: mukuṭa 'a crown, diadem, tiara'. В описании Раваны упоминается как kāñcana («золотая») и muktājālāvṛta («покрытая жемчужными сетями»). Иконографически mukuṭa отличается от kirīṭa (другой тип короны) и paridhāna (головной убор): mukuṭa — маркер царской сакральности.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:mukuwa"}]}, {"verse_id": "5.49.3", "verse": "3", "sanskrit_iast": "vajrasaṃyogasaṃyuktair mahārhamaṇivigrahaiḥ । haimair ābharaṇaiś citrair manaseva prakalpitaiḥ ॥3॥", "leonov_ru": "С украшенными соединением алмазов, разделенными многоценными жемчужинами, Золотыми украшениями разнообразными, словно бы созданными умом (воображением),", "commentary": {"tilaka": "तस्येन्द्रजितः । यत्तु रावणस्येति तन्न, तेन हनूमति कस्यापि कर्मणो ऽकृतत्वादिति कतकः । पुत्रद्वारा स्वबन्धनकर्मणेत्यर्थ इति तीर्थः ।। 5.49.1,2।।\n\nवज्रसंयोगेन तद्घट्टनेन संयुक्तैर्घटितैर्महार्हमणिविग्रहैर्बहुमूल्यमणिप्रधानस्वरूपैः", "bhusana": "वज्रसंयोगसंयुक्तैर्महार्हमणिविग्रहैः ।\n\nहैमैराभरणैश्चित्रैर्मनसेव प्रकल्पितैः"}, "has_tier1": false, "notes": [{"id": "lexical:5.49.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vajrasaṃyoga", "note_ru": "Ваджрасамйога (vajra-saṃyoga, m.) — тат-пуруша: vajra «ваджра, молния/бриллиант» + saṃyoga «соединение, инкрустация» (√yuj- + sam-). MW: vajra '(lit.) the hard or mighty one; a thunderbolt; a diamond'. В ювелирном контексте vajra = алмаз (bhadrasāra); vajrasaṃyoga = «инкрустированный алмазами». Украшения Раваны «соединены с ваджрой» — то есть усеяны бриллиантами. Переводчик вынужден выбирать между «молния» (мифологическим) и «алмаз» (ювелирным); контекст здесь однозначно ювелирный.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:vajrasaMyoga"}]}, {"verse_id": "5.49.4", "verse": "4", "sanskrit_iast": "mahārhakṣaumasaṃvītaṃ raktacandanarūṣitam । svanuliptaṃ vicitrābhir vividhabhiś ca bhaktibhiḥ ॥4॥", "leonov_ru": "Облаченного в многоценные шелка, умащенного красным сандалом, [Тело которого] было покрыто разноцветными разнообразными линиями (орнаментами),", "commentary": {"tilaka": "भक्तिभिः शैवत्रिपुण्ड्रवद्रचनाविशेषैः", "bhusana": "महार्हक्षौमसंवीतं रक्तचन्दनरूषितम् ।\n\nस्वनुलिप्तं विचित्राभिर्विविधाभिश्च भक्तिभिः"}, "has_tier1": false, "notes": [{"id": "phase2:5.49.4:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bhaktibhiḥ", "note_ru": "«Разноцветными разнообразными линиями» (vicitrābhir vividhābhiś ca bhaktibhiḥ) — по «Тилаке», это не орнамент вообще, а узор шиваитской трипундры: три горизонтальные полосы на теле, наносимые почитателями Шивы.", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "называет конкретную культовую условность (шиваитская трипундра) за общим словом «орнаменты», давая подстрочнику религиозно-иконографическую опору", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.49.6", "verse": "6", "sanskrit_iast": "śirobhir daśabhir vīro bhrājamānaṃ mahaujasaṃ । nānāvyālasamākīrṇaiḥ śikharair iva mandaram ॥6॥", "leonov_ru": "Десятью головами отважный (Хануман) [смотрел на] сияющего, обладающего великой мощью, Подобного горе Мандаре, на вершинах которой обитают разнообразные хищные звери,", "commentary": {"siromani": "भ्राजमानमिति । महार्हेण बहुमूल्येन काञ्चनेन सुवर्णमयेन मुक्ताजालवृत्तेन यथायोग्यं मुक्तासमूहविन्यस्तेन विराजता प्रकाशमानेन मुकुटेन वज्रस्य संयोगेन यथोचितं विन्यासेन संयुक्तैः महार्हमणीनां विग्रहैर्थयोचितं विघटनविशिष्टैर्मनसेव प्रकल्पितैः हैमेः हेममयैः आभरणैर्भ्राजमानम् अत एव महाद्युतिम् ।। 5.49.2,3 ।।\n\nमहार्हक्षौमेन पट्टवस्त्रविशेषेण संवीतमाच्छादितं रक्तचन्दनेन रूपितं विविधाभिर्भक्तिभिः सेवनीयकस्तूर्यादिभिः स्वनुलिप्तम्", "tilaka": "शिरोभिर्दशभिरिति हनूमतो दर्शनकाले रणे इव भीषणरूपकरणादिति बोध्यम्", "bhusana": "शिरोभिर्दशभिर्वीरं भ्राजमानं महौजसम् ।\n\nनानाव्यालसमाकीर्णैः शिखरैरिव मन्दरम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.49.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…Десять голов… (śirobhir daśabhiḥ) – согласно комментарию «Тилака», хотя обычно Равана имел одну голову, но при встрече с Хануманом он принял грозное десятиглавое обличье, которое использовал в битве."}]}, {"verse_id": "5.49.7", "verse": "7", "sanskrit_iast": "nīlāñjanacayaprakhyaṃ hāreṇorasi rājatā । pūrṇacandrābhavaktreṇa sabālārkam ivāmbudam ॥7॥", "leonov_ru": "Подобного массе черной сурьмы, с сияющим жемчужным ожерельем на груди, С лицом, подобным полной луне, подобного грозовой туче, озаренной восходящим солнцем,", "commentary": {"tilaka": "हारेणोपलक्षितम्", "bhusana": "नीलाञ्जनचयप्रख्यं हारेणोरसि राजता ।\n\nपूर्णचन्द्राभवक्रेण सबलाकमिवाम्बुदम्\nपूर्णचन्द्राभवक्त्रेण पूर्णचन्द्रतुल्यनायकरत्नेन । वक्त्रं नायकरत्नम् अभितोलग्नमुक्तामणिमण्डलम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.49.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Луноликий… (pūrṇacandrābhavaktreṇa) – букв. «с лицом, подобным полной луне».Озаренной восходящим солнцем (sabālārkam ivāmbudam) – в критическое издание вошел другой вариант: sabalākam ivāmbudam «словно туча, [пересекаемая] журавлями» (см.: Jhala 1966: 337).[Е. Костина] «Луноликий» Можно отметить в комм., что Голдмэны соотносят сравнение с луной с камнем в ожерелье"}, {"id": "lexical:5.49.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "daṇḍa", "note_ru": "Данда (daṇḍa, m.) — первичное значение «палка, жезл», далее: «наказание, кара», «войско (четвёртая часть чатурангини)», «политическая власть» и как один из «четырёх упаий» (sāma-dāna-bheda-daṇḍa). MW: daṇḍa 'a stick, staff; punishment, chastisement; an army'. В нитишастре daṇḍa = легитимное принуждение как инструмент dharma-rājan. Здесь Хануман де-факто уже применил «даньду» к посланнику Раваны — ситуация юридически сложная: посланник (dūta) неприкосновенен по нормам дхармашастры.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:daRqa", "collision_tier1": true}, {"id": "phase2:5.49.7:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vaktra", "note_ru": "«С лицом, подобным полной луне» (pūrṇacandrābhavaktreṇa) — «Бхушана» читает vaktra здесь не как «лицо» [Раваны], а как «главный самоцвет» ожерелья (nāyakaratna), окружённый жемчужинами: сравнение с полной луной относится не к облику ракшаса, а к драгоценному камню на его груди.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "даёт альтернативное прочтение слова vaktra («главный самоцвет», а не «лицо»), меняющее референт сравнения с луной — сохраняет описание в ряду перечисляемых украшений, а не переходит к портрету", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.49.8", "verse": "8", "sanskrit_iast": "bāhubhir baddhakeyūraiś candanottamarūṣitaiḥ । bhrājamānāṅgadair bhīmaiḥ pañcaśīrṣair ivoragaiḥ ॥8॥", "leonov_ru": "С руками, украшенными браслетами, умащенными великолепным сандалом, С сияющими браслетами, подобными пятиглавым змеям, (NB подобны змеям были руки, а не браслеты!)", "commentary": {"bhusana": "बाहुभिर्बद्धकेयूरैश्चन्दनोत्तमरूषितैः ।\n\nभ्राजमानाङ्गदैः पीनैः पञ्चशीर्षौरिवोरगैः"}, "has_tier1": true, "notes": [{"id": "tier1:5.49.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Украшенные браслетами (bāhubhir baddhakeyūraiḥ… bhrājamānāṅgadaiḥ) – в оригинале говорится о брасетах кеюра и ангада, которые носились на предплечьях."}]}, {"verse_id": "5.49.17", "verse": "17", "sanskrit_iast": "aho rūpam aho dhairyam aho sattvam aho dyutiḥ । aho rākṣasarājasya sarvalakṣaṇayuktatā ॥17॥", "leonov_ru": "«Какая красота! Какая стойкость! Какая мощь! Какой блеск! Какая у царя ракшасов наделенность всеми благими знаками!", "commentary": {"bhusana": "अहो रूपमहो धैर्यमहो सत्त्वमहो द्युतिः ।\n\nअहो राक्षसराजस्य सर्वलक्षणयुक्तता", "siromani": "चिन्ताकारमाह अहो इति । राक्षसराजस्य रूपादिसर्वलक्षणयुक्तता च अहो आश्चर्यम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.49.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «благими знаками» потом нужен будет комм"}]}, {"verse_id": "5.49.18", "verse": "18", "sanskrit_iast": "yady adharmo na balavān syād ayaṃ rākṣaseśvaraḥ । syād ayaṃ suralokasya saśakrasyāpi rakṣitā ॥18॥", "leonov_ru": "Если бы не был нечестивым этот могучий владыка ракшасов, Был бы он защитником даже мира богов вместе с Шакрой.", "commentary": {"tilaka": "सर्वसंपत्तिमतो ऽप्यधर्मवतो महान्दोष इत्याह-- यदीति । बलवानेवंविधसमृद्धो ऽप्युन्मूलनक्षमो ऽधर्मो यद्यस्मिन्न स्यात्तदा ऽयं राक्षसेश्वरः शक्रम्य सुरलोकस्यापि विष्णुवद्रक्षिता स्यात् । यद्वा धर्म इत्यर्शआद्यजन्तम् अयं बलवान्राक्षसेश्वरो यद्यधर्मवान्न स्यात्तदा शक्रस्येत्यादि प्राग्वत् । अधर्महतत्वात्तु स्वप्रजानामपि नाशक एवेति भावः", "bhusana": "यद्यधर्मो न बलवान् स्यादयं राक्षसेश्वरः ।\n\nस्यादय सुरलोकस्य सशक्रस्यापि रक्षिता\nअयं रावणकृतः अधर्मः बलवान्न स्याद्यदि । तदा ऽयं राक्षसेश्वरः सशक्रस्य सुरलोकस्यापि रक्षिता स्यात्", "siromani": "यदीति । अयं राक्षसेश्वरः यदि अधर्मः धर्मविरोधी न स्यात् तर्हि सुरलोकस्यापि रक्षिता स्यात्"}, "has_tier1": true, "notes": [{"id": "tier1:5.49.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «saśakrasyāpi» опущено, комм[Е. Костина] «закону следовал» Думаю, нужен комм с учетом наличия расхождений в толковании (См. у Голдмэнов 489), хотя есть ощущение, что такой антонимический перевод снимает проблему[Е. Костина] «asya krūrair nṛśaṃsaiś cakarmabhir lokakutsitaiḥ» сверка[Е. Костина] «nṛśaṃsaiś» Опущено"}, {"id": "phase2:5.49.18:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "adharma", "note_ru": "«Если бы не был нечестивым этот владыка ракшасов, был бы он защитником даже мира богов» — «Тилака» добавляет обратную сторону условия: именно из-за адхармы Равана губителен даже для собственных подданных, а не только неспособен защитить чужой мир.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "расширяет условное построение стиха дополнительным следствием — адхарма Раваны делает его разрушителем не только чужого, но и собственного царства, чего подстрочник не проговаривает", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.49.19", "verse": "19", "sanskrit_iast": "asya krūrair nṛśaṃsaiś ca karmabhir lokakutsitaiḥ । sarve bibhyati khalv asmāl lokāḥ sāmaradānavāḥ । ayaṃ hy utsahate kruddhaḥ kartum ekārṇavaṃ jagat ॥19॥", "leonov_ru": "Из-за его жестоких деяний, порицаемых миром, Все живые существа вместе с богами и данавами боятся его, Ибо он способен, разгневанный, сделать вселенную одним океаном».", "commentary": {"bhusana": "अस्य क्रूरैर्नृशंसैश्च कर्मभिर्लोककुत्सितैः ।\n\nतेन बिभ्यति खल्वस्माल्लोकाः सामरदानवाः\nअयं ह्युत्सहते क्रुद्धः कर्तुमेकार्णवं जगत् ।\n\nइति चिन्तां बहुविधामकरोन्मतिमान् हरिः ।\n\nदृष्ट्वा राक्षसराजस्य प्रभावममितौजसः", "siromani": "अस्येति । लोककुत्सितैः सर्वजननिन्दितैः नृशंसैः घातुकैः अत एव क्रूरैः अस्य कर्मभिः सामरदानवाः सर्वे लोकाः अस्मात् रावणाद्ब्रिभ्यति\nअयमिति । क्रुद्धः अयं जगदेकार्णवं कर्तुम् उत्सहते समर्थो भवति इति बहुविधां चिन्तां राक्षसराजस्य प्रभावं दृष्ट्वा ऽपि अकरोत् । सार्धश्लोक एकान्वयी"}, "has_tier1": false, "notes": [{"id": "lexical:5.49.19:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kāla", "note_ru": "Кала (kāla, m.) — в эпосе имеет два главных значения: (1) «время» (нейтральное) и (2) «Кала» — персонифицированное Время-Смерть, неотвратимый бог-разрушитель, аватар Ямы. MW: kāla 'time; fate; death'. Когда Хануман говорит Раване: «Это Кала пришёл за тобой» (или: «ты не слышишь Кала, зовущего тебя»), — термин работает на обоих уровнях одновременно. Двойственность — поэтический приём; подстрочник вынужден выбирать одно значение.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:kAla"}]}, {"verse_id": "5.49.1920", "verse": "1920", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "इत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे एकोनपञ्चाशः सर्गः ।। 5.49।।\n\nअस्येति । तेन कर्मभिः कृतेन पूर्वोक्तेनाधर्मेण हेतुना"}, "has_tier1": false, "notes": [{"id": "lexical:5.49.1920:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "yaśas", "note_ru": "Яшас (yaśas, n.) — «слава, репутация, блеск»; от корня √yaś- («сиять»). MW: yaśas 'beautiful, brilliant; honour, glory, fame'. В дхармической системе yaśas — осязаемое «сияние» доброго имени, квазиматериальная субстанция, которую можно заработать и потерять (ср. функцию punya). Предупреждение Ханумана Раване о потере yaśas — не абстрактный риторический аргумент, а угроза конкретной утраты онтологического статуса.", "type": "В", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:yaSas", "anchor_verse_id": "5.49.20"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s49_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){

  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,

  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);

    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");

  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }

  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;

  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`

      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

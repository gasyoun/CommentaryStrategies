 {"verse_id": "5.52.8", "iast": "gṛhyante yadi roṣeṇa tvādṛśo 'pi vicakṣaṇaḥ । tataḥ śāstravipaścittvaṃ śrama eva hi kevalam ॥8॥"}, {"verse_id": "5.52.9", "iast": "tasmāt prasīda śatrughna rākṣasendra durāsada । yuktāyuktaṃ viniścitya dūtadaṇḍo vidhīyatām ॥9॥"}], "collision_tier1": true, "seq": 7}]}, {"verse_id": "5.52.8", "verse": "8", "sanskrit_iast": "gṛhyante yadi roṣeṇa tvādṛśo 'pi vicakṣaṇaḥ । tataḥ śāstravipaścittvaṃ śrama eva hi kevalam ॥8॥", "leonov_ru": "Если гнев охватывает даже мудреца, подобного тебе, То изучение шастр – [напрасное] утомление, и только.", "commentary": {"tilaka": "त्वादृश इति क्लिन्नन्तबहुवचनम् । शास्त्रविपश्चित्त्वं शास्त्रपाण्डित्यसंपादनम् श्रमः केवलं श्रम एव व्यर्थप्रयास एवेत्यर्थः", "bhusana": "गृह्यन्ते यदि रोषेण त्वादृशो ऽपि विपश्चितः ।\n\nततः शास्त्रधर्मविपश्चित्त्वं श्रम एव हि केवलम्\nशास्त्रविपश्चित्त्वं विविधं पश्यतीति विपश्चित् तस्य भावः विपश्चित्त्वम्, शास्त्रविषये विविधज्ञानोपेतत्वमिति यावत्", "siromani": "गृह्यन्ते इति । त्वादृशो विचक्षणा अपि यदि दोषेण कर्त्रा गृह्यन्ते तदा शास्त्रविपश्चित्त्वं शास्त्रज्ञानं श्रम एव"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "lexical:5.52.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śāstravipaścittvam", "note_ru": "Шастравипашчитттва (śāstra-vipaścit-tva, n.) — тат-пуруша + абстрактный суфф. -tva: śāstra «учёный трактат» + vipaścit «мудрец, знаток» (от vi-paś-, «смотреть насквозь»). MW: vipaścit 'wise, learned'. Вибхишана строит аргумент через reductio: если гнев «заразил» даже человека, изучившего śāstra, то само это изучение — «лишь утомление» (śrama eva kevalam). Термин śāstra здесь охватывает весь корпус нормативных текстов — дхармашастру, артхашастру, нитишастру; их назначение именно в том, чтобы управлять страстями.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:SAstravipaScit", "source_links": [{"label": "MW SAstravipaScit", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=SAstravipaScit"}], "seq": 8}]}, {"verse_id": "5.52.9", "verse": "9", "sanskrit_iast": "tasmāt prasīda śatrughna rākṣasendra durāsada । yuktāyuktaṃ viniścitya dūtadaṇḍo vidhīyatām ॥9॥", "leonov_ru": "Потому смилуйся, о губитель врагов, непобедимый владыка ракшасов, Рассудив [сперва] о том, что должно и что недолжно, подвергни наказанию вестника».", "commentary": {"tilaka": "दूतदण्डो दूते विहितो दण्डः ।। 5.52.9,10 ।।\n\nपापकारिणं राजद्रोहिणम्", "bhusana": "तस्मात् प्रसीद शत्रुघ्न राक्षसेन्द्र दुरासद ।\n\nयुक्तायुक्तं विनिश्चित्य दूतदण्डे विधीयताम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "tier1:5.52.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "И, рассудивши трезво (yuktāyuktaṃ viniścitya) - букв. “твердо решив, что должно и что недолжно”.", "service": [], "suggestions": [], "seq": 9}, {"id": "lexical:5.52.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dūtadaṇḍa", "note_ru": "Дута-данда (dūta-daṇḍa, m.) — тат-пуруша: dūta «вестник» + daṇḍa «наказание» (буквально «посох», отсюда символ власти/кары). Апте: daṇḍa 'punishment, fine, chastisement'. Дипломатическое право древней Индии (артхашастра Каутильи, книга I) признаёт, что dūta может быть наказан, но только не казнён — его жизнь неприкосновенна. Вибхишана использует именно этот принцип; конкретные виды dūtadaṇḍa перечислены в 52.15: уродование, порка, бритьё, клеймение. Подстрочник даёт «наказание вестника» без указания на то, что это юридически закреплённый институт.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:dUta+dic_mw:daRqa", "source_links": [{"label": "MW dUta", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=dUta"}, {"label": "MW daRqa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=daRqa"}], "collision_tier1": true, "seq": 10}]}, {"verse_id": "5.52.11", "verse": "11", "sanskrit_iast": "na pāpānāṃ vadhe pāpaṃ vidyate śatrusūdana । tasmād imaṃ vadhiṣyāmi vānaraṃ pāpakāriṇam ॥11॥", "leonov_ru": "Нет в убийстве злодеев зла, о губитель врагов. Потому убью я эту обезьяну, совершающую злые деяния».", "commentary": {"bhusana": "न पापानां वधे पापं विद्यते शत्रुसूदन ।\n\nतस्मादेनं वधिष्यामि वानरं पापचारिणम्", "siromani": "तस्मादिति । तस्मात् मदुक्तहेतोः प्रसीद चित्तप्रसादं कुरु अत एव युक्तायुक्तं विनिश्चित्य दूतदण्डः दूतोचितक्रिया विधीयताम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "tier1:5.52.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "В оригинале в строфе трижды повторяются слова с корнем pāpa «злой, греховный, преступный».", "service": [{"author": "Е. Костина", "lemma_iast": ".", "kind": "note", "text": "Такого рода явления встречаются многократно. Будем ли мы их последовательно отмечать или избирательно?"}], "suggestions": [], "seq": 11}, {"id": "edition:5.52.11:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.52.11–13 (3 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.52.11–13", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.52.11", "iast": "na pāpānāṃ vadhe pāpaṃ vidyate śatrusūdana । tasmād imaṃ vadhiṣyāmi vānaraṃ pāpakāriṇam ॥11॥"}, {"verse_id": "5.52.12", "iast": "adharmamūlaṃ bahudoṣayuktam । anāryajuṣṭaṃ vacanaṃ niśamya । uvāca vākyaṃ paramārthatattvaṃ । vibhīṣaṇo buddhimatāṃ variṣṭhaḥ ॥12॥"}, {"verse_id": "5.52.13", "iast": "prasīda laṅkeśvara rākṣasendra । dharmārthayuktaṃ vacanaṃ śṛṇuṣva । dūtā na vadhyāḥ samayeṣu rājan । sarveṣu sarvatra vadanti santaḥ ॥13॥"}], "collision_tier1": true, "seq": 12}]}, {"verse_id": "5.52.12", "verse": "12", "sanskrit_iast": "adharmamūlaṃ bahudoṣayuktam । anāryajuṣṭaṃ vacanaṃ niśamya । uvāca vākyaṃ paramārthatattvaṃ । vibhīṣaṇo buddhimatāṃ variṣṭhaḥ ॥12॥", "leonov_ru": "Основанную на неправедности, соединенную с множеством зол, Недостойную благородного речь выслушав, Сказал слова, исполненные высшего знания, Вибхишана, лучший из мудрецов:", "commentary": {"tilaka": "अधर्मस्य मूलमधर्ममूलम् । दोषो ऽपकीर्तिरूपः", "bhusana": "अधर्ममूलं बहुरोषयुक्तमनार्यजुष्टं वचनं निशम्य ।\n\nउवाच वाक्यं परमार्थतत्त्वं विभीषणो बुद्धिमतां वरिष्ठः", "siromani": "अधर्मेति । बहुदोषयुक्तम् अत एव अधर्ममूलम् अत एव अनार्यजुष्टं क्षुद्रैः सेवितं रावणोक्तिं निशम्य श्रुत्वा परमार्थतत्त्वं परमार्थस्य निश्चायकं वाक्यं विभीषण उवाच"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "tier1:5.52.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…греховную (bahudoṣayuktam) - букв. “изобилующую ошибками”. В тексте, которому следует комментарий “Бхушана” стоит bahuroṣayuktam (обильную гневом).", "service": [{"author": "Е. Костина", "lemma_iast": "слова высшего знания:", "kind": "note", "text": "не очень понятная формулировка. По Г-пр - слова, определяющие, что будет величайшим благом (у которых таттва - парамартха)"}], "suggestions": [], "seq": 13}]}, {"verse_id": "5.52.13", "verse": "13", "sanskrit_iast": "prasīda laṅkeśvara rākṣasendra । dharmārthayuktaṃ vacanaṃ śṛṇuṣva । dūtā na vadhyāḥ samayeṣu rājan । sarveṣu sarvatra vadanti santaḥ ॥13॥", "leonov_ru": "«Смилуйся, владыка Ланки, повелитель ракшасов. Выслушай слова, соединенные с праведностью и пользой. Во всех собраниях повсюду говорят праведники, Что не надлежит убивать послов, о царь.", "commentary": {"tilaka": "समयेषु स्वस्वामिनियोगानुष्ठानकालेषु ।। 5.52.13,14 ।।\n\nमौण्ड्यं मुण्डनम् । लक्षणसंनिपातो दूतयोग्याङ्कनसंभूत इति तीर्थः । वैरूप्यादीनामेकैकं वा । तथा लक्षणानां संनिपातः सर्वानुष्ठानं वेत्यर्थ इत्यन्ये । नो ऽस्माकं श्रुतो ऽपि नास्ति दर्शनं तु दूरापास्तमिति भावः", "bhusana": "प्रसीद लङ्केश्वर राक्षसेन्द्र धर्मार्थयुक्तं वचनं शृणुष्व ।\n\nदूता न वध्याः समयेषु राजन् सर्वेषु सर्वत्र वदन्ति सन्तः\nप्रसीदेति । सर्वेषु सर्वत्र सर्वदेशेषु सर्वजातिष्वित्यर्थः", "siromani": "तद्वचनाकारमाह प्रसीदेति । हे लङ्केश्वर समयेषु स्वस्वामिनियोगकालेषु दूताः सर्वत्र सर्वदेशेषु न वध्याः इति सन्तो वदन्ति तत् धर्मार्थतत्त्वं वचनं शृणुष्व\nनन्वनेन शत्रुत्वमाचरितमिति नास्मिन् दूतत्वमात्रमिति नास्य वधे दोष इत्यत आह असंशयमिति । हि यतः अप्रमेयं बहु अप्रियम् अनेन कृतम् अतो ऽयं प्रवृद्धो महान् शत्रुः तथापि सन्तः दूतवध्यां दूतानां वधं न प्रवदन्ति अत एव दूतस्य दुष्टत्वे इति शेषः, बहवः दण्डाः दृष्टा शास्त्रेष्ववलोकिताः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "tier1:5.52.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Внемли... закону и пользе (dharmārthayuktaṃ vacanam śṛṇuṣva) - букв. “услышь речь, проникнутую дхармой и артхой”.", "service": [{"author": "Е. Костина", "lemma_iast": "–", "kind": "note", "text": "см. это словосочетание ранее. необходима унификация или взаимные ссылки"}], "suggestions": [], "seq": 14}]}, {"verse_id": "5.52.14", "verse": "14", "sanskrit_iast": "asaṃśayaṃ śatrur ayaṃ pravṛddhaḥ । kṛtaṃ hy anenāpriyam aprameyam । na dūtavadhyāṃ pravadanti santo । dūtasya dṛṣṭā bahavo hi daṇḍāḥ ॥14॥", "leonov_ru": "Несомненно, он (Хануман) – могучий враг, Ибо сделано им беспримерное зло. [Но] не одобряют праведники убийства вестников, Ибо есть много [иных] наказаний в отношении вестников.", "commentary": {"bhusana": "असंशयं शत्रुरयं प्रवृद्धः कृतं ह्यनेनाप्रियमप्रमेयम् ।\n\nन दूतवध्यां प्रवदन्ति सन्तो दूतस्य दृष्टा बहवो हि दण्डाः\nन केवलं दूतो ऽयम् अक्षादिवधेन शत्रुश्च, तथाच हन्तव्य इत्याशङ्क्याह असंशयमिति । दूतवध्यां दूतवधम् । स्त्रियां भावे क्यप् । हन्तेर्वधादेश आर्षः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "crosstext:5.52.14:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "dūta (avadhya)", "note_ru": "Вибхишана отводит казнь Ханумана общим правилом: «праведники не одобряют убийства вестников» (na dūtavadhyāṃ pravadanti santo). Это эпическая формулировка правовой неприкосновенности посла, теория которой развёрнута у Ману. Manu 7.66: «dūta eva hi saṃdhatte bhinatty eva ca saṃhatān / dūtas tat kurute karma bhidyante yena mānavāḥ» — «Ибо только посол соединяет и разъединяет союзников; посол распоряжается делом, которым люди разъединяются»; ему предшествует требование (7.65) «dūte saṃdhiviparyayau» — «от посла [зависят] мир и его противоположность». Сцена в Ланке прилагает шастрическую доктрину о центральной и потому защищённой роли dūta к Хануману. Свидетельство: уровень шлоки (мягкое).", "type": "Б", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.52.14", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra 7.63–7.66 (Эльманович–Ильин)", "source_links": [], "seq": 15}]}, {"verse_id": "5.52.15", "verse": "15", "sanskrit_iast": "vairūpyām aṅgeṣu kaśābhighāto । mauṇḍyaṃ tathā lakṣmaṇasaṃnipātaḥ । etān hi dūte pravadanti daṇḍān । vadhas tu dūtasya na naḥ śruto 'sti ॥15॥", "leonov_ru": "Уродование тела, порка Обритие головы, клеймение – Эти наказания предписаны в отношении вестника, Об убийстве же вестника я не слышал.", "commentary": {"bhusana": "वैरूप्यमङ्गेषु कशाभिघातो मौण्ड्यं(ढ्यं) तथा लक्षणसन्निपातः ।\n\nएतान् हि दूते प्रवदन्ति दण्डान् वधस्तु दूतस्य न नः श्रुतो ऽपि\nलक्षणसन्निपातः दूतयोग्याङ्कनसंबन्धः । नः अस्माभिः", "siromani": "तद्दण्डाकारमाह वैरूप्यमिति । अङ्गेषु वैरूप्यं नासिकाछेदादिना विरूपकरणं कशाभिघातः कशया तोत्रेण अभिघातः ताडनं मौण्ड्यं भ्रुकुट्यादिमुण्डनं लक्षणसंनिपातः ताम्रखण्डदाहादिना ललाटादौ चिह्नकरणम् एतान् दण्डान् दूते प्रवदन्ति दूतस्य वधस्तु नो ऽस्माकं न श्रुतो ऽस्ति"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "tier1:5.52.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…клеймо поставить (lakṣmaṇasaṃnipātaḥ) - букв. композит можно перевести как “соединение со знаком”. В комментарии “Широмани” поясняется, что речь идет о нанесении отметины раскаленным железом или чем-то подобным на лбу или иной части тела. Автор комментария “Тилака” приводит мнение, согласно которому здесь говорится об одновременном применении всех перечисленных наказаний.", "service": [{"author": "Е. Костина", "lemma_iast": "", "kind": "note", "text": "Чтобы была понятна интерпретация Тилаки, надо добавить другой возможный перевод сл. слова, иначе только запутаем читателя"}], "suggestions": [], "seq": 16}, {"id": "lexical:5.52.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mauṇḍya", "note_ru": "Мауньдья (mauṇḍya, n.) — «обритие головы», от muṇḍa (adj.) «лысый, обритый» + суфф. абстракции -ya. MW: muṇḍa 'having the head shaved; shorn'. Обритие головы в древнеиндийском праве — ритуально-карательная мера: лишение волос приравнивалось к социальной «смерти» и позору (ср. ритуал aśauca, состояние нечистоты). В политическом контексте mauṇḍya сигнализировало статус побеждённого и посрамлённого. Наряду с vairūpya (уродованием) и kaśābhighāta (поркой) составляет карательный арсенал, достаточный для унижения, но не летальный — что и требует Вибхишана для Ханумана.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:mOWya+dic_mw:muRqa", "source_links": [{"label": "MW mOWya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=mOWya"}, {"label": "MW muRqa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=muRqa"}], "collision_tier1": true, "seq": 17}, {"id": "crosstext:5.52.15:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "daṇḍa", "note_ru": "Совет «есть много [иных] наказаний для вестника» (dūtasya … bahavo daṇḍāḥ) опирается на понятие daṇḍa как сердцевину царской власти. Locus classicus — Manu 7.18: «daṇḍaḥ śāsti prajāḥ sarvā daṇḍa evābhirakṣati / daṇḍaḥ supteṣu jāgarti daṇḍaṃ dharmaṃ vidur budhāḥ» — «Наказание правит всеми людьми, Наказание же охраняет, Наказание бодрствует, когда все спят; мудрые объявили Наказание [воплощением] дхармы». Сцена разыгрывает оборотную сторону доктрины: daṇḍa в руках царя-адхармы должен соблюсти даже норму о неприкосновенности dūta. Свидетельство: уровень шлоки (мягкое).", "type": "Б", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.52.15", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra 7.18 (Эльманович–Ильин)", "source_links": [], "collision_tier1": true, "seq": 18}]}, {"verse_id": "5.52.16", "verse": "16", "sanskrit_iast": "kathaṃ ca dharmārthavinītabuddhiḥ । parāvarapratyayaniścitārthaḥ । bhavadvidhaḥ kopavaśe hi tiṣṭhet । kopaṃ na gacchanti hi sattvavantaḥ ॥16॥", "leonov_ru": "Как же тот, чей ум познал дхарму и артху, Кто принимает решения, различая правое и неправое, Подобный тебе, окажется во власти гнева? Ибо истинно доблестные не приходят в гнев.", "commentary": {"tilaka": "परावरप्रत्ययनिश्चितार्थ उत्कर्षापकर्षज्ञानेन निश्चितकार्यः", "bhusana": "कथं च धर्मार्थविनीतबुद्धिः परावरप्रत्ययनिश्चितार्थः ।\n\nभवद्विधः कोपवशे हि तिष्ठेत् कोपं नियच्छन्ति हि सत्त्ववन्तः\nधर्मार्थविनीतबुद्धिः धर्मार्थयोश्शिक्षितबुद्धिः । परावरप्रत्ययनिश्चितार्थः उत्कृष्टापकृष्टपरिज्ञाननिश्चितार्थः । अस्मिन् विषये इदं कार्यं परम् इदमवरमिति विवेकनिश्चितकार्य इत्यर्थः । नियच्छन्ति निगृह्णन्ति । सत्त्ववन्तः व्यवसायवन्तः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "tier1:5.52.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "и пользу, близкое и далекое,", "kind": "note", "text": "см ранее"}, {"author": "Е. Костина", "lemma_iast": "ведают", "kind": "note", "text": "смещается акцент - они ему не поддаются, скорее"}], "suggestions": [], "seq": 19}]}, {"verse_id": "5.52.19", "verse": "19", "sanskrit_iast": "itthaṃvidhasyāmaradaytaśatroḥ । śūrasya vīrasya tavājitasya । kurvanti vīrā manasāpyalīkaṃ । prāṇair vimuktā na tu bhoḥ purā te ॥19॥", "leonov_ru": "Тебе, наделенному такими качествами, врагу бессмертных (богов) и дайтьев, Отважному герою, непобедимому, Причиняли герои нечто неприятное хотя бы мысленно, Но жизни не лишались тобою прежде.", "commentary": {"siromani": "इत्थमिति । इत्थंविधस्य तव अलीकमपराधं पुरा प्राणैर्विमुक्ताः अपहृतसर्वस्वा इत्यर्थः । वीराः मनसा ऽपि न कुर्वन्ति"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "tier1:5.52.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Строфы 18 и 19 отсутствуют в бомбейском издании, но есть в издании “Гита-пресс”.", "service": [{"author": "Е. Костина", "lemma_iast": "Вредили герои,", "kind": "note", "text": "По Широмани - даже в мыслях не вредили वीराः मनसा ऽपि न कुर्वन्ति Так что нужен комм"}], "suggestions": [], "seq": 20}, {"id": "phase2:5.52.19:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "ślokadvayaṃ prakṣiptam", "note_ru": "По Тилаке, пара стихов 18–19 («…войска владыки богов были побеждены… но жизни герои не лишали») — интерполяция (prakṣipta) по мнению комментатора Катаки; Тилака приводит их текст целиком именно затем, чтобы указать на вставку.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Костина уже отмечает, что vv.18–19 отсутствуют в бомбейском издании (но есть в Гита-пресс) — это внешнее, эдиционное свидетельство; Тилака добавляет независимое внутреннее свидетельство традиции — прямую квалификацию этих стихов как интерполяции по имени конкретного комментатора (Катака).", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 21}, {"id": "edition:5.52.19:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.52.19 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.52.19", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.52.19", "iast": "itthaṃvidhasyāmaradaytaśatroḥ । śūrasya vīrasya tavājitasya । kurvanti vīrā manasāpyalīkaṃ । prāṇair vimuktā na tu bhoḥ purā te ॥19॥"}], "collision_tier1": true, "seq": 22}]}, {"verse_id": "5.52.20", "verse": "20", "sanskrit_iast": "na cāpy asya kaper ghāte kaṃ cit paśyāmy ahaṃ guṇam । teṣv ayaṃ pātyatāṃ daṇḍo yair ayaṃ preṣitaḥ kapiḥ ॥20॥", "leonov_ru": "И в убийстве этой обезьяны я не вижу ничего доброго. Тех подвергни наказанию, которыми была послана эта обезьяна.", "commentary": {"bhusana": "न चाप्यस्य कपेर्घाते कञ्चित् पश्याम्यहं गुणम् ।\n\nतेष्वयं पात्यतां दण्डो यैरयं प्रेषितः कपिः\nन केवलं दूतस्य वधे शास्त्रविरोधः गुणमपि न कंचित्पश्यामि अतः एतत्प्रेषकेष्वेव वधरूपो दण्डः पात्यतामित्याह  न चेत्यादि", "tilaka": "समर्पितः प्रेषितः\nनन्वस्मिन्हते ऽन्यस्यानागमने च काममक्षतिर्विपरीतमिष्टमेवेदं तत्राह-- अस्मिन्विनष्टे इति । तौ राजपुत्रौ । यो योद्धोद्योजयेत्तं न पश्यामि, ननु तदुद्योगाभावो ऽपि ममेष्ट एव नेत्याह-- युद्धप्रियेति संबोधनेन रणपराक्रमविजयकीर्ती तवेष्टे किल, ते उभे अप्येतद्विनाशे नश्यत इत्याशयः । रावणस्य रजःप्रकृतित्वात्तत्प्रकृत्यनुसारेण युद्धादिव्यापारेण प्रलोबनम् तत्प्रीत्यर्थमेव दुर्विनीतावित्याद्युक्तिः\nतत्तस्मादुपगृह्य आयान्त्विति शेषः । परेषु ते प्रभावं भावयितुं प्रकाशयितुम् युक्तमिति शेषः", "siromani": "नेति । अस्य कपेर्घाते कंचित् गुणं न पश्यामि । अतः परैरयं कपिः प्रेषितः तेषु अयं प्राणान्तः दण्डः पात्यताम्\nननु किं तेनेत्यत आह तदिति । तत् शराधिक्याद्धेतोः केचित्तवादेशकृतः बलस्य सैन्यस्य एकदेशेन सह किंचिद्बलं गृहीत्वेत्यर्थः, अद्य यान्तु रामसमीपमिति शेषः । गमनप्रयोजनमाह परेषु शत्रुषु ते प्रभावं भावयितुं बोधयितुं मूढौ प्रियावियोगदुःखे अस्वस्थचित्तौ तौ रामलक्ष्मणौ उपगृह्य आयान्त्विति शेषः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "crosstext:5.52.20:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "daṇḍa", "note_ru": "daṇḍa и daṇḍa-nīti. Вибхишана возражает против казни посла, требуя обратить daṇḍa на пославших обезьяну, — т.е. апеллирует к норме nīti, по которой посол неприкосновенен. Та же Шантипарва возводит daṇḍa к божеству и судьбе: «daṇḍāt trivargaḥ satataṃ supraṇītāt pravartate । daivaṃ hi paramo daṇḍo...» (MBh XII.121.13) — «От верно applied жезла всегда проистекает [достижение] трёх целей [dharma-artha-kāma]; ибо высший жезл есть [сама] судьба». Спор ракшасов в Сундараканде — драматизация учения о supraṇīta («верно наложенном») против durṇīta daṇḍa; параллель вскрывает теоретический фон реплики Вибхишаны.", "type": "Б", "cluster": "mbh_gnomic", "cluster_label": "МБх дидактика (Шантипарва / Анушасанапарва)", "shloka_ref": "V.52.20", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Śāntiparvan (MBh XII) 12.121.13", "source_links": [], "seq": 23}]}, {"verse_id": "5.52.21", "verse": "21", "sanskrit_iast": "sādhur vā yadi vāsādhuḥ parair eṣa samarpitaḥ । bruvan parārthaṃ paravān na dūto vadham arhati ॥21॥", "leonov_ru": "Хорош он (Хануман) или плох, он послан другими. Высказывающий чужие намерения, зависящий от других, не заслуживает вестник смерти.", "commentary": {"bhusana": "साधुर्वा यदिवा ऽसाधुः परैरेष समर्पितः ।\n\nब्रुवन् परार्थं परवान् न दूतो वधमर्हति\nसाधुर्वेति । सपर्पितः प्रेषितः", "siromani": "साधुरिति । परैः रिपुभिः समर्पितः प्रेषितः अत एव परार्थं ब्रुवन् साधुर्वा ऽसाधुर्वा एष दूतः वधं नार्हति"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "tier1:5.52.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "dūto", "kind": "note", "text": "мб нужен комм"}], "suggestions": [], "seq": 24}, {"id": "lexical:5.52.21:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "paravant", "note_ru": "Паравант (paravant, adj.) — «зависящий от другого», от para «иной, чужой» + суфф. -vant (обладание качеством). MW: paravant 'dependent on another'. Правовое понятие: вестник юридически «принадлежит» пославшему его и не является субъектом собственной воли — следовательно, наказывать его за содержание послания бессмысленно и несправедливо. Это ключевой принцип дипломатического иммунитета в нитишастре: dūta действует как инструмент, а не как автор. Подстрочник «зависящий от других» — точен, но не раскрывает юридической нагрузки термина.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:paravat", "source_links": [{"label": "MW paravat", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=paravat"}], "collision_tier1": true, "seq": 25}]}, {"verse_id": "5.52.23", "verse": "23", "sanskrit_iast": "tasmān nāsya vadhe yatnaḥ kāryaḥ parapuraṃjaya । bhavān sendreṣu deveṣu yatnam āsthātum arhati ॥23॥", "leonov_ru": "Потому, о покоритель вражеских крепостей, не стоит труда убивать его. Ты должен приложить силы по отношению к богам с Индрой (на борьбу с богами во главе с Индрой).", "commentary": {"bhusana": "तस्मान्नास्य वदे यत्नः कार्यः परपुरञ्जय ।\n\nभवान् सेन्द्रेषु देवेषु यत्नमास्तातुमर्हति"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "tier1:5.52.23:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "yatnaḥ", "kind": "note", "text": "мб комм - букв. перевод? чтобы было понятно про две ятны"}], "suggestions": [], "seq": 26}, {"id": "tier1:5.52.23:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Текст дан по изданию “Гита-пресс”. В бомбейском издании строфы 22-23 объединены в одну строфу. Опущены строки 22bc.", "service": [{"author": "Е. Костина", "lemma_iast": "покоритель твердынь", "kind": "note", "text": "комм"}], "suggestions": [], "seq": 27}]}, {"verse_id": "5.52.26", "verse": "26", "sanskrit_iast": "hitāś ca śūrāś ca samāhitāś ca । kuleṣu jātāś ca mahāguṇeṣu । manasvinaḥ śastrabhṛtāṃ variṣṭhāḥ । kopapraśastāḥ subhṛtāś ca yodhāḥ ॥26॥", "leonov_ru": "Преданные [тебе], отважные, собранные (дисциплинированные), Рожденные в семьях, наделенных великими достоинствами, Разумные, лучшие из носящих меч, Прославленные [своей] яростью воины, которых ты хорошо содержишь.", "commentary": {"bhusana": "हिताश्च शूराश्च समाहिताश्च कुलेषु जाताश्च महागुणेषु ।\n\nमनस्विनः शस्त्रभृतां वरिष्ठाः कोट्यग्रतस्ते सुभृताश्च योधाः", "siromani": "हिता इति । महागुणेषु बहुगुणविशिष्टेषु कुलेषु जाताः शराः नागाश्च सुभृताः अत्यन्तं पोषिताः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "tier1:5.52.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Твои дружинники, яростью славные (kopapraśastāḥ subhṛtāś ca yodhāḥ) - букв. “воины, прославленные яростью, о которых хорошо заботятся”.", "service": [], "suggestions": [], "seq": 28}]}, {"verse_id": "5.52.28", "verse": "28", "sanskrit_iast": "niśācarāṇāmadhipo 'nujasya । vibhīṣaṇasyuttamavākyam iṣṭam । jagrāha buddhyā suralokaśatrur । mahābalo rākṣasarājamukhyaḥ ॥28॥", "leonov_ru": "Владыка ракшасов [своего] младшего брата Вибхишаны ответ приятный (желанный) Принял [всем] сердцем, враг мира богов, Наделенный великой силой, предводитель царей ракшасов.", "commentary": {"tilaka": "उत्तमवाक्यनिष्ठं तत्प्रतिपाद्यमर्थतत्त्वं जग्राह", "bhusana": "निशाचराणामधिपो ऽनुजस्य विभीषणस्योत्तमवाक्यमिष्टम् ।\n\nजग्राह बुद्ध्या सुरलोकशत्रुर्महाबलो राक्षसराजमुख्यः", "siromani": "निशाचराणामिति । राक्षसराजेषु मुख्यः निशाचरणामधिपो रावणः विभीषणस्येष्टमुत्तमवाक्यं बुद्ध्या अन्तःकरणवृत्त्या जग्राह"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-52", "notes": [{"id": "lexical:5.52.28:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "suralokaśatru", "note_ru": "Суралока-шатру (sura-loka-śatru, m.) — тат-пуруша: sura «бог» + loka «мир» + śatru «враг» = «враг мира богов». MW: śatru 'enemy, foe'. Этот эпитет Раваны — не просто «враг богов», но враг всего космоса (loka), принадлежащего богам: loka несёт смысл «мирового пространства», «сферы» (ср. trailokya). Именно этот сложный эпитет в заключительном стихе главы: принятие советов Вибхишаны подаётся как действие «врага мироздания» — ирония в том, что в данном случае совет правилен. Подстрочник «враг мира богов» сохраняет семантику, но не указывает на структурное значение loka как космологической категории.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:suraloka+dic_mw:Satru", "source_links": [{"label": "MW suraloka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=suraloka"}, {"label": "MW Satru", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=Satru"}], "seq": 29}, {"id": "edition:5.52.28:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.52.28 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.52.28", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast"

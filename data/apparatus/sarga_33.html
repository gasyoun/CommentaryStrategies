rya drumāt tasmād vidrumapratimānanaḥ । vinītaveṣaḥ kṛpaṇaḥ praṇipatyopasṛtya ca ॥1॥"}], "collision_tier1": true}]}, {"verse_id": "5.33.2", "verse": "2", "sanskrit_iast": "tām abravīn mahātejā hanūmān mārutātmajaḥ । śirasy añjalim ādhāya sītāṃ madhurayā girā ॥2॥", "leonov_ru": "Сказал доблестный Хануман, сын Ветра, Сложенные почтительно ладони поднеся голове, Сите сладостными словами:", "commentary": {"bhusana": "तामब्रवीन्महातेजा हनूमान् मारुतात्मजः ।\n\nशिरस्यञ्जलिमाधाय सीतां मधुरया गिरा", "tilaka": "अथ लिङ्गैः सीतेति निश्चये ऽपि तयैव साक्षद्वाचयितुमजानान इव पृच्छति-- का न्विति"}, "has_tier1": false, "notes": [{"id": "phase2:5.33.2:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sītāṃ madhurayā girā", "note_ru": "По Тилаке, вопрос Ханумана «кто ты?» — не подлинное неведение: по внешним приметам (liṅgaiḥ) он уже уверен, что перед ним Сита, но спрашивает, притворяясь незнающим, чтобы услышать подтверждение из её собственных уст. Подстрочник передаёт лишь сам факт обращения, не раскрывая эту риторическую стратегию.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "вскрывает риторический характер вопроса Ханумана (притворное неведение ради устного подтверждения самой Ситы), не выраженный в подстрочнике", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.33.3", "verse": "3", "sanskrit_iast": "kā nu padmapalāśākṣi kliṣṭakauśeyavāsini । drumasya śākhām ālambya tiṣṭhasi tvam anindite ॥3॥", "leonov_ru": "«Кто ты, чьи глаза подобны лепесткам лотоса, носящая истрепанную шелковую одежду, Ухватившись (оперевшись) за ветку дерева стоишь ты, безупречная?", "commentary": {"bhusana": "कानु पद्मपलाशाक्षि क्लिष्टकौशेयवासिनि ।\n\nद्रुमस्य शाखामालम्ब्य तिष्ठसि त्वमनिन्दिते", "siromani": "जानकीवचनश्रवणानन्तरकालिकं हनुमद्वृत्तान्तमाह स इत्यादिभिः । विद्रुमप्रतिमं विद्रुमसदृशमाननं यस्य स हनूमान् शिरसि अञ्जलिमाधाय धृत्वा मधुरया गिरा अब्रवीत् । श्लोकद्वयमेकान्वयि ।। 5.33.1,2 ।।\n\nतद्वचनाकारमाह केत्यादिभिः । द्रुमस्य शाखामवलम्ब्य या त्वं तिष्ठसि सा त्वं का ऽसि"}, "has_tier1": false, "notes": [{"id": "lexical:5.33.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kliṣṭakauśeya", "note_ru": "Клишта-кауша (kliṣṭa-kauśeya, n.) — «истрёпанный шёлк»: kliṣṭa (p.p.p. от √kliś- «причинять страдание, изнашивать») + kauśeya (adj. от kuśa или kośa — «шёлкопряд», MW: kauśeya «silken, made of silk»). Шёлковые одежды (kauśeya) — атрибут царского ашрама и роскоши; kliṣṭa («измученный, изношенный») создаёт оксюморон статуса: ткань царская, состояние — аскетическое. Ханuman видит в Сите aristocratic degradation: она heiress to royal splendour (kauśeya), но stripped of it (kliṣṭa). Это одно из немногих мест, где материальный статус Ситы выражен через костюм.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:kauSeya+dic_mw:kliSwa"}, {"id": "crosstext:5.33.3:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "padma-palāśa-akṣī", "note_ru": "padmapalāśākṣi («лотосолепестковоокая») — Хануман обращается так к Сите, висящей на ветке. Это устойчивый кавья-комплимент красавице. В Сказании о Нале им описана Дамаянти: «cārupadmapalāśākṣīṃ manmathasya ratīm iva» (MBh III.65.11) — «прекрасную, с глазами, схожими с лепестками лотоса, словно Рати, (супруга) Манматхи». Сопоставление двух образцовых героинь эпоса (Сита — Дамаянти) через общий лотосоглазый эпитет вписывает вальмикиевское описание в традицию идеального женского портрета.", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.33.3", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparvan (Nalopākhyāna) III.65.11"}]}, {"verse_id": "5.33.4", "verse": "4", "sanskrit_iast": "kimarthaṃ tava netrābhyāṃ vāri sravati śokajam । puṇḍarīkapalāśābhyāṃ viprakīrṇam ivodakam ॥4॥", "leonov_ru": "Почему из глаз твоих течет влага, рожденная скорбью, Словно вода, падающая с двух лотосовых лепестков?", "commentary": {"tilaka": "विप्रकीर्णं भिन्नघटादिव प्रसृतम्", "bhusana": "किमर्थं तव नेत्राभ्यां वारि स्रवति शोकजम् ।\n\nपुण्डरीकपलाशाभ्यां विप्रकीर्णमिवोदकम्\nकिमर्थमिति । तव नेत्राभ्याम् आनन्दाश्रुयोगार्हाभ्याम् । किमर्थं कस्य कुलच्छेदाय । यद्वा किमर्थं किं चेतसि कृत्वा । पुण्डरीकेत्यादि । हन्तैतत्सौन्दर्यं प्रणयिना रामेण दृष्टमासीदिति भावः", "siromani": "किमिति । विप्रकीर्णं स्फुटितघटादिभ्यो निःसृतमुदकमिव नेत्राभ्यां वारि किमर्थं स्रवति"}, "has_tier1": true, "notes": [{"id": "tier1:5.33.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Будто с двух цветков лотоса / Обильно вода стекает (puṇḍarīkapalāśābhyāṃ viprakīrṇam ivodakam) – комментарий «Тилака» объясняет слово viprakīrṇam как «текущий словно из разбитого кувшина» (bhinnaghaṭādiva prasṛtam)."}, {"id": "lexical:5.33.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "puṇḍarīkapalāśa", "note_ru": "Пундарикапалаша (puṇḍarīka-palāśa, n.) — «лепесток белого лотоса»: puṇḍarīka (MW: «white lotus, esp. Nelumbo nucifera», считается наиболее красивым из лотосов; также N. of Viṣṇu) + palāśa «лепесток» (от √palāś- «цвести»). Параллельный стих 33.3 использует padmapalāśākṣī «с глазами как лепестки лотоса», здесь 33.4 — puṇḍarīkapalāśābhyāṃ (двойств.), конкретизируя разновидность лотоса. Puṇḍarīka — белый, тогда как padma — розовый: смена обозначения не случайна; слёзы на белом лепестке создают более чистый, трагически-чистый образ, чем розовый.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:puRqarIka", "collision_tier1": true}]}, {"verse_id": "5.33.7", "verse": "7", "sanskrit_iast": "kiṃ nu candramasā hīnā patitā vibudhālayāt । rohiṇī jyotiṣāṃ śreṣṭhā śreṣṭhā sarvaguṇādhikā ॥7॥", "leonov_ru": "Быть может ты покинутая Месяцем, упавшая [на землю] из обители богов Рохини, лучшая из звезд, превосходящая всех своими добрыми качествами?", "commentary": {"tilaka": "कान्त्या रोहिणीत्वाशङ्का । श्रेष्ठैः सर्वैर्गुणैरधिका । एतदग्रे \"का त्वं भवसि कल्याणि त्वमनिन्दितलोचने\" इत्यर्धं प्रक्षिप्तम्", "bhusana": "किन्नु चन्द्रमसा हीना पतिता विबुधालयात् ।\n\nरोहिणी ज्योतिषां श्रेष्ठा श्रेष्ठसर्वगुणान्विता"}, "has_tier1": false, "notes": [{"id": "lexical:5.33.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "rohiṇī", "note_ru": "Рохини (rohiṇī) — в астральном регистре: главная жена Луны (Чандры), букв. «красноватая» (от √ruh- «расти, подниматься», суфф. -iṇī с цветовым значением). MW: rohiṇī «the most propitious of the lunar mansions (described as a red star, the 4th of the 27 or 28 nakshatras, identified with Aldebaran in Taurus)». Рохини — любимая накшатра Чандры; остальные 27 жён ревнуют. В 33.7 Ханuman сравнивает Ситу с Рохини, «разлучённой с Луной» — метафора двойная: Рохини без Чандры = Сита без Рамы, и обе «лучшие из звёзд» (jyotiṣāṃ śreṣṭhā). Астральная аллюзия поднимает Ситу до небесного регистра.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:rohiRI"}]}, {"verse_id": "5.33.8", "verse": "8", "sanskrit_iast": "kopād vā yadi vā mohād bhartāram asitekṣaṇe । vasiṣṭhaṃ kopayitvā tvaṃ vāsi kalyāṇy arundhatī ॥8॥", "leonov_ru": "Или же, о черноглазая, из гнева или заблуждения на мужа Васиштху разгневавшись, ты прекрасная Арундхати?", "commentary": {"tilaka": "कोपाद्वेति । अत्रापि किं न्विति संबध्यते । कोपादिना वसिष्ठं कोपयित्वेहागता कल्याण्यरुन्धती किं नु वासि । पातिव्रत्यादरुन्धतीत्वशङ्का", "bhusana": "का त्वं भवसि कल्याणि कत्वमनिन्दितलोचने\nका त्वमिति । हे कल्याणि । त्वं का । अनिन्दितलोचने । त्वं का भवसीति योजना\nकोपाद्वा यदि वा मोहाद्भर्तारमसितेक्षणे ।\n\nवसिष्ठं कोपयित्वा त्वं नासिकल्याण्यरुन्धती\nवसिष्ठं कोपयित्वेत्यत्रापि पतिता विबुधालयादित्यनुषज्यते । नासीत्यत्र काकुरनुसन्धेया", "siromani": "कोपादिति । कोपात् यदि वा मोहात् भर्तारं वशिष्ठं कोपयित्वा गता त्वमरुन्धती वासि"}, "has_tier1": false, "notes": [{"id": "lexical:5.33.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "arundhati", "note_ru": "Арундхати (arundhatī) — жена Васиштхи, образец супружеской верности в индийской традиции. MW: arundhatī «the wife of Vasiṣṭha», «the little star Alcor in the Great Bear (personified as wife of the ṛiṣi Vasiṣṭha)». Видна невооружённым глазом только людям с острым зрением — это сделало её символом аскетической чистоты и супружеской преданности: невеста на свадьбе указывает на звезду Арундхати. Ханман спрашивает (33.8): не ты ли Арундхати, прогневившая Васиштху? — т.е. не является ли Сита падшей небожительницей? Это укладывается в серию вопросов 33.5–33.13 о её возможной небесной природе.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:arunDatI"}]}, {"verse_id": "5.33.10", "verse": "10", "sanskrit_iast": "rodanād atiniḥśvāsād bhūmisaṃsparśanādapi । na tvāṃ dēvīm ahaṃ manyē rājñaḥ saṃjñāvadhāraṇāt ॥10॥", "leonov_ru": "Поскольку ты плачешь и громко вздыхаешь, и стопы твои касаются земли, И по тому, что ты упоминаешь имя царя [Рамы], думаю я, что ты не богиня.", "commentary": {"bhusana": "रोदनादतिनिःश्वासाद्भूतमिसंस्पर्शनादपि ।\n\nन त्वां देवीमहं मन्ये राज्ञः संज्ञावधारणात्\nदेवीं देवस्त्रियम् । संज्ञावधारणात् संज्ञायते अनयेति संज्ञा लक्षणम् । राजलक्षणनिश्चयादित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.33.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Ногами земли касаешься (bhūmisaṃsparśanāt) – букв. «из-за касания [тобой] земли»). По религиозным представлениям индийцев, боги ходят, не касаясь земли ногами, что является одним из признаков, по которым можно отличить божество от смертного человека.[Е. Костина] «10» Есть не во всех редакциях"}, {"id": "edition:5.33.10:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.33.10 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.33.10", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.33.10", "iast": "rodanād atiniḥśvāsād bhūmisaṃsparśanādapi । na tvāṃ dēvīm ahaṃ manyē rājñaḥ saṃjñāvadhāraṇāt ॥10॥"}], "collision_tier1": true}]}, {"verse_id": "5.33.11", "verse": "11", "sanskrit_iast": "vyañjanāni hi te yāni lakṣaṇāni ca lakṣaye । mahiṣī bhūmipālasya rājakanyā ca me matā ॥11॥", "leonov_ru": "Ибо замечаю я у тебя явные знаки, По которым мне кажется, что ты жена царя и царская дочь.", "commentary": {"bhusana": "व्यञ्जनानि च ते यानि लक्षणामनि च लक्षये ।\n\nमहिषी भूमिपालस्य राजकन्या ऽसि मे मता", "siromani": "क इति । ते पुत्रादिः कः । अर्धं पृथक्-- रोदनादिति । रोदनादिना त्वां देवीं देवस्त्रियं न मन्ये किंतु राज्ञो रामस्य संज्ञावधारणात् अत्यन्तं नामग्रहणात् यानि व्यञ्जनानि बोधकानि ते लक्षणानि असाधारणचिह्नानि लक्षये तेभ्यश्च भूमिपालस्य निखिलब्रह्माण्डाधिपतेः रामस्य महिषी राजकन्या जनकराजपुत्री च मे मम मता निश्चिता । श्लोकद्वयं संमिलितान्वयि ।। 5.33.10,11 ।।\n\nरावणेनेति । जनस्थानात् रावणेन प्रमथिता सीता यदि त्वमसि तदा पृच्छतो मे आचक्ष्व"}, "has_tier1": true, "notes": [{"id": "tier1:5.33.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И по явным приметам / Которые я замечаю (vyañjanāni hi te yāni / lakṣaṇāni ca lakṣaye) – в оригинале использованы два синонима vyañjanāni и lakṣaṇāni. И то, и другое можно перевести как «знаки, признаки, приметы». Средневековые комментаторы расходятся в интерпретации смысловой разницы между этими двумя словами.… ты царевна / И супруга властителя (mahiṣī bhūmipālasya rājakanyā ca) – автор комментария «Тилака» полагает, что под властителем Хануман подразумевает именно Раму, то есть смысл этой фразы «Мне кажется, что ты – супруга Рамы»."}, {"id": "phase2:5.33.11:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vyañjanāni … lakṣaṇāni", "note_ru": "Собственное примечание Леонова/Костиной отмечает, что средневековые комментаторы расходятся в различении «вьянджана» и «лакшана», не поясняя, в чём именно. Широмани в этом же стихе понимает вьянджану как приметы вообще («указывающие знаки»), а лакшану — как редкие, необычные признаки; Тилака и Бхушана в дальнейшем разборе уточняют иначе: вьянджана — это телесные черты (грудь, бёдра), а лакшана — формальные приметы саамудрики (благие завитки и линии). Иначе говоря, расхождение — между «признак вообще vs. редкий признак» и «телесная черта vs. техническая примета толкователя тела».", "type": "Б", "source_commentary": ["siromani", "tilaka", "bhusana"], "why_proposed": "раскрывает содержание расхождения комментаторов о vyañjana/lakṣaṇa, которое собственное примечание Леонова/Костиной лишь констатирует, не разъясняя", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.33.12", "verse": "12", "sanskrit_iast": "rāvaṇena janasthānād balāt pramathitā yadi । sītā tvam asi bhadraṃ te tan mamācakṣva pṛcchataḥ ॥12॥", "leonov_ru": "Раваной из Джанастханы силой похищенная если Сита ты, благо тебе, скажи о том мне, спрашивающему.", "commentary": {"tilaka": "राक्षसीनां निशाजागरतो निद्राजाड्यात्त्रिजटास्वप्नश्रवणजन्यभयोनात्मत्राणाय सीतैकशरणत्वेनोपेक्षणाच्च दैवानुग्रहाच्चाप्रत्यूहः सीताहनूमतोः संलाप इति बोध्यम्", "bhusana": "सो ऽवतीर्येत्यादि । सः राक्षसीषु सुप्तासु लब्धावसर इत्यर्थः । कृपणः सीतादौस्थ्यदर्शनेन दीनः । जानन्नपि वैदेह्यैव वाचयितुमब्रवीत्\nरावणेन जनस्थानाद् बलादपहृता यदि ।\n\nसीता त्वमसि भद्रं ते तन्ममाचक्ष्व पृच्छतः"}, "has_tier1": false, "notes": [{"id": "phase2:5.33.12:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "rāvaṇena janasthānād", "note_ru": "Тилака поясняет, почему долгий разговор Ханумана и Ситы остаётся незамеченным стражей: ракшаси, не спавшие всю ночь, отупели от бессонницы, к тому же напуганы услышанным сном Триджаты и уже махнули рукой на надзор за Ситой, которой всё равно некуда бежать, — а Бхушана добавляет, что часть из них к этому моменту просто уснула.", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "восполняет нарративный пробел, который подстрочник не затрагивает вовсе: правдоподобие незамеченного разговора у стражи ракшаси", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.33.13", "verse": "13", "sanskrit_iast": "yathā hi tava vai dainyaṃ rūpaṃ cāpyatimānuṣam । tapasā cānvito veṣas tvaṃ rāmamahiṣī dhruvam ॥13॥", "leonov_ru": "[Судя] по твоей печали, а также божественной красоте, И одеянию подвижницы ты, несомненно, жена Рамы.", "commentary": {"tilaka": "सीता रामं स्तौति दद्यादिति", "siromani": "यथेति । यथा यथावत् तव दैन्यं वियोगदुःखजनितदीनता अतिमानुषं मानुषानतिक्रान्तम् अत्यद्भुतमित्यर्थः । तव रूपं च तपसा अन्वितस्तव वेषश्च अस्तीति शेषः अतस्त्वं राममहिष्येव"}, "has_tier1": false, "notes": [{"id": "lexical:5.33.13:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "atimānuṣa", "note_ru": "Атиманушa (ati-mānuṣa, adj.) — «сверхчеловеческий, превосходящий человеческое»: ати- (превосходящий) + mānuṣa (adj. от manu «человек», «относящийся к людям»). MW: atimānuṣa «superhuman, divine» (MBh. и др.). В 33.13 rūpaṃ cāpyatimānuṣam — Хануман прямо называет красоту Ситы «нечеловеческой»: это кульминация серии идентификационных вопросов 33.5–33.13. После вопросов «ты богиня? ты апсара? ты Рохини? ты Арундхати?» — вывод: облик у тебя сверхчеловеческий (atimānuṣa), а значит, ты — жена Рамы. Парадокс: именно сверхчеловечность подтверждает человеческое положение Ситы.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:atimAnuza"}, {"id": "edition:5.33.13:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.33.13 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.33.13", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.33.13", "iast": "yathā hi tava vai dainyaṃ rūpaṃ cāpyatimānuṣam । tapasā cānvito veṣas tvaṃ rāmamahiṣī dhruvam ॥13॥"}]}]}, {"verse_id": "5.33.14", "verse": "14", "sanskrit_iast": "sā tasya vacanaṃ śrutvā rāmakīrtanaharṣitā । uvāca vākyaṃ vaidehī hanūmantaṃ drumāśritam ॥14॥", "leonov_ru": "Услышав эти слова, обрадованная (взволнованная) упоминанием Рамы, Сказала Вайдехи Хануману, сидящему на дереве.", "commentary": {"bhusana": "यथा हि तव वै दैन्यं रूपं चाप्यतिमानुषम् ।\n\nतपसा चान्वितो वेषस्त्वं राममहिषी ध्रुवम्\nयथा यादृशम्\nसा तस्य वचनं श्रुत्वा रामकीर्तनहर्षिता ।\n\nउवाच वाक्यं वैदेही हनुमन्तं द्रुमाश्रितम्\nद्रुमाश्रितं द्रुममूलाश्रितम् । सो ऽवतीर्येति द्रुमावतरणस्य पूर्वमुक्तत्वात् । यद्वा पूर्वमग्रादवतरणमुक्तमिति ज्ञेयम्", "siromani": "सेति । सा सीता तस्य हनूमतो वचनं श्रुत्वा रामकीर्तनहर्षिता सती द्रुमाश्रितं हनूमन्तमुवाच"}, "has_tier1": true, "notes": [{"id": "tier1:5.33.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Опирающемуся о дерево (drumāśritam) – можно перевести как «находящемуся на дереве», что противоречит контексту. Комментарий «Таттвадипика» интерпретирует этот композит как «находящийся у корней дерева» (drumamūlāśritam). Такого же толкования придерживается и автор комментария «Бхушана».[Е. Костина] «:» Из комментария непонятно, с кем спорим (кто переводит как «на дереве»). Голдманы? Надо указать, иначе непонятно, почему вообще возник этот вопрос."}]}, {"verse_id": "5.33.15", "verse": "15", "sanskrit_iast": "pṛthivyāṃ rājasiṃhānāṃ mukhyasya viditātmanaḥ । snuṣā daśarathasyāhaṃ śatrusainyapratāpinaḥ ॥15॥", "leonov_ru": "На земле царей львов прославленного предводителя Невестка Дашаратхи я, губителя вражеских ратей.", "commentary": {"siromani": "तद्वचनाकारमाह पृथिव्यामित्यादिभिः । विदितात्मनः प्रख्यातस्वरूपस्य राजसिंहानां मुख्यस्य दशरथस्य स्नुषा ऽहमस्मि", "bhusana": "पृथिव्यां राजसिहानां मुख्यस्य विदितात्मनः ।\n\nस्नुषा दशरथस्याहं शत्रुसैन्यप्रतापिनः\nपृथिव्यामिति । शत्रुसैन्यप्रतापिनः शत्रुषु जीवत्सु न मे श्वशुरो जीवितवान् । स चेदिदानीं वर्तेत कथमहमेतादृशीमवस्थां प्राप्नुयामिति भावः"}, "has_tier1": false, "notes": [{"id": "lexical:5.33.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "snuṣā", "note_ru": "Снуша (snuṣā, f.) — «невестка, жена сына»: древнее индоевропейское слово (ср. др.-рус. сноха, лат. nurus, греч. νυός). MW: snuṣā «the son's wife, a daughter-in-law» (AV.). Сита представляется: snuṣā daśarathasyāham (33.15) — «я невестка Дашаратхи». Порядок самоидентификации показателен: сначала Сита называет себя по отношению к свёкру-царю, затем по отношению к отцу (33.16), и лишь потом — женой Рамы. Это иерархия pitṛkula (дом мужа) > janakakula (дом отца) > личный брак, характерная для женской идентичности в дхармашастре.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:snuzA"}, {"id": "phase2:5.33.15:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "śatrusainyapratāpinaḥ", "note_ru": "Бхушана прочитывает эпитет Дашаратхи «губитель вражеских ратей» с горькой иронией: будь свёкор жив сейчас, при живых врагах он не потерпел бы, чтобы Сита оказалась в столь бедственном положении, — сама формула его воинской славы становится мерой того, насколько беззащитна она теперь. Подстрочник передаёт эпитет как нейтральную характеристику.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "вскрывает горько-ироническое прочтение воинского эпитета Дашаратхи как меры нынешней беззащитности Ситы, отсутствующее в подстрочнике", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "edition:5.33.15:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.33.15 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.33.15", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.33.15", "iast": "pṛthivyāṃ rājasiṃhānāṃ mukhyasya viditātmanaḥ । snuṣā daśarathasyāhaṃ śatrusainyapratāpinaḥ ॥15॥"}]}]}, {"verse_id": "5.33.16", "verse": "16", "sanskrit_iast": "duhitā janakasyāhaṃ vaidehasya mahātmanaḥ । sīteti nāmnā coktāhaṃ bhāryā rāmasya dhīmataḥ ॥16॥", "leonov_ru": "Несчастная Джанаки я царя Видехи великого духом По имени Сита, жена мудрого Рамы.", "commentary": {"siromani": "दुहितेति । महात्मनो जनकस्याहं दुहिता सीतेति नाम्ना उक्ता जतैरभिहिता रामस्य भार्या ऽहमस्मीति शेषः", "bhusana": "दुहिता जनकस्याहं वैदेहस्य महात्मनः ।\n\nसीता च नाम नाम्ना ऽहं भार्या रामस्य धीमतः\nदुहितेति । सीता च नामेत्यत्र नामशब्दः प्रासिद्धौ"}, "has_tier1": true, "notes": [{"id": "tier1:5.33.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «vaidehasya» Опущено"}]}, {"verse_id": "5.33.17", "verse": "17", "sanskrit_iast": "samā dvādaśa tatrāhaṃ rāghavasya niveśane । bhuñjānā mānuṣān bhogān sarvakāmasamṛddhinī ॥17॥", "leonov_ru": "Двенадцать лет я в доме Рагхавы Наслаждалась человеческими радостями, все желания удовлетворяла.", "commentary": {"tilaka": "समादिशद्बहुप्रकारं रक्षणाय निवेदितवान्", "siromani": "समा इति । मानुषान् मनुष्यसंबन्धिनो भोगान् पदार्थान् भुञ्जाना ऽहं राघवस्य निवेशने द्वादश समाः वर्षाणि अवसमिति शेषः", "bhusana": "समा द्वादश तत्राहं राघवस्य निवेशने ।\n\nभुञ्जाना मानुषान् भोगान् सर्वकामसमृद्धिनी"}, "has_tier1": true, "notes": [{"id": "tier1:5.33.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Счастья мирское вкушала (bhuñjānā mānuṣān bhogān) – букв. «человеческие наслаждения»."}]}, {"verse_id": "5.33.18", "verse": "18", "sanskrit_iast": "tatas trayodaśe varṣe rājye cekṣvākunandanam । abhiṣecayituṃ rājā sopādhyāyaḥ pracakrame ॥18॥", "leonov_ru": "Затем, на тринадцатый год в [том] царстве потомка Икшваку Стал короновать царь вместе с наставниками.", "commentary": {"bhusana": "तत्र त्रयोदशे वर्षे राज्येनेक्ष्वाकुनन्दनम् ।\n\nअभिषेचयितुं राजा सोपाध्यायः प्रचक्रमे", "siromani": "तत इति । ततः तत्र त्रयोदशे वर्षे इक्ष्वाकुनन्दनं राममभिषेचयितुं प्रचक्रमे"}, "has_tier1": false, "notes": [{"id": "lexical:5.33.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "trayodaśa", "note_ru": "Тройодаша (trayo-daśa, adj.) — «тринадцатый»: trayo (три) + daśa (десять). Тринадцатый год — ритуально-нарративная единица: Рама и Сита прожили в лесу 13 лет (samā dvādaśa 33.17 = 12 лет при дворе; trayodaśe varṣe = на 13-м году). По ряду рецензий Рамаяны общий срок изгнания — 14 лет; тринадцатый год запускает абхишека-планирование. В «Махабхарате» тринадцатый год связан с аджнятавасой Пандавов. Хронологическая точность в самопредставлении Ситы — не бытовая деталь, а юридическая: она уточняет сколько лет шла речь о rajya для Рамы.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:trayodaSa"}]}, {"verse_id": "5.33.21", "verse": "21", "sanskrit_iast": "yat tad uktaṃ tvayā vākyaṃ prītyā nṛpatisattama । tac cen na vitathaṃ kāryaṃ vanaṃ gacchatu rāghavaḥ ॥21॥", "leonov_ru": "Те слова, которые были сказаны тобою, [моим] любимым, о лучший из царей, Если они неложны, пусть в лес уйдет Рагхава».", "commentary": {"siromani": "तद्वचनाकारमाह नेति । एष रामाभिषेकः मम जीवितस्यान्तः अतः यदि रामो ऽभिषिच्यते तर्हि प्रत्यह प्रतिदिनं यन्मम भोजनम् उदरे प्रापणीयं तत् न पिबेयं न खादेयम्", "tilaka": "तद्देवासुरे युद्धे वरदानरूपम् ।। 5.33.21,22 ।।\n\nराज्यमयाचत । भरताय दातुमिति शेषः", "bhusana": "यत्तदुक्तं त्वया वाक्यं प्रीत्या नृपतिसत्तम ।\n\nतच्चेन्न वितथं कार्यं वनं गच्छतु राघवः\nयत्तदिति । तत्पूर्वोक्तं यद्वरदानरूपं वाक्यं तन्न वितथं कार्यं चेत्तदा रामो वनं गच्छतु"}, "has_tier1": false, "notes": [{"id": "phase2:5.33.21:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "yat tad uktaṃ tvayā vākyaṃ", "note_ru": "Тилака поясняет происхождение самого «дара» (varadāna), о котором просит Кайкейи: это обещание восходит к войне богов и асуров, где Кайкейи спасла Дашаратхе жизнь и получила в награду два дара — именно эти давние дары она теперь и требует исполнить. Подстрочник передаёт только сам факт просьбы, не называя её давней причины.", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "восстанавливает мифологическую предысторию дара Кайкейи (война богов и асуров), отсутствующую и в подстрочнике, и в лексическом примечании Фазы-1 к varadāna, которое разбирает термин лишь юридически", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.33.22", "verse": "22", "sanskrit_iast": "sa rājā satyavāg devyā varadānam anusmaran । mumoha vacanaṃ śrutvā kaikeyyāḥ krūram apriyam ॥22॥", "leonov_ru": "Царь правдоречивый, вспомнив о даре [обещанном] царице, Потерял сознание, услышав слова Кайкейи, жестокие и неприятные. У Гринцера (Рамаяна II, гл. 12, строфы 54-55): Вспомнив свое обещание Исполнить желание царицы, Царь со вздохом: «О Рама!» — Упал, как подрубленное дерево. Владыка людей лишился чувств И казался больным, безумным, Утратившим волю к жизни, Словно змея, потерявшая силу.", "commentary": {"siromani": "स इति । सत्यवाक् स राजा देव्याः वरदानमनुस्मरन् सन् क्रूरं वियोगबोधकत्वेन घातुकम् अत एव अप्रियं कैकेय्या वचनं श्रुत्वा मुमोह"}, "has_tier1": false, "notes": [{"id": "lexical:5.33.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "varadāna", "note_ru": "Варадана (vara-dāna, n.) — «дарование бона, исполнение просьбы»: vara (MW: «a boon, wish, blessing granted by a deity») + dāna (от √dā- «давать»). MW: varadāna «the granting a boon or request» (MBh., R.). В 33.22 daśaratha «вспомнил varadāna» (varadānam anusmaran) — это ключевой юридический термин: var-обет, данный Кайкейи, имеет силу сакрального договора (ср. satyābhisaṃdha, 31.8). Пара satyābhisaṃdha (31.8) + varadāna (33.22) обрамляет всю ретроспективу: именно комбинация этих двух понятий объясняет механику трагедии — dharma (верность обету) перекрывает pitṛvātsalya (привязанность к сыну).", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:varadAna"}]}, {"verse_id": "5.33.23", "verse": "23", "sanskrit_iast": "tatas taṃ sthaviro rājā satyadharme vyavasthitaḥ । jyeṣṭhaṃ yaśasvinaṃ putraṃ rudan rājyam ayācata ॥23॥", "leonov_ru": "Тогда старый царь, приверженный истинной дхарме, У старшего [своего] славного сына, плача, попросил царство [чтобы отдать его Бхарате].", "commentary": {"bhusana": "स राजा सत्यवाग् देव्या वरदानमनुस्मरन् ।\n\nमुमोह वचनं श्रुत्वा कैकेय्याः क्रूरमप्रियम्\nततस्तु स्थविरो राजा सत्ये धर्मे व्यवस्थितः ।\n\nज्येष्ठं यशस्विनं पुत्रं रुदन् राज्यमयाचत", "siromani": "तत इति । ततस्तस्मात् हेतो रुदन् राजा ज्येष्ठं पुत्रं राज्यं वनराज्यमयाचत"}, "has_tier1": true, "notes": [{"id": "tier1:5.33.23:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Плача, царскую власть / Тогда попросил у сына (jyeṣṭhaṃ yaśasvinaṃ putraṃ rudan rājyam ayācata) – чтобы передать ее Бхарате, сыну Кайкейи.[Е. Костина] «сына» Комм., что у старшего сына"}, {"id": "phase2:5.33.23:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "rājyam ayācata", "note_ru": "Собственное примечание Костиной отмечает необходимость уточнить, у какого именно сына царь просит царство, но не даёт ответа. Широмани же читает «rājyam ayācata» не как «выпросил царство [для Бхараты]», а как «упросил [старшего сына] принять царство леса» (vana-rājyam) — то есть согласиться на изгнание; при таком прочтении единственный, к кому обращена просьба царя, — сам Рама.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "предлагает альтернативное прочтение конструкции rājyam ayācata («упросил принять царство леса» вместо «выпросил царство [для другого]»), напрямую отвечающее на вопрос, оставленный открытым в примечании Костиной", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.33.25", "verse": "25", "sanskrit_iast": "dadyān na pratigṛhṇīyāt satyaṃ brūyan na cānṛtam । api jīvitahetor hi rāmaḥ satyaparākramaḥ ॥25॥", "leonov_ru": "Должен давать, не отнимать, правду говорить, не ложь Даже ради собственной жизни Рама, истинно-доблестный.", "commentary": {"bhusana": "दद्यान्न प्रतिगृह्णीयान्न ब्रूयात् किंचिदप्रियम् ।\n\nअपि जीवितहेतोर्वा रामः सत्यपराक्रमः"}, "has_tier1": true, "notes": [{"id": "tier1:5.33.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Должен истинно-доблестный Рама.» По переводу можно подумать, что «истинно доблестный Рама» - это такая разновидность существ/людей, которым следует поступать определенным образом"}, {"id": "crosstext:5.33.25:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "satya", "note_ru": "Сита характеризует Раму через предельную правдивость: dadyān na pratigṛhṇīyāt satyaṃ brūyan na cānṛtam api jīvitahetor «должен давать, не отнимать, говорить правду, не ложь — даже ради собственной жизни». Эпическая огласовка нормы Ману: Manu 4.138 — satyaṃ brūyāt priyaṃ brūyānna brūyāt satyamapriyam priyaṃ ca nānṛtaṃ brūyādeṣa dharmaḥ sanātanaḥ «Надо говорить правду … не следует говорить приятную ложь — такова вечная дхарма». Manu 6.92 включает satya в десятеричный «признак дхармы» (daśakaṃ dharmalakṣaṇam). Эпитеты Рамы satyavrata (V.28.11), satyaparākrama, satyavāc — кавья-конкретизация sanātana-dharma правдивой речи. Локус классикус.", "type": "А", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.33.25", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra (Законы Ману, рус. пер. С.Д. Эльманович / Г.И. Ильин) Manu 4.138; 8.83; 6.92", "collision_tier1": true}]}, {"verse_id": "5.33.26", "verse": "26", "sanskrit_iast": "sa vihāyottarīyāṇi mahārhāṇi mahāyaśāḥ । visṛjya manasā rājyaṃ jananyai māṃ samādiśat ॥26॥", "leonov_ru": "Он, верхние одежды многоценные многославный Сбросив и оставив душою царство, велел мне отправиться к [его] матери.", "commentary": {"bhusana": "स विहायोत्तरीयाणि महार्हाणि महायशाः ।\n\nविसृज्य मनसा राज्यं जनन्यै मां समादिशत्\nउत्तरीयाणि वासांसि । जनन्यै कौसल्यायै । मां समादिशत्, तन्निकटे त्वया स्थातव्यमित्युक्तवानित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.33.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Велел мне вернуться к матери (jananyai māṃ samādiśat) – имеется в виду Каусалья, мать Рамы."}, {"id": "lexical:5.33.26:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "uttarīya", "note_ru": "Уттарья (uttarīya, n.) — «верхняя одежда, накидка» (носится поверх нижней): от uttara «верхний» + суфф. -īya. MW: uttarīya «an upper or outer garment» (Kātyśr., PārGṛ., MBh.). В 33.26 Рама вихāяттāри mahārhāṇi — «отложил драгоценные уттарьи», т.е. сложил царские одежды перед уходом в лес. Жест символически значим: уттарья — видимый знак статуса; снять её = совершить добровольный акт деклассирования. Термин стоит в паре с rājya (царство): Рама «разложил рājya в уме» и отложил uttarīya — параллельный акт ментального и материального отречения.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:uttarIya", "collision_tier1": true}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};

      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

"verse_id": "5.22.4", "verse": "4", "sanskrit_iast": "vāmaḥ kāmo manuṣyāṇāṃ yasmin kila nibadhyate । jane tasmiṃs tv anukrośaḥ snehaś ca kila jāyate ॥4॥", "leonov_ru": "Воистину, желание связывает людей, у людей из-за него воистину рождаются сострадание и нежность.", "commentary": {"tilaka": "ननु विपरीतं क्रोध एव किं न कामं रुणद्धीत्यत्र कामस्यौत्कट्यादित्याह-- वाम इति । क्रूर इत्यर्थः । \"सव्ये क्रौर्ये सुन्दरे च वामः\"  इति कोशः । कामक्रौर्यमेवाह-- यस्मिन्निति । परमक्रोधविषये ऽपि यत्र जने कामो निबद्ध्यते तत्र जने ऽनुक्रोशो दया स्नेहश्च जायते । तस्मात्क्रोधात्काम उत्कटक्रूरत्ववानित्यर्थः", "bhusana": "वामः कामो मनुष्याणां यस्मिन् किल निबद्ध्यते ।\n\nजने तस्मिंस्त्वनुक्रोशः स्नेहश्च किल जायते ।\nवामः प्रतिकूलः । मनुष्याणां प्राणिनाम् । अनुक्रोशः कृपा । परिभवादिप्रदानेन मनुष्याणां प्रतिकूलः कामः यस्मिन् जने निबद्ध्यते तस्मिंस्त्वनुक्रोशः स्नेहश्च जायते किल", "siromani": "तन्निवारकत्वे हेतुमाह वाम इति । यस्मिन् जने वामः सुन्दरः उत्कट इत्यर्थः, काम इच्छा निबध्यते चिरं तिष्ठति तस्मिन् जने अनुक्रोशः दया स्नेहश्च जायते । एतेनाक्रोशस्नेहयोः क्रोधविध्वंसकत्वं सूचितम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…желание страстное (vāmaḥ kāmo) – слово vāma комментарий «Тилака» толкует как krūra «сильный, жестокий, безжалостный». Комментарий «Таттвадипика» предлагает интерпретацию pratikūla (неправильный, извращенный).", "service": [{"author": "Е. Костина", "lemma_iast": "Ибо страстное желание Связывает, как путами,В душах оно рождаетЛюбовь и сострадание.", "kind": "note", "text": "В Тилаке как раз приведена цитата из Амаракоши, по которой \"सव्ये क्रौर्ये सुन्दरे च वामः\" इति कोशः Широмани выбирает उत्कट как सुन्दर По Широмани nibadhyate - चिरं तिष्ठति. То есть у того, в ком приживается сильная любовь, рождаются сострадание и любовь. Интересно, что Г-пресс трактует иначе: Кама - странная штука. По отношению к тому, к кому она проявляется, возникает также сострадание и снеха"}], "suggestions": [], "seq": 5}]}, {"verse_id": "5.22.5", "verse": "5", "sanskrit_iast": "etasmāt kāraṇān na tvāṃ ghātayāmi varānane । vadhārhām avamānārhāṃ mithyā pravrajane ratām ॥5॥", "leonov_ru": "По этой причине не обрекаю я тебя на смерть (не приказываю убить), о прекрасноликая, Ту, которая заслуживает быть убитой, заслуживает пренебрежения, которая находит радость в ложной (неподобающей) аскезе.", "commentary": {"bhusana": "एतस्मात्कारणान्न त्वां घातयामि वरानने ।\n\nवधार्हामवमानार्हां मिथ्या प्रव्रजिते रताम्", "siromani": "एतस्मादिति । एतस्मादुक्तात् कारणात् मिथ्यापव्रजने कापट्यविशिष्टवनगमनवति रामे रताम् अत एव वधार्हाम् अत एव अवमानार्हां त्वां न घातयामि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Заслужила ты, лжеподвижница (mithyā pravrajane ratām) – букв. «[не убью я тебя] преданную напрасному (ложному) поддвижничеству». В комментарии «Таттвадипика» дается вариант pravrajite вместо pravrajane. Согласно этому комментарию, речь идет о Раме, то есть «тебя, любящую лжеподвижника». Голдмены переводят как «remain devoted to that false ascetic» (см.: Goldman 1984: 171).", "service": [], "suggestions": [], "seq": 6}]}, {"verse_id": "5.22.7", "verse": "7", "sanskrit_iast": "evam uktvā tu vaidehīṃ rāvaṇo rākṣasādhipaḥ । krodhasaṃrambhasaṃyuktaḥ sītām uttaram abravīt ॥7॥", "leonov_ru": "Так сказав Вайдехи Равана, владыка ракшасов, В котором начинал закипать гнев, сказал ей дальше.", "commentary": {"tilaka": "एवं च त्वद्विषये न्यायप्राप्तमुत्पन्नं क्रोधं क्रोधकार्यं वधं त्वद्विषये समुत्थितः कामो नियच्छति निरुणद्धि । तत्र दृष्टान्तः-- द्रवत इति । अमार्गमासाद्य द्रवतो धावतो हयान्सुसारथिरिव", "bhusana": "एवमुक्त्वा तु वैदेहीं रावणो राक्षसाधिपः ।\n\nक्रोधसंरम्भसंयुक्तः सीतामुत्तरमब्रवीत्\nक्रोधसंरम्भसंयुक्तः क्रोधप्रणयाभ्यां संयुक्तः", "siromani": "एवमिति । रावणः एवमुक्त्वा सीताम् उत्तरमब्रवीत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Чувствуя гнев закипающий (krodhasaṃrambhasaṃyuktaḥ) – согласно комментарию «Бхушана» этот композит означает krodhapraṇayābhyāṃ saṃyukta, то есть «охваченный гневом и любовью».", "service": [], "suggestions": [], "seq": 7}]}, {"verse_id": "5.22.8", "verse": "8", "sanskrit_iast": "dvau māsau rakṣitavyau me yo 'vadhis te mayā kṛtaḥ । tataḥ śayanam āroha mama tvaṃ varavarṇini ॥8॥", "leonov_ru": "Два месяца долженствуют быть хранимыми мной, когда твоя нетронутость мной сделана, Затем на мое ложе взойди ты, о прекрасная.", "commentary": {"bhusana": "द्वौ मासौ रक्षितव्यौ मे यो ऽवधिस्ते मया कृतः ।\n\nततः शयनमारोह त्वं वरवर्णिनि\nद्वौ मासाविति । ते मया यो ऽवधिः कृतः \"मासान् द्वादश भामिनि\" इत्यारण्यकाण्डोक्तो द्वादशमासात्मको ऽवधिः कल्पितः । अत्र द्वौ मासाववशिष्टौ । तौ द्वौ मासौ मे मया रक्षितव्यौ प्रतीक्षणीयौ । ततः तस्मात्कारणात् । मम शयानमारोहेत्यन्वयः", "siromani": "तदुत्तराकारमाह द्वावित्यादिभिः । यो ऽवधिः मया कृतः \"मासान् द्वादश भामिनी\" इत्यनेन अरण्यकाण्डे निश्चितः तन्मध्ये अविशिष्टाविति शेषः । द्वौ मासौ रक्षितव्यौ ततो ऽनन्तरं मम शयनं महास्वापं मरणमित्यर्थः । आरोह जानीहीत्यर्थः । एतेन रामस्मृतिं त्यक्त्वा स्वौदासीन्यं न त्यक्ष्यसि तर्हि त्वत्सन्निधावहं स्वप्राणांस्त्यक्ष्यामीति सूचितम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "lexical:5.22.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "avadhi", "note_ru": "Авадхи (avadhi, m.) — «срок, предел, граница»: ava- (вниз, до предела) + √dhā- («класть, устанавливать»). MW: avadhi 'a limit, boundary; fixed period of time'. Правовой и договорный термин: avadhi — установленный срок, по истечении которого условие вступает в силу. Равана устанавливает dvau māsau (два месяца) как avadhi — юридически-оформленное обещание: Сита защищена до истечения срока. За этим стоит деловая / договорная логика, наложенная на ситуацию захвата в плен: Равана представляет ультиматум как юридически корректную сделку.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:avaDi", "source_links": [{"label": "MW avaDi", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=avaDi"}], "seq": 8}, {"id": "phase2:5.22.8:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "śayanam āroha", "note_ru": "«Взойди на моё ложе» (śayanam āroha) Широмани читает не буквально, а как эвфемизм смерти (mahāsvāpaṃ maraṇam): если Сита за оставшиеся два месяца не откажется от памяти о Раме, Равана угрожает не её ложем, а собственной гибелью в её присутствии.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "Меняет адресата угрозы: не принуждение к ложу, а завуалированная угроза самоубийством — подстрочник этого прочтения не даёт.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 9}]}, {"verse_id": "5.22.12", "verse": "12", "sanskrit_iast": "tābhir āśvāsitā sītā rāvaṇaṃ rākṣasādhipam । uvācātmahitaṃ vākyaṃ vṛttaśauṭīryagarvitam ॥12॥", "leonov_ru": "Ими ободренная, Сита Раване, владыке ракшасов Сказала полезные для него слова, гордые из-за ее добродетели и гордости (мужества).", "commentary": {"tilaka": "आत्महितं रावणात्मनो हितम् । वृत्तेन सदाचारेण, शौटीर्येण पतिशौर्येण च सञ्जातगर्वम्", "bhusana": "ताभिराश्वासिता सीता रावणं राक्षसाधिपम् ।\n\nउवाचात्महितं वाक्यं वृत्तशौष्डीर्यगर्वितम्\nवृत्तशौण्डीर्यगर्वितं वृत्तं पातिव्रत्यं तस्या शौण्डीर्यं बलं तेन गर्वितमिति क्रियाविशेषणम्", "siromani": "ताभिरिति । ताभिः कन्याभिः आश्वासिता सीता वृत्तशौण्डीर्याभ्यां शोभनाचारपतिशौर्याभ्यां गर्वितम् आत्महितं वाक्यमुवाच\nरावणं वर्णयन्नाह नीलेत्यादिभिः । नीलजीमूतसंकाशः नीलमेघसदृशः सिंहवत् सत्त्वं पराक्रमो गतिर्गमनं च यस्य दीप्तानि जिह्वोग्रलोचनानि यस्य सः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Гордясь своей добродетелью / И могуществом мужа (uvācātmahitaṃ vākyaṃ vṛttaśauṭīryagarvitam) Букв. «сказала речь, себе полезную и гордую гордостью добродетели». По комментарию «Тилака» ātmahita следует понимать как «полезные для самого Раваны», а śauṭīrya – как «мощь мужа» (patiśaurya), то есть Рамы. Таким образом, композит vṛttaśauṭīryagarvita следует интерпретировать как «гордую добродетелью и могуществом мужа».", "service": [], "suggestions": [], "seq": 10}, {"id": "lexical:5.22.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vṛttaśauṭīrya", "note_ru": "Вриттташаутирья (vṛtta-śauṭīrya, n.) — «гордость добродетелью / доблестью»: vṛtta «поведение, добродетель, прожитая жизнь» (p.p.p. от √vṛt-, «вращаться, действовать») + śauṭīrya «гордость, высокомерие в смысле достоинства» (MW: śauṭīrya 'bravery, manliness; pride'). Составное — оксюморон: garvita (гордость) традиционно отрицательное, но vṛtta-гордость = «гордость, вытекающая из добродетели». Подстрочник «гордая из-за ее добродетели» передаёт это, но теряет напряжение между правомерной гордостью и грехом высокомерия. Это ключевое описание речевого акта Ситы: она говорит «полезные слова» (ātmahita), но от позиции силы.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:SAuTIrya", "source_links": [{"label": "MW SAuTIrya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=SAuTIrya"}], "collision_tier1": true, "seq": 11}]}, {"verse_id": "5.22.14", "verse": "14", "sanskrit_iast": "māṃ hi dharmātmanaḥ patnīṃ śacīm iva śacīpateḥ । tvadanyas triṣu lokeṣu prārthayen manasāpi kaḥ ॥14॥", "leonov_ru": "Ибо меня, благочестивого (Рамы) жену, подобно Шачи, супруге Индры, Кроме тебя в трех мирах возжелает хотя бы в душе кто?", "commentary": {"tilaka": "मनसा ऽपि कः प्रार्थयेत् । किं पुनर्वचसेति भावः", "bhusana": "मां हि धर्मात्मनः पत्नीं शचीमिव शचीपतेः ।\n\nत्वदन्यस्त्रिषु लोकेषु प्रार्थयेन्मनसा ऽपि कः", "siromani": "मामिति । शचीपतेः शचीमिव धर्मात्मनः पत्नीं मां त्वदन्यः मनसा ऽपिकः प्रार्थयेत् पतिराहित्येन स्थापयितुमिच्छेत् न को ऽपीत्यर्थः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "lexical:5.22.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śacīpati", "note_ru": "Шачипати (śacī-pati, m.) — «повелитель Шачи», эпитет Индры: śacī (имя жены Индры; MW: śacī 'the wife of Indra; might, power') + pati «господин». Важна двойная этимология śacī: либо «сила, мощь» (śak- «мочь»), либо собственное имя. Шача = Индрани — канонический образец верной жены в индийской традиции. Сита уподобляет себя Шаче: обе — законные, нерушимо преданные жёны своих сверхмощных мужей. Имплицитная угроза: тот, кто посягнул на Шачу, поплатился перед Индрой; обидчик Ситы поплатится перед Рамой.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:SacIpati", "source_links": [{"label": "MW SacIpati", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=SacIpati"}], "seq": 12}]}, {"verse_id": "5.22.15", "verse": "15", "sanskrit_iast": "rākṣasādhama rāmasya bhāryām amitatejasaḥ । uktavān asi yat pāpaṃ kva gatas tasya mokṣyase ॥15॥", "leonov_ru": "О низкий ракшаса, жене Рамы, чья мощь беспредельна, Сказавший грешное, разве ты сможешь его избежать?", "commentary": {"tilaka": "यत्पापं मम शयनमारोहेत्यादिरूपम् । क्व गतो मोक्ष्यसे । तत्साध्यसमूलनाशस्य त्वया परिहारो ऽशक्य इत्यर्थः", "bhusana": "राक्षसाधमरामस्य भार्याममिततेजसः ।\n\nउक्तवानसि यच्छापं क्व गतस्तस्य मोक्ष्यसे\nतस्य मोक्ष्यसे तस्मान्मोक्ष्यसे", "siromani": "राक्षसेति । हे राक्षसाधम रामस्य भार्यां मां यत् पापं पापहेतुभूतं रामविषयकपरुषवचनम् उक्तवानसि तस्य तस्मात् पापात् क्व गतः सन् मोक्षसे"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "kva gatas", "kind": "omission", "text": "опущено, из-за этого поменялся смысл на прямо противоположный"}], "suggestions": [], "seq": 13}]}, {"verse_id": "5.22.20", "verse": "20", "sanskrit_iast": "asaṃdeśāt tu rāmasya tapasaś cānupālanāt । na tvāṃ kurmi daśagrīva bhasma bhasmārha tejasā ॥20॥", "leonov_ru": "Но поскольку нет повеления Рамы, и поскольку я сохраняю свой тапас, Я не обращаю тебя в пепел своей мощью, Дашагрива, хотя ты заслуживаешь быть обращенным в пепел.", "commentary": {"bhusana": "असन्देशात्तु रामस्य तपसश्चानुपालनात् ।\n\nन त्वां कुर्मि दशग्रीव भस्म भस्मार्ह तेजसा\nअसन्देशादिति । रामस्य भर्तुः । असन्देशात् अपकारिषु शपेथा इति सन्देशाभावात् । तपसः पातिव्रत्यरूपस्य । कूर्मिं करोमि । उत्त्वविकरणप्रत्ययलोपावार्षौ । भस्मार्ह भस्मीकरणार्ह । तेजसा पातिव्रत्यप्रभावेन", "siromani": "असंदेशादिति । रामस्य असंदेशात् दाहविषये आज्ञाभावात् तपसः तपश्चर्यायाः अनुपालनाच्च भस्मार्हतेजसा त्वां भस्म न कुर्मि करोमि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "daśagrīva", "kind": "omission", "text": "опущено обращение"}], "suggestions": [], "seq": 14}, {"id": "tier1:5.22.20:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "bhasmārha tejasā", "kind": "omission", "text": "опущено, нужен комм."}], "suggestions": [], "seq": 15}, {"id": "phase2:5.22.20:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "asaṃdeśāt … tapasaś ca", "note_ru": "По Бхушане и Широмани, Равана сдерживает себя по двум разным причинам: Рама не дал ему приказа мстить обидчикам (asaṃdeśāt), а сама Сита хранит тапас-целомудрие (tapasaḥ anupālanāt) — то есть её собственная аскеза защищает её наравне с отсутствующим повелением мужа.", "type": "Б", "source_commentary": ["bhusana", "siromani"], "why_proposed": "Разводит два основания несожжения (приказ Рамы vs тапас самой Ситы) — подстрочник даёт оба условия слитно, комментарий разделяет их логику.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "collision_tier1": true, "seq": 16}, {"id": "crosstext:5.22.20:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "bhasma … tejasā", "note_ru": "Угроза-несовершение Ситы Раване: «не будь повеления Рамы и сохранения мной тапаса, я обратила бы тебя в пепел своей мощью (bhasma … tejasā), Дашагрива» (V.22.20). Здесь действует общеэпическое представление о tapas как накопленной испепеляющей энергии. Ср. Udyoga 5.180.24, где Рама Джамадагнья объясняет Бхишме, по чему он не ударит: «ye te vedāḥ śarīrasthā… tapaśca sumahattaptaṃ na tebhyaḥ praharāmyaham» — «Веды, что в теле твоём, и аскетические заслуги, накопленные суровым покаянием (tapas), — по ним я не ударю». В обоих местах tapas мыслится как реальная боевая сила, которую носитель добровольно сдерживает. Свидетельство: уровень шлоки (мягкое).", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.22.20", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Udyogaparva 5.180.24", "source_links": [], "collision_tier1": true, "seq": 17}]}, {"verse_id": "5.22.21", "verse": "21", "sanskrit_iast": "nāpahartum ahaṃ śakyā tasya rāmasya dhīmataḥ । vidhis tava vadhārthāya vihito nātra saṃśayaḥ ॥21॥", "leonov_ru": "Невозможно отобрать меня у мудрого Рамы. Судьбою предначертана твоя гибель, здесь нет сомнений.", "commentary": {"tilaka": "अहं तस्य रामस्य भार्या त्वयाप ऽहर्तुं न शक्या, अथाप्ययं विधिरपहरणरूपविधिस्तव वधार्थाय दैवेन विहितो ऽत्र न संशयः", "bhusana": "नापहर्तुमहं शक्या तस्य रामस्य धीमतः ।\n\nविधिस्तव वधार्थाय विहितो नात्र संशयः\nतस्य रामस्य तस्मात् रामात् । विधिः चौर्येणापहरणम् । विहितः, दैवेनेति शेषः", "siromani": "नेति । तस्य रामस्य भार्या ऽहं त्वया ऽपहर्तुं न शक्या तथापि तव वधार्थाय विधिः अपहरणकारणीभूतहेममयकुरङ्गादिविधानं विहितः देवादिभाग्येनेति शेषः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "phase2:5.22.21:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vidhis tava vadhārthāya", "note_ru": "«Провидение» (vidhi), обрекающее Равану на гибель, Тилака и Широмани толкуют не абстрактно, а конкретно: это то же самое устройство похищения — золотой олень (hemamayakuraṅga), которым Равана увёл Раму от хижины, — и оно же, по их слову, станет причиной его смерти.", "type": "В", "source_commentary": ["tilaka", "siromani"], "why_proposed": "Отождествляет безличную «судьбу» с конкретным сюжетным устройством (золотой олень) — подстрочник оставляет vidhi абстрактным.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 18}]}, {"verse_id": "5.22.22", "verse": "22", "sanskrit_iast": "śūreṇa dhanadabhrātrā balaiḥ samuditena ca । apohya rāmaṃ kasmāccid dāracāuryaṃ tvayā kṛtam ॥22॥", "leonov_ru": "Зачем ты, отважный, брат Куберы, обладающий войском, Уведя Раму [из дому], похитил его жену?", "commentary": {"bhusana": "शूरेण धनदभ्रात्रा बलैः समुदितेन च ।\n\nअपोह्य रामं कस्माद्धि दारचौर्यं त्वया कृतम्\nबलैस्समुदितेन बलेन सर्वश्रेष्ठेनेत्यर्थः । अपोह्य रामं मृगच्छद्मना ऽपवाह्य"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "phase2:5.22.22:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "śūreṇa dhanadabhrātrā", "note_ru": "По Тилаке, обращение «отважный» (śūra) здесь — не похвала, а издёвка: раз Равана смог похитить Ситу лишь обманом, через иллюзорного оленя Маричи, а не в открытом бою с Рамой, само слово «отважный» звучит у Ситы как сарказм, обличающий его трусость.", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "Вскрывает иронический регистр обращения «отважный» — в нейтральном подстрочнике эпитет читается как прямая характеристика, а не как насмешка.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 19}]}, {"verse_id": "5.22.24", "verse": "24", "sanskrit_iast": "nīlajīmūtasaṃkāśo mahābhujaśirodharaḥ । siṃhasattvagatiḥ śrīmān dīptajihvogralocanaḥ ॥24॥", "leonov_ru": "Он, с огромными руками и шеей, был подобен темной туче, Обладающий храбростью и поступью льва, величественный, язык его был подобен пламени, взгляд его был грозен.", "commentary": {"tilaka": "शूरेणेत्याद्युपहासोक्तिः । अपोह्य मारीचमायया ऽपसार्य कस्माद्दारचौर्यं त्वया कृतम्, तस्मादत्यन्तमशूरस्त्वमित्युपहासः । चिदिति पादपूरणे ।। 5.22.22,23 ।।\n\nसिंहसत्त्वगतिः सिंहवत्सत्त्वं पराक्रमो गतिश्च यस्य सः । \"सिंहसंहननः\" इति पाठान्तरम्", "bhusana": "नीलजीमूतसङ्काशो महाभुजशिरोधरः ।\n\nसिंहसत्त्वगतिः श्रीमान् दीप्तजिह्वाग्रलोचनः\nसिंहस्येव बलगमने यस्यासौ सिंहसत्त्वगतिः । जिह्वाग्रं लोचने च दीप्तानि यस्य सो ऽयं दीप्तजिह्वाग्रलोचनः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "lexical:5.22.24:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nīlajīmūtasaṃkāśa", "note_ru": "Ниладжимутасанкаша (nīla-jīmūta-saṃkāśa, adj.) — «подобный тёмной (дождевой) туче»: nīla «тёмно-синий, чёрный» + jīmūta «туча» (MW: jīmūta 'a cloud; a kind of large plant') + saṃkāśa «подобный» (от saṃkāś-, «казаться, быть подобным»). Это один из стандартных эпических эпитетов для тёмнокожих героев / демонов. Примечательно: nīla — цвет Кришны и Вишну (nīlavarṇa), но и тьмы. Для Раваны nīlajīmūtasaṃkāśa = демоническое великолепие. В экфрасисе Раваны (22.24–30) читатель видит его через тот же образный словарь что и Вишну/Раму, но с демоническим знаком.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:nIlajImUta", "source_links": [{"label": "MW nIlajImUta", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=nIlajImUta"}], "seq": 20}]}, {"verse_id": "5.22.26", "verse": "26", "sanskrit_iast": "śroṇīsūtreṇa mahatā mecakena susaṃvṛtaḥ । amṛtotpādane naddho bhujaṃgeneva mandaraḥ ॥26॥", "leonov_ru": "Огромная повязка охватывала его бедра, И был он подобен [этим горе] Мандаре, опоясаной змеем [Васуки] во время добычи амриты.", "commentary": {"tilaka": "श्रोणीसूत्रेण कटिसूत्रेण रशनयेत्यर्थः । इन्द्रनीलनद्धमुखारक्तमणियुक्तत्वाच्च तस्य मेचकत्वम् । भुजङ्गो वासुकिः स हि नीलवर्ण इत्याहुः", "bhusana": "श्रोणीसूत्रेण महता मेचकेन सुसंवृतः ।\n\nअमृतोत्पादनद्धेन भुजगेनेव मन्दरः\nमेचकेन नीलेन । अमृतोत्पादनद्धेन अमृतोत्पादनार्थं नद्धेन", "siromani": "मेचकेन नीलमण्यादिना जटिलत्वेन मयूरचन्द्रकवर्णेन श्रोणिसूत्रेण सुसंवृतः \"मेचकस्तु मयूरस्य चन्द्रके श्यामले पुमान्\" इति मेदिनी । तत्र दृष्टान्तः अमृतोत्पादने समुद्रमन्थनसमये भुजङ्गेन नद्धः संबद्धो मन्दर इव"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "amṛtotpādane", "kind": "omission", "text": "опущено, нужен комм."}], "suggestions": [], "seq": 21}, {"id": "phase2:5.22.26:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bhujaṃgeneva mandaraḥ", "note_ru": "Тилака называет змея, которым опоясана гора Мандара, по имени: это Васуки (bhujaṃgo vāsukiḥ), синий по цвету — отсюда и сравнение с тёмной (mecaka) повязкой Раваны; речь идёт о пахтанье океана ради амриты (amṛtotpādana), где Мандара служила мутовкой.", "type": "В", "source_commentary": ["tilaka", "siromani"], "why_proposed": "Именует безличного «змея» как Васуки и разворачивает миф пахтанья океана, стоящий за сравнением.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "collision_tier1": true, "seq": 22}]}, {"verse_id": "5.22.27", "verse": "27", "sanskrit_iast": "tābhyāṃ sa paripūrṇābhyāṃ bhujābhyāṃ rākṣaseśvaraḥ । śuśubhe 'calasaṃkāśaḥ śṛṅgābhyāmiva mandaraḥ ॥27॥", "leonov_ru": "С двумя мощными руками владыка ракшасов Гороподобный, был подобен [горе] Мандаре с двумя вершинами.", "commentary": {"bhusana": "ताभ्यां स परिपूर्णाभ्यां भुजाभ्यां राक्षसेश्वरः ।\n\nशुशुभे ऽचलसङ्काशः श्रृङ्गाभ्यामिव मन्दरः", "siromani": "अचलसंकाशो राक्षसेश्वरः परिपूर्णाभ्याम् अतिपुष्टाभ्यां ताभ्यां प्रसिद्धाभ्यां भुजाभ्यां शृङ्गाभ्यां मन्दर इव शुशुभे । रावणस्य कामरूपत्वात् भुजद्वयमात्रवत्वमपि न विरुध्यते । श्लोकचतुष्टमेकान्वयि"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "phase2:5.22.27:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tābhyāṃ … bhujābhyāṃ", "note_ru": "Широмани поясняет, почему Равана здесь описан лишь с двумя руками, хотя обычно изображается многоруким: он обладает kāmarūpa — способностью произвольно менять облик, — так что двурукость в этой сцене не противоречит его привычной иконографии.", "type": "В", "source_commentary": ["siromani"], "why_proposed": "Снимает возможное недоумение читателя (почему только две руки) через доктрину kāmarūpa — подстрочник не поясняет расхождение с привычным образом Раваны.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 23}]}, {"verse_id": "5.22.29", "verse": "29", "sanskrit_iast": "sa kalpavṛkṣapratimo vasanta iva mūrtimān । śmaśānacaityapratimo bhūṣito 'api bhayamkaraḥ ॥29॥", "leonov_ru": "Даже подобный дереву кальпаврикша или воплощенной весне, Словно погребальная ступа на кладбище (шмашане), даже украшенный, внушал он страх.", "commentary": {"bhusana": "स कल्पवृक्षप्रतिमो वसन्त इव मूर्तिमान् ।\n\nश्मशानचैत्यप्रितिमो भूषितो ऽपि भयङ्करः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.29:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Но подобный древу желаний", "kind": "note", "text": "Не во всех изданиях есть этот стих. Комм?"}, {"author": "Е. Костина", "lemma_iast": "Или весне воплощенной,Ужас он вызывал,Словно ступа на кладбище", "kind": "note", "text": "В Г-пресс есть объяснение, почему такое сравнение. Думаю, нужен комментарий, потому что так непонятно."}], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "термин", "accounted": "не учтено", "text": "Первое появление в кн. V; введено в :", "incomplete": true}], "seq": 24}, {"id": "lexical:5.22.29:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kalpavṛkṣa", "note_ru": "Кальпаврикша (kalpa-vṛkṣa, m.) — «дерево желаний»: kalpa «всё возможное, упорядоченное» (MW: kalpa 'practicable, feasible; the period of time between the creation and destruction of the world') + vṛkṣa «дерево». MW: kalpavṛkṣa 'the tree of paradise, the wish-granting tree'. Одно из пяти небесных деревьев (pañca-devavṛkṣa): любое желание, высказанное под ним или у него, исполняется. Равана сравнивается с kalpavṛkṣa: то есть он предлагает себя как исполнителя желаний — семантика слова подтверждает его риторику в главе 20 («желай чего хочешь, дам»). Но тут же — śmaśānacaitya: погребальная ступа на кладбище. Антитеза двух сравнений в одном стихе — показатель демонической амбивалентности.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:kalpavfkza", "source_links": [{"label": "MW kalpavfkza", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=kalpavfkza"}], "collision_tier1": true, "seq": 25}, {"id": "edition:5.22.29:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.22.29 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.22.29", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.22.29", "iast": "sa kalpavṛkṣapratimo vasanta iva mūrtimān । śmaśānacaityapratimo bhūṣito 'api bhayamkaraḥ ॥29॥"}], "collision_tier1": true, "seq": 26}]}, {"verse_id": "5.22.31", "verse": "31", "sanskrit_iast": "anayenābhisaṃpannam arthahīnam anuvrate । nāśayāmy aham adya tvāṃ sūryaḥ saṃdhyām ivaujasā ॥31॥", "leonov_ru": "О ты, которая верна тому, кто поступает недолжным образом, от которого нет никакого толку (или у которого нет никаких богатств – arthahīna), Уничтожу я тебя сейчас как солнце тьму (своим) светом.", "commentary": {"bhusana": "अनयेनाभिसंपन्नमर्थहीनमनुव्रते ।\n\nनाशयाम्यहमद्य त्वां सूर्यः सन्ध्यामिवौजसा", "siromani": "तद्वचनाकारमाह अनयेनेति । अनयेन नीतिराहित्येन अभिसंपन्नम् अत एव अर्थहीनं रामम् अनुव्रते तत्परिशीलनशीले संध्यां तिमिरं सूर्य इव त्वां नाशयामि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.31:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Сохраняешь ты верность /Порочному и никчемному (anayenābhisaṃpannam arthahīnam anuvrate) – комментарий «Тилака» толкует слово anaya как anīti «недолжное поведение, порочность, безнравственность». Голдмены понимают anaya как «несчастье» и переводят anayenābhisaṃpannam как miserable (см.: Goldman 1984: 173).", "service": [], "suggestions": [], "seq": 27}, {"id": "lexical:5.22.31:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "anaya", "note_ru": "Аная (anaya, m.) — «беззаконие, неправедный путь»: an- (отрицание) + naya «путь, разум, политика, ведение» (√nī-, «вести»). MW: anaya 'bad conduct; ill-luck, misfortune'. Специфически: naya в нити-шастрах = политическое искусство управления (в т.ч. «четыре упайя»). Anaya = следование антинити. Равана характеризует Раму именно как anaya-sampanna — «наделённого беззаконием», т.е. политически несостоятельного. В этой атаке на Раму через понятие нити читается ключевое мировоззренческое расхождение: Равана мыслит в категориях артха-шастры, Рама — в категориях дхармы.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:anaya", "source_links": [{"label": "MW anaya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=anaya"}], "collision_tier1": true, "seq": 28}]}, {"verse_id": "5.22.33", "verse": "33", "sanskrit_iast": "ekākṣīm ekakarṇāṃ ca karṇaprāvaraṇāṃ tathā । gokarṇīṃ hastikarṇīṃ ca lambakarṇīm akarṇikām ॥33॥", "leonov_ru": "Одноглазым, одноухим, покрытым ушами, С ушами как у коров, с ушами как у слонов, с обвислыми ушами, безухим.", "commentary": {"bhusana": "एकाक्षीमेककर्णां च कर्णप्रावराणां तथा ।\n\nगोकर्णीं हस्तिकर्णीं च लम्बकर्णीमकर्णिकाम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "lexical:5.22.33:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "karṇaprāvaraṇā", "note_ru": "Карнаправарана (karṇa-prāvaraṇā, f.) — «покрытая ушами»: karṇa «ухо» + prāvaraṇā «покрывало, оболочка» (pra+√vṛ-, «покрывать»). MW: prāvaraṇa 'a cover, cloak'. Один из перечисляемых уродливых типов ракшаси: «покрытая ушами» — те, у кого уши столь велики, что служат плащом. Каталог уродств ракшаси (22.33–36) построен на системе нарушений анатомической нормы: количественные (одно ухо/один глаз/одна нога), пропорциональные (огромные / крошечные части тела) и функциональные (уши вместо одежды). Это жанр тератологического описания — литература уродств, параллельная индийской демонологии.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:prAvaraRa", "source_links": [{"label": "MW prAvaraRa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=prAvaraRa"}], "seq": 29}]}, {"verse_id": "5.22.38", "verse": "38", "sanskrit_iast": "āvarjayata vaidehīṃ daṇḍasyodyamanena ca । iti pratisamādiśya rākṣasendraḥ punaḥ punaḥ ॥38॥", "leonov_ru": "Склоните Вайдехи хотя бы и с поднятыми палками – Так приказывал владыка ракшастов снова и снова.", "commentary": {"tilaka": "आवर्जयतानुकूल्यं संपादयत", "bhusana": "इति प्रतिसमादिश्य राक्षसेन्द्रः पुनः पुनः ।।\n\nकाममन्युपरीतात्मा जारकीं पर्यतर्जयत्", "siromani": "इतीति । काममन्युना इच्छासंपादकक्रोधेन परीतः आत्मा मनो यस्य स रावणः इति प्रतिसमादिश्य जानकीं प्रति गर्जत अगर्जत"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.38:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Силою или лаской, /Мягкостью и дарами / Или же наказанием (pratilomānulomaiś sāmadānādibhedanaiḥ ca daṇḍasyodyamanena) – букв. «мягкими словами, дарами, разделением и наказанием». Четыре средства, перечисленных в «Артхашастре»: «При наличии волнения в тылу следует применять меры в виде примирения, даров, разделения (враждующих) или наказания» (стр. 394).", "service": [], "suggestions": [], "seq": 30}]}, {"verse_id": "5.22.39", "verse": "39", "sanskrit_iast": "kāmamanyuparītātmā jānakīṃ prati garjata । upagamya tataḥ kṣipraṃ rākṣasī dhānyamālinī ॥39॥", "leonov_ru": "С душою, охваченной страстью и гневом, кричал (он) на Вайдехи. Тогда приблизилась вдруг (к нему) ракшаси Дханьямалини.", "commentary": {"tilaka": "प्रतिगर्जत प्रत्यगर्जत् । उपगम्य समीपमागम्य । ततो ऽतिसन्तर्जनं दृष्ट्वा । सीतायां दययेति शेषः", "bhusana": "उपगम्य ततः क्षिप्रं राक्षसी धान्यमालिनी ।\n\nपरिष्वज्य दशग्रीवमिदं वचनमब्रवीत्", "siromani": "उपेति । ततो ऽनन्तरं राक्षसी राक्षसीस्वामिनी मन्दोदरी धान्यमालिनी तदभिधरावणकनिष्ठपत्नी च राक्षसीशब्देन मन्दोदर्या ग्रहणं तु वानरान्प्रति वक्ष्यमाणहनुमद्वचनानुरोधेन उपगम्य रावणसमीपं प्राप्य इदमब्रवीत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.39:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Комментарий «Широмани» отождествляет Дханьямалини с Мандодари.", "service": [], "suggestions": [], "seq": 31}, {"id": "phase2:5.22.39:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "rākṣasī dhānyamālinī", "note_ru": "Широмани отождествляет здесь «ракшаси» с Мандодари, а не с младшей женой Раваны Дханьямалини (которой формально принадлежит имя в стихе) — и обосновывает это ссылкой вперёд, на слова Ханумана к обезьянам в позднейшей главе, где спутницей Раваны в этой сцене названа именно Мандодари.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "Раскрывает механизм отождествления (перекрёстная ссылка на речь Ханумана далее по тексту), а не только сам факт — подстрочник и краткая помета не объясняют, откуда взято отождествление с Мандодари.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "collision_tier1": true, "seq": 32}]}, {"verse_id": "5.22.41", "verse": "41", "sanskrit_iast": "vivarṇayā kṛpaṇayā mānuṣyā rākṣaseśvara । nūnamasyāṃ mahārāja na devā bhogasattamān ॥41॥", "leonov_ru": "Бледная и жалкая человечица, о владыка ракшасов? О махараджа, несомненно, ей боги сокровища не", "commentary": {"tilaka": "देवगन्धर्वकन्याः । सीतावदेव बलादाहृता इत्यर्थः", "bhusana": "नूनमस्या महाराज न दिव्यान् भोगसत्तमान् ।\n\nविदधात्यमरश्रेष्ठस्तव बाहुबलार्जितान्", "siromani": "नूनमिति । हे महाराज तव बाहुबलार्जितान्भोगसत्तमान् दिव्यभोगान् अस्यां सीतायां सीतार्थम् अमरश्रेष्ठाः देवा ब्रह्माणः न विदधति अस्या राज्यभोगो ब्रह्मणा न लिखित इत्यर्थः । आदराद्बहुवचनम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "tier1:5.22.41:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "rākṣaseśvara", "kind": "omission", "text": "опущено обращение"}], "suggestions": [], "seq": 33}, {"id": "edition:5.22.41:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.22.41 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.22.41", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.22.41", "iast": "vivarṇayā kṛpaṇayā mānuṣyā rākṣaseśvara । nūnamasyāṃ mahārāja na devā bhogasattamān ॥41॥"}], "collision_tier1": true, "seq": 34}]}, {"verse_id": "5.22.43", "verse": "43", "sanskrit_iast": "icchantīṃ kāmayānasya prītir bhavati śobhanā । evamuktas tu rākṣasyā samutkṣiptas tato balī । prahasan meghasamkāśo rākṣasaḥ sa nyavartata ॥43॥", "leonov_ru": "Тот, кто испытывает желание к той, которая желает (его), тот испытывает великое наслаждение». Когда ракшаси так ему сказала, отвернулся тогда могучий, Смеясь, подобный туче ракшас тот пошел обратно,", "commentary": {"bhusana": "एवमुक्तस्तु राक्षस्या समुत्क्षिप्तस्ततो बली ।\n\nप्रहसन् मेघसङ्काशो राक्षसः स न्यवर्तत", "siromani": "एवमिति । राक्षस्या एवमुक्तः अत एव समुत्क्षिप्तः अन्यत्र प्रचलितः राक्षसः सन्न्यवर्तत सीतासंवादात् उपारमत्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-22", "notes": [{"id": "edition:5.22.43:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.22.43 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.22.43", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.22.43", "iast": "icchantīṃ kāmayānasya prītir bhavati śobhanā । evamuktas tu rākṣasyā samutkṣiptas tato balī । prahasan meghasamkāśo rākṣasaḥ sa nyavartata ॥43॥"}], "seq": 35}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"Костина",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

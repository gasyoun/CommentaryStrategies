 "4", "sanskrit_iast": "jātarūpaparikṣiptaṃ citrabhānoḥ samaprabham । aśokamālāvitataṃ dadarśa paramāsanam ॥4॥", "leonov_ru": "Украшенное золотом, сиянием равное огню, Увитое гирляндами ашоки ложе увидел [Хануман],", "commentary": {"siromani": "जातरूपेति । जातरूपेण सुवर्णेन परिक्षिप्तं निर्मितं चित्रभानोः सूर्यस्य समप्रभम् अशोकमालाविततं शोकापहारकमालाभिः संयुतं विविधैर्गन्धैश्चन्दनैर्जुष्टम् आविकाजिनेन स्वाभाविकातिकोमलोर्णायुचर्मणा संवृत्तम् आस्तीर्णं वरमाल्यानां मनोहरसुगन्धादिनोत्तमपुष्पाणां दामभिर्मालाभिः उपशोभितं वालव्यजनहस्ताभिः समन्ततो वीज्यमानं परमासनं महापर्यङ्कस्थपर्यङ्कविशेषं ददर्श । श्लोकत्रयमेकान्वयि\nकलशीमिति । प्रसुप्ता कलशीं जलपूर्णघटीमपविध्य हस्तप्रक्षेपादिना विपर्यास्य परिमार्जिता प्रसुप्ता पुष्पशबला शबलितपुष्पा ऽन्या परिमार्जिता ग्नानिदूरीकरणाय कृतमार्जना पुष्मालेव भाति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "lexical:5.10.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "aśoka", "note_ru": "Ашока (aśoka) — дерево ашока (Saraca asoca / Jonesia ashoka); символ заточения Ситы в одноимённой роще. «Широмани» глоссирует: aśoka букв. «без скорби», отсюда горькая ирония места заключения. Первое вхождение в кн. V.", "type": "В", "subtype": "base", "trigger": "realia", "source": "первое вхождение в кн. V; указатель Гринцера / комментаторы, где процитировано (привязка к стиху, нестрогая)", "source_links": [], "seq": 7}, {"id": "edition:5.10.4:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.10.4 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.10.4", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.10.4", "iast": "jātarūpaparikṣiptaṃ citrabhānoḥ samaprabham । aśokamālāvitataṃ dadarśa paramāsanam ॥4॥"}], "seq": 8}]}, {"verse_id": "5.10.5", "verse": "5", "sanskrit_iast": "vālavyajanahastābhir vījyamānaṃ samantataḥ । gandhaiś ca vividhair juṣṭaṃ varadhūpena dhūpitam ॥5॥", "leonov_ru": "Обмахиваемое со всех сторон служанками, держащими в руках опахала из ячьих хвостов, Благоухающее разнообразными ароматами, окуренное превосходными благовониями.", "commentary": {"tilaka": "वालव्यजनं चामरम् । ननु संभोगगृहे तत्रापि निद्राणस्य कथं वालव्यजनवीजनम्, कथं च हनुमतस्ताभिरदर्शनमिति चेन्न यन्त्रनिर्मितस्त्रीप्रतिमादिभिस्तत्रापि तत्संभवात्", "bhusana": "वालव्यजनहस्ताभिर्वीज्यमानं समन्ततः ।\n\nगन्धैश्च विविधैर्जुष्टं वरधूपेन धूपितम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Служанки его обмахивали / Опахалами из ячьих хвостов (vālavyajanahastābhir vījyamānaṃ samantataḥ) – автор «Тилаки» полагает, что речь идет об автоматах в образе женщин, замечая, что если бы это были живые существа, они бы заметили Ханумана. В «Амритакатаке» предполагается, что имеются в виду орнаментальные изображения опахал.", "service": [], "suggestions": [], "seq": 9}, {"id": "lexical:5.10.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vālavyajana", "note_ru": "Валавьяджана (vāla-vyajana, n.) — «опахало из хвостового волоса [яка]», тат-пуруша: vāla «хвостовой волос, щетина» (MW: 'hair of the tail') + vyajana «опахало, веер» (vi+√aj-, «гнать»). Конкретный вид придворного опахала: из хвоста яка (Bos grunniens), выкрашенного в белый. В индийской иконографии vālavyajana — специфический атрибут прислуги при царственных особах; как два flanking vacīdhara — служители с опахалами — составляют стандартную «царскую» сцену в изобразительном искусстве. Подстрочник «опахала из ячьих хвостов» — точно; культурный код атрибута царского служения не виден.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:vAlavyajana", "source_links": [{"label": "MW vAlavyajana", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=vAlavyajana"}], "collision_tier1": true, "seq": 10}, {"id": "crosstext:5.10.5:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "dhūpita", "note_ru": "Дхупита (dhūpita) «окуренный благовониями» — деталь праздничного убранства: в Бала-канде 1.11.25 (и Ayodhyā 2.14.29) так описана Айодхья, готовимая к торжеству и встрече Дашаратхи/Рамы. В Сундаре (V.10.5) та же формула благоухания-окуривания приложена к опочивальне Раваны. Перенос «праздничной» роскоши столицы Рамы на чертог демона — ироническая кавья-перекличка.\n\nПараллель — Rām. Bāla 1.11.25:\n  «dhūpitaṃ siktasammṛṣṭaṃ patākābhiralaṅkṛtam । । tataḥ prahṛṣṭāḥ paurāste śrutvā rājānamāgatam ॥25॥»\n  Вычищен, пропитан благовониями, Повсюду украшен флагами!» Узнав о возвращении Дашаратхи, Охваченные радостью горожане", "type": "В", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.10.5", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.11.25 (Гринцер, пер. изд. I–III)", "source_links": [], "collision_tier1": true, "seq": 11}]}, {"verse_id": "5.10.7", "verse": "7", "sanskrit_iast": "tasmiñ jīmūtasaṃkāśaṃ pradīptojjvalakuṇḍalam । lohitākṣaṃ mahābāhuṃ mahārajatavāsasam ॥7॥", "leonov_ru": "На нем [цветом кожи] подобного облаку, в ярко сияющих серьгах, Красноглазого, с могучими (огромными руками), в одежде, вышитой золотом,", "commentary": {"tilaka": "तस्मिन् प्रसुप्तमिति शेषः । महारजतं स्वर्णं तत्तन्तुनिर्मितवासोधारिणम्", "bhusana": "तस्मिन् जीमूतसङ्काशं प्रदीप्तोत्तमकुण्डलम् ।\n\nलोहिताक्षं महाबाहुं महारजतवाससम्\nतस्निन्नित्यादि । महारजतवाससं हेमचित्रितवाससम् । महारजतं हेम । महारजनवाससमिति पाठे कुसुम्भरागरञ्जिवस्त्रमित्यर्थः ।। 5.10.7,8।।\n\nवृतमाभरणैर्दिव्यैः सुरूपं कामरूपिणम् ।\n\nसवृक्षवनगुल्माढ्यं प्रसुप्तमिव मन्दरम्", "siromani": "तस्मिन्निति । जीमूतसंकाशं श्यामत्वेन मेघसदृशं प्रदीप्तानि उज्ज्वलकुण्डलानि यस्य महारजतं स्वर्णतन्तुनिर्मितं वासो यस्य"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "В платье, вышитом золотом (mahārajatavāsasam) – букв. «в золотой одежде». Комментаторы полагают, что речь идет об одежде, вышитой золотыми нитями (в «Широмани»: mahārajataṃ svarṇatantunirmitaṃ vāso yasya).", "service": [], "suggestions": [], "seq": 12}, {"id": "lexical:5.10.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "jīmūtasaṃkāśa", "note_ru": "Джимутасанкаша (jīmūta-saṃkāśa, adj.) — «подобный (дождевой) туче», бахуврихи: jīmūta «дождевая туча» (MW: 'a cloud', этимология: jī- «жизнь» + mūta от √miv-, «наполнять, толкать» — «несущая жизнь») + saṃkāśa «похожий, подобный». Тёмный цвет Раваны (māṣarāśi-pratīkāśa в 10.28 — «как груда чёрных бобов») — специфический ракшасский тёмный оттенок кожи, контрастирующий с «лотосово-тёмным» цветом Вишну/Рамы. Сравнение с jīmūta усиливает величественность и одновременно грозность. Подстрочник «подобного облаку» не передаёт ни этимологии «жизненосной тучи», ни связи с символикой тёмных богатырей.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:jImUta+dic_mw:saMkASa", "source_links": [{"label": "MW jImUta", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=jImUta"}, {"label": "MW saMkASa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=saMkASa"}], "collision_tier1": true, "seq": 13}, {"id": "phase2:5.10.7:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mahārajatavāsasam", "note_ru": "У «Бхушаны» отмечен вариант чтения mahārajanavāsasam вместо основного mahārajatavāsasam: при таком чтении речь идёт не об одежде, вышитой золотом (mahārajata = svarṇa), а об одежде, крашенной сафлором (kusumbharāga), то есть попросту красной; перевод следует основному чтению и его золотому образу.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "даёт вариант чтения, меняющий цвет и материал одежды Раваны (золотая vs красная сафлоровая) — ни подстрочник, ни собственная заметка Леонова/Костиной (фиксирующая лишь основное чтение через Широмани) этого варианта не содержат.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 14}, {"id": "crosstext:5.10.7:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "lohitākṣa", "note_ru": "Лохитакша махабаху (lohitākṣaṃ mahābāhum) — «красноглазый, мощнорукий»: в Бала-канде (1.18.11) это часть описания НОВОРОЖДЁННОГО Рамы, воплощения половины Вишну. В Сундаре (V.10.7) тот же геройский формуляр приложен к спящему Раване. Перенос богатырского эпитета на демона-царя — сознательный кавья-приём (царственная стать ракшаса), который в подстрочнике («красноглазого, с могучими руками») остаётся незаметным.\n\nПараллель — Rām. Bāla 1.18.11:\n  «viṣṇorardhaṃ mahābhāgaṃ putramaikṣvākunandanam । lohitākṣaṃ mahābāhuṃ raktauṣṭhaṃ dundubhisvanam ॥11॥»\n  Родила великого потомка Икшваку, Чтимого всеми людьми Раму, Красноглазого, красногубого, мощнорукого, С голосом, звучащим как барабан.", "type": "Б", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.10.7", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.18.11 (Гринцер, пер. изд. I–III)", "source_links": [], "collision_tier1": true, "seq": 15}]}, {"verse_id": "5.10.8", "verse": "8", "sanskrit_iast": "lohitenānuliptāṅgaṃ candanena sugandhinā । saṃdhyāraktam ivākāśe toyadaṃ sataḍidguṇam ॥8॥", "leonov_ru": "С телом, умащенным красным ароматным сандалом, Подобного красной туче с молниями на небе в сумерках,", "commentary": {"bhusana": "लोहितेनानुलिप्ताङ्गं चन्दनेन सुगन्धिना ।\n\nसन्ध्यारक्तमिवाकाशे तोयदं सतडिद्गणम्", "siromani": "लोहितेन रक्तेन चन्दनेन अनुलिप्ताङ्गं सतडिद्गुणं तडिद्रूपगुणसहितं संध्यारक्तं संध्याहेतुकारुण्यविशिष्टम् आकाशे तोयदं मेघमिव तडिदुपमेयत्वं स्वर्णवस्त्रस्य"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Подобного туче багровой / Во мраке блистающей молниями (saṃdhyāraktam ivākāśe toyadaṃ sataḍidguṇam) – по мнению комментаторов, с молниями сравнивается золотая одежда Раваны.", "service": [], "suggestions": [], "seq": 16}]}, {"verse_id": "5.10.9", "verse": "9", "sanskrit_iast": "vṛtam ābharaṇair divyaiḥ surūpaṃ kāmarūpiṇam । savṛkṣavanagulmāḍhyaṃ prasuptam iva mandaram ॥9॥", "leonov_ru": "Покрытого дивными украшениями, прекрасного, меняющего облик по собственной воле, Спящего, подобного горе Мандаре, обильной деревьями, рощами и кустарниками,", "commentary": {"tilaka": "सवृक्षवनगुल्माढ्यं पुष्पसहितवृक्षवनगुल्माढ्यं मन्दरमिव स्थितम् बाहवो यस्य वृक्षाः, नासादयो गुल्माः ।। 5.10.9,10 ।।\n\nपीत्वाप्युपरतम् अपिना क्रीडित्वाप्युपरतम्", "siromani": "दिव्यैः आभरणैः वृतं सवृक्षवनैर्वृक्षसमूहसहितैर्गुल्मैर्लताविशेषैराढ्यं मन्दरमिव\nप्रसुप्तं सुरूपं शोभनरूपविशिष्टं क्रीडित्वा उपरतं निवृत्तं पीत्वा ऽपि उपरतं वराभरणभूषितं कामरूपिणं रावणं तस्मिन् परमासने ददर्श । सार्धश्लोकचतुष्टयमेकान्वयि"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "lexical:5.10.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kāmarūpin", "note_ru": "Камарупин (kāmarūpin, adj.) — «принимающий любой желаемый облик по воле», kāma «желание» + rūpa «форма» + суфф. -in-. MW: kāmarūpin 'assuming any desired form at will'. Это специфический атрибут ракшасов, якшей и некоторых дэвов в эпосе. Именно kāmarūpin объясняет поразительно разнообразный облик Раваны на протяжении Рамаяны: прекрасный брахман, сватаясь к Сите (кн. III), и тот же великолепный царь, спящий здесь. Способность менять облик — онтологическое свойство, не маскировка. NOTE: лемма также принята в ch21.1 — там в более развёрнутом контексте; здесь — первое вхождение в кн. V в описании Раваны-спящего.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:kAmarUpin", "source_links": [{"label": "MW kAmarUpin", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=kAmarUpin"}], "seq": 17}]}, {"verse_id": "5.10.12", "verse": "12", "sanskrit_iast": "niḥśvasantaṃ yathā nāgaṃ rāvaṇaṃ vānarottamaḥ । āsādya paramodvignaḥ so 'pāsarpat subhītavat ॥12॥", "leonov_ru": "Дышащего, словно слон, Равану лучший из обезьян Достигнув, испытывая сильное волнение, отступил, словно бы в страхе.", "commentary": {"tilaka": "यथा नागं गजमिव निःश्वसन्तं रावणमासाद्य प्राप्य परमोद्विग्नो ऽयं पापी देवीं हृतवानित्येतत्समीपे ऽवस्थानमनुचितमिति खिन्नचित्तो ऽपासर्पत् । सुभीतवत्सुभीतो यथा भयहेतोः पिशाचादेः संमुखे स्थातुमशक्तो ऽपसर्पति तद्वत्", "bhusana": "निःश्वसन्तं यथा नागं रावणं वानरर्षभः ।\n\nआसाद्य परमोद्विग्नः सो ऽपासर्पत् सुभीतवत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Подобно нагу дышал (niḥśvasantaṃ yathā nāgaṃ) – комментаторы глоссируют nāga как gaja (слон). Однако Голдмены, вслед за Даттом, переводят слово nāga как змея (serpent), обосновывая это тем, что обычно в индийском эпосе глубокое дыхание могучего человека сравнивается с дыханием змеи (см.: Goldman 1984: 135, 371).Отошел, будто бы в страхе (paramodvignaḥ so 'pāsarpat subhītavat) – букв. «он, в великом волнении, отступил, словно бы сильно испуганный). Автор «Широмани» полагает, что волнение Ханумана связано с тем, что он осознал, что величие Раваны будет уничтожено.", "service": [{"author": "Е. Костина", "lemma_iast": ".", "kind": "note", "text": "Мне кажется, если говорить про Широмани, то надо еще добавить, что Хануман из-за этого испытал сострадание, иначе можно подумать, что он в целом симпатизирует Раване"}], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "кат.2 — многозначность", "accounted": "", "text": "нага (nāga) — змей или слон? Значение зависит от контекста.", "incomplete": false}], "seq": 18}, {"id": "phase2:5.10.12:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "paramodvignaḥ … apāsarpat", "note_ru": "Причину смятения и отступления Ханумана «Тилака» и «Широмани» объясняют по-разному: по «Тилаке», Хануман испытывает не страх, а стыд — находиться рядом с похитителем Ситы кажется ему недостойным (khinnacitta); «Широмани» же связывает волнение с тем, что Хануман (предвидя грядущую гибель Раваны) чувствует к нему сострадание.", "type": "Б", "source_commentary": ["tilaka", "siromani"], "why_proposed": "разводит два разных психологических мотива одного и того же жеста (отступления Ханумана «словно бы в страхе») — подстрочник даёт только внешнее действие, не его подоплёку.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 19}]}, {"verse_id": "5.10.14", "verse": "14", "sanskrit_iast": "śuśubhe rākṣasendrasya svapataḥ śayanaṃ śubham । gandhahastini saṃviṣṭe yathāprasravaṇaṃ mahat ॥14॥", "leonov_ru": "С владыкой ракшасов, спящим на нем, было подобно великолепное ложе Горе Прасраване, когда на ней лежит слон, благоухающий [мадой].", "commentary": {"tilaka": "यस्य गन्धेनान्ये गजाः पलायन्ते स गन्धगजः मत्तगजेन नितरां संविष्टमधिष्ठितं महत्प्रस्रवणमिव\nमहात्मनो महाशरीरस्य । विक्षिप्तौ प्रसारितौ", "bhusana": "शुशुभे राक्षसेन्द्रस्य स्वपतः शयनोत्तमम् ।\n\nगन्धहस्तिनि संविष्टे यथा प्रस्रवणं महत्\nयस्य गन्धेनान्ये हस्तिनो भीता भवन्ति स गन्धहस्ती । प्रस्रवणं निर्झरम्", "siromani": "शुशुभे इति । स्वपतो राक्षसेन्द्रस्य शयनं गन्धहस्तिना संनिविष्टं प्रविष्टं प्रस्रवणं गिरिविशेष इव शुशुभे"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Словно на склоне Прасраваны (yathāprasravaṇaṃ mahat) – по мнению автора «Бхушаны», слово prasravaṇa здесь следует понимать не как имя собственное, в значении nirjhara (водопад), возможно, из-за того, что слово prasravaṇa употреблено здесь в среднем роде.Лежал повелитель ракшасов (śuśubhe rākṣasendrasya) – букв. «великолепное ложе повелителя ракшасов было подобно великой горе Прасраване (или «огромному водопаду»), на которой покоится слон, источающий маду».", "service": [], "suggestions": [], "seq": 20}, {"id": "lexical:5.10.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "prasravaṇa", "note_ru": "Прасраваная (prasravaṇa, m./n.) — «горный поток, источник; гора Прасрана» (геоним). MW: prasravaṇa 'flowing forth, a stream, spring; N. of a mountain'. В сравнении с Раваной, спящим на ложе: гора, на которой лежит слон. Pra-sravaṇa от pra+√sru- («течь вперёд»): «изливающийся» — гора, из которой бьют ключи, типичный пейзажный образ эпоса. В Рамаяне Prasravaṇa — конкретная гора в Кишкиндхе, где Рама и Лакшмана ждут Сугриву. Сравнение здесь может нести иронию: гора с текущими ключами — место связи Рамы — vs ложе Раваны.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:prasravaRa", "source_links": [{"label": "MW prasravaRa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=prasravaRa"}], "collision_tier1": true, "seq": 21}]}, {"verse_id": "5.10.16", "verse": "16", "sanskrit_iast": "airāvataviṣāṇāgrair āpīḍitakṛtavraṇau । vajrollikhitapīnāṃsau viṣṇucakraparikṣitau ॥16॥", "leonov_ru": "Были на них шрамы от ран, нанесенных в бою кончиками бивней [слона] Айраваты, Могучие плечи были рассечены [некогда] ваджрой и покрыты [следами от ран, нанесенных] диском Вишну.", "commentary": {"tilaka": "आपीडने युद्धे कृतव्रणौ कृतव्रणौ कृतव्रणकिणौ वज्रेणोल्लिखितौ क्षतौ पीनांसौ ययोस्तौ वज्रचक्रयोरप्यसाध्यमृत्युरिति भावः", "bhusana": "ऐरावतविषाणाग्रैरापीडनकृतव्रणौ ।\n\nवज्रोल्लिखितपीनांसौ विष्णुचक्रपरिक्षतौ", "siromani": "भुजावेव वर्णयन्नाह ऐरावतेति । ऐरावतविषाणाग्रैः आपीडने युद्धे कृतं व्रणं ययोस्तौ वज्रेण उल्लिखितौ प्राप्तक्षतौ पीनांसौ ययोः विष्णुचक्रेण परिक्षतौ युद्धे प्राप्तव्रणौ"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "vajrollikhita", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 22}, {"id": "lexical:5.10.16:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "viṣṇu", "note_ru": "Вишну (viṣṇu) — Вишну (viṣṇu «всепроникающий») — бог-хранитель; в «Тилаке» Рама интерпретируется как аватара Вишну, хотя сама поэма не делает этого акцента явно. Первое вхождение в кн. V. См. примеч. к I.16.1 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "base", "trigger": "realia", "source": "первое вхождение в кн. V; указатель Гринцера / комментаторы, где процитировано (привязка к стиху, нестрогая)", "source_links": [], "collision_tier1": true, "seq": 23}, {"id": "phase2:5.10.16:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vajracakrayor apy asādhyamṛtyuḥ", "note_ru": "По Тилаке, шрамы от бивня Айраваты, ваджры Индры и диска Вишну на плечах Раваны свидетельствуют не просто о былых битвах, а о том, что даже эти два оружия — ваджра и чакра — не смогли его убить (vajracakrayor apy asādhyamṛtyuḥ): раны зажили, а сам он неуязвим для высших богов.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "переводит перечень шрамов в утверждение о неуязвимости Раваны даже перед оружием Индры и Вишну — вывод, которого нет ни в подстрочнике, ни в помете Е. Костиной (та лишь отмечает пропуск слова vajrollikhita).", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 24}]}, {"verse_id": "5.10.20", "verse": "20", "sanskrit_iast": "uttamastrīvimṛditau gandhottamaniṣevitau । yakṣapannagagandharvadevadānavarāviṇau ॥20॥", "leonov_ru": "Обнимаемые (ласкаемые) лучшими женщинами, благоухающие наилучшим ароматом, Они заставляли кричать якшей, змей, гандхарвов, богов и данавов.", "commentary": {"tilaka": "उत्तमस्त्रीणां विमृदितं विमर्दनमालिङ्गनादि ययोस्तौ", "bhusana": "उत्तमस्त्री विमृदितौ गन्धोत्तमनिषेवितौ ।\n\nयक्षपन्नगगन्धर्वदेवदानवराविणौ", "siromani": "उत्तमस्त्रीभिः विमृदितौ शनैर्निपीडितौ यक्षादीनां राविणौ"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "И громкий вопль исторгать у обитателей неба (yakṣapannagagandharvadevadānavarāviṇau) – букв. «заставлявшие кричать якшей, змей, гандхарвов, богов и даванавов». Речь идет о победах, которые Равана одержал над небожителями.", "service": [], "suggestions": [], "seq": 25}, {"id": "lexical:5.10.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "yakṣa", "note_ru": "Якша (yakṣa, m.) — «якша», класс сверхъестественных существ. MW: yakṣa 'a kind of supernatural being (attendant esp. on Kubera); a ghost, spirit'. Этимология спорна: √yaj- («почитать») → yakṣa как «почитаемый» или же √yakṣ- (редкий глагол «блистать, спешить»). В эпосе якши противопоставлены ракшасам: якши — существа преимущественно благожелательные, связанные с природными богатствами и Куберой; ракшасы — людоеды и разрушители. Перечисление yakṣa, pannaga, gandharva, deva, dānava при описании страха перед руками Раваны — стандартный индийский «каталог миров», охватывающий весь спектр сакральных существ.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:yakza", "source_links": [{"label": "MW yakza", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=yakza"}], "collision_tier1": true, "seq": 26}]}, {"verse_id": "5.10.21", "verse": "21", "sanskrit_iast": "dadarśa sa kapis tasya bāhū śayanasaṃsthitau । mandarasyāntare suptau mahāhī ruṣitāv iva ॥21॥", "leonov_ru": "Увидела обезьяна его (Раваны) обе руки, лежащие на ложе, Которые были подобны двум огромным разгневанным змеям в горе Мандаре (в пещере на горе Мандаре).", "commentary": {"bhusana": "ददर्श स कपिस्तस्य बाहू शयनसंस्थितौ ।\n\nमन्दरस्यान्तरे सुप्तौ महाही रूषिताविव", "siromani": "मन्दरस्यान्तरे सुप्तौ रुषितौ क्रुद्धौ महाही इव शयनसंस्थितौ तस्य रावणस्य बाहू कपिर्ददर्श । श्लोकषट्कमेकान्वयि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Лежали на ложе руки (bāhū śayanasaṃsthitau) – автор «Тилаки» делает вывод, что десять голов и двадцать рук появлялись у Раваны только во время битвы.", "service": [{"author": "Е. Костина", "lemma_iast": "", "kind": "note", "text": "В комм. Надо добавить, что в оригинале двойственное число. Или можно переместить его в комм. к стиху 22, где есть конкретное указание ubhābhyāṃ"}, {"author": "Е. Костина", "lemma_iast": "suptau", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 27}]}, {"verse_id": "5.10.22", "verse": "22", "sanskrit_iast": "tābhyāṃ sa paripūrṇābhyāṃ ubhābhyāṃ rākṣaseśvaraḥ । śuśubhe 'calasaṃkāśaḥ śṛṅgābhyām iva mandaraḥ ॥22॥", "leonov_ru": "С теми двумя совершенными (длинными и округлыми) обеими [руками] владыка ракшасов Был подобен горе Мандаре с двумя пиками.", "commentary": {"bhusana": "ताभ्यां स परिपूर्णाभ्यां भुजाभ्यां राक्षसेश्वरः ।\n\nशुशुभे ऽचलसङ्काशः शृङ्गाभ्यामिव मन्दरः\nताभ्यामिति । परिपूर्णाभ्याम् दीर्घवृत्ताभ्यामित्यर्थः", "siromani": "ताभ्यामिति । परिपूर्णाभ्यां सल्लक्षणैर्युक्ताभ्यामुभाभ्यां भुजाभ्यामचलसंकाशो राक्षसेन्द्रः शृङ्गाभ्यां मन्दर इव शुशुभे"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.22:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "С руками, округлыми и длинными (tābhyāṃ sa paripūrṇābhyāṃ) – автор «Широмани» толкует этот композит как «с обладающими благими знаками» (sallakṣaṇair yuktābhyām).", "service": [], "suggestions": [], "seq": 28}]}, {"verse_id": "5.10.23", "verse": "23", "sanskrit_iast": "cūtapuṃnāgasurabhir bakulottamasaṃyutaḥ । mṛṣṭānnarasasaṃyuktaḥ pānagandhapuraḥsaraḥ ॥23॥", "leonov_ru": "С ароматом манго и пуннаги, соединенное с великолепной бакулой, Соединенное с запахом вкусной еды и ароматом вина,", "commentary": {"bhusana": "चूतपुन्नागसुरभिर्वकुलोत्तमसंयुतः ।\n\nमृष्टान्नरससंयुक्तः पानगन्धपुरस्सरः", "siromani": "चूतेति । चूतपुन्नागसुरभिः चूतपुन्नागसुरभिसदृशसुरभिविशिष्टः बकुलोत्तमसंयुतः उत्तमबकुलगन्धमिश्रः मृष्टान्नरससंयुक्तः मृष्टान्नरसगन्धविशिष्टः पानगन्धः सुरादिसुरभिः पुरस्सरो यस्य स राक्षसराजस्य विनिःश्वासः राक्षसराजस्य मुखात् निश्चक्राम । श्लोकद्वयमेकान्वयि ।। 5.10.23,24 ।।\n\nमुक्तेति । काञ्चनेन स्वर्णमयेन विराजता शोभमानेन अपवृत्तेन परिवर्तनादिना विपर्यस्तेन सुकुटेनोपलक्षितं कुण्डलाभ्यामुज्ज्वलितमाननं यस्य"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.23:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…ароматными винами (pānagandhapuraḥsaraḥ) – в «Тилаке» слово pāna (питье) глоссируется как surā (вино).", "service": [], "suggestions": [], "seq": 29}, {"id": "lexical:5.10.23:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "punnāga", "note_ru": "Пуннага (punnāga, m.) — «пуннага», дерево Calophyllum inophyllum (или Rottleria tinctoria — идентификация в источниках расходится). MW: punnāga 'a kind of tree with fragrant flowers'. Цветки пуннаги — белые, интенсивно ароматные, используются в гирляндах и дворцовых воскурениях. В индийской парфюмерной традиции māṃsa (аромат мяса пуннаги) — один из 8 стандартных природных парфюмов. Описание аромата покоев Раваны включает cūta (манго), punnāga и bakula — триада «тропических белых» ароматов. Подстрочник даёт транслитерацию без ботанического комментария.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:punnAga", "source_links": [{"label": "MW punnAga", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=punnAga"}], "collision_tier1": true, "seq": 30}]}, {"verse_id": "5.10.25", "verse": "25", "sanskrit_iast": "muktāmaṇivicitreṇa kāñcanena virājatā । mukuṭenāpavṛttena kuṇḍalojjvalitānanam ॥25॥", "leonov_ru": "Сияло серьгами лицо [Раваны] со сбившейся короной, Которая была расцвечена жемчугами, золотом блистала.", "commentary": {"bhusana": "चूतेत्यादि । निःश्वासस्य चूतादिसुरभित्वं तदधिवासितरसावल्यादिमधुसेवनात् । मृष्टान्नरससंयुक्तः षड्सपदार्थगन्धयुक्तः । पानगन्धपुरस्सरः पीयत इति पानं मधु तद्गन्धयुक्तः ।। 5.10.23,24।।\n\nमुक्तामणिविचित्रेण काञ्चनेन विराजितम् ।\n\nमकुटेनापवृत्तेन कुण्डलोज्ज्वलिताननम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "phase2:5.10.25:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "pānagandhapuraḥsaraḥ", "note_ru": "По Бхушане, благоухание манго, пуннаги и бакулы в дыхании спящего Раваны (5.10.23) объясняется не природным свойством, а тем, что он пил медовое вино, настоянное на этих плодах (tadadhivāsitarasāvalyādimadhusevanāt); аромат дыхания — след пиршества, а не телесная данность.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "объясняет механизм благоухания дыхания (выпитое ароматное вино), тогда как подстрочник просто перечисляет ароматы, не поясняя их источник; готовит контраст со следующим по стиху 5.10.30 толкованием Катаки.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 31}]}, {"verse_id": "5.10.28", "verse": "28", "sanskrit_iast": "māṣarāśipratīkāśaṃ niḥśvasantaṃ bhujaṅgavat । gāṅge mahati toyānte prasutamiva kuñjaram ॥28॥", "leonov_ru": "Подобный [цветом] груде черных бобов, дышащий подобно [шипящей] змее, Был он подобен слону, уснувшему в глубоких водах Ганга.", "commentary": {"tilaka": "तोयान्ते तोयमध्ये", "bhusana": "माषराशिप्रतीकाशं निःश्वसन्तं भुजङ्गवत् ।\n\nगाङ्गे महति तोयान्ते प्रसुप्तमिव कुञ्जरम्", "siromani": "माषराशिप्रतीकाशं हरितनीलवर्णत्वेन माषराशिसदृशं भुजङ्गवत् निःश्वसन्तं गाङ्गे गङ्गासंबन्धिनि महति तोयान्ते कुञ्जरमिव प्रसुप्तम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.28:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "mahati", "kind": "omission", "text": "опущено"}], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "термин", "accounted": "не учтено", "text": "Первое появление в кн. V; введено в :", "incomplete": true}], "seq": 32}, {"id": "tier1:5.10.28:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Дышал он змеиным шипом (niḥśvasantaṃ bhujaṅgavat) – ср. со строфой 12.", "service": [], "suggestions": [], "seq": 33}, {"id": "lexical:5.10.28:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "māṣarāśi", "note_ru": "Машараши (māṣa-rāśi, m.) — «груда чёрных бобов (Vigna mungo)», тат-пуруша. MW: māṣa 'a bean (Phaseolus radiatus)'; rāśi 'a heap, pile'. Māṣa — специфически чёрные бобы (Vigna mungo), отличающиеся матово-чёрным цветом. Сравнение цвета кожи Раваны с māṣarāśi — насыщенно-чёрный с матовым отливом, не синеватый («лотосовый» цвет Вишну/Рамы) и не серый. Это поэтически точная колористика: ракшасский «чёрный» vs вишнуитский «тёмно-синий» — два разных оттенка тёмности с противоположными коннотациями.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:mAza+dic_mw:rASi", "source_links": [{"label": "MW mAza", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=mAza"}, {"label": "MW rASi", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=rASi"}], "collision_tier1": true, "seq": 34}]}, {"verse_id": "5.10.30", "verse": "30", "sanskrit_iast": "pādamūlagatāś cāpi dadarśa sumahātmanaḥ । patnīḥ sa priyabhāryasya tasya rakṣaḥpater gṛhe ॥30॥", "leonov_ru": "А также увидел [Хануман] жен у стоп [Раваны] В доме того владыки ракшасов, великого духом, любящего своих жен,", "commentary": {"tilaka": "ददर्शात्यादरेण ददर्श नातः पुनरुक्तिः महाही महासर्पौ अत्र द्विभुजत्वकथनाद्युद्धादिकाल एव विंशतिभुजत्वं दशशीर्षत्वं चेति बोध्यम् ।। 5.10.21,22 ।।\n\nबकुलोत्तमसंयुत उत्तमबकुलगन्धयुतः । अयं पुरुषविशेषश्वासधर्म इति कतकः । चूतादिसुरभित्वं तु तदधिवासितवस्तुसेवनात् । मृष्टान्नरससंयुक्तः षड्रसोत्तमान्नगन्धोपेतः पानं मधु राक्षसत्वादेव वामाचारेण पूजाकरणान्मधुपानम् ।। 5.10.23,24 ।।\n\nअपवृत्तेन निद्रावशात्पर्यस्तेन विराजता मुकुटेन उपलक्षितमिति शेषः । शोभिना हारेण शोभनहारवता वक्षसोपलक्षितमिति शेषः ।। 5.10.25,26 ।।\n\nअपविद्धेन पर्यस्तेन पाण्डुरेण क्षौमेण परिधानीयेन कटेरधः संवीतम् पीतेनोत्तरीयेण सुसंवीतमित्यर्थः\nउक्तगुणं रावणं ददर्श पादमूलगास्तत्पत्नीश्च ददर्श । रक्षःपतेर्गृह इत्युत्तरान्वयि", "bhusana": "पादमूलगताश्चापि ददर्श सुमहात्मनः ।\n\nपत्नीः स प्रियभारयस्य तस्य रक्षःपतेर्गृहे"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "sumahātmanaḥ", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 35}, {"id": "phase2:5.10.30:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "puruṣaviśeṣaśvāsadharmaḥ", "note_ru": "К толкованию Бхушаны (благоухание дыхания — след выпитого пряного вина, ср. 5.10.25) «Тилака» приводит и другое мнение — Катаки: сладкое дыхание есть врождённое свойство великих людей (puruṣaviśeṣaśvāsadharmaḥ), а не следствие возлияний; сам же обычай пить вино Тилака объясняет как часть ракшасского «левого» культового обихода (vāmācāra).", "type": "В", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "контрастирует два объяснения благоухания дыхания (следствие вина по Бхушане vs врождённая черта великих людей по Катаке) и добавляет доктринальную рамку ракшасского вамачарного культа — ничего из этого ни в подстрочнике, ни в помете Е. Костиной («sumahātmanaḥ — опущено») нет.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 36}]}, {"verse_id": "5.10.31", "verse": "31", "sanskrit_iast": "śaśiprakāśavadanā varakuṇḍalabhūṣaṇāḥ । amlānamālyābharaṇā dadarśa hariyūthapaḥ ॥31॥", "leonov_ru": "Чьи лица были подобны луне, украшенных превосходными серьгами, В гирляндах из свежих цветов увидел вождь обезьяньих стай.", "commentary": {"siromani": "सप्रियभार्यस्य प्रियभार्यासहितस्य पत्नीश्च रक्षःपतेग्रृहे स्थितो हनूमान् ददर्श । श्लोकषट्कमेकान्वयि\nपत्नीरेव वर्णयन्नाह शशीति । कपिर्ददर्श", "tilaka": "अम्लानमाल्याभरणाः देवकन्या इत्यर्थः", "bhusana": "शशिप्रकाशवदनाश्चारुकुण्डलभूषिताः ।\n\nअम्लानमाल्याभरणा ददर्श हरियूथपः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.31:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "hariyūthapaḥ", "kind": "omission", "text": "опущено, но не критично"}], "suggestions": [], "seq": 37}, {"id": "phase2:5.10.31:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "amlānamālyābharaṇāḥ", "note_ru": "«Тилака» поясняет: женщины «в гирляндах немеркнущих (amlānamālyābharaṇāḥ)» — это не смертные наложницы, а небесные девы (devakanyāḥ), чей неувядающий убор служит знаком их божественной природы.", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "раскрывает сверхъестественный статус женщин через примету неувядающих гирлянд — подстрочник и помета Е. Костиной («hariyūthapaḥ — опущено, но не критично») этого отождествления не дают.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 38}]}, {"verse_id": "5.10.34", "verse": "34", "sanskrit_iast": "tāsāṃ candropamair vaktraiḥ śubhalalitakuṇḍalaiḥ । virarāja vimānaṃ tan nabhas tārāgaṇair iva ॥34॥", "leonov_ru": "Их луноподобными лицами с прекрасными покачивающимися серьгами Озарен был дворец тот, словно небо – сонмом звезд.", "commentary": {"tilaka": "विमानं मञ्चकविशेषः । पुष्पकमित्यन्ये विराजत व्यराजत", "bhusana": "तासां चन्द्रोपमैर्वक्त्रैः शुभैर्ललितकुण्डलैः ।\n\nविरराज विमानं तन्नभस्तारागणैरिव", "siromani": "तासामिति । ललितानि कुण्डलानि येषु तैः वक्त्रैः विमानं पर्यङ्खविशेषः तारागणैर्नभ इव विराजत व्यराजत"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.34:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Был озарен дворец (virarāja vimānaṃ) – по мнению автора «Тилаки», словом vimāna обозначается ложе (mañcaka). Также он приводит мнение других комментаторов, согласно которому речь здесь идет о вимане Пушпаке. В комментарии «Широмани» слово vimāna также глоссируется как «ложе» (paryaṅka).", "service": [], "suggestions": [], "seq": 39}]}, {"verse_id": "5.10.35", "verse": "35", "sanskrit_iast": "madavyāyāmakhinnās tā rākṣasendrasya yoṣitaḥ । teṣu teṣv avakāśeṣu prasuptās tanumadhyamāḥ ॥35॥", "leonov_ru": "Утомленные любовными усилиями, те женщины владыки ракшасов При той или этой возможности уснули, стройные.", "commentary": {"tilaka": "मदव्यायामेन रतिजेन", "bhusana": "मदव्यायामखिन्नास्ता राक्षसेन्द्रस्य योषितः ।\n\nतेषु तेष्ववकाशेषु प्रसुप्तास्तनुमध्यमाः", "siromani": "मदेति । मदव्यायामेन मदवृद्या तद्धेतुकातिरत्येत्यर्थः, खिन्नाः प्राप्तपीडाः योषितः तेषु तेषु अन्यसङ्गमहेतुकेषु अवकाशेषु प्रसुप्ता बभुवुरिति शेषः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.35:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Уснули там, где и были (teṣu teṣv avakāśeṣu) – Голдмены переводят «during the pauses in their lovemaking» (см.: Goldman 1984: 137).", "service": [{"author": "Е. Костина", "lemma_iast": "", "kind": "note", "text": "Мне кажется, в комм надо пояснить, почему Голдманы так переводят."}], "suggestions": [], "seq": 40}]}, {"verse_id": "5.10.36", "verse": "36", "sanskrit_iast": "aṅgahārais tathaivānyā komalair nṛtyaśālinī । vinyastaśubhasarvāṅgī prasuptā varavarṇinī ॥36॥", "leonov_ru": "И вот одна прекрасная танцовщица с нежными жестами, Уснула, раскинувшись всем своим прекрасным телом.", "commentary": {"siromani": "नृत्येति । निषण्णाः पत्नयो ददृशे समुदायस्य कर्मतया अन्वयात् न द्वितीया\nअङ्गेति । विन्यस्तानि विधिना निर्मितानि संस्थापितानि वा शुभान्यङ्गानि यस्याः सा कोमलैरङ्गहारैरुपलक्षिता प्रसुप्ता अन्या नृत्यनिपुणा योषित् नृत्यशालिनी जाग्रद्वासनावशात् नृत्याश्रयीभूता प्रतीता ऽभवदिति शेषः", "tilaka": "कोमलैरकर्कशैः अङ्गहारैरङ्गविक्षेपैः नृत्यशालिनीति वासनाबलेन नृत्याभिनयोपेततया सुप्तवतीत्यर्थः । विशेषेण न्यस्तं शुभं येषु धात्रा तादृशानि सर्वाण्यङ्गानि यस्याः", "bhusana": "अङ्गहारैस्तथैवान्या कोमलैर्नृत्तशालिनी ।\n\nविन्यस्तशुभसर्वाङ्गी प्रसुप्ता वरवर्णिनी\nअङ्गहारः नृत्तविशेषादङ्गविक्षेपविशेषः । तथोक्तं भरतशास्त्रे \"अङ्गानां योग्यदेशेषु हरणेन यथोचितम् । अङ्गनिर्वर्तनीयत्वादङ्गहारस्तथोच्यते ।।\" इत्यादि। कोमलैः सुकुमारैः। नृत्तशालिनी सुषुप्त्यवस्थायामपि वासनाबलेन नृत्तसन्निवेशविशिष्टा स्थितेत्युच्यते"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "phase2:5.10.36:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "nṛtyaśālinī … vāsanābalena", "note_ru": "По Тилаке и Широмани, уснувшая танцовщица кажется всё ещё танцующей не потому, что видит танец во сне, а в силу васаны — укоренившегося телесного навыка (vāsanābalena nṛtyābhinayopapattatayā), который продолжает действовать даже без сознательного участия; Бхушана добавляет определение самого термина «ангахара» по «Бхараташастре».", "type": "Б", "source_commentary": ["tilaka", "siromani"], "why_proposed": "вводит доктринальное понятие васаны (телесной привычки, действующей помимо воли и сознания) как объяснение образа спящей танцовщицы — подстрочник передаёт только сам образ, без его психологического механизма.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 41}, {"id": "edition:5.10.36:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.10.36 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.10.36", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.10.36", "iast": "aṅgahārais tathaivānyā komalair nṛtyaśālinī । vinyastaśubhasarvāṅgī prasuptā varavarṇinī ॥36॥"}], "seq": 42}]}, {"verse_id": "5.10.37", "verse": "37", "sanskrit_iast": "kā cid vīṇāṃ pariṣvajya prasuptā saṃprakāśate । mahānadīprakīrṇeva nalinī potam āśritā ॥37॥", "leonov_ru": "Некая [женщина], обняв вину, уснувшая, была подобна Цветку лотоса, попавшему в бурную реку и прибившемуся к лодке.", "commentary": {"tilaka": "महानदीप्रकीर्णा महानद्यां प्रकीर्णपुष्पपत्रा दैवात्सङ्गतं पोतं प्लवमाश्रिता नलिनी पद्मिनीव । पोतस्थाने ऽत्र वीणा", "bhusana": "काचिद्वीणां परिष्वज्य प्रसुप्ता संप्रकाशते ।\n\nमहानदीप्रकीर्णेव नलिनी पोतमाश्रिता\nकाचिद्वीणामिति । महानदीप्रकीर्णा महानदीप्रसृता । नलिनी समूलनालदलं पद्मजालकम् । पोतं यानपात्रम् । वीणां परिष्वज्य प्रसुप्ता काचित् नद्यां प्लवमाना यदृच्छया पोतसंयुक्ता नलिनीव प्रकाशत इत्यर्थः", "siromani": "काचिदिति । वीणां परिष्वज्य प्रसुप्ता काचित् योषित् महानदीप्रकीर्णा महानद्यां प्रक्षिप्ता पोतमाश्रिता अकस्मात् नौकासंनिहिता नलिनी कमलिनीव संप्रकाशते"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "lexical:5.10.37:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vīṇā", "note_ru": "Вина (vīṇā, f.) — «вина», струнный инструмент; MW: vīṇā 'a lute (in later times a lute with 7 strings and a fret-board with 24 frets)'. Иконографически и мифологически: vīṇā — атрибут Сарасвати (богини учёности и искусств) и Нарады. Спящая женщина, обнявшая vīṇā «подобно любовнику», — стандартная поэтическая сцена в придворной литературе (ср. Kāmasūtra описания разлуки); инструмент заменяет отсутствующего мужа. Этот образ — один из повторяющихся в сцене гарема Раваны (10.37, 10.40). Эротически-музыкальный мотив подстрочником передаётся, но культурная связь vīṇā с женским одиночеством не видна.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vIRA", "source_links": [{"label": "MW vIRA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=vIRA"}], "seq": 43}]}, {"verse_id": "5.10.38", "verse": "38", "sanskrit_iast": "anyā kakṣagatenaiva maḍḍukenāsitekṣaṇā । prasuptā bhāminī bhāti bālaputreva vatsalā ॥38॥", "leonov_ru": "Другая, черноглазая, рядом барабаном-маддукой Уснувшая красавица была подобна любящей матери со своим младенцем.", "commentary": {"tilaka": "मड्डुको वाद्यभेदः", "bhusana": "अन्या कक्षगतेनैव मड्डुकेनासितेक्षणा ।\n\nप्रसुप्ता भामिनी भाति बालपुत्रेव वत्सला\nमड्डुकेन वाद्यविशेषेण ।। 5.10.38,39।।\n\nकाचिद्वंशं परिष्वज्य सुप्ता कमललोचना ।\n\nरहः प्रियतमं गृह्य सकामेव च कामिनी\nकाचिद्वंशमिति । वंशं वेणुम्", "siromani": "अन्येति । अन्या कक्षगतेन मड्डुकेन वाद्यभेदेन बालपुत्रा बालपुत्रसहितेव भाति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "lexical:5.10.38:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bhāminī", "note_ru": "Прекрасная / гневная (bhāminī) — bh āminī двузначно: «прекрасная женщина» и «гневливая (женщина)». Контекст определяет выбор; подстрочник может выбрать один из оттенков.", "type": "Б", "subtype": "base", "trigger": "term", "source": "первое вхождение в кн. V; указатель Гринцера / комментаторы, где процитировано (привязка к стиху, нестрогая)", "source_links": [], "seq": 44}]}, {"verse_id": "5.10.40", "verse": "40", "sanskrit_iast": "kā cid vīṇāṃ pariṣvajya suptā kamalalocanā । varaṃ priyatamaṃ gṛhya sakāmeva hi kāminī ॥40॥", "leonov_ru": "Одна лотосоглазая спала, обняв вину, Словно влюбленная женщина – прижав к себе любимого мужа.", "commentary": {"tilaka": "काचिदिति", "siromani": "काचिदिति । काचित् प्रियतमं गृह्य गृहीत्वा सकामा कामिनीव वीणां परिष्वज्य सुप्ता"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.40:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "кат.1 — буквальный перевод", "accounted": "", "text": "padmākṣa — букв. «с глазами-лотосами»", "incomplete": false}], "seq": 45}]}, {"verse_id": "5.10.41", "verse": "41", "sanskrit_iast": "vipañcīṃ parigṛhyānyā niyatā nṛtyaśālinī । nidrāvaśam anuprāptā sahakānteva bhāminī ॥41॥", "leonov_ru": "Обхватив лютню-випанчи, обуздавшая себя, искусная в танце Женщина, попавшая во власть сна, словно с возлюбленным.", "commentary": {"tilaka": "विपञ्ची वीणाविशेषः ।। 5.10.41,42 ।।\n\nमदकृतश्रमा मदवती अर्शआद्यच् । वादनेन कृतश्रमा च", "bhusana": "विपञ्चीमिति । विपञ्ची सप्ततन्त्री । षट्तन्त्री वीणा ।। 5.10.41,42 ।।\n\nभुजपार्श्वान्तरस्थेन कक्षगेन कृशोदरी ।\n\nपणवेन सहानिन्द्या सुप्ता मदकृतश्रमा\nभुजेति । पणवेन मर्दलेन\nविपञ्चीं परिगृह्यान्या नियता नृत्तशालिनी ।\n\nनिद्रावशमनुप्राप्ता सहकान्तेव भामिनी", "siromani": "विपञ्चीमिति । काचित् भामिनी विपञ्चीं वीणाविशेषं परिगृह्य सहकान्तेव निद्रावशं प्राप्ता"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "lexical:5.10.41:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vipañcī", "note_ru": "Випанчи (vipañcī, f.) — особая разновидность лютни. MW: vipañcī 'a lute of a particular kind (having 9 strings, played with a plectrum)'. В отличие от стандартной vīṇā, vipañcī — концертный инструмент с 9 струнами и медиатором (daṇḍa); упоминается в нескольких класс. текстах как «придворная» vīṇā. Вторичное вхождение музыкального инструмента в той же сцене — детальность описания гарема, которая разграничивает инструменты терминологически. Подстрочник «лютня-випанчи» даёт правильную транслит. без технического комментария.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vipaNcI", "source_links": [{"label": "MW vipaNcI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=vipaNcI"}], "seq": 46}]}, {"verse_id": "5.10.44", "verse": "44", "sanskrit_iast": "ḍiṇḍimaṃ parigṛhyānyā tathaivāsaktaḍiṇḍimā । prasuptā taruṇaṃ vatsam upagūhyeva bhāminī ॥44॥", "leonov_ru": "Другая, обхватив барабан-диндиму, с другим барабаном-диндимой за спиной, Спала, словно женщина, обнявшая [одновременно] возлюбленного и сына.", "commentary": {"tilaka": "डिण्डिमं परिगृह्यालिङ्ग्य । आसक्तडिण्डिमा पृष्ठदेशसंबद्धान्यडिण्डिमा । तरुणं रमणं वत्सं पुत्रं च परिगृह्य प्रसुप्तेव", "bhusana": "डिण्डिमं परिगृह्यान्या तथैवासक्तडिण्डिमा ।\n\nप्रसुप्ता तरुणं वत्समुपगुह्येव भामिनी\nडिण्डिममिति । यथा पूर्वा तथैवासक्तडिण्डिमा अन्या तं डिण्डिमं परिगृह्य परिष्वज्य प्रसुप्ता । कथमिव? तरुणं वत्समुपगुह्येव । डिण्डिमः पणवभेदः । यद्वा अन्या भामिनी डिण्डिमं परिगृह्यावलम्ब्य तथैव आसक्तडिण्डिमा आलिङ्गितान्यडिण्डिमा तरुणं रमणमुपगुह्य वत्सं पुत्रं परिगृह्येव प्रसुप्ता । यद्वा डिण्डिमं परिगृह्य वादनार्थं परिगृह्य तथैव वादनकाल एव आसक्तडिण्डिमा अन्या तरुणं वत्समुपगुह्येव प्रसुप्ता", "siromani": "डिण्डिममिति । आसक्तडिण्डिमा अन्या तरुणं वत्समुपगूह्येव डिण्डिमं परिगृह्य प्रसुप्ता"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.44:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "С диндимой второй за спиною (tathaivāsaktaḍiṇḍimā) – в «Тилаке» композит āsaktaḍiṇḍimā поясняется как «та, у которой другая диндима прикреплена к спине» (pṛṣṭhadeśasambaddhānyaḍiṇḍimā).", "service": [], "suggestions": [], "seq": 47}]}, {"verse_id": "5.10.45", "verse": "45", "sanskrit_iast": "kā cid āḍambaraṃ nārī bhujasaṃbhogapīḍitam । kṛtvā kamalapatrākṣī prasuptā madamohitā ॥45॥", "leonov_ru": "Некая женщина, барабан-адамбару сжав в объятиях, Спала, лотосоглазая, опьяневшая от вина.", "commentary": {"tilaka": "आडम्बरं वाद्यभेदः । भुजसंभोगेन भुजाश्लेषेण पीडितमाश्लिष्टं कृत्वा", "bhusana": "काचिदाडम्बरं नारी भुजसंयोगपीडितम् ।\n\nकृत्वा कमलपत्राक्षी प्रसुप्ता मदमोहिता\nकाचिदिति । आडम्बरं तूर्यभेदम् । भुजसंभोगपीडितं भुजपरिणाहपीडितम् । भुजपरिश्लेषपीडितं वा", "siromani": "काचिदिति । काचिन्नारी आडम्बरं वाद्यविशेषं भुजसंभोगेन भुजालिङ्गनेन पीडितं कृत्वा प्रसुप्ता"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.45:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Опьянев от вина (madamohitā) – также можно понять и как «помраченная страстью».", "service": [], "suggestions": [], "seq": 48}]}, {"verse_id": "5.10.52", "verse": "52", "sanskrit_iast": "gaurīṃ kanakavarṇābhām iṣṭām antaḥpureśvarīm । kapir mandodarīṃ tatra śayānāṃ cārurūpiṇīm । sa tāṃ dṛṣṭvā mahābāhur bhūṣitāṃ mārutātmajaḥ ॥52॥", "leonov_ru": "Смуглую, сияющую цветом золота, желанную владычицу внутренних покоев Обезьяна [увидела] там Мандодари лежащую (спящую), прекрасную обликом. Увидев ее, украшенную, долгорукий сын ветра", "commentary": {"bhusana": "गौरीं कनकवर्णाङ्गीमिष्टामन्तः पुरेश्वरीम् ।\n\nकपिर्मन्दोदरीं तत्र शयानां चारुरूपिणीम्\nस तां दृष्ट्वा महाबाहुर्भूषितां मारुतात्मजः ।\n\nतर्कयामास सीतेति रूपयौवनसम्पदा\nकिमिव गौरीमित्यत्राह कनकवर्णाङ्गीमिति । इष्टाम्, रावणस्येति शेषः ।। 5.10.52,53।।\n\nहर्षेण महता युक्तो ननन्द हरियूथपः\nहर्षेणेत्यर्धम् । हर्षेण युक्तः ननन्द उत्तरोत्तरमानन्दमवापेत्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "tier1:5.10.52:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "gaurīṃ", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 49}, {"id": "lexical:5.10.52:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mandodarī", "note_ru": "Мандодари (mandodarī) — главная супруга Раваны (mandodarī «тонкостанная»), спящую красоту которой Хануман сперва принимает за Ситу. Дочь асура Майи; в традиции — образец добродетельной жены при злом муже. Подстрочник лишь транслитерирует имя; узнавание-ошибка Ханумана — важный сюжетный мотив. Первое появление персонажа.", "type": "В", "subtype": "base", "trigger": "realia", "source": "указатель имён и названий (анализ §09б / формулы тт. 1–2) — первое вхождение в кн. V (привязка к стиху, нестрогая)", "source_links": [], "collision_tier1": true, "seq": 50}, {"id": "lexical:5.10.52:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "antaḥpureśvarī", "note_ru": "Антахпурешвари (antaḥpura-īśvarī, f.) — «владычица внутренних покоев», тат-пуруша: antaḥpura «внутренние покои» (букв. «город внутри») + īśvarī (f. от īśvara, «господин, властелин»). MW: antaḥpura 'the female apartments, gynaeceum'. Antaḥpura — технический термин для женской половины дворца, куда вход мужчинам запрещён (за исключением евнухов и царя). Antaḥpureśvarī = первая жена / главная царица. Здесь — Мандодари, которую Хануман принимает за Ситу: ошибка идентификации строится на том, что она действительно «главная» — её статус виден через этот составной титул. Подстрочник «владычица внутренних покоев» точен; термин antaḥpura как специальный институт не виден.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:antaHpura+dic_mw:ISvarI", "source_links": [{"label": "MW antaHpura", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=antaHpura"}, {"label": "MW ISvarI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ISvarI"}], "collision_tier1": true, "seq": 51}]}, {"verse_id": "5.10.53", "verse": "53", "sanskrit_iast": "tarkayām āsa sīteti rūpayauvanasampadā । harṣeṇa mahatā yukto nananda hariyūthapaḥ ॥53॥", "leonov_ru": "Подумал: «Это Сита», [так как] была она наделена красотой и молодостью. В великом волнении возрадовался вождь обезьяньих стай.", "commentary": {"tilaka": "तर्कयामास संभावयामास । पृथगेकान्ते परममञ्चे ऽतिरूपाया दर्शनात्प्रायेणेयं सीतेति संभावना हनूमतः । तदेवाह-- रूपयौवनसंपदा न त्वौचित्यालोचनं कृतवानिति भावः । हर्षो मुखविकासादिः आनन्दो मानसः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "phase2:5.10.53:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "na tv aucityālocanaṃ kṛtavān", "note_ru": "«Тилака» указывает на изъян в умозаключении Ханумана: приняв спящую женщину за Ситу, тот исходил лишь из её красоты и молодости (rūpayauvanasampadā), «не рассуждая о том, уместно ли это» (na tv aucityālocanaṃ kṛtavān) — то есть не задумался, могла бы Сита оказаться в подобном месте и виде.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "вскрывает поспешность и невнимательность суждения Ханумана как таковую (комментаторская критика персонажа) — подстрочник передаёт лишь сам вывод «это Сита», не отмечая его шаткое основание.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 52}]}, {"verse_id": "5.10.54", "verse": "54", "sanskrit_iast": "āsphoṭayām āsa cucumba pucchaṃ । nananda cikrīḍa jagau jagāma । stambhān arohan nipapāta bhūmau । nidarśayan svāṃ prakṛtiṃ kapīnām ॥54॥", "leonov_ru": "Хлопал он в ладоши, целовал свой хвост, Радовался, резвился, пел, ходил, Забираясь на колонны, спрыгивал на пол, Показывал свою обезьянью природу.", "commentary": {"tilaka": "आरोहणं सोपानम् । वेदिकान्तरं सोपानवेदिकान्तरं सोपानपर्वमध्यम्\nआनन्दं कार्यद्वाराह-- आस्फोटयामासेति । आस्फोटपुच्छचुम्बनादि जातिधर्मः । जगाम स्तम्भानित्यनुकर्षः । सर्वा अप्येताश्चेष्टा उपांश्विति बोध्यम् । एवं चेष्टायां हेतुः स्वां कपीनां प्रकृतिं निदर्शयन्निति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-10", "notes": [{"id": "phase2:5.10.54:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sarvā apy etāś ceṣṭā upāṃśv iti bodhyam", "note_ru": "По Тилаке, все радостные выходки Ханумана — хлопки, поцелуй хвоста, пляска, беготня по столбам — следует понимать как совершённые беззвучно (upāṃśu): несмотря на восторг, он по-прежнему остерегается быть услышанным во вражеском дворце.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "снимает кажущееся противоречие между бурной радостью Ханумана и необходимостью хранить тайну лазутчика — подстрочник описывает лишь сами действия, не их скрытный характер.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 53}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

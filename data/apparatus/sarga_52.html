нятие дипломатической неприкосновенности как правового принципа.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:dOtya"}]}, {"verse_id": "5.52.4", "verse": "4", "sanskrit_iast": "niścitārthas tataḥ sāmnā pūjya śatrujid agrajam । uvāca hitam atyarthaṃ vākyaṃ vākyaviśāradaḥ ॥4॥", "leonov_ru": "Принявший решение, от чистого сердца отказав почтение старшему брату, победитель врагов, В речах искусный (Вибхишана) сказал слова полезные, наделенные смыслом.", "commentary": {"bhusana": "निश्चितार्थस्ततः साम्ना ऽ ऽपूज्य शत्रुजिदग्रजम् ।\n\nउवाच हितमत्यर्थं वाक्यं वाक्यविशारदः\nनिश्चितार्थ इति । आपूज्येति च्छेदः", "siromani": "निश्चितेति । निश्चितः अर्थो येन सः शत्रुजिद्विभीषणः पूज्यमग्रजम् अत्यर्थमत्यन्तं हितं वाक्यं साम्ना सामरूपोपायेन उवाच"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Многочтимому брату (pūjyaṃ... agrajam) - также встречается вариант pūjya. В этом случае перевод будет “успокивающе почтив брата...” (sāmnā pūjya... agrajam)."}]}, {"verse_id": "5.52.5", "verse": "5", "sanskrit_iast": "kṣamasva roṣaṃ tyaja rākṣasendra । prasīda madvākyam idaṃ śṛṇuṣva । vadhaṃ na kurvanti parāvarajñā । dūtasya santo vasudhādhipendrāḥ ॥5॥", "leonov_ru": "«Будь терпеливым (снисходительным), отбрось гнев, о владыка ракшасов, Милостиво выслушай мои слова. Не убивают послов знающие далекое и близкое (правильное и неправильное) Праведные владыки владык земли.", "commentary": {"siromani": "रावणं प्रति विभीषणोक्तिं वर्णयितुं प्रसङ्गमुत्थापयन्नाह स इति । तस्य हनूमतः वचनं श्रुत्वा क्रोधमूर्छितो रावणः तस्य हनूमतो वधमाज्ञापयत्", "tilaka": "प्रतिज्ञां त्यज्य रोषं क्षमस्वेत्यन्वयः । परावरज्ञाः सर्वकार्यविषयकोत्कर्षापकर्षज्ञाः सन्तो दूतस्य वधं न कुर्वन्ति", "bhusana": "क्षमस्व रोषं त्यज राक्षसेन्द्र प्रसीद मद्वाक्यमिदं शृणुष्व ।\n\nवधं न कुर्वन्ति परावरज्ञा दूतस्य सन्तो वसुधाधिपेन्द्राः\nपरावरज्ञाः त्याज्योपादेय विवेकयुक्ताः"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «терпеливым» по Г-пр - прости[Е. Костина] «близкое и далекое» нужен комм. По Таттвадипике - त्याज्योपादेयविवेकयुक्ताः По Тилаке - सर्वकार्यविषयकोत्कर्षापकर्षज्ञाः"}, {"id": "edition:5.52.5:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.52.5 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.52.5", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.52.5", "iast": "kṣamasva roṣaṃ tyaja rākṣasendra । prasīda madvākyam idaṃ śṛṇuṣva । vadhaṃ na kurvanti parāvarajñā । dūtasya santo vasudhādhipendrāḥ ॥5॥"}], "collision_tier1": true}]}, {"verse_id": "5.52.7", "verse": "7", "sanskrit_iast": "dharmajñaśca kṛtajñaśca rājadharmaviśāradaḥ । parāvarajño bhūtānāṃ tvameva paramārthavit ॥7॥", "leonov_ru": "Благочестив ты, знаешь, что правильно, а что нет, искусен в законе правления. Знаешь ты далекое и близкое (правильное и неправильное), из живых существ лишь ты постиг высшее знание.", "commentary": {"tilaka": "कृतज्ञत्वेनापकारिण्येव वधो न्याय्यो न तादृशे ऽस्मिन्", "bhusana": "धर्मज्ञश्च कृतज्ञश्च राजधर्मविशारदः ।\n\nपरावरज्ञो भूतानां त्वमेव परमार्थवित्\nभूतानामिति निर्धारणे षष्ठी । भूतानां मध्ये", "siromani": "असदृशत्वमुपपादयन्नाह धर्मज्ञ इति । धर्मज्ञत्वादिविशिष्टस्त्वमेवासीति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Искусен в делах правления (rājadharmaviśāradaḥ) - букв. “искусен в царской дхарме”.[Е. Костина] «7» сверка до 13 включительно нет у Голдмэнов"}, {"id": "edition:5.52.7:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.52.7–9 (3 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.52.7–9", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.52.7", "iast": "dharmajñaśca kṛtajñaśca rājadharmaviśāradaḥ । parāvarajño bhūtānāṃ tvameva paramārthavit ॥7॥"}, {"verse_id": "5.52.8", "iast": "gṛhyante yadi roṣeṇa tvādṛśo 'pi vicakṣaṇaḥ । tataḥ śāstravipaścittvaṃ śrama eva hi kevalam ॥8॥"}, {"verse_id": "5.52.9", "iast": "tasmāt prasīda śatrughna rākṣasendra durāsada । yuktāyuktaṃ viniścitya dūtadaṇḍo vidhīyatām ॥9॥"}], "collision_tier1": true}]}, {"verse_id": "5.52.8", "verse": "8", "sanskrit_iast": "gṛhyante yadi roṣeṇa tvādṛśo 'pi vicakṣaṇaḥ । tataḥ śāstravipaścittvaṃ śrama eva hi kevalam ॥8॥", "leonov_ru": "Если гнев охватывает даже мудреца, подобного тебе, То изучение шастр – [напрасное] утомление, и только.", "commentary": {"tilaka": "त्वादृश इति क्लिन्नन्तबहुवचनम् । शास्त्रविपश्चित्त्वं शास्त्रपाण्डित्यसंपादनम् श्रमः केवलं श्रम एव व्यर्थप्रयास एवेत्यर्थः", "bhusana": "गृह्यन्ते यदि रोषेण त्वादृशो ऽपि विपश्चितः ।\n\nततः शास्त्रधर्मविपश्चित्त्वं श्रम एव हि केवलम्\nशास्त्रविपश्चित्त्वं विविधं पश्यतीति विपश्चित् तस्य भावः विपश्चित्त्वम्, शास्त्रविषये विविधज्ञानोपेतत्वमिति यावत्", "siromani": "गृह्यन्ते इति । त्वादृशो विचक्षणा अपि यदि दोषेण कर्त्रा गृह्यन्ते तदा शास्त्रविपश्चित्त्वं शास्त्रज्ञानं श्रम एव"}, "has_tier1": false, "notes": [{"id": "lexical:5.52.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śāstravipaścittvam", "note_ru": "Шастравипашчитттва (śāstra-vipaścit-tva, n.) — тат-пуруша + абстрактный суфф. -tva: śāstra «учёный трактат» + vipaścit «мудрец, знаток» (от vi-paś-, «смотреть насквозь»). MW: vipaścit 'wise, learned'. Вибхишана строит аргумент через reductio: если гнев «заразил» даже человека, изучившего śāstra, то само это изучение — «лишь утомление» (śrama eva kevalam). Термин śāstra здесь охватывает весь корпус нормативных текстов — дхармашастру, артхашастру, нитишастру; их назначение именно в том, чтобы управлять страстями.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:SAstravipaScit"}]}, {"verse_id": "5.52.9", "verse": "9", "sanskrit_iast": "tasmāt prasīda śatrughna rākṣasendra durāsada । yuktāyuktaṃ viniścitya dūtadaṇḍo vidhīyatām ॥9॥", "leonov_ru": "Потому смилуйся, о губитель врагов, непобедимый владыка ракшасов, Рассудив [сперва] о том, что должно и что недолжно, подвергни наказанию вестника».", "commentary": {"tilaka": "दूतदण्डो दूते विहितो दण्डः ।। 5.52.9,10 ।।\n\nपापकारिणं राजद्रोहिणम्", "bhusana": "तस्मात् प्रसीद शत्रुघ्न राक्षसेन्द्र दुरासद ।\n\nयुक्तायुक्तं विनिश्चित्य दूतदण्डे विधीयताम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И, рассудивши трезво (yuktāyuktaṃ viniścitya) - букв. “твердо решив, что должно и что недолжно”."}, {"id": "lexical:5.52.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dūtadaṇḍa", "note_ru": "Дута-данда (dūta-daṇḍa, m.) — тат-пуруша: dūta «вестник» + daṇḍa «наказание» (буквально «посох», отсюда символ власти/кары). Апте: daṇḍa 'punishment, fine, chastisement'. Дипломатическое право древней Индии (артхашастра Каутильи, книга I) признаёт, что dūta может быть наказан, но только не казнён — его жизнь неприкосновенна. Вибхишана использует именно этот принцип; конкретные виды dūtadaṇḍa перечислены в 52.15: уродование, порка, бритьё, клеймение. Подстрочник даёт «наказание вестника» без указания на то, что это юридически закреплённый институт.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:dUta+dic_mw:daRqa", "collision_tier1": true}]}, {"verse_id": "5.52.11", "verse": "11", "sanskrit_iast": "na pāpānāṃ vadhe pāpaṃ vidyate śatrusūdana । tasmād imaṃ vadhiṣyāmi vānaraṃ pāpakāriṇam ॥11॥", "leonov_ru": "Нет в убийстве злодеев зла, о губитель врагов. Потому убью я эту обезьяну, совершающую злые деяния».", "commentary": {"bhusana": "न पापानां वधे पापं विद्यते शत्रुसूदन ।\n\nतस्मादेनं वधिष्यामि वानरं पापचारिणम्", "siromani": "तस्मादिति । तस्मात् मदुक्तहेतोः प्रसीद चित्तप्रसादं कुरु अत एव युक्तायुक्तं विनिश्चित्य दूतदण्डः दूतोचितक्रिया विधीयताम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "В оригинале в строфе трижды повторяются слова с корнем pāpа «злой, греховный, преступный».[Е. Костина] «.» Такого рода явления встречаются многократно. Будем ли мы их последовательно отмечать или избирательно?"}, {"id": "edition:5.52.11:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.52.11–13 (3 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.52.11–13", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.52.11", "iast": "na pāpānāṃ vadhe pāpaṃ vidyate śatrusūdana । tasmād imaṃ vadhiṣyāmi vānaraṃ pāpakāriṇam ॥11॥"}, {"verse_id": "5.52.12", "iast": "adharmamūlaṃ bahudoṣayuktam । anāryajuṣṭaṃ vacanaṃ niśamya । uvāca vākyaṃ paramārthatattvaṃ । vibhīṣaṇo buddhimatāṃ variṣṭhaḥ ॥12॥"}, {"verse_id": "5.52.13", "iast": "prasīda laṅkeśvara rākṣasendra । dharmārthayuktaṃ vacanaṃ śṛṇuṣva । dūtā na vadhyāḥ samayeṣu rājan । sarveṣu sarvatra vadanti santaḥ ॥13॥"}], "collision_tier1": true}]}, {"verse_id": "5.52.12", "verse": "12", "sanskrit_iast": "adharmamūlaṃ bahudoṣayuktam । anāryajuṣṭaṃ vacanaṃ niśamya । uvāca vākyaṃ paramārthatattvaṃ । vibhīṣaṇo buddhimatāṃ variṣṭhaḥ ॥12॥", "leonov_ru": "Основанную на неправедности, соединенную с множеством зол, Недостойную благородного речь выслушав, Сказал слова, исполненные высшего знания, Вибхишана, лучший из мудрецов:", "commentary": {"tilaka": "अधर्मस्य मूलमधर्ममूलम् । दोषो ऽपकीर्तिरूपः", "bhusana": "अधर्ममूलं बहुरोषयुक्तमनार्यजुष्टं वचनं निशम्य ।\n\nउवाच वाक्यं परमार्थतत्त्वं विभीषणो बुद्धिमतां वरिष्ठः", "siromani": "अधर्मेति । बहुदोषयुक्तम् अत एव अधर्ममूलम् अत एव अनार्यजुष्टं क्षुद्रैः सेवितं रावणोक्तिं निशम्य श्रुत्वा परमार्थतत्त्वं परमार्थस्य निश्चायकं वाक्यं विभीषण उवाच"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "…греховную (bahudoṣayuktam) - букв. “изобилующую ошибками”. В тексте, которому следует комментарий “Бхушана” стоит bahuroṣayuktam (обильную гневом).[Е. Костина] «слова высшего знания:» не очень понятная формулировка. По Г-пр - слова, определяющие, что будет величайшим благом (у которых таттва - парамартха)"}]}, {"verse_id": "5.52.13", "verse": "13", "sanskrit_iast": "prasīda laṅkeśvara rākṣasendra । dharmārthayuktaṃ vacanaṃ śṛṇuṣva । dūtā na vadhyāḥ samayeṣu rājan । sarveṣu sarvatra vadanti santaḥ ॥13॥", "leonov_ru": "«Смилуйся, владыка Ланки, повелитель ракшасов. Выслушай слова, соединенные с праведностью и пользой. Во всех собраниях повсюду говорят праведники, Что не надлежит убивать послов, о царь.", "commentary": {"tilaka": "समयेषु स्वस्वामिनियोगानुष्ठानकालेषु ।। 5.52.13,14 ।।\n\nमौण्ड्यं मुण्डनम् । लक्षणसंनिपातो दूतयोग्याङ्कनसंभूत इति तीर्थः । वैरूप्यादीनामेकैकं वा । तथा लक्षणानां संनिपातः सर्वानुष्ठानं वेत्यर्थ इत्यन्ये । नो ऽस्माकं श्रुतो ऽपि नास्ति दर्शनं तु दूरापास्तमिति भावः", "bhusana": "प्रसीद लङ्केश्वर राक्षसेन्द्र धर्मार्थयुक्तं वचनं शृणुष्व ।\n\nदूता न वध्याः समयेषु राजन् सर्वेषु सर्वत्र वदन्ति सन्तः\nप्रसीदेति । सर्वेषु सर्वत्र सर्वदेशेषु सर्वजातिष्वित्यर्थः", "siromani": "तद्वचनाकारमाह प्रसीदेति । हे लङ्केश्वर समयेषु स्वस्वामिनियोगकालेषु दूताः सर्वत्र सर्वदेशेषु न वध्याः इति सन्तो वदन्ति तत् धर्मार्थतत्त्वं वचनं शृणुष्व\nनन्वनेन शत्रुत्वमाचरितमिति नास्मिन् दूतत्वमात्रमिति नास्य वधे दोष इत्यत आह असंशयमिति । हि यतः अप्रमेयं बहु अप्रियम् अनेन कृतम् अतो ऽयं प्रवृद्धो महान् शत्रुः तथापि सन्तः दूतवध्यां दूतानां वधं न प्रवदन्ति अत एव दूतस्य दुष्टत्वे इति शेषः, बहवः दण्डाः दृष्टा शास्त्रेष्ववलोकिताः"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Внемли... закону и пользе (dharmārthayuktaṃ vacanam śṛṇuṣva) - букв. “услышь речь, проникнутую дхармой и артхой”.[Е. Костина] «–» см. это словосочетание ранее. необходима унификация или взаимные ссылки"}]}, {"verse_id": "5.52.14", "verse": "14", "sanskrit_iast": "asaṃśayaṃ śatrur ayaṃ pravṛddhaḥ । kṛtaṃ hy anenāpriyam aprameyam । na dūtavadhyāṃ pravadanti santo । dūtasya dṛṣṭā bahavo hi daṇḍāḥ ॥14॥", "leonov_ru": "Несомненно, он (Хануман) – могучий враг, Ибо сделано им беспримерное зло. [Но] не одобряют праведники убийства вестников, Ибо есть много [иных] наказаний в отношении вестников.", "commentary": {"bhusana": "असंशयं शत्रुरयं प्रवृद्धः कृतं ह्यनेनाप्रियमप्रमेयम् ।\n\nन दूतवध्यां प्रवदन्ति सन्तो दूतस्य दृष्टा बहवो हि दण्डाः\nन केवलं दूतो ऽयम् अक्षादिवधेन शत्रुश्च, तथाच हन्तव्य इत्याशङ्क्याह असंशयमिति । दूतवध्यां दूतवधम् । स्त्रियां भावे क्यप् । हन्तेर्वधादेश आर्षः"}, "has_tier1": false, "notes": [{"id": "crosstext:5.52.14:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "dūta (avadhya)", "note_ru": "Вибхишана отводит казнь Ханумана общим правилом: «праведники не одобряют убийства вестников» (na dūtavadhyāṃ pravadanti santo). Это эпическая формулировка правовой неприкосновенности посла, теория которой развёрнута у Ману. Manu 7.66: «dūta eva hi saṃdhatte bhinatty eva ca saṃhatān / dūtas tat kurute karma bhidyante yena mānavāḥ» — «Ибо только посол соединяет и разъединяет союзников; посол распоряжается делом, которым люди разъединяются»; ему предшествует требование (7.65) «dūte saṃdhiviparyayau» — «от посла [зависят] мир и его противоположность». Сцена в Ланке прилагает шастрическую доктрину о центральной и потому защищённой роли dūta к Хануману. Свидетельство: уровень шлоки (мягкое).", "type": "Б", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.52.14", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra 7.63–7.66 (Эльманович–Ильин)"}]}, {"verse_id": "5.52.15", "verse": "15", "sanskrit_iast": "vairūpyām aṅgeṣu kaśābhighāto । mauṇḍyaṃ tathā lakṣmaṇasaṃnipātaḥ । etān hi dūte pravadanti daṇḍān । vadhas tu dūtasya na naḥ śruto 'sti ॥15॥", "leonov_ru": "Уродование тела, порка Обритие головы, клеймение – Эти наказания предписаны в отношении вестника, Об убийстве же вестника я не слышал.", "commentary": {"bhusana": "वैरूप्यमङ्गेषु कशाभिघातो मौण्ड्यं(ढ्यं) तथा लक्षणसन्निपातः ।\n\nएतान् हि दूते प्रवदन्ति दण्डान् वधस्तु दूतस्य न नः श्रुतो ऽपि\nलक्षणसन्निपातः दूतयोग्याङ्कनसंबन्धः । नः अस्माभिः", "siromani": "तद्दण्डाकारमाह वैरूप्यमिति । अङ्गेषु वैरूप्यं नासिकाछेदादिना विरूपकरणं कशाभिघातः कशया तोत्रेण अभिघातः ताडनं मौण्ड्यं भ्रुकुट्यादिमुण्डनं लक्षणसंनिपातः ताम्रखण्डदाहादिना ललाटादौ चिह्नकरणम् एतान् दण्डान् दूते प्रवदन्ति दूतस्य वधस्तु नो ऽस्माकं न श्रुतो ऽस्ति"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "…клеймо поставить (lakṣmaṇasaṃnipātaḥ) - букв. композит можно перевести как “соединение со знаком”. В комментарии “Широмани” поясняется, что речь идет о нанесении отметины раскаленным железом или чем-то подобным на лбу или иной части тела. Автор комментария “Тилака” приводит мнение, согласно которому здесь говорится об одновременном применении всех перечисленных наказаний.[Е. Костина] Чтобы была понятна интерпретация Тилаки, надо добавить другой возможный перевод сл. слова, иначе только запутаем читателя"}, {"id": "lexical:5.52.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mauṇḍya", "note_ru": "Мауньдья (mauṇḍya, n.) — «обритие головы», от muṇḍa (adj.) «лысый, обритый» + суфф. абстракции -ya. MW: muṇḍa 'having the head shaved; shorn'. Обритие головы в древнеиндийском праве — ритуально-карательная мера: лишение волос приравнивалось к социальной «смерти» и позору (ср. ритуал aśauca, состояние нечистоты). В политическом контексте mauṇḍya сигнализировало статус побеждённого и посрамлённого. Наряду с vairūpya (уродованием) и kaśābhighāta (поркой) составляет карательный арсенал, достаточный для унижения, но не летальный — что и требует Вибхишана для Ханумана.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:mOWya+dic_mw:muRqa", "collision_tier1": true}, {"id": "crosstext:5.52.15:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "daṇḍa", "note_ru": "Совет «есть много [иных] наказаний для вестника» (dūtasya … bahavo daṇḍāḥ) опирается на понятие daṇḍa как сердцевину царской власти. Locus classicus — Manu 7.18: «daṇḍaḥ śāsti prajāḥ sarvā daṇḍa evābhirakṣati / daṇḍaḥ supteṣu jāgarti daṇḍaṃ dharmaṃ vidur budhāḥ» — «Наказание правит всеми людьми, Наказание же охраняет, Наказание бодрствует, когда все спят; мудрые объявили Наказание [воплощением] дхармы». Сцена разыгрывает оборотную сторону доктрины: daṇḍa в руках царя-адхармы должен соблюсти даже норму о неприкосновенности dūta. Свидетельство: уровень шлоки (мягкое).", "type": "Б", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.52.15", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra 7.18 (Эльманович–Ильин)", "collision_tier1": true}]}, {"verse_id": "5.52.16", "verse": "16", "sanskrit_iast": "kathaṃ ca dharmārthavinītabuddhiḥ । parāvarapratyayaniścitārthaḥ । bhavadvidhaḥ kopavaśe hi tiṣṭhet । kopaṃ na gacchanti hi sattvavantaḥ ॥16॥", "leonov_ru": "Как же тот, чей ум познал дхарму и артху, Кто принимает решения, различая правое и неправое, Подобный тебе, окажется во власти гнева? Ибо истинно доблестные не приходят в гнев.", "commentary": {"tilaka": "परावरप्रत्ययनिश्चितार्थ उत्कर्षापकर्षज्ञानेन निश्चितकार्यः", "bhusana": "कथं च धर्मार्थविनीतबुद्धिः परावरप्रत्ययनिश्चितार्थः ।\n\nभवद्विधः कोपवशे हि तिष्ठेत् कोपं नियच्छन्ति हि सत्त्ववन्तः\nधर्मार्थविनीतबुद्धिः धर्मार्थयोश्शिक्षितबुद्धिः । परावरप्रत्ययनिश्चितार्थः उत्कृष्टापकृष्टपरिज्ञाननिश्चितार्थः । अस्मिन् विषये इदं कार्यं परम् इदमवरमिति विवेकनिश्चितकार्य इत्यर्थः । नियच्छन्ति निगृह्णन्ति । सत्त्ववन्तः व्यवसायवन्तः"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «и пользу, близкое и далекое,» см ранее[Е. Костина] «ведают» смещается акцент - они ему не поддаются, скорее"}]}, {"verse_id": "5.52.19", "verse": "19", "sanskrit_iast": "itthaṃvidhasyāmaradaytaśatroḥ । śūrasya vīrasya tavājitasya । kurvanti vīrā manasāpyalīkaṃ । prāṇair vimuktā na tu bhoḥ purā te ॥19॥", "leonov_ru": "Тебе, наделенному такими качествами, врагу бессмертных (богов) и дайтьев, Отважному герою, непобедимому, Причиняли герои нечто неприятное хотя бы мысленно, Но жизни не лишались тобою прежде.", "commentary": {"siromani": "इत्थमिति । इत्थंविधस्य तव अलीकमपराधं पुरा प्राणैर्विमुक्ताः अपहृतसर्वस्वा इत्यर्थः । वीराः मनसा ऽपि न कुर्वन्ति"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Строфы 18 и 19 отсутствуют в бомбейском издании, но есть в издании “Гита-пресс”.[Е. Костина] «Вредили герои,» По Широмани - даже в мыслях не вредили वीराः मनसा ऽपि न कुर्वन्ति Так что нужен комм"}, {"id": "phase2:5.52.19:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "ślokadvayaṃ prakṣiptam", "note_ru": "По Тилаке, пара стихов 18–19 («…войска владыки богов были побеждены… но жизни герои не лишали») — интерполяция (prakṣipta) по мнению комментатора Катаки; Тилака приводит их текст целиком именно затем, чтобы указать на вставку.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Костина уже отмечает, что vv.18–19 отсутствуют в бомбейском издании (но есть в Гита-пресс) — это внешнее, эдиционное свидетельство; Тилака добавляет независимое внутреннее свидетельство традиции — прямую квалификацию этих стихов как интерполяции по имени конкретного комментатора (Катака).", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}, {"id": "edition:5.52.19:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.52.19 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.52.19", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.52.19", "iast": "itthaṃvidhasyāmaradaytaśatroḥ । śūrasya vīrasya tavājitasya । kurvanti vīrā manasāpyalīkaṃ । prāṇair vimuktā na tu bhoḥ purā te ॥19॥"}], "collision_tier1": true}]}, {"verse_id": "5.52.20", "verse": "20", "sanskrit_iast": "na cāpy asya kaper ghāte kaṃ cit paśyāmy ahaṃ guṇam । teṣv ayaṃ pātyatāṃ daṇḍo yair ayaṃ preṣitaḥ kapiḥ ॥20॥", "leonov_ru": "И в убийстве этой обезьяны я не вижу ничего доброго. Тех подвергни наказанию, которыми была послана эта обезьяна.", "commentary": {"bhusana": "न चाप्यस्य कपेर्घाते कञ्चित् पश्याम्यहं गुणम् ।\n\nतेष्वयं पात्यतां दण्डो यैरयं प्रेषितः कपिः\nन केवलं दूतस्य वधे शास्त्रविरोधः गुणमपि न कंचित्पश्यामि अतः एतत्प्रेषकेष्वेव वधरूपो दण्डः पात्यतामित्याह  न चेत्यादि", "tilaka": "समर्पितः प्रेषितः\nनन्वस्मिन्हते ऽन्यस्यानागमने च काममक्षतिर्विपरीतमिष्टमेवेदं तत्राह-- अस्मिन्विनष्टे इति । तौ राजपुत्रौ । यो योद्धोद्योजयेत्तं न पश्यामि, ननु तदुद्योगाभावो ऽपि ममेष्ट एव नेत्याह-- युद्धप्रियेति संबोधनेन रणपराक्रमविजयकीर्ती तवेष्टे किल, ते उभे अप्येतद्विनाशे नश्यत इत्याशयः । रावणस्य रजःप्रकृतित्वात्तत्प्रकृत्यनुसारेण युद्धादिव्यापारेण प्रलोबनम् तत्प्रीत्यर्थमेव दुर्विनीतावित्याद्युक्तिः\nतत्तस्मादुपगृह्य आयान्त्विति शेषः । परेषु ते प्रभावं भावयितुं प्रकाशयितुम् युक्तमिति शेषः", "siromani": "नेति । अस्य कपेर्घाते कंचित् गुणं न पश्यामि । अतः परैरयं कपिः प्रेषितः तेषु अयं प्राणान्तः दण्डः पात्यताम्\nननु किं तेनेत्यत आह तदिति । तत् शराधिक्याद्धेतोः केचित्तवादेशकृतः बलस्य सैन्यस्य एकदेशेन सह किंचिद्बलं गृहीत्वेत्यर्थः, अद्य यान्तु रामसमीपमिति शेषः । गमनप्रयोजनमाह परेषु शत्रुषु ते प्रभावं भावयितुं बोधयितुं मूढौ प्रियावियोगदुःखे अस्वस्थचित्तौ तौ रामलक्ष्मणौ उपगृह्य आयान्त्विति शेषः"}, "has_tier1": false, "notes": [{"id": "crosstext:5.52.20:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "daṇḍa", "note_ru": "daṇḍa и daṇḍa-nīti. Вибхишана возражает против казни посла, требуя обратить daṇḍa на пославших обезьяну, — т.е. апеллирует к норме нīti, по которой посол неприкосновенен. Та же Шантипарва возводит daṇḍa к божеству и судьбе: «daṇḍāt trivargaḥ satataṃ supraṇītāt pravartate । daivaṃ hi paramo daṇḍo...» (MBh XII.121.13) — «От верно applied жезла всегда проистекает [достижение] трёх целей [dharma-artha-kāma]; ибо высший жезл есть [сама] судьба». Спор ракшасов в Сундараканде — драматизация учения о supraṇīta («верно наложенном») против durṇīta daṇḍa; параллель вскрывает теоретический фон реплики Вибхишаны.", "type": "Б", "cluster": "mbh_gnomic", "cluster_label": "МБх дидактика (Шантипарва / Анушасанапарва)", "shloka_ref": "V.52.20", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Śāntiparvan (MBh XII) 12.121.13"}]}, {"verse_id": "5.52.21", "verse": "21", "sanskrit_iast": "sādhur vā yadi vāsādhuḥ parair eṣa samarpitaḥ । bruvan parārthaṃ paravān na dūto vadham arhati ॥21॥", "leonov_ru": "Хорош он (Хануман) или плох, он послан другими. Высказывающий чужие намерения, зависящий от других, не заслуживает вестник смерти.", "commentary": {"bhusana": "साधुर्वा यदिवा ऽसाधुः परैरेष समर्पितः ।\n\nब्रुवन् परार्थं परवान् न दूतो वधमर्हति\nसाधुर्वेति । सपर्पितः प्रेषितः", "siromani": "साधुरिति । परैः रिपुभिः समर्पितः प्रेषितः अत एव परार्थं ब्रुवन् साधुर्वा ऽसाधुर्वा एष दूतः वधं नार्हति"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «dūto» мб нужен комм"}, {"id": "lexical:5.52.21:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "paravant", "note_ru": "Паравант (paravant, adj.) — «зависящий от другого», от para «иной, чужой» + суфф. -vant (обладание качеством). MW: paravant 'dependent on another'. Правовое понятие: вестник юридически «принадлежит» пославшему его и не является субъектом собственной воли — следовательно, наказывать его за содержание послания бессмысленно и несправедливо. Это ключевой принцип дипломатического иммунитета в нитишастре: dūta действует как инструмент, а не как автор. Подстрочник «зависящий от других» — точен, но не раскрывает юридической нагрузки термина.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:paravat", "collision_tier1": true}]}, {"verse_id": "5.52.23", "verse": "23", "sanskrit_iast": "tasmān nāsya vadhe yatnaḥ kāryaḥ parapuraṃjaya । bhavān sendreṣu deveṣu yatnam āsthātum arhati ॥23॥", "leonov_ru": "Потому, о покоритель вражеских крепостей, не стоит труда убивать его. Ты должен приложить силы по отношению к богам с Индрой (на борьбу с богами во главе с Индрой).", "commentary": {"bhusana": "तस्मान्नास्य वदे यत्नः कार्यः परपुरञ्जय ।\n\nभवान् सेन्द्रेषु देवेषु यत्नमास्तातुमर्हति"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.23:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «yatnaḥ» мб комм - букв. перевод? чтобы было понятно про две ятны"}, {"id": "tier1:5.52.23:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Текст дан по изданию “Гита-пресс”. В бомбейском издании строфы 22-23 объединены в одну строфу. Опущены строки 22bc.[Е. Костина] «покоритель твердынь» комм"}]}, {"verse_id": "5.52.26", "verse": "26", "sanskrit_iast": "hitāś ca śūrāś ca samāhitāś ca । kuleṣu jātāś ca mahāguṇeṣu । manasvinaḥ śastrabhṛtāṃ variṣṭhāḥ । kopapraśastāḥ subhṛtāś ca yodhāḥ ॥26॥", "leonov_ru": "Преданные [тебе], отважные, собранные (дисциплинированные), Рожденные в семьях, наделенных великими достоинствами, Разумные, лучшие из носящих меч, Прославленные [своей] яростью воины, которых ты хорошо содержишь.", "commentary": {"bhusana": "हिताश्च शूराश्च समाहिताश्च कुलेषु जाताश्च महागुणेषु ।\n\nमनस्विनः शस्त्रभृतां वरिष्ठाः कोट्यग्रतस्ते सुभृताश्च योधाः", "siromani": "हिता इति । महागुणेषु बहुगुणविशिष्टेषु कुलेषु जाताः शराः नागाश्च सुभृताः अत्यन्तं पोषिताः"}, "has_tier1": true, "notes": [{"id": "tier1:5.52.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Твои дружинники, яростью славные (kopapraśastāḥ subhṛtāś ca yodhāḥ) - букв. “воины, прославленные яростью, о которых хорошо заботятся”."}]}, {"verse_id": "5.52.28", "verse": "28", "sanskrit_iast": "niśācarāṇāmadhipo 'nujasya । vibhīṣaṇasyuttamavākyam iṣṭam । jagrāha buddhyā suralokaśatrur । mahābalo rākṣasarājamukhyaḥ ॥28॥", "leonov_ru": "Владыка ракшасов [своего] младшего брата Вибхишаны ответ приятный (желанный) Принял [всем] сердцем, враг мира богов, Наделенный великой силой, предводитель царей ракшасов.", "commentary": {"tilaka": "उत्तमवाक्यनिष्ठं तत्प्रतिपाद्यमर्थतत्त्वं जग्राह", "bhusana": "निशाचराणामधिपो ऽनुजस्य विभीषणस्योत्तमवाक्यमिष्टम् ।\n\nजग्राह बुद्ध्या सुरलोकशत्रुर्महाबलो राक्षसराजमुख्यः", "siromani": "निशाचराणामिति । राक्षसराजेषु मुख्यः निशाचरणामधिपो रावणः विभीषणस्येष्टमुत्तमवाक्यं बुद्ध्या अन्तःकरणवृत्त्या जग्राह"}, "has_tier1": false, "notes": [{"id": "lexical:5.52.28:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "suralokaśatru", "note_ru": "Суралока-шатру (sura-loka-śatru, m.) — тат-пуруша: sura «бог» + loka «мир» + śatru «враг» = «враг мира богов». MW: śatru 'enemy, foe'. Этот эпитет Раваны — не просто «враг богов», но враг всего космоса (loka), принадлежащего богам: loka несёт смысл «мирового пространства», «сферы» (ср. trailokya). Именно этот сложный эпитет в заключительном стихе главы: принятие советов Вибхишаны подаётся как действие «врага мироздания» — ирония в том, что в данном случае совет правилен. Подстрочник «враг мира богов» сохраняет семантику, но не указывает на структурное значение loka как космологической категории.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:suraloka+dic_mw:Satru"}, {"id": "edition:5.52.28:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.52.28 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.52.28", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.52.28", "iast": "niśācarāṇāmadhipo 'nujasya । vibhīṣaṇasyuttamavākyam iṣṭam । jagrāha buddhyā suralokaśatrur । mahābalo rākṣasarājamukhyaḥ ॥28॥"}]}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s52_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

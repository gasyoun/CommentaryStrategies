त्यमुच्यते । तत्र प्रथमे सर्गे शिक्षणीयशिष्यान्वेषणमुपपाद्यते--तत इत्यादि । ततः जाम्बवत्प्रोत्साहनानन्तरम् । चारणाः सङ्घचारिणो देवगायकाः तैराचरिते पथि आकाशे रावणनीतायास्सीतायाः पदं स्थानमन्वेष्टुमियेष । शत्रुकर्शनः तदन्वेषणविरोधिनिरसनसमर्थः । यद्वा चारणाचरिते पथि गत्वा सीतीयाः पदमन्वेष्टुमियेष । यद्वा यथापाङ्क्तमेवान्वयः । आकाशे ऽपि पदन्यासान्वेषणसमर्थो ऽयमिति बुद्धिचातुर्यातिशय उच्यते । अनेन शिष्यस्थानान्वेषणपरगुरुस्वरूपमुच्यते । ततः मुद्राप्रदानपूर्वकभगवदनुज्ञालाभानन्तरम् । शत्रुकर्शनः\"गुशब्दस्त्वन्धकारः स्याद्रुशब्दस्तन्निरोधकः । अन्धकारनिरोधित्वाद्गुरुरित्यभिधीयते ।\" इत्युक्तरीत्या अज्ञाननिवर्तनशीलो गुरुः । चारयन्ति आचारयन्ति धर्मानिति चारणाः पूर्वाचार्याः तैराचरिते पथि \"महाजनो येन गतस्स पन्थाः\" इत्युक्तसदाचारे, स्थित  इति शेषः । रावयति असत्प्रलापान्कारयतीति रावणः अविवेकः, तेन नीतायाः स्ववशं प्रापितायाः सीतायाः अनादिभगवत्परतन्त्रचेतनस्य । सीताशब्देनायोनिजत्वोक्तेः स्त्रीलिङ्गेन पारतन्त्र्योक्तेश्च \"स्त्रीप्रायमितरत्सर्वम्\"  इति ह्युक्तम् । पदं स्थानं संसारमण्डलमन्वेष्टुम्, सात्त्विकसंभाषणादिचिह्नं वा । तथोक्तम् \"विष्णोः कटाक्षश्चाद्वेष आभिमुख्यं च सात्त्विकैः । सम्भाषणं षडेतानि त्वाचार्यप्राप्तिहेतवः\" इति । यद्वा पदं व्यवसायमन्वेष्टुं कस्य चेतनस्य भगवत्प्राप्तावध्यवसाय इत्यन्वेष्टुम् इयेष । \"पदं व्यवसितत्राणस्थानलक्ष्माङ्घ्रिवस्तुषु\" इत्यमरः । अत्रैकादशसहस्रश्लोका गताः । द्वादशसहस्रस्यादिमो ऽयं श्लोकः । अत्र गायत्र्याः द्वादशमक्षरं प्रयुक्तं तदवलोकनीयं विद्वद्भिः", "siromani": "।। सुन्दरकाण्डम् ।।\n\n।। रामायणशिरोमणिः ।।\n\nस्वस्ति श्रीमनुवंशवर्धनपरं सर्वेश्वरैः संस्तुतं\n\nश्रीरामं सह लक्ष्मणं सुरतरुप्रख्यं सदा मारुतिम् ।\n\nसीताध्यानपरायणं सुरनुतं ज्ञानप्रदं सत्कृतं\n\nरामेणाखिलराजराजितपदा वन्दे ऽप्यभीष्टप्रदम् ।। 1 ।।\n\nवन्दे त्रिवेणीं निखिलार्थवेणीं\n\nवन्दे प्रयागं सुविशालयागम् ।\n\nवन्दे महान्तं गुरुप्रार्यभान्तं\n\nवन्दे गणेशं सुखसर्वदेशम् ।। 2 ।।\n\nवाल्मीकेश्चरणौ नत्वा तदीय रचिते परे ।\n\nसुन्दरे विवृतिं कुर्मो रामायणशिरोमणिम् ।। 3 ।।\n\nयस्य सान्निध्यमात्रेण ब्रह्मत्वं प्राप्यते जनैः ।\n\nतं वन्दे सर्वदातारं त्रिवेणीतटमुत्तमम् ।। 4 ।।\n\nसीतारामसमारम्भां शुकाचार्यादिमध्यगाम् ।\n\nअस्मदाचार्यपर्यन्तां वन्दे गुरुपरम्पराम् ।। 5 ।।\n\nजाम्बवत्कर्तकसागरतरणोद्देश्यकप्रोत्साहनानन्तरकालिकं वृत्तान्तमाह तत इत्यादिभिः । ततः स्ववीर्यस्मरणानन्तरं सीतायाः पदं स्थितिप्रदेशमन्वेष्टुं चारणैर्देवजातिविशेषैः आचिरते अतिसंचारविशिष्टे पथि आकाशमार्गे प्राप्तुमिति शेषः, इयेष ववाञ्छ", "tattvadipika": "सुन्दरकाण्डम् ।। 5 ।।\n\nश्रीमत्सुन्दरकाण्डे व्याख्येयानि व्याक्रियन्ते । पूर्वस्मिन् काण्डे \" जगाम लङ्कां मनसा मनस्वी \" इति मनसा गमनमुक्तम् । इदानीं कायेनापि गमनं कर्तुमैच्छदित्याह ततो रावणनीताया इति । व इति गायत्र्याः द्वादशाक्षरं ततो रावणनीताया इत्यस्य श्लोकस्य चतुर्थाक्षरेण व इत्यनेन संगृह्णाति । अत्र गन्तुमिति पदमध्याहर्तव्यम् । शत्रुकर्शनो हनुमान् रावणनीतायाः रावणेनापहृतायाः सीतायाः पदं स्थानमन्वेष्टुं चारणाचरिते पथि सुरवर्त्मनि गन्तुमियेषेति योजना"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.1:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "На тропу небожителей (cāraṇācarite pathi) – букв. «на тропе, по которой ходят чараны». В комментарии «Таттвадипика» поясняется «на дороге богов» (suravartmani). В комментарии «Бхушана» слово cāraṇāḥ объясняется как «божественные певцы» (dēvagāyakāḥ). Голдмены переводят «celestial bards» (см.: Goldman 1984: 101). [Е. Костина] «rāvaṇanītāyāḥ» Опущено. Здесь и далее я буду отмечать незафиксированные опущения, чтобы в дальнейшем можно было отразить их в комментарии (или не отражать, но это уже решится потом).[Claude.AI — желательно] [термин] (учтено) Первое появление в кн. V; введено в Рамаяна I. 17. 9: Чараны (cāraṇa) — небесные певцы, имеющие статус полубогов."}, {"id": "lexical:5.1.1:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "cāraṇa", "note_ru": "Чараны (cāraṇa) — класс полубожественных небесных певцов-странников (cāraṇa). Комм. «Бхушана» глоссирует как dēvagāyakāḥ «божественные певцы», «Таттвадипика» — «дорога богов» (suravartmani). Голдмены: «celestial bards». Подстрочник «по которому ходят чараны» сохраняет слово без пояснения его мифологического статуса.", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.1:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "śatrukārśana", "note_ru": "Иссушитель врагов (śatrukārśana) — букв. «тот, кто иссушает/истощает врагов» (śatru-kārśana, от корня √kṛś «быть тощим», каузатив). Активный эпитет-ваддхи в роли имени деятеля: kārśana ← kṛśayati «делает тощим, изнуряет». MW: kārśana — «emaciation, making lean». Эпитет подчёркивает Раму как истощителя/уничтожителя противников — в отличие от простого «победителя» (vijayī) или «убийцы» (hantṛ). В подстрочнике передано как «губитель врагов» — этимология корня √kṛś утеряна.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. kārśana; Apte s.v. kṛś", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.2", "verse": "2", "sanskrit_iast": "duṣkaraṃ niṣpratidvandvaṃ cikīrṣan karma vānaraḥ । samudagraśirogrīvo gavāṃ patir ivābabhau ॥2॥", "leonov_ru": "Трудное, ни для кого иного непосильное дело желая сделать, обезьяна, Вытянувшая шею и задравшая голову, стала похожа на владыку коров (быка).", "commentary": {"tilaka": "निष्प्रतिद्वन्द्वं सहायान्तररहितं प्रतिबन्धरहितं च अन्यैर्दुष्करं कर्म लङ्घनपूर्वं सीतान्वेषणकर्म । समुदग्रमुन्नतं शिरो ग्रीवा च यस्य सः, अत एव गवां पतिर्वृष इवाबभौ", "bhusana": "दुष्करं निष्प्रतिद्वन्द्वं चिकीर्षन्कर्म वानरः ।\n\nसमुदग्रशीरोग्रीवो गवां पतिरिवा ऽ ऽबभौ\nदुष्करमिति । निष्प्रतिद्वन्द्वं यथा भवति तथा दुष्करं चिकीर्षन् समुदग्रशिरोग्रीवः समुन्नतशिरोग्रीवः गवां पतिः वृषभः", "siromani": "दुष्करमिति । दुष्करमन्यैः कर्तुमशक्यम् अत एव निर्गतः प्रतिद्वन्द्वः द्वितीयः कर्ता विघ्नो वा यस्य तत्कर्म चिकीर्षन् समुदग्रं सम्यग् उन्नतं शिरोग्रीवं यस्य स हनूमान् गवाम्पतिः महावृषभ इव आबभौ", "tattvadipika": "दुष्करमिति । निष्प्रतिद्वन्द्वं प्रतिद्वन्द्वान्निष्क्रान्तम्, प्रतिबन्धकरहितमित्यर्थः । कर्म समद्रलङ्घनकर्म । समुदग्रशिरोग्रीवः समुदग्रे शिरोग्रीवे यस्य स तथोक्तः, अत एव गवां पतिः वृषभ इवाबभौ"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Трудное, непосильное… (duṣkaraṃ niṣpratidvandvam) – слово niṣpratidvandvam комментаторы истолковывают по-разному. Так, в «Тилаке» оно поясняется как «то, в котором нет помощников/спутников». В «Широмани» - как «неисполнимое для другого».Словно бык – повелитель стада (gavāṃ patir ivābabhau) – букв. «выглядел словно повелитель коров». В «Широмани» поясняется: «словно огромный бык»."}, {"id": "lexical:5.1.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "vānara", "note_ru": "Ванара (vānara) — букв. «лесной житель», обезьяна; общий термин для народа Сугривы. В «Тилаке» отмечается божественное происхождение ванаров. Подстрочник передаёт нарицательным «обезьяна», что снимает этнонимический оттенок термина.", "type": "А", "subtype": "base", "trigger": "term", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.2:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "niṣpratidvandva", "note_ru": "Не имеющий соперника (niṣpratidvandva) — букв. «без (nis-) соперника-двойника» (prati-dvandva, от dvandva «пара, двойник, соперник»). Dvandva — термин грамматики для «парного сложения», но в боевом контексте — «тот, кто выступает тебе навстречу». Составное niṣpratidvandva = «тот, кому нет равного соперника» — более сильное выражение, чем anuttama или apratimaḥ. MW: pratidvandva — «a match, rival». В подстрочнике «несравненное» — двойная грамматическая глубина (сложение) утеряна.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. pratidvandva; Apte s.v. dvandva", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "edition:5.1.2:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлока 5.1.2 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.1.2", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.2", "iast": "duṣkaraṃ niṣpratidvandvaṃ cikīrṣan karma vānaraḥ । samudagraśirogrīvo gavāṃ patir ivābabhau ॥2॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.3", "verse": "3", "sanskrit_iast": "atha vaidūryavarṇeṣu śādvaleṣu mahābalaḥ । dhīraḥ salilakalpeṣu vicacāra yathāsukham ॥3॥", "leonov_ru": "И вот наделенный великой силой, стойкий [Хануман] пошел свободно По лугам изумрудного цвета, подобным воде,", "commentary": {"siromani": "अथेति । सलिलकल्पेषु राशीभूतत्वेन सागरजलसदृशेषु वैदूर्यवर्णेषु वैदूर्यवर्णसदृशवर्णविशिष्टेषु शाद्वलेषु गिरिकोमलतृणेषु यथासुखम् अथ समङ्गलं महाबलो हनूमान् द्विजान् पक्षिणः वित्रासयन् उरसा पादपान् हरन् विदारयन् मृगांश्च निघ्नन् प्रवृद्धः केसरी सिंह इव विचचार । श्लोकद्वयमेकान्वयि ।। 5.1.3,4 ।।\n\nनीलेति । नीललोहिताः अरुणत्वश्यामत्वोभयाक्रान्ताः पद्मवर्णाः पद्मरागाः सितासिताः कल्माषाः सर्वे मणिविशेषाः तैः स्वभावसिद्धैर्गिरिस्वभावनिष्पन्नैः विमलैर्धातुभिश्च समलंकृतं कामरूपिभिः यक्षादिभिराविष्टं यत् तस्मिन् नागवरायुते तस्य गिरिवर्यस्य तले तिष्ठन् सन् कपिवरो हनूमान् हृदे नागो गज इव आबभौ । श्लोकत्रयमेकान्वयि\nतस्येति । वायुमार्गानुसारिणः वायुमार्गेणानुगमनशीलस्य तस्य हनुमतः विद्युत्प्रभाकारे विद्युत्प्रभासदृशप्रभोत्पादके नयने पर्वतस्थौ अनलौ दावानलाविव प्रकाशेते", "bhusana": "अथ वैडूर्यवर्णेषु शाद्वलेषु महाबलः ।\n\nधीरस्सलिलकल्पेषु विचचार यथासुखम्\nअथेति । शाद्वलानां सलिलकल्पत्वं वैडूर्यवर्णतया", "tattvadipika": "अथेति । वैडूर्यवर्णेषु मरकतच्छायेषु सलिलकल्पेषु तद्वत् शीतलेष्वित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Цвета зеленых бериллов (vaidūryavarṇeṣu) – слово vaidūrya может означать «изумруд», «кошачий глаз», «берилл» «ляпис-лазурь». В «Таттвадипике» этот композит поясняется как «цвета изумруда» (marakata).Подобным воде океана (salilakalpeṣu) – букв. «подобным воде». В комментарии «Широмани» поясняется, что имеется в виду морская вода (sagarajala). Таким же образом трактует это слово и автор «Тилаки». Автор «Таттвадипики» полагает, что оно означает «прохладный» (śītala).[Е. Костина] «yathāsukham» Опущено[Claude.AI — желательно] [термин] (учтено) Первое появление в кн. V; введено в Рамаяна II. 91. 29: Кошачий глаз (vaidūrya) — драгоценный камень."}, {"id": "lexical:5.1.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mahābala", "note_ru": "Обладающий великой силой (mahābala) — ситуативный эпитет Ханумана, букв. «обладающий великой силой» (mahā-bala). Первое вхождение в кн. V. Дальнейшие употребления — без примечания.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.3:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "vaidūrya", "note_ru": "Вайдурья (vaidūrya) — берилл / «кошачий глаз» (vaidūrya), драгоценный минерал зеленовато-синего отлива; здесь — о цвете горных лугов «изумрудного цвета». Подстрочник передаёт смысл («изумрудного цвета»), но опускает сам минералогический термин.", "type": "А", "subtype": "base", "trigger": "term", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.3:2", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dhīra", "note_ru": "Стойкий (dhīra) — букв. «твёрдый», «мудрый» (dhīra); в контексте подготовки к прыжку подчёркивает ментальную концентрацию героя.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "phase2:5.1.3:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": false, "status": "принято: Леонов (2026-07-11)", "mg_comment": "", "lemma_iast": "salilakalpa", "note_ru": "salilakalpa («подобным воде») — в «Тилаке» и «Широманьи» сравнение прочитано по цвету: луга подобны морской воде (sāgarajala), и перевод следует этому чтению; в «Таттвадипике» то же слово истолковано по температуре — «прохладный» (śītala).", "type": "Б", "source_commentary": ["tilaka", "siromani", "tattvadipika"], "why_proposed": "даёт скрытую в переводе развилку конструкции: подстрочник «подобным воде» реализует конкретно цветовое прочтение Тилаки/Широмани, тогда как Таттвадипика читает то же слово как указание на температуру — расхождение, которое не отмечено ни у Леонова/Костиной, ни в Phase-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.3:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dhīra", "note_ru": "Хануман в зачине книги назван mahābalaḥ … dhīraḥ — «многомощный, стойкий». Эпитет dhīra в Гите терминологически насыщен: это не просто «храбрый», а тот, кого не колеблют пары противоположностей (sukha–duḥkha). Ср. БхГ 2.13: «… dhīras tatra na muhyati» — «Словно детство, юность и старость к воплощенному здесь приходят, так приходит и новое тело: мудреца этим не озадачить.»; и БхГ 2.15: «… samaduḥkhasukhaṃ dhīraṃ so 'mṛtatvāya kalpate» — «Только тот ведь, кто к ним безучастен, кто в страданье и в радости ровен, тот бессмертья достичь способен, тот мудрец, о мой славный витязь.». Эта параллель раскрывает, почему именно dhīra сопровождает Ханумана на пороге беспримерного прыжка-подвига: эпитет несёт коннотацию невозмутимой стойкости (а не одной отваги), сближая героя-дута с идеалом sthitaprajña. Подстрочник «стойкий» уместен, но смысловой объём шире. Свидетельство: уровень шлоки (мягкое).", "type": "А", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.1.3", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bhagavadgītā 2.13 и 2.15 (Семенцов)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.3:1", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dhīra", "note_ru": "dhīra как эпитет. При первом появлении в книге V Хануман назван dhīraḥ «стойкий» (V.1.3, mahābalaḥ... dhīraḥ). В дидактике Шантипарвы dhīra — терминологическое имя нравственно совершенного: «yadā na kurute dhīraḥ sarvabhūteṣu pāpakam । karmaṇā manasā vācā brahma sampadyate tadā» (MBh XII.168.44) — «Когда стойкий не творит зла никакому существу делом, мыслью, словом, — тогда он достигает Брахмана». Помета фиксирует, что эпитет dhīra, прилагаемый к Хануману, несёт не только «храбрость», но и весь этический объём, который ему придаёт гномическая традиция.", "type": "В", "cluster": "mbh_gnomic", "cluster_label": "МБх дидактика (Шантипарва / Анушасанапарва)", "shloka_ref": "V.1.3", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Śāntiparvan (MBh XII) 12.168.44", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.4", "verse": "4", "sanskrit_iast": "dvijān vitrāsayan dhīmān urasā pādapān haran । mṛgāṃś ca subahūn nighnan pravṛddha iva kesarī ॥4॥", "leonov_ru": "Распугивая птиц, мудрый, грудью валя деревья, Убивая зверей во множестве, могучий, словно лев.", "commentary": {"bhusana": "द्विजान् वित्रासयन् धीमानुरसा पादपान् हरन् ।\n\nमृगांश्च सुबहून्निघ्नन् प्रवृद्ध इव केसरी\nद्विजानिति । केसरीव बभाविति शेषः", "tattvadipika": "केसरीव विचचारेति पूर्वेण सम्बन्धः"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dvija", "note_ru": "Дважды-рождённый (dvija) — букв. «дважды рождённый» (dvi-ja, от √jan «рождаться»). Термин охватывает три категории: 1) брахманы/кшатрии/вайшьи (второе рождение = инициация упанаяны); 2) птицы (второе рождение = вылупление из яйца); 3) зубы (второе «рождение» = смена молочных зубов). В V.1.4 dvijān = «птицы» (контекст: Хануман пугает их перед прыжком), но слово несёт кодовую многозначность трёх рождений. MW: dvija — «twice-born (brahman, bird, tooth)». Подстрочник «птиц» выбирает одно значение.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. dvija; Apte s.v. dvija", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.4:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "kesarin", "note_ru": "Гривастый / лев (kesarin) — букв. «имеющий гриву» (kesar-in, от kesara «грива»). Kesara/kesara — специфически «грива льва» или «тычинки цветка» (оба значения у MW). Kesarin как эпитет = «лев» (через метонимию гривы). В V.1.4 сравнение Ханумана с pravṛddha ivā kesarī — «как матёрый лев»: акцент именно на силе и зрелости зверя (pravṛddha «выросший»). В подстрочнике «лев» — теряется этимологический образ через гриву.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. kesarin; Apte s.v. kesara", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.5", "verse": "5", "sanskrit_iast": "nīlalohitamāñjiṣṭhapadmavarṇaiḥ sitāsitaiḥ । svabhāvasiddhair vimalair dhātubhiḥ samalaṃkṛtam ॥5॥", "leonov_ru": "Он увидел гору, украшенную минералами темно-синего, красного, лотосового цветов, Белыми и черными, совершенными по своей природе, чистыми,", "commentary": {"bhusana": "नीललोहितमाञ्जिष्ठपत्रवर्णैस्सितासितैः ।\n\nस्वभावविहितैश्चित्रैर्धातुभिः समलङ्कृतम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…украшенную / Минералами (dhātubhiḥ samalaṃkṛtam) – ср. в переводе Гринцера: «Минералы — глубокие вздохи» (II, 85, 19). По поводу точного определения цвета минералов комментаторы несколько расходятся. В «Тилаке» nīlalohita объясняется как «темно-красный» (raktaśyāmaḥ), māñjiṣṭha – как «серовато-белый» (kṛṣṇapāṇḍuraḥ) или же «розовый» (pāṭalaḥ). Композит sitāsita истолковывается комментаторами обычно как kalmāṣa (пестрый, крапчатый)."}, {"id": "lexical:5.1.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dhātu", "note_ru": "Рудные жилы / горные минералы (dhātu) — букв. «то, что несёт, поддерживает» (от √dhā «нести»); в контексте горного описания — «слои горной породы, рудные жилы». MW: dhātu — «primary element of the earth (metal, mineral, ore), constituent element of the body, grammatical root». В V.1.5 svabhāvasiddhair vimalair dhātubhiḥ — «чистыми, природой созданными рудными жилами». Лексически многозначно: dhātu = 1) минерал/руда горы, 2) элемент тела, 3) грамматический корень. Геологический смысл нетривиален; подстрочник «жилами руды» адекватен, но этимология через √dhā «поддерживать» — т.е. «опоры горы» — остаётся в тени.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. dhātu; Apte s.v. dhātu", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.5:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dhātu", "note_ru": "Гора (Махендра), «украшенная минералами (dhātu) тёмно-синего, красного, лотосового, белого и чёрного цветов» (1.5), описана приёмом, чей locus classicus в кавье — открытие «Кумарасамбхавы», где Гималаи несут «balāhakacchedavibhaktarāgām akālasaṃdhyām iva dhātumattām» (Кумара I.4) — «[вершину] с расцветкой, разделённой как разрывы туч, словно преждевременный закат, изобилующую рудами (dhātu)». У обоих поэтов dhātu — минеральные жилы, окрашивающие склон; Калидаса доводит образ до «несвоевременного заката». Параллель раскрывает технический смысл dhātu (горная руда-краситель), который подстрочник передаёт нейтральным «минералы».", "type": "Б", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.1.5", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Kumārasambhava I.4 (Kālidāsa)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.6", "verse": "6", "sanskrit_iast": "kāmarūpibhir āviṣṭam abhīkṣṇaṃ saparicchadaiḥ । yakṣakiṃnaragandharvair devakalpaiḥ sapannagaiḥ ॥6॥", "leonov_ru": "Меняющими свободно облик постоянно населенную с их близкими Якшами, киннарами, гандхарвами богоподобными и змеями.", "commentary": {"bhusana": "कामरूपिभिराविष्टमभीक्ष्णं सपरिच्छदैः ।\n\nयक्षकिन्नरगन्धर्वैर्देवकल्पैश्च पन्नगैः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна I. 1. 32: Гандхарвы (gandharva) — полубожественные существа, небесные музыканты."}]}, {"verse_id": "5.1.7", "verse": "7", "sanskrit_iast": "sa tasya girivaryasya tale nāgavarāyute । tiṣṭhan kapivaras tatra hrade nāga ivābabhau ॥7॥", "leonov_ru": "Он на склоне той горы, где находились лучшие слоны (наги), Стоя, лучший из обезьян, стал подобен слону в озере.", "commentary": {"bhusana": "स तस्य गिरिवर्यस्य तले नागवरायुते ।\n\nतिष्ठते कपिवरस्तस्य ह्रदे नाग इवाबभौ"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Был нагу подобен в озере (hrade nāga ivābabhau) – слово nāga может означать как «наг» (полубожественный змей), так и «слон». Как отмечают Голдмены, из комментаторов только автор «Широмани» дает интерпретацию для этого слова, которое он глоссирует как gaja (слон). Большинство переводчиков, однако, склоняются к варианту «наг» (см.: Goldman 1984: 302).[Claude.AI — желательно] ? [кат.2 — многозначность] нāга (nāga) — змей или слон? Значение зависит от контекста"}, {"id": "lexical:5.1.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "nāga", "note_ru": "Наг / слон (nāga) — слово nāga двузначно: «наг» (полубожественный змей) и «слон». Из комментаторов только «Широмани» глоссирует здесь gaja (слон); большинство западных переводчиков — «наг» (Goldman 1984: 302). Подстрочник выбирает один вариант, скрывая амбивалентность оригинала.", "type": "Б", "subtype": "base", "trigger": "term", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.7:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "kapivara", "note_ru": "Лучший из обезьян (kapivara) — стандартный эпитет-сравнение (kapi-vara «лучший из обезьян»), синонимичен vānaraśreṣṭha, plavaṃgapravara. Первое вхождение в кн. V.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.8", "verse": "8", "sanskrit_iast": "sa sūryāya mahendrāya pavanāya svayambhuve । bhūtebhyaś cāñjaliṃ kṛtvā cakāra gamane matim ॥8॥", "leonov_ru": "Он Сурье, Великому Индре, богу ветра, Брахме И великим существам сделав анджали, обратил мысль к отправлению в путь.", "commentary": {"tilaka": "स्वयंभुवे पवनाय पूयते येन स्वज्ञानेन योगिवृन्दं स पवनो भगवान्प्रत्यक्तत्त्वभूतो रामः । एतेन सकलविघ्ननिवारणायेष्टदेवताप्रार्थनापूर्वं यात्रा कर्तव्येति सदाचारो बोधितः", "bhusana": "स सूर्याय महेन्द्राय पवनाय स्वयम्भुवे ।\n\nभूतेभ्यश्चाञ्जलिं कृत्वा चकार गमने मतिम्\nस सूर्यायेति । स्वयम्भुवे चतुर्मुखाय । भूतेभ्यः देवयोनिभ्यः", "siromani": "स इति । सूर्यादिभ्यो ऽञ्जलिं कृत्वा स हनूमान् गमने मतिं बुद्धिं चकार"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Ветер, Брахму и бхутов (pavanāya svayambhuve bhūtebhyaḥ) – обычно эпитет «самосущий» (svayambhū) относится к Брахме. Однако автор «Тилаки» рассматривает слова pavana (очиститель) и svayambhū как эпитеты одного и того же лица, под которым, как он полагает, подразуевается Рама."}, {"id": "crosstext:5.1.8:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mahendra", "note_ru": "Махендра (mahendra) «Великий Индра» в перечне богов, которым Хануман творит анджали перед прыжком (V.1.8: sūryāya mahendrāya pavanāya svayambhuve). Тот же титул в Бала-канде 1.29.21 закреплён за Индрой как восстановленным владыкой трёх миров после усмирения Бали. Призывание именно «Махендры» (а не просто Индры) маркирует верховный, победительный аспект бога — уместный для опасного предприятия; подстрочник даёт «Великому Индре» без этого оттенка.\n\nПараллель — Rām. Bāla 1.29.21:\n  «mahendrāya punaḥ prādāt niyamya balimojasā । trailokyaṃ sa mahātejāścakre śakravaśaṃ punaḥ ॥21॥»\n  Повязав Бали своею силой, Он, сиятельный, снова отдал Три мира под власть Шакры, Подчинив их Великому Индре.", "type": "А", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.1.8", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.29.21 (Гринцер, пер. изд. I–III)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.9", "verse": "9", "sanskrit_iast": "añjaliṃ prāṅmukhaṃ kurvan pavanāyātmayonaye । tato hi vavṛdhe gantuṃ dakṣiṇo dakṣiṇāṃ diśam ॥9॥", "leonov_ru": "Делая анджали на восток своему отцу, богу ветра, Тогда увеличился он в размерах искусный, чтобы лететь в южную сторону.", "commentary": {"tilaka": "आत्मयोनये पवनाय स्वजनकवायव इत्यर्थः । दक्षिणः कुशलः", "bhusana": "अञ्जलिं प्राङ्मुखः कृत्वा पवनायात्मयोनये ।\n\nततो ऽभिववृधे गन्तुं दक्षिणो दक्षिणां दिशम्\nअञ्जलिमिति । आत्मयोनये स्वकारणभूताय । दक्षिणः समर्थः । हनुमान् प्राङ्मुखः सन् आत्मयोनये पवनाय अञ्जलिं कृत्वा ततो दक्षिणां दिशं गन्तुं ववृध इत्यन्वयः । हिः पादपूरणे । अञ्जलिं प्राङ्मुखः कुर्वन्निति पाठस्त्वयुक्तः, शतृप्रत्ययेन प्राङ्मुखत्वविशेष्टाञ्जलिकरणदक्षिणदिग्गमनोद्योगयेरेककालिकत्वप्रतीत्या विरोधात् । नहि प्राङ्मुखस्यैव सत्तो दक्षिणदिग्गमनोद्योगो युज्यते", "siromani": "अञ्जलिमिति । दक्षिणः सर्वकार्यकुशलो हनूमान् आत्मयोनये स्वप्रादुर्भूतिकारणाय पवनायाञ्जलिं कृत्वा ववृधे"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "На восток поклонившись (añjaliṃ prāṅmukhaṃ kurvan) – в комментарии «Бхушана» вместо kurvan (делающий) стоит вариант kṛtvā (сделав). Голдмены отмечают, что неясно, почему, обращаясь к Ветру, Хануман обратился лицом на восток. Обычно стороной Вайю, бога ветра, считается северо-запад (см.: Goldman 1984: 303)."}, {"id": "lexical:5.1.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "māhendra", "note_ru": "Гора Махендра (māhendra) — «принадлежащая Великому Индре» (māhendra — прилагательное от mahendra «Великий Индра»); название горы на юге Индии (Mahendra-parvata), с которой, по Рамаяне, Хануман совершил прыжок. Māhendra — не просто «большая», а «священная гора Индры» — предполагает мифологическую принадлежность Индре как царю богов. В V.1.9 употреблено как топоним. Подстрочник «Махендра» сохраняет имя без пояснения его генитивной семантики.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. māhendra; Apte s.v. mahendra", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.9:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "plavaṃgama", "note_ru": "Прыгун / обезьяна (plavaṃgama) — букв. «движущийся прыжком» (plavam-gama, от √plu «прыгать, плыть» + gama «идущий»). Этимология: plava «прыжок, плот» + gama «идущий». MW: plavaṃgama — «going by leaps, a monkey». Противопоставлен plavaga (V.1.2) — «прыгун» вообще; plavaṃgama акцентирует именно способ передвижения через прыжок. Термин описывает биологический модус движения обезьяны, а не её внешность. Подстрочник «обезьяна» — этимология «прыгающий-ходок» утеряна.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. plavaṃgama; Apte s.v. plavaga", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.10", "verse": "10", "sanskrit_iast": "plavaṃgapravarair dṛṣṭaḥ plavane kṛtaniścayaḥ । vavṛdhe rāmavṛddhyarthaṃ samudra iva parvasu ॥10॥", "leonov_ru": "На глазах у вождей обезьян, решившийся прыгнуть [через океан], Вырос [Хануман] словно океан в полнолуние, ради пользы Рамы.", "commentary": {"tilaka": "रामवृद्ध्यर्थं रामाभ्युदयाय", "bhusana": "प्लवङ्गप्रवरैर्दृष्टः प्लवने कृतनिश्चयः ।\n\nववृधे रामवृद्ध्यर्थं समुद्र इव पर्वसु\nप्लवङ्गेति ।। रामवृद्ध्यर्थं रामप्रयोजनार्थम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Как океан в полнолунье (samudra iva parvasu) – букв. «в дни парван», то есть в новолуние и полнолуние, когда приливы происходят с наибольшей силой."}]}, {"verse_id": "5.1.12", "verse": "12", "sanskrit_iast": "sa cacālācalaś cāśu muhūrtaṃ kapipīḍitaḥ । tarūṇāṃ puṣpitāgrāṇāṃ sarvaṃ puṣpam aśātayat ॥12॥", "leonov_ru": "Та гора задвигалась тут же некоторое время стиснутая обезьяной, И отрясла все цветы с цветущих верхушек деревьев.", "commentary": {"bhusana": "स चचालाचलश्चापि मुहूर्तं कपिपीडितः ।\n\nतरूणां पुष्पिताग्राणां सर्वं पुष्पमशातयत्", "siromani": "स इति । कपिपीडितः अचलः स महेन्द्रः चचाल अत एव पुष्पिताग्राणां तरूणां पुष्पम् अशातयत् अपातयदित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «cāśu» Будут ли отмечаться в комм. Различия между редакциями (есть вариант चापि)[Е. Костина] «rāmavṛddhyarthaṃ» Опущено"}, {"id": "lexical:5.1.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "acala", "note_ru": "Гора / неподвижная (acala) — букв. «не движущаяся» (a-cala, от √cal «двигаться»). Стандартный термин для горы в санскрите — противительный через отрицание: гора как «вечно-неподвижное». Парадокс V.1.12: sa cacālācalaś cāśu — «тогда та неподвижная (гора) задвигалась». Игра слов: acala «неподвижная» + cacāla «задвигалась» (√cal). Это намеренная языковая фигура — игра с именем и природой горы. Подстрочник «та гора задвигалась» не передаёт оксюморон cacālācalaḥ.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. acala; Apte s.v. cala", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.14", "verse": "14", "sanskrit_iast": "tena cottamavīryeṇa pīḍyamānaḥ sa parvataḥ । salilaṃ samprasusrāva madamatta iva dvipaḥ ॥14॥", "leonov_ru": "Та гора, сжимаемая лучшим из героев, Излила воду, словно слон в течке [изливает маду].", "commentary": {"tilaka": "उत्तमवीर्येण तेन पीड्यमानः स पर्वतसलिलं प्रसुस्राव", "bhusana": "तेन चोत्तमवीर्येण पीड्यमानस्स पर्वतः ।\n\nसलिलं सम्प्रसुस्राव मदं मत्त इव द्विपः", "siromani": "तेनेति । उत्तमवीर्येण हनुमता पीड्यमानः स महेन्द्रः मदमत्तो द्विप इव सलिलं संप्रसुस्राव"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mada", "note_ru": "Течка-мад / опьянение слона (mada) — букв. «опьянение, экстаз» (от √mad «быть пьяным, буйствовать»). Специальный термин для «течки слона» — mada = сок, выделяемый из желёз за ушами самца слона в период спаривания. MW: mada — «hilarity, rapture; the fluid secreted from the elephant's temples». В V.1.14 сравнение горы с madamatta iva dvipaḥ — «как слон в течке (мада)»: гора источает воду точно как слон mada. Подстрочник «в течке» сохраняет смысл, но mada как технический термин зоологии заслуживает отдельной сноски.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. mada; Apte s.v. mada", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.15", "verse": "15", "sanskrit_iast": "pīḍyamānas tu balinā mahendras tena parvataḥ । rītir nirvartayām āsa kāñcanāñjanarājatīḥ ॥15॥", "leonov_ru": "Сжимаемая могучим [Хануманом], гора Махендра Исторгла поток из золота, сурьмы и серебра.", "commentary": {"bhusana": "पीड्यमानस्तु बलिना महेन्द्रस्तेन पर्वतः ।\n\nरीतिर्निर्वर्तयामास कगाञ्चनाञ्जनराजतीः\nपीड्यमान । रीतीः रेखाः काञ्चनाञ्जनरजतगर्भासु शिलासु विदीर्यमाणासु दृश्यमानास्तास्ता भेदधारा इत्यर्थः", "siromani": "पीड्यमान इति । बलिना हनुमता पीड्यमानो महेन्द्रः काञ्चनाञ्चनराजतीः काञ्चनादिमयीः रीतीः रेखाः निर्वर्तयामास प्रकाशयामास", "tattvadipika": "महेन्द्रः काञ्चनाञ्जनराजतीः काञ्चनाञ्जनरजतमयीः । रीतिः पद्धतीः, धारा इत्यर्थः । निर्वर्तयामास प्रादुर्भावयामासेत्यर्थः"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "rīti", "note_ru": "Поток металлической руды / латунь (rīti) — MW: rīti — «going, flowing; a particular metal (brass or bronze); the current of a river». В V.1.15 rītiṃ nirvartayām āsa kāñcanāñjanarājatīḥ — гора извергала «поток» (rīti) из золота, сурьмы и серебра. Rīti здесь = «поток расплавленного металла / рудный сток», не просто «поток воды». Апте дополняет: rīti = «a stream of water; also a kind of metal». Лексически важно: rīti — одновременно «течение» и «металлический сплав», оба смысла актуальны в описании горы.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. rīti; Apte s.v. rīti", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.15:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "añjana", "note_ru": "Сурьма / коллирий (añjana) — букв. «то, чем натирают/мажут» (от √añj «мазать, натирать»). MW: añjana — «anointing; a collyrium or black pigment used to paint the eyelashes; antimony». В V.1.15 kāñcanāñjanarājatīḥ — тройное сложение: kāñcana «золото» + añjana «сурьма/свинцовый блеск» + rājata «серебро». Añjana — чёрный минеральный пигмент (антимонит, Sb₂S₃), традиционный в Индии коллирий. Контраст трёх цветов: золотой / чёрный / серебряный. Подстрочник «сурьма» верен, но этимологическая связь añjana ↔ глаз-пигмент-руда объясняет, почему именно это слово выбрано.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. añjana; Apte s.v. añjana", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.16", "verse": "16", "sanskrit_iast": "mumoca ca śilāḥ śailo viśālāḥ samanaḥśilāḥ । madhyamenārciṣā juṣṭo dhūmarājīr ivānalaḥ ॥16॥", "leonov_ru": "Извергла гора огромные камни с реальгаром, Словно огонь с языками пламени посредине – столбы дыма.", "commentary": {"bhusana": "मुमोच च शिलाश्शैलो विशालास्समनश्शिलाः ।\n\nमध्यमेनार्चिषा जुष्टो धूमराजीरिवानलः\nमुमोचेति । समनश्शिलाः धातुविशेषसहिताः । मध्यमेनार्चिषा मध्यमया ज्वालया, पार्श्वज्वाला हि न धूमनिवर्तिका", "siromani": "मुमोचेति । शैलः समनशिशलाः मनश्शिलासहिताः शिलाः मुमोच । तत्र दृष्टान्तः, मध्यमेन मध्यभागेन अर्चिषा ज्वालया जुष्टः संयुक्तः अनलः धूमराजीः धूमपङ्क्तीरिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Глыбы камней с сандараком (śilāḥ viśālāḥ samanaḥśilāḥ) – сандараком в старину называли реальгар (красный сульфат мышьяка), использовавшийся в качестве краски."}, {"id": "edition:5.1.16:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлока 5.1.16 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.1.16", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.16", "iast": "mumoca ca śilāḥ śailo viśālāḥ samanaḥśilāḥ । madhyamenārciṣā juṣṭo dhūmarājīr ivānalaḥ ॥16॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.18", "verse": "18", "sanskrit_iast": "sa mahāsattvasaṃnādaḥ śailapīḍānimittajaḥ । pṛthivīṃ pūrayām āsa diśaś copavanāni ca ॥18॥", "leonov_ru": "Этот крик великих существ, рожденный из-за сжимания горы, Наполнил рощи и все стороны земли.", "commentary": {"tilaka": "\"स महासत्त्व--\" इति पाठे महासत्त्वा महाजन्तवस्तेषां संनाद इति तीर्थः । \"स महान्सत्त्वसंनादः\" इति पाठान्तरम्", "siromani": "स इति । शैलपीडानिमित्तजः शैलपीडारूपनिमित्ताज्जनितः स प्रसिद्धः महान् सत्त्वसंन्नादः पृथिव्यादीनि पूरयामास", "tattvadipika": "समनश्शिलाः धातुविशेषसहिताः । मध्यमेनार्चिषा जुष्टः, कालीकरालीविष्फुलिङ्गिनीधूम्रवर्णाविश्वरुचिलोहितामनोजवाभिधानासु सप्तस्वग्निजिह्वासु मध्यमया धूम्राख्यया विशिष्टः अग्निः धूमराजीरिव धूमनिचयानिव शैलः पर्वतः शिला मुमोचेति सम्बन्धः ।। 5.1.16,17 ।।\n\nस इति । महासत्त्वाः महाजन्तवः तेषां सन्नादः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Вопль великих существ (sa mahāsattvasaṃnādaḥ) – этот композит можно понять и как «великий вопль существ». Автор «Таттвадипики» понимает mahāsattvasaṃnādaḥ в первом смысле, в «Тилаке» приводятся оба варианта. Автор «Широмани» понимает этот композит во втором смысле."}]}, {"verse_id": "5.1.19", "verse": "19", "sanskrit_iast": "śirobhiḥ pṛthubhir nāgā vyaktasvastikalakṣaṇaiḥ । vamantaḥ pāvakaṃ ghoraṃ dadaṃśur daśanaiḥ śilāḥ ॥19॥", "leonov_ru": "Наги с широкими головами (с раздувшимися капюшонами), на которых стали ясно видны темно-синие линии, Извергая ужасное пламя, кусали зубами камни.", "commentary": {"tilaka": "स्वस्तिकः फणास्थनीलरेखा तच्चिह्नैः शिरोभिरुपलक्षिताः । ददंशुः पीडाजनितक्रोधवशात्", "bhusana": "शिरोभिः पृथुभिस्सर्पा व्यक्तस्वस्तिकलक्षणैः ।\n\nवमन्तः पावकं घोरं ददंशुर्दशनैश्शिलाः\nशिरोभिरिति ।। स्वस्तिकं नाम फणोपरि दृश्यमानार्धचन्द्रकम् । ददंशुरिति । दंशनं कोपव्यापारः", "siromani": "शिरोभिरिति । व्यक्तानि स्वस्तिकलक्षणानि फणास्थितनीलरेखारूपचिह्नानि येषु तैः पृथुभिः स्थूलैः शिरोभिः पावकं वमन्तो नागाः दशनैर्दैंष्ट्राभिः शिलाः ददंशुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Так что синие линии выступили (vyaktasvastikalakṣaṇaiḥ) – букв. «явно отмеченные свастиками». В «Тилаке» слово svastika в данном контексте поясняется как «темно-синяя линия на змеином капюшоне» (phaṇāsthanīlarekhā). Другого мнения придерживается автор «Бхушаны», который полагает, что это «полумесяц, видимый на змеином капюшоне» (phaṇopari dṛśyamānārdhacandrakam)."}, {"id": "lexical:5.1.19:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "svastika", "note_ru": "Свастика / благой знак (svastika) — букв. «то, что несёт свасти» (sva-asti «благополучие»). В V.1.19 vyaktasvastikalakṣaṇaiḥ — у нагов «с явными знаками свастики на головах»: свастика как апотропейный символ у змей-нагов. MW: svastika — «a kind of mystical cross or mark made on persons and things as a sign of good luck». Это первое упоминание символа в Сундараканде; свастика здесь — реальная маркировка капюшона кобры (ромбовидный узор), а не абстрактный знак.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. svastika; Apte s.v. svastika", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.20", "verse": "20", "sanskrit_iast": "tās tadā saviṣair daṣṭāḥ kupitais tair mahāśilāḥ । jajvaluḥ pāvakoddīptā vibhiduś ca sahasradhā ॥20॥", "leonov_ru": "Тогда те огромные камни, укушенные разгневанными ядовитыми [змеями] Вспыхивали, блистая пламенем, и распадались на тысячу частей.", "commentary": {"tilaka": "सविषैस्तैः सर्पैर्दष्टाः सत्यः पावकोद्दीप्ता इव जज्वलुः बिभिदुर्भिन्ना बभूवुश्च", "bhusana": "तास्तदा सविषैर्दष्टाः कुपितैस्तैर्महाशिलाः ।\n\nजज्वलुः पावकोद्दीप्ता बिभिदुश्च सहस्रधा\nता इति । बिभिदुः भिन्नाः", "siromani": "ता इति । सविषैर्विषसहितैस्तैर्नागैर्दष्टा महाशिलाः पावकोद्दीप्ता इव जज्वलुः सहस्रधा बिभिदुश्च"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "От ядовитых укусов / эти огромные глыбы (tās tadā saviṣair daṣṭāḥ kupitais tair mahāśilāḥ) – букв.: «тогда ими, ядовитыми, разъяренными, укушенные огромные камни…»."}]}, {"verse_id": "5.1.21", "verse": "21", "sanskrit_iast": "yāni cauṣadhajālāni tasmiñ jātāni parvate । viṣaghnāny api nāgānāṃ na śekuḥ śamituṃ viṣam ॥21॥", "leonov_ru": "И заросли лекарственных трав, которые росли на той горе, Даже будучи противоядиями, не могли усмирить яд змей.", "commentary": {"tilaka": "शमितुं शमयितुम्", "bhusana": "यानि चौषधजालानि तस्मिन् जातानि पर्वते ।\n\nविषघ्नान्यपि नागानां न शकुश्शमितुं विषम्\nयानीति । अत्र तानीत्यध्याहार्यम् । शमितुं शमयितुम्", "siromani": "यानीति । विषघ्नानि यानि औषधजालानि औषधसमूहाः यस्मिन् पर्वतजातानि तान्यपि नागानां विषं शमितुं न शेकुः", "tattvadipika": "शिरोभिरुपलक्षिताः । स्वस्तिकः फणस्थो नीलरेखाविशेषः ।। 5.1.19,20 ।।\n\nयानीति । शमितुं शमयितुम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Не смогли бы утишить / силу этого яда (viṣaghnāny api nāgānāṃ na śekuḥ śamituṃ viṣam) – букв. «хотя и являющиеся противоядием от [яда] змей, не могли утишить яд».[Е. Костина] «nāgānāṃ» Опущено, но не критично, как мне кажется"}]}, {"verse_id": "5.1.22", "verse": "22", "sanskrit_iast": "bhidyate 'yaṃ girir bhūtair iti matvā tapasvinaḥ । trastā vidyādharās tasmād utpetuḥ strīgaṇaiḥ saha ॥22॥", "leonov_ru": "«Рушат гору [некие] существа», - так подумав, аскеты Испуганные видьядхары с той [горы] взлетели с женами вместе.", "commentary": {"tilaka": "भूतैर्ब्रह्मरक्षःप्रभृतिमहाभूतैः", "bhusana": "भिद्यते ऽयं गिरिर्भूतैरिति मत्वा तपस्विनः\nभिद्यत इत्यर्धमेकम् । उत्पेतुरित्यनुषज्यते\nत्रस्ता विद्याधरास्तस्मादुत्पेतुः स्त्रीगणैस्सह ।\n\nपानभूमिगतं हित्वा हैममासवभाजनम् ।\n\nपात्राणि च महार्हाणि करकांश्च हिरण्मयान्\nत्रस्ता इत्यादिसार्दश्लोकद्वमेकान्वयम् । आसवभाजनं मद्यपात्रम् । पात्राणि भोजनपात्राणि । आर्षभाणि चर्माणि ऋषभचर्मपिनद्धानि खेटकानि । त्सरुः मुष्टिबन्धनम् ।। 5.1.23,24।।\n\nकृतकण्ठगुणाः क्षीबा रक्तमाल्यानुलेपनाः ।\n\nरक्ताक्षाः पुष्कराक्षाश्च गगनं प्रतिपेदिरे\nकृतेति । कृतकण्ठगुणाः कृतकण्ठस्रजः । क्षीबाः मत्ताः । रक्ताक्षाः मधुपानात् । पुष्कराक्षाः स्वभावत इत्यर्थः", "siromani": "भिद्यते इति । अयं गिरिः भूतैर्भुवि पृथिव्याम् उतैर्व्याप्तैर्देवविशेषैः भिद्यते इति मत्वा त्रस्तास्तपस्विनः विद्याधराश्च तस्माद्गिरेः उत्पेतुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.22:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Бхуты гору крушат (bhidyate 'yaṃ girir bhūtaiḥ) – автор «Тилаки» объясняет, что под бхутами здесь подразумеваются «великие существа – брахмаракшасы и т. д.».Так подумав, аскеты, / испугались, а видьядхары (iti matvā tapasvinaḥ trastā vidyādharāḥ) – Голдмены отмечают допустимость прочтения «испуганные аскеты-видьядхары», однако в своем переводе следуют большинству комментариев, которые рассматривают аскетов и видьядхаров здесь как разные категории (см.: Goldman 1984: 102, 304).[Claude.AI — желательно] [термин] (учтено) Первое появление в кн. V; введено в Рамаяна II. 11. 15: Бхуты (bhūta) — духи, ночные демоны, иногда смешиваемые с ракшасами и пишачами."}, {"id": "lexical:5.1.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "vidyādhara", "note_ru": "Видьядхара (vidyādhara) — букв. «держатель знания/заклинания» (vidyā «знание, заклинание» + dhara «несущий», от √dhṛ «держать»). Полубожественные существа, владеющие магическими формулами (vidyā); обитают в воздухе между землёй и небом. MW: vidyādhara — «a kind of supernatural being possessing magical knowledge». В V.1.22 vidyādharās tasmād utpetuḥ — видьядхары бегут с горы в страхе. Отличие от gandharva (небесные певцы) и deva (боги): видьядхары — «маги воздушного пространства», их сила — магическое знание, а не физическая сила или музыка.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. vidyādhara; Apte s.v. vidyādhara", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.24", "verse": "24", "sanskrit_iast": "lehyān uccāvacān bhakṣyān māṃsāni vividhāni ca । ārṣabhāṇi ca carmāṇi khaḍgāṃś ca kanakatsarūn ॥24॥", "leonov_ru": "Разнообразные мягкие (которые можно лизать) блюда и разнообразные мясные блюда, И щиты из бычьих кож, и мечи с золочеными рукоятками,", "commentary": {"tilaka": "आर्षभाणि ऋषभचर्मनिर्मितानि चर्माणि फलकानि । त्सरुः खड्गमुष्टिः", "bhusana": "लेह्यानुच्चावचान् भक्ष्यान् मांसानि विविधानि च ।\n\nआर्षभाणि च चर्माणि खड्गांश्च कनकत्सरून्", "tattvadipika": "भूतैः पृथिव्यादिभिस्सह ।। 5.1.22,23 ।।\n\nआर्षभाणि ऋषभचर्मपिनद्धानि । चर्माणि फलकानि । कनकत्सरून् सुवर्णखड्गमुष्टीन्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.24:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Яства, что нежны на вкус (lehyān uccāvacān bhakṣyān) – букв. «которые надлежит лизать»."}]}, {"verse_id": "5.1.25", "verse": "25", "sanskrit_iast": "kṛtakaṇṭhaguṇāḥ kṣībā raktamālyānulepanāḥ । raktākṣāḥ puṣkarākṣāś ca gaganaṃ pratipedire ॥25॥", "leonov_ru": "В ожерельях, пьяные, в красных гирляндах и притираниях, Красноглазые, лотосоглазые, взлетели [они] в небо.", "commentary": {"tilaka": "कृताः कण्ठेषु गुणाः स्रजो यैस्ते । क्षीबा मत्ताः । पुष्करं पद्मम्", "tattvadipika": "कण्ठगुणाः कण्ठस्रजः । क्षीबा मत्ताः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «С глазами, покрасневшими, словно лотосы.» Расхождение с файлом Рамаяна22: С глазами, как лотосы, красными[Claude.AI — строго] [термин] (не учтено) тамала — Garcinia xanthochymus"}, {"id": "lexical:5.1.25:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "kṣība", "note_ru": "Пьяный (kṣība) — MW: kṣība — «intoxicated, drunk». Редкое слово: базовый эпитет для состояния опьянения в эпосе, синоним mattaḥ (V.1.14), но более архаичный. Апте: kṣība = «drunk, intoxicated». В V.1.25 kṣībā raktamālyānulepanāḥ — видьядхары пьяны и украшены красными гирляндами. Кṣība употребляется реже, чем matta или pramatta; его присутствие здесь подчёркивает сцену праздника/торжества на горе перед прыжком Ханумана.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. kṣība; Apte s.v. kṣība", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.26", "verse": "26", "sanskrit_iast": "hāranūpurakeyūrapārihāryadharāḥ striyaḥ । vismitāḥ sasmitās tasthur ākāśe ramaṇaiḥ saha ॥26॥", "leonov_ru": "Жены [их] в ожерельях и браслетах Изумленные, с улыбками, пребывали в небе вместе с мужьями.", "commentary": {"bhusana": "हारनूपुरकेयूरपारिहार्यधराः स्त्रियः ।\n\nविस्मितास्सस्मितास्तस्थुराकाशे रमणैस्सह\nहारेति । पारिहार्यं वलयम् । तस्थुः तस्थुश्च", "siromani": "हारेति । हारादिधराः स्त्रियः रमणैर्विद्याधरैः सह आकाशे तस्थुः । तत्र पारिहार्यशब्दः श्रेष्ठवाचीति कतकः, वलयवाचीति तीर्थः", "tattvadipika": "हारेति । पारिहार्यः वलयः \" आवापकः पारिहार्यः कटकं वलयो ऽस्त्रियाम्\" इत्यमरः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Изумленные, улыбаясь (vismitāḥ sasmitāḥ) – Голдмены дают два варианта объяснения, почему видьядхари улыбаются. Возможно, они обрадованы тем, что оказались вне опасности. Но также возможно, что sasmitāḥ (улыбающиеся) – это постоянный эпитет видьядхари, не относящийся к конкретному моменту (стр. 305-306)."}]}, {"verse_id": "5.1.27", "verse": "27", "sanskrit_iast": "darśayanto mahāvidyāṃ vidyādharamaharṣayaḥ । sahitās tasthur ākāśe vīkṣāṃ cakruś ca parvatam ॥27॥", "leonov_ru": "Выказывая великое знание (магическую силу), великие риши-видьядхары Вместе пребывали в небе и оглядывали гору.", "commentary": {"bhusana": "दर्शयन्तो महाविद्यां विद्याधरमहर्षयः ।\n\nसहितास्तस्थुराकाशे वीक्षां चक्रुश्च पर्वतम्\nदर्शयन्तः प्रयोजयन्तः । महाविद्याम् अणिमाद्यष्टमहासिद्धिम् । विद्याधरमहर्षयः विद्याधराः महर्षय इवेत्युपमितसमासः । \"उपमितं व्याघ्रादिभिः सामान्याप्रयोगे\" इत्यनुशासनात् । विद्याधरश्रेष्ठा इत्यर्थः । विद्याधरा महर्षयश्चेति द्वन्द्वसमासो न युक्तः, इति विद्याधराः श्रुत्वेत्युपरितनश्लोके विद्याधराणामेवोपादानात्", "tattvadipika": "विद्याधरमहर्षयः विद्याधरश्रेष्ठा इत्यर्थः । महाविद्याम् अणिमादिसिद्धम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Великие риши» Нужен будет потом комм про риши в эпосе"}, {"id": "lexical:5.1.27:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mahāvidyā", "note_ru": "Великое знание / великая магия (mahāvidyā) — букв. «великое знание» (mahā + vidyā). В мантрическом контексте vidyā = заклинание-формула. MW: vidyā — «knowledge, science, learning; a spell, charm». Mahāvidyā в тантрических текстах — десять великих богинь (Daśamahāvidyā). В V.1.27 darśayanto mahāvidyāṃ vidyādharamaharzayaḥ — «выказывая великое знание», риши-видьядхары демонстрируют магические способности (сиддхи). Здесь mahāvidyā = «магическое искусство» как таковое, не десять богинь. Контекст нетривиален: речь о демонстрации сиддх перед прыжком Ханумана.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. vidyā; Apte s.v. mahāvidyā", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.28", "verse": "28", "sanskrit_iast": "śuśruvuś ca tadā śabdam ṛṣīṇāṃ bhāvitātmanām । cāraṇānāṃ ca siddhānāṃ sthitānāṃ vimale 'mbare ॥28॥", "leonov_ru": "И услышали они тогда слова чистых душою риши, Чаранов и сиддхов, находившихся в чистом небе:", "commentary": {"bhusana": "शुश्रुवुश्च तदा शब्दमृषीणां भावितात्मानम् ।\n\nचारणानां च सिद्धानां स्थितानां विमले ऽम्बरे", "tattvadipika": "शब्दं वाक्यम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.28:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Строфы 27 и 28 отсутствуют в бомбейском издании, но приводятся в издании «Гита-пресс».[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна III. 8. 12: Высшее начало (ātman) — атман, личное и одновременно универсальное «я», абсолют в индийской религиозно-мифологической системе."}]}, {"verse_id": "5.1.29", "verse": "29", "sanskrit_iast": "eṣa parvatasaṃkāśo hanūmān mārutātmajaḥ । titīrṣati mahāvegaḥ samudraṃ varuṇālayam ॥29॥", "leonov_ru": "«Это подобный горе Хануман, сын ветра, Желает, стремительный, пересечь океан, обитель Варуны.", "commentary": {"tilaka": "तेषां तपस्विनामाकाशचारितपास्विनां वाचः \"एष पर्वतसङ्काशः\" इत्यादिश्लोकद्वयरूपाः श्रुत्वा विद्याधरास्तमप्रमेयं ददृशुः । तद्वाक्यश्रवणात्पूर्वं तु भूतैरयं गिरिर्भिद्यत इति ज्ञातवन्तः", "bhusana": "एष पर्वतसङ्काशो हनूमान् मारुतात्मजः ।\n\nतितीर्षति महावेगस्समुद्रं मकरालयम्", "tattvadipika": "तमेवाह एष इत्यादि"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.29:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mārutātmaja", "note_ru": "Сын бога ветра (mārutātmaja) — патроним Ханумана (māruta-ātmaja «сын Маруты/Ваю»), пара к vāyuputra. Первое вхождение в кн. V.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.29:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "samudra", "note_ru": "Океан (samudra) — великий океан (samudra), отделяющий материк от Ланки; эпитеты varuṇālaya «обитель Варуны», mahodadhi «великий водоём». Его переплытие в один прыжок — центральный подвиг кн. V. Подстрочник передаёт нарицательным «океан», не отмечая его как мифологизированную водную преграду — обитель Варуны. См. примеч. к I.1.16 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "base", "trigger": "realia", "source": "gazetteer (analysis §09б / formulas tt.1-2) — first occurrence in кн. V (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.29:2", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mārutātmaja", "note_ru": "Сын бога ветра (mārutātmaja). [Е. Костина]: именной эпитет «mārutātmaja» присутствует в оригинале, но не передан отдельным словом в подстрочнике («…«Это подобный горе Хануман, сын ветра, Желает, стремительный…»). В литературном тексте эпитет восстанавливается; отметить как незафиксированное опущение — на усмотрение редактора.", "type": "Б", "subtype": "base", "trigger": "omission", "source": "parallel-text divergence (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.29:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mārutātmaja (Hanumān)", "note_ru": "Хануман назван mārutātmaja — «сын (ātmaja) Маруты/Ваю» — в первом же описании прыжка через океан (V.1.29: eṣa … hanūmān mārutātmajaḥ। titīrṣati … samudraṃ varuṇālayam). В «Рагхувамше» Кālidāса воспроизводит этот же образ в сарге 13, посвящённой Рāмāяне: Raghu 13.21 называет Ханумана vāyusutaṃ mahābalam («сын ветра, великомощный»). Эпитет мāрутāтмаджа — теологически точный: Хануман порождён Ваю (богом ветра), а сам прыжок — воплощённый атрибут отца, ваю-шакти. «Рагхувамша» переосмысляет этот эпитет как кāвья-перифраз, ставя его рядом со сравнением с Гарудой (ср. Sundara V.1.2 garuḍopama). Первая крупная кāвья-рецепция mārutātmaja как имени Ханумана.", "type": "А", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.1.29", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Kālidāsa, Raghuvaṃśa 13.21 (vāyusutaṃ mahābalam)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.29:1", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mārutātmaja / mārutaṃ gaṇam", "note_ru": "Хануман назван mārutātmaja — «рождённый из Маруты / Ваю» — в первом же описании его прыжка (V.1.29: eṣa … hanūmān mārutātmajaḥ। titīrṣati … samudraṃ varuṇālayam). Веды дают теологический фундамент этому эпитету. В «Ригведе» Маруты — класс ветровых божеств, «сыновья Рудры» (rudrasya sūnavaḥ): РВ 1.64.12 — ghṛṣum pāvakaṃ vaninaṃ vicarṣaṇiṃ rudrasya sūnuṃ havasā gṛṇīmasi | rajasturaṃ tavasam mārutaṃ gaṇam («Бодрых, очищающих, быстрых, всё превосходящих, сынов Рудры зовём мы гимнами; за пересекающею пространство толпой Марутов…»). В РВ Маруты — грозовые ветры, несущие жизненную силу (ojas) и стремительность (vega): именно эти качества воплощает Хануман в прыжке. Эпос переосмысляет «сына Маруты» из ведийского грозового духа в персонажного сына бога ветра Ваю (vāyuputra; V.1.61 — vāyuputrasya). Vedic anchor: mārutaṃ gaṇaṃ = коллектив Марутов → mārutātmaja = Хануман как их эпическая персонификация-потомок.", "type": "А", "cluster": "veda", "cluster_label": "", "shloka_ref": "V.1.29", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Ṛgveda 1.64.12 (rudrasya sūnuṃ … mārutaṃ gaṇam); РВ 5.42.15 (rudrasya sūnūṃr yuvanyūṃr)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.29:2", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "varuṇālaya (ocean as Varuṇa's dwelling)", "note_ru": "Океан назван в Сундараканде varuṇālaya — «обитель Варуны» — трижды (V.1.29; V.1.50; V.1.173). Это не просто поэтический эпитет: Варуна — ведийский владыка космических вод, и обозначение океана его «обителью» восходит к ведийской теологии. В РВ Варуна связан с безмерными водами (apāṃ patiḥ, «повелитель вод»): РВ 7.87.1 — vy akhyad dyām ṛtur id asya dharmā sindhoḥ pārā uta parāṇi («Он огляделся [Варуна] — для него вечный порядок держит берега Синдху и дальние просторы»); РВ 7.64.1-2 — samrājā bhūmyā divo varuṇo mitro aryamā («Вседержители земли и неба — Варуна, Митра, Арьяман»). В эпосе varuṇālaya прямо переводит ведийский образ Варуны как морского бога в географический термин. Эпический Хануман пересекает «царство Варуны» — теологически точное название для океана в ведийской традиции. Locus classicus для понимания этого эпитета.", "type": "А", "cluster": "veda", "cluster_label": "", "shloka_ref": "V.1.29", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Ṛgveda 7.87.1; 7.64.1 (Varuṇa as lord of cosmic waters / sindhu)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.31", "verse": "31", "sanskrit_iast": "iti vidyādharā vācaḥ śrutvā teṣāṃ tapasvinām । tam aprameyaṃ dadṛśuḥ parvate vānararṣabham ॥31॥", "leonov_ru": "Услышав слова тех подвижников, видьядхары Увидели на горе того безразмерного буйвола среди обезьян.", "commentary": {"tilaka": "हित्वेत्यत्र विद्याधराः कर्तारः", "bhusana": "इति विद्याधराः श्रुत्वा वचस्तेषां महात्मनाम् ।\n\nतमप्रमेयं ददृशुः पर्वते वानरर्षभम्"}, "has_tier1": false, "notes": [{"id": "edition:5.1.31:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлока 5.1.31 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.1.31", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.31", "iast": "iti vidyādharā vācaḥ śrutvā teṣāṃ tapasvinām । tam aprameyaṃ dadṛśuḥ parvate vānararṣabham ॥31॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.33", "verse": "33", "sanskrit_iast": "ānupūrvyā ca vṛttaṃ tal lāṅgūlaṃ romabhiś citam । utpatiṣyan vicikṣepa pakṣirāja ivoragam ॥33॥", "leonov_ru": "В три кольца хвост, покрытый шерстью, Скрутил он, собирающийся взлететь, словно владыка птиц (Гаруда) – огромную змею.", "commentary": {"tilaka": "आनुपूर्व्याद्वृत्तं त्रिवलयं लाङ्गूलं विचिक्षेपेत्यन्वयः", "bhusana": "आनुपूर्व्येण वृत्तं च लाङ्गूलं रोमभिश्चितम् ।\n\nउत्पतिष्यन् विचिक्षेप पक्षिराज इवोरगम्", "siromani": "आनुपूर्व्यादिति । आनुपूर्व्यात्क्रमशः वृत्तं वर्तुलं लोमभिश्चितं निबिडं तत्प्रसिद्धं लाङ्गूलमुत्पतिष्यन्सन् पक्षिराज उरगमिव चिक्षेप", "tattvadipika": "आनुपूर्व्यात् वृत्तं लाङ्गूलं विचिक्षेपेत्यन्वयः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.33:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Закрутил в три кольца (ānupūrvyā ca vṛttam) – так объясняет это выражение автор «Тилаки». В других комментариях (например, в «Широмани» ānupūrvyā объясняется как «постепенно» (kramaśas). Голдмены полагают, что речь идет о сужающемся к концу хвосте и переводят как «rounded, tapering» (см.: Goldman 1984: 103)."}, {"id": "lexical:5.1.33:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "lāṅgūla", "note_ru": "Хвост (lāṅgūla) — MW: lāṅgūla — «a tail (especially of a monkey)». Не общее слово для «хвоста» (puccha), а специфически «хвост обезьяны» — этот термин употребляется в Сундараканде исключительно применительно к хвосту Ханумана. Apte: lāṅgūla = «the tail of an animal, especially a monkey». В V.1.33–1.34 хвост (lāṅgūla) описан отдельными сравнениями: скрученный «как змея у Гаруды», потом торчащий «как знамя Индры» (V.1.61). Lāṅgūla — не нейтральный зоологический термин, а специфически «обезьяний-эпический хвост».", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. lāṅgūla; Apte s.v. lāṅgūla", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.34", "verse": "34", "sanskrit_iast": "tasya lāṅgūlam āviddham ativegasya pṛṣṭhataḥ । dadṛśe garuḍeneva hriyamāṇo mahoragaḥ ॥34॥", "leonov_ru": "Изогнутый хвост позади того стремительного (Ханумана) Выглядел словно огромная змея, которую уносит Гаруда.", "commentary": {"tilaka": "आविद्धमास्फालितं भुग्नं च", "bhusana": "तस्य लाङ्गूलमाविद्धमात्तवेगस्य पृष्ठतः ।\n\nददृशे गरुडेनेव ह्रियमाणो महोरगः", "siromani": "तस्येति । आविद्धं प्रवृद्धमतिवेगस्य तस्य हनूमतः पृष्ठतः पश्चाद्भागे विद्यमानं लाङ्गूलं गरुडेन ह्रियमाणो महोरग इव ददृशे\nलाङ्गूलमिति । समाविद्धम् उन्नतीकृतमुच्छ्रितं शक्रध्वजमिव शोभते", "tattvadipika": "आविद्धं भुग्नम्"}, "has_tier1": false, "notes": [{"id": "crosstext:5.1.34:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "garuḍa / mahoraga", "note_ru": "Сравнение изогнутого хвоста летящего Ханумана с «огромной змеёй (mahoraga), которую уносит Гаруда» (V.1.34: garuḍeneva hriyamāṇo mahoragaḥ) опирается на устойчивую эпическую антитезу Гаруда↔наги. В Махабхарате термины mahoraga и takṣaka mahoragaḥ стоят рядом в каталоге змеев, явившихся к рождению Арджуны: Ādi 1.114.60 «karkoṭako'tha śeṣaśca vāsukiśca bhujaṅgamaḥ / kacchapaścāpakuṇḍaśca takṣakaśca mahoragaḥ» — «Также Каркотака и Шеша, змей Васуки и Каччхапа, Кунда и великий змей Такшака». Сундараканда переводит эту космологическую вражду в план кавья-сравнения: Хануман — Гаруда, его хвост — обречённая змея. Свидетельство: уровень шлоки (мягкое).", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.1.34", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Ādiparva 1.114.60", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.35", "verse": "35", "sanskrit_iast": "bāhū saṃstambhayām āsa mahāparighasaṃnibhau । asasāda kapiḥ kaṭyāṃ caraṇau saṃcukoсa ca ॥35॥", "leonov_ru": "Твердо установив [на горе] руки, подобные огромным железным балкам, Встала обезьяна на четвереньки.", "commentary": {"tilaka": "बाहू संस्तम्भयामासेत्युत्प्लवनसंनाहाभिनयः बाह्वोः संस्तम्भनं नाम पर्वतोपरि दृढप्रतिष्ठापनम् । कपिः कट्यां कटिप्रदेशे आससाद कायप्रसारणात्कृशो ऽभूत् । उरःशिरसोरूर्ध्वप्रसारणे सपृष्ठचरणभागस्याधःसङ्कोचने तथात्वं कटिदेशस्येति बोध्यम्", "bhusana": "बाहू संस्तम्भयामास महापरिघसन्निभौ ।\n\nससाद च कपिः कट्यां चरणौ संचुकोच च\nलङ्घनोद्योगकालिकावस्थां वर्णयति बाहू इत्यादिना । बाहू संस्तम्भयामास निश्चलीचकार । कट्यां ससाद शरीरं संचुकोचेत्यर्थः । चरणौ संचुकोच च", "siromani": "बाहू इति । कपिः बाहू संस्तम्बयामास दृढीचकार । कट्यामाससाद प्राप अतिसंकुचितशरीरो बभूव चेत्यर्थः, चरणौ संचुकोच आचुक्रुञ्च", "tattvadipika": "बाहू संस्तम्भयामास पर्वतोपरि दृढविन्यासेन निष्पन्दीचकार । ससाद च कपिः कट्याम् इति कायप्रसारणात् कटिप्रदेशे कृशो ऽभूदित्यर्थः । चरणो संचुकोच सङ्कोचयामास"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.35:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Руки, что были подобны / огромным железным балкам (bāhū… mahāparighasaṃnibhau) – слово parigha означает железный брус, использовавшийся в качестве засова в воротах."}, {"id": "lexical:5.1.35:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "parigha", "note_ru": "Засов / железная балка (parigha) — MW: parigha — «an iron bar or beam used for locking or shutting a gate; an obstacle, impediment; a kind of weapon (a large stick tipped with iron)». В V.1.35 bāhū saṃstambhayām āsa mahāparighasaṃnibhau — руки Ханумана уподоблены mahāpariṃgha «огромным засовам-балкам». Parigha как боевое оружие — тяжёлый жезл с железным наконечником; как строительный элемент — железный брус ворот. Здесь именно строительный образ: руки-балки, подпирающие тело перед прыжком. В подстрочнике «железным балкам» — теряется значение оружия (паригха как клаб-оружие героев).", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. parigha; Apte s.v. parigha", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.36", "verse": "36", "sanskrit_iast": "saṃhṛtya ca bhujau śrīmāṃs tathaiva ca śirodharām । tejaḥ sattvaṃ tathā vīryam āviveśa sa vīryavān ॥36॥", "leonov_ru": "Мудрый [Хануман] напряг руки и шею, Собрал могучий силу, мощь и отвагу.", "commentary": {"tilaka": "भूजौ संहृत्यांसप्रदेशे सङ्कुच्य । शिरोधरां ग्रीवां कण्ठदेशे सङ्कुच्य । तेजः पराभिवसामर्थ्यम् सत्त्वं बलं शारीरम् वीर्यमान्तरं बलम्\nसर्ववर्णानां विद्युत्सु सत्त्वान्नानावर्णपुष्पोद्यानबद्धस्य सविद्युद्गणमेघोपमा", "bhusana": "संहृत्य च भुजौ श्रीमान् तथैव च शिरोधराम् ।\n\nतेजस्सत्त्वं तथा वीर्यमाविवेश स वीर्यवान्\nसंहृत्येति । संहृत्य संकोच्य", "siromani": "संहृत्येति । वीर्यवान् स हनूमान् भुजौ संहृत्य अंसप्रदेशे प्रापय्य शिरोधरां ग्रीवां संहृत्य कण्ठदेशे प्रापय्य तेजःप्रभृतीनि आविवेश सस्मार"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.36:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Отвагу, силу и мужество (tejaḥ sattvaṃ tathā vīryam) – в «Тилаке» tejas объясняется как «способность победить врага» (parābhibhavasāmabhyam), sattvam – как «телесная сила» (balaṃ śāriram), vīryam – как «внутренняя (душевная) сила» (antaraṃ balam)."}, {"id": "lexical:5.1.36:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "sattva", "note_ru": "Существо / мощь / благость (sattva) — MW: sattva — «being, existence, entity; the quality of purity and goodness (in Sāṃkhya one of the three guṇas); strength of character, firmness, energy, courage». В V.1.36 tejaḥ sattvaṃ tathā vīryam āviveśa — «вошли в него тejs-/sattva/vīrya». Три понятия составляют классическую «троицу героя»: tejs «лучезарность», sattva «стойкость/благость», vīrya «мужество/сила». Sattva здесь — не «существо» (смысл 1), а гуна саттва как категория «чистой силы/ясности ума»; отсылка к санкхья-классификации трёх гун прозрачна. Подстрочник «мощь» упрощает.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. sattva; Apte s.v. sattva", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.36:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "tejas / sattva / vīrya", "note_ru": "Перед прыжком Хануман «вбирает в себя силу, мощь и отвагу» (tejaḥ sattvaṃ tathā vīryam āviveśa). Эта триада — tejas (пыл-блеск), sattva (существо/стойкость), vīrya (геройская мощь) — точно те качества, которые Гита возводит к Божеству: БхГ 10.36 «tejas tejasvinām … sattvaṃ sattvavatām aham»; ср. anantavīrya о вселенском облике (БхГ 11.40). Сцена читается как ритуальное «стяжение» божественных энергий героем-дутом; параллель показывает, что лексика подвига Ханумана совпадает со списком теофанических атрибутов Кришны. Свидетельство: уровень шлоки (мягкое).", "type": "А", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.1.36", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bhagavadgītā 7.10 и 10.36 (Семенцов)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.37", "verse": "37", "sanskrit_iast": "mārgam ālokayan dūrād ūrdhvapraṇihitekṣaṇaḥ । rurodha hṛdaye prāṇān ākāśam avalokayan ॥37॥", "leonov_ru": "Устремивший взгляд вверх, издалека высматривая дорогу, Запер он в сердце дыхание, глядя в небо.", "commentary": {"tilaka": "श्वसनस्य वायोरिव विक्रमो वेगो यस्य सः", "bhusana": "मार्गमालोकयन् दूरादूर्ध्वं प्रणिहितेक्षणः ।\n\nरुरोध हृदये प्राणानाकाशमवलोकयन्", "siromani": "मार्गमिति । मार्गमालोकयन् आलोकयितुम् ऊर्ध्वं प्रणिहितेक्षणः ऊर्ध्वकृतदृष्टिर्हनूमान् आकाशमवलोकयन् सन् हृदये प्राणान् रुरुधे"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.37:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Запер в груди дыхание (rurodha hṛdaye prāṇān) – букв. «в сердце»."}]}, {"verse_id": "5.1.38", "verse": "38", "sanskrit_iast": "padbhyāṃ dṛḍham avasthānaṃ kṛtvā sa kapikuñjaraḥ । nikuñcya karṇau hanumān utpatiṣyan mahābalaḥ ॥38॥", "leonov_ru": "Твердо установив стопы, тот слон среди обезьян, Прижал уши Хануман могучий, собирающийся взлететь.", "commentary": {"tilaka": "कर्णौ निकुच्य सङ्कुच्य । उत्पतनसंनाहवशाद्धि कर्णसङ्कोचो भवति", "bhusana": "पद्भ्यां दृढमवस्थानं कृत्वा स कपिकुञ्जरः ।\n\nनिकुञ्च्य कर्णौ हनुमानुत्पतिष्यन् महाबलः ।\n\nवानरान् वानरश्रेष्ठ इदं वचनमब्रवीत्", "siromani": "पद्भ्यामिति । उत्पतिष्यन् स हनुमान् पद्भ्यां दृढमवस्थानं स्थितिविशेषं कृत्वा कर्णौ निकुच्य संकुच्य वानरान् इदं वचनमब्रवीत् । सार्धश्लोक एकान्वयी\nनहीति । लङ्कायां यदि न पश्यामि तदा अनेनैव वेगेन सुरालयं स्वर्गं गमिष्यामि"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.38:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "kapikuñjara", "note_ru": "Слон среди обезьян (kapikuñjara) — метафора высшего превосходства в группе (kapi-kuñjara «слон среди обезьян»), ср. puruṣarṣabha «бык среди мужей». Первое вхождение в кн. V.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.39", "verse": "39", "sanskrit_iast": "vānarān vānaraśreṣṭha idaṃ vacanam abravīt । yathā rāghavanirmuktaḥ śaraḥ śvasanavikramaḥ ॥39॥", "leonov_ru": "Лучший из обезьян сказал обезьянам такие слова: «Словно стрела, выпущенная Рамой, быстрая как ветер,", "commentary": {"bhusana": "यथा राघवनिर्मुक्तश्शरः श्वसनविक्रमः ।\n\nगच्छेत्तद्वद्गमिष्यामि लङ्कां रावणपालिताम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.39:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Быстрая, словно ветер (śvasanavikramaḥ) – автор «Тилаки» поясняет слово vikrama в этом композите как «скорость, быстрота» (vega), śvasana – как «ветер» (vāyu). Таким же образом этот композит толкуется и в комментарии «Широмани».[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна I. 1. 54: Рагхава (rāghava) — патроним Рамы, потомка царя Рагху."}, {"id": "lexical:5.1.39:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "rāghava", "note_ru": "Потомок Рагху (rāghava) — стандартный эпитет Рамы (потомок царя Рагху). см. примеч. к I.1.1 (Гринцер).", "type": "А", "subtype": "base", "trigger": "crossref", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.39:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "rāghava", "note_ru": "Потомок Рагху (rāghava). [Е. Костина]: именной эпитет «rāghava» присутствует в оригинале, но не передан отдельным словом в подстрочнике («…Лучший из обезьян сказал обезьянам такие слова: «Словно стре…»). В литературном тексте эпитет восстанавливается; отметить как незафиксированное опущение — на усмотрение редактора.", "type": "Б", "subtype": "base", "trigger": "omission", "source": "parallel-text divergence (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.40", "verse": "40", "sanskrit_iast": "gacchet tadvad gamiṣyāmi laṅkāṃ rāvaṇapālitām । na hi drakṣyāmi yadi tāṃ laṅkāyāṃ janakātmajām ॥40॥", "leonov_ru": "Мчится, так и я помчусь на Ланку, где правит Равана. И если я не увижу на Ланке дочь Джанаки,", "commentary": {"tilaka": "तद्वद्गमिष्यामि अनेन तद्वदेव गत्वा कृतकार्य आगमिष्यामीति सूचितम् । तस्यैव प्रपञ्चः-- नहीत्यादि", "bhusana": "नहि द्रक्ष्यामि यदि तां लङ्कायां जनकात्मजाम् ।\n\nअनेनैव हि वेगेन गमिष्यामि सुरालयम्\nनहीति । हिशब्दः पादपूरणे"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.40:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "janakātmajā", "note_ru": "Дочь Джанаки (janakātmajā) — патроним Ситы (дочь царя Джанаки); первое появление эпитета Ситы в кн. V. см. примеч. к I.1.25 (Гринцер).", "type": "А", "subtype": "base", "trigger": "crossref", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date

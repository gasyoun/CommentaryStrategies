": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.41", "verse": "41", "sanskrit_iast": "anenaiva hi vegena gamiṣyāmi surālayam । yadi vā tridive sītāṃ na drakṣyāmi kṛtaśramaḥ ॥41॥", "leonov_ru": "С той же быстротой отправлюсь я в обитель богов. А если и на третьем небе я, приложив усилия, не увижу Ситу,", "commentary": {"tilaka": "अनेनैव एवंविधेनैव", "bhusana": "यदि वा त्रिदिवे सीतां न द्रक्ष्याम्यकृतश्रमः ।\n\nबद्ध्वा राक्षसराजानमानयिष्यामि रावणम्", "siromani": "यदीति । कृतश्रमो ऽहं यदि त्रिदिवे सीतां न द्रक्ष्यामि तदा राक्षसराजानं रावणं बद्धा आनयिष्यामि आनेष्यामि । एतेन बद्धः सन् सीतावृत्तान्तं कथयिष्यत्येवेति सूचितम्, समासान्तबिधेरनित्यत्वाट्टजभावः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.41:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Не отыщу я Ситы (sītāṃ na drakṣyāmi kṛtaśramaḥ) – букв. «Ситы не увижу [я], приложивший огромные усилия». В некоторых рукописях дается вариант akṛtaśramaḥ, что в «Бхушане» глоссируется как «не чувствующий усталости» (apraptaśramaḥ)."}]}, {"verse_id": "5.1.43", "verse": "43", "sanskrit_iast": "ānayiṣyāmi vā laṅkāṃ samutpāṭya sarāvaṇām । evam uktvā tu hanumān vānarān vānarottamaḥ ॥43॥", "leonov_ru": "Или приведу Ланку вместе с Раваной, вырвав ее с корнем», Так сказав обезьянам, Хануман, лучший из обезьян,", "commentary": {"tilaka": "समुत्पाट्येति ओषधिपर्वतोत्पाटनवदिति भावः\nवेगाद्धनूमति समुत्पतति सति ते नगरोहिणः पर्वतस्थवृक्षाः सर्वान्विटपान्सर्वाः शाखाः संहृत्य सङ्क्षिप्य वेगात्समुत्पेतुः", "bhusana": "एवमुक्त्वा तु हनुमान् वानरान् वानरोत्तमः", "siromani": "एवमिति । अविचारयन् उत्पतनं किंचिदपि श्रमजनकमित्यगणयन् हनूमान्वानरान् एवमुक्त्वा उत्पपात । अथ अतः आत्मानं सुपर्णं शोभितपक्षवन्तं पक्षिराजमिव मेने । सार्धश्लोक एकान्वयी\nसमिति । वेगात्समुत्पतति सति नगरोहिणः शैलस्थतरवः विटपान् स्वशाखाः संहृत्य वेगात्समुत्पेतुः । अर्धद्वयमेकान्वयि"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.43:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Или Ланку я вырву с корнем, / притащу сюда вместе с Раваной (ānayiṣyāmi vā laṅkāṃ samutpāṭya sarāvaṇām) – автор «Тилаки» полагает, что здесь подразумевается «встретившись [перед тем] с Ситой»."}]}, {"verse_id": "5.1.45", "verse": "45", "sanskrit_iast": "samutpatati vegāt tu vegāt te nagarohiṇaḥ । saṃhṛtya viṭapān sarvān samutpetuḥ samantataḥ ॥45॥", "leonov_ru": "Когда он стремительно взлетел, силой [его] деревья, росшие на горе, Собрав все ветки, взлетели со всех сторон [от него].", "commentary": {"bhusana": "समुत्पतति तस्मिंस्तु वेगात्ते नगरोहिणः ।\n\nसंहृत्य विटपान् सर्वान् समुत्पेतुस्समन्ततः\nसमुत्पततीति । तस्मिन् हनुमति वेगात्समुत्पतति सति । नगरोहिणः शैलरुहा वृक्षाः विटपान् संहृत्य आदाय, समुत्पेतुरित्यर्थः", "siromani": "स इति । मत्ताः कोयष्टिका येषु तान् । कोयष्टिकोयष्टिभौ पर्यायौ"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.45:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Так взлетел он стремительно (samutpatati vegāt tu) – букв.: «когда он быстро взлетал, от [его] быстроты росшие на горе деревья, прижав все ветки, взлетели повсюду».[Е. Костина] «Так взлетел он быстро,Что ураган поднялсяИ деревья сорвал,Росшие на Махендре.» Не совпадает с файлом 22 (вариант из 22 мне нравится меньше): Быстро взмыл Хануман, И силой его деревья, Ветки сложив, с горы Следом за ним поднялись"}]}, {"verse_id": "5.1.46", "verse": "46", "sanskrit_iast": "sa mattakoyaṣṭibhakān pādapān puṣpaśālinaḥ । udvahann ūruvegena jagāma vimale 'mbare ॥46॥", "leonov_ru": "Он, цветущие деревья с влюбленными чибисами, Неся силой бедер, полетел в чистом небе.", "commentary": {"bhusana": "स मत्तकोयष्टिभकान् पादपान् पुष्पशालिनः ।\n\nउद्वहन्नूरुवेगेन जगाम विमले ऽम्बरे"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.46:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Щебетали влюбленные чибисы (mattakoyaṣṭibhakān) – комментаторы глоссируют koyaṣṭibhaka как koyaṣṭi. Как отмечают Голдмены, это слово обозначает целый ряд мелких болотных птиц (см.: Goldman 1984: 309).[Е. Костина] «vimale» Опущено"}, {"id": "lexical:5.1.46:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "koyaṣṭi", "note_ru": "Птица-кулик / чибис (koyaṣṭi) — MW: koyaṣṭi — «a kind of bird, a lapwing». Редкая птица в эпосе; Апте: koyaṣṭi = «the Indian lapwing (Vanellus malabaricus)». В V.1.46 mattakoyaṣṭibhakān pādapān puṣpaśālinaḥ — «деревья с влюблёнными чибисами, покрытые цветами». Mattakoyaṣṭi = чибис в состоянии опьянения/возбуждения (matta «пьяный/влюблённый»). Птица-детектор настроения: её «опьянённость» указывает на весенний/брачный сезон. Подстрочник «чибисами» не объясняет matta в составном.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. koyaṣṭi; Apte s.v. koyaṣṭibhaka", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.47", "verse": "47", "sanskrit_iast": "ūruvegotthatā vṛkṣā muhūrtaṃ kapim anvayuḥ । prasthitaṃ dīrgham adhvānaṃ svabandhum iva bāndhavāḥ ॥47॥", "leonov_ru": "Поднятые силой его бедер деревья некоторое время следовали за обезьяной, Словно родичи за родичем, отравившимся в далекий путь.", "commentary": {"siromani": "ऊर्विति । ऊर्वौर्वेगेन उत्थिता वृक्षा दीर्घमध्वानं प्रस्थितं स्वबन्धुं बान्धवा इव मुहूर्तं कपिमन्वयुः अनुजग्मुः", "bhusana": "उरुवेगोद्धता वृक्षा मुहूर्तं कपिमन्वयुः ।\n\nप्रस्थितं दार्घमध्वानं स्वबन्धुमिव बान्धवाः", "tilaka": "कपिवातः कपिनोत्थापितो वातः । मेघवातो मेघमण्डलगो वातः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.47:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Увлеченные им (ūruvegotthatāḥ) – букв. «поднятые стремительной силой [его] бедер»."}]}, {"verse_id": "5.1.48", "verse": "48", "sanskrit_iast": "tam ūruvegonmathitāḥ sālāś cānye nagottamāḥ । anujagmur hanūmantaṃ sainyā iva mahīpatim ॥48॥", "leonov_ru": "Захваченные силой его бедер шала и другие лучшие деревья Следовали за Хануманом, словно воины за царем.", "commentary": {"tilaka": "मत्ताः कोयष्टिभा येषु तान् । कोयष्टिकोयष्टिभौ पर्यायौ ।। 5.1.44,45 ।।\n\nसालाः सर्जवृक्षाः । सैन्यशब्दो ऽर्धर्चादिः", "siromani": "तमिति । ऊरुवेगोन्मथिता अन्ये केचन पादपाः सैन्याः महीपतिमिव हनूमन्तमनुजग्मुः । सैन्यशब्दो ऽर्धर्चादिः", "bhusana": "संग्रहणोक्तं विवृणोति स मत्तेत्यादिना । कोयष्टिभकः कोयष्टिः ।। 5.1.46,47।।\n\nतमूरुवेगोन्मथितास्सालाश्चान्ये नगोत्तमाः ।\n\nअनुजग्मुर्हनूमन्तं सैन्या इव महीपतिम्\nतमिति । तमूरुवेगेति पाठः । ऊरुवेगेन उन्मथिताः सालाः सावृक्षाः । अन्ये नगोत्तमाः अन्ये वृक्षश्रेष्ठाः ।सैन्याः सेनायां समवेताः पुरुषाः । \"सेनायां समवेता ये सैन्यास्ते नैनिकाश्च ते\" इत्यमरः ।। 5.1.48,49।।\n\nसारवन्तो ऽथ ये वृक्षा न्यमज्जन् लवणाम्भसि ।\n\nभयादिव महेन्द्रस्य पर्वता वरुणालये\nसारवन्तः स्तिरांशवन्तः । \"सारो बले स्थिरांशे च \" इत्यमरः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.48:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Захваченные вихрем (ūruvegonmathitāḥ) – букв. «потревоженные быстротой [его] бедер»."}]}, {"verse_id": "5.1.50", "verse": "50", "sanskrit_iast": "sāravanto 'tha ye vṛkṣā nyamajjaṃl lavaṇāmbhasi । bhayād iva mahendrasya parvatā varuṇālaye ॥50॥", "leonov_ru": "Деревья, которые были тяжелыми, тонули в океане, Словно горы в обители Варуны в страхе перед великим Индрой.", "commentary": {"tilaka": "पर्वताकारः तत्त्वं बृहत्त्वेन पुष्पितवृक्षवत्त्वेन च\nसारवन्तो गुरुत्वातिशययुक्ताः खदिरादयस्ते गुरुत्वाल्लवणाम्भसि न्यमज्जन् । अर्थादन्ये लघवः सहैव गता इति बोध्यम् । महेन्द्रस्य भयात्पक्षच्छेदभयात्पर्वता इव न्यमज्जन्", "siromani": "सारवन्त इति । सारवन्तो गुरुत्ववन्तो ये वृक्षाः ते महेन्द्रस्य भयान् वरुणालये पर्वता इव लवणाम्भसि न्यमज्जन् । सारवन्त इत्यनेन लघूनां परिभ्रमणमेवेति सूचितम् । \"सारो बले स्थिरांशे च\" इति कोशः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.50:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «lavaṇā» Можно отразить соленость в комментариях, но сомневаюсь на счет важности[Е. Костина] «ottamāḥ» Качество деревьев в переводе не отражено"}, {"id": "tier1:5.1.50:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Словно гора – в обители Варуны, / Убоявшись великого Индры (bhayād iva mahendrasya parvatā varuṇālaye) – отсылка к мифу о летающих горах, который изложен в этой же песни «Сундараканды» (строфы 122-126)."}]}, {"verse_id": "5.1.53", "verse": "53", "sanskrit_iast": "laghutvenopapannaṃ tad vicitraṃ sāgare 'patat । drumāṇāṃ vividhaṃ puṣpaṃ kapivāyusamīritam । tārācitam ivākāśaṃ prababhau sa mahārṇavaḥ ॥53॥", "leonov_ru": "Обладающие легкостью, разноцветные разнообразные цветы с деревьев, влекомые ветром, [поднятым] обезьяной, падали в океан. Стал великий океан подобен небу, усеянному звездами.", "commentary": {"siromani": "तद्वचनाकारमाह-- यथेत्यादिभिः । राघवेण निर्मुक्तः श्वसनविक्रमः पवनवेगः शरः यथा गच्छेत् तद्वत् लङ्कां गमिष्यामि\nलघुत्वेनेति । कपिवायुसमीरितं पुष्पं यतो लघुत्वेनोपपन्नं युक्तं तत् तस्माद्धेतोः विचित्रं साहित्यरहितमित्यर्थः सागर अपतत्", "tattvadipika": "पतत्पतङ्गसङ्काशः गच्छत्सूर्यसदृशः । व्यायतः दीर्घाकारः । कपिः बध्यमानया कक्ष्यया गजमध्यबन्धनरज्ज्वा । प्रवृद्धः दीर्घीभूतो मातङ्ग इव शुशुभ इति योजना", "bhusana": "लघुत्वेनोपन्नं तद्विचित्रं सागरे ऽपतत् ।\n\nद्रुमाणां विविधं पुष्पं कपिवायुसमीरितम्\nलघुत्वेनोपपन्नं लघुत्वेन युक्तम्\nताराचितमिवाकाशं प्रबभौ स महार्णवः\nतारेत्यर्धमेकं वाक्यम् । ताराचितमिव आकाशं प्रबभौ स महार्णवः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.53:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И стал простор океана / подобен звездному небу (tārācitam ivākāśaṃ prababhau sa mahārṇavaḥ) – эти строки отсутствуют в бомбейском издании."}, {"id": "lexical:5.1.53:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "khādyota", "note_ru": "Светляк (khādyota) — букв. «светящийся в небе» (kha «небо, пространство» + dyota «светящийся», от √dyut «сиять»). MW: khādyota — «a glow-worm, fire-fly». В V.1.51 kapir … meGhasaṃkāśaḥ khādyotair iva parvataḥ — гора Хануман, покрытая цветами, уподоблена горе, покрытой светляками ночью. Эти два образа — туча/гора + светляки = ночное видение. Khādyota — поэтически значимый образ, разрабатываемый в кавья (у Калидасы).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. khādyota; Apte s.v. khādyota", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.58", "verse": "58", "sanskrit_iast": "tasya vidyutprabhākāre vāyumārgānusāriṇaḥ । nayane viprakāśete parvatasthāv ivānalau ॥58॥", "leonov_ru": "Его, следующего путем ветра, глаза, сияющие словно молнии, Были подобны двум огням на горе.", "commentary": {"tilaka": "विप्रकाशेते विशेषेण प्रकाशेते स्म । अनलौ दावानलौ", "bhusana": "तस्य विद्युत्प्रभाकारे वायुमार्गानुसारिणः ।\n\nनयने विप्रकाशेते पर्वतस्ताविवानलौ"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.58:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Казались двумя огнями / на горе разгоревшимися (nayane viprakāśete parvatasthāv ivānalau) – в «Тилаке» поясняется, что речь идет об огне лесного пожара (dāvānalau). Такого же мнения придерживается и автор «Широмани»."}, {"id": "lexical:5.1.58:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "vidyut", "note_ru": "Молния (vidyut) — букв. «сверкающая» (от √dyut «блистать», с приставкой vi-). MW: vidyut — «lightning; the lightning-flash personified as a goddess». В V.1.58 tasya vidyutprabhākāre — «у того, чей облик сияет как молния». Vidyut — женского рода (молния как богиня в ведийской традиции, супруга Индры). В кавья vidyutprabhā — устойчивое сравнение для блеска глаз/оружия. Выбор именно vidyut, а не vajra или taḍit подчёркивает природную небесную (а не оружейную) природу блеска глаз Ханумана.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. vidyut; Apte s.v. vidyut", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.59", "verse": "59", "sanskrit_iast": "piṅge piṅgākṣamukhyasya bṛhatī parimaṇḍale । cakṣuṣī samprakāśete candrasūryāv iva sthitau ॥59॥", "leonov_ru": "Оба желтых, огромных, круглых глаза того вождя желтоглазых (обезьян) Сияли словно взошедшие луна и солнце.", "commentary": {"siromani": "पिङ्ग इति । पिङ्गाक्षाणां वानराणां मुख्यस्य हनुमतः परि चतुर्दिक्षु मण्डलं प्रभा ययोस्ते चक्षुषी स्थितौ एकत्र विद्यमानौ चन्द्रसूर्याविव संप्रकाशेते"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.59:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "piṅga", "note_ru": "Желтовато-коричневый / рыжий (piṅga) — MW: piṅga — «reddish-brown, tawny, yellowish». В V.1.59 piṅge piṅgākṣamukhyasya — глаза «вождя желтоглазых» сами жёлто-рыжие (piṅge). Пара piṅga + piṅgākṣa подчёркивает, что Хануман — буквально «эталон» рыжеглазости среди обезьян. Piṅga отличается от pīta («жёлтый»), raktа («красный») и nīla («синий»): это именно смешанный рыжевато-жёлтый оттенок. В подстрочнике «желтых» — потеря специфики тона.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. piṅga; Apte s.v. piṅgākṣa", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.60", "verse": "60", "sanskrit_iast": "mukhaṃ nāsikayā tasya tāmrayā tāmram ābabhau । saṃdhyayā samabhispṛṣṭaṃ yathā syāt sūryamaṇḍalam ॥60॥", "leonov_ru": "Лицо его, коричневое от коричневого носа, было подобно Солнечному диску, тронутому сумерками.", "commentary": {"tilaka": "नासिकया युक्तमिति शेषः ।। 5.1.58,59 ।।\n\nशुक्लदंष्ट्रत्वं स्वरूपकथनमात्रम्, न तु परिवेषिभास्करोपमोपयोगि", "bhusana": "मुखं नासिकया तस्य ताम्रया ताम्रमाबभौ ।\n\nसन्ध्यया समभिस्पृष्टं यथा तत्सूर्यमण्डलम्\nमुखमिति । तत्सूर्यमण्डलं सन्ध्यासूर्यमण्डलम्", "siromani": "मुखमिति । ताम्रया नासिकया युक्तं ताम्रमरुणं तस्य मुखं संध्यया समभिस्पृष्टं संयुक्तं सूर्यमण्डलं यथा स्यात् तथा आबभौ"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.60:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «nāsikayā tasyatāmrayā» Опущено"}]}, {"verse_id": "5.1.61", "verse": "61", "sanskrit_iast": "lāṅgalaṃ ca samāviddhaṃ plavamānasya śobhate । ambare vāyuputrasya śakradhvaja ivocchritam ॥61॥", "leonov_ru": "И хвост дрожащий летящего в небе сына ветра, Поднятый [за спиной] был подобен знамени Индры.", "commentary": {"bhusana": "लाङ्गूलं च समाविद्धं प्लवमानस्य शोभते ।\n\nअम्बरे वायुपुत्रस्य शक्रध्वज इवोच्छ्रितः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.61:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций"}, {"id": "lexical:5.1.61:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "vāyuputra", "note_ru": "Сын Ваю (vāyuputra) — патроним Ханумана (vāyu-putra «сын бога ветра»), пара к mārutātmaja. Леонов отмечает чередование с ātmayoni; «Тилака» подчёркивает их тождество.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.61:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "vāyuputra", "note_ru": "Сын Ваю (vāyuputra). [Е. Костина]: именной эпитет «vāyuputra» присутствует в оригинале, но не передан отдельным словом в подстрочнике («…И хвост дрожащий летящего в небе сына ветра, Поднятый [за сп…»). В литературном тексте эпитет восстанавливается; отметить как незафиксированное опущение — на усмотрение редактора.", "type": "Б", "subtype": "base", "trigger": "omission", "source": "parallel-text divergence (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.62", "verse": "62", "sanskrit_iast": "lāṅgūlacakro hanūmāñ śukladaṃṣṭro 'nilātmajaḥ । vyarocata mahāprājñaḥ pariveṣīva bhāskaraḥ ॥62॥", "leonov_ru": "Хануман с изогнутым в кольцо хвостом, белозубый сын ветра, Сиял, многомудрый, сиял, словно солнце в ореоле лучей.", "commentary": {"bhusana": "नीलेति, अत्र यच्छब्दो ऽध्याहार्यः । यदेवंविधं तलं तत्र तिष्ठन्नित्यन्वयः । पत्रवर्णैः पत्रश्यामैः । \"पलाशो हरितो हरित्\" इति हलायुधः । सितासितैः कल्माषैः । स्वभावविहितैः स्वतस्सिद्धैः\nतस्याम्बरगतौ बाहू ददृशाते प्रसारितौ ।\n\nपर्वताग्राद्विनिष्क्रान्तौ पञ्चास्याविव पन्नगौ\nलाङ्गूलचक्रेण महान् शुक्लदंष्ट्रो ऽनिलात्मजः ।\n\nव्यरोचतमाहाप्राज्ञः परिवेषीव भास्करः", "siromani": "लाङ्गूलेति । लाङ्गूलचक्रः चक्राकारलाङ्गूलविशिष्टः शुक्लदंष्ट्रो हनुमान् परिवेषी मण्डलवान् भास्कर इव व्यरोचत"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.62:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "parivesa", "note_ru": "Ореол / гало (pariṣeṣa / parivesa) — в V.1.62 parivesīva bhāskaraḥ — Хануман «подобен солнцу в ореоле». Pariṣeṣa (или parivesa в нек. изданиях) — «halo, nimbus, corona of sun or moon». MW: pariṣeṣa — «remainder; the circle or halo round sun or moon». Солнечный ореол (corona) — атмосферное явление, ассоциированное с особым блеском. Здесь образ: белозубый Хануман с кольцом-хвостом = солнце в короне. Подстрочник «ореол» — астрономический образ передан, но его поэтическая точность не разъяснена.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. pariṣeṣa; Apte s.v. parivesa", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.64", "verse": "64", "sanskrit_iast": "tasya vānarasiṃhasya plavamānasya sāgaram । kakṣāntaragato vāyur jīmūta iva garjati ॥64॥", "leonov_ru": "У того льва среди обезьян, летящего над океаном, Ветер, летящий через подмышки, ревел, словно туча.", "commentary": {"tilaka": "जीमूत इति सप्तम्यन्तमिति कतकः । गर्जति जगर्ज", "siromani": "तस्येति । सागरं प्लवमानस्य तस्य हनुमतः, कच्छान्तरगतः कच्छमध्ये प्राप्तो वायुः जीमूतो मेघ इव गर्जति जगर्ज । जीमूते इति सप्तम्यन्तमिति कतक इति भट्टाः । तत्रारुचिबीजं तु विनिगमनाविरहः", "bhusana": "तस्य वानरसिंहस्य प्लवमानस्य सागरम् ।\n\nकक्षान्तरगतो वायुर्जीमूत इव गर्जति\nगर्जति अगर्जत्", "tattvadipika": "गर्जति जगर्ज"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.64:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "kakṣā", "note_ru": "Подмышка / боковая часть тела (kakṣā) — MW: kakṣā — «the armpit; a girdle, a girth; a court or yard». В V.1.64 kakṣāntaragato vāyuḥ — «ветер, прошедший через подмышки». Какша — специфически «пространство подмышки» (kakṣāntara), а не просто «бок». Лексически точно для описания аэродинамики полёта: ветер «в подмышечном пространстве» создаёт рёв. Подстрочник «подмышки» — верен, но термин многозначен (также «гирт, двор»); контекст полёта однозначен.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. kakṣā; Apte s.v. kakṣā", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.65", "verse": "65", "sanskrit_iast": "khe yathā nipataty ulkā uttarāntād viniḥsṛtā । dṛśyate sānubandhā ca tathā sa kapikuñjaraḥ ॥65॥", "leonov_ru": "Словно метеор (комета), летящий по небу из его дальних пределов, Выглядел тот слон среди обезьян со своим хвостом.", "commentary": {"tilaka": "उत्तरान्तादुत्तरोर्ध्वदिग्भागात् । सानुबन्धा सूक्ष्मोल्कान्तरानुबद्धा इदं विशेषणं पुच्छसाहित्यात्", "siromani": "खे इति । उत्तरान्तात् उत्तरोर्ध्वंदिक्प्रदेशाद्विनिःसृता सानुबन्धा पुच्छाकृतितेजोविशेषयुक्ता उल्का यथा खे आकाशे निपतति गच्छति तथा सः लाङ्गूलविशिष्टः कपिकुञ्जरो हनुमान् दृश्यते", "bhusana": "खे यथा निपतन्त्युल्का ह्युत्तरान्ताद्विनिःसृता ।\n\nदृश्यते सानुबन्धा च तथा स कपिकुञ्जरः\nखे यथेति । सानुबन्धा, सपुच्छा उल्का हि पुच्छयुक्ता निपतति", "tattvadipika": "सानुबन्धा सूक्ष्मोल्लासहिता"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.65:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И походил хвостатый / Слон обезьяньего племени (dṛśyate sānubandhā ca tathā sa kapikuñjaraḥ) – комментаторы поясняют, что sānubandhā здесь означает указание на наличие хвоста."}, {"id": "lexical:5.1.65:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "ulkā", "note_ru": "Метеор / головня (ulkā) — MW: ulkā — «a fire-brand, torch; a meteor, falling star». В V.1.65 yaṃ nibhyati yaṃ ulkā uttarāntād viniḥsṛtā — Хануман уподоблен метеору, летящему «из северных пределов» (uttarānta). Ulkā в ведийской традиции — «небесный огонь», предвестник событий; метеоры интерпретировались как знамения. Здесь образ эстетический (сравнение полёта), а не астрологический. Различие ulkā (метеор) vs. dhumaketu (комета) vs. nakṣatra (звезда) лексически важно; подстрочник «комета» неточен — ulkā = метеор/шарик огня, а не комета.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. ulkā; Apte s.v. ulkā", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.66", "verse": "66", "sanskrit_iast": "patatpataṃgasaṃkāśo vyāyataḥ śuśubhe kapiḥ । pravṛddha iva mātaṅgaḥ kakṣyayā badhyamānayā ॥66॥", "leonov_ru": "Подобна солнцу, плывущему [в небе] была огромная обезьяна, Была она подобна могучему слону в упряжи.", "commentary": {"tilaka": "पतत्पतङ्गसङ्काशो गच्छत्सूर्यसङ्काशो व्यायतो दीर्घः कपिर्वस्त्रेण बध्यमानया कक्ष्यया गजमध्यबन्धनरज्ज्वा युक्तः प्रवृद्धो मातङ्ग इव बभौ । \"कक्ष्या प्रकोष्ठे हर्म्यादेः काञ्चयां मध्येभबन्धने\" इति\nसोन्माद इव सापस्मार इव घूर्णनफेनवमनविक्रोशनादिविकारसाम्यात्", "siromani": "पतदिति । व्यायतो ऽतिदीर्घः पतत्पतङ्गसंकाशः प्रचलत्सूर्यसदृशः कपिः सलाङ्गलो हनुमान् बध्यमानया गजशरीरसंबद्धया कक्ष्यया गजबन्धनेनोपलक्षितः प्रवृद्धो महान्मातङ्ग इव शुशुभे"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.66:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Или могучим слоном, / Крепко стянутым упряжью (pravṛddha iva mātaṅgaḥ kakṣyayā badhyamānayā) – автор «Тилаки» полагает, что со слоновьей упряжью сравнивается одежда Ханумана, автор «Широмани» считает, что речь идет о его хвосте."}]}, {"verse_id": "5.1.67", "verse": "67", "sanskrit_iast": "upariṣṭāc charīreṇa chāyayā cāvagāḍhayā । sāgare mārutāviṣṭā naur ivāsīt tadā kapiḥ ॥67॥", "leonov_ru": "С телом в вышине и с тенью внизу Была тогда обезьяна подобна кораблю, гонимому ветром по океану.", "commentary": {"tilaka": "उपरिष्टात्खे गच्छता स्वशरीरेणाघः सागरे ऽवगाढया स्वस्य छायया प्रतिबिम्बेन लक्षितः स सागरे मारुताविष्टा नौरिवासीत् । नौश्चोपरि विद्यमानपदार्थेन सह सागरे वायुवशाद्वेगेन चञ्चला गच्छतीति तदुपमा", "siromani": "उपरिष्टादिति । उपरिष्टात् उपरि विद्यमानेन शरीरेण सागरे अवगाढया सागरजलसंलग्नया छायया च उपलक्षितः कपिः मारुताविष्टा शीघ्रनिर्गमायोपरिबद्धमारुतावरोधनकर्तृवस्त्रविशेषहेतुकवायुयुक्ता नौरिवासीत्", "bhusana": "पतत्पतङ्गसङ्काशो व्यायतः शुशुभे कपिः ।\n\nप्रवृद्ध इव मातङ्गः कक्ष्यया बद्ध्यमानया\nपतदिति । पतङ्गः सूर्यः । व्यायतो दीर्घः । प्रवृद्ध इव दीर्घ इव, कक्ष्यायां बद्ध्यमानायां हि मातङ्गो दीर्घो भवति\nउपरिष्टाच्छरीरेण च्छायया चावगाढया ।\n\nसागरे मारुताविष्टा नौरिवासीत्तदा कपिः\nउपरिष्टादिति । नौर्जलावगाढेनाधोभागेन व्योमावगाढेन चेर्ध्वभागेन गच्छति । अयं च उपरिगतशरीरेणाधोजलावगाढच्छायया चैकाकारस्सन् मारुतपूरितकटा नौरिवासीत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.67:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Понизу тень скользила (chāyayā cāvagāḍhayā) – в «Тилаке» и «Таттвадипике» слово chāyā (тень) понимается как pratibimba (отражение).И кораблем он казался, / Подгоняемым ветром (sāgare mārutāviṣṭā naur ivāsīt tadā kapiḥ) – подразумевается, что сам Хануман казался верхней частью корабля, а его тень – нижней, погруженной в воду."}, {"id": "lexical:5.1.67:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "nau", "note_ru": "Корабль / лодка (nau) — MW: nau (f.) — «a ship, boat, vessel». Санскритское nau (navis) — когнат латинского navis и греческого naus. В V.1.67 nāvr ivāsīt tadā — Хануман уподоблен кораблю (nau), гонимому ветром. Nau — древнейшее индоевропейское слово для «судна». Этимологическая связь с русским «нав(игация)» через праиндоевропейское *neh₂us интересна для комментария переводчику.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. nau; EWAia s.v. nāvā", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.68", "verse": "68", "sanskrit_iast": "yaṃ yaṃ deśaṃ samudrasya jagāma sa mahākapiḥ । sa tu tasyāṅgavegena sonmāda iva lakṣyate ॥68॥", "leonov_ru": "Каждый участок океана, над которым пролетала та великая обезьяна, Из-за быстроты его тела казался обезумевшим.", "commentary": {"siromani": "यं यमिति । स हनूमान् समुद्रस्य यं यं देशं जगाम स देशस्तस्य हनुमतो वेगेन सोन्मादः अपस्मारादिरोगसहित इव लक्ष्यते । आपूर्णन् बहुफेनः अतिशब्दवानभवदित्यर्थः", "bhusana": "यं यं देशं सुमुद्रस्य जगाम स महाकपिः ।\n\nस स तस्योरुवेगेन सोन्माद इव लक्ष्यते\nयं यमिति । सोन्माद इव समुद्धर्ष इव, समुद्धतजल इत्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.68:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Океан волновался, / Словно бы обезумев (samudrasya… sonmāda iva lakṣyate) – в «Тилаке» поясняется, что океан вздымал волны, извергал пену и ревел (подобно тому, как бьется, извергает пену изо рта и ревет безумец).[Е. Костина] «tu» Опущено. Мне кажется, в тексте имеется в виду, что волны вздымались, НО он их сокрушал?"}]}, {"verse_id": "5.1.69", "verse": "69", "sanskrit_iast": "sāgarasyormijālānām urasā śailavarṣmaṇām । abhighnaṃs tu mahāvegaḥ pupluve sa mahākapiḥ ॥69॥", "leonov_ru": "Сеть волн океана, подобную горе, грудью Круша, летела та стремительная великая обезьяна.", "commentary": {"siromani": "सागरस्येति । शैलवर्ष्मणां पर्वताकाराणां सागरस्य ऊर्मिजालानाम् उरसा उरोवेगेन अभिघ्नन् सन् महावेगः स हनूमान् पुप्लुवे । ऊर्मिजालानामित्यत्र कर्मणः शेषत्वविवक्षया षष्ठी", "bhusana": "सागरस्योर्मिजालानामुरसा शैलवर्ष्मणाम् ।\n\nअभिघ्नंस्तु महावेगः पुप्लुवे स महाकपिः\nसागरस्येति । शैलवर्ष्मणां शैलतुल्यानाम् । \"वर्ष्म देहप्रमाणयोः\" इति सज्जनः ।। 5.1.70,71।।\n\nविकर्षन्नूर्मिजालानि बृहन्ति लवणाम्भसि ।\n\nपुप्लुवे कपिशार्दूलो विकिरन्निव रोदसी\nविकरन्निव विभजन्निव । रोदसी द्यावापृथिव्यौ", "tattvadipika": "शैलवर्ष्मणा शैलसदृशेन । उरश्शब्देन उरोवेगतो जनितवायुर्लक्ष्यते ।। 5.1.70,71 ।।\n\nविकर्षन्निव रोदसी द्यावापृथिव्यौ ऊर्मिजालानि विकिरन् विक्षिपन्निव पुप्लुव इति सम्बन्धः ।। 5.1.72,73 ।।\n\nवेगसमुद्धुष्टं वेगेनोत्कीर्णम् अत एवाम्बरस्थम् अत एव सजलदं जलदसहचरं जलं शारदाभ्रमिव स्वयं च जलदविशेषवत् विबभ्राजेत्यर्थः । वेगसमुद्भूतमित्यपि पाठः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.69:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Океанские волны / Гороподобной грудью (sāgarasyormijālānām urasā śailavarṣmaṇā) – комментаторы глоссируют śailavarṣmaṇā как «подобным горе» (śailasadṛśena). В критическом издании принят вариант śailavarṣmaṇām, то есть подобными горам являются волны, а не грудь Ханумана (см.: Jhala 1966: 15). Ср. со строфой 72, в которой волны уподобляются горам Меру и Мандаре."}]}, {"verse_id": "5.1.72", "verse": "72", "sanskrit_iast": "mērumandarasaṃkāśānudgatān sumahārṇave । atyakrāman mahāvegas taraṅgān gaṇayann iva ॥72॥", "leonov_ru": "Стремительный, он преодолевал, словно пересчитывая, волны, Которые вздымались в океане подобно Меру и Мандаре.", "commentary": {"siromani": "मेर्विति । महावेगो हनूमान् सुमहार्णवे उद्गतान् प्रादुर्भूतान् मेरुमन्दरसंकाशान् तरङ्गान् गणयन् संख्यातान् कुर्वन् इव अत्यक्रामत् निरगच्छत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.72:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций[Claude.AI — желательно] [термин] (не учтено) гора Мандара — мутовка при пахтании Молочного океана"}, {"id": "lexical:5.1.72:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "meru", "note_ru": "Меру (meru) — Мировая гора в центре вселенной (meru); золотая, нетленная ось космоса. MW: meru — «N. of a fabulous mountain (considered as the Olympus of Hindu mythology and the north pole of the earth)». В V.1.72 merumandara-saṃkāśān — волны уподоблены Меру и Мандаре. Меру — мифологический, Мандара — та гора, которой боги пахтали океан (Самудра-мантхан). Совместное упоминание Меру и Мандары: оба «космогонические» горы из мифологии пахтания; они маркируют волны как «горы, способные потрясти мироздание». См. примеч. к II.40.24 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. meru; Apte s.v. meru; ср. Bhāgavatapurāṇa VIII", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.72:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mandara", "note_ru": "Мандара (mandara) — гора, использованная богами и асурами как мутовка при пахтании океана (самудра-мантхан); обвита змеем Васуки как верёвкой. MW: mandara — «N. of a mountain; one of the divine trees of Svarga». В V.1.72 совместное упоминание merumandara — единый образ: обе горы символизируют «максимальную вертикаль», которой уподоблены гребни волн при полёте Ханумана. Подстрочник «Мандара» — сохраняет имя, но мифологический контекст пахтания не отмечен. См. примеч. к I.45.18 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. mandara; Bhāgavatapur. VIII.6-7 (самудра-мантхан)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.73", "verse": "73", "sanskrit_iast": "tasya vēgasamudghūṣṭaṃ jalaṃ sajaladaṃ tadā । ambarasthaṃ vibabhrāje śāradābhram ivātatam ॥73॥", "leonov_ru": "Его стремительным движением поднятая вода, [повисшая вместе] с облаками тогда В небе была подобна протяженному осеннему облаку.", "commentary": {"tilaka": "तस्य वेगेन समुद्घुष्टमूर्ध्वक्षिप्तम्, अत एव सजलदं जलदसहचरं मेघमण्डलपर्यन्तमूर्ध्वं गतमम्बरस्थं जलमाततं विततं शरदभ्रमिव शरन्मेघ इव बभौ । शुक्लत्वादिति भावः", "bhusana": "तस्य वेगसमुद्धूतं जलं सजलदं तदा ।\n\nअम्बरस्थं विबभ्राज शारदाभ्रमिवाततम्\nतस्येति । तस्य हनूमतः । वेगेन ऊरुवातेन ।  समुद्धूतं समुत्तापतम् । सजलदं जलं  जलदो जलं चोद्दूतमित्यर्थः", "siromani": "तस्येति । तस्य हनुमतो वेगेन समुद्घुष्टम् ऊर्द्धं प्रक्षिप्तम् अत एव सजलदं जलदेन सह स्थितम् अम्बरस्थजलम् आततं विस्तृतं शारदाभ्रमिव विबभ्राजे"}, "has_tier1": false, "notes": [{"id": "edition:5.1.73:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлоки 5.1.73–74 (2 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.1.73–74", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.73", "iast": "tasya vēgasamudghūṣṭaṃ jalaṃ sajaladaṃ tadā । ambarasthaṃ vibabhrāje śāradābhram ivātatam ॥73॥"}, {"verse_id": "5.1.74", "iast": "timinakrajhaṣāḥ kūrmā dṛśyante vivṛtās tadā । vastrāpakarṣaṇeneva śarīrāṇi śarīriṇām ॥74॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.74", "verse": "74", "sanskrit_iast": "timinakrajhaṣāḥ kūrmā dṛśyante vivṛtās tadā । vastrāpakarṣaṇeneva śarīrāṇi śarīriṇām ॥74॥", "leonov_ru": "Киты, крокодилы, рыбы и черепахи были видны тогда обнажившимися (из-под поверхности вод), Словно людские тела, [обнажившиеся] посредством стягивания одежды.", "commentary": {"tilaka": "विवृता वेगाज्जलोत्सारणेन व्यक्तदेहाः । वस्त्रापकर्षणेन वस्त्रापहारेण शरीराण्यवयवाः ।। 5.1.72,73 ।।\n\nछायाप्रमाणवर्णनेन तच्छरीरप्रमाणमपि वर्णितप्रायम् । इयं माध्याह्निकी छाया", "bhusana": "तिमीति । तिमयो महामत्स्याः, नक्राः ग्राहाः, झषाः मकराः । विवृताः जलविभेदेन प्रकाशिताः ।। 5.1.75,76।।\n\nदशयोजनविस्तीर्णा त्रिंशद्योजनमायता ।\n\nछाया वानरसिंहस्य जले चारुतरा ऽभवत्\nदशयोजनविस्तीर्णेति । ननु त्रिंशद्योजनायतत्वे चतुर्थपदेपि लङ्काप्राप्तिः स्यात् मैनाकसंवादसुरसासंवादादिकं च विरुद्ध्येत । न हि बिम्बादधिकपरिमाणत्वं प्रतिबिम्बस्य सम्भवतीति न शङ्कनीयम्, छायाशब्दो हि नात्र प्रतिबिम्बपरः किन्त्वनातपपरः । प्रातरेव हि समुद्रतरणमुक्तम्, तदा तस्य छाया तथाप्रमाणा दृश्येतैव\nतिमिनक्रझषाः कूर्मा दृश्यन्ते विवृतास्तदा ।\n\nवस्त्रापकर्षणेनेव शरीराणि शरीरिणाम्", "siromani": "तिमीति । वस्त्रापकर्षणेन शरीरिणां मनुष्यादीनां शरीराणीव विवृता जलरूपप्रावरणरहितास्तिम्यादयो दृश्यन्ते"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.74:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "timi", "note_ru": "Тими / кит (timi) — MW: timi — «a large fish or sea-animal, a whale». Редкое слово для «кита» или «большой морской рыбы» (MW: «prob. whale»). В V.1.74 timinakrajhaṣāḥ kūrmāḥ — «тими, крокодилы, рыбы и черепахи». Timi отличается от makara (морское чудовище) и timiṅgila (животное, пожирающее тими): timi — базовый уровень крупной морской фауны. Эпос создал трёхуровневую таксономию: timi → timiṅgila (пожиратель timi) → timiṅgilāśin (пожиратель timiṅgila). Это зооним, отражающий концепцию «больших жрущих малых».", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. timi; Apte s.v. timiṅgila", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.75", "verse": "75", "sanskrit_iast": "kramamānaṃ samīkṣyātha bhujaṅgāḥ sāgaraṃgamāḥ । vyomni taṃ kapiśārdūlaṃ suparṇam iva menire ॥75॥", "leonov_ru": "Увидев движущегося по небу тигра среди обезьян, Змеи, живущие в океане, решили, что это, верно, Супарна (Гаруда).", "commentary": {"siromani": "क्रममाणमिति । सागरङ्गमाः भुजगाः व्योम्नि क्रममाणं तं कपिशार्दूलं सुपर्णमिव मेनिरे", "bhusana": "प्लवमानं समीक्ष्याथ भुजङ्गाः सागरालयाः ।\n\nव्योम्नि तं कपिशार्दूलं सुपर्ण इति मेनिरे"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.75:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций"}, {"id": "crosstext:5.1.75:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "bhujaṅga / suparṇa", "note_ru": "«Змеи, живущие в океане (bhujaṅgāḥ sāgaraṃgamāḥ), решили, что это Супарна (Гаруда)» (V.1.75) — снова формульная пара змей↔Гаруда, на сей раз с термином bhujaṅga. В Махабхарате bhujaṅga часто равно «змей-губитель»: Ādi 1.46.16 «takṣakeṇa bhujaṅgena dhakṣyate» — «(царь) должен быть сожжён змеем (bhujaṅga) Такшакой». Ужас морских змеев перед мнимым Гарудой-Хануманом черпает силу из общеэпического представления о Гаруде как природном истребителе нагов. Свидетельство: уровень шлоки (мягкое).", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.1.75", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Ādiparva 1.46.16", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.76", "verse": "76", "sanskrit_iast": "daśayojanavistīrṇā triṃśadyojanam āyatā । chāyā vānarasiṃhasya jave cārutarābhavat ॥76॥", "leonov_ru": "Тень льва среди обезьян, шириною в десять йоджан и длиной в тридцать йоджан Стала еще прекраснее из-за стремительного движения.", "commentary": {"siromani": "दशेति । दशयोजनविस्तीर्णा दशयोजनपरिमितविस्तारविशिष्टा त्रिंशद्योजनमायता दीर्घा वानरसिंहस्य छाया जवे वेगे सति चारुतरा अतिरमणीया अभवत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.76:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций[Claude.AI — строго] [термин] (не учтено) йоджана — мера длины, ок. 14–15 км"}]}, {"verse_id": "5.1.77", "verse": "77", "sanskrit_iast": "śvetābhravanarājīva vāyuputrānugāminī । tasya sā śuśubhe chāyā patitā lavaṇāmbhasi ॥77॥", "leonov_ru": "Следующая за сыном ветра, упавшая на океан, Тень его была подобна полоске леса в белых облаках.", "commentary": {"siromani": "शुशुभे इति । महातेजाः स हनूमान् निरालम्बे वायुमार्गे पक्षवान् पर्वत इव शुशुभे\nश्वेतेति । लवणाम्भसि पतिता वायुपुत्रानुगामिनी तस्य वायुपुत्रस्य छाया श्वेताभ्रघनराजीव श्वेताभ्रासंलग्ना घनराजी मेघपङ्क्तिरिव शुशुभे", "bhusana": "श्वेताभ्रघनराजीव वायुपुत्रानुगामिनी ।\n\nतस्य सा शुशुभे छाया वितता लवणाम्भसि\nश्वेतभ्रेति अभ्रघनः अभ्रमूर्तिः ।। 5.1.78,79।।\n\nयेनासौ याति बलवान् वेगेन कपिकुञ्जरः ।\n\nतेन मार्गेण सहसा द्रोणाकृत इवार्णवः\nयेनेति । द्रोणी कटाहः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.77:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Облачной полосою (śvetābhraghanarājīva) – букв. «словно густая полоса белых облаков» (в комментарии «Таттвадипика» этот композит глоссируется как nirmalābhrasāndrapaṅktiḥ - плотная линия чистых облаков)."}]}, {"verse_id": "5.1.78", "verse": "78", "sanskrit_iast": "śuśubhe sa mahātejā mahākāyo mahākapiḥ । vāyumārge nirālambe pakṣavāniva parvataḥ ॥78॥", "leonov_ru": "Блистательная, огромная телом великая обезьяна была подобна Крылатой горе на пути ветра, не имеющем опоры.", "commentary": {"bhusana": "शुशुभे स महातेजा महाकायो महाकपिः ।\n\nवायुमार्गे निरालम्बे पक्षवानिव पर्वतः"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.78:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "pakṣavant", "note_ru": "Крылатая гора (pakṣavant) — букв. «имеющая крылья» (pakṣa «крыло, сторона, половина» + vant «имеющий»). В V.1.78 pakṣavān iva parvataḥ — Хануман «как крылатая гора». Аллюзия на миф о крылатых горах: в ведийско-эпической традиции горы некогда имели крылья и летали; Индра отрубил им крылья vajra. Поэтому «крылатая гора» — образ первозданного времени, когда горы были мобильны. Хануман в прыжке реактуализирует этот архетип. Подстрочник «крылатой горе» — сохраняет образ, но его мифологический бэкграунд (миф о крыльях гор, V.1.122-126) не отмечен.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. pakṣavant; Rām. Bāla passim (миф о крылатых горах)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "edition:5.1.78:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлоки 5.1.78–80 (3 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.1.78–80", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.78", "iast": "śuśubhe sa mahātejā mahākāyo mahākapiḥ । vāyumārge nirālambe pakṣavāniva parvataḥ ॥78॥"}, {"verse_id": "5.1.79", "iast": "yenāsau yāti balavān vēgena kapikuñjaraḥ । tena mārgeṇa sahasā droṇīkṛta ivārṇavaḥ ॥79॥"}, {"verse_id": "5.1.80", "iast": "āpāte pakṣisaṃghānāṃ pakṣirāja iva vrajan । hanumān meghajālāni prakarṣan māruto yathā ॥80॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.79", "verse": "79", "sanskrit_iast": "yenāsau yāti balavān vēgena kapikuñjaraḥ । tena mārgeṇa sahasā droṇīkṛta ivārṇavaḥ ॥79॥", "leonov_ru": "Там, где пролетал могучий слон среди обезьян, Там, из-за его стремительности, в океане возникали углубления.", "commentary": {"siromani": "येनेति । येन मार्गेण असौ कपिकुञ्जरो याति तेन मार्गेण अवर्णः सहसा शीघ्रं द्रोणीव कृतः हर्म्यादौ जलनिर्गमनाय काष्ठयन्त्रे इव प्रापित इत्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.79:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «balavān» Опущено"}, {"id": "tier1:5.1.79:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "… казалось, / В водосток превращался (droṇīkṛta iva) – букв. «был словно превращен в водосток». Слово droṇī автор «Тилаки» объясняет как «деревянное приспособление для отвода воды в доме»."}, {"id": "crosstext:5.1.79:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "arṇava", "note_ru": "Океан, через который летит Хануман (ch.1), — тот же океан, что у Калидасы в «Рагхуванше» XIII описывает с воздуха возвращающийся Рама, показывая его Сите: «vaidehi paśya … malayād vibhaktaṃ matsetunā phenilam amburāśim chāyāpatheneva śaratprasannam ākāśam āviṣkṛtacārutāram» (Рагху XIII.2) — «О царевна Видехи, взгляни на пенящийся океан, словно разрезанный надвое моим мостом, протянувшимся до горы Малайя, как Млечный Путь по ясному осеннему небу, усыпанному блистающими звёздами». Перед нами кавья-переработка того же эпического локуса: Сундараканда даёт переправу глазами летящего Ханумана, Калидаса — тот же простор глазами летящего Рамы. Параллель показывает, как описательная топика «океан как разрезанная гладь» вырастает из рамаянического сюжета в самостоятельный кавья-экфрасис.", "type": "В", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.1.79", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Raghuvaṃśa XIII.2-15 (Kālidāsa)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.81", "verse": "81", "sanskrit_iast": "pāṇḍurāruṇavarṇāni nīlamāñjiṣṭhakāni ca । kapinākṛṣyamāṇāni mahābhrāṇi cakāśire ॥81॥", "leonov_ru": "Белые, розовые, темно-синие и красные, Сияли (были прекрасны) огромные облака, которые тянула обезьяна.", "commentary": {"tilaka": "कपिना ऽ ऽकृष्यमाणानि महाभ्राणि चकाशिरे । मारुतेनाकृष्यमाणानीवेति शेषः ।। 5.1.79,80 ।।\n\nतत्र प्लवगे", "siromani": "पाण्डुरेति । कपिना आकृष्यमाणानि पाण्डुरत्वादिवर्णविशिष्टानि महाभ्राणि चकाशिरे", "bhusana": "पाण्डुरारुणवर्णानि नीलमाञ्जिष्ठकानि च ।\n\nकपिना ऽ ऽकृष्यमाणानि महाभ्राणि चकाशिरे"}, "has_tier1": false, "notes": [{"id": "crosstext:5.1.81:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mahābhra", "note_ru": "Облака, которые Хануман «тянет за собой» (1.80-81: pāṇḍurāruṇavarṇāni nīlamāñjiṣṭhakāni ca … mahābhrāṇi cakāśire, «сияли белые, розовые, тёмно-синие и красные огромные облака»), принадлежат к той же палитре морского экфрасиса, что развёртывает Калидаса в «Рагхуванше» XIII: «mātaṅganakraiḥ … paśya samudraphenān … velānilāya prasṛtā bhujaṃgā mahormivisphūrjathunirviśeṣāḥ» (XIII.11-12) — «посмотри на чудовищных крокодилов в пене прибоя … на змей, простёршихся на берегу, неотличимых от набегающих волн». Цветовой каталог Сундараканды (бело-розово-сине-красный) — зерно, из которого кавья выращивает многоступенчатую картину океана; параллель освещает описательный приём, не комментируемый подстрочником.", "type": "В", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.1.81", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Raghuvaṃśa XIII.10-15 (Kālidāsa)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.83", "verse": "83", "sanskrit_iast": "plavamānaṃ tu taṃ dṛṣṭvā plavagaṃ tvaritaṃ tadā । vavṛṣus tatra puṣpāṇi devagandharvadānavāḥ ॥83॥", "leonov_ru": "Видя стремительно летящую обезьяну тогда, Боги, гандхарвы и данавы пролили [дождь] цветов.", "commentary": {"siromani": "प्लवगेति । प्लवगप्रवरैः दृष्टो ऽवलोकितो हनूमान् पर्वसु समुद्र इव ववृधे\nप्लवमानमिति । प्लवमानं तं हनुमन्तं दृष्ट्वा देवगन्धर्वदानवाः पुष्पवर्षाणि ववृषुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.83:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна I. 20. 22: Данавы (dānava) — демоны-асуры (см. примеч. к I.15. 9) или один из их разрядов; сыновья мудреца Кашьяпы и Дану, дочери Дакши. Птицы (pataga)."}, {"id": "lexical:5.1.83:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dānava", "note_ru": "Данавы (dānava) — MW: dānava — «N. of a class of demons or giants (sons of Danu and Kaśyapa, enemies of the gods)». Данавы (сыновья Дану) — отличаются от дайтьев (сыновей Дити) и от ракшасов. В V.1.83 devagandharvadānavāḥ — три группы существ (боги + гандхарвы + данавы) осыпают Ханумана цветами. Примечательно, что данавы — обычные «враги богов» — здесь тоже участвуют в чествовании; это подчёркивает исключительность подвига Ханумана, перед которым все существа равны.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. dānava; Apte s.v. dānava", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.84", "verse": "84", "sanskrit_iast": "tatāpa na hi taṃ sūryaḥ plavantaṃ vānareśvaram । siṣeve ca tadā vāyū rāmakāryārthasiddhaye ॥84॥", "leonov_ru": "Летящего лучшего из обезьян не опаляло солнце, Овевал его ветер ради успеха замыслов Рамы.", "commentary": {"tilaka": "तं नहि ततापेत्यन्वयः । वायुः सिषेवे श्रमापनयनायेति भावः ।। 5.1.82,83 ।।\n\nकपिवरं विगतक्लमं वीक्ष्य नागादयस्तुष्टुवुः", "bhusana": "प्लवमानं तु तं दृष्ट्वा प्लवङ्गं त्वरितं तदा ।\n\nववर्षुः पुष्पवर्षाणि देवगन्धर्वदानवाः\nतताप न हि तं सूर्यः प्लवन्तं वानरोत्तमम् ।\n\nसिषेवे च तदा वायू रामकार्यार्थसिद्धये\nततापेति । रामकार्यं सीतान्वेषणम् तदेवार्थः प्रयोजनं सिद्धये लाभाय, तद्धेतुभूतहनुमच्छ्रमनिवर्तनायेत्यर्थः ।। 5.1.85,86।।\n\nनागाश्चतुष्टुवुर्यक्षा रक्षांसि विबुधाः खगाः ।\n\nप्रेक्ष्य सर्वे कपिवरं सहसा विगतक्लमम्\nनागा इति । रक्षांसि दिक्पालकरक्षस्सम्बन्धीनि", "siromani": "ततापेति । सूर्यः रामकार्यार्थसिद्धये प्लवन्तम् अत एव हितं वानरेश्वरं न तपाप तदा वायुः सिषेवे"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.84:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Ветер его овевал (siṣeve ca tadā vāyūḥ) – букв. «служил». В «Тилаке» поясняется: «чтобы устранить усталость [Ханумана]."}]}, {"verse_id": "5.1.85", "verse": "85", "sanskrit_iast": "ṛṣayas tuṣṭuvuś cainaṃ plavamānaṃ vihāyasā । jaguś ca devagandharvāḥ praśaṃsanto vanaukasam ॥85॥", "leonov_ru": "Радовались риши ему, летящему по небу, Боги и гандхарвы пели хвалы жителю лесов.", "commentary": {"siromani": "ऋषय इति । वनौकसमेनं हनूमन्तमृषयस्तुष्टुवुः प्रशंसन्तो देवगन्धर्वाः जगुश्च", "bhusana": "ऋषयस्तुष्टुवुश्चैनं प्लवमानं विहायसा ।\n\nजगुश्च देवगन्धर्वाः प्रशंसन्तो महौजसम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.85:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм. кто такие эпические риши.Славословия пели / Боги ему и гандхарвы (jaguś ca devagandharvāḥ praśaṃsanto vanaukasam) – букв. «и пели боги и гандхарвы, прославляя жителя леса»."}]}, {"verse_id": "5.1.86", "verse": "86", "sanskrit_iast": "nāgāś ca tuṣṭuvur yakṣā rakṣāṃsi vividhāni ca । prekṣya sarve kapivaraṃ sahasā vigataklamam ॥86॥", "leonov_ru": "И наги, якши и разнообразные ракшасы радовались все, Увидев внезапно лучшего из обезьян, не знающего устали.", "commentary": {"siromani": "नागा इति । विगतक्लमम् अन्यासाध्यव्यापारवत्त्वे ऽपि क्लमरहितं कपिवरं प्रेक्ष्य नागादयस्तुष्टुवुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.86:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Не знающего усталости (sahasā vigataklamam) – в комментарии «Широмани» слово vigataklamam глоссируется как klamarahitam (лишенного усталости). Однако вместе со словом sahasā более правильной выглядит интерпретация «внезапно избавленного от усталости»."}, {"id": "lexical:5.1.86:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "yakṣa", "note_ru": "Якша (yakṣa) — MW: yakṣa — «a kind of supernatural being (attendant on Kubera, the god of wealth; they are described as the sons of Pulastya or Kaśyapa, and are generally considered as harmless beings, but sometimes they appear as malevolent). Apte: yakṣa — «spirit, ghost, fairy». В V.1.86 nāgāś ca tuṣṭuvur yakṣā — наги и якши восхваляют Ханумана. Якши — «придворные» Куберы, хранители сокровищ и природных объектов; их отношение к Кубере сближает их с образом «природных духов». В отличие от нагов (подземные, водные) якши — «наземно-древесные» духи. Подстрочник «якши» — сохраняет имя без объяснения функции.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. yakṣa; Apte s.v. yakṣa", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.87", "verse": "87", "sanskrit_iast": "tasmin plavagaśārdūle plavamāne hanūmati । ikṣvākukulamānārthī cintayām āsa sāgaraḥ ॥87॥", "leonov_ru": "Когда тот тигр среди обезьян, Хануман, летел, Подумал Океан, радеющий о чести дома Икшваку:", "commentary": {"siromani": "तस्मिन्निति । हनूमति प्लवमाने सति इक्ष्वाकुकुलमानार्थी इक्ष्वाकुकुलस्य स्वजन्मकारणीभूतस्य मानं सत्कारमर्थयते तच्छीलः सागरश्चिन्तयामास", "tattvadipika": "तस्मिन्निति । सागरः सगरसम्बन्धी अत एव इक्ष्वाकुकुलमानार्थी पूजार्थी"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.87:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций"}, {"id": "lexical:5.1.87:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "ikṣvāku", "note_ru": "Икшваку (ikṣvāku) — MW: ikṣvāku — «N. of a king, son of Manu Vaivasvata, first of the solar dynasty». Родоначальник солнечной династии (sūryavaṃśa). В V.1.87-89 ikṣvākukulamānārthi — «радеющий о чести рода Икшваку» (о Хануманое); ikṣvākusacivo cāyaṃ — «этот [Хануман] — советник Икшваку (т.е. Рамы)». Имя Икшваку указывает на солнечную родословную Рамы — контраст с «лунной» (сома/чандра) родословной Бхарата. MW: ikṣu = «sugar-cane» — этимология от «сахарного тростника» нетривиальна; родоначальник вышел из «тростниковой» традиции. См. примеч. к II.42.1 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. ikṣvāku; Apte s.v. ikṣvāku", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.89", "verse": "89", "sanskrit_iast": "aham ikṣvākunāthena sagareṇa vivardhitaḥ । ikṣvākusacivaś cāyaṃ tan nārhaty avasīditum ॥89॥", "leonov_ru": "Я, увеличенный Сагарой, главой рода Икшваку, А он – советник рода Икшваку, то не должен он погибнуть.", "commentary": {"tilaka": "उक्तमेव विवृणोति अहमिति । तत्तस्मादेषो ऽवसादितुमवसत्तुं श्रमं गन्तुं नार्हति । सागरेण विवर्धित इत्युक्त्या कश्चिद्देशः सगरखातस्याप्येतत्संबद्ध इति ज्ञायते", "siromani": "तत्र हेतुं वदन्नाह अहमिति । इक्ष्वाकुनाथेन सगरेणाहं विवर्धितः तत्तस्माद्धेतोः अवसादितुं श्रमं प्राप्तुम् अयम् इक्ष्वाकुसचिवः नार्हति", "bhusana": "अहमिक्ष्वाकुनाथेन सगरेण विवर्द्धितः ।\n\nइक्ष्वाकुसचिवश्चायं नावसीदितुमर्हति"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.89:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм."}, {"id": "lexical:5.1.89:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "sagara", "note_ru": "Сагара (sagara) — MW: sagara — «N. of a celebrated king of the solar race (he is said to have caused the bed of the ocean to be dug, and it is named after him)». В V.1.89 sagareṇa vivardhi­taḥ — «тем [океаном, который] был расширен Сагарой». Этимология sagara «океан»: букв. «[тот, что создан] вместе с Сагарой / саморождённый». Миф: сыновья Сагары выкопали ложе океана, ища жертвенного коня; их золу оросил Бхагиратха водами Ганги. Этот эпизод объясняет, почему samudra (океан) именуется sāgara — «произошедший из деяния Сагары». Самодра сам объясняет свою связь с домом Икшваку. См. примеч. к I.70.31 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. sagara; Rām. Bāla 1.38-44 (миф Сагары)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.90", "verse": "90", "sanskrit_iast": "tathā mayā vidhātavyaṃ viśrameta yathā kapiḥ । śeṣaṃ ca mayi viśrāntaḥ sukhī so’titariṣyati ॥90॥", "leonov_ru": "Тогда должен я сделать так, чтобы обезьяна могла отдохнуть. Отдохнув у меня (на мне), он успешно одолеет остаток [пути]».", "commentary": {"tilaka": "शेषं मार्गशेषम्", "siromani": "तथेति । यथा ऽयं कपिः विश्रमेत तथा मया विधातव्यं मयि मद्विहितविश्रान्तिस्थाने विश्रान्तः निवर्तितश्रमः अत एव सुखी स हनुमान् शेषं मार्गम् अतितरिष्यति", "bhusana": "तथा मया विधातव्यं विश्रमेत यथा कपिः ।\n\nशेषं च मयि विश्रान्तस्सुखेनातिपतिष्यति"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.90:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «sukhī» Опущено[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций"}]}, {"verse_id": "5.1.91", "verse": "91", "sanskrit_iast": "iti kṛtvā matiṃ sādhvīṃ samudraś channam ambhasi । hiraṇyanābhaṃ mainākam uvāca girisattamam ॥91॥", "leonov_ru": "Приняв праведное решение, Океан скрытой в водах Горе Майнаке с золотым пупом (основной частью), лучшей из гор, сказал:", "commentary": {"tilaka": "अम्भसि स्वाम्भसि छन्नं हिरण्यनाभं हिरण्यप्रधानम् तन्मयमिति यावत् । \"नाभिः प्रधाने कस्तूर्याम्\" इति", "siromani": "इतीति । समुद्रः इति साध्वीं मतिं कृत्वा अम्भसि जले छन्नं हिरण्यनाभं सुवर्णप्रधानं तन्मयमित्यर्थः, मैनाकमुवाच । \"नाभिः प्रधाने कस्तूर्याम्\" इति कोशः", "tattvadipika": "हिरण्यनाभं हिरण्यप्रधानम्, हिरण्मयमित्यर्थः । \"नाभिः प्रधाने कस्तूर्याम्\" इति विश्वः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.91:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Златовершинной горе (hiraṇyanābhaṃ… girisattamam) – букв. «лучшей из гор с золотым пупом». Комментаторы поясняют, что nābhi означает здесь «основную часть» (pradhāna). Голдмены переводят композит hiraṇyanābha как golden-peaked (см.: Goldman 1984: 106).[Claude.AI — строго] [термин] (не учтено) Майнака — крылатая гора, предложила Хануману отдых"}, {"id": "lexical:5.1.91:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "maināka", "note_ru": "Майнака (maināka) — золотая гора (maināka), поднявшаяся из океана навстречу Хануману как место отдыха по просьбе Самудры (океана). В «Бхушане» — сын Гималаев и Мены; эпитеты hiraṇyanābha «золотопупый», girisattama «лучшая из гор». Хануман из учтивости касается её и летит дальше. Первое появление персонажа.", "type": "В", "subtype": "base", "trigger": "realia", "source": "gazetteer (analysis §09б / formulas tt.1-2) — first occurrence in кн. V (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.91:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "maināka", "note_ru": "Майнака. Эпизод, где Океан высылает золотую гору Майнаку дать Хануману отдых в прыжке, заранее назван в «оглавлении» поэмы (анукраманика, кн. I, песнь 3): «parvatārohaṇaṃ cāpi sāgarasyāpi laṅghanam । samudravacanāc caiva mainākasya ca darśanam» (Rām. I.3.27) — «О восхождении Ханумана на гору и его прыжке через океан, о помощи по слову Самудры Хануману горы Майнаки». Гринцеровская подпись — самоотсылка эпоса: кн. V развёртывает то, что кн. I перечислила одной строкой. Подстрочник стиха V.1.91 этой переклички с проспективным конспектом не отмечает.", "type": "В", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.1.91", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bālakāṇḍa (Rām. I) 3.27", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.91:1", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "maināka", "note_ru": "Майнака (гора) ≠ Менака (апсара) — почти-омонимия. Золотая гора Maināka, всплывающая для Ханумана (V.1.91), по имени едва отличима от апсары Menakā, соблазнившей Вишвамитру в кн. I: «menakā paramāpsarāḥ puṣkareṣu ... snātuṃ samupacakrame ... rūpeṇāpratimāṃ ... vidyutaṃ jalade yathā» (Rām. I.63.4–5) — «Прекрасная апсара Менака пришла в Пушкары искупаться ... чья прелесть не знает равных, прекрасная, как молния в туче». Оба имени — производные с vṛddhi; гора Maināka — «потомок Mena/Menā» (жены Химавата). Литературная перекличка имён (гора-помощница vs апсара-искусительница) — наблюдение гринцеровского поэтологического яруса. Подстрочник V.1.91 имя горы не комментирует.", "type": "В", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.1.91", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bālakāṇḍa (Rām. I) 63.4–5", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.92", "verse": "92", "sanskrit_iast": "tvam ihāsurasaṃghānāṃ devarajñā mahātmanā । pātālanilayānāṃ hi parighaḥ saṃniveśitaḥ ॥92॥", "leonov_ru": "Великим духом царем богов ты установлена здесь Преградой (засовом) полчищам асуров, обитающих в Патале.", "commentary": {"tattvadipika": "त्वन्निमित्तमित्यादि श्लोकद्वयमेकं वाक्यम् । एष कपिः योजनानां शतं समाप्लुतः समाप्लवितुमुपक्रान्तः । शेषं मार्गशेषं प्रक्रमतामिति त्वन्निमित्तमनेन सागरेणाहं बहुमानात्प्रचोदितः, अतः कपिशार्दूल  त्वं तिष्ठ मयि विश्रम्य गम्यतामित्यन्वयः ।। 5.1.15,16 ।।\n\nतदिति । तत् प्रसिद्धम्\nपरिघस्सन्निवेशितः आयुधविशेषत्वेन सन्निवेशितः, अनेन पक्षच्छेदभयात् समुद्रप्रवेशानन्तरं पातालस्थराक्षसनिरोधार्थं देवराजेन मैनाकः स्थापित इत्यवगम्यते ।। 5.1.93,94 ।।\n\nतिर्यगिति । वर्द्धितुं, शक्तिरस्तीति शेषः", "tilaka": "परिघ इति पक्षच्छेदभयात्समुद्रप्रवेशानन्तरं पातालस्थराक्षसनिरोधार्थं द्वारनिरोधकपरिघवन्मैनाकः स्थापित इत्यर्थः", "siromani": "तद्वचनाकारमाह त्वमिति । पातालनिलयानां मार्गनिरोधाय परिघः परिघत्वेन परिकल्पितस्त्वं देवराज्ञा देवराजेन संन्निवेशितः निर्गमबिले संस्थापितः\nतदेव भङ्ग्यन्तरेणाह त्वमिति । ज्ञातवीर्याणाम् एषां पुनरप्युत्पतिष्यताम् असुरसंघानां पातालस्य द्वारमावृत्य तिष्ठसि", "bhusana": "इति कृत्वा मतिं साध्वीं समुद्रश्छन्नमम्भसि ।\n\nहिरण्यनाभं मैनाकमुवाच गिरिसत्तमम्\nइतीति । हिरण्यनाभं हिरण्यश्रृङ्गम् नाभिशब्दो ह्यध्यक्षवाची, शृङ्गं च पर्वतस्याध्यक्षमेव । \"नाभिरध्यक्षकस्तूर्योः\"इति दर्पणः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.92:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — строго] [термин] (не учтено) Сураса — морская богиня, мать змей; испытывает Ханумана"}, {"id": "lexical:5.1.92:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "surasā", "note_ru": "Сураса (surasā) — мать нагов (nāgamātā), посланная богами испытать Ханумана на пути через океан. В «Таттвадипике» поясняется её роль как испытательницы силы героя. Первое появление персонажа.", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "phase2:5.1.92:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": false, "status": "принято: Леонов (2026-07-11)", "mg_comment": "", "lemma_iast": "parigha", "note_ru": "parighaḥ saṃniveśitaḥ («установлена преградой/засовом») — по Тилаке и Широмани, Майнака здесь не просто гора, а мифологический «засов»: после того как Индра обрубил горам крылья из страха перед их полётом, уцелевшая золотая Майнака была помещена царём богов стражем у выхода из Паталы, чтобы асуры не поднялись вновь на землю.", "type": "В", "source_commentary": ["tilaka", "siromani"], "why_proposed": "раскрывает космологическую функцию Майнаки (страж-засов у врат Паталы), увязанную с мифом об обрубленных Индрой крыльях гор (V.1.121–127) — деталь, которую подстрочник передаёт лишь метафорой «засов» без мифологического обоснования, а Леонов/Костина и Phase-1 не поясняют вовсе.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.93", "verse": "93", "sanskrit_iast": "tvam eṣāṃ jñātavīryāṇāṃ punar evotpatiṣyatām । pātālasyāprameyasya dvāram āvṛtya tiṣṭhasi ॥93॥", "leonov_ru": "Ты стоишь, заградив врата неизмеримой Паталы, Из которой они готовы вновь подняться, известные своей мощью.", "commentary": {"tilaka": "ज्ञातवीर्याणां देवराजेनेति शेषः । एषामसुराणाम्", "bhusana": "त्वमिहासुरसङ्घानां पातालतलवासिनाम् ।\n\nदेवराज्ञा गिरश्रेष्ठ परिघः सन्निवेशितः\nत्वमिति । परिघः अर्गलम् । \"परिघो मुद्गरे ऽर्गले \" इति दर्पणः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.93:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Они, могучие (eṣāṃ jñātavīryāṇāṃ) – букв. «те, чья сила [хорошо] известна»."}]}, {"verse_id": "5.1.95", "verse": "95", "sanskrit_iast": "sa eṣa kapiśārdūlas tvām uparyeti vīryavān । hanūmān rāmakāryārthī bhīmakarmā kham āplutaḥ ॥95॥", "leonov_ru": "Тот тигр среди обезьян, Хануман, радеющий о деле Рамы, грозный в деяниях, Взлетевший в небо, летит над тобой, отважный.", "commentary": {"tilaka": "उपर्येति तवोपरिप्रदेशं प्राप्नोति । तस्माद्विश्रामाय त्वमुत्तिष्ठेति पूर्वेणान्वयः । एतदुत्तरम् \"हनूमान्रामकार्यार्थी भीमकर्मा खमाप्लुतः । श्रमं च प्लवगेन्द्रस्य समीक्ष्योत्थातुमर्हसि ।।\" इति प्राचीनः पाङ्क्तः पाठः । अत्र खमाप्लुतः इत्यनन्तरं केचिच्श्लोकाः प्रक्षिप्ताः। परैरिति कतकः । यतो रामकार्यार्थी यतश्च श्राम्यति ततस्तस्य श्रमं समीक्ष्योत्थातुमर्हसि", "bhusana": "स एष कपिशार्दूलस्त्वामुपर्येति वीर्यवान् ।\n\nहनूमान् रामकार्यार्थं भीमकर्मा खमाप्लुतः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.95:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В бомбейском издании дальше следуют еще две строки: śramaṃ ca plavagendrasya samīkṣyotthātum arhasi «Видя усталость Индры меж обезьянами, ты должен подняться»."}, {"id": "crosstext:5.1.95:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "rāmakārya", "note_ru": "Эпитет Ханумана rāmakāryārthī — «радеющий о деле Рамы» — концентрирует посольскую этику Сундараканды: действие совершается ради дела господина, без личной корысти. Это нарративный аналог гитического kāryam … saṅgaṃ tyaktvā phalaṃ ca (БхГ 18.9): деяние исполняется «потому что должно», с отказом от привязанности и плода. Дут (посланник), действующий rāmakāryārthin, оказывается образцом нишкама-кармы в эпическом ключе. Свидетельство: уровень шлоки (мягкое).", "type": "А", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.1.95", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bhagavadgītā 18.9 (Семенцов)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.96", "verse": "96", "sanskrit_iast": "asya sāhyaṃ mayā kāryam ikṣvākukulavartinaḥ । mama ikṣvākavaḥ pūjyāḥ paraṃ pūjyatamās tava ॥96॥", "leonov_ru": "Должен я помочь ему, слуге рода Икшваку. Мной должны почитаться члены рода Икшваку, тем более должны они почитаться тобой.", "commentary": {"tilaka": "इक्ष्वाकुकुलस्य स्वोत्पादकस्य मानं सत्कारमर्थयते तथाभूतः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.96:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "мб комм. об индийской концепции долга?"}]}, {"verse_id": "5.1.98", "verse": "98", "sanskrit_iast": "salilād ūrdhvam uttiṣṭha tiṣṭhatv eṣa kapis tvayi । asmākam atithiś caiva pūjyaś ca plavatāṃ varaḥ ॥98॥", "leonov_ru": "Поднимись из вод, пусть остановится обезьяна на тебе. Этот лучший из обезьян – наш гость, заслуживающий почета.", "commentary": {"tattvadipika": "स एष एति । त्वामुपरि तवोपरि ।। 5.1.96,97 ।।\n\nअतः साचिव्यकरणात् अस्माकं कार्यं प्रयोजनं नातिक्रमेत् न लुप्यतामित्यर्थः । कार्यातिक्रमे अरिष्टमाह कर्तव्यमिति ।। 5.1.98,99 ।।\n\nचामीकर हिरण्यात्मक", "siromani": "स इति । सागरेण नियोजितः स मैनाकः मूहूर्तेन शृङ्गाणि दर्शयामास", "bhusana": "सलिलादूर्ध्वमुत्तिष्ठ तिष्ठत्वेष कपिस्त्वयि ।\n\nअस्माकमतिथिश्चैव पूज्यश्च प्लवतां वरः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.98:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «plavatāṃ varaḥ» Опущено"}]}, {"verse_id": "5.1.99", "verse": "99", "sanskrit_iast": "cāmīkaramahānābha devagandharvasevita । hanūmāṃs tvayi viśrāntas tataḥ śeṣaṃ gamiṣyati ॥99॥", "leonov_ru": "О [гора] с великой золотой серединой, о приют богов и гандхарвов, Хануман, на тебе отдохнувший, затем проделает остаток [пути].", "commentary": {"siromani": "शातगुम्भैरिति । सकिंनरमहोरगैः किन्नरमहोरगसहितैः शातकुम्भमयैः सुवर्णप्रचुरैः आदित्योदयसंङ्काशैः आदित्योदयेन प्रकाशमानैः उदयकालिकादित्यसदृशैर्वा अम्बरमुल्लिखद्भिरिव शृङ्गैर्मेनाकः शुशुभे इति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.99:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] ? [кат.1 — буквальный перевод] hiraṇyanābha — букв. «с золотым пупом»"}]}, {"verse_id": "5.1.100", "verse": "100", "sanskrit_iast": "kākutsthasyānṛśaṃsyaṃ ca maithilyāś ca vivāsanam । śramaṃ ca plavagendrasya samīkṣyotthātum arhasi ॥100॥", "leonov_ru": "Мягкосердечие Какутстхи, его разлуку с Майтхили, И усталость владыки обезьян (Ханумана) видя, ты должна подняться [из вод]».", "commentary": {"bhusana": "काकुत्स्थस्यानृशंस्यं च मैथिल्याश्च विवासनम् ।\n\nश्रमं च प्लवगेन्द्रस्य समीक्ष्योत्थातुमर्हसि\nकाकुत्स्थस्येति । काकुत्स्थस्यानृशंस्यं रामस्य सीताविषयां दयाम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.100:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.Строфы 96-100 отсутствуют в бомбейском издании и приводятся по изданию «Гита-пресс».[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна I. 1. 53: Майтхили (maithilī) — одно из имен Ситы, царевны Митхилы — столицы царства ее отца Джанаки."}, {"id": "lexical:5.1.100:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "kākutstha", "note_ru": "Потомок Какутстхи (kākutstha) — MW: kākutstha — «descendant of Kakutstha» (имя царя из рода Икшваку). Kākutstha — патроним Рамы наравне с rāghava и dāśarathi: указывает на конкретного предка — Какутстху. Этимология: kaku «горб» + stha «стоящий» — Какутстха — «стоящий на горбу быка» (согласно мифу, он встал на горб Индры, принявшего облик быка). В V.1.100 kākutsthasya — «ради благополучия потомка Какутстхи». Подстрочник часто переводит просто «Рамы» — эпонимический предок Какутстха остаётся в тени.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. kākutstha; Rām. Bāla passim", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.101", "verse": "101", "sanskrit_iast": "hiraṇyagarbho maināko niśamya lavaṇāmbhasaḥ । utpapāta jalāt tūrṇaṃ mahādrumalatāvṛtaḥ ॥101॥", "leonov_ru": "Майнака с золотой серединой, услышав [речь] Океана, Тут же поднялась из вод, покрытая высокими деревьями и лианами.", "commentary": {"bhusana": "हिरण्यनाभो मैनाको निशम्य लवणाम्भसः ।\n\nउत्पपात जलात्तूर्णं महाद्रुमलतायुतः"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.101:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "hiraṇyanābha", "note_ru": "Золотопупый (hiraṇyanābha) — букв. «имеющий золотой пуп» (hiraṇya «золото» + nābha «пуп, центр»). Эпитет горы Майнаки. MW: hiraṇya — «gold; any gold-coloured object». Nābha = пуп; метафорически — «центральная точка». Hiraṇyanābha — «с золотым центром (основанием)» — образ горы с золотыми недрами. В V.1.101 hiraṇyagarbho maināko — «золотоутробный Майнака». HiraṇyanAbha и hiraṇyagarbha («золотой зародыш»; эпитет Брахмы/Прародителя) — созвучные образы: гора как космогонический «золотой центр».", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. hiraṇyanābha; Apte s.v. hiraṇyagarbha", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.103", "verse": "103", "sanskrit_iast": "sa mahātmā muhūrtena parvataḥ salilāvṛtaḥ । darśayām āsa śṛṅgāṇi sāgareṇa niyojitaḥ ॥103॥", "leonov_ru": "Та великая духом гора, покрытая водой, на некоторое время Показала свои пики по воле Океана.", "commentary": {"siromani": "दर्शयन्त इति । महाविद्यां महाविद्याजनितनिरवलम्बनस्थितिरूपां स्वशक्तिं दर्शयन्तः सहिता मिलिता विद्याधरमहर्षयः आकाशे तस्थुः पर्वतं वीक्षाञ्चक्रुर्विशेषेण ददृशुश्च । अम्बरे स्थितानामृष्यादीनां शब्दं शुश्रुवुश्च । श्लोकद्वयमेकान्वयि ।। 5.1.27,28 ।।\n\nतच्छब्दाकारमाह एष इति । दुष्करम् अन्यैः कर्तुमशक्यं कर्म चिकीर्षन् कर्तुमिच्छन् महावेगो हनुमान् समुद्रं तितीर्षति प्लोतुमिच्छति समुद्रस्य पारं प्राप्तुमिच्छति च । श्लोकद्वयमेकान्वयि ।। 5.1.29,30 ।।\n\nइतीति । विद्याधरास्तपस्विनाम् ऋष्यादीनामिति वाचः श्रुत्वा पर्वते तं हनुमन्तं ददृशुः\nस इति । स हनुमान् उच्छ्रितमुत्थितं तं मैनाकं जीमूतं मारुत इव उरसा पातयामास", "bhusana": "स महात्मा मुहूर्तेन पर्वतस्सलिलावृतः ।\n\nदर्शयामास शृङ्गाणि सागरेण नियोजितः"}, "has_tier1": false, "notes": [{"id": "edition:5.1.103:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлока 5.1.103 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.1.103", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.103", "iast": "sa mahātmā muhūrtena parvataḥ salilāvṛtaḥ । darśayām āsa śṛṅgāṇi sāgareṇa niyojitaḥ ॥103॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.104", "verse": "104", "sanskrit_iast": "śātakumbhamayaiḥ śṛṅgaiḥ sakiṃnaramahoragaiḥ । ādityodayasaṃkāśair ālikhadbhir ivāmbaram ॥104॥", "leonov_ru": "Благодаря тем золотым пикам, населенным киннарами и великими змеями, Подобным восходу солнца, словно бы трущимся о небо,", "commentary": {"tilaka": "एतदुत्तरम् \"शातकुम्भमयैः\" इत्यादि । अत्रापि द्वित्रश्लोकप्रक्षेपः परेषाम् । हिरण्यनाभत्वविवरणम् शातकुम्भमयैरिति । आदित्योदयसङ्काशैरिति उपलक्षित इति शेषः", "siromani": "स इति । तेन हनुमता आसादितः विद्धः पर्वतोत्तमः स मैनाकः हरैर्हनुमतो वेगं बुद्ध्वा जहर्ष ननाद च"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.104:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "kiṃnara", "note_ru": "Кимнара (kiṃnara) — букв. «что за человек?» (kim «что?» + nara «человек»). MW: kiṃnara — «a kind of supernatural being (described as having a human figure with the head of a horse, or the head of a man with the body of a horse)». Кимнары — «полулюди», музыканты на службе у Куберы; отличаются от гандхарвов (певцы богов), видьядхаров (маги) и якшей (хранители богатств). Этимологическая игра: их название — буквально риторический вопрос «это человек?». В V.1.104 sakiṃnaramahoragaiḥ — «с кимнарами и великими нагами» на вершинах Майнаки.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. kiṃnara; Apte s.v. kiṃnara", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.105", "verse": "105", "sanskrit_iast": "tasya jāmbūnadaiḥ śṛṅgaiḥ parvatasya samutthitaiḥ । ākāśaṃ śastrasaṃkāśam abhavat kāñcanaprabham ॥105॥", "leonov_ru": "Той горы золотыми пиками вздыбившимися Небо, [синевой] подобное клинку, озарилось золотым сиянием.", "commentary": {"tilaka": "शस्त्रसङ्काशं शस्त्रवच्छ्याममाकाशं काञ्चनप्रभमभवत् ।। 5.1.98,99 ।।\n\nअसङ्गेनाविलम्बेन", "siromani": "तस्येति । समुत्थितैः तस्य शृङ्गैः शस्त्रसंकाशं श्यामत्वेन खड्गसदृशमाकाशं काञ्चनप्रभम् अभवत्", "bhusana": "शातकुम्भनिभैश्श्रृङ्गैस्सकिन्नरमहोरगैः ।\n\nआदित्योदयसङ्काशैरालिखद्भिरिवाम्बरम्\nशातकुम्भेति । शातकुम्भनिभैः स्वर्णसदृशैः आदित्योदयसङ्काशैः आदित्योदयतुल्यैरित्यर्थः । शृङ्गैरुपलक्षितः शृङ्गाणि दर्शयामासेति योजना\nतप्तजाम्बूनदैश्शृङ्गैः पर्वतस्य समुत्थितैः ।\n\nआकाशं शस्त्रसङ्काशमभवत् काञ्चनप्रभम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.105:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "… небо, / Синевою клинку подобное (ākāśaṃ śastrasaṃkāśam) – букв. «небо, подобное мечу». В комментарии «Широмани» отмечается, что небо сравнивается с мечом своим темным (темно-синим, śyāma) цветом."}]}, {"verse_id": "5.1.106", "verse": "106", "sanskrit_iast": "jātarūpamayaiḥ śṛṅgair bhrājamānair mahāprabhaiḥ । ādityaśatasaṃkāśaḥ so 'bhavad girisattamaḥ ॥106॥", "leonov_ru": "С золотыми пиками, ослепительно сияющими, Была лучшая из гор подобна сотне солнц.", "commentary": {"siromani": "जातेति । गिरिसत्तमः स मैनाकः जातरूपमयैः सुवर्णप्रचुरैः अत एव महाप्रभैः अत एव भ्राजमानैः अतिशोभितैः शृङ्गैः स्वशिखरैः आदित्यशतसंकाशो ऽभवत्", "bhusana": "जातरूपमयैः शृङ्गैर्भ्राजमानैस्स्वयंप्रभैः ।\n\nआद्त्यशतसङ्काशस्सो ऽभवद्गिरिसत्तमः"}, "has_tier1": false, "notes": [{"id": "crosstext:5.1.106:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "jātarūpamaya", "note_ru": "Эпитет jātarūpamaya «из чистого золота» (V.1.106, о золотых пиках горы Майнаки) — устойчивая формула описания дивных, кубероподобных мест. Ср. Āraṇyaka 3.151.5, описание лотосового озера Куберы на Кайласе: «jātarūpamayaiḥ padmaiśchannāṃ paramagandhibhiḥ» — «(озеро,) усеянное ароматнейшими золотыми лотосами (jātarūpamaya)».

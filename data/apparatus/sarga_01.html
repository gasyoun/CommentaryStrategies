 В обоих случаях золото маркирует принадлежность ландшафта к сфере якшей/богов. Сундараканда наделяет Майнаку той же сакрально-золотой топикой. Свидетельство: уровень шлоки (мягкое).", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.1.106", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparva 3.151.5", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.107", "verse": "107", "sanskrit_iast": "samutthitam asaṅgena hanūmān agrataḥ sthitam । madhye lavaṇatoyasya vighno 'yam iti niścitaḥ ॥107॥", "leonov_ru": "Хануман решил, что перед ним – препятствие, Поднявшееся без помех (стремительно) среди океанских вод.", "commentary": {"tilaka": "सो ऽयं राघवकुलजः सागरस्तत्प्रतिकारार्थी तत्कुलप्रत्युपकारार्थी । त्वत्तः सत्क्रियमाणाद्द्वारभूतात्संमानं राघवकुलपूजामर्हति । त्वन्निमित्तं त्वत्सत्कारार्थं प्रचोदितः प्रेरितः", "bhusana": "तप्तेति । शस्त्रसङ्काशं नीलमित्यर्थः । \"शस्त्रमायुधलोहयोः\" इति विश्वः ।। 5.1.106,107।।\n\nतमुत्थितमसङ्गेन हनुमानग्रतः स्थितम् ।\n\nमध्ये लवणतोयस्य विघ्नो ऽयमिति निश्चितः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.107:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Воздвигшаяся внезапно (samutthitam asaṅgena) – большинство комментаторов интерпретируют слово asaṅgena (букв. «безпрепятственно») в значении «внезапно», «вдруг»."}]}, {"verse_id": "5.1.108", "verse": "108", "sanskrit_iast": "sa tam ucchritam atyarthaṃ mahāvego mahākapiḥ । urasā pātayām āsa jīmūtam iva mārutaḥ ॥108॥", "leonov_ru": "Ту высоко поднявшуюся [гору] великая обезьяна, наделенная великой стремительностью, Толкнула грудью, словно ветер – облако.", "commentary": {"tilaka": "पातयामास तमत्यर्थमुच्छ्रितं दृष्ट्वा तच्छृङ्गं पातयामासेत्यर्थः\nतदेव विवृणोति तमिति ।। 5.1.103,104 ।।\n\nराघवस्य कुले जातैः सगरपुत्रैः\nप्रेरणाप्रकारः-- योजनानामिति । योजनानां शतमपि प्रक्रमितुं खमाप्लुत एष कपिः शेषं प्रकान्तावशेषं तव सानुषु विश्रान्तः सन्प्रक्रमतामिति यतः प्रेरितो ऽस्मि, अतो मयि तिष्ठ । स्थित्वा विश्रम्य पश्चाद्गम्यतामिति योजना । अत्र \"तिष्ठ त्वम्\" इत्यर्धं प्रक्षिप्तमिति केचित्", "siromani": "तमिति । असङ्गेन विलम्बराहित्येन लवणतोयस्य मध्ये उत्थितं मैनाकं विघ्नो ऽयमिति निश्चितः निश्चितवान् हनुमानासीदिति शेषः\nतमिति । मानुषं रूपं धारयन् आत्मनः शिखरे शृङ्गे स्थितः आकाशे समुपस्थितः प्राप्तः प्रीतः पर्वतो मैनाकः आकाशगतं कपिं तं हनूमन्तं वाक्यमब्रवीत् । सार्धश्लोक एकान्वयी", "bhusana": "स तमुच्छ्रितमत्यर्थं महावेगो महाकपिः ।\n\nउरसा पातयामास जीमूतमिव मारुतः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.108:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Толкнул эту гору грудью (urasā pātayām āsa) – букв. «опрокинул/разрушил грудью». Автор «Тилаки» полагает, что речь идет о горном пике (tacchṛṇgaṃ pātayām āsa). Голдмены переводят глагол здесь как pushed aside, полагая, что это более соответствует смыслу происходящего (см.: Goldman 1984: 107)."}]}, {"verse_id": "5.1.109", "verse": "109", "sanskrit_iast": "sa tadāsāditas tena kapinā parvatottamaḥ । buddhvā tasya harer vegaṃ jaharṣa ca nananda ca ॥109॥", "leonov_ru": "Лучшая из гор, которую толкнула та обезьяна, Узнав скорость той обезьяны, обрадовалась и возликовала.", "commentary": {"siromani": "तदिति । तदुक्तहेतोः तदुत्तममिदं कन्दमूलफलमास्वाद्य विश्रान्तः सन् गमिष्यासि"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.109:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Закричал в ликовании (jaharṣa ca nanāda ca) – в критическое издание вошел вариант jaharṣa ca nananda ca «и обрадовалась, и возликовала» (см.: Jhala 1966: 20). В «Таттвадипике» разница между этими глаголами поясняется следующим образом: nand обозначает эмоциональное состояние, а hṛṣ - его телесное проявление."}]}, {"verse_id": "5.1.112", "verse": "112", "sanskrit_iast": "nipatya mama śṛṅgeṣu sukhaṃ viśramya gamyatām । rāghāvasya kule jātair udadhiḥ parivardhitaḥ ॥112॥", "leonov_ru": "Садись на мои пики, отдохни вволю и лети [дальше], Рожденными в роду Рагху Океан [некогда] был увеличен (выкопан).", "commentary": {"bhusana": "राघवस्य कुले जातैरुदधिः परिवर्द्धितः ।\n\nस त्वां रामहिते युक्तं प्रत्यर्चयति सागरः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.112:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «sukhaṃ» Опущено"}, {"id": "tier1:5.1.112:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — строго] [термин] (не учтено) Дадхимукха — хранитель медового леса, дядя Сугривы"}]}, {"verse_id": "5.1.113", "verse": "113", "sanskrit_iast": "sa tvāṃ rāmahite yuktaṃ pratyarcayati sāgaraḥ । kṛte ca pratikartavyam eṣa dharmaḥ sanātanaḥ ॥113॥", "leonov_ru": "Океан почитает тебя, радеющего о благе Рамы. На сделанное отвечать тем же – вот вечный закон.", "commentary": {"tilaka": "विवक्षितप्राशस्त्यमेवाह त्वं हीति", "bhusana": "कृते च प्रतिकर्तव्यमेष धर्मस्सनातनः ।\n\nसो ऽयं त्वत्प्रतिकारार्थी त्वत्तः सम्मानमर्हति\nकृते इति । कृते उपकारे त्वत्प्रतिकारार्थी त्वदातिथ्यकरणापेक्षी । त्वत्तः संमानमर्हतीति त्वया तत्कृतातिथ्यपरिग्रह एवास्य संमानमित्यर्थः ।। 5.1.114,115।।\n\nयोजनानां शतं चापि कपिरेष समाप्लुतः ।\n\nतव सानुषु विश्रान्तश्शेषं प्रक्रमतामिति\nचोदनाप्रकारमाहयोजनानामिति । प्रक्रमतामिति प्रचोदित इति पूर्वेणान्वयः", "tattvadipika": "कृते चेति । कृते उपकारे सो ऽयमुदधिः तत्प्रतिकारार्थी इति पाठः । तस्योपकारस्य प्रत्युपकारार्थी त्वत्तस्सम्मानमर्हति, त्वत्सकाशात् त्वत्स्वीकाररूपां पूजां प्राप्तुं योग्यो भवतीत्यर्थः"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.113:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "sanātana", "note_ru": "Вечный / изначальный закон (sanātana) — MW: sanātana — «eternal, everlasting; ancient, perpetual». В V.1.113 eṣa dharmaḥ sanātanaḥ — «таков вечный закон» (о долге воздавать за благодеяния). Sanātana dharma — «извечный порядок» как противоположность ситуативным нормам. В позднеиндуистской мысли sanātana dharma = «индуизм как вечная религия». Здесь в эпическом контексте — «незыблемый принцип взаимности»: тот, кому помогли, обязан помочь в ответ. Подстрочник «вечный» верен, но не маркирует терминологическую нагруженность sanātana в Hindu-dharma.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. sanātana; Apte s.v. sanātanadharma", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.114", "verse": "114", "sanskrit_iast": "so 'yaṃ tat pratikārārthī tvattaḥ sammānam arhati । tvannimittam anenāhaṃ bahumānāt pracoditaḥ ॥114॥", "leonov_ru": "Поскольку он воздает за сделанное, то от тебя заслуживает уважения. Ради тебя и из почтения к тебе он побудил меня, [сказав]:", "commentary": {"tilaka": "तत्तस्माद्यदिदं कन्दादि मयि बहु दृश्यते तदास्वाद्येत्यन्वयः", "siromani": "तत्प्रयोजनमाह स इति । खमाकाशमाप्लुतः प्राप्तः स प्रसिद्धः एष हनूमान् त्वामुपर्येति तवोपरिदेशं प्राप्नोति अतः प्लवगेन्द्रस्य श्रमं समीक्ष्य उत्थातुमर्हसि । सार्धश्लोक एकान्वयी ।। 5.1.94,95 ।।\n\nहिरण्येति । मैनाकः लवणाम्भसः वचनमिति शेषः, निशम्य श्रुत्वा जलात् तूर्णमुत्पपात\nत्वं तु ममातीव पूज्य इति बोधयितुमाह अतिथिरिति । धर्मं जिज्ञासमानेन ज्ञातुमिच्छता विजानता च प्राकृतो ऽपि अतिथिः पूजार्हः पूजनीयः, यादृशः प्राकृतविलक्षणो भवान् पूजार्ह इति किं वक्तव्यम्\nत्वमिति । मारुतस्य त्वं पुत्रः अत एव वेगेन तस्यैव सदृशो ऽसीति शेषः\nतत इति । ततः सर्वदिग्गमनानन्तरम् ऋषिभिः सह देवसंघाः भूतानि अन्ये प्राणिनश्च तेषां पर्वतानां पतनशङ्कया भयं जग्मुः", "bhusana": "त्वन्निमित्तमनेनाहं बहुमानात्प्रचोदितः ।\n\nतिष्ठ त्वं कपिशार्दूल मयि विश्रम्य गम्यताम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.114:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Из почтенья к тебе / Так он ко мне обратился (tvannimittam anenāhaṃ bahumānāt pracoditaḥ) – букв.: «Ради тебя и из уважения [к тебе] он побудил меня». В «Тилаке» tvannimittam (ради тебя) поясняется как «чтобы оказать тебе гостеприимство» (tvatsatkārārtham)."}]}, {"verse_id": "5.1.116", "verse": "116", "sanskrit_iast": "tiṣṭha tvaṃ hariśārdūla mayi viśramya gamyatām । tad idaṃ gandhavat svādu kandamūlaphalaṃ bahu ॥116॥", "leonov_ru": "Сядь на меня, тигр среди обезьян, отдохни и лети [далее]. Много здесь ароматных и сладких корней и плодов.", "commentary": {"siromani": "तद्वचनाकारमाह दुष्कृतमिति । हे वानरोत्तम त्वमिदं दुष्कृतं कर्म कृतवान् अतः मम शृङ्गेषु निपत्य यथासुखं विश्रम्य गम्यताम्\nतिष्ठेति । त्वं मयि तिष्ठ विश्रम्य गम्यतां च । अर्धं पृथक् । तदेव भङ्गयन्तेरणाह योजनमिति । योजनानां शतं प्रक्रमितुमिति शेषः । खमाप्लुत एष भवान् मम सानुषु विश्रान्तः सन् शेषमध्वानं प्रक्रमताम् । अर्धद्वयमेकान्वयि"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.116:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «hariśārdūla» Опущено"}, {"id": "tier1:5.1.116:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Здесь много плодов и кореньев, / Сладких и ароматных (tad idaṃ gandhavat svādu kandamūlaphalaṃ bahu) – букв. «клубней, кореньев и плодов». В комментарии «Бхушана» слово kanda глоссируется как karahāṭa (корень или стебель лотоса)."}]}, {"verse_id": "5.1.117", "verse": "117", "sanskrit_iast": "tad āsvādya hariśreṣṭha viśrānto 'tha gamiṣyasi । asmākam api saṃbandhaḥ kapimukhya tvayāsti vai । prakhyatas triṣu lokeṣu mahāguṇaparigrahaḥ ॥117॥", "leonov_ru": "Вкусив их, лучший из обезьян, отдохнув, отправишься ты тогда в путь. О вождь обезьян, я тоже в связи с тобой, Прославленным в трех мирах, обладающим великими достоинствами.", "commentary": {"tilaka": "अस्माकमपि संबन्धस्त्वत्साहाय्यकरणप्रयोजकः इति शेषः । तं संबन्धं वक्तुमाह-- प्रख्यात इति । भवान्महागुणपरिग्रहः बहुव्रीहिरयम्, अतस्त्रिषु लोकेषु प्रख्यातः", "siromani": "अस्माकमिति । हे कपिमुख्य यतः यस्त्वं महागुणानां स्वामिसेवानुकूलानां परिग्रहः परिगृहीता अत एव त्रिषु लोकेषु विख्यातः अतः तेन त्वया सह अस्माकमपि संबन्धो ऽस्ति", "bhusana": "तदिदं गन्धवत् स्वादु कन्दमूलफलं बहु ।\n\nतदास्वाद्य हरि श्रेष्ठ विङन्तो ऽनुगमिष्यसि\nतदिति । तत्प्रसिद्धम् । कन्दः करहाटः । मूलं पादः । तत्तस्मात्\nअस्माकमपि सम्बन्धः कपिमुख्य त्वया ऽस्ति वै ।\n\nप्रख्यातस्त्रिषु लोकेषु महागुणपरिग्रहः ।। 5.1.118।\n\nवेगवन्तः प्लवन्तो ये प्लवगा मारुतात्मज ।\n\nतेषां मुख्यतमं मन्ये त्वामहं कपिकुञ्जर"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.117:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И поистинне драгоценна (mahāguṇaparigrahaḥ) – букв. «обладает великими достоинствами». О сути этой связи сказано в следующих строфах."}]}, {"verse_id": "5.1.118", "verse": "118", "sanskrit_iast": "vegavantaḥ plavanto ye plavagā mārutātmaja । teṣāṃ mukhyatamaṃ manye tvām ahaṃ kapikuñjara ॥118॥", "leonov_ru": "Обезьяны, которые прыгают, наделенные быстротой, о сын ветра, Их главой полагаю я тебя, о слон среди обезьян.", "commentary": {"siromani": "वेगवन्त इति । हे मारुतात्मज वेगवन्तः प्लवन्तो ये प्लवङ्गाः तेषां मुख्यतमं त्वामहं मन्ये"}, "has_tier1": false, "notes": [{"id": "crosstext:5.1.118:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mārutātmaja", "note_ru": "Эпитет mārutātmaja «сын Ветра» (V.1.118) применён к Хануману. Тот же эпитет того же персонажа — в ключевом эпизоде встречи Ханумана и Бхимы (оба сыновья Ваю!): Āraṇyaka 3.149.16 «na hi te kiñcidaprāpyaṃ mārutātmaja vidyate» — «Воистину, для тебя нет ничего недостижимого, о сын Ветра (mārutātmaja)!». Этот локус — лучший внешний комментарий к сундараканде: там Хануман демонстрирует Бхиме свой облик «прыжка через океан» (sāgaralaṅghana), а Бхима признаёт, что Хануман один мог бы уничтожить Ланку. Прямая мифологическая перекличка двух эпосов через общего отца-Ваю. Свидетельство: уровень шлоки (мягкое, но сильное по содержанию).", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.1.118", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparva 3.149.16", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.119", "verse": "119", "sanskrit_iast": "atithiḥ kila pūjārhaḥ prākṛto 'pi vijānatā । dharmaṃ jijñāsamānena kiṃ punar yādṛśo bhavān ॥119॥", "leonov_ru": "Воистину, гость заслуживает почета, даже заурядный, это известно, Тем, кто стремиться познать дхарму, тем более – [гость], подобный тебе. (Воистину, тому, кто стремиться познать дхарму, должно уважать даже заурядного гостя, это очевидно, тем более – уважать такого гостя, как ты).", "commentary": {"tilaka": "भवान्यादृशस्तादृशः पूज्य इति किं पुनरिति योजना", "bhusana": "अतिथिः किल पूजार्हः प्राकृतो ऽपि विजानता ।।\n\nधर्मं जिज्ञासमानेन किं पुनस्त्वादृशो महान्"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.119:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "prākṛta", "note_ru": "Простой / обычный (prākṛta) — MW: prākṛta — «natural, original, unrefined; vernacular (said of a language or dialect derived from Sanskrit)». В V.1.119 atithiḥ kila pūjārhaḥ prākṛto 'pi vijānatā — «гость, даже простой (prākṛta), достоин почтения от того, кто знает». Prākṛta = «природный, несовершенный, необработанный» — здесь в социальном смысле «не высокорождённый, обычный». Прāкṛta — также название пракрита (разговорный язык, противопоставленный санскриту-saṃskṛta). Здесь: «даже самый простой гость» — подчёркивает универсальность долга гостеприимства.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. prākṛta; Apte s.v. prākṛta", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.119:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "atithi", "note_ru": "Майнака предлагает Хануману гостеприимство гномической максимой: atithiḥ kila pūjārhaḥ prākṛto 'pi vijānatā dharmaṃ jijñāsamānena «Воистину, гость заслуживает почёта, даже заурядный, — тем, кто стремится познать дхарму». Прямая параллель к atithi-dharma Ману, где приём гостя — строгая обязанность домохозяина. Ср. Manu 3.99 sqq.: гостя (atithi), пришедшего к закату, домохозяин ни в коем случае не оставляет без приёма; пренебрежение гостем уносит заслуги хозяина. Эпическая сентенция и шастрическая норма выражают единый идеал ātithya; локус классикус для термина.", "type": "А", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.1.119", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra (Законы Ману, рус. пер. С.Д. Эльманович / Г.И. Ильин) Manu 3.99–112", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.119:1", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "atithiḥ pūjārhaḥ", "note_ru": "Гнома Майнаки «гость заслуживает почёта, даже заурядный» (atithiḥ kila pūjārhaḥ prākṛto 'pi, V.1.119) — формульное выражение дхармы гостеприимства (atithi-pūjā). Ср. Ādi 1.157.4, где Вьяса, придя к скрывающимся Пандавам, спрашивает: «api vipreṣu vaḥ pūjā pūjārheṣu na hīyate» — «не лишаются ли почестей те, кто заслуживает их (pūjārha)?». Один и тот же корень pūjā-arha закрепляет общеэпический кодекс приёма достойного гостя; Майнака прилагает его к Хануману, чтобы оправдать своё желание дать ему отдых. Свидетельство: уровень шлоки (мягкое).", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.1.119", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Ādiparva 1.157.4", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.119:2", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "atithi", "note_ru": "К той же строке о госте (V.1.119): термин atithi в эпосе несёт сакральную неприкосновенность. Ср. Āraṇyaka 3.154.33, где ракшаса оправдывает, почему не убил переодетого брахманом Бхиму: «atithiṃ brahmarūpaṃ ca kathaṃ hanyāmanāgasam / …yo hanyānnarakaṃ vrajet» — «Как мог я погубить невиновного, (бывшего нашим) гостем (atithi) в облике брахмана?.. Тот, кто убьёт такого, попадёт в Нараку». Параллель проясняет: почёт гостю у Майнаки — не вежливость, а религиозная норма, нарушение которой ведёт в ад. Свидетельство: уровень шлоки (мягкое).", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.1.119", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparva 3.154.33", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.121", "verse": "121", "sanskrit_iast": "pūjite tvayi dharmajñe pūjāṃ prāpnoti mārutaḥ । tasmāt tvaṃ pūjanīyo me śṛṇu cāpy atra kāraṇam ॥121॥", "leonov_ru": "После того, как почтен ты, знающий дхарму, обретает почет бог ветра. Потому надлежит почтить тебя. Выслушай мою причину [для этого].", "commentary": {"tilaka": "अस्मिन्कार्ये प्रत्युपकाररूपे । एवंगते सति चिरात्प्राप्ते सति । मया समुद्रेण चेति शेषः । त्वं पूजास्वीकारेण तयोः प्रीतिं कर्तुमर्हसि", "bhusana": "त्वं हि देववरिष्ठस्य मारुतस्य महात्मनः ।।\n\nपुत्रस्तस्यैव वेगेन सदृशः कपिकुञ्जर\nपूजिते त्वयि धर्मज्ञ पूजां प्राप्नोति मारुतः ।\n\nतस्मात्त्वं पूजनीयो मे श्रृणु चाप्यत्र कारणम्", "siromani": "कारणमेवाह पूर्वमित्यादिभिः । कृतयुगे पूर्वमुत्पत्तिसमये पर्वताः पक्षिणः पक्षविशिष्टाः अभवन् ते पर्वताः वेगिनो गरुडा इव सर्वा दिशः जग्मुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.121:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «dharmajñe» Опущено"}]}, {"verse_id": "5.1.122", "verse": "122", "sanskrit_iast": "pūrvaṃ kṛtayuge tāta parvatāḥ pakṣiṇo 'bhavan । te 'pi jagmur diśaḥ sarvā garuḍā iva veginaḥ ॥122॥", "leonov_ru": "Некогда, во времена Критаюги, сынок, были крылатыми горы. И они летали по все стороны, стремительные, подобно Гарудам.", "commentary": {"siromani": "तत इति । ततः भीतिप्राप्त्यनन्तरं शतक्रतुः ततस्तेषां शतसहस्रशः पर्वतानां पक्षान् चिच्छेद"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.122:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "kṛtayuga", "note_ru": "Крита-юга / Золотой век (kṛtayuga) — MW: kṛtayuga — «the first of the four ages of the world, the golden age». Первая из четырёх юг (kṛta / satya → tretā → dvāpara → kali). Kṛta = «совершённое, завершённое» → «эпоха совершенства». В V.1.122 pūrvaṃ kṛtayuge tāta parvatāḥ pakṣiṇo 'bhavan — «прежде, в Крита-югу, горы были птицами». Это прямая отсылка к мифологической космологии: в Крита-юге горы летали, в нынешнюю эпоху — нет. Миф объясняет, почему Индра отсёк им крылья (V.1.124). Прямая функция этого мифа = оправдание образа «Хануман как крылатая гора».", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. kṛtayuga; Apte s.v. yuga", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.122:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "kṛtayuga", "note_ru": "«Некогда, во времена Критаюги (kṛtayuge), горы были крылатыми». Ману даёт нормативное учение о четырёх югах и убывании дхармы. Manu 1.81 — catuṣpāt sakalo dharmaḥ satyaṃ caiva kṛte yuge «В век Крита дхарма четвероногая и полная, так же и истина». Manu 1.85 — anye kṛtayuge dharmāstretāyāṃ dvāpare 'pare anye kaliyuge nṛṇāṃ yugahrāsānurūpataḥ «Одни дхармы — в век Крита, другие — в Трета и Двапара, иные — в Кали, соответственно укорочению веков». Сундараканда, разворачивающаяся в Трета-югу, помещает «крылатые горы» в идеализированное прошлое Криты — эпоху полной дхармы у Ману. Локус классикус для четырёхъюговой схемы.", "type": "А", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.1.122", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra (Законы Ману, рус. пер. С.Д. Эльманович / Г.И. Ильин) Manu 1.81; 1.85–86", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.124", "verse": "124", "sanskrit_iast": "tataḥ kruddhaḥ sahasrākṣaḥ parvatānāṃ śatakratuḥ । pakṣāṃś ciccheda vajreṇa tataḥ śatasahasraśaḥ ॥124॥", "leonov_ru": "И вот разгневанный горами тысячеокий Индра Отрубил [им] крылья ваджрой сотнями тысяч.", "commentary": {"bhusana": "ततः क्रुद्धः सहस्राक्षः पर्वतानां शतक्रतुः ।\n\nपक्षांश्चिच्छेद वज्रेण तत्र तत्र सहस्रशुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.124:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна I. 49. 5: Вершитель ста жертвоприношений (śatakratu) — эпитет Индры (Шатакрату), подчеркивающий его могущество."}, {"id": "lexical:5.1.124:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "vajra", "note_ru": "Ваджра / перун Индры (vajra) — MW: vajra — «a thunderbolt (esp. the one used as a weapon by Indra); a diamond; hard, mighty». Ваджра — двойной символ: 1) метеоритное оружие Индры (громовой молот, ср. Norse Mjölnir); 2) алмаз (прочнейший из минералов). Этимология: vajra ← вероятно, от √vaj «быть твёрдым/сильным». В V.1.124 pakṣāṃś ciccheda vajreṇa — «[Индра] отсёк им крылья vajra». Ваджра-удар = лишение горы её первичной мобильности. Vajra как космологическое оружие устанавливает новый мировой порядок — неподвижность гор.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. vajra; Apte s.v. vajra; RV passim", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.125", "verse": "125", "sanskrit_iast": "sa mām upagataḥ kruddho vajram udyamya devarāṭ । tato 'haṃ sahasā kṣiptaḥ śvasanena mahātmanā ॥125॥", "leonov_ru": "Ко мне приблизился, разгневанный, подняв ваджру, владыка богов. Тогда я тут же сметен богом ветра, наделенным великим духом.", "commentary": {"tilaka": "क्षिप्त आकाशमुत्क्षिप्तः ।। 5.1.118,119 ।।\n\nतत उक्तकारणादेष संबन्धः पूजाप्रयोजकः स्वरक्षकपुत्रत्वरूपः\nमान्यस्य वायुसंबन्धात्तव पूज्यस्य मम प्रीतिं कुर्विति शेषः\nमन्युः पूजानङ्गीकारजं दैन्यम् ।। 5.1.123,124 ।।\n\nशैलमालभ्य स्पृष्ट्वा । प्रहसन्निवेति एतावत्प्लवने ऽपि श्रममारोप्य वृथा ऽयं प्रयास एतयोरिति प्रहासः", "siromani": "स इति । सः शातितपक्षो देवराट् क्रुद्धः सन् मामुपागतः प्राप्तः अत एव महात्मना श्वसनेन वायुना क्षिप्तः अत्यूर्ध्वं प्रापितः ततः इन्द्रगमनानन्तरम् अस्मिन् लवणतोये प्रक्षिप्तः अत एव तव पित्रा गुप्तः पक्षसमग्रो यस्य अत एव अभिरक्षितो ऽहमस्मीति शेषः । श्लोकद्वयमेकान्वयि ।। 5.1.120,121 ।।\n\nतत इति । ततः उक्तहेतोः त्वया सह मम एष संबन्धः अत एव महागुणस्त्वं मम मान्यो ऽसि अत एव त्वां मानयामि पूजयामि\nननु स्थित्यादि किमर्थं न क्रियते इत्यत आह त्वरत इति । मे कालः त्वरते मां त्वरयति यतः अहो दिनमतिवर्तते । एतेन दिन एव लङ्का गन्तव्येति सूचितम् । हेत्वन्तरमाह इह अस्मिन् अन्तरा सागरतरणमध्ये मया न स्थातव्यम् इति प्रतिज्ञा दत्ता कृता, वानरसमीपे इति शेषः", "bhusana": "स मामुपगतः क्रुद्धो वज्रमुद्यम्य देवराट् ।\n\nततो ऽहं सहसा क्षिप्तः श्वसनेन महात्मना"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.125:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна I. 18. 12: Ваджра (vajra) — оружие Индры, которым он сокрушал асуров.[Е. Костина] «mārutātmaja» Опущено"}, {"id": "crosstext:5.1.125:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "devarāṭ / vajram udyamya", "note_ru": "Майнака вспоминает, как «владыка богов (devarāṭ), разгневанный, подняв ваджру (vajram udyamya), приблизился ко мне» (V.1.125) — отсылка к мифу о подрезании Индрой крыльев гор. Титул devarāṭ «царь богов» — стандартное эпическое именование Индры; ср. Udyoga 5.18.4 «sa sametya mahendrāṇyā devarājaḥ śatakratuḥ / …pālayāmāsa devarāṭ» — «И царь богов (devarāṭ), совершитель ста жертвоприношений, стал охранять (миры)». Параллель закрепляет, что в V.1.125 действует именно Индра-вседержитель с его атрибутом-ваджрой, а Майнака — один из немногих уцелевших крылатых гор, спасённый Ваю. Свидетельство: уровень шлоки (мягкое).", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.1.125", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Udyogaparva 5.18.4", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.127", "verse": "127", "sanskrit_iast": "tato 'haṃ mānayāmi tvāṃ mānyo 'si mama mārute । tvayā mamaiṣa sambandhaḥ kapimukhya mahāguṇaḥ ॥127॥", "leonov_ru": "Потому я почитаю тебя, и заслуживаешь ты моего почтения, сын ветра! О вождь обезьян, наша связь наделена великими достоинствами!", "commentary": {"tilaka": "भूय ऊर्ध्वं ततो ऽपि बहूर्ध्वं तं गिरिमधःप्रदेशवर्तिनमवलोकयन्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.127:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «mārute» Опущено. Поскольку здесь важно, что он сын ветра, мне думается, это надо где-то отразить[Е. Костина] «hariśreṣṭha» Опущено"}]}, {"verse_id": "5.1.131", "verse": "131", "sanskrit_iast": "tvarate kāryakālo me ahaś cāpy ativartate । pratijñā ca mayā dattā na sthātavyam ihāntarā ॥131॥", "leonov_ru": "Но не терпит мое дело отлагательств, и день уже проходит. Дано мной обещание, не должно мне останавливаться здесь, на середине [пути]».", "commentary": {"tilaka": "कार्यविषक्तस्य मायामृगवधे प्रसक्तस्य । बद्धवैरस्य शूर्पणखाविरूपकरणादिकर्मणेति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.131:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Дал обещанье я (pratijñā ca mayā dattā) – как отмечают Голдмены, неясно, идет ли речь об обещании переправиться через океан за один день или же об обещании не останавливаться в дороге (см.: Goldman 1984: 318)."}, {"id": "lexical:5.1.131:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "pratijñā", "note_ru": "Клятва / обет (pratijñā) — MW: pratijñā — «admission, acknowledgment; promise, vow, assurance». Букв. «знание-перед» (prati «перед, навстречу» + jñā «знать»). В V.1.131 pratijñā ca mayā dattā — «клятва дана мной» (Хануман отказывается от отдыха, ссылаясь на своё обещание). В юридическо-этической системе эпоса pratijñā = юридически обязательный обет; её нарушение — грех. Отличие от śapatha (клятва-заклинание) и vrata (обет-воздержание): pratijñā — словесное публичное обязательство.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. pratijñā; Apte s.v. pratijñā", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.132", "verse": "132", "sanskrit_iast": "ity uktvā pāṇinā śailam ālabhya haripuṃgavaḥ । jagāmākāśam āviśya vīryavān prahasann iva ॥132॥", "leonov_ru": "Так сказав, оперся рукой на гору бык среди обезьян, Поднявшись в небо, полетел отважный, словно бы рассмеявшись.", "commentary": {"tilaka": "अवस्थितः जलान्तरमग्र इत्यर्थः । सागरं मैनाकाधिष्ठितसागरप्रदेशम्", "bhusana": "इत्युक्त्वा पाणिना शैलमालभ्य हरिपुङ्गवः ।\n\nजगामाकाशमाविश्य वीर्यवान् प्रहसन्निव\nइत्युक्त्वेति । प्रहसन्निव प्रसन्नमुख इवेत्यर्थः ।। 5.1.133,134।।\n\nअथोर्ध्वं दूरमुत्पत्य हित्वा शैलमहार्णवौ ।\n\nपितुः पन्थानमास्थाय जगाम विमले ऽम्बरे", "tattvadipika": "आलभ्य स्पृष्ट्वा । प्रहसन्निव प्रसन्नमुखस्सन् ।। 5.1.133,134 ।।\n\nपितुः पन्थानं वायुमार्गम् ।। 5.1.135,136 ।।\n\nतदिति । समुद्रलङ्घनं प्रथमं कर्म, द्वितीयं मैनाकगिरावविश्रम्य गमनम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.132:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…улыбаясь (prahasann iva) – букв. «словно бы смеясь». В комментарии «Бхушана» поясняется prasannamukhaḥ (с довольным/улыбающимся лицом). Также понимает это выражение и автор «Таттвадипики»."}]}, {"verse_id": "5.1.133", "verse": "133", "sanskrit_iast": "sa parvatasamudrābhyāṃ bahumānād avekṣitaḥ । pūjitaś copapannābhir āśīrbhir abhinanditaḥ ॥133॥", "leonov_ru": "Принятый с почетом горой и океаном, Почтенный подобающими благословениями, восхваленный,", "commentary": {"siromani": "पूजित इति । त्वयि पूजिते सति मारुतः पूजां प्राप्नोति तस्मात्त्वं पूजनीय एव । ननु मारुतपूजया तव किमित्यत आह-- अत्र मारुतपूजायां कारणं शृणु\nस इति । पर्वतसमुद्राभ्यां बहुमानात्पूजितः अवेक्षितः उपपन्नाभिः योग्याभिः आशीर्भिः अभिनन्दितश्च स हनुमान् दूरमूर्ध्वमाप्लुत्य अत एव शैलमहार्णवौ स्वसत्कारार्थमागतगिरिसागरौ हित्वा पितुर्वायोः पन्थानमासाद्य प्राप्य । अथ जगाम मङ्गलगमनं चकार । श्लोकद्वयमेकान्वयि ।। 5.1.128,129 ।।\n\nभूय इति । भूयो ऽधिकाम् ऊर्ध्वगतिं प्राप्य गिरिं तं नराकृतिसमुद्रं च अवलोकयन् निरालम्बः वायुसूनुर्जगाम", "bhusana": "स पर्वतसमुद्राभ्यां बहुमानादवेक्षितः ।\n\nपूजितश्चोपपन्नाभिराशीर्भिरनिलात्मजः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.133:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "можно комм. о роли благословения (и проклятия) в инд. мифологии"}]}, {"verse_id": "5.1.134", "verse": "134", "sanskrit_iast": "athordhvaṃ dūram āgatya hitvā śailamahārṇavau । pituḥ panthānam āsādya jagāma vimale 'mbare ॥134॥", "leonov_ru": "Тогда, выше и дальше взлетев, оставив [позади] гору и океан, Достигнув пути своего отца, полетел он в чистом небе.", "commentary": {"tilaka": "दूरान्मार्गमालोकयन्, अत एवोर्ध्वप्रणिहितेक्षणः । हृदये प्राणप्रतिष्ठास्थाने\nअथोर्ध्वं यत्र देशे स्थितस्ततो ऽपि बहूर्ध्वम् । पितुः पन्थानं वायुमार्गम्", "bhusana": "अथेति । हित्वा शैलमहार्णवौ मूर्तिमन्तौ तौ हित्वेत्यर्थः । अनेन शैलवत्समुद्रो ऽपि मूर्तिमत्तया तत्रादृश्यतेति सूचितम् ।। 5.1.135,136।।\n\nतद् द्वितीयं हनुमतो दृष्ट्वा कर्म सुदुष्करम् ।\n\nप्रशशंसुः सुराः सर्वे सिद्धाश्च परमर्षयः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.134:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Оставив Океан и гору (hitvā śailamahārṇavau) – автор «Бхушаны» видит здесь указание на то, что Океан, как и Майнака, принял человеческий облик.Достигнув пути отца (pituḥ panthānam āsādya) – то есть Ветра."}]}, {"verse_id": "5.1.135", "verse": "135", "sanskrit_iast": "bhūyaś cordhvaṃ gatiṃ prāpya giriṃ tam avalokayan । vāyusūnur nirālambo jagāma kapikuñjaraḥ ॥135॥", "leonov_ru": "Поднявшись еще выше, оглядывая ту гору Сын ветра, не имеющий опоры, полетел слон среди обезьян.", "commentary": {"bhusana": "भूयश्चोर्ध्वगतिं प्राप्य गिरिं तमवलोकयन् ।\n\nवायुसूनुर्निरालम्बे जगाम विमले ऽम्परे", "siromani": "अभयप्रदाने हेतुमाह-- साह्यमिति । निर्भयस्य सुग्रीवादन्यतो भयरहितस्य वानरसमूहस्य भये सुग्रीवाद्भीतौ प्राप्तौ सति योजनशतं क्रमतो गच्छतो विश्रान्तस्य श्रमाभाववतो हनूमतः साह्यं त्वया कृतम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.135:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Сын ветра понесся дальше, / Не имя опоры (vāyusūnur nirālambo jagāma kapikuñjaraḥ) – в критическом издании две последние строки выглядят как vāyusūnur nirālambe jagāma vimale 'mbare, то есть «сын ветра полетел в чистом небе, не имеющем опоры» ((см.: Jhala 1966: 24).[Claude.AI — желательно] [термин] (учтено) Первое появление в кн. V; введено в Рамаяна I. 3. 33: Сын Ваю (vāyu-sūnu) — патроним Ханумана, который был сыном бога Ваю. ...о похищении меда (madhūnām haraṇam)..."}]}, {"verse_id": "5.1.136", "verse": "136", "sanskrit_iast": "tad dvitīyaṃ hanumato dṛṣṭvā karma suduṣkaram । praśaśaṃsuḥ surāḥ sarve siddhāś ca paramarṣayaḥ ॥136॥", "leonov_ru": "Увидев, что Хануман исполнил второе трудное дело, Восславили [его] боги все, сиддхи и высшие риши.", "commentary": {"tilaka": "तद्द्वितीयं कर्माविश्रम्यैव पुनरत्यूर्ध्वं पतनरूपं कर्म", "siromani": "तदिति । सुदुष्करम् अन्यैः कर्तुमशक्यं द्वितीयम् । उत्प्लवनापेक्षया द्वित्वसंख्यापूरकं विश्रान्त्यकरणरूपं कर्म दृष्ट्वा सुरादयः प्रशशंसुः\nतद्वचनाकारमाह-- हिरण्येति । हे शैलेन्द्र अहं परितुष्टो ऽस्मि अतः ते तुभ्यम् अभयं मत्कर्तृकपक्षच्छेदशङ्काहेतुकभयाभावं प्रयच्छामि ददामि अतः यथासुखं गच्छ विचर", "bhusana": "तद्द्वितीयमिति । द्वितीयं समुद्रलङ्घनापेक्षया द्वितीयं तत्पर्वतजयरूपं कर्म । 5.1.137140 ।।\n\nसाह्यं कृतं ते सुमहद्विक्रान्तस्य हनूमतः ।\n\nक्रमतो योजनशतं निर्भयस्य भये सति"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.136:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций"}]}, {"verse_id": "5.1.137", "verse": "137", "sanskrit_iast": "devatāś cābhavan hṛṣṭās tatrasthās tasya karmaṇā । kāñcanasya sunābhasya sahasrākṣaś ca vāsavaḥ ॥137॥", "leonov_ru": "Радовались божества, находящиеся там, делу Той [горы] с золотой превосходной серединой, и Тысячеглазый Индра Васава.", "commentary": {"tilaka": "तत्रस्था मैनाकस्था गणनस्था वा । तस्य काञ्चनस्य काञ्चनमयस्य सुनाभस्य शोभनमध्यस्य मैनाकस्य कर्मणा जलादुत्थानरूपेण देवता इन्द्रश्च तुष्टः ।। 5.1.130,131 ।।\n\nअभयं स्वकृतपक्षच्छेदशङ्काजनितभयाभावम्", "siromani": "देवता इति । सुनाभस्य अतिशोभनमध्यभागस्य तस्य मैनाकस्य कर्मणा विश्रान्तदानप्रार्थनादिरूपक्रियया तत्रस्थाः हनुमत्कर्मदर्शनाय तत्र स्थिताः देवता वासवश्च हृष्टा अभवन्\nस इति । स मैनाकः परितुष्टं शतक्रतुं दृष्ट्वा विपुलं तत्प्रहर्षमलभत्", "bhusana": "देवताश्चाभवन् हृष्टास्तत्रस्तास्तस्य कर्मणा ।\n\nकाञ्चनस्य सुनाभस्य सहस्राक्षश्च वासवः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.137:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Тому, что совершила / Гора с золотой вершиной (tasya karmaṇā kāñcanasya sunābhasya) – в «Тилаке» поясняется: тому, что Майнака поднялась из воды. Автор «Широмани» поясняет иначе: тому, что Майнака предложила Хануману отдохнуть.[Claude.AI — желательно] ? [кат.1 — буквальный перевод] hiraṇyanābha — букв. «с золотым пупом»"}]}, {"verse_id": "5.1.139", "verse": "139", "sanskrit_iast": "hiraṇyanābha śailendra parituṣṭo 'smi te bhṛśam । abhayaṃ te prayacchāmi tiṣṭha saumya yathāsukham ॥139॥", "leonov_ru": "«О владыка гор с золотой серединой! Весьма доволен я тобой. Дарую тебе отсутствие страха. Пребывай, господин, как ты того пожелаешь!", "commentary": {"bhusana": "हिरण्यनाभ शैलेन्द्र परितुष्टो ऽस्मि ते भृशम् ।\n\nअभयं ते प्रयच्छामि तिष्ठ सौम्य यथासुखम्"}, "has_tier1": false, "notes": [{"id": "crosstext:5.1.139:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "abhaya", "note_ru": "abhaya-dāna («дарование безопасности»). Гора Майнака получает от [Океана/Индры] формулу abhayaṃ te prayacchāmi «дарую тебе бесстрашие» (V.1.139). Это ритуально-этическая формула, чей развёрнутый локус — Шантипарва, где abhaya всем существам есть высший дар отшельника и условие его собственной неуязвимости: «yasmān nodvijate bhūtaṃ jātu kiñcit kathañcana । abhayaṃ sarvabhūtebhyaḥ sa prāpnoti sadā mune» (MBh XII.254.25) — «Кого никакое существо никогда и ничем не страшится, тот, о мудрец, обретает [сам] бесстрашие от всех существ». Параллель показывает, что эпизодическая формула Сундараканды восходит к общеиндийской идеологии abhaya-dāna.", "type": "Б", "cluster": "mbh_gnomic", "cluster_label": "МБх дидактика (Шантипарва / Анушасанапарва)", "shloka_ref": "V.1.139", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Śāntiparvan (MBh XII) 12.254.25", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.140", "verse": "140", "sanskrit_iast": "sāhyaṃ kṛtaṃ te sumahad vikrāntasya hanūmataḥ । kramato yojanaśataṃ nirbhayasya bhaye sati ॥140॥", "leonov_ru": "Великую помощь оказала ты отважному Хануману, Летящему на сотню йоджан, бесстрашному, невзирая на опасность.", "commentary": {"tilaka": "अथ देवैर्लङ्कां प्रविष्टस्य हनुमतः कार्यक्षमबलपरीक्षणार्थं सरसाप्रवर्तनम्-- त इत्यादि ।। 5.1.137,138 ।।\n\nनभःस्पृशमिति पुंस्त्वमार्षम् । वक्रशब्दो ऽर्धर्चादिर्वा"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.140:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Неутомимому Хануману (viśrāntasya hanūmataḥ) – автор «Широмани» поясняет здесь viśrānta как «тот, у кого отсутствует усталость» (śramābhāvavat).Который, презрев опасность (nirbhayasya bhaye sati) – слово bhaya может иметь значение и «опасность», и «страх». В «Широмани» поясняется, что речь идет о страхе перед Сугривой. Автор «Таттвадипики» считает, что речь идет о страхе Майнаки перед Индрой, и тогда фразу следует понимать как «бесстрашного, не смотря на [твой] страх». В «Бхушане» утверждается, что речь идет об опасности перелета через океан."}]}, {"verse_id": "5.1.141", "verse": "141", "sanskrit_iast": "rāmasyaiṣa hitāyaiva yāti dāśaratheḥ kapiḥ । satkriyāṃ kurvatā śaktyā toṣito 'smi dṛḍhaṃ tvayā ॥141॥", "leonov_ru": "На помощь Раме, сыну Дашаратхи, летит обезьяна. Весьма доволен я тобой, сумевшей оказать ей гостеприимство».", "commentary": {"bhusana": "कुर्विति । कार्यं प्रयोजनं विश्रान्त्यादि । कर्तव्यं कार्यमकृतं सतां मन्युं कोपम् उदारयेत् प्रेरयेत् उत्पादयेत् ।। 5.1.98,99।।\n\nचामीकरमहानाभ देवगन्धर्वसेवित ।\n\nहनुमांस्त्वयि विश्रान्तस्ततश्शेषं गमिष्यति ।।\n\n[स एष कपिशार्दूलस्त्वामुपर्येति वीर्यवान्]\nचामीकरोति । चमीकरमहानाभ स्वर्णमयमहाशृङ्ग\nरामस्यैष ह दूत्येन याति दाशरथेर्हरिः ।\n\nसत्क्रियां कुर्वतां तस्य तोषितो ऽस्मि दृढं त्वया", "siromani": "रामस्येति । यः कपिः रामस्य हितायैव याति तस्य सत्क्रियां शक्त्या कुर्वता त्वया दृढमत्यन्तं तोषितो ऽस्मि", "tilaka": "रामसाह्यकरणे हेतुः रामस्य विषयवासिनीति । तस्य सर्वाधिपतित्वात्"}, "has_tier1": false, "notes": [{"id": "crosstext:5.1.141:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dāśarathi (Rāma)", "note_ru": "Хануман назван капи, летящим dāśaratheḥ hitāya — «на благо Дашаратхи (= Рамы)». Эпитет dāśarathi неоднократно появляется в Рагхувамше в контексте именно Ланкийской войны (sarga 12–13): Raghu 12.44 — udāyudhān āpatatas tān dṛptān prekṣya rāghavaḥ … eko dāśarathī rāmo («один Дашаратхи Рама») и Raghu 12.76–79 — garuḍāpātaviśliṣṭa- -meghanādāstrabandhanaḥ dāśarathyoḥ kṣaṇakleśaḥ («короткая мука обоих Дашаратхов»). Кālidāса сохраняет dāśarathi как маркер родовой идентичности Рамы именно в батальном контексте, делая его эпическим «позывным» Рамы-воителя. Raghu 12–15 (Lankādahana-sarga) — прямая кāвья-обработка Сундараканды и Юддхаканды.", "type": "А", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.1.141", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Kālidāsa, Raghuvaṃśa 12.44; 12.76–79", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.141:1", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "satkriyā", "note_ru": "Похвала Сурасы Хануману «доволен я тобой, сумевшей оказать ему гостеприимство (satkriyā)» (V.1.141) использует satkriyā в техническом значении ритуального приёма-почитания. Ср. Āraṇyaka 3.182.10, где Хайхаи говорят отшельнику: «na vayaṃ satkriyāṃ mune tvatto'rhāḥ karmadoṣeṇa» — «Мы недостойны, мудрец, твоего гостеприимства (satkriyā): грех на нас». Один и тот же термин satkriyā связывает эпизод испытания Ханумана Сурасой с общеэпической этикой почётного приёма. Свидетельство: уровень шлоки (мягкое).", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.1.141", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparva 3.182.10", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.143", "verse": "143", "sanskrit_iast": "sa vai dattavaraḥ śailo babhūvāvasthitas tadā । hanūmāṃś ca muhūrtena vyaticakrāma sāgaram ॥143॥", "leonov_ru": "Та гора, которой была оказана милость, вернулась на свое место (скрылась в волнах океана), А Хануман мигом полетел дальше через океан.", "commentary": {"bhusana": "स वै दत्तवरः शैलो बभूवावस्थितस्तदा ।\n\nहनुमांश्च मुहूर्तेन व्यतिचक्राम सागरम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.143:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «muhūrtena» Опущено"}, {"id": "tier1:5.1.143:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Скрылась гора под водою (śailo babhūvāvasthitas tadā) – в «Тилаке» поясняется, что слово avasthitaḥ (установленный) следует понимать в том смысле, что Майнака снова погрузилась в океан (jalāntaramagnaḥ)."}]}, {"verse_id": "5.1.144", "verse": "144", "sanskrit_iast": "tato devāḥ sagandharvāḥ siddhāś ca paramarṣayaḥ । abruvan sūryasaṃkāśāṃ surasāṃ nāgamātaram ॥144॥", "leonov_ru": "Тогда боги с гандхарвами, сиддхи и высшие риши Сказали солнцеподобной Сурасе, матери нагов:", "commentary": {"bhusana": "ततो देवाः सगन्धर्वाः सिद्धाश्च परमर्षयः ।\n\nअब्रुवन् सूर्यसङ्काशां सुरसां नागमातरम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.144:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм."}, {"id": "lexical:5.1.144:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "nāgamātā", "note_ru": "Мать нагов (nāgamātā) — букв. «мать (mātā) нагов (nāga)». В V.1.144 sūryasaṃkāśāṃ surasāṃ nāgamātaram — «Суrasу, сияющую как солнце, мать нагов». Суraса — не просто «мать» биологическая, а мифологический архетип «матери-прародительницы нагов»; её рождение связывается с Кашьяпой и Кадру (матерью нагов) или непосредственно с Брахмой. Nāgamātā как эпитет маркирует её контроль над всем племенем водных змей. В подстрочнике «мать нагов» — точно; следует отметить её отличие от Кадру.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. surasā; Apte s.v. nāgamātar; Bhāgavatapurāṇa VI", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.144:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "surasā", "note_ru": "Сураса, «мать нагов» (nāgamātar). Прежде чем боги испытывают Ханумана, выслав ему навстречу Сурасу (V.1.144 «surasāṃ nāgamātaram»), кн. III даёт её родословную в каталоге дочерей Дакши: «surasā ajanayan nāgān rāma kadrūś ca pannagān» (Rām. III.14.28) — «Сураса родила нагов, а Кадру родила змей». Параллель освещает, почему именно Сураса — «мать нагов» — выступает морской преградой: она мифологически связана с глубинами и змеиным потомством. Locus classicus её генеалогии — кн. III; подстрочник V.1.144 передаёт эпитет без этого фона.", "type": "Б", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.1.144", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Araṇyakāṇḍa (Rām. III) 14.28", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.147", "verse": "147", "sanskrit_iast": "daṃṣṭrākarāla - having terrible tusks । balam icchāmahe jñātuṃ bhūyaś cāsya parākramam । tvāṃ vijeṣyaty upāyena viṣadaṃ vā gamiṣyati ॥147॥", "leonov_ru": "Хотим мы узнать его силу и отвагу. Победит он тебя каким-либо способом или улетит в отчаянии?", "commentary": {"tilaka": "बलं ज्ञानबलमुपायबलं च पराक्रमं च ज्ञातुमिच्छामहे । तदेव विवृणोति-- त्वामिति ।। 5.1.140,141 ।।\n\n\"भयस्य च भयावहम्\" इति पाठे सर्वलोकभयस्यापीत्यर्थः", "bhusana": "बलमिच्छामहे ज्ञातुं भूयश्चास्य पराक्रमम् ।\n\nत्वां विजेष्यत्युपायेन विषादं वा गमिष्यति"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.147:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «bhūyaś» Опущено[Е. Костина] «upāyena» Опущено[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций"}]}, {"verse_id": "5.1.150", "verse": "150", "sanskrit_iast": "mama bhakṣyaḥ pradiṣṭas tvam īśvarair vānararṣabha । ahaṃ tvāṃ bhakṣayiṣyāmi praviśedaṃ mamānanam ॥150॥", "leonov_ru": "«Ты – пища, предназначенная мне богами, о бык среди обезьян. Я тебя съем, влетай в мою пасть.", "commentary": {"tilaka": "ईश्वरैर्देवैः\nकश्चिदपि मां नातिवर्तेत् अभक्षितो न गच्छेदित्यर्थः परस्मैपदमार्षम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.150:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Бык среди обезьян, / Ты мне уготован богами (mama bhakṣyaḥ pradiṣṭas tvam īśvarair vānararṣabha) – букв. «ты – моя пища, предназначенная богами, бык среди обезьян». В «Тилаке» слово īśvaraiḥ (букв. «владыками») поясняется как devaiḥ «богами»."}]}, {"verse_id": "5.1.151", "verse": "151", "sanskrit_iast": "vara eṣa purā datto mama dhātreti satvarā । vyādāya vaktraṃ vipulaṃ sthitā sā māruteḥ puraḥ ॥151॥", "leonov_ru": "Дар этот некогда был дан мне Творцом», - и быстро Распахнув широкую пасть, встала она перед сыном ветра.", "commentary": {"tilaka": "एष वरः पुर आगतस्य वदनप्रवेशरूपः इत्युक्त्वेति शेषः । सत्वरा त्वरासहिता सा सुरसा\nतं प्रयान्तं पुनरागच्छामीत्युक्त्या वरदानं श्रुत्वा ऽपि प्रयाणोन्मुखम् । हनुमतस्तस्य बलं जिज्ञासमाना सुरसा वाक्यमब्रवीत्", "bhusana": "मम भक्ष्यः(क्षः) प्रदिष्टस्त्वमीश्वरैर्वानरर्षभ ।\n\nअहं त्वां भक्षयिष्यामि प्रविशेदं ममाननम्"}, "has_tier1": false, "notes": [{"id": "edition:5.1.151:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлока 5.1.151 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.1.151", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.151", "iast": "vara eṣa purā datto mama dhātreti satvarā । vyādāya vaktraṃ vipulaṃ sthitā sā māruteḥ puraḥ ॥151॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.152", "verse": "152", "sanskrit_iast": "evam uktaḥ surasayā prahṛṣṭavadato 'bravīt । rāmo dāśarathir nāma praviṣṭo daṇḍakāvanam । lakṣmaṇena saha bhrātrā vaidehyā cāpi bhāryayā ॥152॥", "leonov_ru": "[Хануман], которому так было сказано Сурасой, с радостью на лице сказал: «Рама, известный как Дашаратхи, вошел в лес Дандаку С братом Лакшманой и женой Вайдехи.", "commentary": {"bhusana": "रामो दाशरथिर्नाम प्रविष्टो दण्डकावनम् ।\n\nलक्ष्मणेन सह भ्रात्रा वैदेह्या चापि भार्यया\nएवमुक्तः सुरसया प्राञ्जलिर्वानरर्षभः ।\n\nप्रहृष्टवदनः श्रीमानिदं वचनमब्रवीत्", "tilaka": "\"चकार सुरसा ऽप्यास्यं विंशद्योजनमायतम्\" इत्यनन्तरम् \"तद्ष्ट्वा व्यादितं त्वास्यम्\" इति पाचिनः पाठः । अत्र \"तद्दृष्ट्वा मेघसङ्काशं विंशद्योजनमायतम् । हनुमांस्तु ततः क्रुद्धस्त्रिंशद्योजनमायतः ।। चकार सुरसा वक्त्रं चत्वारिंशत्तथोच्छ्रितम् । बभूव हनुमान्वीरः पञ्चाशद्योजनोच्छ्रितः ।। चकार सुरसा वक्त्रं षष्टियोजनमुच्छ्रितम् । तदैव हनुमान्वीरः सप्ततिं योजनोच्छ्रितः ।। चकार सुरसा वक्त्रमशीतियोजनोच्छ्रितम् । हनुमाननलप्रख्यो नवातिं योजनोच्छ्रितः ।। चकार सुरसा वक्त्रं शतयोजनमायतम् ।।\" इति श्लोकास्तु प्रक्षिप्ता इति कतकः", "siromani": "एवमिति । हनुमता एवमुक्ता सुरसा मां कश्चित् नातिवर्तेत एषः मम वरः ब्रह्मणा दत्त इति शेषः । एतेन त्वां भक्षयिष्याम्येवेति सूचितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.152:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Весел лицом, ответил (prahṛṣṭavadano ‘bravīt) – в «Тилаке» отмечается, что радость Ханумана происходит от того, что он знает, каким образом спастись от Сурасы (nistāropāyajñānajo harṣaḥ).Комм.[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна I. 2. 34: Царевна Видехи (vaidehī) — то есть Сита, дочь царя Видехи Джанаки."}, {"id": "lexical:5.1.152:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dāśarathi", "note_ru": "Сын Дашаратхи (dāśarathi) — патроним Рамы (сын царя Дашаратхи). см. примеч. к I.1.8 (Гринцер).", "type": "А", "subtype": "base", "trigger": "crossref", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "collision_tier1": true}, {"id": "lexical:5.1.152:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dāśarathi", "note_ru": "Сын Дашаратхи (dāśarathi). [Е. Костина]: именной эпитет «dāśarathi» присутствует в оригинале, но не передан отдельным словом в подстрочнике («…[Хануман], которому так было сказано Сурасой, с радостью на…»). В литературном тексте эпитет восстанавливается; отметить как незафиксированное опущение — на усмотрение редактора.", "type": "Б", "subtype": "base", "trigger": "omission", "source": "parallel-text divergence (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.153", "verse": "153", "sanskrit_iast": "anyakāryaviṣaktasya baddhavairasya rākṣasaiḥ । tasya sītā hṛtā bhāryā rāvaṇena yaśasvinī ॥153॥", "leonov_ru": "Пока он был занят иным делом, у него, связанного враждой с ракшасами, Жена Сита славная была похищена Раваной.", "commentary": {"siromani": "तस्या इति । तस्याः सीतायाः सकाशं समीपमहं गमिष्ये अतः रामस्य विषये देशे वस्तुं शीलमस्याः सा त्वं रामस्य साह्यं साहाय्यं कर्तुमर्हसि । एतेन मां न भक्षयेति सूचितम्", "bhusana": "अन्यकार्यविषक्तस्य बद्धवैरस्य राक्षसैः ।\n\nतस्य सीता हृता भार्या रावणेन यशस्विनी\nअन्येति । अन्यकार्यविषक्तस्य मारीचमृगग्रहणव्यासक्तस्य"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.153:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Однажды отвлекся он (asya kāryaviṣaktasya) – букв. «у него, занятого [другим] делом». В ряде рукописей приводится вариант anyakāryaviṣaktasya (у занятого другим делом). В «Тилаке» поясняется, что речь идет об охоте на волшебного оленя (māyāmṛga), которым обернулся Марича.[Е. Костина] «yaśasvinī» Опущено"}]}, {"verse_id": "5.1.154", "verse": "154", "sanskrit_iast": "tasyāḥ sakāśaṃ dūto 'haṃ gamiṣye rāmaśāsanāt । kartum arhasi rāmasya sāhyaṃ viṣayavāsini ॥154॥", "leonov_ru": "К ней лечу я посланником по приказу Рамы. Ты должна оказать помощь Раме, живущая в [его] царстве.", "commentary": {"bhusana": "तस्याः सकाशं दूतो ऽहं गमिष्ये रामशासनात् ।\n\nकर्तुमर्हसि रामस्य साह्यं विषयवासिनी\nतस्या इति । विषयवासिनी रामराज्यवासिनी ।। 5.1.155,156।।\n\nएवमुक्ता हनुमता सुरसा कामरूपिणी ।\n\nअब्रवीन्नातिवर्तेन्मां कश्चिदेष वरो मम\nएवमिति । नातिवर्तेन्मां ममाननमप्रविश्य न गच्छेत् । अतिवर्तेदित्यत्र परस्मैपदमार्षम् । अत्र इतिकरणं द्रष्टव्यम् । अब्रवीन्नातिवर्तेन्मां कश्चिदेषवरो ममेत्यस्यानन्तरं तद्दृष्ट्वा व्यादितं वक्त्रं वायुपुत्रः सुबुद्धिमानित्यादिश्लोका द्रष्टव्याः । मध्ये तं प्रयान्तमित्यादयः केचन श्लोकाः प्रक्षिप्ताः असङ्गताश्च, शतयोजनायतत्वे वानरैर्लङ्कावासिभिश्च ज्ञातः स्यादिति विरोधात् । त इमे प्रत्रिप्तश्लोकाः :\"तं प्रयान्तं समुद्वीक्ष्य सुरसा वाक्यमब्रवीत् । बलं जिज्ञासमाना वै नागमाता हनूमतः । प्रविश्य वदनं मे ऽद्य गन्तव्यं वानरोत्तम । वर एष पुरा दत्तो मम धात्रेति सत्वरा । व्यादाय विपुलं वक्त्रं स्थिता सा मारुतेः पुरः । एवमुक्तः सरसया क्रुद्धो वारपुङ्गवः । अब्रवीत्कुरु वै वक्त्रं येन मां विषहिष्यसे । इत्युक्त्वा सरसां क्रुद्धो दशयोजनमायतः । दशयोजनविस्तारो बभूव हनुमांस्तदा । तं दृष्ट्वा मेघसंकाशं दशयोजनमायतम् । चकार सुरसा चास्यं विशद्योजनमायत् । हनूमांस्तु ततः क्रुद्धस्त्रिंशद्योजमायतः । चकार सुरसा वक्त्रं चत्वारिशत्तथोच्छ्रितम् । बभूव हनुमान्वीरः पञ्चाशद्योजनोच्छ्रितः । चकार सुरसा वक्त्रं षष्टियोजनमायतम् । तथैव हनुमान्वीरस्सप्ततीयोजनोच्छ्रितः । चकार सुरसा वक्त्रमशीतीयोजनोच्छ्रितम् । हनुमानचलप्रख्यो नवतीयोजनोच्छ्रितः । चकार सुरसा वक्त्रं शतयोजनामायतम्\" इति", "tattvadipika": "विषयवासिनि रामराज्यवासिनि  त्रैलोक्यनाथत्वाद्रधुनाथस्येति भावः ।। 5.1.155,156 ।।\n\nएवमिति । कश्चिदपि जनः नातिवर्तेत, मामिति शेषः । नातिवर्तेन्माम् इत्यपि पाठः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.154:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Ты в царстве его живешь (viṣayavāsini) – букв. «о живущая в стране». Комментаторы отмечают, что речь идет о власти Рамы над всем миром (в «Тилаке»: tasya sarvādhipatitvāt – из-за его всевластия).И помочь должна ему (kartum arhasi rāmasya sāhyam) – в комментарии «Широмани» поясняется, что помощь состоит в том, чтобы не есть Ханумана."}, {"id": "phase2:5.1.154:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": false, "status": "принято: Леонов (2026-07-11)", "mg_comment": "", "lemma_iast": "viṣayavāsini", "note_ru": "В «Бхушане» приводится и тут же отвергается как позднейшая вставка, со ссылкой на комментатора Катаку, весь эпизод постепенного расширения пасти Сурасы с десяти до ста йоджан: композиция признаётся противоречивой, поскольку при пасти в сто йоджан ванары и ракшасы Ланки не могли бы не заметить происходящего.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "фиксирует текстологическое суждение традиции (Бхушана со ссылкой на Катаку) о позднейшей интерполяции всего эпизода нарастающей пасти Сурасы — ровно то место, которое Леонов/Костина отдельно пометили как требующее уточнения (см. их помету к V.1.166 «возможны расхождения редакций»), но не раскрыли.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.155", "verse": "155", "sanskrit_iast": "atha vā maithilīṃ dṛṣṭvā rāmaṃ cākliṣṭakāriṇam । āgamiṣyāmi te vaktraṃ satyaṃ pratiśṛṇomi te ॥155॥", "leonov_ru": "Иначе, повидав Майтхили и Раму, неутомимого в деяниях, Войду я в твою пасть, истинно тебе обещаю».", "commentary": {"tilaka": "रामं चेति । दृष्ट्वा वृत्तान्तं च विज्ञाप्येति शेषः", "siromani": "पक्षान्तरमाह अथवेति । अथवा भक्षणस्यावश्यकत्वे मैथिलीं रामं च दृष्ट्वा ते वक्रमागमिष्यामि इति ते तवाग्रे सत्यं प्रतिशृणोमि प्रतिजानामि", "bhusana": "अथवा मैथिलीं दृष्ट्वा रामं चाक्लिष्टकारिणम् ।\n\nआगमिष्यामि ते वक्त्रं सत्यं प्रतिशृणोमि ते"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.155:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Дай хотя б отыскать мне Майтхили и Раме о том поведать (atha vā maithilīṃ dṛṣṭvā rāmaṃ cākliṣṭakāriṇam) – букв. «Или повидав Майтхили и Раму, неутомимого в деяниях».[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна I. 27. 19: Сатья (satya) — «истинная». Майямая (māyā-maya) — «создающая иллюзию», «околдовывающая». Теджаспрабха (tejaḥ-prabha) — «сияющее блеском».[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}, {"id": "crosstext:5.1.155:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "hanumant mad vā", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.1.155", "work_label": "Rām", "verse_address": "Rām 5.56.26–27 (крит. изд.)", "parallel_sa_iast": "atha maithilīṁ dṛṣṭvā rāmaṁ cākliṣṭakāriṇam |āgamiṣyāmi te vaktraṁ satyaṁ pratiśṛṇoti me ||", "sundara_sa_iast": "atha vā maithilīṁ dṛṣṭvā rāmaṁ cākliṣṭakāriṇam |āgamiṣyāmi te vaktraṁ satyaṁ pratiśṛṇomi te ||", "quality": "PARTLY", "source": "DCS parallel-search (PARTLY); Rām 5.56.26–27 (крит. изд.)", "edition_flag": "vulgate", "shloka_critical": "V.1.141", "verse_address_vulgate": "", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.156", "verse": "156", "sanskrit_iast": "evam uktā hanumatā surasā kāmarūpiṇī । abravīn nātivarten māṃ kaś cid eṣa varo mama ॥156॥", "leonov_ru": "Сураса, которой так было сказано Хануманом, меняющая облик по собственной воле, Сказала: «Никто не может меня миновать, такой у меня дар».", "commentary": {"siromani": "एवमिति । सुरसया एवमुक्तः वानरपुङ्गवो हनुमान् येन यादृशेन मां विसहिष्यसि ग्रसिष्यसि तादृशं वक्त्रं कुरु इत्यब्रवीत् । अर्धद्वयमेकान्वयि"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.156:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "kāmarūpiṇī", "note_ru": "Принимающая любой облик (kāmarūpiṇī) — букв. «имеющая форму по желанию» (kāma «желание» + rūpin «имеющий форму», ж.р. -iṇī). MW: kāmarūpin — «one who can assume any form at will». В V.1.156 surasā kāmarūpiṇī — Сураса может принимать любой облик: именно это свойство позволяет ей бесконечно растягивать пасть. KāmarūpiṆī — технический термин для класса существ с этой способностью (ракшасы, апсары, некоторые наги). Противопоставлен svabhāvarūpin «имеющий природный облик» — то, чем является Хануман, пока не сжался.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. kāmarūpin; Apte s.v. kāmarūpin", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.157", "verse": "157", "sanskrit_iast": "taṃ prayāntaṃ samudvīkṣya surasā vākyam abravīt । balaṃ jijñāsamānā vai nāgamātā hanūmataḥ ॥157॥", "leonov_ru": "На того улетающего Ханумана глядя, Сураса сказала, Матерь нагов, желающая узнать его силу:", "commentary": {"siromani": "तमिति । प्रयान्तं हनूमन्तं समुद्वीक्ष्य हनूमतो बलं जिज्ञासमाना सुरसा अब्रवीत्", "bhusana": "[तं प्रयान्तं समुद्वीक्ष्य सुरसा वाक्यमब्रवीत् ।\n\nबलं जिज्ञासमाना वै नागमाता हनूमतः ।।1 ।।\n\nप्रविश्य वदनं मे ऽद्य गन्तव्यं वानरोत्तम ।\n\nवर एष पुरा दत्तो मम धात्रेति सत्वरा ।।2 ।।\n\nव्यादाय वक्त्रं विपुलं स्थिता सा मारुतेः पुरः ।\n\nएवमुक्तः सुरसया क्रुद्धो वानरपुङ्गवः ।।3।।\n\nअब्रवीत् कुरु वै वक्त्रं येन मां विषहिष्यसे ।\n\nइत्युक्त्वा सुरसां क्रुद्धो दशयोजनमायतः ।। 5।।\n\nदशयोजनविस्तारो बभूव हनुमांस्तदा ।\n\nतं दृष्ट्वा मेघसङ्काशं दशयोजनमायतम् ।।5।।\n\nचकार सुरसा चास्यं विंशद्योजनमायतम् ।\n\nतां दृष्ट्वा विस्तृतास्यां तु वायुपुत्रः सुबुद्धिमान् ।।6।।\n\nहनूमांस्तु ततः क्रुद्धस्त्रिंशद्योजमायतः ।\n\nचकार सुरसा वक्त्रं चत्वारिंशत्तथोच्छ्रितम् ।।7।।\n\nबभूव हनुमान् वीरः पञ्चाशद्योजनोच्छ्रितः ।\n\nचकार सुरसा वक्त्रं षष्टियोनमायतम् ।।8।।\n\nतथैव हनुमान् वीरः सप्ततीयोजनोच्छ्रितः ।\n\nचकार सुरसा वक्त्रमशीतीयोजनायतम् ।।9।।\n\nहनुमानचलप्रख्यो नवतीयोजनोच्छ्रितः ।\n\nचकार सुरसा वक्त्रं शतयोजनमायतम् ।।10।।]\n\nतद्दृष्ट्वा व्यादितं त्वास्यं वायुपुत्रः सुबुद्धिमान् ।\n\n[दीर्घजिह्वं सुरसया सुघोरं नरकोपमम् ।]\n\nसुसंक्षिप्यात्मनः कायं बभूवाङ्गुष्ठमात्रकः"}, "has_tier1": false, "notes": [{"id": "edition:5.1.157:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлоки 5.1.157–158 (2 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.1.157–158", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.157", "iast": "taṃ prayāntaṃ samudvīkṣya surasā vākyam abravīt । balaṃ jijñāsamānā vai nāgamātā hanūmataḥ ॥157॥"}, {"verse_id": "5.1.158", "iast": "niviśya vadanaṃ me 'dya gantavyaṃ vānarottama । vara eṣa purā datto mama dhātreti satvarā ॥158॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.166", "verse": "166", "sanskrit_iast": "tad dṛṣṭvā vyāditaṃ tv āsyaṃ vāyuputraḥ sa buddhimān । dīrghajihvaṃ surasayā subhīmaṃ narakopamam ॥166॥", "leonov_ru": "Мудрый сын ветра, увидев распахнутую пасть Сурасы, С длинным языком, весьма страшную, подобную Нараке,", "commentary": {"siromani": "तद्वचनाकारमाह प्रविष्ट इति । हे दाक्षायणि ते वक्त्रमहं प्रविष्टो ऽस्मि अतः तव वरः सत्य आसीत् अतः यत्र वैदेही तत्र गमिष्ये ते नमो ऽस्तु\nतद्वचनाकारमाह अर्थेति । यथासुखं गच्छ राघवेण सह वैदेहीं समानय संगमयस्व\nतदिति । तत् पूर्वोक्तकर्मद्वयात् तृतीयं कर्म सुरसामुखान्निर्गमक्रियां दृष्ट्वा हरिं हनूमन्तं साधु साध्विति प्रशशंसुः", "bhusana": "सो ऽभिपत्याशु तद्वक्त्रं निष्पत्य च महाजवः ।\n\nअन्तरिक्षे स्थितः श्रीमानिदं वचनमब्रवीत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.166:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций"}, {"id": "lexical:5.1.166:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dīrghajihva", "note_ru": "Длинноязыкий (dīrghajihva) — MW: dīrghajihva — «having a long tongue (N. of a demon, Rākṣasa)». В V.1.166 dīrghajihvaṃ surasayā subhīmaṃ narakopamam — раскрытая пасть Сурасы «длинноязыкая, страшная, подобная аду (naraka)». Nāraka — «адское место» (naraka); пасть уподоблена аду. DīrghajihvА — реальный эпитет ракшасов, у которых длинный язык ассоциируется с хищничеством и нечистотой. Также dīrghajihvā = имя конкретного демона (MW). Здесь — дескриптив внешности пасти Сурасы.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. dīrghajihva; Apte s.v. jihva", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.167", "verse": "167", "sanskrit_iast": "sa saṃkṣipyātmanaḥ kāyaṃ jīmūta iva mārutiḥ । tasmin muhūrte hanumān babhūvāṅguṣṭhamātrakaḥ ॥167॥", "leonov_ru": "Марути, подобный облаку, уменьшив свое тело, В тот же миг Хануман стал размером с большой палец.", "commentary": {"bhusana": "प्रदृश्यमानस्सर्वत्र हनुमान् मारुतात्मजः ।\n\nभेजे ऽम्बरं निरालम्बं लम्बपक्ष इवाद्रिराट्"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.167:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "māruti", "note_ru": "Марути (māruti) — именное производное от Марут (бог ветра) — стандартное имя Ханумана.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.169", "verse": "169", "sanskrit_iast": "praviṣṭo 'smi hi te vaktraṃ dākṣāyaṇi namo 'stu te । gamiṣye yatra vaidehī satyaś cāsīd varas tava ॥169॥", "leonov_ru": "«Влетел я в твою пасть, хвала тебе, Дакшаяни (дочь Дакши). Полечу я туда, где находится Вайдехи. Истинен был твой дар».", "commentary": {"bhusana": "समाक्षिप्तो ऽस्मि सहसा पङ्गूकृतपराक्रमः ।\n\nप्रतिलोमेन वातेन महानौरिव सागरे"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.169:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.Неложен дар, тебе данный (satyaś cāsīd varas tava) – имеется в виду дар, о котором Сураса упоминает в строфе 158. В ряде рукописей, а также в критическом издании приводится другой вариант: satyaṃ cāstu vacas tava «и пусть будут твои слова истинными» (см.: Jhala 1966: 30). Голдмены видят в этом отсылку к словам Сурасы в строфе 150 (см.: Goldman 1984: 321).[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}, {"id": "lexical:5.1.169:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "vaidehī", "note_ru": "Вайдехи (vaidehī) — эпитет Ситы (царевна из Видехи). см. примеч. к I.1.28 (Гринцер).", "type": "А", "subtype": "base", "trigger": "crossref", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.169:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dākṣāyaṇī", "note_ru": "Дочь Дакши (dākṣāyaṇī) — букв. «происходящая от Дакши» (dākṣa «принадлежащий Дакше» + -āyaṇī патронимический суффикс). MW: dākṣāyaṇī — «a daughter of Dakṣa (N. of Aditi, Diti, Danu, etc.)». Сураса как дākṣāyaṇī = «дочь Дакши», что делает её сестрой великих богинь-матерей (Адити, Дити, Дану). В V.1.169 dākṣāyaṇi namo 'stu te — «поклонение тебе, дочь Дакши»: Хануман, войдя в пасть и выйдя, почтительно обращается к ней. Этот патроним придаёт Сурасе статус не просто «чудовища», а членa первого поколения космических существ.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. dākṣāyaṇī; Apte s.v. dakṣa", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.170", "verse": "170", "sanskrit_iast": "taṃ dṛṣṭvā vadanān muktaṃ candraṃ rāhumukhād iva । abravīt surasā devī svena rūpeṇa vānaram ॥170॥", "leonov_ru": "Увидев, что вылетел (освободился) он из пасти, как луна – из пасти Раху, Сказала богиня Сураса в собственном облике обезьяне:", "commentary": {"tilaka": "ननु प्रथमप्रवृत्तवेगस्य सुरसादिभिः कुण्ठीभावे सति कथं पुनराकाशगमनं तत्राह-- आत्मवान्वायोरिव स्वाधीन एव तद्गमनविषयो यत्नः । प्रथमं त्वाकाशमार्गप्राप्तिमात्राय महेन्द्रपर्वतालम्बनमितरजनप्रतारणाय वेत्याहुः । हृतहृद्धस्तहृदयलक्षणप्राणस्थाना, अत एव विधुरा प्राणशून्याम्भसि पपात । अत्र कविरुत्प्रेक्षते-- तस्याश्छायाग्रहणमात्रेण भक्षणादिशक्तिमत्याः सिंहिकाया, निपातने निपातनिमित्तं रावणनाशाय स्वात्मरूपरामवत्स्वस्वरूपो हनुमान्सृष्टः ।। 5.1.187,188 ।।\n\nमहत्सत्त्वं महाबला राक्षसी रावणवदशक्यसंहारा त्वया संहृतेत्यर्थः । अरिष्टं बाधारहितम् \"रिष हिंसायाम्\""}, "has_tier1": true, "notes": [{"id": "tier1:5.1.170:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций[Claude.AI — желательно] [термин] (не учтено) Раху — демон, поглощающий луну при затмениях"}]}, {"verse_id": "5.1.172", "verse": "172", "sanskrit_iast": "tat tṛtīyaṃ hanumato dṛṣṭvā karma suduṣkaram । sādhu sādhv iti bhūtāni praśaśaṃsus tadā harim ॥172॥", "leonov_ru": "Видя, что Хануман совершил третье весьма трудное дело, «Хорошо! Хорошо!» - восхвалили [все] существа тогда обезьяну.", "commentary": {"siromani": "हरिणेति । हरिणा हनूमता पीड्यमानेन पीडितेन पर्वतेन पीड्यमानानि गुहाविष्टानि सत्त्वानि प्राणिनः विकृतैः स्वरैर्विनेदुः", "tattvadipika": "आकाशस्य एकोनपञ्चाशदग्निसम्बन्धमुक्त्वा तत्प्रधानभूतचित्रभानुसम्बन्धामाह वहतेति", "bhusana": "प्लवमानं तु तं दृष्ट्वा सिंहिका नाम राक्षसी ।\n\nमनसा चिन्तयामास प्रवृद्धा कामरूपिणी"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.172:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "tṛtīya", "note_ru": "Третий (tṛtīya) — в V.1.172 tat tṛtīyaṃ hanumato dṛṣṭvā karma suduṣkaram — «увидев это третье трудное дело Ханумана». Подсчёт подвигов: 1-й = прыжок через океан, 2-й = преодоление Майнаки/отказ от отдыха, 3-й = победа над Сурасой хитростью. Перечисление — эпическая техника суммирования в нарративе (katthā). Tṛtīya как нумеральный маркер структурирует эпическую «серию испытаний»; подстрочник «третье» — верен, но не маркирует нарративную функцию числа.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. tṛtīya; нарративная аналитика эпоса", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.174", "verse": "174", "sanskrit_iast": "sevite vāridhāribhiḥ patagaiś ca niṣevite । carite kaiśikācāryair airāvataniṣevite ॥174॥", "leonov_ru": "Где плавали облака, где летали птицы, Где ходили мастера кайшики (видьядхары), где бывал [слон Индры] Айравата,", "commentary": {"bhusana": "सेविते वारिधाराभिः पतगैश्च निषेविते ।\n\nचरिते कैशिकाचार्यैरैरावतनिषेविते\nवहता हव्यमत्यर्थं सेविते चित्रभानुना ।\n\nग्रहनक्षत्रचन्द्रार्कतारागणविभूषिते\nबहुशः सेविते वीरैर्विद्याधरगणैर्वरैः ।\n\nजगाम वायुमार्गे तु गरुत्मानिव मारुतिः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.174:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Где видьядхары ходят (carite kaiśikācāryaiḥ) – ряд комментаторов (в том числе авторы «Тилаки» и «Таттвадипики» понимают слово kaiśika как «искусство пения и танца» (gānanṛtyavidyā) и поясняют, что под «учителями кайшики» подразумеваются видьядхары.Где переливаются радуги (airāvataniṣevite) – в «Тилаке» приводится мнение, что airāvata здесь означает «прямая и длинная радуга» (ṛjudīrgham indradhanuḥ).[Claude.AI — желательно] [термин] (учтено) Первое появление в кн. V; введено в Рамаяна III. 23. 24: Айравата (airāvata) — слон — хранитель мира, ездовое животное Индры."}, {"id": "lexical:5.1.174:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "erāvata", "note_ru": "Айравата (erāvata) — MW: erāvata — «produced from the ocean; N. of the elephant of Indra (produced at the churning of the ocean)». В V.1.174 erāvataniṣevite — небо «посещаемое Айраватой». Айравата — белый четырёхклыкий слон Индры, «небесный слон», вышедший из пахтания океана. Его присутствие в небе = маркер «небесного пространства Индры». Путь Ханумана проходит через «территорию Айраваты» — эпическое указание на то, что это буквально «воздух богов».", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. erāvata; Apte s.v. airāvata; Bhāgavatapurāṇa VIII (самудра-мантхан)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.175", "verse": "175", "sanskrit_iast": "siṃhakuñjaraśārdūlapatagoragavāhanaiḥ । vimānaiḥ sampatadbhiś ca vimalaiḥ samalaṃkṛte ॥175॥", "leonov_ru": "Который был украшен несомыми львами, слонами, тиграми, птицами, змеями Летящими виманами чистыми,", "commentary": {"bhusana": "सिंहकुञ्जरशार्दूलपतगोरगवाहनैः ।\n\nविमानैः संपतद्भिश्च विमलैः समलङ्कृते\nइति संचिन्त्य मनसा छायामस्य समाक्षिपत् ।\n\nछायायां गृह्यमाणायां चिन्तयामास वानरः\nइतीति । समाक्षिपत् सम्यग्गृहीतवती", "tilaka": "समाक्षिपज्जग्राह । छायाग्रहणेन तद्वस्तुनिरोधशक्तिस्तस्या ब्रह्मदत्ता", "siromani": "संपतद्भिर्गच्छद्भिः सिंहादिभिः समलंकृते"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.175:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В которые запряжены… / Птицы или же змеи (-patagoragavāhanaiḥ) – в «Тилаке» patagoragāḥ глоссируется как pakṣisarpāḥ, что можно понять как «крылатые змеи»."}]}, {"verse_id": "5.1.176", "verse": "176", "sanskrit_iast": "vajrāśanisamasparśaiḥ pāvakair iva śobhite । kṛtapuṇyair mahābhāgaiḥ svargajidbhir adhiṣṭhite ॥176॥", "leonov_ru": "Который украшен молниями словно огнями, Который населен обретшими небо праведниками, причастными великой доле,", "commentary": {"tilaka": "वज्राशनिसमस्पर्शैस्तद्वत्प्राणहरैः पावकैः पञ्चाग्निभिरिव स्वर्गजिद्भिरधिष्ठिते । \"समाघातैः\" इति पाठे ताभ्यां तुल्य आघातो ऽभिघातो येषां तैरित्यर्थः", "bhusana": "वज्राशनिसमाघातैः पावकैरुपशेभिते ।\n\nकृतपुण्यैर्महाभागैः स्वर्गजिद्भिरलङ्कृतै"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.176:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Где пребывают святые, / Причастные доле великой (kṛtapuṇyair mahābhāgaiḥ svargajidbhir adhiṣṭhite) – букв. «где обитают очистившиеся, причастные великой доле, обретшие небеса».Подобные пяти огням, / Равным молнии Индры (vajrāśanisamasparśaiḥ pāvakair iva śobhite) – в «Тилаке» поясняется, что под «равны» подразумевается «столь же опасны для жизни»."}]}, {"verse_id": "5.1.178", "verse": "178", "sanskrit_iast": "maharṣigaṇagandharvanāgayakṣasamākule । vivikte vimale viśve viśvāvasuniṣevite ॥178॥", "leonov_ru": "Который был полон сонмами великих риши, гандхарвами, нагами и якшами, Который был чистым, незапятнанным, беспредельным, посещаемым Вишвавасу [царем гандхарвов].", "commentary": {"tilaka": "विश्वे विश्वाश्रये । विश्वावसुर्गन्धर्वराजः", "bhusana": "महर्षिगणगन्धर्वनागयक्षसमाकुले ।\n\nविविक्ते विमले विश्वे विश्वावसुनिषेविते", "siromani": "विविक्ते विलक्षणे विश्वे जगदाश्रयीभूते विशाले वा\nप्रदृश्यमान इति । सर्वत्र सर्वैः प्रदृश्यमानो हनूमान् निरालम्बमम्बरं पक्षयुक्तो ऽद्रिराडिव भेजे"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.178:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Где живет Вишвавасу (viśvāvasuniṣevite) – комментаторы отождествляют Вишвавасу с царем гандхарвов."}, {"id": "lexical:5.1.178:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "viśvāvasu", "note_ru": "Вишвавасу (viśvāvasu) — MW: viśvāvasu — «N. of a Gandharva (considered as the chief of the Gandharvas)». В V.1.178 viśvāvasunisevite — небо «почитаемое Вишвавасу». Вишвавасу — «властитель всего» (viśva «всё» + vasu «блага»), главный гандхарв; его присутствие маркирует небо как «музыкальный домен гандхарвов». Гандхарвы — небесные музыканты, стерегущие сому; Вишвавасу = их предводитель. Небесный путь Ханумана проходит через три «домена»: богов (erāvata), гандхарвов (viśvāvasu), нагов/якшей (V.1.178).", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. viśvāvasu; Apte s.v. viśvāvasu", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.179", "verse": "179", "sanskrit_iast": "devarājagajākrānte candrasūryapathe śive । vitāne jīvalokasya vitato brahmanirmite ॥179॥", "leonov_ru": "По которому ходит слон царя богов, по благому пути луны и солнца, По ковру, созданному Брахмой и распростертому над миром живых существ,", "commentary": {"siromani": "जीवलोकस्य विताने वितानसदृशे", "bhusana": "देवराजगजाक्रान्ते चन्द्रसूर्यपथे शिवे ।\n\nविताने जीवलोकस्य वितते ब्रह्मनिर्मिते"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.179:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Там, где ходит слон Индры (devarājagajākrānte) – Голдмены полагают, что под «слоном царя богов» подразумевается Айравата, слон Индры (см.: Goldman 1984: 112). Однако некоторые комментаторы (в том числе авторы «Тилаки» и «Бхушаны») считают, что имеются в виду слоны сторон света (diggajāḥ; в «Тилаке» говорится: «Пундарика и другие»).Где благой путь светил проложен (candrasūryapathe śive) – букв. «путь луны и солнца».Комм."}]}, {"verse_id": "5.1.181", "verse": "181", "sanskrit_iast": "hanumān meghajālāni prākarṣan māruto yathā । kālāgurusavarṇāni raktapītasitāni ca ॥181॥", "leonov_ru": "Хануман тащил гряды облаков, словно ветер, Цвета, сходного с черным алоэ, красные, желтые и белые.", "commentary": {"siromani": "हनूमानिति । हनूमान् मेघजालानि मारुत इव प्राकर्षत् अत एव महाभ्राणि चकाशिरे"}, "has_tier1": false, "notes": [{"id": "edition:5.1.181:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлока 5.1.

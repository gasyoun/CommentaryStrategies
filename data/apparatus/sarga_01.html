181 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.1.181", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.181", "iast": "hanumān meghajālāni prākarṣan māruto yathā । kālāgurusavarṇāni raktapītasitāni ca ॥181॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.184", "verse": "184", "sanskrit_iast": "bheje 'mbaraṃ nirālambaṃ pakṣayuta ivādrirāṭ । plavamānaṃ tu taṃ dṛṣṭvā siṃhikā nāma rākṣasī ॥184॥", "leonov_ru": "Рассекал он небо, лишенное опоры, словно крылатый царь гор (Меру). Его, летящего, увидев, ракшаси по имени Симхика,", "commentary": {"bhusana": "तां तु दृष्ट्या च धृत्या च दाक्षिण्येन निपात्य च ।\n\nस कपिप्रवरो वेदाद्ववृधे पुनरात्मवान्\nतामिति । दृष्ट्या दूरादेव दर्शनेन । धृत्या अस्य नियमनजननधार्ष्ट्येन । दाक्षिण्येन पाटवेन", "siromani": "तामिति । विकृताननां तां सिंहिकां दृष्ट्वा चिन्तयामास । अर्धं पृथक्", "tattvadipika": "मनस्सम्पातिविक्रमः मनोगमनसमानगतिः\nसा सिंहिका । हृतहृत् विदारितहृदया, अत एव विधुरा विह्वला"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.184:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "siṃhikā", "note_ru": "Симхика (siṃhikā) — ракшасини, «ловящая тени» (chāyāgrahin): по «Широмани», обладает силой притягивать существ за их тень. Хануман уничтожает её при перелёте. Первое появление персонажа.", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.184:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "siṃhikā", "note_ru": "Синхика, «ловящая по тени» (chāyāgrāha). Гибель ракшаси Синхики, хватающей добычу за тень, анонсирована в конспекте кн. I: «rākṣasī-tarjanaṃ caiva chāyāgrāhasya darśanam । siṃhikāyāś ca nidhanaṃ laṅkāmalayadarśanam» (Rām. I.3.28) — «О встрече с ужасной ракшаси, ловящей добычу по тени, о гибели Синхики, о прибытии Ханумана в прекрасную Ланку». Эпизод V.1.184–199 буквально исполняет эту строку. Мотив «хватания по тени» — фольклорный (ср. Гринцер о морских чудищах-преградах); подстрочник V.1.184 даёт имя без указания на проспекцию кн. I.", "type": "В", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.1.184", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bālakāṇḍa (Rām. I) 3.28", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.185", "verse": "185", "sanskrit_iast": "manasā cintayām āsa pravṛddhā kāmarūpiṇī । adya dīrghasya kālasya bhaviṣyāmy aham āśitā ॥185॥", "leonov_ru": "Подумала про себя могучая, свободно меняющая облик: «Нынче наемся я за долгое время.", "commentary": {"tilaka": "आशिता कृतभोजना", "bhusana": "अद्य दीर्घस्य कालस्य भविष्याम्यहमाशिता ।\n\nइदं हि मे महत्सत्त्वं चिरस्य वशमागतम्\nअद्येति । दीर्घस्य कालस्य दीर्घकाले गेत सति अद्य आशिता आशित्री भुक्तवती भविष्यामि\nतदृष्ट्वा चिन्तयामास मारुतिर्विकृताननम् ।\n\nकपिराजेन कथितं सत्त्वमद्भुतदर्शनम्\nस इति । मुहुस्संक्षिप्य संनिकर्षानुगुणं सङ्कुच्य ।। 5.1.183,184।।\n\nततस्तस्या नखैस्तीक्ष्णैर्मर्माण्युत्कृत्य वानरः ।\n\nउत्पपाताथ वेगेन मनस्संपातविक्रमः\nतत इति । ततः तेन रूपेण मनस्संपातविक्रमः मनोवेगतुल्यगतिः", "siromani": "चिन्ताप्रकारमाह अद्येति । इदं महासत्त्वं चिरस्य बहुकालात् मम वशमागतम् अतः दीर्घस्य कालस्य बहुकालपर्यन्तम् आशिता कृतभोजना ऽहं भविष्यामि"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.185:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «pravṛddhā» Опущено[Claude.AI — строго] [термин] (не учтено) Синхика — демоница, хватающая тени летящих"}]}, {"verse_id": "5.1.186", "verse": "186", "sanskrit_iast": "idaṃ mama mahasattvaṃ cirasya vaśam āgatam । iti saṃcintya manasā chāyām asya samakṣipat ॥186॥", "leonov_ru": "Это великое существо [впервые за] долгое время попало ко мне во власть», Так подумав про себя, набросилась она на его тень.", "commentary": {"tilaka": "महासत्त्वं स्त्रीरूपं प्राणिनम् ।। 5.1.178,179 ।।\n\nअर्थतत्त्वेन छायाग्रहणरूपार्थक्रियया\nमनःसंपातविक्रमो मनोवेगतुल्यवेगः । दिष्ट्या दैवानुग्रहेण । \"दृष्ट्वा\" इति पाठे सूक्ष्मदर्शनेनेत्यर्थः । धृत्या सहजधैर्येण । दाक्षिण्येन कालोचितकृत्यचातुर्येण च तां निपात्य निहत्य वेगेनोत्पपात", "siromani": "स इति । अर्थतत्त्वेन अर्थस्य सुग्रीवोपदिष्टच्छायाग्रहणरूपवस्तुनः तत्त्वेन याथार्थ्येन तां सिंहिकां बुद्वा प्रावृषि बलाहको मेघ इव स हनूमान् व्यवर्धत\nअस्य इति । राहुणा ग्रस्यमानं पूर्णचन्द्रमिव तस्या आस्ये मुखे निमज्जन्तं हनूमन्तं सिद्धचारणा ददृशुः\nइतीति । इति संचिन्त्य अस्य हनूमतः छायां समाक्षिपत् अगृह्णात् छायायां गृह्यमाणायां वानरश्चिन्तयामास\nचिन्ताप्रकारमाह समिति । प्रतिलोमेन विपरीतेन वातेन सागरे महानौरिव समाक्षिप्तः केनचित् गृहीतो ऽहं सहसा पङ्गूकृतपराक्रमो ऽस्मि", "tattvadipika": "दृष्ट्या सूक्ष्मदर्शनेन । धृत्या धैर्येण । दाक्षिण्येन कौशलेन, क्षिप्रकारित्वेनेत्यर्थः । तस्याः संहारवैपुल्येन वा"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.186:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Давно уж не попадались / Мне существа огромные (idaṃ mama mahasattvaṃ cirasya vaśam āgatam) – букв. «Это огромное существо попало ко мне во власть [впервые] за долгое время»."}]}, {"verse_id": "5.1.188", "verse": "188", "sanskrit_iast": "pratilomena vātena mahānaur iva sāgare । tiryag ūrdhvam adhaś caiva vīkṣamāṇas tadā kapiḥ ॥188॥", "leonov_ru": "Словно огромный корабль в океане, [остановленный] встречным ветром». По сторонам, вверх и вниз глядя тогда обезьяна", "commentary": {"bhusana": "तिर्यगूर्ध्वमधश्चैव वीक्षमाणस्ततः कपिः ।\n\nददर्श स महत्सत्त्वमुत्थितं लवणाम्भसि", "siromani": "तिर्यगिति । तिर्यगादौ वीक्षमाणः कपिः लवणाम्भसि महासत्त्वं ददर्श"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.188:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Начал тогда Хануман / По сторонам озираться (tiryag ūrdhvam adhaś caiva vīkṣamāṇas tadā kapiḥ) – букв. «тогда обезьяна, смотрящая в сторону, вверх и вниз…»."}]}, {"verse_id": "5.1.190", "verse": "190", "sanskrit_iast": "kapirājñā yad ākhyātaṃ sattvam adbhutadarśanam । chāyāgrāhi mahāvīryaṃ tad idaṃ nātra saṃśayaḥ ॥190॥", "leonov_ru": "Это чудесное обликом существо – могучий хвататель теней, О котором рассказывал царь обезьян, нет в этом сомнения».", "commentary": {"siromani": "तद्वचनाकारमाह भीममिति । भीमं भयङ्करं सत्वं यत्त्वया हतं गर्वविध्वंसपूर्वकं ताडितं तन्महत्कर्म कृतम् । अतः अभिप्रेतमिच्छाविषयीभूतमर्थम् अरिष्टं निर्बाधं यथा भवति तथा साधय । अत्र सिंहिकायाः प्राणवियोगपरत्वेन व्याख्यानं हेयमेव परमधर्मज्ञहनुमतो ऽत्र स्त्रीप्राणावियोगकर्तृत्वस्यासंभवात् अत एव सुरसावधाभावः सङ्गच्छते । अत एव वक्ष्यमाणलङ्काकर्मकप्रहारसमये स्त्री चेति मन्यमानेन नातिक्रोधः स्वयं कृत इत्युक्तिः संगच्छते । अत एव न सन्दर्भाशुद्धिरिति दिक्", "tattvadipika": "उक्तशरीरसंक्षेपं दृष्टान्तकथनार्थमनुवदति तद्रूपमिति", "bhusana": "छायाग्राहीति । तदिदं छायाग्राहि कपिराजेन कथितं नात्र संशय इति योजना ।। 5.1.179,180।।\n\nघनराजीव गर्जन्ती वानरं समभिद्रवत्\nघनराजीवेति । समभिद्रवत् समभ्यद्रवत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.190:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм. (уточнить, в какой главе IV книги об этом говорится)"}, {"id": "phase2:5.1.190:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": false, "status": "принято: Леонов (2026-07-11)", "mg_comment": "", "lemma_iast": "chāyāgrāhi", "note_ru": "По Широмани, эпизод с Синхикой нельзя понимать как убийство: дхармичный Хануман не может быть убийцей женщины, поэтому «разодранные внутренности» — лишь одоление её колдовской силы, а не умерщвление. Это же объясняет, почему Хануман не убил точно так же Сурасу, и согласуется с более поздним эпизодом в Ланке, где он сдерживает гнев, сочтя противницу женщиной.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "заполняет разрыв, прямо отмеченный самим Леоновым/Костиной как незакрытый (их помета к V.1.190: «Комм. — уточнить, в какой главе IV книги об этом говорится»): Широмани даёт доктринальное разрешение видимого противоречия (герой-дхармик, убивающий женщину), не сводимое к подстрочнику.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.191", "verse": "191", "sanskrit_iast": "sa tāṃ buddhvārthatattvena siṃhikāṃ matimān kapiḥ । vyavardhata mahākāyaḥ prāvṛṣīva balāhakaḥ ॥191॥", "leonov_ru": "Поняв по этому признаку, что это Симхика, мудрая обезьяна Увеличилась, великая телом, словно облако в пору дождей.", "commentary": {"siromani": "तामिति । दिष्ट्या देवादीनां भाग्योदयेन धृत्या स्वधैर्येण च दाक्षिण्येन अतिनिपुणतया च तां सिंहिकां निपात्य शैथिल्यप्रापणपूर्वकं पातयित्वा आत्मवान् अतिप्रयत्नवान् कपिप्रवीरः स हनुमान् पुनर्ववृधे\nतामिति । सिंहिकां हतां ताडितां वीक्ष्य आकाशचारीणि भूतानि तं हनूमन्तमूचुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.191:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Поняв по такой примете (buddhvārthatattvena) – букв. «поняв по сути дела»."}, {"id": "lexical:5.1.191:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "mahākāya", "note_ru": "Огромный (mahākāya) — ситуативный эпитет (mahā-kāya «обладающий великим телом») при увеличении тела Ханумана перед прыжком.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.191:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "prāvṛṣ", "note_ru": "Сравнение «как в пору дождей» (prāvṛṣi … iva): в Бала-канде 1.32.12 девы-внучки Кушанабхи блистают «словно молнии в сезон дождей» (prāvṛṣīva śatahradāḥ). В Сундаре (V.1.191) тот же зачин simile применён к Хануману, растущему «словно грозовая туча в пору дождей» (prāvṛṣīva balāhakaḥ). Одна метеорологическая формула — для женской красоты и для богатырского роста; подстрочник передаёт буквально, без указания на формульность.\n\nПараллель — Rām. Bāla 1.32.12:\n  «tāstu yauvanaśālinyo rūpavatyaḥ svalaṅkṛtāḥ । udyānabhūmimāgamya prāvṛṣīva śatahradāḥ ॥12॥»\n  Однажды в пору юности Они, блистая украшениями, Словно молнии в сезон дождей, Гуляли в дворцовом парке.", "type": "Б", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.1.191", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.32.12 (Гринцер, пер. изд. I–III)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.192", "verse": "192", "sanskrit_iast": "tasya sā kāyam udvīkṣya vardhamānaṃ mahākapeḥ । vaktraṃ prasārayām āsa pātālāmbarasaṃnibham ॥192॥", "leonov_ru": "Увидев, что тело обезьяны увеличивается, Она (Симхика) распахнула пасть, подобную Патале и небу.", "commentary": {"bhusana": "तस्य सा कायमुद्वीक्ष्य वर्धमानं महाकपेः ।\n\nवक्त्रं प्रसारयामास पातालान्तरसन्निभम्\nस तस्या विवृते वक्त्रे वज्रसंहननः कपिः ।\n\nसंक्षिप्य मुहुरात्मानं निष्पपात महाबलः\nआस्ये तस्या निमज्जन्तं ददृशुः सिद्धचारणाः ।\n\nग्रस्यमानं यथा चन्द्रं पूर्णं पर्वणि राहुणा", "tattvadipika": "नानाविधरूपधारी परैः शत्रुभिः अशक्यः अप्रधृष्यः । समीक्षितात्मा समालोकितातिप्रमाणस्वशरीरः । समवेक्षितार्थः आलोचितानन्तरकार्यः । प्रतिपन्नरूपः अङ्गीकृतपृषदंशदेहः, अभूदिति शेषः", "siromani": "तस्येति । महाकपेः वर्धमानं कायमुद्वीक्ष्य सा सिंहिका पातालाम्बरसंनिभं पातालाम्बरयोरन्तरालतुल्यं वक्त्रं प्रसारयामास"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.192:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Подобную адскому жерлу (pātālāmbarasaṃnibham) – в «Тилаке» этот композит толкуется как «подобную расстоянию между Паталой и небом» (pātālākāśamadhyabhāgasadṛśam). Автор «Таттвадипики» понимает его как «подобную отверстию, ведущему в Паталу» (pātālavivarasadṛśam)."}]}, {"verse_id": "5.1.194", "verse": 194, "sanskrit_iast": "", "leonov_ru": "", "commentary": {}, "has_tier1": true, "notes": [{"id": "tier1:5.1.194:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Увидел размер ее тела (dadarśa… kāyamātraṃ ca) – в некоторых комментариях («Тилака», «Таттвадипика») композит kāyamātram понимается как «[пасть] размером с [ее] тело»."}], "verse_not_segmented": true}, {"verse_id": "5.1.196", "verse": "196", "sanskrit_iast": "grasyamānaṃ yathā candraṃ pūrṇaṃ parvaṇi rāhuṇā । tatas tasya nakhais tīkṣṇair marmāṇy utkṛtya vānaraḥ ॥196॥", "leonov_ru": "Поглощаемого, словно полная луна в в ночь полнолуния. И вот своими острыми когтями обезьяна, разорвав ее жизненно важные органы,", "commentary": {"bhusana": "ततस्स लम्बस्य गिरेस्समृद्धे विचित्रकूटे निपपात कूटे ।\n\nसकेतकोद्दालकनालिकेरे महाद्रिकूटप्रतिमो महात्मा\nतत इति । लम्बस्य लम्बमानस्येव स्थितस्य, अविज्ञाताग्रस्येत्यर्थः । विचित्रकूटे विविधाश्चर्यसमूहे । \"कूटस्त्वस्त्रियां पुञ्जपालयोः\" इति दर्पणः । उद्दालकाः श्लेष्मातकाः\nततस्तु संप्राप्य समुद्रतीरं समीक्ष्य लङ्कां गिरिवर्यमूर्ध्नि ।\n\nकपिस्तु तस्मिन्निपपात पर्वते विधूय रूपं व्यथयन्मगद्विजान्\nव्यथयन् मृगद्विजानित्यादिविशेषं वक्तुमुक्तमर्थमनुवदति-- ततस्त्विति । समुद्रतीरं तीरोपर्याकाशम् । विधूय रूपं पूर्वरूपं विहाय । वृत्तमुपजातिः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.196:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Как луна – в пасти у Раху (grasyamānaṃ yathā candraṃ pūrṇaṃ parvaṇi rāhuṇā) – букв. «словно луна, пожираемая Раху в ночь полнолуния».Разодрал Синхике внутренности (marmāṇy utkṛtya vānaraḥ) – букв. «разодрав жизненно важные органы»."}, {"id": "lexical:5.1.196:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "rāhu", "note_ru": "Раху (rāhu) — MW: rāhu — «N. of a demon (who is supposed to swallow the sun and moon, thus causing eclipses)». Безголовый демон; его «голова» — северный лунный узел в астрологии. В V.1.196 grasyamānaṃ yathā candraṃ pūrṇaṃ parvaṇi rāhuṇā — «как луну в полнолуние во время parvan поглощает Раху». Parvan — «сочленение», день солнцестояния/равноденствия или полнолуния — время лунных затмений по индийской астрологии. Раху как «поглотитель» в V.1.196 — точный аналог Синхики; Хануман выходит, как луна «выходит» из Раху после затмения. См. примеч. к II.114.3 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "MW s.v. rāhu; Apte s.v. rāhu; Sūryasiddhānta", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.197", "verse": "197", "sanskrit_iast": "utpapātātha vegena manaḥsampātavikramaḥ । tāṃ tu diṣṭyā ca dhṛtya ca dākṣiṇyena nipātya saḥ ॥197॥", "leonov_ru": "Взлетела тогда стремительно, двигаясь со скоростью мысли. Волей судьбы, стойкостью и искусством одолев ее, тот", "commentary": {"tattvadipika": "तामेवाह कायवृद्धिमित्यादि । कौतूहलम् आश्चर्यधिया दिदृक्षाम्", "bhusana": "ततः शरीरं संत्रिप्य तन्महीधरसन्निभम् ।\n\nपुनः प्रकृतिमापेदे वीतमोह इवात्मवान्\nतत इति । पुनः प्रकृतमिमापेदे पुनर्निजाकारं प्राप्तवान्", "siromani": "स इति । पूज्यः सर्वेषां पूजनीयः अत एव तैः आकाशचारिभिः संपूजितः अत एव प्रतिपन्नं निश्चितं प्रयोजनं सीतादर्शनं येन, प्रतिपन्नं सिद्धं यस्येति वा स हनूमान् पन्नगाशनवत् आकाशमाविश्य जगाम"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.197:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — строго] [термин] (не учтено) Сампати — брат Джатаю, сообщил о местонахождении Ситы"}, {"id": "edition:5.1.197:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлоки 5.1.197–198 (2 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.1.197–198", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.197", "iast": "utpapātātha vegena manaḥsampātavikramaḥ । tāṃ tu diṣṭyā ca dhṛtya ca dākṣiṇyena nipātya saḥ ॥197॥"}, {"verse_id": "5.1.198", "iast": "kapipravīro vegena vavṛdhe punar ātmavān । hṛtahṛtsā hanumatā papāta vidhurāmbhasi । svayambhuvaiva hanumān sṛṣṭas tasyā nipātane ॥198॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.198", "verse": "198", "sanskrit_iast": "kapipravīro vegena vavṛdhe punar ātmavān । hṛtahṛtsā hanumatā papāta vidhurāmbhasi । svayambhuvaiva hanumān sṛṣṭas tasyā nipātane ॥198॥", "leonov_ru": "Герой среди обезьян снова быстро увеличился, владеющий собой, С сердцем, разорванным Хануманом, упала беспомощная (жалкая) [Симхика] в воду. Самим Брахмом Хануман был создан для ее низвержения.", "commentary": {"siromani": "हृतेति । हनुमता हृतं विवेकराहित्यं प्रापितं हृत् हृदयं यस्याः सा अत एव विधुरा गर्वेभ्यो वियुक्ता सा सिंहिका अम्भसि सागरजले पपात । तत्र हेतुः तस्या निपातने स्वयंभुवा ब्रह्मणा हनुमान् एव सृष्टः निर्मितः", "bhusana": "तद्रूपमतिसंक्षिप्य हनुमान् प्रकृतौ स्थितः ।\n\nत्रीन् क्रमानिव विक्रम्य बलिवीर्यहरो हरिः\nउक्तं शरीरसंक्षेपं दृष्टान्तार्थमनुवदति--तद्रूपमिति\nहृतहृत् सा हनुमता पपात विधुरा ऽम्भसि ।\n\nतां हतां वानरेणाशु पतितां वीक्ष्य सिंहिकाम् ।\n\nभूतान्याकाशचारीणि तमूचुः प्लवगोत्तमम्\nहृतहृदिति । विधुरा आर्ता", "tilaka": "अतिसङ्क्षिप्यातिसङ्कोच्य । त्रीन्क्रमान्पदानि विक्रम्य प्रक्षिप्य बलेर्वीर्यस्य हरो हरिरिव प्रकृतौ स्थितः"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.198:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Брахмой самим Хануман / Был назначен ее низвергнуть (svayambhuvaiva hanumān sṛṣṭas tasyā nipātane) – в «Тилаке» говорится, что Хануман был сотворен, чтобы убить Синхику, как Рама – на погибель Раване."}]}, {"verse_id": "5.1.200", "verse": "200", "sanskrit_iast": "bhīmam adya kṛtaṃ karma mahat sattvaṃ tvayā hatam । sādhayārtham abhipretam ariṣṭaṃ plavatāṃ vara ॥200॥", "leonov_ru": "«Грозное дело ныне совершено тобой, убито великое существо. Исполняй [теперь] цель намеченную беспрепятственно, о лучший из обезьян!", "commentary": {"tilaka": "निर्बाधं कर्मसाधनहेतुमाह-- यस्य त्विति", "bhusana": "भीममित्यादि । अरिष्टं शुभं यथा भवति तथा । यस्य सिंहिकारूपसत्त्वस्य । दृष्टिः आयतिक्षमसूक्ष्मेक्षणम् । मतिः अर्थतत्त्वनिश्चयः । क्रियावत्त्वं दाक्ष्यम् । यथा तव तथा यस्य चत्वारि सन्ति तत्त्वया हतम् । तान्येव चत्वार्याह धृतिरिति । या धृतिः स्वकर्मसु स्वानुकूलकार्येषु नावसीदति या दृष्टिर्नावसीदति या मतिर्नावसीदति यद्दाक्ष्यं नावसीदति एतानि चत्वारि यसय सन्ति तत्त्वया हतमिति यजना ।। 5.1.188,189।।\n\nस तैः सम्भावितः पूज्यः प्रतिपन्नप्रयोजनः ।\n\nजगामाकाशमाविश्य पन्नगाशनवत्कपिः\nस इति. संभावितः पूजितः । प्रतिपन्नप्रयोजनः प्राक्प्रतिभासितकार्यसारः, स च स्त्रीत्वे दोषे समानेपि सुरसाया जयप्रतिपत्तिः सिंहिकाया वधप्रतिपत्तिश्च\nभीममद्य कृतं कर्म महत्सत्त्वं त्वया हतम् ।\n\nसाधयार्थमभिप्रेतमरिष्टं प्लवतां वर", "tattvadipika": "अरिष्टं शुभम् ।। 5.1.188,189 ।।\n\nप्रतिपन्नप्रयोजनः प्राप्तप्रकृतकार्यः\nप्राप्तं प्राप्तप्रायं भूयिष्ठपारं महातीरं येन"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.200:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Совершил ты грозное дело – / убил существо великое (bhīmam adya kṛtaṃ karma mahat sattvaṃ tvayā hatam) – автор «Широмани» считает, что слово bhīmam (грозное, вызывающее страх) относится к слову sattvam (существо)."}]}, {"verse_id": "5.1.201", "verse": "201", "sanskrit_iast": "yasya tv etāni catvāri vānarendra yathā tava । dhṛtir dṛṣṭir matir dākṣyaṃ sa karmasu na sīdati ॥201॥", "leonov_ru": "У которого есть эти четыре, о владыка обезьян, как у тебя – Стойкость, предвидение (острый взгляд), ум и искусство (ловкость), тот не потерпит поражения.", "commentary": {"tilaka": "पङ्गूकृतः स्तब्धगतिः पराक्रमो यस्य", "bhusana": "यस्य त्वेतानि चत्वारि वानरेन्द्र चथा तव ।\n\nधृतिर्दृष्टिर्मतिर्दाक्ष्यं स्वकर्मसु न सीदति", "siromani": "यस्येति । यथा तव एतानि धृत्यादीनि चत्वारि सन्ति तथा यस्य सन्ति स कर्मसु क्रियासु न सीदति न दुःखं प्राप्नोति"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.201:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dhṛti", "note_ru": "Стойкость / выдержка (dhṛti) — MW: dhṛti — «holding, seizing; firmness of mind, constancy, resolution, will». Первая из четырёх воинских добродетелей, перечисленных в V.1.201: dhṛtiḥ dṛṣṭiḥ matiḥ dākṣyaṃ — «стойкость, проницательность, разум и ловкость». В дхармашастре «четыре качества победителя» (vijigīṣu) варьируются; здесь dhṛti стоит первой. MW: dhṛti особо — «contentment; one of the daughters of Dakṣa». Dhṛti как первое качество превосходит физическую силу — Хануман победил Синхику именно dhṛti + mati, а не телесной мощью.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. dhṛti; Apte s.v. dhṛti; Arthaśāstra VI", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "lexical:5.1.201:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dākṣya", "note_ru": "Ловкость / искусность (dākṣya) — MW: dākṣya — «cleverness, dexterity, ability». От dakṣa «способный, умелый». В V.1.201 dhṛtir dṛṣṭir matir dākṣyaṃ — четвёртая добродетель: dākṣya = «практическая ловкость». В артхашастрической традиции dākṣya — исполнительская способность реализовать решение (mati). Вместе: dhṛti (устойчивость воли) + dṛṣṭi (видение реальности) + mati (разум) + dākṣya (исполнение) = полный цикл героического действия. Четыре добродетели перекликаются с четырьмя упāями (sāma/dāna/bheda/daṇḍa), но на индивидуальном психологическом уровне.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. dākṣya; Apte s.v. dakṣa; Arthaśāstra I", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.202", "verse": "202", "sanskrit_iast": "sa taiḥ sampūjitaḥ pūjyaḥ pratipannaprayojanaiḥ । jagāmākāśam āviśya pannagāśanavat kapiḥ ॥202॥", "leonov_ru": "Почтенная ими, достигшими своей цели, заслуживающая почета Обезьяна, поднявшись в небо, полетела, словно пожиратель змей (Гаруда).", "commentary": {"tilaka": "स तैः संपूजितस्तैः पूर्वोक्तभूतैः । प्रतिपन्नप्रयोजनैरभिमतं साधयेत्यनुमत्यानु ऽगृहीतकार्यैः", "siromani": "वज्राशनिसमः स्पर्शो येषां तैः पावकैः पञ्चाग्निभिरिव स्वर्गजिद्भिः अधिष्ठिते अत एव शोभिते"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.202:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Почтенный достигшими цели (pratipannaprayojanaiḥ) – в большинстве рукописей стоит вариант pratipannaprayojanaḥ, то есть это прилагательное относится к Хануману. В «Широмани» оно толкуется как «исполненный решимости [достичь] цели». Автор «Бхушаны» полагает, что речь идет о победах над Сурасой и Синхикой. Голдмены переводят «his goal practically accomplished» (см.: Goldman 1984: 114).[Е. Костина] «,» Мне кажется, имеет смысл в комм отразить, какой цели они-то достигли"}]}, {"verse_id": "5.1.203", "verse": "203", "sanskrit_iast": "prāptabhūyiṣṭhapāras tu sarvataḥ parilokayan । yojanānāṃ śatasyānte vanarājiṃ dadarśa saḥ ॥203॥", "leonov_ru": "Почти достигший берега, оглядываясь по сторонам, В конце сотни йоджан увидел он линию леса.", "commentary": {"bhusana": "प्राप्तभूयिष्ठपारस्तु सर्वतः प्रतिलोकयन् ।\n\nयोजनानां शतस्यान्ते वनराजिं ददर्श सः\nप्राप्तेति । प्राप्तभूयिष्ठपारः प्राप्तप्रायतीरः", "siromani": "प्राप्तेति । प्राप्तः भूयिष्ठो बहुः पारो येन स हनूमान् योजनानां शतस्यान्ते विद्यमानां वनराजीं ददर्श\nददर्शेति । शाखामृगश्रेष्ठो हनूमान् पतन् गच्छन् सन्नेव विविधद्रुमभूषितं द्वीपं मलयोपवनानि च सागरं च सागरस्य अनूपान् देशांश्च सागरस्य पत्नीनां नदीनां मुखानि सङ्गमस्थलानि विलोकयन् सन् ददर्श । अर्धचतुष्टयमेकान्वयि ।। 5.1.199,200 ।।\n\nस इति । स हनूमान् आकाशं निरुन्धन्तमिव महामेघसंकाशम् आत्मानं स्वदेहं समीक्ष्य मतिं चिन्तां चकार"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.203:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И увидел полоску суши – / конец пути его долгого (yojanānāṃ śatasyānte vanarājiṃ dadarśa saḥ) – букв. «в конце сотни йоджан он увидел полоску леса»."}]}, {"verse_id": "5.1.204", "verse": "204", "sanskrit_iast": "dadarśa ca patann eva vividhadrumabhūṣitam । dvīpaṃ śākhāmṛgaśreṣṭho malayopavanāni ca ॥204॥", "leonov_ru": "Летя, увидел он украшенный разнообразными деревьями Остров, лучший из обезьян, и рощи горы Малайя.", "commentary": {"tilaka": "पतन्नेव गच्छन्नेव मलयोपवनानि । अनेनोत्तरतीर इव दक्षिणतीरे ऽपि मलयाख्यः पर्वतो ऽस्तीति गम्यते", "tattvadipika": "पतन् गच्छन् । मलयः लङ्कायां मलयो नाम गिरिः ।। 5.1.192,193 ।।\n\nमतिं कर्तव्यनिश्चयम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.204:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций"}, {"id": "lexical:5.1.204:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "dvīpa", "note_ru": "Остров (dvīpa) — MW: dvīpa — «an island (lit. \"what has water on two sides\" or \"what is surrounded by water\")». Этимология: dva «два» + ap/āp «вода» → «то, что с двух сторон водой». В V.1.204 dadarśa ca patann eva vivIDadrumabhūṣitaṃ dvīpam — Хануман видит «остров, украшенный разными деревьями». Dvīpa как «что с двух сторон вода» — точная этимология; Ланка = остров-двīpa. Лексическое противопоставление mahāsamudra / dvīpa / parvata (ocean / island / mountain) структурирует топографию финала главы.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "MW s.v. dvīpa; Apte s.v. dvīpa", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.205", "verse": "205", "sanskrit_iast": "sāgaraṃ sāgarānūpān sāgarānūpajān drumān । sāgarasya ca patnīnāṃ mukhāny api vilokayan ॥205॥", "leonov_ru": "Океан и болотца на кромке океана и росшие на них деревья И устья-лица жен океана (рек) также видя,", "commentary": {"bhusana": "सागरं सागरानूपं सागरावनूपजान् द्रुमान् ।\n\nसागरस्य च पत्नीनां मुखान्यपि विलोकयन्\nसागरमिति । सागरस्य पत्नीनां नदीनां त्रिकूटोत्पन्नानाम् । आत्मानं स्वशरीरम् । मतिं चकार मेन इति यावत् ।। 5.1.193,194।।\n\nकायवृद्धिं प्रवेगं च मम दृष्ट्वैव राक्षसाः ।\n\nमयि कौतूहलं कुर्युरिति मेने महाकपिः\nकथं मेन इत्यत्राहकायवृद्धिमिति\nस सागरं दानवपन्नगायुतं बलेन विक्रम्य महोर्मिमालिनम् ।\n\nनिपत्य तीरे च महोदधेस्तदा ददर्श लङ्काममरावतीमिव\n।। इत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे प्रथमः सर्गः ।। 5.1।।\n\nअस्मिन् सर्गे सार्द्धैकाधिकद्विशतश्लोकाः", "tilaka": "सागरं दक्षिणतीरसमीपवर्तिसागरम् । अनूपः कच्छदेशः । सागरस्य पत्नीनां लङ्काद्वीपादागत्य सागरं प्रविशन्तीनां नदीनां मुखानि सङ्गमस्थानानि विलोकयद्व्यलोकयत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.205:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Увидел болотца прибрежные (sāgaraṃ sāgarānūpān) – в «Тилаке» отмечается, что слово sāgara (океан) здесь относится к океанским водам возле берега.Лица жен океана (sāgarasya ca patnīnāṃ mukhāni) – под «женами Океана» подразумеваются реки."}]}, {"verse_id": "5.1.206", "verse": "206", "sanskrit_iast": "sa mahāmeghasaṃkāśaṃ samīkṣyātmānam ātmavān । nirundhantam ivākāśaṃ cakāra matimān matim ॥206॥", "leonov_ru": "Он, владеющий собой, поглядел на свое тело, подобное огромной туче, Словно бы закрывавшее собой небо, и решил мудрый:", "commentary": {"bhusana": "स महामेघसङ्काशं समीक्ष्यात्मानमात्मवान् ।\n\nनिरुन्धन्तमिवाकाशं चकार मतिमान्मतिम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.206:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Комм.[Claude.AI — желательно] ? [кат.5 — текстология] Место отмечено как требующее комментария — возможны расхождения редакций"}]}, {"verse_id": "5.1.208", "verse": "208", "sanskrit_iast": "tataḥ śarīraṃ saṃkṣipya tan mahīdharasaṃnibham । punaḥ prakṛtim āpede vītamoha ivātmavān ॥208॥", "leonov_ru": "Тогда, уменьшив тело, подобное горе, Снова принял он свой природный облик, словно владеющий собой, который освободился от иллюзий (помрачения).", "commentary": {"tattvadipika": "प्रकृतिं निजाकारम् । वीतमोहः निवृत्ताविद्यः", "tilaka": "प्रकृतिं निजमाकारम् । वीतमोहो वीतो नष्टो वासनावशादागतः कामादिमोहो यस्य सः । आत्मवाञ्जीवन्मुक्तयोगी । प्रकृतिम् भगवदनन्यतत्त्वतालक्षणस्वभावमित्यर्थः", "siromani": "तत इति । ततो विचारानन्तरं महीधरसंनिभं शरीरं संक्षिप्य अल्पत्वं प्रापय्य प्रकृतिं स्वाकृतिं पुनरापेदे । तत्र दृष्टान्तः वीतमोहः विगतरागः आत्मवान् योगी शरीरं संक्षिप्य तिरस्कृत्य प्रकृतिं नित्यानन्दस्वभावमिव\nउपसंहरन्नाह स इति । दानवपन्नगैः आयुतं व्याप्तं सागरं निष्क्रम्य उल्लङ्ग्य महोदधेस्तीरे निपत्य संप्राप्य अमरावतीमिव विद्यमानां लङ्कां ददर्श"}, "has_tier1": true, "notes": [{"id": "tier1:5.1.208:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Вернул изначальный облик (punaḥ prakṛtim āpede) – букв. «снова обрел [свою] природу». Автор «Тилаки» поясняет слово prakṛtim (природу) как nijam ākāram (свой облик).Комм."}, {"id": "lexical:5.1.208:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "saṃkṣip", "note_ru": "Сжать / свернуть тело (saṃkṣip) — MW: saṃkṣip — «to throw or press together, compress; to be brief». В V.1.208 śarīraṃ saṃkṣipya — «сжав тело» (Хануман уменьшает себя перед прыжком на берег). Saṃkṣip (sam+kṣip, «бросить вместе») — технический термин для йогического сжатия тела: способность kāyavyūha «формировать тело по желанию». Противоположный глагол: vivardh/vṛdh «расти» (V.1.191). Пара saṃkṣip ↔ vivardh = «сжатие/расширение тела» — йогические сиддхи aṇimā (умалиться) и mahimā (увеличиться).", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. saṃkṣip; Yogasūtra III (siddhi-список)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "crosstext:5.1.208:0", "layer": "crosstext", "layer_label": "cross-text", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "moha", "note_ru": "Вернув природный облик, Хануман сравнён с «избавившимся от ослепления владеющим собой» (vītamoha ivātmavān). Moha — ключевой термин Гиты для помрачения, ослепляющего различение (viveka). Особенно близка финальная реплика Арджуны, у которого moha рассеяна и он вновь готов действовать: БхГ 18.73 «naṣṭo mohaḥ smṛtir labdhā … kariṣye vacanaṃ tava» — «С ослепленьем покончено, Вечный! Твоей милостью разум вернулся! Все сомненья исчезли. Тверд я. Я готов свершить Твое слово.». Как Арджуна с устранённой mohа возвращается к долгу, так Хануман vītamoha + ātmavān собирается и приступает к делу. Сравнение ставит героя в оппозицию к Раване (одержимому mohа страсти, ср. V.20.16 «moham etaṃ visarjaya»). Помета: vītamoha встроено в гитическую оппозицию ослепление/самообладание. Свидетельство: уровень шлоки (мягкое).", "type": "А", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.1.208", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bhagavadgītā 18.73 (Семенцов)", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.209", "verse": "209", "sanskrit_iast": "tadrūpamatisaṃkṣipya hanumān prakṛtau sthitaḥ । trīn kramāniva vikramya balivīryaharo hariḥ ॥209॥", "leonov_ru": "Уменьшив свое тело, Хануман, принявший природный облик, Словно сделав три шага – Хари (Вишну), сокрушив мощь Бали.", "commentary": {"siromani": "तदेव भङ्यन्तरेणाह तदिति । तत्प्रवृद्धं रूपम् अतिसंक्षिप्य त्रीन् क्रमान् लोकान् विक्रम्य परिमाय बलिवीर्यहरः बलेर्वीर्यस्य ध्वंसकः हरिर्वामन इव प्रकृतौ स्थितः"}, "has_tier1": false, "notes": [{"id": "lexical:5.1.209:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": false, "status": "принято: Леонов (2026-07-11)", "lemma_iast": "balivīrya", "note_ru": "Доблесть Бали (balivīrya) — в V.1.209 balivīryaharo hariḥ — «обезьяна, похититель силы Бали». Bali — царь обезьян, убитый Рамой; его сила (vīrya) перешла к Сугриве, а через него — к войску. Balivīrya как «сила Бали» = унаследованный потенциал, который сейчас воплощает Хануман. Hara «похититель» — здесь в смысле «пользователь силы»: Хануман «несёт» силу убитого Бали как её наследник. Образ парадоксален: сила тирана служит праведному делу.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "MW s.v. bali; Rām. Kiṣkindha-k. passim", "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}, {"id": "edition:5.1.209:0", "layer": "edition", "layer_label": "издания · сноска", "votable": false, "status": "принято: Леонов (2026-07-11)", "note_ru": "Шлока 5.1.209 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.1.209", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.1.209", "iast": "tadrūpamatisaṃkṣipya hanumān prakṛtau sthitaḥ । trīn kramāniva vikramya balivīryaharo hariḥ ॥209॥"}], "gate_verdicts": {"Леонов": {"action": "accept", "gated_date": "2026-07-11"}}, "gate": {"action": "accept", "reviewer": "Леонов", "gated_date": "2026-07-11"}}]}, {"verse_id": "5.1.211", "verse": "211", "sanskrit_iast": "tataḥ sa lambasya gireḥ samṛddhe । vicitrakūṭe nipapāta kūṭe । saketakoddālakanālikele । mahābhrakūṭapratimo mahatmā const REVIEWER = "";
// Reviewer-scoped so two gatekeepers voting in the same browser never share
// (or clobber) one ballot — the localStorage twin of the schema-v2 ledger fix.
const KEY = "sundara_apparatus_s1_all_v2";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

const ACT_RU={accept:"✅ принял",edit:"✏️ правил",reject:"❌ отклонил"};

// Verdicts already in the book-wide ledger (scripts/gate_ledger.json, schema v2).
// A colleague's is advisory context for the live vote; my own means this card is
// already cast and its controls are gone.
function verdictHtml(n){
  const vs=n.gate_verdicts||{};
  return Object.keys(vs).sort().map(r=>{
    const v=vs[r]||{};
    const act=ACT_RU[v.action]||esc(v.action||"");
    const when=v.gated_date?` · ${esc(v.gated_date)}`:"";
    const why=v.reject_reason?`<span class="was">причина: ${esc(v.reject_reason)}</span>`:"";
    const was=v.edited_note?`<span class="was">его редакция: ${esc(v.edited_note)}</span>`:"";
    if(REVIEWER&&r===REVIEWER)
      return `<div class="mine">Ваш голос уже учтён: ${act}${when}${why}${was}</div>`;
    return `<div class="colleague"><b>${esc(r)}</b> ${act}${when}${
      REVIEWER?" — ваш голос нужен независимо":""}${why}${was}</div>`;
  }).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  // Ruling R1 gives the assembly two gatekeepers, so a colleague's recorded
  // verdict is shown ON the live card: this reviewer votes knowing it, and
  // never silently overwrites it (the ledger keys verdicts by reviewer).
  extra+=verdictHtml(n);
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  const others=[...new Set(D.verses.flatMap(v=>v.notes.flatMap(
    n=>Object.keys(n.gate_verdicts||{}))))].filter(r=>r!==REVIEWER).sort();
  const seen=others.length
    ? ` Синие плашки — уже поданные голоса (${others.map(esc).join(", ")}); ваш голос нужен независимо, он их не затирает.`
    : "";
  const gate=bl.phase2
    ? ` Статус <span class="badge b-gate">ожидает гейта М.Г.</span> у слоя «${esc(L.phase2)}» — решение по пилоту (H142) ещё не применено.`
    : "";
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>${
    REVIEWER?` · ballot для <b>${esc(REVIEWER)}</b>`:""}: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}.${gate}${seen}</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
// `reviewer` is stamped into the export so the file self-attests its author:
// without it, attribution rested entirely on the --reviewer flag typed at apply
// time, which is exactly how one gatekeeper's ballot gets filed as the other's.
function payload(){
  return JSON.stringify({sarga:D.sarga,reviewer:REVIEWER,
    generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;
  a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}

ategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "dviradais", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 4}, {"id": "tier1:5.9.5:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Вооруженные стражи (udāyudhaiḥ) – букв. «теми, у которых было воздето оружие». В комментарии «Широмани» уточняется «ракшасами».", "service": [], "suggestions": [], "seq": 5}]}, {"verse_id": "5.9.7", "verse": "7", "sanskrit_iast": "tan nakramakarākīrṇaṃ timiṃgilajhaṣākulam । vāyuvegasamādhūtaṃ pannagair iva sāgaram ॥7॥", "leonov_ru": "Был он подобен океану, в котором обитают крокодилы и макары (акулы), Киты и рыбы, змеи, волнуемому силой ветра.", "commentary": {"tilaka": "पन्नगैर्युतं सागरमिव तत्पश्यति स्म", "bhusana": "तन्नक्रमकराकीर्णं तिमिङ्गिलझषाकुलम् ।\n\nवायुवेगसमाधूतं पन्नगैरिव सागरम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "lexical:5.9.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "makara", "note_ru": "Макара (makara, m.) — мифологическое морское существо, часто переводимое «акула» или «крокодил», что неточно. MW: makara 'a kind of sea-monster (sometimes described as a fish, sometimes as a crocodile, sometimes as a kind of shark)'. Макара — самостоятельная мифологема: ездовое животное (vāhana) Варуны и Камы; украшение входов в храмы (makaratoraṇa); знак зодиака (Козерог). В эпосе makara = обозначение максимально опасного морского хищника, стоящего в ряду nakra (крокодил), makara, timiṃgila («глотатель китов», MW). Триада nakra–makara–timiṃgila в данном стихе — поэтический приём нагнетания угрозы (каждый следующий «глотает» предыдущего).", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:makara+dic_apte:makara", "source_links": [{"label": "MW makara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=makara"}, {"label": "APTE makara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=makara"}], "seq": 6}]}, {"verse_id": "5.9.8", "verse": "8", "sanskrit_iast": "yā hi vaiśvaraṇe lakṣmīr yā candre harivāhane । sā rāvaṇagṛhe ramyā nityam evānapāyinī ॥8॥", "leonov_ru": "То великолепие, которое есть во дворце Куберы, которое есть у луны и у Индры, Та же непреходящая красота всегда была у дома Раваны.", "commentary": {"tilaka": "लक्ष्मीः शोभा । रावणगृहे लङ्कायाम्", "bhusana": "या हि वैश्रवणे लक्ष्मीर्या चेन्द्रे हरिवाहने ।\n\nसा रावणगृहे सर्वा नित्यमेवानपायिनी", "siromani": "येति । या लक्ष्मीः वैश्रवणे कुबेरे हरिवाहने हरितास्वरूपवाहनवति इन्द्रे च सा अनपायिनी विनाशरहिता लक्ष्मीः रावणगृहे नित्यमेव वसतीति शेषः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Луны или Индры (candre harivāhane) – в оригинале использован эпитет Индры harivāhana «ездящий на гнедых конях». Также этот эпитет может означать Гаруду или солнце. В критическом издании вместо candre стоит вариант cendre «и Индры» (см.: Jhala 1966: 82).", "service": [], "suggestions": [], "seq": 7}, {"id": "lexical:5.9.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "harivāhana", "note_ru": "Харивахана (hari-vāhana, m.) — «ездящий на hari», эпитет Индры. MW: harivāhana 'having a tawny horse; Indra'. Hari (hari, adj.) — «рыжеватый, золотисто-коричневый»; vāhana — «ездовое животное». В Ригведе Индру возят рыжие кони (haya, vājin) или буланые (babhru). В эпосе hari может означать и лошадей Индры, и его зелёно-золотой цвет. Примечательно: в списке V.9.8 (vaiśravaṇa / kubera — candra — harivāhana/indra) три бога перечислены как образцы наивысшего богатства (ṛddhi) и великолепия (śrī); тройное сравнение — риторический приём, означающий «лучшее из возможного во всех сферах».", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:harivAhana", "source_links": [{"label": "MW harivAhana", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=harivAhana"}], "collision_tier1": true, "seq": 8}]}, {"verse_id": "5.9.9", "verse": "9", "sanskrit_iast": "yā ca rājñaḥ kuberasya yamasya varuṇasya ca । tādṛśī tad viśiṣṭā vā ṛddhī rakṣogṛheṣv iha ॥9॥", "leonov_ru": "И как у владыки Куберы, у Ямы и у Варуны, Такая же или лучшая роскошь была в домах ракшасов.", "commentary": {"tilaka": "ऋद्धिरैश्वर्यं तद्विशिष्टा ततो ऽप्यधिका", "bhusana": "या च राज्ञः कुबेरस्य यमस्य वरुणस्य च ।\n\nतादृशी तद्विशिष्टा वा ऋद्धी रक्षोगृहेष्विह", "siromani": "तदेव भङ्ग्यन्तरेणाह येति । कुबेरादिगृहे यादृशी ऋद्धिः तादृशी तद्विशिष्टा ततो ऽधिका वा रक्षोगृहेष्वस्ति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "lexical:5.9.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "varuṇa", "note_ru": "Варуна (varuṇa) — ведийский бог вод и нравственного миропорядка (ṛta); в эпосе — владыка океана. В Сундараканде фигурирует в контексте переплытия Ханумана. Первое вхождение в кн. V. См. примеч. к II.16.24 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "base", "trigger": "realia", "source": "первое вхождение в кн. V; указатель Гринцера / комментаторы, где процитировано (привязка к стиху, нестрогая)", "source_links": [], "seq": 9}]}, {"verse_id": "5.9.10", "verse": "10", "sanskrit_iast": "tasya harmyasya madhyasthaveśma cānyat sunirmitam । bahuniryūhasaṃyuktaṃ dadarśa pavanātmajaḥ ॥10॥", "leonov_ru": "И посреди того дворца находящийся другой дворец, хорошо созданный, С множеством башенок, увидел сын ветра.", "commentary": {"tilaka": "तस्य हर्म्यस्यार्धयोजनविस्तीर्णत्वादिधर्मणः । वेश्म सस्त्रीकशयनगृहमिति कतकः । वेश्म पुष्पकाख्यमिति तीर्थः । अत्र तीर्थव्याख्या ज्यायसी । निर्यूहो मत्तवारणः", "bhusana": "तस्य हर्म्यस्य मध्यस्थं वेश्म चान्यत्सुनिर्मितम् ।\n\nबहुनिर्यूहसङ्कीर्णं ददर्श पवनात्मजः\nतस्य हर्म्यस्येत्यादि । पूर्वमुक्तार्थस्यापि पुनरुपन्यासः पुष्पकस्य मध्ये रावणस्य निवासभवनमन्यदस्तीत्यस्यार्थस्य स्पष्टीभावार्थम् । निर्यूहः मत्तवारणः", "siromani": "तस्येति । तस्य अर्धयोजनविस्तीर्णत्वाद्रिमतः हर्म्यस्य मध्यस्थं सुनिर्मितं बहुनिर्व्यूहैर्मत्तगजैः संयुतमन्यद्विलक्षणं वेश्म पुष्पकं ददर्श"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Увенчанный множеством башенок (bahuniryūhasaṃyuktam) – комментаторы поясняют слово niryūha как mattavāraṇa, букв. «обезумевший слон». Это слово обычно употребляется в значении «башенка», однако Голдмены переводят bahuniryūhasaṃyuktam как «embossed with an animal motif» (см.: Goldman 1984: 130).", "service": [{"author": "Е. Костина", "lemma_iast": ".", "kind": "note", "text": "Проверьте, пожалуйста, в переводе Голдманов для этой шлоки я вижу «palace adorned with many beautiful reliefs». Вариант «embossed with an animal motif» - в шлоке 12 (13 у нас) на той же странице"}], "suggestions": [], "seq": 10}, {"id": "phase2:5.9.10:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "veśma", "note_ru": "По Тилаке, здесь расходятся два толкователя: Катака считает, что «другое строение» — это опочивальня с женой, Тиртха — что это сама вимана Пушпака; сам Тилака отдаёт предпочтение толкованию Тиртхи как более убедительному.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "передаёт подлинный спор двух именованных толкователей (Катака / Тиртха) о референте слова veśma с явным решением Тилаки — недоступно подстрочнику и не покрыто ни одной существующей заметкой.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 11}]}, {"verse_id": "5.9.11", "verse": "11", "sanskrit_iast": "brahmaṇo 'rthe kṛtaṃ divyaṃ divi yad viśvakarmaṇā । vimānaṃ puṣpakaṃ nāma sarvaratnavibhūṣitam ॥11॥", "leonov_ru": "Это была чудесная вимана Пушпака, вся украшенная драгоценными камнями, Которую для Брахмы сделал на небе Вишвакарман,", "commentary": {"tilaka": "पुनर्हनुमदारोहणशेषतया पुष्पकं वर्णयति-- ब्रह्मणो ऽर्थे इति । भगवतो लीलाफलकमित्यर्थः ।। 5.9.11,12 ।।\n\nकार्तस्वरहिरण्ये स्वर्मजातिविशेषौ रूप्यस्वर्णे इति कश्चित् । ईहामृगो वृकस्तत्प्रतिमायुक्तैः\nयदीत्यनेन सूचितमस्य पक्षस्यात्यन्तासंभावितत्वमाह-- पुनश्चेति । पक्षान्तरं च सो ऽचिन्तयत् विचारेण निश्चितवानित्यर्थः । चिन्ताप्रकारः हि प्रसिद्धमेतत् । यत्सीता देवी गुणतः पातिव्रत्यादिगुणैर्विशिष्ट अथ यत इत्यर्थे यतो महात्मा महाबलो लङ्केश्वरः निरवधिकैश्वर्यवैशिष्ट्यमनेन सूचितम् । ईदृशो ऽस्यां जानक्यामनार्यकर्मापहरणरूपं कर्म आत्तरूपः परिगृहीतमायारूपः सन्कष्टं सक्लेशं यथा भवति तथा कृतवान् । यद्येषा ऐश्वर्यादौ सरागा स्यात्तदा स्वरसत एव नयनं स्यात्, न च तदस्ति अस्माभिस्तद्विक्रोशनादेव रावणेन क्लेशपूर्वं नयनस्य चानुभवादित्याशयः । \"आर्तरूपः\" इति पाठे आर्तं सञ्जातपीडं रूपं यस्येत्यर्थं हनुमद्विशेषणम् । आन्तरपीडासूचकरूप इत्यर्थः", "siromani": "ब्रह्मण इति । दिवि स्वर्गे ब्रह्मणो ऽर्थे यत्पुष्पकं विश्वकर्मणा कृतं यच्च कुबेरः तपसा पितामहाल्लेभे तत्पुष्पकं राक्षसेश्वरो रावणः कुबेरं जित्वा लेभे । श्लोकद्वयमेकान्वयि ।। 5.9.11,12 ।।\n\nईहेति । ईहामृगाः वृकाः तैस्तत्प्रतिमाभिः समायुक्तैः कार्तस्वरहिरण्मयैः सुकृतैः शोभनकृत्या निर्मितैः स्तम्भैः राजितं श्रिया शोभया प्रदीप्तमिव । कार्तस्वरहिरण्ययोः अवान्तरभेदात् न पौनरुक्त्यम्", "bhusana": "ब्रह्मणो ऽर्थे कृतं दिव्यं दिवि यद्विश्वकर्मणा ।\n\nविमानं पुष्पकं नाम सर्वरत्नविभूषितम् ।\n\nपरेण तपसा लेभे यत्कुबेरः पितामहात् ।। 5.9.11.\n\nब्रह्मणो ऽर्थ इत्यादि । ब्रह्मणो ऽर्थे कृतं यत्कुबेरस्तपसा लेभे तद्वेश्म ददर्शेति पूर्वेण सम्बन्धः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Для Брахмы (brahmaṇo 'rthe) – в комментарии «Тилака» дается интерпретация «в качестве плода за лилу Господа» (bhagavatō līlāphalakam), то есть подразумевается, что Рама получит Пушпаку после победы над Раваной.", "service": [], "suggestions": [], "seq": 12}, {"id": "lexical:5.9.11:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vimana (мифологическая категория)", "note_ru": "Вимана (vimana, n.) как мифологическая категория — небесная колесница / воздушный дворец богов; введено в Рам. I.5.16 (Гринцер). Пушпака (puspaka) — виман Брахмы, созданный Вишвакарманом: V.9.11 говорит brahmano 'rthe krtam visvakarmana («сделан Вишвакарманом для Брахмы»). Виман — не просто летательный аппарат, но символ космической мощи и легитимности владельца. Цепочка владения: Вишвакарман -> Брахма -> Кубера (через tapas) -> Равана (через ojas, силой) — показывает деградацию дхармической легитимности: tapas-приобретение (Кубера) противопоставлено ojasa-захвату (Равана, V.9.12). В Сундараканде Пушпака служит архитектурным ядром описания дворца Раваны (V.9.11–30), задавая «мифологический» масштаб роскоши, превосходящей любую человеческую постройку.", "type": "Г", "subtype": "hist_cultural", "trigger": "myth_background", "source": "Рам. I.5.16 (Гринцер); Grintser e98 (Вишвакарман)", "source_links": [], "collision_tier1": true, "seq": 13}, {"id": "lexical:5.9.11:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "brahman", "note_ru": "Брахма (brahman / brahmā, m.) — бог-творец, первоначальный владелец Пушпаки. В V.9.11 прямо сказано: brahmaṇo 'rthe kṛtam = «сделана для Брахмы». Это устанавливает происхождение виманы: Вишвакарман → Брахма → Кубера (через tapas, V.9.12) → Равана (через ojasā, силой). Каждая передача снижает dharmic правообладание: tapas — легитимная аскеза; ojasā «силой» — захват. Цепочка владения Пушпакой — мини-история деградации дхармического порядка, которую Вальмики разворачивает через три стиха (9.11–12). MW: brahman (n.) 'the one impersonal universal spirit; a Brahman'; brahmā (m.) 'the god of creation'.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:brahman", "source_links": [{"label": "MW brahman", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=brahman"}], "collision_tier1": true, "seq": 14}, {"id": "crosstext:5.9.11:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "sarva-ratna-vibhūṣita", "note_ru": "vimānaṃ puṣpakaṃ … sarvaratnavibhūṣitam («вимана Пушпака, вся украшенная драгоценностями», изделие Вишвакармана для Брахмы). Махабхарата знает тот же мотив богосотворённого, всеукрашенного небесного экипажа; ср. в Сабхапарве чудесную колесницу Кришны с богоданным знаменем «блеском напоминавшим радугу» (MBh II.22.21–22), на которую нисходит Гаруда. Параллель помещает Пушпаку в общеэпический класс divya-vimāna/ratha — творений небесного мастера, маркируемых формулой «украшенный всеми драгоценностями».", "type": "А", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.9.11", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Sabhāparvan II.22.21-22", "source_links": [], "collision_tier1": true, "seq": 15}]}, {"verse_id": "5.9.12", "verse": "12", "sanskrit_iast": "pareṇa tapasā lebhe yat kuberaḥ pitāmahāt । kuberam ojasā jitvā lebhe tad rākṣaseśvaraḥ ॥12॥", "leonov_ru": "Которую высшим подвижничеством получил Кубера от Брахмы, Которую добыл владыка ракшасов, силой одолев Куберу.", "commentary": {"tilaka": "संमूर्छिंतं व्याप्तं गन्धवहमनिलमपि तद्गन्धेन रूपवन्तमिव गन्धद्रव्यरूपमिव तद्वायुसंबन्धात्स गन्धः स्वयं महासत्त्वमुत्तमं बन्धुं बन्धुरिव जिघ्रन्नभूत् । गन्धापारोक्ष्यात्तद्वहवायुरप्यपरोक्ष इवाभूत्\nनिद्रितत्वात्संवृतानि संवृतपक्ष्माणि तादृशानि च तानि दान्तानि ग्लानानि मीलिताक्षीण्यतिसंवृतपक्ष्माणि स्वर्गदेवलोकादेरिव संवृतमीलितयोपरपि भेदो बोध्यः । यद्वा संवृतदान्तानीत्यस्यैव व्याख्यानं निमीलिताक्षीणीति । यद्वा संवृतत्वमोष्ठयोः\nतदेवाह-- ताराणामिति । प्रभा देहकान्तिः वर्णो रूपम्, प्रसादस्त्वौज्ज्वल्यम्", "bhusana": "कुबेरमोजसा जित्वा लेभे तद्राक्षसेश्वरः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…одолев Куберу (kuberam ojasā jitvā) – букв. «победив Куберу силой».", "service": [], "suggestions": [], "seq": 16}, {"id": "lexical:5.9.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ojas", "note_ru": "Оджас (ojas, n.) — «жизненная сила, мощь, блеск»; от √vaj- / √uj- (ср. PIE *aug-, лат. augeo «умножать»). MW: ojas 'bodily strength, vigour, energy; vitality, vital power'. В Аюрведе ojas — тонкая субстанция, итог всех семи дхату (тканей тела), квинтэссенция физической и духовной силы. В эпосе ojasā = «силой», «могуществом» — инструментальный случай: Равана взял Пушпаку «своим ojas'ом», то есть физической мощью, превосходящей Куберу. Это принципиально: Кубера получил виману tapasā (аскезой, духовным путём), Равана забрал ojasā (грубой силой). Антитеза tapas/ojas структурирует моральный смысл передачи.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:ojas+dic_apte:ojas", "source_links": [{"label": "MW ojas", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ojas"}, {"label": "APTE ojas", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=ojas"}], "collision_tier1": true, "seq": 17}]}, {"verse_id": "5.9.13", "verse": "13", "sanskrit_iast": "īhāmṛgasamāyuktaiḥ kārtasvarahiraṇmayaiḥ । sukṛtair ācitaṃ stambhaiḥ pradīptam iva ca śriyā ॥13॥", "leonov_ru": "С изображениями волков, сделанными из золота и серебра (или «из золота картасвара и хиранья) Хорошо изготовленными колоннами, она словно бы пылала великолепием.", "commentary": {"bhusana": "ईहामृगसमायुक्तैः कार्तस्वरहिरण्मयैः ।\n\nसुकृतैराचितं स्तम्भैः प्रदीप्तमिव च श्रिया"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "iva", "kind": "note", "text": "Не отражено в переводе"}], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "термин", "accounted": "не учтено", "text": "Первое появление в кн. V; введено в :", "incomplete": true}], "seq": 18}, {"id": "lexical:5.9.13:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kārtasvara", "note_ru": "Картасвара (kārtasvara, n.) — специфический вид золота. MW: kārtasvara 'gold; of or coming from the Karttasvara mountain'. Апте: 'gold of a particular quality'. Рядом в стихе стоит hiraṇmaya (от hiraṇya — поэтическое золото Вед); таким образом V.9.13 перечисляет два разных вида золота: kārtasvara (горное/классифицированное) и hiraṇmaya (сияющее/ведийское). Комментарий различает их как «вид золота» vs «золотой блеск»: kārtasvara — материальное, hiraṇmaya — эпитетное. Подстрочник объединяет их в «золото картасвара и хиранья» или упрощает до «золота и серебра». Терминологическое различение принципиально для понимания роскоши Ланки.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:kArtasvara+dic_apte:kArtasvara", "source_links": [{"label": "MW kArtasvara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=kArtasvara"}, {"label": "APTE kArtasvara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=kArtasvara"}], "collision_tier1": true, "seq": 19}]}, {"verse_id": "5.9.14", "verse": "14", "sanskrit_iast": "merumandarasaṃkāśair ullikhadbhir ivāmbaram । kūṭāgāraiḥ śubhāgāraiḥ sarvataḥ samalaṃkṛtam ॥14॥", "leonov_ru": "Подобными горам Меру и Мандаре, словно бы царапающими небо Верхними комнатами и комнатами для отдыха со всех сторон была она украшена.", "commentary": {"bhusana": "मेरुमन्दरसङ्काशैरुल्लिखद्भिरिवाम्बरम् ।\n\nकूटागारैः शुभाकारैः सर्वतः समलङ्कृतम्\nकूटागारैर्वराकारैर्विविधैः समलङ्कृतम् ।\n\nविमानं पुष्पकं दिव्यमारुरोह महाकपिः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Комнатами и террасами (kūṭāgāraiḥ śubhāgāraiḥ) – в комментарии «Тилака» поясняется, что kūṭāgāra – это «небольшие потайные помещения» (guptasvalpagṛha), а śubhāgāra – помщения для отдыха (vihārayōgyagṛha). В критическое издание вошел вариант śubhākaraiḥ то есть «имеющими прекрасный вид» (см.: Jhala 1966: 83).", "service": [], "suggestions": [], "seq": 20}, {"id": "lexical:5.9.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mandara", "note_ru": "Мандара (mandara, m.) — гора, которой боги и асуры пахтали океан (Самудра-мантхана, «Пахтанье»). MW: mandara 'the churning-stick (the mountain Mandara being used by the gods and demons for churning the ocean)'. Упоминание Меру и Мандары в одном стихе (merumandarasaṃkāśa) — стандартная пара в эпосе для обозначения гор максимальной высоты и значимости. Однако Мандара — не просто высокая гора, а мифологический атрибут космогонического события; её упоминание рядом с Меру наделяет башни Пушпаки космической, а не просто физической высотой. Подстрочник («подобными горам Меру и Мандаре») сохраняет имена без объяснения контекста.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:mandara", "source_links": [{"label": "MW mandara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=mandara"}], "collision_tier1": true, "seq": 21}]}, {"verse_id": "5.9.16", "verse": "16", "sanskrit_iast": "jālavātāyanair yuktaṃ kāñcanaiḥ sphāṭikair api । indranīlamahānīlamaṇipravaravedikam ॥16॥", "leonov_ru": "Снабженная решетчатыми окошками из золота и хрусталя, С превосходными сидениями из изумрудов и сапфиров (или сапфиров индранила и маханила).", "commentary": {"bhusana": "जालवातायनैर्युक्तं काञ्चनैः स्फाटिकैरपि ।\n\nइन्द्रनीलमहानीलमणिप्रवरवेदिकम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "… скамьи превосходные, / украшенные сапфирами (indranīlamahānīlamaṇipravaravedikam) – в оригинале использованы два слова, indranīla и mahānīla, означающие «сапфир». Голдмены переводят «its raised platforms were set with lovely emeralds and sapphires» (см.: Goldman 1984: 130).", "service": [], "suggestions": [], "seq": 22}, {"id": "lexical:5.9.16:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "indra", "note_ru": "Индра (indra) — Индра (indra «мощный»), царь богов и повелитель грозы; в Сундараканде — мерило высшего могущества («лучший как Индра»). Первое вхождение в кн. V. См. примеч. к II.14.11 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "base", "trigger": "realia", "source": "первое вхождение в кн. V; указатель Гринцера / комментаторы, где процитировано (привязка к стиху, нестрогая)", "source_links": [], "collision_tier1": true, "seq": 23}, {"id": "lexical:5.9.16:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "indranīla", "note_ru": "Индранила (indra-nīla, m./n.) — «синий камень Индры», сапфир (или изумруд в ранних источниках). MW: indranīla 'a sapphire (described as of a dark blue colour resembling the colour of Indra's neck)'. Нила (nīla) = «тёмно-синий, чёрный»; indra здесь — «лучший, первейший», т. е. «лучший из синих камней». В V.9.16 рядом стоит mahānīla («великий нила»), образуя градацию: indranīla (сапфир качества Индры) + mahānīla (ещё более крупный/чистый сапфир). Дублирование синих камней — поэтический приём нагнетания интенсивности: синева павильонов Пушпаки превосходит «просто сапфировую». Ср. V.7.1 vaidūrya — другая категория синеватых камней.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:indranIla+dic_apte:indranIla", "source_links": [{"label": "MW indranIla", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=indranIla"}, {"label": "APTE indranIla", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=indranIla"}], "collision_tier1": true, "seq": 24}]}, {"verse_id": "5.9.17", "verse": "17", "sanskrit_iast": "vidrumeṇa vicitreṇa maṇibhiśca mahāghanaiḥ । nistulābhiśca muktābhis talenābhivirājitam ॥17॥", "leonov_ru": "Выложенным разноцветными кораллами и драгоценными камнями огромной ценности, И несравненными жемчужинами полом сияла она.", "commentary": {"tilaka": "निस्तुलाभिर्वर्तुलाभिर्निरुपमाभिर्वा । तलेन कुट्टिमप्रदेशेन", "bhusana": "विद्रुमेण विचित्रेण मणिभिश्च महाधनैः ।\n\nनिस्तुलाभिश्च मुक्ताभिस्तलेनाभिविराजितम्", "siromani": "विद्रुमादिना निस्तुलाभिः उपमारहिताभिर्मुक्ताभिश्च उपलक्षितेन तलेन कुट्टिमप्रदेशेन अभिविराजितम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Жемчужинами несравненными (nistulābhiśca muktābhis) – автор «Тилаки» предлагает два варианта понимания слова nistulā: «круглая» (vartulā) и «несравненная» (nirupamā).", "service": [], "suggestions": [], "seq": 25}, {"id": "edition:5.9.17:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.9.17–18 (2 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.9.17–18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.9.17", "iast": "vidrumeṇa vicitreṇa maṇibhiśca mahāghanaiḥ । nistulābhiśca muktābhis talenābhivirājitam ॥17॥"}, {"verse_id": "5.9.18", "iast": "candanena ca raktena tapanīyanibhena ca । supuṇyagandhinā yuktam ādityataruṇōpamam ॥18॥"}], "collision_tier1": true, "seq": 26}]}, {"verse_id": "5.9.18", "verse": "18", "sanskrit_iast": "candanena ca raktena tapanīyanibhena ca । supuṇyagandhinā yuktam ādityataruṇōpamam ॥18॥", "leonov_ru": "Красным сандалом, подобным расплавленному золоту Великолепно благоухающая, была она подобна юному (восходящему) солнцу.", "commentary": {"tilaka": "आदित्यतरुणोपमं तरुणादित्यसदृशम्", "bhusana": "चन्दनेन च रक्तेन तपनीयनिभेन च ।\n\nसुपुण्यगन्धिना युक्तमादित्यतरुणोपमम्", "siromani": "तपनीयनिभेन सुवर्णवर्णेन पुण्यगन्धिना रक्तेन चन्दनेन युक्तम् आदित्यतरुणोपमं तरुणादित्यसदृशं पुष्पकं विमानं महाकपिरारुरोह । सार्धश्लोकपञ्चकमेकान्वयि"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "lexical:5.9.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "candana", "note_ru": "Чандана (candana, m./n.) — сандаловое дерево и его древесина; в V.9.18 ракта-чандана («красный сандал»), что специфично. MW: candana 'sandalwood'; raktacandana 'red sandalwood (Pterocarpus santalinus)'. Стандартный «сандал» (śrīkhaṇḍa = Santalum album) — белый или желтоватый; ракта-чандана — совершенно иное дерево (Pterocarpus santalinus), тёмно-красное, не ароматное. В V.9.18 сочетание supuṇyagandhinā + raktacandana противоречиво (красный сандал не благоухает), что либо указывает на поэтическую вольность, либо на другой тип «красного сандала» (некоторые толкователи — śrīkhaṇḍa красноватого оттенка). Подстрочник «красным сандалом» скрывает ботаническую проблему.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:candana+dic_apte:candana", "source_links": [{"label": "MW candana", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=candana"}, {"label": "APTE candana", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=candana"}], "seq": 27}]}, {"verse_id": "5.9.20", "verse": "20", "sanskrit_iast": "divyaṃ sammūrchitaṃ jighran rūpavantam ivānilam । sa gandhas taṃ mahāsattvaṃ bandhur bandhum ivottamam ॥20॥", "leonov_ru": "Обонял, распространившийся вокруг, словно обретший форму ветер. Этот аромат тому наделенному великой силой (Хануману) словно друг – близкому другу,", "commentary": {"siromani": "स इति । यत्र रावणस्तत्र विद्यमानः स गन्धः महासत्त्वं हनूमन्तं बन्धुरुत्तमं बन्धुमिव इतः अत्र एहि इति उवाच इव", "bhusana": "स गन्धस्तं महासत्त्वं बन्धुर्बन्धुमिवोत्तमम् ।\n\nइत एहीत्युवाचेव तत्र यत्र स रावणः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "divyaṃ", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 28}, {"id": "tier1:5.9.20:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Воздух собой напитав (rūpavantam ivānilam) – букв. «подобно ветру, обладающему формой».", "service": [], "suggestions": [], "seq": 29}]}, {"verse_id": "5.9.21", "verse": "21", "sanskrit_iast": "ita ehīty uvāceva tatra yatra sa rāvaṇaḥ । tatas tāṃ prasthitaḥ śālāṃ dadarśa mahatīṃ śubhām ॥21॥", "leonov_ru": "«Иди сюда», словно бы сказал, «Туда, где [находится] Равана». Тогда, направившись [в ту сторону], увидел [Хануман] огромный прекрасный зал,", "commentary": {"tilaka": "यत्र स रावणस्तत्र स्थाने इत एहीत्युवचेव उक्तगुणवायुः कर्ता दिव्यगन्धेन रावणशयनगृहं ज्ञातवानित्यर्थः । ततस्तस्मात्पुष्पकादवरुह्य गन्धानुमितां तां रावणशयनशालां प्रस्थितस्तां शालां ददर्श । यत्तु पुष्पकस्यैव सा शाला तत इत्यस्य तदनन्तरमित्यर्थ इति, तच्चिन्त्यम् प्रस्थित इति पदस्वारस्यात्, अर्धयोजनविस्तीर्णमित्यादिना मूलालयप्रदर्शनोपक्रमाच्च । मूलालयं दृष्ट्वा तद्बहिःस्थं पुष्पकमन्विष्य तत्स्थ एव रावणशयनगृहं तद्गृहवर्त्यनुमाय पुष्पकादवरुह्य तं प्रति स्थितस्तां ददर्शेत्येव न्याय्यमिति कतकः । यत्त्वित्यादिनोक्ता व्याख्यैव युक्तेति मम भाति । \"अवतीर्य विमानाच्च हनुमान्मारुतात्मजः\" इत्यग्रे उपसंहारात्", "bhusana": "ततस्तां प्रस्थितः शालां ददर्श महतीं शुभाम् ।\n\nरावणस्य मनःकान्तां कान्तामिव वरस्त्रियम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "phase2:5.9.21:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tataḥ ... prasthitaḥ śālām", "note_ru": "По Тилаке, здесь спорен сам ход повествования: Катака полагал, что зал, увиденный Хануманом, — часть самой виманы Пушпаки, но Тилака это отвергает, ссылаясь на дальнейшее указание текста («сойдя с виманы»), и настаивает, что Хануман сначала спустился с Пушпаки и лишь затем, следуя за запахом, нашёл опочивальню Раваны.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "содержательный спор о пространственно-повествовательной последовательности (сошёл ли Хануман с виманы до или после того, как увидел зал), решённый Тилакой ссылкой на более позднюю строку текста — ни подстрочник, ни существующие заметки этого не отражают.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 30}]}, {"verse_id": "5.9.24", "verse": "24", "sanskrit_iast": "vibhūṣitāṃ maṇistambhaiḥ subahustambhabhūṣitām । samair ṛjubhir atyuccaiḥ samantāt suvibhūṣitaiḥ ॥24॥", "leonov_ru": "Был он украшен колоннами из драгоценных камней, был он украшен множеством колонн, Ровных, прямых, очень высоких, со всех сторон хорошо украшенных.", "commentary": {"bhusana": "समैर्ऋजुभिरत्युच्चैः समन्तात् सुविभूषितैः ।\n\nस्तम्भैः पक्षैरिवात्युच्चैर्दिवं संप्रस्थितामिव\nअत्युच्चैः अत्यन्तोन्नतैः । दिवम् आकाशम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.24:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Множеством колонн украшенную (subahustambhabhūṣitām) – по мнению автора «Тилаки», повторение слова stambha (колонна) подчеркивает их большое количество и высоту.", "service": [], "suggestions": [], "seq": 31}]}, {"verse_id": "5.9.25", "verse": "25", "sanskrit_iast": "stambhaiḥ pakṣair ivātyuccair divaṃ samprasthitām iva । mahatyā kuthayāstrīṇaṃ pṛthivīlakṣaṇāṅkayā ॥25॥", "leonov_ru": "Очень высокими колоннами, словно крыльями, он словно бы возносился в небо. Был он покрыт огромным ковром, [четырехугольным] подобно земле,", "commentary": {"tilaka": "अत्युच्चैः पक्षैरिवात्युच्चैः स्तम्भैर्दिवं संप्रस्थितामिवेत्युत्प्रेक्षात्र । कुथया विशालविचित्रकम्भलास्तरणेन । पृथिवीलक्षणं चतुरस्त्रत्वम्", "bhusana": "महत्या कुथया ऽ ऽस्तीर्णां पृथिवीलक्षणाङ्कया ।\n\nपृथिवीमिव विस्तीर्णां सराष्ट्रगृहमालिनीम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Подобьем Земли расшитым (pṛthivīlakṣaṇāṅkayā) – в комментарии «Широмани» композит pṛthivīlakṣaṇa поясняется как «имеющий линии, отображающие деревья, потоки, океан и т. п.». В комментарии «Тилака» он истолковывается как «четырехугольность» (caturasratvam).", "service": [], "suggestions": [], "seq": 32}]}, {"verse_id": "5.9.26", "verse": "26", "sanskrit_iast": "pṛthivīm iva vistīrṇāṃ sarāṣṭragṛhaśālinīm । nāditāṃ mattavihagair divyagandhādhivāsitām ॥26॥", "leonov_ru": "Обширным, словно земля с царствами и городами. Звучали [в том зале] голоса влюбленных птиц и напоен был воздух чудесными благовониями.", "commentary": {"tilaka": "सराष्ट्रगृहशालिनीमिति पृथिवीविशेषणम्", "bhusana": "नादितां मत्तविहगैर्दिव्यगन्धाधिवासिताम् ।\n\nपरार्घ्यास्तरणोपेतां रक्षोधिपनिषेविताम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "С царствами и городами (sarāṣṭragṛhaśālinīm) – букв. «с царствами и домами». В критическом издании дан вариант sarāṣṭragṛhamālinīm (см.: Jhala 1966: 85), что Голдмены переводят как «с сельской местностью и городами» (with its towns and countryside»), трактуя композит gṛhamāla как «скопления зданий» (см.: Goldman 1984: 360).", "service": [], "suggestions": [], "seq": 33}]}, {"verse_id": "5.9.27", "verse": "27", "sanskrit_iast": "parārdhyāstaraṇopetāṃ rakṣo'dhipaniṣevitām । dhūmrām agurudhūpena vimalāṃ haṃsapāṇḍurām ॥27॥", "leonov_ru": "Покрытый великолепным ковром, место обитания владыки ракшасов, Окутанный дымом алоэ, но чистый и белый словно гусь.", "commentary": {"tilaka": "हंसपाण्डुरां हंसवत्पाण्डुराम्", "bhusana": "धूम्रामगरुधूपेन विमलां हंसपाण्डुराम् ।\n\nचित्रां पुष्पोपहारेण कल्माषीमिव सुप्रभाम्\nकल्माषीं शबलवर्णाम्, वसिष्ठधेनुमिव सर्वकामप्रदत्वेन कल्माषीसादृश्यम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "lexical:5.9.27:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "aguru", "note_ru": "Агуру (aguru, n./m.) — алоэ-дерево (Aquilaria agallocha / A. malaccensis), один из ценнейших ароматических материалов древней Индии. MW: aguru 'not heavy; the fragrant Aloe wood'. Апте: 'the Agallochum tree (Aquilaria Agallocha)'. Этимология народная: a+guru = «нетяжёлый» (древесина смоляных сортов алоэ тонет — вопреки названию). Aguru-dhūpa («воскуривание агуру») — стандартный ритуальный и придворный ароматизатор высшего класса; dhūpa от √dhū- («дымить, курить»). В V.9.27 дворец одновременно dhūmra (сизый от дыма) и vimala (чистый) — противоречие, разрешаемое через качество агуру: его дым считается ритуально очищающим, а не оскверняющим.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:aguru+dic_apte:aguru", "source_links": [{"label": "MW aguru", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=aguru"}, {"label": "APTE aguru", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=aguru"}], "seq": 34}]}, {"verse_id": "5.9.28", "verse": "28", "sanskrit_iast": "patrapuṣpopahāreṇa kalmāṣīm iva suprabhām । manaso modajananīṃ varṇasyāpi prasādhinīm ॥28॥", "leonov_ru": "Словно пятнистая корова Индры прекрасный дарами в виде листьев и цветов Рождающий радость в душе, вызывающий прекрасный цвет тела.", "commentary": {"tilaka": "कल्माषी शबलवर्णां वसिष्ठगौः । अनेन सर्वानन्ददायित्वं रिपूणामधृष्यत्वं च सर्वमनोरथपूरकत्वं च सूच्यते । वर्णस्य देहकान्तेः प्रसाधिनीं संपादिकाम्", "bhusana": "मनस्संह्लादजननीं वर्णस्यापि प्रसाधिनीम् ।\n\nतां शोकनाशिनीं दिव्यां श्रियः स़ञ्जननीमिव\nवर्णस्यापि प्रसाधिनीम् वर्णोत्कर्षकरीमित्यर्थः । तां शोकनाशिनीमिति । ततस्तामिति वर्तमाने पुनस्तच्छब्द उपसंहारार्थः । तां प्रति प्रस्थितः ददर्शेति वा संबन्धः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.28:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Подобный пестрой корове (kalmāṣīm iva suprabhām) – Имеется в виду корова мудреца Васиштхи. Автор «Тилаки» поясняет, что покой Раваны был недоступен для врагов, даровал радость и исполнял все желания.А с ней расцветало и тело (varṇasyāpi prasādhinīm) – в «Тилаке» слово varṇa толкуется как dehakānti, то есть красота тела или прекрасный цвет тела.", "service": [], "suggestions": [], "seq": 35}, {"id": "edition:5.9.28:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.9.28 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.9.28", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.9.28", "iast": "patrapuṣpopahāreṇa kalmāṣīm iva suprabhām । manaso modajananīṃ varṇasyāpi prasādhinīm ॥28॥"}], "collision_tier1": true, "seq": 36}]}, {"verse_id": "5.9.29", "verse": "29", "sanskrit_iast": "tāṃ śokanāśinīṃ divyāṃ śriyaḥ saṃjananīm iva । indriyāṇīndriyārthais tu pañca pañcabhir uttamaiḥ ॥29॥", "leonov_ru": "Уничтожал он печаль, был чудесен, словно был источником процветания, Пять чувств он пятью превосходными объектами чувств", "commentary": {"tilaka": "तां शालां ददर्शेति पूर्वेण संबन्धः । पञ्चभिरिन्द्रियार्थैः शब्दस्पर्शरूपसगन्धैः पञ्चेन्द्रियाणि श्रोत्रत्वक्चक्षूरसनघ्राणानि तर्पयामास हनुमत इति शेषः । रावणपालिता शालेति शेषः । स्वर्गो ज्योतिष्टोमादिकफलभोगभूमिः देवलोको वायुवरुणादिलोकः इन्द्रस्य पुर्यमरावती", "siromani": "इन्द्रियाणीति । तदा रावणपालिता शाला पञ्चभिरिन्द्रियार्थैः शब्दस्पर्शरूपरसगन्धैः पञ्चेन्द्रियाणि श्रोत्रत्वक्चक्षूरसनाघ्राणानि मातेव तर्पयामास", "bhusana": "इन्द्रियाणीन्द्रियार्थैस्तु पञ्च प़ञ्चभिरुत्तमैः ।\n\nतर्पयामास मातेव तदा रावणपालिता\nइन्द्रियाणीति, हनुमत इति शेषः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.29:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "И множеством дивных вещейВсю пятерицу чувств", "kind": "note", "text": "Нужен комм"}], "suggestions": [], "seq": 37}, {"id": "lexical:5.9.29:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śoka", "note_ru": "Горе / скорбь (śoka) — śoka — «горе», «скорбь»; в теории рас — основа каруṇa (сочувственной) расы. В речах Ситы — ключевое переживание разлуки (viraha-śoka).", "type": "А", "subtype": "base", "trigger": "term", "source": "первое вхождение в кн. V; указатель Гринцера / комментаторы, где процитировано (привязка к стиху, нестрогая)", "source_links": [], "collision_tier1": true, "seq": 38}, {"id": "lexical:5.9.29:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "indriya", "note_ru": "Индрия (indriya, n.) — «орган чувства, чувственная способность», от Indra: «принадлежащее/подчинённое Индре». MW: indriya 'fit for an Indra; a mark of royalty; the power of the senses; organ of sense'. Неожиданная этимология: органы чувств = «принадлежащие Индре», ибо Индра — бог могущества (indriyaśakti). В философии санкхьи и йоги indriyāṇi (10 органов: 5 jñānendriya + 5 karmendriya) — центральная категория. В V.9.29 буквально: «пять чувств пятью наилучшими объектами чувств» — формула полного чувственного насыщения, созданная Равановым дворцом. Термин indriya здесь переходит из повседневного в философский регистр: подстрочник («пять чувств») скрывает специальный санкхья-контекст.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:indriya+dic_apte:indriya", "source_links": [{"label": "MW indriya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=indriya"}, {"label": "APTE indriya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=indriya"}], "collision_tier1": true, "seq": 39}]}, {"verse_id": "5.9.30", "verse": "30", "sanskrit_iast": "tarpayām āsa māteva tadā rāvaṇapālitā । svargo 'yaṃ devaloko 'yam indrasyāpi purī bhavet । siddhir veyaṃ parā hi syād ity amanyata mārutiḥ ॥30॥", "leonov_ru": "Насыщал словно мать тогда, охраняемый Раваной. «Это, должно быть небеса! Мир богов! Город Индры! Или это, должно быть, иллюзия (майя) гандхарвов» - подумал сын ветра.", "commentary": {"tilaka": "परा गान्धर्वी सिद्धिस्तन्मायेत्यर्थः", "siromani": "स्वर्ग इति । मारुतिः अयं स्वर्गो भवेदित्याद्यमन्यत", "bhusana": "स्वर्गो ऽयं देवलोको ऽयमिन्द्रस्येयं पुरी भवेत् ।\n\nसिद्धिर्वेयं परा हि स्यादित्यमन्यत मारुतिः\nस्वर्गो ऽयमिति । सामान्यतः स्वर्गो ऽयम् । तत्रापि देवलोकः त्रयस्त्रिंशद्देवानां लोकः । तत्रापीन्द्रस्य पुरी अमरावती । परा सिद्धिः ब्रह्मणः स्थानमित्युत्तरोत्तरोत्कर्षः\nमुक्ताहारावृताः मुक्ताहारैरावृताः, छिन्नमुक्ताहारा इत्यर्थः । व्याविद्धरशनादामाः छिन्नकाञ्चीगुणाः । किशोर्यः प्रथमवयस्का वडवाः । वाहिताः मार्गश्रमनिवृत्त्यर्थं भूमौ प्रवेष्टनं कारिताः । सर्वत्र रेजुरित्यन्वयः ।। 5.9.47,48।।\n\nचन्द्रांशुकिरणाभाश्च हाराः कासांचिदुत्कटाः ।\n\nहंसा इव बभुः सुप्ताः स्तनमध्येषु योषिताम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Или волшба гандхарвов (siddhir veyaṃ parā hi syād) – в «Тилаке» выражение siddhiḥ parā толкуется как gāndharvī mayā (волшебство гандхарвов). В других комментариях («Бхушана», «Таттвадипика») это выражение понимается как «высшее совершенство». Голдмены переводят его как «the highest goal of perfection» (см.: Goldman 1984: 131).", "service": [], "suggestions": [], "seq": 40}, {"id": "lexical:5.9.30:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "siddhi", "note_ru": "Сиддхи (siddhi, f.) — «осуществление, совершенство, мистическое достижение»; от √sidh- («достигать, осуществляться», Whitney). MW: siddhi 'accomplishment, fulfilment, success; the acquisition of supernatural powers by magical means'. В V.9.30 Хануман думает: «это — svarga! это — devaloka! siddhir veyaṃ parā — или это высшая siddhi [гандхарвов]?» Здесь siddhi в значении «иллюзия, магическое создание» (сиддхи как плод магического искусства). Это важнее подстрочника: «иллюзия (майя) гандхарвов» — переводческая интерпретация, siddhi в оригинале многозначнее; имеется в виду «мистическое достижение», которое может быть принято за реальность.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:sidDi+dic_apte:sidDi", "source_links": [{"label": "MW sidDi", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=sidDi"}, {"label": "APTE sidDi", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=sidDi"}], "collision_tier1": true, "seq": 41}, {"id": "lexical:5.9.30:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "svarga / devaloka", "note_ru": "Сварга (svarga, m.) / девалока (devaloka, m.) — мир богов; введено в Рам. I.1.83 (Гринцер). В V.9.30 Хануман, осматривая дворец Раваны, восклицает: svargo 'yam devaloko 'yam indrasyapi puri bhavet — «Это сварга! Это девалока! Это пура самого Индры!» Формула восторга через отождествление с небесными мирами. В эпической космологии сварга — третий из семи миров: выше земли (bhu), но ниже миров Брахмы; достигается праведными делами или тапасом и временна (punyal ksaya — «исчерпание заслуги» — ведёт к возвращению). Восторг Ханумана косвенно свидетельствует о мощи Раваны: его дворец достиг роскоши, доступной лишь в состоянии загробного воздаяния.", "type": "Г", "subtype": "hist_cultural", "trigger": "myth_background", "source": "Рам. I.1.83 (Гринцер)", "source_links": [], "collision_tier1": true, "seq": 42}]}, {"verse_id": "5.9.31", "verse": "31", "sanskrit_iast": "pradhyāyata ivāpaśyat pradīpāṃs tatra kāñcanān । dhūrtān iva mahādhūrtair devanena parājitān ॥31॥", "leonov_ru": "Смотрел он на словно бы погруженные в размышления золотые светильники, Подобные игрокам, которые были обыграны в кости великими игроками.", "commentary": {"tilaka": "प्रध्यायतो ध्याननिष्ठान् । धूर्तो ऽक्षदेवनस्तत्रातिसमर्थो महाधूर्तः महाधूर्तेन देवनेन पराजितो हि धूर्तो धननाशाद्ध्यायन्निवास्ते काञ्चनान्दीपान्काञ्चनदीपस्तम्भस्थदीपान् विपुलदीपाग्रे क्षुद्रदीपप्रभा इव रावणतेजोभिभूतानपश्यदित्यर्थः", "siromani": "प्रध्यायत इति । काञ्चनान् काञ्चनमयान् प्रदीपान् मङ्गलार्थं स्तम्भप्रदेशेषु संस्थापितदीपान् देवनेन द्यूतेन महाधूर्तैः अतिवञ्चितैः पराजितान् अत एव ध्यायतः धनविध्वंसात् नयननिमीलनादिचेष्टया ध्यानमिव कुर्वतो धूर्तानिव अपश्यत् । रावणातितेजसा पराभूतत्वात् दीपा न प्रकाशन्ते इत्यर्थः", "bhusana": "प्रध्यायत इवापश्यत् प्रदीपांस्तत्र काञ्चनान् ।\n\nधूर्तानिव महाधूर्तैर्देवनेन पराजितान्\nप्रध्यायत इति । प्रध्यायत इव निश्चलतया प्रकृष्टध्यानयुक्तानिव । धूर्तान् अक्षधूर्तान् । देवनेन द्यूतेन"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.31:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Будто бы игроки, / Что проигрались в кости (dhūrtān iva mahādhūrtair devanena parājitān) – букв. «словно бы игроки, потерпевшие поражение от [более] великих игроков». В комментарии «Бхушана» говорится, что речь идет о неподвижности пламени светильников. Другие комментаторы (в частности, автор «Тилаки») полагает, что сияние светильников затмевалось блеском самого Раваны.", "service": [], "suggestions": [], "seq": 43}]}, {"verse_id": "5.9.33", "verse": "33", "sanskrit_iast": "tato 'paśyat kuthāsīnaṃ nānāvarṇāmbarasrajam । sahasraṃ varanārīṇāṃ nānāveṣavibhūṣitam ॥33॥", "leonov_ru": "Тогда он увидел сидящих на ковре в одеждах и гирляндах разнообразных цветов Тысячу прекрасных женщин в разнообразных одеждах и украшениях.", "commentary": {"tilaka": "कुथासीनमास्तीर्णकुथायां शयानम्", "bhusana": "ततो ऽपश्यत्कुथासीनं नानावर्णाम्बरस्रजम् ।\n\nसहस्रं वरनारीणां नानावेषविभूषितम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.33:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "В ярких венках и одеждах (nānāvarṇāmbarasrajam) – букв. «в одеждах и венках разнообразных цветов».", "service": [], "suggestions": [], "seq": 44}]}, {"verse_id": "5.9.36", "verse": "36", "sanskrit_iast": "tāsāṃ saṃvṛtadantāni mīlitākṣīṇi mārutiḥ । apaśyat padmagandhīni vadanāni suyoṣitām ॥36॥", "leonov_ru": "Сын ветра смотрел на лица этих прекрасных женщин, С закрытыми ртами (скрытыми зубами), закрытыми глазами, благоухающие подобно лотосам.", "commentary": {"siromani": "तासामिति । संवृता आच्छादिता दन्ता येषु तानि सुयोषितां वदनानि अपश्यत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.36:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Их глаза и уста сомкнулись (tāsāṃ saṃvṛtadantāni mīlitākṣīṇi… vadanāni) – букв. «лица с сомкнутыми зубами и закрытыми глазами».", "service": [], "suggestions": [], "seq": 45}]}, {"verse_id": "5.9.38", "verse": "38", "sanskrit_iast": "imāni mukhapadmāni niyataṃ mattaṣaṭpadāḥ । ambujānīva phullāni prārthayanti punaḥ punaḥ ॥38॥", "leonov_ru": "«Эти лица-лотосы постоянно опьяненные пчелы Словно лотосы раскрывшиеся преследуют снова и снова»,", "commentary": {"bhusana": "इमानि मुखपद्मानि नियतं मत्तषट्पदाः ।\n\nअम्बुजानीव फुल्लानि प्रार्थयन्ति पुनः पुनः", "siromani": "इमानीति । इमानि प्रदृश्यमानानि मुखपद्मानि फुल्लानि अम्बुजानीव षट्पदाः पुनः पुनः प्रार्थयन्ति नित्यं तत्र स्थातुं प्रयाचन्त इत्यर्थः, इत्येव अमन्यत अन्वमिनोत् । अत एव तानि वदनानि उपपत्त्या ऽनुमानयुक्त्या सलिलोद्भवैः कमलैः समानि मेने । अर्धचतुष्टयमेकान्वयि ।। 5.9.38,39 ।।\n\nसेति । स्त्रीभिर्विराजिता शाला ताराभिरभिशोभिता द्यौरिव शुशुभे"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "lexical:5.9.38:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ṣaṭpada", "note_ru": "Шатпада (ṣaṭ-pada, m.) — «шестиногий» = пчела. MW: ṣaṭpada 'a bee (having six legs); a locust'. Апте: 'a bee or any six-legged insect'. Обозначение пчелы через счётный описательный эпитет (ṣaṭ «шесть» + pada «нога»), а не через madhukara или bhramara — выбор риторически значимый: в V.9.38 пчёлы названы mattaṣaṭpadāḥ («опьянённые шестиногие»), что создаёт параллель с уснувшими женщинами (также «во власти питья»). Pun скрыт в обоих «опьянениях»: пчёлы опьянены нектаром цветов, женщины — вином. В переводе «опьянённые пчелы» теряет двойной образ шестиногости/опьянения.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:zawpada", "source_links": [{"label": "MW zawpada", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=zawpada"}], "seq": 46}]}, {"verse_id": "5.9.3941", "verse": "3941", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"tilaka": "उपपत्त्या युक्त्या । सलिलोद्भवैः पद्मैः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.3941:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "guṇatas", "kind": "omission", "text": "опущено"}], "suggestions": [], "anchor_verse_id": "5.9.39", "seq": 47}]}, {"verse_id": "5.9.42", "verse": "42", "sanskrit_iast": "yāś cyavante 'mbarāt tārāḥ puṇyaśeṣasamāvṛtāḥ । imās tāḥ saṃgatāḥ kṛtsnā iti mene haris tadā ॥42॥", "leonov_ru": "Тогда подумала обезьяна: «Упавшие с неба, но сохранившие часть заслуг (чистоты) звезды Все собрались [здесь]».", "commentary": {"tilaka": "पुण्यशेषसमावृतास्तद्युक्ताः सङ्गता एकदेशमिलिताः अनेन सौन्दर्यात्युक्तिरूपो ऽत्युक्त्यलङ्कारः\nव्यावृत्ताः कचाः पीनस्रजश्च यासां ताश्च प्रकीर्णानीतस्ततः श्लथानि वरभूषणानि यासां ताः पानव्यायामकालेषु पानान्तरकालिकगाननृत्यरत्यादिक्रीडाकालेषूक्तगुणाः, अत एव श्रमान्निद्रोपहतचेतसः", "siromani": "या इति । तदा तस्मिन् काले पुण्यशेषसमावृता भोगावशिष्टपुण्यैर्युक्ता यास्तारा अम्बरात् स्वर्गात् च्यवन्ते ता एव कृत्स्नाः सकला इमाः प्राप्ता इति हरिर्हनुमान् मेने", "bhusana": "याश्च्यवन्ते ऽम्बरात्ताराः पुण्यशेषसमावृताः ।\n\nइमास्ताः सङ्गताः कृत्स्ना इति मेने हरिस्तदा"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.42:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Звезды, что с неба упали (yāś cyavante 'mbarāt tārāḥ) – букв. «звезды, которые падают с неба». В древней Индии считалось, что падающие звезды – это небесные существа, которые падают на Землю, поскольку исчерпали религиозные заслуги, позволившие им обрести место на небесах.", "service": [], "suggestions": [], "seq": 48}]}, {"verse_id": "5.9.43", "verse": "43", "sanskrit_iast": "tārāṇām iva suvyaktaṃ mahatīnāṃ śubhārciṣām । prabhāvarṇaprasādāś ca virejus tatra yoṣitām ॥43॥", "leonov_ru": "Очень ярко, подобно огромным прекрасно-лучистым звездам, Сияла там красота женщин.", "commentary": {"siromani": "ताराणामिति । महतीनां ताराणां प्रभा वर्णप्रसादा इव योषितां प्रभावर्णप्रसादा विरेजुः", "bhusana": "ताराणामिव सुव्यक्तं महतीनां शुभार्चिषाम् ।\n\nप्रभावर्णप्रसादाश्च विरेजुस्तत्र योषिताम्\nताराणामिति । प्रभा कान्तिः । वर्णः रूपम् । प्रसादः प्रसन्नता"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.43:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Женщины здесь сияли / Ослепительной красотою (prabhāvarṇaprasādāś ca virejus tatra yoṣitām) – композит prabhāvarṇaprasādāḥ комментаторы интерпретируют как «красота тела» (dehakāntiḥ), «прекрасная форма» (rūpa) и «сияние» (aujjvalya).", "service": [], "suggestions": [], "seq": 49}]}, {"verse_id": "5.9.44", "verse": "44", "sanskrit_iast": "vyāvṛttakacapīnasrakprakīrṇavarabhūṣaṇāḥ । pānavyāyāmakāleṣu nidropahṛtacetasaḥ ॥44॥", "leonov_ru": "С волосами, которые были распущены, с растрепавшимися пышными гирляндами, с разбросанными превосходными украшениями Во время питья и [любовных] утех (упражнений), с душами, охваченными сном,", "commentary": {"siromani": "व्यावृत्तेति । पानव्यायामकालेषु पानकालेषु अधररसपानसमयेषु व्यायामकालेषु रतिसमयेषु व्यावृत्ता मर्दिताः कुचाः पीनस्रजश्च यासां ता अत एव प्रकीर्णानि परिक्षिप्तानि वरभूषणानि यासां ताः । द्वयोः कर्मधारयः । निद्रोपहतचेतसः बभूवुरिति शेषः", "bhusana": "व्यावृत्तगुरुपीनस्रक्प्रकीर्णवरभूषणाः ।\n\nपानव्यायामकालेषु निद्रापहृतचेतसः\nव्यावृत्तेति । पानव्यायामकालेषु पानानन्तरं भाविरतिव्यापारसमयेषु । व्यावृत्तगुरुपीनस्रक्प्रकीर्णवरभूषणाः विपर्यस्तगुरुपीनस्रजः प्रकीर्णवरभूषणाश्च सत्यः निद्रापहृतचेतसः विरेजुः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.44:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Их волосы были распущены, / Растрепались гирлянды пышные (vyāvṛttakacapīnasrakprakīrṇavarabhūṣaṇāḥ) – букв. «у них, чье сознание было охвачено сном после питья и развлечений (в «Тилаке» отмечается, что подразумеваются пение, танцы, любовные утехи и тому подобное), растрепались волосы и пышные гирлянды, рассыпались великолепные украшения».", "service": [{"author": "Е. Костина", "lemma_iast": ".", "kind": "note", "text": "Комм сформулирован так, что читатель может не понять, что в в переводе просто опушена строка, и начать думать о том, как «замутненное сознание» превратилось в распущенные волосы"}], "suggestions": [], "seq": 50}]}, {"verse_id": "5.9.45", "verse": "45", "sanskrit_iast": "vyāvṛttatilakāḥ kāś cit kāś cid udbhrāntanūpurāḥ । pārśve galitahārāś ca kāś cit paramayoṣitaḥ ॥45॥", "leonov_ru": "У некоторых были размазаны тилаки, у некоторых сбились (слетели) ножные браслеты, А у некоторых прекрасных женщин ожерелья сбились набок.", "commentary": {"tilaka": "उक्तं भूषणप्रकिरणमेव प्रपञ्चयति-- व्यावृत्तेति । उद्भ्रान्ताः स्वस्थानात्स्खलिता नूपुरा यासां ताः । पार्श्वे एकस्मिन्गलिता विस्रस्ता हारा यासां ताः", "siromani": "व्यावृत्तेति । काश्चित् व्यावृत्तानि अपमार्जितानि तिलकानि सिन्दूरकस्तूर्यादिरेखा यासां ताः काश्चित् उद्भ्रान्ताः स्वस्थानात्प्रस्खलिताः नूपुराः यासां ताः काश्चित् पार्श्वे समीपे गलितहाराश्च परमयोषितो दृश्यन्त इति शेषः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.45:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "термин", "accounted": "не учтено", "text": "Первое появление в кн. V; введено в Рамаяна II. 9. 49: Тилака (tilaka) — кружок на лбу, наносимый обычно краской или мазью и служащий украшением или знаком касты.", "incomplete": false}], "seq": 51}, {"id": "lexical:5.9.45:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tilaka", "note_ru": "Тилака (tilaka, m./n.) — украшение на лбу, нанесённое пастой (сандал, киноварь, пепел); термин означает также дерево Clerodendrum phlomoides с пятнистой корой. MW: tilaka 'a mark on the forehead made with coloured earths, unguents or soot'. Тилака на лбу женщины в эпосе — специфически свадебный / брачный маркер (как и верхний пробор — sindūra); ненанесённая или размазанная тилака = маркер беспорядка или не-замужнего состояния. В V.9.45 vyāvṛttatilakāḥ («с размазанными тилаками») — деталь, сигнализирующая о нарушении ритуального этикета: женщины, уснувшие после пирушки, утратили знак своего statusa. Подстрочник («размазаны тилаки») передаёт явление, но не семиотику.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:tilaka+dic_apte:tilaka", "source_links": [{"label": "MW tilaka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=tilaka"}, {"label": "APTE tilaka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=tilaka"}], "collision_tier1": true, "seq": 52}, {"id": "lexical:5.9.45:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nūpura", "note_ru": "Нупура (nūpura, m./n.) — браслет на ноге/лодыжке с вделанными бубенчиками. MW: nūpura 'a foot-ring, an ornament worn round the ankle or foot (consisting of a small bell or a ring of bells)'. Апте: 'a tinkling anklet'. В отличие от kaṭaka (запястный браслет) и haṃsa-nūpura (статичное кольцо), nūpura специфически звучащий: именно его звон — эротически и поэтически значимый звук танцующей женщины в натьяшастровой традиции. V.9.45 udbhrāntanūpurāḥ («с выскочившими/улетевшими nūpura») — важная деталь: спящие женщины потеряли не просто украшение, а звуковой атрибут своей идентичности как танцовщиц/возлюбленных.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:nUpura+dic_apte:nUpura", "source_links": [{"label": "MW nUpura", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=nUpura"}, {"label": "APTE nUpura", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=nUpura"}], "collision_tier1": true, "seq": 53}]}, {"verse_id": "5.9.46", "verse": "46", "sanskrit_iast": "muktāhāravṛtāś cānyāḥ kāś cit prasrastavāsasaḥ । vyāviddharaśanādāmāḥ kiśorya iva vāhitāḥ ॥46॥", "leonov_ru": "У некоторых порвались ожерелья, с некоторых свалилась одежда, У некоторых порвались пояса, и они были подобны кобылицам, утомленным тяжкой ношей.", "commentary": {"tilaka": "मुक्ताहारैर्वृताः छिन्नमुक्ताहाराः व्याविद्धं विक्षिप्तं रशनादाम काञ्चीगुणो यासां ताः । एवं भूषणबन्धराहित्येन शयने उपमा । वाहिताः किशोर्य इव कृतभारवहनाः श्रान्ताः किशोर्यो वडवा यथाध्वश्रमापनयनाय लुण्ठनेन व्यत्यस्तपल्ययनबन्धाः शेरते तद्वत्", "bhusana": "व्यावृत्ततिलकाः काश्चित् काश्चिदुद्भ्रान्तनूपुराः ।\n\nपार्श्वे गलितहाराश्च काश्चित् परमयोषितः\nव्यावृत्ततिलकाः उन्मृष्टतिलकाः । उद्भ्रान्तनूपुराः स्वस्थानानवस्थितनूपुराः\nमुक्ताहारावृताश्चान्याः काश्चिद्विस्रस्तवाससः ।\n\nव्याविद्धरशनादामाः किशोर्य इव वाहिताः", "siromani": "मुक्तेति । अन्याः मुक्ताहारैर्वृताः आच्छन्नाः केशादिग्रथितमुक्ताहारवत्य इत्यर्थः, काश्चित्प्रशस्तवाससः प्रच्युतवसनाः काश्चिद्व्याविद्धरशनादामाः प्रच्युतकाञ्चीगुणा अत एव वाहिताः प्रपतितभाराः किशोर्यः वडवा इव यथोत्तारितभारा वडवा निर्मुक्तबन्धनाः सत्यः श्रमापनयनाय भुवि लुठन्ति तथा अदृश्यन्तेति शेषः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.46:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Разорвались пояса, / Как поводья у кобылицы (vyāviddharaśanādāmāḥ kiśorya iva vāhitāḥ) – слово raśanā означает и «пояс» и «поводья, узда».", "service": [{"author": "Е. Костина", "lemma_iast": "Разорвались пояса,Были они похожи на кобылиц утомленных", "kind": "note", "text": "Непонятно, почему у утомленных кобыл рвутся поводья. Нет такой логической связки: кобыла устала, поводья порвались. Мне кажется, более понятным будет образ распряженной уставшей лошади. Г-пресс вообще не связывает пояса с поводьями: пояса у них разорвались, и вообще они были похожи на притащивших груз молодых кобылок."}], "suggestions": [], "seq": 54}, {"id": "phase2:5.9.46:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kiśoryaḥ ... vāhitāḥ", "note_ru": "По Тилаке, сравнение работает иначе, чем может показаться: не пояса рвутся от усталости кобылиц, а обессиленные от переноски груза молодые кобылицы, катаясь по земле, чтобы снять усталость пути, сами расстраивают свою упряжь — так же, как спящие женщины в беспорядке своих одежд и поясов.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "разрешает именно ту логическую неясность сравнения, которую отметила Е. Костина в собственном примечании Леонова/Костиной («непонятно, почему у уставших кобыл рвутся поводья») — даёт механику образа, которой нет в их заметке.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 55}]}, {"verse_id": "5.9.49", "verse": "49", "sanskrit_iast": "aparāsāṃ ca vaidūryāḥ kādambā iva pakṣiṇaḥ । hemasūtrāṇi cānyāsāṃ cakravākā ivābhavan ॥49॥", "leonov_ru": "А у других изумрудные ожерелья были подобны птицам кадамба (вид гуся), А у других золотые цепочки были подобны чакравакам.", "commentary": {"tilaka": "वैदूर्या वैदूर्यमणिमालाः कादम्बाः कलहंसाः अत्र कादम्बशब्देन कारण्डवपदवाच्यो जलकाक उच्यते । अन्यथा वैदूर्योपमानत्वमसङ्गतं स्यात् । हेमसूत्राणि च अत्रापि स्तनमध्योद्गतानीत्यनुकर्षः । चक्रवाकानां\n\nपीतत्वसादृश्यादुपमानत्वम्", "siromani": "अपरासामिति । अपरासां वैदूर्याः वैडूर्यहाराः कादम्बाः जलकाकाः पक्षिण इव अभवन् । अन्यासां हेमसूत्राणि चक्रवाका इव पीतत्वेन चक्रवाकसदृशाः अभवन्", "bhusana": "अपरासां च वैडुर्याः कादम्बा इव पक्षिणः ।\n\nहेमसूत्राणि चान्यासां चक्रवाका इवाभवन्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "lexical:5.9.49:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "cakravāka", "note_ru": "Чакравака (cakravāka, m.) — Ruddy Shelduck (Tadorna ferruginea), в русской традиции «огарь»; в санскритской поэзии — символ разлучённых влюблённых. MW: cakravāka 'a kind of bird (the Brahmany duck, Anas Casarca; the male and female are supposed to be separated every night)'. Этимология: cakra «колесо» + vāka / vāc «голос» — «та, чей голос (крик) — колесо [разлуки]». Согласно эпической и пуранической конвенции, чакраваки разлучаются на ночь и перекликаются через водоём; это делает их универсальным образом viraha (любовной разлуки). В V.9.49–50 упоминание cakravāka рядом со спящими женщинами Раваны создаёт незаметный иронический подтекст: женщины, покорённые Раваной, живут как чакраваки — в любовной тоске без воссоединения.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:cakravAka+dic_apte:cakravAka", "source_links": [{"label": "MW cakravAka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=cakravAka"}, {"label": "APTE cakravAka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=cakravAka"}], "seq": 56}]}, {"verse_id": "5.9.50", "verse": "50", "sanskrit_iast": "haṃsakāraṇḍavākīrṇāś cakravākopaśobhitāḥ । āpagā iva tā rejur jaghanaiḥ pulinair iva ॥50॥", "leonov_ru": "С бедрами, подобными отмелям, были подобны они рекам, Изобилующим гусями и утками, украшенным чакраваками,", "commentary": {"siromani": "हंसेति । पुलिनैरिव जघनैरुपलक्षिताः ताः स्त्रियः हंसैः कारण्डवैर्जलकाकैश्चोपेताः चक्रवाकोपशोभिताः आपगा नद्य इव रेजुः", "bhusana": "हंसकारण्डवाकीर्णाश्चक्रवाकोपशोभिताः ।\n\nआपगा इव ता रेजुर्जघनैः पुलिनैरिव"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.50:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Где во множестве плавают / Гуси, утки и чакраваки (haṃsakāraṇḍavākīrṇāś cakravākopaśobhitāḥ) – букв. «наполненные гусями и утками, украшенные чакраваками». В комментарии «Тилака» отмечается, что с водоплавающими птицами сравниваются украшения различных цветов.", "service": [], "suggestions": [], "seq": 57}]}, {"verse_id": "5.9.52", "verse": "52", "sanskrit_iast": "mṛduṣv aṅgeṣu kāsāṃ cit kucāgreṣu ca saṃsthitāḥ । babhūvur bhūṣaṇānīva śubhā bhūṣaṇarājayaḥ ॥52॥", "leonov_ru": "У некоторых на нежных членах тела и на сосках находящиеся Прекрасные отметины [от любовных игр] были подобны украшениям.", "commentary": {"tilaka": "कूटागारैर्गुप्तस्वल्पगृहैः शुभागारैर्विहारयोग्यगृहैः", "siromani": "मृदुष्विति । कासाञ्चित् पतितभूषणानामित्यर्थः, कुचाग्रेषु संस्थिताः भूषणराजयः भूषणजनितरेखा भूषणानीव बभूवुः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.52:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Отметины, что остались / После забав любовных (mṛduṣv aṅgeṣu kāsāṃ cit kucāgreṣu ca saṃsthitāḥ śubhā bhūṣaṇarājayaḥ) – в «Тилаке» композит bhūṣaṇarājayaḥ поясняется как «полосы, возникшие из-за царапания» (vimardajanitarēkhāḥ). Следы, оставленные ногтями возлюбленного, часто описывались в санскритской литературе как украшение женщины.", "service": [], "suggestions": [], "seq": 58}]}, {"verse_id": "5.9.53", "verse": "53", "sanskrit_iast": "aṃśukāntāś ca kāsāṃ cin mukhamārutakampitāḥ । upary upari vaktrāṇāṃ vyādhūyante punaḥ punaḥ ॥53॥", "leonov_ru": "У некоторых концы одежды, трепещущие из-за их дыхания, Снова и снова взвивались высоко над лицами.", "commentary": {"tilaka": "वक्त्राणामुपर्युपरीत्यन्वयः", "bhusana": "मृदुष्वङ्गेषु कासांचित् कुचाग्रेषु च संस्थिताः ।\n\nबभूवुर्भूषणानीव शुभा भूषणराजयः\nमृदुष्विति । संस्थिताः लग्नाः भूषणराजयः । भ्रमराणीव भ्रमरा इव । व्यत्यय आर्षः । कामुका इव बभूवुः ।\"भ्रमरः कामुके भृङ्गे\" इति दर्पणः । केचित्तु भूषणानीति पाठं कल्पयित्वा भूषणराजयः भूषणविमर्दकृतरेखाः । विस्रस्तभूषणानामपि कासांचिद्भूषणानीव बभूवुरित्यर्थ इत्याहुः\nअंशुकान्ताश्च कासांचिन्मुखमारुतकम्पिताः ।\n\nउपर्युपरि वक्त्राणां व्याधूयन्ते पुनः पुनः\nअंश्विति । मुखमारुतकम्पिताः अंशुकान्ताः सूक्ष्मवस्त्रदशाः । उपर्युपरि वक्त्राणां वक्त्राण्युपर्युपरि । \"धिगुपर्यादिषु त्रिषु । द्वितीया ऽ ऽम्रेडितान्तेषु\" इति द्वितीयाभाव आर्षः ।  व्याधूयन्त इति श्यन्नार्षः । धूनातेः क्र्यादित्वात्", "siromani": "अंशुकान्ता इति । कासाञ्चित् स्त्रीणां मुखमारुतेन मुखश्वासेन कम्पिताः अंशुकान्ताः पटप्रदेशाः वक्त्राणामुपर्युपरि पुनः पुनर्व्याधूयन्ते कम्पन्ते षष्ठ्याः साधुत्वमत एव निर्देशात् एको परिशब्दार्थो व्याधूननान्वयी वा अधिकं कम्पन्त इति तदर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.53:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Края", "kind": "note", "text": "Кончик одежды не похож на флаг (см. Стих 54). Мб это анчал?"}], "suggestions": [], "seq": 59}]}, {"verse_id": "5.9.56", "verse": "56", "sanskrit_iast": "śarkarāsavagandhaḥ sa prakṛtyā surabhiḥ sukhaḥ । tāsāṃ vadananiḥśvāsaḥ siṣeve rāvaṇaṃ tadā ॥56॥", "leonov_ru": "Их дыхание, пахнущее сладким вином, от природы ароматное и приятное Овевало тогда Равану.", "commentary": {"tilaka": "शर्करासव आसवविशेषस्तद्योगात्तद्गन्धः प्रकृत्या च सुरभिः, अत एव सुखस्तासां वदननिःश्वासो रावणं सिषेवे । यद्वा प्रकृत्या असुरभिरपि वायुरिति शेषः । तासां वदननिःश्वासस्तद्युक्तः अर्शआद्यजन्तम् अत एव शर्करासवगन्धो रावणं सिषेवे", "siromani": "शर्करेति । शर्करासवस्य आसवविशेषस्य गन्धः सुगन्धो यस्मिन् सः प्रकृत्या स्वभावतो ऽपि सुरभिः शोभनगन्धविशिष्टः अत एव सुखः सुखप्रदः स प्रसिद्धः तासां वदननिःश्वासः रावणं सिषिवे", "bhusana": "शर्करासवगन्धैश्च प्रकृत्या सुरभिः सुखः ।\n\nतासां वदननिःश्वासः सिषेवे रावणं तदा"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.56:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Их дыхание, от природы / Ароматное и приятное (prakṛtyā surabhiḥ sukhaḥ tāsāṃ vadananiḥśvāsaḥ) – автор «Тилаки» предлагает также вариант prakṛtyā asurabhiḥ, то есть «от природы лишенное аромата».", "service": [], "suggestions": [], "seq": 60}, {"id": "lexical:5.9.56:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śarkarāsava", "note_ru": "Шаркарасава (śarkarā-āsava, m.) — «сахарное вино, сладкое хмельное»: śarkarā «сахар, гравий» (от √śarkar-, ср. perс. shakar, англ. sugar) + āsava «перегнанный/настоянный напиток» (от √su- «выжимать, гнать»). MW: śarkarā 'gravel, grit; sugar'; āsava 'a spirituous liquor, distilled from sugar, molasses or the flowers of the Bassia'. Śarkarāsava — классифицированный напиток в Аюрведе (Charaka-saṃhitā, Sūtra 27): лёгкое сброженное питьё, считавшееся менее крепким, чем surā (злаковое вино), но обладавшее выраженным ароматом. Дыхание женщин пахнет śarkarāsava — маркер пира, роскоши и «правильного» (не surā-грубого) опьянения жён правителя.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:SarkarAsava+dic_apte:Sarkara", "source_links": [{"label": "MW SarkarAsava", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=SarkarAsava"}, {"label": "APTE Sarkara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=Sarkara"}], "collision_tier1": true, "seq": 61}]}, {"verse_id": "5.9.57", "verse": "57", "sanskrit_iast": "rāvaṇānanaśaṅkāś ca kāś cid rāvaṇayoṣitaḥ । mukhāni ca sapatnīnām upājighran punaḥ punaḥ ॥57॥", "leonov_ru": "Некоторые из женщин Раваны снова и снова целовали лица соперниц, Думая, что это лицо Раваны.", "commentary": {"tilaka": "मुखानि दृष्ट्वा हनुमतो जातां संभावनामाह-- इमानीति । फुल्लानि प्रार्थयन्तीत्यन्वयः । नियतं नित्यम्\nरावणाननशङ्काः मदनिद्रोभयजचित्तवैवश्यात् सपत्नीनां च सपत्नीनामपि मुखान्युपाजिघ्रन्", "bhusana": "रावणाननशङ्काश्च काश्चिद्रावणयोषितः ।\n\nमूखानि स्म सपत्नीनामुपाजिघ्रन् पुनः पुनः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.57:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "За Равану их принимая (rāvaṇānanaśaṅkāś ca) – в «Тилаке» этот композит поясняется «из-за утраты контроля над сознанием, рожденного одновременно опьянением и сном» (madanidrobhayajacittavaivaśyāt).", "service": [], "suggestions": [], "seq": 62}]}, {"verse_id": "5.9.58", "verse": "58", "sanskrit_iast": "atyarthaṃ saktamanaso rāvaṇe tā varastriyaḥ । asvatantrāḥ sapatnīnāṃ priyam evācaraṃs tadā ॥58॥", "leonov_ru": "Эти прекрасные женщины, сильно привязанные душой к Раване, Не владея собой, доставляли удовольствие своим соперницам.", "commentary": {"siromani": "ननु तदाघ्राणं घ्रायमाणमुखाः कथं न निवारयामासुरित्यत आह अत्यर्थमिति । रावणे अत्यर्थमत्यन्तं सक्तमनसः अत एव अस्वतन्त्राः ता रावणसंबन्धिन्यो वरस्त्रियः सपत्नीनां प्रियं तदाघ्राणसहनं स्वकर्तृकाघ्राणं च आचरन् अकुर्वन् । अत्यर्थं सक्तमनस इत्यनेन रावण एव जिघ्रतीति तासामपि भ्रान्तिः सूचिता", "bhusana": "अत्यर्थं सक्तमनसो रावणे ता वरस्त्रियः ।\n\nअस्वतन्त्राः सपत्नीनां प्रियमेवाचरंस्तदा\nअत्यर्थमिति । रावणे अत्यर्थं सक्तमनसः अस्वतन्त्राः पाननिद्रापरवशाः ताः सपत्नीभिराघ्रातमुखाः वरस्त्रियः तदा मुखाघ्राणसमये सपत्नीनां प्रियमेवाचरन् रावणो ऽजिघ्रदिति बुद्ध्या स्वयमप्यजिघ्रन्नित्यर्थः । अथवा कथं सपत्न्योपि सह स्वन्तीत्याशङ्क्याह अत्यर्थमिति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "phase2:5.9.58:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "atyartham saktamanaso", "note_ru": "По Широмани, оборот «сильно привязанные душой к Раване» намекает и на то, что сами эти женщины пребывали в том же заблуждении, что нюхают лицо Раваны, — то есть перед нами не только внешняя, но и внутренняя, разделяемая самими героинями иллюзия.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "вскрывает не выраженную в подстрочнике вторую иронию сцены: путаница разделяется самими женщинами, а не только служит внешним сравнением рассказчика.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 63}]}, {"verse_id": "5.9.61", "verse": "61", "sanskrit_iast": "ūrupārśvakaṭīpṛṣṭham anyonyasya samāśritāḥ । parasparaniviṣṭāṅgyo madasnehavaśānugāḥ ॥61॥", "leonov_ru": "Опирающиеся на бедра, бока, зады и спины друг друга, Переплелись они телами, находящиеся во власти вина и любви.", "commentary": {"tilaka": "स्नेहो ऽत्र रावणीयः", "bhusana": "ऊरुपार्श्वकटीपृष्टमन्योन्यस्य समाश्रिताः ।\n\nपरस्परनिविष्टाङ्ग्यो मदस्नेहवशानुगाः", "siromani": "ऊरू इति । अन्यो ऽन्यस्य ऊर्वादि समाश्रिताः अत एव परस्परनिविष्टाङ्ग्यः मदस्नेहेन वशानुगाः अत एव अन्योन्यस्य अङ्गसंस्पर्शात् प्रीयमाणाः एकीकृतभुजाः सर्वा योषितः सुपुपुः । अर्धचतुष्टमेकान्वयि ।। 5.9.61,62 ।।\n\nअन्यो ऽन्येति । अन्यो ऽन्यभुज एव सूत्रं तेन ग्रथिता स्त्रीमालामत्ताः षट्पदा भ्रमराः यस्यां सा सूत्रे ग्रथिता माला इव शुशुभे उपमेये षट्पदप्रतिनिधयः कचकुचोपरिभागादयः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.61:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Во власти любви и хмеля (madasnehavaśānugāḥ) – автор «Тилаки» замечает, что речь идет о любви к Раване.", "service": [], "suggestions": [], "seq": 64}]}, {"verse_id": "5.9.63", "verse": "63", "sanskrit_iast": "anyonyabhujasūtreṇa strīmālā grathitā hi sā । māleva grathitā sūtre śuśubhe mattaṣaṭpadā ॥63॥", "leonov_ru": "Гирлянда женщин, соединенная нитью рук, Была подобна гирлянде цветов на нити, с [вьющимися] опьяневшими пчелами.", "commentary": {"tilaka": "अत एवाह-- अन्योन्येति । माला पुष्पमाला । उपमेये मत्तषट्पदस्थानीयाः कचभारा नेत्रद्वन्द्वानि च"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.63:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "С опьяненными пчелами (mattaṣaṭpadā) – с черными пчелами сравниваются волосы и глаза женщин (по «Тилаке») или волосы и кончики грудей (по «Широмани»), либо только волосы («Таттвадипика», «Бхушана»).", "service": [], "suggestions": [], "seq": 65}]}, {"verse_id": "5.9.64", "verse": "64", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"tilaka": "लतानां वनमिवेत्यन्वयः । अन्योन्यसंबन्धेन मालाकारेण ग्रथितमिव", "bhusana": "लतानां माधवे मासि फुल्लानां वायुसेवनात् ।\n\nअन्योन्यमालाग्रथितं संसक्तकुसुमोच्चयम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.64:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извле

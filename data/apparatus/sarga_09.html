чено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Были женщины Раваны", "kind": "note", "text": "В комментарии надо указать, что в переводе стихи 64 и 65 поменяны местами"}], "suggestions": [], "seq": 66}]}, {"verse_id": "5.9.65", "verse": "65", "sanskrit_iast": "prativeṣṭitasuskandham anyonyabhramarākulam । āsīd vanam ivoddhūtaṃ strīvanaṃ rāvaṇasya tat ॥65॥", "leonov_ru": "Был лес женщин Раваны подобен колеблющемуся лесу, Где прекрасные стволы деревьев были изогнуты, где роились пчелы, Где в [весеннем] месяце мадхава дуновением ветра цветущие лианы Переплелись друг с другом подобно гирляндам, и тесно соединились [их] цветы.", "commentary": {"tilaka": "प्रतिवेष्टिता वृक्षाणां नायकानां च शोभनाः स्कन्धा येन तत् अन्योन्यं धावन्तो ये भ्रमरास्तैराकुलम् स्त्रीणामपि पद्मिनीत्वाद्भ्रमराकुलत्वम् केशपाशनेत्रादयो वा तासु भ्रमराः स्त्रीवनं स्त्रीसमूहः", "bhusana": "व्यतिवेष्टितसुस्कन्धमन्योन्यभ्रमराकुलम् ।\n\nआसीद्वनमिवोद्धूतं स्त्रीवनं रावणस्य तत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.65:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Где по весне лианы (latānāṃ mādhave māsi) – букв. «в месяце мадхава». Мадхава (или вайшакха) приходится на апрель-май.", "service": [], "suggestions": [], "seq": 67}]}, {"verse_id": "5.9.67", "verse": "67", "sanskrit_iast": "rāvaṇe sukhasaṃviṣṭe tāḥ striyo vividhaprabhāḥ । jvalantaḥ kāñcanā dīpāḥ prekṣanto nimiṣā iva ॥67॥", "leonov_ru": "При сладко спящем Раване (Только потому, что Равана сладко спал) пылающие золотые светильники Смотрели, словно бы не мигая, на тех женщин, различно сияющих.", "commentary": {"tilaka": "जालवातायनयोः काञ्चनकार्तस्वरयोर्मध्वासवयोश्च कञ्चिद्भेदं परिकल्प्य निर्वाहः एवमिन्द्रनीलमहानीलयोरपि\nसुखसंविष्टे सुखसुप्ते काञ्चनाः काञ्चनस्तम्भाः दीपा दीपस्थाग्निपुरुषाः कर्तारः स्त्रियः कर्म अनेन रावणे जाग्रति तेषामपि तद्दर्शने भयं सूचितम्", "bhusana": "रावणे सुखसंविष्टे ताः स्त्रियो विविधप्रभाः ।\n\nज्वलन्तः काञ्चना दीपाः प्रैक्षन्तानिमिषा इव\nरावण इति । सुखसंविष्टे सुखसुप्ते । काञ्चनाः काञ्चनदीपस्तम्भस्था दीपाः अनिमिषास्सन्तः प्रैक्षन्त इव । अनेन रावणस्य जाग्रद्दशायां दीपैरपि ताः स्त्रियो निश्चलं द्रष्टुमशक्या इति गम्यते", "siromani": "रावणेति । रावणे सुखसंविष्टे सुप्ते सतीत्यर्थः । ज्वलन्तः काञ्चना दीपाः तदभिमानिदेवविशेषाः अनिमिषा निमेषरहिताः सन्तः विविधप्रभाः ताः रावणसंबन्धिनीः स्त्रियः प्रेक्षन्ते । एतेन रावणजागरणसमये तत्स्त्रीदर्शनं देवानामपि दुर्लभमिति व्यञ्जितं तेन रावणस्य प्रतापातिशयः सूचितः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.67:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Словно бы не мигая, / Смотрели… (prekṣanto nimiṣā iva) – автор «Широмани» полагает, что речь идет о божествах этих светильников и замечает, что, таким образом, даже богам было трудно лицезреть женщин Раваны.", "service": [], "suggestions": [], "seq": 68}]}, {"verse_id": "5.9.68", "verse": "68", "sanskrit_iast": "rājarṣivipradaityānāṃ gandharvāṇāṃ ca yoṣitaḥ । rakṣasāṃ cābhavan kanyās tasya kāmavaśaṃ gatāḥ ॥68॥", "leonov_ru": "Были эти женщины дочерьми царских риши, мудрецов (брахманов), гандхарвов И ракшасов, покорившиеся его (Раваны) любви.", "commentary": {"bhusana": "राजर्षिपितृदैत्यानां गन्धर्वाणां च योषितः ।\n\nराक्षसानां च याः कन्यास्तस्य कामवशं गताः\nअथ सीतयैकया अकाम्यत्वं वक्तुं सर्वस्त्रीकाम्यत्वमाह राजर्षीत्यादिना श्लोकत्रयेण । तस्य कामवशंगताः तं प्रति यः कामः तस्य वशंगताः । तं कामयित्वा स्वयमेवागतास्ताः न तु तेन कामयित्वा हृता इत्यर्थःे", "siromani": "नन्वेवंविधस्त्रीणां प्राप्तिः कथं तस्येत्यत आह-- राजर्षीति । राजर्षिप्रभृतीनां कन्याः कामवशं गताः सत्यः तस्य रावणस्य योषितो ऽभवन् । कन्या इत्युक्त्या रावणस्याधर्मसंसर्गाभावो ध्वनितः । तेन ब्रह्मराक्षसत्वादुक्तकन्याविवाहयोग्यत्वं रावणस्य ध्वनितम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.68:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "vipra", "kind": "omission", "text": "опущено"}], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "термин", "accounted": "не учтено", "text": "Первое появление в кн. V; введено в Рамаяна II. 25. 16: Дайтьи (daityāḥ) — один из разрядов (а иногда синонимов) асуров; сыновья прародительницы асуров Дити (см. также примеч. к I. 45. 38).", "incomplete": false}], "seq": 69}, {"id": "lexical:5.9.68:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "gandharva", "note_ru": "Гандхарва (gandharva, m.) — полубожественные существа, небесные певцы и музыканты. MW: gandharva 'a Gandharva or heavenly musician (the Gandharvas are said to have rule over horses and to be fond of women; they are the husbands of the Apsarases; their king is Viśvāvasu)'. Этимология неясна: народная — gandha «аромат» + √gā- «петь» = «поющий ароматный»; более вероятно заимствование из авестийского gandərəβa. В списке V.9.68 (rājarṣi, vipra, daitya, gandharva, rakṣas) дочери гандхарвов стоят в одном ряду с дочерьми царей-риши — т. е. женщины высшего возможного ранга. Специфика гандхарвов в контексте гарема: они сами — небесные носители музыки и любви; их дочери наиболее искусны в искусствах сангиты (музыки). Подстрочник «гандхарвов» прозрачен, но не раскрывает сословного значения.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:ganDarva+dic_apte:ganDarva", "source_links": [{"label": "MW ganDarva", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ganDarva"}, {"label": "APTE ganDarva", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=ganDarva"}], "collision_tier1": true, "seq": 70}, {"id": "phase2:5.9.68:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kāmavaśaṃ gatāḥ", "note_ru": "В „Бхушане“ — эти женщины сами воспылали страстью к Раване и пришли добровольно, а не были им похищены из вожделения; в „Широмани“ — само слово «девы» (kanyāḥ) указывает на отсутствие греха: Равана как брахма-ракшас имел законное право на брак с ними. Перевод передаёт факт нейтрально, оставляя это доктринальное оправдание за кадром.", "type": "Б", "source_commentary": ["bhusana", "siromani"], "why_proposed": "два комментатора независимо снимают с Раваны обвинение в похищении/безнравственности иным способом (добровольность у Бхушаны, законность брака по касте у Широмани) — доктринальная рамка, отсутствующая в подстрочнике и не покрытая существующими заметками.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 71}]}, {"verse_id": "5.9.69", "verse": "69", "sanskrit_iast": "yuddhakāmena tāḥ sarvā rāvaṇena hṛtāḥ striyaḥ । samadā madanenaiva mohitāḥ kāścid āgatāḥ ॥69॥", "leonov_ru": "Все эти женщины были похищены Раваной, любящим битвы, [Но] некоторые пришли, возбужденные страстью, находясь в помрачении из-за Маданы (из-за любви).", "commentary": {"bhusana": "युद्धकामेन ताः सर्वा रावणेन हृताः स्त्रियः ।\n\nसमदा मदनेनैव मोहिताः काश्चिदागताः\nहृताश्च काश्चन श्रूयन्ते, तत्र कथमित्यत्राह युद्धेति । तासु हृतासु तासां संबन्धिभिस्सह युद्धं भविष्यतीति युद्धं कामयित्वा ऽनेन हृताः नतु ताः कामयित्वा हृताः", "siromani": "तदागमनप्रकारमाह युद्धेति । सर्वा बहवः स्त्रियः युद्धकामेन हरणहेतुकतत्पित्रादिभिः युद्धमिच्छता रावणेन हृताः समदाः काश्चित्तु मदनेनैव मोहिताः सत्यः आगताः स्वयं प्राप्ताः । एतेन रावणस्य सौन्दर्यातिशयः सूचितः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.69:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Но иные сами пришли, / Оказавшись во власти Маданы (samadā madanenaiva mohitāḥ kāścid āgatāḥ) – в комментарии «Широмани» поясняется, что эта фраза указывает на исключительную красоту Раваны.", "service": [], "suggestions": [], "seq": 72}, {"id": "edition:5.9.69:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.9.69 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.9.69", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.9.69", "iast": "yuddhakāmena tāḥ sarvā rāvaṇena hṛtāḥ striyaḥ । samadā madanenaiva mohitāḥ kāścid āgatāḥ ॥69॥"}], "collision_tier1": true, "seq": 73}]}, {"verse_id": "5.9.70", "verse": "70", "sanskrit_iast": "na tatra kā cit pramadā prasahya । vīryopapannena guṇena labdhā । na cānyakāmāpi na cānyapūrvā । vinā varārhāṃ janakātmajāṃ tu ॥70॥", "leonov_ru": "Не было там какой-либо женщины насильно [взятой], Обретены они были достоинствами наделенного мужеством [Раваны], Не было там [ни одной], влюбленной в кого-то иного, выданной уже за кого-то замуж, Кроме достойной дочери Джанаки.", "commentary": {"tilaka": "भूषणराजयो विमर्दजनितरेखाः । \"भूषणराशयः\" इति पाठे ऽप्ययमेवार्थो लक्षणादिना बोध्यः\nअस्यैव विवरणम्-- न तत्र काश्चिदिति । वीर्योपपन्नेनापि तेन तत्र तासु मध्ये काश्चित्प्रमदाः प्रसह्य न हृताः, किं तु गुणेन निरतिशयैश्वर्यवीर्यसौन्दर्यादिगुणेन स्वत एव लब्धाः । तत्र लङ्कायामन्यकामा च नाहृता, अन्यपूर्वा च नाहृता कथमेवं प्रत्यक्षापलापस्तत्राह विनेति । वरार्हां श्रेष्ठरामार्हाम्", "bhusana": "न तत्र काश्चित् प्रमदाः प्रसह्य वीर्योपपन्नेव गुणेन लब्धाः ।\n\nन चान्यकामापि न चान्यपूर्वा विना वरार्हां जनकात्मजां ताम्\nअमुमेवार्थं विवृणोति न तत्रेति । तत्र तासु काश्चिदपि प्रमदाः प्रसह्य वीर्येण न लब्धाः । किंतु स्वसंवादेनैवेत्यर्थः । वीर्योपपन्नेन रावणेन न लब्धाः अपि तु गुणेन लब्धाः । अन्यकामा च काचित्तत्र नास्ति । अन्यपूर्वा च न । अन्यत्रासक्ता च न काचिदित्यर्थः ।। 5.9.70,71 ।।\n\nबभूव बुद्धिस्तु हरीश्वरस्य यदीदृशी राघवधर्मपत्नी ।\n\nइमा यथा राक्षसराजभार्याः सुजातमस्येति हि साधुबुद्धेः\nबभूवेति । राघवधर्मपत्नी ईदृशी यदि स्वयंवरात्पूर्वमेवास्य धर्मपत्नी चेत् । अस्य सुजातं सुकृतम् । इयमसाध्वी बुद्धिः कापेयत्वप्रमादकृता न तु स्वयं तस्य बुद्धिरिति द्योतयितुं साधुबुद्धेरित्युक्तम् । एवं प्रमादोपस्थितबुद्ध्या पश्चात्तापो ऽभूदित्याह-- पुनश्च सो ऽचिन्तयदार्तरूप इति । यद्वा इमाः राक्षसराजभार्याः यथा स्वभर्त्रा विशिष्टास्सकलभोगयुक्ताश्च तथा राघवधर्मपत्नी ईदृशी यदि स्वभर्त्रा भोगयुक्ता च यदि तदा ऽस्य रावणस्य सुजातं शोभनं जन्मेति साधुबुद्धेः परसमृद्धिपरस्य हरीश्वरस्य स्वयमाधिपत्यार्हस्य बुद्धिर्बभूव । अयं रावणः राघवधर्मपत्नीं यदि प्रत्यर्पयेत्तदा ऽस्य शोभनं जन्म स्यादिति बुद्धिर्जातेत्यर्थः", "siromani": "जनकात्मजाहरणं रावणविघातार्थमेवेति द्योतयन्नाह नेति । वरार्हां श्रेष्ठपूजायोग्यां जनकात्मजां विना गुणेन अतिसौन्दर्यादिनोपलक्षिता अपि काश्चित् अनिच्छन्त्यः प्रमदाः वीर्योपपन्नेन रावणेन प्रसह्य हठात् न लब्धाः गृहीताः अन्यकामाः पत्यन्तरमिच्छन्त्यो न लब्धाः स्वेतरेच्छावत्यो न हृता इत्यर्थः, अन्यपूर्वा विवाहिता आत्ममात्रमिच्छन्त्यो ऽपीत्यर्थः, न लब्धा । एतेन रावणविध्वंसो ऽचिरं भवितेति सूचितम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "lexical:5.9.70:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "janakātmajā", "note_ru": "Дочь Джанаки (janakātmajā). [Е. Костина]: именной эпитет «janakātmajā» присутствует в оригинале, но не передан отдельным словом в подстрочнике («…Не было там какой-либо женщины насильно [взятой], Обретены о…»). В литературном тексте эпитет восстанавливается; отметить как незафиксированное опущение — на усмотрение редактора.", "type": "Б", "subtype": "base", "trigger": "omission", "source": "расхождение параллельных текстов (привязка к стиху, нестрогая)", "source_links": [], "seq": 74}]}, {"verse_id": "5.9.71", "verse": "71", "sanskrit_iast": "na cākulīnā na ca hīnarūpā । nādakṣiṇā nānupacārayuktā । bhāryābhavat tasya na hīnasattvā । na cāpi kāntasya na kāmanīyā ॥71॥", "leonov_ru": "Не было там ни одной безродной или безобразной, Не было ни одной неучтивой, не облаченной в лучшие одежды и украшения (или дурного поведения). Были жены его (Раваны) хорошего здоровья, Не было ни одной, нежеланной ее мужу.", "commentary": {"tilaka": "ननु सपत्नीभिः कृतं मुखाघ्राणं ताः कथमसहन्तेत्यत आह-- अत्यर्थमिति । अत्यासक्तेरेवास्वतन्त्रा मदापारवश्याच्च तथाभूता वरस्त्रियः सपत्नीभिराघ्रातमुखा अपि सपत्नीनां प्रियमेवाचरन्, ता अपि तासां मुखानि रावणमुखशङ्कयोपाजिघ्रन्नित्यर्थः", "bhusana": "न चाकुलीना न च हीनरूपा नादक्षिणा नानुपचारयुक्ता ।\n\nभार्या ऽभवत्तस्य न हीनसत्त्वा न चापि कान्तस्य न कामनीया", "siromani": "नेति । अकूलीना निषिद्धकुलोत्पन्ना तस्य रावणस्य भार्या नाभवत् हीनरूपां च नाभवत् अदक्षिणा अकुशलापि नाभवत् अनुपचारयुक्ता उत्तमभूषणरहिता नाभवत् हीनसत्त्वा हीनबलापि न कान्तस्य रावणस्य न कामनीया अनीप्सितापि भार्या नाभवत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.71:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Все они были желанны владыке (na cāpi kāntasya na kāmanīyā) – букв. «и не было нежеланных для возлюбленного». Автор «Широмани» поясняет, что под возлюбленным (kānta) подразумевается Равана.", "service": [], "suggestions": [], "seq": 75}]}, {"verse_id": "5.9.72", "verse": "72", "sanskrit_iast": "babhūva buddhis tu harīśvarasya । yadīdṛśī rāghavadharmapatnī । imā mahārākṣasarājabhāryāḥ । sujātam asyeti hi sādhubuddheḥ ॥72॥", "leonov_ru": "И появилась мысль у светлого умом владыки обезьян (Ханумана): «Если подобна благочестивая жена Рагхавы Этим женам великого царя ракшасов, Благо ему (Раване)».", "commentary": {"siromani": "बभूवेति । इमा राक्षसराजभार्याः यथा स्वपतिस्मरणादिषु निरताः ईदृशी तथा रामस्मरणादिनिरता यदि राघवधर्मपत्नी तत्स्मरणादीनां विघ्नो न कृतः स्यादित्यर्थः । तदा अस्य रावणस्य सुजातं कल्याणमेवेत्यर्थः, इति साधुबुद्धेर्हरीश्वरस्य बुद्धिर्निश्चयो बभूव"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.72:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "«Счастлив Рама,Если жена его благочестиваяПодобна женам владыки ракшасов", "kind": "note", "text": "Фраза звучит довольно странно, надо указать в комм, почему такое сравнение вообще возможно, и упомянуть наличие других толкований этого стиха. По г-пресс, например, получается, что если Сита будет так же счастлива, как жены Раваны, то ему (Раване) от этого будет счастье."}], "suggestions": [], "seq": 76}]}, {"verse_id": "5.9.73", "verse": "73", "sanskrit_iast": "punaś ca so 'cintayad āttarūpo । dhruvaṃ viśiṣṭā guṇato hi sītā । athāyam asyāṃ kṛtavān mahātmā । laṅkeśvaraḥ kaṣṭam anāryakarma ॥73॥", "leonov_ru": "И еще он подумал: «Принявший [иной] облик (то есть Равана), Несомненно, наилучшая по своим достоинствам Сита, И вот этот великий духом владыка Ланки, Причинил ей обиду, недостойную благородного».", "commentary": {"tilaka": "राजर्षयो विप्रदैत्याश्च अस्य ब्रह्मराक्षसत्वादस्ति विप्रकन्याविवाहे ऽधिकारः । कामवशङ्गताः सत्यस्तस्य योषितो ऽभवन् । अनेन तासामप्यनुरागः सूचितः\nअस्य बहुस्त्रीप्राप्तिर्बलात्स्वारस्याच्चेत्याह-- युद्धेत्यादि । सर्वा इति बाहुल्याभिप्रायम् आसां हरणे एतद्बन्धुभिर्युद्धं भविष्यतीति युद्धकामनापूर्वं हृताः । काश्चित्समदास्तरुण्यो मदनमोहिताः स्वयमेवैनं वृतवत्यः\nअथ सीताप्येतत्स्त्र्यन्तर्गता न वेति विकल्प्याद्ये रावणस्य भद्रमेवेति बुद्धिर्हनूमतो जातेत्याह बभूवेति । साधुबुद्धेर्हरीश्वरस्येति बुद्धिर्बभूव इमा महाराक्षसराजभार्याः, यथा तद्भुक्ताः राघवधर्मपत्न्यपीदृशी एतदन्तर्गतैतद्भुक्ता च यदि स्यात्तदास्य रावणस्य सुजातं भद्रमेव भवति रावणभुक्तेति मया निवेदिते सति सीतायां मृतायामिव राघवस्योपेक्षणाद्रावणवधयत्नाप्रसक्तेरिति भावः", "bhusana": "पुनश्च सो ऽचिन्तयदार्तरूपो ध्रुवं विशिष्टा गुणतो हि सीता ।\n\nअथायमस्यां कृतवान् महात्मा लङ्केश्वरः कष्टमनार्यकर्म\nइत्यार्षे श्रीरामायणे श्रीमद्वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे नवमः सर्गः ।। 5.9।।\n\nकिंच चिन्तान्तरमाह पुनश्चेति । अथः सः हनुमान् । सीता गुणतः पातिव्रत्यादिगुणतः ध्रुवं विशिष्टा हि । अस्याम् एतद्विषये महात्मा महाकुलप्रसूतोपि अयं लङ्केश्वरः । अनार्यकर्म अपहरणरूपं कर्म कृतवान् । कष्टमिति आर्त्तरूपः अत्यन्तमार्तः । \"प्रशंसायां रूपम्(प्)\" । पुनश्चाचिन्तयत् । वैदेह्याः दृढव्रतत्वापातिव्रत्यभङ्गो न भवेदेव अपि तु मिथ्यापावादमेवोत्पादितवानिति भृशं दुःखितस्सन् चिन्तितवानित्यर्थः । यद्वा बभूवेत्यादि । राक्षसराजपत्नीवत्सीता स्वभर्त्रा सङ्गता चेत्सीतापहरणं न कृतवांश्वेत्तदा ऽस्य सुजातमित्युक्तम् । तत्र निरतिशयसौन्दर्यादिशालिन्याः मैथिल्याः र(रा)क्षरीस्त्रीसाम्यं चिन्तयता मया हीनोपमा कृतेति पश्चात्तापयुक्तस्सन् अचिन्तयत् । हि यस्मात्सीता गुणतः विशिष्टा अतः आर्तस्वरूपस्सन् अचिन्तयत् मया हीनोपमैव कृतेत्यचिन्तयत् । अथ अथापि अस्यां सीतायाम् । अनार्यकर्म धर्षणरूपं कर्म कृतवान् । कष्टं सर्वमिदं लङ्कैश्वर्यं भ्रष्टं भविष्यतीत्यचिन्तयच्चेत्यर्थः । यद्वा राघणधर्मपत्नी यथा रावणेन बलादानीता तथा राक्षसराजभार्याः बलात्सुग्रीवेण बन्दीकृताश्चेदस्य हरीश्वरस्य सुग्रीवस्य सुजातं हीति साधुबुद्धेः सन्मन्त्रिबुद्धेः अस्य हनुमतः बुद्धिर्बभूवेत्यर्थः । यद्वा इमा राक्षसराजभार्याः यथा रावणे ऽनुरक्ताः ईदृशी राघवधर्मपत्नी यदि एवमनुरक्ता चेत् अस्य सुजातमिति साधुबुद्धेरपि बूद्धिर्बभूव । ऐश्वर्यातिशयदर्शनविस्मयादिति भावः । अत एव वक्ष्यति अहो वीर्यमित्यादिना । एवं हठादुक्त्वा ऽनुशयितवानित्याह--पुनश्चेति । हि यस्मात् सीता गुणतः पातिव्रतेन विशिष्टा सर्वोत्कृष्टा अतः आर्तरूपः किं मया व्याहृतमित्यनुतप्तः सन् । अस्यामनार्यकर्म कृतवानित्यचिन्तयत् । अस्मिन्सर्गे त्रिसप्ततिश्लोकाः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-9", "notes": [{"id": "tier1:5.9.73:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Облик изменив (āttarūpaḥ) – другой вариант, вошедший в критическое издание, - ārtarūpaḥ (см.: Jhala 1966: 93), что автор «Тилаки» объясняет как «охваченный страданием» и относит уже не к Раване, а к Хануману.", "service": [], "suggestions": [], "seq": 77}, {"id": "lexical:5.9.73:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "anāryakarman", "note_ru": "Анарьякарман (anārya-karman, n.) — «деяние, недостойное арья», anārya + karman. MW: anārya 'not honourable, ignoble, base'; ārya 'respectable, noble; a man of the first three castes'. Термин ārya (√ṛ- «двигаться к цели», ср. авест. airya, ст.-перс. ariya) в эпосе — не этническое, а дхармическое: ārya = соответствующий дхарме, «благородный по поступкам». AnAryakarman — нарушение базового дхармического кодекса: похищение чужой жены квалифицируется Хануманом именно в этих категориях. Формула anāryakarman — юридически-моральный приговор, а не просто «недостойный поступок» (подстрочник). Это напрямую предвосхищает вынесение дхармического суждения о Раване в последующих главах.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:anArya+dic_mw:karman", "source_links": [{"label": "MW anArya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=anArya"}, {"label": "MW karman", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=karman"}], "collision_tier1": true, "seq": 78}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

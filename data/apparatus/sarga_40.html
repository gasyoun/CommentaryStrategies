रहृष्यामि वानर ।\n\nअर्धसञ्जातसस्येव वृष्टिं प्राप्य वसुन्धरा"}, "has_tier1": true, "notes": [{"id": "tier1:5.40.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И, Хануман, я радуюсь, / Будто земля со злаками, / Обильным дождем политая (tvāṃ dṛṣṭvā priyavaktāraṃ samprahṛṣyāmi vānara ardhasaṃjātasasyeva vṛṣṭiṃ prāpya vasuṃdharā) – букв. «Увидев тебя, говорящего приятное, радуюсь, обезьяна, словно земля с полупроросшими семенами, обретя дождь»."}, {"id": "lexical:5.40.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ardhasaṃjātasasya", "note_ru": "Ардхасамджатасасья (ardha-saṃjāta-sasya, adj.) — кармадхарая с бахуврихи-ядром: ardha «половина» + saṃjāta «взошедший» (p.p.p. sam-√jan-, «рождаться, произрастать», класс IV, Whitney #628) + sasya n. «злак, урожай». MW: sasya 'corn standing in the field, grain'. Образ засушливой земли, уже получившей дождь, но ещё не завершившей прорастание — момент ожидания плода. В ведийской традиции vasundharā («земля-держательница богатств», V.40.2б) наделена сакральной хозяйственной ценностью: её благополучие прямо связано с ритуальным и социальным порядком. Сравнение Ситой себя с такой землёй указывает на её внутреннее состояние: она «на полпути» — не мёртвая, но не живая полностью. Апте добавляет: sasya широко используется в эпосе для сравнений с состоянием надежды, не достигшей плода.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:sasya+dic_mw:saMjAta (√jan-)+Indological:vasundharA", "collision_tier1": true}]}, {"verse_id": "5.40.3", "verse": "3", "sanskrit_iast": "yathā taṃ puruṣavyāghraṃ gātraiḥ śokābhikarśitaiḥ । saṃspṛśeyaṃ sakāmāhaṃ tathā kuru dayāṃ mayi ॥3॥", "leonov_ru": "Чтобы того тигра среди мужей членами, исхудавшими от скорби Коснусь я, будет удовлетворено мое желание, так пожалей меня.", "commentary": {"tilaka": "सकामा तत्स्पर्शेच्छावती", "bhusana": "यथा तं पुरुषव्याघ्रं गात्रैः शोकाभिकर्शितैः ।\n\nसंस्पृशेयं सकामा ऽहं तथा कुरु दयां मयि", "siromani": "यथेति । सकामा उत्कटेच्छावती अहं यथा संस्पृशेयं तथा मयि दयां कुरु"}, "has_tier1": true, "notes": [{"id": "tier1:5.40.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Я руками коснусь исхудавшими ((gātraiḥ śokābhikarśitaiḥ) – в оригинале «членами тела, исхудавшими от горя»"}, {"id": "crosstext:5.40.3:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "puruṣa-vyāghra", "note_ru": "puruṣavyāghram («тигра среди мужей») — Сита о Раме, мечтая коснуться его исхудавших от скорби членов. Вариант той же тигриной формулы, что и puruṣaśārdūla; в Махабхарате он закреплён за целым рядом первогероев. Так Юдхиштхира: «niḥśvasya puruṣavyāghraḥ sampradadhyau parantapaḥ» (MBh III.37.1) — «муж-тигр … гроза недругов, тяжко вздохнул и предался раздумью». Применение к Раме ставит его в один формульный ряд с эпическими царями-героями; подстрочник «тигр среди мужей» верен, но параллель показывает клишированную, надличную природу образа.", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.40.3", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparvan III.37.1", "collision_tier1": true}]}, {"verse_id": "5.40.4", "verse": "4", "sanskrit_iast": "abhijñānaṃ ca rāmasya dadyā harigaṇottama । kṣiptām īṣikāṃ kākasya kopād ekākṣiśātanīm ॥4॥", "leonov_ru": "Ты должен дать Раме опознавательный знак, о лучший из обезьян, [Рассказ о ] выпущенном стебле травы в гневе в ворону, выбившем у нее один глаз.", "commentary": {"tilaka": "अभिज्ञानं चूडामण्यात्मकं दद्या देहि । तथा कोपात्काकस्यैकाक्षिशातनीमिषीकां क्षिप्त्वा काको रक्षित इत्यपरमभिज्ञानं दद्याः । श्रावयेत्यर्थः", "bhusana": "अभिज्ञानं च रामस्य दद्या हरिगणोत्तम ।\n\nक्षिप्तामिषीकां काकस्य कोपादेकाक्षिशातनीम्", "siromani": "अभिज्ञानमिति । अभिज्ञानं चूडामणिं रामस्य रामाय दद्याः अभिज्ञानान्तरमाह काकस्य एकाक्षिनाशिनीमिषीकां चाभिज्ञानं दद्या कथयेरित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.40.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Должен отдать тайный знак / Ты Раме… (abhijñānaṃ ca rāmasya dadyā) В оригинале не вполне ясно, о каком тайном знаке идет речь. В комментарии «Тилака» поясняется, что имеется в виду драгоценный камень, который Сита отдала Хануману, после чего Хануман должен напомнить Раме о случае с вороном.[Е. Костина] «harigaṇottama» Опущено обращение"}, {"id": "lexical:5.40.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "abhijñāna", "note_ru": "Абхиджняна (abhijñāna, n.) — от abhi-√jñā- (класс IX, «знать, распознавать», Whitney #851) + суфф. деверб. -ana. MW: abhijñāna 'recognition; a sign or token of recognition; a remembrance'. В эпосе abhijñāna — юридически-нарративный термин: предмет или знание, неопровержимо идентифицирующие личность, когда очная встреча невозможна. Именно это его значение ключево здесь: Сита просит Ханумана добыть abhijñāna — такой знак, который Рама мгновенно опознает как принадлежавший ей лично. В «Шакунтале» Калидасы abhijñāna вынесено в само название (Abhijñānaśākuntala) — кольцо как юридический токен идентичности. Здесь чудамани (V.40.7) выполняет ту же роль в нарративной логике.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:aBijYAna (√jñā-)+Indological:token_of_recognition", "collision_tier1": true}, {"id": "lexical:5.40.4:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kākāṣṭabhyā / īṣikā", "note_ru": "Ишика (īṣikā, f.) — «тростниковый прут; тростниковая стрела-метательный снаряд» (MW: 'a rush, reed; a painting-brush; a kind of dart or arrow'). В Рамаяне (Vālmīki, Sundarakāṇḍa и Yuddha-kāṇḍa) īṣikā — конкретный инцидент: Рама в ашраме Брахмы направил тростник (īṣikā), заряжённый brahmastra, против ворона Джайянты, выколовшего глаз Сите. Ворону удалось спастись лишь ценой одного глаза (ekākṣiśātana). Этот эпизод показывает оружейную потенцию Рамы даже без металлического оружия. Сита намеренно называет именно этот epizod как личное abhijñāna: только Рама и она знают об этом.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:IzikA+Valmiki:BK_Balakanda(kAka_story)", "collision_tier1": true}]}, {"verse_id": "5.40.5", "verse": "5", "sanskrit_iast": "manaḥśilāyās tilako gaṇḍapārśve niveśitaḥ । tvayā pranaṣṭe tilake taṃ kila smartum arhasi ॥5॥", "leonov_ru": "Красным минералом тилак на щеке (на лбу) нанесенный Тобой, когда [мой] тилак стерся, должен ты о нем помнить.", "commentary": {"tilaka": "अथाभिज्ञानान्तरमाह सन्देशरूपेण-- मनःशिलाया इति । पूर्वतने तिलके नष्टे सति त्वया रामेण मम गण्डपार्श्वे मनःशिलातिलको निवेशितः, तं किल । स्वकृततिलकमित्यर्थः । स्मर्तुमर्हसि । इति मयोक्तमिति ब्रूहीति शेषः", "bhusana": "मनःशिलायास्तिलको गण्डपार्श्वे निवेशितः ।\n\nत्वया प्रनष्टे तिलके तं किल स्मर्तुमर्हसि", "siromani": "मनः शिलाया इति । मम तिलके प्रनष्टे सति मनश्शिलायास्तिलकः गण्डपार्श्वे गण्डैकदेशे निवेशितः तं तिलकं स्मर्तुमर्हसि इदमप्यभिज्ञानं दद्या इति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.40.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "На щеку… (gaṇḍapārśve) – Голдмены переводят «на лоб» (on my forehead) (см.: Goldman 1984: 224), следуя комментарию «Бхушана», в котором слово gaṇḍapārśve объясняется как gaṇḍasthale gaṇḍaśailapārśve vā и принимая слово gaṇḍaśaila в значении «лоб» (forehead). Красной краской manaḥśilāyās) – в оригинале использовано слово manaḥśilā, которое обозначает реальгар, красный сульфид мышьяка, с древности использовавшийся в качестве краски (упоминается у Плиния Старшего под названием сандарак)."}, {"id": "lexical:5.40.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "manaḥśilā", "note_ru": "Манашила (manaḥ-śilā, f.) — «горный камень для ума / мышьяковый камень»; manaḥ «ум» (иногда этимологизируют как «красивый»?) + śilā «камень, скала». Фактически это минерал реальгар (As₂S₂, красный арсенид мышьяка), ярко-красный пигмент. MW: manaḥśilā 'red arsenic or realgar'. Апте: 'a mineral red orpiment'. В косметической практике Индии реальгар использовался для тилаки — декоративного знака на лице/лбу, а также на щеках (gaṇḍapārśve). Сита сообщает личную подробность: Рама сам нанёс ей тилаку из manaḥśilā — деталь, известная исключительно супругам. Таким образом, это segundo abhijñāna помимо чудамани.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:manaHzilA+Apte:manaHzilA+mineralogy", "collision_tier1": true}, {"id": "phase2:5.40.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "gaṇḍapārśve", "note_ru": "В „Широмани“ gaṇḍapārśve истолковано буквально — gaṇḍaikadeśe, «часть щеки»; в „Бхушане“ (по свидетельству того же комментаторского пласта на соседних стихах) то же слово читается как gaṇḍasthale / gaṇḍaśailapārśve, то есть «на лбу» (этому чтению следуют Голдмены). Перевод следует буквальному, широманиевскому пониманию — «на щеке».", "type": "Б", "source_commentary": ["siromani", "bhusana"], "why_proposed": "разночтение локализации тилака (щека vs лоб) между комментаторами не отражено в подстрочнике и не покрыто существующей заметкой Леонова/Костиной, которая обсуждает только чтение Бхушаны/Голдменов", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.40.6", "verse": "6", "sanskrit_iast": "sa vīryavān kathaṃ sītāṃ hṛtāṃ samanumanyase । vasantīṃ rakṣasāṃ madhye mahendravaruṇopama ॥6॥", "leonov_ru": "Будучи могущественным, как ты можешь терпеть то, что Сита похищена, Что живет она среди ракшасов, о равный великому Индре и Варуне?", "commentary": {"tilaka": "अथ केवलसन्देशान्तरमाह स वीर्यवानिति । अनुमन्यसे । सहस इत्यर्थः", "bhusana": "स वीर्यवान् कथं सीतां हृतां समनुमन्यसे ।\n\nवसन्तीं रक्षसां मध्ये महेन्द्रवरुणोपमः", "siromani": "स इति । स रामस्त्वं हृतां सीतां कथं समनुमन्यसे सहसे"}, "has_tier1": false, "notes": [{"id": "crosstext:5.40.6:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "mahendravaruṇopama", "note_ru": "Махендра-варунопама (mahendravaruṇopama) «подобный Махендре и Варуне» — парная формула величия: в Айодхья-канде (2.1.4) ею описаны Бхарата и Шатругхна. В Сундаре (V.40.6) Сита прилагает её к Раме (mahendravaruṇopama), упрекая его в бездействии. Тот же двойной эпитет царственной мощи переходит с младших братьев на самого Раму.\n\nПараллель — Rām. Ayodhyā 2.1.4:\n  «rājāpi tau mahātejāḥ sasmāra proṣitau sutau । ubhau bharataśatrughnau mahendravaruṇopamau ॥4॥»\n  И великий царь всегда помнил Сыновей, уехавших из дому — Царевичей Бхарату и Шатругхну, Подобных Махендре и Варуне.", "type": "Б", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.40.6", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Ayodhyā 2.1.4 (Гринцер, пер. изд. I–III)"}]}, {"verse_id": "5.40.7", "verse": "7", "sanskrit_iast": "eṣa cūḍāmaṇir divyo mayā suparirakṣitaḥ । etaṃ dṛṣṭvā prahṛṣyāmi vyasane tvām ivānagha ॥7॥", "leonov_ru": "Вот чудесный камень чудамани, мной бережно сохраненный, Глядя на него, радуюсь я в горести, словно на тебя [глядя], о безупречный.", "commentary": {"tilaka": "दिव्य एष चूडामणिरेतावत्कालं सुपरिरक्षितः, एतं व्यसने त्वामिव दृष्ट्वा प्रहृष्यामि । एतत्संनिधाने रक्षोभिभवासंभवादिति भावः", "bhusana": "एष चूडामणिर्दिव्यो मया सुपरिरक्षितः ।\n\nएतं दृष्ट्वा प्रहृष्यामि व्यसने त्वामिवानघ\nएष ति । प्रहृष्यामीति । अस्य चूडामणेस्त्वया बहुशो लालितत्वेन त्वत्स्मारकत्वादिति भावः", "siromani": "एष इति । एषः पित्रा दत्तः चूडामणिः मया संरक्षितः । तत्र हेतुः व्यसने राक्षसकर्तृकपीडायां सत्यां त्वामिव एतं मणिं दृष्ट्वा प्रहष्यामि"}, "has_tier1": true, "notes": [{"id": "tier1:5.40.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «камень-заколку» Не знаю, как его лучше назвать с учетом того, что Хануман надел его на палец"}, {"id": "lexical:5.40.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "cūḍāmaṇi", "note_ru": "Чудамани (cūḍā-maṇi, m.) — тат-пуруша: cūḍā «пучок волос на макушке, хохол, гребень» (MW: 'the hair on the crown of the head, a crest, tuft') + maṇi m. «самоцветный камень, драгоценность». Буквально: «драгоценность пучка волос», то есть украшение, носимое на вершине заплетённых волос, — диадема-чудамани. MW: cūḍāmaṇi 'jewel worn on the top of the head, diadem'. Это украшение — подарок Ситы отца Джанаки на свадьбу, а возможно, дар богов (divya, V.40.7а). Передача его Хануману — акт крайнего доверия и отчаяния: Сита расстаётся с единственным оставшимся царским украшением. В традиции tilaka + cūḍāmaṇi — пара знаков, маркирующих статус царицы.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:cUDA+dic_mw:maNi+Indological:royal_ornament", "collision_tier1": true}, {"id": "phase2:5.40.7:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "cūḍāmaṇiḥ suparirakṣitaḥ", "note_ru": "Комментаторы расходятся в объяснении того, зачем Сита хранила чудамани: по „Тилаке“ — в его присутствии ракшасы не могут одолеть её (etatsannidhāne rakṣobhibhavāsaṃbhavāt), то есть камень действует как оберег; по „Бхушане“ и „Широмани“ — это просто памятная вещь (подарок отца), напоминающая о Раме.", "type": "В", "source_commentary": ["tilaka", "bhusana", "siromani"], "why_proposed": "три комментатора дают разные функции украшения (апотропей vs памятная вещь vs отцовский дар) — деталь, отсутствующая и в подстрочнике, и в существующей лексической заметке о cūḍāmaṇi, которая касается только этимологии слова", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.40.8", "verse": "8", "sanskrit_iast": "eṣa niryātitaḥ śrīmān mayā te vārisambhavaḥ । ataḥ paraṃ na śakṣyāmi jīvituṃ śokalālasā ॥8॥", "leonov_ru": "Возвращен тебе мной этот прославленный [камень], рожденный в воде (в море). После этого не смогу я жить, поглощенная скорбью.", "commentary": {"tilaka": "अर्धसञ्जातान्यर्धं वयःप्राप्तानि, ततः परं जलाभावादासन्नशोषाणि सस्यानि यस्याः सा यथा दैवात्संपन्नवृष्ट्या संपन्नसस्या भवति तथाहमपि प्राप्तजीवितनाशामृतोपमात्त्वदर्शनाद्धृतजीवितेति भावः\nस एष निर्यातितो दत्तः । त्वत्प्रत्यभिज्ञानार्थमिति शेषः । अतः शीघ्रमागमने एव कुशलम्, अन्यथा परमं दुःखमिति भावः", "bhusana": "एष निर्यातितः श्रीमान् मया ते वारिसम्भवः ।\n\nअतः परं न शक्ष्यामि जीवितुं शोकलालसा", "siromani": "एष इति । वारिसंभवः एषः मणिः मया निर्यातितः त्वत्प्रत्यभिज्ञानार्थं प्रेषितः अतः परम् अवधिकालादुत्तरं शोकलालसा शोकाक्रान्तचित्ताहं जीवितुं न शक्ष्यामि"}, "has_tier1": true, "notes": [{"id": "tier1:5.40.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Больше жить не смогу я (ataḥ paraṃ na śakṣyāmi jīvitum) – букв. «отныне/поэтому не смогу жить». Авторы комментариев «Широмани» и «Тилака» усматривают здесь намек на срок, отведенный Раваной Сите."}]}, {"verse_id": "5.40.10", "verse": "10", "sanskrit_iast": "dhārayiṣyāmi māsaṃ tu jīvitaṃ śatrusūdana । māsād ūrdhvaṃ na jīviṣye tvayā hīnā nṛpātmaja ॥10॥", "leonov_ru": "Есть у меня [только] месяц жизни, о губитель врагов, По прошествии месяца не буду я жить, лишенная тебя, о царский сын.", "commentary": {"bhusana": "धारयिष्यामि मासं तु जीवितं शत्रुसूदन ।\n\nमासादूर्ध्वं न जीविष्ये त्वया हीना नृपात्मज", "siromani": "धारयिष्यामीति । मासादूर्ध्वम् अवधिभूतदिनात्परं न जीविष्ये जीवितास्मि"}, "has_tier1": false, "notes": [{"id": "lexical:5.40.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "avadhi / māsa", "note_ru": "Маса (māsa, m.) — «месяц», от корня мерный MĀS- (лунный месяц). MW: māsa 'a month'. Здесь «dhārayiṣyāmi māsam» (букв. «буду удерживать [жизнь] месяц») — не просто хронологическое указание, но ритуально значимый срок. В древнеиндийских дхармашастрах и эпосе māsa — минимальный срок, который вдова или разлучённая жена обязана ждать, прежде чем принять решение о своей судьбе (ср. Мч 5.76: māse māse tu yā nārī...). Это «авадхи» (avadhi — предельный срок ожидания), после которого обет жизни снимается. Сита устанавливает māsa как авадхи-срок перед Хануманом — не от слабости, а в рамках традиционного правового представления о допустимом сроке разлуки.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:mAsa+Dharmashastra:avadhi+Indological:waiting_period"}]}, {"verse_id": "5.40.11", "verse": "11", "sanskrit_iast": "ghoro rākṣasarājo 'yaṃ dṛṣṭiś ca na sukhā mayi । tvāṃ ca śrutvā viṣajjantaṃ na jīveyam api kṣaṇam ॥11॥", "leonov_ru": "Ужасен царь ракшасов, взгляд [его] не радостен для меня. Услышав о том, что ты [по-прежнему] привязан [ко мне], не проживу я и мгновения».", "commentary": {"bhusana": "घोरो राक्षसराजो ऽयं दृष्टिश्च न सुखा मयि ।\n\nत्वां च श्रुत्वा विषज्जनं न जीवेयमहं क्षणम्", "siromani": "घोर इति । अयं राक्षसराजः घोरः अतिक्रूरः अत एव मयि सुखासुखहेतभूता दृष्टिर्न हन्तुमेवेच्छतीत्यर्थः । एतेन जीवनं दुर्लभमिति सूचितम् । हेत्वन्तरमाह विषज्जन्तं त्वां श्रुत्वा क्षणमपि न जीवेयं जीवितुमिच्छेयम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.40.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Услышу я, что ты медлишь (tvāṃ ca śrutvā viṣajjantaṃ) – автор комментария «Тилака» глоссирует viṣajjantaṃ как vilambaṃ kurvantam (медлящего). В критическом издании приведен другой вариант tvāṃ ca śrutvā vipadyantam (см.: Jhala 1966: 289), что Голдмены переводят как «Если бы я узнала, что с тобой что-то случилось…» (if I should learn that something had happened to you…) (см.: Goldman 1984: 225)."}]}, {"verse_id": "5.40.13", "verse": "13", "sanskrit_iast": "tvacchokavimukho rāmo devi satyena te śape । rāme śokābhibhūte tu lakṣmaṇaḥ paritapyate ॥13॥", "leonov_ru": "«Из-за скорби по тебе [от всего остального] отвернулся Рама, царевна, истинно клянусь тебе. Из-за того же, что Рама поглощен скорбью, страдает Лакшмана.", "commentary": {"tilaka": "त्वच्छोकविमुखस्त्वत्स्थित्यपरिज्ञानजशाकेन त्वदुद्धारप्रवृत्तिविमुखः, न तु ज्ञात्वेति सत्येन ते शपे", "bhusana": "त्वच्छोकविमुखो रामो देवि सत्येन ते शपे ।\n\nरामे दुःखाभिभूते तु लक्ष्मणः परितप्यते"}, "has_tier1": true, "notes": [{"id": "tier1:5.40.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "От всего отвратился Рама / По тебе он тоскует ((tvatsthityaparijñānajaśokena tvaduddhārapravṛttivimukhaḥ) – букв. «из-за горя, рожденного знанием о твоем положении, он отвернулся от твоего освобождения» согласно комментарию «Тилака», речь здесь идет о том, что Рама не приходит на помощь Сите из-за того, что горюет по ней."}]}, {"verse_id": "5.40.14", "verse": "14", "sanskrit_iast": "dṛṣṭā kathaṃ cid bhavatī na kālaḥ pariśocitum । imaṃ muhūrtaṃ duḥkhānām antaṃ drakṣyasi bhāmini ॥14॥", "leonov_ru": "Найдена ты [мной] с трудом, не время скорбеть. Скоро, прекрасная, увидишь ты конец своим бедам.", "commentary": {"bhusana": "कथंचिद् भवती दृष्टा न कालः परिशोचितुम् ।\n\nइमं मुहूर्तं दुःखानामन्तं द्रक्ष्यामि भामिनि", "siromani": "दृष्टेति"}, "has_tier1": false, "notes": [{"id": "crosstext:5.40.14:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "- dṛś tu bhrātṛ pradā", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.40.14,17,23–24", "work_label": "Rām", "verse_address": "Rām 5.65.25,26,33,34,35 (крит. изд.)", "parallel_sa_iast": "imaṁ ca tīvraṁ mama śokavegaṁ rakṣobhir ebhiḥ brūyāstu rāmasya gataḥ samīpaṁ śivaśca te .dhvāstu |", "sundara_sa_iast": "imaṁ ca tīvraṁ mama śokavegaṁ rakṣobhir ebhiḥ brūyāstu rāmasya gataḥ samīpaṁ śivaśca te .dhvāstu |", "quality": "GOOD", "source": "DCS parallel-search (GOOD); Rām 5.65.25,26,33,34,35 (крит. изд.)", "edition_flag": "vulgate", "shloka_critical": "V.38.14,17,22,23", "verse_address_vulgate": "Rām V.67.41–43 (вульгата)"}]}, {"verse_id": "5.40.22", "verse": "22", "sanskrit_iast": "hanūman siṃhasaṃkāśau bhrātarau rāmalakṣmaṇau । sugrīvaṃ ca sahāmātyaṃ sarvān brūyā anāmayam ॥22॥", "leonov_ru": "«Хануман, подобным львам братьям Раме и Лакшмане, И Сугриве с его советниками, всем ты должен рассказать о [моем] здоровье (благополучии).", "commentary": {"tilaka": "उत्पाते उत्प्लवने कृतोत्साहम् ।। 5.40.20,21 ।।\n\nअनामयमारोग्यम्", "bhusana": "हनुमन् सिंहसङ्काशौ भ्रातरौ रामलक्ष्मणौ ।\n\nसुग्रीवं च सहामात्वं सर्वान् ब्रूया ह्यनामयम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.40.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "anāmaya", "note_ru": "Анамая (anāmaya, adj./n.) — от an- (отриц.) + āmaya m. «болезнь, недуг» (√am-, «страдать от болезни»). MW: anāmaya 'free from disease, healthy, well'; n. 'freedom from disease, health'. В формуле «sarvān brūyā anāmayam» (V.40.22) это слово функционирует как приветственное пожелание — аналог «будьте здоровы»/«желаю здравствовать». Апте: anāmaya 'salutation, welfare (used in messages)'. Это редкий случай, когда прилагательное субстантивируется в функции приветствия; в эпосе anāmayam — стандартная приветственная формула при передаче послания: «передай [пожелание] здравствования». Подстрочник нейтрально переводит «здравствуй»; семантический слой «здоровье/отсутствие болезни» как ценность сам по себе значим.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:anAmaya+dic_apte:anAmaya+Indological:greeting_formula"}]}, {"verse_id": "5.40.23", "verse": "23", "sanskrit_iast": "yathā ca sa mahābāhur māṃ tārayati rāghavaḥ । asmād duḥkhāmbusaṃrodhāt tvaṃ samādhātum arhasi ॥23॥", "leonov_ru": "Должен ты постараться, чтобы мощнорукий Рагхава Спас меня из пучины бедствий (океана страданий).", "commentary": {"tilaka": "त्वं समाधातुमित्यस्य तथेत्यादिः । समाधानं संविधानम्, \"अथापि स महाबाहुः\" इति पाठे यथेत्यपि पूरणीयमेव । यद्यपि श्रुतवृत्तान्तः स्वयमेव यतिष्यति तथापि त्वमपि यथा मां शीघ्रं तारयसि तथा संविधानं कुर्वित्यर्थः ।। 5.40.23,24 ।।\n\nतत्कार्यं लङ्कागमनप्रयोजनमल्यशेषम् । देवीदर्शनरूपस्य महतः प्रधानकृत्यस्य निष्पन्नत्वात्परबलदर्शनरूपस्यानुषङ्गिकत्वादल्पशेषत्वमित्याशयः", "bhusana": "त्वामिति । अर्धसञ्जातसस्या अर्धोत्पन्नसस्या\nयथा च स महाबाहुर्मां तारयति राघवः ।\n\nअस्माद्दुःखाम्बुसंरोधात् त्वं समाधातुमर्हसि", "siromani": "यथेति । अयं पूर्वं व्याख्यातः"}, "has_tier1": false, "notes": [{"id": "phase2:5.40.23:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tvaṃ samādhātum arhasi", "note_ru": "По „Тилаке“, обращение Ситы не требует, чтобы Хануман сам её спас — «устройство» (saṃvidhāna), о котором она просит, состоит лишь в том, чтобы он ускорил дело: главная задача (её обнаружение) уже выполнена, а последующее (разведка вражеских сил) второстепенно. Тилака также отмечает вариант чтения начала стиха — athāpi sa mahābāhuḥ вместо yathā ca sa mahābāhuḥ.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "поясняет неочевидный из подстрочника смысл просьбы (не личное спасение, а ускорение уже почти завершенного дела) и фиксирует вариант чтения, отсутствующие в тексте перевода и в существующих заметках", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "crosstext:5.40.23:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "tvad bhrātṛ", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.40.23", "work_label": "Rām", "verse_address": "Rām 5.37.8 (крит. изд.)", "parallel_sa_iast": "yathā ca sa mahābāhur māṁ tārayati rāghavaḥ |asmād duḥkhāmbusaṁrodhāt tvaṁ samādhātum arhasi ||", "sundara_sa_iast": "yathā ca sa mahābāhur māṁ tārayati rāghavaḥ |asmād duḥkhāmbusaṁrodhāt tat samādhātum arhasi ||", "quality": "GOOD", "source": "DCS parallel-search (GOOD); Rām 5.37.8 (крит. изд.)", "edition_flag": "vulgate", "shloka_critical": "V.38.22", "verse_address_vulgate": "Rām V.39.9 (вульгата)"}]}, {"verse_id": "5.40.24", "verse": "24", "sanskrit_iast": "imaṃ ca tīvraṃ mama śokavegaṃ । rakṣobhir ebhiḥ paribhartsanaṃ ca । brūyās tu rāmasya gataḥ samīpaṃ । śivaś ca te 'dhvāstu haripravīra ॥24॥", "leonov_ru": "О силе моей жестокой скорби, И об оскорблениях, [которым меня подвергают] эти ракшасы, Должен ты рассказать, придя к Раме, И да будет благополучным твой путь, о герой среди обезьян.", "commentary": {"bhusana": "इमं च तीव्रं मम शोकवेगं रक्षोभिरेभिः परिभर्त्सनं च ।\n\nब्रूयास्तु रामस्य गतः समीपं शिवश्च ते ऽध्वा ऽस्तु हरिप्रवीर\nइमं चेति । शिवश्च ते ऽध्वा ऽस्तु हरिप्रवीरेति । शिवः अव्याहत इत्यर्थः", "siromani": "इदमिति । रामस्य समीपं गतस्त्वं मम शोकवेगं रक्षोमिः परिभर्त्सनं च ब्रूयाः"}, "has_tier1": false, "notes": [{"id": "lexical:5.40.24:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śokavega", "note_ru": "Шокавега (śoka-vega, m.) — тат-пуруша: śoka m. «скорбь, горе» (√śuc-, «скорбеть, пылать», класс I, Whitney #254) + vega m. «скорость, стремительный поток, порыв» (√vij-, «устремляться», или √veg-). MW: vega 'a stream, current; speed, velocity; onset, attack; agitation of mind'. Vega — физический термин древнеиндийской натурфилософии (Nyāya-Vaiśeṣika): одно из guṇa-s, обозначающее кинетическую силу движения. В психологическом контексте vega описывает непреодолимый порыв эмоции — буквально «кинетическую силу скорби». Śokavega Ситы — не метафора уныния, а интенсивная сила, имеющая физически-деструктивный потенциал; отсюда просьба Ситы к Хануману «унести» её vega своим приходом.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:vega+dic_mw:Soka (√śuc-)+Indological:vega_physics"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s40_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

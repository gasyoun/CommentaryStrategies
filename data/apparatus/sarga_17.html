<script>
const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 17, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 37, "verses_with_notes": 15, "notes_by_layer": {"tier1": 8, "lexical": 8, "phase2": 2, "edition": 0, "crosstext": 2}}, "sarga": 17, "verses": [{"verse_id": "5.17.1", "verse": "1", "sanskrit_iast": "tataḥ kumudakhaṇḍābho nirmalaṃ nirmalodayaḥ । prajagāma nabhaś candro haṃso nīlam ivodakam ॥1॥", "leonov_ru": "Тогда подобная купе белых лотосов, чисто-восходящая, на чистый Небосклон взошла луна, словно дикий гусь – на синюю воду.", "commentary": {"bhusana": "ततः कुमुदषण्डाभो निर्मलो निर्मलं स्वयम् ।\n\nप्रजगाम नभश्चन्द्रो हंसो नीलमिवोदकम्", "siromani": "हनुमत्कर्तृकस्पष्टदर्शनं वर्णयितुमाह तत इति । कुमुदखण्डाभः कुमुदसमूहसदृशः निर्मलोदयः चन्द्रः निर्मलं नभः प्रजगाम । तत्र दृष्टान्तः, हंसो नीलमुदकमिव"}, "has_tier1": false, "notes": [{"id": "lexical:5.17.1:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kumudakhaṇḍa", "note_ru": "Кумудакханда (kumuda-khaṇḍa, n.) — тат-пуруша: kumuda «белый ночной лотос» (Nymphaea alba / esculenta, раскрывающийся ночью при луне) + khaṇḍa «группа, скопление». MW: kumuda 'the white water-lily (which opens at night)'. Луна сравнивается с купой белых ночных лотосов — метафора обратная: не лотосы белы как луна, а луна похожа на поле лотосов. Ночной лотос в санскритской поэтике устойчиво связан с луной (его «хозяин» — candraḥ kumudeśvaraḥ), что делает это уподобление взаимным и поэтически богатым. Подстрочник даёт «купе белых лотосов», не раскрывая символику ночной привязанности kumuda.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:kumuda"}, {"id": "lexical:5.17.1:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "haṃsa", "note_ru": "Хамса (haṃsa, m.) — дикий гусь / лебедь (Anser indicus, «индийский гусь»); в классической санскритской поэтике — птица белизны, благородства и разборчивости (способность отделить молоко от воды — kṣīra-nīra-viveka). MW: haṃsa 'a goose, gander, swan'. Здесь haṃsa движется по тёмно-синей воде (nīlam udakam) — контраст белой птицы и синей воды образует тот же хроматический код, что и луна над ночным небом. Эпический смысл двойной: луна как haṃsa «плывёт» по небосводу. Подстрочник передаёт «дикий гусь», не вскрывая семиотику haṃsa в санскритской поэтике.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:haMsa"}]}, {"verse_id": "5.17.2", "verse": "2", "sanskrit_iast": "sācivyam iva kurvan sa prabhayā nirmalaprabhaḥ । candramā raśmibhiḥ śītaiḥ siṣeve pavanātmajam ॥2॥", "leonov_ru": "Словно оказывая услугу своим сиянием чисто-сияющая Луна холодными лучами ободрила (освежила) сына ветра.", "commentary": {"bhusana": "साचिव्यमिव कुर्वन् स प्रभया निर्मलप्रभः ।\n\nचन्द्रमा रश्मिभिः शीतैः सिषेवे पवनात्मजम्", "siromani": "साचिव्यमिति । शीतै रश्मिभिरुपलक्षितः निर्मलप्रभश्चन्द्रमाः प्रभया स्वकान्त्या साचिव्यं साहाय्यमिव कुर्वन् पवनात्मजं सिषेवे"}, "has_tier1": false, "notes": [{"id": "lexical:5.17.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sācivya", "note_ru": "Сачивья (sācivya, n.) — «служение, содействие, должность советника/сопровождающего»; от saciva m. «советник, сопровождающий, друг» (от sac- «идти вместе, сопровождать», Whitney #1022). MW: sācivya 'the office of a minister or companion; companionship'. Луна «исполняет должность советника» Ханумана, сопровождая его лучами — концептуальный перенос административного термина (saciva = министр) в космическую плоскость. Это пример эпического «одухотворения» луны: она не просто светит, а действует как царский советник. Подстрочник нейтрально переводит «словно оказывая услугу».", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:sAcivya"}]}, {"verse_id": "5.17.3", "verse": "3", "sanskrit_iast": "sa dadarśa tataḥ sītāṃ pūrṇacandranibhānanām । śokabhārair iva nyastāṃ bhārair nāvam ivāmbhasi ॥3॥", "leonov_ru": "И вот он увидел Ситу, чье лицо подобно полной луне, Тонущую под бременем скорби, словно корабль с грузом в море.", "commentary": {"bhusana": "तत इत्यादि । प्रजगाम प्रकर्षेण जगाम, आकाशपरभागं प्राप्त इत्यर्थः\nअनासा अतिनासाश्च तिर्यङ्नासा विनासिकाः ।\n\nगजसन्निभनासाश्च ललाटोच्छ्वासनासिकाः\nस ददर्श ततः सीतां पूर्णचन्द्रनिभाननाम् ।\n\nशोकभारैरिव न्यस्तां भारैर्नावमिवाम्भसि\nस इति । शोकभारैर्न्यस्तामिव आक्रान्तामिव स्थिताम् । अत एव भारैर्न्यस्ता नावमिव स्थिताम्", "siromani": "स इति । स हनूमान् शोकभारैः न्यस्तां नतामिव अत एव भारैर्न्यस्तामम्भसि नावमिव प्रतीयमानां सीतां ददर्श"}, "has_tier1": false, "notes": [{"id": "crosstext:5.17.3:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "pūrṇacandra-nibha-anana", "note_ru": "pūrṇacandranibhānanām («с ликом, подобным полной луне») — Хануман впервые видит Ситу. Лунноликость — каноническая упамана женской/героической красоты эпоса. В Сказании о Нале ею описана Дамаянти: «pūrṇacandrānanāṃ śyāmāṃ … pūrṇacandraprabhām iva» (MBh III.65.10–11) — «с ликом, подобным полной луне … сияющую, словно полная луна». Совпадение лунного сравнения у двух образцовых героинь подтверждает формульный, традиционный характер описания, который подстрочник передаёт буквально.", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.17.3", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparvan (Nalopākhyāna) III.65.10"}]}, {"verse_id": "5.17.5", "verse": "5", "sanskrit_iast": "ekākṣīm ekakarṇāṃ ca karṇaprāvaraṇāṃ tathā । akarṇāṃ śaṅkukarṇāṃ ca mastakocchvāsanāsikām ॥5॥", "leonov_ru": "Одноглазых, одноухих, покрытых ушами, Безухих, с заостренными ушами, с носом на лбу.", "commentary": {"bhusana": "एकाक्षीमेककर्णां च कर्णप्रावराणां तथा ।\n\nअकर्णां शङ्कुकर्णां च मस्तकीच्छ्वासनासिकाम्", "siromani": "दर्शनप्रकारमाह एकेत्यादिभिः । एकाक्षीप्रभृतीः रोमहर्शणदर्शनाः ताः राक्षसीः ददर्श । तस्य शिंशुपाभिधतरोः अधस्तात् देवीं सीतां च ददर्श । तत्र कर्णावेव प्रावरणौ शरीराच्छादकौ यस्याः अतविशालकर्णविशिष्टामित्यर्थः, मस्तके उच्छ्वासहेतुभूतनासिका यस्यास्तां तन्वी सूक्ष्मा दीर्घा स्थूला शिरोधरा ग्रीवा यस्यास्तां चिबुकौ चिबुकसंबद्धौ ओष्ठौ यस्यास्ताम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.17.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…ушами покрытую (karṇaprāvaraṇāṃ) – выражение karṇaprāvaraṇā комментарий «Тилака» толкует как viśālakarṇī, то есть «имеющая широкие уши». Комментарий «Бхушана» уточняет, что уши покрывали голову ракшаси подобно капюшону. Согласно комментарию «Широмани», уши у ракшаси закрывали тело, то есть слово prāvaraṇа понимается в значении «одежда, закрывающая верхнюю часть тела». С такой интерпретацией согласны Голдмены, которые перевели это полустишие как «While another’s ears covered her entire upper body» (см.: Goldman 1984: 398)."}]}, {"verse_id": "5.17.8", "verse": "8", "sanskrit_iast": "hrasvāṃ dīrghāṃ ca kubjāṃ ca vikaṭāṃ vāmanāṃ tathā । karālāṃ bhugnavaktrāṃ ca piṅgākṣīṃ vikṛtānanām ॥8॥", "leonov_ru": "Низких, высоких и горбатых, рослых и карлиц, С разинутыми ртами, с искривленными ртами, желтоглазых, с искаженными лицами,", "commentary": {"bhusana": "ह्रस्वदीर्घां तथा कुब्जां विकटां वामनां तथा ।\n\nकरालां भुग्नवक्त्रां च पिङ्गाक्षीं विकृताननाम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.17.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Горбатую… (vikaṭāṃ) – автор «Тилаки» понимает слово vikaṭā как «та, чье тело искривлено» (vakraśarīrā). Комментарий «Бхушана» толкует это слово как «та, у которой широкие голени» (sthūlajaṅghā). Голдмены в своем переводе следуют комментарию «Тилака» (см.: Goldman 1984: 160).Ощерившуюся… (karālām) – cлово karālā комментарий «Тилака» толкует как «имеющая вызывающий ужас черный цвет» (bhayaṃkarakṛṣṇavarnā). Комментарий «Таттвадипика» предлагает другую интерпретацию: «имеющая выступающие зубы» (danturā). Такое же толкование дает и комментарий «Бхушана»."}]}, {"verse_id": "5.17.10", "verse": 10, "sanskrit_iast": "", "leonov_ru": "", "commentary": {}, "has_tier1": true, "notes": [{"id": "tier1:5.17.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "С головами, погруженными в тело (nikhātaśirasaḥ) – комментарий «Тилака» интерпетирует этот композит как «те, у которых голова ушла в грудь, как у Кабандхи». В III книге «Рамаяны» ракшаса Кабандха описывается так: «Огромный, без головы и шеи, // С мордой посреди брюха» (III, 69, 27). Само имя «Кабандха» означает «безголовое тело»."}], "verse_not_segmented": true}, {"verse_id": "5.17.13", "verse": "13", "sanskrit_iast": "hastipādā mahāpādā gopādāḥ pādacūlikāḥ । atimātraśirogrīvā atimātrakucodarīḥ ॥13॥", "leonov_ru": "Со слоновьими ступнями, с огромными ступнями, с коровьими копытами, со ступнями, покрытыми шерстью, С огромными головами и шеями, с огромными грудями и животами.", "commentary": {"bhusana": "हस्तिपादा महापादा गोपादाः पादचूडिकाः ।\n\nअतिमात्रशिरोग्रीवा अतिमात्रकुचोदरीः"}, "has_tier1": true, "notes": [{"id": "tier1:5.17.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «mahāpādā» Опущено"}]}, {"verse_id": "5.17.17", "verse": "17", "sanskrit_iast": "māṃsaśoṇitadigdhāṅgīr māṃsaśoṇitabhojanāḥ । tā dadarśa kapiśreṣṭho romaharṣaṇadarśanāḥ ॥17॥", "leonov_ru": "С телами, пахнущими мясом и кровью, их, чья пища – мясо и кровь, Чей облик заставляет вздыбиться волоски на теле, увидел лучший из обезьян.", "commentary": {"bhusana": "मांसशोणितदिग्धाङ्गीर्मांसशोणितभोजनाः ।\n\nता ददर्श कपिश्रेष्ठो सोमहर्षणदर्शनाः ।\n\nस्कन्धवन्तमुपासीनाः परिवार्य वनस्पतिम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.17.17:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "romaharṣaṇa", "note_ru": "Ромахаршана (roma-harṣaṇa, n./adj.) — «поднимающий волоски» от roma «волос тела» + harṣaṇa «возбуждение, поднятие» (√hṛṣ-, «ощетиниваться, испытывать трепет», Whitney #234). MW: romaharṣa 'bristling of the hair (from fear, cold, or joy)'. Это стандартный эпический маркер крайнего аффективного состояния — от ужаса и от религиозного восторга одинаково. Здесь применяется к виду ракшаси: их облик вызывает буквальный физиологический ужас. Выражение устойчиво в «Махабхарате» как признак сакральной или устрашающей силы; в этой главе оно описывает не одного монстра, а целый отряд, что усиливает ужасность охраны Ситы.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:romaharzoRa"}]}, {"verse_id": "5.17.20", "verse": "20", "sanskrit_iast": "kṣīṇapuṇyāṃ cyutāṃ bhūmau tārāṃ nipatitām iva । cāritravyapadeśāḍhyāṃ bhartṛdarśanadurgatām ॥20॥", "leonov_ru": "Подобную звезде, исчерпавшей заслуги, изгнанной [с неба] и упавшей на землю, Богатую славой добродетельного поведения, несчастную, [желающую] встречи с мужем.", "commentary": {"bhusana": "क्षीणपुण्यां च्युतां भूमौ तारां निपतितामिव ।\n\nचारित्रव्यपदेशाढ्यां भर्तृदर्शनदुर्गताम्\nच्युतां स्थानाच्चलिताम् । चारित्रव्यपदेशाढ्यां पतिव्रताधर्माचरणख्यातिसम्पन्नाम् । भर्तृदर्शनेन दुर्गतां दरिद्राम्, भर्तृदर्शनरहितामित्यर्थः"}, "has_tier1": false, "notes": [{"id": "lexical:5.17.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kṣīṇapuṇya", "note_ru": "Кшинапунья (kṣīṇa-puṇya, adj.) — «чья заслуга (puṇya) истощилась» (kṣīṇa — p.p.p. от √kṣī-, «убывать, истощаться», Whitney #972). MW: puṇya 'virtue, moral or religious merit'; kṣīṇa 'waned, diminished'. Образ падающей звезды прямо связан с индийской космологической концепцией: звёзды держатся на небе силой накопленного puṇya; когда puṇya исчерпан, звезда падает на землю (ср. Rāmāyaṇa 3.46.26, Mahābhārata 12.310). Сита сравнивается с упавшей звездой — не просто несчастной, а изгнанной с законного места вследствие космического «банкротства». Подстрочник даёт верный перевод «исчерпавшей заслуги», но не раскрывает доктрину.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:kzIRapuRya"}]}, {"verse_id": "5.17.2024", "verse": "2024", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"siromani": "तामेव वर्णयन्नाह क्षीणेति । क्षीणपुण्याम् अत एव निपतितां तारामिव चारित्रव्यपदेशेन मुख्याचरणेन आढ्यां भर्तृदर्शनं दुर्गतं दुष्प्रापं यस्याः तां भर्तृवात्सल्येन पत्युरतिप्रीत्या भूषितां राक्षसाधिपेन संरुद्धाम् अत एव बन्धुभिर्विनाकृताम् अत एव सिंहसंरुद्धां वियूथां यूथहीनां बद्धां स्वयूथविषयकातिस्नेहयुक्तां गजवधूमिव पयोदान्ते वर्षापाये शारदाभ्रैरावृतां चन्द्ररेखामिव असंस्पर्शात् पतिस्पर्शराहित्यात् क्रिष्टरूपां पराभूतस्वरूपाम् अत एव अयुक्तां वादकहीनां वल्लकीं वीणामिव भर्तृहिते युक्तां रक्षसां वशे अयुक्ताम् अयोग्यां शोकसागरमाप्लुतां सग्रहां क्रूरग्रहविशिष्टां रोहिणीमिव ताभिः पूर्वोक्तराक्षसीभिः परिवृताम् अकुसुमितां कुसुमरहितां लतामिव तां सीतां स हनूमान् ददर्श । सार्धश्लोकपञ्चकमेकान्वयि"}, "has_tier1": true, "notes": [{"id": "tier1:5.17.2024:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Среди беспечальной рощи / В пучине печали тонула (aśokavanikāmadhye śokasāgaram āplutām) – букв. «посреди рощи ашоки». Здесь снова игра созвучиями śoka (горе, печаль) – aśoka (название дерева, букв. «беспечальный»).", "anchor_verse_id": "5.17.24"}, {"id": "lexical:5.17.2024:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "rohiṇī", "note_ru": "Рохини (rohiṇī, f.) — (1) «красная, рыжеватая»; (2) Созвездие Гиады / Альдебаран, любимая жена Луны (Candra) в ведийской астрономии. MW: rohiṇī 'a name of an asterisk (the 4th lunar mansion = the Pleiades or Hyades)'; также «любимая жена Луны». Здесь Сита — Рохини, «затмённая» окружающими её ракшаси (sagrahā, «с захватчиком/планетой»). Образ точен астрологически: в индийской астрологии «захват» (graha) звезды нечистой планетой (papagraha) означает её страдание. Сита = Рохини захвачена Раваной как papagraha. Подстрочник даёт «затмившейся Рохини» без комментария к астрологической системе.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:rohiRI", "anchor_verse_id": "5.17.24", "collision_tier1": true}]}, {"verse_id": "5.17.21", "verse": "21", "sanskrit_iast": "bhūṣaṇair uttamair hīnāṃ bhartṛvātsalyabhūṣitām । rākṣasādhipasaṃruddhāṃ bandhubhiś ca vinākṛtām ॥21॥", "leonov_ru": "Лишенную лучших украшений, украшенную [только] любовью к мужу, Находящуюся в плену у владыки ракшасов, разлученную с близкими.", "commentary": {"bhusana": "भूषणैरुत्तमैर्हीनां भर्तृवात्सल्यभूषणाम् ।\n\nराक्षसाधिपसंरुद्धां बन्धुभिश्च विनाकृताम्\nभर्तृवात्सल्यभूषणां वात्सल्यपदमत्र स्नेहमात्रवाचि"}, "has_tier1": true, "notes": [{"id": "tier1:5.17.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «ākṣasādhipa» Опущено"}, {"id": "tier1:5.17.21:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "У нее из всех украшений / Только к мужу любовь осталась (bhūṣaṇair uttamair hīnāṃ bhartṛvātsalyabhūṣitām) – букв. «лишенную лучших украшений, [но] украшенную любовью к мужу»."}, {"id": "lexical:5.17.21:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bhartṛvātsalya", "note_ru": "Бхартривасалья (bhartṛ-vātsalya, n.) — «нежная любовь к мужу»; bhartṛ «господин, муж» (от √bhṛ-, «нести, содержать», Whitney #588) + vātsalya «нежная привязанность» (от vatsa «телёнок» → «любимый ребёнок»). MW: vātsalya 'fondness for offspring or young, tender love'. Словосочетание строится на парадоксе: Сита лишена внешних украшений (bhūṣaṇa), но «украшена» (bhūṣita) невидимым — своей привязанностью к мужу. Это прямое переопределение концепта «украшения» (alaṃkāra): не ювелирное, а нравственное. Типичная пативратā-риторика Вальмики, но здесь создана тонкой семантической игрой bhūṣaṇair hīnā / bhartṛvātsalyabhūṣitā.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:vAtsalya", "collision_tier1": true}]}, {"verse_id": "5.17.22", "verse": "22", "sanskrit_iast": "viyūthāṃ siṃhasaṃruddhāṃ baddhāṃ gajavadhūm iva । candrarekhāṃ payodānte śāradābhrair ivāvṛtām ॥22॥", "leonov_ru": "Подобную слонихе, отбившейся от стада, на которую напали львы, Подобную серпу луны, затянутому осенними тучами в конце сезона дождей.", "commentary": {"bhusana": "वियूथां सिंहसंरुद्धां बद्धां गजवधूमिव ।\n\nचन्द्ररेखां पयोदान्ते शारदाभ्रैरिवावृताम् ।\n\nक्लुष्टरूपामसंस्पर्शादयुक्तामिव वल्लकीम् ।\nपयोदान्ते वर्षान्ते । चन्द्ररेखायाः स्पष्टास्पष्टत्वद्योतनायेदं विशेषणम् । असंस्पर्शात् उद्वर्तनादिसंस्कारराहित्यात् । अयुक्ताम् अनारोपिततन्त्रीम् । वल्लकीं वीणाम्"}, "has_tier1": false, "notes": [{"id": "phase2:5.17.22:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "candrarekhāṃ … śāradābhrair ivāvṛtām", "note_ru": "По Бхушане, эпитет «затянутый осенними тучами» приложен к серпу луны не случайно: он призван показать зыбкую грань видимого/невидимого (spaṣṭāspaṣṭatva) — тот же парадокс, что через три стиха скажется о самой Сите прямо: «не сияет и все же сияет» (5.17.25). Сравнение с луной здесь заранее готовит эту формулу.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "Вскрывает композиционную связь: образ полу-скрытого лунного серпа в этом стихе — подготовка к явной формуле «сияет и не сияет» в 5.17.25; подстрочник передаёт оба сравнения порознь, не показывая их переклички.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.17.23", "verse": "23", "sanskrit_iast": "kliṣṭarūpām asaṃsparśād ayuktām iva vallakīm । sītāṃ bhartṛhite yuktām ayuktāṃ rakṣasāṃ vase ॥23॥", "leonov_ru": "Утратившую красоту подобно лютне, чьи струны ослабли из-за того, что их [долго] не касались, Ситу, достойную заботы мужа, недостойную быть во власти ракшасов.", "commentary": {"bhusana": "सीतां भर्तृवशे युक्तामयुक्तां राक्षसीवशे"}, "has_tier1": false, "notes": [{"id": "lexical:5.17.23:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vallakī", "note_ru": "Валлаки (vallakī, f.) — название лютни, разновидности vīṇā с семью струнами; инструмент, чьи струны ослабевают при длительном неиспользовании. MW: vallakī 'a kind of lute'. Сравнение Ситы с vallakī, «струны которой ослабли из-за того, что их не касались» (asaṃsparśāt), является редким инструментальным сравнением у Вальмики — vīṇā / vallakī в санскритской поэтике олицетворяет голос, красоту и одушевлённость (ср. образ тела как вины в Upaniṣad). Струны = жизненная сила; неприкосновенность = отрыв от мужа. Важно, что kliṣṭarūpā («утратившая красоту») прямо соотнесено с техническим процессом: инструмент теряет звук.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vallakI"}]}, {"verse_id": "5.17.25", "verse": "25", "sanskrit_iast": "dadarśa hanumāṃs tatra latām akusumam iva । sā malena ca digdhāṅgī vapuṣā cāpy alaṃkṛtā । mṛṇālī paṅkadigdheva vibhāti ca na bhāti ca ॥25॥", "leonov_ru": "Увидел там Хануман [Ситу], подобную лиане без цветов. Тело ее было покрыто грязью, но телом (телесной красотой) все же прекрасную, Словно стебель лотоса, запачканный грязью, не сияет и все же сияет.", "commentary": {"bhusana": "ददर्श हनुमान् देवीं लतां कुसुमितामिव ।\n\nसा मलेन च दिग्धाङ्गी वपुषा चाप्यलङ्कृता ।\n\nमृणाली पङ्कदिग्धेव विभाति न विभाति च\nलतां कुसुमितामिव तथा दर्शनीयामित्यर्थः", "siromani": "सेति । मलेन दिग्धं प्रवृद्धमङ्गं यस्याः सा वपुषा शरीरकान्त्या अलंकृता पङ्कदिग्धा कर्दमसंलग्ना मृणाली इव विभाति न भाति च । अर्धद्वयमेकान्वयि"}, "has_tier1": true, "notes": [{"id": "tier1:5.17.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Так прелесть свою хранит, / стебель лотоса в тине (mṛṇālī paṅkadigdheva vibhāti ca na bhāti ca) – букв. «[она], подобная стеблю лотоса, вымазанному тиной, и не сияла, и [в то же время] сияла»."}]}, {"verse_id": "5.17.32", "verse": "32", "sanskrit_iast": "namaskṛtvā ca rāmāya lakṣmaṇāya ca vīryavān । sītādarśanasaṃhṛṣṭo hanūmān saṃvṛto 'bhavat ॥32॥", "leonov_ru": "И восхвалив Раму и Лакшману, мужественный Хануман, Обрадованный тем, что увидел Ситу, остался скрытым.", "commentary": {"bhusana": "नमस्कृत्वा स रामाय लक्ष्मणाय च वीर्यवान् ।\n\nसीतादर्शनसंहृष्टो हनुमान् संवृतो ऽभवत्\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे सप्तदशः सर्गः ।। 5.17।।\n\nनमस्कृत्वेति । संवृतः राक्षस्यदर्शनाय शिंशुपापर्णैर्गूढो ऽभूत्", "siromani": "नमस्कृत्वेति । सीतादर्शनसंहृष्टो हनूमान् रामाय लक्ष्मणाय च नमस्कृत्वा संवृतः शाखाविशेषे निलीनो ऽभवत्"}, "has_tier1": false, "notes": [{"id": "phase2:5.17.32:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "saṃvṛto 'bhavat", "note_ru": "«Остался скрытым» (saṃvṛtaḥ) Бхушана и Широмани поясняют конкретно: Хануман спрятался в листве той же шимшапы, под которой сидит Сита (по Бхушане — «скрыт листьями шимшапы»; по Широмани — «укрылся в одной из её ветвей»), чтобы остаться незамеченным для ракшаси-стражниц.", "type": "Б", "source_commentary": ["bhusana", "siromani"], "why_proposed": "Конкретизирует, где и как именно скрылся Хануман (в листве той же шимшапы) и от кого — подстрочник оставляет «остался скрытым» без указания места и цели укрытия.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "crosstext:5.17.32:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "namaskāra", "note_ru": "Перед решающими действиями Хануман совершает namaskāra богам, Раме и Лакшману (ср. V.13.56 васу, рудрам, адитьям). Ритуальный жест поклонения (namas) — тот же, что в кульминации теофании Гиты, где Арджуна осыпает Вишварупу поклонами со всех сторон: БхГ 11.40 «namaḥ purastād atha pṛṣṭhatas te namo 'stu te sarvata eva sarva …». Помета отмечает namas как формульный маркер благоговейного предстояния — связующий героическое действие с религиозным актом. Свидетельство: уровень шлоки (мягкое).", "type": "В", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.17.32", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bhagavadgītā 11.40 (Семенцов)"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s17_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

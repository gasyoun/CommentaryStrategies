<script>
const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 64, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 49, "verses_with_notes": 21, "notes_by_layer": {"tier1": 11, "lexical": 10, "phase2": 2, "edition": 4, "crosstext": 2}}, "sarga": 64, "verses": [{"verse_id": "5.64.4", "verse": "4", "sanskrit_iast": "sa praviṣṭo madhuvanaṃ dadarśa hariyūthapān । vimadān uddhatān sarvān mehamānān madhūdakam ॥4॥", "leonov_ru": "Войдя в Мадхувану, увидел он вождей обезьян. Все они, гордые, протрезвели и мочились медом, ставшим жидкостью.", "commentary": {"bhusana": "स प्रविष्टो मधुवनं ददर्श हरियूथपान् ।\n\nविमदानुत्थितान् सर्वान् मेहमानान् मधूदकम्\nविमदानित्यत्र हेतुमाह मेहमानामिति । मेहमानान् मेहयतः, मूत्रयत इत्यर्थः । एतेन मूत्रणान्मधूनि जीर्णानीति गम्यते । अत एव विमदत्वम् । मधूनि च उदकानि च मधूदकमिति द्वन्द्वैकवद्भावः । उदकानि चात्र अनुपानत्वेन पीतानि । तदाह बाहटः \"अनुपानं हिमं वारि यवगोधूमयोर्हितम् । दध्नि मद्ये बिसे क्षौद्रे कोष्णं पिष्टमयेषु च ।।\" इति", "siromani": "स इति । मधुवनं प्रविष्टः स दधिमुखः मधुरूपमुदकं मेहमानान् मूत्रयतः विमदान् हरियूथपान् ददर्श"}, "has_tier1": true, "notes": [{"id": "tier1:5.64.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…обезьяны гордые (hariyūthapān... uddhatān) - Голдмены переводят uddhata как ill-mannered, отмечая, что это слово допускает различные варианты перевода (см.: Goldman 1984: 286, 534).Мед с мочою у них выходит (mehamānān madhūdakam) - букв. “мочащихся медовой водою”."}, {"id": "lexical:5.64.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "madhuvana", "note_ru": "Мадхувана (madhu-vana, n.) — тат-пуруша: madhu «мёд, медовый напиток» + vana «лес». Это не просто лес с мёдом — madhuvana является сакральным заповедником Сугривы (MW: madhu 'sweet, honey; spirituous liquor'), охраняемым лично дядей Дадхимукхой. Вандары, разгромившие его в экстазе победы, совершают нарушение, формально сопоставимое с посягательством на царскую собственность. Эпизод создаёт комическое интермеццо после напряжения поисков Ситы, где «медовое ликование» прямо воплощает переполняющую вандаров радость.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:maDuvana", "collision_tier1": true}, {"id": "lexical:5.64.4:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vimada", "note_ru": "Вимада (vi-mada, adj.) — vi- (при глагольных основах = завершённость) + mada «опьянение, гордость, течка (у слонов)». MW: mada 'intoxication, pride; the juice that exudes from an elephant's temples'. В данном контексте обезьяны описаны как vimadān uddhatān — «опьяневших без меры»: эпитет применён иронически. Mada слонов — специфический термин для мускусоподобной жидкости из височных желёз возбуждённого слона; применение его к обезьянам создаёт гиперболическое уподобление боевым слонам.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:vimada", "collision_tier1": true}, {"id": "phase2:5.64.4:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mehamāna", "note_ru": "Мехамана (mehamāna, «мочащиеся») — Бхушана поясняет, что обезьяны названы «протрезвевшими» (vimada) именно потому, что мёд выходит из них с мочой; в подтверждение приводится цитата Вахаты о анупане (сопровождающем питье): холодная вода после ячменя и пшеницы, кислое молоко после мёда — отсюда и сама формула «медовая вода» (madhūdaka). Подстрочник передаёт физиологическую деталь буквально, но не поясняет её как причину «протрезвления» и не приводит стоящий за ней аюрведический источник.", "type": "В", "source_commentary": ["bhusana"], "why_proposed": "Бхушана даёт причинно-следственное объяснение эпитета vimada через физиологию и подкрепляет его именной цитатой аюрведического автора (Вахата) — деталь, отсутствующая и в подстрочнике, и у Леонова/Костиной, и в Phase-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.64.6", "verse": "6", "sanskrit_iast": "saumya roṣo na kartavyo yad ebhir parivāraṇam । ajñānād rakṣibhiḥ krodhād bhavantaḥ pratiṣedhitāḥ ॥6॥", "leonov_ru": "«Господин, не следует гневаться на тех, кто пытался остановить [вас]. По незнанию стражи в гневе пытались остановить вас.", "commentary": {"tilaka": "विमदत्वसूचकम्-- मेहमानान्मधूदकमिति । मेहमानान्मूत्रयतः । मधुपरिणामभूतमुदकं मधूदकम् । एवं मूत्रणान्मधूनां जीर्णता बोधिता, अत एव विमदान् ।। 5.64.4,5 ।।\n\nएभी रक्षिभिरज्ञानात्क्रोधाच्च भवन्तः प्रतिषेधिता इति यदेतत्परिवारणं प्रति रोषो न कर्तव्य इत्यर्थः ।। 5.64.6,7 ।।\n\nरोषः कृतः । मदीयैरिति शेषः", "bhusana": "सौम्य रोषो न कर्तव्यो यदेभिरभिवारितः ।\n\nअज्ञानाद्रक्षिभिः क्रोधाद्भवन्तः प्रतिषेधिताः\nएभिः वानरैः अभिवारितः अभिवारितो ऽसीति यत् अत्रार्थे रोषो न कर्तव्यः । भवन्त इति पूजायां बहुवचनम् । न च हनुमदादिकमादाय बहुवचनम्, उत्तरश्लोके ऽपि युवराजस्त्वमित्युक्तेः । अज्ञानात् क्रोधात्, अज्ञानप्रयुक्तक्रोधादित्यर्थः । अभिवारितमिति\n\nपाठे लिङ्गव्यत्यय आर्षः । केचित्तु अज्ञानात् क्रोधाच्च भवन्तः प्रतिषेधिता इत्येतत् परिवारितं परिवारणं प्रति रोषो न कर्तव्य इति योजयन्ति", "siromani": "तदाकारमाह सौम्येति । हे सौम्य अज्ञानात् भवत्संपादितकार्यविषयज्ञानाभावात् रक्षिभिः भवन्तः प्रतिषेधिताः अतः यदेभिः परिवारणम् एतत्करणकनिवारणं तत्संस्मृत्येति शेषः । रोषो न कर्तव्यः । किंच एभिर्वानरैः सह भवन्तः प्रतिषेधिताः अतो यत्परिवारणमस्मत्कर्तृकनिवारणं तत्संस्मृत्य रोषो न कर्तव्यः"}, "has_tier1": true, "notes": [{"id": "tier1:5.64.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В ярости вам противились (krodhād bhavantaḥ pratiṣedhitāḥ) - автор комментария “Бхушана” полагает, что Дадхимукха здесь обращается к одному Ангаде, а не ко всем обезьянам."}, {"id": "lexical:5.64.6:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ajñāna", "note_ru": "Аджняна (a-jñāna, n.) — «неведение, незнание», a- (отрицательный префикс) + jñāna (√jñā-, «знать», Whitney #681). MW: ajñāna 'ignorance'. В дхармашастровом дискурсе ajñāna — смягчающее обстоятельство: действие, совершённое по незнанию (ajñānāt), влечёт меньшую ответственность, чем умышленное. Дадхимукха выстраивает юридически корректную апологию: стражники действовали из невежества (ajñānāt), а не из злого умысла (krodhāt). Различение ajñāna/krodha — стандартная формула смягчения вины в эпосе.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:ajYAna", "collision_tier1": true}]}, {"verse_id": "5.64.7", "verse": "7", "sanskrit_iast": "śrānto dūrādanuprāpto bhakṣyasva svakaṃ madhu । yuvarājas tvam īśaś ca vanasyāsya mahābala ॥7॥", "leonov_ru": "Усталый, прибывший издалека, пей свой мед. Ты, о могучий, наследник престола и хозяин этого леса.", "commentary": {"bhusana": "युवराजस्त्वमीशश्च वनस्यास्य महाबल ।\n\nमौर्ख्यात् पूर्वं कृतो दोषस्तं भवान् क्षन्तुमर्हति\nक्रोधाद्वारणे कृते कुतो रोषो न कर्तव्यस्स्यादित्याशङ्क्य क्रोधस्याज्ञानकृतत्वादित्याह युवराज इति । दोषः निवारणरूपापराधः", "siromani": "श्रान्त इति । दूरादनुप्राप्तः अत एव श्रान्तस्त्वं स्वकं मधु भक्षयस्व पिब स्वकीयत्वे हेतुः यतस्त्वं युवराजः अत एव अस्य वनस्य ईशः स्वामी असीति शेषः"}, "has_tier1": false, "notes": [{"id": "lexical:5.64.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "yuvarāja", "note_ru": "Юварадж (yuva-rāja, m.) — «молодой царь», тат-пуруша: yuvan «молодой» + rāja «царь». MW: yuvarāja 'the young king, heir apparent'. Конституционный термин: yuvarāja — официальный наследник престола, соправитель, получивший абхишеку (ритуальное помазание). Ангада является yuvarāja Кишкиндхи — сын убитого Сугривой Вали. Это создаёт постоянное дхармическое напряжение: Сугрива правит как царь, но Ангада как yuvarāja обладает независимым ритуальным статусом. Дадхимукха апеллирует именно к этому статусу.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:yuvarAja"}]}, {"verse_id": "5.64.8", "verse": "8", "sanskrit_iast": "maurkhyāt pūrvaṃ kṛto roṣas tad bhavān kṣantum arhati । yathaiva hi pitā te 'bhūt pūrvaṃ harigaṇeśvaraḥ ॥8॥", "leonov_ru": "Должен ты простить ту ярость, которая была прежде выказана [нами] по глупости. Ибо как прежде твой отец был владыкой обезьян,", "commentary": {"siromani": "मौर्ख्यादिति । यथा पूर्वं ते पिता हरिगणेश्वरः तथा त्वं सुग्रीवो ऽपि अन्यो न अतः मौर्ख्यात् अज्ञानात् पूर्वं कृतो यो रोषस्तत् क्षन्तुं भवानर्हति । सार्धश्लोक एकान्वयी\nतदाकारमाह-- समिति । यतः अतीतसमयैः इहागन्तुं न शक्यम् अतः तदागमनादित्यर्थः, अङ्गदस्य प्रहर्षाच्च देवी सीता दृष्टेत्यहं जानामि निश्चिनोमि अतः समाश्वसिहि । सार्धश्लोक एकान्वयी ।। 5.64.27,28 ।।\n\nनेति । कृत्ये सीतादर्शने विनिपातिते अनिष्पादिते सति अङ्गदः मत्सकाशं नागच्छेत् यदि अङ्गदो नागच्छेत्तर्हि अन्ये नागच्छेयुरिति किं वक्तव्यमिति । काव्यार्थापत्तिरलङ्कारो ध्वनितः"}, "has_tier1": false, "notes": [{"id": "lexical:5.64.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mūrkhatā", "note_ru": "Маурхья / мурхата (mūrkhatā, f.) — «глупость, безрассудство», от mūrkha (adj.) «тупой, глупый» + суфф. -tā. MW: mūrkha 'foolish, stupid'. Mūrkha этимологически связан с √murcha- («терять сознание, дурнеть»): «глупец» — буквально «одурманенный». Дадхимукха использует maukhya (аналогичная форма) в качестве второго смягчающего обстоятельства после ajñāna: не только «незнание», но «заблуждение рассудка» стражников. Комбинация ajñāna + maukhya даёт полное юридическое оправдание в категориях дхармашастры.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:mUrKa"}]}, {"verse_id": "5.64.9", "verse": "9", "sanskrit_iast": "tathā tvam api sugrīvo nānyas tu harisattama । ākhyātaṃ hi mayā gatvā pitṛvyasya tavānagha ॥9॥", "leonov_ru": "Так [ныне владыки] ты и Сугрива, никто иной, о лучший из обезьян. Пошел я и поведал твоему дяде, о безупречный,", "commentary": {"bhusana": "आख्यातं हि मया गत्वा पितृव्यस्य तवानघ ।\n\nइहोपयातं सर्वेषामेतेषां वनचारिणाम्\nप्रहृष्टो मां पितृव्यस्ते सुग्रीवो वानरेश्वरः ।\n\nशीघ्रं प्रेषय सर्वांस्तानिति होवाच पार्थिवः", "siromani": "आख्यातमिति । सर्वेषाम् एतेषां भवतामिहोपयानमागमनं तव पितृव्यस्य समीपे गत्वा मया ऽ ऽख्यातं कथितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.64.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…дяде (pitṛvyasya) - в оригинале использовано слово, обозначающее дядю по отцовской линии."}, {"id": "lexical:5.64.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pitṛvya", "note_ru": "Питрвья (pitṛvya, m.) — «дядя по отцу», от pitṛ «отец» + суфф. -vya (расширение родства). MW: pitṛvya 'a father's brother, paternal uncle'. В санскрите родственные термины строго дифференцированы: pitṛvya — только дядя по отцовской линии (ср. mātula = дядя по матери). Сугрива является pitṛvya Ангады, поскольку он брат его отца Вали. Kin-термины в эпосе нагружены социально-правовым содержанием: pitṛvya обязан проявлять отеческую заботу к племяннику.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:pitfvya", "collision_tier1": true}]}, {"verse_id": "5.64.10", "verse": "10", "sanskrit_iast": "ihopayānaṃ sarveṣām eteṣāṃ vanacāriṇām । bhavadāgamanaṃ śrutvā sahaibhir vanacāribhiḥ ॥10॥", "leonov_ru": "О прибытии всех этих обезьян. Услышав о твоем приходе вместе с обезьянами,", "commentary": {"bhusana": "स त्वदागमनं श्रुत्वा सहैभिर्हरियूथपैः ।\n\nप्रहृष्टो न तु रुष्टो ऽसौ वनं श्रुत्वा प्रधर्षितम्", "siromani": "भवदिति । असौ सुग्रीवः वनं प्रधर्षितं श्रुत्वापि भवदागमनं श्रुत्वा प्रहृष्ट एव न तु रुष्टः"}, "has_tier1": true, "notes": [{"id": "tier1:5.64.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Вместе со всем отрядом» Возникает двойственность: вернулся с отрядом или радовался с отрядом?"}, {"id": "lexical:5.64.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vanacārin", "note_ru": "Ванача́рин (vana-cārin, m./adj.) — тат-пуруша: vana «лес» + cārin (√car-, «двигаться, бродить», Whitney #615) = «бродящий по лесу». MW: vanacāra 'living in a forest'. Vana в ведийской и эпической традиции — пространство, находящееся вне социального порядка (grāma), пространство аскезы и первобытной силы. Vanacārin = существа леса, не подчинённые городскому дхарма-порядку — это их свойство и их дхарма одновременно.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:vanacArin", "collision_tier1": true}]}, {"verse_id": "5.64.14", "verse": "14", "sanskrit_iast": "ayaṃ ca harṣadākhyāti tena jānāmi hetunā । tat kṣamaṃ neha naḥ sthātuṃ kṛte kārye paraṃtapāḥ ॥14॥", "leonov_ru": "Знаю я (понял я) по той причине, что он (Дадхимукха) радостно [об этом] рассказывает. Потому не следует нам оставаться здесь, когда дело завершено, о губители врагов.", "commentary": {"tilaka": "किं चायं हर्षादाख्याति । सुग्रीवसन्देशमिति शेषः । तेन च हेतुना जानामि रामेण श्रुतो ऽयं वृत्तान्त इति । तत्तस्मादकार्ये वनविध्वंसनरूपे कृते सतीह स्थातुं नो ऽस्माकं न क्षमं न युक्तम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.64.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «paraṃtapāḥ» опущено"}]}, {"verse_id": "5.64.15", "verse": "15", "sanskrit_iast": "pītvā madhu yathākāmaṃ vikrāntā vanacāriṇaḥ । kiṃ śeṣaṃ gamanaṃ tatra sugrīvo yatra vānaraḥ ॥15॥", "leonov_ru": "Выпив меду сколько душе угодно, отважные обезьяны, Что осталось [нам сделать]? Пойти туда, где Сугрива-обезьяна.", "commentary": {"bhusana": "सुग्रीवेणेत्यादि । सहितैः स्नेहातिरेकेणान्योन्यं युक्तै । वानरैः सहितैरिति पाठः\nपीत्वा मधु यथाकामं विश्रान्ता वनचारिणः ।\n\nकिं शेषं गमनं तत्र सुग्रीवो यत्र मे गुरुः\nकिं शेषं न किंचिदपि शिष्टमित्यर्थः । किन्तु मे गुरुः सुग्रीवो यत्र वर्तते तत्र गमनमेव शेषमित्यर्थः । किं शेषं गमनं तच्च सुग्रीवो यत्र मे गुरुः इति पाठे अस्माकं गमनं किंशेषं किंचिच्छेषम् । तच्च गमनशेषं च सुग्रीवो यत्र तत्र गमनमिति संबन्धः\nसर्वे यथा मां वक्ष्यन्ति समेत्य हरियूथपाः ।\n\nतथा ऽस्मि कर्ता कर्तव्ये भवद्भिः परवानहम्\nविनयपूर्वकं सर्वसंमेलनं समर्थयते सर्व इति । तथास्मि कर्ता आह्वानं करिष्यामीत्यर्थः । कर्तव्ये कार्ये । भवद्भिः अहं परवान्, भवद्भिर्यथा नियुक्तं तथा करिष्यामि । गन्तव्यमित्युक्ते गमिष्यामः स्थातव्यमित्युक्ते स्थास्यामः इत्यर्थः", "tilaka": "किं शेषम् । न किमपि शिष्टमित्यर्थः । गमनम् । उचितमिति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.64.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Отважные обезьяны (vikrāntā vanacāriṇaḥ) - средневековые комментаторы расходятся в том, какой здесь употреблен падеж, именительный или звательный. Так, автор комментария “Широмани” полагает, что Ангада говорит здесь об обезьянах в третьем лице.[Е. Костина] Комментарий не дает четкого понимания альтернативной трактовки. Мне думается, ее лучше привести полностью, потому что читатель может быть неспециалистом в грамматике и остаться в недоумении - что нам дает тот или иной падеж, что значит \"в третьем лице\""}]}, {"verse_id": "5.64.16", "verse": "16", "sanskrit_iast": "sarve yathā māṃ vakṣyanti sametya haripuṃgavāḥ । tathāsmi kartā kartavye bhavadbhiḥ paravān aham ॥16॥", "leonov_ru": "Как скажут мне, сойдясь (вместе) все быки среди обезьян, Так я поступлю в этом деле, послушен я вам.", "commentary": {"tilaka": "कर्तव्ये कर्तव्ये ऽर्थे । भवद्भिः परवानहम् भवदधीन इत्यर्थः", "siromani": "सर्वे इति । सर्वे हरिपुङ्गवाः समेत्य यथा मां वक्ष्यन्ति तथा ऽहं कर्ता ऽस्मि । तत्र हेतुः कर्तव्ये भवद्भिरहं परवान् भवदधीन इत्यर्थः", "bhusana": "युवराजत्वात् भवानेव कर्तव्याकर्तव्यनियन्तेत्यत आह नाज्ञापयितुमिति । ईशः स्वतन्त्रः । कृतकर्माणः कृतोपकाराः यूयं मया धर्षयितुम् अनादर्तुम्, परतन्त्रीकर्तुमिति यावत् । अयुक्तम् अयुक्ता इत्यर्थः । आर्षमव्ययमेतत् । शक्यमितिवत्सामान्योपक्रमान्नपुंसकैकत्वनिर्देश इत्यप्याहुः ।। 5.64.15,16 ।।\n\nएवं वक्ष्यति को राजन् प्रभुः सन् वानरर्षभ ।\n\nऐश्वर्यमदमत्तो हि सर्वो ऽहमिति मन्यते\nअहमित मन्यते गर्विष्ठो भवतीति यावत्"}, "has_tier1": false, "notes": [{"id": "lexical:5.64.16:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "prasāda", "note_ru": "Праса́да (prasāda, m.) — «ясность, умиротворение, благодать», pra+√sad- («садиться, оседать», о жидкости — «проясняться»). MW: prasāda 'clearness; graciousness'. Prasāda жидкости = когда муть оседает и вода становится прозрачной — прямая метафора ума, «успокаивающегося» от гнева. В более позднем теологическом словаре prasāda = «благодать бога», «остаток ритуальной пищи». Здесь — в классическом значении «умиротворения»: Ангада просит у старейшин успокоить разгневанного Сугриву.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:prasAda"}]}, {"verse_id": "5.64.17", "verse": "17", "sanskrit_iast": "nājñāpayitum īśo 'haṃ yuvarājo 'smi yady api । ayuktaṃ kṛtakarmāṇo yūyaṃ dharṣayituṃ mayā ॥17॥", "leonov_ru": "Даже если я владыка и наследник престола, не должно Мне приказывать вам, завершившим дело, и оскорблять вас».", "commentary": {"bhusana": "नाज्ञापयितुमीशो ऽहं युवराजो ऽस्मि यद्यपि ।\n\nअयुक्तं कृतकर्माणो यूयं धर्षयितुं मया", "tilaka": "यद्यप्यहं युवराजो ऽस्मि युष्मानाज्ञापयितुं नेशश्च । तत्र हेतुः-- कृतकर्माणो यूयम् कृतकर्मणो युष्मानित्यर्थ आर्षमिदम् । तथाप्यतः परं बलाद्धर्षयितुं न युक्तम् ।। 5.64.17,18 ।।\n\nअहम् । प्रभुरिति शेषः", "siromani": "नेति । यतः कृतकर्माणो यूयं धर्षयितुमयुक्तम् अतः यद्यप्यहं युवराजः तथाप्याज्ञापयितुं नोशो ऽस्मि कृतकर्माणो यूयमिति । समुदायस्य कर्मत्वविवक्षया तस्य प्रातिपदिकत्वाभावान्न द्वितीया"}, "has_tier1": true, "notes": [{"id": "tier1:5.64.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «kṛtakarmāṇo» опущено, из-за этого нарушается логическая связь: вы сделали (большое) дело, поэтому я не могу вам приказывать"}]}, {"verse_id": "5.64.19", "verse": "19", "sanskrit_iast": "evaṃ vakṣyati ko rājan prabhuḥ san vānararṣabha । aiśvaryamadamatto hi sarvo 'ham iti manyate ॥19॥", "leonov_ru": "«О царь, какой правитель так скажет, о бык среди обезьян! Всякий [царь], опьяненный властью, думает только о себе.", "commentary": {"siromani": "तदाकारमाह एवमिति । हे राजन् यतः सर्वो जनः ऐश्वर्यमदमत्तः सन् अहमेव प्रभुरिति मन्यते अतः एवं भवद्वचनसदृशं कः प्रभृर्वक्ष्यति प्रभुरिति उभयान्वयि"}, "has_tier1": false, "notes": [{"id": "crosstext:5.64.19:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "aiśvarya-mada-matta", "note_ru": "aiśvaryamadamatto hi sarvo 'ham iti manyate («всякий, опьянённый властью, думает только о себе») — гномическое возражение обезьян Ангаде. Это почти цитата дидактической максимы, которую Удьйогапарва вкладывает в наставление Видуры: «aiśvaryamadapāpiṣṭhā madāḥ … aiśvaryamadamatto hi nāpatitvā vibudhyate» (MBh V.34.51) — «Опьянение властью — худшее из опьянений: опьянённый величием не образумится, пока сам не падёт». Совпадение и сложения aiśvaryamadamatta, и его смысла указывает на общий гномический фонд нити; в мифоплане ту же истину иллюстрирует низвергнутый гордыней Нахуша (MBh III.177.8, aiśvaryamadamatto 'ham).", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.64.19", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Udyogaparvan V.34.51"}]}, {"verse_id": "5.64.28", "verse": 28, "sanskrit_iast": "", "leonov_ru": "", "commentary": {}, "has_tier1": true, "notes": [{"id": "tier1:5.64.28:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «нарушив сроки» Нужен комм., что обезьянам изначально давался месяц (читатель может об этом не знать/забыть)"}, {"id": "edition:5.64.28:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.64.28 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.64.28", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.64.28", "iast": "nāgantum iha śakyaṃ tair atitasamayair iha । aṅgadasya praharṣāc ca jānāmi śubhadarśana ॥28॥"}], "collision_tier1": true}], "verse_not_segmented": true}, {"verse_id": "5.64.29", "verse": "29", "sanskrit_iast": "na matsakāśam āgacchet kṛtye hi vinipātite । yuvarājo mahābāhuḥ plavatām aṅgado varaḥ ॥29॥", "leonov_ru": "Ведь провалив дело, не пришел бы ко мне Наследник престола мощнорукий Ангада, лучший из обезьян.", "commentary": {"tilaka": "विनिपातिते ऽसाधिते", "bhusana": "न मत्सकाशमागच्छेत् कृत्ये हि विनिपातिते ।\n\nयुवराजो महाबाहुः प्लवतां प्रवरो ऽङ्गदः\nविनिपातिते विघ्निते"}, "has_tier1": false, "notes": [{"id": "lexical:5.64.29:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "harṣa", "note_ru": "Харша (harṣa, m.) — «радость, ликование; ощущение приятного холодка (мурашки)», от √hṛṣ- (класс IV, «радоваться, ощущать приятный озноб», Whitney #744). MW: harṣa 'bristling (of hair); joy'. Корень √hṛṣ- описывает физическое состояние: волоски на теле встают дыбом от радостного возбуждения. Harṣa = радость, буквально «мурашки», телесный ответ на эмоцию. Ср. romāñca (то же явление, «вздыбленные волоски»). Рама слышит о Сите — и его harṣa — прежде всего физическое, телесное переживание, а не абстрактное «счастье».", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:harza+warnemyr(hfz)"}]}, {"verse_id": "5.64.31", "verse": "31", "sanskrit_iast": "pitṛpaitāmahaṃ caitat pūrvakair abhirakṣitam । na me madhuvanaṃ hanyād adṛṣṭvā janakātmajām ॥31॥", "leonov_ru": "Полученный в наследство от предков и хранимый предками Мой лес Мадхувану не стал бы он разорять, если бы не нашел дочь Джанаки.", "commentary": {"bhusana": "पितृपैतामहं चैतत् पूर्वकैरभिरक्षितम् ।\n\nन मे मधुवनं हन्यादहृष्टः प्लवगेश्वरः\nपितृपैतामहमिति । पिता चासौ पितामहश्च । पित्रा ब्रह्मणा ऋक्षरजसे दत्तं पितृपैतामहम् । प्लवगेश्वरः अङ्गदः", "tilaka": "कुतस्तत्राह-- पितृपैतामहं पितृपितामहक्रमागतम्", "siromani": "पितृ इति । जनकात्मजाम् अदृष्ट्वा मे मधुवनं न हन्यात्"}, "has_tier1": false, "notes": [{"id": "phase2:5.64.31:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "pitṛpaitāmaha", "note_ru": "Питрипаитамаха (pitṛpaitāmaha) — Бхушана уточняет миф за формулой «унаследованный от отца и деда»: рощу даровал Брахма (pitrā brahmaṇā) отцу Сугривы, Рикшараджу (ṛkṣarajase dattam), откуда и «отцовско-дедовское» владение. Подстрочник передаёт эпитет как общую формулу наследования, не называя ни дарителя (Брахму), ни первого владельца (Рикшараджу).", "type": "В", "source_commentary": ["bhusana"], "why_proposed": "Бхушана называет конкретных участников мифа о происхождении рощи (Брахма — даритель, Рикшараджас — первый владелец), которых не сохраняет ни подстрочник, ни Леонов/Костина, ни Phase-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.64.32", "verse": "32", "sanskrit_iast": "kausalyā suprajā rāma samāśvasihi suvrata । dṛṣṭā devī na saṃdeho na cānyena hanūmatā ॥32॥", "leonov_ru": "Хорошего (счастливого) сына [родила] Каусалья. Ободрись, Рама, верный обетам. Нет сомнения, что найдена царевна и никем иным, как Хануманом.", "commentary": {"siromani": "नन्वसाधितकार्याणामप्यागमनं लोके दृष्टमित्यत आह यद्यपीति । यद्यपि अकृतकृत्यानामपि ईदृशः उपक्रमः समीपागमनं स्यात् संभवेत् तथापि भ्रान्तिविप्लुतमानसः सन् सो ऽङ्गदः दीनवदनो भवेत् । एतेन दीनवदनाभावस्य सीतादर्शने लिङ्गत्वं बोधितम्\nकौसल्येति । देवी दृष्टा तत्रापि हनुमतैव अत एव कौशल्या सुप्रजा शोभनपुत्रवती अस्तीति शेषः । अतः समाश्वसिहि", "bhusana": "कौसल्येति । हे राम  कौसल्या सुप्रजाः सुप्रजावती । \"नित्यमसिच् प्रजामेधयोः\" इत्यसिच्प्रत्ययः । एवं देव्यवस्थानज्ञानेन भवतस्सत्तालाभादिदानीं कौसल्या सुप्रजावती, अभूदिति शेषः ।। 5.64.29,30 ।।\n\nजाम्बवान् यत्र नेता स्यादङ्गदश्च बलेश्वरः ।\n\nहनुमांश्चाप्यधिष्ठाता न तस्य गतिरन्यथा\nआजग्मुस्ते ऽपि हरयो रामदर्शनकांक्षिणः ।\n\nअङ्गदं पुरतः कृत्वा हनूमन्तं च वानरम्", "tilaka": "कौसल्या सुप्रजाः । सीतास्थितिपरिज्ञानेन भवतो जीवनलाभादिदानीं कौसल्या\n\nसुपुत्रवत्यभूदिति भावः । तत्रापि हनूमतैव न तु ततो ऽन्येनेत्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.64.32:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Нет сомнений – найдена Сита,И найдена Хануманом.» Нужен комм., что дальнейший текст повторяет предыдущую главу"}]}, {"verse_id": "5.64.36", "verse": "36", "sanskrit_iast": "yadā hi darpitodagrāḥ saṃgatāḥ kānanaukasaḥ । naiṣām akṛtakaryāṇām īdṛśaḥ syād upakramaḥ ॥36॥", "leonov_ru": "Когда обезьяны вернулись, охваченные гордостью, Они бы не стали вести себя так, если бы не завершили своего дела.", "commentary": {"siromani": "मेति । यदा यदि काननौकसः दर्पितोदग्राः प्रवृद्धदर्पाः सन्तः सङ्गताः तर्हि चिन्तासमायुक्तस्त्वं मा भूः\nउपसंहरन्नाह नेति । अकृतकार्याणामेषामीदृशं आनन्दहेतुकोपद्रवकारक उपक्रमो न स्यात् । अत एव वनभङ्गादिना जानामि सीतादर्शननिष्पत्तिं निश्चिनोमि", "bhusana": "आयताञ्जितलाङ्गूलः आयतः दीर्घीकृतः अञ्चितः माल्यवच्छृङ्गे समास्थापितः ।। 5.64.34,35 ।।\n\nते ऽङ्गदप्रमुखा वीराः प्रहृष्टाश्च मुदा ऽन्विताः ।\n\nनिपेतुर्हरिराजस्य समीपे राघवस्य च\nप्रहृष्टाः सञ्जातपुलकाः"}, "has_tier1": false, "notes": [{"id": "edition:5.64.36:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.64.36 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.64.36", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.64.36", "iast": "yadā hi darpitodagrāḥ saṃgatāḥ kānanaukasaḥ । naiṣām akṛtakaryāṇām īdṛśaḥ syād upakramaḥ ॥36॥"}]}]}, {"verse_id": "5.64.3638", "verse": "3638", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"tilaka": "यदाहि । यत इत्यर्थः"}, "has_tier1": false, "notes": [{"id": "edition:5.64.3638:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.64.38 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.64.38", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.64.38", "iast": "hanūmatkarmadṛptānāṃ nardatāṃ kānanaukasām । kiṣkindhām upayātānāṃ siddhiṃ kathayatām iva ॥38॥"}], "anchor_verse_id": "5.64.38"}]}, {"verse_id": "5.64.37", "verse": "37", "sanskrit_iast": "vanabhaṅgena jānāmi madhūnāṃ bhakṣnena ca । tataḥ kilakilā śabdaṃ śuśrāvāsannam ambare ॥37॥", "leonov_ru": "Знаю (понял) я это по тому, что разорили они лес [Мадхувану] и выпили мед». Тогда [радостный] звук «кила-кила» услышал он, доносящийся близко с неба,", "commentary": {"bhusana": "ततः श्रुत्वा निनादं तं कपीनां कपिसत्तमः ।\n\nआयताञ्चितलाङ्गूलः सो ऽभवद्धृष्टमानसः"}, "has_tier1": true, "notes": [{"id": "tier1:5.64.37:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «madhūnāṃ bhakṣanena» опущено"}, {"id": "crosstext:5.64.37:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "madhu", "note_ru": "Похищение мёда (madhūnāṃ haraṇam): уже в оглавлении-пхалашрути Бала-канды (1.3.33), где Нарада перечисляет грядущие деяния, «похищение мёда» названо среди подвигов Сына Ваю наряду с сожжением Ланки. В Сундаре (V.64.37) этот эпизод (разорение Мадхуваны обезьянами Сугривы) реализуется в повествовании. Параллель показывает, что мотив запрограммирован в проспективном «синопсисе» поэмы; подстрочник его не комментирует.\n\nПараллель — Rām. Bāla 1.3.33:\n  «grahaṇaṃ vāyusūnośca laṅkādāhābhigarjanam । pratiplavanamevātha madhūnāṃ haraṇaṃ tathā ॥33॥»\n  О пленении Сына Ваю, О сожжении им в ярости Ланки, О преодолении им океана И о похищении меда;", "type": "В", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.64.37", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.3.33 (Гринцер, пер. изд. I–III)", "collision_tier1": true}]}, {"verse_id": "5.64.42", "verse": "42", "sanskrit_iast": "hanūmāṃś ca mahābahuḥ praṇamya śirasā tataḥ । niyatām akṣatāṃ devīṃ rāghavāya nyavedayat ॥42॥", "leonov_ru": "Могучий Хануман склонил тогда голову И поведал Рагхаве, что царевна невредима и сохраняет стойкость [в любви к Раме].", "commentary": {"bhusana": "[दृष्टा देवीति हनुमद्वदनादमृतोपमम् ।\n\nआकर्ण्य वचनं रामो हर्षमाप सलक्ष्मणः ।। ]\n\nनिश्चितार्थस्ततस्तस्मिन् सुग्रीवः पवनात्मजे ।\n\nलक्ष्मणः प्रीतिमान् प्रीतं बहुमानादवैक्षत", "siromani": "हनूमानिति । हनूमान् प्रणम्य नियतां यतचित्ताम् अक्षतां विनाशरहितां देवीं सीतां राघवाय न्यवेदयत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.64.42:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…жива царевна / И сохраняет стойкость (niyatām akṣatāṃ devīm) - под niyatā по мнению комментаторов подразумевается верность Ситы мужу."}]}, {"verse_id": "5.64.4245", "verse": "4245", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"tilaka": "नियतां पातिव्रत्यसंपन्नाम् अक्षतां शरीरेण कुशलिनीम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.64.4245:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sāhasa", "note_ru": "Са́хаса (sāhasa, n.) — «дерзость, дерзкий поступок; насилие», от sahasa «мощный напор» + -ā (абстрактный суфф.). MW: sāhasa 'rashness, temerity; violence, outrage'. В дхармашастрах sāhasa — юридический термин для преступлений с применением силы (ограбление, насилие). Здесь — разгром мадхуваны квалифицируется как sāhasa: не просто самоуправство, а квазикриминальный акт силового нарушения чужой собственности. Тем острее контраст: за этим актом стоит нахождение Ситы.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:sAhasa", "anchor_verse_id": "5.64.44"}]}, {"verse_id": "5.64.43", "verse": "43", "sanskrit_iast": "dṛṣṭā devīti hanūmadvadanād amṛtopamam । ākarṇya vacanaṃ rāmo harṣamāpa lakṣmaṇaḥ ॥43॥", "leonov_ru": "Услышав подобные амрите слова Ханумана О том, что найдена царевна, возрадовались Рама и Лакшмана.", "commentary": {"siromani": "दृष्टेति । हनूमद्वदनान्निस्मृतम् अमृतोपमं दृष्टा देवीति वचनमाकर्ण्य रामो हर्षमाप"}, "has_tier1": false, "notes": [{"id": "edition:5.64.43:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.64.43 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.64.43", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.64.43", "iast": "dṛṣṭā devīti hanūmadvadanād amṛtopamam । ākarṇya vacanaṃ rāmo harṣamāpa lakṣmaṇaḥ ॥43॥"}]}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};

  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

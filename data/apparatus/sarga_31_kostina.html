<script>window.APPARATUS_DATA={"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 31, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 27, "verses_with_notes": 12, "notes_by_layer": {"tier1": 3, "lexical": 7, "phase2": 2, "edition": 3, "crosstext": 3}, "built_for_reviewer": "Костина", "source_hash": "020c767db386a0181a679cee2e3bdbd12741146dab5fdbbb174d8cda7801cf42"}, "sarga": 31, "verses": [{"verse_id": "5.31.3", "verse": "3", "sanskrit_iast": "rājarṣīṇāṅ guṇaśrēṣṭhas tapasā carṣibhiḥ samaḥ । cakravartikule jātaḥ puraṃdarasamo bale ॥3॥", "leonov_ru": "Лучший в добрых качествах из царей-риши, аскетической силой равный риши, Рожденный в роду чакравартинов, силой равный Пурандаре (Индре).", "commentary": {"bhusana": "राजर्षीणां गुणश्रेष्टस्तपसा चर्षिभिः समः ।\n\nचक्रवर्तिकुले जातः पुरन्दरसमो बले"}, "has_tier1": false, "notes": [{"id": "lexical:5.31.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "cakravartin", "note_ru": "Чакравартин (cakra-vartin, букв. «чьё колесо катится беспрепятственно») — эпический титул вселенского монарха, власть которого символически распространяется на все четыре стороны света. Колесо (cakra) — космический символ суверенной власти и солнечного движения; vartin от √vṛt- (класс I, Whitney #858, «вращаться»). MW: cakravartin «rolling everywhere without obstruction», «world-sovereign». В эпосе чакравартин — высший разряд царей, превыше rājan и mahārāja. Упоминание cakravartikule jātaḥ (31.3) вписывает Раму в космическую династийную традицию: его союз с Сугривой — не просто военный договор, а вселенский проект.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:cakravartin"}, {"id": "lexical:5.31.3:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "puraṃdara", "note_ru": "Пурандара (puraṃ-dara, букв. «разрушитель городов [врагов]») — устойчивый эпитет Индры: puram (акк. мн. от pura «крепость, укреплённый город») + dara от √dṝ- («разрывать, разрушать»). MW: puraṃdara «destroyer of cities or of foes' strongholds», эпитет Индры. Сравнение Рамы с Пурандарой по воинской силе (bale puraṃdarasamaḥ, 31.3) выбирает военный аспект Индры — разрушителя вражеских цитаделей, а не его царский или ведийский образ. Это акцент на боевой функции Рамы: он не просто царевич, но персонаж, равный богу войны.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:puraMdara"}, {"id": "edition:5.31.3:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.31.3 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.31.3", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.31.3", "iast": "rājarṣīṇāṅ guṇaśrēṣṭhas tapasā carṣibhiḥ samaḥ । cakravartikule jātaḥ puraṃdarasamo bale ॥3॥"}]}]}, {"verse_id": "5.31.4", "verse": "4", "sanskrit_iast": "ahiṃsāratir akṣudro ghṛṇī satyaparākramaḥ । mukhyaś сekṣvākuvaṃśasya lakṣmīvāṃl lakṣmivardhanaḥ ॥4॥", "leonov_ru": "Находящий радость в непричинении зла живым существам, неподлый, милостивый, тот, чья сила в правде, Глава рода Икшваку, наделенный процветанием, увеличивающий процветание [других].", "commentary": {"bhusana": "अहिसारतिरक्षुद्रौ घृणी सत्यपराक्रमः ।\n\nमुख्यश्चेक्ष्वाकुवंशस्य लक्ष्मीवाँल्लक्ष्मिवर्धनः"}, "has_tier1": false, "notes": [{"id": "crosstext:5.31.4:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "satya-parākrama", "note_ru": "ghṛṇī satyaparākramaḥ («милостивый, истинно-доблестный») — в гимне-перечне достоинств Рамы, который Хануман произносит, чтобы Сита узнала вестника. Тот же эпитет в Удьйогапарве входит в развёрнутый «портрет идеального царя» Юдхиштхиры: «anṛśaṃso vadānyaś ca hrīmān satyaparākramaḥ» (MBh V.52.10) — «беззлобный, щедрый, скромный, истинно-доблестный». Совпадение целых наборов добродетелей (милосердие, щедрость, правдивая доблесть) указывает на общий эпический канон описания дхармического государя.", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.31.4", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Udyogaparvan V.52.10"}]}, {"verse_id": "5.31.7", "verse": "7", "sanskrit_iast": "rakṣitā svasya vṛttasya svajanasyāpi rakṣitā । rakṣitā jīvalokasya dharmasya ca paraṃtapaḥ ॥7॥", "leonov_ru": "Охранитель собственных дел и охранитель своих людей, Охранитель живых существ и дхармы, губитель врагов.", "commentary": {"bhusana": "रक्षिता स्वस्य धर्मस्य स्वजनस्य च रक्षिता ।\n\nरक्षिता जीवलोकस्य धर्मस्य च परन्तपः"}, "has_tier1": false, "notes": [{"id": "lexical:5.31.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "paraṃtapa", "note_ru": "Парантапа (paraṃ-tapa, букв. «сжигающий врагов») — воинский эпитет: para «чужой, враг» + tapa (от √tap- «жечь, пылать», Whitney #182). MW: paraṃtapa «destroying foes (said of heroes)». Метафора огня в военном словаре восходит к ведийскому образу: победитель обладает теджасом (tejas), буквально «жаром», иссушающим противника. В 31.7 эпитет стоит в одном ряду с rakṣitā («защитник»), образуя полярную пару раджадхармы: царь защищает своих (ракшитар) и испепеляет врагов (парантапа). Подстрочник нейтрально даёт «враговстрашитель» — этимологическая метафора огня в переводе утрачена.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:paraMtapa"}, {"id": "crosstext:5.31.7:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "api", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.31.7", "work_label": "Rām", "verse_address": "Rām 5.33.10 (крит. изд.)", "parallel_sa_iast": "rakṣitā jīvalokasya svajanasya ca rakṣitā |rakṣitā svasya vṛttasya dharmasya ca paraṁtapaḥ ||", "sundara_sa_iast": "rakṣitā svasya vṛttasya svajanasyāpi rakṣitā |rakṣitā jīvalokasya dharmasya ca paraṁtapaḥ ||", "quality": "GOOD", "source": "DCS parallel-search (GOOD); Rām 5.33.10 (крит. изд.)", "edition_flag": "vulgate", "shloka_critical": "V.29.6", "verse_address_vulgate": "Rām V.35.10 (вульгата)"}]}, {"verse_id": "5.31.8", "verse": "8", "sanskrit_iast": "tasya satyābhisaṃdhasya vṛddhasya vacanāt pituḥ । sabhāryaḥ saha ca bhrātrā vīraḥ pravrajito vanam ॥8॥", "leonov_ru": "По слову отца, верного правде, старого, С женой и братом отважный [Рама] ушел в лес.", "commentary": {"tilaka": "सत्याभिसन्धस्य सत्यसङ्कल्पस्य\nतस्या हेतोस्तदन्वेषणहेतोः । यथारूपां यादृग्रूपां यादृग्वर्णां यादृक्चिह्नवतीं च । तां सीताम्", "bhusana": "तस्य सत्याभिसन्धस्य वृद्धस्य वचनात् पितुः ।\n\nसभार्यः सह च भ्रात्रा वीरः प्रव्राजितो वनम्\nतस्य पितुर्वचनाद्वनं प्रव्राजितः गतः । स्वार्थे णिच्"}, "has_tier1": false, "notes": [{"id": "lexical:5.31.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "satyābhisaṃdha", "note_ru": "Сатьябхисандха (satya-abhi-saṃdha, букв. «крепко связанный правдой/обетом») — юридически-этическое понятие: satya «правда» + abhi-saṃdha (от abhi-saṃ-√dhā «скреплять договором, связывать обещанием»). MW: satyābhisaṃdha «true-speaking, faithful to a promise or agreement» (ChUp., R., Car.). Применительно к Дашаратхе (tasya satyābhisaṃdhasya, 31.8) термин прямо формулирует юридическое основание изгнания Рамы: данное Кайкейи varadāna неотчуждаемо именно потому, что царь — satyābhisaṃdha. Ханuman выбирает это слово точно: в мотивации рассказа это не просто добродетель, но правовая необходимость.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:satyAbhisaMDa"}]}, {"verse_id": "5.31.9", "verse": "9", "sanskrit_iast": "tena tatra mahāraṇye mṛgayāṃ paridhāvatā । rākṣasā nihatāḥ śūrā bahavaḥ kāmarūpiṇaḥ ॥9॥", "leonov_ru": "Там, в великом лесу, охотясь, Убил он многих отважных ракшасов, меняющих облик по своей воле.", "commentary": {"tilaka": "मृगयामुद्दिश्य धावता", "siromani": "तेनेति । मृगयां परिधावता तेन रामेण बहवी राक्षसा निहताः", "bhusana": "तेन तत्र महारण्ये मृगयां परिधावता ।\n\nराक्षसा निहताः शूरा बहवः कामरूपिणः\nमृगयां परिधावता मृगयामुद्दिश्य परिधावता । अनेन लीलया खरादिवधः सूच्यते"}, "has_tier1": false, "notes": [{"id": "phase2:5.31.9:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mṛgayāṃ paridhāvatā", "note_ru": "Бхушана поясняет, что «охотясь» (mṛgayāṃ paridhāvatā) означает не серьёзное усилие, а игру (līlā): этим словом комментатор намекает, что избиение Рамой Кхары, Душаны и прочих ракшасов в Джанастхане было для него не подвигом, а лёгкой забавой.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "вскрывает импликацию комментатора о лёгкости, с которой Рама одолел ракшасов Джанастханы (līlā, «играючи»), тогда как подстрочник передаёт нейтральное «охотясь»", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.31.10", "verse": "10", "sanskrit_iast": "janasthānavadhaṃ śrutvā nihatau kharadūṣaṇau । tatas tv amarṣāpahṛtā jānakī rāvaṇena tu ॥10॥", "leonov_ru": "Услышав о том, что в Джанастхане убиты [Рамой] Кхара и Душана, Равана, не в силах стерпеть [этого] похитил тогда Джанаки,", "commentary": {"tilaka": "जनस्थानवधं खरदूषणौ निहतौ च श्रुत्वा रावणेनामर्षापहृता वैरेणापहृता तु", "siromani": "जनेति । खरदूषणौ निहतौ श्रुत्वा अत एव जनस्थानवधं विध्वंसं श्रुत्वा मायया मृगरूपेण रामं वञ्चयित्वा जानकी रावणेन अमर्षापहृता अमर्षेणापहृता । सार्धश्लोक एकान्वयी\nतत इति । ततः सुग्रीवमैत्रीकरणानन्तरं रामो वालिनं हत्वा कपिराज्यं सुग्रीवाय प्रायच्छत्", "bhusana": "जनस्थानवधं श्रुत्वा हतौ च खरदूषणौ ।\n\nततस्त्वमर्षापहृता जानकी रावणेन तु ।\n\nवञ्जयित्वा वने रामं मृगरूपेण मायया"}, "has_tier1": false, "notes": [{"id": "edition:5.31.10:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.31.10–15 (6 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.31.10–15", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.31.10", "iast": "janasthānavadhaṃ śrutvā nihatau kharadūṣaṇau । tatas tv amarṣāpahṛtā jānakī rāvaṇena tu ॥10॥"}, {"verse_id": "5.31.11", "iast": "vañcayitvā vane rāmaṃ mṛgarūpeṇa māyayā । sa mārgamāṇas tāṃ dēvīṃ rāmaḥ sītām aninditām ॥11॥"}, {"verse_id": "5.31.12", "iast": "āsasāda vane mitraṃ sugrīvaṃ nāma vānaram । tataḥ sa vālinaṅ hatvā rāmaḥ parapuraṃjayaḥ ॥12॥"}, {"verse_id": "5.31.13", "iast": "āyacchat kapirājyaṃ tu sugrīvāya mahātmane । sugrīvēṇābhisaṃdiṣṭā harayaḥ kāmarūpiṇaḥ ॥13॥"}, {"verse_id": "5.31.14", "iast": "dikṣu sarvāsu tāṃ devīṃ vicinvantaḥ sahasraśaḥ । ahaṃ sampātivacanāc chatayōjanamāyatam ॥14॥"}, {"verse_id": "5.31.15", "iast": "asyā hetor viśālākṣyāḥ sāgaraṃ vegavān plutaḥ । yathārūpāṃ yathāvarṇāṃ tathālakṣmavatīṃ ca tām ॥15॥"}]}, {"id": "crosstext:5.31.10:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "janasthāna", "note_ru": "Джанастхана (janasthāna) — лесная область в Дандаке, ставка ракшасов Кхары и Душаны; её разорение Рамой (избиение 14000 ракшасов) — кульминация Аранья-канды (повествование от 3.20 и далее, ср. 3.23.5 о панике зверей). В Сундаре «Джанастхана» работает как смысловой якорь-ретроспекция: именно местью за Джанастхану мотивировано похищение Ситы (V.31.10), на неё ссылаются Сита (V.26.12) и Хануман (V.16.9). Подстрочник передаёт топоним без указания на этот причинно-сюжетный узел, заданный в кн. III.\n\nПараллель — Rām. Araṇya 3.23.5:\n  «janasthāna samīpe ca samākramya khara svanāḥ । visvarān vividhān ca cakruḥ māṃsa ādā mṛga pakṣiṇaḥ ॥5॥»\n  По всей Джанастхане Стали рыскать хищные звери И летать беспорядочно птицы, Издавая нестройные крики.", "type": "В", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.31.10", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Araṇya 3.23.5 (Гринцер, пер. изд. I–III)"}]}, {"verse_id": "5.31.12", "verse": "12", "sanskrit_iast": "āsasāda vane mitraṃ sugrīvaṃ nāma vānaram । tataḥ sa vālinaṅ hatvā rāmaḥ parapuraṃjayaḥ ॥12॥", "leonov_ru": "Обрел в лесу друга, обезьяну по имени Сугрива. Затем Рама, убив Валина, завоеватель вражеских городов,", "commentary": {"siromani": "स इति । सीतां मार्गमाणः स रामः सुग्रीवं नाम वानरं मित्रमाससाद प्राप चकारेत्यर्थः । अर्धद्वयमेकान्वयि", "bhusana": "ततः स वालिनं हत्वा रामः परपुरञ्जयः ।\n\nप्रायच्छत् कपिराज्यं तत् सुग्रीवाय महाबलः"}, "has_tier1": true, "notes": [{"id": "tier1:5.31.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Чужих городов покоритель (parapuraṃjaya) – формульный эпитет."}, {"id": "lexical:5.31.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vālin", "note_ru": "Валин (vālin) — Валин (vālin), убитый Рамой царь ванаров; его гибель — предыстория союза Сугривы с Рамой. см. примеч. к IV (Гринцер).", "type": "В", "subtype": "base", "trigger": "crossref", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "collision_tier1": true}]}, {"verse_id": "5.31.13", "verse": "13", "sanskrit_iast": "āyacchat kapirājyaṃ tu sugrīvāya mahātmane । sugrīvēṇābhisaṃdiṣṭā harayaḥ kāmarūpiṇaḥ ॥13॥", "leonov_ru": "Даровал царство обезьян великому духом Сугриве. По приказу Сугривы обезьяны, меняющие облик по собственной воле", "commentary": {"siromani": "सुग्रीवेणेति । सुग्रीवेणाभिसंदिष्टाः सर्वे हरयः सर्वासु दिक्षु तां सीतां विचिन्वन्तो वर्तन्त इति शेषः", "bhusana": "सुग्रीवेणापि सन्दिष्टा हरयः कामरूपिणः ।\n\nदिक्षु सर्वासु तां देवीं विचिन्वन्ति सहस्रशः"}, "has_tier1": false, "notes": [{"id": "lexical:5.31.13:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kāmarūpin", "note_ru": "Камарупин (kāma-rūpin, букв. «принимающий любой облик по желанию») — атрибут, характерный в Рамаяне одновременно для ракшасов и ванаров: kāma «желание» + rūpin (от rūpa «форма» + суфф. -in). MW: kāmarūpin «assuming any shape at will, protean» (ŚBr., TUp., MBh., R.). В 31.9 и 31.13 Валмики прилагает один и тот же эпитет к убитым Рамой ракшасам и к воинам Сугривы: семантическая параллель намеренная — оба войска «протейны», и разграничить их можно лишь по союзной принадлежности, а не по природным качествам. Подстрочник «принимающие любой облик» семантически верен, но устраняет именно этот структурный параллелизм.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:kAmarUpin"}]}, {"verse_id": "5.31.14", "verse": "14", "sanskrit_iast": "dikṣu sarvāsu tāṃ devīṃ vicinvantaḥ sahasraśaḥ । ahaṃ sampātivacanāc chatayōjanamāyatam ॥14॥", "leonov_ru": "Тысячами по всем направлениям искали ту царевну. По слову (совету) Сампати (Гаруды) я шириною в сотню йоджан", "commentary": {"bhusana": "अहं संपातिवचनाच्छतयोजनमायतम् ।\n\nअस्या हेतोर्विशालाक्ष्याः सागरं वेगवान् प्लुतः", "siromani": "अहमिति । वेगवानहं संपातिवचनात् सीताबोधकसंपातिवाक्यं संश्रुत्य तस्याः सीताया हेतोः समुद्रं प्लुतः"}, "has_tier1": false, "notes": [{"id": "lexical:5.31.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "saṃpāti", "note_ru": "Сампати (sampāti) — мифическая птица, старший брат Джатаю, сын Аруны (или Гаруды по некоторым версиям). Оба брата состязались в полёте к солнцу; Сампати лишился крыльев, закрыв ими брата от солнечного жара, и с тех пор живёт на горе на побережье Южного моря. MW: sampāti «N. of a fabulous bird, eldest son of Aruṇa, brother of Jaṭāyu» (MBh., R.). В Кишкиндхаканде именно Сампати — единственный свидетель похищения Ситы, наблюдавший с высоты птичьего полёта. Его testimoniium (sampātivacana, 31.14) — нарративный поворот: без него поиски были бы невозможны. Связь с Джатаю через тему «брат, пожертвовавший собой» создаёт двойник к гибели Джатаю в Арanyakaṇḍe.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:sampAti"}]}, {"verse_id": "5.31.15", "verse": "15", "sanskrit_iast": "asyā hetor viśālākṣyāḥ sāgaraṃ vegavān plutaḥ । yathārūpāṃ yathāvarṇāṃ tathālakṣmavatīṃ ca tām ॥15॥", "leonov_ru": "Ради этой широкоглазой перепрыгнул, стремительный, через океан, Такой же наделенной счастьем, как и красотой и цветом [кожи],", "commentary": {"siromani": "यथेति । यथारूपां यादृशरूपविशिष्टां यथालक्ष्मवतीं यादृशचिह्नविशिष्टां तां सीतां राघवस्य राघवादहमश्रौषं तादृशी सेयं कान्ता मया आसादिता प्राप्ता", "bhusana": "यथारूपां यथावर्णां यथालक्ष्मीं च निश्चिताम् ।\n\nअश्रौषं राघवस्याहं सेयमासादिता मया"}, "has_tier1": true, "notes": [{"id": "tier1:5.31.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Что обликом и приметами (yathārūpāṃ yathāvarṇāṃ) – букв. «ту… которая как обликом и цветом (кожи), так и приметами…»"}]}, {"verse_id": "5.31.18", "verse": "18", "sanskrit_iast": "niśamya sītā vacanaṃ kapeśca । diśaśca sarvāḥ pradiśaśca vīkṣya । svayaṃ praharṣam paramaṃ jagāma । sarvātmanā rāmam anusmarantī ॥18॥", "leonov_ru": "Сита, слыша слова обезьяны Глядя по всем сторонам, Почувствовала она высшую радость, Помнящая (вспоминающая) всей душой о Раме.", "commentary": {"bhusana": "निशम्य सीता वचनं कपेश्च दिशश्च सर्वाः प्रदिशश्च वीक्ष्य ।\n\nस्वयं प्रहर्षं परमं जगाम सर्वात्मना राममनुस्मरन्ती"}, "has_tier1": false, "notes": [{"id": "edition:5.31.18:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.31.18 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.31.18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.31.18", "iast": "niśamya sītā vacanaṃ kapeśca । diśaśca sarvāḥ pradiśaśca vīkṣya । svayaṃ praharṣam paramaṃ jagāma । sarvātmanā rāmam anusmarantī ॥18॥"}]}]}, {"verse_id": "5.31.19", "verse": "19", "sanskrit_iast": "sā tiryagūrdhvaṃ ca tathā hyadhastān । nirīkṣamāṇā tam acintyabuddhim । dadarśa piṅgādhipater amātyaṃ । vātātmajaṃ sūryamivodayastham ॥19॥", "leonov_ru": "Она по сторонам, вверх и вниз Глядя, того, наделенного невероятной мудростью Увидела советника владыки обезьян, Сына Ветра, подобного восходящему солнцу.", "commentary": {"siromani": "सेति । तिर्यगादिनिरीक्षमाणा सा सीता अचिन्त्यबुद्धिं पिङ्गाधिपतेः सुग्रीवस्य अमात्यं वातात्मजम् उदयस्थमुदयगिरिस्थितं सूर्यमिव ददर्श", "bhusana": "सा तिर्यगूर्ध्वं च तथाप्यधस्तान्निरीक्षमाणा तमचिन्त्यबुद्धिम् ।\n\nददर्श पिङ्गाधिपतेरमात्यं वातात्मजं सूर्यमिवोदयस्थम्\nइत्यार्षे श्रीरीमायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे एकत्रिंशः सर्गः ।। 5.31।।\n\nसेति । पार्श्वम् आकाशं भूमिं चावेक्षमाणा । अधस्तादित्यनेन यथा भूमिं भित्त्वा कश्चिन्नरः रामनामानि कीर्तयेत्तथा ऽन्यत्रापीत्यपिना संभावनोच्यते । शिंशुपावृक्षस्याधस्तात्तिर्यगूर्ध्वमिति वा । तमचिन्त्यबुद्धिं ददर्श । तद्वपुरवलोकनात्पूर्वं तस्य हृदयमेवं परिच्छिनत्ति स्म । इह लङ्कायां प्रविश्यावरोधाराममध्यप्रवेशेनायं निपुणतरमतिरिति निश्चितवतीत्यर्थः । पिङ्गाधिपतेरमात्यं स्वरविशेषेणायं वानरः, तत्रापि न स्वतन्त्रः, किन्तु स्वसजातीयस्य राज्ञः कस्यचिदमात्यो ऽयम्, तद्राज्यकार्यमेतद्धस्तगतमिति निश्चितवती । वातात्मजं रामप्राणहेतुभूतमत्प्राणनहेतुत्वेन सर्वप्राणिप्राणनहेतुत्वेन वायुपुत्रो ऽयमित्यवगतवती । सूर्यमिवोदयस्थं रामदिवाकरस्योदयसूचकमुदयगिरिस्थमरुणमिव स्थितम् । सूरः सूर्यः । \"सूरसूर्यार्यमादित्यद्वादशात्मदिवाकराः\" इत्यमरः । \"सूरसूतो ऽरुणो ऽनुरुः\" इत्युक्तेस्सूरस्य सम्बन्धी सूर्यः । दिगादित्वाद्यत् । भवतापि सम्बन्धः विशेष एव । यद्वा सूर्यशब्देन तत्संबन्ध्यरुणो लक्ष्यते । \"सूर्यो ऽरुणे च सूर्ये च\" इति निघण्टुरस्तीत्याहुः । औचित्यादत्र सूर्यो ऽरुणः"}, "has_tier1": true, "notes": [{"id": "tier1:5.31.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «acintyabuddhim» Опущено[Е. Костина] «piṅgādhipater amātyaṃ» Опущено"}, {"id": "phase2:5.31.19:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "acintyabuddhim … amātyam", "note_ru": "Бхушана прослеживает цепочку умозаключений Ситы ещё до того, как она разглядела облик вестника: по одной лишь звучности голоса (svara-viśeṣa) она заключает, что перед ней обезьяна, но не самостоятельная — значит, чей-то посланник, чьё дело (разыскать её) уже фактически исполнено; сравнение же с восходящим солнцем комментатор допускает понимать двояко — либо как солнце, либо (по значению слова sūrya в некоторых словарях) как Аруну, его колесничего, вестника зари. Подстрочник даёт только итоговый зрительный образ, минуя ход рассуждения и лексическую развилку.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "восстанавливает психологический ход умозаключения Ситы (голос → обезьяна → посланник) и лексическую развилку «солнце/Аруна», полностью отсутствующие в подстрочнике, который сохраняет только сравнение с восходящим солнцем", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}], "labels": {"tilaka": "Тилака", "bhusana": "Б

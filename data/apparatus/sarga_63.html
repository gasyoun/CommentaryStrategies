nd": "single", "range": "5.63.3", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.63.3", "iast": "kiṃ sambhramād dhitam kṛtsnaṃ brūhi yad vaktum arhasi । kaccin madhuvane svasti śrotum icchāmi vānara ॥3॥"}]}]}, {"verse_id": "5.63.5", "verse": "5", "sanskrit_iast": "naivarkṣarajasā rājan na tvayā na ca vālinā । vanaṃ nisṛṣṭapūrvaṃ hi nāśitaṃ tat tu vānaraiḥ ॥5॥", "leonov_ru": "О царь! Лес, в который ни Рикшараджей, ни тобой, ни Валином Не позволялось прежде [входить], разорен обезьянами.", "commentary": {"tilaka": "तत इति ।। 5.63.1,2 ।।\n\nकिंसंभ्रमात्कस्य भयात् इहागतो ऽसीति शेषः । यत्कृत्स्नं हितं तद्ब्रूहि, यतस्त्वं सर्वमुचितमनुचितं च वक्तुमर्हसि ।। 5.63.3,4 ।।\n\nनैव निसृष्टपूर्वं वानरेभ्यो यथेच्छभोगाय कदापि नानुज्ञातम् ।। 5.63.5,6 ।।\n\nएभिर्हनुमदाद्यैः प्रधर्षणायामारब्धायां वनपालकैर्वारितम्, ममापि । अपिनेतरान्पालकानचिन्तयन्नचिन्तयन्तः", "siromani": "दधिमुखप्रणामानन्तरकालिकं वृत्तान्तमाह तत इत्यादिभिः वानरर्षभः सुग्रीवः निपतितं दृष्ट्वैव उद्विग्नहृदयः सन् उवाच", "bhusana": "नैवर्क्षरजसा राजन्न त्वया नापि वालिना ।\n\nवनं निसृष्टपूर्वं हि भक्षितं तच्च वानरैः\nनैवेति । न निसृष्टपूर्वं यथेच्छभोगाय न दत्तपूर्वम् । वानरैः अङ्गदप्रमुखैः । अन्यथा सुग्रीववाक्ये अङ्गदानुवादविरोधात् । भक्षितमिति वनैकदेशमधुपटलविषयम्\nएभिः प्रधर्षिताश्चैव वानरा वनरक्षिभिः ।\n\nमधून्यचिन्तयित्वेमान् भक्षयन्ति पिबन्ति च\nएभिरिति । अचिन्तयित्वा अगणयित्वा । मधूनीति फलानामुपलक्षणम् । भक्षयन्ति पिबन्ति चेत्युक्तेः । यद्वा मधून्येव भक्षयन्ति भक्षवत्कुर्वन्तीत्यर्थः\nशिष्टमत्रापविध्यन्ति भक्षयन्ति तथा ऽपरे ।\n\nनिवार्यमाणास्ते सर्वे भ्रूवौ वै दर्शयन्ति हि\nशिष्टम् अवशिष्टं मधुपटलम् । अत्र मधुवने । अपविध्यन्ति ध्वंसयन्ति । भक्षयन्ति मधुपटलमित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.63.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Рикшараджей» Нужен будет комм"}]}, {"verse_id": "5.63.6", "verse": "6", "sanskrit_iast": "nyavārayam ahaṃ sarvān sahaibhir vanacāribhiḥ । acintayitvā māṃ hṛṣṭā bhakṣyanti pibanti ca ॥6॥", "leonov_ru": "Я попытался остановить [их] всех вместе с обитателями леса (обезьянами). Радостные, не думая обо мне, [они] едят и пьют [мёд]. (они продолжали есть и пить мед)", "commentary": {"siromani": "न्यवारयमिति । अहं न्यवारयं तथापि मामचिन्तयित्वा अपरिगणय्य भक्षयन्ति पिबन्ति"}, "has_tier1": true, "notes": [{"id": "tier1:5.63.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Насыщаются медом в веселии (hṛṣṭā bhakṣyanti pibanti ca) - букв. “веселые, едят и пьют”. Автор комментария “Таттвадипика” полагает, что подразумевается “едят плоды и пьют мед”. Сходная точка зрения высказывается в комментарии “Бхушана”."}, {"id": "edition:5.63.6:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.63.6 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.63.6", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.63.6", "iast": "nyavārayam ahaṃ sarvān sahaibhir vanacāribhiḥ । acintayitvā māṃ hṛṣṭā bhakṣyanti pibanti ca ॥6॥"}], "collision_tier1": true}]}, {"verse_id": "5.63.8", "verse": "8", "sanskrit_iast": "śiṣṭam atrāpavidhyanti bhakṣayanti tathāpare । nivāryamāṇās te sarve bhrūkuṭiṃ darśayanti hi ॥8॥", "leonov_ru": "[Одни] разбрасывали остатки [мёда], другие же ели [его]. Когда мы попытались остановить их, они показали нахмуренные брови.", "commentary": {"siromani": "एभिरिति । एभिर्वनरक्षिभिः प्रधृष्यमाणाः भर्त्स्यमाना वारिताश्च ते वानराः भक्षयन्ति पिबन्ति च\nशिष्टमिति । अपरे भक्षयन्ति शिष्टमवशिष्टम् अपविध्यन्ति प्रक्षिपन्ति च निवार्यमाणाः सन्तः भृकुटिं दर्शयन्ति", "tilaka": "भ्रुकुटिं वक्रे भ्रुवौ"}, "has_tier1": true, "notes": [{"id": "tier1:5.63.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Одни разбивают ульи (śiṣṭam atrāpavidhyanti) - в оригинале использовано слово śiṣṭam, которое автор комментария “Бхушана” глоссирует как madhupaṭalam (улей).[Е. Костина] «,» Можно тогда указать и другую трактовку, которую мы видим в Г-пр и у Голдмэнов - что они разбрасывают остатки"}, {"id": "lexical:5.63.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bhrūkuṭi", "note_ru": "«Бхрукути» (bhrūkuṭi, f.) — «сдвинутые/нахмуренные брови», от bhrū «бровь» (и.-е. *bʰruH-, ср. авест. brvat-, ст.-слав. бровь, греч. ὀφρύς, англ. brow) + kuṭi «изогнутость, кривизна» (√kuṭ-, «быть кривым»). MW: bhrūkuṭi 'a frown, the contraction of the eyebrows'. Апте: bhrūkuṭi «a frown, knitting of the brows». Это жест-маркер гнева в санскритской теории расы (raudra-rasa), зафиксированный в Нāтьяшāстре (2.256: bhrūkuṭyā kopam ācaṣṭe). В 63.8 Лакшмана «нахмуривает брови» bhrūkuṭi при виде разгрома мадхуваны — это кодифицированный знак раздражения, считываемый как «начало гнева» до произнесения слов.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:BrUkuWi+dic_apte:BrUkuWi", "collision_tier1": true}]}, {"verse_id": "5.63.13", "verse": "13", "sanskrit_iast": "evaṃ vijñāpyamānaṃ taṃ sugrīvaṃ vānararṣabham । apṛcchat taṃ mahāprājño lakṣmaṇaḥ paravīrahā ॥13॥", "leonov_ru": "Сугриву, быка среди обезьян, которому так сообщалось, Спросил многомудрый Лакшмана, губитель вражеских героев:", "commentary": {"siromani": "एवमिति । एवं विज्ञाप्यमानं सुग्रीवं लक्ष्मणो ऽपृच्छत्", "bhusana": "आर्य लक्ष्मण संप्राह वीरो दधिमुखः कपिः ।\n\nअङ्गदप्रमुखैर्वीरैर्भक्षितं मधु वानरैः"}, "has_tier1": true, "notes": [{"id": "tier1:5.63.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «vijñāpyamānaṃ» опущено"}, {"id": "lexical:5.63.13:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "saumitre", "note_ru": "«Саумитре» (saumitre, voc.) — отчество-матроним Лакшманы: saumitrā от имени его матери Сумитры (su-mitrā, «имеющая хороших друзей»); суффикс отчества -eya/-a образует форму «сын [такой-то матери]». MW: saumitrā 'son of Sumitrā, i.e. Lakṣmaṇa'. Особенность: данная форма — матроним, а не патроним (как большинство Sanskrit patronymics); отец Лакшманы — Дашаратха, однако в эпосе последовательно применяется сауМитре/СауМитри, подчёркивающий особую связь Лакшманы с матерью. MW (s.v. saumitrā) фиксирует оба сына Сумитры — Лакшману и Шатругхну — как «сауМитра»; в Рамаяне формой saumitre маркируются ключевые обращения Рамы к Лакшмане в момент эмоционального подъёма.", "type": "В", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:saumitrA", "collision_tier1": true}, {"id": "crosstext:5.63.13:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "devī eva rakṣ bhartṛ tvad", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.63.13,16", "work_label": "Rām", "verse_address": "Rām 5.57.11,12,14 (крит. изд.)", "parallel_sa_iast": "tataḥ saṁbhāṣitā caiva sarvam arthaṁ ca darśitā |rāmasugrīvasakhyaṁ ca śrutvā prītim upāgatā ||", "sundara_sa_iast": "tataḥ saṁbhāṣitā devī sarvam arthaṁ ca darśitā |rāmasugrīvasakhyaṁ ca śrutvā prītim upāgatā ||", "quality": "PARTLY", "source": "DCS parallel-search (PARTLY); Rām 5.57.11,12,14 (крит. изд.)", "edition_flag": "critical", "shloka_critical": "V.63.13,16", "verse_address_vulgate": "", "collision_tier1": true}]}, {"verse_id": "5.63.17", "verse": "17", "sanskrit_iast": "naiṣām akṛtakāryāṇām īdṛśaḥ syād vyatikramaḥ । vanaṃ yad abhipannās te sādhitaṃ karma tad dhrūvam ॥17॥", "leonov_ru": "Не было бы подобного пренебрежения у них, если бы они не завершили дело. Раз они вторглись в лес, то, без сомнения, выполнено дело.", "commentary": {"tilaka": "यद्यथा वनमभिपन्ना नाशयितुं प्रवृत्ताः", "bhusana": "धर्षितं च वनं कृत्स्नमुपयुक्तं च वानरैः\nवनं प्रमथितं भग्नम् । धर्षितम् आक्रान्तम् । मधु च भक्षितम् । यथा येन कारणेन । एषामकृतकृत्यानामीदृश उपक्रमो न स्यादिति मन्य इति योजना ।। 5.63.16,17 ।।\n\nवनं यदाभिपन्नास्ते साधितं कर्म वानरैः ।\n\nदृष्टा देवी न सन्देहो न चान्येन हनूमता ।\n\nन ह्यन्यः साधने हेतुः कर्मणो ऽस्य हनूमतः", "siromani": "नेति । अकृतकार्याणाम् अनिष्पादितमत्प्रयोजनानां वानराणाम् ईदृशो व्यतिक्रमो न स्यात् । यद्यस्माद्धेतोस्ते वानराः वनमभिपन्नाः विध्वंसितुं प्रवृत्ताः तस्माद्धेतोः कर्म मत्प्रयोजनं ध्रुवं साधितं वानरैरिति शेषः"}, "has_tier1": false, "notes": [{"id": "lexical:5.63.17:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vyatikrama", "note_ru": "«Вьятикрама» (vyatikrama, m.) — «нарушение, преступление границы», vi-ati-krama, от vi+ati+√kram- («шагать через», Whitney #599; и.-е. *klembʰ- / *krem-). MW: vyatikrama 'transgression, violation'. В юридической санскритской литературе (Ману 7.16; Артхашастра 2.1.4) vyatikrama — технический термин для нарушения установленного порядка, регламента или запрета; он имеет правовые последствия (daṇḍa = наказание). В стихе V.63.17 ситуация парадоксальна: vyatikrama в священной мадхуване — это одновременно dharmic violation (нарушение охраняемого grove Сугривы) и знак kṛtakārya (выполненного задания). Сугрива должен оценить vyatikrama как марша&нīя — то, что следует «отпустить» (см. V.63.31).", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vyatikrama+indological knowledge"}]}, {"verse_id": "5.63.18", "verse": "18", "sanskrit_iast": "vārayanto bhṛśaṃ prāptaḥ pālā jānubhir āhataḥ । tathā na gaṇitaś cāyaṃ kapir dadhimukho balī ॥18॥", "leonov_ru": "Пришедшие стражи леса, которые снова и снова пытались [их] остановить, были побиты коленями, А этот могучий Дадхимукха-обезьяна не был принят в расчет, (И не посчитались они с Дадхимукхой)", "commentary": {"tilaka": "वारयन्तः हेतौ शता वारणाद्धेतोर्जानुभिराहताः पालाः प्राप्ताः"}, "has_tier1": true, "notes": [{"id": "tier1:5.63.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «balī» опущено"}, {"id": "edition:5.63.18:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.63.18 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.63.18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.63.18", "iast": "vārayanto bhṛśaṃ prāptaḥ pālā jānubhir āhataḥ । tathā na gaṇitaś cāyaṃ kapir dadhimukho balī ॥18॥"}], "collision_tier1": true}]}, {"verse_id": "5.63.20", "verse": "20", "sanskrit_iast": "na hy anyaḥ sādhane hetuḥ karmaṇo 'sya hanūmataḥ । kāryasiddhir hanumati matiś ca haripuṃgave ॥20॥", "leonov_ru": "Ибо нет никого, кроме Ханумана, кто мог бы стать причиной исполнения дела. В Ханумане есть успешность, и ум есть в этом быке среди обезьян,", "commentary": {"bhusana": "कार्यसिद्धिर्मतिश्चैव तस्मिन् वानरपुङ्गवे ।\n\nव्यवसायश्च वीर्यं च श्रुतं चापि प्रतिष्ठितम्\nजाम्बवान् यत्र नेता स्यादङ्गदश्च महाबलः ।\n\nहनूमांश्चाप्यधिष्ठाता न तस्य गतिरन्यथा"}, "has_tier1": true, "notes": [{"id": "tier1:5.63.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…удачливость (kāryasiddhiḥ) - букв. “успех в делах”."}]}, {"verse_id": "5.63.21", "verse": "21", "sanskrit_iast": "vyavasāyaś ca vīryaṃ ca śrutaṃ cāpi pratiṣṭhitam । jāmbavān yatra netā syād aṅgadaśca mahābalaḥ ॥21॥", "leonov_ru": "Упорство и мужество, а также ученость установлена. Где предводитель – Джамбаван, а также могучий Ангада,", "commentary": {"siromani": "कार्यसिद्धिमन्तरा वानरकर्तृकमधुवनविध्वंसस्यासंभवं द्योतयन्नाह जाम्बवानिति । यत्र सैन्ये जाम्बवान्नेता मुख्यः अङ्गदो हरीश्वरः सर्ववानरनियन्ता हनूमान् अधिष्ठाता संमतिद्धाता तत्र सैन्ये अन्यथागतिः अन्याय्येन गमनं न संभवतीति शेषः"}, "has_tier1": false, "notes": [{"id": "lexical:5.63.21:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vyavasāya", "note_ru": "«Вьявасая» (vyavasāya, m.) — «твёрдая решимость, волевая определённость», vi-ava-√so- (выжимать, выдавливать до конца; MW: √so- 'to finish, destroy'): vi+ava+sā → «выжать до конца = окончательно решить». MW: vyavasāya 'exertion, effort; determination, resolution; industry'. В эпической этике vyavasāya принципиально отличается от saṃkalpa («намерения, обета»): saṃkalpa — ментальное решение, vyavasāya — реализованная воля, уже выраженная в действии. Именно в этом значении Бхагавадгита (2.41) противопоставляет vyavasāyātmikā buddhiḥ («разум с единым острием решимости») множественным avyavasāyinām («нерешительных»). В Сундараканде выяснение судьбы Ситы — vyavasāya как сбывшийся единый замысел.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:vyavasAya+indological knowledge"}]}, {"verse_id": "5.63.22", "verse": "22", "sanskrit_iast": "hanūmāṃś cāpy adhiṣṭhātā na tatra gatir anyathā । aṅgadapramukhair vīrair hataṃ madhuvanaṃ kila ॥22॥", "leonov_ru": "А Хануман – ведущий, там нет иного исхода. Сказано [Дадхимукхой, что], разорен лес Мадхувана героями во главе с Ангадой,", "commentary": {"bhusana": "अङ्गदप्रमुखैर्वीरैर्हतं मधुवनं किल ।\n\nवारयन्तश्च सहितास्तथा जानुभिराहताः\nन चाप्यदृष्ट्वा वैदेहीं विश्रुताः पुरुषर्षभ ।\n\nवनं दत्तवरं दिव्यं धर्षयेयुर्वनौकसः", "siromani": "अङ्गदेति । अङ्गदप्रमुखैर्वानरैः उपयुक्तं भोगोपयोगि कृत्स्नं मधुवनं हतं वनं वनपजातं धर्षितं च"}, "has_tier1": true, "notes": [{"id": "tier1:5.63.22:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Сказано –» Непонятно, зачем это здесь добавлено. Создает определенные ожидания от текста (что будет противопоставление), которые не оправдываются"}]}, {"verse_id": "5.63.23", "verse": "23", "sanskrit_iast": "vicintya dakṣiṇām āśām āgatair haripuṃgavaiḥ । āgataiś cāpradhṛṣyaṃ tad dhataṃ madhuvanaṃ hi taiḥ ॥23॥", "leonov_ru": "Быками среди обезьян, которые вернулись, обыскав южные земли. Ими, вернувшимися, разорен лес Мадхувана, который не должно разорять.", "commentary": {"bhusana": "विचित्य दक्षिणामाशामागतैर्हरिपुङ्गवैः"}, "has_tier1": false, "notes": [{"id": "lexical:5.63.23:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dakṣiṇā āśā", "note_ru": "«Дакшина дик» / «дакшина āśā» (dakṣiṇā āśā, f.) — «южная сторона света»: dakṣiṇa «правый; южный» (и.-е. *deḱs-, «правая рука»; сравн. лат. dexter, греч. δεξιός). Юг — «правое» направление при ориентации лицом к востоку (к восходящему солнцу). В ведийско-эпической космологии dakṣiṇā diś — сторона Ямы (бога смерти), «область умерших» (Atharvaveda 18.2.48; МБх 12.321). Поход ванаров именно на юг и их возвращение с радостной вестью — структурный парадокс: они вернулись из «страны мёртвых» (Ланки, локализованной на острове за морем на юге) живыми и с вестью о живой Сите. Южное направление превращается из зловещего в победное.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:dakziRA+indological knowledge"}]}, {"verse_id": "5.63.25", "verse": "25", "sanskrit_iast": "etadartham ayaṃ prāpto vaktuṃ madhuravāg iha । nāmnā dadhimukho nāma hariḥ prakhyātavikramaḥ ॥25॥", "leonov_ru": "Чтобы это поведать, пришла сюда эта сладкоречивая Обезьяна по имени Дадхимукха, прославленная своей доблестью.", "commentary": {"bhusana": "एतदर्थमयं प्राप्तो वक्तुं मधुरवागिह ।\n\nनाम्ना दधिमुखो नाम हरिः प्रख्यातविक्रमः"}, "has_tier1": true, "notes": [{"id": "tier1:5.63.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Пришел со словами сладостными (prāpto... vaktuṃ madhuravāg iha) - в комментарии “Сатьятиртха” отмечается, что Сугрива назвал слова Дадхимукхи сладостными, поскольку в них сообщалась радостная новость."}]}, {"verse_id": "5.63.27", "verse": "27", "sanskrit_iast": "na cāpy adṛṣṭvā vaidehīṃ viśrutāḥ puruṣarṣabha । vanaṃ dāttavaraṃ divyaṃ dharṣayeyur vanaukasaḥ ॥27॥", "leonov_ru": "Не найдя Вайдехи, о бык среди мужей, прославленные Обезьяны не стали бы разорять чудесный, данный в дар, лес».", "commentary": {"siromani": "नेति । वैदेहीमदृष्ट्वा विश्रुता प्रख्याता वनौकसः दत्तवरम् अस्माभिः प्राप्ताभयं वनं न धर्षयेयुः", "tilaka": "दत्तवरं वरत्वेन देवैरस्माकं दत्तम् ।। 5.63.27,28 ।।\n\nएकः सुग्रीवशब्दः शोभनग्रीवपरः"}, "has_tier1": true, "notes": [{"id": "tier1:5.63.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…чудесную рощу (vanaṃ dāttavaraṃ divyam) - в оригинале сказано также, что роща dāttavaram, то есть является даром, данным [богами] (как поясняет автор “Тилаки”)."}]}, {"verse_id": "5.63.29", "verse": "29", "sanskrit_iast": "prāhṛṣyata bhṛśaṃ rāmo lakṣmaṇaś ca mahāyaśāḥ । śrutvā dadhimukhasyaivaṃ sugrīvas tu prahṛṣya ca ॥29॥", "leonov_ru": "Обрадовались очень Рама и многославный Лакшмана. Услышав весть Дадхимукхи, Сугрива, обрадовавшись,", "commentary": {"bhusana": "न चेति । वनमिति । मधुवनधर्षणमेव सीतादर्शने लिङ्गमिति भावः । दत्तवरं दिव्यमित्यनेन ऋक्षरजसे ब्रह्मणा दत्तमित्यवगम्यते ।। 5.63.24,25 ।।\n\nश्रुत्वा दधिमुखस्येदं सुग्रीवस्तु प्रहृष्य च ।\n\nवनपालं पुनर्वाक्यं सुग्रीवः प्रत्यभाषत", "siromani": "प्राहृष्यतेति । एवं सुग्रववचनसदृशं दधिमुखस्य वाक्यं श्रुत्वा रामः प्राहृष्यत सुग्रीवादीन् प्रहर्षयामास अन्तर्भावितणिजर्थः । सुग्रीवः शोभनग्रीवाविशिष्टः सुग्रीवस्तु वनपालं पुनः प्रत्यभाषत । सार्धश्लोक एकान्वयी"}, "has_tier1": false, "notes": [{"id": "phase2:5.63.29:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sugrīva", "note_ru": "Сугрива (sugrīva) — по Бхушане и Широмани, второе появление имени в этом эпизоде (29-й стих вслед за 28-м) не тавтология: слово здесь «оживляет» собственную этимологию — śobhanagrīva, «прекрасношеий», — чтобы избежать буквального повтора (punarukti) одного и того же имени подряд. Подстрочник передаёт оба вхождения одинаково как имя собственное, теряя эту игру со значением имени царя.", "type": "Б", "source_commentary": ["bhusana", "siromani"], "why_proposed": "Бхушана и независимо Широмани фиксируют этимологическую игру на имени Сугривы (лит. «прекрасношеий»), не переданную подстрочником и не отмеченную ни у Леонова/Костиной, ни в Phase-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.63.31", "verse": "31", "sanskrit_iast": "dharṣitaṃ marṣaṇīyaṃ ca ceṣṭitaṃ kṛtakarmaṇām । gaccha śīghraṃ madhuvanaṃ saṃrakṣasva tvam eva hi । śīghraṃ preśaya sarvaṃs tān hanumatpramukhān kapīn ॥31॥", "leonov_ru": "Дурное это дело должно простить тем, кто исполнил дело. Ступай немедленно в Мадхувану, охраняй [этот лес, как и прежде]. Немедленно пришли всех этих обезьян во главе с Хануманом.", "commentary": {"siromani": "गच्छेति । मधुवनं गच्छ त्वमेव संरक्षस्व हनुमत्प्रमुखान् शीघ्रं प्रेषय"}, "has_tier1": false, "notes": [{"id": "lexical:5.63.31:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "marṣaṇīya", "note_ru": "«Маршания» (marṣaṇīya, adj.) — «то, что следует вытерпеть/снести/простить», от √mṛṣ- («терпеть, сносить, не замечать», Whitney #1485; класс IV) + герундивный суффикс -anīya. MW: mṛṣ 'to forget, neglect, overlook; to bear, endure'. Апте: marṣaṇīya «what should be forgiven or tolerated». Это слово из лексики dharmaśāstra-терпимости: царь, «снося» (mṛṣ) проступок слуги, не проявляет слабости — он совершает волевой акт kshamā (прощения), который в Артхашастре и Манусмрити стоит выше наказания, если проступок совершён при достижении задания (kāryasiddhi). Сугрива называет разгром мадхуваны marṣaṇīyam именно в рамках этого калькулятора: kṛtakārya (выполненное поручение) смягчает vyatikrama (нарушение).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:mfz+dic_apte:marzaRIya"}, {"id": "edition:5.63.31:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.63.31 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.63.31", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.63.31", "iast": "dharṣitaṃ marṣaṇīyaṃ ca ceṣṭitaṃ kṛtakarmaṇām । gaccha śīghraṃ madhuvanaṃ saṃrakṣasva tvam eva hi । śīghraṃ preśaya sarvaṃs tān hanumatpramukhān kapīn ॥31॥"}]}]}, {"verse_id": "5.63.32", "verse": "32", "sanskrit_iast": "icchāmi śīghraṃ hanumatpradhānān । śākhāmṛgāṃs tān mṛgarājadarpān । praṣṭuṃ kṛtārthān saha rāghavābhyāṃ । śrotuṃ ca sītādhigame prayatnam ॥32॥", "leonov_ru": "Я желаю немедленно тех обезьян, Возглавляемых Хануманом, гордых подобно львам, Распросить, исполнивших дело, вместе с обоими Рагхавами, И услышать об усилиях ради отыскания Ситы».", "commentary": {"siromani": "प्रेषणे हेतुमाह इच्छामीति । मृगराजदर्पान् सिंहवद्दर्पविशिष्टान् कृतार्थान् शाखामृगान् द्रष्टुं शीघ्रमिच्छामि । तत्र हेतुः सीताधिगमे सीतादर्शनप्राप्त्यर्थं प्रयत्नं यत्नविशेषं श्रोतुं शीघ्रमिच्छामि"}, "has_tier1": true, "notes": [{"id": "tier1:5.63.32:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Расспросить вместе с потомками Рагху» звучит странновато, как будто у него есть опции: расспросить их отдельно или расспросить вместе с потомками Рагху"}, {"id": "lexical:5.63.32:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mṛgarājadarpā", "note_ru": "«Мригараджадарпа» (mṛgarāja-darpa, adj. bah.) — «исполненные гордости льва»: mṛgarāja «царь зверей» = лев (не олень!) + darpa «высокомерие, гордость» (от √dṛp-, «безумствовать от гордости», Whitney #857). MW: mṛgarāja 'the lion or tiger (king of beasts)'. Семантика mṛga здесь — капкан: в большинстве контекстов mṛga = «олень»; mṛgarāja = «царь оленей» было бы абсурдом. Но MW s.v. mṛga фиксирует и значение «any animal», а mṛgarāja устойчиво = «лев» в эпосе и кавье. Ванары, «несущие гордость льва», — оксюморонная характеристика: обезьяны с повадкой царя зверей. Darpa добавляет оттенок торжествующей самонадеянности (не просто «смелость», но ликующая braggadocio).", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:mfgarAja+dic_mw:darpa", "collision_tier1": true}, {"id": "lexical:5.63.32:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śākhāmṛga", "note_ru": "«Шакхамрига» (śākhāmṛga, m.) — «зверь ветвей» = обезьяна: śākhā «ветвь» (от √śak-, «мочь, нести»?) + mṛga «зверь, странник» (от √mṛg-, «преследовать, искать», Whitney #1426). MW: mṛga 'any game or wild animal; a deer; a monkey' [последнее в числе значений]. Śākhāmṛga — поэтический кеннинг, употребляемый исключительно в высоком стиле; стандартные слова для обезьяны — vānara («лесной»), kapi, plavaṃga («прыгающий»). Кеннинг образован по аналогии с jala-mṛga («водный зверь» = рыба, крокодил): обезьяна — «лесной олень» в кронах деревьев. Слово обнаруживает эпическую поэтику именования через экологическую нишу, а не через биологический вид.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:SAKAmfga+dic_apte:SAKAmfga", "collision_tier1": true}]}, {"verse_id": "5.63.33", "verse": "33", "sanskrit_iast": "prītisphītākṣau samprahṛṣṭau kumārau । dṛṣṭvā siddhārthau vānarāṇāṃ ca rājā । aṅgaiḥ prahṛṣṭaiḥ kāryasiddhiṃ viditvā । bāhvorāsannām atimātraṃ nananda ॥33॥", "leonov_ru": "Обоих царевичей, обрадованных, с глазами, увеличившимися от радости, Чья цель исполнилась, увидев, царь обезьян Поняв по возбуждению (дрожи) членов [своего] тела, что исполнение дела Уже совсем близко, чрезмерно обрадовался. (Царь обезьян, увидев обрадованных царевичей, чьи глаза увеличились от радости, чья цель исполнилась, поняв по дрожи членов тела, что близко завершение дела, чрезмерно обрадовался).", "commentary": {"bhusana": "प्रीतिस्पीताक्षौ सम्प्रहृष्टौ कुमारौ दृष्ट्वा सिद्धार्थौ वानराणां च राजा ।\n\nअङ्गैः संहृष्टैः कर्मसिद्धिं विदित्वा बाह्वोरासन्नां सो ऽतिमात्रं ननन्द\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे त्रिषष्टितमः सर्गः ।। 5.63 ।।\n\nअथ प्रत्युपकारार्थं सुग्रीवः स्वोद्योगसाफल्यदर्शनात् भृशं ननन्देत्याह प्रीतिस्फीताक्षाविति । प्रीत्या सन्तोषेण । संप्रहृष्टौ, रोमस्विति शेषः । हृषितरोमाणावित्यर्थः । \"हृषेर्लोमसु\" इति विकल्पादिडभावः । एवम् अङ्गैः संहृष्टैरित्यत्रापि द्रष्टव्यम् । कर्मसिद्धिं बाह्वोरासन्नां हस्तप्राप्ताम्, । विदित्वा निश्चित्येत्यर्थः । जागतं वैश्वदेवीवृत्तम् । \"पञ्चश्वैश्छिन्ना वैश्वदेवी ममौ यौ \" इति लक्षणात् । अस्मिन्सर्गे एकोनत्रिंशच्छ्लोकाः", "siromani": "प्रीतीति । सिद्धार्थौ निष्पन्नप्रयोजनौ अत एव संप्रहृष्टौ अत एव प्रीत्या हनुमदाविषयकातिस्नेहेन स्फीते अक्षिणी ययोः तौ कुमारौ रामलक्ष्मणौ दृष्ट्वा प्रहृष्टैः अङ्गैः दक्षिणनेत्रादिभिः करणैर्बाह्वोरासन्नां प्राप्तमिव कार्यसिद्धिं विदित्वा वानराणां राजा सुग्रीवः अतिमात्रम् अत्यतं ननन्द"}, "has_tier1": false, "notes": [{"id": "phase2:5.63.33:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "saṃprahṛṣṭa", "note_ru": "Сампрахришта (saṃprahṛṣṭa) — по Бхушане, здесь подразумевается не просто «обрадованный», а буквально «с вставшими дыбом волосками» (hṛṣitaromāṇau): корень hṛṣ- в грамматической традиции относится именно к волоскам тела, так что «дрожь членов» дальше в том же стихе описывает то же явление — горестный жест радости (horripilatio) как физиологический маркер сильного чувства, а не метафора. Подстрочник передаёт это общим «обрадованные», теряя конкретный телесный образ.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "Бхушана уточняет saṃprahṛṣṭa как горестное вздыбление волосков тела (грамматически обосновано через корень hṛṣ-), меняя образ с общей радости на конкретный телесный жест — не в подстрочнике и не у Леонова/Костиной.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "edition:5.63.33:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.63.33 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.63.33", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.63.33", "iast": "prītisphītākṣau samprahṛṣṭau kumārau । dṛṣṭvā siddhārthau vānarāṇāṃ ca rājā । aṅgaiḥ prahṛṣṭaiḥ kāryasiddhiṃ viditvā । bāhvorāsannām atimātraṃ nananda ॥33॥"}]}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};

    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

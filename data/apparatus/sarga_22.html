<script>
const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 22, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 60, "verses_with_notes": 22, "notes_by_layer": {"tier1": 15, "lexical": 9, "phase2": 7, "edition": 3, "crosstext": 1}}, "sarga": 22, "verses": [{"verse_id": "5.22.2", "verse": "2", "sanskrit_iast": "yathā yathā sāntvayitā vaśyaḥ strīṇāṃ tathā tathā । yathā yathā priyaṃ vaktā paribhūtas tathā tathā ॥2॥", "leonov_ru": "«Когда ведешь себя мягко (с женщинами), оказываешься во власти женщин, Когда говоришь (им) приятные слова, оказываешься отвергнутым.", "commentary": {"tilaka": "लोके स्त्रीणां सान्त्वयिता पुमान्यथा यथा सान्त्वयति तथा तथा तत्तत्सान्त्वानुसारेण स स्त्रीणां वश्य इष्टो भवति, त्वयि तु यथा यथा ऽहं प्रियं वक्ता ऽभूवं तथा तथा त्वया परिभूत एवास्मीति शेषः", "bhusana": "यथा यथा सान्त्वयिता वश्यः स्त्रीणां तथा तथा ।\n\nयथा यथा प्रियं वक्ता परिभूतस्तथा तथा\nसान्त्वयिता अनुनेताः", "siromani": "तद्वचनाकारमाह यथा यथेति । यथा यथा सान्त्वयिता सान्त्ववचनवक्ता तथा तथा तत्तद्वचनानुसारेण वश्यः प्रियो भवति जन इति शेषः, अहं तु स्त्रीणां युष्माकं यथा यथा प्रियं वक्ता तथा त्वया परिभूतो ऽस्मीति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "К ней во власть попадаешь (vaśyaḥ strīṇāṃ tathā tathā) – комментарий «Тилака» объясняет слово vaśyaḥ как iṣṭa (желанный), комментарий «Широмани» - как priya (приятный, любимый). При такой интерпретации смысл фразы будет: «Каждый раз, когда мужчина ведет себя с женщинами мягко, он им приятен (желанен), но каждый раз, когда я говорю тебе приятные слова, ты меня отвергаешь». Голдмены переводят vaśyaḥ как «униженный» (humiliated) (см.: Goldman 1984: 171). В комментарии «Таттвадипика» это слово толкуется как vaśaṃgataḥ (находящийся в чьей-то власти)."}, {"id": "lexical:5.22.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sāntvayitṛ", "note_ru": "Сантвайитри (sāntvayitṛ, m.) — «утешитель, тот, кто умиротворяет»: производное от sāntvay- (каузативная тема от √sāntv-, «умиротворять, говорить ласково»; MW: sāntvana 'consolation; conciliation'). Сантвана — конкретная процедура политического и личного общения: одна из четырёх upāya (sāma, dāna, bheda, daṇḍa); сāма = мирное убеждение. Максима Раваны в 22.2 — социальная мудрость (nīti): тот, кто слишком умиротворяет женщин, попадает к ним в зависимость (vaśya). Это парадоксальная антинити: Равана декларирует, что смягчение ради женщины — слабость, а жёсткость — сила. Важна формальная симметрия sāntv↔paribhū-.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:sAntv", "collision_tier1": true}]}, {"verse_id": "5.22.3", "verse": "3", "sanskrit_iast": "saṃniyacchati me krodhaṃ tvayi kāmaḥ samutthitaḥ । dravato 'mārgam āsādya hayān iva susārathiḥ ॥3॥", "leonov_ru": "Сдерживает мой гнев к тебе любовь (во мне) возникшая, Как хороший возница сдерживает коней, бегущих по дурной дороге.", "commentary": {"bhusana": "सन्नियच्छति मे क्रोधं त्वयि कामः समुत्थितः ।\n\nद्रवतो ऽमार्गमासाद्य हयानिव सुसारथिः\nसन्नियच्छति निरुणद्धि । द्ववतः धावतः । अमार्गमिति च्छेदः", "siromani": "समिति । समुत्थितः कामः त्वत्सेवाविषयकोत्कटेच्छा त्वयि विषये मे क्रोधं सन्नियच्छति निवारयति । तत्र दृष्टान्तः मार्गमासाद्य प्राप्य द्रवतो हयान् सुसारथिरिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Коней, не туда повернувших (dravato ‘mārgam āsādya hayān) – в бомбейском издании стоит mārgam, однако по комментарию «Тилака» следует читать amārgam. Если принять чтение mārgam, то смысл будет: «Словно умелый возница, выехав на дорогу, [сдерживает] бегущих коней»."}, {"id": "lexical:5.22.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "susārathi", "note_ru": "Сусаратхи (su-sārathi, m.) — «хороший возница»: su- «хорошо» + sārathi (√sṛ- «двигаться» или sa-+ratha «при колеснице») — «возница, правящий колесницей». MW: sārathi 'a charioteer'. Сравнение kāma с вожжами, а sārathi — с мудрецом — типичная упанишадическая метафора (Катха-упанишада 3.3–4: тело = колесница, манас = вожжи, буддхи = возница). Равана здесь переключает её в bhauma-регистр: речь идёт не об аллегории освобождения, а о самообладании (krodha-nigrahe). Эта аллюзия — показатель культурного кода текста: читатель опознаёт упанишадический образ.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:sAraTi", "collision_tier1": true}]}, {"verse_id": "5.22.4", "verse": "4", "sanskrit_iast": "vāmaḥ kāmo manuṣyāṇāṃ yasmin kila nibadhyate । jane tasmiṃs tv anukrośaḥ snehaś ca kila jāyate ॥4॥", "leonov_ru": "Воистину, желание связывает людей, у людей из-за него воистину рождаются сострадание и нежность.", "commentary": {"tilaka": "ननु विपरीतं क्रोध एव किं न कामं रुणद्धीत्यत्र कामस्यौत्कट्यादित्याह-- वाम इति । क्रूर इत्यर्थः । \"सव्ये क्रौर्ये सुन्दरे च वामः\"  इति कोशः । कामक्रौर्यमेवाह-- यस्मिन्निति । परमक्रोधविषये ऽपि यत्र जने कामो निबद्ध्यते तत्र जने ऽनुक्रोशो दया स्नेहश्च जायते । तस्मात्क्रोधात्काम उत्कटक्रूरत्ववानित्यर्थः", "bhusana": "वामः कामो मनुष्याणां यस्मिन् किल निबद्ध्यते ।\n\nजने तस्मिंस्त्वनुक्रोशः स्नेहश्च किल जायते ।\nवामः प्रतिकूलः । मनुष्याणां प्राणिनाम् । अनुक्रोशः कृपा । परिभवादिप्रदानेन मनुष्याणां प्रतिकूलः कामः यस्मिन् जने निबद्ध्यते तस्मिंस्त्वनुक्रोशः स्नेहश्च जायते किल", "siromani": "तन्निवारकत्वे हेतुमाह वाम इति । यस्मिन् जने वामः सुन्दरः उत्कट इत्यर्थः, काम इच्छा निबध्यते चिरं तिष्ठति तस्मिन् जने अनुक्रोशः दया स्नेहश्च जायते । एतेनाक्रोशस्नेहयोः क्रोधविध्वंसकत्वं सूचितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "…желание страстное (vāmaḥ kāmo) – cлово vāma комментарий «Тилака» толкует как krūra «сильный, жестокий, безжалостный». Комментарий «Таттвадипика» предлагает интерпретацию pratikūla (неправильный, извращенный).[Е. Костина] «Ибо страстное желание Связывает, как путами,В душах оно рождаетЛюбовь и сострадание.» В Тилаке как раз приведена цитата из Амаракоши, по которой \"सव्ये क्रौर्ये सुन्दरे च वामः\" इति कोशः Широмани выбирает उत्कट как सुन्दर По Широмани nibadhyate - चिरं तिष्ठति. То есть у того, в ком приживается сильная любовь, рождаются сострадание и любовь. Интересно, что Г-пресс трактует иначе: Кама - странная штука. По отношению к тому, к кому она проявляется, возникает также сострадание и снеха"}]}, {"verse_id": "5.22.5", "verse": "5", "sanskrit_iast": "etasmāt kāraṇān na tvāṃ ghātayāmi varānane । vadhārhām avamānārhāṃ mithyā pravrajane ratām ॥5॥", "leonov_ru": "По этой причине не обрекаю я тебя на смерть (не приказываю убить), о прекрасноликая, Ту, которая заслуживает быть убитой, заслуживает пренебрежения, которая находит радость в ложной (неподобающей) аскезе.", "commentary": {"bhusana": "एतस्मात्कारणान्न त्वां घातयामि वरानने ।\n\nवधार्हामवमानार्हां मिथ्या प्रव्रजिते रताम्", "siromani": "एतस्मादिति । एतस्मादुक्तात् कारणात् मिथ्यापव्रजने कापट्यविशिष्टवनगमनवति रामे रताम् अत एव वधार्हाम् अत एव अवमानार्हां त्वां न घातयामि"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Заслужила ты, лжеподвижница (mithyā pravrajane ratām) – букв. «[не убью я тебя] преданную напрасному (ложному) поддвижничеству». В комментарии «Таттвадипика» дается вариант pravrajite вместо pravrajane. Согласно этому комментарию, речь идет о Раме, то есть «тебя, любящую лжеподвижника». Голдмены переводят как «remain devoted to that false ascetic» (см.: Goldman 1984: 171)."}]}, {"verse_id": "5.22.7", "verse": "7", "sanskrit_iast": "evam uktvā tu vaidehīṃ rāvaṇo rākṣasādhipaḥ । krodhasaṃrambhasaṃyuktaḥ sītām uttaram abravīt ॥7॥", "leonov_ru": "Так сказав Вайдехи Равана, владыка ракшасов, В котором начинал закипать гнев, сказал ей дальше.", "commentary": {"tilaka": "एवं च त्वद्विषये न्यायप्राप्तमुत्पन्नं क्रोधं क्रोधकार्यं वधं त्वद्विषये समुत्थितः कामो नियच्छति निरुणद्धि । तत्र दृष्टान्तः-- द्रवत इति । अमार्गमासाद्य द्रवतो धावतो हयान्सुसारथिरिव", "bhusana": "एवमुक्त्वा तु वैदेहीं रावणो राक्षसाधिपः ।\n\nक्रोधसंरम्भसंयुक्तः सीतामुत्तरमब्रवीत्\nक्रोधसंरम्भसंयुक्तः क्रोधप्रणयाभ्यां संयुक्तः", "siromani": "एवमिति । रावणः एवमुक्त्वा सीताम् उत्तरमब्रवीत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Чувствуя гнев закипающий (krodhasaṃrambhasaṃyuktaḥ) – согласно комментарию «Бхушана» этот композит означает krodhapraṇayābhyāṃ saṃyukta, то есть «охваченный гневом и любовью»."}]}, {"verse_id": "5.22.8", "verse": "8", "sanskrit_iast": "dvau māsau rakṣitavyau me yo 'vadhis te mayā kṛtaḥ । tataḥ śayanam āroha mama tvaṃ varavarṇini ॥8॥", "leonov_ru": "Два месяца долженствуют быть хранимыми мной, когда твоя нетронутость мной сделана, Затем на мое ложе взойди ты, о прекрасная.", "commentary": {"bhusana": "द्वौ मासौ रक्षितव्यौ मे यो ऽवधिस्ते मया कृतः ।\n\nततः शयनमारोह त्वं वरवर्णिनि\nद्वौ मासाविति । ते मया यो ऽवधिः कृतः \"मासान् द्वादश भामिनि\" इत्यारण्यकाण्डोक्तो द्वादशमासात्मको ऽवधिः कल्पितः । अत्र द्वौ मासाववशिष्टौ । तौ द्वौ मासौ मे मया रक्षितव्यौ प्रतीक्षणीयौ । ततः तस्मात्कारणात् । मम शयानमारोहेत्यन्वयः", "siromani": "तदुत्तराकारमाह द्वावित्यादिभिः । यो ऽवधिः मया कृतः \"मासान् द्वादश भामिनी\" इत्यनेन अरण्यकाण्डे निश्चितः तन्मध्ये अविशिष्टाविति शेषः । द्वौ मासौ रक्षितव्यौ ततो ऽनन्तरं मम शयनं महास्वापं मरणमित्यर्थः । आरोह जानीहीत्यर्थः । एतेन रामस्मृतिं त्यक्त्वा स्वौदासीन्यं न त्यक्ष्यसि तर्हि त्वत्सन्निधावहं स्वप्राणांस्त्यक्ष्यामीति सूचितम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.22.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "avadhi", "note_ru": "Авадхи (avadhi, m.) — «срок, предел, граница»: ava- (вниз, до предела) + √dhā- («класть, устанавливать»). MW: avadhi 'a limit, boundary; fixed period of time'. Правовой и договорный термин: avadhi — установленный срок, по истечении которого условие вступает в силу. Равана устанавливает dvau māsau (два месяца) как avadhi — юридически-оформленное обещание: Сита защищена до истечения срока. За этим стоит деловая / договорная логика, наложенная на ситуацию захвата в плен: Равана представляет ультиматум как юридически корректную сделку.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:avaDi"}, {"id": "phase2:5.22.8:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "śayanam āroha", "note_ru": "«Взойди на моё ложе» (śayanam āroha) Широмани читает не буквально, а как эвфемизм смерти (mahāsvāpaṃ maraṇam): если Сита за оставшиеся два месяца не откажется от памяти о Раме, Равана угрожает не её ложем, а собственной гибелью в её присутствии.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "Меняет адресата угрозы: не принуждение к ложу, а завуалированная угроза самоубийством — подстрочник этого прочтения не даёт.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}}]}, {"verse_id": "5.22.12", "verse": "12", "sanskrit_iast": "tābhir āśvāsitā sītā rāvaṇaṃ rākṣasādhipam । uvācātmahitaṃ vākyaṃ vṛttaśauṭīryagarvitam ॥12॥", "leonov_ru": "Ими ободренная, Сита Раване, владыке ракшасов Сказала полезные для него слова, гордые из-за ее добродетели и гордости (мужества).", "commentary": {"tilaka": "आत्महितं रावणात्मनो हितम् । वृत्तेन सदाचारेण, शौटीर्येण पतिशौर्येण च सञ्जातगर्वम्", "bhusana": "ताभिराश्वासिता सीता रावणं राक्षसाधिपम् ।\n\nउवाचात्महितं वाक्यं वृत्तशौष्डीर्यगर्वितम्\nवृत्तशौण्डीर्यगर्वितं वृत्तं पातिव्रत्यं तस्या शौण्डीर्यं बलं तेन गर्वितमिति क्रियाविशेषणम्", "siromani": "ताभिरिति । ताभिः कन्याभिः आश्वासिता सीता वृत्तशौण्डीर्याभ्यां शोभनाचारपतिशौर्याभ्यां गर्वितम् आत्महितं वाक्यमुवाच\nरावणं वर्णयन्नाह नीलेत्यादिभिः । नीलजीमूतसंकाशः नीलमेघसदृशः सिंहवत् सत्त्वं पराक्रमो गतिर्गमनं च यस्य दीप्तानि जिह्वोग्रलोचनानि यस्य सः"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Гордясь своей добродетелью / И могуществом мужа (uvācātmahitaṃ vākyaṃ vṛttaśauṭīryagarvitam) Букв. «сказала речь, себе полезную и гордую гордостью добродетели». По комментарию «Тилака» ātmahita следует понимать как «полезные для самого Раваны», а śauṭīrya – как «мощь мужа» (patiśaurya), то есть Рамы. Таким образом, композит vṛttaśauṭīryagarvita следует интерпретировать как «гордую добродетелью и могуществом мужа»."}, {"id": "lexical:5.22.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vṛttaśauṭīrya", "note_ru": "Вриттташаутирья (vṛtta-śauṭīrya, n.) — «гордость добродетелью / доблестью»: vṛtta «поведение, добродетель, прожитая жизнь» (p.p.p. от √vṛt-, «вращаться, действовать») + śauṭīrya «гордость, высокомерие в смысле достоинства» (MW: śauṭīrya 'bravery, manliness; pride'). Составное — оксюморон: garvita (гордость) традиционно отрицательное, но vṛtta-гордость = «гордость, вытекающая из добродетели». Подстрочник «гордая из-за ее добродетели» передаёт это, но теряет напряжение между правомерной гордостью и грехом высокомерия. Это ключевое описание речевого акта Ситы: она говорит «полезные слова» (ātmahita), но от позиции силы.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:SAuTIrya", "collision_tier1": true}]}, {"verse_id": "5.22.14", "verse": "14", "sanskrit_iast": "māṃ hi dharmātmanaḥ patnīṃ śacīm iva śacīpateḥ । tvadanyas triṣu lokeṣu prārthayen manasāpi kaḥ ॥14॥", "leonov_ru": "Ибо меня, благочестивого (Рамы) жену, подобно Шачи, супруге Индры, Кроме тебя в трех мирах возжелает хотя бы в душе кто?", "commentary": {"tilaka": "मनसा ऽपि कः प्रार्थयेत् । किं पुनर्वचसेति भावः", "bhusana": "मां हि धर्मात्मनः पत्नीं शचीमिव शचीपतेः ।\n\nत्वदन्यस्त्रिषु लोकेषु प्रार्थयेन्मनसा ऽपि कः", "siromani": "मामिति । शचीपतेः शचीमिव धर्मात्मनः पत्नीं मां त्वदन्यः मनसा ऽपिकः प्रार्थयेत् पतिराहित्येन स्थापयितुमिच्छेत् न को ऽपीत्यर्थः"}, "has_tier1": false, "notes": [{"id": "lexical:5.22.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śacīpati", "note_ru": "Шачипати (śacī-pati, m.) — «повелитель Шачи», эпитет Индры: śacī (имя жены Индры; MW: śacī 'the wife of Indra; might, power') + pati «господин». Важна двойная этимология śacī: либо «сила, мощь» (śak- «мочь»), либо собственное имя. Шача = Индрани — канонический образец верной жены в индийской традиции. Сита уподобляет себя Шаче: обе — законные, нерушимо преданные жёны своих сверхмощных мужей. Имплицитная угроза: тот, кто посягнул на Шачу, поплатился перед Индрой; обидчик Ситы поплатится перед Рамой.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:SacIpati"}]}, {"verse_id": "5.22.15", "verse": "15", "sanskrit_iast": "rākṣasādhama rāmasya bhāryām amitatejasaḥ । uktavān asi yat pāpaṃ kva gatas tasya mokṣyase ॥15॥", "leonov_ru": "О низкий ракшаса, жене Рамы, чья мощь беспредельна, Сказавший грешное, разве ты сможешь его избежать?", "commentary": {"tilaka": "यत्पापं मम शयनमारोहेत्यादिरूपम् । क्व गतो मोक्ष्यसे । तत्साध्यसमूलनाशस्य त्वया परिहारो ऽशक्य इत्यर्थः", "bhusana": "राक्षसाधमरामस्य भार्याममिततेजसः ।\n\nउक्तवानसि यच्छापं क्व गतस्तस्य मोक्ष्यसे\nतस्य मोक्ष्यसे तस्मान्मोक्ष्यसे", "siromani": "राक्षसेति । हे राक्षसाधम रामस्य भार्यां मां यत् पापं पापहेतुभूतं रामविषयकपरुषवचनम् उक्तवानसि तस्य तस्मात् पापात् क्व गतः सन् मोक्षसे"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «kva gatas» Опущено, из-за этого поменялся смысл на прямо противоположный"}]}, {"verse_id": "5.22.20", "verse": "20", "sanskrit_iast": "asaṃdeśāt tu rāmasya tapasaś cānupālanāt । na tvāṃ kurmi daśagrīva bhasma bhasmārha tejasā ॥20॥", "leonov_ru": "Но поскольку нет повеления Рамы, и поскольку я сохраняю свой тапас, Я не обращаю тебя в пепел своей мощью, Дашагрива, хотя ты заслуживаешь быть обращенным в пепел.", "commentary": {"bhusana": "असन्देशात्तु रामस्य तपसश्चानुपालनात् ।\n\nन त्वां कुर्मि दशग्रीव भस्म भस्मार्ह तेजसा\nअसन्देशादिति । रामस्य भर्तुः । असन्देशात् अपकारिषु शपेथा इति सन्देशाभावात् । तपसः पातिव्रत्यरूपस्य । कूर्मिं करोमि । उत्त्वविकरणप्रत्ययलोपावार्षौ । भस्मार्ह भस्मीकरणार्ह । तेजसा पातिव्रत्यप्रभावेन", "siromani": "असंदेशादिति । रामस्य असंदेशात् दाहविषये आज्ञाभावात् तपसः तपश्चर्यायाः अनुपालनाच्च भस्मार्हतेजसा त्वां भस्म न कुर्मि करोमि"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «daśagrīva» Опущено обращение"}, {"id": "tier1:5.22.20:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «bhasmārha tejasā» Опущено, нужен комм."}, {"id": "phase2:5.22.20:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "asaṃdeśāt … tapasaś ca", "note_ru": "По Бхушане и Широмани, Равана сдерживает себя по двум разным причинам: Рама не дал ему приказа мстить обидчикам (asaṃdeśāt), а сама Сита хранит тапас-целомудрие (tapasaḥ anupālanāt) — то есть её собственная аскеза защищает её наравне с отсутствующим повелением мужа.", "type": "Б", "source_commentary": ["bhusana", "siromani"], "why_proposed": "Разводит два основания несожжения (приказ Рамы vs тапас самой Ситы) — подстрочник даёт оба условия слитно, комментарий разделяет их логику.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "collision_tier1": true}, {"id": "crosstext:5.22.20:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "bhasma … tejasā", "note_ru": "Угроза-несовершение Ситы Раване: «не будь повеления Рамы и сохранения мной тапаса, я обратила бы тебя в пепел своей мощью (bhasma … tejasā), Дашагрива» (V.22.20). Здесь действует общеэпическое представление о tapas как накопленной испепеляющей энергии. Ср. Udyoga 5.180.24, где Рама Джамадагнья объясняет Бхишме, по чему он не ударит: «ye te vedāḥ śarīrasthā… tapaśca sumahattaptaṃ na tebhyaḥ praharāmyaham» — «Веды, что в теле твоём, и аскетические заслуги, накопленные суровым покаянием (tapas), — по ним я не ударю». В обоих местах tapas мыслится как реальная боевая сила, которую носитель добровольно сдерживает. Свидетельство: уровень шлоки (мягкое).", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.22.20", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Udyogaparva 5.180.24", "collision_tier1": true}]}, {"verse_id": "5.22.21", "verse": "21", "sanskrit_iast": "nāpahartum ahaṃ śakyā tasya rāmasya dhīmataḥ । vidhis tava vadhārthāya vihito nātra saṃśayaḥ ॥21॥", "leonov_ru": "Невозможно отобрать меня у мудрого Рамы. Судьбою предначертана твоя гибель, здесь нет сомнений.", "commentary": {"tilaka": "अहं तस्य रामस्य भार्या त्वयाप ऽहर्तुं न शक्या, अथाप्ययं विधिरपहरणरूपविधिस्तव वधार्थाय दैवेन विहितो ऽत्र न संशयः", "bhusana": "नापहर्तुमहं शक्या तस्य रामस्य धीमतः ।\n\nविधिस्तव वधार्थाय विहितो नात्र संशयः\nतस्य रामस्य तस्मात् रामात् । विधिः चौर्येणापहरणम् । विहितः, दैवेनेति शेषः", "siromani": "नेति । तस्य रामस्य भार्या ऽहं त्वया ऽपहर्तुं न शक्या तथापि तव वधार्थाय विधिः अपहरणकारणीभूतहेममयकुरङ्गादिविधानं विहितः देवादिभाग्येनेति शेषः"}, "has_tier1": false, "notes": [{"id": "phase2:5.22.21:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vidhis tava vadhārthāya", "note_ru": "«Провидение» (vidhi), обрекающее Равану на гибель, Тилака и Широмани толкуют не абстрактно, а конкретно: это то же самое устройство похищения — золотой олень (hemamayakuraṅga), которым Равана увёл Раму от хижины, — и оно же, по их слову, станет причиной его смерти.", "type": "В", "source_commentary": ["tilaka", "siromani"], "why_proposed": "Отождествляет безличную «судьбу» с конкретным сюжетным устройством (золотой олень) — подстрочник оставляет vidhi абстрактным.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}}]}, {"verse_id": "5.22.22", "verse": "22", "sanskrit_iast": "śūreṇa dhanadabhrātrā balaiḥ samuditena ca । apohya rāmaṃ kasmāccid dāracāuryaṃ tvayā kṛtam ॥22॥", "leonov_ru": "Зачем ты, отважный, брат Куберы, обладающий войском, Уведя Раму [из дому], похитил его жену?", "commentary": {"bhusana": "शूरेण धनदभ्रात्रा बलैः समुदितेन च ।\n\nअपोह्य रामं कस्माद्धि दारचौर्यं त्वया कृतम्\nबलैस्समुदितेन बलेन सर्वश्रेष्ठेनेत्यर्थः । अपोह्य रामं मृगच्छद्मना ऽपवाह्य"}, "has_tier1": false, "notes": [{"id": "phase2:5.22.22:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "śūreṇa dhanadabhrātrā", "note_ru": "По Тилаке, обращение «отважный» (śūra) здесь — не похвала, а издёвка: раз Равана смог похитить Ситу лишь обманом, через иллюзорного оленя Маричи, а не в открытом бою с Рамой, само слово «отважный» звучит у Ситы как сарказм, обличающий его трусость.", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "Вскрывает иронический регистр обращения «отважный» — в нейтральном подстрочнике эпитет читается как прямая характеристика, а не как насмешка.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}}]}, {"verse_id": "5.22.24", "verse": "24", "sanskrit_iast": "nīlajīmūtasaṃkāśo mahābhujaśirodharaḥ । siṃhasattvagatiḥ śrīmān dīptajihvogralocanaḥ ॥24॥", "leonov_ru": "Он, с огромными руками и шеей, был подобен темной туче, Обладающий храбростью и поступью льва, величественный, язык его был подобен пламени, взгляд его был грозен.", "commentary": {"tilaka": "शूरेणेत्याद्युपहासोक्तिः । अपोह्य मारीचमायया ऽपसार्य कस्माद्दारचौर्यं त्वया कृतम्, तस्मादत्यन्तमशूरस्त्वमित्युपहासः । चिदिति पादपूरणे ।। 5.22.22,23 ।।\n\nसिंहसत्त्वगतिः सिंहवत्सत्त्वं पराक्रमो गतिश्च यस्य सः । \"सिंहसंहननः\" इति पाठान्तरम्", "bhusana": "नीलजीमूतसङ्काशो महाभुजशिरोधरः ।\n\nसिंहसत्त्वगतिः श्रीमान् दीप्तजिह्वाग्रलोचनः\nसिंहस्येव बलगमने यस्यासौ सिंहसत्त्वगतिः । जिह्वाग्रं लोचने च दीप्तानि यस्य सो ऽयं दीप्तजिह्वाग्रलोचनः"}, "has_tier1": false, "notes": [{"id": "lexical:5.22.24:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nīlajīmūtasaṃkāśa", "note_ru": "Ниладжимутасанкаша (nīla-jīmūta-saṃkāśa, adj.) — «подобный тёмной (дождевой) туче»: nīla «тёмно-синий, чёрный» + jīmūta «туча» (MW: jīmūta 'a cloud; a kind of large plant') + saṃkāśa «подобный» (от saṃkāś-, «казаться, быть подобным»). Это один из стандартных эпических эпитетов для тёмнокожих героев / демонов. Примечательно: nīla — цвет Кришны и Вишну (nīlavarṇa), но и тьмы. Для Раваны nīlajīmūtasaṃkāśa = демоническое великолепие. В экфрасисе Раваны (22.24–30) читатель видит его через тот же образный словарь что и Вишну/Раму, но с демоническим знаком.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:nIlajImUta"}]}, {"verse_id": "5.22.26", "verse": "26", "sanskrit_iast": "śroṇīsūtreṇa mahatā mecakena susaṃvṛtaḥ । amṛtotpādane naddho bhujaṃgeneva mandaraḥ ॥26॥", "leonov_ru": "Огромная повязка охватывала его бедра, И был он подобен [этим горе] Мандаре, опоясаной змеем [Васуки] во время добычи амриты.", "commentary": {"tilaka": "श्रोणीसूत्रेण कटिसूत्रेण रशनयेत्यर्थः । इन्द्रनीलनद्धमुखारक्तमणियुक्तत्वाच्च तस्य मेचकत्वम् । भुजङ्गो वासुकिः स हि नीलवर्ण इत्याहुः", "bhusana": "श्रोणीसूत्रेण महता मेचकेन सुसंवृतः ।\n\nअमृतोत्पादनद्धेन भुजगेनेव मन्दरः\nमेचकेन नीलेन । अमृतोत्पादनद्धेन अमृतोत्पादनार्थं नद्धेन", "siromani": "मेचकेन नीलमण्यादिना जटिलत्वेन मयूरचन्द्रकवर्णेन श्रोणिसूत्रेण सुसंवृतः \"मेचकस्तु मयूरस्य चन्द्रके श्यामले पुमान्\" इति मेदिनी । तत्र दृष्टान्तः अमृतोत्पादने समुद्रमन्थनसमये भुजङ्गेन नद्धः संबद्धो मन्दर इव"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «amṛtotpādane» Опущено, нужен комм."}, {"id": "phase2:5.22.26:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bhujaṃgeneva mandaraḥ", "note_ru": "Тилака называет змея, которым опоясана гора Мандара, по имени: это Васуки (bhujaṃgo vāsukiḥ), синий по цвету — отсюда и сравнение с тёмной (mecaka) повязкой Раваны; речь идёт о пахтанье океана ради амриты (amṛtotpādana), где Мандара служила мутовкой.", "type": "В", "source_commentary": ["tilaka", "siromani"], "why_proposed": "Именует безличного «змея» как Васуки и разворачивает миф пахтанья океана, стоящий за сравнением.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "collision_tier1": true}]}, {"verse_id": "5.22.27", "verse": "27", "sanskrit_iast": "tābhyāṃ sa paripūrṇābhyāṃ bhujābhyāṃ rākṣaseśvaraḥ । śuśubhe 'calasaṃkāśaḥ śṛṅgābhyāmiva mandaraḥ ॥27॥", "leonov_ru": "С двумя мощными руками владыка ракшасов Гороподобный, был подобен [горе] Мандаре с двумя вершинами.", "commentary": {"bhusana": "ताभ्यां स परिपूर्णाभ्यां भुजाभ्यां राक्षसेश्वरः ।\n\nशुशुभे ऽचलसङ्काशः श्रृङ्गाभ्यामिव मन्दरः", "siromani": "अचलसंकाशो राक्षसेश्वरः परिपूर्णाभ्याम् अतिपुष्टाभ्यां ताभ्यां प्रसिद्धाभ्यां भुजाभ्यां शृङ्गाभ्यां मन्दर इव शुशुभे । रावणस्य कामरूपत्वात् भुजद्वयमात्रवत्वमपि न विरुध्यते । श्लोकचतुष्टमेकान्वयि"}, "has_tier1": false, "notes": [{"id": "phase2:5.22.27:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tābhyāṃ … bhujābhyāṃ", "note_ru": "Широмани поясняет, почему Равана здесь описан лишь с двумя руками, хотя обычно изображается многоруким: он обладает kāmarūpa — способностью произвольно менять облик, — так что двурукость в этой сцене не противоречит его привычной иконографии.", "type": "В", "source_commentary": ["siromani"], "why_proposed": "Снимает возможное недоумение читателя (почему только две руки) через доктрину kāmarūpa — подстрочник не поясняет расхождение с привычным образом Раваны.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}}]}, {"verse_id": "5.22.29", "verse": "29", "sanskrit_iast": "sa kalpavṛkṣapratimo vasanta iva mūrtimān । śmaśānacaityapratimo bhūṣito 'api bhayamkaraḥ ॥29॥", "leonov_ru": "Даже подобный дереву кальпаврикша или воплощенной весне, Словно погребальная ступа на кладбище (шмашане), даже украшенный, внушал он страх.", "commentary": {"bhusana": "स कल्पवृक्षप्रतिमो वसन्त इव मूर्तिमान् ।\n\nश्मशानचैत्यप्रितिमो भूषितो ऽपि भयङ्करः"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.29:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Но подобный древу желаний» Не во всех изданиях есть этот стих. Комм?[Е. Костина] «Или весне воплощенной,Ужас он вызывал,Словно ступа на кладбище» В Г-пресс есть объяснение, почему такое сравнение. Думаю, нужен комментарий, потому что так непонятно.[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}, {"id": "lexical:5.22.29:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kalpavṛkṣa", "note_ru": "Кальпаврикша (kalpa-vṛkṣa, m.) — «дерево желаний»: kalpa «всё возможное, упорядоченное» (MW: kalpa 'practicable, feasible; the period of time between the creation and destruction of the world') + vṛkṣa «дерево». MW: kalpavṛkṣa 'the tree of paradise, the wish-granting tree'. Одно из пяти небесных деревьев (pañca-devavṛkṣa): любое желание, высказанное под ним или у него, исполняется. Равана сравнивается с kalpavṛkṣa: то есть он предлагает себя как исполнителя желаний — семантика слова подтверждает его риторику в главе 20 («желай чего хочешь, дам»). Но тут же — śmaśānacaitya: погребальная ступа на кладбище. Антитеза двух сравнений в одном стихе — показатель демонической амбивалентности.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:kalpavfkza", "collision_tier1": true}, {"id": "edition:5.22.29:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.22.29 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.22.29", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.22.29", "iast": "sa kalpavṛkṣapratimo vasanta iva mūrtimān । śmaśānacaityapratimo bhūṣito 'api bhayamkaraḥ ॥29॥"}], "collision_tier1": true}]}, {"verse_id": "5.22.31", "verse": "31", "sanskrit_iast": "anayenābhisaṃpannam arthahīnam anuvrate । nāśayāmy aham adya tvāṃ sūryaḥ saṃdhyām ivaujasā ॥31॥", "leonov_ru": "О ты, которая верна тому, кто поступает недолжным образом, от которого нет никакого толку (или у которого нет никаких богатств – arthahīna), Уничтожу я тебя сейчас как солнце тьму (своим) светом.", "commentary": {"bhusana": "अनयेनाभिसंपन्नमर्थहीनमनुव्रते ।\n\nनाशयाम्यहमद्य त्वां सूर्यः सन्ध्यामिवौजसा", "siromani": "तद्वचनाकारमाह अनयेनेति । अनयेन नीतिराहित्येन अभिसंपन्नम् अत एव अर्थहीनं रामम् अनुव्रते तत्परिशीलनशीले संध्यां तिमिरं सूर्य इव त्वां नाशयामि"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.31:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Сохраняешь ты верность /Порочному и никчемному (anayenābhisaṃpannam arthahīnam anuvrate) – комментарий «Тилака» толкует слово anaya как anīti «недолжное поведение, порочность, безнравственность». Голдмены понимают anaya как «несчастье» и переводят anayenābhisaṃpannam как miserable (см.: Goldman 1984: 173)."}, {"id": "lexical:5.22.31:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "anaya", "note_ru": "Аная (anaya, m.) — «беззаконие, неправедный путь»: an- (отрицание) + naya «путь, разум, политика, ведение» (√nī-, «вести»). MW: anaya 'bad conduct; ill-luck, misfortune'. Специфически: naya в нити-шастрах = политическое искусство управления (в т.ч. «четыре упайя»). Anaya = следование антинити. Равана характеризует Раму именно как anaya-sampanna — «наделённого беззаконием», т.е. политически несостоятельного. В этой атаке на Раму через понятие нити читается ключевое мировоззренческое расхождение: Равана мыслит в категориях артха-шастры, Рама — в категориях дхармы.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:anaya", "collision_tier1": true}]}, {"verse_id": "5.22.33", "verse": "33", "sanskrit_iast": "ekākṣīm ekakarṇāṃ ca karṇaprāvaraṇāṃ tathā । gokarṇīṃ hastikarṇīṃ ca lambakarṇīm akarṇikām ॥33॥", "leonov_ru": "Одноглазым, одноухим, покрытым ушами, С ушами как у коров, с ушами как у слонов, с обвислыми ушами, безухим.", "commentary": {"bhusana": "एकाक्षीमेककर्णां च कर्णप्रावराणां तथा ।\n\nगोकर्णीं हस्तिकर्णीं च लम्बकर्णीमकर्णिकाम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.22.33:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "karṇaprāvaraṇā", "note_ru": "Карнаправарана (karṇa-prāvaraṇā, f.) — «покрытая ушами»: karṇa «ухо» + prāvaraṇā «покрывало, оболочка» (pra+√vṛ-, «покрывать»). MW: prāvaraṇa 'a cover, cloak'. Один из перечисляемых уродливых типов ракшаси: «покрытая ушами» — те, у кого уши столь велики, что служат плащом. Каталог уродств ракшаси (22.33–36) построен на системе нарушений анатомической нормы: количественные (одно ухо/один глаз/одна нога), пропорциональные (огромные / крошечные части тела) и функциональные (уши вместо одежды). Это жанр тератологического описания — литература уродств, параллельная индийской демонологии.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:prAvaraRa"}]}, {"verse_id": "5.22.38", "verse": "38", "sanskrit_iast": "āvarjayata vaidehīṃ daṇḍasyodyamanena ca । iti pratisamādiśya rākṣasendraḥ punaḥ punaḥ ॥38॥", "leonov_ru": "Склоните Вайдехи хотя бы и с поднятыми палками – Так приказывал владыка ракшастов снова и снова.", "commentary": {"tilaka": "आवर्जयतानुकूल्यं संपादयत", "bhusana": "इति प्रतिसमादिश्य राक्षसेन्द्रः पुनः पुनः ।।\n\nकाममन्युपरीतात्मा जारकीं पर्यतर्जयत्", "siromani": "इतीति । काममन्युना इच्छासंपादकक्रोधेन परीतः आत्मा मनो यस्य स रावणः इति प्रतिसमादिश्य जानकीं प्रति गर्जत अगर्जत"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.38:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Силою или лаской, /Мягкостью и дарами / Или же наказанием (pratilomānulomaiś s с Мандодари.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "collision_tier1": true}]}, {"verse_id": "5.22.41", "verse": "41", "sanskrit_iast": "vivarṇayā kṛpaṇayā mānuṣyā rākṣaseśvara । nūnamasyāṃ mahārāja na devā bhogasattamān ॥41॥", "leonov_ru": "Бледная и жалкая человечица, о владыка ракшасов? О махараджа, несомненно, ей боги сокровища не", "commentary": {"tilaka": "देवगन्धर्वकन्याः । सीतावदेव बलादाहृता इत्यर्थः", "bhusana": "नूनमस्या महाराज न दिव्यान् भोगसत्तमान् ।\n\nविदधात्यमरश्रेष्ठस्तव बाहुबलार्जितान्", "siromani": "नूनमिति । हे महाराज तव बाहुबलार्जितान्भोगसत्तमान् दिव्यभोगान् अस्यां सीतायां सीतार्थम् अमरश्रेष्ठाः देवा ब्रह्माणः न विदधति अस्या राज्यभोगो ब्रह्मणा न लिखित इत्यर्थः । आदराद्बहुवचनम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.22.41:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «rākṣaseśvara» Опущено обращение"}, {"id": "edition:5.22.41:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.22.41 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.22.41", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.22.41", "iast": "vivarṇayā kṛpaṇayā mānuṣyā rākṣaseśvara । nūnamasyāṃ mahārāja na devā bhogasattamān ॥41॥"}], "collision_tier1": true}]}, {"verse_id": "5.22.43", "verse": "43", "sanskrit_iast": "icchantīṃ kāmayānasya prītir bhavati śobhanā । evamuktas tu rākṣasyā samutkṣiptas tato balī । prahasan meghasamkāśo rākṣasaḥ sa nyavartata ॥43॥", "leonov_ru": "Тот, кто испытывает желание к той, которая желает (его), тот испытывает великое наслаждение». Когда ракшаси так ему сказала, отвернулся тогда могучий, Смеясь, подобный туче ракшас тот пошел обратно,", "commentary": {"bhusana": "एवमुक्तस्तु राक्षस्या समुत्क्षिप्तस्ततो बली ।\n\nप्रहसन् मेघसङ्काशो रा const KEY = "sundara_apparatus_s22_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

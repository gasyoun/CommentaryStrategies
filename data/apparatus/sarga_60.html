const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 60, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 20, "verses_with_notes": 12, "notes_by_layer": {"tier1": 4, "lexical": 5, "phase2": 4, "edition": 3, "crosstext": 1}}, "sarga": 60, "verses": [{"verse_id": "5.60.2", "verse": "2", "sanskrit_iast": "pitāmahavarotsekāt paramaṃ darpam āsthitau । aśvinor mānanārthaṃ hi sarvalokapitāmahaḥ ॥2॥", "leonov_ru": "Поскольку Праотец Брахма одарил их обильными дарами, есть у них высшая гордость. Ибо Праотец всех миров, чтобы выказать уважение к Ашвинам,", "commentary": {"siromani": "सकारणं वरस्वरूपमाह-- अश्विनोरिति । माननार्थं सर्वलोकपितामहः अनयोरश्विपुत्रयोः सर्वावध्यत्वं सर्वकर्तृकवध्यत्वाभावं दत्तवान्"}, "has_tier1": false, "notes": [{"id": "lexical:5.60.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pitāmaha", "note_ru": "Питамаха (pitāmaha, m.) — «дед, прадед», буквально «[великий] отец отца»: pitā «отец» (от √pā-/√pitṛ-, и.-е. *ph₂tḗr) + maha «великий» (√mah-). MW: pitāmaha 'a paternal grandfather; Brahmā (as progenitor of the world)'. В стихе «sarvalokapitāmahaḥ» — «Праотец всех миров» = Брахма. Pitāmaha в эпосе — регулярный эпитет Брахмы, подчёркивающий его статус генеалогического истока бытия (ср. prajāpati). Важно: дар Брахмы (varo) Майнде и Двивиде назван varotseka — «избыток дара», «переполненность благодеянием»; именно эта «переполненность» (utseka) порождает hubris (darpa).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:pitAmaha"}, {"id": "crosstext:5.60.2:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "sarva-loka-pitāmaha", "note_ru": "sarvalokapitāmahaḥ («Праотец всех миров», Брахма) — в рассказе о происхождении неуязвимости рода обезьян, восходящей к дарам Брахмы. Эпитет sarvalokapitāmaha закреплён в Махабхарате за Брахмой-демиургом, в т.ч. в космогонических сценах потопа и в эпизоде с сыновьями Сагары: «tān uvāca … sarvalokapitāmahaḥ» (MBh III.105.6) — «Сказал им Праотец всего человечества…». Совпадение титула помещает вальмикиевскую родословную обезьян в общеэпическую теологию Брахмы-Питамахи.", "type": "А", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.60.2", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparvan III.105.6"}]}, {"verse_id": "5.60.4", "verse": "4", "sanskrit_iast": "surāṇām amṛtaṃ vīrau pītavantau mahābalau । etāv eva hi saṃkruddhau savājirathakuñjarām ॥4॥", "leonov_ru": "Выпили эти два отважных и могучих героя напиток бессмертия (амриту) богов. Оба они, вошедшие в гнев, Ланку с конями, колесницами и слонами", "commentary": {"bhusana": "न हि नः प्लवने कश्चिन्नापि कश्चित्पराक्रमे ।\n\nतुल्यः सामरदैत्येषु लोकेषु हरिसत्तमाः"}, "has_tier1": false, "notes": [{"id": "lexical:5.60.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "amṛtapāna", "note_ru": "Амрита (amṛta, n.) — «бессмертный напиток»: a- (отрицание) + mṛta (p.p.p. от √mṛ-, «умирать», Whitney #754). MW: amṛta 'immortal; the nectar of immortality'. Пи́тие амриты богами — акт, делающий богов бессмертными и охраняющий их от demon-death (ср. пахтание океана, MBh). В стихе Майнда и Двивида surāṇām amṛtaṃ pītavantau — «выпили амриту богов». Это нарушение: амрита — исключительная собственность богов, её похищение или несанкционированное питие — тягчайший грех и одновременно источник сверхъестественной мощи. Майнда и Двивида неуязвимы именно через этот трансгрессивный акт.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:amfta+warnemyr(mf)"}]}, {"verse_id": "5.60.7", "verse": 7, "sanskrit_iast": "", "leonov_ru": "", "commentary": {}, "has_tier1": true, "notes": [{"id": "tier1:5.60.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Строки cd строфы 5, строфа 6 и строки ab строфы 7 повторяют строфы 7 и 8 59 песни, где их произносит Хануман."}], "verse_not_segmented": true}, {"verse_id": "5.60.8", "verse": "8", "sanskrit_iast": "dṛṣṭā devī na cānītā iti tatra nivedanam । na yuktam iva paśyāmi bhavadbhiḥ khyātavikramaiḥ ॥8॥", "leonov_ru": "Если поведаем мы там (у Рамы): «Нашли мы царевну, но не привели ее», Думаю, недостойно будет это вас, чья доблесть прославлена.", "commentary": {"tilaka": "दृष्ट्वा देवी नानीता इति तत्र रामसमीपे निवेदितुं न युक्तमिव पश्यामि", "siromani": "दृष्टेति । देवी सीता दृष्टा आनीता तु न इति तत्र रामस्य समीपे भवद्भिर्निवेदितुं न युक्तमिव पश्यामि", "bhusana": "अयुक्तं तु विना देवीं दृष्टवद्भिश्च वानराः ।\n\nसमीपं गन्तुमस्माभी राघवस्य महात्मनः\nदृष्टा देवी न चानीता इति तत्र निवेदनम् ।\n\nअयुक्तमिव पश्यामि भवद्भिः ख्यातविक्रमैः"}, "has_tier1": false, "notes": [{"id": "lexical:5.60.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "devī", "note_ru": "Деви (devī, f.) — «богиня; царица, госпожа», f. от deva (от √div-, «сиять»). MW: devī 'a goddess; a queen'. В докладе Ангады «dṛṣṭā devī na cānītā» — «нашли мы deвī, но не привели». Devī применительно к Сите — почётный титул (= rājapatnī, «жена царевича»), но слово одновременно несёт коннотацию сакрального: devī = земная богиня. Ангада использует этот статусный термин, обращаясь к Раме — подчёркивая, что Сита не просто пропавшая женщина, а сакральная персона, неперевозимая без участия её мужа.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:devI"}]}, {"verse_id": "5.60.9", "verse": "9", "sanskrit_iast": "na hi vaḥ plavane kaś cin nāpi kaś cit parākrame । tulyaḥ sāmaradaityeṣu lokeṣu harisattamāḥ ॥9॥", "leonov_ru": "Ибо ни в прыжках, ни в силе (отваге), о лучшие из обезьян, Нет вам равных во всех мирах с бессмертными (богами) и дайтьями.", "commentary": {"tilaka": "तुल्यः अस्तीति शेषः ।। 5.60.9,10 ।।\n\nअन्यत्कर्तव्यं किमस्ति काकुरत्र अपि तु जानकीग्रहणपूर्वकगमनादन्यन्न किमपीत्यर्थः", "siromani": "नेति । हे हरिसत्तमाः वो युष्माकं प्लवनादौ तुल्यः सामरदैत्येषु कश्चिन्न"}, "has_tier1": true, "notes": [{"id": "tier1:5.60.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «harisattamāḥ» опущено обращение"}]}, {"verse_id": "5.60.10", "verse": "10", "sanskrit_iast": "jitvā laṅkāṃ sarakṣaudghāṃ hatvā taṃ rāvaṇaṃ raṇe । sītam adāya gacchāmaḥ siddhārthā hṛṣṭamanasāḥ ॥10॥", "leonov_ru": "Покорив Ланку с толпами ракшасов, убив в бою Равану, Взяв Ситу, отправимся мы [обратно], достигшие успеха, радостные душой.", "commentary": {"siromani": "जित्वेति । सरक्षौघां राक्षससमूहवतीं लङ्कां जित्वा सीतामादाय वयं गच्छामः अत एव निर्देशात्संहितादन्तता वा कल्प्या"}, "has_tier1": false, "notes": [{"id": "edition:5.60.10:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.60.10 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.60.10", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.60.10", "iast": "jitvā laṅkāṃ sarakṣaudghāṃ hatvā taṃ rāvaṇaṃ raṇe । sītam adāya gacchāmaḥ siddhārthā hṛṣṭamanasāḥ ॥10॥"}]}]}, {"verse_id": "5.60.12", "verse": "12", "sanskrit_iast": "rāmalakṣmaṇayor madhye nyasyāma janakātmajām । kiṃ vyalīkais tu tān sarvān vānarān vānaraṛsabhān ॥12॥", "leonov_ru": "Между Рамой и Лакшманой поместим мы дочь Джанаки. К чему [излишние] неприятности всем этим обезьянам, быкам среди обезьян?", "commentary": {"siromani": "रामेति । जनकात्मजां रामलक्ष्मणयोर्मध्ये न्यस्याम संस्थापयाम वानरर्षभान् सर्वान् वानरान् प्रति व्यलीकैः अप्रियैः रामादिकर्तृकौदासीन्यवचनैः किं न किमपीत्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.60.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «И не ляжет позорНа быков меж обезьянами.» Нужен комм, потому что разные толкования: Г-пр - к чему беспокоить всех тех быков среди обезьян (которые остались в Кишкиндхе) У Голдмэнов в комм (с. 526) примерно так же. При этом Широмани - सर्वान् वानरान् प्रति व्यलीकैः अप्रियैः रामादिकर्तृकौदासीन्यवचनैः किं न किमपीत्यर्थः"}, {"id": "edition:5.60.12:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.60.12–13 (2 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.60.12–13", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.60.12", "iast": "rāmalakṣmaṇayor madhye nyasyāma janakātmajām । kiṃ vyalīkais tu tān sarvān vānarān vānaraṛsabhān ॥12॥"}, {"verse_id": "5.60.13", "iast": "vayam eva hi gatvā tān hatvā rakṣasapuṃgavān । raghavaṃ draṣṭum arhāmaḥ sugrīvaṃ sahalakṣmaṇam ॥13॥"}], "collision_tier1": true}]}, {"verse_id": "5.60.14", "verse": "14", "sanskrit_iast": "tam evaṃ kṛtasaṃkalpaṃ jāmbavān harisattamaḥ । uvāca paramaprīto vākyam arthavad arthavit ॥14॥", "leonov_ru": "Ему, принявшему такое решение, Джамбаван, лучший из обезьян, Знающий, как надлежит действовать, и в высшей степени довольный, сказал слова, исполненные значения:", "commentary": {"tilaka": "प्रथमं जय एव दुर्लभः, कथञ्चिज्जये ऽपि यदि न रोचयेत्तदा कार्यनाश इति भावः\nअथ जाम्बवानङ्गदक्रोधपरिहाराय तन्मतं बहुमान्य सुहृद्भावेन निवर्तयति-- न तावदिति । हे राजपुत्र यथा भवान्पश्यति विचारयति एषा मतिर्नो ऽस्माकमक्षमा न, किंतु युक्तैव । यथा रामस्य मतिर्निविष्टा ऽवस्थिता तथा कार्यसिद्धिं भवान्पश्यत्वित्यर्थः", "siromani": "तमिति । एवमुक्तप्रकारेण कृतसंकल्पमङ्गदं जाम्बवान् अर्थवद्वाक्यमुवाच"}, "has_tier1": false, "notes": [{"id": "phase2:5.60.14:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "paramaprīto vākyam arthavat", "note_ru": "Тилака поясняет стратегию ответа Джамбавана: чтобы не задеть гнев Ангады, он сначала признаёт его план в принципе верным и говорит из дружеского расположения, а не с позиции власти, лишь затем переводя разговор на решение, уже принятое Рамой.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "подстрочник передаёт только то, что Джамбаван «сказал слова, исполненные значения»; Тилака раскрывает риторическую тактику несогласия — сперва одобрение, затем мягкий поворот к воле Рамы, — не считываемую из перевода", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.60.15", "verse": "15", "sanskrit_iast": "naiṣā buddhir mahābuddhe yad bravīṣi mahākape । vicetuṃ vayam ājñaptā dakṣiṇāṃ diśām uttamām ॥15॥", "leonov_ru": "«О многомудрая обезьяна! То, что ты говоришь, не есть [верная] мысль. Было приказано нам достигнуть самого южного края,", "commentary": {"tilaka": "नैषा बुद्धिः युक्तेति शेषः । तत्र हेतुमाह-- विचेतुमिति"}, "has_tier1": false, "notes": [{"id": "lexical:5.60.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dik (dakṣiṇā diś)", "note_ru": "Дакшина диш (dakṣiṇā diś, f.) — «южная сторона; [страна] умерших». Dakṣiṇā — «правая» (когда стоишь лицом к восходу), отсюда «южная» (MW: dakṣiṇa 'south; right side'). В мифологии Яма — владыка мёртвых — управляет югом; dakṣiṇā diś = «страна мёртвых» в погребальных ритуалах. Задание обезьяньему войску — «достичь самого южного края» dakṣiṇāṃ diśam uttamām. «Uttama» («наивысший, предельный») + «дальний юг» создаёт формулу: разведчикам приказано дойти до края мира смерти и вернуться — что само по себе маркирует миссию как героическую.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:dakziRA+dic_apte:dakziRA"}, {"id": "edition:5.60.15:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.60.15–19 (5 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.60.15–19", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.60.15", "iast": "naiṣā buddhir mahābuddhe yad bravīṣi mahākape । vicetuṃ vayam ājñaptā dakṣiṇāṃ diśām uttamām ॥15॥"}, {"verse_id": "5.60.16", "iast": "nānetuṃ kapirājena naiva rāmeṇa dhīmatā । kathaṃcin nirjitāṃ sītām asmābhir nābhirocayet ॥16॥"}, {"verse_id": "5.60.17", "iast": "rāghavo nṛpaśardūlaḥ kūlaṃ vyapadiśan svakam । pratijñāya svayaṃ rājā sītāvijayamagrataḥ ॥17॥"}, {"verse_id": "5.60.18", "iast": "sarveṣu kapimukyānāṃ kathaṃ mithyā kariṣyati । viphalaṃ karma ca kṛtaṃ bhavet tuṣṭir na tasya ca ॥18॥"}, {"verse_id": "5.60.19", "iast": "vṛthā ca darśitaṃ vīryaṃ bhaved vānarapuṃgavāḥ । tasmād gacchāma vai sarve yatra rāmaḥ salakṣmaṇaḥ । sugrīvaś ca mahatejāḥ kāryasyāsya nivedane ॥19॥"}]}]}, {"verse_id": "5.60.16", "verse": "16", "sanskrit_iast": "nānetuṃ kapirājena naiva rāmeṇa dhīmatā । kathaṃcin nirjitāṃ sītām asmābhir nābhirocayet ॥16॥", "leonov_ru": "а не привести [Ситу] – ни царем обезьян, ни мудрым Рамой [не было это приказано]. Если мы каким-либо образом освободим (добудем) Ситу, не будет доволен", "commentary": {"siromani": "ननु सीतानयनाज्ञाया अभावे ऽपि तदनुकूलाचरणात् तत्प्रीतिरेव भविष्यतीत्यत आह-- कथंचित् अस्माभिर्निर्जितां रावणनिर्जयेनानीतां सीतां स्वकं कुलं स्ववीर्यगुप्तत्वरूपकुलधर्मं व्यपदिशन् कथयन् सन् राघवः कथंचिन्नाभिरोचयन्"}, "has_tier1": true, "notes": [{"id": "tier1:5.60.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «dhīmatā» опущено"}, {"id": "phase2:5.60.16:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "nābhirocayet", "note_ru": "Широмани поясняет логику отказа: хотя прямого запрета приводить Ситу не было, поведение, лишь СООТВЕТСТВУЮЩЕЕ духу приказа (искать, а не приводить), не принесёт Раме удовлетворения — важно точное исполнение буквы задания, а не одного его смысла.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "подстрочник сообщает лишь итог («не будет доволен»), не объясняя, почему даже добросовестное превышение задания в благую сторону не удовлетворит Раму; Широмани формулирует принцип буквального, а не смыслового исполнения приказа", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.60.17", "verse": "17", "sanskrit_iast": "rāghavo nṛpaśardūlaḥ kūlaṃ vyapadiśan svakam । pratijñāya svayaṃ rājā sītāvijayamagrataḥ ॥17॥", "leonov_ru": "Рагхава, тигр среди царей, указывающий на свой род (гордящийся своим родом). Царь, пообещав сам освободить Ситу перед", "commentary": {"siromani": "प्रतिज्ञायेति । कपिमुख्यानामग्रतः स्वकं स्वसंपाद्यं सीताविजयं सीताहेतुकस्वकर्तृकरावणपराभवपूर्वकस्वोत्कर्षप्राप्तिं प्रतिज्ञाय मिथ्या कथं करिष्यति न करिष्यतीत्यर्थः, अतः तस्य रामस्य तुष्टिर्न भवेत् अस्मत्कर्तृकसीतानयनेनेति शेषः, अतः कृतमपि कर्म विफलं भवेत् । सार्धश्लोक एकान्वयी ।। 5.60.17,18 ।।\n\nवृथेति । हे वानरपुङ्गवाः दर्शितं रावणविषये प्रकटितमपि वीर्यं वृथा आज्ञामन्तरा निरर्थकं भवेत् तस्मात् अस्य कृतस्य कार्यस्य सीतादर्शनस्य निवेदने बोधनार्थं यत्र रामः तत्र वयं सर्वे गच्छामः । सार्धश्लोक एकान्वयी"}, "has_tier1": false, "notes": [{"id": "lexical:5.60.17:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pratijñā", "note_ru": "Пратиджня (pratijñā, f.) — «публично данное обещание, клятва»: prati («против, перед») + √jñā- («знать, признавать»; Whitney #670). MW: pratijñā 'promise, vow, assertion'. В стихе: rāghavo «pratijñāya svayaṃ rājā sītāvijayam agrahaḥ» — «сам дав обещание всем вождям [вернуть] победу Ситы». Pratijñā в дхармашастрах — юридически обязывающий акт: публичная клятва, данная перед svayambhu (самосущими свидетелями), не может быть нарушена без немедленной дхармической расплаты. Поэтому освобождение Ситы обезьянами без Рамы было бы нарушением его pratijñā — Джамбаван воспроизводит именно эту правовую логику.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:pratijYA+warnemyr(jYA)"}, {"id": "phase2:5.60.17:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "pratijñāya svayaṃ rājā", "note_ru": "Широмани поясняет, в чём подлинная ставка отказа: Рама всенародно, перед вождями обезьян, поклялся сам победить Равану и вернуть Ситу; если обезьяны исполнят это без него, его собственная клятва останется как бы невыполненной, а не просто опережённой — отсюда его недовольство не будет капризом, а связано с честью данного слова.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "подстрочник передаёт лишь факт обещания Рамы описательно; Широмани объясняет, почему самостоятельный успех обезьян обесценил бы именно это публичное обещание — глубинную причину, по которой Рама останется недоволен", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.60.20", "verse": "20", "sanskrit_iast": "na tāvad eṣā matir akṣamā no । yathā bhavān paśyati rājaputra । yathā tu rāmasya matir niviṣṭā । tathā bhavān paśyatu kāryasiddhim ॥20॥", "leonov_ru": "Эта [твоя] мысль (план) не невыполнима для нас, Как ты видишь, о царевич. Но пусть ты посмотришь на исполнение этого дела так, Чтобы оно соответствовало мысли Рамы».", "commentary": {"siromani": "स्वोक्ते अङ्गदसंमतिसंपादनार्थमाह-- नेति । हे राजपुत्र यतो भवान् यथा यथावत् पश्यति विचारयति अतः एषा मतिर्भवन्निश्चयो नो ऽस्माकमक्षमा अयुक्ता न । तथापि यथा येन प्रकारेण रामस्य मतिर्निश्चयः निविष्टा प्राप्ता तथा तेनैव प्रकारेण कार्यसिद्धिं भवान् पश्यतु विचारयतु", "bhusana": "न तावदेषा मतिरक्षमा नो यथा भवान् पश्यति राजपुत्र ।\n\nयथा तु रामस्य मतिर्निविष्टा तथा भवान् पश्यतु कार्यसिद्धम्\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे षष्टितमः सर्गः ।। 5.60 ।।\n\nअथ जाम्बवानङ्गदवाक्यं बहुमन्यमानस्सुहृद्भावेन प्रतिषेधति न तावदिति । अक्षमा अयुक्ता न किन्तु युक्तैवेत्यर्थः । यद्यपि सम्यगुक्तं समर्थैश्चापि रामाज्ञानुसारेण कर्तव्यम् न स्वातन्त्र्येणेत्यर्थः । अस्मिन् सर्गे सार्धषट्श्लोकाः"}, "has_tier1": false, "notes": [{"id": "phase2:5.60.20:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kāryasiddhim", "note_ru": "Бхушана формулирует итоговый нравственный вывод всего эпизода: даже вполне способный исполнитель — а план Ангады признан в принципе верным — обязан действовать согласно воле повелителя, а не собственной волей (сватантрья); это episode-closing doctrinal statement, выходящее за рамки простого пересказа спора.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "подстрочник передаёт лишь заключительную реплику Джамбавана буквально; Бхушана добавляет доктринальную формулировку общего принципа (способность не отменяет подчинения воле господина), закрывающую тему всего эпизода", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s60_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

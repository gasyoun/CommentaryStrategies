 «сопровождаемый жестами, выразительный»: sa- (предлог сопровождения) + ākāra «форма, облик, жест» (√kṛ-, «делать»). MW: sākāra 'accompanied by gestures or signs'. Речь Раваны — не просто «сладкие слова» (madhura), но sākāra: речь, усиленная мимикой и телодвижениями. В риторике (alaṃkāraśāstra) ākāra — невербальный аккомпанемент слова, придающий ему дополнительную убедительность. Подстрочник даёт «красивыми», оставляя вне поля риторическое значение жестовой речи соблазнителя.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:sAkAra", "collision_tier1": true}]}, {"verse_id": "5.20.2", "verse": "2", "sanskrit_iast": "māṃ dṛṣṭvā nāganāsoru gūhamānā stanodaram । adarśanam ivātmānaṃ bhayān netuṃ tvam icchasi ॥2॥", "leonov_ru": "«Увидев меня, о прекраснобедрая (та, чьи бедра подобны хоботу слона), скрываешь ты грудь и живот, Словно ты желаешь от страха сделаться невидимой.", "commentary": {"tilaka": "नागो गजः । स्तनोदरं गूहमाना भयादिव भयादेवात्मनं स्वशरीरमदर्शनं नेतुमिच्छसि । तत्किमिति शेषः", "bhusana": "मां दृष्ट्वा नागनासोरु गूहमाना स्तनोदरम् ।\n\nअदर्शनमिवात्मानं भयान्नेतुं त्वमिच्छसि\nअदर्शनं अदृश्यत्वम्", "siromani": "तद्वचनाकारमाह-- मामिति । हे नागनासोरु मां दृष्ट्वा भयादिव स्तनोदरं गूहमाना त्वम् आत्मानम् अदर्शनं दर्शनाभावं नेतुं प्रापयितुमिच्छसि तत्किमर्थमिति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "… дивнобедрая (nāganāsoru) – букв. « та, чьи бедра (ūru) подобны хоботу слона (nāganāsā)».Сделаться невидимкой? (adarśanam ivātmānaṃ… netuṃ tvam icchasi) – в комментарии «Тилака» отмечается, что фраза представляет собой вопрос (в тексте опущено слово kim – почему? отчего?).[Е. Костина] Надо указать, что не все придерживаются этой трактовки"}, {"id": "lexical:5.20.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nāganāsoru", "note_ru": "Наганасору (nāga-nāsā-uru, adj.) — бахуврихи: nāga «слон» + nāsā «хобот, нос» + uru «бедра» = «та, чьи бедра подобны хоботу слона». Канонический женский эпитет классической поэтики: бедра женщины уподоблялись хоботу слона по округлости и упругости. MW: nāga 'a snake; an elephant', uru 'thigh'. Эпитет структурно пародоксален: слоновий хобот — символ силы и мощи, не изящества; соединение двух образов создаёт специфически эпическую эстетику «великолепия через размер». Подстрочник поясняет в скобках, но буквальный состав бахуврихи утрачивается.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:nAga+dic_mw:uru", "collision_tier1": true}]}, {"verse_id": "5.20.5", "verse": "5", "sanskrit_iast": "svadharmo rakṣasāṃ bhīru sarvadaiva na saṃśayaḥ । gamanaṃ vā parastrīṇāṃ haraṇaṃ sampramathya vā ॥5॥", "leonov_ru": "О робкая, своя неизменная дхарма у ракшасов, нет сомнения – Стремление к чужим женам (соблазнение чужих жен) или похищение их силой.", "commentary": {"bhusana": "स्वधर्मो रक्षसां भीरु सर्वथैव न संशयः ।\n\nगमनं वा परस्त्रीणां हरणं संप्रमथ्य वा"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Собственному закону» Нужен будет комм. про дхарму ракшасов[Е. Костина] «maithili» Опущено обращение"}, {"id": "lexical:5.20.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "svadharma", "note_ru": "Свадхарма (sva-dharma, m.) — «своя дхарма, собственный долг / природа»: sva «свой» + dharma «закон, долг, природа» (√dhṛ-, «держать»). Слово техническое: svadharma означает не просто «обычай», но специфическую обязанность, вытекающую из природы существа или его варны / класса. MW: svadharma 'one's own duty'. Равана аргументирует, что похищение чужих жён — буквально «своя дхарма ракшасов», т.е. конститутивное, онтологически обоснованное действие, не нарушение закона, а его выполнение. Это тонкое риторическое извращение дхармического дискурса.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:svaDarma", "collision_tier1": true}, {"id": "crosstext:5.20.5:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "svadharma (rakṣasām)", "note_ru": "Равана возводит насилие над чужими жёнами в «свою дхарму» ракшасов (svadharmo rakṣasāṃ … gamanaṃ vā parastrīṇāṃ haraṇaṃ sampramathya vā). Это отсылка к нормативной классификации браков у Ману, где «обряд ракшаса» определяется именно как насильственное похищение: Manu 3.33 — hatvā chittvā ca bhittvā ca krośantīṃ rudantīṃ gṛhāt | prasahya kanyāharaṇaṃ rākṣaso vidhirucyate || «Похищение из дома кричащей и плачущей девушки силой, сопровождаемое убийствами, ранениями и разрушениями, называется обрядом ракшаса». Manu 3.24 закрепляет эту форму за кшатрием (rākṣasaṃ kṣatriyasya). «Свадхарма» Раваны иронически совпадает с тем, что шастра кодифицирует как низший, но признанный для воина способ брака; похищение Ситы — чудовищная буквализация rākṣasa-vidhi. Локус классикус для термина.", "type": "А", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.20.5", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra (Законы Ману, рус. пер. С.Д. Эльманович / Г.И. Ильин) Manu 3.33; 3.26; 3.24", "collision_tier1": true}, {"id": "crosstext:5.20.5:1", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "rākṣasa (vivāha)", "note_ru": "Равана объявляет «своей неизменной дхармой ракшасов» — «стремление к чужим жёнам или похищение их силой» (svadharmo rakṣasāṃ … gamanaṃ vā parastrīṇāṃ haraṇaṃ sampramathya vā). Это прямая отсылка к шастрической дефиниции: восьмеричная типология брака у Ману знает обряд rākṣasa именно как насильственный увоз кричащей женщины. Manu 3.33: «hatvā chittvā ca bhittvā ca krośantīṃ rudantīṃ gṛhāt / prasahya kanyāharaṇaṃ rākṣaso vidhirucyate» — «Похищение из дома кричащей и плачущей девушки силой, сопровождаемое убийствами, ранениями и разрушениями, называется обрядом ракшаса». Поэт Сундараканды знает технический термин: Равана выдаёт за «дхарму» то, что Ману относит к низшим, на грани адхармы, формам брака. Свидетельство: уровень шлоки (мягкое).", "type": "Б", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.20.5", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra 3.33 (Эльманович–Ильин)", "collision_tier1": true}, {"id": "crosstext:5.20.5:2", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "svadharma", "note_ru": "Равана называет насилие «своей дхармой» (svadharmo rakṣasām). Шастра знает афоризм о svadharma в форме, почти тождественной БхГ 3.35. Manu 10.97: «varaṃ svadharmo viguṇo na pārakyaḥ svanuṣṭhitaḥ / paradharmeṇa jīvan hi sadyaḥ patati jātitaḥ» — «Лучше своя дхарма, плохо исполненная, чем хорошо исполненная чужая, ибо живущий [исполнением] чужой дхармы немедленно становится изгоем». В устах Раваны технический термин svadharma извращён: «дхарма ракшасов» как оправдание адхармы — риторическая подмена нормативного понятия, которое у Ману закрепляет варновый долг, а не произвол. Свидетельство: уровень шлоки (мягкое).", "type": "А", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.20.5", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra 10.97 (Эльманович–Ильин)", "collision_tier1": true}, {"id": "crosstext:5.20.5:3", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "svadharma", "note_ru": "Равана оправдывает насилие над Ситой ссылкой на «свою неизменную дхарму ракшасов» (svadharmo rakṣasāṃ … haraṇaṃ). Это прямая — и иронически перевёрнутая — перекличка с центральным учением Гиты о свадхарме как нравственной опоре действия. Ср. БхГ 2.31: «svadharmam api cāvekṣya na vikampitum arhasi / dharmyād dhi yuddhāc chreyo 'nyat kṣatriyasya na vidyate» — «Также, дхарму свою соблюдая, ты в бою колебаться не смеешь: помышляя о долге, сражаться — это благо для кшатрия, Партха!»; и БхГ 3.35: «śreyān svadharmo viguṇaḥ paradharmāt svanuṣṭhitāt …» — «Лучше плохо свершать свою дхарму, чем в чужой преуспеть, Арджуна: путь другого, Партха, опасен, смерть принять на своем пути — благо.». У Кришны svadharma — закон, удерживающий воина в долге; в устах Раваны тот же термин превращён в самооправдание адхармы. Параллель высвечивает, что поэт Сундараканды знает технический смысл svadharma и сознательно вкладывает его в уста демона как риторическую подмену. Свидетельство: уровень шлоки (мягкое).", "type": "А", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.20.5", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bhagavadgītā 2.31 и 3.35 (Семенцов)", "collision_tier1": true}]}, {"verse_id": "5.20.6", "verse": "6", "sanskrit_iast": "evaṃ caivam akāmāṃ tvāṃ na ca sprakṣyāmi maithili । kāmaṃ kāmaḥ śarīre me yathākāmaṃ pravartatām ॥6॥", "leonov_ru": "Но, так или иначе, я не коснусь тебя против твоей воли, Майтхили, Пусть Кама делает в моем теле все, что ему угодно.", "commentary": {"siromani": "सीतां प्रति रावणोक्तिं वर्णयितुमाह स इति । स रावणः परिवृतां राक्षसीभिरिति शेषः, अत एव निरानन्दामत एव दीनां सीतां साकारैरभिप्रायसहितैः अभिप्रायबोधकैरित्यर्थः, वाक्यैः न्यदर्शयत अब्रवीत् । \"आकारस्त्विङ्गिताकृती\" इति कोशः", "tilaka": "एवं च एवमपि बलात्कारपक्षे तव मम च दोषाभावे ऽपि तस्य पक्षस्य रसाभाससंपादकत्वात्, अत एवमकामामनेन प्रकारेण मयि कामरहितां त्वां मद्भिन्नेच्छावतीं च न च, न तु स्प्रक्ष्यामि । \"एवं चैतदकामां त्वाम्\" इति पाठे एतद्रक्षोधर्मत्वम् । एवं चैवमेव मदुक्तरीतिकमेव, तथाप्युक्तप्रकारेण त्वामकामां न स्प्रक्ष्यामीत्यर्थः । नन्वेवं सति दुःसहा कामपीडा तव स्यात्तत्राह-- काममिति । कामो मन्मथो यथाकामं यथेच्छं कामं तद्विषयेच्छां प्रवर्तताम् प्रवर्तयत्वित्यर्थः", "bhusana": "एवं चैतदकामां तु न त्वां स्प्रक्ष्यामि मैथिलि ।\n\nकाम कामः शरीरे मे यथाकामं प्रवर्तताम्\nएवमात्मानं प्रशस्य रामं निन्दति किं करिष्यसीत्यादिना । निक्षिप्तविजयः त्यक्तविजय इत्यर्थः । स्थण्डिलशायी भूतलशायी ।। 4.20.26।।\n\nनहि वैदेहि रामस्त्वां द्रष्टुं वाप्युपलप्स्यते ।\n\nपुरोबलाकैरसितैर्मेघैर्ज्योत्स्नामिवावृताम्\nनहीति । वाशब्दो ऽवधारणे, द्रष्टुमपि नोपलप्स्यत एवेत्यर्थः । दर्शनमात्रफलमपि दर्शनं (च) न प्राप्स्यतीत्यर्थः पुरो ऽग्रे बलाका येषां ते पुरोबलाकाः तैः । अनेन मेघानामतिविपुलतोच्यते । महामेघेष्वेव बलाकासञ्चारवर्णनात्"}, "has_tier1": false, "notes": [{"id": "phase2:5.20.6:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "evaṃ caivam akāmām / evaṃ caitad akāmāṃ tvām", "note_ru": "По основному чтению Равана оправдывается: он не коснется Ситы против ее воли, хотя бы Кама и делал с его телом что угодно. «Тилака» отмечает вариант чтения «evaṃ caitad akāmāṃ tvām» («так, эту нежелающую тебя»), при котором смысл сдвигается: сам отказ от насилия объявляется правилом (dharma) ракшасов, а не личным волевым ограничением Раваны.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "фиксирует вариант чтения, при котором воздержание Раваны предстает не личным выбором, а декларируемой родовой нормой ракшасов — деталь, отсутствующая в подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.20.8", "verse": "8", "sanskrit_iast": "ekaveṇī adhaḥśayyā dhyānaṃ malinam ambaram । asthāne 'py upavāsaś ca naitāny aupayikāni te ॥8॥", "leonov_ru": "Носить единственную косу, спать на земле, пребывать в раздумьях, носить грязную одежду, Поститься даже в недолжное время – это не подобает тебе.", "commentary": {"tilaka": "अधःशय्या भूशयनम् । नौपयिकानि न पुरुषार्थोपयुक्तानि", "bhusana": "एकवेणी धराशय्या ध्यानं मलिनमम्बरम् ।\n\nअस्थाने ऽप्युपवासश्च नैतान्यौपयिकानि ते", "siromani": "एकेति । अस्थाने स्वस्थानभिन्ने ऽपि एतान्येकवेण्यादीनि तेन औपयिकानि युक्तानि"}, "has_tier1": false, "notes": [{"id": "lexical:5.20.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ekaveṇī", "note_ru": "Экавени (eka-veṇī, f.) — «единственная (единая) коса»: eka «один» + veṇī «коса, плетёная прядь» (MW: veṇī 'braided hair; a braid'). Ритуально и семиотически нагруженный образ: veṇī (единственная незаплетённая или иначе заплетённая коса) — маркер траура, аскезы или клятвы. Жена, ожидающая мужа в разлуке или давшая обет, носит ekaveṇī как знак незавершённого состояния. Ср. «Махабхарата»: Драупади носит ekaveṇī весь период изгнания, поклявшись заплести волосы только кровью Душасаны. Равана перечисляет ekaveṇī как одну из «неподобающих» практик Ситы, тем самым обнажая незнание дхармической логики её поведения.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:ekaverRI"}]}, {"verse_id": "5.20.10", "verse": 10, "sanskrit_iast": "", "leonov_ru": "", "commentary": {}, "has_tier1": true, "notes": [{"id": "tier1:5.20.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «maithili» Опущено обращение[Е. Костина] «ложа» Комм. śayanāny āsanāni ca[Е. Костина] «maivaṃ bhūḥ» Опущено"}], "verse_not_segmented": true}, {"verse_id": "5.20.12", "verse": "12", "sanskrit_iast": "idaṃ te cāru saṃjātaṃ yauvanaṃ hy ativartate । yad atītaṃ punar naiti srotaḥ srotasvinām iva ॥12॥", "leonov_ru": "Ибо твоя молодость, чья красота созрела, проходит, Словно речной поток, который прошел и не вернется снова.", "commentary": {"tilaka": "अतिवर्तते ऽतिक्रम्य गच्छति । स्रोतस्विनो जलप्रवाहाः । स्रोतस्तेन प्रवहज्जलम् । अतो भुङ्क्ष्व भोगानिति शेषः", "bhusana": "इदं ते चारु संजातं यौवनं व्यतिवर्तते ।\n\nयदतीतं पुनर्नैति स्रोतः शीघ्रमपामिव", "siromani": "भूषणधारणसमयो ऽयमेवेति बोधयन्नाह इदमिति । अतीतं गतं स्रोतस्विनां महाप्रवाहाणां स्रोतः अल्पप्रवाह इव संजातं निष्पन्नं चारु शोभनं यौवनं युवावस्था अतिवर्तते । एतेन भूषणादीनि धारयेति सूचितम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.20.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "yauvana", "note_ru": "Яувана (yauvana, n.) — «молодость, юность, период цветения», производное от yuvan «молодой» (PIE *h₂yuh₁en-; ср. лат. juvenis, англ. young). MW: yauvana 'youth, adolescence, puberty'. В контексте аргументации Раваны yauvana — не абстрактная «молодость», а физическая зрелость тела (rūpa), достигшая пика (cāru saṃjātam). Индийская медицинская и поэтическая традиция делит жизнь на три части: bālyā, yauvana, jarā; yauvana — пик tejas тела. Сравнение с речным течением (srotas) — из ключевых эпических метафор необратимости: yauvana = поток, который нельзя повернуть вспять. Важно для понимания аргументации Раваны: он оперирует медицинско-поэтическим концептом.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:yauvana"}]}, {"verse_id": "5.20.14", "verse": "14", "sanskrit_iast": "tvāṃ samāsādya vaidehi rūpayauvanaśālinīm । kaḥ punar nātivarteta sākṣād api pitāmahaḥ ॥14॥", "leonov_ru": "Приблизившись к тебе, Вайдехи, наделенной красотой и молодостью, Кто пройдет мимо, будь это хотя бы [сам] Брахма!", "commentary": {"tilaka": "को नातिवर्तेत क्षुभ्येतेत्यर्थः । \"कः पुमानतिवर्तेत\" इति पाठे कामवशतामतिक्रम्य को वर्तेतेत्यर्थः", "bhusana": "त्वां समासाद्य वैदेहि रूपयौवनशालिनीम् ।\n\nकः पुमानतिवर्तेत साक्षादपि पितामहः"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Кто может мимо пройти (kaḥ punar nātivarteta) – в комментарии «Тилака» ativṛt понимается в значении «взволноваться» (kṣubh). Также понимает это слово и автор комментария «Таттвадипика». В комментарии «Широмани» ativṛt понимается сходным образом как «выказывать свое волнение» (svauddhatyaṃ prakāś).[Е. Костина] «,» Комментарий необходимо подредактировать, дописать, что по комментариям - «кто не взволнуется» (или как-то так), иначе без оригинала может может остаться непонятным, перевод следует комментариям или нет+ надо отметить, что у Голдманов - could give you up having once laid eyes on you"}, {"id": "lexical:5.20.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pitāmaha", "note_ru": "Питамаха (pitāmaha, m.) — «дед» (pita «отец» + -māha = māhā «великий»?), но в эпическом языке это специализированное имя Брахмы: буквально «Великий Отец» или «Прадед (всего сущего)». MW: pitāmaha 'a paternal grandfather; Brahmā (as father of Manu who is father of men)'. Равана заявляет: даже сам Brahman/Pitāmaha не смог бы пройти мимо красоты Ситы, — это максимальная гиперболизация, ставящая Брахму в качестве эталона-аскета, которого красота всё равно соблазнила бы. Подстрочник даёт «Брахма» в скобках — но семантика титула «Прадеда» утрачивается.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:pitAmaha", "collision_tier1": true}]}, {"verse_id": "5.20.16", "verse": "16", "sanskrit_iast": "bhava maithili bhāryā me moham etaṃ visarjaya । bahvīnām uttamastrīṇāṃ mamāgramahiṣī bhava ॥16॥", "leonov_ru": "Будь моей женой, Майтхили, оставь это помрачение! Будь моей главной царицей над множеством прекрасных (лучших) женщин.", "commentary": {"tilaka": "मोहं नैतद्वशा भविष्यामीति बुद्धिम् ।। 5.20.16,17 ।।\n\nतव हेतोस्त्वत्प्रीत्यर्थम्", "bhusana": "भव मैथिलि भार्या मे मोहमेनं विसर्जय ।\n\nबह्वीनामुत्तमस्त्रीणामाहृतानामितस्ततः ।\n\nसर्वासामेव भद्रं ते ममाग्रमहिषी भव", "siromani": "भवेति । हे भवमैथिलि भवति भावयति नितरां स्वपतिं चिन्तयति सा एव मैथिली तत्संबोधनम् अग्रस्य सर्वोत्कृष्टस्य रामस्य महिषी त्वं मम बह्वीनामुत्तमस्त्रीणां भार्या सेव्या भव अत एव तं विद्यमानं मे मोहं वैचित्यं विसर्जय त्याजय"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «maithili» Опущено обращение"}, {"id": "lexical:5.20.16:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "agra-mahiṣī", "note_ru": "Аграмахиши (agra-mahiṣī, f.) — «старшая царица, первая жена»: agra «первый, главный» + mahiṣī «буйволица; главная царица» (из mahiṣa «буйвол», символ царственной силы). MW: mahiṣī 'a she-buffalo; the chief queen'. Социально-правовой термин: в полигамном царском доме mahiṣī — законная первая жена с особым ритуальным статусом (участвует в раджасуе и ашвамедхе). Предложение Раваны сделать Ситу agra-mahiṣī — это предложение высшего доступного женского статуса в его социальном порядке. Подстрочник «главная царица» корректен, но не передаёт буффало-метафорику термина и его ритуальный вес.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:mahizI", "collision_tier1": true}, {"id": "phase2:5.20.16:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bhava maithili", "note_ru": "«Тилака» и «Бхушана» читают «bhava» как императив «будь [моей женой]», как и переводчик. В «Широмани» же «бхавамайтхили» разобрано как сложное обращение — «та, что [неотступно] думает о муже» (bhavati bhāvayati... svapatiṃ cintayati), то есть эпитет самой Ситы, а не глагольная форма.", "type": "Б", "source_commentary": ["tilaka", "bhusana", "siromani"], "why_proposed": "показывает, что перевод следует большинству (Тилака/Бхушана), тогда как Широмани грамматически иначе разбирает то же слово, превращая императив в эпитет верности.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.20.17", "verse": "17", "sanskrit_iast": "lokebhyo yāni ratnāni sampramathyāhṛtāni me । tāni te bhīru sarvāṇi rājyaṃ caiva dadāmi te ॥17॥", "leonov_ru": "Все сокровища миров, которые были насильно похищены мной, О робкая, и царство [мое] отдаю я тебе.", "commentary": {"bhusana": "लोकेभ्यो यानि रत्नानि सम्प्रमथ्याहृतानि वै ।\n\nतानि मे भीरु सर्वाणि राज्यं चैतदहं च ते"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Сокровища всех миров (lokebhyo yāni ratnāni) – букв. ratnāni (драгоценные камни, жемчужины). Голдмены переводят это слово в данном случае как all the choice things (см.: Goldman 1984: 167)."}]}, {"verse_id": "5.20.20", "verse": "20", "sanskrit_iast": "asakṛt saṃyuge bhagnā mayā vimṛditadhvajāḥ । aśaktāḥ pratyanīkeṣu sthātuṃ mama surāsurāḥ ॥20॥", "leonov_ru": "Не единожды в битве разбиты были мною, с поверженными знаменами, Бессильные противостоять мне в боевых рядах боги и асуры.", "commentary": {"tilaka": "प्रत्यनीकेषु प्रतिसैनिकभावेषु", "bhusana": "असकृत् संयुगे भग्ना मया विमृदितध्वजाः ।\n\nअशक्ताः प्रत्यनीकेषु स्थातुं मम सुरासुराः\nअसकृदिति । विमृदितध्वजाः भग्नव्यजाः । प्रत्यनीकेषु शत्रुषु मध्ये"}, "has_tier1": false, "notes": [{"id": "lexical:5.20.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "deva-asura samgrama", "note_ru": "Дева–асура война (deva–asura samgrama) — конфликт богов и демонов как фоновый мифологический топос; введено в Рам. I.20.22 (Гринцер). В V.20.20 Равана похваляется: asakrt samyuge bhagna maya vimrditadhvajah asakta pratyanikeSu sthatum mama surasurAh — «Не раз в сражении боги и асуры, не в силах стоять передо мной, бежали с поверженными знамёнами». Равана позиционирует себя выше обеих сторон извечного конфликта: он победил не только богов, но и асуров, то есть вышел за рамки самой дихотомии добро/зло эпической мифологии. Дева–асура война — структурообразующий конфликт мифологии: его порождения — все великие мифы (пахтание океана, битвы Индры и Вритры). Победитель над обеими сторонами — существо, разрушившее космический порядок; именно это служит обоснованием аватары Вишну (рождения Рамы) в Балаканде.", "type": "Г", "subtype": "hist_cultural", "trigger": "myth_background", "source": "Рам. I.20.22 (Гринцер); Grintser e101 (Вишну)"}]}, {"verse_id": "5.20.22", "verse": "22", "sanskrit_iast": "sādhu paśyāmi te rūpaṃ suyuktaṃ pratikarmaṇā । pratikarmābhisaṃyuktā dākṣiṇyena varānane ॥22॥", "leonov_ru": "Увижу я твою красоту, должным образом соединенную с драгоценностями. Украшенная драгоценностями с искусством, о прекрасноликая,", "commentary": {"tilaka": "प्रतिकर्मणा युक्तं ते रूपं पश्यामि भाविकमत्रालङ्कारः । दाक्षिण्येन मद्विषयककृपया । प्रतिकर्माभिसंयुक्ता भवेति शेषः ।। 5.20.22,23 ।।\n\nललस्वेप्सां कुरु । मत्प्रसादान्मयि प्रसादात् । ललन्त्या मदीप्साजनितप्रभावेण वर्धमानायाः", "siromani": "साध्विति । प्रतिकर्मणा कर्तव्यभोजनादिनिखिलक्रियया सुयुक्तं ते रूपं पश्यामि पश्येयम् । अर्धं पृथक् । प्रतीति । प्रतिकर्माभिसंयुक्ता अत एव दाक्षिण्येनोपलक्षिता त्वं भोगान् राज्यैश्वर्याणि यथाकामं भुङ्क्ष्व पिब दिव्यरसास्वादं कुरु रमस्व दासीभूतमन्दोदर्यादिभिः विहरस्व । अर्धद्वयमेकान्वयि", "bhusana": "प्रतिकर्माभिसंयुक्ता दाक्षिण्येन वरानने ।\n\nभुङ्क्ष्व भोगान् यथाकामं पिब भीरु रमस्व च\nप्रतिकर्मेति । दाक्षिण्येन सरलत्वेन । भुङ्क्ष्व अनुभव । \"दक्षिणे सरलोदारौ\"इत्यमरः"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.22:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Увижу» Можно отметить, что здесь в оригинале наст. время в значении будущего"}, {"id": "edition:5.20.22:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.20.22 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.20.22", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.20.22", "iast": "sādhu paśyāmi te rūpaṃ suyuktaṃ pratikarmaṇā । pratikarmābhisaṃyuktā dākṣiṇyena varānane ॥22॥"}], "collision_tier1": true}]}, {"verse_id": "5.20.26", "verse": "26", "sanskrit_iast": "nikṣiptavijayo rāmo gataśrīr vanagocaraḥ । vratī sthaṇḍilaśāyī ca śaṅke jīvati vā na vā ॥26॥", "leonov_ru": "Рама, воинские победы которого отброшены (который отказался от победы), утративший (царское) величие, скитающийся по лесу, Аскет, спящий на голой земле – сомневаюсь, жив ли он.", "commentary": {"tilaka": "निक्षिप्तविजयो निरस्तविजयसाचनः, अत एव गतश्रीत्वादिगुणः । जीवनस्यैव सन्देह पराक्रमादसंभावना दूरत इत्यर्थः", "siromani": "शूर्पणखाविरूपादिकरणजनिततापशान्तये रामविषयकसीतातिप्रीतिं निवारयितुमाह निक्षिप्तेति । निक्षिप्तस्तव हरणादिना विनष्टः विजयः विजयसामग्र्युत्साहादिर्यस्य अत एव गतश्रीः रामः जीवति न वा इत्यहं शङ्के विचारयामि\nननु जीवति चेदानयेत्यत आह न हीति । हे वैदेहि रामः त्वां द्रष्टुमपि नोपलभ्यते संभाव्यते । तत्र दृष्टान्तः पुरो ऽग्रे बलाका बकपङ्क्तयो येषां तैर्मेघैरावृतां ज्योत्स्नामिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Отказавшийся от победы,» Нужен комм. По г-пресс - оставил надежду на победу, по комментариям - способность победить и пр., у Голдманов - has renounced the triumph of a warrior"}, {"id": "lexical:5.20.26:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sthaṇḍilaśāyin", "note_ru": "Стхандилашайин (sthaṇḍila-śāyin, adj.) — «спящий/лежащий на голой земле»: sthaṇḍila «ровный голый клочок земли» (ритуальная площадка, специально выровненная и очищенная) + śāyin (√śī-, «лежать»). MW: sthaṇḍila 'a piece of bare ground; the ground prepared for a sacrifice'. Равана использует sthaṇḍilaśāyin как уничижение: Рама ведёт жизнь аскета, спящего на «земле для жертвоприношений», т.е. лишён нормального ложа царевича. Парадокс: в дхармическом смысле sthaṇḍilaśāyin — добродетель аскета (mahāvrata). Равана намеренно переинтерпретирует добродетель как нищету.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:sTaNDilaSAyin", "collision_tier1": true}, {"id": "phase2:5.20.26:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "nikṣiptavijayo rāmaḥ", "note_ru": "«Широмани» поясняет, что сомнение Раваны в том, жив ли Рама, — риторический прием: он произносит его, чтобы унять боль (и, косвенно, ревность), вызванную обезображиванием Шурпанакхи, то есть его слова здесь продолжают линию мести за сестру, а не просто издевку над соперником.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "добавляет нарративную мотивировку реплики Раваны (месть за Шурпанакху), которой нет в подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.20.27", "verse": "27", "sanskrit_iast": "na hi vaidehi rāmas tvāṃ draṣṭuṃ vāpy upalabhyate । purobalākair asitair meghair jyotsnām ivāvṛtām ॥27॥", "leonov_ru": "Ибо, Вайдехи, Рама не обретет (возможность) даже увидеть тебя, Как (невозможно увидеть) лунный свет, закрытый темными тучами, впереди которых [летят] журавли.", "commentary": {"tilaka": "द्रष्टुं वापि प्राप्तिस्तु दूरतरेत्यर्थः । उपलभ्यते । व्यत्ययेन श्यन्प्रत्ययः समर्थो भवतीत्यर्थः । \"उपलप्स्यते\" इति पाठे समर्थो भविष्यतीत्यर्थः । पुरोबलाकैरग्रेसरबलाकैः"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Скрытое грозовыми тучами ((purobalākair asitair meghaiḥ) – букв. «черными тучами, перед которыми летят журавли». Журавли – предвестники сезонных ливней (см. см.: Goldman 1984: 406)."}]}, {"verse_id": "5.20.28", "verse": "28", "sanskrit_iast": "na cāpi mama hastāt tvāṃ prāptum arhati rāghavaḥ । hiraṇyakaśipuḥ kīrtim indrahastagatām iva ॥28॥", "leonov_ru": "И не сможет получить (вырвать) из моих рук тебя Рагхава, Как Хираньякашипу (вырвал) Кирти, попавшую в руки Индры.", "commentary": {"tilaka": "इन्द्रहस्तगतां कीर्तिं कीर्तितुल्यां भार्यामिन्द्रहृतां नारदमुखेन प्रार्थनया यथा हिरण्यकशिपुः प्राप्तवान्, नैवं त्वां रामः प्राप्स्यतीति भावः । इयं च कथा भागवते प्रसिद्धेति तीर्थः ।। 5.20.28,29 ।।\n\nस्वेषु दारेषु मन्दोदर्यामपि", "bhusana": "न चापि मम हस्तात्त्वां प्राप्तुमर्हति राघवः ।\n\nहिरण्यकशिपुः कीर्तिमिन्द्रहस्तगतामिव", "siromani": "नेति । मम हस्तात् त्वां प्राप्तुं राघवो नार्हति । तत्र दृष्टान्तः इन्द्रहस्तगतां कीर्तिं हिरण्यकशिपुरिव"}, "has_tier1": false, "notes": [{"id": "lexical:5.20.28:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "hiraṇyakaśipu", "note_ru": "Хираньякашипу (hiraṇya-kaśipu, m.) — «золотое ложе» или «одетый в золото»: hiraṇya «золото» + kaśipu «подстилка, постель» (MW: kaśipu 'a mat, cushion; garment'). Данное имя — асурский царь, враг Вишну, отец Прахлады; ему был дарован Брахмой особый вар. Упоминание здесь уникально: Равана сравнивает себя с Хираньякашипу, получившим Кирти (богиню, дочь Индры). Это показывает мифологическую эрудицию Раваны и его самоотождествление с великими асурами прошлого. Этот пример малоизвестен и подстрочник оставляет его непрокомментированным.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:hiraNyakaSipu"}, {"id": "phase2:5.20.28:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "hiraṇyakaśipuḥ kīrtim", "note_ru": "По «Тилаке», Хираньякашипу вернул не саму богиню Кирти, а «подобную Кирти» жену (kīrti-tulyāṃ bhāryām), похищенную Индрой, — и вернул ее через заступничество (просьбу) Нарады, а не силой. Комментатор прямо называет источник сюжета — Бхагавата-пурану.", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "уточняет миф: похищенная фигура — не богиня Кирти лично, а жена, названная ей подобной, а возвращение произошло через ходатайство Нарады; деталь отсутствует в подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.20.29", "verse": "29", "sanskrit_iast": "cārusmite cārudati cārunetre vilāsini । mano harasi me bhīru suparṇaḥ pannagaṃ yathā ॥29॥", "leonov_ru": "О сияющая, с прекрасной улыбкой, с прекрасными зубами, с прекрасными глазами, Ты похищаешь (уносишь) мою душу, робкая, словно Супарна – змею.", "commentary": {"bhusana": "चारुस्मिते चारुदति चारुनेत्रे विलासिनि ।\n\nमनो हरसि मे भीरु सुपर्णः पन्नगं यथा", "siromani": "दौदासीन्यं निवारयितुमाह चार्विति । सुपर्णः पन्नगमिव मे मनस्त्वं हरसि"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.29:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «bhīru» Опущено обращение"}, {"id": "lexical:5.20.29:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "suparṇa", "note_ru": "Супарна (suparṇa, m.) — «прекраснокрылый»: su- «хорошо, красиво» + parṇa «перо, крыло». MW: suparṇa 'having beautiful wings or leaves; name of Garuḍa'. В сравнении «Гаруда уносит змею» — это не просто образ силы, но архетипический эпический образ неравного противостояния: Гаруда (suparṇa) = небесный царь птиц, бессмертный враг змей — символ абсолютного превосходства орла над змеёй. Равана уподобляет себя Гаруде, а Ситу — «змее» (pannaga), захваченной Им: гендерное извращение образа (женщина = змея).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:suparRa", "collision_tier1": true}, {"id": "crosstext:5.20.29:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "suparṇaḥ pannagaṃ yathā", "note_ru": "Равана льстит Сите: «ты похищаешь мою душу, словно Супарна — змею (suparṇaḥ pannagaṃ yathā)» (V.20.29). Сравнение перекодирует уже знакомую формулу Гаруда↔наг (ср. V.1.34, V.1.75) в любовно-кавья регистр: похищающий Гаруда теперь — метафора пленяющей красоты. Эпический фон термина pannaga как жертвы более сильного — Āraṇyaka 3.176.2, где Бхима, схваченный змеем, обращается: «kāmayā brūhi pannaga… kastvaṃ» — «Поведай мне милостиво, о змей (pannaga)». Параллель помогает увидеть, что комплимент Раваны построен на инверсии хищной формулы. Свидетельство: уровень шлоки (мягкое).", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.20.29", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparva 3.176.2", "collision_tier1": true}]}, {"verse_id": "5.20.30", "verse": "30", "sanskrit_iast": "kliṣṭakauśeyavasanāṃ tanvīm apy analaṃkṛtām । tvāṃ dṛṣṭvā sveṣu dāreṣu ratiṃ nopalabhāmy aham ॥30॥", "leonov_ru": "Даже в изношенных шелковых одеждах, исхудавшую, лишенную украшений Тебя увидев, в женах своих не нахожу я наслаждения.", "commentary": {"bhusana": "क्लिष्टकौशोयवसनां तन्वीमप्यनलङ्कृताम् ।\n\nत्वां दृष्ट्वा स्वेषु दारेषु रतिं नोपलभाम्यहम्", "siromani": "अनलंकृतामिति । अनलंकृतां त्वां त्वद्दुःखमित्यर्थः, दृष्ट्वा स्वेषु दारेषु रतिं प्रीतिम् अहं नोपलभामि अतिदुःखितं मनः क्वापि न प्रवर्तते इत्यर्थः । एतेन रावणस्य दयालुत्वं सूचितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «sveṣu» ? опущение в комм."}, {"id": "phase2:5.20.30:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sveṣu dāreṣu ratiṃ nopalabhāmi", "note_ru": "«Широмани» отмечает, что признание Раваны — увидев страдающую, неукрашенную Ситу, он не находит радости в собственных женах — свидетельствует о его «сострадательности» (dayālutvam), то есть комментатор читает эту реплику как редкий проблеск сочувствия в его характере, а не только как лесть.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "дает редкую характерологическую интерпретацию (сострадательность Раваны), не выводимую из одного подстрочника.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.20.32", "verse": "32", "sanskrit_iast": "mama hy asitakeśānte trailokyapravarastriyaḥ । tās tvāṃ paricariṣyanti śriyam apsaraso yathā ॥32॥", "leonov_ru": "Ибо, о черноволосая, мои жены, наилучшие в трех мирах Будут тебе прислуживать, как апсары – богине Шри.", "commentary": {"bhusana": "मम ह्यसितकेशान्ते त्रैलोक्यप्रवराः स्त्रियः ।\n\nतास्त्वां परिचरिष्यन्ति श्रियमप्सरसो यथा", "siromani": "ममेति । हे असितकेशान्ते हे अबद्धकेशभागे अप्सरसः श्रियमिव त्रैलोक्य प्रवरस्त्रियः त्वां परिचरिष्यन्ति"}, "has_tier1": false, "notes": [{"id": "lexical:5.20.32:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "apsaras", "note_ru": "Апсара (apsaras) — apsaras — небесные танцовщицы/нимфы; в Сундараканде — часть обстановки дворца Раваны. Первое вхождение в кн. V.", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}]}, {"verse_id": "5.20.33", "verse": "33", "sanskrit_iast": "yāni vaiśravaṇe subhru ratnāni ca dhanāni ca । tāni lokāṃś ca suśroṇi mayā bhuṅkṣva yathāsukham ॥33॥", "leonov_ru": "Драгоценными камнями и богатствами, которые (были) у Куберы, И (всеми) мирами со мной наслаждайся, сколько пожелаешь, дивнобровая, дивнобедрая.", "commentary": {"bhusana": "यानि वैश्रवणे सुभ्रु रत्नानि च धनानि च ।\n\nतानि लोकांश्च सुश्रोणि मां च भुङ्क्ष्व यथासुखम्", "siromani": "यानीति । मयोपार्जितानि वैश्रवणे कुबेरे यानि रत्नानि धनानि च तानि मां विष्णुलोकलक्ष्मीं च लोकांश्च भुङ्क्ष्व स्वाधीनत्वं प्रापयेत्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.33:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «subhru» Опущено обращение[Е. Костина] «suśroṇi» Опущено обращение"}, {"id": "lexical:5.20.33:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vaiśravaṇa", "note_ru": "Вайшравана (vaiśravaṇa, m.) — «потомок Вишравас», патронимик от Viśravas (мудреца, отца Куберы). MW: vaiśravaṇa 'son of Viśravas; Kubera (god of wealth)'. Кубера — повелитель якшей и хранитель сокровищ; сводный брат Раваны по отцу (общий отец Вишравас). Упоминание ratnāni vaiśravaṇe — сокровища, изначально принадлежавшие Кубере и захваченные Раваной, — это указание на специфическую историю: Равана прогнал Куберу с Ланки. Предложение Ситы этих сокровищ несёт дополнительный смысл: они «семейные», украденные у родственника.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vESravaRa", "collision_tier1": true}]}, {"verse_id": "5.20.36", "verse": "36", "sanskrit_iast": "kusumitatarujālasaṃtatāni । bhramarayutāni samudratīrajāni । kanakavimalahārabhūṣitāṅgī । vihara mayā saha bhīru kānanāni ॥36॥", "leonov_ru": "О робкая, наслаждайся вместе со мною рощами Изобилующими цветущими деревьями Где кружат рои пчел, которые (рощи) растут на берегу океана, Ты, чье тело [будет] украшено чистыми золотыми ожерельями».", "commentary": {"bhusana": "कुसुमिततरुजालसन्ततानि भ्रमरयुतानि समुद्रतीरजानि ।\n\nकनकविमलहारभूषिताङ्गी विहर मया सह भीरु काननानि", "siromani": "कुसुमितेति । कुसुमितैस्तरुजालैः सन्ततानि व्याप्तानि समुद्रतीरजानि मया सर्वसंपत्या सह सहितानि काननानि कनकविमलहारभूषिताङ्गी त्वं विहर"}, "has_tier1": true, "notes": [{"id": "tier1:5.20.36:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «в яркие золотые ожерелья» Чистые ожерелья звучит несколько иначе, чем vimalahāra,По-русски кажется, что их помыли"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s20_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

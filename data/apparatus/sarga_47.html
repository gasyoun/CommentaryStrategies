r_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "С воинством вместе (sānucarān savāhanān) – букв. «со спутниками и колесницами».…неуязвимого (akṣatam) – букв. «невредимого», то есть никогда не получавшего ран в сражении.", "service": [], "suggestions": [], "seq": 1}, {"id": "lexical:5.47.1:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "akṣa", "note_ru": "Акша (akṣa) — юный сын Раваны (akṣa), царевич (kumāra), отправленный против Ханумана после гибели пяти полководцев и убитый им; описан эпитетом mahābala «многомощный». Гибель сына — поворот, вынуждающий Равану послать Индраджита. Подстрочник называет его «царевич», имя вводит ниже. Первое появление персонажа.", "type": "В", "subtype": "base", "trigger": "realia", "source": "указатель имён и названий (анализ §09б / формулы тт. 1–2) — первое вхождение в кн. V (привязка к стиху, нестрогая)", "source_links": [], "collision_tier1": true, "seq": 2}]}, {"verse_id": "5.47.2", "verse": "2", "sanskrit_iast": "sa tasya dṛṣṭyarpaṇasampracoditaḥ; । pratāpavān kāñcanacitrakārmukaḥ । samutpapātātha sadasy udīrito; । dvijātimukhyair haviṣeva pāvakaḥ ॥2॥", "leonov_ru": "Он (царевич) его (Раваны) взглядом побужденный, Могучий, вооруженный луком, украшенным золотом, Встал тогда в собрании возбужденный (взволнованный) Словно огонь [взволнованный] жертвой лучших брахманов.", "commentary": {"bhusana": "स तस्य दृष्ट्यर्पणसंप्रचोदितः प्रतापवान् काञ्चनचित्रकार्मुकः ।\n\nसमुत्पपाताथ सदस्युदीरितो द्विजातिमुख्यैर्हविषेव पावकः", "siromani": "स इति । तस्य रावणस्य दृष्ट्यर्पणेन दृष्टिप्रचालनेनैव संप्रचोदितः प्रेरितः प्रतापवान् अक्षकुमारः सदसि यागशालायां द्विजातिमुख्यैर्हविषोदीरितः पावक इव समुत्पपात"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": прос, поставленный самой Костиной («непонятно, что за собрание») — Широмани уточняет: это яджна-шала, а не придворное собрание", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 5}]}, {"verse_id": "5.47.3", "verse": "3", "sanskrit_iast": "tato mahān bāladivākaraprabhaṃ; । prataptajāmbūnadajālasaṃtatam । rathāṃ samāsthāya yayau sa vīryavān; । mahāhariṃ taṃ prati nairṛtarṣabhaḥ ॥3॥", "leonov_ru": "Тогда великий на подобную восходящему солнцу, Покрытую сеткой из прокаленного золота, Колесницу вступив, отправился отважный К той великой обезьяне, бык среди ракшасов.", "commentary": {"tilaka": "महान्स इत्यन्वयः । जाम्बूनदजालेन तत्समूहेन सन्ततं व्याप्तम्", "bhusana": "ततो महद्बालदिवाकरप्रभं प्रतप्तजाम्बूनदजालसंततम् ।\n\nरतं समास्थाय ययौ स वीर्यवान् महाहरिं तं प्रति नैर्ऋतर्षभः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "кат.1 — буквальный перевод", "accounted": "", "text": "ṛṣabha / vṛṣabha — букв. «бык»; устойчивый эпитет превосходства.", "incomplete": false}], "seq": 6}]}, {"verse_id": "5.47.4", "verse": "4", "sanskrit_iast": "tatas tapaḥsaṃgrahasaṃcayārjitaṃ; । prataptajāmbūnadajālacitritam । patākinaṃ ratnavibhūṣitadhvajaṃ; । manojavāṣṭāśvavaraiḥ suyojitam ॥4॥", "leonov_ru": "Тогда на обретенной благодаря накопленному результату подвижничества, Украшенной сетью из прокаленного золота, Украшенной флагами, со знаменами, украшенными драгоценными камнями, Быстрой как мысль, запряженной восьмью великолепными конями,", "commentary": {"siromani": "तत इति । प्रतप्तजाम्बूनदस्य जालेन संततं व्याप्तं रथं समास्थाय महान् नैऋतर्षभः महाहरिं हनुमन्तं प्रति ययौ\nतत इति । तपःसंग्रहस्य तपश्चर्यायाः संचयेन अर्जितं प्राप्तं रत्नविभूषितो ध्वजो यस्मिन् मनोजवैरष्टभिरश्ववरैः सुयोजितम्", "tilaka": "उक्तमेवार्थं विशिष्याह-- तत इति । तपःसङ्ग्रहस्य तपोनुष्ठानस्य सञ्चयेन समृद्ध्या ऽर्जितम्", "bhusana": "ततस्तपःसंग्रहसञ्चयार्जितं प्रतप्तजाम्बूनदजालशोभितम् ।\n\nपताकिनं रत्नविभूषितध्वजं मनोजवाष्टाश्ववरैः सुयोजितम्\nततो महदित्यनेनोक्तं विस्तरेणाह ततस्तपस्संग्रहेत्यादिना । तपस्सङ्ग्रहसञ्चयार्जितं तपोनुष्ठनसमूहसम्पादितम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "lexical:5.47.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tapaḥsaṃgraha", "note_ru": "Тапах-санграха (tapaḥ-saṃgraha, m.) — тат-пуруша: tapas «аскеза» + saṃgraha «совокупность, накопление» (sam+√grah-, «собирать», Whitney #706). MW: saṃgraha 'collection, accumulation'. Колесница Акши arjita tapaḥsaṃgrahasaṃcayena — «обретённая накоплением совокупного результата аскезы» — несёт ключевую идею: это не просто военное снаряжение, а материализованный кармический капитал. В индийской традиции tapas накапливается как puṇya (заслуга) и может «тратиться» на получение благ (varadāna). Акша буквально едет на собственной кармической заслуге — это делает его гибель эпически трагической: сгорает не просто принц, но весь запас tapas.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:tapaHsaMgraha", "source_links": [{"label": "MW tapaHsaMgraha", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=tapaHsaMgraha"}], "seq": 7}]}, {"verse_id": "5.47.5", "verse": "5", "sanskrit_iast": "surāsurādhṛṣyam asaṅgacāriṇaṃ; । taḍitprabhaṃ vyomacaraṃ samāhitam । satūṇam aṣṭāsinibaddhabandhuraṃ; । yathākramāveśitaśaktitomaram ॥5॥", "leonov_ru": "Неодолимой для богов и асуров, не знающей препятствий, Подобной молнии, мчащейся по небу, полностью снаряженной, С колчаном стрел, с прикрепленными восемью мечами, С выстроенными по порядку копьями,", "commentary": {"tilaka": "अत एव व्योमचरमसङ्गचारिणम् पर्वतादिष्वपीति भावः । समाहितं सज्जम् । तूण इषुधिः । अष्टसु दिक्ष्वसिभिः सह निबद्धा बन्धुरा रथफलका यस्मिंस्तम् । यथाक्रमं यथास्थानमावेशितं शक्तितोमरं यस्मिंस्तम्", "bhusana": "सुरासुराधृष्यमसङ्गचारिणं रविप्रभं व्योमचरं समाहितम् ।\n\nसतूणमष्टासिनिबद्धबन्धुरं यथाक्रमावेशितशक्तितोमरम्\nसमाहितं सज्जीकृतम् । अष्टासिनिबद्धबन्धुरम् अष्टासिभिर्निबद्धम् अत एव बन्धुरं सुन्दरम् । \"बन्धुरं सुन्दरे नम्रे\" इति विश्वः । यद्वा अष्टासिभिर्निबद्धं बन्धुरं यस्य स तथा । बन्धुरं फलकासङ्घाट इत्याहुः । अन्ये घण्टा इत्यप्याहुः । तदानीम् अष्टासिश्चासौ निबद्धबन्धुरश्चेति समासः । यथाक्रमावेशितशक्तितोमरं पङ्क्तितया स्थापितशक्तितोमरम्", "siromani": "असंगचारिणं निरालम्बगमनशीलम् अत एव व्योमचरम् समाहितं सम्यक् संस्थापितं सतूणमिषुधिसहितम् अष्टभिरसिभिर्निबद्धा बन्धुरा यस्य यथाक्रममावेशितानि शक्तितोमराणि यस्मिन्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Неостановимо летящей как молния (asaṅgacāriṇaṃ taḍitprabhaṃ vyomacaraṃ samāhitam) – букв. «движущейся, не зная препятствий, сияющей как молния, летающей по небу, [полностью] экипированной». Во многих рукописях стоит вариант raviprabham «сияющей как солнце».", "service": [], "suggestions": [], "seq": 8}, {"id": "lexical:5.47.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "asaṅgacārin", "note_ru": "Асанга-чарин (asaṅga-cārin, adj.) — бахуврихи: asaṅga «без препятствий, без привязанностей» (a-+saṅga, √sañj-, «прилипать, задерживаться») + cārin «движущийся» (√car-, «двигаться»). MW: asaṅga 'unattached, free from bonds'; cārin 'going, moving'. Применительно к боевой колеснице asaṅgacārin означает «движущуюся без препятствий» — технически непреодолимую машину. Но за военным смыслом стоит йогический: asaṅga («непривязанность») в упанишадах описывает освобождённое сознание. Колесница Акши парадоксально наделяется атрибутом мокши — движение без кармической задержки.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:asaNgacArin", "source_links": [{"label": "MW asaNgacArin", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=asaNgacArin"}], "collision_tier1": true, "seq": 9}, {"id": "phase2:5.47.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bandhura", "note_ru": "Бандхура (bandhura) в составе aṣṭāsinibaddhabandhuram — тёмное место: «Бхушана» приводит подряд три толкования (украшенные восемью мечами борта колесницы; по другим — набор дощатых щитков; по третьим — колокольцы), не выбирая между ними.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "вскрывает подлинную текстологическую тёмность редкого слова, которую подстрочник («с прикреплёнными восемью мечами») сглаживает до одного, отнюдь не единственного традиционного толкования", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 10}]}, {"verse_id": "5.47.7", "verse": "7", "sanskrit_iast": "sa pūrayan khaṃ ca mahīṃ ca sācalāṃ; । turaṃgamataṅgamahārathasvanaiḥ । balaiḥ sametaiḥ sahatoraṇasthitaṃ; । samartham āsīnam upāgamat kapim ॥7॥", "leonov_ru": "Он, наполняя небо и землю с горами Звуком коней, слонов и великих колесниц, Вместе с войсками к пребывающей на арке Могучей сидящей приблизился обезьяне.", "commentary": {"tilaka": "तोरणस्थितं तोरणाश्रयम् आसीनमुपविष्टम्\nबाणासनमेव शक्रकार्मुकं यस्य सः", "bhusana": "स पूरयन् खं च महीं च साचलां तुरङ्गमातङ्गमहारथस्वनैः ।\n\nबलैः समेतैः स हि तोरणस्थितं समर्थमासीनमुपागमत् कपिम्\nसः अक्षः । हिः प्रसिद्धौ", "siromani": "स इति । स कुमारः तुरङ्गादिस्वनैः खादीन् पूरयन् सन् तोरणस्थितं तोरणावलम्बमासीनं कपिमुपागमत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Наполняя небо и землю шумом (sa pūrayan khaṃ ca mahīṃ ca sācalāṃ) – букв. «небо и землю с горами».", "service": [], "suggestions": [], "seq": 11}]}, {"verse_id": "5.47.8", "verse": "8", "sanskrit_iast": "sa taṃ samāsādya hariṃ harīkṣaṇo; । yugāntakālāgnim iva prajākṣaye । avasthitaṃ vismitajātasambhramaḥ; । samaikṣatākṣo bahumānacakṣuṣā ॥8॥", "leonov_ru": "Он, желтоглазый, приблизившись к той обезьяне, Подобной огню, который разрушит мир в конце юги, когда все живые существа погибнут, Смутившийся от изумления, Смотрел [на Ханумана] Акша почтительным взглядом.", "commentary": {"tilaka": "हरीक्षणः सिंहवत्क्रूरदृष्टिः । युगान्तकालाग्निवत्प्रजाश्रये ऽवस्थितं हरिं समासाद्य तमेवैक्षत विस्मितं च तं जातसंभ्रमं च बालो ऽयं मां योद्धुमिच्छतीति विस्मयः रावणपुत्रत्वाच्च तत्र जातादरत्वम्", "bhusana": "स तं समासाद्य हरिं हरीक्षणो युगान्तकालाग्निमिव प्रजाक्षये ।\n\nअवस्थितं विस्मितजातसंभ्रमः समैक्षताक्षो बहुमानचक्षुषा\nहरीक्षणः सिंहप्रेक्षणः । प्रजाक्षये अवस्थितं प्राणिनाशे प्रवृत्तम् । विस्मितश्चासौ जातसम्भ्रमश्च विस्मितजातसम्भ्रमः", "siromani": "स इति । हरीक्षणः सिंहवद्भयंकरदृष्टिः सो ऽक्षकुमारः प्रजाक्षये कालाग्निमिवावस्थितं विस्मितेन कुमारो ऽयं मया कथं योद्धुमिच्छतीति विस्मयेन जातः संभ्रम उद्वेगो यस्मिन् तं हनुमन्तमक्षः बहुमानचक्षुषा अतिगर्वदृष्ट्या ऐक्षत"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Желтоглазый… (harīkṣaṇo) – в комментарии «Тилака» этот эпитет толкуется как «со взглядом жестоким, как у льва» (siṃhavatkrūradṛṣṭiḥ). Голдмены в своем переводе придерживаются этой интерпретации (см.: Goldman 1984: 238).Подобному огню, что разрушит вселенную (yugāntakālāgnim iva prajākṣaye) – букв. подобному огню конца юги после уничтожения живых существ».", "service": [], "suggestions": [], "seq": 12}, {"id": "lexical:5.47.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "yugāntakālāgni", "note_ru": "Юганта-кала-агни (yuga-anta-kāla-agni, m.) — тат-пуруша: yuga «мировой цикл» + anta «конец» + kāla «время» + agni «огонь». MW: yugānta 'end of an age/yuga'; kālāgni 'the fire of time/destruction'. Хануман = огонь конца юги (yugāntakālāgni) в момент prajākṣaya («гибели всех существ»). Этот огонь в индийской космологии — абсолютный вселенский пожар (самвартагни), сжигающий всю материю. Показательно: Акша смотрит на Ханумана с изумлением (vismitajātasambhrama), а не со страхом — он распознаёт масштаб угрозы, что характеризует его как истинного кшатрия.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:yugAntakAlAgni", "source_links": [{"label": "MW yugAntakAlAgni", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=yugAntakAlAgni"}], "collision_tier1": true, "seq": 13}]}, {"verse_id": "5.47.9", "verse": "9", "sanskrit_iast": "sa tasya vegaṃ ca kaper mahātmanaḥ; । parākramaṃ cāriṣu rāvaṇātmajaḥ । vicārayan svaṃ ca balaṃ mahābalo; । yugakṣaye sūrya ivābhivardhata ॥9॥", "leonov_ru": "О быстроте той обезьяны, великой духом, И о мощи в отношении врагов сын Раваны Размышляя, и о своей силе, наделенный великой силой, Увеличился (собрался с силами), словно солнце при гибели юги.", "commentary": {"tilaka": "अभिवर्धत तेजसा ऽभ्यवर्धतेत्यर्थः", "bhusana": "स तस्य वेगं च कपेर्महात्मनः पराक्रमं चारिषु पार्थिवात्मजः ।\n\nविधारयन् स्वं च बलं महाबलो हिमक्षये सूर्य इवाभिवर्धते", "siromani": "स इति । रावणात्मजः सो ऽक्षः कपेर्वेगम् अरिषु पराक्रमं च स्वं बलं पराक्रमं च विचारयन् न्यूनाधिकभावं चिन्तयन् सन् युगक्षये सूर्य इव अभिवर्धत अभ्यवर्धत"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Солнце при разрушении мира (yugakṣaye sūrya) – букв. «солнце в конце юги». Также в рукописях встречается вариант himakṣaye (в конце зимы). И вырос… (abhivardhata) – в комментарии «Тилака» отмечается, что речь идет о силе (tejas) Акши.", "service": [], "suggestions": [], "seq": 14}]}, {"verse_id": "5.47.13", "verse": "13", "sanskrit_iast": "rarāsa bhūmir na tatāpa bhānumān । vavau na vāyuḥ pracacāla cācalaḥ । kapeḥ kumārasya ca vīryasaṃyugaṃ । nanāda ca dyaur udadhiś ca cukṣubhe ॥13॥", "leonov_ru": "Затряслась земля, и померкло солнце, Ветер не дул, и гора задрожала, При отважной битве обезьяны и царевича (когда в битве сошлись Хануман и царевич) Загремело [громом] небо, океан взволновался (гром грянул в небе, океан взволновался).", "commentary": {"tilaka": "भूमिर्भूमिस्थप्राणिजातं ररास । वीर्यप्रवृत्तं संयुगम् । वीक्ष्येति शेषः", "bhusana": "ररास भूमिर्न तताप भानुमान् ववौ न वायुः प्रचचाल चाचलः ।\n\nकपेः कुमारस्य च वीक्ष्य संयुगं ननाद च द्यौरुदधिश्च चुक्षुभे\nररासेति । न तताप भानुमान् । सूर्योदयः पूर्वं सूचितः सः न ततापेत्युच्यते", "siromani": "ररासेति । कपेः, कुमारस्य च वीर्यसंयुगम् । अतिवीर्यहेतुकसंग्रामम् अवलोक्येति शेषः, भूप्रभृतिः रासप्रभृतिं न चकार"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Закричала земля… (rarāsa bhūmiḥ) – в комментарии «Тилака» отмечается, что речь идет о живых существах земли.", "service": [], "suggestions": [], "seq": 15}, {"id": "lexical:5.47.13:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "acala", "note_ru": "Ачала (acala, m.) — «неподвижный, гора» (a-+√cal-, «двигаться»). MW: acala 'immovable; a mountain'. Принципиально: в шлоке 13 acalaḥ pracacāla — «недвижимое задрожало». Это оксюморон с этимологическим ключом: acala по самой своей природе «не-двигающееся», и вот оно движется. Землетрясение при схватке Ханумана и Акши нарушает онтологический порядок: солнце гаснет, ветер стихает, гора содрогается. Нарушение законов природы — стандартный эпический маркер сражения богоравных существ; лексема acala делает этот парадокс семантически явным.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:acala", "source_links": [{"label": "MW acala", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=acala"}], "collision_tier1": true, "seq": 16}]}, {"verse_id": "5.47.14", "verse": "14", "sanskrit_iast": "sa tasya vīraḥ sumukhān patatriṇaḥ । suvarṇapuṅkhān saviṣān ivoragān । samādhisaṃyogavimokṣatattvavic । charān atha trīn kapimūrdhny atāḍayat ॥14॥", "leonov_ru": "Тот отважный [Акша] с хорошими наконечниками, оперенных, С золотым оперением, подобных ядовитым змеям, Знающий, как концентрироваться (целиться), накладывать стрелу на лук и выпускать ее, Тогда три стрелы выпустил в голову обезьяны.", "commentary": {"tilaka": "समाधिर्लक्ष्यदर्शनम्, संयोगः शरसन्धानम्, विमोक्षः संहितस्य त्यागः, तेषां तत्त्ववीत् । अताडयदपातयत्", "bhusana": "ततः स वीरः सुमुखात् पतत्त्रिणः सुवर्णपुङ्खान् सविषानिवोरगान् ।\n\nसमाधिसंयोगविमोक्षतत्त्वविच्छरानथ त्रीन् कपिमूर्ध्न्यपातयत्\nसमाधिसंयोगविमोक्षतत्त्ववित् समाधिः लक्ष्यवेदनं संयोगः शरसन्धानं विमोक्षः तद्विसर्गः तेषां तत्त्ववित् यथार्थवित्", "siromani": "स इति । तस्य बाणस्य समाधिसंयोगविमोक्षः तत्त्ववित् समाधिर्लक्ष्यदर्शनं संयोगः शरसंधानं विमोक्षः तस्य त्यागः तेषां तत्त्वस्य याथार्थ्यस्य वेदिता वीरः सो ऽक्षकुमारसुवर्णपुङ्खान् स्वर्णमयपुङ्खविशिष्टान् अत एव सुमुखान् उरगानिव त्रीन् पतत्त्रिणो बाणान् कपिमूर्ध्नि अताडयन्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…искусный лучник (samādhisaṃyogavimokṣatattvavid) – букв. «знающий, как нацеливать [стрелы], прилаживать [их] к луку и выпускать».", "service": [], "suggestions": [], "seq": 17}, {"id": "lexical:5.47.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "samādhisaṃyogavimokṣatattvavid", "note_ru": "Самадхи-санйога-вимокша-таттва-вид (samādhi-saṃyoga-vimokṣa-tattva-vid, adj.) — сложный тат-пуруша: samādhi «концентрация / взятие» + saṃyoga «наложение (стрелы на лук)» + vimokṣa «выпускание (стрелы)» + tattva «суть» + vid «знающий». MW: samādhi — технически «взятие / установление»; saṃyoga = «наложение»; vimokṣa = «выпуск». Перечисление трёх фаз лучного искусства через йогическую терминологию (samādhi, vimokṣa — термины медитативной практики) — намеренный поэтический приём: стрельба из лука = йогическая дисциплина. Параллель с Бхагавадгитой (3.17, 18.1): kṣatriya-dharma как форма йоги.", "type": "В", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:samADi+saMmyoga+vimokza+tattvavid", "source_links": [{"label": "MW samADi", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=samADi"}], "collision_tier1": true, "seq": 18}]}, {"verse_id": "5.47.16", "verse": "16", "sanskrit_iast": "tataḥ sa plavaṅgādhipamantrisattamaḥ । samīkṣya taṃ rājavarātmajaṃ raṇe । udagracitrāyudhacitrakārmukaṃ । jaharṣa cāpūryata cāhavonmukhaḥ ॥16॥", "leonov_ru": "Тогда лучший из советников царя обезьян Увидев того сына лучшего из царей в бою С поднятым великолепным оружием и великолепным луком, Возрадовался и стал расти, обращенный к битве.", "commentary": {"tilaka": "आपूर्यत व्यवर्धत", "bhusana": "ततः स पिङ्गाधिपमन्त्रसत्तमः समीक्ष्य तं राजवरात्मजं रणे ।\n\nउदग्रचित्रायुधचित्रकार्मुकं जहर्ष चापूर्यत चाहवोन्मुखः\nआपूर्यत व्यवर्धत", "siromani": "तत इति । प्लवगाधिप एव मन्त्रिसत्तमो हनूमान् उदग्राणि अत्युत्तमानि चित्रायुधानि यस्य चित्राणि कार्मुकानि धनूंषि यस्य स एव स इति कर्मधारयः । तं राजवरात्मजमक्षं समीक्ष्य जहर्ष अपूर्यत अवर्धत च"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "лучшего из царей", "kind": "note", "text": "Я не уверена, что так можно писать про Равану. У Г. просто великий царь, в Г-пр вообще эпитет опущен"}], "suggestions": [], "seq": 19}]}, {"verse_id": "5.47.17", "verse": "17", "sanskrit_iast": "sa mandarāgrastha ivāṃśumālī । vivṛddhakopo balavīryasaṃvṛtaḥ । kumāram akṣaṃ sabalaṃ savāhanaṃ । dadāha netrāgnimarīcibhis tadā ॥17॥", "leonov_ru": "Он, подобный солнцу, стоящему на вершине [горы] Мандары, Разъяренный, исполненный силы и мужества, Царевича Акшу с войском и колесницами Стал сжигать лучами огня глаз тогда.", "commentary": {"tilaka": "मन्दराग्रस्थत्वेन मध्यन्दिनस्थत्वं लक्ष्यते", "bhusana": "स मन्दराग्रस्थ इवांशुमालिको विवृद्धकोपो बलवीर्यसंयुतः ।\n\nकुमारमक्षं सबलं सवाहनं ददाह नेत्राग्निमरीचिभिस्तदा\nमन्दराग्रस्थः मन्दरो नाम भूमध्यपर्वतः । तदग्रे मध्याह्ने वर्तत इत्यौग्र्योक्तिः 5.47.17 ।।\n\nततः स बाणासनचित्रकार्मुकः शरप्रवर्षो युधि राक्षसाम्बुदः ।\n\nशरान् मुमोचाशु हरीश्वराचले वलाहको वृष्टिमिवाचलोत्तमे", "siromani": "स इति । विवृद्धकोपः मन्दराग्रस्थों ऽशुमाली सूर्य इव हनूमान् अक्षं कुमारं नेत्राग्निमरीचिभिः ददाह इव"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "phase2:5.47.17:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mandarāgrastha", "note_ru": "«Стоящий на вершине Мандары» (mandarāgrasthaḥ) — и «Тилака», и «Бхушана» читают этот образ как указание на полдень: Мандара — центральная гора мира, и «пребывание на её вершине» означает солнце в зените, а сама гипербола (стоять на вершине горы в полдень) отмечена «Бхушаной» как аугрьокти, намеренное преувеличение.", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "вносит временную координату (полдень) и называет риторический приём (гипербола) там, где подстрочник передаёт только зрительный образ без этих слоёв", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 20}]}, {"verse_id": "5.47.20", "verse": "20", "sanskrit_iast": "sa bālabhāvād yudhi vīryadarpitaḥ । pravṛddhamanyuḥ kṣatajopamekṣaṇaḥ । samāsasādāpratimaṃ raṇe kapiṃ । gajo mahākūpam ivāvṛtaṃ tṛṇaiḥ ॥20॥", "leonov_ru": "Он из-за [своей] юности гордый [своим] мужеством в битве, Разъяренный, с глазами, [цветом] подобными крови, Напал на несравненную в бою обезьяну, Словно слон на огромный колодец, скрытый травами.", "commentary": {"tilaka": "तृणैरावृतं महाकूपं गजपातनार्थकृतगर्तम्", "bhusana": "स बालभावाद्युधि वीर्यदर्पितः प्रवृद्धमन्युः क्षतजोपमेक्षणः ।\n\nसमाससादाप्रतिमं कपिं रणे गजो महाकूपमिवावृतं तृणैः", "siromani": "स इति । बालभावात् बालत्वाद्धेतोः वीर्यदर्पितः प्रवृद्धः मन्युर्यस्य क्षतजोपमे ईक्षणे यस्य सः अक्षः रणे अप्रतिमं कपिं तृणैरावृतं कूपमिव समाससाद प्राप"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Словно слон – на яму, травами скрытую (gajo mahākūpam ivāvṛtaṃ tṛṇaiḥ) – средневековые комментаторы отмечают, что речь идет о ловушке, вырытой для поимки слона.", "service": [], "suggestions": [], "seq": 21}, {"id": "lexical:5.47.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bālabhāva", "note_ru": "Бала-бхава (bāla-bhāva, m.) — тат-пуруша: bāla «юный, неопытный» + bhāva «бытие, состояние» (√bhū-, «быть»). MW: bāla 'young, childish'; bhāva 'becoming, being; nature, disposition'. Bālabhāvād — «из-за [своего] состояния юности» — содержит амбивалентность: юность делает Акшу vīryadarpita (гордым доблестью), что положительно (кшатрийская смелость), но и уязвимым для переоценки себя. Это типичный эпический мотив hamartia юного героя. Скрытая дхармическая коннотация: именно bālabhāva мешает полноте военной мудрости, которую дают опыт и tapas.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:bAlaBava", "source_links": [{"label": "MW bAlaBava", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=bAlaBava"}], "collision_tier1": true, "seq": 22}]}, {"verse_id": "5.47.23", "verse": "23", "sanskrit_iast": "sa tāñ śarāṃs tasya harir vimokṣayamś । cacāra vīraḥ pathi vāyusevite । śarāntare mārutavad viniṣpatan । manojavaḥ saṃyati caṇḍavikramaḥ ॥23॥", "leonov_ru": "Обезьяна, уклоняясь от его стрел, Помчалась, отважная, по пути ветра, Между стрелами, словно ветер, летя, Быстрая, как мысль, обладающая свирепой отвагой в битве.", "commentary": {"bhusana": "द्विजातिमुख्यैः हविषा उदीरितः अभिवर्धितः पावक इवेत्यन्वयः\nस तान् शरांस्तस्य हरिर्विमोक्षयंश्चचार वीरः पथि वायुसेविते ।\n\nशरान्तरे मारुतवद्विनिष्पतन् मनोजवः संयति चण्डविक्रमः\nस तानिति । विमोक्षयन् शरीरे असंयोजयन् । लाघवातिशयेनेति भावः", "siromani": "स इति । शरान्तरे शराणामन्तरं मध्यं यस्मिन् तस्मिन् संयति संग्रामे शरान्तरे शरमध्ये विनिष्पतन्नपि हरिः स हनूमान् तस्य कुमारस्य तान् शरान् विमोक्षयन् स्वकर्मकस्पर्शाभावं प्रापयन् सन् वायुसेविते पथि चचार"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.23:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "От стрел его уклоняясь (śarāṃs tasya… vimokṣayan) – автор комментария «Тилака» глоссирует слово vimokṣayan как vyarthīkurvan (делая бесполезными). Автор комментария «Бхушана» поясняет: śarīre asaṃyojayan (не давая вонзиться в тело).", "service": [], "suggestions": [], "seq": 23}]}, {"verse_id": "5.47.26", "verse": "26", "sanskrit_iast": "abālavad bāladivākaraprabhaḥ । karoty ayaṃ karma mahan mahābalaḥ । na cāsya sarvāhavakarmaśālinaḥ । pramāpaṇe me matir atra jāyate ॥26॥", "leonov_ru": "«Не подобный ребенку, блеском подобный юному солнцу, Совершает он дело великое, могучий, Его, искусного во всех военных делах, Не убивать моя мысль тут возникает.", "commentary": {"tilaka": "चिन्ताप्रकारः-- अबालवदिति । सर्वाहवकर्मशालिनः सर्वप्रकाराहवकर्मशालिनः । अत्रास्मिन्काले ऽस्य प्रमापणे मे मतिर्न जायते । \"प्रमापणे मारुतिरत्र जायते\" इति पाठे \"अयं जनः\" इतिवत्स्वस्यैव हनुमता मारुतिरिति निर्देशः", "bhusana": "अबालवद्बालदिवाकरप्रभः करोत्ययं कर्म महन्महाबलः ।\n\nन चास्य सर्वाहवकर्मशोभिनः प्रमापणे मे मतिरत्र जायते", "siromani": "चिन्ताकारमाह अबालवदिति । बालदिवाकरप्रभः अयं कुमारः अबालवत्कर्म करोति अतः सर्वाहवकर्मशालिनः आहवनिखिलक्रियाविज्ञातुः अस्य प्रमापणे विध्वंसने अत्र अस्मिन्समये मे मतिर्न जायते"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "phase2:5.47.26:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mārutiḥ (var.)", "note_ru": "«Не возникает во мне решимости убить его» (pramāpaṇe me matir... na jāyate) — по «Тилаке», в некоторых списках вместо me matiḥ стоит вариант mārutiḥ: тогда Хануман говорит о себе в третьем лице («Марути [то есть я] не решается его убить») — оборот, по «Тилаке» аналогичный «этот человек» вместо «я».", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "фиксирует конкретный вариант чтения (mārutiḥ вместо me matiḥ) с реальным следствием для того, как понимать субъект фразы — самоименование Ханумана в третьем лице", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 24}]}, {"verse_id": "5.47.29", "verse": "29", "sanskrit_iast": "na khalv ayaṃ nābhibhaved upekṣitaḥ । parākramo hy asya raṇe vivardhate । pramāpaṇaṃ hy asya mamādya rocate । na vardhamāno 'gnir upekṣituṃ kṣamaḥ ॥29॥", "leonov_ru": "«Воистину, не одолеет он [меня], если я не отнесусь к нему с пренебрежением, Ибо его доблесть возрастает в битве. Надлежит мне убить его, [Ибо] нельзя пренебрегать разгорающимся огнем».", "commentary": {"bhusana": "न खल्वयं नाभिभवेदुपेक्षितः पराक्रमो ह्यस्य रणे विवर्धते ।\n\nप्रमापणं त्वेव ममास्य रोचते न वर्धमानो ऽग्निरुपेक्षितुं क्षमः", "siromani": "नेति । यतो ऽस्य रणे पराक्रमो विवर्धते अत उपेक्षितो ऽयं मां नाभिभवेत् अभिभवेदेवेत्यर्थः । अतः अस्य प्रमापणं नाशनं मम रोचते । हि यतः वर्धमानो ऽग्निः उपेक्षितुं न क्षमः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.29:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Мне надлежит убить царевича (pramāpaṇaṃ hy asya mamādya rocate) – Голдмены переводят как «У меня нет другого выбора, кроме как убить его» (I have really no choice but to kill him) (см.: Goldman 1984: 240), учитывая, что несколькими строфами ранее Хануман выражал нежелание убивать Акшу.", "service": [], "suggestions": [], "seq": 25}, {"id": "lexical:5.47.29:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vardhamānāgni", "note_ru": "Вардхаман-агни (vardhāmāna-agni, m.) — «разгорающийся огонь». Vardhamāna — причастие настоящего времени от √vṛdh- («возрастать, разгораться», Whitney #834). Хануман использует этот образ в внутреннем монологе: vardhamāno 'gnir upekṣituṃ na kṣamaḥ — «разгорающийся огонь нельзя не замечать». Это прямая цитата из нитишастры — максима государственного управления: врага (как огонь) следует гасить в зародыше, пока он не стал неодолимым. Хануман в этот момент рассуждает языком раджанити, а не личной вражды.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:varDamAna+agni", "source_links": [{"label": "MW varDamAna", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=varDamAna"}], "collision_tier1": true, "seq": 26}]}, {"verse_id": "5.47.32", "verse": "32", "sanskrit_iast": "tatas talenābhihato mahārathaḥ । sa tasya piṅgādhipamantrinirjitaḥ । sa bhagnanīḍaḥ parimuktakūbaraḥ । papāta bhūmau hatavājir ambarāt ॥32॥", "leonov_ru": "Тогда великий воин, сражающийся на колеснице, ударенный ладонью, Побежденный советником царя обезьян, Чье сиденье в колеснице было разбито, ось отлетела, Упал на землю с неба тот, чьи кони были убиты.", "commentary": {"bhusana": "इदमेवोपपादयति ततश्शरैरित्यादिना ।। 5.47.25,26।।\n\nअयं महात्मा च महांश्च वीर्यतः समाहितश्चातिसहश्च संयुगे ।\n\nअसंशयं कर्मगुणोदयादयं सनागयक्षेर्मुनिभिश्च पूजितः\nततस्तलेनाभिहतो महारथः स तस्य पिङ्गाधिपमन्त्रिनिर्जितः ।\n\nप्रभग्ननीडः परिमुक्तकूबरः पपात भूमौ हतवाजिरम्बरात्\nतलेनाभिहतः अत एव पिङ्गाधिपमन्त्रिनिर्जितः, हनुमता निर्जित इत्यर्थः । प्रभग्ननीडः प्रभग्नरथाङ्गः । कूबरः युगन्धरः । वाजिरिति इकारान्तत्वमार्षम्", "tilaka": "नीडं रथ्यधिष्ठानस्थानम्", "siromani": "तत इति । तस्य हनूमतस्तलेनाभिहतः स भग्ननीडः भग्ननीडेन सहितः नीडं रथिस्थानं परिवृत्तः कूबरो यस्य हतवाजिः विध्वंसिताश्वः अत एव पिङ्गाधिपमन्त्रिणा सुग्रीवामात्येन निर्जितः पराभूतो महारथः सो ऽक्षः भूमौ पपात"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.32:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Побежденный министром Сугривы (piṅgādhipamantrinirjitaḥ) – букв. «побежденный министром царя рыжих».", "service": [], "suggestions": [], "seq": 27}]}, {"verse_id": "5.47.33", "verse": "33", "sanskrit_iast": "sa taṃ parityajya mahāratho rathaṃ । sakārmukaḥ khaḍgadharaḥ kham utpatan । tato'bhiyogād ṛṣir ugravīryavān । vihāya dehaṃ marutām ivālayam ॥33॥", "leonov_ru": "Великий воин, оставив колесницу, С луком и мечом в небо взлетел Тогда, как риши, благодаря подвижничеству наделенный грозной силой, [Поднимается], оставив тело, в обитель ветра.", "commentary": {"tilaka": "मरुतामालयं स्वर्गमुत्पतन्नृषिरिव", "bhusana": "स तं परित्यज्य महारथो रथं सकार्मुकः खड्गधरः खमुत्पतन् ।\n\nतपोभियोगादृषिरुग्रवीर्यवान् विहाय देहं मरुतामिवालयम्", "siromani": "स इति । तं भग्नं रथं परित्यज्य खमुत्पतन् सन् सो ऽक्षकुमारः तपोभियोगात् तपो ऽतिबलात् देहं विहाय मरुतां देवानामालयमुत्पतन् ऋषिरिव बभूवेति शेषः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.33:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…в обитель марутов (marutām ivālayam) – то есть на небеса. Автор комментария «Широмани» объясняет это выражение как «обитель богов» (dēvānām ālayam). Голдмены отмечают, что слово «маруты» иногда используется как синоним слова «боги» (см.: Goldman 1984: 479) и переводят «to the abode of the gods» (см.: Goldman 1984: 241).", "service": [{"author": "Е. Костина", "lemma_iast": ".", "kind": "note", "text": "Из-за краткости по переводу непонятно, кто в итоге покинул тело. Можно подумать, что Акша оставил тело, можно подумать, что риши умер, оставил тело и отправился на небеса (а не по своему желанию)"}], "suggestions": [], "seq": 28}]}, {"verse_id": "5.47.34", "verse": "34", "sanskrit_iast": "kapis tatas taṃ vicarantam ambare । patatrirājānilasiddhasevite । sametya taṃ mārutavegavikramaḥ । krameṇa jagrāha ca pādayor dṛḍham ॥34॥", "leonov_ru": "Обезьяна тогда его, летящего в небе, Где летают царь птиц (Гаруда), ветер и сиддхи, Сойдясь с ним постепенно, могучая, словно ветер, Схватила его крепко за ноги.", "commentary": {"tilaka": "पतत्त्रीति । गरुडवायुसिद्धसेविते तं समेत्य तं पादयोर्जग्राहेत्यन्वयः", "bhusana": "ततः कपिस्तं विचरन्तमम्बरे पतत्त्रिराजानिलसिद्धसेविते ।\n\nसमेत्य तं मारुततुल्यविक्रमः क्रमेण जग्राह स पादयोर्दृढम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.34:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Гаруды, ветра и сиддхов,", "kind": "note", "text": "комм потом нужен будет"}], "suggestions": [], "seq": 29}]}, {"verse_id": "5.47.35", "verse": "35", "sanskrit_iast": "sa taṃ samāvidhya sahasraśaḥ kapir । mahoragaṃ gṛhya ivāṇḍajeśvaraḥ । mumoca vegāt pitṛtulyavikramo । mahītale saṃyati vānarottamaḥ ॥35॥", "leonov_ru": "Покрутив его тысячу раз, обезьяна, Подобно владыке птиц (Гаруде), схватившего огромную змею, Швырнул стремительно, доблестью равный отцу, На землю в бою лучший из обезьян.", "commentary": {"siromani": "कपिरिति । रणचण्डविक्रमम् अक्षं कुमारं संयुगे प्रसमीक्ष्य कपिर्हर्षान्ननाद\nकपिरिति । पतत्त्रिराजानिलसिद्धानां सेविते ऽम्बरे विचरन्तं तमक्षकुमारं क्रमेण समेत्य कपिर्हनूमान् पादयोर्दृढं जग्राह\nस इति । वानरोत्तमः कपिः स हनूमान् तमक्षं गृह्य गृहीत्वा सहस्रशो ऽनेकवारं समाविध्य भ्रामयित्वा वेगान्महीतले मुमोच । तत्र दृष्टान्तः महोरगमण्डजेश्वरो गरुड इव", "bhusana": "स तं समाविध्य सहस्रशः कपिर्महोरगं गृह्य इवाण्डजेश्वरः ।\n\nमुमोच वेगात् पितृतुल्यविक्रमो महीतले संयति वानरोत्तमः\nगृह्य इवेत्यत्र गुणाभाव आर्षः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.35:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "vānarottamaḥ", "kind": "note", "text": "эпитет в комм?"}], "suggestions": [], "seq": 30}, {"id": "lexical:5.47.35:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āṇḍajeśvara", "note_ru": "Андаджешвара (āṇḍaja-īśvara, m.) — бахуврихи: āṇḍaja «рождённый из яйца» + īśvara «владыка» = «владыка яйцерождённых» = Гаруда. MW: āṇḍaja 'oviparous, any oviparous creature, a bird'; āṇḍajeśvara 'lord of birds = Garuda'. Сравнение с Гарудой, держащим mahoraga (огромную змею), — эпически устойчивый образ захвата и господства. Хануман крутит Акшу sahasraśaḥ (тысячу раз) — это не боевой приём, а ритуальное уничтожение через сакральное число. Гаруда и змея — также символы противостояния богов и демонов (наги как союзники ракшасов).", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:ANDajeSwara", "source_links": [{"label": "MW ANDajeSwara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ANDajeSwara"}], "collision_tier1": true, "seq": 31}]}, {"verse_id": "5.47.36", "verse": "36", "sanskrit_iast": "sa bhagnabāhūrukaṭīpayodharaḥ । kṣarann asṛn nirmathitāsthilocanaḥ । sabhinnasaṃdhiḥ pravikīrṇabandhano । hataḥ kṣitau vāyusutena rākṣasaḥ ॥36॥", "leonov_ru": "Со сломанными руками, бедрами и грудью, Истекая кровью, с разрушенными костями и глазами, С разбитыми суставами, с разорванными сухожилиями, На земле [лежал] ракшас, убитый сыном ветра.", "commentary": {"bhusana": "स भग्नबाहूरुकटीशिरोधरः क्षसन्नसृङ्निर्मथितास्थिलोचनः ।\n\nस भग्रसन्धिः प्रविकीर्णबन्धनो हतः क्षितौ वायुसुतेन राक्षसः ।\n\nमहाकपिर्भूमितले निपीड्य तं चकार रक्षोधिपतेर्महद्भयम्\nप्रविकीर्णबन्धनः प्रवीकीर्णकक्ष्यादिबन्धनः । प्रभिन्नसन्धिरिति सन्धिबन्धभङ्गस्योक्तत्वात्", "siromani": "स इति । वायुसुतेन हतः अत एव भग्ना बाह्वादयो यस्य निर्मथितानि अस्थिलोचनानि यस्य भिन्नाः सन्धयो यस्य प्रविकीर्णानि बन्धनानि यस्य राक्षसः क्षितौ अपतदिति शेषः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "lexical:5.47.36:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nirmathita", "note_ru": "Нирматхита (nir-mathita, p.p.p.) — от nir+√manth-/√math- («сбивать, перемалывать, разрушать», Whitney #486). MW: nirmathita 'churned, shattered, destroyed'. Корень √manth-/math- сакрально нагружен: именно manthan — пахтание Молочного океана (Samudramanthana) — центральный космогонический миф. Nirmathita asthi-locana — «перемолотые кости и глаза» — использует корень первозданного разрушения. Смерть Акши семантически перекликается с пахтанием: из хаоса Samudramanthana вышли яды и нектар; гибель принца — тоже трагический момент, из которого выйдет нечто новое (приход Индраджита).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:nirmaTita", "source_links": [{"label": "MW nirmaTita", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=nirmaTita"}], "seq": 32}]}, {"verse_id": "5.47.37", "verse": "37", "sanskrit_iast": "mahākapir bhūmitale nipīḍya taṃ । cakāra rakṣo'dhipater mahad bhayam । maharṣibhiś cakracarair samāgataiḥ । sametya bhūtaiś ca sayakṣapannagaiḥ । suraiś ca sendrair bhṛśajātavismayair । hate kumāre sa kapir nirīkṣitaḥ ॥37॥", "leonov_ru": "Великая обезьяна, на землю его низвергнув, Причинила великий страх владыке ракшасов. Великие риши и чакрачары (видьядхары), Бхуты, якши и змеи, Боги с Индрой, вместе собравшись, в великом изумлении Смотрели на ту обезьяну, когда был убит царевич.", "commentary": {"tilaka": "समाविद्ध्य भ्रामयित्वा । गृह्य इव । असन्धिल्यपावार्षौ । गृहीत्वेवेत्यर्थः ।। 5.47.35,36 ।।\n\nचक्रचरैर्ज्योतिश्चक्रचरैर्ग्रहादिभिः समेत्य समागतैर्जातविस्मयैर्निरीक्षित इत्यन्वयः", "bhusana": "महर्षिभिश्चक्रचरैर्महाव्रतैः समेत्य भूतैश्च सयक्षपन्नगैः ।\n\nसुरैश्च सैन्द्रैर्भृशजातविस्मयैर्हते कुमारे स कपिर्निरीक्षितः", "siromani": "महाकपिरिति । तमक्षं भूमितले निपीड्य रक्षोधिपतेः महद्भयं चकार । अर्धं पृथक् महर्षिभिरिति । कुमारे हते सति जातविस्मयैः महर्षिभृतिभिः कपिः स हनूमान् निरीक्षितो बभूवेति शेषः । सार्धश्लोक एकान्वयी"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.37:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "кат.2 — многозначность", "accounted": "", "text": "бхута (bhūta) — «существо» или «дух»?", "incomplete": false}], "seq": 33}]}, {"verse_id": "5.47.38", "verse": "38", "sanskrit_iast": "nihatya taṃ vajrasutopamaṃ raṇe । kumāram akṣaṃ kṣatajopamekṣaṇam । tad eva vīro 'bhijagāma toraṇaṃ । kṛtakṣaṇaḥ kāla iva prajākṣaye ॥38॥", "leonov_ru": "Убив в бою того подобного сыну Индры (Джаянте) Царевича Акшу, чьи глаза были [цветом] подобны крови, Поднялся тогда отважный (Хануман) на арку, Словно Время (Смерть), отдыхающее после гибели живых существ (или ждущее гибели живых существ).", "commentary": {"tilaka": "तदेवाह-- स इति । सदसि यज्ञशालायां द्विजातिमुख्यैर्हविषोदीरितः प्रेरितः पावक इव समुत्पपात\nवज्रिसुतोपमं जयन्ततुल्यम् । कृतक्षणः पुनर्युद्धे कृतोत्साहः", "siromani": "तदेव भङ्ग्यन्तरेणाह-- तत इति । शरैर्भिन्नं भुजान्तरं यस्य स कपिः रणे पराक्रमम् अक्षकुमारबलवत्त्वं विचिन्तयामास", "bhusana": "निहत्य तं वज्रिसुतोपमप्रभं कुमारमक्षं क्षतजोपमेक्षणम् ।\n\nतमेव वीरो ऽभिजगाम तोरणं कृतक्षणः काल इव प्रजाक्षये"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-47", "notes": [{"id": "tier1:5.47.38:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Джаянте", "kind": "note", "text": "пояснение в комм"}, {"author": "Е. Костина", "lemma_iast": "Чьи глаза", "kind": "note", "text": "по переводу непонятно, речь про глаза Акши или сына Индры"}, {"author": "Е. Костина", "lemma_iast": "Словно Смерть сама, насытившись жертвами.", "kind": "note", "text": "Другая интерпретация той же фразы. Нужна ссылка на 46.41 или комм"}], "suggestions": [], "seq": 34}, {"id": "phase2:5.47.38:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kṛtakṣaṇaḥ", "note_ru": "Критакшана (kṛtakṣaṇaḥ) в повторяющейся формуле «словно Время в ожидании гибели существ» здесь, по «Тилаке», означает «воодушевившийся на новую битву» (kṛtotsāhaḥ punaryuddhe) — иначе, чем в парном употреблении той же формулы к Дурдхаре в 5.46.41, где Тилака и Бхушана читали её как «дождавшийся часа» (получивший возможность действовать). Традиция даёт формуле разный оттенок при каждом повторении.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "прямо отвечает на запрос самой Костиной («нужна ссылка на 46.41 или комм») и показывает, что Тилака придаёт повторяющейся формуле иной смысловой оттенок здесь, чем в 5.46.41", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 35}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

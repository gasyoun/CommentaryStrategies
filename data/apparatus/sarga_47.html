прошедший упанаяну) + mukhya «главный» (от mukha «лицо, голова»). MW: dvijāti 'twice-born'; mukhya 'chief, principal'. Образ Акши, воспламеняющегося словно огонь от haviṣ, возносимого dvijātimukhyair, несёт многоуровневое сопоставление: брахманский ритуал зажигания огня → военная ярость. Только dvijātimukhya способен «правильно» воспламенить жертвенный огонь; лишь взгляд Раваны правильно воспламеняет Акшу. Скрытая параллель: Акша = сакральный огонь, война = яджна.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:dvijAtimuKya", "collision_tier1": true}, {"id": "phase2:5.47.2:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sadasi", "note_ru": "Садаси (sadasi, «в собрании») — по «Широмани», это не просто царское собрание, а йага-шала, помещение для жертвоприношения: сравнение Акши с огнём, вздымающимся от возлияния брахманов (dvijātimukhyair haviṣā), опирается именно на ритуальную сцену, а не на придворный зал.", "type": "В", "source_commentary": ["siromani"], "why_proposed": "напрямую отвечает на вопрос, поставленный самой Костиной («непонятно, что за собрание») — Широмани уточняет: это яджна-шала, а не придворное собрание", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.47.3", "verse": "3", "sanskrit_iast": "tato mahān bāladivākaraprabhaṃ; । prataptajāmbūnadajālasaṃtatam । rathāṃ samāsthāya yayau sa vīryavān; । mahāhariṃ taṃ prati nairṛtarṣabhaḥ ॥3॥", "leonov_ru": "Тогда великий на подобную восходящему солнцу, Покрытую сеткой из прокаленного золота, Колесницу вступив, отправился отважный К той великой обезьяне, бык среди ракшасов.", "commentary": {"tilaka": "महान्स इत्यन्वयः । जाम्बूनदजालेन तत्समूहेन सन्ततं व्याप्तम्", "bhusana": "ततो महद्बालदिवाकरप्रभं प्रतप्तजाम्बूनदजालसंततम् ।\n\nरतं समास्थाय ययौ स वीर्यवान् महाहरिं तं प्रति नैर्ऋतर्षभः"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] ? [кат.1 — буквальный перевод] ṛṣabha / vṛṣabha — букв. «бык»; устойчивый эпитет превосходства"}]}, {"verse_id": "5.47.4", "verse": "4", "sanskrit_iast": "tatas tapaḥsaṃgrahasaṃcayārjitaṃ; । prataptajāmbūnadajālacitritam । patākinaṃ ratnavibhūṣitadhvajaṃ; । manojavāṣṭāśvavaraiḥ suyojitam ॥4॥", "leonov_ru": "Тогда на обретенной благодаря накопленному результату подвижничества, Украшенной сетью из прокаленного золота, Украшенной флагами, со знаменами, украшенными драгоценными камнями, Быстрой как мысль, запряженной восьмью великолепными конями,", "commentary": {"siromani": "तत इति । प्रतप्तजाम्बूनदस्य जालेन संततं व्याप्तं रथं समास्थाय महान् नैऋतर्षभः महाहरिं हनुमन्तं प्रति ययौ\nतत इति । तपःसंग्रहस्य तपश्चर्यायाः संचयेन अर्जितं प्राप्तं रत्नविभूषितो ध्वजो यस्मिन् मनोजवैरष्टभिरश्ववरैः सुयोजितम्", "tilaka": "उक्तमेवार्थं विशिष्याह-- तत इति । तपःसङ्ग्रहस्य तपोनुष्ठानस्य सञ्चयेन समृद्ध्या ऽर्जितम्", "bhusana": "ततस्तपःसंग्रहसञ्चयार्जितं प्रतप्तजाम्बूनदजालशोभितम् ।\n\nपताकिनं रत्नविभूषितध्वजं मनोजवाष्टाश्ववरैः सुयोजितम्\nततो महदित्यनेनोक्तं विस्तरेणाह ततस्तपस्संग्रहेत्यादिना । तपस्सङ्ग्रहसञ्चयार्जितं तपोनुष्ठनसमूहसम्पादितम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.47.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tapaḥsaṃgraha", "note_ru": "Тапах-санграха (tapaḥ-saṃgraha, m.) — тат-пуруша: tapas «аскеза» + saṃgraha «совокупность, накопление» (sam+√grah-, «собирать», Whitney #706). MW: saṃgraha 'collection, accumulation'. Колесница Акши arjita tapaḥsaṃgrahasaṃcayena — «обретённая накоплением совокупного результата аскезы» — несёт ключевую идею: это не просто военное снаряжение, а материализованный кармический капитал. В индийской традиции tapas накапливается как puṇya (заслуга) и может «тратиться» на получение благ (varadāna). Акша буквально едет на собственной кармической заслуге — это делает его гибель эпически трагической: сгорает не просто принц, но весь запас tapas.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:tapaHsaMgraha"}]}, {"verse_id": "5.47.5", "verse": "5", "sanskrit_iast": "surāsurādhṛṣyam asaṅgacāriṇaṃ; । taḍitprabhaṃ vyomacaraṃ samāhitam । satūṇam aṣṭāsinibaddhabandhuraṃ; । yathākramāveśitaśaktitomaram ॥5॥", "leonov_ru": "Неодолимой для богов и асуров, не знающей препятствий, Подобной молнии, мчащейся по небу, полностью снаряженной, С колчаном стрел, с прикрепленными восемью мечами, С выстроенными по порядку копьями,", "commentary": {"tilaka": "अत एव व्योमचरमसङ्गचारिणम् पर्वतादिष्वपीति भावः । समाहितं सज्जम् । तूण इषुधिः । अष्टसु दिक्ष्वसिभिः सह निबद्धा बन्धुरा रथफलका यस्मिंस्तम् । यथाक्रमं यथास्थानमावेशितं शक्तितोमरं यस्मिंस्तम्", "bhusana": "सुरासुराधृष्यमसङ्गचारिणं रविप्रभं व्योमचरं समाहितम् ।\n\nसतूणमष्टासिनिबद्धबन्धुरं यथाक्रमावेशितशक्तितोमरम्\nसमाहितं सज्जीकृतम् । अष्टासिनिबद्धबन्धुरम् अष्टासिभिर्निबद्धम् अत एव बन्धुरं सुन्दरम् । \"बन्धुरं सुन्दरे नम्रे\" इति विश्वः । यद्वा अष्टासिभिर्निबद्धं बन्धुरं यस्य स तथा । बन्धुरं फलकासङ्घाट इत्याहुः । अन्ये घण्टा इत्यप्याहुः । तदानीम् अष्टासिश्चासौ निबद्धबन्धुरश्चेति समासः । यथाक्रमावेशितशक्तितोमरं पङ्क्तितया स्थापितशक्तितोमरम्", "siromani": "असंगचारिणं निरालम्बगमनशीलम् अत एव व्योमचरम् समाहितं सम्यक् संस्थापितं सतूणमिषुधिसहितम् अष्टभिरसिभिर्निबद्धा बन्धुरा यस्य यथाक्रममावेशितानि शक्तितोमराणि यस्मिन्"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Неостановимо летящей как молния (asaṅgacāriṇaṃ taḍitprabhaṃ vyomacaraṃ samāhitam) – букв. «движущейся, не зная препятствий, сияющей как молния, летающей по небу, [полностью] экипированной». Во многих рукописях стоит вариант raviprabham «сияющей как солнце»."}, {"id": "lexical:5.47.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "asaṅgacārin", "note_ru": "Асанга-чарин (asaṅga-cārin, adj.) — бахуврихи: asaṅga «без препятствий, без привязанностей» (a-+saṅga, √sañj-, «прилипать, задерживаться») + cārin «движущийся» (√car-, «двигаться»). MW: asaṅga 'unattached, free from bonds'; cārin 'going, moving'. Применительно к боевой колеснице asaṅgacārin означает «движущуюся без препятствий» — технически непреодолимую машину. Но за военным смыслом стоит йогический: asaṅga («непривязанность») в упанишадах описывает освобождённое сознание. Колесница Акши парадоксально наделяется атрибутом мокши — движение без кармической задержки.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:asaNgacArin", "collision_tier1": true}, {"id": "phase2:5.47.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bandhura", "note_ru": "Бандхура (bandhura) в составе aṣṭāsinibaddhabandhuram — тёмное место: «Бхушана» приводит подряд три толкования (украшенные восемью мечами борта колесницы; по другим — набор дощатых щитков; по третьим — колокольцы), не выбирая между ними.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "вскрывает подлинную текстологическую тёмность редкого слова, которую подстрочник («с прикреплёнными восемью мечами») сглаживает до одного, отнюдь не единственного традиционного толкования", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.47.7", "verse": "7", "sanskrit_iast": "sa pūrayan khaṃ ca mahīṃ ca sācalāṃ; । turaṃgamataṅgamahārathasvanaiḥ । balaiḥ sametaiḥ sahatoraṇasthitaṃ; । samartham āsīnam upāgamat kapim ॥7॥", "leonov_ru": "Он, наполняя небо и землю с горами Звуком коней, слонов и великих колесниц, Вместе с войсками к пребывающей на арке Могучей сидящей приблизился обезьяне.", "commentary": {"tilaka": "तोरणस्थितं तोरणाश्रयम् आसीनमुपविष्टम्\nबाणासनमेव शक्रकार्मुकं यस्य सः", "bhusana": "स पूरयन् खं च महीं च साचलां तुरङ्गमातङ्गमहारथस्वनैः ।\n\nबलैः समेतैः स हि तोरणस्थितं समर्थमासीनमुपागमत् कपिम्\nसः अक्षः । हिः प्रसिद्धौ", "siromani": "स इति । स कुमारः तुरङ्गादिस्वनैः खादीन् पूरयन् सन् तोरणस्थितं तोरणावलम्बमासीनं कपिमुपागमत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Наполняя небо и землю шумом (sa pūrayan khaṃ ca mahīṃ ca sācalāṃ) – букв. «небо и землю с горами»."}]}, {"verse_id": "5.47.8", "verse": "8", "sanskrit_iast": "sa taṃ samāsādya hariṃ harīkṣaṇo; । yugāntakālāgnim iva prajākṣaye । avasthitaṃ vismitajātasambhramaḥ; । samaikṣatākṣo bahumānacakṣuṣā ॥8॥", "leonov_ru": "Он, желтоглазый, приблизившись к той обезьяне, Подобной огню, который разрушит мир в конце юги, когда все живые существа погибнут, Смутившийся от изумления, Смотрел [на Ханумана] Акша почтительным взглядом.", "commentary": {"tilaka": "हरीक्षणः सिंहवत्क्रूरदृष्टिः । युगान्तकालाग्निवत्प्रजाश्रये ऽवस्थितं हरिं समासाद्य तमेवैक्षत विस्मितं च तं जातसंभ्रमं च बालो ऽयं मां योद्धुमिच्छतीति विस्मयः रावणपुत्रत्वाच्च तत्र जातादरत्वम्", "bhusana": "स तं समासाद्य हरिं हरीक्षणो युगान्तकालाग्निमिव प्रजाक्षये ।\n\nअवस्थितं विस्मितजातसंभ्रमः समैक्षताक्षो बहुमानचक्षुषा\nहरीक्षणः सिंहप्रेक्षणः । प्रजाक्षये अवस्थितं प्राणिनाशे प्रवृत्तम् । विस्मितश्चासौ जातसम्भ्रमश्च विस्मितजातसम्भ्रमः", "siromani": "स इति । हरीक्षणः सिंहवद्भयंकरदृष्टिः सो ऽक्षकुमारः प्रजाक्षये कालाग्निमिवावस्थितं विस्मितेन कुमारो ऽयं मया कथं योद्धुमिच्छतीति विस्मयेन जातः संभ्रम उद्वेगो यस्मिन् तं हनुमन्तमक्षः बहुमानचक्षुषा अतिगर्वदृष्ट्या ऐक्षत"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Желтоглазый… (harīkṣaṇo) – в комментарии «Тилака» этот эпитет толкуется как «со взглядом жестоким, как у льва» (siṃhavatkrūradṛṣṭiḥ). Голдмены в своем переводе придерживаются этой интерпретации (см.: Goldman 1984: 238).Подобному огню, что разрушит вселенную (yugāntakālāgnim iva prajākṣaye) – букв. подобному огню конца юги после уничтожения живых существ»."}, {"id": "lexical:5.47.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "yugāntakālāgni", "note_ru": "Юганта-кала-агни (yuga-anta-kāla-agni, m.) — тат-пуруша: yuga «мировой цикл» + anta «конец» + kāla «время» + agni «огонь». MW: yugānta 'end of an age/yuga'; kālāgni 'the fire of time/destruction'. Хануман = огонь конца юги (yugāntakālāgni) в момент prajākṣaya («гибели всех существ»). Этот огонь в индийской космологии — абсолютный вселенский пожар (самвартагни), сжигающий всю материю. Показательно: Акша смотрит на Ханумана с изумлением (vismitajātasambhrama), а не со страхом — он распознаёт масштаб угрозы, что характеризует его как истинного кшатрия.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:yugAntakAlAgni", "collision_tier1": true}]}, {"verse_id": "5.47.9", "verse": "9", "sanskrit_iast": "sa tasya vegaṃ ca kaper mahātmanaḥ; । parākramaṃ cāriṣu rāvaṇātmajaḥ । vicārayan svaṃ ca balaṃ mahābalo; । yugakṣaye sūrya ivābhivardhata ॥9॥", "leonov_ru": "О быстроте той обезьяны, великой духом, И о мощи в отношении врагов сын Раваны Размышляя, и о своей силе, наделенный великой силой, Увеличился (собрался с силами), словно солнце при гибели юги.", "commentary": {"tilaka": "अभिवर्धत तेजसा ऽभ्यवर्धतेत्यर्थः", "bhusana": "स तस्य वेगं च कपेर्महात्मनः पराक्रमं चारिषु पार्थिवात्मजः ।\n\nविधारयन् स्वं च बलं महाबलो हिमक्षये सूर्य इवाभिवर्धते", "siromani": "स इति । रावणात्मजः सो ऽक्षः कपेर्वेगम् अरिषु पराक्रमं च स्वं बलं पराक्रमं च विचारयन् न्यूनाधिकभावं चिन्तयन् सन् युगक्षये सूर्य इव अभिवर्धत अभ्यवर्धत"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Солнце при разрушении мира (yugakṣaye sūrya) – букв. «солнце в конце юги». Также в рукописях встречается вариант himakṣaye (в конце зимы). И вырос… (abhivardhata) – в комментарии «Тилака» отмечается, что речь идет о силе (tejas) Акши."}]}, {"verse_id": "5.47.13", "verse": "13", "sanskrit_iast": "rarāsa bhūmir na tatāpa bhānumān । vavau na vāyuḥ pracacāla cācalaḥ । kapeḥ kumārasya ca vīryasaṃyugaṃ । nanāda ca dyaur udadhiś ca cukṣubhe ॥13॥", "leonov_ru": "Затряслась земля, и померкло солнце, Ветер не дул, и гора задрожала, При отважной битве обезьяны и царевича (когда в битве сошлись Хануман и царевич) Загремело [громом] небо, океан взволновался (гром грянул в небе, океан взволновался).", "commentary": {"tilaka": "भूमिर्भूमिस्थप्राणिजातं ररास । वीर्यप्रवृत्तं संयुगम् । वीक्ष्येति शेषः", "bhusana": "ररास भूमिर्न तताप भानुमान् ववौ न वायुः प्रचचाल चाचलः ।\n\nकपेः कुमारस्य च वीक्ष्य संयुगं ननाद च द्यौरुदधिश्च चुक्षुभे\nररासेति । न तताप भानुमान् । सूर्योदयः पूर्वं सूचितः सः न ततापेत्युच्यते", "siromani": "ररासेति । कपेः, कुमारस्य च वीर्यसंयुगम् । अतिवीर्यहेतुकसंग्रामम् अवलोक्येति शेषः, भूप्रभृतिः रासप्रभृतिं न चकार"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Закричала земля… (rarāsa bhūmiḥ) – в комментарии «Тилака» отмечается, что речь идет о живых существах земли."}, {"id": "lexical:5.47.13:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "acala", "note_ru": "Ачала (acala, m.) — «неподвижный, гора» (a-+√cal-, «двигаться»). MW: acala 'immovable; a mountain'. Принципиально: в шлоке 13 acalaḥ pracacāla — «недвижимое задрожало». Это оксюморон с этимологическим ключом: acala по самой своей природе «не-двигающееся», и вот оно движется. Землетрясение при схватке Ханумана и Акши нарушает онтологический порядок: солнце гаснет, ветер стихает, гора содрогается. Нарушение законов природы — стандартный эпический маркер сражения богоравных существ; лексема acala делает этот парадокс семантически явным.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:acala", "collision_tier1": true}]}, {"verse_id": "5.47.14", "verse": "14", "sanskrit_iast": "sa tasya vīraḥ sumukhān patatriṇaḥ । suvarṇapuṅkhān saviṣān ivoragān । samādhisaṃyogavimokṣatattvavic । charān atha trīn kapimūrdhny atāḍayat ॥14॥", "leonov_ru": "Тот отважный [Акша] с хорошими наконечниками, оперенных, С золотым оперением, подобных ядовитым змеям, Знающий, как концентрироваться (целиться), накладывать стрелу на лук и выпускать ее, Тогда три стрелы выпустил в голову обезьяны.", "commentary": {"tilaka": "समाधिर्लक्ष्यदर्शनम्, संयोगः शरसन्धानम्, विमोक्षः संहितस्य त्यागः, तेषां तत्त्ववीत् । अताडयदपातयत्", "bhusana": "ततः स वीरः सुमुखात् पतत्त्रिणः सुवर्णपुङ्खान् सविषानिवोरगान् ।\n\nसमाधिसंयोगविमोक्षतत्त्वविच्छरानथ त्रीन् कपिमूर्ध्न्यपातयत्\nसमाधिसंयोगविमोक्षतत्त्ववित् समाधिः लक्ष्यवेदनं संयोगः शरसन्धानं विमोक्षः तद्विसर्गः तेषां तत्त्ववित् यथार्थवित्", "siromani": "स इति । तस्य बाणस्य समाधिसंयोगविमोक्षः तत्त्ववित् समाधिर्लक्ष्यदर्शनं संयोगः शरसंधानं विमोक्षः तस्य त्यागः तेषां तत्त्वस्य याथार्थ्यस्य वेदिता वीरः सो ऽक्षकुमारसुवर्णपुङ्खान् स्वर्णमयपुङ्खविशिष्टान् अत एव सुमुखान् उरगानिव त्रीन् पतत्त्रिणो बाणान् कपिमूर्ध्नि अताडयन्"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…искусный лучник (samādhisaṃyogavimokṣatattvavid) – букв. «знающий, как нацеливать [стрелы], прилаживать [их] к луку и выпускать»."}, {"id": "lexical:5.47.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "samādhisaṃyogavimokṣatattvavid", "note_ru": "Самадхи-санйога-вимокша-таттва-вид (samādhi-saṃyoga-vimokṣa-tattva-vid, adj.) — сложный тат-пуруша: samādhi «концентрация / взятие» + saṃyoga «наложение (стрелы на лук)» + vimokṣa «выпускание (стрелы)» + tattva «суть» + vid «знающий». MW: samādhi — технически «взятие / установление»; saṃyoga = «наложение»; vimokṣa = «выпуск». Перечисление трёх фаз лучного искусства через йогическую терминологию (samādhi, vimokṣa — термины медитативной практики) — намеренный поэтический приём: стрельба из лука = йогическая дисциплина. Параллель с Бхагавадгитой (3.17, 18.1): kṣatriya-dharma как форма йоги.", "type": "В", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:samADi+saMmyoga+vimokza+tattvavid", "collision_tier1": true}]}, {"verse_id": "5.47.16", "verse": "16", "sanskrit_iast": "tataḥ sa plavaṅgādhipamantrisattamaḥ । samīkṣya taṃ rājavarātmajaṃ raṇe । udagracitrāyudhacitrakārmukaṃ । jaharṣa cāpūryata cāhavonmukhaḥ ॥16॥", "leonov_ru": "Тогда лучший из советников царя обезьян Увидев того сына лучшего из царей в бою С поднятым великолепным оружием и великолепным луком, Возрадовался и стал расти, обращенный к битве.", "commentary": {"tilaka": "आपूर्यत व्यवर्धत", "bhusana": "ततः स पिङ्गाधिपमन्त्रसत्तमः समीक्ष्य तं राजवरात्मजं रणे ।\n\nउदग्रचित्रायुधचित्रकार्मुकं जहर्ष चापूर्यत चाहवोन्मुखः\nआपूर्यत व्यवर्धत", "siromani": "तत इति । प्लवगाधिप एव मन्त्रिसत्तमो हनूमान् उदग्राणि अत्युत्तमानि चित्रायुधानि यस्य चित्राणि कार्मुकानि धनूंषि यस्य स एव स इति कर्मधारयः । तं राजवरात्मजमक्षं समीक्ष्य जहर्ष अपूर्यत अवर्धत च"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «лучшего из царей» Я не уверена, что так можно писать про Равану. У Г. просто великий царь, в Г-пр вообще эпитет опущен"}]}, {"verse_id": "5.47.17", "verse": "17", "sanskrit_iast": "sa mandarāgrastha ivāṃśumālī । vivṛddhakopo balavīryasaṃvṛtaḥ । kumāram akṣaṃ sabalaṃ savāhanaṃ । dadāha netrāgnimarīcibhis tadā ॥17॥", "leonov_ru": "Он, подобный солнцу, стоящему на вершине [горы] Мандары, Разъяренный, исполненный силы и мужества, Царевича Акшу с войском и колесницами Стал сжигать лучами огня глаз тогда.", "commentary": {"tilaka": "मन्दराग्रस्थत्वेन मध्यन्दिनस्थत्वं लक्ष्यते", "bhusana": "स मन्दराग्रस्थ इवांशुमालिको विवृद्धकोपो बलवीर्यसंयुतः ।\n\nकुमारमक्षं सबलं सवाहनं ददाह नेत्राग्निमरीचिभिस्तदा\nमन्दराग्रस्थः मन्दरो नाम भूमध्यपर्वतः । तदग्रे मध्याह्ने वर्तत इत्यौग्र्योक्तिः 5.47.17 ।।\n\nततः स बाणासनचित्रकार्मुकः शरप्रवर्षो युधि राक्षसाम्बुदः ।\n\nशरान् मुमोचाशु हरीश्वराचले वलाहको वृष्टिमिवाचलोत्तमे", "siromani": "स इति । विवृद्धकोपः मन्दराग्रस्थों ऽशुमाली सूर्य इव हनूमान् अक्षं कुमारं नेत्राग्निमरीचिभिः ददाह इव"}, "has_tier1": false, "notes": [{"id": "phase2:5.47.17:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mandarāgrastha", "note_ru": "«Стоящий на вершине Мандары» (mandarāgrasthaḥ) — и «Тилака», и «Бхушана» читают этот образ как указание на полдень: Мандара — центральная гора мира, и «пребывание на её вершине» означает солнце в зените, а сама гипербола (стоять на вершине горы в полдень) отмечена «Бхушаной» как аугрьокти, намеренное преувеличение.", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "вносит временную координату (полдень) и называет риторический приём (гипербола) там, где подстрочник передаёт только зрительный образ без этих слоёв", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.47.20", "verse": "20", "sanskrit_iast": "sa bālabhāvād yudhi vīryadarpitaḥ । pravṛddhamanyuḥ kṣatajopamekṣaṇaḥ । samāsasādāpratimaṃ raṇe kapiṃ । gajo mahākūpam ivāvṛtaṃ tṛṇaiḥ ॥20॥", "leonov_ru": "Он из-за [своей] юности гордый [своим] мужеством в битве, Разъяренный, с глазами, [цветом] подобными крови, Напал на несравненную в бою обезьяну, Словно слон на огромный колодец, скрытый травами.", "commentary": {"tilaka": "तृणैरावृतं महाकूपं गजपातनार्थकृतगर्तम्", "bhusana": "स बालभावाद्युधि वीर्यदर्पितः प्रवृद्धमन्युः क्षतजोपमेक्षणः ।\n\nसमाससादाप्रतिमं कपिं रणे गजो महाकूपमिवावृतं तृणैः", "siromani": "स इति । बालभावात् बालत्वाद्धेतोः वीर्यदर्पितः प्रवृद्धः मन्युर्यस्य क्षतजोपमे ईक्षणे यस्य सः अक्षः रणे अप्रतिमं कपिं तृणैरावृतं कूपमिव समाससाद प्राप"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Словно слон – на яму, травами скрытую (gajo mahākūpam ivāvṛtaṃ tṛṇaiḥ) – средневековые комментаторы отмечают, что речь идет о ловушке, вырытой для поимки слона."}, {"id": "lexical:5.47.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bālabhāva", "note_ru": "Бала-бхава (bāla-bhāva, m.) — тат-пуруша: bāla «юный, неопытный» + bhāva «бытие, состояние» (√bhū-, «быть»). MW: bāla 'young, childish'; bhāva 'becoming, being; nature, disposition'. Bālabhāvād — «из-за [своего] состояния юности» — содержит амбивалентность: юность делает Акшу vīryadarpita (гордым доблестью), что положительно (кшатрийская смелость), но и уязвимым для переоценки себя. Это типичный эпический мотив hamartia юного героя. Скрытая дхармическая коннотация: именно bālabhāva мешает полноте военной мудрости, которую дают опыт и tapas.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:bAlaBava", "collision_tier1": true}]}, {"verse_id": "5.47.23", "verse": "23", "sanskrit_iast": "sa tāñ śarāṃs tasya harir vimokṣayamś । cacāra vīraḥ pathi vāyusevite । śarāntare mārutavad viniṣpatan । manojavaḥ saṃyati caṇḍavikramaḥ ॥23॥", "leonov_ru": "Обезьяна, уклоняясь от его стрел, Помчалась, отважная, по пути ветра, Между стрелами, словно ветер, летя, Быстрая, как мысль, обладающая свирепой отвагой в битве.", "commentary": {"bhusana": "द्विजातिमुख्यैः हविषा उदीरितः अभिवर्धितः पावक इवेत्यन्वयः\nस तान् शरांस्तस्य हरिर्विमोक्षयंश्चचार वीरः पथि वायुसेविते ।\n\nशरान्तरे मारुतवद्विनिष्पतन् मनोजवः संयति चण्डविक्रमः\nस तानिति । विमोक्षयन् शरीरे असंयोजयन् । लाघवातिशयेनेति भावः", "siromani": "स इति । शरान्तरे शराणामन्तरं मध्यं यस्मिन् तस्मिन् संयति संग्रामे शरान्तरे शरमध्ये विनिष्पतन्नपि हरिः स हनूमान् तस्य कुमारस्य तान् शरान् विमोक्षयन् स्वकर्मकस्पर्शाभावं प्रापयन् सन् वायुसेविते पथि चचार"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.23:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "От стрел его уклоняясь (śarāṃs tasya… vimokṣayan) – автор комментария «Тилака» глоссирует слово vimokṣayan как vyarthīkurvan (делая бесполезными). Автор комментария «Бхушана» поясняет: śarīre asaṃyojayan (не давая вонзиться в тело)."}]}, {"verse_id": "5.47.26", "verse": "26", "sanskrit_iast": "abālavad bāladivākaraprabhaḥ । karoty ayaṃ karma mahan mahābalaḥ । na cāsya sarvāhavakarmaśālinaḥ । pramāpaṇe me matir atra jāyate ॥26॥", "leonov_ru": "«Не подобный ребенку, блеском подобный юному солнцу, Совершает он дело великое, могучий, Его, искусного во всех военных делах, Не убивать моя мысль тут возникает.", "commentary": {"tilaka": "चिन्ताप्रकारः-- अबालवदिति । सर्वाहवकर्मशालिनः सर्वप्रकाराहवकर्मशालिनः । अत्रास्मिन्काले ऽस्य प्रमापणे मे मतिर्न जायते । \"प्रमापणे मारुतिरत्र जायते\" इति पाठे \"अयं जनः\" इतिवत्स्वस्यैव हनुमता मारुतिरिति निर्देशः", "bhusana": "अबालवद्बालदिवाकरप्रभः करोत्ययं कर्म महन्महाबलः ।\n\nन चास्य सर्वाहवकर्मशोभिनः प्रमापणे मे मतिरत्र जायते", "siromani": "चिन्ताकारमाह अबालवदिति । बालदिवाकरप्रभः अयं कुमारः अबालवत्कर्म करोति अतः सर्वाहवकर्मशालिनः आहवनिखिलक्रियाविज्ञातुः अस्य प्रमापणे विध्वंसने अत्र अस्मिन्समये मे मतिर्न जायते"}, "has_tier1": false, "notes": [{"id": "phase2:5.47.26:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mārutiḥ (var.)", "note_ru": "«Не возникает во мне решимости убить его» (pramāpaṇe me matir... na jāyate) — по «Тилаке», в некоторых списках вместо me matiḥ стоит вариант mārutiḥ: тогда Хануман говорит о себе в третьем лице («Марути [то есть я] не решается его убить») — оборот, по «Тилаке» аналогичный «этот человек» вместо «я».", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "фиксирует конкретный вариант чтения (mārutiḥ вместо me matiḥ) с реальным следствием для того, как понимать субъект фразы — самоименование Ханумана в третьем лице", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.47.29", "verse": "29", "sanskrit_iast": "na khalv ayaṃ nābhibhaved upekṣitaḥ । parākramo hy asya raṇe vivardhate । pramāpaṇaṃ hy asya mamādya rocate । na vardhamāno 'gnir upekṣituṃ kṣamaḥ ॥29॥", "leonov_ru": "«Воистину, не одолеет он [меня], если я не отнесусь к нему с пренебрежением, Ибо его доблесть возрастает в битве. Надлежит мне убить его, [Ибо] нельзя пренебрегать разгорающимся огнем».", "commentary": {"bhusana": "न खल्वयं नाभिभवेदुपेक्षितः पराक्रमो ह्यस्य रणे विवर्धते ।\n\nप्रमापणं त्वेव ममास्य रोचते न वर्धमानो ऽग्निरुपेक्षितुं क्षमः", "siromani": "नेति । यतो ऽस्य रणे पराक्रमो विवर्धते अत उपेक्षितो ऽयं मां नाभिभवेत् अभिभवेदेवेत्यर्थः । अतः अस्य प्रमापणं नाशनं मम रोचते । हि यतः वर्धमानो ऽग्निः उपेक्षितुं न क्षमः"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.29:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Мне надлежит убить царевича (pramāpaṇaṃ hy asya mamādya rocate) – Голдмены переводят как «У меня нет другого выбора, кроме как убить его» (I have really no choice but to kill him) (см.: Goldman 1984: 240), учитывая, что несколькими строфами ранее Хануман выражал нежелание убивать Акшу."}, {"id": "lexical:5.47.29:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vardhamānāgni", "note_ru": "Вардхаман-агни (vardhāmāna-agni, m.) — «разгорающийся огонь». Vardhamāna — причастие настоящего времени от √vṛdh- («возрастать, разгораться», Whitney #834). Хануман использует этот образ в внутреннем монологе: vardhamāno 'gnir upekṣituṃ na kṣamaḥ — «разгорающийся огонь нельзя не замечать». Это прямая цитата из нитишастры — максима государственного управления: врага (как огонь) следует гасить в зародыше, пока он не стал неодолимым. Хануман в этот момент рассуждает языком раджанити, а не личной вражды.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:varDamAna+agni", "collision_tier1": true}]}, {"verse_id": "5.47.32", "verse": "32", "sanskrit_iast": "tatas talenābhihato mahārathaḥ । sa tasya piṅgādhipamantrinirjitaḥ । sa bhagnanīḍaḥ parimuktakūbaraḥ । papāta bhūmau hatavājir ambarāt ॥32॥", "leonov_ru": "Тогда великий воин, сражающийся на колеснице, ударенный ладонью, Побежденный советником царя обезьян, Чье сиденье в колеснице было разбито, ось отлетела, Упал на землю с неба тот, чьи кони были убиты.", "commentary": {"bhusana": "इदमेवोपपादयति ततश्शरैरित्यादिना ।। 5.47.25,26।।\n\nअयं महात्मा च महांश्च वीर्यतः समाहितश्चातिसहश्च संयुगे ।\n\nअसंशयं कर्मगुणोदयादयं सनागयक्षेर्मुनिभिश्च पूजितः\nततस्तलेनाभिहतो महारथः स तस्य पिङ्गाधिपमन्त्रिनिर्जितः ।\n\nप्रभग्ननीडः परिमुक्तकूबरः पपात भूमौ हतवाजिरम्बरात्\nतलेनाभिहतः अत एव पिङ्गाधिपमन्त्रिनिर्जितः, हनुमता निर्जित इत्यर्थः । प्रभग्ननीडः प्रभग्नरथाङ्गः । कूबरः युगन्धरः । वाजिरिति इकारान्तत्वमार्षम्", "tilaka": "नीडं रथ्यधिष्ठानस्थानम्", "siromani": "तत इति । तस्य हनूमतस्तलेनाभिहतः स भग्ननीडः भग्ननीडेन सहितः नीडं रथिस्थानं परिवृत्तः कूबरो यस्य हतवाजिः विध्वंसिताश्वः अत एव पिङ्गाधिपमन्त्रिणा सुग्रीवामात्येन निर्जितः पराभूतो महारथः सो ऽक्षः भूमौ पपात"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.32:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Побежденный министром Сугривы (piṅgādhipamantrinirjitaḥ) – букв. «побежденный министром царя рыжих»."}]}, {"verse_id": "5.47.33", "verse": "33", "sanskrit_iast": "sa taṃ parityajya mahāratho rathaṃ । sakārmukaḥ khaḍgadharaḥ kham utpatan । tato'bhiyogād ṛṣir ugravīryavān । vihāya dehaṃ marutām ivālayam ॥33॥", "leonov_ru": "Великий воин, оставив колесницу, С луком и мечом в небо взлетел Тогда, как риши, благодаря подвижничеству наделенный грозной силой, [Поднимается], оставив тело, в обитель ветра.", "commentary": {"tilaka": "मरुतामालयं स्वर्गमुत्पतन्नृषिरिव", "bhusana": "स तं परित्यज्य महारथो रथं सकार्मुकः खड्गधरः खमुत्पतन् ।\n\nतपोभियोगादृषिरुग्रवीर्यवान् विहाय देहं मरुतामिवालयम्", "siromani": "स इति । तं भग्नं रथं परित्यज्य खमुत्पतन् सन् सो ऽक्षकुमारः तपोभियोगात् तपो ऽतिबलात् देहं विहाय मरुतां देवानामालयमुत्पतन् ऋषिरिव बभूवेति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.33:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "…в обитель марутов (marutām ivālayam) – то есть на небеса. Автор комментария «Широмани» объясняет это выражение как «обитель богов» (dēvānām ālayam). Голдмены отмечают, что слово «маруты» иногда используется как синоним слова «боги» (см.: Goldman 1984: 479) и переводят «to the abode of the gods» (см.: Goldman 1984: 241).[Е. Костина] «.» Из-за краткости по переводу непонятно, кто в итоге покинул тело. Можно подумать, что Акша оставил тело, можно подумать, что риши умер, оставил тело и отправился на небеса (а не по своему желанию)"}]}, {"verse_id": "5.47.34", "verse": "34", "sanskrit_iast": "kapis tatas taṃ vicarantam ambare । patatrirājānilasiddhasevite । sametya taṃ mārutavegavikramaḥ । krameṇa jagrāha ca pādayor dṛḍham ॥34॥", "leonov_ru": "Обезьяна тогда его, летящего в небе, Где летают царь птиц (Гаруда), ветер и сиддхи, Сойдясь с ним постепенно, могучая, словно ветер, Схватила его крепко за ноги.", "commentary": {"tilaka": "पतत्त्रीति । गरुडवायुसिद्धसेविते तं समेत्य तं पादयोर्जग्राहेत्यन्वयः", "bhusana": "ततः कपिस्तं विचरन्तमम्बरे पतत्त्रिराजानिलसिद्धसेविते ।\n\nसमेत्य तं मारुततुल्यविक्रमः क्रमेण जग्राह स पादयोर्दृढम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.34:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Гаруды, ветра и сиддхов,» комм потом нужен будет"}]}, {"verse_id": "5.47.35", "verse": "35", "sanskrit_iast": "sa taṃ samāvidhya sahasraśaḥ kapir । mahoragaṃ gṛhya ivāṇḍajeśvaraḥ । mumoca vegāt pitṛtulyavikramo । mahītale saṃyati vānarottamaḥ ॥35॥", "leonov_ru": "Покрутив его тысячу раз, обезьяна, Подобно владыке птиц (Гаруде), схватившего огромную змею, Швырнул стремительно, доблестью равный отцу, На землю в бою лучший из обезьян.", "commentary": {"siromani": "कपिरिति । रणचण्डविक्रमम् अक्षं कुमारं संयुगे प्रसमीक्ष्य कपिर्हर्षान्ननाद\nकपिरिति । पतत्त्रिराजानिलसिद्धानां सेविते ऽम्बरे विचरन्तं तमक्षकुमारं क्रमेण समेत्य कपिर्हनूमान् पादयोर्दृढं जग्राह\nस इति । वानरोत्तमः कपिः स हनूमान् तमक्षं गृह्य गृहीत्वा सहस्रशो ऽनेकवारं समाविध्य भ्रामयित्वा वेगान्महीतले मुमोच । तत्र दृष्टान्तः महोरगमण्डजेश्वरो गरुड इव", "bhusana": "स तं समाविध्य सहस्रशः कपिर्महोरगं गृह्य इवाण्डजेश्वरः ।\n\nमुमोच वेगात् पितृतुल्यविक्रमो महीतले संयति वानरोत्तमः\nगृह्य इवेत्यत्र गुणाभाव आर्षः"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.35:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «vānarottamaḥ» эпитет в комм?"}, {"id": "lexical:5.47.35:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āṇḍajeśvara", "note_ru": "Андаджешвара (āṇḍaja-īśvara, m.) — бахуврихи: āṇḍaja «рождённый из яйца» + īśvara «владыка» = «владыка яйцерождённых» = Гаруда. MW: āṇḍaja 'oviparous, any oviparous creature, a bird'; āṇḍajeśvara 'lord of birds = Garuda'. Сравнение с Гарудой, держащим mahoraga (огромную змею), — эпически устойчивый образ захвата и господства. Хануман крутит Акшу sahasraśaḥ (тысячу раз) — это не боевой приём, а ритуальное уничтожение через сакральное число. Гаруда и змея — также символы противостояния богов и демонов (наги как союзники ракшасов).", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:ANDajeSwara", "collision_tier1": true}]}, {"verse_id": "5.47.36", "verse": "36", "sanskrit_iast": "sa bhagnabāhūrukaṭīpayodharaḥ । kṣarann asṛn nirmathitāsthilocanaḥ । sabhinnasaṃdhiḥ pravikīrṇabandhano । hataḥ kṣitau vāyusutena rākṣasaḥ ॥36॥", "leonov_ru": "Со сломанными руками, бедрами и грудью, Истекая кровью, с разрушенными костями и глазами, С разбитыми суставами, с разорванными сухожилиями, На земле [лежал] ракшас, убитый сыном ветра.", "commentary": {"bhusana": "स भग्नबाहूरुकटीशिरोधरः क्षसन्नसृङ्निर्मथितास्थिलोचनः ।\n\nस भग्रसन्धिः प्रविकीर्णबन्धनो हतः क्षितौ वायुसुतेन राक्षसः ।\n\nमहाकपिर्भूमितले निपीड्य तं चकार रक्षोधिपतेर्महद्भयम्\nप्रविकीर्णबन्धनः प्रवीकीर्णकक्ष्यादिबन्धनः । प्रभिन्नसन्धिरिति सन्धिबन्धभङ्गस्योक्तत्वात्", "siromani": "स इति । वायुसुतेन हतः अत एव भग्ना बाह्वादयो यस्य निर्मथितानि अस्थिलोचनानि यस्य भिन्नाः सन्धयो यस्य प्रविकीर्णानि बन्धनानि यस्य राक्षसः क्षितौ अपतदिति शेषः"}, "has_tier1": false, "notes": [{"id": "lexical:5.47.36:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nirmathita", "note_ru": "Нирматхита (nir-mathita, p.p.p.) — от nir+√manth-/√math- («сбивать, перемалывать, разрушать», Whitney #486). MW: nirmathita 'churned, shattered, destroyed'. Корень √manth-/math- сакрально нагружен: именно manthan — пахтание Молочного океана (Samudramanthana) — центральный космогонический миф. Nirmathita asthi-locana — «перемолотые кости и глаза» — использует корень первозданного разрушения. Смерть Акши семантически перекликается с пахтанием: из хаоса Samudramanthana вышли яды и нектар; гибель принца — тоже трагический момент, из которого выйдет нечто новое (приход Индраджита).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:nirmaTita"}]}, {"verse_id": "5.47.37", "verse": "37", "sanskrit_iast": "mahākapir bhūmitale nipīḍya taṃ । cakāra rakṣo'dhipater mahad bhayam । maharṣibhiś cakracarair samāgataiḥ । sametya bhūtaiś ca sayakṣapannagaiḥ । suraiś ca sendrair bhṛśajātavismayair । hate kumāre sa kapir nirīkṣitaḥ ॥37॥", "leonov_ru": "Великая обезьяна, на землю его низвергнув, Причинила великий страх владыке ракшасов. Великие риши и чакрачары (видьядхары), Бхуты, якши и змеи, Боги с Индрой, вместе собравшись, в великом изумлении Смотрели на ту обезьяну, когда был убит царевич.", "commentary": {"tilaka": "समाविद्ध्य भ्रामयित्वा । गृह्य इव । असन्धिल्यपावार्षौ । गृहीत्वेवेत्यर्थः ।। 5.47.35,36 ।।\n\nचक्रचरैर्ज्योतिश्चक्रचरैर्ग्रहादिभिः समेत्य समागतैर्जातविस्मयैर्निरीक्षित इत्यन्वयः", "bhusana": "महर्षिभिश्चक्रचरैर्महाव्रतैः समेत्य भूतैश्च सयक्षपन्नगैः ।\n\nसुरैश्च सैन्द्रैर्भृशजातविस्मयैर्हते कुमारे स कपिर्निरीक्षितः", "siromani": "महाकपिरिति । तमक्षं भूमितले निपीड्य रक्षोधिपतेः महद्भयं चकार । अर्धं पृथक् महर्षिभिरिति । कुमारे हते सति जातविस्मयैः महर्षिभृतिभिः कपिः स हनूमान् निरीक्षितो बभूवेति शेषः । सार्धश्लोक एकान्वयी"}, "has_tier1": true, "notes": [{"id": "tier1:5.47.37:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] ? [кат.2 — многозначность] бхута (bhūta) — «существо» или «дух»?"}]}, {"verse_id": "5.47.38", "verse": "38", "sanskrit_iast": "nihatya taṃ vajrasutopamaṃ raṇe । kumāram akṣaṃ kṣatajopamekṣaṇam । tad eva vīro 'bhijagāma toraṇaṃ । kṛtakṣaṇaḥ kāla iva prajākṣaye ॥38॥", "leonov_ru": "Убив в бою того подобного сыну Индры (Джаянте) Царевича Акшу, чьи глаза были [цветом] подобны крови, Поднялся тогда отважный (Хануман) на арку, Сло ;
const KEY = "sundara_apparatus_s47_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

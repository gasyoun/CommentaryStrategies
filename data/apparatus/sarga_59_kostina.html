book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Верно, весьма могуществен (sarvathātiprakṛṣṭo 'sau) - автор комментария “Тилака” поясняет, что речь идет о тапасе, накопленном Раваной.", "service": [], "suggestions": [], "seq": 4}]}, {"verse_id": "5.59.5", "verse": "5", "sanskrit_iast": "na tad agniśikhā kuryāt saṃspṛṣṭā pāṇinā satī । janakasya sutā kuryād yat krodhakaluṣīkṛtā ॥5॥", "leonov_ru": "Пламя, которого коснулись рукой, не сделает того, Что может сделать дочь Джанаки, охваченная гневом.", "commentary": {"siromani": "तदाकारमाह सफल इत्यादिभिः । सीतायाः शीलं रामैकनिष्ठस्वभावम् आसाद्य विज्ञाय मम मनः प्रीणितं तृप्तम् अत एव राघवोद्योगः सुग्रीवस्य संभ्रमः राघवादरश्च सफलः\nतदेव पोषयन्नाह नेति । क्रोधकलुषीकृता जनकस्य सुता यद्दहनं न कुर्यात्तद्दहनं पाणिसंस्पृष्टा अग्निशिखा न कुर्यात् । एतेन सीतायाः सामर्थ्यातिशयः सूचितः । तेन सीतायाः अधिकः कोपो न जात इति ध्वनितम्", "bhusana": "न तदग्निशिखा कुर्यात् संस्पृष्टा पाणिना सती ।\n\nजनकस्यात्मजा कुर्याद्यत् क्रोधकलुषीकृता\nतर्हि सीताशीलं दुर्बलमस्माकं किमुपकरिष्यतीत्याशङ्क्य नेत्याह न तदिति । सीताशीलमेव बलीयस्त्वादुपकरिष्यतीत्यर्थः । क्रोधकलुषीकृतेति वचनाद्भर्तृमुखेन वैरनिर्यातनं वीरपत्नीधर्मः । अन्यथा महालाघवं भर्तुरित्यद्यापि पारतन्त्र्यपालनाय तादृक्क्रोधाकरणाद्रावणो जीवतीति गम्यते । एतदोवोक्तं प्राक् \"असन्देशात्तु रामस्य तपसश्चानुपालनात् । न त्वां कुर्मि दशग्रीव भस्म भस्मार्ह तेजसा ।।\" इति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "lexical:5.59.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "satī", "note_ru": "Сати (satī, f.) — «истинная, добродетельная; сама добродетель», f. от sat (p.p.p. от √as-, «быть»; дословно «сущая», «истинная»). MW: satī 'a virtuous woman, faithful wife; a woman who burns herself with her husband's body'. В стихе «agniśikhā saṃspṛṣṭā pāṇinā satī» — «пламя, которого коснулась рукой сати (добродетельная женщина)». Satī здесь — не обряд самосожжения (это более позднее значение), а архаический правовой термин: женщина, чья дхармическая верность создаёт охранную ауру. Контраст: agni-śikhā (пламя) слабее satī — метафизическая иерархия, в которой нравственная сила выше физической стихии.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:satI+dic_apte:satI", "source_links": [{"label": "MW satI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=satI"}, {"label": "APTE satI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=satI"}], "seq": 5}, {"id": "phase2:5.59.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "krodhakaluṣīkṛtā", "note_ru": "Бхушана поясняет ход мысли Ханумана через отсылку к его же более ранним словам, обращённым к Раване: «Не по повелению Рамы и не ради сохранения его подвижничества я не превращаю тебя, достойного испепеления, в пепел своим блеском» — то есть щажение Раваны было волевым самоограничением Ханумана, а не бессилием; тем разительнее гнев Ситы, которая никого не щадит.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "подстрочник передаёт лишь сравнение силы гнева Ситы с огнём; Бхушана поясняет логическую связь с более ранним эпизодом (пощада Раваны Хануманом была намеренной, а не вынужденной), усиливающую контраст с безудержным гневом Ситы", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 6}]}, {"verse_id": "5.59.6", "verse": "6", "sanskrit_iast": "jāmbavatpramukhān sarvān anujñāpya mahākapīn । asminnevaṃgate kārye bhavatām ca nivedite । nyāyyam sma saha vaidehyā draṣṭum tau pārthivātmajau ॥6॥", "leonov_ru": "Попросив позволения уйти у всех обезьян во главе с Джамбаваном, После того, как рассказано вам таким образом об этом деле, Должно вместе с Вайдехи [освободив ее от Раваны] увидеть тех двух царевичей.", "commentary": {"bhusana": "जाम्बवत्प्रमुखान् सर्वाननुज्ञाप्य महाहरीन् ।\n\nअस्मिन्नेवंगते कार्ये भवतां च निवेदिते\nन्याय्यं स्म सह वैदेह्या द्रष्टुं तौ पार्थिवात्मजौ", "tilaka": "इदानीं भृत्यजयस्यापि स्वामिसंबन्धित्वसत्त्वेन वयमेव सीतापातिव्रत्यं सहायमासाद्य रावणं जित्वा देव्या सह राघवौ द्रक्ष्यामह इत्याह-- जाम्बवदिति । जाम्बवदादीननुज्ञाप्यानुज्ञां कुर्वन्त्विति संप्रार्थ्य । अस्मिन्कार्ये सीतान्वेषणरूपे । एवंगते उक्तप्रकारं प्राप्ते । तत्प्रकारविशिष्टे च भवतां निवेदिते सति तौ पार्थिवात्मजौ वैदेह्या सन्द्रष्टुं न्याय्यमित्यब्रवीदिति शेषः", "siromani": "जाम्बवदिति । एवमनेन प्रकारेण गते सिद्धिं प्राप्ते अस्मिन् कार्ये भवतां समीपे निवेदिते सति जाम्बवत्प्रमुखान् कपीन् अनुज्ञाप्य तदाज्ञां गृहीत्वेत्यर्थः, वैदेह्या सह पार्थिवात्मजौ द्रष्टुं न्याय्यमस्माकमिति शेषः । सार्धश्लोक एकान्वयी"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "В критическом издании строфы 6-17 относятся к следующей (58-й) песни и вложены в уста Ангады (см.: Jhala 1966: 410-413).", "service": [], "suggestions": [], "seq": 7}]}, {"verse_id": "5.59.8", "verse": "8", "sanskrit_iast": "kim punaḥ sahito vīrair balavadbhiḥ kṛtātmabhiḥ । kṛtāstraiḥ plavagaiḥ śaktair bhavadbhir vijayaiṣibhiḥ ॥8॥", "leonov_ru": "А тем более – вместе с вами, отважными, могучими, держащими свой дух в узде, Искусными в стрельбе из лука обезьянами, умелыми, жаждущими победы.", "commentary": {"tilaka": "कृतास्त्रैर्देवांशत्वादस्त्रप्रयोगसमर्थैः", "bhusana": "किं पुनः सहितो वीरैर्बलवद्भिः कृतात्मभिः ।\n\nकृतास्त्रैः प्लवगैः शूरैर्भवद्भिर्विजयैषिभिः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "kṛtātmabhiḥ", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 8}, {"id": "tier1:5.59.8:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Искусно владеющими оружием (kṛtāstraiḥ) - в комментарии “Тилака” отмечается, что обезьяны владеют оружием благодаря своей полубожественной природе. В комментарии “Амритакатака” это выражение понимается как намек на неуязвимость обезьян.", "service": [], "suggestions": [], "seq": 9}]}, {"verse_id": "5.59.10", "verse": "10", "sanskrit_iast": "brāhmamastraṃ ca raudraṃ ca vāyavyaṃ vāruṇaṃ tathā । yadi śakrajito’astraṇi durnirīkṣyāṇi samyuge । tāny ahaṃ nihaniṣyāmi vidhamiṣyāmi ca rākṣasān ॥10॥", "leonov_ru": "[Даже] если стрелы Индраджита, которыми владели Брахма, Рудра, Ваю и Варуна, трудно увидеть в битве, Я отобью их и уничтожу ракшасов.", "commentary": {"tilaka": "यद्यपि दुर्निरीक्ष्याणि तथापि तान्यहं निहनिष्यामि ब्रह्मणो वरदानान्निवारयामि । परावृत्तैस्तैरेव राक्षसान्विधमिष्यामि निहनिष्यामि", "bhusana": "ब्राह्ममैन्द्रं च रौद्रं च वायव्यं वारुणं तथा ।\n\nयदि शक्रजितो ऽस्त्राणि दुर्निरीक्षाणि संयुगे", "siromani": "ब्राह्ममिति । ब्रह्मास्त्रादीनि शक्रजितो यदि यान्यस्त्राणि तानि च भवतामभ्यनुज्ञातो ऽहं निहनिष्यामि अत एव राक्षसान् विधमिष्यामि । ननु कथमेवं भवतो निश्चय इत्यत आह-- मे विक्रमः तं रावणं रुणद्धि पीडयतीत्यर्थः । अर्धचतुष्टयमेकान्वयि ।। 5.59.10,11 ।।\n\nमयेति । मया विसृष्टा प्रवर्तिता शैलवृष्टिः देवानपि हन्यात् राक्षसान् हन्यादिति किम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "И Шакраджита стрелы, / Горящие ослепительно (śakrajito’astraṇi durnirīkṣyāṇi) - букв. “на которые трудно смотреть”. Также слово durnirīkṣyāṇi можно понять как “невидимые”. Шакраджит (Победитель Шакры) - другой вариант имени Индраджит.", "service": [], "suggestions": [], "seq": 10}, {"id": "lexical:5.59.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "astraṃ brāhmaṃ", "note_ru": "Брахмастра (brahma-astra, n.) — «оружие [бога] Брахмы»: brahma «Брахма» + astra «метательное оружие» (√as-, «бросать», n. с суфф. -tra). MW: astra 'a missile weapon, arrow'. В стихе Хануман называет четыре категории астр: brahma (Брахмы), raudra (Рудры/Шивы), vāyavya (Ваю) и vāruṇa (Варуны). Астра — не физическая стрела, а наведённое сверхъестественной мантрой оружие, поражающее на любом расстоянии; его «видит» (нирикшйати) только равный или превосходящий. Список Хануманом четырёх астр — каталог всех стихий (эфир + огонь + ветер + вода): Индраджит покорил все элементарные силы.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:astra+dic_apte:astra", "source_links": [{"label": "MW astra", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=astra"}, {"label": "APTE astra", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=astra"}], "collision_tier1": true, "seq": 11}]}, {"verse_id": "5.59.11", "verse": "11", "sanskrit_iast": "bhavatām abhyanujñāto vikramo me ruṇaddhi tam । mayātulā visṛṣṭā hi śailavṛṣṭirnirantarā ॥11॥", "leonov_ru": "С вашего одобрения сила моя подчинит (сдержит) его. Выпущенный мной несравненный густой дождь камней", "commentary": {"tilaka": "रुणद्धि रोत्स्यति", "bhusana": "तान्यहं विधामिष्यामि निहनिष्यामि राक्षसान् ।\n\nभवतामभ्यनुज्ञातो विक्रमो मे रुणाद्धि तम्\nमया ऽतुला विसृष्टा हि शैलवृष्टिर्निरन्तरा ।\n\nदेवानपि रणे हन्यात् किं पुनस्तान्निशाचरान्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Сдержит его моя сила (vikramo me ruṇaddhi tam) - средневековые комментаторы расходятся в мнении о том, кто здесь имеется в виду. Автор комментария “Таттвадипика” полагает, что речь идет об Индраджите, автор комментария “Широмани” полагает, что подразумевается Равана. Автор комментария “Тилака” отмечает только, что глагол runaddhi передает значение будущего времени (rotsyati).", "service": [{"author": "Е. Костина", "lemma_iast": ".", "kind": "note", "text": "\"использован в будущем времени\" - не вполне корректно. Правильнее будет формулировка \"передает значение будущего времени\""}], "suggestions": [], "seq": 12}]}, {"verse_id": "5.59.12", "verse": "12", "sanskrit_iast": "devān api raṇe hanyāt kiṃ punas tān niśācarān । bhavatām ananujñāto vikramo me ruṇaddhi mām ॥12॥", "leonov_ru": "В битве убьет даже богов, а тем более тех бродящих по ночам (ракшасов). Если же не будет вашего одобрения, сила моя сдержит меня.", "commentary": {"siromani": "ननु रामसुग्रीवयोर्लङ्कागमनमन्तरा कथमेवं भविष्यतीत्यत आह अहमिति । लङ्कां रावणं च हन्तुम् अहमेकः पर्याप्तो यदि तर्हि भवद्भिः सहितः पर्याप्तश्चेत् किं वक्तव्यम् । अर्धचतुष्टयमेकान्वयि ।। 5.59.7,8 ।।\n\nतान्प्रोत्साहयितुं पुनः स्वपराक्रममाह अहमिति । सैन्यादिविशेषणविशिष्टं रावणं युधि वधिष्यामि\nनन्वेवं सति तत्रैव रावणः कुतो न हतः इत्यत आह-- भवतामिति । भवताम् अननुज्ञात आज्ञात आज्ञाया अभावाद्धेतोर्मे विक्रमो मां रुणद्धि हन्तुं न्यवारयदित्यर्थः । अर्धं पृथक्", "tilaka": "भवतामननुज्ञातः अनुज्ञां विना मे विक्रमो राक्षसवधप्रवृत्तिर्मां रुणद्धीत्यर्थः । अतः पूर्वमेव मया न पराक्रान्तमित्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "vikramo", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 13}]}, {"verse_id": "5.59.16", "verse": "16", "sanskrit_iast": "sadevāsurayakṣeṣu gandharvoragapakṣiṣu । maindasya pratiyoddhāraṃ śaṃsata dvividasya vā ॥16॥", "leonov_ru": "Скажите, есть ли среди богов, асуров, якшей, гандхарвов, змей и птиц Воин, который мог бы сразиться с Майндой или Двивидой?", "commentary": {"bhusana": "सदेवासुरयक्षेषु गन्धर्वोरगपक्षिषु ।\n\nमैन्दस्य प्रतियोद्धारं शंसत द्विविदस्य वा", "siromani": "सेति । देवादिसहितेषु गन्धर्वादिषु मध्ये मैन्दस्य द्विविदस्य वा प्रतियोद्धारं यूयं शंसत कथयत न को ऽपि प्रतियोद्धा ऽस्तीत्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Майнду и Двивиду", "kind": "note", "text": "нужен будет комм"}], "suggestions": [], "seq": 14}]}, {"verse_id": "5.59.17", "verse": "17", "sanskrit_iast": "aśviputrau mahāvegāvetau plavagasattamau । etayoḥ pratiyoddhāraṃ na paśyāmi raṇājire ॥17॥", "leonov_ru": "Оба сына Ашвинов, лучшие из обезьян, наделены великой быстротой (силой). Не вижу я никого, кто смог бы сразиться с ними на поле боя.", "commentary": {"siromani": "अश्वीति । अश्विपुत्रौ यौ प्लवगसत्तमौ तयोः प्रतियोद्धारं न पश्यामि", "bhusana": "अश्विपुत्रौ महाभागावेतौ प्लवगसत्तमौ ।\n\nएतयोः प्रतियोद्धारं न पश्यामि रणाजिरे"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Не вижу я никого, / Кто мог бы с ними сразиться (etayoḥ pratiyoddhāraṃ na paśyāmi raṇājire) - букв. “не вижу им достойного противника в сражении”.", "service": [], "suggestions": [], "seq": 15}]}, {"verse_id": "5.59.18", "verse": "18", "sanskrit_iast": "mayaiva nihatā laṅkā dagdhā bhasmīkṛtā purī । rājamārgeṣu sarveṣu nāma viśrāvitaṃ mayā ॥18॥", "leonov_ru": "Мною уничтожен город Ланка, сожжен и обращен в пепел. На всех царских дорогах прославлено мной имя [Рамы].", "commentary": {"tilaka": "इदानीं सर्वे ऽपि भवन्तस्तद्वधे समर्था इत्याह-- सागरो ऽपीति\nमयैव निहता निहतप्राया । एवं च सर्वैर्मिलित्वा नाशनीयेति किं वाच्यमिति भावः । नामेति सुग्रीवादेरिति शेषः", "bhusana": "पितामहवरोत्सेकात् परमं दर्पमास्थितौ ।\n\nअमृतप्राशिनावेतौ सर्ववानरसत्तमौ"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "edition:5.59.18:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.59.18 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.59.18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.59.18", "iast": "mayaiva nihatā laṅkā dagdhā bhasmīkṛtā purī । rājamārgeṣu sarveṣu nāma viśrāvitaṃ mayā ॥18॥"}], "seq": 16}]}, {"verse_id": "5.59.20", "verse": "20", "sanskrit_iast": "ahaṃ kosalarājasya dāsaḥ pavanasambhavaḥ । hanumān iti sarvatra nāma viśrāvitam mayā ॥20॥", "leonov_ru": "Я – слуга правителя Косалы, рожденный ветром, По имени Хануман!» - так мной прославлено имя [Рамы].", "commentary": {"bhusana": "अहं कोसलराजस्य दासः पवनसम्भवः ।\n\nहनुमानिति सर्वत्र नाम विश्रावितं मया\nकरोत्सेकेन मुक्तौ च प्रमथ्य महतीं चमूम् ।\n\nसुराणाममृतं वीरौ पीतवन्तौ प्लवङ्गमौ\nमयैव निहता लङ्कां दग्धा भस्मीकृता पुनः ।\n\nराजमार्गेषु सर्वत्र नाम विश्रावितं मया\nमयैवेति । दग्धत्वेप्यङ्गारावस्था भवति सा ऽपि नास्तीत्याह भस्मीकृतेति\nनामविश्रावणमेवाह जयतीति । जयति सर्वोत्कर्षेण वर्तते । तदुक्तं हरिणा \"जयिर्जयाभिभवयोराद्यर्थे ऽसावकर्मकः । उत्कर्षप्राप्तिराद्यार्थो द्वितीये ऽर्थे सकर्मकः ।।\" इति ।। 5.59.23,24 ।।\n\nअशोकवनिकामध्ये रावणस्य दुरात्मनः ।\n\nअधस्ताच्छिंशुपावृक्षे साध्वी करुणमास्थिता"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "lexical:5.59.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dāsa", "note_ru": "Даса (dāsa, m.) — «слуга, раб», этимология спорна: от имени «дасью» (доарийские жители Индии) или от √dās- («быть враждебным»?). MW: dāsa 'a servant, slave'. Хануман представляется: «ahaṃ kosalarājasya dāsaḥ pavanasambhavaḥ» — «я слуга правителя Косалы, рождённый ветром». Dāsa в устах Ханумана — не социально-правовой статус (раб), а дхармическое самоопределение: bhakti-dāsa, «слуга по любви и преданности». Именно так dāsa понимается в позднейшей бхакти-традиции (особенно вишнуизм). Хануман — прото-тип dāsa-bhakata: великий сам по себе, но самоопределяющийся исключительно через господина.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:dAsa+dic_apte:dAsa", "source_links": [{"label": "MW dAsa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=dAsa"}, {"label": "APTE dAsa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=dAsa"}], "seq": 17}, {"id": "edition:5.59.20:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.59.20 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.59.20", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.59.20", "iast": "ahaṃ kosalarājasya dāsaḥ pavanasambhavaḥ । hanumān iti sarvatra nāma viśrāvitam mayā ॥20॥"}], "seq": 18}]}, {"verse_id": "5.59.22", "verse": "22", "sanskrit_iast": "rākṣasībhiḥ parivṛtā śokasaṃtāpakarśitā । megharekhāparivṛtā candralekheva niṣprabhā ॥22॥", "leonov_ru": "Окружённая ракшаси, исхудавшая от скорби и страданий, Лишенная [былого] блеска, словно луна, затянутая тучами,", "commentary": {"bhusana": "राक्षसीभिः परिवृता शोकसन्तापकर्शिता ।\n\nमेघलेखापरिवृता चन्द्रलेखेव निष्प्रभा ।\n\nअचिन्तयन्ती वैदेही रावणं बलदर्पितम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.22:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Подобна луне на ущербе, / Скрытой за темными тучами (megharekhāparivṛtā candralekheva niṣprabhā) - букв. “утратившая сияние, подобно 1/16 части лунного диска, скрытого грядой туч”.", "service": [], "suggestions": [], "seq": 19}, {"id": "lexical:5.59.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "megharekhā", "note_ru": "Мегхарекха (megha-rekhā, f.) — «облачная полоска, нить облака»: megha «облако» (√mih-, «мочиться; туманиться», с чередованием) + rekhā «линия, полоска» (√likh-, «царапать, чертить»). MW: rekhā 'a line, streak'. В стихе Сита уподоблена луне, затянутой полоской облака (megharekhāparivṛtā candralekheva niṣprabhā). Megha-rekhā — именно тонкая полоска облака, а не тучи; candralekhā — «серп луны» (реха = полумесяц-черточка). Двойная «линейная» метафора: серп луны = mekhā Ситы, облачко = скорбь/плен, скрывающие свет. Подстрочник передаёт «затянутая тучами»; утрачен образ тонкой полоски, которая скрывает лунный серп, не уничтожая его.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:megha+dic_mw:reKA", "source_links": [{"label": "MW megha", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=megha"}, {"label": "MW reKA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=reKA"}], "collision_tier1": true, "seq": 20}]}, {"verse_id": "5.59.24", "verse": "24", "sanskrit_iast": "anuraktā hi vaidehī rāme sarvātmanā śubhā । ananyacittā rāmeṇa paulomīva puraṃdare ॥24॥", "leonov_ru": "Ибо прекрасная Вайдехи всей душой предана Раме, Не думает она ни о ком, кроме Рамы, словно Пауломи (Шачи) – [ни о ком, кроме] Пурандары (Индры).", "commentary": {"tilaka": "रामेण रामप्रीत्यानन्यचिन्ता पौलोमीव नहुषरुद्धा पौलोमीव", "bhusana": "अनुरक्ता हि वैदेही रामं सर्वात्मना शुभा ।\n\nअनन्यचित्ता रामे च पौलोमीव पुरन्दरे"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "lexical:5.59.24:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "paulomī", "note_ru": "Пауломи (paulomī, f.) — патронимик от Puloman (демон), отца Шачи: «дочь Пуломана» = Шачи, супруга Индры. MW: paulomī 'daughter of Puloman, wife of Indra'. В сравнении: Сита верна Раме «как Пауломи — Пурандаре (Индре)». Образец супружеской верности в эпосе — пара Шачи–Индра, где преданность Шачи неоднократно описывалась как нерушимая, несмотря на все отлучения Индры (падение в аду и т.д.). Paulomī выбрана не случайно: её отец-демон был убит Индрой, но она всё равно преданна мужу — точная параллель к положению Ситы, чей похититель Равана тоже демон.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:paulomI", "source_links": [{"label": "MW paulomI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=paulomI"}], "seq": 21}, {"id": "phase2:5.59.24:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "paulomīva puraṃdare", "note_ru": "Тилака уточняет отсылку сравнения: Пауломи (Шачи) хранила верность Индре даже тогда, когда её домогался Нахуша, — миф, стоящий за сравнением и усиливающий его: верность Ситы Раме держится не в спокойных обстоятельствах, а под давлением притязаний похитителя, как верность Шачи под натиском Нахуши.", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "Phase-1 заметка к этому стиху разбирает патроним Пауломи (дочь Пуломана) и общий параллелизм с Шачи-Индрой, но не касается мифа о домогательстве Нахуши; Тилака называет именно этот эпизод как основание сравнения — верность под давлением, а не в покое", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 22}]}, {"verse_id": "5.59.25", "verse": "25", "sanskrit_iast": "tad ekavāsaḥsaṃvītā rajodhvastā tathaiva ca । sā mayā rākṣasīmadhye tarjyamānā muhur muhuḥ ॥25॥", "leonov_ru": "Одетая в одну одежду, покрытая пылью, [Была увидена] мной она в окружении ракшаси, снова и снова подвергающаяся угрозам.", "commentary": {"tilaka": "तदेवाह जयमिति ।। 5.59.19,20 ।।\n\nसीतादुःखविमर्शे ऽपि संप्रत्येव समानेतुमुचितेत्याशयेन तादृशं वर्णयति अशोकेत्यादि ।। 5.59.21,22 ।।\n\nअचिन्तयन्ती योग्यत्वेनागणयन्ती । अगणने हेतुः-- पतिव्रतेति । अगणनाच्चावष्टब्धा निरुढा अस्तीति शेषः\nतदेवाह-- रामसुग्रीवसख्यं चेति । नियतः समुदाचारो दृढपातिव्रत्यं भर्तर्युत्तमा भक्तिश्चास्ति", "bhusana": "सा मया राक्षसीमध्ये तर्ज्यमाना मुहुर्मुहुः ।\n\nराक्षसीभिर्विरूपाभिर्दृष्टा हि प्रमदावने"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "единственномПлатье", "kind": "note", "text": "нужен будет комм"}], "suggestions": [], "seq": 23}]}, {"verse_id": "5.59.27", "verse": "27", "sanskrit_iast": "adhaḥśayyā vivarṇāṅgī padminīva himodaye । rāvaṇād vinivṛttārthā martavyakṛtaniścayā ॥27॥", "leonov_ru": "Спала она на земле, тело ее было бледным, словно лотосовый пруд с наступлением холодов, Отвергнувшая Равану, решилась она умереть.", "commentary": {"siromani": "एकेति । हिमोदये पद्मिनी कमलिनीव विवर्णाङ्गी रावणाद्धेतोर्विनिवृत्तः अर्थो रामसेवा यस्याः सा सीता कथंचित् विश्वासमुपपादिता प्रापिता । श्लोकद्वयमेकान्वयि ।। 5.59.27,28 ।।\n\nतत इति । संभाषिता अत एव सर्वमर्थं प्रकाशिता प्रबुद्धा सीता रामसुग्रीवसख्यं श्रुत्वा प्रीतिमुपागता प्राप्ता", "bhusana": "रावणाद् विनिवृत्तार्था मर्तव्यकृतनिश्चया ।\n\nकथंचिन्मृगशावाक्षी विश्वासमुपपादिता"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Как лотосовый пруд зимою", "kind": "note", "text": "комм / отсылка на предыдущий комм по этой теме"}, {"author": "Е. Костина", "lemma_iast": "отвергла", "kind": "note", "text": "нужен комм., Голдмэны понимают иначе (см. с. 276)"}], "suggestions": [], "seq": 24}]}, {"verse_id": "5.59.28", "verse": "28", "sanskrit_iast": "kathaṃ cin mṛgaśāvākṣī viśvāsam upapāditā । tataḥ sambhāṣitā caiva sarvam arthaṃ prakāśitā ॥28॥", "leonov_ru": "С трудом завоевал я доверие ланеокой. Тогда заговорила она со мной, и стало ясно ей все дело.", "commentary": {"tilaka": "कथञ्चिदादौ तूष्णीं रामकथाप्रस्तावेन सर्वमर्थं रामसुग्रीववृत्तान्तम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.28:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Обо всем, что случилось с Рамой (sarvam arthaṃ) - букв. “вся суть”. В комментарии “Тилака” поясняется: “То, что случилось с Рамой и Сугривой”.", "service": [], "suggestions": [], "seq": 25}]}, {"verse_id": "5.59.29", "verse": "29", "sanskrit_iast": "rāmasugrīvasakhyaṃ ca śrutvā prītim upāgatā । niyataḥ samudācāro bhaktir bhartari cottamā ॥29॥", "leonov_ru": "Обрадовалась она, услышав о дружбе Рамы и Сугривы. Неизменным было ее добродетельное поведение, и высочайшей – преданность мужу.", "commentary": {"siromani": "नियत इति । नियतः समुदाचारः सीतासदाचरणं भर्तरि रामे उत्तमा भक्तिश्च यद्यस्माद्दशग्रीवं न हन्ति तस्माद्दशाननो महात्मा प्रतीयते इति शेषः, एतेन रावणो मृतप्राय एवेति सूचितम् । अत एव रामः तस्य रावणस्य वधे निमित्तमात्रं भविष्यति । सार्धश्लोक एकान्वयी ।। 5.59.30,31 ।।\n\nसीतास्वरूपं निर्वक्ति सेति । प्रकृत्यैव तन्वङ्गी सीता तद्वियोगात् रामवियोगजदुःखात् कर्शिता अतिकृशत्वं प्राप्ता अत एव प्रतिपत्पाठशीलस्य जनस्य विद्येव तनुतां गता"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "phase2:5.59.29:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "niyataḥ samudācāraḥ", "note_ru": "Широмани делает из непоколебимой преданности Ситы вывод о судьбе Раваны: раз Сита, способная испепелить его гневом, воздерживается, значит, гибель Раваны уже предрешена её подвижничеством, — а Рама в его убийстве будет лишь «орудийной причиной» (нимитта-матра), но не подлинным виновником конца.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "подстрочник сообщает лишь о верности и радости Ситы; Широмани строит из этого доктринальный вывод о предрешённости гибели Раваны и о роли Рамы как формальной, а не главной причины — сюжетная функция, не считываемая из перевода", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 26}]}, {"verse_id": "5.59.3033", "verse": "3033", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "प्रमदावने अशोकवनिकायाम् । विनिवृत्तार्था त्यक्तप्रयोजना । रावणप्रलोभनवाक्यैरवशीकृतेत्यर्थः । सर्वमर्थं रामोद्योगादिकम् । दर्शिता बोधिता"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "tier1:5.59.3033:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Как знание ученика / В первый день половины месяца (pratipatpāṭhaśīlasya vidyeva tanutām gatā) - имеется в виду первый день светлой или темной половины лунного месяца, когда у учеников, изучающих Веды был отдых от занятий.", "service": [], "suggestions": [], "anchor_verse_id": "5.59.31", "seq": 27}, {"id": "lexical:5.59.3033:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pratipat", "note_ru": "Пратипат (pratipat, f.) — «первый день [лунной] половины месяца» (prathamā tithi pakṣasya): prati «против, обратно» + √pad- «идти». MW: pratipat 'the first day of a lunar fortnight'. В сравнении: «śīla знания того, кто изучает (Веды) в первый день половины» = в день pratipat луна/Веды только начинают прибывать. Tanūtā (истощение) Ситы сравнивается с «тонкостью» только что нарождающегося лунного серпа. Calendrical simile: pratipat-луна — самая тонкая, едва видимая, почти отсутствующая. Образ Ситы = луна-pratipat: жизнь есть, но едва заметна.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:pratipat+dic_apte:pratipat", "source_links": [{"label": "MW pratipat", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=pratipat"}, {"label": "APTE pratipat", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=pratipat"}], "anchor_verse_id": "5.59.31", "collision_tier1": true, "seq": 28}, {"id": "edition:5.59.3033:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.59.31 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.59.31", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.59.31", "iast": "sā prakṛtyaiva tanvaṅgī tadviyogāc ca karśitā । pratipatpāṭhaśīlasya vidyeva tanutām gatā ॥31॥"}], "anchor_verse_id": "5.59.31", "collision_tier1": true, "seq": 29}]}, {"verse_id": "5.59.32", "verse": "32", "sanskrit_iast": "evam āste mahābhāgā sītā śokaparāyaṇā । yad atra pratikartavyaṃ tat sarvam upakālpyatām ॥32॥", "leonov_ru": "Так сидела (в таком состоянии пребывала) наделенная великой долей Сита, удрученная скорбью. Должно [нам] теперь сделать все, что должно помочь [ей].", "commentary": {"tilaka": "नैतावता सीताशीलं दुर्बलमित्याशङ्क्यमित्याह नेति । यत्क्रुद्धा सीता कुर्यात्तत्स्पृष्टा ऽग्निशिखापि न कुर्यात् । इयं तु भर्तुः पराक्रमकीर्तये नाद्यापि क्रुध्यतीति भावः । अक्रुद्धाया अपि स्पर्शमात्रेण प्राप्तो नाशस्तु रावणतपसा निवारित इति ध्येयम्\nइयत्यापि सामग्र्या यद्दशाननं शापादिना न हन्ति तत्स दशाननो महात्मा तपोबलेन शापायोग्य इति भावः । अथापि सीतावरोधजन्यपापेन मृतप्राय एव स इत्याह-- निमित्तमात्रमिति । अतो ऽस्माभिरपि सुशक्यवध एव स इति भावः", "bhusana": "एवं स्थिते युष्मदनुमत्या भृत्यविजयो ऽपि स्वामिन एवेति कृत्वा सीतारामपदावलम्बादहमेव रावणं निर्जित्य सीतापुरस्कारेणैव रावघौ द्रक्ष्यामीत्याह जाम्बवदिति ।। 5.59.5,6 ।।\n\nअहमेको ऽपि पर्याप्तः सराक्षसगणां पुरीम् ।\n\nतां लङ्कां तपसा हन्तुं रावणं च महाबलम्\nतदेकवासः संवीता रजोध्वस्ता तथैव च ।\n\nशोकसन्तापदीनाङ्गी सीता भर्तृहिते रता\nअथ सीतादुर्दशाविमर्शे ऽपि सम्प्रत्यसौ समानेतव्येत्याशयेन तदृशां दर्शयति अशोकेत्यादिना ।। 5.59.25,26 ।।\n\nपतिव्रता च सुश्रोणी अवष्टब्धा च जानकी"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-59", "notes": [{"id": "lexical:5.59.32:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mahābhāgā", "note_ru": "Махабхага (mahā-bhāgā, f.) — «наделённая великой долей / великим счастьем»: mahā «великий» + bhāgā f. «доля, удел» (от √bhaj-, «делить, одарять»). MW: mahābhāga 'highly fortunate, eminent'. Bhāga — «то, что выделено» (ср. lak-ṣmī — «богатство судьбы», Fortuna). Mahābhāgā — формульный эпитет в ситуациях, когда велика «обречённость» судьбы: великая доля означает и великое испытание. Он применяется к Сите именно в момент её наибольшего страдания — подчёркивая, что величие судьбы включает испытание, а не отрицает его.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:mahABAga", "source_links": [{"label": "MW mahABAga", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=mahABAga"

const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 66, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 16, "verses_with_notes": 7, "notes_by_layer": {"tier1": 5, "lexical": 4, "phase2": 2, "edition": 0, "crosstext": 0}}, "sarga": 66, "verses": [{"verse_id": "5.66.3", "verse": 3, "sanskrit_iast": "", "leonov_ru": "", "commentary": {}, "has_tier1": true, "notes": [{"id": "tier1:5.66.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Согласно традиционным индийским представлениям, корова дает молоко только в присутствии своих телят."}, {"id": "lexical:5.66.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sakhya", "note_ru": "Сакхья (sakhya, n.) — «дружба, союз», от sakhi (m.) «друг» (индоевропейский когнат: лат. socius). MW: sakhya 'friendship, alliance'. В политическом словаре sakhya = один из способов дипломатии (ṣaḍguṇa): союз равных по силе. Рамы-Сугривы sakhya — дхармический договор взаимопомощи, заключённый при свидетелях. Здесь Рама говорит, что принятое им sakhya с Сугривой исполнено: Сита найдена. Слово фиксирует завершение дхармического обязательства.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:saKya", "collision_tier1": true}], "verse_not_segmented": true}, {"verse_id": "5.66.4", "verse": "4", "sanskrit_iast": "maṇiratnam idaṃ dattaṃ vaidehyāḥ śvaśureṇa me । vadhūkāle yathā baddham adhikaṃ mūrdhni śobhate ॥4॥", "leonov_ru": "Этот драгоценный камень был дан Вайдехи ее отцом Когда она была невестой, и еще прекраснее он был у нее на голове.", "commentary": {"tilaka": "मे श्वशुरेण जनकेन वधूकाले वधूत्वसंपादके काले विवाहकाले वैदेह्याः शिरोभूषणाय सीतामातृहस्ताद्गृहीत्वा दशरथहस्ते दत्तम् । तच्च तस्मिन्काले यथाधिकं शोभते तथा मूर्ध्नि बद्धमित्यर्थः", "bhusana": "मणिरत्नमिदं दत्तं वैदेह्याः श्वशुरेण मे ।\n\nवधूकाले यथा बद्धमधिकं मूर्ध्नि शोभते\nमणेरागतिमाहमणिरत्नमिति । मे श्वशुरेण जनकेन । वधूकाले वधूप्रतिग्रहकाले, विवाहकाल इत्यर्थः । यथा शोभते तथा बद्धमित्यन्वयः"}, "has_tier1": true, "notes": [{"id": "tier1:5.66.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «На челе» На лбу заколки точно не носят. Только если заколка \"съедет\" на лоб, но это вряд ли наш случай. Чудамани можно считать украшением для волос, но оно ничего не закалывает и свисает на лоб с головы, поэтому называть его заколкой неправомерно"}, {"id": "phase2:5.66.4:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "śirobhūṣaṇa", "note_ru": "Чудамани как «заколка» — вопрос, поставленный Е. Костиной (сомнение, что предмет действительно что-то закалывает), находит опору у Тилаки: он прямо называет украшение śirobhūṣaṇam, «головным украшением», данным Джанакой через руки матери Ситы к свадьбе, а не заколкой в буквальном смысле. Подстрочник термина не уточняет.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Тилака прямо квалифицирует предмет как śirobhūṣaṇa («головное украшение»), что подкрепляет собственное сомнение Костиной насчёт перевода «заколка» — точка, которую её примечание оставляло открытой, а Тилака закрывает.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.66.5", "verse": "5", "sanskrit_iast": "ayaṃ hi jalasaṃbhūto maṇiḥ pravarapūjitaḥ । yajñe paramatuṣṭena dattaḥ śakreṇa dhīmatā ॥5॥", "leonov_ru": "Ведь этот драгоценный камень, рожденный в воде, почитаем лучшими (богами), Дан он был мудрым Шакрой, которого умилостивили жертвоприношением.", "commentary": {"tilaka": "जनकस्याप्येतदागमः कुतस्तत्राह-- अयं हीति । प्रवरैः श्रष्ठैर्देवैः पूजितः", "bhusana": "अयं हि जलसम्भूतो मणिः सज्जनपूजितः ।\n\nयज्ञे परमतुष्टेन दत्तः शक्रेण धीमता\nजनकेनापि कुतस्तल्लब्धम् ? तत्राह अयं हीति"}, "has_tier1": true, "notes": [{"id": "tier1:5.66.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Почитаем богами (pravarapūjitaḥ) – автор комментария «Тилака» глоссирует pravarapūjitaḥ как «почитаемый лучшими богами». В комментарии «Бхушана» дается вариант sajjanapūjitaḥ (почитаемый добродетельными), оставляя это слово без комментария."}]}, {"verse_id": "5.66.8", "verse": "8", "sanskrit_iast": "kim āha sītā vaidehī brūhi saumya punaḥ punaḥ । parāsum iva toyena siñcantī vākyavāriṇā ॥8॥", "leonov_ru": "Поведай снова и снова, господин, что сказала Сита Вайдехи. Брызжет вода слов [на меня], словно влага на того, кто лишился сознания.", "commentary": {"tilaka": "तथा यथा सीतादर्शनमवगतः प्राप्तस्तथा तातस्य दशरथस्य प्राप्तः तद्धस्ते जनकेन दानात्तस्य स्मरणम् तथा वैदेहस्य राज्ञो जनकस्य सपत्नीकस्य दर्शनं प्राप्त इत्यर्थः ।। 5.66.6,7 ।।\n\nपरासुं मूर्च्छितं मां जीवनाय वाक्यवारिणा सिञ्जन्ती सीता किमाह पुनः पुनर्ब्रूहि तद्वचनमिति शेषः", "bhusana": "किमाह सीता वैदेही ब्रूहि सौम्य पुनः पुनः ।\n\nपिपासुमिव तोयेन सिञ्चन्ति वाक्यवारिणा"}, "has_tier1": true, "notes": [{"id": "tier1:5.66.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Как влага на чувств лишившегося (parāsum iva toyena) – в оригинале использовано слово «parāsu», что значит «мертвый» или «умирающий». В комментарии «Тилака» оно глоссируется как mūrcchita (лишившийся чувств)."}, {"id": "lexical:5.66.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āśā", "note_ru": "Аша (āśā, f.) — «надежда, ожидание», от ā+√āś- («достигать, охватывать»). MW: āśā 'hope, expectation'. В философии санкхьи āśā = один из «капканов ума» (citta-vṛtti), но в эпосе — жизненная сила, противостоящая nairāśya (безнадёжности). Весть Ханумана буквально оживляет Раму: получить āśā = получить витальную энергию для действия. Abhijñāna Ситы должно превратиться в āśā для Рамы — в «достижимое ожидание».", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:ASA", "collision_tier1": true}]}, {"verse_id": "5.66.12", "verse": "12", "sanskrit_iast": "kathaṃ sā mama suśroṇi bhīrubhīruḥ satī tadā । bhayāvahānāṃ ghorāṇāṃ madhye tiṣṭhati rakṣasām ॥12॥", "leonov_ru": "Как моя прекраснобедрая, будучи весьма робкой, Находится среди вызывающих ужас грозных ракшасов?", "commentary": {"tilaka": "भीरुभीरुरत्यन्तं भीरुः", "bhusana": "कथं सा मम सुश्रोणी भीरुभीरुः सती सदा ।\n\nभयावहानां घोराणां मध्ये तिष्ठति रक्षसाम्\nभीरुभीरुः अत्यन्तभीरुः ।। 5.66.12,13।।\n\nकिमाह सीता हनुंस्तत्त्वतः कथयाद्य मे ।\n\nएतेन खलु जीविष्ये भेषजेनातुरो यथा\nतत्त्वतः, सङ्कोचेन न किंचित् गोपनीयमिति भावः"}, "has_tier1": false, "notes": [{"id": "phase2:5.66.12:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tattvataḥ", "note_ru": "«Истинно» (tattvataḥ) — по Бхушане, здесь не просто «правдиво», а прямой наказ Рамы: пусть Хануман ничего не утаивает из скромности (saṅkocena na kiṃcid gopanīyam). Рама заранее снимает с Ханумана обычную сдержанность рассказчика — то самое умолчание, которое тот проявлял перед отрядом Ангады. Подстрочник передаёт только само слово «истинно», не раскрывая, что оно означает разрешение говорить без утайки.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "Бхушана раскрывает tattvataḥ как явный наказ не умалчивать из скромности — психологический нюанс просьбы Рамы, отсутствующий в подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.66.13", "verse": "13", "sanskrit_iast": "śāradas timironmukto nūnaṃ candra ivāmbudaiḥ । āvṛto vadanaṃ tasyā na virājati sāmpratam ॥13॥", "leonov_ru": "Верно, поблекло ныне ее лицо, Подобно осенней луне, закрытой тучами, свободной от тьмы.", "commentary": {"tilaka": "अम्बुदैरावृतस्तिमिरोन्मुक्तः शारदश्चन्द्र इव तस्या वदनं न राजति", "bhusana": "शारदस्तिभिरोन्मुक्तो नूनं चन्द्र इवाम्बुदैः ।\n\nआवृतं वदनं तस्या न विराजति राक्षसैः"}, "has_tier1": true, "notes": [{"id": "tier1:5.66.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И скрыли темные пятна (timironmuktaḥ) – букв. «освободившийся от тьмы». В комментарии «Широмани» говорится, что под словом timira «тьма» здесь следует понимать пятна на луне (знак зайца)."}, {"id": "lexical:5.66.13:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sukhocitā", "note_ru": "Сукхочита (sukha-ucitā, f.) — «привыкшая к счастью», sukha «счастье, удобство» + ucita (p.p.p. от √uc- «привыкать, находить приятным»). MW: ucita 'accustomed to; suitable'. Sukha: пара sukha/duḥkha имеет «колесничную» этимологию (su-kha = «хорошее ступичное отверстие» ↔ duḥ-kha = «плохое ступичное отверстие»). Сита sukhocitā — «привыкшая к хорошей оси» — теперь вынуждена терпеть duḥkha. Это усиливает пафос: страдание тем острее, чем выше исходный уровень благополучия.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:suKa+dic_mw:ucita", "collision_tier1": true}]}, {"verse_id": "5.66.15", "verse": "15", "sanskrit_iast": "madhurā madhurālāpā kim āha mama bhāminī । madvihīnā varārohā hanuman kathayasva me । duḥkhād duḥkhataraṃ prāpya kathaṃ jīvati jānakī ॥15॥", "leonov_ru": "Моя сладостная красавица, говорящая сладостные речи, что сказала Разлученная со мной прекраснобедрая, расскажи мне, Хануман. Идя от страдания к еще большему страданию, как жива Джанаки?»", "commentary": {"tilaka": "मधुरा मधुराकारा", "bhusana": "मधुरा मधुरालापा किमाह मम भामिनी ।\n\nमद्विहीना वरारोहा हनुमन् कथयस्व मे ।।\n\n[दुःखाद्दुःखतरं प्राप्य कथं जीवति जानकी ]\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे षट्षष्टितमः सर्गः ।। 5.66 ।।\n\nमधुरा सुन्दरी । मधुरालापा, येन तद्वचनानुवादेपि भवद्वचनं मधुरं भवतीत्यर्थः"}, "has_tier1": false, "notes": [{"id": "lexical:5.66.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "martavya", "note_ru": "Мартавья (martavya, adj.) — «тот/та, кто должен/должна умереть; смерть неизбежна», герундив от √mṛ- («умирать», Whitney #161). MW: martavya 'to be died, death being inevitable'. Герундив на -tavya в санскрите выражает долженствование / необходимость. Martavya-kṛta-niścayā = «принявшая решение умереть» (буквально «сделавшая твёрдым решение о том, что она должна умереть»). Это описывает суицидальную решимость Ситы — дхармически мотивированную: смерть предпочтительнее нарушения pativratā. Категория martavya в Sanskrit ethics = смерть как выбор, а не случайность.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:martavya+warnemyr(mf)"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s66_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

 "subtype": "lexical", "trigger": "realia", "source": "dic_mw:saKya", "source_links": [{"label": "MW saKya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=saKya"}], "collision_tier1": true, "seq": 2}], "verse_not_segmented": true, "empty_reason": "Шлока есть в нумерации примечаний, но отсутствует в сегментированном корпусе (data/analysis/sundara_commentary_segmented.json), поэтому санскрит и подстрочник здесь не показаны. Примечание сохранено и голосуется; текст стиха нужно досегментировать."}, {"verse_id": "5.66.4", "verse": "4", "sanskrit_iast": "maṇiratnam idaṃ dattaṃ vaidehyāḥ śvaśureṇa me । vadhūkāle yathā baddham adhikaṃ mūrdhni śobhate ॥4॥", "leonov_ru": "Этот драгоценный камень был дан Вайдехи ее отцом Когда она была невестой, и еще прекраснее он был у нее на голове.", "commentary": {"tilaka": "मे श्वशुरेण जनकेन वधूकाले वधूत्वसंपादके काले विवाहकाले वैदेह्याः शिरोभूषणाय सीतामातृहस्ताद्गृहीत्वा दशरथहस्ते दत्तम् । तच्च तस्मिन्काले यथाधिकं शोभते तथा मूर्ध्नि बद्धमित्यर्थः", "bhusana": "मणिरत्नमिदं दत्तं वैदेह्याः श्वशुरेण मे ।\n\nवधूकाले यथा बद्धमधिकं मूर्ध्नि शोभते\nमणेरागतिमाहमणिरत्नमिति । मे श्वशुरेण जनकेन । वधूकाले वधूप्रतिग्रहकाले, विवाहकाल इत्यर्थः । यथा शोभते तथा बद्धमित्यन्वयः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-66", "notes": [{"id": "tier1:5.66.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "На челе", "kind": "note", "text": "На лбу заколки точно не носят. Только если заколка \"съедет\" на лоб, но это вряд ли наш случай. Чудамани можно считать украшением для волос, но оно ничего не закалывает и свисает на лоб с головы, поэтому называть его заколкой неправомерно"}], "suggestions": [], "seq": 3}, {"id": "phase2:5.66.4:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "śirobhūṣaṇa", "note_ru": "Чудамани как «заколка» — вопрос, поставленный Е. Костиной (сомнение, что предмет действительно что-то закалывает), находит опору у Тилаки: он прямо называет украшение śirobhūṣaṇam, «головным украшением», данным Джанакой через руки матери Ситы к свадьбе, а не заколкой в буквальном смысле. Подстрочник термина не уточняет.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Тилака прямо квалифицирует предмет как śirobhūṣaṇa («головное украшение»), что подкрепляет собственное сомнение Костиной насчёт перевода «заколка» — точка, которую её примечание оставляло открытой, а Тилака закрывает.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 4}]}, {"verse_id": "5.66.5", "verse": "5", "sanskrit_iast": "ayaṃ hi jalasaṃbhūto maṇiḥ pravarapūjitaḥ । yajñe paramatuṣṭena dattaḥ śakreṇa dhīmatā ॥5॥", "leonov_ru": "Ведь этот драгоценный камень, рожденный в воде, почитаем лучшими (богами), Дан он был мудрым Шакрой, которого умилостивили жертвоприношением.", "commentary": {"tilaka": "जनकस्याप्येतदागमः कुतस्तत्राह-- अयं हीति । प्रवरैः श्रष्ठैर्देवैः पूजितः", "bhusana": "अयं हि जलसम्भूतो मणिः सज्जनपूजितः ।\n\nयज्ञे परमतुष्टेन दत्तः शक्रेण धीमता\nजनकेनापि कुतस्तल्लब्धम् ? तत्राह अयं हीति"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-66", "notes": [{"id": "tier1:5.66.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Почитаем богами (pravarapūjitaḥ) – автор комментария «Тилака» глоссирует pravarapūjitaḥ как «почитаемый лучшими богами». В комментарии «Бхушана» дается вариант sajjanapūjitaḥ (почитаемый добродетельными), оставляя это слово без комментария.", "service": [], "suggestions": [], "seq": 5}]}, {"verse_id": "5.66.8", "verse": "8", "sanskrit_iast": "kim āha sītā vaidehī brūhi saumya punaḥ punaḥ । parāsum iva toyena siñcantī vākyavāriṇā ॥8॥", "leonov_ru": "Поведай снова и снова, господин, что сказала Сита Вайдехи. Брызжет вода слов [на меня], словно влага на того, кто лишился сознания.", "commentary": {"tilaka": "तथा यथा सीतादर्शनमवगतः प्राप्तस्तथा तातस्य दशरथस्य प्राप्तः तद्धस्ते जनकेन दानात्तस्य स्मरणम् तथा वैदेहस्य राज्ञो जनकस्य सपत्नीकस्य दर्शनं प्राप्त इत्यर्थः ।। 5.66.6,7 ।।\n\nपरासुं मूर्च्छितं मां जीवनाय वाक्यवारिणा सिञ्जन्ती सीता किमाह पुनः पुनर्ब्रूहि तद्वचनमिति शेषः", "bhusana": "किमाह सीता वैदेही ब्रूहि सौम्य पुनः पुनः ।\n\nपिपासुमिव तोयेन सिञ्चन्ति वाक्यवारिणा"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-66", "notes": [{"id": "tier1:5.66.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Как влага на чувств лишившегося (parāsum iva toyena) – в оригинале использовано слово «parāsu», что значит «мертвый» или «умирающий». В комментарии «Тилака» оно глоссируется как mūrcchita (лишившийся чувств).", "service": [], "suggestions": [], "seq": 6}, {"id": "lexical:5.66.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āśā", "note_ru": "Аша (āśā, f.) — «надежда, ожидание», от ā+√āś- («достигать, охватывать»). MW: āśā 'hope, expectation'. В философии санкхьи āśā = один из «капканов ума» (citta-vṛtti), но в эпосе — жизненная сила, противостоящая nairāśya (безнадёжности). Весть Ханумана буквально оживляет Раму: получить āśā = получить витальную энергию для действия. Abhijñāna Ситы должно превратиться в āśā для Рамы — в «достижимое ожидание».", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:ASA", "source_links": [{"label": "MW ASA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ASA"}], "collision_tier1": true, "seq": 7}]}, {"verse_id": "5.66.12", "verse": "12", "sanskrit_iast": "kathaṃ sā mama suśroṇi bhīrubhīruḥ satī tadā । bhayāvahānāṃ ghorāṇāṃ madhye tiṣṭhati rakṣasām ॥12॥", "leonov_ru": "Как моя прекраснобедрая, будучи весьма робкой, Находится среди вызывающих ужас грозных ракшасов?", "commentary": {"tilaka": "भीरुभीरुरत्यन्तं भीरुः", "bhusana": "कथं सा मम सुश्रोणी भीरुभीरुः सती सदा ।\n\nभयावहानां घोराणां मध्ये तिष्ठति रक्षसाम्\nभीरुभीरुः अत्यन्तभीरुः ।। 5.66.12,13।।\n\nकिमाह सीता हनुंस्तत्त्वतः कथयाद्य मे ।\n\nएतेन खलु जीविष्ये भेषजेनातुरो यथा\nतत्त्वतः, सङ्कोचेन न किंचित् गोपनीयमिति भावः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-66", "notes": [{"id": "phase2:5.66.12:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tattvataḥ", "note_ru": "«Истинно» (tattvataḥ) — по Бхушане, здесь не просто «правдиво», а прямой наказ Рамы: пусть Хануман ничего не утаивает из скромности (saṅkocena na kiṃcid gopanīyam). Рама заранее снимает с Ханумана обычную сдержанность рассказчика — то самое умолчание, которое тот проявлял перед отрядом Ангады. Подстрочник передаёт только само слово «истинно», не раскрывая, что оно означает разрешение говорить без утайки.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "Бхушана раскрывает tattvataḥ как явный наказ не умалчивать из скромности — психологический нюанс просьбы Рамы, отсутствующий в подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 8}]}, {"verse_id": "5.66.13", "verse": "13", "sanskrit_iast": "śāradas timironmukto nūnaṃ candra ivāmbudaiḥ । āvṛto vadanaṃ tasyā na virājati sāmpratam ॥13॥", "leonov_ru": "Верно, поблекло ныне ее лицо, Подобно осенней луне, закрытой тучами, свободной от тьмы.", "commentary": {"tilaka": "अम्बुदैरावृतस्तिमिरोन्मुक्तः शारदश्चन्द्र इव तस्या वदनं न राजति", "bhusana": "शारदस्तिभिरोन्मुक्तो नूनं चन्द्र इवाम्बुदैः ।\n\nआवृतं वदनं तस्या न विराजति राक्षसैः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-66", "notes": [{"id": "tier1:5.66.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "И скрыли темные пятна (timironmuktaḥ) – букв. «освободившийся от тьмы». В комментарии «Широмани» говорится, что под словом timira «тьма» здесь следует понимать пятна на луне (знак зайца).", "service": [], "suggestions": [], "seq": 9}, {"id": "lexical:5.66.13:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sukhocitā", "note_ru": "Сукхочита (sukha-ucitā, f.) — «привыкшая к счастью», sukha «счастье, удобство» + ucita (p.p.p. от √uc- «привыкать, находить приятным»). MW: ucita 'accustomed to; suitable'. Sukha: пара sukha/duḥkha имеет «колесничную» этимологию (su-kha = «хорошее ступичное отверстие» ↔ duḥ-kha = «плохое ступичное отверстие»). Сита sukhocitā — «привыкшая к хорошей оси» — теперь вынуждена терпеть duḥkha. Это усиливает пафос: страдание тем острее, чем выше исходный уровень благополучия.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:suKa+dic_mw:ucita", "source_links": [{"label": "MW suKa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=suKa"}, {"label": "MW ucita", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ucita"}], "collision_tier1": true, "seq": 10}]}, {"verse_id": "5.66.15", "verse": "15", "sanskrit_iast": "madhurā madhurālāpā kim āha mama bhāminī । madvihīnā varārohā hanuman kathayasva me । duḥkhād duḥkhataraṃ prāpya kathaṃ jīvati jānakī ॥15॥", "leonov_ru": "Моя сладостная красавица, говорящая сладостные речи, что сказала Разлученная со мной прекраснобедрая, расскажи мне, Хануман. Идя от страдания к еще большему страданию, как жива Джанаки?»", "commentary": {"tilaka": "मधुरा मधुराकारा", "bhusana": "मधुरा मधुरालापा किमाह मम भामिनी ।\n\nमद्विहीना वरारोहा हनुमन् कथयस्व मे ।।\n\n[दुःखाद्दुःखतरं प्राप्य कथं जीवति जानकी ]\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे षट्षष्टितमः सर्गः ।। 5.66 ।।\n\nमधुरा सुन्दरी । मधुरालापा, येन तद्वचनानुवादेपि भवद्वचनं मधुरं भवतीत्यर्थः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-66", "notes": [{"id": "lexical:5.66.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "martavya", "note_ru": "Мартавья (martavya, adj.) — «тот/та, кто должен/должна умереть; смерть неизбежна», герундив от √mṛ- («умирать», Whitney #161). MW: martavya 'to be died, death being inevitable'. Герундив на -tavya в санскрите выражает долженствование / необходимость. Martavya-kṛta-niścayā = «принявшая решение умереть» (буквально «сделавшая твёрдым решение о том, что она должна умереть»). Это описывает суицидальную решимость Ситы — дхармически мотивированную: смерть предпочтительнее нарушения pativratā. Категория martavya в Sanskrit ethics = смерть как выбор, а не случайность.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:martavya+warnemyr(mf)", "source_links": [{"label": "MW martavya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=martavya"}], "seq": 11}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "s

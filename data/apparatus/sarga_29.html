ेत्येवं स्थिताम् । निमित्तानि शुभानि भेजिरे । निमित्तानि तद्विषये शुभानि सूचयित्वा स्वसत्तां लेभिरे । नरं श्रिया जुष्टमिवोपजीविनः । अर्थिनो हि लक्ष्मीकटाक्षवद्विषये किंचित्कृत्य स्वप्रयोजनं लभन्ते, इमानि तु साक्षाल्लक्ष्मीविषये किंचित्कृत्य निमित्तस्वामित्वं लेभिर इत्यर्थः", "siromani": "निमित्ताकारं दर्शयितुमाह तथेति । तथा तेन प्रकारेण गतां शाखां प्राप्तां व्यथिताम् अत एव व्यतीतहर्षां निवृत्तानन्दाम् अत एव परिदीनमानसाम् अनिन्दितां शुभां तां सीतां शुभानि निमित्तानि श्रिया जुष्टं नरमुपसेविन इव भेजिरे सिषेविरे"}, "has_tier1": false, "notes": [{"id": "lexical:5.29.1:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nimitta", "note_ru": "Нимитта (nimitta, n.) — «знак, предзнаменование; инструментальная причина»: ni-√mit- (MW: ni- + mita, p.p.p. от √mā- «измерять»? или самостоятельный √mit-). MW: nimitta n. 'a mark, sign, omen; instrumental or efficient cause (opp. upādāna, material cause)'. Философская двуплановость существенна: в ньяя-вайшешике нимитта-каузальность противопоставлена упадāна-каузальности (nimitta-kāraṇa = «действенная причина», как гончар; upādāna = «материальная причина», как глина). В предсказательной традиции (nimittaśāstra) телесные спазмы (aṅgaspandana) классифицируются как нимитты: левая сторона у женщин предвещает благо, у мужчин — несчастье (Bṛhatsaṃhitā Varāhamihiry 51). Подстрочник «знак» или «предзнаменование» не передаёт технический статус термина внутри шāстрической системы ангаспанданы, которую Вальмики явно задействует в гл. 29.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:nimitta"}, {"id": "phase2:5.29.1:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tathāgatāṃ tāṃ vyathitām", "note_ru": "Бхушана поясняет слово «татха» («пребывающей в таком состоянии») не как нейтральную констатацию, а как знак предельности горя: Сита сама прежде говорила о двенадцати безмятежных годах в доме Рагхавы («samā dvādaśa... bhuñjānā mānuṣān bhogān sarvakāmasamṛddhinī»), и теперь весь этот прежний покой обессмыслен — её состояние таково, что дальше несчастий уже некуда, отсюда и появляются благие знаки.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "вскрывает нарративную функцию слова «татха» — отсылку к собственным прежним словам Ситы о двенадцати благополучных годах, обессмысленным нынешним горем; подстрочник передаёт только описательное «в таком состоянии»", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.29.2", "verse": "2", "sanskrit_iast": "tasyāḥ śubhaṃ vāmam arālapakṣmarājīvṛtaṃ kṛṣṇaviśālaśuklam । prāspandataikaṃ nayanaṃ sukeśyā mīnāhataṃ padmam ivābhitāmram ॥2॥", "leonov_ru": "У той прекрасноволосой левый, С изогнутыми ресницами, широкий, белый с черным зрачком, Задрожал один глаз, словно красный лотос, потревоженный (ударенный) рыбой.", "commentary": {"tilaka": "अरालया वक्रया पक्ष्मराज्या वृतम् । पक्ष्मणो ऽरालया वक्ररोमराज्या वृतमित्यर्थः । तथा कृष्णं कनीनिकामात्रे अन्यत्र विशालशुक्लत्वयुक्तम्, अभितस्ताम्रं प्रान्तरक्तम् एकं वामम्", "bhusana": "तस्याः शुभं वाममरालपक्ष्मराजीवृतं कृष्णविशालशुक्लम् ।\n\nप्रास्पन्दतैकं नयनं सुकेश्यामीनाहतं पद्ममिवाभिताम्रम्", "siromani": "तस्या इति । अरालया कुटिलया पक्षमराज्या पक्ष्मणः पङ्क्त्या वृतं युक्तं कृष्णविशालशुक्लं कृष्णत्वादिविशिष्टं तत्र कृष्णत्वं कनीनिकावच्छेदेन शुक्लत्वं तु सर्वदेशावच्छेदेन बोध्यम् । शुभं शुभलक्षणविशिष्टम् अभिताम्रं रक्तप्रान्तदेशं तस्याः वाममेकं नयनं मीनाहतं मत्स्यैः चालितं पद्ममिव प्रास्पन्दत"}, "has_tier1": true, "notes": [{"id": "tier1:5.29.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Глаз задрожал, словно красный лотос (prāspandataikaṃ nayanaṃ… padmam ivābhitāmram) – см. примечание к V, 27, 50."}]}, {"verse_id": "5.29.4", "verse": "4", "sanskrit_iast": "gajendrahastapratimaś ca pīnas । tayor dvayoḥ saṃhatayos sujātaḥ । praspandamānaḥ punar ūrur asyā । rāmaṃ purastāt sthitam ācacakṣe ॥4॥", "leonov_ru": "И подобное хоботу слона пышное Из двух тесно соединённых, прекрасной формы Вновь дрожащее бедро ее, Сказало, что Рама вскоре станет перед нею.", "commentary": {"tilaka": "संहतयोः श्लिष्टयोस्तयोरूर्वोर्मध्ये वाम ऊरुरित्यर्थः", "siromani": "गजेन्द्रेति । गजेन्द्रहस्तप्रतिमः शुण्डादण्डसदृशः अत एव पीनः सुजातः अतिसुन्दरः संहतयोः द्वयोः तयोरूर्वोर्मध्ये वाम इति शेषः, प्रस्पन्दमानः अस्याः सीतायाः ऊरुः पुरस्तात्स्थितं रामम् आचचक्षे"}, "has_tier1": true, "notes": [{"id": "tier1:5.29.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Затем задрожало бедро ее левое (praspandamānaḥ punar ūrur asyā) – слово «левое» добавлено по контексту и в соответствии с комментарием «Тилака».[Е. Костина] «Дивнорожденное и упругое» 1) По Бхушане - सुजातः सुन्दरः ।। 2) Нужен комм. с буквальным переводом, потому что упругое - не = из двух плотно сомкнутых"}]}, {"verse_id": "5.29.5", "verse": "5", "sanskrit_iast": "śubhaṃ punar hemasamānavarṇam । īṣadrajodhvastam ivātulākṣyāḥ । vāsaḥ sthitāyāḥ śikharāgradantyāḥ । kiṃ cit parisraṃsata cārugātryāḥ ॥5॥", "leonov_ru": "Тогда прекрасное, цветом подобное золоту Слегка покрытое пылью платье Несравненноглазой, стоящей, с зубами, ровными, словно семена граната, С прекрасными членами тела, чуть соскользнуло [с плеч].", "commentary": {"bhusana": "शुभनिमित्तान्येवाह तस्या इत्यादिना । अरालं वक्त्रम् । कृष्णविशालशुक्लं मध्ये कनीनिकायां कृष्णं सर्वतो विशालं शुभ्रं च । अभिताम्रम् अभितस्ताम्रम्, प्रान्तरक्तमित्यर्थः । \"प्रान्तरक्ते च नेत्रे\" इति पद्मिनी लक्षणात् ।। 2.29.23।।\n\nगजेन्द्रहस्तप्रतिमश्च पीनस्तयोर्द्वयोः संहतयोः सुजातः ।\n\nप्रस्पन्दमानः पुनरूरुरस्या रामं पुरस्तात् स्थितमाचचक्षे\nगजेन्द्रेति । तयोः सुलक्षणवत्तया प्रसिद्धयोः । उरुः वाम इत्यनुषज्यते । सुजातः सुन्दरः\nशुभं पुनर्हेमसमानवर्णमीषद्रजोध्वस्तमिवामलाक्ष्याः ।\n\nवासः स्थितायाः शिखराग्रदत्याः किंचित् परिस्रंसत चारुगात्र्याः\nशुभमिति । शिखराग्रदत्याः वृत्ताग्रदन्तयुक्तायाः । \"शिखंरं निस्तुलं वृत्तम्\" इत्यत्पुलमाला । \"शिखरं दाडिमफलबीजम्\" इत्यन्ये नैघण्टुकाः । यद्वा शिखराकाराग्रदन्तायाः \"अग्रान्तशुद्धशुभ्रवृषवराहेभ्यश्च\" इति दन्तस्य दत्रादेशः । वासः वस्त्रम् । परिस्रंसत पर्यस्रंसत । अडभाव आर्षः । ऊरुकम्पादिति भावः । स्थितायाः तिष्ठन्त्या इति वस्त्रस्रंसनानुगुणावस्थोक्तिः । यद्वा वासस्स्रंसनं कान्तागमनसूचकमिति भावः । शिखरदन्तत्वे सामुद्रिकम् \"स्निग्धास्समानुरूपाः सुपङ्क्तयः शिखरिणः श्लक्ष्णाः । दन्ता भवन्ति यासां तासां पादे जगत्सर्वम् ।।\" इति, \"यासां शिखरिणो दन्ता दीर्घं जीवन्ति ताः स्त्रियः\" इति च", "tilaka": "हेमरूषितत्वाद्धेमसमानवर्णम् । ईषद्रजोध्वस्तमिवेषन्मलिनमिव चिरमपरिवर्तनात् । शिखरं दाडिमबीजं तदग्रतुल्यदन्त्याः । \"शिखरं शैलवृक्षाग्रे कक्षाग्रगृहकोटिषु । पक्वे दाडिमबीजे च\" इति विश्वः । परिस्रंसत पर्यस्रंसतासनादधः पपात\nहर्षेण विबुद्धं सत्त्वं चित्तं यस्याः । वदनेन करणेन । शुक्ले शुक्लपक्षे", "siromani": "शुभमिति । अमलाक्ष्याः निर्मलनेत्रायाः शिखराग्रवत् दाडिमबीजाग्रभागवत् दन्ता यस्याः चारु गात्रं यस्यास्तस्याः स्थितायाः सीतायाः शुभं मङ्गलप्रदं हेमसमानवर्णम् ईषत् किंचित् रजसा ध्वस्तमिव वासो वस्त्रं शुभं शुभसूचकं यथा भवति तथा किंचित् परिसंस्रत पर्यसंस्रत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.29.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "… платье …с плеч приспустилось (vāsaḥ… kiṃ cit parisraṃsata) В комментарии «Бхушана» отмечается, что приспустившееся платье – знак, указывающий на приближение возлюбленного.чьи зубы – семена граната (śikharāgradantyāḥ) – перевод композита дан по комментарию «Тилака». Голдмены переводят «the tips of jasmine buds» (см.: Goldman 1984: 190)."}, {"id": "phase2:5.29.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "śikharāgradantyāḥ", "note_ru": "Помимо уже отмеченного Костиной перевода композита («зубы — семена граната», по Тилаке) и толкования приспустившегося платья как знака приближения возлюбленного, Бхушана добавляет самостоятельный мотив: по трактатам саамудрики (сāмудрика-шāстра, наука телесных примет), женщина с зубами, подобными семенам граната, обеспечивает своему мужу долголетие — примета телесной красоты здесь удвоена приметой благой судьбы.", "type": "В", "source_commentary": ["bhusana"], "why_proposed": "вводит доктринальную рамку саамудрики (примета зубов = долголетие мужа), отсутствующую и в подстрочнике, и в собственном примечании Леонова/Костиной, которое ограничивается переводом композита и мотивом приближения возлюбленного", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.29.7", "verse": "7", "sanskrit_iast": "tasyāḥ punar bimbaphalopamoṣṭhaṃ । svakṣibhrukeśāntam arālapakṣma । vaktraṃ babhāse sitaśukladaṃṣṭraṃ । rāhor mukhāc candra iva pramuktaḥ ॥7॥", "leonov_ru": "Ее лицо тогда с устами, подобными плодам бимбы, С прекрасными глазами, бровями и челкой, с изогнутыми ресницами, С ослепительно белыми зубами стало подобным Луне, вышедшей из пасти Раху.", "commentary": {"tilaka": "शोभने अक्षिणी भ्रुवौ केशान्ता अलकाश्च यत्र तत् सितशुक्लदंष्ट्रं स्फटिकादिसितपदार्थवच्छुक्ला दंष्ट्रा यत्र तत्संबद्धशुक्लदंष्ट्रावदिति च", "bhusana": "तस्याः पुनर्बिम्बफलाधरोष्ठं स्वक्षिभ्रु केशान्तमरालपक्ष्म ।\n\nवक्त्रं बभासे सितशुक्लदंष्ट्रं राहोर्मुखाच्चन्द्र इव प्रमुक्तः\nस्वक्षिभ्रुशोभनाक्षिश्रूयुक्तम् । केशाः अन्ते यस्य तत् केशान्तम् । उपरिभागप्रकीर्णालकमित्यर्थः । सितशुक्लदंष्ट्रम् अत्यन्तशुक्लदन्तम् । एकार्थे शब्दद्वयप्रयोगो ऽतिशयज्ञापनाय । यथा मुग्धमनोज्ञ इति । नीरन्ध्रत्वेन संसक्तशुक्लदंष्ट्रमिति वा ऽर्थः । \"षिञ् बन्धने\" इत्यस्माद्धातोर्निष्ठा", "siromani": "तस्या इति । बिम्बफलोपमौ औष्ठौ यस्मिन् शोभने अक्षिणी भ्रुवौ च यस्मिन् केशानामन्तः अलको यस्मिन् अरालानि वक्राणि पक्ष्माणि यस्मिन् सिताः स्वच्छाः शुक्लदंष्ट्रा यस्मिंत्तत् तस्या वक्रं राहोर्मुखात् प्रमुक्तः चन्द्र इव बभासे"}, "has_tier1": true, "notes": [{"id": "tier1:5.29.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «bhrukeśāntam» Опущено"}, {"id": "lexical:5.29.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bimbaphala", "note_ru": "Бимба-пхала (bimba-phala, n., кармадхāрая) — «плод лианы бимба»: bimba — растение Coccinia grandis (сем. Cucurbitaceae, «красная тыквочка»), известна ярко-красными плодами размером с маслину; phala «плод» (√phal-, «плодоносить», Whitney #726). MW: bimba 'a mirror, disk; the plant Momordica monadelpha'. Апте уточняет: bimbā 'the plant Coccinia Indica, its fruit used as simile for red lips'. Плоды bimba стали устойчивым штампом для описания алых губ красавицы (bimba-phalādharoṣṭha, букв. «губы-нижняя-ноздря ← как плод бимбы»). Знаковое место в Амарукашатаке и Ритусамхāре Кāлидāсы. В нашем стихе bimbaphalopamoṣṭha «губы, подобные плоду бимбы» переносит устойчивую кāвья-формулу в эпический контекст, возводя описание Ситы к высокому поэтическому регистру. Подстрочник «алые губы» теряет ботаническую идентификацию и литературную аллюзию.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:bimba+dic_apte:bimbA", "collision_tier1": true}, {"id": "phase2:5.29.7:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bhrukeśāntam", "note_ru": "Бхушана поясняет опущенный в подстрочнике композит «бхру-кешāнта»: это не просто «брови и волосы», а разлетевшиеся у висков пряди (кешанта = «конец волос»), обрамляющие лицо в верхней его части — деталь растрёпанности, а не просто перечисление черт.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "восполняет содержательно опущенный Костиной композит bhrukeśāntam конкретным значением («растрёпанные у висков пряди»), а не просто фиксирует факт пропуска", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.29.8", "verse": "8", "sanskrit_iast": "sā vītaśokā vyapanītatandrā । śāntajvarā harṣavibuddhasattvā । aśobhatāryā vadanena śukle । śītāṃśunā rātrir ivoditena ॥8॥", "leonov_ru": "Печаль ее прошла, прошла ее усталость, Успокоилась лихорадка, дух ее пробудился от радости, Озарилось благородная лицом, словно в светлую половину месяца Ночь взошедшей луною.", "commentary": {"bhusana": "सा वीतशोका व्यपनीततन्द्री शान्तज्वरा हर्षविवृद्धसत्त्वा । अशोभतार्या वदनेन शुक्ले शीतांशुना रात्रिरिवोदितेन\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे एकोनत्रिंशः सर्गः ।। 5.29।।\n\nसेति । व्यपनीततन्द्री निरस्तजाड्या । हर्षविवृद्धसत्त्वा हर्षविकसितचित्ता । शुक्ले शुक्लपक्षे", "siromani": "सेति । वीतो व्यतीतः शोको यस्याः व्यपनीता गता तन्द्रा यस्याः शान्तो ज्वरो मनस्तापो यस्याः हर्षेण विबुद्धं प्रकाशितं सत्त्वं चित्तं यस्याः सा आर्या सीता शुक्ले सितपक्षे शीतांशुना चन्द्रेण रात्रिरिव वदनेनाशोभत"}, "has_tier1": false, "notes": [{"id": "lexical:5.29.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vītaśoka", "note_ru": "Вита-шока (vīta-śoka, adj., бахуврихи) — «тот, у кого ушло горе; освободившийся от скорби»: vīta p.p.p. от √vī- (или vi+√i- «идти прочь», Whitney #600) «ушедший, прошедший» + śoka m. «горе» (уже в списке исключённых; здесь в составе нового композита). MW: vīta 'gone away, absent, free from'. Трансформационная функция слова: предшествующий стих 28.17 зафиксировал nirvedam avāpa («впала в нирведу»), а гл. 29 завершается vītaśokā — мгновенный переход к избавлению, обеспеченный нимиттами. Структурно этот момент аналогичен йогическому растворению āvaraṇa («завесы»): тело само сигнализирует об онтологическом повороте раньше, чем разум его осознаёт. Подстрочник «избавившаяся от горя» точен семантически, но не акцентирует архитектурную роль этого слова как финального аккорда двухглавной дуги скорбь → знаки → избавление.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:vIta+dic_mw:Soka"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s29_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

<script>
const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 19, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 26, "verses_with_notes": 15, "notes_by_layer": {"tier1": 9, "lexical": 6, "phase2": 6, "edition": 0, "crosstext": 4}}, "sarga": 19, "verses": [{"verse_id": "5.19.2", "verse": "2", "sanskrit_iast": "tato dṛṣṭvaiva vaidehī rāvaṇaṃ rākṣasādhipam । prāvepata varārohā pravāte kadalī yathā ॥2॥", "leonov_ru": "Едва увидев, Вайдехи, Равану, владыку ракшасов, Задрожала прекраснобедрая, словно на ветру стебель банана.", "commentary": {"tilaka": "ततो हनूमतः प्लवनानन्तरम् । तस्मिन्नेव काले ऽपररात्ररूपे आगमनकाल एव रावणं दृष्ट्वा । ततो ऽनन्तरं प्रावेपत ।। 5.19.1,2 ।।\n\nरुदत्युपविष्टा ऽभूत् । भीतस्वभावोक्त्या स्वभावोक्तिरत्रालङ्कारः", "bhusana": "ततो दृष्ट्वैव वैदेही रावणं राक्षसाधिपम् ।\n\nप्रावेपत वरारोहा प्रवाते कदली यथा"}, "has_tier1": true, "notes": [{"id": "tier1:5.19.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}, {"id": "lexical:5.19.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kadalī", "note_ru": "Кадали (kadalī, f.) — банановое растение (Musa sapientum / paradisiaca). MW: kadalī 'the plantain or banana tree'. Сравнение Ситы с банановым стеблем, дрожащим на ветру, устойчиво в санскритской поэтике (kadalī pravāte = «банан на ветру» = крайняя хрупкость). Банановый стебель — образец нежности: его стволик состоит из слоёв листовых влагалищ, он мягок и легко гнётся. В отличие от тростника (naḍa), который «плачет» разлукой (тема нани Руми), kadalī — символ pure женской уязвимости без резонанса. Форма сравнения pravāte kadalī встречается в Mahābhārata (1.123.17) как устойчивый симиль для дрожащей женщины.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:kadalI", "collision_tier1": true}]}, {"verse_id": "5.19.5", "verse": "5", "sanskrit_iast": "asaṃvṛtāyām āsīnāṃ dharaṇyāṃ saṃśitavratām । chinnāṃ prapatitāṃ bhūmau śākhām iva vanaspateḥ ॥5॥", "leonov_ru": "Сидящую на голой земле, стойкую в обетах, Подобную ветке дерева, отломившейся и упавшей на землю.", "commentary": {"tilaka": "असंवृतायामास्तरणरहितायाम् । संशितव्रतां रावणवधाय तीक्ष्णं व्रतमिव कुर्वाणाम्", "bhusana": "असंवृतायामासीनां धरण्यां संशितव्रताम् ।\n\nछिन्नां प्रपतितां भूमौ शाखामिव वनस्पतेः"}, "has_tier1": false, "notes": [{"id": "phase2:5.19.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "saṃśitavratām", "note_ru": "«Стойкую в обетах» (saṃśitavratām) Тилака толкует не как общую аскетическую твёрдость, а конкретно: Сита совершает суровый обет (vrata), направленный на гибель Раваны, — то есть её подвижничество здесь не пассивное благочестие, а действенный обет против похитителя.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Даёт конкретное содержание обета (гибель Раваны), превращая эпитет из общей формулы аскетической стойкости в целенаправленный акт против похитителя — иная грань, чем формульно-эпитетная параллель с риши Кашьяпой в примечании Фазы-1 к этому же стиху.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "crosstext:5.19.5:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "saṃśita-vrata", "note_ru": "saṃśitavratām («стойкую в обетах») — Хануман о Сите, сидящей на голой земле, как отломившаяся ветвь. В Махабхарате saṃśitavrata — постоянный эпитет сурового подвижника-риши: «jagāma śaraṇaṃ tatra kaśyapaṃ saṃśitavratam» (MBh I.27.15) — «пришёл искать покровительства у Кашьяпы, сурового в обетах». Прилагая аскетический эпитет к пленённой Сите, Вальмики уподобляет её подвижнице, обет которой — верность Раме; параллель раскрывает аскетический обертон, скрытый в нейтральном «стойкая в обетах».", "type": "А", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.19.5", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Ādiparvan I.27.15"}]}, {"verse_id": "5.19.6", "verse": "6", "sanskrit_iast": "malamaṇḍanadigdhāṅgīṃ maṇḍanārhām amaṇḍanām । mṛṇālī paṅkadigdheva vibhāti na vibhāti ca ॥6॥", "leonov_ru": "Ту, чье тело было покрыто грязью вместо украшений, достойную украшений, но лишенную их, Словно стебель лотоса, покрытый грязью, сияла она и [вместе с тем] не сияла.", "commentary": {"tilaka": "मलेन मण्डनस्थानेषु दिग्धाङ्गीं रूषिताङ्गीम् । \"चित्राङ्गीम्\" इति पठित्वा मलरूपेण मण्डनेन चित्राङ्गीं कर्बुरामित्यर्थं तीर्थ आह । संन्यासित्वादुचितैव तस्य मले ऽपि मण्डनत्वबुद्धिः । ईदृशीं यां ददर्श सा पङ्कदिग्धा मृणालीव विभाति न विभाति च । स्वरूपशोभयातिमलावरणाच्च न विभातीत्यर्थः", "bhusana": "मलमण्डनचित्राङ्गीं मण्डनार्हाममण्डिताम् ।\n\nमृणाली पङ्कदिग्धेव विभाति न विभाति च"}, "has_tier1": false, "notes": [{"id": "phase2:5.19.6:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "maṇḍanārhām amaṇḍanām", "note_ru": "Тилака снимает кажущееся противоречие «достойная украшений, но лишённая их»: раз Сита стала подобна отрешённой подвижнице (saṃnyāsinī), сама грязь на её теле по праву воспринимается как её истинное украшение. Тиртха же читает здесь иначе — не «покрытая грязью-украшением», а «пёстрая» (citrāṅgī), то есть покрытая грязью пятнами.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Разрешает видимый парадокс стиха («достойна украшений — но без них») доктринальным ходом (грязь=украшение подвижницы) и добавляет вариант чтения (citrāṅgī «пёстрая» по Тиртхе) — ни то ни другое не даёт подстрочник, ограничивающийся образом лотоса в иле, уже разобранным в примечании Фазы-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "crosstext:5.19.6:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "mṛṇālī paṅkadigdhā (Sītā)", "note_ru": "Сита описана как mṛṇālī paṅkadigdhā — «стебель лотоса, покрытый илом»: красота, скрытая грязью. Это один из центральных образов страдающей героини в санскритской поэзии. Кālidāса в «Кумāрасамбхаве» развёртывает этот же образ: белые руки Пāрвати уподоблены стеблям лотоса (Kum. 1.40: madhye yathā śyāmamukhasya tasya mṛṇālayor iva yugam viśuddham — «между двумя стеблями лотоса»). В «Рагхувамше» Кālidāса вновь использует mṛṇālinī для женщины в бедственном положении: Raghu 16.7–8 (mṛṇālinī hriyamāṇā — лотос, уносимый потоком). Формула «лотос в иле» — устойчивый образ добродетельной женщины, попавшей в неподобающие обстоятельства. Сундараканда — ранний эпический источник этого образа; кāвья его переосмысляет в эротическом и трагическом регистрах.", "type": "Б", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.19.6", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Kālidāsa, Kumārasambhava 1.40; Raghuvaṃśa 16.7–8"}]}, {"verse_id": "5.19.7", "verse": "7", "sanskrit_iast": "samīpaṃ rājasiṃhasya rāmasya viditātmanaḥ । saṃkalpahayasaṃyuktair yāntīm iva manorathaiḥ ॥7॥", "leonov_ru": "Казалось, что она стремится желаниями (колесницами души), запряженными конями решимости, К прославленному Раме, льву среди царей.", "commentary": {"tilaka": "सङ्कल्पस्तच्चिन्तनं तद्रूपाश्वसंयुक्तैर्मनोरथै रामसमीपं यान्तीमिव ।। 5.197 ।।\n\nअपश्यन्तीं तामिव", "bhusana": "समीपं राजसिंहस्य रामस्य विदितात्मनः ।\n\nसङ्कल्पहयसंयुक्तैर्यान्तीमिव मनोरथैः", "siromani": "समीपमिति । संकल्पहयैः संकल्परूपाश्वैः संयुक्तैर्मनोरथैर्विदितात्मनः सामान्यतः प्रसिद्धस्वरूपस्य रामस्य समीपं यान्तीमिव शुष्यन्तीमिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.19.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "На желаньях, как на колесницах (yāntīm iva manorathaiḥ) – слово manoratha (желание) букв. состоит из слов manas (душа) и ratha (колесница). Это букв.е значение обыгрывается в следующей строке в композите saṃkalpahayasaṃyukta (запряженный конями решимости)."}]}, {"verse_id": "5.19.9", "verse": "9", "sanskrit_iast": "ceṣṭamānām athāviṣṭāṃ pannagendravadhūm iva । dhūpyamānāṃ graheṇeva rohiṇīṃ dhūmaketunā ॥9॥", "leonov_ru": "Ведущую себя словно пойманная жена владыки змей, Подобную [созвездию] Рохини, которую затмила планета Дхумакету.", "commentary": {"tilaka": "आविष्टां मन्त्राद्यवरुद्धाम् धूप्यमानां सन्तप्यमानाम् धूमवर्णेन केतुना", "bhusana": "वेष्टमानां तथा ऽ ऽविष्टां पन्नगेन्द्रवधूमिव ।\n\nधूप्यमानां ग्रहेणेव रोहिणीं धूमकेतुना\nआविष्टां मणिमन्त्राद्यभिभूताम् । धूप्यमानां सन्तप्यमानाम् । धूमः केतुरिव धूमकेतुः , केतुना ग्रहेणेत्यर्थः । यद्वा ग्रहेण ग्राहकेण आच्छादकेनेति धूमकेतुर्विशिष्यते", "siromani": "आविष्टाम् औषधादिना निरुद्धां चेष्टमानां विविधं चेष्टां कुर्वतीं पन्नगेन्द्रवधूमिव धूमकेतुना ग्रहेण धूप्यमानां संताप्यमानां रोहिणीमिव"}, "has_tier1": false, "notes": [{"id": "lexical:5.19.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dhūmaketu", "note_ru": "Дхумакету (dhūma-ketu, m.) — «дымяное знамение», планета-комета; dhūma «дым» + ketu «знамение, флаг» (MW: dhūmaketu 'a comet, meteor'). В ведийской и эпической астрологии Dhūmaketu — одна из разрушительных «дымных» планет (tāmasamagraha), связанных с бедствиями. Образ стиха 19.9: Рохини (= Сита) «затмевается» кометой Дхумакету (= Раваной), что точно воспроизводит астрологическую модель «злого захвата» (pāpagraha-yoga). Дхумакету как комета в эпической традиции — предвестник войны и гибели царей (ср. Mahābhārata 5.140). Подстрочник переводит «планета Дхумакету» без раскрытия астрологической роли.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:DUmaketu"}]}, {"verse_id": "5.19.10", "verse": "10", "sanskrit_iast": "vṛttaśīle kule jātām ācāravati dhārmike । punaḥ saṃskāram āpannāṃ jātam iva ca duṣkule ॥10॥", "leonov_ru": "Подобную в добродетельной семье, следующей дхарме, И затем пройдя через обряд, рожденную в дурной семье.", "commentary": {"tilaka": "वृत्तमाचारः, शीलं सत्स्वभावः, तद्युते विहितकर्मानुष्ठानवति च कुले जाताम् तादृश एव कुले पुनः संस्कारं पाणिग्रहणसंस्कारमापन्नामपि दुष्कुले जातामुत्पन्नां तत्रैव प्राप्तसंस्कारामिव च मलिनां स्थिताम् । स्त्रीणां विवाहस्यैवोपनयनद्वितीयजन्मस्थानत्वादिति भावः", "bhusana": "वृत्तशीलकुले जातामाचारवति धार्मिके ।\n\nपुनः संस्कारमापन्नां जातामिव च दुष्कुले", "siromani": "वृत्तम् अतिशयेन प्रवृत्तं शीलं यस्मिन् तदेव कुलं तस्मिन् जातां दुष्कुले राक्षसकुले जातामिव राक्षसपुरस्थितात्वेन तत्र जातात्वेन प्रतीयमानामित्यर्थः, पुनः संस्कारम् आपन्नां प्राप्तामिव तत्संसर्गाभाववत्स्थित्या कृतसंस्कारात्वेन प्रतीयमानामित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.19.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Была она словно выдана / Замуж за худородного (punaḥ saṃskāram āpannāṃ jātam iva ca duṣkule) – букв. «словно прошедшая обряд и вновь родившаяся в дурной семье». Здесь замужество уподобляется обряду упанаяна, «второму рождению», через который проходят представители трех высших варн.[Е. Костина] «,» Голдманы отмечают, что сравнение брака с упанаяной - это не частный случай (здесь), а в принципе характерно для восприятия женщины в древнеиндийском обществе."}, {"id": "lexical:5.19.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "punaḥsaṃskāra", "note_ru": "Пунахсамскара (punaḥ-saṃskāra, m.) — «повторный / второй ритуал очищения». Saṃskāra (sam+√kṛ «совершать») — цикл ритуалов перехода (garbhādhāna, nāmakaraṇa, upanayana, vivāha и т.д.), MW: saṃskāra 'making perfect; refinement; a rite, ceremony'. Смысл стиха 19.10 намеренно тёмен: Сита родилась в добродетельной семье (vṛttaśīla kula), но «получила повторный ритуал» (punaḥsaṃskāram āpannā) — словно рождена заново в дурной семье (duṣkula). Комментаторская традиция (Tīkā к Gita Press) читает этот стих как образ нового «рождения» в плену — страдание как второе рождение в нечестивом окружении.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:saMskAra", "collision_tier1": true}, {"id": "phase2:5.19.10:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "jātam iva ca duṣkule", "note_ru": "«Дурная семья» (duṣkula), по Широмани, — не метафора замужества вообще (как трактуют собственное примечание Леонова/Костиной и Голдмены через параллель с обрядом упанаяны), а конкретно нынешнее положение Ситы: находясь в городе ракшасов, она словно рождена среди них самим фактом пребывания там.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "Смещает референт «дурной семьи» с общей социальной метафоры (брак как второе рождение) на конкретное вынужденное пребывание Ситы среди ракшасов — иное прочтение сравнения, чем уже приведённое в собственном примечании Леонова/Костиной.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.19.11", "verse": "11", "sanskrit_iast": "sannām iva mahākīrtiṃ śraddhām iva vimānitām । prajñām iva parikṣīṇām āśāṃ pratihatām iva ॥11॥", "leonov_ru": "Подобную великой славе, которая погибла, подобную поруганной вере, Подобную исчезнувшему знанию, подобную утраченной надежде.", "commentary": {"tilaka": "सन्नां क्षीणाम् विमानितामनादृताम्", "bhusana": "अभूतेनापवादेन कीर्तिं निपतितामिव ।\n\nआम्नायानामयोगेन विद्यां प्रशिथिलामिव\nसन्नामिव महाकीर्तिं श्रद्धामिव विमानिताम् ।\n\nपूजामिव परिक्षीणामाशां प्रतिहतामिव\nसन्नां क्षीणाम् । श्रद्धामिव विमानिताम् अवमानितामित्यर्थः । अवमाने हि कृते अवमन्तरि श्रद्धा मन्दी भवति । पूजामिव परिक्षीणां स्वल्पपूजाद्रव्यामित्यर्थः । प्रतिहतां निष्फलाम्", "siromani": "सन्नां दुर्जनेन अन्यथा कथ्यमानां विमानिताम् अनादृतां श्रद्धामिव परिक्षीणां वितण्डादिना अन्यथा कीर्त्यमानां प्रज्ञामिव"}, "has_tier1": false, "notes": [{"id": "lexical:5.19.11:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "prajñā", "note_ru": "Праджня (prajñā, f.) — «знание, мудрость» (pra+√jñā-, Whitney #660). MW: prajñā 'wisdom, intelligence'. Стих 19.11 содержит разрушительную четвёрку: «великая слава» (mahākīrti), «вера» (śraddhā), «мудрость» (prajñā), «надежда» (āśā) — все описаны как «утраченные», «попранные», «иссякшие», «отражённые». Эта серия — не просто риторические сравнения, но символические ипостаси самой Ситы: она есть воплощённые kīrti, śraddhā, prajñā, āśā человечества (pativratā как метонимия культурных ценностей). Prajñā особенно значима: это не просто «ум», а духовная проницательность, которую буддийская традиция сделает центральной добродетелью.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:prajJA"}]}, {"verse_id": "5.19.12", "verse": "12", "sanskrit_iast": "āyatīm iva vidhvastām ājñāṃ pratihatām iva । dīptām iva diśaṃ kāle pūjām apahatām iva ॥12॥", "leonov_ru": "Подобную погубленному будущему, подобную нарушенному приказу, Подобную стороне света (небесам), сгоревшей в конце времен, подобную подношению богам уничтоженному (оскверненному),", "commentary": {"tilaka": "आयती धनादिप्राप्तिः । आज्ञा राज्ञ इति शेषः । काल उत्पातकाले पूजां देवपूजाम्", "siromani": "प्रतिहतां विषयालाभान्निवृत्तनाशामिव विध्वस्तां कथञ्चिन्निवारिताम् । उत्तरकालकवृद्धिमिव प्रतिहतां केनचिदकृताम् । आज्ञां राजानुशासनमिव काले उत्पातसमये दीप्तां दिशमिव अपहतां कथञ्चित् अन्यथा कृतां पूजामिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.19.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Словно будущее погубленное (āyatīm iva vidhvastām) – слово āyatīm («будущее») автор «Тилаки» понимает как «обретние богатств и т. д.» (dhanādiprāptiḥ).Словно небо сожженное (dīptām iva diśaṃ kāle) – букв. «словно во время сгоревшая сторона света». «Тилака» трактует слово kale как utpātakāle, то есть «во время катастрофы». Такой же трактовки придерживаются авторы комментариев «Таттвадипика» и «Бхушана».Словно дар богам уничтоженный (pūjām apahatām iva) – в критическом издании – pūjām apahṛtām iva «словно подношение [богам] унесенное» (см.: Jhala 1966: 162). Голдмены интерпретируют apahṛta в значении «выполненное недолжным образом» (improperly performed) (см.: Goldman 1984: 165)."}]}, {"verse_id": "5.19.14", "verse": "14", "sanskrit_iast": "prabhām iva tamodhvastām upakṣīṇām ivāpagām । vedīm iva parāmṛṣṭāṃ śāntām agniśikhām iva ॥14॥", "leonov_ru": "Подобную свету, поглощенному тьмой, подобную обмелевшей реке, Подобную оскверненному алтарю, подобную погасшему пламени,", "commentary": {"tilaka": "प्रभां रविप्रकाशम् । तमो ऽन्धकारः । परामृष्टां वेदवेदिरहितपतितैराक्रान्ताम्", "siromani": "तमोध्वस्ताम् अन्धकारावृतां प्रभां सूर्यप्रकाशमिव उपक्षीणां वृष्टिनिवृत्त्या अल्पीभूताम् आपगां गङ्गामिव परामृष्टां चाण्डालेन स्पृष्टां देवीं तत्प्रतिमामिव"}, "has_tier1": false, "notes": [{"id": "lexical:5.19.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vedī", "note_ru": "Веди (vedī, f.) — «жертвенный алтарь»; трапециевидная площадка, вырытая в земле и посыпанная жертвенной травой kuśa, на которой совершается пожертвование. MW: vedī 'the sacrificial ground, the fire-altar'. Сита сравнивается с parāmṛṣṭā vedī — «осквернённым алтарём» (parā+ā+√mṛś «касаться с нарушением»). В ритуальной практике прикосновение нечистого к vedī необратимо оскверняет её и требует повторного освящения. Эта метафора несёт юридическое измерение purity law: Сита = осквернённый алтарь, но её «осквернение» — вынужденное, не добровольное; различие, на котором строится её защита в Uttarakāṇḍa. Подстрочник даёт «оскверненному алтарю» без ритуальной подоплёки.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vedI"}, {"id": "phase2:5.19.14:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vedīm iva parāmṛṣṭāṃ", "note_ru": "И Тилака, и Широмани независимо конкретизируют, кто именно «осквернил» алтарь: не абстрактная нечистота, а прикосновение отверженных/чандалов — Широмани прямо сравнивает Ситу с изваянием божества, оскверненным прикосновением чандалы.", "type": "В", "source_commentary": ["tilaka", "siromani"], "why_proposed": "Оба комментатора сходятся на конкретном сценарии осквернения (прикосновение чандалы), не данном ни подстрочником, ни примечанием Фазы-1, которое ограничивается общей рамкой ритуальной чистоты и её юридических последствий.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.19.16", "verse": "16", "sanskrit_iast": "patiśokāturāṃ śuṣkāṃ nadīṃ visrāvitām iva । parayā mṛjayā hīnāṃ kṛṣṇapakṣe niśām iva ॥16॥", "leonov_ru": "Больную от скорби по мужу, иссохшую подобно реке, чьи воды отведены, Лишенную своей великолепной чистоты, подобную ночи в темную половину месяца,", "commentary": {"tilaka": "विस्रावितां रोधोभङ्गादिना ऽन्यतः प्रापितजलाम्, अत एव शुष्काम्, मृजयाङ्गशुद्ध्या हीनाम् ।। 5.19.16,17 ।।\n\nगृहीतां धृताम् । पश्चात्स्तम्भे लाडितां बद्धाम् । कश्चित्तु-- \"गृहीतामालिताम्\" इति पठित्वा आलितामालानितामित्यर्थमाह", "siromani": "पतिशोकातुराम् । अत एव विस्राविताम् अन्यत्र वाहिताम् अन्यत्र वाहिताम् अत एव शुष्कां नदीमिव परया शरीरशोभानिष्पादिकया मृजया उद्वर्तनादिना हीनाम् अत एव कृष्णपक्षे निशामिव", "bhusana": "पतिशौकातुरां शुष्कां नदीं विस्रावितामिव ।\n\nपरया मृजया हीनां कृष्णपक्षनिशामिव\nविस्रावितां रोधोभङ्गादिना अन्यनिर्गमितजलामित्यर्थः । मृजया उद्वर्तनाद्यङ्गशोधनेन"}, "has_tier1": true, "notes": [{"id": "tier1:5.19.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «patiśokāturāṃ» Нужен комм., patiśokā не = тоска"}, {"id": "tier1:5.19.16:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Стала подобна ночи (kṛṣṇapakṣe niśām iva) – букв. «словно ночь в темную половину месяца»."}]}, {"verse_id": "5.19.17", "verse": "17", "sanskrit_iast": "sukumārīṃ sujātāṅgīṃ ratnagarbhagṛhocitām । tapyamānām ivoṣṇena mṛṇālīm aciroddhṛtām ॥17॥", "leonov_ru": "Очень нежную, с прекрасным телом, привыкшую жить во дворце (в доме, полном драгоценных камней), Подобную сжигаемому зноем недавно вырванному лотосовому стеблю,", "commentary": {"bhusana": "सुकुमारीं सुजाताङ्गी रत्नगर्भगृहोचिताम् ।\n\nतप्यभानामिवोष्णेन मृणालीमचिरोद्धृताम्\nसुजाताङ्गी सुन्दराङ्गीम्", "siromani": "उष्णेन धर्मादिना तप्यमानाम् आचरोद्धृतां मृणालीमिव"}, "has_tier1": false, "notes": [{"id": "crosstext:5.19.17:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "ratnagarbhagṛhocitā mṛṇālī aciroddhṛtā", "note_ru": "Стих о Сите «нежную, с прекрасным телом, привыкшую жить во дворце, полном самоцветов (ratnagarbhagṛhocitā), подобную сжигаемому зноем недавно вырванному лотосовому стеблю (mṛṇālīm aciroddhṛtām)» (V.19.17) совпадает практически слово-в-слово с описанием Дамаянти: Āraṇyaka 3.65.15 «sukumārīṃ sujātāṅgīṃ ratnagarbhagṛhocitām / dahyamānāmivoṣṇena mṛṇālīmaciroddhṛtām». Это вторая (после V.15.20) общая формула из того же пассажа Нала-упакхьяны: образ «дворцовой неженки, ставшей вырванным лотосовым стеблем» — устойчивый троп для героини в изгнании/плену. Сильное свидетельство прямого формульного родства Сита↔Дамаянти. Свидетельство: уровень шлоки (сильная формульная параллель).", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.19.17", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparva 3.65.15"}, {"id": "crosstext:5.19.17:1", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "tap dah", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.19.17", "work_label": "MBh", "verse_address": "MBh 3.65.15", "parallel_sa_iast": "sukumārīṁ sujātāṅgīṁ ratnagarbhagṛhocitām |dahyamānām ivoṣṇena mṛṇālīm aciroddhṛtām ||", "sundara_sa_iast": "sukumārīṁ sujātāṅgīṁ ratnagarbhagṛhocitām |tapyamānām ivoṣṇena mṛṇālīm aciroddhṛtām ||", "quality": "PARTLY", "source": "DCS parallel-search (PARTLY); MBh 3.65.15", "edition_flag": "vulgate", "shloka_critical": "V.17.16", "verse_address_vulgate": ""}]}, {"verse_id": "5.19.19", "verse": "19", "sanskrit_iast": "ekayā dīrghayā veṇyā śobhamānām ayatnataḥ । nīlayā nīradāpāye vanarājyā mahīm iva ॥19॥", "leonov_ru": "С единственной длинной косой она была прекрасна без усилий (не прилагая к этому специальных усилий), Была она подобна земле с темной полосой леса в конце сезона дождей.", "commentary": {"tilaka": "अयन्नत इति । केशसंस्काराभावदयत्नतः सिद्ध्येति शेषः", "siromani": "नीलया वनराज्या महीमिव एकया वेण्या शोभमाना", "bhusana": "एकया दीर्घया वेण्या सोभमानामयत्नतः ।\n\nनीलया नीरदापाये वनराज्या महीमिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.19.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "мб комм.?[Е. Костина] Ср. с 15.25"}]}, {"verse_id": "5.19.20", "verse": "20", "sanskrit_iast": "upavāsena śokena dhyānena ca bhayena ca । parikṣīṇāṃ kṛśāṃ dīnām alpāhārāṃ tapodhanām ॥20॥", "leonov_ru": "От поста, скорби, дум и страха Изнуренную, исхудавшую, печальную, воздержанную в пище, богатую [только] тапасом,", "commentary": {"tilaka": "अल्पाहारां जलमात्राहाराम् अस्नातयान्नस्य ग्रहीतुमशक्यत्वात् देवराजतः पायसलाभेन तदनपेक्षणाच्च", "siromani": "उपवासादिना कृशां कृशावयवाम् अत एव परिक्षीणां परिक्षीणमनस्काम् अल्पाहाराम् अल्पः अतिसूक्ष्मः वायुरित्यर्थः, आहारो यस्यास्ताम्", "bhusana": "उपवासेन शोकेन ध्यनेन च भयेन च ।\n\nपरिक्षीणां कृशां दीनामल्पाहारां तपोधनाम्\nअल्पाहारां तोयमात्राहारामित्यर्थः । यद्वा अल्पाहारां मितभोजिनीमित्युत्तमस्त्रीलक्षणमुच्यते"}, "has_tier1": false, "notes": [{"id": "lexical:5.19.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tapodhanā", "note_ru": "Тапо-дхана (tapo-dhana, adj./f.) — «богатая тапасом»; tapa(s) «жар аскезы» + dhana «богатство, имущество». MW: tapodhanа 'rich in religious austerity'. Сита в стихе 19.20 описана как «алпахара» (скудно питающаяся) и «тапо-дхана» — её единственное «богатство» это тапас, накопленный страданием. Это прямое воспроизводство типологии нищего-аскета, накопившего духовное богатство вместо материального: Сита без украшений, без пищи, без мужа, но с максимальным тапасом. Термин создаёт неожиданный инверсный портрет: самая бедная внешне → самая богатая духовно.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:tapoDana"}, {"id": "phase2:5.19.20:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "alpāhārāṃ", "note_ru": "По Тилаке, скудость пищи Ситы объясняется не только скорбью, но и ритуальным: немытая, она не вправе принимать обычную пищу, — а кроме того, ей уже незачем есть больше, так как Индра тайно даровал ей рисовую кашу (пайасу).", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "Даёт двойное конкретное объяснение скудной пищи (ритуальная нечистота от немытости + дар пайасы от Индры), отсылающее к сюжету, известному по другим частям поэмы, — подстрочник и лексическая помета Фазы-1 (tapodhanā как общий образ аскетического богатства) этого обоснования не дают.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.19.21", "verse": "21", "sanskrit_iast": "āyācamānāṃ duḥkhārtāṃ prāñjaliṃ devatām iva । bhāvena raghumukhyasya daśagrīvaparābhavam ॥21॥", "leonov_ru": "Страдающую от скорби, сложившую смиренно руки, словно умоляя [некое] божество Всей душою о поражении Дашагривы главой рода Рагху.", "commentary": {"tilaka": "तपोधनत्वादेव रघुमुख्यस्य सकाशाद्दशग्रीवपराभवमायाचमानां प्रार्थयन्तीम्, अत एव भावेनान्तरध्यानेन देवतामिव एवार्थे इव । स्वकुलदेवतामेवोद्दिश्य प्राञ्जलिं कृतनमस्काराम्", "siromani": "दशग्रीवपराभवम् आयाचमानां मनोगतराघवाद्याचयन्तीम् अत एव प्राञ्जलिं देवतां चेष्टाराहित्येन देवप्रतिमामिव रघुमुख्यस्य भावेनातिचिन्तनयोपलक्षिताम्", "bhusana": "आयाचमानां दःखार्तां प्राञ्जलिं देवतामिव ।\n\nभावेन रघुमुख्यस्य दशग्रीवपराभवम्\nआयाचमानामिति । रघुमुख्यस्य कर्तुः दशग्रीवपराभवं भावेन मनसा आयाचमानां प्रार्थयन्तीमिव स्थिताम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.19.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Будто моля божество / О низвержении Раваны āyācamānāṃ… prāñjaliṃ devatām iva bhāvena raghumukhyasya daśagrīvaparābhavam – букв. «словно бы умоляющую в душе [некое] божество о поражении Дашагривы от [руки] предводителя [рода] Рагху»."}, {"id": "phase2:5.19.21:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tapodhanatvād eva … āyācamānām", "note_ru": "По Тилаке, именно потому, что Сита «богата тапасом» (эпитет предыдущего стиха), её мольба о гибели Раваны обретает действенную силу — накопленный подвиг здесь не просто описание, а источник могущества молитвы; молится же она, уточняет Тилака, не безличному божеству, а собственному родовому божеству.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Устанавливает причинно-следственную связь между двумя стихами (тапас как источник действенности мольбы) и уточняет адресата молитвы (родовое божество, а не божество вообще) — подстрочник даёт оба факта рядом, без этой связи.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.19.22", "verse": "22", "sanskrit_iast": "samīkṣamāṇāṃ rudatīm aninditāṃ । supakṣmatāmrāyataśuklalocanām । anuvratāṃ rāmam atīva maithilīṃ । pralobhayām āsa vadhāya rāvaṇaḥ ॥22॥", "leonov_ru": "Озирающуюся, плачущую, безупречную С покрасневшими широкими ясными очами с прекрасными ресницами, Преданную весьма Раме [царевну] Майтхили Пытался соблазнить Равана на свою погибель.", "commentary": {"tilaka": "क्रोधेन रोदनेन वा ताम्रपान्ते आयते शुक्ले च लोचने यस्यास्ताम् । वधाय तावन्मात्रफलकमेव, न तु स्वेष्टफलकमिति तात्पर्यम्", "siromani": "समीक्षमाणाम् इतस्ततो राममवलोकयन्तीं सुपक्ष्माणि ताम्रायतानि शुक्लानि रोदनेन शुक्लत्वमापन्नानि लोचनानि यस्यास्तां राममुद्दिश्य अतीव अनुव्रतां मैथिलीं रावणः प्रलोभयामास वञ्चनावचनमुच्चारयामास । षोडशानां श्लोकानामेकत्रान्वयः"}, "has_tier1": true, "notes": [{"id": "tier1:5.19.22:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Чьи ясные очи от слез покраснели (supakṣmatāmrāyataśuklalocanām) – букв. «плачущую, чьи широкие ясные глаза, [обрамленные] прекрасными ресницами, красны»."}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s19_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

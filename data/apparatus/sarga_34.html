", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Владеющий оружием Брахмы, / Лучший из знающих Веды (yo brāhmam astraṃś vedaṃś ca veda vedavidāṃ varaḥ) – автор комментария «Тилака» понимает выражение «yo brāhmam astraṃś vedaṃś ca» как «владеющий всеми видами оружия», подобно тому, как Брахма охватывает весь универсум.", "service": [], "suggestions": [], "seq": 4}]}, {"verse_id": "5.34.6", "verse": "6", "sanskrit_iast": "kalyāṇī bata gātheyaṃ laukikī pratibhāti mā । eti jīvantam ānando naraṃ varṣaśatād api ॥6॥", "leonov_ru": "Кажется мне, что благосклонна ко мне пословица: «Радость приходит к живому человеку, даже если на это понадобится сотня лет».", "commentary": {"tilaka": "असंभावितमपि रामप्रसङ्गं जीवितधारणेन प्राप्तत्वात्तत्संवादिनीं लौकिकीं गाथां स्तौति-- कल्याणीति । गाथायाः संवादित्वदर्शनजो हर्षो बतेत्यनेन सूच्यते । कल्याणी सत्यार्थेति मा मां प्रतिभाति । मज्ज्ञानविषया भवतीत्यर्थः । गाथां पठति एतीति । जीवन्तमेवेत्येव, अतो बहुदुःखं सोढ्वा ऽपि जीवितव्यमिति भावः", "bhusana": "कल्याणी बत गाथेयं लौकिकी प्रतिभाति मा ।\n\nएति जीवन्तमानन्दो नरं वर्षशतादपि\nदुःखबाहुल्येपि रामदर्शनप्रत्याशया कृच्छ्रेण जीवन्त्याः देव्याः जीवनफलस्य लब्धत्वीत्तत्संवादिनीं गाथां स्तौति कल्याणीति । कल्याणी सत्यार्था । मा प्रतिभाति मां प्रतिभाति । वर्षशतादपीत्यन्ते इतिकरणं बोद्ध्यम्", "siromani": "तदाकारमाह कल्याणीति । जीवन्तं नरं जनं वर्षशतादपि आनन्दः एति प्राप्नोति इयं लौकिकी गाथा कल्याणी सत्येत्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "tier1:5.34.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Кажется мне справедливым / Это реченье мирское ( kalyāṇī bata gātheyaṃ laukikī pratibhāti mā) – слово kalyāṇī переведено по комментарию «Тилака» как «истинный, правдивый» (satyārtha).", "service": [], "suggestions": [], "seq": 5}, {"id": "lexical:5.34.6:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "laukikī gāthā", "note_ru": "Лаукики гатха (laukikī gāthā) — «народная поговорка/песня», букв. «мирская (laukika) стихотворная сентенция (gāthā)». Gāthā (√gā- «петь») — архаичный термин для поучительного стиха вневедийского происхождения; MW: gāthā «a verse or stanza not of Vedic origin». Laukika противопоставляется śāstrīya (шастрам) и vaidika (ведам): это знание, закреплённое в народном сознании. Сита цитирует поговорку «к живому приходит радость, пусть даже через сто лет» — и сама признаёт её точность. Тема «народная мудрость оказалась права» работает как тонкая инверсия: именно laukika, а не учёное знание, даёт Сите опору.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:gATA+dic_mw:laukika", "source_links": [{"label": "MW gATA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=gATA"}, {"label": "MW laukika", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=laukika"}], "collision_tier1": true, "seq": 6}, {"id": "crosstext:5.34.6:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "i e", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.34.6", "work_label": "Rām", "verse_address": "Rām 6.114.2 (крит. изд.)", "parallel_sa_iast": "kalyāṇī bata gātheyaṁ laukikī pratibhāti me |eti jīvantam ānando naraṁ varṣaśatād api ||", "sundara_sa_iast": "kalyāṇī bata gātheyaṁ laukikī pratibhāti me |ehi jīvantamānando naraṁ varṣaśatād api ||", "quality": "PARTLY", "source": "DCS parallel-search (PARTLY); Rām 6.114.2 (крит. изд.)", "source_links": [], "edition_flag": "vulgate", "shloka_critical": "V.32.6", "verse_address_vulgate": "", "collision_tier1": true, "seq": 7}]}, {"verse_id": "5.34.10", "verse": "10", "sanskrit_iast": "aho dhig dhik kṛtam idaṃ kathitaṃ hi yad asya me । rūpāntaram upāgamya sa evāyaṃ hi rāvaṇaḥ ॥10॥", "leonov_ru": "«Увы, позор мне! [Напрасно] рассказала я ему [все] это. Ведь это Равана, изменивший облик!»", "commentary": {"tilaka": "यदस्य यदनेन कथितं कथनं कृतं वार्ता कृता इदं धिग्धिक् कथितमिति भावे निष्ठा । तत्र हेतुमाह-- रूपान्तरमिति । यः पूर्वं मायया मामपाहरत्स एव रावणो रूपान्तरं प्राप्य वर्तत इत्यर्थः", "bhusana": "अहो धिग् दुष्कृतमिदं कथितं हि यदस्य मे ।\n\nरूपान्तरमुपागम्य स एवायं हि रावणः\nमे मया अस्य पुरतः यत्कथितं तत् दुष्कृतम् अनुचितं कृतम् । इदम् अनालोच्य कथनं धिक् । अहो इति खेदे । खेदहेतुमाह रूपान्तरमिति । वर्तत इति शेषः", "siromani": "परिशङ्कास्वरूपमाह अहो इति । रूपान्तरमुपागम्य प्राप्य स रावण एवायं हि यदि तदा अस्य अनेन यत् कथितं कथनम् इदं कृतं तत् अहो आश्चर्यं धिक् धिक् च"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "lexical:5.34.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "rūpāntara", "note_ru": "Рупантара (rūpa-antara, n.) — «принятый другой облик», тат-пуруша: rūpa «форма, облик» (от √rū-) + antara «иной». MW: rūpāntara «change of form, transformation». Термин технический в контексте ракшасьих способностей: ракшасы в эпосе определяются через kāmarūpin — «принимающие желаемый облик» по желанию. Страх Ситы рационален: она однажды уже видела rūpāntara (Равана-паривраджака). Именно поэтому она вскрикивает: «Это тот же Равана, принявший rūpāntara!» — слово активирует воспоминание о травматическом прецеденте.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:rUpAntara", "source_links": [{"label": "MW rUpAntara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=rUpAntara"}], "seq": 8}]}, {"verse_id": "5.34.11", "verse": "11", "sanskrit_iast": "tām aśokasya śākhāṃ tu vimuktvā śokakarśitā । tasyām evānavadyāṅgī dharaṇyāṃ samupāviśat ॥11॥", "leonov_ru": "Она, исхудавшая от горя, отпустила ветку ашоки, Безупречная телом опустилась на землю.", "commentary": {"tilaka": "अशोकस्य अशोकवनस्थशिंशपावृक्षस्येत्यर्थः", "bhusana": "तामशोकस्य शाखां सा विमुक्ता शोककर्शिता ।\n\nतस्यामेवानवद्याङ्गी धरण्यां समुपाविशत्\nयद्यपि पूर्वं शिंशुपाशाखावलम्बनमुक्तं तथापि शिंशुपाशाखा अशोकसंवलितेति क्वचिच्छिंशुपेत्युच्यते क्वचिदशोक इति । अतो न कश्चिद्दोषः", "siromani": "तामिति । तां गृहीताम् अशोकस्य अशोकवनिकास्थशिंशुपायाः शाखां विमुक्त्वा विमुच्य शोककर्शिता सीता तस्यां पूर्वंमध्यासितायां धरण्यां समुपाविशत्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "phase2:5.34.11:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "aśoka / śiṃśapā", "note_ru": "Бхушана снимает кажущееся противоречие: дерево, названное здесь aśoka, в предыдущих саргах именовалось śiṃśapā — по его пояснению, это одно и то же дерево ашокового сада, которое комментаторская традиция называет то по роду сада, то по собственному видовому имени («śiṃśupā aśoka-saṃvalitā»), так что ошибки в тексте нет.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "снимает видимое противоречие в ботанической номенклатуре между саргами, которое подстрочник не отмечает", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 9}]}, {"verse_id": "5.34.14", "verse": "14", "sanskrit_iast": "māyāṃ praviṣṭo māyāvī yadi tvaṃ rāvaṇaḥ svayam । utpādayasi me bhūyaḥ saṃtāpaṃ tan na śobhanam ॥14॥", "leonov_ru": "Если ты сам чародей Равана, прибегнувший к иллюзии, Причиняешь мне еще больше страданий, это недостойно.", "commentary": {"tilaka": "तां धरण्युपविष्टामवन्दत नमस्कृतवान् । एनं दृष्ट्वा भयसन्त्रस्तां भूयः पुनरेनं नापश्यत् ।। 5.34.12,13 ।।\n\nभूयः सन्तापं यदुत्पादयसि तन्न शोभनम्", "bhusana": "मायां प्रविष्टो मायावी यदि त्वं रावणः स्वयम् ।\n\nउत्पादयसि मे भूयः सन्तापं तन्न शोभनम्", "siromani": "वचनाकारमाह मायामित्यादिभिः । मायां कपटं प्रविष्टः आश्रितः सन् मायावी स्वयं रावणस्त्वं यदि भूयः संतापमुत्पादयसि तर्हि तन्न शोभनम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "tier1:5.34.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Муки мои ты усиливаешь, / А это ведь недостойно (utpādayasi me bhūyaḥ / saṃtāpaṃ tan na śobhanam) – автор комментария «Бхушана» усматривает здесь намек на то, что Равана, заставляющий мучаться Ситу в разлуке с Рамой, тоже некогда будет страдать от разлуки с теми, кого он любит («tavāpyabhīṣṭavirahasaṃtāpo bhaviṣyati»).", "service": [], "suggestions": [], "seq": 10}, {"id": "crosstext:5.34.14:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "māyā / māyāvī (Rāvaṇa)", "note_ru": "Хануман обращается к Раване: «Если ты сам māyāvī ('чародей'), прибегнувший к māyā ('иллюзии/обману')…» (māyāṃ praviṣṭo māyāvī yadi tvaṃ rāvaṇaḥ svayam). Термин māyā в эпическом значении — «иллюзорный облик, волшебство» (Равана мог принимать чужой вид). Упанишады дают философское измерение этого термина, которое в эпической трактовке ещё только складывается. Шветашватара-упанишада (1.10) — ближайший к эпосу контекст: māyāṃ tu prakṛtiṃ vidyān māyinaṃ tu maheśvaraṃ («Знай, что пракрити — это māyā, а тот, кто создаёт māyā, — Махешвара»; Śvet. 4.10); и: viśvamāyānivṛttiḥ («исчезновение вселенской māyā»; Śvet. 1.10). В БрихАд-упанишаде 2.5.19 māyā связана с Индрой: indro māyābhiḥ pururūpa īyate («Индра шествует, [приняв] множество обликов через свои māyā»). Равана как māyāvī — эпическая персонификация того самого «Бога, создающего иллюзорные облики» (māyin), которому Упанишады дают космологическое объяснение. Locus classicus для философского понимания термина māyā в его начальной, ещё не адвайтической форме.", "type": "А", "cluster": "upanishads", "cluster_label": "", "shloka_ref": "V.34.14", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Śvetāśvatara Up. 1.10 (viśvamāyānivṛttiḥ); 4.10 (māyāṃ tu prakṛtiṃ vidyān māyinaṃ tu maheśvaraṃ); Bṛhad. Up. 2.5.19 (indro māyābhiḥ pururūpa īyate)", "source_links": [], "collision_tier1": true, "seq": 11}]}, {"verse_id": "5.34.15", "verse": "15", "sanskrit_iast": "svaṃ parityajya rūpaṃ yaḥ parivrājakarūpadhṛt । janasthāne mayā dṛṣṭas tvaṃ sa eva hi rāvaṇaḥ ॥15॥", "leonov_ru": "Воистину ты – Равана, который, как видела я в Джанастхане, Отбросив собственный облик, принял облик странствующего аскета.", "commentary": {"bhusana": "स्वं परित्यज्य रूपं यः परिव्राजकरूपधृत् ।\n\nजनस्थाने मया दृष्टस्त्वं स एवासि रावणः", "siromani": "स्वमिति । स्वं राक्षसीयं रूपं परित्यज्य परिव्राजकरूपवान् सन् यो रावणो जनस्थाने मया दृष्टः स त्वं किम् । एव किमर्थे"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "lexical:5.34.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "parivrājaka", "note_ru": "Паривраджака (parivrājaka, m.) — «странствующий аскет, бродячий монах», от pari+√vrāj- («странствовать»). MW: parivrājaka «a wandering religious mendicant». В «Аранья-канде» Равана является к Сите именно в этом образе — с посохом и знаками аскета. Обман принципиален: parivrājaka неприкосновенен и должен быть принят по законам гостеприимства (atithi-dharma). Сита была обязана впустить его как аскета. Данный стих воспроизводит этот эпизод: «Ты — тот, кого я видела в Джанастхане в облике parivrājaka». Термин несёт в себе нарратив о профанации священного статуса через māyā.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:parivrajaka", "source_links": [{"label": "MW parivrajaka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=parivrajaka"}], "seq": 12}]}, {"verse_id": "5.34.17", "verse": "17", "sanskrit_iast": "athavā naitadevaṃ hi yan mayā pariśaṅkitam । manaso hi mama prītir utpannā tava darśanāt ॥17॥", "leonov_ru": "Или же подозрения мои неверны, Ведь в душе моей пробудилась радость при виде тебя.", "commentary": {"tilaka": "तवैवंरूपकरणमपि सुकरमेवेत्याह स्वं परित्यज्येति ।। 5.34.15,16 ।।\n\nएवं रावणदौरात्म्याद्धनूमन्तं रावणमाशङ्क्य तद्दर्शनजनितमात्मनो मनःप्रसादमालोच्य तां शङ्कां निराचष्टे अथवेति । यन्मया परिशङ्कितं रावणत्वमेतदेवं नयतस्तव दर्शनान्मम मनसः प्रीतिरुत्पन्ना । रावणत्वे हि सा नोत्पद्येतेति भावः\nतव मयि रामदूतत्वनिश्चयः कथं स्यादिति चेत्तत्राह यदीति । पृच्छामीति । रामकथामिति शेषः । तदेवाह-- प्रिया रामकथा हीति", "bhusana": "अथवा नैतदेवं हि यन्मया परिशङ्कितम् ।\n\nमनसो हि मम प्रीतिरुत्पन्ना तव दर्शनात्", "siromani": "इदानीमनुमानतो नायं रावण इति निश्चित्य पक्षान्तरमाह अथवेति । हि यतः तव दर्शनात् मम मनसः प्रीतिरुत्पन्ना अतः यत् मया परिशङ्कितं तन्नैवास्ति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "edition:5.34.17:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.34.17 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.34.17", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.34.17", "iast": "athavā naitadevaṃ hi yan mayā pariśaṅkitam । manaso hi mama prītir utpannā tava darśanāt ॥17॥"}], "seq": 13}]}, {"verse_id": "5.34.18", "verse": "18", "sanskrit_iast": "yadi rāmasya dūtas tvam āgato bhadram astu te । pṛcchāmi tvāṃ hariśreṣṭha priyā rāmakathā hi me ॥18॥", "leonov_ru": "Если ты – посланец Рамы, пришедший [ко мне], благо тебе. Спрошу тебя, о лучший из обезьян, ибо приятен мне рассказ о Раме.", "commentary": {"bhusana": "यदि रामस्य दूतस्त्वमागतो भद्रमस्तु ते ।\n\nपृच्छामि त्वां हरिश्रेष्ठ प्रिया रामकथा हि मे ।\n\nगुणान् रामस्य कथय प्रियस्य मम वानर", "siromani": "यदीति । आगतः त्वं यदि रामस्य दूतः तर्हि त्वां रामकथाः पृच्छामि ते भद्रमस्तु"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "tier1:5.34.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "hariśreṣṭha", "kind": "omission", "text": "опущено обращение"}], "suggestions": [], "seq": 14}, {"id": "tier1:5.34.18:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "vānaracittaṃ harasi me saumya", "kind": "note", "text": "Опущены обращения"}], "suggestions": [], "seq": 15}]}, {"verse_id": "5.34.23", "verse": "23", "sanskrit_iast": "kiṃ nu syāc cittamoho 'yaṃ bhaved vātagatis tv iyam । unmādajo vikāro vā syād iyaṃ mṛgatṛṣṇikā ॥23॥", "leonov_ru": "Что же это? Или помрачение ума? Галлюцинация? Бред, рожденный безумием? Или же это мираж?", "commentary": {"tilaka": "पुनरुत्प्रेक्षते-- किं न्विति । चित्तमोहो निरन्तररामध्यानजनितस्तत्प्रेषितदूतदर्शनसंभाषणादिविषयो भ्रमः । वातगतिर्भूतावेशादिजनितो भ्रमः । उन्मादो विरहिणां पित्तोद्रेकरूपावस्थाविशेषजो भ्रमः । मृगतृष्णिका तद्वत्प्रत्यक्षो भ्रमः", "bhusana": "किन्नु स्याच्चित्तमोहो ऽयं भवेद्वातगतिस्त्वियम् ।\n\nउन्मादजो विकारो वा स्यादियं मृगतृष्णिका\nएवं यथार्थस्वप्रपक्षौ निरस्य पुनश्चतुरो विभ्रमपक्षानुत्प्रेक्षते किन्नु स्यादिति । चित्तमोहः रामक्षेमवार्ताश्रवणकुतूहलकन्दलितनिरन्तरचिन्तासन्ततिपरिणतिवेशेषरूपः कोपि मनसो विभ्रम इत्यर्थः । असत्यश्चित्तसङ्कल्पो वा । वातगतिः उपवासादिप्रयुक्तधातुक्षोभजो वातविकाररूपो भ्रमः । तदध्यारोपो वा यथा त्वरूपस्य वायोः पांसुपुञ्जरूपविशेषो ऽध्यारोपः । उन्मादजो विकारो वा । उन्मादो नाम विरहिणां कश्चिदवस्थाविशेषः, तज्जो विकारो भ्रमः । मृगतृष्णिका अन्यस्यान्यरूपेणावभासः । चित्तमोहोन्मादावप्रकृतिस्थप्रतिभासविशेषौ । वातगतिमृगतृष्णिके तु प्रकृतिस्थस्य", "siromani": "किमिति । अयं समागमः चित्तमोहः स्यात् इयं वातगतिः वायुविकारो वा उन्मादजः भूतावेशादिहेतुकोन्मादजनितो विकारो वा अयं मृगतृष्णिका वा स्यात्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "lexical:5.34.23:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mṛgatṛṣṇikā", "note_ru": "Мригатришника (mṛga-tṛṣṇikā, f.) — «мираж», букв. «жажда оленя / мираж, который принимает олень за воду». MW: mṛgatṛṣṇā «mirage; thirst of the deer». Классический образ иллюзии в санскритской философии (Веданта, буддийская эпистемология). Сита перебирает свои возможные состояния: cittamoha («помрачение ума»), vātagati («воздушное видение»), unmādaja («порождённое безумием»), mṛgatṛṣṇikā («мираж»). Этот список — не поэтическое преувеличение, а систематическая классификация видов когнитивной ошибки. Включение mṛgatṛṣṇikā показывает, что эпос использует тот же философский словарь, что и даршаны.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:mRgatRzRA", "source_links": [{"label": "MW mRgatRzRA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=mRgatRzRA"}], "seq": 16}]}, {"verse_id": "5.34.25", "verse": "25", "sanskrit_iast": "ity evaṃ bahudhā sītā sampradhārya balābalam । rakṣasāṃ kāmarūpatvān mene taṃ rākṣasādhipam ॥25॥", "leonov_ru": "Так разными способами рассуждала Сита о сильном и слабом (взвешивала «за» и «против») Поскольку у ракшасов есть способность изменять облик, полагала она, что это [перед ней] владыка ракшасов.", "commentary": {"tilaka": "बलाबलम् बलं रक्षसां कामरूपबलम्, अबलं रामदूतस्य वानरस्यात्रागमनसामर्थ्याभावः ।। 5.34.25,26 ।।\n\nनिश्चितं रावणत्वनिश्चयम् । श्रोत्रानुकूलैर्वचनै रामगुणकथनरूपैः । विश्वासार्थं गुणान्रामस्य कथयति । सीतोक्तेरिति भावः । संप्रहर्षयन्वक्ष्यमाणं वचः । कथयामासेति शेषः", "bhusana": "इत्येवं बहुधा सीता संप्रधार्य बलाबलम् ।\n\nरक्षसां कामरूपत्वान्मेने तं राक्षसाधिपम्", "siromani": "इतीति । इति अनेन प्रकारेण बहुधा बहुप्रकारं बलाबलं संप्रधार्य विचार्य रक्षसां कामरूपत्वाद्धेतोस्तं हनूमन्तं राक्षसाधिपं मेने"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "lexical:5.34.25:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "balābala", "note_ru": "Балабала (balā-bala, n. двандва) — «силу и бессилие; доводы за и против». MW: balābala «the pros and cons, relative strength». Технический термин санскритской диспуты и нитишастры: взвешивание аргументов. Глагол sampradhārya («взвесив») относится именно к этому интеллектуальному акту. Сита в данном стихе — не жертва, беспомощно trembling в страхе, а мыслящий агент, применяющий критическое взвешивание доводов (sampradhārya balābalam) прежде чем принять решение. Это одна из редких сцен в эпосе, где женский персонаж показан в процессе формальной эпистемологической рефлексии.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:balAbala", "source_links": [{"label": "MW balAbala", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=balAbala"}], "seq": 17}]}, {"verse_id": "5.34.29", "verse": "29", "sanskrit_iast": "vikrameṇopapannaś ca yathā viṣṇur mahāyaśāḥ । satyavādī madhuravāg devo vācaspatir yathā ॥29॥", "leonov_ru": "Наделенный доблестью, словно многославный Вишну, Говорящий правду, сладкоречивый, словно бог Вачаспати,", "commentary": {"bhusana": "सत्यवादी मधुरवाग् देवो वाचस्पतिर्यथा ।\n\nरूपवान् सुभगः श्रीमान् कन्दर्प इव मूर्तिमान्\nसत्यवादी मधुरवाग् देवो वाचस्पतिर्यथा ।\n\nरूपवान् सुभगः श्रीमान् कन्दर्प इव मूर्तिमान्", "siromani": "विक्रमेणेति वाचस्पतिर्बृहस्पतिः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "lexical:5.34.29:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vācaspati", "note_ru": "Вачаспати (vācas-pati, m.) — «Господин речи», эпитет Брихаспати. Тат-пуруша: vācas (gen. от vāc «речь») + pati «господин». MW: vācaspati «lord of speech; Bṛhaspati». Брихаспати — небесный советник богов, специалист по nīti (политической науке) и мастер красноречия в дипломатии. Сравнение Рамы с Брихаспати («мадхура-вак, как Вачаспати») не просто говорит о приятном голосе: оно вписывает Раму в роль мудрого советника-правителя, совмещающего вооружённую доблесть (Вишну) с дипломатическим красноречием (Вачаспати). Двойной образ стиха 28–29 выражает идеальный тип кшатрия.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:vAcaspati", "source_links": [{"label": "MW vAcaspati", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=vAcaspati"}], "seq": 18}, {"id": "phase2:5.34.29:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vācaspati", "note_ru": "Широмани поясняет эпитет vācaspati прямым отождествлением: это Брихаспати, наставник богов, — сравнение сладкоречия Рамы намеренно отсылает к мифологической фигуре красноречия, а не служит общим украшением.", "type": "В", "source_commentary": ["siromani"], "why_proposed": "раскрывает мифологическое имя, скрытое за эпитетом, которое подстрочник передаёт лишь как титул «бог Вачаспати»", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 19}]}, {"verse_id": "5.34.30", "verse": "30", "sanskrit_iast": "rūpavān subhagaḥ śrīmān kandarpa iva mūrtimān । sthānakrodhe prahartā ca śreṣṭho loke mahārathaḥ ॥30॥", "leonov_ru": "Прекрасный, счастливый (удачливый), славный (благой) словно воплощенный [бог любви] Кандарпа, Сражающийся [только] с теми, кто заслуживает гнева, лучший воитель в мире, Весь мир находит прибежище в тени рук этого великого духом.", "commentary": {"bhusana": ".\n\nस्थानक्रोधः प्रहर्ता च श्रेष्ठो लोके महारथः\nस्थाने क्रोधस्थाने क्रोधः यस्यासौ स्थानक्रोधः । प्रहर्ता क्रोधविषये प्रहर्ता । आदित्य इवेत्यादिना उक्तैर्विशेषणैर्विशिष्टो राम इति योज्यम्", "siromani": "रूपवानिति । मूर्तिमान् कन्दर्प इव रूपादिमान् स्थानक्रोधे उचितकोपे प्रहर्ता दण्डदायकः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "tier1:5.34.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "воитель", "kind": "note", "text": "Не нужен ли комм про колесницы (он mahārathaḥ)?"}, {"author": "Е. Костина", "lemma_iast": "Сражающий лишь недостойных", "kind": "note", "text": "Нужен комм. С буквальным переводом"}], "suggestions": [], "seq": 20}, {"id": "phase2:5.34.30:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sthāna-krodha", "note_ru": "По Бхушане и Широмани, sthāna-krodha означает не «гневливость», а способность разить лишь там, где гнев уместен (кродха на своём месте) — то есть избирательную, дисциплинированную ярость воина, а не безудержный нрав.", "type": "Б", "source_commentary": ["bhusana", "siromani"], "why_proposed": "уточняет буквальный смысл сложного эпитета, который подстрочник передаёт описательно («сражающийся с теми, кто заслуживает гнева»), отвечая на редакторский запрос Е. Костиной о комментарии к этому месту", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "collision_tier1": true, "seq": 21}]}, {"verse_id": "5.34.33", "verse": "33", "sanskrit_iast": "krodhapramuktair iṣubhir jvaladbhir iva pāvakaiḥ । tenāhaṃ preṣito dūtas tvatsakāśam ihāgataḥ ॥33॥", "leonov_ru": "Стрелами, выпущенными в гневе, пылающими словно огни, Им я посланный вестник, пришедший к тебе сюда.", "commentary": {"bhusana": "तेनाहं प्रेषितो दूतस्त्वत्सकाशमिहागतः ।\n\nत्वद्वियोगेन दुःखार्तः स त्वां कौशलमब्रवीत्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "lexical:5.34.33:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "krodhapramukta iṣu", "note_ru": "Кродхапрамукта-ишу (krodha-pramukta iṣu, m.) — «стрела, высвобождённая/пущенная гневом». Pramukta — p.p.p. от pra+√muc- («освобождать»). В санскритском военном дискурсе krodha — не просто «гнев», а праведное боевое возбуждение кшатрия; MW: krodha «anger, wrath». Образ стрелы, высвобождённой гневом и горящей подобно огню (jvaladbhir iva pāvakaiḥ) — это стрела, несущая в себе кшатрийскую dharma-śakti (энергию праведного гнева). Подстрочник «стрелы, пущенные в гневе» теряет технический смысл: гнев здесь — источник энергии, превращающий стрелу в метафизическое оружие.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:krodha+dic_mw:pramukta", "source_links": [{"label": "MW krodha", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=krodha"}, {"label": "MW pramukta", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=pramukta"}], "seq": 22}]}, {"verse_id": "5.34.34", "verse": "34", "sanskrit_iast": "tvadviyogena duḥkhārtaḥ sa tvāṃ kauśalam abravīt । lakṣmaṇaś ca mahātejā sumitrānandavardhanaḥ ॥34॥", "leonov_ru": "Страдающий в разлуке с тобой он (Рама) спрашивает о твоем благополучии, И Лакшмана доблестный, источник радости [своей матери] Сумитры,", "commentary": {"bhusana": "लक्ष्मणश्च महातेजाः सुमित्रानन्दवर्धनः ।\n\nअभिवाद्य महाबाहुः स त्वां कौशलमब्रवीत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "tier1:5.34.34:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Сумитры.", "kind": "note", "text": "Мне кажется, здесь должна быть запятая, потому что Лакшмана тоже спрашивает о здоровье"}], "suggestions": [], "seq": 23}]}, {"verse_id": "5.34.37", "verse": "37", "sanskrit_iast": "diṣṭyā jīvasi vaidehi rākṣasī vaśam āgatā । nacirād drakṣyase rāmaṃ lakṣmaṇaṃ ca mahāratham ॥37॥", "leonov_ru": "Волей судьбы ты жива, Вайдехи, оказавшаяся во власти ракшаси. Скоро увидишь ты Раму и Лакшману, великого воина,", "commentary": {"siromani": "नेति । रामं लक्ष्मणं च वानरकोटीनाम् अनेककोटिसंख्याकवानराणां मध्ये सुग्रीवं च नचिरात् शीघ्रं द्रक्ष्यसे", "bhusana": "नचिराद्द्रक्ष्यसे रामं लक्ष्मणं च महाबलम् ।\n\nमध्ये वानरकोटीनां सुग्रीवं चामितौजसम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "tier1:5.34.37:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "воина", "kind": "note", "text": "См. выше. Не нужен ли комментарий про колесницы?"}], "suggestions": [], "seq": 24}]}, {"verse_id": "5.34.38", "verse": "38", "sanskrit_iast": "madhye vānarakoṭīnāṃ sugrīvaṃ cāmitaujasaṃ । ahaṃ sugrīvasacivo hanūmān nāma vānaraḥ ॥38॥", "leonov_ru": "И Сугриву, наделенного безмерной мощью, среди великого множества обезьян. Я советник Сугривы, обезьяна по имени Хануман.", "commentary": {"bhusana": "अहं सुग्रीवसचिवो हनुमान्नाम वानरः ।\n\nप्रविष्टो नगरीं लङ्कां लङ्घयित्वा महोदधिम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "lexical:5.34.38:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "saciva", "note_ru": "Сачива (saciva, m.) — «советник, министр, ближайший соратник», от sac- «быть вместе, следовать». MW: saciva «a companion; a minister, counsellor». Апте: saciva «one who is associated with another in performing a work; a minister». Хануман здесь самопредставляется: «я — saciva Сугривы». Термин saciva в нитишастрах — один из восьми amātya (министров), обязанности и квалификация которых подробно регламентированы. Saciva не просто «слуга» и не просто «друг» — это доверенное должностное лицо. Самоидентификация Ханумана через политическое звание, а не просто «посланник», — это заявление о собственном статусе.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:saciva+dic_apte:saciva", "source_links": [{"label": "MW saciva", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=saciva"}, {"label": "APTE saciva", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=saciva"}], "seq": 25}]}, {"verse_id": "5.34.39", "verse": "39", "sanskrit_iast": "praviṣṭo nagarīṃ laṅkāṃ laṅghayitvā mahodadhim । kṛtvā mūrdhni padanyāsaṃ rāvaṇasya durātmanaḥ ॥39॥", "leonov_ru": "Проник я в город Ланку, переправившись через великий океан, Поставив стопу на голову злобного духом Раваны.", "commentary": {"bhusana": "कृत्वा मूर्ध्नि पदन्यासं रावणस्य दुरात्मनः ।\n\nत्वां द्रष्टुमुपयातो ऽहं समाश्रित्य पराक्रमम्", "siromani": "कृत्वेति । अहं रावणस्य मूर्ध्नि पदन्यासं कृत्वा अनादृत्येत्यर्थः, त्वां द्रष्टुमुपयातः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-34", "notes": [{"id": "tier1:5.34.39:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Поставив стопу на голову", "kind": "note", "text": "Нужен комментарий Широмани - अनादृत्य Голдманы - \"to get the better of.\""}], "suggestions": [], "seq": 26}, {"id": "lexical:5.34.39:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mūrdhnā padanyāsa", "note_ru": "Мурдхни-паданьяса (mūrdhnā padanyāsa, m.) — «наступание ногой на голову», ритуальный жест тотального унижения противника. Букв. «помещение стопы (pada) на голову (mūrdhan)». В индийской традиции голова — высшая часть тела, вместилище чести и силы; наступить на голову врага — абсолютный знак победы и господства. MW: mūrdhan «the forehead, head, skull». Хануман говорит: «войдя в Ланку и наступив ногой на голову Раваны» — это не буквальное описание, а декларация символического превосходства. В подстрочнике «ступив на голову Раваны» смысл виден; здесь важна именно ритуально-семиотическая функция жеста.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:mUrDan+dic_mw:padanyAsa", "source_links": [{"label": "MW mUrDan", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=mUrDan"}, {"label": "MW padanyAsa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=padanyAsa"}], "collision_tier1": true, "seq": 27}, {"id": "phase2:5.34.39:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "anādṛtya", "note_ru": "Широмани поясняет жест «поставил стопу на голову Раваны» глаголом anādṛtya — «презрев, не удостоив вниманием»: не столько физическое унижение, сколько демонстративное пренебрежение противником.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "даёт точный комментаторский глагол-толкование жеста, отвечая на прямой запрос Е. Костиной о комментарии Широмани к этому месту", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "collision_tier1": true, "seq": 28}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

": ["tilaka"], "why_proposed": "даёт доктринальную рамку (авāтара играет человеческую роль), отсутствующую в подстрочнике и не отмеченную ни в тексте самого Леонова/Костиной, ни в Фазе-1", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.25.5", "verse": "5", "sanskrit_iast": "vepate smādhikaṃ sītā viśantīvāṅgam ātmanaḥ । vane yūthaparibhraṣṭā mṛgī kokair ivārditā ॥5॥", "leonov_ru": "Сильно задрожала Сита, будто уйдя в себя, Подобная антилопе в лесу, отбившейся от стада и терзаемой волками.", "commentary": {"tilaka": "आत्मनो ऽङ्गं विशन्तीव भीत्यातिसङ्कुचितशरीरा कमठवदभूदित्यर्थः । कोकैर्वृकैः", "bhusana": "वेपते स्माधिकं सीता विशन्तीवाङ्गमात्मनः ।\n\nवने यूथपरिभ्रष्टा मृगी कोकैरिवार्दिता\nकोकैः ईहामृगैः । \"कोकस्त्वीहामृगो वृकः\" इत्यमरः", "siromani": "तदेव भङ्ग्यन्तरेणाह वेपते इति । आत्मनो ऽङ्गम् आविशन्तीव कमठवत् सङ्कचितशरीरेत्यर्थः, सीता कोकैः वृकैः अर्दिता वृकी इव वेपते स्म"}, "has_tier1": false, "notes": [{"id": "lexical:5.25.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "koka", "note_ru": "Кока (koka, m.) — «волк» (в эпике) или «утка-кокā (cakravāka)» в зависимости от контекста. MW: koka m. 'a wolf; the cakravāka bird'. Стих: «как антилопа в лесу, отбившаяся от стада, терзаемая kokaḥ». Переводчик (Леонов) переводит «волками» — и это правильно для данного контекста; однако без пояснения неясно, почему кока (а не vṛka, стандартный «волк»). koka в эпическом языке — волк именно как охотник на одиночных животных, семантически выделяющийся из vṛka своей «стайной» агрессией против выбившихся из группы. Параллель к положению Ситы: она отделена от «стаи» (Рāмы и ванаров) и уязвима именно как единица без группы.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:koka"}, {"id": "phase2:5.25.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "viśantīvāṅgam ātmanaḥ", "note_ru": "По Тилаке и Широмани, «будто уйдя в себя» означает буквально «сжавшаяся телом от страха, как черепаха (камаṭха)»: образ втягивающейся в панцирь черепахи поясняет сравнение, которое подстрочник передаёт нейтральным «будто уйдя в себя».", "type": "Б", "source_commentary": ["tilaka", "siromani"], "why_proposed": "вскрывает зрительный образ (черепаха), стоящий за нейтральной фразой подстрочника «будто уйдя в себя»; Фаза-1 комментирует в этом стихе только слово koka, не этот образ", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.25.6", "verse": "6", "sanskrit_iast": "sā tv aśokasya vipulāṃ śākhām ālambya puṣpitām । cintayām āsa śokena bhartāraṃ bhagnamānasā ॥6॥", "leonov_ru": "Ухватившись за широкую, покрытую цветами, ветку ашоки, Погрузилась она горестно в мысли о муже разбитой душою.", "commentary": {"bhusana": "सा त्वशोकस्य विपुलां शाखामालम्ब्य पुष्पिताम् ।\n\nचिन्तयामास शोकेन भर्तारं भग्नमानसा\nअशोकस्य हमुमदधिष्ठतशिंशुपासन्निहितस्य", "siromani": "सेति । अशोकस्य अशोकसदृशस्य शिंशुपायाः विपुलां शाखामालम्ब्य शोकेन उपलक्षिता अतः भग्नमानसा सा सीता भर्तारं चिन्तयामास । अशोकशब्दः आचारक्विबन्तप्रकृतिककर्तृक्विबन्तः । इवार्थकः तुशब्दो वा"}, "has_tier1": true, "notes": [{"id": "tier1:5.25.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «śokena» Опущено"}, {"id": "phase2:5.25.6:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "aśokasya … śākhām", "note_ru": "Комментаторы расходятся, что означает «ашока» здесь: в «Широмани» — это не собственно ашока, а шиншупа, названная «подобной ашоке» (aśoka-sadṛśā śiṃśupā); в «Бхушане» — конкретное дерево ашока рядом с той шиншупой, где впоследствии сидит Хануман; «Тилака» (относя пояснение к обоим стихам 6–7) допускает оба чтения. Перевод Леонова сохраняет нейтральное «ашока», не выбирая между чтениями.", "type": "Б", "source_commentary": ["tilaka", "bhusana", "siromani"], "why_proposed": "три комментатора расходятся в идентификации дерева (буквальная ашока vs. фигуральное именование шиншупы) — подстрочник и существующие примечания не отражают этот текстологический вопрос, важный для последующей сцены с Хануманом", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.25.8", "verse": "8", "sanskrit_iast": "sā vepamānā patitā pravāte kadalī yathā । rākṣasīnāṃ bhayatrastā vivarṇavadanābhavat ॥8॥", "leonov_ru": "Она, трепещущая, словно подорожник на сильном ветру, Дрожащая от страха перед ракшаси, побледневшая лицом.", "commentary": {"bhusana": "सा वेपमाना पतिता प्रवाते कदली यथा ।\n\nराक्षसीनां भयत्रस्ता विवर्णवदना ऽभवत्\nराक्षसीनां राक्षसीभ्यः", "siromani": "सेति । राक्षसीनां भयत्रस्ता अत एव प्रवातकदलीव वेपमाना अत एव पतिता सा सीता विवर्णवदना अभवत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.25.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «patitā» Опущено"}, {"id": "crosstext:5.25.8:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "vivarṇavadanābhavat / kadalī pravāte", "note_ru": "Сита перед ракшаси «трепещущая, словно подорожник (банан) на ветру (kadalī pravāte), … побледневшая лицом (vivarṇavadanābhavat)» (V.25.8). Глагольная формула pāda «vivarṇavadanābhavat» дословно совпадает с описанием покинутой Дамаянти: Āraṇyaka 3.61.95 «bhartṛśokaparā dīnā vivarṇavadanābhavat» — «была она бледна и печальна, поглощена тоской о супруге (vivarṇavadanābhavat)»; а в следующих стихах Дамаянти, как и Сита, ищет утешения у дерева aśoka. Третья общая формула из Нала-упакхьяны (ср. V.15.20, V.19.17) подтверждает, что портрет страдающей Ситы систематически собран из клише, отработанных на образе Дамаянти. Свидетельство: уровень шлоки (сильная формульная параллель).", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.25.8", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparva 3.61.95", "collision_tier1": true}]}, {"verse_id": "5.25.9", "verse": "9", "sanskrit_iast": "tasyāḥ sā dīrghavipulā vepantyāḥ sītayā tadā । dadṛśe kampitā veṇī vyālīva parisarpatī ॥9॥", "leonov_ru": "Трепещущей Ситы длинная и толстая тогда Коса, сотрясаемая, казалась обвивающейся вокруг (нее) змеей.", "commentary": {"siromani": "तदाकारमाह नेति । मानुषी मनुष्यसंबन्धिनी भार्या राक्षसस्य भवने भवितुं स्थातुं नार्हति अतः वो वचो न करिष्यामि अतो मां खादत\nतस्या इति । तस्याः भीतायाः वेपन्त्याः सीतया सीतायाः दीर्घबहुला अतिदीर्घा कम्पिता सा प्रसिद्धा वेणी परिसर्पती परिसर्पन्ती व्याली सर्पिणी इव ददृशे", "tilaka": "सीतयेति षष्ठ्यर्थे तृतीया । परिसर्पती परितः प्रसर्पन्ती ।। 5.25.9,10 ।।\n\nहा सुमित्रेतीत्यत्रेकारलोप आर्षः\nपद्मदलं विकसितं पद्मं तस्य पत्रमिवाक्षिणी यस्य तम्", "bhusana": "तस्याः सा दीर्घविपुला वेपन्त्या सीतया तदा ।\n\nददृशे कम्पिनी वेणी व्यालीव परिसर्पती\nसीतयेति व्यत्ययेन षष्ठ्यर्थे तृतीया । परिसर्पती परिसर्पन्ती । नुमभाव आर्षः"}, "has_tier1": false, "notes": [{"id": "lexical:5.25.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "veṇī", "note_ru": "Вени (veṇī, f.) — «коса, заплетённая прядь» (в отличие от kuṭila — свободные, незаплетённые волосы). MW: veṇī 'a braid of hair; a stream, current'. В контексте: «длинная и толстая коса Ситы, дрожащая, казалась змеёй (vyālī), обвивающей её». Veni — именно ритуально-социальный маркер: после похищения и смерти мужа женщина должна распустить косу (vikīrṇa-keśā = «с распущенными волосами»). То, что Сита продолжает носить veṇī, — знак того, что она не признаёт себя «вдовой» (vidhavā) и не выполнила ритуал утраты мужа. Сравнение косы со змеёй — двойной образ: оживлённость (vyālī-iva) выражает её внутреннее движение при внешней статичности.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:veRI"}]}, {"verse_id": "5.25.12", "verse": "12", "sanskrit_iast": "lokapravādaḥ satyo 'yaṃ paṇḍitaiḥ samudāhṛtaḥ । akāle durlabho mṛtyuḥ striyā vā puruṣasya vā ॥12॥", "leonov_ru": "Верны эти слова, которые произнесены пандитами: «В недолжное время трудно умереть женщине или мужчине».", "commentary": {"tilaka": "अकाले दैवाविहितस्वेच्छाकाले", "bhusana": "लोकप्रवादः सत्यो ऽयं पण्डितैः समुदाहृतः ।\n\nअकाले दुर्लभो मृत्युः स्त्रिया वा पुरुषस्य वा\nलोकप्रवाद इत्यादि श्लोकद्वयमेकं वाक्यम् । अकाले अप्राप्तकाले । दुर्लभ इत्यत्र इति करणं बोध्यम्", "siromani": "लोकेति । यत्र यतः आभिः राक्षसीभिः अर्दिता रामेण च हीना अत एव दुःखिता अहं मुहूर्तमपि जीवामि अतः पण्डितैः समुदाहृतः अकाले मृत्युर्दुर्लभः अयं लोकप्रवादः सत्यः । श्लोकद्वयमेकान्वयि ।। 5.25.12,13 ।।\n\nएषेति । अल्पपुण्येव एषा ऽहं विनशिष्यामि विनङ्क्ष्यामि । तत्र दृष्टान्तः वायुवेगैराहता पूर्णां समुद्रमध्ये गौरिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.25.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «paṇḍitaiḥ samudāhṛtaḥ» Опущено"}, {"id": "lexical:5.25.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "akāla", "note_ru": "Акāла (akāla, m./ind.) — «не-время, неподходящий момент» (a-privativum + kāla «время, смерть, Яма»). MW: akāla 'wrong or bad time; unseasonable'. В стихе loka-pravāda «народная мудрость»: «в недолжное время (akāle) смерть трудна (durlabha)» — смерть приходит только в нужный момент. Здесь ключевая двусмысленность: kāla означает и «время», и «Яма» (бог смерти). Akāla — буквально «отсутствие Ямы», то есть Яма не пришёл за ней. Это не пессимизм, а констатация дхармического закона: невозможно умереть «вне расписания» даже при желании. Подстрочник передаёт «трудно умереть», но не объясняет, почему это «народная мудрость» (paṇḍita-udāhṛta).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:akAla", "collision_tier1": true}, {"id": "crosstext:5.25.12:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "mṛtyu", "note_ru": "akāle durlabho mṛtyuḥ — «не в срок смерть труднодостижима». Сита прямо ссылается на ходячую максиму пандитов: «lokapravādaḥ satyo 'yaṃ paṇḍitaiḥ samudāhṛtaḥ । akāle durlabho mṛtyuḥ striyā vā puruṣasya vā» (V.25.12). Зеркальная сентенция Шантипарвы переворачивает ту же мысль о неотменимости часа смерти в призыв к безотлагательному долгу: «śvaḥkāryam adya kurvīta... na hi pratīkṣate mṛtyuḥ kṛtaṃ vāsya na vā kṛtam» (MBh XII.169.14) — «Завтрашнее дело пусть сделает сегодня... ибо смерть не ждёт, исполнено ли [должное] или нет». Подстрочник верно передаёт смысл реплики; параллель раскрывает её статус общеэпической гномы о kāla.", "type": "А", "cluster": "mbh_gnomic", "cluster_label": "МБх дидактика (Шантипарва / Анушасанапарва)", "shloka_ref": "V.25.12", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Śāntiparvan (MBh XII) 12.169.14", "collision_tier1": true}]}, {"verse_id": "5.25.16", "verse": "16", "sanskrit_iast": "taṃ padmadalapatrākṣaṃ siṃhavikrāntagāminam । dhanyāḥ paśyanti me nāthaṃ kṛtajñaṃ priyavādinam ॥16॥", "leonov_ru": "Того, чьи глаза подобны лепесткам лотоса, обладающего горделивой походкой льва. Счастливы те, кто видят (его), моего господина, умеющего быть благодарным и говорящего приятное.", "commentary": {"bhusana": "तं पद्मदलपत्रक्षं सिंहविक्रान्तगामिनम् ।\n\nधन्याः पश्यन्ति मे नाथं कृतज्ञं प्रियवादिनम्", "siromani": "तमिति । सिंहविक्रान्तवत् गच्छति तच्छीलः तं मे नाथं मे पश्यन्ति ते धन्याः"}, "has_tier1": true, "notes": [{"id": "tier1:5.25.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Букв. «подобны лепесткам распустившегося лотоса». Автор комментария «Тилака» толкует композит padmadala как «распустившийся лотос» (padmadalaṃ vikasitam).[Е. Костина] «kṛtajñaṃ priyavādinam» Опущено"}]}, {"verse_id": "5.25.18", "verse": "18", "sanskrit_iast": "kīdṛśaṃ tu mahāpāpaṃ mayā dehāntare kṛtam । tenedaṃ prāpyate ghoraṃ mahāduḥkham sudāruṇam ॥18॥", "leonov_ru": "Какой великий грех я совершила в прошлой жизни, Из-за которого обретается мной (теперь) это ужасное, весьма жестокое великое несчастье?", "commentary": {"bhusana": "कीदृशं तु मया पापं पुरा जन्मान्तरे कृतम् ।\n\nयेनेदं प्राप्यते दुःखं मया घोरं सुदारुणम्\nपुरा जन्मान्तरे पूर्वजन्मनि । घोरं सुदारुणम् अत्यन्तघोरमित्यर्थः", "siromani": "कीदृशमिति । येन कर्मणा इदं महद्दुःखं प्राप्यते तत् देहान्तरे देहमध्ये पापमिव कीदृशं कर्म मया कृतं संचितम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.25.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dehāntara", "note_ru": "Дехāнтара (dehāntara, n.) — «другое тело, иное воплощение» (deha «тело» + antara «иное»). MW: dehāntara 'another body; obtaining another body — transmigration'. В стихе Сита спрашивает: «какой великий грех совершила я в прошлом воплощении (dehāntare)?» — это прямое указание на доктрину кармы и перевоплощения. Примечательно, что dehāntara (а не janmāntara «иное рождение» или pūrvajanna «прошлая жизнь») акцентирует именно смену телесной оболочки — технический термин, близкий к буддийскому pudgala-parāvṛtti, хотя здесь он в контексте брāхманической кармической доктрины.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:dehAntara"}]}, {"verse_id": "5.25.19", "verse": "19", "sanskrit_iast": "jīvitaṃ tyaktum icchāmi śokena mahatā vṛtā । rākṣasībhiś ca rakṣantyā rāmo nāsādyate mayā ॥19॥", "leonov_ru": "Охваченная великим горем, желаю я расстаться с жизнью, Находящаяся под стражей ракшаси, не встречусь я (снова) с Рамой.", "commentary": {"bhusana": "जीवितं त्यक्तुमिच्छामि शोकेन महता वृता ।\n\nराक्षसीभिश्च रक्ष्यन्त्या रामो नासाद्यते मया\nरक्ष्यन्त्या रक्ष्यमामया", "siromani": "जीवितमिति । राक्षसीभिः रक्ष्यन्त्या रक्ष्यमाणया मया रामो नासाद्यते प्राप्यते अतः महता शोकेन वृता ऽहं जीवितं जीवनं त्यक्तुमिच्छामि"}, "has_tier1": true, "notes": [{"id": "tier1:5.25.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «yat» Г-пресс рассматривает первое высказывание как причину второй: удел человека презренен, поскольку она не может по своей воле расстаться с жизнью. У Голдманов в комментариях тоже про это говорится"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s25_v1";

const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

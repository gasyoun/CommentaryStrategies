const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 18, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 41, "verses_with_notes": 22, "notes_by_layer": {"tier1": 19, "lexical": 8, "phase2": 7, "edition": 1, "crosstext": 2}}, "sarga": 18, "verses": [{"verse_id": "5.18.1", "verse": "1", "sanskrit_iast": "tathā viprekṣamāṇasya vanaṃ puṣpitapādapam । vicinvataś ca vaidehīṃ kiṃ cic cheṣā niśābhavat ॥1॥", "leonov_ru": "Тогда у [Ханумана], осматривающего рощу, деревья в которой были покрыты цветами, И ищущего Вайдехи, остался лишь остаток ночи.", "commentary": {"tilaka": "तथेति । किञ्चिच्छेषापरयाममात्रशेषा । विचिन्वतस्तस्याः स्पष्टदर्शनाय राक्षसीनिद्रारूपमवसरमन्वेषयतः", "bhusana": "तथा विप्रेक्षमाणस्य वनं पुष्पितपादपम् ।\n\nविचिन्वतश्च वैदेहीं किंचिच्छेषा निशा ऽभवत्\nतथेत्यादि । विप्रेक्षमाणस्य विचिन्वतश्च । विप्रेक्षमाणे विचिन्वति च तस्मिन्नित्यर्थः । \" यस्य च भावेन.\" इत्यर्थे षष्ठी", "siromani": "हनुमद्वृत्तान्तमेवाह तथेत्यादिभिः । वैदेहीं विचिन्वतः अत एव तथा उक्तप्रकारेण वनं विप्रेक्षमाणस्य हनुमतो निशा किंचिच्छेषा अभवत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.1:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…осталось / От ночи совсем немного (kiṃ cic cheṣā niśābhavat) – комментарий «Тилака» уточняет, что прошли три из четырех ночных страж (yāma). Продолжительность каждой стражи составляла три часа. Таким образом, события песни происходит между 3 и 6 часами утра."}, {"id": "phase2:5.18.1:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vicinvataḥ", "note_ru": "По Тилаке, Хануман не просто ищет Ситу взглядом (vicinvataḥ), а выжидает момент, когда ракшаси-стражницы уснут (rākṣasīnidrārūpam avasaram anveṣayataḥ), чтобы разглядеть её без помех.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Даёт мотивировку выжидания: Хануман тянет время не просто «в поисках», а рассчитывая момент, когда стража уснёт — подстрочник передаёт только сам поиск, без этой тактической причины паузы.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.18.2", "verse": "2", "sanskrit_iast": "ṣaḍaṅgavedaviduṣāṃ kratupravarayājinām । śuśrāva brahmaghoṣān sa virātre brahmarakṣasām ॥2॥", "leonov_ru": "Знающих Веды с шестью ведангами, знатоков жертвоприношений Брахманов-ракшасов бормотание гимнов он услышал на рассвете.", "commentary": {"tilaka": "विरात्रे रात्रिविपर्यासे । अपररात्र इत्यर्थः । ब्रह्मरक्षसां ब्रह्म वेदस्तज्ज्ञरक्षसाम् तदेव स्पष्टीकृतम्-- षडङ्गेत्यादिना ।। 5.18.2,3 ।।\n\nनिद्रावशादेव स्रस्तमाल्याम्बररधरः", "bhusana": "षडङ्गवेदविदुषां क्रतुप्रवरयाजिनाम् ।\n\nशुश्राव ब्रह्मघोषांश्च विरात्रे ब्रह्मरक्षसाम्", "siromani": "षडङ्गेति । षडङ्गवेदविदुषां वेदवेदितृ़णाम् अत एव क्रतुप्रवरयाजिनां ब्रह्मरक्षसां ब्राह्मणराक्षसानां ब्रह्मघोषान् वेदनिनदान् विरात्रे रात्र्यवसाने शुश्राव हनूमानिति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…брахманы-ракшасы… (brahmarakṣasām) – под брахмаракшасами обычно понимаются духи брахманов, которые вели греховную жизнь. Однако, как отмечает комментарий «Тилака», здесь имеются в виду ракшасы, знающие Веды."}, {"id": "lexical:5.18.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ṣaḍaṅgaveda", "note_ru": "Шаданга-веда (ṣaḍ-aṅga-veda, m.) — «Веды с шестью ведангами» (ṣaḍ «шесть» + aṅga «член, приложение»). Шесть веданг: śikṣā (фонетика), kalpa (ритуальные правила), vyākaraṇa (грамматика), nirukta (этимология), chandas (метрика), jyotiṣa (астрономия). MW: vedāṅga 'a class of works regarded as auxiliary to the Veda'. Примечательно, что «брахманы-ракшасы» (brahmarakṣasa) в 18.2 охарактеризованы как знатоки Вед с ведангами — это специальная категория ракшасов, которые были когда-то брахманами, преступили закон и стали демонами, сохранив ведийское знание. Трагическая инверсия: правильное знание в демоническом теле.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vedANga", "collision_tier1": true}, {"id": "lexical:5.18.2:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "brahmarakṣas", "note_ru": "Брахма-ракшас (brahma-rakṣas, m.) — демон-брахман; MW: brahmarākṣasa 'a kind of evil spirit (said to be the ghost of a Brāhmaṇa who had not studied or practised what he taught)'. В Рамаяне и Махабхарате брахмаракшасы — это брахманы, наказанные за ритуальные преступления или нарушение обетов перерождением в форме ракшаса при сохранении ведийского знания. Их «бормотание гимнов» на рассвете (virātra) — это не благочестие, а инверсия: правильное время и правильные тексты в демоническом исполнении. Контекстуально значимо как деталь мироустройства Ланки: даже её ракшасы имеют ведийское образование.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:brahmarAkzasa", "collision_tier1": true}]}, {"verse_id": "5.18.3", "verse": "3", "sanskrit_iast": "atha maṅgalavāditraiḥ śabdaiḥ śrotramanoharaiḥ । prābodhyata mahābāhur daśagrīvo mahābalaḥ ॥3॥", "leonov_ru": "И вот приятными для слуха звуками священных (благих) инструментов Был пробужден мощнорукий могучий Дашагрива.", "commentary": {"bhusana": "अथ मङ्गलवादित्रैः शब्दैः श्रोत्रमनोहरैः ।\n\nप्राबुध्यत महाबाहुर्दशग्रीवो महाबलः", "siromani": "अथेति । मङ्गलवादित्रैः माङ्गलिकवाद्यवद्भिः राक्षसैः कर्तृभिः श्रोत्रमनोहरैः शब्दैः दशग्रीवः प्राबोध्यत"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Сладостно слух ласкавшее (maṅgalavāditraiḥ śabdaiḥ śrotramanoharaiḥ) – букв. «Пленяющим слух звучанием благих (maṅgala) музыкальных инструментов»."}, {"id": "lexical:5.18.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "maṅgalavāditra", "note_ru": "Мангалавадитра (maṅgala-vāditra, n.) — «благоприятные инструменты, игра на которых приносит счастье»; maṅgala «благо, счастье» + vāditra «музыкальный инструмент» (√vad-, «звучать», Whitney #766). Утреннее пробуждение царя (prabhātasevā) посредством инструментального ансамбля — устойчивый ритуал царской жизни (rājadharma); описан в Arthaśāstra 2.20. Раван просыпается как царь, по царскому ритуалу — но идёт к похищенной чужой жене. Ритуальная правильность формы оттеняет нравственную неправомерность содержания.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:maNgala+dic_mw:vAditra", "collision_tier1": true}]}, {"verse_id": "5.18.4", "verse": "4", "sanskrit_iast": "vibudhya tu mahābhago rākṣasendraḥ pratāpavān । srastamālyāmbaradharo vaidehīm anvacintayat ॥4॥", "leonov_ru": "Проснувшись, могущественный владыка ракшасов, причастный великой доле, Чьи гирлянды и одежды были в беспорядке, подумал (вспомнил) о Вайдехи.", "commentary": {"bhusana": "विबुध्य तु यथाकाले राक्षसेन्द्रः प्रतापवान् ।\n\nस्रस्तमाल्याम्बरधरो वैदेहीमन्वचिन्तयत्", "siromani": "विबुध्येति । स्रस्तमाल्याम्बरधरो राक्षसेन्द्रः विबुध्य वैदेहीमन्वचिन्तयत्"}, "has_tier1": false, "notes": [{"id": "lexical:5.18.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "srastamālya", "note_ru": "Срастамалья (srasta-mālya, adj. bahuvr.) — «у кого гирлянды (mālya) соскользнули» (srasta — p.p.p. от √sraṃs-, «падать, соскальзывать», Whitney #706). MW: sraṃs 'to fall down, slip, hang loosely'. Деталь «соскользнувших гирлянд» — конвенциональный эпический код состояния после ночи с любовницей: герой просыпается с растрёпанными гирляндами, помятой одеждой. Эта формула (srasta-mālya + srasta-āmbara) встречается в Mahābhārata при описании царей после пиров (e.g. MBh 1.212). Здесь же это описание Раваны после ночи сна и опьянения как человека, полностью погружённого в kāma.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:srasta+dic_mw:mAlya"}]}, {"verse_id": "5.18.6", "verse": "6", "sanskrit_iast": "sa sarvābharaṇair yukto bibhrac chriyam anuttamām । tāṃ nagair vividhair juṣṭāṃ sarvapuṣpaphalopagaiḥ ॥6॥", "leonov_ru": "Он, украшенный всеми драгоценностями, несущий несравненное величие, В ту с разнообразными деревьями, на которых росли все (всевозможные) цветы и плоды,", "commentary": {"bhusana": "स सर्वाभरणैर्युक्तो बिभ्रच्छ्रियमनुत्तमाम् ।\n\nतां नगैर्बहुभिर्जुष्टां सर्वपुष्पफलोपगैः"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «nagair vividhair» Опущено. На суть не влияет, но в комментарии стоит отметить"}]}, {"verse_id": "5.18.8", "verse": "8", "sanskrit_iast": "īhāmṛgaiś ca vividhaiś vṛtāṃ dṛṣṭimanoharaiḥ । vīthīḥ samprekṣamāṇaś ca maṇikāñcanatoraṇām ॥8॥", "leonov_ru": "С разнообразными статуями зверей, пленяющими взгляд, Глядел он (досл. глядящий) на дорожки с арками, выложенными драгоценными камнями и золотом,", "commentary": {"bhusana": "ईहामृगैश्च विविधैर्जुष्टां दृष्टिमनोहरैः ।\n\nवीथीः संप्रेक्षमाणश्च मणिकाञ्चनतोरणाः"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Где изображенья волков (īhāmṛgaiś ca vividhaiś) – Голдмены в своем переводе понимают слово īhāmṛga как «искусственное животное» (artificial animal). В то же время они приводят и иное понимание этого слова. Так, Руссель переводит его как «волки (искусственные) всякого рода», Датт – как «разнообразные волки», Шастри – как «скульптуры волков» (см.: Goldman 1984: 162, 401).[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}]}, {"verse_id": "5.18.11", "verse": "11", "sanskrit_iast": "dīpikāḥ kāñcanīḥ kāś cij jagṛhus tatra yoṣitaḥ । vālavyajanahastāś ca tālavṛntāni cāparāḥ ॥11॥", "leonov_ru": "Одни женщины несли золотые светильники, А другие – опахала из хвостов яков и пальмовых листьев.", "commentary": {"tilaka": "काञ्चनीः काञ्चनदण्डाः । वालव्यजनहस्ता इत्यस्यान्वव्रजन्निति शेषः । तालवृन्तानीत्यस्य जगृहुरिति । अनेन लङ्कायां हेमन्तशिशिरयोरपि शीताभावो ध्वनितः", "bhusana": "दीपिकाः काञ्चनीः काश्चिज्जगृहृस्तत्र योषितः ।\n\nवालव्यजनहस्ताश्च तालवृन्तानि चापराः\nतालवृन्तानि व्यजनानि", "siromani": "अङ्गनागमनप्रकारमाह-- दीपिका इत्यादिभिः । काश्चिद्दीपिका जगृहुः काश्चित्तालवृन्तानि जगृहुः काश्चित् बालव्यजनहस्ताः चामरकरा अगच्छन्निति शेषः"}, "has_tier1": false, "notes": [{"id": "lexical:5.18.11:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vālavyajana", "note_ru": "Валавьяджана (vāla-vyajana, n.) — опахало из хвоста (vāla) яка, коровы или лошади; vāla «хвостовой волос» + vyajana «опахало» (от √vij-, «обмахивать»). MW: vālavyajana 'a fly-flapper or fan made of the hair of a horse or bull's tail'. Царское опахало из ячьих хвостов (cāmara) — строго регламентированный атрибут царской власти в dharmśāstras; число опахал, несомых свитой, указывало на ранг правителя. Его присутствие в свите Раваны — знак легитимного царского достоинства, которым Равана обладает де-факто, хотя и использует свою власть нечестиво.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vAlavyajana"}, {"id": "phase2:5.18.11:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vālavyajanahastāḥ", "note_ru": "По Тилаке, деталь опахал из хвостов яков в свите Раваны косвенно указывает: даже зимой (hemanta, śiśira) на Ланке не бывает холодно — иначе такие опахала были бы не нужны.", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "Извлекает из бытовой детали (опахала) implicitную климатическую характеристику Ланки — вечное тепло без зимы, — которую подстрочник не проговаривает.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.18.12", "verse": "12", "sanskrit_iast": "kāñcanaiś caiva bhṛṅgārair jahruḥ salilam agrataḥ । maṇḍalāgrā bṛsīś caiva gṛhyānyāḥ pṛṣṭhato yayuḥ ॥12॥", "leonov_ru": "Впереди несли воду в золотых сосудах, Позади шли, неся циновки с закругленными концами.", "commentary": {"tilaka": "भृङ्गारैः कलशैः । धत्तूरकुसुमसदृशजलपात्रैरित्यर्थ इति तीर्थः । मण्डलाग्रा वृत्तपर्यन्ताः बृसीरासनविशेषान् तपस्विनामिमे तृणादिना, अस्य तु स्वर्णेनेति विशेषः", "bhusana": "काञ्चनैरपि भृङ्गारैर्जहुः सलिलमग्रतः ।\n\nमण्डलाग्रान् बृसीं चैव गृह्यान्याः पृष्ठतो ययुः\nभृङ्गारैः कनकालुकाभिः । \"भृङ्गारः कनकालुका \" इत्यमरः । मण्डलाग्रान् असिविशेषान् । \" मण्डलाग्रो नतार्थकः\" इति वैजयन्ती । बृसीम् आस्तरणम् । गृह्य गृहीत्वा", "siromani": "काञ्चनैरिति । काश्चित् काञ्चनैः भृङ्गारैः कलशैः अग्रतः अग्रे सलिलं जह्रुः प्रापयामासुः, अन्याः मण्डलाग्राः मण्डलाकाराणि अग्राणि यासां ताः बृसीः आसनविशेषान् गृह्य गृहीत्वा पृष्ठतो ययुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…циновки… / С закругленными уголками (maṇḍalāgrā bṛsīś caiva) – в критическом издании «Рамаяны» дан иной вариант: maṇḍalāgrān asīn (см.: Jhala 1966: 158), что можно понять как «изогнутые мечи» (maṇḍalāgra – изогнутый меч, скимитар). Именно такой интерпретации придерживаются в своем переводе Голдмены (см.: Goldman 1984: 163). В комментарии «Бхушана» приводится еще один вариант: maṇḍalāgrān bṛsīṅ caiva, то есть «мечи и циновки»."}, {"id": "phase2:5.18.12:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bṛsī", "note_ru": "Тилака поясняет: bṛsī — обычно простые подстилки аскетов, плетённые из травы; здесь же они золотые — деталь, подчёркивающая роскошь свиты Раваны через сознательное несоответствие обычного смысла предмета его материалу.", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "Раскрывает смысловой контраст, скрытый за нейтральным словом «циновки»: обычно бедный атрибут аскета здесь стал золотым — иной, роскошный факт сверх текстологического спора о чтении maṇḍalāgra, уже приведённого в примечании Леонова/Костиной.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.18.15", "verse": "15", "sanskrit_iast": "nidrāmadaparītākṣyo rāvaṇasyottamastriyaḥ । anujagmuḥ patiṃ vīraṃ ghanaṃ vidyullatā iva ॥15॥", "leonov_ru": "Лучшие женщины Раваны, глаза которых были полны сном и хмелем, Следовали за своим могучим господином, словно зигзагообразная молния за тучей.", "commentary": {"bhusana": "निद्रामदपरीताक्ष्यो रावणस्योत्तमाः स्त्रियः ।\n\nअनुजग्मुः पतिं वीरं धनं विद्युल्लता इव", "siromani": "निद्रेति । निद्रामदेन परीतानि युक्तानि अक्षीणि यासां ताः रावणस्य उत्तमाः स्त्रियः विद्युल्लताः घनमिवानुजग्मुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «parītākṣyo» Комм. буквальное значение[Е. Костина] «patiṃ vīraṃ» Опущено"}]}, {"verse_id": "5.18.16", "verse": "16", "sanskrit_iast": "vyāviddhahārakeyūrāḥ samāmṛditavarṇakāḥ । samāgalitakeśāntāḥ sasvedavadanās tathā ॥16॥", "leonov_ru": "Их ожерелья и браслеты были в беспорядке, притирания стерлись, Волосы были распущены, на лицах был пот.", "commentary": {"tilaka": "व्याविद्धाः स्थानादीषच्चलिताः । सम्यगामृदितो मृष्टो वर्णको ऽनुलेपनं यासां ताः", "bhusana": "व्याविद्धहारकेयूराः समामृदितवर्णकाः ।\n\nसमागलितकेशान्ताः सस्वेदवदनास्तथा"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «keyūrā» Опущено"}, {"id": "tier1:5.18.16:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «16» Нужно ли отметить, что 16-19 есть не во всех изданиях?[Е. Костина] «svedakliṣṭā» Опущено. Это важно, потому что наличие гирлянд ничего не говорит об их состоянии, в отличие от характеристики svedakliṣṭā"}, {"id": "edition:5.18.16:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.18.16–19 (4 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.18.16–19", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.18.16", "iast": "vyāviddhahārakeyūrāḥ samāmṛditavarṇakāḥ । samāgalitakeśāntāḥ sasvedavadanās tathā ॥16॥"}, {"verse_id": "5.18.17", "iast": "ghūrṇantyo madaśeṣeṇa nidrayā ca śubhānanāḥ । svedakliṣṭāṅgakusumāḥ sumālyākulamūrdhajāḥ ॥17॥"}, {"verse_id": "5.18.18", "iast": "prayāntaṃ nairṛtapatiṃ nāryo madiralocanāḥ । bahumānācca kāmācca priyā bhāryās tam anvayuḥ ॥18॥"}, {"verse_id": "5.18.19", "iast": "sa ca kāmaparādhīnaḥ patis tāsāṃ mahābalaḥ । sītāsaktamanā mando mandāñcitagatir babhau ॥19॥"}], "collision_tier1": true}]}, {"verse_id": "5.18.18", "verse": "18", "sanskrit_iast": "prayāntaṃ nairṛtapatiṃ nāryo madiralocanāḥ । bahumānācca kāmācca priyā bhāryās tam anvayuḥ ॥18॥", "leonov_ru": "Идущего владыку ракшасов жены, чей взор опьяняет, С почтением и любовью возлюбленные жены его сопровождали.", "commentary": {"tilaka": "मदिरलोचना मदकरवीक्षणाः । बहुमानाद्भर्तृकृतसंमानात् । कामात्स्वीयात्", "bhusana": "प्रयान्तं नैर्ऋतपतिं नार्यो मदिरलोचनाः ।\n\nबहुमानाच्च कामाच्च प्रिया भार्यास्तमन्वयुः"}, "has_tier1": false, "notes": [{"id": "phase2:5.18.18:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bahumānāc ca kāmāc ca", "note_ru": "По Тилаке, «из почтения и из желания» относится не к одному лицу: почтение (bahumāna) — это уважение, оказанное самим Раваной своим жёнам, а желание (kāma) — их собственное [желание сопровождать его]. Подстрочник оставляет обе причины грамматически при женщинах, стирая это различие.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Разрешает конструктивную двусмысленность «bahumānāc ca kāmāc ca»: разводит два разных источника (почтение Раваны к жёнам vs их собственное желание), которые подстрочник оставляет слитными.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "crosstext:5.18.18:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "nairṛta", "note_ru": "Найрита (nairṛta) — «ракшас», букв. «принадлежащий Ниррити», божеству юго-западной стороны и гибели. Термин технически связывает ракшасов с южной/юго-западной четвертью света (ср. Araṇya 3.64.22 о пути «в страну найрита»). В Сундаре он постоянен как титул Раваны («nairṛtapati», «nairṛtarāja»; V.18.18 и др.). Подстрочник передаёт нейтральным «ракшас», снимая космографический оттенок.\n\nПараллель — Rām. Bāla 1.22.13:\n  «na ca suptaṃ pramattaṃ vā dharṣayiṣyanti nairṛtāḥ । na bāhvoḥ sadṛśo vīrye pṛthivyāmasti kaścana ॥13॥»\n  Я научу тебя заклинаниям, Именующимся Бала и Атибала. Ни усталость, ни лихорадка, Ни приметы уродливой старости,", "type": "А", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.18.18", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.22.13 (Гринцер, пер. изд. I–III)"}]}, {"verse_id": "5.18.19", "verse": "19", "sanskrit_iast": "sa ca kāmaparādhīnaḥ patis tāsāṃ mahābalaḥ । sītāsaktamanā mando mandāñcitagatir babhau ॥19॥", "leonov_ru": "А их повелитель могучий, охваченный страстью, Поглощенный мыслями о Сите, злобный (или отупевший), шел неспешной походкой.", "commentary": {"tilaka": "मन्दो दुर्मतिः । मन्दं यथा तथाञ्चिता गतिर्यस्य ।। 5.18.19,20 ।।\n\nद्वारदेशमशोकवनिकाप्राकारदेशम्", "bhusana": "स च कामपराधीनाः पतिस्तासां महाबलः ।\n\nसीतासक्तमना मन्दो मदाञ्चितगतिर्बभौ", "siromani": "स इति । कामपराः तद्भार्याः तासामधीनः ता अधीना यस्येति वा स तासां पतिः महाबलः स रावणः सीतायां सीतादर्शने आसक्तं मनो यस्य मन्दाञ्चिता मन्दत्वं प्राप्ता गतिर्यस्य सः मन्दः सीताहरणकर्तृत्वज्ञापितमन्दमतिविशिष्टः स रावणो बभौ"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «mando» Опущено. Таттвадипика, Тикала - मन्दो दुर्मतिः ।"}, {"id": "tier1:5.18.19:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «babhau» Г-пресс уточняет, что он сиял. Мне кажется, в комм букв. Значение можно отразить"}]}, {"verse_id": "5.18.21", "verse": "21", "sanskrit_iast": "taṃ cāpratimakarmāṇam acintyabalapauruṣam । dvāradeśam anuprāptaṃ dadarśa hanumān kapiḥ ॥21॥", "leonov_ru": "Того несравненного в деяниях, наделенного немыслимой мощью, Достигшего ворот увидел Хануман-обезьяна,", "commentary": {"bhusana": "तं चाप्रतिमकर्माणमचिन्त्यबलपौरुषम् ।\n\nद्वारदेशमनुप्राप्तं ददर्श हनुमान् कपिः\nतं चेत्यादि । द्वारदेशम् अशोकवनद्वारदेशम्", "siromani": "तमिति । अप्रतिमकर्माणं सीताहरणकर्तृत्वेन स्वसदृशगर्हितकर्मरहितं द्वारदेशमनुप्राप्तं तं रावणं हनूमान् ददर्श", "tilaka": "जिह्मादिगुणके ईक्षणे यस्य तम् समक्षं प्रत्यक्षं कन्दर्पमिव स्थितम् अपविद्धशरासनं त्यक्तेक्षुचापम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «acintya» В комм надо отразить"}]}, {"verse_id": "5.18.22", "verse": "22", "sanskrit_iast": "dīpikābhir anekābhiḥ samantād avabhāsitam । gandhatailāvasiktābhir dhriyamāṇābhir agrataḥ ॥22॥", "leonov_ru": "Освещенного со всех сторон множеством светильников С ароматным маслом, которые несли перед ним,", "commentary": {"tilaka": "दीपिकाभिर्भासितम् । रात्रिशेषसत्त्वात् द्वादश्यां यामावशिष्टरात्रौ चन्द्रस्यास्तगमनाच्च", "bhusana": "दीपिकाभिरनेकाभिः समन्तादवभासितम् ।\n\nगन्धतैलावसिक्ताभिर्ध्रियमाणाभिरग्रतः\nगन्धतैलं गन्धवासिततैलम्"}, "has_tier1": false, "notes": [{"id": "phase2:5.18.22:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "dīpikābhir anekābhiḥ", "note_ru": "Тилака поясняет, почему нужны факелы почти на рассвете: остаётся ещё часть ночи (двенадцатые сутки, последняя стража), а луна уже зашла — отсюда необходимость искусственного света, которую подстрочник не мотивирует.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Даёт временную/астрономическую мотивировку детали (факелы нужны, так как луна уже зашла, хотя ночь на исходе) — подстрочник просто называет факелы, не объясняя, зачем они в этот час.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.18.23", "verse": "23", "sanskrit_iast": "kāmadarpamadair yuktaṃ jihmatāmrāyatekṣaṇam । samakṣam iva kandarpam apaviddhaśarāsanam ॥23॥", "leonov_ru": "Охваченного желанием, гордыней и страстью (хмелем), с красными глазами, глядящими искоса (похотливо), Подобного богу Каме, отложившему (отбросившему) свой лук,", "commentary": {"bhusana": "कामदर्पमदैर्युक्तं जिह्मताम्रायतेक्षणम् ।\n\nसमक्षमिव कन्दर्पमपविद्धशरासनम्\nसमक्षं प्रत्यक्षम् । अपविद्धशरासनम् अधृतशरासनम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.23:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "С лукавым взором (jihmatāmrāyatekṣaṇam) – букв. «с глазами изогнутыми, меднокрасными и широкими». По мнению автора комментария «Широмани» слово jihma «изогнутый» здесь указывают на лживость/бесчестность (kāpaṭya) взгляда Раваны. Также jihma в этом контексте можно понять как «прищуренный». Голдмены переводят «взгляд искоса», означающий страстное желание, похоть (см.: Goldman 1984: 163)."}, {"id": "lexical:5.18.23:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kandarpāpaviddhaśarāsana", "note_ru": "Кандарпапавиддхашарасана (kandarp-apaviddha-śarāsana, компаунд) — «Кама, отбросивший свой лук» (kandarpа = Кама + apaviddha «отброшенный» p.p.p. от ava+√vyadh- «метать» + śarāsana «лук»). Иконографически Кама изображается с луком из стеблей сахарного тростника и стрелами-цветами (pañcabāṇa). Образ «Камы без лука» значим: он сам воплощает желание настолько, что его атрибуты не нужны — он сам и есть стрела. MW: kandarpа 'god of love'. Равана сравнивается с Камой-без-лука, что указывает на его неотразимую, почти сакральную сексуальную силу — и одновременно на неправедность: Кама без лука = дикое желание без ритуальной легитимации (нет стрелы → нет законного выстрела → нет svadharma).", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:kandarpa+dic_mw:apaviddha", "collision_tier1": true}, {"id": "crosstext:5.18.23:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "kandarpa", "note_ru": "Хануман видит спящего Равану «подобным самому Кандарпе (богу любви Каме), отбросившему свой лук» (18.23: samakṣam iva kandarpam apaviddhaśarāsanam). Эпитет опирается на кавья-мифологию Кандарпы: в «Кумарасамбхаве» Индра вызывает Кандарпу сжечь аскезу Шивы — «niścitya kandarpam agamat pākaśāsanaḥ» (Кумара II.63), и Кама гибнет, спалённый, с выпавшим из рук цветочным луком. Образ «Кама с отброшенным луком» (apaviddha-śarāsana) — кавья-клише сражённого/обезоруженного бога любви; ср. также «kusumaśarajāt … tāpaṃ» (Мегха II.4), «жар от цветочно-стрелого [Камы]». Параллель раскрывает, что эпитет Раваны — не просто «красавец», а отсылка к спалённому Каме: зловещая ирония над спящим демоном.", "type": "Б", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.18.23", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Kumārasambhava III (Kālidāsa); Meghadūta II.4", "collision_tier1": true}]}, {"verse_id": "5.18.24", "verse": "24", "sanskrit_iast": "mathitāmṛtaphenābham arajovastram uttamam । sapuṣpam avakarṣantaṃ vimuktaṃ saktam aṅgade ॥24॥", "leonov_ru": "В подобной пене вспахтанной амриты великолепной одежде без пыли (незапятнанной), Покрытой цветами, соскользнувшей [с плеч] и зацепившейся за браслет,", "commentary": {"tilaka": "समाल्याः सपुष्पा आकुला मूर्धजा यासां ताः\nअमृतं पयः मथितपयःफेनवच्छुक्ला आभा यस्य तत् अरजो धौतम् सपुष्पं पुष्पमालासहितं विमुक्तं विशिष्टमुक्तावन्तम् । यद्वा स्थानाच्युतमङ्गदे सक्तं वस्त्रमवकर्षन्तमङ्गदादाकृष्य यथास्थाने स्थापयन्तम् । \"सपुष्पमवकर्षन्तम्\" इत्येव पाठः । तीर्थस्तु एतद्योजनाशक्त्या \"सलीलमवकर्षन्तम्\" इत्येव पाठः । तीर्थस्तु एतद्योजनाशक्त्या \"सलीलमवकर्षन्तम्\" इति पाठं कल्पयति"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.24:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Одежды белее пены / Амриты, взбитой богами (mathitāmṛtaphenābham arajovastram) – букв. «незапыленные одежды, подобные пене взбитой амриты). Комментарий «Тилака» дает для слова amṛta «амрита, напиток бессмертия» значение молоко (payas). Голдмены переводят композит mathitāmṛtaphenābham как «подобный пене свежевзбитого молока». Руссель, Датт и Шастри переводят amṛta как «амрита» (см.: Goldman 1984: 402)."}, {"id": "lexical:5.18.24:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mathitāmṛtaphena", "note_ru": "Матхитамритапхена (mathita-amṛta-phena, adj.) — «подобная пене взбитой амриты»; mathita — p.p.p. от √math- «мешать, взбивать» (Whitney #319) + amṛta «нектар бессмертия» + phena «пена». Отсылка к самудра-мантхана (пахтание океана богами и асурами для получения амриты — Mahābhārata 1.17–18, Rāmāyaṇa 1.45). «Пена амриты» = абсолютная белизна и чистота — одеяние Раваны описывается как само воплощение чистоты. Иронический контраст: одежда Равана = пена амриты (чистота), но он несёт грязное желание. Подстрочник даёт «подобной пене вспахтанной амриты» без раскрытия мифологии самудра-мантхана.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:maTita+dic_mw:amRta+dic_mw:pena", "collision_tier1": true}]}, {"verse_id": "5.18.26", "verse": "26", "sanskrit_iast": "avekṣamāṇas tu tadā dadarśa kapikuñjaraḥ । rūpayauvanasampannā rāvaṇasya varastriyaḥ ॥26॥", "leonov_ru": "Глядящий тогда, увидел слон среди обезьян Лучших женщин Раваны, наделенных красотой и молодостью.", "commentary": {"bhusana": "अवेक्षमाणस्तु ततो ददर्श कपिकुञ्जरः ।\n\nरूपयौवनसम्पन्ना रावणस्य वरस्त्रियः", "siromani": "अवेक्षमाण इति । अवेक्षमाणो विशेषज्ञानाय रावणं निरीक्षमाणः कपिकुञ्जरः रावणस्य वरस्त्रियो ददर्श"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «avekṣamāṇas» Опущено"}]}, {"verse_id": "5.18.27", "verse": "27", "sanskrit_iast": "tābhiḥ parivṛto rājā surūpābhir mahāyaśāḥ । tanmṛgadvijasaṃghuṣṭaṃ praviṣṭaḥ pramadāvanam ॥27॥", "leonov_ru": "Окруженный этими красавицами, многославный царь Вошел в ту рощу [ашоки] близ женских покоев, оглашаемую [криками] зверей и птиц.", "commentary": {"bhusana": "तमिति । पत्रविटपे पत्रवति विटपे । लीनः छन्नः । पत्रपुष्पघनावृतः पत्रपुष्पसमूहावृतः । इवशब्दो वाक्यालङ्कारे । यद्वा दूरे समागतमपि तेजसा समीपे संक्रान्तमिव स्थितम् । तं निध्यातुं द्रष्टुमुपचक्रमे ।  \"निर्वर्णनं तु निध्यानं दर्शनालोकनेक्षणम्\" इत्यमरः ।। 4.18.2526।।\n\nताभिः परिवृतो राजा सुरूपाभिर्महायशाः ।\n\nतन्मृगद्विजसंवुष्टं प्रविष्टः प्रमदावनम्\nप्रमदावनम् अन्तःपुरोद्यानम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В рощу вошел… (praviṣṭaḥ pramadāvanam) – в оригинале использовано слово pramadāvana, букв. «женская роща». Комментарий «Тилака» истолковывает этот композит как «роща (парк), подходящий для развлечения женщин» (pramadānāṃ krīḍārhaṃ vanam). В комментарии «Бхушана» предлагается значение «сад рядом с внутренними покоями» (antaḥpurodyānam)."}]}, {"verse_id": "5.18.28", "verse": "28", "sanskrit_iast": "kṣībo vicitrābharaṇaḥ śaṅkukarṇo mahābalaḥ । tena viśravasaḥ putraḥ sa dṛṣṭo rākṣasādhipaḥ ॥28॥", "leonov_ru": "На хмельного, в разноцветных украшениях, с заостренными ушами, могучего, Сына Вишраваса, владыку ракшасов смотрел он (Хануман),", "commentary": {"tilaka": "शङ्कुकर्णनामा तद्वनरक्षी राक्षसस्तेन विश्रवसः पुत्रो राक्षसो रावणो दृष्टः नान्येन केनापि पुरुषेणेत्यर्थः ।। 5.18.28,29 ।।\n\nयः पुरमध्ये पुरा शेते शयितः सो ऽयमेवेत्यन्वयः । तस्माद्रावणो ऽयमिति सञ्चिन्त्यावप्लुतः । स्वाश्रितशाखाया अत्यूर्ध्वशाखान्तर इति शेषः", "bhusana": "क्षीबो विचित्राभरणः शङ्कुकर्णो महाबलः ।\n\nतेन विश्रवसः पुत्रः स दृष्टो राक्षसाधिपः"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.28:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Остроухого (śaṅkukarṇaḥ) – автор комментария «Тилака» понимает это слово как имя собственное и поясняет, что Шанкукарна (Остроухий) – это страж рощи. Голдмены в комментарии к своему переводу «Сундараканды» отмечают, что из переводчиков этой версии последовал только Датт (см.: Goldman 1984: 403).[Е. Костина] «Остроухого» Г-пресс понимает śaṅku буквально - как «гвоздь». Перевод: его уши выглядели так, как будто в них вставлены гвозди."}]}, {"verse_id": "5.18.29", "verse": "29", "sanskrit_iast": "vṛtaḥ paramanārībhis tārābhir iva candramāḥ । taṃ dadarśa mahātejās tejovantaṃ mahākapiḥ ॥29॥", "leonov_ru": "На него, окруженного прекрасными женщинами, словно звездами – месяц, Сияющего смотрела великая обезьяна, наделенная великой силой.", "commentary": {"bhusana": "वृतः परमनारीभिस्ताराभिरिव चन्द्रमाः ।\n\nतं ददर्श महातेजास्तेजोवन्तं महाकपिः", "siromani": "ताभिरिति । सुरूपाभिस्ताभिः स्त्रीभिः परिवृतः मृगद्विजसंघुष्टं प्रमदावनं नारीविहारारण्यं प्रविष्टः क्षीबो मत्तः शङ्कुकर्णः स्तब्धीभूतश्रोत्रविशिष्टः विश्रवसः पुत्रस्तेन हनूमता दृष्टः । श्लोकद्वयमेकान्वयि ।। 5.18.27,28 ।।\n\nतदेव भङ्ग्यन्तरेणाह वृत इति । ताराभिः चन्द्रमा इव नारीभिर्यो वृतः तं रावणं महाकपिर्ददर्श"}, "has_tier1": false, "notes": [{"id": "phase2:5.18.29:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tad eva bhaṅgyantareṇa āha", "note_ru": "Широмани отмечает: сравнение Раваны, окружённого жёнами, с месяцем среди звёзд — не повтор уже сказанного о его свите, а та же мысль, поданная «иным поворотом» (bhaṅgyantareṇa) — сознательный приём варьирования, а не тавтология.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "Снимает возможное недоумение читателя по поводу видимого повтора (свита Раваны уже описана двумя стихами ранее) — подстрочник не поясняет, что это намеренное риторическое varyирование, а не тавтология.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.18.31", "verse": "31", "sanskrit_iast": "sa tathāpy ugratejāḥ sa nirdhūtas tasya tejasā । patre guhyāntare sakto hanūmān saṃvṛto 'bhavat ॥31॥", "leonov_ru": "Хотя он и обладал грозной мощью, но был потрясен его (Раваны) величием (могуществом), В укромном месте среди листвы Хануман остался скрытым.", "commentary": {"tilaka": "यद्यपि स समुद्रलङ्घनकर्ता, स मारुतात्मजो हनूमानुग्रतेजा तथापि तस्य रावणस्य तेजसा निर्धूतस्तस्य पुरोवस्थातुमशक्नुवन्पत्रे पत्रबहुले अत एव गुह्यान्तरे शाखान्तरे सक्तः स्थितः । तत्राप्यत्यल्पशरीरतया संवृतो गुप्तो ऽभवत् सर्वमायातिरस्कारकमायावतस्तस्य दृष्ट्यग्रे माययाल्पशरीरादिमत्वेन स्थातुमश्क्यत्वादेवं करणम्", "bhusana": "स तथा प्युग्रतेजाः सन् निर्धूतस्तस्य तेजसा ।\n\nपत्रगुह्यान्तरे सक्तो हनुमान् संवृतो ऽभवत्", "siromani": "स इति । यद्यपि स हनूमान् उग्रतेजास्तथापि तस्य रावणस्य तेजसा सनिर्धूतः कार्यविशेषसाधनाय निर्धूतत्वसहितः सन् गुह्यान्तरे छन्नशाखान्तरे सक्तः सन् संवृतो ऽभवत्"}, "has_tier1": false, "notes": [{"id": "lexical:5.18.31:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nirdhūta", "note_ru": "Нирдхута (nirdhūta, adj.) — «потрясённый, выбитый из колеи» (ni-+√dhū- «трясти, дрожать», Whitney #181; p.p.p. nirdhūta). MW: nirdhūta 'shaken off, dismissed; shaken'. Стих 18.31 содержит психологически важную деталь: Хануман — сам сын Ваю, обладатель великой мощи (ugratejāḥ) — был «потрясён» (nirdhūtas) теджасом Раваны. Это не слабость Ханумана, а признание реального могущества Раваны: он — законный великий царь, чья сила подлинна. Nirdhūta технически означает выбитость из устойчивого состояния (ср. √dhū- «качать как флаг»). Нарративно важно: Хануман должен будет вернуться победителем.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:nirDUta"}, {"id": "phase2:5.18.31:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "nirdhūtas tasya tejasā", "note_ru": "По Тилаке, «потрясённость» Ханумана — не просто трепет: сам обладая способностью менять облик по желанию (māyā), он не смог применить эту силу перед сиянием Раваны и остаться в его поле зрения незамеченным в уменьшенном облике — то есть теджас Раваны здесь превозмог собственное волшебство Ханумана, а не просто впечатлил его.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Раскрывает механизм «потрясения» как поражение собственной магии Ханумана перед теджасом Раваны, а не общий трепет благоговения — более острая грань, чем психологическое прочтение уже имеющейся лексической пометы о nirdhūta.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.18.32", "verse": "32", "sanskrit_iast": "sa tām asitakeśāntāṃ suśroṇīṃ saṃhatastanīm । didṛkṣur asitāpāṅgīm upāvartata rāvaṇaḥ ॥32॥", "leonov_ru": "Черноволосую, прекраснобедрую, с плотно прижатыми друг к другу грудями, Желая увидеть, направился к черноглазой [Сите] Равана.", "commentary": {"siromani": "रावण इति । पुरमध्ये गृहोत्तमे यः पुरा शेते स रावणो ऽयमेव इति संचिन्त्य अयं मद्बुद्धिस्थो हनूमान् अवप्लुतः स्वाधिष्ठितशाखायाः उर्ध्वशाखां प्राप्तः । सार्धश्लोक एकान्वयी\nस इति । सता सज्जनानां दर्शनयोग्याम् । असितकेशान्तां सीतां दिदृक्षुः रावणः उपावर्तत तत्समीपं प्राप", "tilaka": "उपावर्तत समीपं प्राप्तः", "bhusana": "स तामसितकेशान्तां सुश्रोणीं संहतस्तनीम् ।\n\nदुदृक्षुरसितापाङ्गामुपावर्तत रावणः"}, "has_tier1": true, "notes": [{"id": "tier1:5.18.32:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Черноокую (asitāpāṅgīm) – букв. «с черными уголками глаз».[Е. Костина] «Черноокую» По Г-пресс - с подведенными (сурьмой) глазами По Голдманам - The reference is, ofcourse, to the conventional cliche ofthe sidelongglances ofbeautiful women, which one encounters frequently in Sanskrit poetry. The idea is that the far corners of the eyes are dark from the presence of the large, dark iris."}, {"id": "tier1:5.18.32:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s18_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

<script>window.APPARATUS_DATA={"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 12, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 29, "verses_with_notes": 16, "notes_by_layer": {"tier1": 10, "lexical": 11, "phase2": 3, "edition": 0, "crosstext": 2}, "built_for_reviewer": "Костина", "source_hash": "ee2078a2ab60c22cf1f4a284c1ad6a43562be6df302f437d9e2afc21b305d8a0"}, "sarga": 12, "verses": [{"verse_id": "5.12.2", "verse": "2", "sanskrit_iast": "sa cintayām āsa tato mahākapiḥ । priyām apaśyan raghunandanasya tām । dhruvaṃ na sītā dhriyate yathā na me । vicinvato darśanam eti maithilī ॥2॥", "leonov_ru": "Подумала тогда та великая обезьяна, Не видя возлюбленную потомка Рагху: «Несомненно, нет в живых Ситы, раз мне, Который разыскивает [ее], не попалась на глаза Майтхили.", "commentary": {"tilaka": "न ध्रियते न जीवति स्म । \"ध्रुवं नु सीता म्रियते\" इति क्वचित्पाठः । तत्र हेतुः यथेति । यत इत्यर्थः", "bhusana": "स चिन्तयामास ततो महाकपिः प्रियामपश्यन् रघुनन्दनस्य ताम् ।\n\nध्रुवं हि सीता म्रियते यथा न मे विचिन्वतो दर्शनमेति मैथिला\nस इति । यथा यस्मात् कारणात् । विचिन्वतो मे मैथिली दर्शनं नैति तस्मात् म्रियते ममार । यद्वा अथवा नेति वाक्यं पठनीयम् । तदा अपश्यन्निति हेतुगर्भम् । अदर्शनात् मृता वा अथवा दर्शनं नैति । कुत्रचित् गहने प्रदेशे स्थिता वेत्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.12.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Не увидев той, что любима Рамой (priyām apaśyan raghunandanasya tām) – в оригинале raghunandasya – потомком Рагху."}]}, {"verse_id": "5.12.3", "verse": "3", "sanskrit_iast": "sā rākṣasānāṃ pravareṇa jānakī । svaśīlasaṃrakṣaṇatatparā satī । anena nūnaṃ prati duṣṭakarmaṇā । hatā bhaved āryapathe pare sthitā ॥3॥", "leonov_ru": "Джанаки, будучи сосредоточена на сохранении добродетели, Стоящая на наилучшем пути благородных, Верно, убита предводителем ракшасов, Творящим дурные дела.", "commentary": {"tilaka": "स्वशीलं पातिव्रत्यम् । प्रतिदुष्टकर्मणा प्रति इष्टं दुष्टं कर्म यस्य तेन सकलसज्जनानर्थकारिणेत्यर्थः । आर्यपथे आर्याणां पतिव्रतानां मार्गे", "bhusana": "सा राक्षसानां प्रवरेण जानकी स्वशीलसंरक्षणतत्परा सती ।\n\nअनेन नूनं प्रतिदुष्टकर्मणा हता भवेदार्यपथे परे स्थिता\nसेति । प्रतिदुष्टकर्मणा अतिदुष्टकर्मणा । वीप्सायां प्रतिः । \"प्रति प्रतिनिधौ वीप्सालक्षणादौ\" इत्यमरः । परे उत्कृष्टे । आर्यपथे सन्मार्गे"}, "has_tier1": true, "notes": [{"id": "tier1:5.12.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И на пути благородных стоящая (svaśīlasaṃrakṣaṇatatparā satī) – в оригинале svaśīlasaṃrakṣaṇatatparā, то есть «преданная сохранению своей добродетели». В комментарии «Тилака» svaśīla объясняется как pātivratya «верность мужу». Выражение «на пути благородных» в «Тилаке» также трактуется как «на пути верных мужу» (parivratānāṃ marge)."}, {"id": "lexical:5.12.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "satī", "note_ru": "Сати (satī, f.) — «добродетельная жена, верная супруга»; p.p.p. от √as- («быть») в специализированном значении: «та, которая есть [в истинном смысле]», то есть «истинная, подлинная». MW: satī 'a good and faithful wife'. Термин satī предшествует историческому ритуалу самосожжения (satī-dāha, известному с ок. IX в.), хотя в эпосе уже несёт семантику абсолютной супружеской верности. В данном стихе Джанаки характеризуется как satī, «стоящая на пути благородных» (āryapathe) — противопоставление пути ракшаса. Подстрочник «верная» передаёт значение, но не терминологическую весомость и этимологию.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:satI", "collision_tier1": true}, {"id": "lexical:5.12.3:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āryapatha", "note_ru": "Арьяпатха (ārya-patha, m.) — «путь благородных / дхармический путь», тат-пуруша: ārya «благородный, арий» (MW: 'one who is faithful to the religion of his country, an honourable man') + patha «путь, дорога». Выражение ārya-pathe sthitā («стоящая на пути благородных») — дхармическая квалификация: Сита ставится выше не только телесной красотой, но и этическим качеством. Ārya в ведийско-эпической традиции — прежде всего человек, придерживающийся varnāśramadharma, а не этническая категория. Характеристика убитой/погибшей Ситы как «стоявшей на пути ārya» = высшая похвала дхармической стойкости.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:Arya+dic_mw:paTa", "collision_tier1": true}, {"id": "crosstext:5.12.3:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "āryapathe sthitā", "note_ru": "Хануман размышляет о Сите как «стоящей на наилучшем пути благородных (āryapathe sthitā), сосредоточенной на сохранении добродетели (svaśīlasaṃrakṣaṇa)», которую погубил «предводитель ракшасов (rākṣasānāṃ pravara)» (V.12.3). Ситуация дословно рифмуется с эпизодом домогательства Джаядратхи к Драупади (Āraṇyaka 3.250 сл.): там «śibīnāṃ pravara» (Котикашья) подступает к одинокой верной жене в лесу, а Драупади защищает свою дхарму («niratā svadharme»). Обе сцены — испытание pativratā наедине перед лицом похитителя; параллель высвечивает типовой эпический мотив «одинокая добродетельная жена и насильник-pravara». Свидетельство: уровень шлоки (мягкое).", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.12.3", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparva 3.250.1-9", "collision_tier1": true}]}, {"verse_id": "5.12.4", "verse": "4", "sanskrit_iast": "virūparūpā vikṛtā vivarcaso । mahānanā dīrghavirūpadarśanāḥ । samīkṣya tā rākṣasarājayoṣito । bhayād vinaṣṭā janakeśvarātmajā ॥4॥", "leonov_ru": "[Или] увидев тех женщин царя ракшасов, Отвратительных, уродливых, темных, С большими пастями, высоких и мерзких видом (или «с длинными уродливыми глазами), От страха умерла дочь Джанаки.", "commentary": {"bhusana": "विरूपरूपा विकृता विवर्चसो महानना दीर्घविरूपदर्शनाः ।\n\nसमीक्ष्य सा राक्षसराजयोषितो भयाद्विनष्टा जनकेश्वरात्मजा\nविरूपाणि न्यूनाधिकानि रूपाणि शरीरावयवाः यासां ताः । विकृताः विकृतवेषाः । विवर्चसो निस्तेजस्काः । महाननाः अतिविशालमुखाः । दीर्घाणि विरूपाणि दर्शनानि चक्षूंषि यासां ता । राक्षसराजयोषितः रावणस्याज्ञाकारिणीः स्त्रियः", "siromani": "चिन्तान्तरमाह विरूपेति । विरूपाणि छिन्नैकनासिकादिमन्ति शरीराणि यासामत एव विकृताः विविधविकारविशिष्टाः अत एव दीर्घाः बृहच्छरीराः विरूपाणां राक्षसानां दर्शनं निरन्तरं दृष्टिर्यासु ता एव ता इति कर्मधारयः । अत एव विवर्चसः भयंकरवर्चोविशिष्टा राक्षसराजयोषितः ताः राक्षसीः समीक्ष्यावलोक्य जनकेश्वरात्मजा भयाद्विनष्टा"}, "has_tier1": true, "notes": [{"id": "tier1:5.12.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Страшных обличьем, уродливых, черных (virūparūpā vikṛtā vivarcaso) – «Черных» (vivarcasaḥ), букв. «лишенных сияния, великолепия». Под этим может подразумеваться как темный цвет кожи, так и отсутствие высоких душевных качеств и/или социального статуса.Женщин царя ракшасов она увидала (samīkṣya tā rākṣasarājayoṣito) – под «женщинами царя ракшасов» (rākṣasarājayoṣitaḥ) подразумеваются ракшаси, а не жены Раваны, которых Хануман видел ночью в дворцовых покоях.[Е. Костина] «царевна» Комм janakeśvarātmajā[Е. Костина] «dīrgha» Опущено"}]}, {"verse_id": "5.12.5", "verse": "5", "sanskrit_iast": "sītām adṛṣṭvā hy anavāpya pauruṣaṃ । vihṛtya kālaṃ saha vānaraiś ciram । na me 'sti sugrīvasamīpagā gatiḥ । sutīkṣṇadaṇḍo balavāṃś ca vānaraḥ ॥5॥", "leonov_ru": "Не увидев Ситу и не получив (плода моего) мужества Потратив вместе с (другими) обезьянами много времени, Я не могу вернуться к Сугриве, Обезьяне сурово наказывающей и сильной.", "commentary": {"tilaka": "पौरुषं समुद्रलङ्घनरूपपराक्रमसाध्यं प्रयोजनम् । कालं विहृत्य सुग्रीवकृतं कालमतिक्रम्य सुग्रीवसमीपं गम्यते यया सा गतिर्मार्गो नास्ति । तत्र हेतुः सु तीक्ष्णेति ।। 5.12.5,6 ।।\n\nअस्तु सुग्रीवसमीपगमनवार्ता, अङ्गदादिसमीपगमनमपि दुर्लभमित्याह किं न्विति । किं नु वक्ष्यन्तीति चिन्तां कृत्वा पुनर्विचार्य यद्वक्तव्यं तत्स्वयमेवानुवदति गत्वेत्यादि । वदस्वेति वक्ष्यन्तीत्यर्थः", "bhusana": "सीतामदृष्ट्वा ह्यनवाप्य पौरुषं विहृत्य कालं सह वानरैश्चिरम् ।\n\nन मे ऽस्ति सुग्रीवसमीपगा गतिः सुतीक्ष्णदण्डो बलवांश्च वानरः\nचिरं निर्वेद कार्यहानिः स्यादिति मत्वा अनिर्वेदमवलम्बते अनिर्वेद इति । अनिर्वेद उत्साहः तत्कृतं तत्प्रयुक्तं यत्नम् । चेष्टे, करोमीत्यर्थः । यत्करोति जन्तुरिति सिद्धम् । जन्तोस्सम्बन्धि तत्सर्वं कर्म सः अनिर्वेद एव सफलं करोतीत्यन्वयः ।। 5.12.10,11।।\n\nभूयस्तावद्विचेष्यामि देशान् रावणपालितान् ।\n\nआपानशाला विचितास्तथा पुष्पगृहाणि च\nआपानेति । एता विचिताः अथापि पुनर्विचेष्यामीत्यनुषज्यते", "siromani": "चिन्तान्तरमाह सीतामिति । वानरैः सह चिरंकालं विहृत्य सीताम् अदृष्ट्वा अत एव पौरुषं पुरुषार्थम् अनवाप्य अप्राप्य सुग्रीवसमीपगा सुग्रीवसमीपप्रापिका मे गतिर्मार्गो नास्ति । तत्र हेतुः वानरः सुग्रीवः तीक्ष्णदण्डः बलवांश्च"}, "has_tier1": false, "notes": [{"id": "lexical:5.12.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sugrīva", "note_ru": "Сугрива (sugrīva) — царь ванаров (su-grīva «прекрасношеий»), союзник Рамы. В Сундараканде Хануман выполняет его поручение. Первое вхождение в кн. V. См. примеч. к I.1.63 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}, {"id": "phase2:5.12.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "pauruṣam", "note_ru": "Паурушам (pauruṣam) в этом стихе толкуется по-разному: в «Тилаке» — как конкретная цель, достижимая именно переходом через океан (samudralaṅghana-rūpa-parākrama-sādhya prayojana), то есть сама находка Ситы; в «Широмани» — как общее «человеческое усилие» (puruṣārtha), без привязки к прыжку. Перевод «плод (моего) мужества» ближе к более общему прочтению Широмани.", "type": "Б", "source_commentary": ["tilaka", "siromani"], "why_proposed": "Комментаторы расходятся в толковании pauruṣam — конкретная цель (Тилака) против общего усилия (Широмани); перевод следует второму, более общему чтению — нюанс, невидимый в подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "crosstext:5.12.5:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "tyāga", "note_ru": "В минуту отчаяния Хануман сетует, что «потратил время … не обретя плода мужества» (anavāpya pauruṣaṃ … vihṛtya kālam). Его кризис — об отсутствии phala (плода) — высвечивается учением Гиты о tyāga, отказе от плода действия: БхГ 12.11 «… sarvakarmaphalatyāgaṃ tataḥ kuru …» — «Если ж к подвигам ты не способен, упражняясь в такой Моей йоге, практикуй от плодов отреченье в своих действиях, духом обуздан.». Параллель показывает, что испытание Ханумана состоит именно в том, чтобы действовать дальше, не цепляясь за зримый плод, — и сюжетно он эту phala-tyāga выдерживает (находит Ситу лишь позже). Свидетельство: уровень шлоки (мягкое).", "type": "В", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.12.5", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bhagavadgītā 12.11–12 (Семенцов)"}]}, {"verse_id": "5.12.6", "verse": "6", "sanskrit_iast": "dṛṣṭam antaḥpuraṃ sarvaṃ dṛṣṭā rāvaṇayoṣitaḥ । na sītā dṛśyate sādhvī vṛthā jāto mama śramaḥ ॥6॥", "leonov_ru": "Увидены [мной] все внутренние покои, Увидены женщины Раваны, Не найдена добродетельная Сита, Напрасными оказались мои усилия.", "commentary": {"bhusana": "दृष्टमन्तःपुरं सर्वं दृष्टा रावणयोषितः ।\n\nन सीता दृश्यते साध्वी वृथा जातो मम श्रमः ।। 5.12.6।\n\nसीतामिति । पौरुषं शत्रुविषयपराक्रमम् । चिरं कालं विहृत्य अतिक्रम्येत्यर्थः । एवम्भूतस्य मे सुग्रीवसमीपगा तत्समीपगामिनी गतिः मार्गः नास्ति । सुग्रीवसमीपगतिः लममायोग्येत्यर्थः । तत्र हेतुमाह सुतीक्ष्णेति । त इति शेषः ।। 5.12.5,6।।\n\nकिन्नु मां वानराः सर्वे गतं वक्ष्यन्ति सङ्गताः ।\n\nगत्वा तत्र त्वया वीर किं कृतं तद्वदस्व नः ।\n\nअदृष्ट्वा किं प्रवक्ष्यामि तामहं जनकात्मजाम्\nकिंन्विति समान्येन निर्वेदोक्तिः । विशेषतश्चाह गत्वेति । इत्युक्त इति शेषः । वदस्व न इत्युक्तः किं प्रवक्ष्यामि । यद्वा किन्त्विति पाठः । पूर्ववदर्धत्रयमेकं वाक्यम् । किन्त्विति पूर्वस्माद्विशेषोक्तिः । मां वानराः वदस्वः नः इति वक्ष्यन्ति तदा अदृष्ट्वा किं प्रवक्ष्यामीति योजना", "siromani": "दृष्टमिति । राक्षसयोषितो दृष्ट्वा सर्वमन्तःपुरं मया दृष्टं सीता तु न दृश्यते । अतः मम श्रमः समुद्रलङ्घनादिजनितखेदः वृथा"}, "has_tier1": true, "notes": [{"id": "tier1:5.12.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — строго] [термин] (не учтено) антахпура (antaḥpura) — внутренние женские покои дворца."}]}, {"verse_id": "5.12.8", "verse": "8", "sanskrit_iast": "adṛṣṭvā kiṃ pravakṣyāmi tām ahaṃ janakātmajām । dhruvaṃ prāyam upāsiṣye kālasya vyativartane ॥8॥", "leonov_ru": "Не увидев ту дочь Джанаки, что я расскажу? Несомненно, лучше было мне погибнуть с истечением срока (обещания).", "commentary": {"tilaka": "किं प्रवक्ष्यामि तान्प्रतीति शेषः । न किमपीत्यर्थः । यदेवम् अतो ध्रुवमिति । कालस्य सुग्रीवकल्पितस्य व्यतिवर्तने ऽतिक्रमे", "bhusana": "ध्रुवं प्रायमुपैष्यन्ति कालस्य व्यतिवर्तने\nतर्हि अत्रैव कालविलम्बः क्रियतां तत्राह ध्रुवमिति । कालस्य व्यतिवर्तने अस्मदागमनकाले ऽतीते प्रायमुपैष्यन्ति, जाम्बवत्प्रभृतय इति शेषः", "siromani": "ननु किं तेनेत्यत आह-- अदृष्ट्वेति । जनकात्मजाम् अदृष्ट्वा अहं किं प्रवक्ष्यामि नोत्तरमस्तीत्यर्थः, अतः कालस्य सुग्रीवपरिकल्पितसमयस्य व्यतिवर्तने उल्लङ्गने स्थितो ऽहं प्रायं प्रायोपवेशनं ध्रुवमासिष्ये"}, "has_tier1": true, "notes": [{"id": "tier1:5.12.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — строго] [термин] (не учтено) прая — пост до смерти как форма принуждения"}, {"id": "phase2:5.12.8:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "prāyam upāsiṣye", "note_ru": "Кто именно даёт обет голодной смерти (prāya), в комментариях трактуется по-разному. «Широмани» читает форму как 1-е л. ед. ч. (upāsiṣye) и явно подставляет «ahaṃ» — сам Хануман клянётся уморить себя голодом. «Бхушана» толкует ту же строку как 3-е л. мн. ч. (upaiṣyanti), относя обет к «Джамбавану и прочим» (jāmbavat-prabhṛtayaḥ) — то есть это встречающая партия предпримет прая, если Хануман не вернётся с вестью. Перевод («лучше было мне погибнуть…») следует чтению Широмани — от 1-го лица.", "type": "Б", "source_commentary": ["bhusana", "siromani"], "why_proposed": "Комментаторы по-разному определяют субъект обета prāya — сам Хануман (Широмани) или Джамбаван/встречающие (Бхушана); это содержательное текстовое расхождение, а не просто лексическая деталь, и не отражено в существующем примечании Леонова/Костиной к этому стиху (термин «прая»).", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.12.9", "verse": "9", "sanskrit_iast": "kiṃ vā vakṣyati vṛddhaś ca jāmbavān aṅgadaś ca saḥ । gataṃ pāraṃ samudrasya vānarāś ca samāgatāḥ ॥9॥", "leonov_ru": "Что скажет старец Джамбаван, и что Ангада И собравшиеся обезьяны на том берегу океана?", "commentary": {"tilaka": "किं वा वक्ष्यति माम् धिक्करिष्यतीत्यर्थः । समागतः मिलिता अन्ये वानराश्च धिक्करिष्यन्ति", "bhusana": "किं वा वक्ष्यति वृद्धश्च जाम्बवानङ्गदश्च सः ।\n\nगतं पारं समुद्रस्य वानराश्च समागताः\nसमान्येन निर्वेदं प्रतिवक्ति किं वेति । समुद्रलङ्घनरूपं महत् कर्म कृतवन्तं मां ते किं वक्ष्यन्ति किमपि वक्ष्यन्ति । यद्वा मद्वृत्तान्तं प्रशंसन् जाम्बवान् तदुत्साहको ऽङ्गदस्तदुपशृण्वन्तो ऽन्ये च मां किं वा जुगुप्सितं वक्ष्यन्ति ।। \"किं पृच्छायां जुगुप्सने\" इत्यमरः", "siromani": "किमिति । समुद्रस्य पारम् उत्तरतीरं गतं प्राप्तं मां जाम्बवान् किं वक्ष्यति वानराश्च किं वक्ष्यन्तीति वचनविपरिणामेनान्वयः"}, "has_tier1": false, "notes": [{"id": "lexical:5.12.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "aṅgada", "note_ru": "Ангада (aṅgada) — сын Валина, племянник Сугривы (aṅgada «браслет»); командует частью войска ванаров. Первое появление в кн. V.", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}, {"id": "lexical:5.12.9:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "jāmbavān", "note_ru": "Джамбаван (jāmbavān) — «медведь» (jāmbavān), старый советник ванаров; именно он пробуждает в Ханумане память о его силе, побуждая к прыжку через океан. Первое вхождение в кн. V.", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}, {"id": "phase2:5.12.9:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kiṃ vā vakṣyati", "note_ru": "Риторический вопрос Ханумана «что скажут…» получает разную эмоциональную окраску у комментаторов. «Тилака» видит здесь прямую угрозу порицания (dhikkariṣyati — «осудят»). «Бхушана» приводит два варианта: нейтральный («просто спросят») и alt. чтение (yad vā), где Джамбаван хвалит подвиг (praśaṃsan), Ангада воодушевлён, а «прочие» могут сказать нечто «презрительное» (jugupsita). Перевод сохраняет открытый, нейтральный тон вопроса, ближе к нейтральному варианту у Бхушаны и Широмани, не педалируя ни осуждение Тилаки, ни похвалу.", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "Комментаторы резко расходятся в тональности одного и того же риторического вопроса (осуждение против одобрения/нейтральности) — оттенок, стёртый в плоском подстрочном переводе.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.12.10", "verse": "10", "sanskrit_iast": "anirvedaḥ śriyo mūlam anirvedaḥ paraṃ sukham । bhūyas tatra viceṣyāmi na yatra vicayaḥ kṛtaḥ ॥10॥", "leonov_ru": "Мужество – основа (корень) могущества, мужество – высшая отрада. Лучше пока буду искать там, где (еще) не искал.", "commentary": {"bhusana": "अनिर्वेदः श्रियो मूलमनिर्वेदः परं सुखम् ।\n\nअनिर्वेदो हि सततं सर्वार्थेषु प्रवर्तकः", "siromani": "स्वामिकार्यविघातः दुःसहः इत्युत्साहावलम्बिचिन्तान्तरमाह अनिर्वेद इत्यादिभिः । अनिर्वेदः कृत्यात् निवृत्तिर्यस्मात् सः उत्साह इत्यर्थः । श्रियः संपत्तेः मूलं कारणम् अत एव अनिर्वेदः परं सुखं परमसुखहेतुः । अत एव यत्र विचयो ऽन्वेषणं न कृतः तत्र भूयो विचेष्यामि\nउत्साहस्य संपत्तिमूलत्वमुपपादयन्नाह अनिर्वेद इति । सर्वार्थेषु निखिलकर्तव्येषु प्रवर्तकः सो ऽनिर्वेदः यत् कर्म जन्तुः करोति तत् जन्तोः कर्म सफलं करोति"}, "has_tier1": true, "notes": [{"id": "tier1:5.12.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Не унывать – вот корень удачи (anirvedaḥ śriyo mūlam). В оригинале anirvedaḥ śriyo mūlam. Это же выражение встречается и в V книге «Махабхараты». В русском переводе В. И. Кальянова она звучит так: «Непоколебимая уверенность есть основа преуспеяния» (V, 39, 44). Слово anirveda также можно перевести как «отсутствие уныния, упадка духа»."}, {"id": "lexical:5.12.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "anirveda", "note_ru": "Анирведа (anirveda, m.) — «неунывание, несдавание, стойкость духа», a-nirveda: отрицательная приставка a- + nirveda («уныние, разочарование», от nir+√vid- или nir+√vad-). MW: nirveda 'indifference, aversion; despondency'. Данный стих формулирует максиму: anirvedaḥ śriyo mūlam — «стойкость = корень процветания»; anirvedaḥ paraṃ sukham — «стойкость = высшее счастье». Это сентенция (sūkta) гномического типа, эквивалент позднейших nīti-текстов. В подстрочнике «мужество» — семантически близко, но anirveda — точнее «не-разочарование, неупадочность», что богаче простого «мужества» (dharya/sattva).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:nirveda (+ отрицание a-)", "collision_tier1": true}]}, {"verse_id": "5.12.14", "verse": "14", "sanskrit_iast": "niṣkuṭāntararathyāś ca vimānāni ca sarvaśaḥ । iti saṃcintya bhūyo 'pi vicetum upacakrame ॥14॥", "leonov_ru": "И дорожки в садах, и дворцы (большие здания) повсюду», Так поразмыслив, он снова взялся за поиски.", "commentary": {"bhusana": "इति संचिन्त्य भुयो ऽपि विचेतुमुपचक्रमे ।\n\nभूमीगूहांश्चैत्यगृहान् गृहातिगृहकानपि\nभूमीगृहान् भूमीबिलगृहान् । चैत्यगृहान् चतुष्पथमण्डपान् । गृहातिगृहकान् गृहानतीत्य दूरे स्वैरविहारार्थं निर्मितान् गृहान्"}, "has_tier1": true, "notes": [{"id": "tier1:5.12.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И дома многоярусные (vimānāni ca sarvaśaḥ) – в оригинале использовано слово vimānāni. Комментарий «Тилака» трактует его как «Пушпака и другие виманы». Однако поскольку кроме Пушпаки в предыдущем тексте о других виманах не упоминается, то более логичным представляется перевести здесь слово vimāna как «многоэтажное здание/дворец»."}]}, {"verse_id": "5.12.15", "verse": "15", "sanskrit_iast": "bhūmīgṛhāṃś caityagṛhān gṛhātigṛhakān api । utpatan nipataṃś cāpi tiṣṭhan gacchan punaḥ kva cit ॥15॥", "leonov_ru": "Подвалы, святилища, террасы домов [Осмотрел он], то поднимаясь, то спускаясь, то останавливаясь, то снова идя куда-либо.", "commentary": {"tilaka": "अथ बहुदुःखचिन्ताकुलो ऽन्विष्टमेव पुनः पुनरन्वेषयति स्मेत्याह स तस्येति । तस्य भवनस्य रावणभवनस्य निशागृहा रात्रिनिवासगृहास्तान्विचेतुं जगाम\nअनिर्वेदकरमुत्साहजननं यत्नं चित्तस्थैर्थं चेष्टे करोमि ।। 5.12.12,13 ।।\n\nनिष्कुटान्तररथ्या गृहाराममध्यगता वीथीः । विमानानि फुष्पकादीनि\nभूमीगृहान्भूबिलगृहान् । गृहातिगृहका गृहोपरिगृहा इति कतकः । गृहानतीत्यानतिदूरे स्वैरविहारार्थं निर्मितगृहा इति तीर्थः । विचेतुमुपचक्रमे इत्यनुकर्षः । उत्पतन्नुन्नतमारुहन् । निपतनमवरोहः", "bhusana": "उत्पतन्निपतंश्चापि तिष्ठन् गच्छन् पुनः पुनः ।\n\nअपावृण्वंश्च द्वाराणि कपाटान्यवघाटयन्\nउत्पतन्निपतन् पूर्वमुच्चस्थानान्यधिरुह्य ततो ऽवरोहन् । अवघाटयन् पाटयन्"}, "has_tier1": true, "notes": [{"id": "tier1:5.12.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «святилища» Нужен будет комм., что представляют собой caityagṛha"}, {"id": "lexical:5.12.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "caityagṛha", "note_ru": "Чайтьягриха (caitya-gṛha, n.) — «дом-чайтья, святилище», тат-пуруша: caitya (MW: 'a funeral mound, a sacred tree, an alms-house; a place of worship') + gṛha «дом». Caitya от √ci- («складывать, собирать»): изначально надгробный курган; затем — любое сакральное сооружение (буддийские чайтьи — ступы). В эпосе caityagṛha = небольшое домашнее или придорожное святилище с деревом. Хануман осматривает caityagṛhān среди прочих строений Ланки: ракшасы, несмотря на демоническую природу, имеют собственные культовые места. Подстрочник «святилища» точен; этимологическая история (курган → храм) теряется.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:caitya+dic_mw:gfha", "collision_tier1": true}]}, {"verse_id": "5.12.18", "verse": "18", "sanskrit_iast": "prākarāntaravīthyāś ca vedikāś caityasaṃśrayāḥ । śvabhrāś ca puṣkariṇyaś ca sarvaṃ tenāvalokitam ॥18॥", "leonov_ru": "Улицы между крепостными стенами, возвышения вокруг святилищ, Погреба и лотосовые пруды все были им осмотрены.", "commentary": {"siromani": "प्राकारेति । प्राकारान्तरवीथ्यादि सर्वं तेन हनूमता ऽवलोकितं चैत्यः चतुष्पथवर्ती तरुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.12.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Скамьи у священных деревьев (vedikāś caityasaṃśrayāḥ) - слово caitya комментарий «Тилака» толкует как «[священное]дерево, расположенное на перекрестке дорог» (catuṣpathavartivṛkṣa)."}]}, {"verse_id": "5.12.19", "verse": "19", "sanskrit_iast": "rākṣasyo vividhākārā virūpā vikṛtās tathā । dṛṣṭā hanūmatā tatra na tu sā janakātmajā ॥19॥", "leonov_ru": "Ракшаси с различными обликами, уродливых, безобразных Увидел там Хануман, но не дочь Джанаки.", "commentary": {"bhusana": "राक्षस्यो विविधाकारा विरूपा विकृतास्तथा ।\n\nदृष्टा हनुमता तत्र न तु सा जनकात्मजा"}, "has_tier1": false, "notes": [{"id": "lexical:5.12.19:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "hanumat", "note_ru": "Хануман (hanumat) — имя героя — «наделённый (крепкими) челюстями» (hanu «челюсть» + mat). «Тилака» объясняет: Индра ударил его ваджрой по подбородку, отсюда имя. Первое появление формы hanumat в кн. V.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}]}, {"verse_id": "5.12.20", "verse": "20", "sanskrit_iast": "rūpeṇāpratimā loke varā vidyādharastriyaḥ । dṛṣṭā hanūmatā tatra na tu rāghavanandinī ॥20॥", "leonov_ru": "Лучших жен видьядхаров, обладающих несравненной в мире красотой, Увидел там Хануман, но не отраду Рагхавы.", "commentary": {"bhusana": "रूपेणाप्रतिमा लोके वरा विद्याधरस्त्रियः ।\n\nदृष्टा हनुमता तत्र न तु राघवनन्दिनी", "siromani": "रूपेणेति । रूपेण अप्रतिमाः विद्याधरस्त्रियः हनूमता दृष्टाः राघवनन्दिनी सीता तु न दृष्टा"}, "has_tier1": false, "notes": [{"id": "lexical:5.12.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vidyādhara", "note_ru": "Видьядхара (vidyādhara) — vidyādhara «владеющий знанием» — класс волшебных существ, обитающих в воздушном пространстве; в «Тилаке» — существа, умеющие летать силой мантр. Первое вхождение в кн. V.", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}]}, {"verse_id": "5.12.21", "verse": "21", "sanskrit_iast": "nāgakanyā varārohāḥ pūrṇacandranibhānanāḥ । dṛṣṭā hanūmatā tatra na tu sā janakātmajā ॥21॥", "leonov_ru": "Дивнобедрых дочерей нагов, чьи лица подобны полной луне, Увидел там Хануман, но не дочь Джанаки.", "commentary": {"siromani": "राक्षसस्य इति । विविधाकाराः राक्षस्यः हनूमता दृष्टाः जनकात्मजा तु न दृष्टा\nनागेति । नागकन्या दृष्टाः जनकात्मजा न दृष्टा", "bhusana": "नागकन्या वरारोहाः पूर्णचन्द्रनिभाननाः ।\n\nदृष्टा हनुमता तत्र न तु सीता सुमध्यमा"}, "has_tier1": false, "notes": [{"id": "lexical:5.12.21:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nāgakanyā", "note_ru": "Нагакання (nāga-kanyā, f.) — «дочь нагов», тат-пуруша: nāga «змей, нагa» + kanyā «девушка, дочь». MW: nāga 'a snake, a serpent-demon'. Наги — полузмеи-полубоги, обитающие в подземном мире (pātāla); их женщины (nāgakanyā, nāgī) в эпосе изображаются красавицами. Равана, захватив nāgakanyā «силой» (balāt) — 12.22 — демонстрирует тот же modus operandi, что и похищение Ситы: он собирает красавиц из всех мировых рас. Перечисление rākṣasī / vidyādharī / nāgakanyā = каталог пленённых существ из трёх уровней Вселенной (земля / воздух / подземье). Подстрочник «дочерей нагов» точен; космологический каталог уровней бытия не виден.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:nAga+dic_mw:kanyA"}]}, {"verse_id": "5.12.22", "verse": "22", "sanskrit_iast": "pramathya rākṣasendreṇa nāgakanyā balād dhṛtāḥ । dṛṣṭā hanūmatā tatra na sā janakanandinī ॥22॥", "leonov_ru": "Дочерей нагов, которых царь ракшасов, похитив, удерживал силой, Увидел там Хануман, но не отраду Джанаки.", "commentary": {"bhusana": "प्रमथ्य राक्षसेन्द्रेण नागकन्या बलाद्धृताः ।\n\nदृष्टा हनुमता तत्र न सा जनकनन्दिनी ।"}, "has_tier1": true, "notes": [{"id": "tier1:5.12.22:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Похищенных дочерей нагов,Насильно удерживаемых Раваной» Нужен комм. 1) в 21 тоже есть дочери нагов. Это другие или дополнение к тем? 2) Ранее говорилось, что Равана никого силой не удерживал. Нужно пояснение"}]}, {"verse_id": "5.12.25", "verse": "25", "sanskrit_iast": "avatīrya vimānāc ca hanūmān mārutātmajaḥ । cintām upajagāmātha śokopahatacetanaḥ ॥25॥", "leonov_ru": "Сойдя с виманы, Хануман, сын ветра, Душа которого была охвачена скорбью, погрузился в раздумья.", "commentary": {"tilaka": "अवतीर्य विमानाच्चेति । पुनरारुह्यावरुह्य चेत्यर्थः । विमान एवैतत्सर्वदर्शनमिति तत्त्वम्", "bhusana": "अवतीर्य विमानाच्च हनुमान् मारुतात्मजः ।\n\nचिन्तामुपजगामाथ शोकोपहतचेतनः"}, "has_tier1": false, "notes": [{"id": "lexical:5.12.25:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śokopahatacetana", "note_ru": "Шокопахатачетана (śoka-upahata-cetana, adj.) — «тот, чьё сознание (cetana) поражено (upahata) скорбью (śoka)», бахуврихи: śoka «скорбь» (√śuc-, «жечь, скорбеть») + upahata p.p.p. (upa+√han-, «поражать») + cetana «сознание, чувство» (от √cit-, «воспринимать, сознавать»). MW: cetana 'consciousness, understanding'. Cetana в индийской психологической модели — сознающий, воспринимающий аспект manas (ума): именно он «поражается» горем. Tройной сложный адъектив — характерная техника эпоса: описание психического состояния через анатомию «удара» по cetana. Подстрочник «душа которого была охвачена скорбью» — свободный; точность cetana vs ātman (душа) утрачивается.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:cetana+dic_mw:upahata"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"Костина",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

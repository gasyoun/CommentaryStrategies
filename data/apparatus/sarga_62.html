"tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Ведь словам Ханумана... / Даже неподобающим, / Ныне я должен следовать (vākyaṃ hanumato mayā akāryam api kartavyam) - букв.: “Мне должно исполнить слова Ханумана, даже те, которые не должно исполнять”."}]}, {"verse_id": "5.62.5", "verse": "5", "sanskrit_iast": "sādhu sādhv iti saṃhṛṣṭā vānarāḥ pratyapūjayan । pūjayitvāṅgadaṃ sarve vānarā vānararṣabham ॥5॥", "leonov_ru": "«Прекрасно! Прекрасно!» - почтили [его], обрадованные обезьяны. Оказав почтение Ангаде, все обезьяны, быки среди обезьян,", "commentary": {"siromani": "वानरकर्तृकरक्षकपराभवानन्तरकालिकं वृत्तान्तमाह-- तामित्यादिभिः । हे वानराः युष्माकं परिपन्थिनः रिपून् अहम् आवर्जयिष्यामि अतो यूयं मधु सेवत पिबत इति वचो हनूमान् तान् वानरान् उवाच । सार्धश्लोक एकान्वयी\nपूजयित्वेति । अङ्गदं पूजयित्वा यत्र मधुवनं तत्र वानरर्षभाः सर्वे वानराः नदीवेग इव जग्मुः", "bhusana": "पूजयित्वा ऽङ्गदं सर्वे वानरा वानरर्षभम् ।\n\nजग्मुर्मधुवनं यत्र नदीवेगा इव द्रुतम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «могучие обезьяны» почему не наоборот (обезьяны могучие)? Лучше бы в размер легло, мне кажется"}]}, {"verse_id": "5.62.6", "verse": "6", "sanskrit_iast": "jagmur madhuvanaṃ yatra nadīvega iva drumam । te praviṣṭā madhuvanaṃ pālān ākramya śaktitaḥ ॥6॥", "leonov_ru": "Пошли в лес Мадхувану, словно течение реки на дерево. Вошли они в лес Мадхувану, со всей силы атаковав стражей,", "commentary": {"tilaka": "आवर्जयिष्यामि निवारयिष्यामि ।। 5.62.2,3 ।।\n\nईदृशमेतन्मात्रार्थकम् ।। 5.62.4,5 ।।\n\nयत्र मधुवनं यत्र मार्गे गमनेन मधुवनं प्राप्यते तेन मार्गेण जग्मुः", "bhusana": "ते प्रविष्टा मधुवनं पालानाक्रम्य वीर्यतः"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Как поток многоводный – на дерево (nadīvega iva drumam) - букв. “как речной поток на дерево”."}]}, {"verse_id": "5.62.7", "verse": "7", "sanskrit_iast": "atisargāc ca paṭavo dṛṣṭvā śrutvā ca maithilīm । papuḥ sarve madhu tadā rasavat phalam ādaduḥ ॥7॥", "leonov_ru": "Раззадоренные позволением и знанием того, что [Хануман] нашел Майтхили, Все они стали пить мед тогда и срывать вкусные плоды.", "commentary": {"tilaka": "ते पटवो हनूमांश्च मैथिलीं दृष्ट्वा ऽन्ये तन्मुखात्तां लङ्कास्थां श्रुत्वा महत्कार्यकरणेन भयराहित्यादतिसर्गादङ्गदानुज्ञानान्मधुवनं प्रविष्टाः पालान्बलादाक्रम्य बद्धा मधु पपू रसवत्फलं चाददुः, भक्षणार्थमिति शेषः", "bhusana": "अतिसर्गाच्च पटवो दृष्ट्वा श्रुत्वा च मैथिलीम् ।\n\nपपुः सर्वे मधु तदा रसवत् फलमाददुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Раззадоренные позволением / И Ханумана успехом (atisargāc ca paṭavo dṛṣṭvā śrutvā ca maithilīm) - букв.: “Стремительные из-за позволения и увидев и услышав Майтхили”. Средневековые комментаторы отмечают, что обезьяны только слышали рассказ Ханумана, который был единственным из них, кто видел Ситу."}, {"id": "lexical:5.62.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "atisarga", "note_ru": "Атисарга (ati-sarga, m.) — «особое разрешение, снятие запрета»: ati («сверх, превыше») + sarga («отпускание, дозволение», √sṛj- «выпускать»). MW: atisarga 'special permission'. В стихе «atisargāc ca paṭavo» — «раззадоренные [полученным] дозволением». Ключевой термин: войску разрешено пить и наслаждаться лесом не по праву, а по особому atisarga. Концепция atisarga в дхармашастрах описывает временное снятие запрета для особого случая — аналог распоряжения о «вольном времени» в армии. Это превращает разорение Мадхуваны из бесчинства в ритуально оправданное торжество.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:atisarga+dic_apte:atisarga", "collision_tier1": true}]}, {"verse_id": "5.62.8", "verse": "8", "sanskrit_iast": "utpatya ca tataḥ sarve vanapālān samāgatān । te tāḍayantaḥ śataśaḥ saktā madhuvane tadā ॥8॥", "leonov_ru": "Обрушившись тогда на сошедшихся стражей леса, Они, избивающие [их] сотнями, жаждущие насладиться лесом Мадхуваной тогда.", "commentary": {"tilaka": "मधुवने सक्ता भक्षणार्थं लग्नाः ।। 5.62.8,9 ।।\n\nअपविद्ध्यन्ति प्रक्षिपन्ति मधूनि ते । मधुपटलानि ।। 5.62.10,11 ।।\n\nउन्मत्तवेगा उन्मत्तानां वेगो येषां ते । यद्धा ऽतिशयितवेगा इत्यर्थः ।। 5.62.12,13 ।।\n\nइतरद्रोदनम्", "siromani": "ते इति । मैथिलीं दृष्ट्वा श्रुत्वा च आगताः सर्वे वानराः अतिसर्गात् अङ्गदाज्ञातः शक्तितः सामर्थ्यात् पालान् मधुवनरक्षकान् आक्रम्य त्वितरकर्तृकमिति विवेकः । सार्धश्लोक एकान्वयी ।। 5.62.6,7 ।।\n\nउत्पत्येति । समागतान् शतशो वनपालान् ताडयन्तः सर्वे वानराः ततस्तस्मिन् मधुवने सक्ता बभूवुरिति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Уходить не желая из рощи (saktā madhuvane) - в оригинале “привлеченные Медовой рощей”. Автор комментария “Бхушана” приводит другой вариант: saktān, глоссируя его vānapālane ratān (радеющие об охране рощи). В этом случае причастие sakta относится к стражам. Именно этот вариант вошел в критическое издание (см.: Jhala 1966: 421)."}]}, {"verse_id": "5.62.9", "verse": "9", "sanskrit_iast": "madhūni droṇamātrāṇi bahubhiḥ parigṛhya te । pibanti kapayaḥ kecit saṃghaśas tatra hṛṣṭavat ॥9॥", "leonov_ru": "Схватив лапами медовые соты вместимостью в дрону, Некоторые обезьяны пили [мед] вместе там радостно.", "commentary": {"bhusana": "मधूनि द्रोणमात्राणि बाहुभिः परिगृह्य ते ।\n\nपिबन्ति सहिताः सर्वे निघ्नन्ति स्म तथा ऽपरे\nमधूनि मधुपटलानि । द्रोणमात्राणि द्रोणप्रमाणानि आढकप्रमाणानि । निघ्नन्ति स्म पीतावशिष्टानि मधुपटलानि भिन्दन्ति स्म", "siromani": "मधूनीति । संघशो विद्यमानाः केचित्कपये द्रोणमात्राणि अष्टाढकप्रमाणानि मधूनि बाहुभिः परिगृह्य हृष्टवत् संतोषकारकं यथा भवति तथा पिबन्ति"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Вместимостью в целую кадку (droṇamātrāṇi) - в оригинале использовано слово дрона (droṇa), мера объема, равная примерно 16 кг."}, {"id": "lexical:5.62.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "droṇa", "note_ru": "Дрона (droṇa, n./m.) — мера объёма: «деревянная кадка» = 16 āḍhaka (MW: droṇa 'a wooden trough or pail; a measure equal to 16 āḍhakas'). Одна дрона ≈ 13–14 литров по современным пересчётам. «droṇamātrāṇi» — «вместимостью в дрону»: обезьяны держат в лапах медовые соты размером с дрону — гиперболическое изображение размаха. Метрологический термин в эпосе создаёт комический батос: монументальная победа → обезьяны с 14-литровыми сотами мёда. Подстрочник «лапами» теряет эту конкретную (и юмористическую) меру.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:droRa+dic_apte:droRa", "collision_tier1": true}]}, {"verse_id": "5.62.10", "verse": "10", "sanskrit_iast": "ghnanti sma sahitāḥ sarve bhakṣayanti tathāpare । ke cit pītvāpavidhyanti madhūni madhupiṅgalāḥ ॥10॥", "leonov_ru": "Нюхали они его, сойдясь все, пили [мед] одни, Другие, выпив, отбрасывали соты, [сами] рыжие, словно мед.", "commentary": {"bhusana": "केचित्पीत्वा ऽपविध्यन्ति मधूनि मधुपिङ्गलाः ।\n\nमधूच्छिष्टेन केचिच्च जघ्नुरन्योन्यमुत्कटाः", "siromani": "घ्नन्तीनि । मधुपिङ्गलाः सहिताः सर्वे वानराः मधूनि मधुपटलानि घ्नन्ति ताडयन्ति अपरे भक्षयन्ति पिबन्ति केचित्पीत्वा अपविध्यन्ति प्रक्षिपन्ति"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "валили ульи (apavidhyanti madhūni) - букв. “швыряли меды”. В комментариях “Тилака” и “Таттвадипика” слово madhuni глоссируется как madhupaṭalāni (ульи).[Е. Костина] «и.» Г-пр считает, что они выбрасывали недоеденное"}]}, {"verse_id": "5.62.11", "verse": "11", "sanskrit_iast": "madhūcchiṣṭena ke cic ca jaghnur anyonyam utkaṭāḥ । apare vṛkṣamūleṣu śākhā gṛhya vyavasthitaḥ ॥11॥", "leonov_ru": "Некоторые, захмелевшие, кидались друг в друга остатками меда. Другие у подножий деревьев стояли, схватившись за ветки.", "commentary": {"bhusana": "अपरे वृक्षमूले तु शाखां गृह्य व्यवस्थिताः ।\n\nअत्यर्थं च मदग्लानाः पर्णान्यास्तीर्य शेरते", "siromani": "मध्विति । उत्कटाः मधुमत्ताः केचित् मधूच्छिष्टेन उच्छिष्टमधुना अन्योन्यं जघ्नुः अपरे शाखाः गृह्य गृहीत्वा वृक्षमूले व्यवस्थिताः"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Воском (madhūcchiṣṭena) - в комментарии “Широмани” этот композит объясняется как ucchiṣṭamadhunā (оставшимся медом)."}]}, {"verse_id": "5.62.12", "verse": "12", "sanskrit_iast": "atyarthaṃ ca madaglānāḥ parṇāny āstīrya śerate । unmattavegāḥ plavagā madhumattāś ca hṛṣṭavat ॥12॥", "leonov_ru": "И весьма уставшие от хмеля, лежали на земле, разбросав [вокруг] листья, Воодушевленные хмелем, пьяные обезьяны радостно.", "commentary": {"bhusana": "अपविध्यन्ति अवक्षिपन्ति । मधूच्छिष्टेन सिक्थकेन । \"मधूच्छिष्टं तु सिक्थकम्\" इत्यमरः । उत्कटाः मत्ताः ।। 5.62.10,11 ।।\n\nउन्मत्तभूताः प्लवगा मधुमत्ताश्च हृष्टवत् ।\n\nक्षिपन्ति च तदा ऽन्योन्यं स्खलन्ति च तथा ऽपरे\nहृष्टवत् हर्षयुक्तमिति क्रियाविशेषणम् । हृष्टार्हमिति वार्थः । क्षिपन्ति उत्क्षिप्य पातयन्ति । स्खलन्ति पादेन नुदन्तीत्यर्थः", "siromani": "अत्यर्थमिति । मधुमत्ताः अत एव मदग्लानाः मदहेतुकग्लानिविशिष्टाः अत एव उन्मत्तभूताः उन्मत्तत्वं प्राप्ताः प्लवगाः पर्णानि आस्तीर्य शेरते"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Утомленные хмелем,Легли, раскидавши листья,» По Г-пр и Голдмэнам это связанные действия: стояли под деревьями, схватившись за нижние ветки, а потом раскидали листья и легли."}]}, {"verse_id": "5.62.13", "verse": "13", "sanskrit_iast": "kṣipanty api tathānyonyaṃ skhalanty api tathāpare । ke cit kṣveḍān prakurvanti ke cit kūjanti hṛṣṭavat ॥13॥", "leonov_ru": "Ругались друг с другом, бродили, спотыкаясь, другие, Некоторые ревели словно львы, некоторые радостно щебетали, подобно птицам.", "commentary": {"bhusana": "केचित् क्ष्वेलां प्रकुर्वन्ति केचित् कूजन्ति हृष्टवत् ।\n\nहरयो मधुना मत्ताः केचित् सुप्ता महीतले\nक्ष्वेलां सिंहनादम् । \"क्ष्वेला तु सिंहनादः स्यात्\" इत्यमरः । कूजन्ति पक्षिवच्छब्दायन्ते", "siromani": "क्षिपन्तीति । केचित् अन्योन्यं क्षिपन्ति क्षेपयन्ति अपरे स्खलन्ति केचित् क्षेडान् विलासान् प्रकुर्वन्ति केचित् हृष्टवत् हर्षकारकं यथा भवति तथा कूजन्ति"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «hṛṣṭavat» опущено[Е. Костина] «vṛkṣamūleṣu» опущено, что они стояли у корней, под деревьями"}]}, {"verse_id": "5.62.14", "verse": "14", "sanskrit_iast": "harayo madhunā mattāḥ ke cit suptā mahītale । dhṛṣṭā kecid dhasanty anye kecit kurvanti cetarat ॥14॥", "leonov_ru": "Некоторые обезьяны, опьяневшие от меда, спали на земле. Некоторые радостно смеялись, иные плакали (досл. делали обратное).", "commentary": {"bhusana": "कृत्वा केचिद्धसन्त्यन्ये केचित् कुर्वन्ति चेतरत् ।\n\nकृत्वा केचिद्वदन्त्यन्ये केचिद्बुद्ध्यन्ति चेतरत्\nअन्ये अवाच्यं किंचिद्ग्राम्यं कर्म कृत्वा हसन्ति । इतरत् तद्विलक्षणं ग्राम्यं कर्म केचित्कुर्वन्ति । केचिदन्यत् ग्राम्यं कर्म कृत्वा अस्माभिरिदं कृतमिति वदन्ति उच्चारयन्ति । केचिदितरद्रुव्यन्ति एवं करिष्यामिति सङ्कल्पयन्तीत्यर्थः ।। 5.62.14,15 ।।\n\nजानुभिस्तु प्रकृष्टाश्च देवमार्गं प्रदर्शिताः ।\n\nअब्रुवन् परमोद्विग्ना गत्वा दधिमुखं वचः", "siromani": "हरय इति । मधुना मत्ताः केचित् हरयः हसन्ति अन्ये इतरत् रोदनादि कुर्वन्ति"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Другие же горько плакали (kecit kurvanti cetarat) - букв. “делали иное/противоположное”. Автор комментария “Тилака” поясняет itarat как rodanam (плач)."}]}, {"verse_id": "5.62.16", "verse": "16", "sanskrit_iast": "te 'pi tair vānarair bhīmaiḥ pratiṣiddhā diśo gatāḥ । jānubhiś ca praghṛṣṭāś ca devamārgaṃ ca darśitāḥ ॥16॥", "leonov_ru": "Были разогнаны ужасными обезьянами и разошлись в разные стороны. Их прогнали пинками и показали дорогу богов.", "commentary": {"tilaka": "प्रतिषिद्धास्ताडनादिना निरस्ताः । जानुभिः प्रघृष्टा जानुषु गृहीत्वा आकृष्टाः । देवमार्गमपानद्वारमिति तीर्थः । देवमार्गं दर्शिताः पादौ गृहीत्वोर्ध्वं प्रक्षिप्ता इत्यर्थः । कर्णावङ्गुलीभिर्धृत्वोर्ध्वीकृता इति वार्थ इत्यन्ये ।। 5.62.16,17 ।।\n\nतान्स्वसंबन्धिनः पालान्"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Дорогу богов показали (devamārgaṃ ca darśitāḥ) - неясное выражение. Часть комментаторов понимают под “дорогой богов” иносказательное обозначение ануса. Автор комментария “Тилака” полагает, что стражей, схватив за ступни, подкинули вверх (к небу, то есть к “дороге богов”). Голдмены переводят showed them their posteriors (см.: Goldman 1984: 281)."}, {"id": "lexical:5.62.16:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "devamārga", "note_ru": "Девамарга (deva-mārga, m.) — «путь богов; небо»: deva «бог» + mārga «путь, дорога» (√mṛg-, «искать, преследовать по следу»). MW: devamārga 'the sky'. «Путь богов» = небо, воздух, пространство полёта. В стихе стражей леса «прогнали и показали devamārga» — идиоматическое выражение «показать путь богов» = «прогнать прочь» (с унизительным подтекстом: «ступай на небо», т.е. умри или убирайся). MW: dev-mārgadarśana «showing someone the sky, i.e. giving a sound beating». Подстрочник «показали дорогу богов» теряет этот идиоматический смысл оскорбления.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:devamArga+dic_apte:devamArga", "collision_tier1": true}]}, {"verse_id": "5.62.17", "verse": "17", "sanskrit_iast": "abruvan paramodvignā gatvā dadhimukhaṃ vacaḥ । hanūmatā dattavarair hataṃ madhuvanaṃ balāt । vayaṃ ca jānubhiḥ ghṛṣṭā devamārgaṃ ca darśitāḥ ॥17॥", "leonov_ru": "В высшей степени испуганные, пойдя к Дадхимукхе, сказали они: «С позволения Ханумана силой разорен лес Мадхувана. Нас вытолкали пинками и показали дорогу богов».", "commentary": {"siromani": "जानुभिरिति । जानुभिः जानुग्रहणैः प्रघृष्टाः आकृष्टा अनन्तरं देवमार्गम् आकाशं दर्शिताः प्रक्षेपेण प्रापिता इत्यर्थः । अत एव परमोद्विग्नाः केचित् रक्षकाः दधिमुखं गत्वा प्राप्य हनूमता दत्तः वरः यथेच्छं मूलफलादिस्वीकारो येभ्यः तैः मधुवनं हतं विनाशितं वयं च जानुभिर्घृष्टाः सन्तः देवमार्गं प्रदर्शिताः इति वचः अब्रुवन् । अर्धचतुष्टयमेकान्वयि ।। 5.62.16,17 ।।\n\nतदेति । तदा रक्षकगमनानन्तरकाले मधुवनं हतं श्रुत्वा क्रुद्धो वनपो दधिमुखः तानागतान् हरीन् सान्त्वयामास", "bhusana": "वीर्यतः बलात् । अतिसर्गादङ्गदाभ्यनुज्ञानात् । दृष्ट्वा श्रुत्वा च मैथिलीं दर्शनश्रवणाभ्यां च हेतुना । वनपालानाक्रम्य आक्षिप्य ।। 5.62.6,7 ।।\n\nउत्पत्य च ततः सर्वे वनपालान् समागतान् ।\n\nताडयन्ति स्म शतशः सक्तान् मधुवने तदा\nसक्तान् वनपालने रतान्\nहनूमता दत्तवरैर्हतं मधुवनं बलात् ।\n\nवयं च जानुभिः कृष्टा देवमार्गं च दर्शिताः"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Хануман разрешил обезьянам / Разорить Медовую рощу (hanūmatā dattavarair hataṃ madhuvanaṃ balāt) - букв. “с разрешения, данного Хануманом, погублена силой Медовая роща”."}, {"id": "lexical:5.62.17:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dattavara", "note_ru": "Даттавара (datta-vara, adj./m.) — «[тот, кому] дан дар, наделённый благодатью»: datta (p.p.p. от √dā-, «давать») + vara «дар, благодать, выбор» (от √vṛ-, «выбирать»). MW: vara 'choosing; a boon, benefit; the best of its kind'. В стихе «hanūmatā dattavarair hataṃ madhuvanaṃ balāt» — «с позволения (с даром от) Ханумана силой разорен лес». Dattavara здесь имеет особый юридический смысл: подразумевается, что Хануман как обладатель atisarga дальше «делегировал» его войску — разрушение Мадхуваны произошло с его «дарованного» одобрения. Это именно то, что стражи пытаются инкриминировать Хануману.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:dattavara+dic_mw:vara", "collision_tier1": true}]}, {"verse_id": "5.62.23", "verse": "23", "sanskrit_iast": "balānnivārayantaśca āsedur harayo harīn । saṃdaṣṭauṣṭhapuṭāḥ kruddhā bhartsayanto muhur muhuḥ ॥23॥", "leonov_ru": "Чтобы силою остановить [их], бросились обезьяны на обезьян, В гневе кусая губы, угрожая [им] снова и снова.", "commentary": {"siromani": "बलादिति । क्रुद्धाः अत एव संदष्टौष्ठपुटाः अत एव मुहुर्मुहुर्भर्त्सयन्तः वारयन्तो हरयः हरीन् आसेदुः प्रापुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.23:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «harayo harīn» по переводу не видно, что защитники рощи - тоже обезьяны. Складывается ощущение, что нет, поскольку обезьянами последовательно называются только разорители"}, {"id": "edition:5.62.23:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.62.23 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.62.23", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.62.23", "iast": "balānnivārayantaśca āsedur harayo harīn । saṃdaṣṭauṣṭhapuṭāḥ kruddhā bhartsayanto muhur muhuḥ ॥23॥"}], "collision_tier1": true}]}, {"verse_id": "5.62.25", "verse": "25", "sanskrit_iast": "savṛkṣaṃ taṃ mahābāhum āpatantaṃ mahābalam । vegavantaṃ vijagraha bāhubhyāṃ kupito 'ṅgadaḥ ॥25॥", "leonov_ru": "Вооруженного стволом дерева того мощнорукого, могучего, нападающего Стремительного [Дадхимукху] схватил обеими руками разгневанный Ангада.", "commentary": {"bhusana": "तं सवृक्षं महाबाहुमापतन्तं महाबलम् ।\n\nआर्यकं प्राहरत्तत्र बाहुभ्यां कुपितो ऽङ्गदः", "siromani": "सेति । सवृक्षं वृक्षसहितमापतन्तं तं दधिमुखम् अङ्गदो विजग्राह"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Мощнорукий и быстрый, / Пошел Дадхимукха… (savṛkṣaṃ taṃ mahābāhum āpatantaṃ mahābalam) - букв.: “Того, со стволом дерева, мощнорукого, устремившегося [на него] могучего, быстрого [Дадхимукху]”."}]}, {"verse_id": "5.62.26", "verse": "26", "sanskrit_iast": "madāndho na kṛpāṃ cakre āryako 'yaṃ mameti saḥ । athainaṃ niṣpipeṣāśu vegena vasudhātale ॥26॥", "leonov_ru": "Слепой от хмеля не пощадил его, [сказав себе]: «Это же мой дед», И с силой стремительно поверг его на землю.", "commentary": {"bhusana": "मदान्धश्च न वेदैनमार्यको ऽयं ममेति सः ।\n\nअथैनं निष्पिपेषाशु वेगवद्वसुधातले", "siromani": "मदान्धा इति । मदान्धो दधिमुखः ममायमार्यकः स्वामीति बुद्ध्या कृपां न चक्रे अथातः सो ऽङ्गदः एनं दधिमुखं वेगेन वसुधातले निष्पिपेष"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Это же дед мой (āryako ‘yaṃ mama) - Дадхимукха приходится Сугриве, дяде Ангады, дядей по материнской линии (как отмечено в комментарии “Тилака”)."}, {"id": "lexical:5.62.26:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āryaka", "note_ru": "Арьяка (āryaka, m.) — «почтенный [дед/прадед]»: āryaka = уважительная форма от ārya («благородный, ариец», от √ṛ-, «двигаться, прибывать»), суффикс -ka с уменьшительно-ласкательно-почтительным оттенком. MW: āryaka 'a respectable man; grandfather'. В стихе «madāndho na kṛpāṃ cakre āryako'yam mameti» — «опьянённый [Ангада] не сжалился [над Дадхимукхой], [думая]: это же мой āryaka (дед)». Āryaka — специфически семейно-почтительный термин (дед по материнской или боковой линии, «почтенный дедушка»), отличный от pitāmaha. Моральная заостренность: Ангада знает, кто перед ним, но madā (опьянение) берёт верх над родственным долгом.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:Aryaka+dic_apte:Aryaka", "collision_tier1": true}]}, {"verse_id": "5.62.27", "verse": "27", "sanskrit_iast": "sa bhagnabāhūrumukho vihvalaḥ śoṇitokṣitaḥ । pramumoha mahāvīro muhūrtaṃ kapikuñjaraḥ ॥27॥", "leonov_ru": "Тот, со сломанными руками и бедрами, с разбитым лицом, павший духом, залитый кровью, Отважный герой, слон среди обезьян, на некоторое время потерял сознание.", "commentary": {"bhusana": "स भग्नबाहूरुभुजो विह्वलः शोणितोक्षितः ।\n\nमुमोह सहसा वीरो मुहूर्तं कपिकुञ्जरः", "siromani": "स इति । भग्नबाहूरुमुखः अत एव शोणितोक्षितो दधिमुखः प्रमुमोह"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Пал духом» непонятно, что имеется в виду[Е. Костина] «время» В Г-пр откуда-то взяли, что он пролежал без чувств 2 часа."}]}, {"verse_id": "5.62.30", "verse": "30", "sanskrit_iast": "sarvaṃ caivāṅgade doṣaṃ śrāvayiṣyāma pārthive । amarṣī vacanaṃ śrutvā ghātayiṣyati vānarān ॥30॥", "leonov_ru": "Все проступки Ангады поведаем государю. Возмущенный, речь [нашу] услышав, уничтожит он [этих] обезьян.", "commentary": {"siromani": "सर्व इति । वयं सर्वे अङ्गदे दोषं पार्थिवे सुग्रीवसमीपे श्रावयिष्याम श्रावयिष्यामः अतः अमर्षी सुग्रीवः वानरान् अङ्गदादीन् घातयिष्यति"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Услышит он наш рассказ / И покарает разбойников (amarṣī vacanaṃ śrutvā ghātayiṣyati vānarān) - букв.: “Услышав [наши] слова, [он] в ярости велит убить [этих] обезьян”.[Е. Костина] «.» По Г-пр amarṣī - это в принципе характеристика Сугривы, что-то вроде \"гневливый\", а не то, что он рассердится в этот момент"}]}, {"verse_id": "5.62.31", "verse": "31", "sanskrit_iast": "iṣṭaṃ madhuvanaṃ hy etat sugrīvasya mahātmanaḥ । pitṛpaitāmahaṃ divyaṃ devair api durāsadam ॥31॥", "leonov_ru": "Ибо этот лес Мадхувана желанен великому духом Сугриве, Унаследованный от предков, дивный, даже богам недоступный.", "commentary": {"bhusana": "इष्टं मधुवनं ह्येतत् सुग्रीवस्य महात्मनः ।\n\nपितृपैतामहं दिव्यं देवैरपि दुरासदम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.31:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «недоступную» Она недоступная (вообще) или труднодоступная?"}, {"id": "lexical:5.62.31:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pitṛpaitāmaha", "note_ru": "Питрипаитамаха (pitṛ-paitāmaha, adj.) — «унаследованный от отца и деда»: pitṛ «отец» + paitāmaha «принадлежащий деду» (от pitāmaha). MW: paitāmaha 'inherited from a grandfather, ancestral'. Составное pitṛ-paitāmaha = «отцовско-дедовское», т.е. «родовое, предковое», передающееся по наследству не менее двух поколений. В контексте Мадхуваны — «unаследованный от предков, дивный»: Дадхимукха апеллирует к сакральности родового имущества Сугривы. В дхармашастрах pitṛ-paitāmaha dharma — неотчуждаемое наследственное право, нарушение которого — тяжкий грех.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:pitfpaitAmaha", "collision_tier1": true}]}, {"verse_id": "5.62.32", "verse": "32", "sanskrit_iast": "sa vānarān imān sarvān madhulubdhān gatāyuṣaḥ । ghātayiṣyati daṇḍena sugrīvaḥ sasuhṛjjanān ॥32॥", "leonov_ru": "Этих обезьян всех, охочих до меда, смерть которых близка, Убьет в качестве наказания (накажет смертью) Сугрива вместе с их друзьями.", "commentary": {"bhusana": "सर्वं चैवाङ्गदे दोषं श्रावयिष्यामि पार्थिवे ।\n\nअमर्षी वचनं श्रुत्वा घातयिष्यति वानरान्\nस वानरानिमान् सर्वान् मधुलुब्धान् गतायुषः ।\n\nघातयिष्यति दण्डेन सुग्रीवः ससुहृज्जनान्\nगतायुष इत्यधिक्षेपवचनम्"}, "has_tier1": false, "notes": [{"id": "phase2:5.62.32:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "gatāyuṣaḥ", "note_ru": "Гатаюшах (gatāyuṣaḥ, «чей век истёк») — по Бхушане, это не буквальное предсказание смерти, а adhikṣepa-vacana, «слово-попрёк», риторическая брань разгневанного Сугривы в адрес похитителей мёда. Подстрочник передаёт фразу буквально («смерть которых близка»), теряя её бранный, а не пророческий регистр.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "Бхушана маркирует gatāyuṣaḥ как риторическую брань (adhikṣepa-vacana), а не буквальное предсказание — регистр, которого подстрочник не передаёт и который не отмечен ни у Леонова/Костиной, ни в Phase-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "crosstext:5.62.32:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "netṛ", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.62.32", "work_label": "Rām", "verse_address": "Rām 5.61.18 (крит. изд.)", "parallel_sa_iast": "jāmbavān yatra netā syād aṅgadasya baleśvaraḥ |hanūmāṁścāpyadhiṣṭhātā na tasya gatir anyathā ||", "sundara_sa_iast": "jāmbavān yatra netā syād aṅgadaśca baleśvaraḥ |hanūmāṁścāpyadhiṣṭhātā na tasya gatir anyathā ||", "quality": "PARTLY", "source": "DCS parallel-search (PARTLY); Rām 5.61.18 (крит. изд.)", "edition_flag": "critical", "shloka_critical": "V.62.32", "verse_address_vulgate": ""}]}, {"verse_id": "5.62.33", "verse": "33", "sanskrit_iast": "vadhyā hy ete durātmāno nṛpājñāparipanthinaḥ । amarṣaprabhavo roṣaḥ saphalo no bhaviṣyati ॥33॥", "leonov_ru": "Заслуживают смерти эти злобные нарушители царской воли, Гнев наш, рожденный от возмущения, [тогда] принесет плод».", "commentary": {"siromani": "तदेव भङ्ग्यन्तरेणाह-- इष्टमिति । हि यतएतत् विनाशितं मधुवनं सुग्रीवस्य इष्टम् अतः इमान् वानरान् सुग्रीवो घातयिष्यति । अर्धचतुष्टयमेकान्वयि ।। 5.62.32,33 ।।\n\nवध्या इति । नृपाज्ञया परिपन्थिनः विरोधिनः एते वध्या अत एव मे रोषः सफलो भविष्यति", "bhusana": "वध्या ह्येते दुरात्मानो नृपाज्ञापरिभाविनः ।\n\nअमर्षप्रभवो रोषः सफलो नो भविष्यति\nवध्या ह्येत इति । अमर्षप्रभवः अक्षमाजन्यः । रोषस्य तज्जन्यत्वं च यो यस्मै न सहते तस्मै क्रुद्ध्यतीति प्रसिद्धम् ।। 5.62.35,36 ।।\n\nनिमेषान्तरमात्रेण स हि प्राप्तो वनालयः ।\n\nसहस्रांशुसुतो धीमान् सुग्रीवो यत्र वानरः\nनिमेषान्तरेति । निमेषान्तरमात्रेण निमेषावकाशमात्रेण । वनालयः वानरः"}, "has_tier1": true, "notes": [{"id": "tier1:5.62.33:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…Гнев, возмущеньем рожденный (amarṣaprabhavo roṣaḥ) - автор комментария “Широмани” полагает, что речь идет о гневе Дадхимукхи. Голдмены считают, что имеется в виду гнев Сугривы (см.: Goldman 1984: 283)."}]}, {"verse_id": "5.62.35", "verse": "35", "sanskrit_iast": "nimeṣāntaramātreṇa sa hi prāpto vanālayaḥ । sahasrāṃśusuto dhīmān sugrīvo yatra vānaraḥ ॥35॥", "leonov_ru": "В мгновение ока он, житель леса, достиг [Того места], где находился мудрый Сугрива, сын солнца с тысячами лучей (сын тысячелучного солнца).", "commentary": {"siromani": "निमेषेति । स दधिमुखः यत्र सुग्रीवः तत्र निमेषान्तरमात्रेण प्राप्तः"}, "has_tier1": false, "notes": [{"id": "lexical:5.62.35:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sahasrāṃśusuta", "note_ru": "Сахасрамшусута (sahasra-aṃśu-suta, m.) — «сын тысячелучного [солнца]» = Сугрива: sahasra «тысяча» + aṃśu «луч» (√aṃś-, «иметь часть, сиять»?) + suta «сын» (p.p.p. от √su-, «рожать»). MW: sahasrāṃśu 'the sun (having thousand rays)'. Сугрива — сын Сурьи, бога солнца. Эпитет «тысячелучное солнце» применён к Сурье (не к Сугриве): sahasrāṃśu-suta = «сын тысячелучного» = «сын Сурьи». В повествовательном контексте: Дадхимукха летит к Сугриве — и поэт обозначает его через солнечное происхождение, создавая иерархический контраст: обезьяна-виноград vs. сын Солнца.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:sahasrAMSu"}, {"id": "crosstext:5.62.35:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "nimeṣa-antara-mātra", "note_ru": "nimeṣāntaramātreṇa («в одно лишь мгновение ока») — мера мгновенной стремительности обезьян в саду мадхувана. Это устойчивая эпическая формула молниеносного действия, характерная для батальных сцен Махабхараты: «nimeṣāntaramātreṇa bhīṣmo 'nyat kārmukaṃ raṇe । samādāya … sajyaṃ cakre» (MBh IV.59.25) — «в одно лишь мгновение ока … Бхишма взял другой лук и натянул тетиву». Совпадение временно́й формулы показывает, что вальмикиевская гипербола скорости заимствует общеэпический штамп боевого темпа.", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.62.35", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Virāṭaparvan IV.59.25"}]}, {"verse_id": "5.62.38", "verse": 38, "sanskrit_iast": "", "leonov_ru": "", "commentary": {}, "has_tier1": true, "notes": [{"id": "tier1:5.62.38:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «ко лбуЛадони смиренно сложенныеПриложил» тяжеловато читается"}, {"id": "lexical:5.62.38:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "añjali", "note_ru": "Анджали (añjali, m.) — «почтительно сложенные ладони», от √añj- («мазать, украшать, придавать форму»): две ладони, сложенные вместе в форме чаши-лодочки. MW: añjali 'a mark of respect; the two hands joined'. Śirasi añjalim kṛtvā — «сложив ладони на голове» = наивысшая форма почтения (añjali поднят до уровня макушки, а не просто сложен перед грудью). Три уровня añjali в традиции: грудь (равные), голова (почтение к старшему), темя (почтение к богам/царю). Дадхимукха демонстрирует жест уровня «темя» — максимальная субмиссия перед Сугривой после своей неудачи.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:aYjali+dic_apte:aYjali", "collision_tier1": true}], "verse_not_segmented": true}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s62_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

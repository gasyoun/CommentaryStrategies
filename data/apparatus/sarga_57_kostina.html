нь-57", "notes": [{"id": "lexical:5.57.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tārādhipa", "note_ru": "Тарадхипа (tārā-dhipa, m.) — «владыка звёзд» = Луна: tārā «звезда» (от √tṝ-, «пересекать»; звёзды «пересекают» небо) + dhipa = adhipa «господин» (adhi+pa, «охраняющий»). MW: tārādhipa 'the moon (lord of the stars)'. В стихе Хануман летит «как будто выцарапывая (ullikhan) луну» — ollikhant как «скребущий по» небесному своду. Образ луны-«повелителя звёзд» контрастирует с Хануманом — «сыном ветра» (ветер гасит свет луны): космическая иерархия нарушена прыжком героя.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:tArADipa", "source_links": [{"label": "MW tArADipa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=tArADipa"}], "seq": 3}]}, {"verse_id": "5.57.7", "verse": "7", "sanskrit_iast": "pāṇḍurāruṇavarṇāni nīlamāñjiṣṭhakāni ca । haritāruṇavarṇāni mahābhrāṇi cakāśire ॥7॥", "leonov_ru": "Прекрасны были огромные облака, белого, розового, Темно-синего, красного, зеленого, пурпурного цветов.", "commentary": {"bhusana": "अथ तदेवोत्प्रेक्षया वर्णयति-- ग्रसमान इवेत्यादिना ।। 5.57.5,6 ।।\n\nपाण्डरारुणवर्णानि नीलमाञ्जिष्ठकानि च ।\n\nहरितारुणवर्णानि महाभ्राणि चकाशिरे"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "lexical:5.57.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "māñjiṣṭha", "note_ru": "Манджиштха (māñjiṣṭha, adj.) — «мареновый», от māñjiṣṭhā (Rubia cordifolia, красильное растение мареновое): цвет красновато-алый, насыщенно тёмно-красный. MW: māñjiṣṭha 'madder-coloured, of a bright red'. В описании облаков: pāṇḍurāruṇavarṇāni nīlamāñjiṣṭhakāni ca — «белёсо-розоватые... тёмно-синие и мареновые». Перечисление точных оттенков — редкий пример колористической точности в Рамаяне; māñjiṣṭha особенно значимо как «природный краситель» (māñjiṣṭhā применялась в индийском текстильном производстве): облака уподоблены крашеным тканям.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:mAYjizWa+dic_apte:mAYjizWa", "source_links": [{"label": "MW mAYjizWa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=mAYjizWa"}, {"label": "APTE mAYjizWa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=mAYjizWa"}], "seq": 4}, {"id": "phase2:5.57.7:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mahābhrāṇi cakāśire", "note_ru": "Бхушана поясняет, что разноцветность облаков вызвана не природой, а самим соприкосновением с Хануманом: облака сияют, «ибо он полон блеска» (tejasvī), как облака окрашиваются от близости солнца и луны — иначе описание туч оказалось бы неуместной вставкой.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "подстрочник читается как нейтральное описание природы; Бхушана даёт этому описанию причинное обоснование — свечение облаков как эффект собственного блеска Ханумана, устраняющее видимую случайность образа", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 5}]}, {"verse_id": "5.57.9", "verse": "9", "sanskrit_iast": "vividhābhraghanāpannagocaro dhavalāmbaraḥ । dṛśyādṛśyatanur vīras tathā candrāyate 'mbare ॥9॥", "leonov_ru": "Входя в разнообразные скопления облаков, одетый в белые облака, То видимый, то невидимый, отважный (Хануман) был подобен луне в небе.", "commentary": {"bhusana": "पाण्डरेति । व्यक्ताव्यक्तवाचित्वेन अरुणशब्दयोः कथंचिदपौनरुक्त्यमुन्नेयम् । यद्वा \"अरुणः कृष्णलोहितः\" इत्यमरशेषः । महाभ्राणि चकाशिरे, हनुमत्सम्पर्कादित्यर्थः । अन्यथा वाजपेयशरद्वर्णनवत् अभ्रवर्णनस्यासङ्गतत्वापातः । हनुमतस्तेजस्वीत्यनेन मेघानां नानावर्णत्वापत्तिः सूर्येन्दुसम्पर्कवत् ।। 5.57.7,8 ।।\n\nविविधाभ्रघनापन्नगोचरो धवलाम्बरः ।\n\nदृश्यादृश्यतनुर्वीरस्तदा चन्द्रायते ऽम्बरे\nविविधेष्वभ्रघनेषु मेघसङ्घातेषु । आपन्नगोचरः प्राप्तविषयः । लब्धमार्ग इति यावत् । धवलाम्बरः शुक्लवासाः । दृश्यादृश्यतनुः मेघान्तःप्रवेशनिष्क्रमणाभ्यामिति भावः । चन्द्रायते चन्द्र इवाचरति", "siromani": "तदेव भङ्ग्यन्तरेणाह विविधेति । विविधेषु अभ्रघनेषु निबिडाभ्रेषु आपन्नः प्राप्तः गोचरः मार्गो यस्य धवलमम्बरं यस्य स हनूमान् अम्बरे आकाशे चन्द्रायते"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "lexical:5.57.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dhavalāmbara", "note_ru": "Дхавалмбара (dhavala-ambara, adj.) — «одетый в белое/белое-небо»: dhavala «ярко-белый» (от √dhav-, «промывать добела»?) + ambara «небо; одежда» (am+√bṛ-, «окружать, покрывать»). MW: ambara 'sky, atmosphere; a garment'. Семантическое богатство ambara — «и небо, и одежда» — создаёт двойную метафору: Хануман «одет в белое небо» (т.е. летит в белом пространстве облаков) И «его одежда — небо» (образ богов). Дхавала — технический термин белизны, отличающей священный объект (белый слон, белый лотос).", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:Davala+dic_mw:ambara", "source_links": [{"label": "MW Davala", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=Davala"}, {"label": "MW ambara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ambara"}], "seq": 6}, {"id": "edition:5.57.9:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.57.9–10 (2 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.57.9–10", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.57.9", "iast": "vividhābhraghanāpannagocaro dhavalāmbaraḥ । dṛśyādṛśyatanur vīras tathā candrāyate 'mbare ॥9॥"}, {"verse_id": "5.57.10", "iast": "tārkṣyāyamāno gagane sa babhau vāyunandanaḥ । dārayan meghavṛndāni niṣpataṃś ca punaḥ punaḥ ॥10॥"}], "seq": 7}]}, {"verse_id": "5.57.10", "verse": "10", "sanskrit_iast": "tārkṣyāyamāno gagane sa babhau vāyunandanaḥ । dārayan meghavṛndāni niṣpataṃś ca punaḥ punaḥ ॥10॥", "leonov_ru": "Был подобен Таркшье (Гаруде) в небе тот сын ветра, Раздирая скопления облаков и выныривая [из них] снова и снова.", "commentary": {"bhusana": "तार्क्ष्यायमाणो गगने बभासे वायुनन्दनः ।\n\nदारयन् मेघवृन्दानि निष्पतंश्च पुनः पुनः", "siromani": "तार्क्ष्येति । मेघवृन्दानि पुनः पुनर्दारयन् निष्पतन् निर्गच्छन् अत एव तार्क्ष्यायमाणो वायुनन्दनः बभौ"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Таркшья", "kind": "note", "text": "нужен будет комм"}], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "термин", "accounted": "не учтено", "text": "Первое появление в кн. V; введено в Рамаяна I. 17. 21: Таркшьи (tārkṣya) — полубожественные существа, имеющие внешний вид лошадей или птиц. Упоминаются обычно вместе с гандхарвами, якшами и чаранами.", "incomplete": false}, {"author": "Claude.AI", "strength": "желательно", "kind": "термин", "accounted": "не учтено", "text": "Первое появление в кн. V; введено в :", "incomplete": true}], "seq": 8}, {"id": "lexical:5.57.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tārkṣya", "note_ru": "Таркшья (tārkṣya, m.) — эпитет Гаруды (и орлов вообще), от Tṛkṣi (мифический патриарх птиц) или Tārkṣya (риши РВ, ассоциируемый с конём-соколом): MW: tārkṣya 'a fabulous bird (perhaps a form of Garuḍa); a horse'. Примечательна амбивалентность: tārkṣya — и «птица Гаруда», и «конь» в ведийских текстах, что отражает исконную связь образов «быстрой птицы» и «скакуна». Сравнение Ханумана с tārkṣya — возведение его в ранг Гаруды, что является высшей возможной похвалой в рамках эпической иерархии существ.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:tArkzya", "source_links": [{"label": "MW tArkzya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=tArkzya"}], "collision_tier1": true, "seq": 9}]}, {"verse_id": "5.57.11", "verse": "11", "sanskrit_iast": "nadan nādena mahatā meghasvanamahāsvanaḥ । pravarān rākṣasān hatvā nāma viśrāvya cātmanaḥ ॥11॥", "leonov_ru": "Ревя громким ревом, подобным громкому грому. Убив лучших ракшасов и прославив свое имя,", "commentary": {"bhusana": "नदन्नादेन महता मेघस्वनमहास्वनः ।\n\nप्रवरान् राक्षसान् हत्वा नाम विश्राव्य चात्मनः", "siromani": "नदन्निति । मेघस्वनमहास्वनः हनूमान् राक्षसान् हत्वा आत्मनो नाम विश्राव्य प्रख्याय नगरीं लङ्कामाकुलां कृत्वा महता नादेन नदन् सन् मध्येन तदवच्छेदेन सागरमाजगाम । सार्धश्लोकद्वयमेकान्वयि ।। 5.57.11,12 ।।\n\nपर्वतेन्द्रमिति । सुनाभं पर्वतेन्द्रं समुपस्पृश्य ज्यामुक्तो नाराच इव अभ्युपागमत्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "crosstext:5.57.11:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "devī eva rakṣ bhartṛ tvad", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.57.11,12,14", "work_label": "Rām", "verse_address": "Rām 5.63.13,16 (крит. изд.)", "parallel_sa_iast": "tataḥ saṁbhāṣitā devī sarvam arthaṁ ca darśitā |rāmasugrīvasakhyaṁ ca śrutvā prītim upāgatā ||", "sundara_sa_iast": "tataḥ saṁbhāṣitā caiva sarvam arthaṁ ca darśitā |rāmasugrīvasakhyaṁ ca śrutvā prītim upāgatā ||", "quality": "PARTLY", "source": "DCS parallel-search (PARTLY); Rām 5.63.13,16 (крит. изд.)", "source_links": [], "edition_flag": "critical", "shloka_critical": "V.57.11,12,14", "verse_address_vulgate": "", "seq": 10}]}, {"verse_id": "5.57.12", "verse": "12", "sanskrit_iast": "ākulāṃ nagarīṃ krṭvā vyathayitvā ca rāvaṇam । ardayitvā mahāvīrān vaidehim abhivādya ca ॥12॥", "leonov_ru": "Взволновав город [Ланку] и досадив Раване, Истребив великих героев и почтительно поприветствовав Вайдехи,", "commentary": {"bhusana": "आकुलां नगरीं कृत्वा व्यथयित्वा च रावणम् ।\n\nअर्दयित्वा बलं घोरं वैदेहीमभिवाद्य च"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "edition:5.57.12:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.57.12 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.57.12", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.57.12", "iast": "ākulāṃ nagarīṃ krṭvā vyathayitvā ca rāvaṇam । ardayitvā mahāvīrān vaidehim abhivādya ca ॥12॥"}], "seq": 11}]}, {"verse_id": "5.57.13", "verse": "13", "sanskrit_iast": "ājagāma mahātejāḥ punar madhyena sāgaram । parvatendraṃ sunābhaṃ ca samupaspṛśya vīryavān ॥13॥", "leonov_ru": "Снова летел наделенный величием над серединой океана, Коснувшись владыку гор, имеющего прекрасную середину, отважный,", "commentary": {"bhusana": "आजगाम महातेजाः पुनर्मध्येन सागरम्\nपर्वतेन्द्रं सुनाभं च समुपस्पृश्य वीर्यवान् ।\n\nज्यामुक्त इव नाराचो महावेगो ऽभ्युपागतः\nसुनाभं मैनाकम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Коснувшись владыки гор / С золотою вершиной (parvatendraṃ sunābhaṃ ca samupaspṛśya) - Речь идет о горе Майнаке. Хануман касается ее в знак приязни, возникшей между ними после встречи, описанной в первой песни.", "service": [], "suggestions": [], "seq": 12}]}, {"verse_id": "5.57.14", "verse": "14", "sanskrit_iast": "jyāmukta iva nārāco mahāvego 'bhyupāgamat । sa kiṃ cid ārāt saṃprāptaḥ samālokya mahāgirim ॥14॥", "leonov_ru": "Стремительный, словно стрела, выпущенная из лука, приблизился. Подлетев немного ближе, оглядев великую гору", "commentary": {"bhusana": "किंचिदनुसंप्राप्तः मैनाकात्परं कंचित् प्रदेशं प्राप्तः ।। 5.57.15,16 ।।\n\nस तं देशमनुप्राप्तः सुहृद्दर्शनलालसः ।\n\nननाद हरिशाद्रूलो लाङ्गूलं चाप्यकम्पयत्\nलालसः साभिलाषः । तं देशं सुद्धदावाससमीपप्रदेशम्\nस किंचिदनुसंप्राप्तः समालोक्य महागिरिम् ।\n\nमहेन्द्रमेघसङ्काशं ननाद हरिपुङ्गवः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "lexical:5.57.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nārāca", "note_ru": "Нарача (nārāca, m.) — «железная стрела» (особый тип): nāra «человек/вода»? + āca «гнутый» (√añc-)? — этимология спорная; MW: nārāca 'an iron arrow'. Апте: nārāca «an iron arrow, esp. one entirely of iron (as opposed to one with a wooden shaft)». Хануман сравнивается с nārāca, пущенной с тетивы (jyāmukta iva nārāco mahāvego 'bhyupāgamat). Цельнометаллическая стрела (nārāca) в отличие от деревянной (śara) — тяжелее, летит прямее, наносит более глубокую рану. Образ подчёркивает не только скорость, но и неотвратимость Ханумана: он не отклонится.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:nArAca+dic_apte:nArAca", "source_links": [{"label": "MW nArAca", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=nArAca"}, {"label": "APTE nArAca", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=nArAca"}], "seq": 13}]}, {"verse_id": "5.57.15", "verse": "15", "sanskrit_iast": "mahendraṃ meghasaṃkāśaṃ nanāda sa mahākapiḥ । sa pūrayām āsa kapir diśo daśa samantataḥ ॥15॥", "leonov_ru": "Махендру, подобную облаку, заревела та великая обезьяна. Обезьяна наполнила все пространство в десяти направлениях,", "commentary": {"bhusana": "मारुतस्यात्मजः श्रीमान् कपिर्व्योमचरो महान् ।\n\nहनुमान् मेघजालानि विकर्षन्निव गच्छति\nस पूरयामास कपिर्दिशो दश समन्ततः ।\n\nनदन्नादेन महता मेघस्वनमहास्वनः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "15", "kind": "note", "text": "сверка"}], "suggestions": [], "seq": 14}, {"id": "edition:5.57.15:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.57.15 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.57.15", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.57.15", "iast": "mahendraṃ meghasaṃkāśaṃ nanāda sa mahākapiḥ । sa pūrayām āsa kapir diśo daśa samantataḥ ॥15॥"}], "collision_tier1": true, "seq": 15}]}, {"verse_id": "5.57.16", "verse": "16", "sanskrit_iast": "nadan nadeva mahatā meghasvanamahāsvanaḥ । sa taṃ deśam anuprāptaḥ suhṛddarśanalālasaḥ ॥16॥", "leonov_ru": "Ревя громким ревом, та, чей громкий голос был подобен раскату грома. Достигнув того места, желая увидеть друзей", "commentary": {"siromani": "स इति । स हनूमान् नदन् सन् दशदिशः पूरयमास\nस इति । सुहृदामङ्गदादीनां दर्शने लालसा यस्य सः तं सुहृत्समीपवर्तिनं देशमनुप्राप्तः स हनूमान् ननाद लाङ्गूलमकम्पयच्च"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "раскату грома.", "kind": "note", "text": "комм. о том, что грохочет в Индии"}], "suggestions": [], "seq": 16}]}, {"verse_id": "5.57.17", "verse": "17", "sanskrit_iast": "nanāda sumahānādaṃ lāṅgūlam cāpyakampayat । tasya nānadyamānasya suparṇacarite pathi ॥17॥", "leonov_ru": "Громко заревел [Хануман] и забил хвостом. Когда он громко заревел на дороге, по которой летает Супарна,", "commentary": {"tilaka": "लाङ्गूलं चाप्यकम्पयदिति स्वभावोक्तिः", "siromani": "तस्येति । सुपर्णाचरिते पथि नानद्यमानस्य तस्य हनूमतः आस्यघोषेण मुखनिर्गतशब्देन गगनं फलति भिद्यते इव", "bhusana": "तस्य नानद्यमानस्य सुपर्णचरिते पथि ।\n\nफलतीवास्य घोषेण गगनं सार्कमण्डलम्\nनानद्यमानस्य पुनः पुनर्भृशं नदत इत्यर्थः । फलतीव दलतीव"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "lexical:5.57.17:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "lāṅgūla", "note_ru": "Лангула (lāṅgūla, n.) — «хвост», этимология неясна (возможно из дравидийского или доиндоевропейского субстрата); MW: lāṅgūla 'a tail'. В стихе nanāda sumahānādaṃ lāṅgūlaṃ cāpyakampayat — «издал великий клич и потряс хвостом». Lāṅgūla вани у ванаров — не просто «хвост», но орган социальной и боевой коммуникации: в пятой книге описано, как Хануман использует хвост как оружие и инструмент демонстрации. В данном контексте потрясение lāṅgūla сразу после посадки — ритуал «приземления», сигнализирующий о возвращении.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:lANgUla", "source_links": [{"label": "MW lANgUla", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=lANgUla"}], "seq": 17}, {"id": "edition:5.57.17:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.57.17–20 (4 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.57.17–20", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.57.17", "iast": "nanāda sumahānādaṃ lāṅgūlam cāpyakampayat । tasya nānadyamānasya suparṇacarite pathi ॥17॥"}, {"verse_id": "5.57.18", "iast": "phalatīvāsya ghoṣeṇa gaganam sārkamaṇḍalam । ye tu tatrottare kūle samudrasya mahābalāḥ ॥18॥"}, {"verse_id": "5.57.19", "iast": "pūrvam samviṣṭhitāḥ śūrā vāyuputradidṛkṣavaḥ । mahato vāyununnasya toyadasyeva niḥsvanam । śuśruvus te tadā ghoṣamūruvegam hanūmataḥ ॥19॥"}, {"verse_id": "5.57.20", "iast": "te dīnamanasaḥ sarve śuśruvuḥ kānanaukasaḥ । vānarendrasya nirghoṣam parjanyaninadopamam ॥20॥"}], "seq": 18}]}, {"verse_id": "5.57.19", "verse": "19", "sanskrit_iast": "pūrvam samviṣṭhitāḥ śūrā vāyuputradidṛkṣavaḥ । mahato vāyununnasya toyadasyeva niḥsvanam । śuśruvus te tadā ghoṣamūruvegam hanūmataḥ ॥19॥", "leonov_ru": "Уже ожидавшие герои, желавшие увидеть сына ветра, Словно бы гром великой тучи, гонимой ветром Услышали они тогда шум, происходивший от стремительности бедер Ханумана.", "commentary": {"tilaka": "ये पूर्वसंविष्ठितास्ते तोयदनिःस्वनमिवोरुवेगं तज्जन्यं घोषं शुश्रुवुरित्यन्वयः", "bhusana": "महतो वायुनुन्नस्य तोयदस्येव गर्जितम् ।\n\nशुश्रुवुस्ते तदा घोषमूरुवेगं हनूमतः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "pūrvam", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 19}, {"id": "tier1:5.57.19:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "бедер", "kind": "note", "text": "Г-пр игнорирует бедра, переводит как посто \"рев\" и в этом, и в следующем стихе"}], "suggestions": [], "seq": 20}]}, {"verse_id": "5.57.22", "verse": "22", "sanskrit_iast": "jāmbavān sa hariśreṣṭhaḥ prītisaṃhṛṣṭamānasaḥ । upāmantrya harīn sarvān idaṃ vacanam abravīt ॥22॥", "leonov_ru": "Джамбаван, лучший из обезьян, чья душа была взволнована радостью, Обращаясь ко всем обезьянам, сказал такие слова:", "commentary": {"siromani": "जाम्बवानिति । हरीन् वानरान् उपामन्त्र्य संबोध्य इदमब्रवीत्", "bhusana": "जाम्बवान् स हरिश्रेष्ठः प्रीतिसंहृष्टमानसः ।\n\nउपामन्त्र्य हरीन् सर्वानिदं वचनमब्रवीत्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "lexical:5.57.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "jāmbavat", "note_ru": "Джамбаван (jāmbavat, m.) — «обладающий [чем-то связанным с] jamba/jambu»: jambu «розовое яблоко» (Eugenia jambolana) — священное дерево Джамбудвипы («острова розовых яблок» = Индия). MW: jāmbavat 'the bear-king Jāmbavant'. Джамбаван — царь медведей (ṛkṣa), один из старейших союзников Рамы; его имя связывает его с самой сердцевиной индийской географической мифологии (Jambūdvīpa). В данном стихе Джамбаван — инициатор ликования войска: его авторитет (возраст + священное имя) делает его признание Ханумана официальным.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:jAmbavat+dic_mw:jambu", "source_links": [{"label": "MW jAmbavat", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=jAmbavat"}, {"label": "MW jambu", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=jambu"}], "seq": 21}]}, {"verse_id": "5.57.24", "verse": "24", "sanskrit_iast": "tasyā bāhūruvegaṃ ca ninādaṃ ca mahātmanaḥ । niśamya harayo hṛṣṭāḥ samutpetur yatas tataḥ ॥24॥", "leonov_ru": "Шум, порожденный скоростью рук и бедер того великого духом, Услышав, обрадованные обезьяны запрыгали повсюду.", "commentary": {"tilaka": "बाहूरुवेगं तज्जन्यशब्दम् निनादं च कण्ठशब्दं च", "siromani": "तस्येति । तस्य हनूमतः बाहूरुवेगं निनादं च निशम्य श्रुत्वा हरयो यतस्ततः समुत्पेतुः", "bhusana": "तस्य बाहूरुवेगं च निनादं च महात्मनः ।\n\nनिशम्य हरयो हृष्टाः समुत्पेतुस्ततस्ततः\nतस्येति । निशम्य ज्ञात्वेत्यर्थः । यद्वा दृष्ट्वा चेत्यध्याहार्यम् । अन्यथा बाहूरुवेगं पदानन्वयात्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.24:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Шум, рожденный рукамиИ бедрами Ханумана,", "kind": "note", "text": "По Г-пр они услышали шум рук и бедер и рев (ninādaṃ)"}], "suggestions": [], "seq": 22}]}, {"verse_id": "5.57.26", "verse": "26", "sanskrit_iast": "te prītāḥ pādapāgreṣu gṛhya śākhām avasthitāḥ । vāsāṃsi ca prakāśāni samāvidhyanta vānarāḥ ॥26॥", "leonov_ru": "Те обезьяны, обрадованные, находясь на верхушках деревьев, взяв в ветки И яркие одежды, стали размахивать [ими].", "commentary": {"tilaka": "ते शाखां गृह्य गृहीत्वोर्ध्वदृशा हनूमन्निरीक्षणे पतनभिया शाखां गृहीत्वा धृत्वा पादपाग्रेषु तदग्रशाखासु स्थिताः । वासांसि समाविध्यन्त प्राकम्पयन्त । नृत्यान्तर इवेति भावः । प्रकाशानि निर्मलतया प्रकर्षेण शोभन्ते तादृशानि वासांसि ।। 5.57.26,27 ।।\n\nअभ्रं मेघस्तदुपरि यो मेघस्तत्सङ्काशम् अत्युन्नतमेघसमूहसदृशमित्यर्थमन्ये । स्वजीवनदातृत्वेन स्वपूज्यत्वात्प्राञ्जलयः स्थिताः", "siromani": "ते इति । शाखां गृह्य गृहीत्वा पादपाग्रेषु अवस्थिताः ते वानराः प्रकाशानि प्रकाशं प्राप्तानि वासांसि समाविद्यन्त प्राकम्पयन्त अतिहर्षहेतुकगात्रप्रकम्पनद्वारा वस्त्राण्यपि प्रकम्पितानि बभूवुरित्यर्थः", "bhusana": "ते प्रीताः पादपाग्रेषु गृह्य शाखाः सुविष्ठिताः ।\n\nवासांसीव प्रशाखाश्च समाविध्यन्त वानराः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Или одеждами яркими (vāsāṃsi ca prakāśāni) - автор комментария “Тилака” понимает слово prakāśāni как “сияющие великолепной белизной” и поясняет, что обезьяны размахивали ими “словно бы танцуя”. Автор комментария “Бхушана” дает несколько иной вариант строки c: vāsāṃsīva ca prakāśāni и поясняет, что обезьяны размахивали цветущими ветками, чтобы привлечь внимание друг друга, подобно тому, как люди в подобной ситуации размахивают одеждами.", "service": [], "suggestions": [], "seq": 23}]}, {"verse_id": "5.57.27", "verse": "27", "sanskrit_iast": "girigahvarasamlīno yathā garjati mārutaḥ । evam jagarja balavān hanūmān mārutātamajaḥ ॥27॥", "leonov_ru": "Как ревет ветер, вошедший в горную пещеру, Так заревел могучий Хануман, сын ветра.", "commentary": {"bhusana": "गिरिगह्वरसंलीनो यथा गर्जति मारुतः ।\n\nएवं जगर्ज बलवान् हनूमान् मारुतात्मजः", "siromani": "गिरीति । गिरिगह्वरसंलीनः मारुतो यथा गर्जति प्रभूतशब्दं करोति एवं मारुतात्मजो जगर्ज"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "lexical:5.57.27:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "gahvara", "note_ru": "Гахвара (gahvara, n.) — «глубокая пещера, ущелье», от √gah- («погружаться в глубину», Whitney #1068, класс I/X) + суфф. -vara. MW: gahvara 'impenetrable, deep; a thicket, cave'. Апте: gahvara «a deep hole or cavern; a forest». В сравнении: «как ветер гремит, укрытый в горной пещере (girigahvarasaṃlīno yathā garjati mārutaḥ) — так гремел Хануман». Gahvara несёт коннотацию замкнутого резонирующего пространства: звук, сжатый пещерой, усиливается. Геофизическая точность образа: пещеры-резонаторы действительно усиливают звук ветра.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:gahvara+dic_apte:gahvara", "source_links": [{"label": "MW gahvara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=gahvara"}, {"label": "APTE gahvara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=gahvara"}], "seq": 24}, {"id": "edition:5.57.27:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.57.27 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.57.27", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.57.27", "iast": "girigahvarasamlīno yathā garjati mārutaḥ । evam jagarja balavān hanūmān mārutātamajaḥ ॥27॥"}], "seq": 25}]}, {"verse_id": "5.57.29", "verse": "29", "sanskrit_iast": "tatas tu vegavān vīro girer girinibhaḥ kapiḥ । nipapāta gires tasya śikhare pādapākule ॥29॥", "leonov_ru": "Тогда же стремительный герой, обезьяна, подобная горе, с горы (Аришты) Слетела на вершину той горы (Махендры), поросшую деревьями.", "commentary": {"tilaka": "ततो गिरेररिष्टाख्याद्गिरेः प्लुतः कपिस्तस्य महेन्द्रस्य गिरेः शिखरे निपपात । अनेनाविश्रममागमनं ध्वनितम्", "siromani": "तत इति । ततः प्राञ्जलिसर्ववानरकर्मकदर्शनानन्तरं गिरिनिभो हनुमान् गिरेः अरिष्टाभिधपर्वतात् गिरेः तस्य महेन्द्रस्य शिखरे निपपात", "bhusana": "ततस्तु वेगवांस्तस्य गिरेर्गिरिनिभः कपिः ।\n\nनिपपात महेन्द्रस्य शिखरे पादपाकुले\nनिपपात निर्भरमाक्रान्तवान्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.29:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Летящий с горы Аришты, / Быстро спустился на гору... (girer girinibhaḥ kapiḥ nipapāta gires tasya śikhare) - букв. “С горы подобная горе обезьяна слетела на вершину той горы”. В комментарии “Тилака” поясняется, что в первом случае имеется в виду гора Аришта, во втором - гора Махендра.", "service": [], "suggestions": [], "seq": 26}]}, {"verse_id": "5.57.30", "verse": "30", "sanskrit_iast": "harṣeṇāpūryamāṇo 'asau ramye parvatanirjhare । cinnapakṣa ivākāśāt papāta dharaṇīdharaḥ ॥30॥", "leonov_ru": "Наполняемый радостью, у прекрасного горного водопада, Словно гора, у которой отрубили крылья, с неба спустился он (Хануман).", "commentary": {"siromani": "तदेव भङ्ग्यन्तरेणाह हर्षेणेति । हर्षेणापूर्यमाणो हनूमान् पर्वतनिर्झरे बहुनिर्झरवत्पर्वते पर्वतस्य निर्झरे वा आकाशात् छिन्नपक्षो धरणीधर इव पपात", "bhusana": "हर्षेणापूर्यमाणो ऽसौ रम्ये पर्वतनिर्झरे ।\n\nछिन्नपक्ष इवाकाशात् पपात धरणीधरः\nपपाततेति । अच्छिन्नपक्षस्य पातासम्भवाच्छिन्नपक्ष इत्युक्तम् ।। 5.57.31,32 ।।\n\nप्रहृष्टवदनाः सर्वे तमरोगमुपागतम् ।\n\nउपायनानि चादाय मूलानि च फलानि च ।\n\nप्रत्यर्चयन् हरिश्रेष्ठं हरयो मारुतात्मजम्\nप्रहृष्टवदनाः प्रसन्नमुखाः, आसन्निति शेषः । अरोगं कुशलिनमित्यर्थः । उपायनानि उपहारान्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Как гора с отсеченными крыльями (cinnapakṣa iva... dharaṇīdharaḥ) - отсылка к мифу о крылатых горах, который рассказывается в первой песни “Сундараканды”.Около водопада (parvatanirjhare) - в комментарии “Тилака” приводится возможная интерпретация “на горной вершине, где есть водопады”. Там же приводится трактовка, согласно которой Хануман упал непосредственно в воду, что должно показывать его усталость.", "service": [], "suggestions": [], "seq": 27}, {"id": "edition:5.57.30:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.57.30 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.57.30", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.57.30", "iast": "harṣeṇāpūryamāṇo 'asau ramye parvatanirjhare । cinnapakṣa ivākāśāt papāta dharaṇīdharaḥ ॥30॥"}], "collision_tier1": true, "seq": 28}]}, {"verse_id": "5.57.34", "verse": "34", "sanskrit_iast": "vinedur muditāḥ kecit kecit kilakilāṃ tathā । hṛṣṭāḥ pādapaśākhāś ca āninyur vānararṣabhāḥ ॥34॥", "leonov_ru": "Некоторые ревели, обрадованные, иные издавали крик [радости] «кила-кила», Обрадованные, принесли древесные ветки быки среди обезьян.", "commentary": {"siromani": "विनेदुरिति । केचिद्वानरर्षभाः किलकिलां स्वजातीयशब्दं विनेदुः चक्रुः, केचित्पादपशाखा आनिन्युः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.34:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "«Кила-кила» кричали другие (kecit kilakilāṃ tathā) - кила-кила - подражание радостному крику обезьян.Принесли древесные ветки (pādapaśākhāś ca āninyuḥ) - чтобы сделать сидение для Ханумана (по комментарию “Тилака”).", "service": [], "suggestions": [], "seq": 29}]}, {"verse_id": "5.57.35", "verse": "35", "sanskrit_iast": "hanūmāṃs tu gurūn vṛddhāñ jāmbavatpramukhāṃs tadā । kumāram angadaṃ caiva so 'vandata mahākapiḥ ॥35॥", "leonov_ru": "Хануман же почтенных старцев во главе с Джамбаваном И царевича Ангаду приветствовал, великая обезьяна.", "commentary": {"bhusana": "हनुमांस्तु गुरून् वृद्धान् जाम्बवत्प्रमुखांस्तदा ।\n\nकुमारमङ्गदं चैव सो ऽवन्दत महाकपिः", "siromani": "हनूमानिति । हनूमान् जाम्बवत्प्रमुखान् अवन्दत"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "lexical:5.57.35:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "guru", "note_ru": "Гуру (guru, adj./m.) — «тяжёлый, важный; духовный учитель», от √gṛ- / √guru- (и.-е. корень *gwer-, «тяжёлый»; ср. гр. βαρύς, лат. gravis). MW: guru 'heavy, weighty; a teacher, preceptor'. В стихе Хануман поклоняется «старцам и учителям» (gurūn vṛddhāṃś ca). Слово guru здесь означает «старший по возрасту и авторитету», не обязательно религиозный наставник. Этимологическая семантика «тяжести» = «весомости, значимости» — семантический сдвиг от физического к социальному весу, характерный для индоевропейских языков.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:guru+dic_apte:guru", "source_links": [{"label": "MW guru", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=guru"}, {"label": "APTE guru", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=guru"}], "seq": 30}]}, {"verse_id": "5.57.39", "verse": "39", "sanskrit_iast": "rakṣyamāṇā sughorābhī rākṣasībhir aninditā । ekaveṇīdharā bālā rāmadarśanalālasā ॥39॥", "leonov_ru": "Охраняемую ужасными ракшаси, безупречную, Носящую одну косу деву, желающую встречи с Рамой,", "commentary": {"bhusana": "एकवेणीधरा बाला रामदर्शनलालसा ।\n\nउपवासपरिश्रान्ता जटिला मलिना कृशा"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.39:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Разлученная с мужем (rāmadarśanalālasā) - букв. “страстно жажущая увидеть Раму”.", "service": [{"author": "Е. Костина", "lemma_iast": "одну косу", "kind": "note", "text": "комм или ссылка на комм ранее"}], "suggestions": [], "seq": 31}, {"id": "lexical:5.57.39:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ekkaveṇī", "note_ru": "Экавени (eka-veṇī, f.) — «одна коса, единственная коса», от eka «один» + veṇī «заплетённая коса» (√vī- / √van-, MW: veṇī 'a braid or plait of hair'). В традиции индийской женской обрядности замужняя женщина носит волосы заплетёнными в две косы или убранными в причёску; «одна коса» (ekaveṇī) — особый статус: это прическа вдовства или невыносимого горя, которую Драупади носила до отмщения за унижение (МБх). Сита в образе ekaveṇīdharā — маркер её «ритуального траура» по Раме, не вдовства в буквальном смысле.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:ekazeRi+dic_apte:ekazeRI", "source_links": [{"label": "MW ekazeRi", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ekazeRi"}, {"label": "APTE ekazeRI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=ekazeRI"}], "collision_tier1": true, "seq": 32}]}, {"verse_id": "5.57.40", "verse": "40", "sanskrit_iast": "upavāsapariśrāntā malinā jaṭilā kṛśā । tato dṛṣṭeti vacanaṃ mahārtham amṛtopamam ॥40॥", "leonov_ru": "Истомленную постом, грязную, с заплетенными (как у отшельницы) волосами, исхудавшую, Тогда видел [я]» - слова драгоценные, подобные амрите,", "commentary": {"bhusana": "ततो दृष्टेति वचनं महार्थममृतोपमम् ।\n\nनिशम्य मारुतेः सर्वे मुदिता वानरा भवन्\nभवन् अभवन् । अनित्यत्वादडभावः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.40:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Изнурена постом она, / Грязна и исхудала (upavāsapariśrāntā malinā jaṭilā kṛśā) - букв. “изнуренная постом, грязная, с заплетенными в косу волосами, исхудавшая”.", "service": [], "suggestions": [], "seq": 33}]}, {"verse_id": "5.57.41", "verse": "41", "sanskrit_iast": "niśamya māruteḥ sarve muditā vānarābhavan । kṣveḍanty anye nadanty anye garjanty anye mahābalāḥ ॥41॥", "leonov_ru": "Услышав сына ветра, все обезьяны были обрадованы, Бормотали одни, кричали другие, ревели третьи могучие,", "commentary": {"bhusana": "क्ष्वेलन्त्यन्ये नदन्त्यन्ये गर्जन्त्यन्ये महाबलाः ।\n\nचक्रुः किलिकिलामन्ये प्रतिगर्जन्ति चापरे\nक्ष्वेलन्ति सिंहनादं कुर्वन्ति । नदन्ति अव्यक्तशब्दं कुर्वन्ति । गर्जन्ति वृषभनादं कुर्वन्ति । किलिकिलां स्वजात्युचितकिलिकिलाशब्दम्", "siromani": "प्रमोदचिह्नान्याह क्ष्वेडन्तीति । क्ष्वेडनादीनि कुर्वन्ति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "phase2:5.57.41:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kṣveḍanty ... nadanty ... garjanty", "note_ru": "Бхушана различает четыре разных звука ликования обезьян, слитых в переводе в общий ряд «бормотали/кричали/ревели»: кшведана — львиный рык, надана — нечленораздельный клич, гарджана — бычий рёв, кила-кила — видоспецифический обезьяний крик.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "подстрочник передаёт четыре санскритских глагола общими русскими синонимами («бормотали», «кричали», «ревели»); Бхушана даёт для каждого отдельную звуковую референцию (львиный рык, бычий рёв и т.д.), утраченную при переводе", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 34}]}, {"verse_id": "5.57.43", "verse": "43", "sanskrit_iast": "āyatāñcitadīrghāṇi lāṅgūlāni pravivyadhuḥ । apare tu hanūmantaṃ śrīmantaṃ vānarottamam ॥43॥", "leonov_ru": "Толстые (широкие), изогнутые, длинные хвосты вздымали и опускали (били хвостами), Иные же, Ханумана мудрого, лучшего между обезьянами,", "commentary": {"tilaka": "आयताञ्चितदीर्घाणि । आयामो विस्तारः, स्थौल्यमित्यन्ये", "bhusana": "अपरे च हनूमन्तं वानरा वारणोपमम् ।\n\nआप्लुत्य गिरिशृङ्गेभ्यः संस्पृशन्ति स्म हर्षिताः\nअपरे चेति । संस्पृशन्ति आलिङ्गन्तीत्यर्थः ।। 5.57.43,44 ।।\n\nसत्त्वे वीर्ये न ते कश्चित् समो वानर विद्यते ।\n\nयदवप्लुत्य विस्तीर्णं सागरं पुनरागतः", "siromani": "अपरे इति । अपरे तु आप्लुत्य हनूमन्तं संस्पृशन्ति\nकेचिदिति । केचित् आयताञ्चितानि विस्तारं प्राप्तान्येव लाङ्गूलानि प्रविव्यधुः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.43:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "… хвостами, / Толстыми и изогнутыми (āyatāñcitadīrghāṇi lāṅgūlāni) - букв. “толстыми (или широкими), изогнутыми и длинными хвостами”.", "service": [], "suggestions": [], "seq": 35}, {"id": "edition:5.57.43:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.57.43 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.57.43", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.57.43", "iast": "āyatāñcitadīrghāṇi lāṅgūlāni pravivyadhuḥ । apare tu hanūmantaṃ śrīmantaṃ vānarottamam ॥43॥"}], "collision_tier1": true, "seq": 36}]}, {"verse_id": "5.57.44", "verse": "44", "sanskrit_iast": "āplutya giriśṛṅgeṣu saṃspṛśanti sma harṣitāḥ । uktavākyaṃ hanūmantam aṅgadas tu tadābravīt ॥44॥", "leonov_ru": "Спрыгнув с горных вершин, касались, обрадованные. На слова Ханумана так сказал Ангада,", "commentary": {"bhusana": "उक्तवाक्यं हनूमन्तमङ्गदस्तमथाब्रवीत् ।\n\nसर्वेषां हरिवीराणां मध्ये वचनमुत्तमम्", "siromani": "उक्तेति । हरिवीराणां मध्ये अङ्गदो हनूमन्तमब्रवीत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.44:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…обнимали (saṃspṛśanti sma) - букв. “прикасались”. Автор комментария “Бхушана” глоссирует āliṅganti (обнимали).", "service": [], "suggestions": [], "seq": 37}]}, {"verse_id": "5.57.46", "verse": "46", "sanskrit_iast": "yad avaplutya vistīrṇaṃ sāgaraṃ punar āgataḥ । jīvitasya pradātā nas tvam eko vānarottama ॥46॥", "leonov_ru": "Ведь ты, перелетев через бескрайний океан, снова вернулся. О лучший из обезьян, ты единственный даритель нам жизни (ты один даруешь нам жизнь).", "commentary": {"bhusana": "[जीवितस्य प्रदाता नस्त्वमेको वानरोत्तम ।\n\nत्वत्प्रसादात् समेष्यामः सिद्धार्था राघवेण ह ।।]\n\nअहो स्वामिनि ते भक्तिरहो वीर्यमहो धृतिः ।\n\nदिष्ट्या दृष्टा त्वया देवी रामपत्नी यशस्विनी", "siromani": "जीवितस्येति । नो जीवितस्य जीवनस्य प्रदाता एकस्त्वमेव अत एव त्वत्प्रसादात् सिद्धार्था वयं राघवेण सह समेष्यामः तिष्ठामः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "lexical:5.57.46:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "jīvita-pradātṛ", "note_ru": "Дживитапрадатри (jīvita-pradātṛ, m.) — «даритель жизни»: jīvita «жизнь» (p.p.p. от √jīv-, «жить») + pradātṛ «дающий» (pra+√dā-, «давать», агентивный суфф. -tṛ). MW: jīvita 'life; alive'. Ангада называет Ханумана «единственным дарителем нашей жизни (jīvitasya pradātā nas tvam eko vānarōttama)». В индийской дарственной терминологии pradātṛ — юридический / ритуальный «даритель», создающий обязательство gratitude (kṛtajña). Называя Ханумана jīvitapradātṛ, Ангада устанавливает долг, неоплатный по определению: жизнь — высший дар.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:jIvita+dic_mw:pradAtf", "source_links": [{"label": "MW jIvita", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=jIvita"}, {"label": "MW pradAtf", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=pradAtf"}], "seq": 38}]}, {"verse_id": "5.57.47", "verse": "47", "sanskrit_iast": "tvatprasādāt sameṣyāmaḥ siddhārthā raghaveṇa ha । aho svāmini te bhaktir aho vīryam aho dhṛtiḥ ॥47॥", "leonov_ru": "Благодаря тебе [мы], достигшие успеха, соединимся с Рагхавой. О, твоя преданность господину! О, твое мужество! О, твоя стойкость!", "commentary": {"siromani": "अहो इति । ते भक्त्यादिरहो आश्चर्यम् । दिष्ट्या भाग्योदयेन रामपत्नी त्वया दृष्टा"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "lexical:5.57.47:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dhṛti", "note_ru": "Дхрити (dhṛti, f.) — «стойкость, выдержка, решимость», от √dhṛ- («держать, сохранять», Whitney #612). MW: dhṛti 'holding, seizing; firmness, constancy, resolution'. Апте: dhṛti «steadiness of mind, fortitude, patience». В восклицании Ангады: aho svāmini te bhaktir aho vīryam aho dhṛtiḥ — «ах, твоя преданность господину! ах, твоя доблесть! ах, твоя стойкость!» — dhṛti занимает последнее, кульминационное место в триаде. √dhṛ- («держать») → dhṛti как «то, что держит тебя вместе в момент опасности» — внутренний стержень, отличающий героя от простого смельчака (vīra vs. dhṛtimān).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:Dfti+dic_apte:Dfti", "source_links": [{"label": "MW Dfti", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=Dfti"}, {"label": "APTE Dfti", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=Dfti"}], "seq": 39}, {"id": "edition:5.57.47:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.57.47 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.57.47", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.57.47", "iast": "tvatprasādāt sameṣyāmaḥ siddhārthā raghaveṇa ha । aho svāmini te bhaktir aho vīryam aho dhṛtiḥ ॥47॥"}], "seq": 40}, {"id": "crosstext:5.57.47:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "bhakti", "note_ru": "Обезьяны славят Ханумана троичной формулой: «aho … bhaktir aho vīryam aho dhṛtiḥ» — «о твоя преданность! о мужество! о стойкость!». Эта триада bhakti–vīrya–dhṛti поразительно близка гитическому синтезу трёх путей: Йамуначарья (ГАС 3) определяет bhakti-йогу как плод соединения джняны и кармы: «jñāna-karma-abhinirvartyo bhakti-yogaḥ prakīrtitaḥ» — «В средней [шатке] провозглашена бхакти-йога, явившаяся результатом джняны и кармы, направленная на постижение истинной природы и сущности Бога.». Хануман предстаёт носителем всех трёх достоинств сразу — деятельной доблести (vīrya/karma), стойкости (dhṛti) и преданности (bhakti). Параллель показывает, почему вайшнавская традиция сделала Ханумана образцовым bhakta. Свидетельство: уровень шлоки (мягкое).", "type": "А", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.57.47", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Gītārthasaṃgraha Yāmunācārya 3 (Семенцов / Ерман)", "source_links": [], "seq": 41}, {"id": "crosstext:5.57.47:1", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "dhṛti", "note_ru": "dhṛti (твёрдость, постоянство) в каноне добродетелей. Обезьяны славят Ханумана: «aho vīryam aho dhṛtiḥ» (V.57.47). dhṛti — устойчивый член эпических списков dharma-guṇa; ср. перечень десяти признаков дхармы в Шантипарве: «adrohaḥ satyavacanaṃ saṃvibhāgo dhṛtiḥ kṣamā । prajanaḥ sveṣu dāreṣu mārdavaṃ hrīr acāpalam» (MBh XII.21.11) — «Незлобивость, правдивость, разделение [с другими], твёрдость, терпение, [законное] продолжение рода, мягкость, стыдливость, неветреность». Параллель показывает, что хвала Хануману опирается на готовый добродетельный канон, а dhṛti здесь — не случайное слово, а имя признанной добродетели.", "type": "Б", "cluster": "mbh_gnomic", "cluster_label": "МБх дидактика (Шантипарва / Анушасанапарва)", "shloka_ref": "V.57.47", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Śāntiparvan (MBh XII) 12.21.11", "source_links": [], "seq": 42}]}, {"verse_id": "5.57.52", "verse": "52", "sanskrit_iast": "tasthau tatrāṅgadaḥ śrīmān vānarair bahubhir vṛtaḥ । upāsyamāno vibudhair divi devapatir yathā ॥52॥", "leonov_ru": "Встал тогда мудрый Ангада, окруженный многими обезьянами, Словно владыка богов на небе в окружении сидящих возле него божеств.", "commentary": {"tilaka": "विविधैर्देवैरुपास्यमान इत्यर्थः", "bhusana": "तस्थौ तत्राङ्गदः श्रीमान् वानरैर्बहुभिर्वृतः ।\n\nउपास्यमानो विबुधैर्दिवि देवपतिर्यथा"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.52:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Соратниками окруженный (vānarair bahubhir vṛtaḥ) - букв. “окруженный множеством обезьян”.", "service": [], "suggestions": [], "seq": 43}]}, {"verse_id": "5.57.53", "verse": "53", "sanskrit_iast": "hanūmatā kīrtimatā yaśasvinā । tathāṅgadenāṅgadabaddhabāhunā । mudā tadādhyāsitam unnataṃ mahan । mahīdharāgraṃ jvalitaṃ śriyābhavat ॥53॥", "leonov_ru": "C прославленным Хануманом и прославленным Ангадой, чьи руки были охвачены браслетами, Которые сидели на ней, обрадованные (с радостью), возвышенная великая Вершина горы озарилась величием.", "commentary": {"tilaka": "कीर्तिमता हनूमता यशस्विनाङ्गदेनेत्यर्थः । ज्वलितं युक्तम्", "siromani": "हनुमतेति । कीर्तिमता हनूमता यशस्विना अङ्गदनद्धबाहुना अङ्गदेन च अध्यासितम् अधिष्ठितमुन्नतं महीधराग्रं श्रिया शोभया ज्वलितं प्रकाशितमभवत्", "bhusana": "हनूमता कीर्तिमता यशस्विना तथा ऽङ्गदेनाङ्गदबद्धबाहुना ।\n\nमुदा तदाध्यासितमुन्नतं महन्महीधराग्रं ज्वलितं श्रिया ऽभवत्\nइति श्रीगोविन्दराजविरचिते श्रीरामायणभूषणे श्रृङ्गारतिलकाख्याने\n\nसुन्दरकाण्डव्याख्याने सप्तपञ्चाशः सर्गः ।। 5.57 ।।\n\nकीर्तिमतेति हनुमद्विशेषणम् । यशस्विनेत्यङ्गदविशेषणम् । भृत्यकीर्त्या स्वामिनः कीर्तिः । अन्यथा पौनरुक्त्यात् । यद्वा बुद्धिमत्त्वजन्या कीर्तिः । शौर्यजन्यं यशः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-57", "notes": [{"id": "tier1:5.57.53:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…прославленного Ханумана / И славного Ангады… (hanūmatā kīrtimatā yaśasvinā tathāṅgadena) - средневековые комментаторы отмечают, что первое прилагательное (kīrtimatā) относится к Хануману, второе (yaśasvinā) к Ангаде.", "service": [{"author": "Е. Костина", "lemma_iast": "браслетоносного", "kind": "note", "text": "Нужен будет комм"}], "suggestions": [], "seq": 44}, {"id": "phase2:5.57.53:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kīrtimatā ... yaśasvinā", "note_ru": "Бхушана объясняет, почему два эпитета славы не тавтологичны: либо это «слава господина через славу слуги» (Хануман прославляет Раму), либо kīrti — слава от учёности/мудрости, а yaśas — слава от воинской доблести, так что каждое слово закреплено за своим носителем по разным основаниям славы.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "собственное примечание Леонова/Костиной сообщает лишь распределение эпитетов между Хануманом и Ангадой; Бхушана добавляет содержательное основание этого распределения — два разных источника славы (мудрость/доблесть), не только адресацию", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 45}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"Костина",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

on_tier1": true}]}, {"verse_id": "5.55.6", "verse": "6", "sanskrit_iast": "yaḥ samutpatitaṃ krodhaṃ kṣamayaiva nirasyati । yathoragas tvacaṃ jīrṇāṃ sa vai puruṣa ucyate ॥6॥", "leonov_ru": "Кто возникший гнев терпением отбрасывает, Как змея [отбрасывает] старую кожу, тот воистину называется человеком.", "commentary": {"siromani": "य इति । उरगो जीर्णां त्वचमिव समुत्पतितं कोपं यो निरस्यति स एव पुरुष उच्यते", "bhusana": "यः समुत्पतितं क्रोधं क्षमयैव निरस्यति ।\n\nयथोरगस्त्वचं जीर्णां स वै पुरुष उच्यते"}, "has_tier1": false, "notes": [{"id": "lexical:5.55.6:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kṣamā", "note_ru": "Кшама (kṣamā, f.) — «терпение, снисхождение, самообладание», от √kṣam- (класс I, Whitney #620, «терпеть, сносить»). MW: kṣamā 'patience, forbearance, the earth'. Примечательна семантическая полисемия: kṣamā одновременно «терпение» и «земля» (земля, которая выносит всё). В стихе Ханман рассуждает: «тот, кто сдерживает поднявшийся гнев именно kṣamayā (инстр.) — как змея сбрасывает старую кожу — тот воистину называется человеком». Уподобление змее (yathorāgas tvacaṃ jīrṇāṃ) включает образ kṣamā как регулярного очищения/обновления, а не единичного акта.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:kzamA+dic_apte:kzamA"}, {"id": "crosstext:5.55.6:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "kṣamā", "note_ru": "kṣamā vs krodha (терпение против гнева) — гномический стих par excellence: «yaḥ samutpatitaṃ krodhaṃ kṣamayaiva nirasyati । yathoragas tvacaṃ jīrṇāṃ sa vai puruṣa ucyate» (Сундара V.55.6) — «Кто возникший гнев отбрасывает терпением, как змея — старую кожу, тот воистину зовётся мужем». Это типовая нити-сентенция, чьим прямым смысловым близнецом служит дидактика Шантипарвы: «krodhaṃ śamena jayati kāmaṃ saṅkalpavarjanāt । sattvasaṃsevanād dhīro nidrām ucchettum arhati» (MBh XII.232.5) — «Гнев [мудрый] побеждает спокойствием, желание — отказом от замысла; преданный саттве стойкий (dhīra) способен превозмочь и сон». Стих Хануманова посольства встроен в общеэпическую топику обуздания krodha; параллель показывает, что перед нами не частное наблюдение, а ходячая максима.", "type": "А", "cluster": "mbh_gnomic", "cluster_label": "МБх дидактика (Шантипарва / Анушасанапарва)", "shloka_ref": "V.55.6", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Śāntiparvan (MBh XII) 12.232.5"}, {"id": "crosstext:5.55.6:1", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "krodha", "note_ru": "krodha как порок власти. Продолжение того же стиха о «сбрасывании гнева» перекликается с царской этикой Шантипарвы, где невозмутимость — условие неуязвимости правителя: «ye krodhaṃ naiva kurvanti kruddhān saṃśamayanti ca । na ca kupyanti bhṛtyebhyo durgāṇy atitaranti te» (MBh XII.111.20) — «Кто [сам] не гневается и гневающихся усмиряет, кто не яростен к слугам, — те переправляются через [любые] теснины». Параллель помещает «змеиную» максиму Сундараканды в контекст danda-nīti: укрощение krodha есть не только аскеза, но и инструмент успеха.", "type": "А", "cluster": "mbh_gnomic", "cluster_label": "МБх дидактика (Шантипарва / Анушасанапарва)", "shloka_ref": "V.55.6", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Śāntiparvan (MBh XII) 12.111.20"}]}, {"verse_id": "5.55.7", "verse": "7", "sanskrit_iast": "dhig astu māṃ sudurbuddhiṃ nirlajjaṃ pāpakṛttamam । acintayitvā tāṃ sītām agnidaṃ svāmighātakam ॥7॥", "leonov_ru": "Позор мне, скудоумному, лишенному стыда, великому злодею, Который, не подумав о Сите, устроил пожар, губителю своего господина!", "commentary": {"tilaka": "धिगस्तु मामित्यनेनोक्तं स्वधिक्कारमाह-- यदीति । इयं लङ्कां सर्वापि वनं दग्धैव यदि जानक्यप्यत्रत्या दग्धा स्यात्तदा तेनाजानता मया भर्तुः कार्यं हतं भवेत्", "bhusana": "धिगस्तु मां सुदुर्बुद्धिं निर्लज्जं पापकृत्तमम् ।\n\nअचिन्तयित्वा तां सीतामग्निदं स्वामिघातकम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.55.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "svāmighātaka", "note_ru": "Свамигхатака (svāmi-ghātaka, adj.) — тат-пуруша: svāmin «господин, хозяин» (собств. «обладающий своим») + ghātaka «убивающий» (√han-, класс II, Whitney #636, «бить, убивать», с суфф. -aka). MW: ghātaka 'killing, a slayer'. Составное означает «убийца своего господина» — в данном контексте Хануман обвиняет себя в том, что сжигая Ланку, мог косвенно уничтожить Ситу, ради которой (svāmikarya) и был послан Рамой. Это делает его в его собственных глазах человеком, предавшим дело (svāmi = Рама как хозяин-господин), т.е. предателем dolce.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:svAmin+dic_mw:GAtaka"}]}, {"verse_id": "5.55.12", "verse": "12", "sanskrit_iast": "yadi tad vihataṃ kāryaṃ mayā prajñāviparyayāt । ihaiva prāṇasaṃnyāso mamāpi hy adya rocate ॥12॥", "leonov_ru": "Если погублено мной [все] дело из-за того, что покинула меня мудрость, Здесь и сейчас хочу я тоже расстаться с жизнью.", "commentary": {"bhusana": "यदीति । जानक्यपि यदि दग्धेत्यन्वयः ।। 5.55.9,10 ।।\n\nईषत्कार्यमिदं कार्यं कृतमासीन्न संशयः ।\n\nतस्य क्रोधाभिभूतेन मया मूलक्षयः कृतः\nईषत्कर्यमिति । इदं कार्यम् अन्वेषणपूर्वकरावणनिलयपरिज्ञानसीतादर्शनतन्निवेदनरूपं महत्कार्यम् ईषत्कार्यम् ईषदवशिष्टकार्यम् असमग्रप्रायमेव कृतमासीत् । रामनिवेदनमात्रावशेषं कृतमासीदित्यर्थः । किन्तु इदानीं क्रोधाभिभूतेन क्रोधान्धेन मया तस्य कार्यस्य मूलक्षयः कृतः न संशयः, विफलीकृतमित्यर्थः\nयदि तद्विहतं कार्यं मम प्रज्ञाविपर्ययात् ।\n\nइहैव प्राणसंन्यासो ममापि ह्यद्य रोचते", "siromani": "यदीति । प्रज्ञाविपर्ययात् बुद्धिवैपरीत्यात् तत् रामसंबन्धि कार्यं मया यदि विहितं तदा ममापि प्राणसंन्यासः प्राणत्यागः इहैव रोचते"}, "has_tier1": false, "notes": [{"id": "lexical:5.55.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "prāṇasaṃnyāsa", "note_ru": "Пранасамньяса (prāṇa-saṃnyāsa, m.) — тат-пуруша: prāṇa «жизнь, дыхание» (√an-, «дышать», с префиксом pra-) + saṃnyāsa «отложение, отречение, сложение» (sam+ni+√as-, «бросать вниз»). MW: saṃnyāsa 'laying down, abandonment; the last āśrama'. В ведантийской традиции saṃnyāsa — четвёртый ашрам, «сложение всего мирского», включая тело. Здесь Хануман буквально рассматривает prāṇasaṃnyāsa как «сложение жизни» — ритуализованное самоубийство через отречение от дыхания. Поразительно, что он применяет термин духовного освобождения к акту отчаяния — это тонкая ирония текста.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:prARa+dic_mw:saMnyAsa"}, {"id": "crosstext:5.55.12:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "saṃnyāsa", "note_ru": "Хануман, считая дело погубленным, помышляет о «отказе от жизненных дыханий» (prāṇasaṃnyāsa) — редкое для Сундараканды употребление корня saṃnyās-, в Гите технического (отрешение). Контраст поучителен: в Гите saṃnyāsa — освобождающее отрешение от плодов действия (БхГ 9.28: «saṃnyāsayogayuktātmā vimukto mām upaiṣyasi» — «Так разрушишь ты цепи кармы, плоды злых — добрых дел покинешь; отрешеньем и йогой обуздан, став свободным, ко Мне придешь ты.»), тогда как у Ханумана saṃnyāsa приложено к жизни в порыве отчаяния. Гитический фон делает заметным, что герой на миг готов перепутать самоустранение с долгом — прежде чем вернуться к действию. Свидетельство: уровень шлоки (мягкое).", "type": "В", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.55.12", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bhagavadgītā 9.28 (Семенцов)"}]}, {"verse_id": "5.55.13", "verse": "13", "sanskrit_iast": "kim agnau nipatāmy adya āhosvid vaḍavāmukhe । śarīram iha sattvānāṃ dadmi sāgaravāsinām ॥13॥", "leonov_ru": "В огонь ли брошусь сейчас или в пламя Вадавы, Или тело [свое] отдам существам, обитающим в море?", "commentary": {"siromani": "किमिति । अग्नौ आहोस्वित् वा वडवामुखे वाडवाग्नौ किं निपतामि आहो वा सागरवासिनां सत्त्वानां सत्त्वेभ्यः शरीरं शकलीकृतदेहं दद्मि ददामि वा", "bhusana": "किमग्नौ निपताम्यद्य अहोस्विद्वडवामुखे ।\n\nशरीरमाहो सत्त्वानां दद्मि सागरवासिनाम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.55.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Вадавы» нужен будет комм"}, {"id": "lexical:5.55.13:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vaḍavāmukha", "note_ru": "Вадавамукха (vaḍavā-mukha, n.) — «пасть кобылицы подводного огня»: vaḍavā «кобылица» (этим. неясная, возможно дравидийского происхождения; MW: vaḍavā 'a mare, the mouth of the submarine fire') + mukha «лицо, пасть, вход» (√muc-? или корень mu-). В мифологии vaḍavāgni («кобылий огонь») — подводное пламя, помещённое Брахмой в конце вселенной в виде кобылицы (vaḍavā) на дне океана; оно поглощает воды, не давая им переполниться. Хануман рассматривает самоутопление в этом огне как альтернативу самосожжению в agni: оба образа — вариации космического огня-разрушителя.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vaqavA+dic_mw:vaqavAmukha", "collision_tier1": true}]}, {"verse_id": "5.55.14", "verse": "14", "sanskrit_iast": "kathaṃ nu jīvatā śakyo mayā draṣṭuṃ harīśvaraḥ । tau vā puruṣaśārdūlau kāryasarvasvaghātinā ॥14॥", "leonov_ru": "Как я могу живым явиться на глаза владыке обезьян Или тем двух тиграм среди мужей, когда погублено мной все дело?", "commentary": {"tilaka": "ननु सीताविनाशनिश्चयस्ते कथं तत्राह-- विनष्टेति ।। 5.55.11,12 ।।\n\nवडवामुखे ऽग्नावित्यन्वयः । दद्मि ददामि ।। 5.55.13,14 ।।\n\nतदेवेदं कपित्वमनवस्थिमव्यवस्थितकार्यकारीति त्रिषु लोकेषु प्रसिद्धं दर्शितम् । रोषदोषादक्षोविषयक्रोधदोषात्", "bhusana": "कथं हि जीवता शक्यो मया द्रष्टुं हरीश्वरः ।\n\nतौ वा पुरुषशार्दूलौ कार्यसर्वस्वघातिना", "siromani": "कथमिति । कार्यसर्वस्वघातिना मया द्रष्टुं कथं शक्यः"}, "has_tier1": false, "notes": [{"id": "crosstext:5.55.14:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "puruṣa-śārdūla", "note_ru": "puruṣaśārdūlau («два тигра среди мужей») — Хануман о Раме и Лакшмане. Это пан-эпическая формула-эпитет, в Махабхарате прилагаемая к сопоставимым героям-парам. В той же Рамопакхьяне Хануман сражается с ракшасами как сын Ветра (MBh III.270.14), а формулу puruṣaśārdūla эпос закрепляет за Кришной и Пандавами: «evaṃ puruṣaśārdūlo mahābuddhir janārdanaḥ» (MBh II.22.51) — «Так тигр среди мужей, многомудрый Джанардана…». Тождество эпитета у Рамы/Лакшманы и у Кришны/Арджуны раскрывает единый формульный фонд героической характеристики, который подстрочник передаёт буквально, но без отсылки.", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.55.14", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Sabhāparvan II.22.51"}, {"id": "crosstext:5.55.14:1", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "puruṣaśārdūla", "note_ru": "Пуруша-шардула (puruṣaśārdūla) «тигр среди мужей» — эпическая формула, прилагаемая в кн. I к Рамe и Дашаратхе (Бала 1.11.12), в кн. II — к скорбящему герою, которого призывают крепиться (Ayodhyā 2.34.54). В Сундаре (V.55.14) Хануман зовёт так Раму и Лакшману. Устойчивый «героический» формуляр; первое вхождение в кн. V здесь, далее — без примечания.\n\nПараллель — Rām. Bāla 1.11.12:\n  «। sa tvaṃ puruṣaśārdūla tamānaya susatkṛtam । svayameva mahārāja gatvā sabalavāhanaḥ ॥12॥»\n  Так приведи же, тигр среди людей, С должным почетом Ришьяшрингу! Сам отправься за ним, государь, С колесницами и со всем войском!»", "type": "А", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.55.14", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.11.12 (Гринцер, пер. изд. I–III)"}]}, {"verse_id": "5.55.16", "verse": "16", "sanskrit_iast": "dhig astu rājasaṃ bhāvam anīśam anavasthitam । īśvareṇāpi yad rāgān mayā sītā na rakṣitā ॥16॥", "leonov_ru": "Позор [моей] страстной природе, никчемной (слабой, неуправляемой) и непостоянной, Раз мной, могущим [сделать это] из-за страсти Сита не была защищена.", "commentary": {"tilaka": "राजसं रजोगुणमूलम् भावं चेष्टाविशेषम् अनीशं कार्यासमर्थम् अत एवानवस्थितमव्यवस्थितफलजनकं धिक् । यद्यस्मादीश्वरेणापि समर्थेनापि मया रागाद्रजोगुणमूलक्रोधवशात्सीता न रक्षिता, अतो धिक्\nदृष्टार्थैर्दृष्टप्रत्ययैर्निमित्तैर्दक्षिणाक्षिस्पन्दनादिभिः कारणैः सीतारामप्रभावपातिव्रत्यादिरूपैर्ऋषिवाक्यैश्चारणवाक्यैः", "bhusana": "मया खलु तदेवेदं रोषदोषात् प्रदर्शितम् ।\n\nप्रथितं त्रिषु लोकेषु कपित्वमनवस्थितम्\nमयेति । कपित्वं कापेयम् । अनवस्थितं चापलात्मकमित्यर्थः\nधिगस्तु राजसं भावमनीशमनवस्थितम् ।\n\nईश्वरेणापि यद्रागान्मया सीता न रक्षिता", "siromani": "धिगति । यद्रागात् यद्वशात् मया सीता न रक्षिता तम् अनवस्थितमव्यवस्थितम् अत एव अनीशं कार्यजननासमर्थं राजसं रजोगुणसंबन्धिनं भावम् अनवधानतया स्थितिविशेषं धिगस्तु"}, "has_tier1": true, "notes": [{"id": "tier1:5.55.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…страстной природе (rājasaṃ bhāvam) - букв. “натуре, в основе которой лежит гуна раджас” (по комментарию “Тилака”)."}]}, {"verse_id": "5.55.21", "verse": "21", "sanskrit_iast": "iti cintayatas tasya nimittāny upapedire । pūram apy upalabdhāni sākṣāt punar acintayat ॥21॥", "leonov_ru": "Когда он так размышлял, появились [благие] знаки (приметы), Которые проявлялись (обретены были) еще прежде, и снова [Хануман] подумал:", "commentary": {"tilaka": "साक्षादुपलब्धान्यपरोक्षमनुभूतशुभफलान्युपपेदिरे । जातानि दृष्ट्वा पुनरचिन्तयदित्यर्थः", "siromani": "इतीति । इति चिन्तयतः तस्य हनूमतः पूर्वमप्युपलब्धानि अनुभूतानि निमित्तानि शुभसूचकदक्षिणनेत्रस्फुरणादीनि उपपेदिरे प्रापुः अतः पुनरचिन्तयत्\nपुनरिति । तत्र तस्मिन् समये विस्मितो हनूमान् जलमध्ये सागरान्तर्देशे हिरण्यनाभस्य गिरेः प्रदर्शनं पुनरचिन्तयत् । एतेन पर्वतादीनामपि सर्वेषां रामाज्ञावशवर्तित्वं सूचितं तेन सीतायाः नाग्नेर्भीतिरिति सूचितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.55.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Явились благие знаки, / Что прежде уже являлись (nimittāny upapedire pūram apy upalabdhāni) - согласно комментарию “Широмани”, речь идет о таких знаках, как дрожание правого глаза и т.п."}]}, {"verse_id": "5.55.22", "verse": "22", "sanskrit_iast": "atha vā cārusarvāṅgī rakṣitā svena tejasā । na naśiṣyati kalyāṇī nāgnir agnau pravartate ॥22॥", "leonov_ru": "«Или же прекрасная телом спасена благодаря своей духовной силе? Не погибнет прекрасная, [ибо] огонь не сжигает огонь.", "commentary": {"bhusana": "इति चिन्तयस्तस्य निमित्तान्युपपेदिरे ।\n\nपूर्वमप्युपलब्धानि साक्षात्पुनरचिन्तयत्\nइतीति । निमित्तान्युपपेदिरे शुभशंसिनिमित्तानि प्रादुर्बभूवुरित्यर्थः\nअथवा चारुसर्वाङ्गी रक्षिता स्वेन तेजसा ।\n\nन नशिष्यति कल्याणी नाग्निरग्नौ प्रवर्तते", "siromani": "चिन्ताकारमाह अथवेत्यादिभिः । स्वेन तेजसा तेजोरूपवह्निविशेषेण रक्षिता कल्याणी सीता न नशिष्यति नंक्ष्यति । तत्र हेतुः अग्नौ अग्निर्न प्रवर्तते"}, "has_tier1": false, "notes": [{"id": "lexical:5.55.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tejas", "note_ru": "Теджас (tejas, n.) — «острота, жар, огонь, сияние, духовная мощь», от √tij- (каузативная форма √taj-, «быть острым»). MW: tejas 'sharpness, fire, heat; vital power, energy, majesty'. Апте: tejas «the bright appearance of anything, lustre, light; courage, dignity». В стихе: «прекрасная Джанаки защищена своим собственным теджасом (svena tejasā)». Теджас здесь — нравственно-духовная «острота», защитное поле чистоты: как закалённый металл отражает удар, так безупречность (caritram) создаёт физическую неуязвимость. Связь tejas ↔ √tij- делает огонь неспособным сжечь «острейшее» — семантический каламбур поэта.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:tejas+dic_apte:tejas"}, {"id": "phase2:5.55.22:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "lokadṛṣṭyā … tattvadṛṣṭyā", "note_ru": "По Бхушане (текст смещён маркером к V.55.18), внутренний монолог Ханумана здесь меняет регистр: с точки зрения обыденного взгляда (loka-dṛṣṭi) он воображает беду, но с точки зрения истинного положения дел (tattva-dṛṣṭi) сам себя успокаивает — это осевой момент, где отчаяние (vv.2–20) сменяется рассудочной надеждой (начиная с этого стиха).", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "подстрочник передаёт смену настроения Ханумана как факт («или же…»), но не называет её структурным приёмом (мирской страх vs метафизическое рассуждение); привязка смещена маркером к V.55.18, но содержательно комментарий вводит именно поворот, начинающийся здесь.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.55.24", "verse": "24", "sanskrit_iast": "nūnaṃ rāmaprabhāvena vaidehyāḥ sukṛtena ca । yan māṃ dahanakarmāyaṃ nādahad dhavyavāhanaḥ ॥24॥", "leonov_ru": "Несомненно, благодаря могуществу Рамы и благочестию Вайдехи Огонь, суть которого сожжение, меня не сжег.", "commentary": {"tilaka": "चिन्तामेव दर्शयति-- अथवेति । नाग्निरग्नौ प्रवर्तते इति अग्निरग्निं न दहतीत्यर्थः ।। 5.55.22,23 ।।\n\nदहनकर्मा भस्मीकरणसहजस्वभावा यद्यतस्तत्प्रभावान्मां तत्सेवकं नादहत् तत एव तां स्प्रष्टुमपि नार्हतीत्यर्थः", "siromani": "नूनमिति । रामप्रभावेण अव्याहतप्रतापेन वैदेह्याः सुकृतेन च अयं हव्यवाहनो ऽग्निः यत् प्रयत्नवन्तं मां न अदहत् । यन्मामित्यत्र कर्मधारयः । यदिति सामान्ये नपुंसकं वा"}, "has_tier1": false, "notes": [{"id": "lexical:5.55.24:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "havyavāhana", "note_ru": "Хавьявахана (havya-vāhana, m.) — эпитет Агни: havya «приношение, жертвенная пища» (от √hu-, «возливать жертву») + vāhana «несущий, возница» (√vah-, «везти, нести», Whitney #761). MW: havyavāhana 'fire (as carrying the oblation)'. Огонь — «носитель жертвы» к богам: он несёт (vāhana) то, что должно быть возлитым (havya). Эпитет восходит к ведийской концепции Агни как посредника между миром людей и богов (ср. РВ I.1: agnir hotā). Упоминание здесь переосмысляет обычную роль Агни: тот, кто «несёт жертву» богам, не мог сжечь Ситу, ибо она сама — высшая ценность, не жертва.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:havyavAhana"}]}, {"verse_id": "5.55.25", "verse": "25", "sanskrit_iast": "trayāṇāṃ bharatādīnāṃ bhrātṝṇāṃ devatā ca yā । rāmasya ca manaḥkāntā sā kathaṃ vinaśiṣyati ॥25॥", "leonov_ru": "Та, которая является божеством для трех братьев, начиная с Бхараты, И возлюбленной Рамы, как она погибнет?", "commentary": {"tilaka": "त्रयाणां भरतलक्ष्मणशत्रुघ्नानां देवतात्वात्तस्यामग्र्यप्रवृत्ते रामभयाच्चेति भावः", "siromani": "त्रयाणामिति । या भरतादीनां देवता पूज्या रामस्य च मनःकान्ता अत्यन्तमीप्सिता सा कथं विनशिष्यति", "bhusana": "त्रयाणां भरतादीनां भार्तृ़णां देवता च या ।\n\nरामस्य च मनःकान्ता सा कथं विनशिष्यति"}, "has_tier1": true, "notes": [{"id": "tier1:5.55.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Она божество трех братьев - / Бхараты, Лакшманы и Шатругхны (trayāṇāṃ bharatādīnāṃ bhrātṝṇāṃ devatā) - в тексте букв. сказано “божество трех братьев - Бхараты и прочих”. Имена Лакшманы и Шатругхны добавлены в переводе по смыслу."}]}, {"verse_id": "5.55.27", "verse": "27", "sanskrit_iast": "punaś cācintayat tatra hanumān vismitas tadā । hiraṇyanābhasya girer jalamadhye pradarśanam ॥27॥", "leonov_ru": "Снова вспомнил там Хануман изумленный тогда О явлении среди вод горы с золотой серединой (Майнаки).", "commentary": {"bhusana": "पुनश्चाचिन्तयत्तत्र हनुमान् विस्मितस्तदा ।\n\nहिरण्यनाभस्य गिरेर्जलमध्ये प्रदर्शनम्"}, "has_tier1": false, "notes": [{"id": "edition:5.55.27:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.55.27 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.55.27", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.55.27", "iast": "punaś cācintayat tatra hanumān vismitas tadā । hiraṇyanābhasya girer jalamadhye pradarśanam ॥27॥"}]}]}, {"verse_id": "5.55.28", "verse": "28", "sanskrit_iast": "tapasā satyavākyena ananyatvāc ca bhartari । asau nirdahed agniṃ na tām agniḥ pradhakṣyati ॥28॥", "leonov_ru": "«Подвижничеством, правдоречивостью и верностью мужу Она может сжечь огонь, [но] огонь не сожжет ее».", "commentary": {"tilaka": "देवीप्रभावात्सिन्धौ मद्विश्रान्तिनिमित्तं गिरिदर्शनहेतुनातिप्रभाववतीं तां न दहतीत्याह पुनश्चेति", "siromani": "तपसेति । तपआदिना असौ सीता अग्निं विनिर्दहेत् अतः तां सीताम् अग्निर्न प्रधक्ष्यति", "bhusana": "तपसा सत्यवाक्येन अनन्यत्वाच्च भर्तरि ।\n\nअपि सा निर्दहेदग्निं न तामग्निः प्रधक्ष्यति"}, "has_tier1": false, "notes": [{"id": "lexical:5.55.28:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "satya-vākya", "note_ru": "Сатьявакья (satya-vākya, n.) — «речение истины, обет правдивости»: satya «истинное, настоящее» (p.p.p. от √as-, «быть», буквально «действительно существующее») + vākya «высказывание» const KEY = "sundara_apparatus_s55_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

ентариями.", "service": [], "suggestions": [], "seq": 4}]}, {"verse_id": "5.58.120131", "verse": "120131", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "पदातिबलसम्पन्नान् पदातिप्रभृतिसैन्यसंपन्नान्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.120131:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Могучего битволюбца (balinaṃ yuddhadurmadam) - букв. “могучего, одержимого битвами”.", "service": [], "suggestions": [], "anchor_verse_id": "5.58.128", "seq": 5}]}, {"verse_id": "5.58.13", "verse": "13", "sanskrit_iast": "putreti madhurāṃ vāṇīṃ manaḥ prahlādayann iva । pitṛvyaṃ cāpi māṃ viddhi sakhāyaṃ mātariśvanaḥ ॥13॥", "leonov_ru": "«Сын [мой]», - сладостной речью, словно освежающей душу, «Знай, что я брат твоего отца, друг (бога ветра) Матаришвана.", "commentary": {"bhusana": "पितृव्यं चापि मां विद्धि सखायं मातरिश्वनः ।\n\nमैनाकमिति विख्यातं निवसन्तं महोदधौ\nपितृव्यं चेति । पितृव्यत्वे हेतुमाह सखायमिति । पितृसखत्वात् पितृव्यत्वव्यपदेश इत्यर्थः", "siromani": "पितृव्यं चेति । पितृव्यत्वे हेतुमाह-- सखायमिति । पितृसखत्वात् पितृव्यत्वव्यपदेश इत्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Матаришвана", "kind": "note", "text": "Нужен будет комм"}], "suggestions": [], "seq": 6}, {"id": "phase2:5.58.13:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "pitṛvyaṃ ... mātariśvanaḥ", "note_ru": "Бхушана и Широмани поясняют одинаково: Майнака называет Ханумана «сыном» и себя «дядей по отцу» не по кровному родству, а по логике дружбы — «pitṛsakhatvāt pitṛvyatva-vyapadeśaḥ», «наименование дядей — из-за дружбы с отцом». Формула родства здесь риторическая, а не буквальная.", "type": "Б", "source_commentary": ["bhusana", "siromani"], "why_proposed": "подстрочник переводит pitṛvya буквально как «брат отца», не раскрывая, что оба комментатора сходятся на переносном, а не кровном обосновании этого обращения", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 7}]}, {"verse_id": "5.58.14", "verse": "14", "sanskrit_iast": "mainākam iti vikhyātaṃ nivasantaṃ mahodadhau । pakṣvavantaḥ purā putra babhūvuḥ parvatottamāḥ ॥14॥", "leonov_ru": "Зовут меня Майнака, живу я в океане. Прежде, о сын, лучшие из гор имели крылья.", "commentary": {"bhusana": "पक्षवन्तः पुरा पुत्र बभूवुः पर्वतोत्तमाः ।\n\nछन्दतः पृथिवीं चेरुर्बाधमानाः समन्ततः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "lexical:5.58.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pakṣavat-parvata", "note_ru": "Паршавант-парвата (pakṣavat-parvata, m.) — «горы с крыльями» (pakṣa «крыло» + суфф. -vat обладания + parvata «гора»). MW: pakṣa «крыло; сторона; партия». Мотив летающих гор — устойчивый эпический миф (ср. МБх V.9): горы случайно падали и давили скот; Индра отсёк им крылья ваджрой. Майнака — единственная уцелевшая гора; это исключение из правила создаёт прецедент особой связи горы с семьёй Ваю. В Рамаяне мотив функционирует как backstory Майнаки и косвенное обоснование доверия к нему.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:pakza+MBh.V.9", "source_links": [{"label": "MW pakza", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=pakza"}], "seq": 8}, {"id": "lexical:5.58.14:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "Maināka", "note_ru": "Майнака (Maināka, m.) — крылатая гора, укрывшаяся в океане по велению Маруты. MW: Maināka «сын Химавата и Мены, гора в океане». Этимология от имени матери Мены (menā) + суфф. -ka. Эпический мотив parvata-pakṣavat (V.58.14-16): горы летали, уничтожали посевы; Индра ваджрой срубил им крылья; Майнака уцелел, ибо Ваю (отец Ханумана) спрятал его в море. Нарративная функция: мотив благодарности (mārutena mokṣitas, V.58.16) наполняет пространство полёта союзниками — Майнака обязан Ваю, а значит — косвенно — и Хануману.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:mainAka", "source_links": [{"label": "MW mainAka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=mainAka"}], "seq": 9}]}, {"verse_id": "5.58.147150", "verse": "147150", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "वेदितव्यं वक्तव्यमित्यर्थः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "edition:5.58.147150:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.58.148 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.58.148", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.58.148", "iast": "naivaṃ rākṣasaśardūla tyajyatām eṣa niścayaḥ । rājaśāstravyapeto hi mārgaḥ saṃlakṣyate tvayā ॥148॥"}], "anchor_verse_id": "5.58.148", "seq": 10}]}, {"verse_id": "5.58.15", "verse": "15", "sanskrit_iast": "chandataḥ pṛthivīṃ cerur bādhamānāḥ samantataḥ । śrutvā nagānāṃ caritaṃ mahendraḥ pākaśāsanaḥ ॥15॥", "leonov_ru": "По собственной воле летали они над землей, создавая повсюду препятствия. Услышав о поведении гор, великий Индра, губитель Паки,", "commentary": {"tilaka": "छन्दतः स्वेच्छयेत्यर्थः । चरितं प्रजाबाधनरूपम् ।। 5.58.15,16 ।।\n\nमोचनप्रकारमाह-- मारुतेनेति । साह्ये साहाय्ये", "bhusana": "श्रुत्वा नगानां चरितं महेन्द्रः पाकशासनः ।\n\nचिच्छेद भगवान् पक्षान् वज्रेणैषां सहस्रशः\nछन्दतः यथेच्छम् ।। 5.58.14,15 ।।\n\nअहं तु मोक्षितस्तस्मात्तव पित्रा महात्मना ।\n\nमारुतेन तदा वत्स प्रक्षिप्तो ऽस्मि महार्णवे\nमोक्षणप्रकारमाह प्रक्षिप्तो ऽस्मि महार्णव इति", "siromani": "श्रुत्वेति । महेन्द्रो नगानां चरितं श्रुत्वा वज्रेण पक्षौ चिच्छेद"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "термин", "accounted": "не учтено", "text": "Первое появление в кн. V; введено в Рамаяна III. 19. 7: Губитель Паки (pāka-śāsana) — один из эпитетов Индры. Как поясняет Махешваратиртха, Пака — асура, брат Вритры.", "incomplete": false}], "seq": 11}]}, {"verse_id": "5.58.16", "verse": "16", "sanskrit_iast": "vajreṇa bhagavān pakṣau cicchedaiṣāṃ sahasraśaḥ । ahaṃ tu mokṣitas tasmāt tava pitrā mahātmanā ॥16॥", "leonov_ru": "Ваджрой владыка отрубил оба крыла у тысяч гор. Я же от этого был спасен твоим великим духом отцом.", "commentary": {"siromani": "अहमिति । तदा तस्मिन् समये तव पित्रा अहं वरुणालये प्रक्षिप्तः अत एव तस्मात्पक्षछेदात् मोचितः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Меня же от кары спас (ahaṃ tu mokṣitas tasmāt) - букв. “я же был спасен от этого”. Голдмены переводят “от этой судьбы” (from that fate) (см.: Goldman 1984: 266). В комментарии “Тилака” поясняется: “От отрубания крыльев” (pakṣachedāt).", "service": [], "suggestions": [], "seq": 12}]}, {"verse_id": "5.58.20", "verse": "20", "sanskrit_iast": "sa cāpyantarhitaḥ śailo mānuṣeṇa vapuṣmatā । śarīreṇa mahāśailaḥ śailena ca mahodadhau ॥20॥", "leonov_ru": "А гора с человеческим телом исчезла, С телом горы великая гора [скрылась] в океане.", "commentary": {"siromani": "स इति । वपुष्मता शोभनावयवविशिष्टेन शैलेन शिलामयेन मानुषेण मनुष्याकृतिना शरीरेणोपलक्षिताः महान्तः शैलाः गिरयो यस्य गिरीणां राजेत्यर्थः, शैलः स मैनाकः महोदधौ अन्तर्हितः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "edition:5.58.20:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.58.20 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.58.20", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.58.20", "iast": "sa cāpyantarhitaḥ śailo mānuṣeṇa vapuṣmatā । śarīreṇa mahāśailaḥ śailena ca mahodadhau ॥20॥"}], "seq": 13}]}, {"verse_id": "5.58.22", "verse": "22", "sanskrit_iast": "tataḥ paśyāmy ahaṃ devīṃ surasāṃ nāgamātaram । samudramadhye sā devī vacanaṃ cedam abravīt ॥22॥", "leonov_ru": "И вот вижу я богиню Сурасу, мать нагов. Посреди океана та богиня так [мне] сказала:", "commentary": {"bhusana": "ततः पश्याम्यहं देवीं सुरसां नागमातरम् ।\n\nसमुद्रमध्ये सा देवी वचनं मामभाषत", "siromani": "तत इति । ततो ऽनन्तरं नागमातरं सुरसां समुद्रमध्ये अहं पश्यामि अपश्यं सा सुरसा चेदमब्रवीत्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "lexical:5.58.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "Surasā", "note_ru": "Сураса (Surasā, f.) — мать нагов, инструмент испытания Ханумана в океане. MW: Surasā «имя матери нагов». Вероятная этимология: от sura «бог» → surā/surasā «[та, что от] богов». В эпизоде (V.58.22-34) Сураса не враг, а экзаменатор, назначенный богами (diṣṭo me suraiḥ, V.58.23): Хануман проходит испытание через wit — миниатюризацию до aṅguṣṭha-saṃmita — а не через силу. Структурный параллелизм: Сураса — Симхика — Ланка-деви образуют три ступени испытания морского пути, каждая с разным методом преодоления.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:surasA", "source_links": [{"label": "MW surasA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=surasA"}], "seq": 14}]}, {"verse_id": "5.58.23", "verse": "23", "sanskrit_iast": "mama bhakṣyaḥ pradiṣṭas tvam amārair harisattama । tatas tvāṃ bhakṣayiṣyāmi vihitas tvaṃ hi me suraiḥ ॥23॥", "leonov_ru": "«Ты – еда, обещанная мне бессмертными, о лучший из обезьян. Потому я тебя съем, ибо назначен ты мне богами».", "commentary": {"bhusana": "मम भक्षः प्रदिष्टस्त्वममरैर्हरिसत्तम ।\n\nअतस्त्वां भक्षयिष्यामि विहितस्त्वं चिरस्य मे", "siromani": "तद्वचनाकारमाह ममेति । अमरैः मम भक्ष्यः त्वं प्रदिष्टः ततः तस्माद्धेतोः त्वं सुरैर्विहितः प्रापितो ऽतस्त्वां भक्षयिष्यामि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.23:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "harisattama", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 15}]}, {"verse_id": "5.58.25", "verse": "25", "sanskrit_iast": "rāmo dāśarathiḥ śrīmān praviṣṭo daṇḍakāvanam । lakṣmaṇena saha bhrātrā sītayā ca paraṃtapaḥ ॥25॥", "leonov_ru": "«Рама, славный сын Дашаратхи, губитель недругов, ушел в лес Дандаку Вместе с братом Лакшманой и [женой] Ситой.", "commentary": {"bhusana": "कर्तुमर्हसि रामस्य साहाय्यं विषये सती ।\n\nअथवा मैथिलीं दृष्ट्वा रामं चाक्लिष्टकारिणम्\nरामो दाशरथिः श्रीमान् प्रविष्टो दण्डकावनम् ।\n\nलक्ष्मणेन सह भ्रात्रा सीतया च परन्तपः\nतस्य सीता हृता भार्या रावणेन दुरात्मना ।\n\nतस्याः सकाशं दूतो ऽहं गमिष्ये रामशासनात्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "śrīmān", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 16}, {"id": "tier1:5.58.25:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "paraṃtapaḥ", "kind": "omission", "text": "опущено"}, {"author": "Е. Костина", "lemma_iast": "bhāryā", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 17}]}, {"verse_id": "5.58.27", "verse": "27", "sanskrit_iast": "kartum arhasi rāmasya sāhayyaṃ viṣaye satī । atha vā maithilīṃ dṛṣṭvā rāmaṃ cākliṣṭakāriṇam ॥27॥", "leonov_ru": "Ты, пребывающая в [его] земле, должна помочь Раме. Или же, повидав [сначала] Майтхили и Раму, неутомимого в деяниях,", "commentary": {"tilaka": "विषये सति तदीयदेशे सति विद्यमाने । मैथिलीदर्शननिवेदनार्थं रामं च दृष्ट्वा ।। 5.58.27,28 ।।\n\nनातिवर्तेत नातिक्रमेत । मां प्राप्तः । मदाहारतां प्राप्तो न गच्छेदित्यर्थः", "siromani": "कर्तुमिति । विषये रामदेशे सति हे विद्यमाने साहाय्यं कर्तुमर्हसि । अर्धं पृथक् । ननु रामादहं न बिभेमीति त्वां भक्षयिष्याम्येवेत्यत आह अथवेति । प्रतिशृणोमि प्रतिज्ञां करोमि । अर्धद्वयमेकान्वयि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Живешь ты в его владениях (viṣaye sati) - в оригинале использован вокатив: “О пребывающая в стране [Рамы]. В комментарии “Широмани” слово viṣaye поясняется как “в стране Рамы” (rāmadeśe). В комментарии “Тилака” viṣaye объясняется как “в его стране” (tadīyadeśe). В критическом издании стоит вариант viṣayavasini «живущая в стране» (см.: Jhala 1966: 387). Автор комментария “Таттвадипика” приводит вариант с использованием номинатива: viṣaye satī (ты, пребывающая в стране, должна помочь...” Такой же вариант приводится и автором комментария “Бхушана”.", "service": [{"author": "Е. Костина", "lemma_iast": ".", "kind": "note", "text": "почему tadīya - \"твой\"?"}], "suggestions": [], "seq": 18}]}, {"verse_id": "5.58.29", "verse": "29", "sanskrit_iast": "abravīn nātivarteta kaś cid eṣa varo mama । evam uktaḥ surasayā daśayojanam āyataḥ ॥29॥", "leonov_ru": "Сказала: «Никто меня не избегнет, таков мой дар». Я, когда Сураса мне так сказала, был высотой в десять йоджан.", "commentary": {"bhusana": "एवमुक्तः सुरसया दशयोजनमायतः ।\n\nततो ऽर्धगुणविस्तारो बभूवाहं क्षणेन तु ।\n\nमत्प्रमाणानुरूपं च व्यादितं तु मुखं तया\nएवमुक्त इति । तत इति । अर्धगुणविस्तारः अत्रार्धशब्दः एकदेशवाची । किंचिदधिकविस्तारो ऽभवमित्यर्थः । एवमेवार्थः, प्रथमसर्गोक्तशतयोजनविस्तारस्तु विरुद्धः । तद्ग्रन्थः कल्पितश्चेत्युक्तम् । मत्प्रमाणेति । व्यादितं व्यात्तम्", "siromani": "एवमिति । दशयोजनमायतः स्वाभाविकदशयोजनविस्तृतो ऽहं यस्मिन् काले सुरसया एवमुक्तस्तस्मिन् काले अर्धगुणविस्तारः पञ्चयोजनविस्तृतो बभूव । तया सुरसया तु क्षणेनैव मत्प्रमाणाधिकं मत्प्रमाणादधिकं मुखं व्यादितं तदास्यं व्यादितं दृष्ट्वा अहं ह्रस्वं सूक्ष्मरूपमकरवम् ।। 5.58.29,30 ।।\n\nतस्मिन्निति । अङ्गुष्ठसंमितः यो ऽहं बभूव सः तद्वक्रमभिपत्य प्रविश्य क्षणान्निर्गतो ऽस्मि । अर्धद्वयमेकान्वयि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.29:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…в этом дар мой (eṣa varo mama) - автор комментария “Широмани” поясняет: “Это дар богов” (eṣa varo devānām).", "service": [], "suggestions": [], "seq": 19}, {"id": "phase2:5.58.29:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "ardhaguṇa-vistāraḥ", "note_ru": "Бхушана указывает на текстологическое противоречие: увеличение Ханумана здесь описано как «вдвое от десяти йоджан», тогда как в первой песни (сарге) названа цифра «сто йоджан» — и объявляет тот пассаж со ста йоджанами интерполяцией («tad granthaḥ kalpitaḥ» — «тот текст измышлен»).", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "подстрочник передаёт цифры без комментария; Бхушана вскрывает внутритекстовое несоответствие масштабов и прямо называет конкурирующий пассаж интерполяцией — редкий случай эксплицитной текстологической критики у комментатора", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 20}]}, {"verse_id": "5.58.30", "verse": "30", "sanskrit_iast": "tato 'rdhaguṇavistāro babhūvāhaṃ kṣaṇena tu । matpramāṇādhikaṃ caiva vyāditaṃ tu mukhaṃ tayā ॥30॥", "leonov_ru": "Затем в единый миг стал я в половину этого роста больше [15 йоджан]. Она же раскрыла пасть еще шире моего размера.", "commentary": {"bhusana": "तद्दृष्ट्वा व्यादितं चास्यं ह्रस्वं ह्यकरवं वपुः ।\n\nतस्मिन् मुहूर्ते च पुनर्बभूवाङ्गुष्ठमात्रकः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "В половину роста стал выше (tato 'rdhaguṇavistāro babhūvāham) - автор комментария “Бхушана” понимает композит ardhaguṇavistaraḥ как “чуть больше” (kiṃcidadhikavistaraḥ).", "service": [], "suggestions": [], "seq": 21}]}, {"verse_id": "5.58.31", "verse": "31", "sanskrit_iast": "tad dṛṣṭvā vyāditaṃ tv āsyaṃ hrasvaṃ hy akaravaṃ vapuḥ । tasmin muhūrte ca punar babhūvāṅguṣṭhasaṃmitaḥ ॥31॥", "leonov_ru": "Увидев ту распахнутую пасть, укоротил я [свое] тело, В то мгновение я снова стал размером с палец.", "commentary": {"tilaka": "ह्रस्वम् स्वशरीरमिति शेषः । तदेवाह-- अङ्गुष्ठसंमित इति । देह इति शेषः ।। 5.58.31,32 ।।\n\nसमानय मेलय", "bhusana": "अभिपत्याशु तद्वक्रं निर्गतो ऽहं ततः क्षणात् ।\n\nअब्रवीत् सुरसा देवी स्वेन रूपेण मां पुनः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "lexical:5.58.31:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "aṅguṣṭha-saṃmita", "note_ru": "Ангуштха-саммита (aṅguṣṭha-saṃmita, adj.) — «равный [размеру] большого пальца» (aṅguṣṭha «большой палец» + saṃmita, p.p.p. от sam-√mā-). MW: aṅguṣṭha «большой палец руки или ноги». Способность к миниатюризации — одна из восьми «великих сиддхи» йоги: aṇimā «уменьшение до атома» (< aṇu «мельчайший»; YogaS.III.45). Хануман демонстрирует aṇimā, не называя термина — имплицитный йогический код эпоса. Контрастная пара aṅguṣṭha-saṃmita / daśa-yojana (V.58.29) — гипербола в обоих направлениях — типичный эпический стиль описания чудесных возможностей.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:aNguzWa+YogaS.III.45", "source_links": [{"label": "MW aNguzWa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=aNguzWa"}], "seq": 22}]}, {"verse_id": "5.58.33", "verse": "33", "sanskrit_iast": "arthasiddhyai hariśreṣṭha gaccha saumya yathāsukham । samānaya ca vaidehīṃ rāghaveṇa mahātmanā ॥33॥", "leonov_ru": "«О лучший из обезьян, лети к исполнению своего дела как пожелаешь. И соедини Вайдехи с великим духом Рагхавой.", "commentary": {"siromani": "तद्वचनाकारमाह अर्थेति । हे हरिश्रेष्ठ त्वं गच्छ वैदेहीं समानय संयोजय । सार्धश्लोक एकान्वयी"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.33:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "hariśreṣṭha", "kind": "omission", "text": "опущено"}, {"author": "Е. Костина", "lemma_iast": "saumya", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 23}]}, {"verse_id": "5.58.34", "verse": "34", "sanskrit_iast": "sukhī bhava mahābāho prītāsmi tava vānara । tato 'haṃ sādhu sādhvīti sarvabhūtaiḥ praśaṃsitaḥ ॥34॥", "leonov_ru": "Будь счастлив, могучерукий, довольна я тобой, обезьяна». Тогда я, восхваляемый всеми живыми существами (небожителями), [кричавшими]: «Прекрасно! Прекрасно!»", "commentary": {"bhusana": "ततो ऽन्तरिक्षं विपुलं प्लुतो ऽहं गरुडो यथा ।\n\nछाया मे निगृहीता च न च पश्यामि किंचन"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.34:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "vānara", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 24}]}, {"verse_id": "5.58.36", "verse": "36", "sanskrit_iast": "so 'haṃ vigatavegas tu diśo daśa vilokayan । na kiṃ cit tatra paśyāmi yena me vihatā gatiḥ ॥36॥", "leonov_ru": "Утратив скорость, я оглядел десять сторон света, Но не увидел ничего, что бы преградило мой путь.", "commentary": {"tilaka": "अर्धगुणविस्तारो ऽर्धस्य दशयोजनार्धस्य पञ्चयोजनस्य गुण आवृत्तिस्तद्विस्तारः । दशयोजनविस्तार इति यावत् । पूर्वं दशयोजनविस्तारोक्त्या ऽ ऽनुगुण्येनैवं व्याख्यातम्", "bhusana": "ततो मे बुद्धिरुत्पन्ना किं नाम गगने मम ।\n\nईदृशो विघ्न उत्पन्नो रूपं यत्र न दृश्यते", "siromani": "स इति । येन मे गतिर्विहता तत् किंचिन्न पश्यामि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.36:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "все", "kind": "note", "text": "комм про 10 сторон?"}], "suggestions": [], "seq": 25}]}, {"verse_id": "5.58.37", "verse": "37", "sanskrit_iast": "atha me buddhir utpannā kiṃ nāma gamane mama । īdṛśo vighna utpanno rūpam atra na dṛśyate ॥37॥", "leonov_ru": "Тогда подумал я: «Что это на моем пути, Подобное препятствию, но облик которого не виден?»", "commentary": {"siromani": "अथेति । अथानन्तरं मे बुद्धिः चिन्तोत्पन्ना तदाकारमाह अत्र यस्य रूपं न दृश्यते ईदृशः उत्पन्नः गमने विघ्नः किं नाम किंनामा"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.37:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "Которого", "kind": "note", "text": "комм про rūpam"}], "suggestions": [], "seq": 26}]}, {"verse_id": "5.58.39", "verse": "39", "sanskrit_iast": "prahasya ca mahānādam ukto 'haṃ bhīmayā tayā । avasthitam asaṃbhrāntam idaṃ vākyam aśobhanam ॥39॥", "leonov_ru": "Громко засмеявшись (с оглушительным смехом) сказала та ужасная мне, Оставшемуся невозмутимым эти слова зловещие:", "commentary": {"tilaka": "अवस्थितं निश्चेष्टम् । तथाप्यसंभ्रान्तं भयहीनं मां लक्षीकृत्येदं वाक्यमहमुक्तः इत्यन्वयः", "siromani": "प्रहस्येति । अवस्थितं निश्चेष्टतया विद्यमानमप्यसंभ्रान्तं मामालक्ष्येति शेषः, महानादं यथा भवति तथा प्रहस्य इदं तया ऽहमुक्तः", "bhusana": "अवस्थितं दृढभूतम् । असम्भ्रान्तम् अव्यग्रम् ।। 5.58.38,39 ।।\n\nबाढमित्येव तां वाणीं प्रत्यगृह्णामहं ततः ।\n\nआस्य प्रमाणादधिकं तस्याः कायमपूरयम् ।\n\nतस्याश्चास्यं महद्भीमं वर्धते मम भक्षणे\nतस्याः आस्यप्रमाणादधिकं यथा तथा कायम् आत्मदेहम् अपूरयम् अवर्धयम् । मयि वृद्धे साप्यवर्धिष्टेत्यर्थः\nप्रहस्य च महानादमुक्तो ऽहं भीमया तया ।\n\nअवस्थितमसम्भ्रान्तमिदं वाक्यमशोभनम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.39:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Недвижному, невозмутимому (avasthitam asaṃbhrāntam) - автор комментария “Тилака” поясняет второе слово как “лишенному страха” (bhayahīnam).", "service": [{"author": "Е. Костина", "lemma_iast": "Недвижному, но невозмутимому", "kind": "note", "text": "По Голдмэнам идет противопоставление: immobilized but unafraid"}, {"author": "Е. Костина", "lemma_iast": ",", "kind": "omission", "text": "нужен комм по синтаксису (опущено mām)"}], "suggestions": [], "seq": 27}]}, {"verse_id": "5.58.40", "verse": "40", "sanskrit_iast": "kvāsi gantā mahākāya kṣudhitāyā mamepsitaḥ । bhakṣaḥ prīṇaya me dehaṃ ciram āhāravarjitam ॥40॥", "leonov_ru": "«О великий телом, куда ты направляешься? Для меня, голодной, [ты] желанная Пища. Порадуй мое тело, долго лишенное еды».", "commentary": {"bhusana": "क्वासि यन्ता महाकाय क्षुधिताया ममेप्सितः ।\n\nभक्षः प्रीणय मे देहं चिरमाहारवर्जितम्\nन च मां साधु बुबुधे मम वा निकृतं कृतम्\nअयं कामरूपीति माम्, साधु सम्यक्, न बुबुधे न ज्ञातवती । मम कृतं निकृतं मया कृतां निकृतिं वा न बुबुधे"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.40:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…великан… (mahākāya) - букв. “огромнотелый”.", "service": [], "suggestions": [], "seq": 28}]}, {"verse_id": "5.58.42", "verse": "42", "sanskrit_iast": "tasyāś cāsyaṃ mahad bhīmaṃ vardhate mama bhakṣaṇe । na ca māṃ sā tu bubudhe mama vā vikṛtaṃ kṛtam ॥42॥", "leonov_ru": "А ее огромная ужасная пасть выросла, чтобы сожрать меня. Но она не знала меня (не знала, кто я) или изменений, совершенных [мной] (то есть «и как я способен изменяться»).", "commentary": {"tilaka": "ममेप्सितो भक्षस्त्वम्, अतो मे देहं प्रीणयेत्यन्वयः\nमां सा न बुबुधे अयं कामरूपी सर्वविघ्ननिर्दलन इति मां न ज्ञातवतीत्यर्थः । मम कृतं विकृतं मया कृतं विकृतं विकारस्वरूपं वक्ष्यमाणसूक्ष्मरूपत्वं च न बुबुधे\nमां जिघासन्तीम् । ज्वलदग्नितुल्यकेशपाशाम्", "siromani": "तस्या इति । तस्याः आस्यं मुखं मम भक्षणे वर्धते सा तु मां मत्सामर्थ्यमित्यर्थः, न बुबुधे आविष्कृतं प्रकटितं मम कृतं रूपं च न बुबुधे\nयन्न बुबुधे तद्रूपमाह तत इति । ततो ऽनन्तरं विपुलं बृहद्रूपं स्वशरीरं संक्षिप्य सूक्ष्मीकृत्य तस्याः हृदयमादाय संशोध्य ताडनेन हिंसाया अयोग्यं कृत्वेर्थः नभस्तलं प्रपतामि प्रापतम्", "bhusana": "सा विसृष्टभुजा भीमा पपात लवणाम्भसि ।\n\nमया पर्वतसङ्काशा निकृत्तहृदया सती\nविसृष्टभुजा विसृष्टसन्धिकभुजा"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.42:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "mama bhakṣaṇe", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 29}]}, {"verse_id": "5.58.44", "verse": "44", "sanskrit_iast": "sā visṛṣṭabhujā bhīmā papāta lavaṇāmbhasi । mayā parvatasaṃkāśā nikṛttahṛdayā satī ॥44॥", "leonov_ru": "Она, раскинув руки, ужасная, упала в соленые воды, Подобная горе, будучи лишена мной сердца.", "commentary": {"tilaka": "विसुष्टभुजा विप्रकीर्णभुजा", "siromani": "सेति । मया ऽतिकृत्तहृदया ताडितान्तरा अत एव विमृष्टौ विकीर्णौ भुजौ यस्याः सा असती लवणाम्भसि निपपात"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "lexical:5.58.44:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "Siṃhikā", "note_ru": "Симхика (Siṃhikā, f.) — ракшаси, захватывающая тень летящего. MW: Siṃhikā «имя ракшаси». Этимология: siṃha «лев» + -ikā (суфф. ж.р.) — «подобная львице». Мотив chāyā-grahaṇa (V.58.35: chāyā me nigṛhītā) — специфически индийский нарративный приём: тень воспринимается как часть тела, захватив которую можно обездвижить летящего. Хануман убивает Симхику через разрыв сердца (hṛdayam ādāya, V.58.43) — мотив, характерный для водяных / хтонических демонов эпоса. В пересказе гл. 58 момент утраты скорости (vigatavegas, V.58.36) точно воспроизводит причинно-следственную цепочку оригинала.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:siMhikA", "source_links": [{"label": "MW siMhikA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=siMhikA"}], "seq": 30}]}, {"verse_id": "5.58.46", "verse": "46", "sanskrit_iast": "tāṃ hatvā punar evāhaṃ kṛtyam ātyayikaṃ smaran । gatvā ca mahad adhvānaṃ paśyāmi nagamaṇḍitam ॥46॥", "leonov_ru": "Убив ее, я снова подумал (вспомнил) о [своем] неотложном деле. И, пролетев большое расстояние (великий путь), увидел я украшенный горами,", "commentary": {"bhusana": "तां हत्वा पुनरेवाहं कृत्यमात्ययिकं स्मरन् ।\n\nगत्वा चाहं महाध्वानं पश्यामि नगमण्डितम्", "siromani": "तामिति । तां हत्वा आत्ययिकं प्राप्तविलम्बमित्यर्थः, कृत्यं कार्यं स्मरन् सन् महदध्वानं गत्वा नगैः पर्वतैः मण्डितं यत्र लङ्कापुरी तत् उदधेर्दक्षिणं तीरं पश्यामि । सार्धश्लोक एकान्वयी"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.46:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "punar ev", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 31}]}, {"verse_id": "5.58.47", "verse": "47", "sanskrit_iast": "dakṣiṇaṃ tīram udadher laṅkā yatra ca sā purī । astaṃ dinakare yāte rakṣasāṃ nilayaṃ purīm ॥47॥", "leonov_ru": "Южный берег океана, где находился город Ланка. Когда солнце зашло, в город – жилище ракшасов –", "commentary": {"bhusana": "दक्षिणं तीरमुदधेर्लङ्का यत्र च सा पुरी ।\n\nअस्तं दिनकरे याते रक्षसां निलयं पुरम् ।\n\nप्रविष्टो ऽहमविज्ञातो रक्षोभि र्भीमविक्रमैः", "siromani": "अस्तमिति । रक्षोभिः अविज्ञातो ऽहं पुरीं लङ्कां प्रविष्टः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.47:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "purī", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 32}]}, {"verse_id": "5.58.48", "verse": "48", "sanskrit_iast": "praviṣṭo 'ham avijñāto rakṣobhir bhīmavikramaiḥ । tatrāhaṃ praviśataś cāpi kalpāntaghanasaprabhā ॥48॥", "leonov_ru": "Вошел я, не замеченный стражами, наделенными грозной мощью. Когда я вошел туда, подобная туче конца времен,", "commentary": {"bhusana": "प्रदोषकाले प्रविशं भीतया ऽहं तयोदितः ।\n\nअहं लङ्कापुरी वीर निर्जिता विक्रमेण ते\nतत्र प्रविशतश्चापि कल्पान्तघनसन्निभा ।\n\nअट्टहासं विमुञ्चन्ती नारी काप्युत्थिता पुरः", "siromani": "तत्रेति । तत्र लङ्कायां प्रविशतो मम पुरः अग्रे कल्पान्तघनसंनिभा एका नारी उत्थिता"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.48:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "", "kind": "note", "text": "по переводу неясно, к кому относится сравнение (Х. или женщина)"}], "suggestions": [], "seq": 33}, {"id": "lexical:5.58.48:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kalpānta-ghana", "note_ru": "Кальпантагхана (kalpānta-ghana, adj.) — «тёмная как туча конца кальпы». Kalpānta = kalpa «мировой эон» (< √kḷp- «быть упорядоченным, подходящим») + anta «конец»; ghana «плотный, тёмный; туча». MW: kalpa «день Брахмы = 4 320 000 000 лет»; ghana «плотный; облако». Ланка-деви описывается этим compound (V.58.48), переводя образ хранительницы города в регистр космической угрозы. Формула kalpānta-ghana / yugānta-megha устойчива в эпических описаниях апокалиптической мощи; её применение к Ланка-деви структурно предваряет сожжение Ланки (V.58.158: yugānta-agni).", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:kalpa+dic_mw:Ghana", "source_links": [{"label": "MW kalpa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=kalpa"}, {"label": "MW Ghana", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=Ghana"}], "collision_tier1": true, "seq": 34}]}, {"verse_id": "5.58.49", "verse": "49", "sanskrit_iast": "aṭṭahāsam vimuñcantī nārī kāpyutthitā puraḥ । jighāṃsantīm tatas tām tu jvaladagniśiroruhām ॥49॥", "leonov_ru": "Издавая громкий смех, предстала передо мной некая женщина. Тогда ее, желающую [меня] убить, у которой волосы на голове пылали огнем,", "commentary": {"bhusana": "जिघांसन्तीं ततस्तां तु ज्वलदग्निशिरोरुहाम् ।\n\nसव्यमुष्टिप्रहारेण पराजित्य सुभैरवाम्", "siromani": "जिघां सन्तीमिति । जिघांसन्तीं तां सव्यमुष्टिप्रहारेण पराजित्य तया उदितः कथितवृत्तान्तो ऽहं प्रविशं प्राविशम् । सार्धश्लोक एकान्वयी ।। 5.58.49,50 ।।\n\nतद्वचनाकारमाह अहमिति । यस्मात् ते त्वया अहं निर्जिता तस्मात् सर्वरक्षांसि त्वं विजेता ऽसि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.49:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "С пылающими волосами", "kind": "note", "text": "по переводу непонятно, были ли волосы как огонь или на самом деле горели (кто их, ракшасов, знает)"}], "suggestions": [], "seq": 35}, {"id": "edition:5.58.49:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.58.49–51 (3 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.58.49–51", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.58.49", "iast": "aṭṭahāsam vimuñcantī nārī kāpyutthitā puraḥ । jighāṃsantīm tatas tām tu jvaladagniśiroruhām ॥49॥"}, {"verse_id": "5.58.50", "iast": "savyamuṣṭiprahāreṇa parājitya subhairavām । pradoṣakāle praviśam bhītayāham tayoditaḥ ॥50॥"}, {"verse_id": "5.58.51", "iast": "aham laṅkāpurī vīra nirjitā vikrameṇa te । yasmāt tasmād vijetāsi sarvarakṣāṃsyaśeṣataḥ ॥51॥"}], "collision_tier1": true, "seq": 36}]}, {"verse_id": "5.58.50", "verse": "50", "sanskrit_iast": "savyamuṣṭiprahāreṇa parājitya subhairavām । pradoṣakāle praviśam bhītayāham tayoditaḥ ॥50॥", "leonov_ru": "Я ударом левого кулака поразил, ужасную. В вечерних сумерках вошел я [в Ланку], и она [та женщина], испуганная, мне сказала:", "commentary": {"tilaka": "सुभैरवामतिशयेन भयङ्कररूपाम् । प्रविशं प्राविशम् ।। 5.58.50,51 ।।\n\nसर्वरात्रं सर्वां रात्रीम् । अल्पशेषाय रात्रावशोकवनिकायां दर्शनादेवमुक्तिः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.50:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "входящему", "kind": "note", "text": "нужен комм"}], "suggestions": [], "seq": 37}]}, {"verse_id": "5.58.53", "verse": "53", "sanskrit_iast": "tataḥ sītām apaśyaṃs tu rāvaṇasya niveśane । śokasāgaram āsādya na pāram upalakṣaye ॥53॥", "leonov_ru": "И вот, не видя Ситы в жилище Раваны, Погрузился я в океан скорби и не видел (не различал) другого берега.", "commentary": {"bhusana": "ततः सीतामपश्यंस्तु रावणस्य निवेशने ।\n\nशोकसागरमासाद्य न पारमुपलक्षये", "tilaka": "उपलक्षय उपालक्षयम्", "siromani": "तत इति । रावणस्य निवेशने सीतामपश्यन्नहं शोकसागरमासाद्य पारं तं नोपलक्षये"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.53:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Погрузился в пучину скорби / И не видел исхода (śokasāgaram āsādya na pāram upalakṣaye) - букв. “погрузившись в океан скорби, не вижу берега”.", "service": [], "suggestions": [], "seq": 38}]}, {"verse_id": "5.58.54", "verse": "54", "sanskrit_iast": "śocatā ca mayā dṛṣṭaṃ prākāreṇābhisaṃvṛtam । kāñcanena vikṛṣṭena gṛhopavanam uttamam ॥54॥", "leonov_ru": "Увидел я опечаленный великолепную рощу при дворце, Обнесенную длинной золотой стеной.", "commentary": {"tilaka": "विकृष्टेन विप्रकृष्टोर्ध्वभागेन अत्युच्चेनेति यावत् । तादृशेन प्रासादेनावृतं किञ्चित्स्थानं मया दृष्टम्", "siromani": "शोचतेति । विकृष्टेन प्रकृष्टोर्ध्वभागेन प्राकारेण अभिसंवृतम् उत्तमं गृहोपवनं मया दृष्टम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.54:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Высокой стеной золотою (prākāreṇa... kāñcanena  "commentary": {"bhusana": "तदेकवासःसंवीतां रजोध्वस्तशिरोरुहाम् ।\n\nशोकसन्तापदीनाङ्गीं सीतां भर्तृहिते स्थिताम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.57:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "одну одежду", "kind": "note", "text": "нужен будет комм по реалиям (здесь или ранее, а здесь - ссылка)"}], "suggestions": [], "seq": 41}]}, {"verse_id": "5.58.59", "verse": "59", "sanskrit_iast": "māṃsaśoṇitabhakṣyābhir vyāghrībhir hariṇīṃ yathā । sā mayā rākṣasīmadhye tarjyamānā muhurmahuḥ ॥59॥", "leonov_ru": "Питающимися мясом и кровью, подобную оленихе, [окруженной] тигрицами. Она, [увиденная] мной среди ракшаси, оскорбляемая (угрожаемая) [ими] то и дело,", "commentary": {"bhusana": "सामया राक्षसीमध्ये तर्ज्यमाना मुहुर्मुहुः ।\n\nएकवेणीधरा दीना भर्तृचिन्तापरायणा"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.59:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "māṃsaśoṇitabhakṣyābhir", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 42}]}, {"verse_id": "5.58.5961", "verse": "5961", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"siromani": "सति राक्षसीमध्ये मुहुर्मुहुस्तर्ज्यमाना हिमागमे पद्मिनीव विवर्णाङ्गी रावणात् विनिवृत्तः अर्थः रामसेवा यस्याः अत एव मर्तव्ये मरणे कृतो निश्चयो यया सा सीता कथंचित्तूर्णं मया आसादिता प्राप्ता । सार्धश्लोकद्वयमेकान्वयि"}, "has_tier1": false, "verse_ref":

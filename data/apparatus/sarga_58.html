ны.", "commentary": {"bhusana": "ततो हलहलाशब्दं काञ्चीनूपुरमिश्रितम् ।\n\nशृणोम्यधिकगम्भीरं रावणस्य निवेशने"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.63:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "rāvaṇasya niveśane", "kind": "omission", "text": "опущено"}, {"author": "Е. Костина", "lemma_iast": "«хала-хала", "kind": "note", "text": ",» это точно какие-то особые возгласы, а не просто шум?"}], "suggestions": [], "seq": 45}]}, {"verse_id": "5.58.6365", "verse": "6365", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "गहने पर्णगूढप्रदेशे । 'पर्णघने निलीनः' इत्यधस्तादप्युक्तेः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.6365:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "рощу ашоки", "kind": "note", "text": "taṃ deśaṃ - нужен ли комм?"}], "suggestions": [], "anchor_verse_id": "5.58.65", "seq": 46}]}, {"verse_id": "5.58.6671", "verse": "6671", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"tilaka": "प्रत्यसंहरं सूक्ष्ममकरवम् । गहने पर्णसमूहगूढप्रदेशे स्थितः ।। 5.58.64,65 ।।\n\nपरिरभ्य चेति । वित्रस्तेव बभूवेति शेषः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.6671:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Будь моею женою (bahumanyasva mām) - букв. “отнесись ко мне с уважением/окажи мне честь”.", "service": [{"author": "Е. Костина", "lemma_iast": "bahu", "kind": "omission", "text": "опущено в комментарии"}, {"author": "Е. Костина", "lemma_iast": "Будь моею женою", "kind": "note", "text": "На основании чего эта интерпретация? Нужно указать"}], "suggestions": [], "anchor_verse_id": "5.58.68", "seq": 47}]}, {"verse_id": "5.58.67", "verse": "67", "sanskrit_iast": "vitrastām paramodvignām vīkṣamāṇām itas tataḥ । trāṇam kiṃcid apaśyantīm vepamānām tapasvinīm ॥67॥", "leonov_ru": "Испуганной, в высшей степени встревоженной, оглядывающейся по сторонам, Но не видящей какого-либо убежища (защиты), дрожащей несчастной женщине", "commentary": {"siromani": "तत इति । ततो ऽनन्तरं रावणस्य निवेशने अधिकगम्भीरं हलहलाशब्दं शृणोमि अशृणवम्\nतत इति । परमोद्विग्नो ऽहं स्वरूपं स्वशरीरं प्रत्यसंहरं सूक्ष्ममकरवं शिंशुपावृक्षे गहने निबिडस्थले स्थितश्चाभवमिति शेषः\nतत इति । ततो ऽनन्तरं यत्र सीता स्थिता ऽभवत् तत्र देशे रावणो ऽनुसंप्राप्तः रावणदाराश्च अनुसंप्राप्तावचनविपरिणामेनान्यत्राप्यन्वयः", "bhusana": "वित्रस्तां परमोद्विग्नां वीक्षमाणां ततस्ततः ।\n\nत्राणं किंचिदपश्यन्तीं वेपमानां तपस्विनीम्\nपरमोद्विग्नाम् अतीवोद्भ्रान्तहृदयाम् । ततस्ततः वीक्षमाणां नानादिक्षु वीक्षमाणाम् । त्राणमित्यनुषज्यते"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "edition:5.58.67:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.58.67 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.58.67", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.58.67", "iast": "vitrastām paramodvignām vīkṣamāṇām itas tataḥ । trāṇam kiṃcid apaśyantīm vepamānām tapasvinīm ॥67॥"}], "seq": 48}]}, {"verse_id": "5.58.71", "verse": "71", "sanskrit_iast": "rākṣasādhama rāmasya bhāryām amitatejasaḥ । ikṣvākuvaṃśanāthasya snuṣāṃ daśarathasya ca ॥71॥", "leonov_ru": "«О низкий ракшас! Жене Рамы, наделенного безмерной мощью, Господина рода Икшваку, невестке Дашаратхи", "commentary": {"bhusana": "न त्वं रामस्य सदृशो दास्ये ऽप्यस्य न युज्यसे ।\n\nयज्ञीयः सत्यवादी च रणश्लाघी च राघवः\nराक्षसाधम रामस्य भार्यममिततेजसः ।\n\nइक्ष्वाकुकुलनाथस्य स्नुषां दशरथस्य च ।\n\nअवाच्यं वदतो जिह्वा कथं न पतिता तव"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.71:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Ракшаса подлый… (rākṣasādhama) - букв. “худший из ракшасов”.", "service": [{"author": "Е. Костина", "lemma_iast": "Господина рода Икшваку,", "kind": "note", "text": "Г-пр соотносит эту характеристику с Дашаратхой"}], "suggestions": [], "seq": 49}]}, {"verse_id": "5.58.76", "verse": "76", "sanskrit_iast": "maithilīm hantum ārabdhaḥ strībhiḥ hāhā kṛtam tadā । strīṇām madhyāt samutpatya tasya bhāryā durātmanaḥ ॥76॥", "leonov_ru": "Он был готов убить Майтхили. Тогда среди женщин послышались возгласы «О горе!» И из середины женщин вышла главная жена того злобного (Раваны),", "commentary": {"tilaka": "तदसंनिधावपहृत्य तेनादृष्ट इति लङ्कामागतः, अन्यथा तदैव ते हननं स्यादित्यर्थः । सादृश्यसंभावना ऽपि दूरापास्तेत्याह-- दास्ये ऽपीति ।। 5.58.73,74 ।।\n\nचितास्थपावकत्वेनास्पृश्यता सूचिता\nहाहाकृतं हाहेति कृतम्", "bhusana": "स्त्रीणां मध्यात् समुत्पत्य तस्य भार्या दुरात्मनः ।\n\nवरा मण्डोदरी नाम तया स प्रतिषेधितः", "siromani": "स्त्रीणामिति । तस्य रावणस्य मन्दोदरी नाम या वरा भार्या तया स्त्रीणां मध्यात्समुत्पत्य स रावणः मधुरां वाणीमुक्तः अत एव प्रतिषेधितः । सार्धश्लोक एकान्वयी ।। 5.58.76,77 ।।\n\nतद्वचनाकारमाह सीतयेति । सीतया तत्स्थापनप्रयत्नेन तव किं कार्यं न किमपीत्यर्थः, अतः सीतया तत्प्रार्थनया किं करिष्यसि न किमपीत्यर्थः, एतेन तत्स्थापनप्रयत्नं त्यजेति सूचितम् मया सह देवकन्यादिभिश्च सार्धं रमस्व सीतासंभाषणादिना कालविलम्बं न कुर्वित्यर्थः । ननु तस्याः पूजनार्थं मया सा प्रार्थ्यते इत्यत आह मद्विशिष्टा अस्मत्पूज्येत्यर्थः जानकी न स्थास्यतीति शेषः । श्लोकद्वयमेकान्वयि ।। 5.58.78,79 ।।\n\nतत इति । ततो ऽनन्तरं निशाचरः नारीभिरुत्थाप्य स्वं भवनं नीतः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.76:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "«О горе!» - послышались возгласы (strībhiḥ hāhā kṛtam tadā) - в оригинале - восклицание hāhā, выражающее горе или тревогу.", "service": [], "suggestions": [], "seq": 50}]}, {"verse_id": "5.58.77", "verse": "77", "sanskrit_iast": "varā mandodarī nāma tayā sa pratiṣedhitaḥ । uktaś ca madhurāṃ vāṇīṃ tayā sa madanārditaḥ ॥77॥", "leonov_ru": "По имени Мандодари. Ею он был остановлен. И сказала она сладостные слова ему, терзаемому богом любви:", "commentary": {"bhusana": "उक्तश्च मधुरां वाणीं तया स मदानार्दितः ।\n\nसीतया तव किं कार्यं महेन्द्रसमविक्रम"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.77:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "По имени Мандодари (mandodarī nāma) - в песни двадцать второй похожую речь произносит Дханьямалини. Часть средневековых комментаторов полагают, что Мандодари участвовала в этом эпизоде вместе с Дханьямалини, часть - что Хануман, не зная в лицо жен Раваны, назвал Дханьямалини именем Мандодари. В комментарии “Тилака” также содержится предположение, что Дханьямалини - другое имя Мандодари.", "service": [], "suggestions": [], "seq": 51}]}, {"verse_id": "5.58.82", "verse": "82", "sanskrit_iast": "tṛṇavad bhāṣitaṃ tāsāṃ gaṇayām āsa jānakī । tarjitaṃ ca tathā tāsāṃ sītāṃ prāpya nirarthakam ॥82॥", "leonov_ru": "[Но] Джанаки не обратила внимания на сказанное ими (дословно: посчитала сказанное ими подобным траве), И все их угрозы Сите оказались напрасными.", "commentary": {"tilaka": "निरर्थकम् आसीदिति शेषः", "siromani": "तृणविदिति । तासां राक्षसीनां भाषितं जानकी तृणवद्गणयामास अत एव तासां गर्जितं सीतां प्राप्य निरर्थकमभवदिति शेषः", "bhusana": "तासां मध्यात् समुत्थाय त्रिजटा वाक्यमब्रवीत् ।\n\nआत्मानं खादत क्षिप्रं न सीता विनशिष्यति"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.82:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Но их слова для Джанаки / Были подобны былинке (tṛṇavad bhāṣitaṃ tāsāṃ gaṇayām āsa jānakī) - букв. “Джанаки посчитала сказанное ими подобным траве”. “Считать подобным траве” - санскритская идиома, означающая пренебрежение.", "service": [], "suggestions": [], "seq": 52}]}, {"verse_id": "5.58.83", "verse": "83", "sanskrit_iast": "vṛthā garjitaniśceṣṭā rākṣasyaḥ piśitāśanāḥ । rāvaṇāya śaśaṃsus tāḥ sītāvyavasitaṃ mahat ॥83॥", "leonov_ru": "Оставили свои напрасные крики ракшаси, питающиеся плотью. Рассказали они Раване о великой решимости (стойкости) Ситы.", "commentary": {"tilaka": "सीताव्यवसितं महत् । मर्तव्यं न तु त्वमङ्गीकर्तव्य इत्येतद्रूपम्", "bhusana": "तासु चैव प्रसुप्तासु सीता भर्तृहिते रता ।\n\nविलप्य करुणं दीना प्रशुशोच सुदुःखिता\nवृथागर्जितनिश्चेष्टा राक्षस्यः पिशिताशनाः ।\n\nरावणाय शशंसुस्ताः सीताध्यवसितं महत्\nवृथागर्जितनिश्चेष्टाः वृथगर्जितेन निर्व्यापाराः", "siromani": "वृथेति । वृथागर्जितेन गर्जितवैयर्थ्येन निश्चेष्टा राक्षस्यः सीतायाः महत् व्यवसितं रावणाय शशंसुः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.83:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "", "kind": "note", "text": "стойкость или твердое решение?"}], "suggestions": [], "seq": 53}]}, {"verse_id": "5.58.86", "verse": "86", "sanskrit_iast": "tāsām madhyāt samutthāya trijaṭā vākyamabravīt । ātmānam khādata kṣipram na sītām asitekṣaṇām ॥86॥", "leonov_ru": "Из них (ракшаси) встав, Триджата сказала: «Себя съешьте немедленно, а не черноглазую Ситу,", "commentary": {"siromani": "तासामिति । त्रिजटा अब्रवीत् । तद्वचनाकारमाह आत्मानं खादत जनकस्यात्मजां न खादत । एतेन सीताया विनाशाभावः राक्षसीनामासन्नविनाशश्च सूचितः । सार्धश्लोक एकान्वयी"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.86:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "86", "kind": "note", "text": "сверка"}], "suggestions": [], "seq": 54}, {"id": "lexical:5.58.86:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "Trijaṭā", "note_ru": "Триджата (Trijaṭā, f.) — ракшаси-заступница Ситы. MW: Trijaṭā «имя ракшаси, благосклонной к Сите». Этимология: tri «три» + jaṭā «спутанные волосы аскета» — «трёхкосая». Нарративная роль: Триджата — внутренний голос сочувствия в стане Раваны; её вещий сон о победе Рамы (V.58.87-91) функционирует как пророческий комментарий к ситуации. В пересказе гл. 58 Хануман включает этот эпизод ретроспективно, что подчёркивает его нарративный вес: союзница Ситы обнаружилась даже среди её мучительниц. Параллельная фигура — Вибхишана как совесть в окружении Раваны.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:trijawA", "source_links": [{"label": "MW trijawA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=trijawA"}], "collision_tier1": true, "seq": 55}, {"id": "edition:5.58.86:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.58.86 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.58.86", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.58.86", "iast": "tāsām madhyāt samutthāya trijaṭā vākyamabravīt । ātmānam khādata kṣipram na sītām asitekṣaṇām ॥86॥"}], "collision_tier1": true, "seq": 56}]}, {"verse_id": "5.58.87", "verse": "87", "sanskrit_iast": "janakasyātmajāṃ sādhvīṃ snuṣāṃ daśarathasya ca । svapno hyadya mayā dṛṣṭo dāruṇo romaharṣaṇaḥ ॥87॥", "leonov_ru": "Дочь Джанаки, добродетельную, невестку Дашаратхи. Ибо привиделся мне сон ужасный, от которого волоски на теле встали дыбом,", "commentary": {"bhusana": "यस्या ह्येवंविधः स्वप्नो दुःखितायाः प्रदृश्यते ।\n\nसा दुःखैर्विविधैर्मुक्ता सुखमाप्नोत्यनुत्तमम्\nजनकस्यात्मजा साध्वी स्नुषा दशरथस्य च ।\n\nस्वप्नो ह्यद्य मया दृष्टो दारुणो रोमहर्षणः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.87:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Такой, что волосы дыбом (dāruṇo romaharṣaṇaḥ) - букв. “от которого встали дыбом волоски на теле”.", "service": [], "suggestions": [], "seq": 57}]}, {"verse_id": "5.58.88", "verse": "88", "sanskrit_iast": "rakṣasām ca vināśāya bharturasyā jayāya ca । alam asmāt paritrātum rāghavād rakṣasīgaṇam ॥88॥", "leonov_ru": "Предвещающий гибель (досл. на погибель) ракшасов и победу ее мужа. Способна [Сита] спасти все множество ракшаси от этого Рагхавы.", "commentary": {"bhusana": "अलमस्मात् परित्रातुं राघवाद्राक्षसीगणम् ।\n\nअभियाचाम वैदेहीमेतद्धि मम रोचते\nरक्षसां च विनाशाय भर्तुरस्या जयाय च\nअलं शक्ता । \"अलं भूषणपर्याप्तिशक्तिवारणवाचकम्\" इत्यमरः । परित्रातुम्, एषेति शेषः ।। 5.58.87,88 ।।\n\nप्रणिपातप्रसन्ना हि मैथिली जनकात्मजा\nअपराधिजनप्राणत्राणे हेतुमाह प्रणिपातेति", "tilaka": "राक्षसीगणमस्मान्राक्षसीरूपानस्मान्परित्रातुमलमेषा सीतेति शेषः", "siromani": "अलमिति । अस्मान् परित्रातुम् अलं समर्था सीतेति शेषः, अतो वैदेहीमभियाचाम"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "edition:5.58.88:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.58.88–90 (3 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.58.88–90", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.58.88", "iast": "rakṣasām ca vināśāya bharturasyā jayāya ca । alam asmāt paritrātum rāghavād rakṣasīgaṇam ॥88॥"}, {"verse_id": "5.58.89", "iast": "abhiyācāma vaidehīm etaddhi mama rocate । yadi hy evamvidhaḥ svapno duḥkhitāyāḥ pradṛśyate ॥89॥"}, {"verse_id": "5.58.90", "iast": "sā duḥkhair vividhair muktā sukham āpnoty anuttamam । praṇipātaprasannā hi maithilī janakātmajā ॥90॥"}], "seq": 58}]}, {"verse_id": "5.58.89", "verse": "89", "sanskrit_iast": "abhiyācāma vaidehīm etaddhi mama rocate । yadi hy evamvidhaḥ svapno duḥkhitāyāḥ pradṛśyate ॥89॥", "leonov_ru": "Попросим Вайдехи – это мне нравится (так я считаю). Ибо если видится такой сон о страдающей,", "commentary": {"siromani": "एतदिति । मैनाकस्यैतद्वचः श्रुत्वा मया कार्यं कर्तव्यमावेद्य बोधयित्वा विद्यमानस्य मम मनः उद्धतं प्रवृद्धमभवदिति शेषः\nएतदिति । रावणस्य एतत् रामवियोगस्थितिसूचकं वचः श्रुत्वोवाच", "tilaka": "अभियाचाम स्वरक्षणमिति शेषः ।। 5.58.89,90 ।।\n\nततस्त्रिजटावाक्यानन्तरम् । क्वैतावद्भाग्यमिति लज्जिता । तत्कथितस्वप्नसूचितरामविजयहर्षिता"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "phase2:5.58.89:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "svapno ... duḥkhitāyāḥ pradṛśyate", "note_ru": "Широмани поднимает доктринальный вопрос об истинности сна: даже если сам сон окажется ложным (mithyātve 'pi), плод, порождённый его видением, всё равно истинен (taddarśana-janita-phalasya satyatvam); по другой же школе истинен и сам сон. Комментатор снимает кажущееся противоречие между пророческим сном Триджаты и обычным недоверием к снам.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "подстрочник передаёт сон Триджаты как рассказ, не сообщая о доктринальном вопросе истинности сна, который поднимает комментатор; сегментатор закрепил это рассуждение за стихом 95, но по содержанию (svapna) оно относится к рассказу о сне в 87-89 — анкоридж проверен по содержанию, а не только по маркеру", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 59}]}, {"verse_id": "5.58.90", "verse": "90", "sanskrit_iast": "sā duḥkhair vividhair muktā sukham āpnoty anuttamam । praṇipātaprasannā hi maithilī janakātmajā ॥90॥", "leonov_ru": "[То] она, освободившись от разнообразных страданий, обретет несравненное счастье. Смягченная благодаря [нашему] простиранию к ее стопам, Майтхили, дочь Джанаки,", "commentary": {"siromani": "प्रणिपातेति । राक्षस्यो राक्षसीः परित्रातुमलम् । यदि तु राक्षस्य इति संबोधनं तदा ऽस्मानिति प्रत्यासत्या वक्तव्यम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.90:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "припадем", "kind": "note", "text": "Голдмэны полагают, что они припали к стопам, что это уже не план Then they propitiated Maithili, the shy, young daughter ofJanaka, by falling at her feet. По Г-пр это слова ракшаси, но делается акцент на hi - достаточно всего лишь поклониться ей, и она смягчится и нас спасет"}], "suggestions": [], "seq": 60}]}, {"verse_id": "5.58.92", "verse": "92", "sanskrit_iast": "avocad yadi tat tathyaṃ bhaveyaṃ śaraṇaṃ hi vaḥ । tāṃ cāhaṃ tādṛśīṃ dṛṣṭvā sītāyā dāruṇāṃ daśām ॥92॥", "leonov_ru": "Сказала: «Если это (о чем рассказала Триджата) верно, то стану я вашим прибежищем». И я, видя, в какой опасности находится Сита,", "commentary": {"siromani": "तत्र कारणमाह स्वप्न इति । अस्या सीतायाः भर्तुर्जयाय च स्वप्नो मया दृष्टः । अर्धद्वयमेकान्वयि\nतामिति । तां सीतां तादृशीं सीताया दशां च दृष्ट्वा विश्रान्तो ऽहं चिन्तयामास । अत एव मे मनो न निर्वृत्तम्", "bhusana": "तां चाहं तादृशीं दृष्ट्वा सीताया दारुणां दशाम् ।\n\nचिन्तयामास विक्रान्तो न च मे निर्वृतं मनः\nन च मे निर्वृतम् किन्तु दुःखितमित्यर्थः", "tilaka": "तत्त्रिजटावाक्यं यदि तथ्यं तदावश्यं शरणं भवेयमित्यवोचदिति संबन्धः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.92:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "верно", "kind": "note", "text": "по переводу теряется связь с будущим - если так оно и будет. Напрашивается предположение, что основание для ее готовности быть прибежищем - это сон о победе Рамы."}], "suggestions": [], "seq": 61}]}, {"verse_id": "5.58.95", "verse": "95", "sanskrit_iast": "pratyabhāṣata māṃ devī bāṣpaiḥ pihitalocanā । kas tvaṃ kena kathaṃ ceha prāpto vānarapuṃgava ॥95॥", "leonov_ru": "Ответила мне царевна, в глазах которой стояли слезы: «Кто ты, зачем и как сюда пришел, о бык среди обезьян?", "commentary": {"siromani": "ननु स्वप्नस्य मिथ्यात्वात्किं तद्दर्शनेन सीताभर्तृविजयादीत्यत आह यदीति । दुःखितायाः एवंविधः स्वप्नो यदि दृश्यते तर्हि सा दुःखिता दुःखैर्विमुक्ता सती सुखमाप्नोति । एतेन स्वप्नस्य मिथ्यात्वे ऽपि तद्दर्शनजनितफलस्य सत्यत्वं ध्वनितं मतान्तरे स्वप्नस्यापि सत्यत्वमित्यन्यदेतत्", "bhusana": "कस्त्वं केन कथं चेह प्राप्तो वानरपुङ्गव ।\n\nका च रामेण ते प्रीतिस्तन्मे शंसितुमर्हसि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.95:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "кат.1 — буквальный перевод", "accounted": "", "text": "ṛṣabha / vṛṣabha — букв. «бык»; устойчивый эпитет превосходства.", "incomplete": false}], "seq": 62}]}, {"verse_id": "5.58.99", "verse": "99", "sanskrit_iast": "idaṃ ca puruṣavyāghraḥ śrīmān dāśarathiḥ svayam । aṅgulīyam abhijñānam adāt tubhyaṃ yaśasvini ॥99॥", "leonov_ru": "Тигр среди мужей, доблестный сын Дашаратхи сам Дал это кольцо – тайный знак для тебя, о достославная.", "commentary": {"tilaka": "तुभ्यं भर्त्रा तव भर्त्रा ।। 5.58.98,99 ।।\n\nत्वया ऽ ऽज्ञप्तं त्वत्कर्मकमाज्ञापनम् । उत्तरं समुद्रोत्तरकूलस्थम् । यद्वा किमुत्तरं प्रत्युत्तरं किं ब्रूहीति शेषः", "bhusana": "इदं च पुरुषव्याघ्रः श्रीमान् दाशरथिः स्वयम् ।\n\nअङ्गुलीयमभिज्ञानमदात्तुभ्यं यशस्विनि", "siromani": "इदमिति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "crosstext:5.58.99:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "puruṣa-vyāghra", "note_ru": "puruṣavyāghraḥ … dāśarathiḥ («тигр среди мужей, сын Дашаратхи») — Хануман передаёт Сите перстень-примету Рамы. Та же формула в Удьйогапарве прилагается к Пандавам как сообществу непобедимых: «tatheme puruṣavyāghrāḥ sahāyāstava pārthiva … sarve yuddhābhinandinaḥ» (MBh V.195.16) — «эти тигры среди мужей — твои союзники … все они жаждут битвы». Параллель подтверждает, что puruṣavyāghra — общеэпический титул доблести, а не индивидуальная вальмикиевская метафора.", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.58.99", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Udyogaparvan V.195.16", "source_links": [], "seq": 63}]}, {"verse_id": "5.58.100", "verse": "100", "sanskrit_iast": "tad icchāmi tvayājñaptaṃ devi kiṃ karavāṇy aham । rāmalakṣmaṇayoḥ pārśvaṃ nayāmi tvāṃ kim uttaram ॥100॥", "leonov_ru": "Желаю я твоих приказов, царевна, что мне сделать для тебя? Отведу я тебя (могу я тебя отвести) к Раме и Лакшмане. Каков [будет твой] ответ?", "commentary": {"bhusana": "प्रणम्य शिरसा देवीमहमार्यामनिन्दिताम् ।\n\nराघवस्य मनोह्लादमभिज्ञानमयाचिषम्", "siromani": "तदिति । त्वया ऽ ऽज्ञप्तं तदुत्तरं किं किंचित् करवाणीत्यहमिच्छामि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.100:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Каким будет ответ твой? (kim uttaram) - в комментарии “Тилака” отмечается некоторая двусмысленность вопроса Ханумана. Слово uttaram может означать “ответ” и “северный” (находящийся на северном берегу океана). Во втором случае uttaram относится к предыдущим словам aham rāmalakṣmaṇayoḥ pārśvaṃ nayāmi tvāṃ (я отведу тебя на сторону Рамы и Лакшманы) и является определением к слову parśvam (сторону).", "service": [{"author": "Е. Костина", "lemma_iast": "Раме", "kind": "note", "text": "Нужен комм, что опущен Лакшмана"}], "suggestions": [], "seq": 64}]}, {"verse_id": "5.58.102", "verse": "102", "sanskrit_iast": "praṇamya śirasā devīm aham āryām aninditām । rāghavasya manohlādam abhijñānam ayāciṣam ॥102॥", "leonov_ru": "Я, склонив голову перед благородной и безупречной царевной, Попросил о тайном знаке, радостном для сердца Рагхавы (который бы порадовал душу Рагхаве).", "commentary": {"siromani": "प्रणम्येति । देवीं सीतां प्रणम्याहमभिज्ञानमयाचिषम्", "bhusana": "ततस्तस्यै प्रणम्याहं राजपुत्र्यैः समाहितः ।\n\nप्रदक्षिणं परिक्राममिहाभ्युद्गतमानसः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.102:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "И попросил тайный знак, / Что радость принес бы Раме (rāghavasya manohlādam abhijñānam ayāciṣam) - букв. “Я попросил тайный знак, отрадный душе Рагхавы”.", "service": [], "suggestions": [], "seq": 65}]}, {"verse_id": "5.58.103", "verse": "103", "sanskrit_iast": "atha mām abravīt sītā gṛhyatām ayam uttamaḥ । maṇir yena mahābāhū rāmas tvāṃ bahu manyate ॥103॥", "leonov_ru": "Тогда сказала мне Сита: «Возьми этот превосходный Драгоценный камень, благодаря которому долгорукий Рама окажет тебе почет (высоко тебя оценит)».", "commentary": {"siromani": "अथेति । येन रामस्त्वां बहु मन्यते स एष मणिः गृह्यतामिति सीता मामब्रवीत्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "edition:5.58.103:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.58.103 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.58.103", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.58.103", "iast": "atha mām abravīt sītā gṛhyatām ayam uttamaḥ । maṇir yena mahābāhū rāmas tvāṃ bahu manyate ॥103॥"}], "seq": 66}]}, {"verse_id": "5.58.104", "verse": "104", "sanskrit_iast": "ity uktvā tu varārohā maṇipravaram uttamam । prāyacchat paramodvignā vācā māṃ saṃdideśa ha ॥104॥", "leonov_ru": "Сказав так, прекраснобедрая великолепный драгоценный камень Подала [мне] и, весьма взволнованная, сказала мне слова послания.", "commentary": {"tilaka": "सन्दिदेश काकवृत्तान्तं तिलककरणं च राममात्रैकवेद्यं कथयामासेत्यर्थः", "bhusana": "उत्तरं पुनरेवेदं निश्चित्य मनसा तया ।\n\nहनुमन् मम वृत्तान्तं वक्तुमर्हसि राघवे"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "phase2:5.58.104:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vācā māṃ saṃdideśa", "note_ru": "Тилака поясняет, в чём состояло устное послание Ситы Хануману: рассказ о вороне (kāka-vṛttānta, эпизод с Индровым сыном-вороном) и история о нанесении тилаки — детали, известные только самому Раме и служащие проверочными знаками её подлинности.", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "подстрочник сообщает лишь, что Сита «сказала мне слова послания», не раскрывая их содержания; Тилака называет конкретные приметы-опознавательные знаки (эпизод с вороном, нанесение тилаки), восполняя смысловой эллипсис", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 67}]}, {"verse_id": "5.58.105", "verse": "105", "sanskrit_iast": "tatas tasyai praṇamyāhaṃ rājaputryai samāhitaḥ । pradakṣiṇaṃ parikrāmam ihābhyudgatamānasaḥ ॥105॥", "leonov_ru": "Тогда, поклонившись царевне, я, собранный, Почтительно обошел ее и решил возвращаться сюда.", "commentary": {"siromani": "तत इति । इह भवतां समीपे अभ्युद्गतं मानसं यस्य सो ऽहं राजपुत्र्यै प्रणम्य प्रदक्षिणं परिक्रामं पर्यक्रामम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.105:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Думая о возвращении (ihābhyudgatamānasaḥ) - букв. “тот, чья душа прибыла сюда”. В комментарии “Тилака” поясняется: “тот, чья душа решила отправиться сюда”, то есть туда, где Ханумана ждали обезьяны.", "service": [], "suggestions": [], "seq": 68}]}, {"verse_id": "5.58.108", "verse": "108", "sanskrit_iast": "yady anyathā bhaved etad dvau māsau jīvitaṃ mama । na māṃ drakṣyati kākutstho mriye sāham anāthavat ॥108॥", "leonov_ru": "Иначе осталось мне жить [всего] два месяца. Не увидит меня Какутстха, умру я, лишенная защитника».", "commentary": {"tilaka": "यद्यस्मादन्यथानागमने द्वौ मासौ मम जीवितं भवेत् अनाथवन्म्रिये । राक्षसीकृतवधेनेति भावः", "siromani": "यदिति । यत् यदि अन्यथा विलम्बो भवेत् तर्हि मां काकुत्स्थो न द्रक्ष्यति । तत्र हेतुः द्वौ मासावेव मम जीवितं जीवनम् अनन्तरमनाथवन्म्रिये\nएतदिति । राघव एव मां नयत्विति सीता आह", "bhusana": "यद्यन्यथा भवेदेतद्द्वौ मासौ जीवितं मम ।\n\nन मां द्रक्ष्यति काकुत्स्थो म्रिये सा ऽहमनाथवत्\nएतत् उपयानं यद्यन्यथा भवेत् यदि नोपेयातामित्यर्थः । तदा द्वौ मासौ मम जीवितम् ततः परं न जीवमीत्यर्थः । न मां द्रक्ष्यति मासद्वयाभ्यन्तरे मां न द्रक्ष्यति चेत् तदा म्रिय इति योज्यम् । मासशब्दो ऽत्र पक्षपरः । \"पक्षा वै मासाः\" इति श्रुतेः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.108:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Погибну я без защиты (mriye sāham anāthavat) - букв. “Умру я, не имеющая защитника”. В комментарии “Тилака” уточняется, что Ситу убьют ракшаси.", "service": [], "suggestions": [], "seq": 69}, {"id": "phase2:5.58.108:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "dvau māsau", "note_ru": "Бхушана поясняет, что «два месяца» здесь означают не календарных месяца, а два «пакши» (двухнедельных периода), ссылаясь на ведийскую формулу «pakṣā vai māsāḥ» («пакши и есть месяцы») — отсрочка, отпущенная Сите, вдвое короче, чем кажется из перевода.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "подстрочник и примечание Леонова/Костиной к этому стиху поясняют лишь буквальный смысл фразы «умру без защитника», но не количество месяцев; Бхушана даёт со ссылкой на шрути отдельное прочтение срока, сокращающее его вдвое", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 70}]}, {"verse_id": "5.58.111", "verse": "111", "sanskrit_iast": "tad bhagnaṃ vanaṣaṇḍaṃ tu bhrāntatrastamṛgadvijam । pratibuddhya nirīkṣante rākṣasyo vikṛtānanāḥ ॥111॥", "leonov_ru": "Ту рощу уничтоженную, в которой звери и птицы были растеряны и испуганы, Пробудившись, увидели уродливолицые ракшаси.", "commentary": {"bhusana": "तद्भग्नं वनषण्डं तु भ्रान्तत्रस्तमृगद्विजम् ।\n\nप्रतिबुद्धा निरीक्षन्ते राक्षस्यो विकृताननाः", "siromani": "तदिति । भग्नं तद्वनखण्डं राक्षस्यः प्रतिबुध्य निरीक्षन्ते\nतद्वचनाकारमाह-- राजन्निति । दुर्गं दुर्गममपि वनं तव वीर्यमविज्ञाय वानरेण भग्नम्\nतदिति । तत् राक्षसीवचनं श्रुत्वा किंकरा नाम राक्षसाः राक्षसेन्द्रेण विसृष्टाः प्रेषिताः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.111:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Со зверьем перепуганным (bhrāntatrastamṛgadvijam) - букв. “в которой звери и птицы были ошеломлены и перепуганы”.", "service": [], "suggestions": [], "seq": 71}]}, {"verse_id": "5.58.114", "verse": "114", "sanskrit_iast": "tasya durbuddhitā rājaṃs tava vipriyakāriṇaḥ । vadham ājñāpaya kṣipraṃ yathāsau na punar vrajet ॥114॥", "leonov_ru": "То его зломыслие. О царь, делающего тебе неприятное Прикажи немедленно убить, чтобы не ушел он [безнаказанным]».", "commentary": {"siromani": "तस्येति । तस्य वानरस्य दुर्बुद्धिता दुष्टबुद्धिरस्तीति शेषः, अतः यथा येन प्रकारेण असौ वानरः पुनर्न व्रजेत् जीवन्गच्छेत् तथा तेन प्रकारेण तव विप्रियकारिणः तस्य वानरस्य वधं क्षिप्रमाज्ञापय"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.114:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Пусть не уйдет безнаказанным (yathāsau na punar vrajet) - букв. “чтобы он не ушел снова [в свою страну]”.", "service": [], "suggestions": [], "seq": 72}]}, {"verse_id": "5.58.115", "verse": "115", "sanskrit_iast": "tac chrutvā rākṣasendreṇa visṛṣṭā bhṛśadurjayāḥ । rākṣasāḥ kiṃkarā nāma rāvaṇasya mano'nugāḥ ॥115॥", "leonov_ru": "Услышав это, владыка ракшасов послал непобедимых Ракшасов, называемых кинкарами, всей душой преданных Раване.", "commentary": {"bhusana": "तच्छ्रुत्वा राक्षसेन्द्रेण विसृष्टा भृशदुर्जयाः ।\n\nराक्षसाः किङ्करा नाम रावणस्य मनोनुगाः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "lexical:5.58.115:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kiṃkara", "note_ru": "Кинкара (kiṃkara, m.) — слуга, букв. делающий то, что скажут (kiṃ «что?» + kara «делающий» < √kṛ-). MW: kiṃkara «слуга, раб». Формульная этимология имени намеренна: kiṃ (вопросительная частица) + kara = «делающий всё по приказу». В V.58.115 кинкары характеризуются как mano'nugā («следующие духу/воле господина»), что дублирует и усиляет этимологический смысл. Их число 80 000, вооружение śūla+mudgara (копья и молоты), уничтожены parigheṇa (железной балкой, V.58.116) — детали, сохранённые в пересказе как свидетельство масштаба подвига.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:kiMkara", "source_links": [{"label": "MW kiMkara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=kiMkara"}], "seq": 73}]}, {"verse_id": "5.58.118", "verse": "118", "sanskrit_iast": "tato me buddhir utpannā caityaprāsādam ākramam । tatrasthān rākṣasān hatvā śataṃ stambhena vai punaḥ ॥118॥", "leonov_ru": "Тогда возникла у меня мысль, и пришел я во дворец-святилище. Перебив колонной сотню находившихся там ракшасов,", "commentary": {"tilaka": "चैत्यप्रासादम् विनाशयितुमिति शेषः", "bhusana": "तमहं बलसम्पन्नं राक्षसं रणकोविदम् ।\n\nपरिघेणातिघोरेण सूदयामि सहानुगम्\nततो मे बुद्धिरुत्पन्ना चैत्यप्रासादमाक्रमम् ।\n\nतत्रस्थान् राक्षसान् हत्वा शतं स्तम्भेन वै पुनः ।\n\nललामभूतो लङ्कायाः स वै विध्वंसितो मया"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.118:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "tato", "kind": "note", "text": "Опущен коннектор, теряется связность текста"}], "suggestions": [], "seq": 74}]}, {"verse_id": "5.58.126", "verse": "126", "sanskrit_iast": "sahasā khaṃ samudyantaṃ pādayoś ca gṛhītavān । tam āsīnaṃ śataguṇaṃ bhrāmayitvā vyapeṣayam ॥126॥", "leonov_ru": "Внезапно взмывшего в небо, схватил я за стопы, Покрутив сотню раз, прикончил поверженного (досл. сидящего).", "commentary": {"bhusana": "तच्चाप्यहं बलं सर्वं तं च राक्षसपुङ्गवम् ।\n\nनष्टौजसं रणे कृत्वा परं हर्षमुपागमम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.126:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Сотню раз повращал (śataguṇaṃ bhrāmayitvā) - в сорок седьмой песни, где описано сражение Ханумана с Акшей, сказано “тысячу раз” (V, 47, 35).", "service": [], "suggestions": [], "seq": 75}]}, {"verse_id": "5.58.137", "verse": "137", "sanskrit_iast": "sugrīvaśca mahābhāgaḥ sa tvām kuśalam abravīt । dharmārthakāmasahitaṃ hitaṃ pathyam uvāca ha ॥137॥", "leonov_ru": "Сугрива, наделенный великой долей, спросил о твоем благополучии. И сказал речь полезную, подобающую, исполненную дхармы, артхи и камы:", "commentary": {"siromani": "तदेव भङ्ग्यन्तरेणाह सुग्रीव इति । सुग्रीवस्त्वां कौशलमब्रवीत् हितं वाक्यमुवाच"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "edition:5.58.137:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.58.137 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.58.137", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.58.137", "iast": "sugrīvaśca mahābhāgaḥ sa tvām kuśalam abravīt । dharmārthakāmasahitaṃ hitaṃ pathyam uvāca ha ॥137॥"}], "seq": 76}]}, {"verse_id": "5.58.140", "verse": "140", "sanskrit_iast": "vālinā hṛtarājyena sugrīveṇa saha prabhuḥ । cakre 'gnisākṣikaṃ sakhyaṃ rāghavaḥ sahalakṣmaṇaḥ ॥140॥", "leonov_ru": "С Сугривой, которого лишил царства Валин, Заключил дружбу в присутствии Агни владыка Рагхава вместе с Лакшманой.", "commentary": {"bhusana": "तस्य साहाय्यमस्माभिः कार्यं सर्वात्मना त्विह ।\n\nतेन प्रस्थापितस्तुभ्यं समीपमिह धर्मतः ।\n\nक्षिप्रमानीयतां सीता दीयतां राघवाय च", "siromani": "वालिनेति । वालिना हृतं राज्यमप्यस्य तेन सुग्रीवेण मया सह अग्निसाक्षिकं\n\nसख्यं राघवश्चक्रे"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.140:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "перед Агни", "kind": "note", "text": "нужен будет комм"}], "suggestions": [], "seq": 77}, {"id": "crosstext:5.58.140:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "saha-lakṣmaṇa", "note_ru": "rāghavaḥ sahalakṣmaṇaḥ — «Рагхава вместе с Лакшманой» заключает союз с Сугривой «в присутствии Агни» (agnisākṣikam). Махабхарата в своей Рамопакхьяне закрепляет ту же парную формулу в кульминационных сценах (MBh III.275.16, sahalakṣmaṇāḥ). Устойчивость оборота «X вместе с Лакшманой» в обеих традициях показывает, что Лакшмана функционирует как постоянный формульный спутник-эпитет Рамы, а не вводится заново в каждой сцене.", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.58.140", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparvan (Rāmopākhyāna) III.275.16", "source_links": [], "collision_tier1": true, "seq": 78}]}, {"verse_id": "5.58.142", "verse": "142", "sanskrit_iast": "tasya sāhāyyam asmābhiḥ kāryaṃ sarvātmanā tv iha । tena prasthāpitas tubhyaṃ samīpam iha dharmataḥ ॥142॥", "leonov_ru": "Мы должны были всей душой помочь ему. Поэтому согласно дхарме, был отправлен к тебе [вестник].", "commentary": {"tilaka": "तस्य रामस्य । तेन रामसाहाय्यस्य कर्तव्यत्वेन तुभ्यं समीपं तव समीपं प्रस्थापितः । दूत इति शेषः । दूतप्रेषणं वना प्रथममेव युद्धस्याधर्मत्वादिति भावः", "siromani": "तस्येति । तस्य रामसाहाय्यमस्माभिः कार्यम् अतः तेन मया तुभ्यं तव समीपम् इतः प्रस्थापितः दूत इति शेषः", "bhusana": "तेन वध्यो ऽहमाज्ञप्तो रक्षसा रौद्रकर्मणा ।\n\nमत्प्रभावमविज्ञाय रावणेन दुरात्मना"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.142:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "И, как подобает, / К тебе посылаю вестника (prasthāpitas tubhyaṃ samīpam iha) - слово “вестник” добавлено по контексту и в соответствии со средневековыми комментариями. “Как подобает” - в комментарии “Тилака” отмечается, что начало войны без предварительных переговоров является неправедным (адхармой).", "service": [{"author": "Е. Костина", "lemma_iast": ".", "kind": "note", "text": "в комм надо как-то отразить, что закон здесь - это дхарма, а не какой-то свод правил, иначе непонятно, почему в конце говорится про адхарму."}], "suggestions": [], "seq": 79}, {"id": "phase2:5.58.142:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "dharmataḥ", "note_ru": "Тилака поясняет причину отправки посла: без предварительного посольства сама война была бы адхармой («dūta-preṣaṇaṃ vinā prathamam eva yuddhasya adharmatvāt») — отсюда и упоминание «дхармы» в конце стиха.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "прямо отвечает на вопрос, оставленный собственным примечанием Костиной к этому стиху («нужно как-то отразить, что закон здесь — это дхарма... иначе непонятно, почему в конце говорится про адхарму»): Тилака называет отсутствие посольства причиной адхармы войны", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 80}]}, {"verse_id": "5.58.144", "verse": "144", "sanskrit_iast": "vānarāṇāṃ prabhavo 'yaṃ na kena viditaḥ purā । devatānāṃ sakāśaṃ ca ye gacchanti nimantritāḥ ॥144॥", "leonov_ru": "Кому не известна прежде мощь обезьян, Которые идут к богам, призванные [ими]?»", "commentary": {"tilaka": "वानराणामिति । एवं च लङ्कानाशने वानरा असमर्था न इति मन्तव्यमिति भावः । \"राघवाणाम्\" इति पाठे मनुष्यो ऽसमर्थ इति न मन्तव्यमिति भावः ।। 5.58.144,145 ।।\n\nमत्प्रभावं वरदानं लब्ध्वा वध्यत्वरूपम् ।। 5.58.146,147 ।।\n\nनैवम् अयमवध्य इत्यर्थः । एष निश्चय एतद्वधनिश्चयः संलक्ष्यते विचार्यते"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.144:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Рядом с самими богами / Идем мы по их приглашению (devatānāṃ sakāśaṃ ca ye gacchanti nimantritāḥ) - автор комментария “Бхушана” полагает, что боги звали обезьян на помощь во время войн со своими врагами. Эта же точка зрения изложена в комментарии “Таттвадипика”. Однако, как отмечают Голдмены, в индийской мифологии не встречаются подобные эпизоды (если не считать самой “Рамаяны”) (см.: Goldman 1984: 521). Автор комментария “Тилака” приводит вариант rāghavāṇām (потомков Рагху) вместо vānarāṇām (обезьян).", "service": [], "suggestions": [], "seq": 81}, {"id": "phase2:5.58.144:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vānarāṇāṃ prabhavaḥ", "note_ru": "Тилака приводит вариант чтения «rāghavāṇām» («[мощь] потомков Рагху») вместо «vānarāṇām» («обезьян»): в таком варианте стих утверждает не безвестность силы обезьян, а то, что людей (Рагхавов) не следует считать неспособными — иная текстологическая и риторическая логика довода Ханумана.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "подстрочник передаёт только один вариант чтения (vānarāṇām); Тилака фиксирует альтернативное чтение rāghavāṇām, меняющее адресата довода Ханумана с обезьян на людей", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 82}]}, {"verse_id": "5.58.149", "verse": "149", "sanskrit_iast": "dūtavadhyā na dṛṣṭā hi rājaśāstreṣu rākṣasa । dūtena veditavyaṃ ca yathābhihitavādinā ॥149॥", "leonov_ru": "Ибо не указано (не позволено) убийство в шастрах правления, ракшас. Вестником должно быть сообщено [послание] как было оно сказано [пославшим].", "commentary": {"bhusana": "दूतवध्या न दृष्टा हि राजशास्त्रेषु राक्षस ।\n\nदूतेन वेदितव्यं च यथार्थं हितवादिना\nराक्षसाः सिद्धसन्नाहास्ततस्ते चण्डविक्रमाः ।\n\nतदा ऽदह्यन्त मे पुच्छं निघ्नन्तः काष्ठमुष्टिभिः ।\n\nबद्धस्य बहुभिः पाशैर्यन्त्रितस्य च राक्षसैः\nयन्त्रितस्य आवृतस्य", "siromani": "तत्रापि हेतुमाह दूतेति । राजशास्त्रे दूतवध्या दूतानां वधो न दृष्टा किंतु दूतेनोक्तमिति शेषः, वेदितव्यमेव"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "lexical:5.58.149:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dūta-vadhyā", "note_ru": "Дута-вадхья (dūta-vadhyā) — «убийство посла» (dūta «посол» + vadhyā «[тот], кого следует убить»; vadhya — gerundive от √vadh-). MW: dūta «посланник, гонец»; vadhya «заслуживающий смерти». В речи Вибхишаны (V.58.148-149) звучит редкий в эпосе эксплицитный политико-правовой аргумент: «убийство посланца не практикуется в rāja-śāstra». Ср. Артхашастра I.16: dūta неприкосновенен даже при враждебных отношениях. Тем самым Равана нарушает не только личную дхарму, но и политическое право. Этот аргумент Вибхишаны — один из ключевых моментов его образа как носителя легитимных ценностей.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:dUta+KAS.I.16", "source_links": [{"label": "MW dUta", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=dUta"}], "seq": 83}]}, {"verse_id": "5.58.152", "verse": "152", "sanskrit_iast": "tatas tasya vacaḥ śrutvā mama pucchaṃ samantataḥ । veṣṭitaṃ śaṇavalkaiś ca paṭṭaiḥ kārpāsakais tathā ॥152॥", "leonov_ru": "Тогда услышав его слова мой хвост, со всех сторон Обернутый веревками из конопли и тканью, сделанной из хлопка, тогда", "commentary": {"siromani": "तत इति । तस्य रावणस्य विभीषणो नाम यो भ्राता तेन मम कारणात् राक्षसराजो याचितः\nतत इति । तस्य रावणस्य वचः श्रुत्वा मम पुच्छं शणवल्कादिभिर्वेष्टितम्", "bhusana": "ततस्तस्य वचः श्रुत्वा पुच्छं समन्ततः ।\n\nवेष्टितं शणवल्कैश्च जीर्णैः कार्पासजैः पटैः\nततस्ते राक्षसाः शूरा बद्धं मामग्निसंवृतम् ।\n\nअघोषयन् राजमार्गे नगरद्वारमागताः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "lexical:5.58.152:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śaṇa-valka", "note_ru": "Шана-валька (śaṇa-valka, n.) — «кора/волокно конопли» (śaṇa «конопля, Cannabis sativa; Crotalaria juncea» + valka «кора, луб дерева»). MW: śaṇa «конопля, джут»; valka «кора дерева». В V.58.152 хвост Ханумана обматывают śaṇa-valka вместе с kārpāsaka (хлопковыми тканями) перед поджогом. Реалия эпического быта: медленно горящее волокно выбрано намеренно для публичного позора, а не мгновенного уничтожения. Нарративный парадокс: именно этот инструмент наказания превращается в орудие сожжения Ланки (V.58.158) — сам наказывающий создаёт инструмент собственного поражения.", "type": "Б", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:zaNa+dic_mw:valka", "source_links": [{"label": "MW zaNa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=zaNa"}, {"label": "MW valka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=valka"}], "seq": 84}]}, {"verse_id": "5.58.155", "verse": "155", "sanskrit_iast": "tatas te rākṣasāḥ śūrā baddhaṃ mām agnisaṃvṛtam । aghoṣayan rājamārge nagaradvāram āgatāḥ ॥155॥", "leonov_ru": "Тогда отважные ракшасы, громко крича, Что я связан и пожран пламенем, пришли по царской дороге к городским воротам.", "commentary": {"siromani": "तत इति । ते राक्षसाः नगरद्वारमागताः सन्तः अग्निसंवृतं मां राजमार्गे अघोषयन्\nतत इति । अहम् आत्मनो बन्धं विमोचयित्वा विमोच्य प्रकृतिस्थः सन् स्थितो ऽस्मीति शेषः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.155:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "О винах моих возглашая (mām... aghoṣayan) - букв. “огласили меня”. Переведено в соответствии с V, 53, 22.", "service": [], "suggestions": [], "seq": 85}]}, {"verse_id": "5.58.158", "verse": "158", "sanskrit_iast": "pucchena ca pradīptena tāṃ purīṃ sāṭṭagopurām । dahāmy aham asambhrānto yugāntāgnir iva prajāḥ ॥158॥", "leonov_ru": "Пылающим хвостом тот город с башнями и воротами Сжег я без страха, словно огонь в конце юги – живые существа.", "commentary": {"bhusana": "इति शोकसमाविष्टश्चिन्तामहमुपागतः", "siromani": "पुच्छेनेति । पुच्छेन पुरीं लङ्कां दहामि अदहम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "lexical:5.58.158:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "yugānta-agni", "note_ru": "Юганта-агни (yugānta-agni, m.) — «огонь конца юги» (yuga «мировой период» + anta «конец» + agni «огонь»). MW: yuga «ярмо; мировой период»; agni «огонь». Стандартная гиперболическая формула для апокалиптического огня: Хануман, поджигающий Ланку, сравнивается с огнём, уничтожающим мироздание в конце эона (V.58.158: «как огонь конца юги сжигает живых существ»). Та же формула применяется к огню Рудры в МБх. Структурная функция: метафора югантагни выводит сожжение Ланки за пределы частного подвига в масштаб космического события — а тем самым и возвращение Ситы приобретает космическую необходимость.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:yuga+dic_mw:agni", "source_links": [{"label": "MW yuga", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=yuga"}, {"label": "MW agni", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=agni"}], "seq": 86}]}, {"verse_id": "5.58.161", "verse": "161", "sanskrit_iast": "iti śokasamāviṣṭaś cintām aham upāgataḥ । tato 'haṃ vācam aśrauṣaṃ cāraṇānāṃ śubhākṣarām ॥161॥", "leonov_ru": "Так встревожился я, охваченный скорбью. Тогда услышал я благие (каждый слог которых был благ) слова небожителей,", "commentary": {"bhusana": "अथाहं वाचमश्रौषं चारणानां शुभाक्षराम् ।\n\nजानकी न च दग्धेति विस्मयोदन्तभाषिताम्\nविस्मयोदन्तभाषितां भाषितविस्मयोदन्ताम्, उक्ताद्भुतवार्तामित्यर्थः । विस्मयवृत्तान्तव्यवहृतामिति वा\nततो मे बुद्धिरुत्पन्ना श्रुत्वा तामद्भुतां गिरम् ।\n\nअदग्द्धा जानकीत्येवं निमित्तैश्चोपलक्षिता\nनिमित्तैश्चोपलक्षिता शकुनादिभिश्च सीता न दग्धेति ज्ञातेत्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-58", "notes": [{"id": "tier1:5.58.161:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "небожителей", "kind": "note", "text": "комм, что это чараны"}], "suggestions": [], "seq": 87}, {"id": "edition:5.58.161:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.58.161 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.58.161", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.58.161", "iast": "iti śokasamāviṣṭaś cintām aham upāgataḥ । tato 'haṃ vācam aśrauṣaṃ cāraṇānāṃ śubhākṣarām ॥161॥"}], "collision_tier1": true, "seq": 88}]}, {"verse_id": "5.58.163", "verse": "163", "sanskrit_iast": "adagdhā jānakīty evaṃ nimittaiś copalakṣitam । dīpyamāne tu lāṅgūle na māṃ dahati pāvakaḥ ॥163॥", "leonov_ru": "«Не сгор

"note_ru": "Стал Хануман раздумывать (hanūmān dhyānam āsthitaḥ) – в некоторых вариантах вместо dhyānam стоит sthānam āsthitaḥ «вернулся на [прежнее] место».[Е. Костина] «caityaprāsādo» Комм о \"форме\" дворца, поскольку ниже будет в комм про это говориться"}, {"id": "phase2:5.43.1:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "caityaprāsāda", "note_ru": "«Дворец-святилище» (caityaprāsāda) — по Бхушане, здание в форме святилища божества (caityaṃ devāyatanam, tadrūpaḥ prāsādaḥ), а не обычный дворец: именно эта архитектурная форма и делает его разрушение особым подвигом Ханумана. Это и есть комментарий о «форме» дворца, которого недоставало примечанию Костиной к этому стиху.", "type": "В", "source_commentary": ["bhusana"], "why_proposed": "даёт формальное определение архитектурной формы caityaprāsāda, которое Костина прямо запросила в своей пометке к этому стиху, но не получила.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.43.4", "verse": "4", "sanskrit_iast": "āruhya girisaṃkāśaṃ prāsādaṃ hariyūthapaḥ । babhau sa sumahātejāḥ pratisūrya ivoditaḥ ॥4॥", "leonov_ru": "Поднявшись на дворец, подобный горе, вождь обезьяньих стай Обладающий великой мощью, был подобен второму солнцу.", "commentary": {"tilaka": "प्रासादमुत्प्लुत्यारुरोह ।। 5.43.3,4 ।।\n\nसंप्रधृष्य भङ्क्त्वा । पारियात्रः पर्वतविशेषः । औन्नत्यं साधारणो धर्मः", "bhusana": "आरुह्य गिरिसङ्काशं प्रासादं हरियूथपः ।\n\nबभौ स सुमहातेजाः प्रतिसूर्य इवोदितः", "siromani": "आरुह्येति । प्रासादमारुह्य उदितः प्रतिसूर्य इव हरियूथपो बभौ"}, "has_tier1": false, "notes": [{"id": "lexical:5.43.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pratisūrya", "note_ru": "Пратисурья (prati-sūrya, m.) — бахуврихи или тат-пуруша в значении «второе солнце» (prati- «напротив, другой» + sūrya «солнце»). MW: pratisūrya 'a mock-sun, parahelion'. Подстрочник даёт «второе солнце» нейтрально; ключевой нюанс — что в санскритской традиции pratisūrya это оптическое явление (паргелий, «ложное солнце»), а не просто метафора. Хануман, взобравшийся на дворец, воспринимается как астральный феномен — зрительно точный образ, а не просто гипербола величия.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:pratisUrya"}, {"id": "phase2:5.43.4:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "pratisūrya", "note_ru": "По Бхушане, сравнение Ханумана со «вторым солнцем» (pratisūrya) на дворце означает не только оптический эффект ложного солнца, но и указывает на время действия — восход настоящего солнца (anena sūryodayaḥ sūcitaḥ), то есть штурм святилища происходит на рассвете.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "восстанавливает временную привязку эпизода (рассвет), не отражённую ни в подстрочнике, ни в существующем лексическом примечании (которое разбирает только оптику паргелия).", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "edition:5.43.4:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.43.4 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.43.4", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.43.4", "iast": "āruhya girisaṃkāśaṃ prāsādaṃ hariyūthapaḥ । babhau sa sumahātejāḥ pratisūrya ivoditaḥ ॥4॥"}]}]}, {"verse_id": "5.43.5", "verse": "5", "sanskrit_iast": "sampradhṛṣya tu durdharṣaś caityaprāsādam unnatam । hanūmān prajvalaṃl lakṣmyā pāriyātropamo 'bhavat ॥5॥", "leonov_ru": "Разрушив же высокий святилище-дворец, непобедимый Хануман, сияющий великолепием, был подобен [горе] Париятре", "commentary": {"bhusana": "संप्रधृष्य च दुर्धर्षं चैत्यप्रासादमुत्तमम् ।\n\nहनुमान् प्रज्वलन् लक्ष्म्या पारियात्रोपमो ऽभवत्", "siromani": "समिति । चैत्यप्रासादं संप्रधृष्य पराभवं प्रापय्य लक्ष्म्या स्वविजयसंपत्त्या प्रज्वलन् हनूमान् पारियात्रोपमकुलाचलसदृशः अभवत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.43.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…разрушил / Этот дворец высокий (sampradhṛṣya tu caityaprāsādam unnatam) Букв. «напав же… на возвышающийся дворец, [имеющий форму] ступы». Автор комментария «Тилака» глоссирует sampradhṛṣya как bhaṅktvā (разрушив). Иную интерпретацию дает автор комментария «Бхушана», который толкует это слово как «напав/взобравшись» (ākramya). Голдмены согласны с последним и переводят: «When the invincible monkey… had scaled that lofty palace». (Когда непобедимая обезьяна.. взобралась на тот высокий дворец»; см.: Goldman 1984: 230).Париятра – одна из семи высочайших гор Джамбудвипы наряду с горами Махендра, Малайя, Сахья, Шуктимат, Рикшапарвата и Виндхья. Париятра упоминается также в четвертой книге «Рамаяны» (IV, 41,16)."}, {"id": "lexical:5.43.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pāriyātra", "note_ru": "Париятра (pāriyātra, m.) — одна из семи горных цепей (kulaparvata), традиционно разделяющих субконтинент. В эпической космографии pāriyātra (иначе pāripātra) — западная горная гряда, возможно, отождествляемая с Виндхья или Аравалли. MW: pāriyātra 'name of one of the 7 principal mountain chains'. Подстрочник не именует гору; сравнение «Хануман был подобен Париятре» имплицирует ощущение постоянного, неприступного горного массива — не единственной вершины (как Меру), а цепи, воспринимаемой как монолит.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:pAriyAtra", "collision_tier1": true}]}, {"verse_id": "5.43.8", "verse": "8", "sanskrit_iast": "astravijjayatāṃ rāmo lakṣmaṇaśca mahābalaḥ । rājā jayati sugrīvo rāghaveṇābhipālitaḥ ॥8॥", "leonov_ru": "«Победа великому лучнику (или «владеющему оружием богов») Раме и могучему Лакшмане! Победа царю Сугриве, находящемуся под защитой Рагхавы!", "commentary": {"bhusana": "अस्त्रविज्जयतां रामो लक्ष्मणश्च महाबलः ।\n\nराजा जयति सुग्रीवो राघवेणाभिपालितः"}, "has_tier1": false, "notes": [{"id": "lexical:5.43.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "astravij", "note_ru": "Астравидж (astra-vij / astra-vid, adj./m.) — «знающий оружие», от astra (n., «метательное оружие, боевое заклинание», √as- «метать», Whitney #155) + vid («знающий», √vid- «знать»). MW: astravid 'skilled in missiles'. Ключевое отличие от dhanurdhar («держащий лук»): astravid — владение оружием мистическим, формульным (astravidyā); такой воин поражает оружием «словесно», то есть владеет заклинательными формулами. Провозглашение «Победа астравидже Раме» (jayatāṃ rāmo 'stravij) — не просто военная формула, а утверждение принадлежности Рамы к высшему классу героев, владеющих brahma-astra и др.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:astravid"}, {"id": "crosstext:5.43.8:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.43.8", "work_label": "Rām", "verse_address": "Rām 6.32.13 (крит. изд.)", "parallel_sa_iast": "jayatyatibalo rāmo lakṣmaṇaśca mahābalaḥ |rājā jayati sugrīvo rāghaveṇābhipālitaḥ ||", "sundara_sa_iast": "jayatyatibalo rāmo lakṣmaṇaśca mahābalaḥ |rājā jayati sugrīvo rāghaveṇābhipālitaḥ ||", "quality": "GOOD", "source": "DCS parallel-search (GOOD); Rām 6.32.13 (крит. изд.)", "edition_flag": "vulgate", "shloka_critical": "V.41.6", "verse_address_vulgate": ""}]}, {"verse_id": "5.43.9", "verse": "9", "sanskrit_iast": "dāso 'haṃ kosalendrasya rāmasyākliṣṭakarmaṇaḥ । hanumāñ śatrusainyānāṃ nihantā mārutātmajaḥ ॥9॥", "leonov_ru": "Я слуга владыки Косалы, Рамы, неутомимого в деяниях, Хануман, губитель вражеских ратей, сын ветра.", "commentary": {"bhusana": "दासो ऽहं कोसलेन्द्रस्य रामस्याक्लिष्टकर्मणः ।\n\nहनुमान् शत्रुसैन्यानां निहन्ता मारुतात्मजः"}, "has_tier1": false, "notes": [{"id": "lexical:5.43.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "akliṣṭakarman", "note_ru": "Аклиштакарман (a-kliṣṭa-karman, adj.) — бахуврихи: a- (отрицание) + kliṣṭa (p.p.p. от √kliś- «мучить, страдать», Whitney #618: «uttered with pain; oppressed») + karman «деяние». MW: akliṣṭa 'unwearied'. Стандартный перевод «неутомимый в делах» скрывает более точное значение: «тот, чьи деяния не отмечены страданием/усилием» — то есть действующий с лёгкостью, чьи подвиги даются без надрыва. Это особый эпитет, отличающий Раму от vīra «храброго» (действующего через усилие): Рама совершает дхармические деяния как бы естественно, без видимого напряжения.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:aklifwa"}]}, {"verse_id": "5.43.15", "verse": "15", "sanskrit_iast": "ājagmur vānaraśrēṣṭhaṃ bāṇaiś cādityasannibhaiḥ । āvarta iva gaṅgāyāstoyasya vipulo mahān ॥15॥", "leonov_ru": "Приблизились к лучшему из обезьян со стрелами, [сияющими] подобно солнцу, Словно великий широкий водоворот в водах Ганга,", "commentary": {"tilaka": "महान्मारुतात्मज इत्यन्वयः", "bhusana": "आवर्त इव गङ्गायास्तोयस्य विपुलो महान् ।\n\nपरिक्षिप्य हरिश्रेष्ठं स बभौ रक्षसां गणः", "siromani": "आवर्त इति । गङ्गायाः तोयस्य महान् आवर्त इव विपुलो रक्षसां गणः हरिश्रेष्ठं परिक्षिप्य गदादिभिः संताड्य बभौ"}, "has_tier1": false, "notes": [{"id": "edition:5.43.15:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.43.15 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.43.15", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.43.15", "iast": "ājagmur vānaraśrēṣṭhaṃ bāṇaiś cādityasannibhaiḥ । āvarta iva gaṅgāyāstoyasya vipulo mahān ॥15॥"}]}]}, {"verse_id": "5.43.18", "verse": "18", "sanskrit_iast": "tatas taṃ bhrāmayām āsa śatadhāraṃ mahābalaḥ । tatra cāgniḥ samabhavat prāsādaś cāpy adahyata ॥18॥", "leonov_ru": "Тогда стал вертеть [ее], имеющую сотню концов (подобную ваджре) наделенный великой силой, И там возник огонь, и дворец запылал.", "commentary": {"siromani": "तत इति । तातो ऽनन्तरं वातात्मजः क्रुद्धो ऽभवदिति शेषः । अर्धं पृथक्\nप्रासादस्येति । महान् हनूमान् शतधारं तं प्रसिद्धं प्रासादस्य स्तम्भं वेगेन उत्पाटयित्वा उत्पाट्य भ्रामयामास । तत्र तस्मिन् अग्निः समभवत् । अत एव प्रासादो ऽदह्यत । श्लोकद्वयमेकान्वयि ।। 5.43.17,18 ।।\n\nदह्यमान इति । स हनूमान् प्रासादं दह्यमानं दृष्ट्वा वज्रेण असुरान् इन्द्र इव राक्षसशतं हत्वा अन्तरिक्षस्थितः सन् इदमब्रवीत् । सार्द्धश्लोक एकान्वयी", "tilaka": "उत्पाटयित्वा तं शतधारं स्तम्भं भ्रामयामास । तत्र च भ्राम्यमाणे स्तम्भान्तरेण घट्टनवशादग्निः समभवत्तेन प्रासादश्चाप्यदह्यत", "bhusana": "तत्र चाग्निः समभवत् प्रासादश्चाप्यदह्यत"}, "has_tier1": true, "notes": [{"id": "tier1:5.43.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…подобную ваджре (śatadhāram) – букв. «имеющую сотню вершин». Переведено по комментарию «Бхушана», автор которого глоссирует «подобную ваджре» (vajravat sthitam). Также он предлагает иную интерпретацию: śatadhā aram (śīghram), то есть «в ста направлениях» и «стремительно»."}, {"id": "lexical:5.43.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śatadhāra", "note_ru": "Шатадхара (śata-dhāra, adj.) — «обладающий сотней острий», эпитет колонны (stambha), используемой как оружие. śata «сто» + dhārā «острие, лезвие, кромка» (√dhṛ «нести, держать» в значении «точёный край»). MW: dhāra 'edge or blade of a sword'; śatadhāra 'having 100 edges' — стандартный эпитет vajra (молнии-оружия Индры). Перебрасывая stambha-śatadhāra, Хануман имплицитно уподобляется Индре с его ваджрой: это не случайная деталь, а формульное сравнение, подчёркнутое в V.43.19 прямым сравнением с Индрой.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:SataDAra+dic_mw:vajra", "collision_tier1": true}, {"id": "edition:5.43.18:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.43.18 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.43.18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.43.18", "iast": "tatas taṃ bhrāmayām āsa śatadhāraṃ mahābalaḥ । tatra cāgniḥ samabhavat prāsādaś cāpy adahyata ॥18॥"}], "collision_tier1": true}]}, {"verse_id": "5.43.21", "verse": "21", "sanskrit_iast": "balināṃ vānarendrāṇāṃ sugrīvavaśavartinām । aṭanti vasudhāṃ kṛtsnāṃṅ vayam anye ca vānarāḥ ॥21॥", "leonov_ru": "Могучих владык обезьян, верных слуг Сугривы. Обошли всю землю мы и другие обезьяны.", "commentary": {"bhusana": "अटन्ति वसुधां कृत्स्नां वयमन्ये च वानराः"}, "has_tier1": false, "notes": [{"id": "edition:5.43.21:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.43.21–24 (4 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.43.21–24", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.43.21", "iast": "balināṃ vānarendrāṇāṃ sugrīvavaśavartinām । aṭanti vasudhāṃ kṛtsnāṃṅ vayam anye ca vānarāḥ ॥21॥"}, {"verse_id": "5.43.22", "iast": "daśanāgabalāḥ kecit kecid daśaguṇottarāḥ । kecin nāgasahasrasya babhūvus tulyavikramāḥ ॥22॥"}, {"verse_id": "5.43.23", "iast": "santi caughabalāḥ kecit kecid vāyubalopamāḥ यं पुरी लङ्का नास्ति नङ्क्ष्यतीत्यर्थः । यूयं न रावणश्च न । अर्धद्वयमेकान्वयि"}, "has_tier1": false, "notes": [{"id": "lexical:5.43.25:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ikṣvāku", "note_ru": "Икшваку (ikṣvāku, m.) — прародитель солнечной династии (sūryavaṃśa), первый царь Айодхьи, сын Ману. Этимологическая традиция: ikṣu «сахарный тростник» + āku (неопределённое расширение) или от √ikṣ «видеть» (Апте). MW: ikṣvāku 'Name of the son of Manu Vaivasvata and first king of the solar race'. Формула «герой из рода Икшваку» (ikṣvākuvīra) в устах Ханумана — перед лицом ракшасов Ланки — значима: Рама идентифицируется не по имени, а через dynastynamic legitimacy — принадлежность к solar line, чья dharmic власть предшествует любым демоническим претензиям.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:ikzvAku+dic_apte:ikzvAku"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};

  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

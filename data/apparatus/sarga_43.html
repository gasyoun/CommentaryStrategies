кшапарвата и Виндхья. Париятра упоминается также в четвертой книге «Рамаяны» (IV, 41,16).", "service": [], "suggestions": [], "seq": 6}, {"id": "lexical:5.43.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pāriyātra", "note_ru": "Париятра (pāriyātra, m.) — одна из семи горных цепей (kulaparvata), традиционно разделяющих субконтинент. В эпической космографии pāriyātra (иначе pāripātra) — западная горная гряда, возможно, отождествляемая с Виндхья или Аравалли. MW: pāriyātra 'name of one of the 7 principal mountain chains'. Подстрочник не именует гору; сравнение «Хануман был подобен Париятре» имплицирует ощущение постоянного, неприступного горного массива — не единственной вершины (как Меру), а цепи, воспринимаемой как монолит.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:pAriyAtra", "source_links": [{"label": "MW pAriyAtra", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=pAriyAtra"}], "collision_tier1": true, "seq": 7}]}, {"verse_id": "5.43.8", "verse": "8", "sanskrit_iast": "astravijjayatāṃ rāmo lakṣmaṇaśca mahābalaḥ । rājā jayati sugrīvo rāghaveṇābhipālitaḥ ॥8॥", "leonov_ru": "«Победа великому лучнику (или «владеющему оружием богов») Раме и могучему Лакшмане! Победа царю Сугриве, находящемуся под защитой Рагхавы!", "commentary": {"bhusana": "अस्त्रविज्जयतां रामो लक्ष्मणश्च महाबलः ।\n\nराजा जयति सुग्रीवो राघवेणाभिपालितः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-43", "notes": [{"id": "lexical:5.43.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "astravij", "note_ru": "Астравидж (astra-vij / astra-vid, adj./m.) — «знающий оружие», от astra (n., «метательное оружие, боевое заклинание», √as- «метать», Whitney #155) + vid («знающий», √vid- «знать»). MW: astravid 'skilled in missiles'. Ключевое отличие от dhanurdhar («держащий лук»): astravid — владение оружием мистическим, формульным (astravidyā); такой воин поражает оружием «словесно», то есть владеет заклинательными формулами. Провозглашение «Победа астравидже Раме» (jayatāṃ rāmo 'stravij) — не просто военная формула, а утверждение принадлежности Рамы к высшему классу героев, владеющих brahma-astra и др.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:astravid", "source_links": [{"label": "MW astravid", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=astravid"}], "seq": 8}, {"id": "crosstext:5.43.8:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.43.8", "work_label": "Rām", "verse_address": "Rām 6.32.13 (крит. изд.)", "parallel_sa_iast": "jayatyatibalo rāmo lakṣmaṇaśca mahābalaḥ |rājā jayati sugrīvo rāghaveṇābhipālitaḥ ||", "sundara_sa_iast": "jayatyatibalo rāmo lakṣmaṇaśca mahābalaḥ |rājā jayati sugrīvo rāghaveṇābhipālitaḥ ||", "quality": "GOOD", "source": "DCS parallel-search (GOOD); Rām 6.32.13 (крит. изд.)", "source_links": [], "edition_flag": "vulgate", "shloka_critical": "V.41.6", "verse_address_vulgate": "", "seq": 9}]}, {"verse_id": "5.43.9", "verse": "9", "sanskrit_iast": "dāso 'haṃ kosalendrasya rāmasyākliṣṭakarmaṇaḥ । hanumāñ śatrusainyānāṃ nihantā mārutātmajaḥ ॥9॥", "leonov_ru": "Я слуга владыки Косалы, Рамы, неутомимого в деяниях, Хануман, губитель вражеских ратей, сын ветра.", "commentary": {"bhusana": "दासो ऽहं कोसलेन्द्रस्य रामस्याक्लिष्टकर्मणः ।\n\nहनुमान् शत्रुसैन्यानां निहन्ता मारुतात्मजः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-43", "notes": [{"id": "lexical:5.43.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "akliṣṭakarman", "note_ru": "Аклиштакарман (a-kliṣṭa-karman, adj.) — бахуврихи: a- (отрицание) + kliṣṭa (p.p.p. от √kliś- «мучить, страдать», Whitney #618: «uttered with pain; oppressed») + karman «деяние». MW: akliṣṭa 'unwearied'. Стандартный перевод «неутомимый в делах» скрывает более точное значение: «тот, чьи деяния не отмечены страданием/усилием» — то есть действующий с лёгкостью, чьи подвиги даются без надрыва. Это особый эпитет, отличающий Раму от vīra «храброго» (действующего через усилие): Рама совершает дхармические деяния как бы естественно, без видимого напряжения.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:aklifwa", "source_links": [{"label": "MW aklifwa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=aklifwa"}], "seq": 10}]}, {"verse_id": "5.43.15", "verse": "15", "sanskrit_iast": "ājagmur vānaraśrēṣṭhaṃ bāṇaiś cādityasannibhaiḥ । āvarta iva gaṅgāyāstoyasya vipulo mahān ॥15॥", "leonov_ru": "Приблизились к лучшему из обезьян со стрелами, [сияющими] подобно солнцу, Словно великий широкий водоворот в водах Ганга,", "commentary": {"tilaka": "महान्मारुतात्मज इत्यन्वयः", "bhusana": "आवर्त इव गङ्गायास्तोयस्य विपुलो महान् ।\n\nपरिक्षिप्य हरिश्रेष्ठं स बभौ रक्षसां गणः", "siromani": "आवर्त इति । गङ्गायाः तोयस्य महान् आवर्त इव विपुलो रक्षसां गणः हरिश्रेष्ठं परिक्षिप्य गदादिभिः संताड्य बभौ"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-43", "notes": [{"id": "edition:5.43.15:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.43.15 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.43.15", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.43.15", "iast": "ājagmur vānaraśrēṣṭhaṃ bāṇaiś cādityasannibhaiḥ । āvarta iva gaṅgāyāstoyasya vipulo mahān ॥15॥"}], "seq": 11}]}, {"verse_id": "5.43.18", "verse": "18", "sanskrit_iast": "tatas taṃ bhrāmayām āsa śatadhāraṃ mahābalaḥ । tatra cāgniḥ samabhavat prāsādaś cāpy adahyata ॥18॥", "leonov_ru": "Тогда стал вертеть [ее], имеющую сотню концов (подобную ваджре) наделенный великой силой, И там возник огонь, и дворец запылал.", "commentary": {"siromani": "तत इति । तातो ऽनन्तरं वातात्मजः क्रुद्धो ऽभवदिति शेषः । अर्धं पृथक्\nप्रासादस्येति । महान् हनूमान् शतधारं तं प्रसिद्धं प्रासादस्य स्तम्भं वेगेन उत्पाटयित्वा उत्पाट्य भ्रामयामास । तत्र तस्मिन् अग्निः समभवत् । अत एव प्रासादो ऽदह्यत । श्लोकद्वयमेकान्वयि ।। 5.43.17,18 ।।\n\nदह्यमान इति । स हनूमान् प्रासादं दह्यमानं दृष्ट्वा वज्रेण असुरान् इन्द्र इव राक्षसशतं हत्वा अन्तरिक्षस्थितः सन् इदमब्रवीत् । सार्द्धश्लोक एकान्वयी", "tilaka": "उत्पाटयित्वा तं शतधारं स्तम्भं भ्रामयामास । तत्र च भ्राम्यमाणे स्तम्भान्तरेण घट्टनवशादग्निः समभवत्तेन प्रासादश्चाप्यदह्यत", "bhusana": "तत्र चाग्निः समभवत् प्रासादश्चाप्यदह्यत"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-43", "notes": [{"id": "tier1:5.43.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…подобную ваджре (śatadhāram) – букв. «имеющую сотню вершин». Переведено по комментарию «Бхушана», автор которого глоссирует «подобную ваджре» (vajravat sthitam). Также он предлагает иную интерпретацию: śatadhā aram (śīghram), то есть «в ста направлениях» и «стремительно».", "service": [], "suggestions": [], "seq": 12}, {"id": "lexical:5.43.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śatadhāra", "note_ru": "Шатадхара (śata-dhāra, adj.) — «обладающий сотней острий», эпитет колонны (stambha), используемой как оружие. śata «сто» + dhārā «острие, лезвие, кромка» (√dhṛ «нести, держать» в значении «точёный край»). MW: dhāra 'edge or blade of a sword'; śatadhāra 'having 100 edges' — стандартный эпитет vajra (молнии-оружия Индры). Перебрасывая stambha-śatadhāra, Хануман имплицитно уподобляется Индре с его ваджрой: это не случайная деталь, а формульное сравнение, подчёркнутое в V.43.19 прямым сравнением с Индрой.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:SataDAra+dic_mw:vajra", "source_links": [{"label": "MW SataDAra", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=SataDAra"}, {"label": "MW vajra", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=vajra"}], "collision_tier1": true, "seq": 13}, {"id": "edition:5.43.18:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.43.18 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.43.18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.43.18", "iast": "tatas taṃ bhrāmayām āsa śatadhāraṃ mahābalaḥ । tatra cāgniḥ samabhavat prāsādaś cāpy adahyata ॥18॥"}], "collision_tier1": true, "seq": 14}]}, {"verse_id": "5.43.21", "verse": "21", "sanskrit_iast": "balināṃ vānarendrāṇāṃ sugrīvavaśavartinām । aṭanti vasudhāṃ kṛtsnāṃṅ vayam anye ca vānarāḥ ॥21॥", "leonov_ru": "Могучих владык обезьян, верных слуг Сугривы. Обошли всю землю мы и другие обезьяны.", "commentary": {"bhusana": "अटन्ति वसुधां कृत्स्नां वयमन्ये च वानराः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-43", "notes": [{"id": "edition:5.43.21:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.43.21–24 (4 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.43.21–24", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.43.21", "iast": "balināṃ vānarendrāṇāṃ sugrīvavaśavartinām । aṭanti vasudhāṃ kṛtsnāṃṅ vayam anye ca vānarāḥ ॥21॥"}, {"verse_id": "5.43.22", "iast": "daśanāgabalāḥ kecit kecid daśaguṇottarāḥ । kecin nāgasahasrasya babhūvus tulyavikramāḥ ॥22॥"}, {"verse_id": "5.43.23", "iast": "santi caughabalāḥ kecit kecid vāyubalopamāḥ । aprameyabalāḥ kecit tatrāsan hariyūthapāḥ ॥23॥"}, {"verse_id": "5.43.24", "iast": "īdṛgvidhais tu haribhir vṛto dantanakhāyudhaiḥ । śataiḥ śatasahasraiś ca koṭībhiś cāyutair api ॥24॥"}], "seq": 15}]}, {"verse_id": "5.43.22", "verse": "22", "sanskrit_iast": "daśanāgabalāḥ kecit kecid daśaguṇottarāḥ । kecin nāgasahasrasya babhūvus tulyavikramāḥ ॥22॥", "leonov_ru": "Некоторые сильны, словно десять слонов, некоторые в десять раз сильнее, Некоторые были равны в мощи тысяче слонов.", "commentary": {"bhusana": "दशनागबलाः केचित् केचिद्दशगुणोत्तराः ।\n\nकेचिन्नागसहस्रस्य बभूवुस्तुल्यविक्रमाः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-43", "notes": [{"id": "lexical:5.43.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "daśanāgabala", "note_ru": "Дашанагабала (daśa-nāga-bala, adj.) — «[имеющий] силу десяти слонов» — стандартная единица измерения эпической силы. nāga здесь = слон (не змей; «слоновая» семантика: nāga как «гора» и как «слон» связаны через образ тяжести). Эпическая шкала: 1 nāga (слон) → 10 nāga (daśanāgabala) → nāgasahasra (1000 слонов) → «равен ветру» (вершина шкалы, V.43.23). Трёхступенчатая шкала в стихах 22–23 — нарратив компетентности: Хануман перечисляет своих соратников в порядке возрастающей мощи, кульминируя «непостижимо сильными» (aprameyabala) вождями.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:nAga+dic_mw:daSanAgabala", "source_links": [{"label": "MW nAga", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=nAga"}, {"label": "MW daSanAgabala", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=daSanAgabala"}], "seq": 16}]}, {"verse_id": "5.43.25", "verse": "25", "sanskrit_iast": "āgamiṣyati sugrīvaḥ sarveṣāṃ vo niṣūdanaḥ । neyam asti purī laṅkā na yūyaṃ na ca rāvaṇaḥ । yasya tv ikṣvākuvīreṇa baddhaṃ vairaṃ mahātmanā ॥25॥", "leonov_ru": "Придет Сугрива, который уничтожит вас всех. Не будет ни города Ланки, ни вас, ни Раваны, У которого завязана вражда с великим духом героем из рода Икшваку».", "commentary": {"bhusana": "नेयमस्ति पुरी लङ्का न यूयं न च रावणः ।\n\nयस्मादिक्ष्वाकुनाथेन बद्धं वैरं महात्मना", "siromani": "नेति । इक्ष्वाकुवीरेण महात्मना यस्येदं वैरं बद्धं प्रवृद्धं तस्य इयं पुरी लङ्का नास्ति नङ्क्ष्यतीत्यर्थः । यूयं न रावणश्च न । अर्धद्वयमेकान्वयि"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-43", "notes": [{"id": "lexical:5.43.25:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ikṣvāku", "note_ru": "Икшваку (ikṣvāku, m.) — прародитель солнечной династии (sūryavaṃśa), первый царь Айодхьи, сын Ману. Этимологическая традиция: ikṣu «сахарный тростник» + āku (неопределённое расширение) или от √ikṣ «видеть» (Апте). MW: ikṣvāku 'Name of the son of Manu Vaivasvata and first king of the solar race'. Формула «герой из рода Икшваку» (ikṣvākuvīra) в устах Ханумана — перед лицом ракшасов Ланки — значима: Рама идентифицируется не по имени, а через dynastynamic legitimacy — принадлежность к solar line, чья dharmic власть предшествует любым демоническим претензиям.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:ikzvAku+dic_apte:ikzvAku", "source_links": [{"label": "MW ikzvAku", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ikzvAku"}, {"label": "APTE ikzvAku", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=ikzvAku"}], "seq": 17}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

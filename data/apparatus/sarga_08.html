raṃ girer yathā ॥6॥"}, {"verse_id": "5.8.7", "iast": "vahanti yat kuṇḍalaśobhitānanā । mahāśanā vyomacarā niśācarāḥ । vivṛttavidhvastaviśālalocanā । mahājavā bhūtagaṇāḥ sahasraśaḥ ॥7॥"}, {"verse_id": "5.8.8", "iast": "vasantapuṣpotkaracārudarśanaṃ । vasantamāsād api cārudarśanam । sa puṣpakam tatra vimānamuttamaṃ । dadarśa tad vānaravīrasattamaḥ ॥8॥"}], "collision_tier1": true}]}, {"verse_id": "5.8.2", "verse": "2", "sanskrit_iast": "tadaprameyapratikārakṛtrimaṃ । kṛtaṃ svayaṃ sādhviti viśvakarmaṇā । divaṃ gataṃ vāyupathe pratiṣṭhitaṃ । vyarājatādityapathasya lakṣma tat ॥2॥", "leonov_ru": "Она, не имеющая равных себе, украшенная изображениями, Сделав которую, сам Вишвакарман сказал: «Славно», Пребывающая на пути ветра, идущему по небу, Сияла [словно] счастливый знак на пути солнца.", "commentary": {"tilaka": "अप्रमेयप्रतिकारकृत्रिममप्रमेयैरपरिच्छेद्यसौन्दर्यादिभिः प्रतिकारैः प्रतिमादिभिः कृत्रिमं निर्वृत्तचित्रशोभम् । पाठान्तरं त्वसांप्रदायिकमिति कतकः । विश्वकर्मणा च स्वयं साध्विति कृतम् मन्निर्मितेष्विदमतिसाध्वित्यनुमोदितमित्यर्थः । दिवमाकाशं गते वायुपथे प्रतिष्ठितम्, वायुपथस्यैवादित्यपथत्वात्तस्य चिह्नभूतम्", "bhusana": "तदप्रमेया ऽप्रतिकारकृत्रिमं कृतं स्वयं साध्विति विश्वकर्मणा ।\n\nदिवं गतं वायुपथप्रतिष्ठितं व्यराजतादित्यपथस्य लक्ष्मवत्\nतदिति । अप्रतिमेया ऽप्रतिकारकृत्रिमम् अपरिच्छेद्याप्रतिक्रियकृत्रिमम् । तत्र हेतुमाह कृतं स्वयं साध्विति । विश्वकर्मणा स्वयं निर्मात्रा विश्वकर्मणा इदं साधु सुन्दरमिति श्लाघापूर्वं कृतम् । सर्वत्राप्रतिहतसञ्चारं चैतदित्याह दिवं गतम् आकाशगतम् । वायुपथप्रतिष्ठितं वायुमार्गभूतान्तरिक्षस्थितम् । मध्ये भवनस्य संश्थितमिति पूर्वमुक्तत्वात् भूतलप्रत्यासन्नान्तरिक्षस्थितमित्यर्थः । आदित्यपथस्य लक्ष्मवत् लक्ष्म लक्षणं व्यावर्तकम्, व्यराजत प्रचकाश इत्यर्थः", "siromani": "तदिति । अप्रमेयैः सौन्दर्यादिभिः प्रमातुमशक्यैः प्रतिकारैः प्रतिमाभिः कृत्रिमं रचितम् विश्वकर्मणा स्वयं साधु निर्मितमितिहेतोर्दिवङ्गते वायुपथे प्रतिष्ठितम् अत एव आदित्यपथस्य लक्ष्मवत् बोधकमिव तद्विमानं व्यराजत । आदित्यपथ इति वायुपथस्य नामान्तरमिति न विरोधः"}, "has_tier1": true, "notes": [{"id": "tier1:5.8.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Равных ей не было, дивно украшенной (tadaprameyapratikārakṛtrimam) – комментаторы поясняют, что не было ей равных «красотой и тому подобным» (saundaryādibhiḥ)."}, {"id": "lexical:5.8.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "viśvakarman", "note_ru": "Вишвакарман (viśvakarman, m.) — «сотворивший всё», vi+śva+karman (или viśva «всё» + karman «деяние/творение»). MW: viśvakarman 'the all-creating god; the architect and artificer of the gods'. В Ригведе (10.81–82) Вишвакарман — творец вселенной, «видящий всё, знающий всё» (viśvadarśata, viśvavid). В эпосе роль сужается до главного архитектора богов — он строит небесные города (Двараку для Кришны, Ланку — изначально для якшей). Примечательно V.8.2: Вишвакарман, завершив Пушпаку, сказал «sādhu» («отлично, хорошо сделано») — единственный случай в эпосе, когда мастер сам хвалит своё произведение. Это указывает на исключительность вимāны.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:viSvakarman", "collision_tier1": true}, {"id": "phase2:5.8.2:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tadaprameyapratikārakṛtrimam", "note_ru": "По Тилаке, у этого места известен вариант чтения (пāṭхāнтара), но, по замечанию Катаки, он нетрадиционен (асāмпрадāйика); перевод следует основному чтению.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "типовый пример текстологического замечания о варианте чтения с именем ссылающегося авторитета (Катака), отсутствующий в подстрочнике и в собственной заметке Леонова/Костиной.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.8.4", "verse": "4", "sanskrit_iast": "tapassamādhānaparākramārjitaṃ । manassamādhānavicāracāriṇam । anekasaṃsthānaviṣeṣanirmitaṃ । tatas tatas tulyaviśeṣanirmitam ॥4॥", "leonov_ru": "Обретенную аскетическими подвигами и отвагой, Двигавшуюся по воле мысли [своего хозяина], Сделанную из материалов, собранных в разных местах, Повсюду имеющую одинаковое великолепие,", "commentary": {"tilaka": "तपसोपवासादिना समाधानेन भगवति चित्तसमाधानेन लब्धो यः पराक्रमस्तेन रावणार्जितम् । मनःसमाधानेन यत्र विचारो गमनस्य तत्र सञ्चरणशीलं मनःसङ्कल्पितदेशगमनशीलम् । संस्थानविशेषा रचनाविशेषाः । ततस्ततस्तस्मात्तस्मादाहृतेन तुल्येन दिव्यविमाननिर्माणोचितेन विशेषेण विशिष्टपदार्थेन निर्मितम्", "siromani": "तप इति । तपस्समाधानाभ्यां कृच्छ्रचान्द्रायणादिदेवविशेषध्यानाभ्यां जातेन पराक्रमेण अर्जितं रावणेन प्राप्तं मनस्समाधानस्य एकाग्रमनसः विचारेण गमनेनेव चारोगमनमस्त्यस्मिन् तम् अर्धर्चादित्वात्पुंस्त्वं संज्ञापूर्वकविधेरनित्यत्वाल्लुगभावो वा । अनेकैर्बहुभिः संस्थानविशेषैः विलक्षणावयवैः निर्मितं मनोवेगत्वात् विलक्षणवयवविशिष्टत्वाच्च हेतोः तुल्यविशेषयोर्निर्मितं प्रक्षेपो यस्मात् । समाधिकरहितमित्यर्थः"}, "has_tier1": false, "notes": [{"id": "lexical:5.8.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tapas", "note_ru": "Тапас / аскеза (tapas) — tapas — аскетический жар/подвиг; согласно «Тилаке», «разогрев» тела позволяет аскету достичь сверхъестественных способностей. В кн. V — мотив праведности Ситы как аскетки.", "type": "А", "subtype": "base", "trigger": "term", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}, {"id": "lexical:5.8.4:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tapas_siddhi", "note_ru": "Механизм тапас→сиддхи (tapas «аскеза» → siddhi «совершенство/сверхспособности») — центральный для эпической сотериологии: герой или демон накапливает тапас, боги вынуждены пожаловать ему вару, и тем самым тапас превращается в мирскую силу. Равана накопил тапас, получил вару от Брахмы — это объясняет непобедимость Ланки. В V.8.4 Пушпака-виман описан как «tapassamādhānaparākramārjitaṃ» — «достигнутый через аскезу, сосредоточение и доблесть»: виман как материализация тапаса Раваны. Гринцер разворачивает этот механизм уже в первых страницах к кн. I.", "type": "Г", "subtype": "hist_cultural", "trigger": "myth_background", "source": "MW s.v. tapas_siddhi; Гринцер, кн. I–III"}]}, {"verse_id": "5.8.5", "verse": "5", "sanskrit_iast": "manaḥ samādhāya tu śīghragāminaṃ । durāsadaṃ mārutatulyagāminam । mahātmanāṃ puṇyakṛtāṃ mahārddhināṃ । yaśasvinām agryamudām ivālayam ॥5॥", "leonov_ru": "Стремительно летящую по воле мысли, Недоступную [для грешников], скоростью равную ветру, Словно бы обитель для великих духом, добродетельных, Наделенных богатством (аскезы), наделенных великим счастьем,", "commentary": {"bhusana": "तपः समाधानपराक्रमार्जितं मनःसमाधानविचारचारिणम् ।\n\nअनेकसंश्तानाविशेषनिर्मितं ततस्ततस्तुल्यविशेषदर्शनम्\nतपस्समाधानेत्यादि पञ्चश्लोकी कुलकम् । सर्वत्र ददर्शेति संबन्धः ।\n\nतपस्समाधानपराक्रमार्जितं तपस्समाधानेन तपोनुष्ठानेन पराक्रमेण च अर्जितम् । मनस्समाधानविचारचारिणं समाधानमभिसन्धानम् । कर्मणि चैतत् । विचारो विविदा गतिः । मनोभिसंहितविविधगतिचारिणम् । अनेकसंस्थानविशेषनिर्मितम् । अनेकैस्संस्थानविशेषैः विमानगोपुरादिसन्निवेशैः निर्मितम् । ततस्ततस्तुल्यविशेषदर्शनम् तत्र तत्र तुल्यं विशेषदर्शनं यस्मिन्\nमनस्समाधाय तु शीघ्रगामिनं दुरावरं मारुततुल्यगामिनम् ।\n\nमहात्मनां पुण्यकृतां महर्द्धिनां यशस्विनामग्र्य मुदामिवालयम्\nमनस्समाधाय मन एकाग्रीकृत्य । स्वयं मनस्वीति यावत् । दुरावरं दुर्वारम् । महर्द्धिनां महर्द्धीनाम् । \"अपि माषं मषं कुर्याच्छन्दोभङ्गं न कारयेत्\" इत्युक्तरीत्या वृत्तभङ्गभिया ह्रस्वोच्चारणम् । अग्र्यमुदाम् इन्द्रादीनाम्", "tilaka": "मनःसमाधाय स्वामिमनो ऽनुरुध्य तु शीघ्रगामित्वादिधर्मकं दुरासदम् पापिभिरिति शेषः । \"दुरावरम्\" इति पाठे शत्रुभिर्दुर्निवारमित्यर्थः । महर्द्धिनाम् दीर्घाभावश्छान्दसः । एवं तुल्यगामिनमित्यत्र पुंस्त्वम् । विमानशब्दो ऽर्धर्चादिर्वा । अग्र्यमुदां महासुखानां पुण्यकृतामेवालयमास्पदम् इवशब्द एवार्थे । अत्र तस्याचेतनत्वे ऽपि तदभिमानिदेवतायाश्चित्तज्ञत्वादिति बोध्यम्", "siromani": "मनस्समाधाय स्वामिमनोनुसृत्यैव शीघ्रगामिदुरासदं पराभवितुमशक्यं महर्द्धिनां महत् ऋद्धं तपोवृद्धिरस्ति येषु तेषाम् । एतेन दीर्घाभाव आर्ष इति भट्टोक्तिश्चिन्त्या महात्मनामग्र्यमुदाम् अत्यानन्दानामालयमिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.8.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Богатых аскезой… (mahārddhināṃ) – букв. «обладающих великим богатством». В комментарии «Широмани» поясняется, что имеется в виду богатство накопленных аскетическими подвигами заслуг."}, {"id": "phase2:5.8.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "durāsadam / durāvaram", "note_ru": "По Тилаке, чтение durāsadam подразумевает эллипсис «недоступная для грешников»; вариант durāvaram меняет смысл на «неприступная для врагов»; перевод следует основному чтению и его толкованию, что уже отражено в вставке подстрочника «[для грешников]».", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "даёт второй вариант чтения с иным оттенком смысла и показывает, что подстрочник уже следует основному чтению Тилаки, а не варианту.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.8.6", "verse": "6", "sanskrit_iast": "viśeṣam ālambya viśeṣasaṃsthitaṃ । vicitrakūṭam bahukūṭamaṇḍitam । mano’abhirāmaṃ śaradindunirmalaṃ । vicitrakūṭaṃ śikharaṃ girer yathā ॥6॥", "leonov_ru": "Великолепно двигающуюся, великолепно стоящую, С прекрасной вершиной, украшенную множеством выступов, Восхищающую душу, чистую, словно осенняя луна, Подобную вершине горы с чудесными пиками,", "commentary": {"tilaka": "विशेषं गतिविशेषमालम्ब्य । विशेषे व्योमलक्षणदेशविशेषे संस्थितम् विचित्राणामाश्चर्यवस्तूनां कूटं समवायभूतम् बहुभिः कूटैः शालाभिर्मण्डितम् गिरेर्विचित्रावान्तरशृङ्गवच्छिखरमिव", "bhusana": "विशेषमालम्ब्य विशेषसंस्थितं विचित्रकूटं बहुकूटमण्डितम् ।\n\nमनोभिरामं शरदिन्दुनिर्मलं विचित्रकूटं शिखरं गिरेर्यथा\nविशेषमिति । विशेकमालम्ब्य विशेषसंस्थितं विशेषं गृहीत्वा विशेषेण संस्थितम् । सविशेषणविशेषसंस्थितमिति यावत् । सविशेषसंश्थानविशेषविशिष्टमित्यर्थः । कूटानां विचित्रत्वबहुत्वे विशेषणद्वयेन दर्शयति विचित्रेत्यादिना । विचित्रकूटं शिखरं गिरेर्यथा । कूटम् अवान्तरशृङ्गम्, शिखरं महाशृङ्गमिति प्रयोगादवधार्यते", "siromani": "विशेषं विशेषगमनादि आलम्ब्य विशेषे वायुपथे संस्थितं विचित्राणि कूटानि शिखराणि यस्मिन् तत् बहुकूटमण्डितं समीपस्थबहुकूटैः शोभितम् अत एव मनोभिरामं विचित्रकूटं गिरेः शिखरं यथा शृङ्गमिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.8.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Превосходно по небу летающую (viśeṣam ālambya viśeṣasaṃsthitaṃ) – комментаторы поясняют, что в первый раз слово viśeṣa обозначает «превосходный в движении и тому подобном», во втором это слово употреблено в значении небо (в комментарии «Широмани» - vāyupathe «на дороге ветра»)."}]}, {"verse_id": "5.8.7", "verse": "7", "sanskrit_iast": "vahanti yat kuṇḍalaśobhitānanā । mahāśanā vyomacarā niśācarāḥ । vivṛttavidhvastaviśālalocanā । mahājavā bhūtagaṇāḥ sahasraśaḥ ॥7॥", "leonov_ru": "Которую несли летающие по небу, не знающие сна, Чьи лица украшены серьгами, едящие много пищи, С бегающими, немигающими, широкими глазами, Наделенные огромной скоростью тысячи бхутов,", "commentary": {"tilaka": "उच्यमानविशेषणा भूतगणा यद्वहन्ति तद्विमानं तत्र ददर्शेत्यन्वयः । विवृत्तानि निघूर्णानि विध्वस्तानि त्यक्तनिमेषाणि विशालानि लोचनानि येषाम् । निशाचरा निशास्वप्यहरविशेषं चरन्ति ते", "bhusana": "वहन्ति यं कुण्डलशोभितानना महाशना व्योमचरा निशाचराः ।\n\nविवृत्तविध्वस्तविशाललोचना महाजवा भूतगणाः सहस्रशः\nवहन्तीति । यं यत् । आर्षो व्यत्ययः । महाशनाः महाकाया इत्यर्थः । व्योमचराः व्योमचरसदृशसंस्थानाः । विवृत्तविध्वस्तविशाललोचनाः विवृत्तानि वर्तुलानि विध्वस्तानि भुग्नानि विशालानि लोचनानि येषां ते तथा । महाजवाः महाजवा इव स्थिताः । भूतगणाः गोपुरवाहका इव प्रतिमारूपेण स्थिताः । अन्यथा रावणान्तःपुरे पुरुषसञ्चारायोगात् कामगस्य विमानस्य वहनासंभवाच्च । यद्वा शिबिकावाहका इव भूतगणा अधोभागे वहन्ति । तद्वारैणैव कामगत्वमपि, चेतनप्रेरणं विना अचेतनसञ्चारस्यात्यन्तमनुचितत्वाच्च", "siromani": "निशाचराः निशायामधिकं चरणशीलाः विवृतानि आघूर्णितानि विध्वस्तानि निमेषरहितानि विशालानि लोचनानि येषां ते सहस्रशो भूतगणा यं वहन्ति तत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.8.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Бессонных (niśācarāḥ) – обычно в «Рамаяне» слово niśācara (ходящий по ночам) обозначает ракшасов. Здесь, согласно комментаторам, оно обозначает способность духов (bhūtaganāḥ) передвигаться не только днем, но и ночью."}, {"id": "phase2:5.8.7:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bhūtagaṇāḥ ... vahanti", "note_ru": "Бхушана поясняет кажущуюся несообразность: бхуты-носильщики изображены не как живые существа, а как изваяния-носители у городских ворот (как на гопурах), поскольку живым мужчинам нельзя находиться во внутренних покоях Раваны, а движение неодушевлённого без разумного движителя неуместно.", "type": "В", "source_commentary": ["bhusana"], "why_proposed": "решает скрытую в подстрочнике несообразность (живые духи в гареме Раваны) через реалию образной системы (статуи-носители), не данную ни в подстрочнике, ни в tier-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.8.8", "verse": "8", "sanskrit_iast": "vasantapuṣpotkaracārudarśanaṃ । vasantamāsād api cārudarśanam । sa puṣpakam tatra vimānamuttamaṃ । dadarśa tad vānaravīrasattamaḥ ॥8॥", "leonov_ru": "Прекрасную обликом благодаря множеству весенних цветов, Более прекрасную, чем даже весенняя пора, Ту Пушпаку там, лучшую из виман, Увидел лучший герой среди обезьян.", "commentary": {"tilaka": "अथ विशिष्य पुष्पकं वर्णयितुमाह-- स इति । मणिरत्नैर्मणिश्रेष्ठैश्चित्रितं प्रतप्तजाम्बूनदजालानां तन्मयगवाक्षाणां कृत्रिमं कृतिर्यस्मिंस्तत्तस्य भवनस्य रावणगृहस्य मध्ये महद्विमानं पुष्पकं ददर्श\nवसन्तपुष्पोत्करचारुदर्शनं वसन्तकालिकपुष्पसमूहेन चारुदर्शनम्", "bhusana": "वसन्तपुष्पोत्करचारुदर्शनं वसन्तमासादपि कान्तदर्शनम् ।\n\nस पुष्पकं तत्र विमानमुत्तमं ददर्श तद्वानरवीरसत्तमः\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे अष्टमः सर्गः ।। 5.8।।\n\nइति श्रीगोविन्दराजविरचिते श्रीरामायणभूषणे श्रृङ्गारतिलकाख्याने सुन्दरकाण्डव्याख्याने अष्टमः सर्गः", "siromani": "वसन्तपुष्पोत्करेण वसन्तकालिकपुष्पसमूहेन चारु दर्शनं यस्य अत एव वसन्तमासात् वसन्तकालादपि चारु दर्शनं यस्य तत् विमानसत्तमं पुष्पकं वानरवीरसत्तमो हनूमान् ददर्श । श्लोकपञ्चकमेकान्वयि"}, "has_tier1": false, "notes": [{"id": "lexical:5.8.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "puṣpaka", "note_ru": "Пушпака (puṣpaka) — puspaka (пушпака) — воздушная колесница, первоначально принадлежавшая Кубере, захваченная Раваной. «Бхушана»: «движется куда пожелает повелитель» (yathecchagāmī). Первое появление в кн. V.", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};

  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

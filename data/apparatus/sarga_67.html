const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 67, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 45, "verses_with_notes": 19, "notes_by_layer": {"tier1": 13, "lexical": 10, "phase2": 4, "edition": 1, "crosstext": 3}}, "sarga": 67, "verses": [{"verse_id": "5.67.2", "verse": "2", "sanskrit_iast": "idam uktavatī devī jānakī puruṣarṣabha । pūrvavṛttam abhijñānaṃ citrakūṭe yathā tatham ॥2॥", "leonov_ru": "«Вот что сказала царевна Джанаки, о бык среди мужей, О том, что некогда случилось на горе Читракута в качестве тайного знака.", "commentary": {"bhusana": "इदमुक्तवती देवी जानकी पुरुषर्षभ ।\n\nपूर्ववृत्तमभिज्ञानं चित्रकूटे यथातथम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.67.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pūrvavṛtta", "note_ru": "Пурвавритта (pūrva-vṛtta, n.) — «прежде случившееся, прошлое событие», pūrva («прежний, первый») + vṛtta (p.p.p. от √vṛt-, «вращаться, происходить», Whitney #543). MW: pūrva 'former, prior'; vṛtta 'happened, occurred; an occurrence, event'. В контексте abhijñāna-сцены pūrvavṛttam несёт конкретную нагрузку: это не просто «воспоминание» (smṛti), а событие, которое оба участника пережили и которое поэтому служит криптографическим ключом. Слово стоит рядом с abhijñāna («знак подлинности»): pūrvavṛttam abhijñānam = «прежнее событие как знак». Выбор именно события с вороной на Читракуте функционально значим: рассказ об унижении Ситы и гневе Рамы — информация, которую не мог знать посторонний, а Равана не мог подделать.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:pUrvavftta+warnemyr(vRt)"}, {"id": "lexical:5.67.2:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "citrakūṭa", "note_ru": "Читракута (Citrakūṭa, m.) — «дивный пик», citra («пёстрый, дивный») + kūṭa («вершина, пик»). MW: citrakūṭa 'wonderful peak', топоним: современный Читракот в Бунделькханде, на реке Пайасуни (~80 км к юго-востоку от Банды). Место первого лесного поселения изгнанных Рамы и Лакшманы; упоминается уже в Вальмики как sacredspace вне рода. Эпизод с вороной (67.3–17), который называется «произошедшим на Читракуте», функционирует как сжатая рамка аранья-канды: выбор именно этого места удостоверяет подлинность воспоминания и авторитетность abhijñāna. См. примеч. к I.1.32 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:citrakUwa"}]}, {"verse_id": "5.67.3", "verse": "3", "sanskrit_iast": "sukhasuptā tvayā sārdhaṃ jānakī pūrvam utthitā । vāyasaḥ sahasotpatya virarāda stanāntaram ॥3॥", "leonov_ru": "Джанаки, которая счастливо спала вместе с тобой, первая проснулась. Внезапно слетела ворона и ранила ее в грудь.", "commentary": {"bhusana": "पूर्वं सङ्कुचितं विस्तृणीते सुखेत्यादिना । उभावपि पर्यायेण सुप्ताविति त्वया सार्धमित्युक्तम्\nयथा च स महाबाहुर्मां तारयति राघवः ।\n\nअसमाद्दुःखाम्बुसंरोधात्त्वं समाधातुमर्हसि"}, "has_tier1": false, "notes": [{"id": "phase2:5.67.3:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "paryāyeṇa suptau", "note_ru": "По Бхушане, «счастливо спали вместе» (sukhasuptā tvayā sārdham) не значит, что оба спали одновременно всю ночь: комментарий поясняет, что Рама и Сита спали поочерёдно (paryāyeṇa), сменяя друг друга на страже, — отсюда и то, что именно Джанаки «проснулась первой» (pūrvam utthitā) в момент нападения вороны.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "снимает кажущееся противоречие подстрочника («спали вместе» vs. «проснулась первой») — Бхушана уточняет, что сон был посменным, а не одновременным; ни у Леонова/Костиной, ни в Phase-1 на этот стих пояснения нет.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.67.8", "verse": "8", "sanskrit_iast": "nakhāgraiḥ kena te bhīru dāritaṃ tu stanāntaram । kaḥ krīḍati saroṣeṇa pañcavaktreṇa bhoginā ॥8॥", "leonov_ru": "«О робкая, кто ногтями (когтями) изранил твою грудь? Кто играет с разъяренной змеей, у которой пять пастей (с распахнутой пастью)?»", "commentary": {"bhusana": "नखाग्रैः केन ते भीरु दारितं तु स्तनान्तरम् ।\n\nकः क्रीडति सरोषेण पञ्चवक्त्रेण भोगिना"}, "has_tier1": true, "notes": [{"id": "tier1:5.67.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Со змеей разъяренной (pañcavaktreṇa bhoginā) – букв. «со змеей с пятью пастями». См. комментарий к V, 38, 25."}]}, {"verse_id": "5.67.9", "verse": "9", "sanskrit_iast": "nirīkṣamāṇaḥ sahasā vāyasaṃ samudaikṣathāḥ । nakhaiḥ sarudhirais tīkṣṇais tām evābhimukhaṃ sthitam ॥9॥", "leonov_ru": "Оглядевшись, ты внезапно заметил ворону, У которой острые когти были в крови, которая сидела, повернувшись к ней (Сите).", "commentary": {"bhusana": "निरीक्षमाणः सहसा वायसं समवैक्षथाः ।\n\nनखैः सरुधिरैस्तीक्ष्णैस्तामेवाभिमुखं स्थितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.67.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «tām evābhimukhaṃ» опущено, что ворон смотрит на Ситу"}]}, {"verse_id": "5.67.10", "verse": "10", "sanskrit_iast": "sutaḥ kila sa śakrasya vāyasaḥ patatāṃ varaḥ । dharāntaragataḥ śīghraṃ pavanasya gatau samaḥ ॥10॥", "leonov_ru": "Та ворона была сыном Шакры, лучшим из летающих (птиц), Которая стремительно летала по земле, равная скоростью ветру.", "commentary": {"tilaka": "रादितम् । दारितमित्यर्थः ।। 5.67.8,9 ।।\n\nधरान्तरगतः पातालस्थः", "bhusana": "सुतः किल स शक्रस्य वायसः पततां वरः ।\n\nधरान्तरचरः शीघ्रं पवनस्य गतौ समः"}, "has_tier1": true, "notes": [{"id": "tier1:5.67.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Мчался по всей земле он (dharāntaragataḥ) – в комментарии «Тилака» это слово трактуется как «пребывающий в подземном мире (Патале)» (pātālasthaḥ), в то время как в комментарии к строфе V, 38, 27 выражение dharāntaraṃ gataḥ толкуется как bhūmibilaṃ prāptaḥ (влетевший в отверстие в земле)."}, {"id": "lexical:5.67.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "patatāṃ vara", "note_ru": "Паtatāṃ вара (patatāṃ varaḥ) — «лучший из летающих», родительный падеж мн.ч. от √pat- («лететь», Whitney #191) + vara «лучший, избранный» (√vṛ-, Whitney #612). Стандартный эпический эпитет птиц; здесь применён к вороне — сыну Индры. Формула patatāṃ vara в позиции апозиции к vāyasaḥ («ворона») создаёт разрыв между ничтожностью птицы-вредителя и её божественным происхождением: ворона одновременно «насильник» и «избранный из летающих». Этот разрыв мотивирует реакцию Рамы: brahmaāstra против вороны — это не несоразмерный ответ, а признание ранга противника.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "warnemyr(pat)+dic_mw:vara", "collision_tier1": true}]}, {"verse_id": "5.67.11", "verse": "11", "sanskrit_iast": "tatas tasmin mahābāho kopasaṃvartitekṣaṇaḥ । vāyase tvaṃ vyadhāḥ krūrāṃ matiṃ matimatāṃ vara ॥11॥", "leonov_ru": "Тогда, о мощнорукий, в гневе вращая глазами, Принял ты жестокое решение относительно вороны, о лучший из мудрецов.", "commentary": {"tilaka": "व्यधा अकृथाः", "bhusana": "ततस्तस्मिन् महाबाहो कोपसंवर्तितेक्षणः ।\n\nवायसे त्वं कृथाः क्रूरां मतिं मतिमतां वर"}, "has_tier1": false, "notes": [{"id": "lexical:5.67.11:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "matimatāṃ vara", "note_ru": "Матиматāм вара (matimatāṃ varaḥ) — «лучший из мудрых», родительный мн.ч. от matimat (mati «ум, мысль» от √man-, Whitney #665 + суфф. -mat) + vara «лучший». MW: mati 'thought, design, intention; understanding, intellect'. Matimat «наделённый мыслью / умом» — в этом стихе обращение к Раме (matimatāṃ vara) полемически иронично: «лучший из умных» — и при этом medha не приведена в действие. Это продолжение мотива вопроса Ситы (67.19–23): «почему ты, мощный и умный, не действуешь?». Формула matimatāṃ vara перекликается с sattvavān śīlavān api («наделённый силой и добродетелью», 67.18) — Сита и подтверждает, и упрекает через одни и те же формулы. Ср. аналогичное обращение в dharma-контексте (ниже 67.16).", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:mati+warnemyr(man)"}, {"id": "crosstext:5.67.11:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "tvad", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.67.11", "work_label": "Rām", "verse_address": "Rām 5.36.25 (крит. изд.)", "parallel_sa_iast": "tatastasminmahābāhuḥ kopasaṁvartitekṣaṇaḥ |vāyase kṛtavān krūrāṁ matiṁ matimatāṁ vara ||", "sundara_sa_iast": "tatastasminmahābāho kopasaṁvartitekṣaṇaḥ |vāyase tvaṁ kṛthāḥ krūrāṁ matiṁ matimatāṁ vara ||", "quality": "GOOD", "source": "DCS parallel-search (GOOD); Rām 5.36.25 (крит. изд.)", "edition_flag": "vulgate", "shloka_critical": "V.65.11", "verse_address_vulgate": "Rām V.38.28 (вульгата)"}]}, {"verse_id": "5.67.12", "verse": "12", "sanskrit_iast": "sa darbhasaṃstarād gṛhya brahmāstreṇa nyayojayaḥ । sa dīpta iva kālāgnir jajvālābhimukhaḥ khagam ॥12॥", "leonov_ru": "Взяв из циновки стебель травы, наделил ты его силой оружия Брахмы. Загоревшись, он (стебель), словно огонь конца времен полыхнул в направлении птицы.", "commentary": {"tilaka": "दर्भसंस्तरादेकं कुशं गृह्य गृहीत्वेत्यर्थः", "bhusana": "स दर्भं संस्तराद् गृह्य ब्रह्मास्त्रेण ह्ययोजयः ।\n\nस दीप्त इव कालाग्निर्जज्वालाभिमुखः खगम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.67.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "…огонь, миры пожирающий (kālāgniḥ) – букв. «огонь времени», «разрушительный огонь при гибели мира». Согласно космологическим представлениям индийцев, мир, или Вселенная, претерпевает циклически три состояния в пределах каждой кальпы, или мирового периода: созидание, или становление (sarga), продолжительное существование (sthiti) и разрушение, или гибель (pralaya). Последнее сопровождается разрушительным огнем (kālāgni).[Е. Костина] «силой Брахмы,» нужен комм. про Брахмастру"}, {"id": "lexical:5.67.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "brahmāstra", "note_ru": "Брахмастра (brahma-astra, n.) — «оружие (astra) Брахмы»: боевое заклинание, направляющее разрушительную силу Брахмы в материальный снаряд или жест. MW: brahmāstra 'Brahma's missile, a mythical weapon which deals infallible destruction'. Характерная черта brahmaāstra: его нельзя использовать впустую (mogham astraṃ na śakyaṃ tu kartum, 67.16) — оружие обязано поразить что-нибудь. Именно поэтому Рама не отзывает его, а перенаправляет на глаз вороны. Активируется через darbha — стебель травы куши (kuśa), наделяемый мантрой. Формула указывает на эпическую концепцию видов оружия (astra) как обитаемых вооружёнными силами богов, отличных от бытового метательного оружия (śastra).", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:brahmAstra", "collision_tier1": true}, {"id": "lexical:5.67.12:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kālāgni", "note_ru": "Калагни (kāla-agni, m.) — «огонь конца времён», kāla «время» (в значении «смерть, судьба») + agni «огонь». MW: kālāgni 'the fire that is to destroy the world, conflagration at the end of time'. Стандартная эпическая гипербола для оружия наивысшей разрушительной силы; ср. śokāgni (V.11.35) в той же Сундараканде. Особенность применения здесь: kālāgni используется для описания пылающего стебля дарбхи — bытовой предмет сравнивается с космическим разрушителем. Этот приём («малое = космически грандиозное» через сравнение iva) — устойчивая эпическая фигура для ситуации, когда гнев праведника превосходит ожидания.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:kAlAgni", "collision_tier1": true}]}, {"verse_id": "5.67.15", "verse": "15", "sanskrit_iast": "punar apy āgatas tatra tvatsakāśam āriṃdama । tvaṃ taṃ nipatitaṃ bhūmau śaraṇyaḥ śaraṇāgatam ॥15॥", "leonov_ru": "Снова прилетела она к тебе, о губитель врагов, Ее, упавшую на землю, ищущую прибежища, ты, дарующий прибежище,", "commentary": {"bhusana": "पुनरेवागतस्त्रस्तस्त्वकाशमरिन्दम ।\n\nस तं निपतितं भूमौ शरण्यः शरणागतम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.67.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śaraṇāgata", "note_ru": "Шаранагата (śaraṇa-āgata, adj.) — «пришедший за защитой, ищущий прибежища», śaraṇa («защита, укрытие», от √śarma-, Whitney #196) + āgata (p.p.p. от ā+√gam-). MW: śaraṇāgata 'one who comes for refuge or protection, a refugee'. Дхармический принцип śaraṇāgata-rakṣaṇa («защита обратившегося за прибежищем») — один из фундаментальных обязательств кшатрийской дхармы: śaraṇāgataṃ rakṣet «защити пришедшего за защитой». Рама защищает ворону (vadhārhām api... kṛpayā paripālayaḥ, 67.16) именно потому, что она приняла позу śaraṇāgata. Этот эпизод — одна из ключевых «демонстраций» dharmaśīla Рамы в Сундараканде, параллельная защите Вибхишаны в последующих книгах.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:SaraRAgata"}]}, {"verse_id": "5.67.16", "verse": "16", "sanskrit_iast": "vadhārham api kākutstha kṛpayā paripālayaḥ । mogham astraṃ na śakyaṃ tu kartum ity eva rāghava ॥16॥", "leonov_ru": "Хотя и заслуживающую смерти, Какутстха, из жалости защитил (спас). Но [сказал ты], Рагхава: «Невозможно использовать напрасно оружие богов»", "commentary": {"tilaka": "परिपालयः पर्यपालयः । शरीरावधेनेति भावः । इत्येवेति हेतोः", "bhusana": "वधार्हमपि काकुत्स्थ कृपया पर्यपालयः\nमोघमस्त्रं न शक्यं तु कर्तुमित्येव राघव ।\n\nभवांस्तस्याक्षि काकस्य हिनस्ति स्म स दक्षिणम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.67.16:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mogha", "note_ru": "Могха (mogha, adj.) — «напрасный, пустой, безрезультатный», от √muh- («теряться, ошибаться», Whitney #1028). MW: mogha 'fruitless, vain, useless'. В контексте brahmaāstra mogham astraṃ na śakyaṃ tu kartum — «нельзя сделать оружие богов напрасным» — это техническая аксиома эпической системы астра: once activated, an astra must strike something. Отсюда выбор Рамы: не отозвать заклинание (невозможно), а перенаправить его на минимальный урон — глаз вороны. Термин mogha здесь — не просто «напрасно», а правовая/ритуальная категория: неиспользованное оружие богов загрязняет того, кто его активировал.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:mogha+warnemyr(muh)"}, {"id": "phase2:5.67.16:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kṛpayā paripālayaḥ", "note_ru": "По Тилаке, «из жалости защитил» (kṛpayā paripālayaḥ) означает не полное прощение, а пощаду только телу вороны (śarīrāvadhena) — оружие Брахмы всё равно должно было поразить цель, поэтому Рама одновременно и спасает ворону от смерти, и наносит ей увечье (ослепление на один глаз в следующем стихе): это не смягчение кары, а компромисс между состраданием и неотвратимостью брахмастры.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "разрешает видимое противоречие между «пощадил из жалости» и последующим ослеплением вороны — Тилака поясняет, что пощада касалась только жизни (тела), а не действия оружия; ни подстрочник, ни существующий Phase-1-разбор mogha/brahmāstra на V.67.12/16 этого сопряжения не отмечают.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.67.2024", "verse": "2024", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"tilaka": "हे राम रणे तव त्वां प्रति समासितुं न शक्तास्तथा तद्वत् काकवदित्यर्थः । संभ्रमं आदरः"}, "has_tier1": false, "notes": [{"id": "lexical:5.67.2024:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "duṣkṛta", "note_ru": "Душкрита (duṣ-kṛta, n.) — «дурно совершённое, грех», duṣ- (приставка ухудшения) + kṛta (p.p.p. от √kṛ-, «делать»). MW: duṣkṛta 'evil action, sin, guilt; wickedly done'. В эпосе duṣkṛta — конкретный грех как причинно-следственный акт кармы: Сита не риторически сетует, а рассуждает логически в терминах кармического объяснения (kiṃ cin mahad asti na saṃśayaḥ, «наверняка есть какой-то большой грех — сомнений нет»). Это самоанализ в категориях кармического права: страдание как следствие требует причины, причина — duṣkṛta. Сита не жалуется богам, а ищет собственную вину — что делает её образ неоднозначным с точки зрения धर्म: смирение перед кармой или самообвинение жертвы?", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:duzkfta", "anchor_verse_id": "5.67.23"}]}, {"verse_id": "5.67.25", "verse": "25", "sanskrit_iast": "punar apy aham āryāṃ tām idaṃ vacanam abruvam । tvacchokavimukho rāmo devi satyena te śape ॥25॥", "leonov_ru": "Снова я сказал той благородной такие слова: «Истинно клянусь тебе, царевна, что из-за скорби о тебе отвернулся Рама [от всего остального].", "commentary": {"tilaka": "त्वच्छोकविमुखस्त्वच्छोकेन कार्यान्तरविमुखः", "bhusana": "वैदेह्या वचनं श्रुत्वा करुणं साश्रुभाषितम् ।\n\nपुनरप्यहमार्यां तामिदं वचनमब्रुवम्\nत्वच्छोकविमुखो रामो देवि सत्येन ते शपे ।\n\nरामे दुःखाभिभूते तु लक्ष्मणः परितप्यते"}, "has_tier1": true, "notes": [{"id": "tier1:5.67.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Забыл все прочее Рама (tvacchokavimukho rāmaḥ) – букв. «Рама отвратил лицо из-за твоего горя». Автор комментария «Тилака» поясняет, что Рама отвратился от других дел (kāryāntaravimukhaḥ)."}]}, {"verse_id": "5.67.26", "verse": "26", "sanskrit_iast": "rāme duḥkhābhibhūte ca lakṣmaṇaḥ paritapyate । kathaṃ cid bhavatī dṛṣṭā na kālaḥ pariśocitum ॥26॥", "leonov_ru": "И когда Рама страдает от горя, мучается и Лакшмана. С трудом найдена ты [мной], госпожа, не время предаваться скорби.", "commentary": {"bhusana": "कथंचिद्भवती दृष्टा न कालः परिशोचितुम् ।\n\nइम मुहूर्तं दुःखानामन्तं द्रक्ष्यसि भामिनि", "tilaka": "भवती मया दृष्टा । अतः परं परिशोचितुं न कालस्तव योग्य इति शेषः । चिरं लङ्कायामासितुं न कालो योग्य इति पाठान्तरे ऽर्थः"}, "has_tier1": false, "notes": [{"id": "phase2:5.67.26:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "na kālaḥ pariśocitum", "note_ru": "В «Тилаке» у фразы «не время предаваться скорби» (na kālaḥ pariśocitum) отмечен вариант чтения (пāṭхāнтара): вместо «не время горевать» — «не время долго оставаться в Ланке» (ciraṃ laṅkāyām āsituṃ na kālaḥ); перевод следует основному чтению, но вариант меняет смысл реплики Ханумана — с утешения на предупреждение о спешке.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "фиксирует зафиксированный Тилакой вариант чтения, меняющий регистр реплики Ханумана (утешение → предупреждение о необходимости спешить); перевод следует основному чтению, но традиция знает альтернативу, не отмеченную ни в подстрочнике, ни у Леонова/Костиной, ни в Phase-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.67.27", "verse": "27", "sanskrit_iast": "asmin muhūrte duḥkhānām antaṃ drakṣyasi bhāmini । tāv ubhau naraśārdūlau rājaputrāv paraṃtapau ॥27॥", "leonov_ru": "В это мгновение (Скоро) конец бед увидишь ты, прекрасная. Оба тигра среди людей, царские сыновья, губители врагов,", "commentary": {"bhusana": "तावुभौ नरशार्दूलौ राजपुत्रावनिन्दितौ ।\n\nत्वद्दर्शनकृतोत्साहौ लङ्कां भस्मीकरिष्यतः"}, "has_tier1": true, "notes": [{"id": "tier1:5.67.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Скоро… (idaṃ muhūrtam) – в комментарии «Тилака» это выражение интерпретируется как «в эту самую минуту»."}]}, {"verse_id": "5.67.30", "verse": "30", "sanskrit_iast": "prītisaṃjananaṃ tasya pradātuṃ tat tvam arhasi । sābhivīkṣya diśaḥ sarvā veṇyudgrathanam uttamam ॥30॥", "leonov_ru": "Возникнет у него радость. Должна ты отдать его (тайный знак) [мне]. Оглядевшись по сторонам, она эту великолепную заколку", "commentary": {"tilaka": "वेण्युद्ग्रथनं वेण्यामुद्ग्रथनयोग्यम् ।। 5.67.30,31 ।।\n\nत्वरे त्वरावाञ्जात इत्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.67.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «заколку» Здесь уже не чудамани, а больше похоже на заколку, согласна"}, {"id": "phase2:5.67.30:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sābhivīkṣya diśaḥ sarvāḥ", "note_ru": "По Бхушане, Сита «оглядывается по сторонам» (sābhivīkṣya diśaḥ sarvāḥ) не из рассеянности, а из страха: она проверяет, не следят ли за ней ракшаси, чтобы не донести о переданном знаке Раване, — только убедившись в этом, она развязывает волосы и достаёт мани.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "раскрывает мотивировку жеста (оглядывание как проверка слежки ракшаси, а не бытовая деталь) — сегментатор пометил чанк как объединённый маркер (5.67.3138, колофон + разбор V.30/V.31), но текст цитирует именно зачин V.30 («sā 'bhivīkṣya diśaḥ»), так что привязка к этому стиху надёжна; ни подстрочник, ни Леонов/Костина, ни Phase-1 мотивировку не поясняют.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.67.3138", "verse": "3138", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "इत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे सप्तषष्टितमः सर्गः ।। 5.67 ।।\n\nसा ऽभिवीक्ष्य दिश इति । दिगवलोकनं राक्षस्यो दृष्ट्वा रावणाय वक्ष्यन्तीति भयेन । वेण्यामुद्ग्रथ्यत इति वेण्युद्ग्रथनम्, वेणीधार्यमित्यर्थः । मुक्त्वा वस्त्रादिति । वस्त्राञ्चलेन ग्रथितं मणिं मुक्त्वा ततः ददावित्यर्थः । अस्मिन् सर्गे सार्धसप्तत्रिंशच्छ्लोकाः"}, "has_tier1": false, "notes": [{"id": "edition:5.67.3138:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.67.34–40 (7 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.67.34–40", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.67.34", "iast": "mamotpatanasambhrāntā śokavegasamāhatā । mām uvāca tataḥ sītā sabhāgyo’si mahākape ॥34॥"}, {"verse_id": "5.67.35", "iast": "yad drakṣyasi mahābāhuṃ rāmaṃ kamalalocanaṃ । lakṣmaṇaṃ ca mahābahuṃ devaraṃ me yaśasvinam ॥35॥"}, {"verse_id": "5.67.36", "iast": "sītayāpy evam ukto ‘ham abruvaṃ maithilīṃ tathā । pṛṣṭham aroha me devi kṣipraṃ janakanandini ॥36॥"}, {"verse_id": "5.67.37", "iast": "yavāt te darśayāmy adya sasugrīvaṃ salakṣmaṇam । rāghavaṃ ca mahābhage bhartāram asitekṣane ॥37॥"}, {"verse_id": "5.67.38", "iast": "sābravīn māṃ tato devī naiṣa dharmo mahākape । yat te pṛṣṭhaṃ siṣeve ‘haṃ svavaśā haripuṃgava ॥38॥"}, {"verse_id": "5.67.39", "iast": "purā ca yad ahaṃ vīra spṛṣṭā gātreṣu rakṣasā । tatrāhaṃ kiṃ kariṣyāmi kālenopanipīḍitā ॥39॥"}, {"verse_id": "5.67.40", "iast": "gaccha tvaṃ kapiśardūla yatra tau nṛpateḥ sutau । ityevaṃ sā samābhāṣya bhūyaḥ saṃdeṣṭam āsthitā ॥40॥"}], "anchor_verse_id": "5.67.34"}]}, {"verse_id": "5.67.33", "verse": "33", "sanskrit_iast": "vivardhamānaṃ ca hi mām uvāca janakātmajā । aśrupūrṇamukhī dīnā bāṣpagadgadabhāṣiṇī ॥33॥", "leonov_ru": "Мне, увеличившемуся в размерах, сказала дочь Джанаки – Лицо ее было залито слезами, была она печально, а речь ее прерывалась рыданиями –", "commentary": {"bhusana": "अश्रुपूर्णमुखी दीना बाष्पसन्दिग्धभाषिणी ।\n\nममोत्पतनसम्भ्रान्ता शोकवेगसमाहता"}, "has_tier1": true, "notes": [{"id": "tier1:5.67.33:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…мне, растущему (vivardhamānaṃ ca hi mām) – в комментарии «Тилака» уточняется: «чтобы пересечь океан» (samudrataraṇāya)."}, {"id": "lexical:5.67.33:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bāṣpagadgadabhāṣiṇī", "note_ru": "Башпагадгадабхашини (bāṣpa-gadgada-bhāṣiṇī, f.) — три-членный бахуврихи: bāṣpa «слезы» (MW: bāṣpa 'tears, a tear') + gadgada «заикающийся, прерывистый» (MW: gadgada 'stammering, faltering') + bhāṣiṇī «говорящая» (от √bhāṣ-, «говорить»). Gadgada — звукоподражательное слово, передающее физиологию рыдания: задыхание, прерывистость, невозможность удержать связную речь. Термин используется как иконическое обозначение наивысшей степени горя: речь «плавится» (ср. gadgadagalaḥ «горло, свёрнутое рыданием» в поэзии). Подстрочник «речь прерывалась рыданиями» передаёт смысл, но не фонетическую мотивацию слова — gadgada — которое само воспроизводит звук плача.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:gadgada+dic_apte:gadgada", "collision_tier1": true}]}, {"verse_id": "5.67.38", "verse": "38", "sanskrit_iast": "sābravīn māṃ tato devī naiṣa dharmo mahākape । yat te pṛṣṭhaṃ siṣeve ‘haṃ svavaśā haripuṃgava ॥38॥", "leonov_ru": "Сказала тогда мне царевна: «Неправедно это, о великая обезьяна, Чтобы села я тебе на спину по собственной воле, о бык среди обезьян.", "commentary": {"bhusana": "इमं च तीव्रं मम शोकवेगं रक्षोभिरेभिः परिभर्त्सनं च ।\n\nब्रूयास्तु रामस्य गतः समीपं शिवश्च ते ऽध्वा ऽस्तु हरिप्रवीर"}, "has_tier1": true, "notes": [{"id": "tier1:5.67.38:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Нет, неправедно это (naiṣa dharmaḥ) – букв. «Это не дхарма»."}]}, {"verse_id": "5.67.3944", "verse": "3944", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"tilaka": "कालेनोपनिपीडिता । परायत्तेति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.67.3944:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Прежде, герой, коснулсяТела моего ракшаса.Но что я тогда могла сделать,Терзаемая злою судьбою?» Нужен комм., ср. у Голдмэнов стр. 542 Hanuman responds by offering to carry Sita back to Rama on his back, but Sita replies that this would not be in keeping with dharma since it would not be fitting for her to touch him of her own volition. She acknowledges that she had been touched by Ravai:ia, but that she was helpless and it was against her will.", "anchor_verse_id": "5.67.39"}, {"id": "tier1:5.67.3944:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И да будет путь твой благополучен (śivaś ca te 'dhvāstu) – традиционная формула пожелания доброго пути в санскрите.", "anchor_verse_id": "5.67.43"}, {"id": "crosstext:5.67.3944:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "- dṛś tu bhrātṛ pradā", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.67.41–43", "work_label": "Rām", "verse_address": "Rām 5.38.14,17,22,23 (крит. изд.)", "parallel_sa_iast": "imaṁ ca tīvraṁ mama śokavegaṁ rakṣobhir ebhiḥ brūyāstu rāmasya gataḥ samīpaṁ śivaśca te .dhvāstu |", "sundara_sa_iast": "imaṁ ca tīvraṁ mama śokavegaṁ rakṣobhir ebhiḥ brūyāstu rāmasya gataḥ samīpaṁ śivaśca te .dhvāstu |", "quality": "GOOD", "source": "DCS parallel-search (GOOD); Rām 5.38.14,17,22,23 (крит. изд.)", "edition_flag": "vulgate_partial", "shloka_critical": "V.65.25,26,33,34,35", "verse_address_vulgate": "Rām V.40.14,17,23–24 (вульгата)", "anchor_verse_id": "5.67.41", "collision_tier1": true}, {"id": "crosstext:5.67.3944:1", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "tvad", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.67.42", "work_label": "Rām", "verse_address": "Rām 5.37.8 (крит. изд.)", "parallel_sa_iast": "yathā ca sa mahābāhur māṁ tārayati rāghavaḥ |asmād duḥkhāmbusaṁrodhāt tvaṁ samādhātum arhasi ||", "sundara_sa_iast": "yathā ca sa mahābāhur māṁ tārayati rāghavaḥ |asmād duḥkhāmbusaṁrodhāt tat samādhātum arhasi ||", "quality": "GOOD", "source": "DCS parallel-search (GOOD); Rām 5.37.8 (крит. изд.)", "edition_flag": "vulgate", "shloka_critical": "V.65.34", "verse_address_vulgate": "Rām V.39.9 (вульгата)", "anchor_verse_id": "5.67.42", "collision_tier1": true}]}, {"verse_id": "5.67.44", "verse": "44", "sanskrit_iast": "etat tavāryā nṛpa saṃyatā sā । sītā vacaḥ prāha viṣādapūrvam । etac ca buddhvā gaditaṃ mayā tvaṃ । śraddhatsva sītāṃ kuśalāṃ const KEY = "sundara_apparatus_s67_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

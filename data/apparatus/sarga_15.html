्चोपेताम् । भूमिगृहाणि बिलगृहाणि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Всюду – здания многоярусные (bahubhūmigṛhāyutām) – Голдмэны переводят композит bahubhūmigṛha как numerous underground chambers (bahu + bhūmigṛha) (см.: Goldman 1984: 153). Именно такая интерпретация предлагается в комментариях «Таттвадипика» и «Бхушана». Мы следуем комментарию «Тилака», где этот композит объясняется как bahubhūmi + gṛha, то есть «здания со множеством ярусов».", "service": [], "suggestions": [], "seq": 3}]}, {"verse_id": "5.15.6", "verse": "6", "sanskrit_iast": "pradīptām iva tatrastho mārutiḥ samudaikṣata । niṣpatraśākhāṃ vihagaiḥ kriyamāṇām ivāsakṛt ॥6॥", "leonov_ru": "Находящийся там сын ветра смотрел на как бы сияющую, С чьих веток словно бы множество раз птицы отрясали листву,", "commentary": {"bhusana": "प्रदीप्तामिव तत्रस्थो मारुतिः समुदैक्षत ।\n\nनिष्पत्रशाखां विहगैः क्रियमाणामिवासकृत्\nविहगैः निष्पत्रशाखां क्रियमाणामिव स्थिताम् । युगपत्पातिपक्षिपक्षविहतपत्रतया पत्ररहितशाखामिव स्थितामित्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "pradīptām iva tatrasthomārutiḥ samudaikṣata", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 4}]}, {"verse_id": "5.15.7", "verse": "7", "sanskrit_iast": "viniṣpatadbhiḥ śataśaś citraiḥ puṣpāvataṃsakaiḥ । samūlapuṣparacitair aśokaiḥ śokanāśanaiḥ ॥7॥", "leonov_ru": "Слетая [с них] сотнями, с разноцветными цветочными гирляндами, С ашоками, уносящими скорбь, от корней усыпанными цветами,", "commentary": {"bhusana": "विनिष्पितद्भिः शतशश्चित्रैः पुष्पावतंसकैः ।\n\nआमूलपुष्पनिचितैरशोकैः शोकनाशनैः\nपुष्पावतंसकैः चञ्चुपुटलग्नपुष्पालङ्कृतैरित्यर्थः । आमूलेति । आमूलं पुष्पैर्निचितैः । पुन्नागादौ तथा दृष्टम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Ашоки, скорбь уносящие (aśokaiḥ śokanāśanaiḥ) – часто встречающаяся игра слов с названием дерева. Ашока (aśoka) букв. означает «беспечальный».", "service": [], "suggestions": [], "seq": 5}, {"id": "lexical:5.15.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "aśoka (śokanaśana)", "note_ru": "Шоканашана (śoka-naśana, adj.) — «уничтожающий скорбь» (śoka + naśana, от √naś-, «гибнуть, уничтожать»). Эпитет применён к деревьям aśoka (15.7). Здесь реализуется двойной каламбур: a-śoka «без-скорби» + śoka-naśana «уничтожающий скорбь» = два эпитета-синонима, которые вместе образуют авторский комментарий к парадоксу главы: деревья aśoka, буквально призванные «уничтожать śoka», обрамляют место предельного śoka Ситы. Этимологическая ирония встроена в сам текст. Подстрочник передаёт «ашоки, уносящие скорбь», не акцентируя каламбур.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:aSoka+dic_mw:Soka", "source_links": [{"label": "MW aSoka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=aSoka"}, {"label": "MW Soka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=Soka"}], "collision_tier1": true, "seq": 6}, {"id": "edition:5.15.7:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.15.7 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.15.7", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.15.7", "iast": "viniṣpatadbhiḥ śataśaś citraiḥ puṣpāvataṃsakaiḥ । samūlapuṣparacitair aśokaiḥ śokanāśanaiḥ ॥7॥"}], "collision_tier1": true, "seq": 7}]}, {"verse_id": "5.15.8", "verse": "8", "sanskrit_iast": "puṣpabhārātibhāraiś ca spṛśadbhir iva medinīm । karṇikāraiḥ kusumitaiḥ kiṃśukaiś ca supuṣpitaiḥ ॥8॥", "leonov_ru": "С тяжкою ношей цветов словно бы касающимися земли, С цветущими карникарами и кимшуками.", "commentary": {"bhusana": "पुष्पभारातिभारैश्च स्पृशद्भिरिव मेदिनीम् ।\n\nकर्णिकारैः कुसुमितैः किंशुकैश्च सुपुष्पितैः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "lexical:5.15.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "karṇikāra", "note_ru": "Карникара (karṇikāra, m. — Pterospermum acerifolium или Cassia fistula) — дерево с яркими жёлто-золотыми цветами. MW: karṇikāra 'a tree with beautiful yellow blossoms'. В санскритской поэзии karṇikāra — стандартный образ яркого жёлтого цвета (ср. kanakavarṇa). В 15.8 деревья «как бы касаются земли» под тяжестью цветов — гипербола их обилия. Интертекстуально: MW отмечает, что karṇikāra использовалась в погребальных украшениях. Присутствие «траурного» дерева среди великолепия рощи добавляет подтекст скорби, реализованный в Ситиной ситуации.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:karRikAra", "source_links": [{"label": "MW karRikAra", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=karRikAra"}], "seq": 8}]}, {"verse_id": "5.15.1114", "verse": "1114", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "पुनरशोकवनं विविधोपमानदर्शनेन वर्णयति नन्दनमित्यादिना श्लोकचतुष्टयेन । उद्यानम् अशोकवनम् । अत्र ददर्शेत्यपकृष्यते । नन्दनम् इन्द्रक्रीडावनम् । विविधोद्यानं विविधवृक्षषण्डम् । चैत्ररथं कुबेरक्रीडावनम् । नन्दनमतिवृत्तमिव अतिक्रम्य स्थितमिव । चैत्ररथं यथा चैत्ररथमिव चित्रमित्यन्वयः । आकाशसाम्ये साधारणधर्ममाह पुष्पेति । एवं सागरौपम्ये पुष्परत्नेति", "siromani": "नन्दनमिति । विबुधोद्यानं नन्दनवनमिव नन्दनम् आनन्दकं चैत्ररथं कुबेरवनमिव चित्रं यथेत्युभयान्वयि । अतिवृत्तम् उपमानीभूतवनद्वयाभ्यामधिकं द्वितीयमाकाशमिव पुष्परूपज्योतिर्गणैः आयुतं व्याप्तं पञ्चमं सागरमिव पुष्परूपानेकरत्नैश्चित्रं सर्वेषु ऋतुषु पुष्पाणि येषु तैः पादपैः निचितं व्याप्तं नानानिनदैः अनेकविधनिनादविशिष्टैः मृगगणद्विजैः रम्यं गन्धाढ्यं द्वितीयं गन्धमादनमिव अनेकगन्धप्रवहम् अत एव पुण्यगन्धैर्मनोहरम् उद्यानं शुशुभे इति शेषः । श्लोकचतुष्टयमेकान्वयि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.1114:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Пятому океану подобная (pañcamaṃ sāgaraṃ yathā) – согласно индийской мифологии, континент Джамбудвипа окружают четыре океана.", "service": [], "suggestions": [], "anchor_verse_id": "5.15.13", "seq": 9}]}, {"verse_id": "5.15.12", "verse": "12", "sanskrit_iast": "ativṛttam ivācintyaṃ divyaṃ ramyaśriyāyutam । dvitīyam iva cākāśaṃ puṣpajyotirgaṇāyutam ॥12॥", "leonov_ru": "Даже превосходя [их] – невообразимая, дивная, прекрасная, наделенная сиянием, Подобная второму небу с цветами вместо звезд.", "commentary": {"bhusana": "द्वितीयमिव चाकाशं पुष्पज्योतिर्गणायुतम् ।\n\nपुष्परत्नशतैश्चित्रं पञ्चमं सागरं यथा"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "lexical:5.15.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "puṣpajyotis", "note_ru": "Пушпаджьётис (puṣpa-jyotis, n.) — тат-пуруша: puṣpa «цветок» + jyotis «свет, звезда». MW: jyotis 'light, star'. В 15.12 роща уподоблена «второму небу с puṣpajyotis-gaṇa» — «с толпами цветов-звёзд»: деревья в цвету = ночное небо. Метафора работает в обоих направлениях: небо = цветущий сад / сад = звёздное небо. Это не декор, а космологизация: роща Раваны приравнивается к небесной сфере — ещё один образ «перевёрнутого рая» в демонической вселенной «Сундараканды».", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:puzpa+dic_mw:jyotis", "source_links": [{"label": "MW puzpa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=puzpa"}, {"label": "MW jyotis", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=jyotis"}], "seq": 10}]}, {"verse_id": "5.15.15", "verse": "15", "sanskrit_iast": "śailendram iva gandhāḍhyaṃ dvitīyaṃ gandhamādanam । aśokavanikāyāṃ tu tasyāṃ vānarapuṃgavaḥ ॥15॥", "leonov_ru": "Был он подобен второй горе Гандхамадане, богатой ароматами. В той роще ашоки бык среди обезьян", "commentary": {"tilaka": "शैलेन्द्रो हिमवान् । तस्यां पूर्ववर्णितायाम्\nयच्छेषतयैवं प्राशस्त्यं दर्शितं तस्य कालस्य दुरतिक्रमत्वमाह-- इयं सेति । राक्षसीवशमागता कालप्राबल्यादिति भावः । \"फलमत उपपत्तेः\" इति व्याससूत्रेणापि कालात्मनो भगवत एव कर्मफलप्रापणसामर्थ्यं दर्शितम्", "bhusana": "अशोकवनिकायां तु तस्यां वानरपुङ्गवः ।\n\nस ददर्शाविदूरस्थं चैत्यप्रासादमुच्छ्रितम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Словно вторая гора / Гандхамадана благоуханная (śailendram iva gandhāḍhyaṃ dvitīyaṃ gandhamādanam) – гора Гандхамадана неоднократно упоминается в «Махабхарате». Согласно комментарию В. И. Кальянова ко второй главе «Адипарвы», это «древнее название части горной цепи Рудра-Хималаи в Гарвале, которая находится северо-восточнее Бадринатха». Само название «Гандхамадана» можно перевести как «опьяняющая благоуханием».", "service": [], "suggestions": [], "seq": 11}, {"id": "crosstext:5.15.15:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "gandhamādana", "note_ru": "Гандхамадана (gandhamādana) — в Сундаре (V.15.15) это благоуханная ГОРА, с которой сравнивается Хануман в роще ашоки. Но в каталоге ванаров Бала-канды 1.17.12 Gandhamādana — ИМЯ обезьяны, сына Куберы. Совпадение имени горы и героя (оба связаны с ароматами, гандха-) — характерная для эпоса омонимия; подстрочник её не оговаривает.\n\nПараллель — Rām. Bāla 1.17.12:\n  «dhanadasya sutaḥ śrīmān vānaro gandhamādanaḥ । viśvakarmā tvajanayannalaṃ nāma mahākapim ॥12॥»\n  Славным сыном Куберы Стал обезьяна Гандхамадана; А сыном Вишвакармана — Великая обезьяна Нала.", "type": "В", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.15.15", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.17.12 (Гринцер, пер. изд. I–III)", "source_links": [], "collision_tier1": true, "seq": 12}]}, {"verse_id": "5.15.16", "verse": "16", "sanskrit_iast": "sa dadarśāvidūrasthaṃ caityaprāsādam ūrjitam । madhye stambhasahasreṇa sthitaṃ kailāsapāṇḍuram ॥16॥", "leonov_ru": "Увидел расположенный неподалеку высокий дворец, подобный ступе, С расположенными посредине тысячами колонн, белый, словно гора Кайласа,", "commentary": {"tilaka": "तदुभयमप्यतिवृत्तमिवातिक्रम्ये स्थितम् । पुष्परूपज्योतिर्गणैरायुतम्", "bhusana": "मध्ये स्तम्भसहस्रेण स्थितं कैलासपाण्डुरम् ।\n\nप्रवालकृतसोपानं तप्तकाञ्जनवेदिकम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Дворец, круглый, как ступа (caityaprāsādam) – комментарий «Таттвадипика» объясняет композит caityaprāsāda как «дворец, имеющий облик буддийской ступы». Комментарий «Тилака» уточняет, что дворец был похож на ступу благодаря своей круглой форме (vartulākāratvāt).", "service": [], "suggestions": [], "seq": 13}, {"id": "lexical:5.15.16:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "caityaprāsāda", "note_ru": "Чаитьяпрасада (caitya-prāsāda, m.) — тат-пуруша: caitya «священный объект, курган, алтарь под открытым небом» (от cita «сложенный из кирпичей», p.p. от √ci-; MW: caitya 'a funeral mound, a sacred fig-tree, a Buddhist caitya-hall') + prāsāda «дворец» (pra+√sad-). Этот термин специфически описывает строение, совмещающее ступу-мемориал и дворцовую архитектуру. В «Рамаяне» — архитектурная реалия Ланки: дворец подобен ступе. Выбор слова caityaprāsāda намекает на буддийские памятники (caitya-halls) как образцовый тип высотного здания, известный аудитории. Подстрочник «дворец, подобный ступе» — технически верен, но без буддийской коннотации.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:caitya+dic_mw:prAsAda", "source_links": [{"label": "MW caitya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=caitya"}, {"label": "MW prAsAda", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=prAsAda"}], "collision_tier1": true, "seq": 14}]}, {"verse_id": "5.15.17", "verse": "17", "sanskrit_iast": "pravālakṛtasopānaṃ taptakāñcanavedikam । muṣṇantam iva cakṣūṃṣi dyotamānam iva śriyā ॥17॥", "leonov_ru": "С лестницами из кораллов, с возвышениями (или перилами) из расплавленного золота, Словно бы похищающий взгляды, словно бы сияющий роскошью,", "commentary": {"tilaka": "आधिक्यमेवोपपादयति-- इयमिति । अनेन कुलम्, भर्तृदृढव्रतेत्यनेन चारित्र्यातिशयः । मेदिनीं भित्त्वेत्यनेनायोनिजतया ऽमानुषदिव्यरूपत्वं दर्शितम् ।। 5.15.15,16 ।।\n\nआर्यशीलस्य पूज्यशीलस्य । अनेन महाकुलीनपाणिग्रहणं दर्शितम्", "bhusana": "मुष्णन्तमिव चक्षूंषि द्योतमानमिव श्रिया ।\n\nविमलं प्रांशुभावत्वादुल्लिखन्तमिवाम्बरम्\nप्रांशुभावत्वात् दीर्घस्वभावत्वात्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Со скамьями из золота (aptakāñcanavedikam) – Голдмены предлагают здесь для vedikā перевод «лестницы» (см.: Goldman 1984: 154). Однако обычно это слово означает «сидение, скамья».", "service": [], "suggestions": [], "seq": 15}]}, {"verse_id": "5.15.19", "verse": "19", "sanskrit_iast": "upavāsakṛśāṃ dīnāṃ niḥśvasāntīṃ punaḥ punaḥ । dadarśa śuklapakṣādau candrarekhām ivāmalām ॥19॥", "leonov_ru": "Исхудавшую от поста, печальную, то и дело вздыхающую Увидел [женщину], ясную, словно луна в начале светлой половины месяца.", "commentary": {"tilaka": "भर्तृस्नेहबलात्कृता बलात्प्रवर्तिता", "bhusana": "ददर्श शुक्लपक्षादौ चन्द्ररेखामिवामलाम् ।\n\nमन्दं प्रख्यायमानेन रूपेण रुचिरप्रभाम्\nशुक्लपक्षादावित्यनेन वर्धिष्णुत्वं द्योतितम् । मन्दं प्रख्यायमानेन इदं तदिति कथ़ञ्चित्प्रत्यभिज्ञायमानेन रूपेणोपलक्षिताम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "lexical:5.15.19:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "upavāsa", "note_ru": "Упаваса (upavāsa, m.) — «пост, воздержание от пищи» (upa+√vas-, «сидеть рядом с», в значении «сидеть у [алтаря]»; MW: upavāsa 'fasting as a religious observance'). Этимология показательна: upavāsa — не просто голодание, а ритуальное сидение возле священного объекта без еды. Сита пребывает в упавасе не по собственному обету, а в силу плена: её вынужденный отказ от пищи автоматически становится ритуальной практикой — «сидением у [образа] мужа». Это ещё один момент, где страдание осмысляется как аскеза (ср. tapasvinī в ch11).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:upavAsa", "source_links": [{"label": "MW upavAsa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=upavAsa"}], "seq": 16}, {"id": "crosstext:5.15.19:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "kṛśā dīnā tapasvinī (Sītā)", "note_ru": "Сита предстаёт перед взором Ханумана «исхудавшей от поста» (upavāsakṛśā), «печальной» (dīnā), «то и дело вздыхающей» — и сравнивается с ясной луной в начале светлой половины месяца. Это самое развёрнутое в Сундараканде описание Ситы в заточении. В «Рагхувамше» аналогичный тройной образ появляется в описании Ситы после её второго изгнания: Raghu 14.48–50 (kṛśāṃ dīnāṃ tapasvinīṃ — «исхудавшую, опечаленную, подвижницу») — тройная формула практически вербальна. В «Мегхадуте» Kālidāsa использует ту же связку kṛśā/dīnā для virahiṇī (разлучённой жены), ожидающей мужа: Megha 95 (kṛśatanur). Три слова вместе (kṛśa + dīna + tapasvin) — кавья-формула страдающей благородной женщины, восходящая к эпическому описанию Ситы в Сундараканде.", "type": "Б", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.15.19", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Kālidāsa, Raghuvaṃśa 14.48–50; Meghadūta 95", "source_links": [], "seq": 17}]}, {"verse_id": "5.15.20", "verse": "20", "sanskrit_iast": "mandaprakhyāyamānena rūpeṇa ruciraprabhām । pinaddhāṃ dhūmajālena śikhām iva vibhāvasoḥ ॥20॥", "leonov_ru": "С трудноузнаваемым обликом, сияющую Подобно пламени огня, которое скрывают клубы дыма,", "commentary": {"tilaka": "चैत्यं वर्तुलाकारत्वाद्बुद्धायतनमिव प्रासादम् । स्तम्भसहस्रेणाधारभूतेन स्थितम् ।। 5.15.16,17 ।।\n\nप्रांशुभावत्वादुच्चस्वभावत्वात् । ततस्तद्दर्शनानन्तरम् । मलिनवासःसंवीतत्वादिविशेषणवतीं सीतां दूरादेव तन्मूलस्थां ददर्शेत्यनुकर्षः ।। 5.15.18,19 ।।\n\nमन्दप्रख्यायमानेन इदमिदमितीदं तदिति वा कथंचिदूह्यमानेन रूपेण स्वरूपेणोपलक्षिताम्\nभर्तृशुश्रूषणापरा । सन्नन्तात्स्वार्थे णिचि \"ण्यासश्रन्थ\" इति युच्", "bhusana": "पिनद्धां धूमजालेन शिखामिव विभावसोः ।\n\nपीतेनैकेन संवीतां क्लिष्टेनोत्तमवाससा\nपिनद्धामिति मलिनसंवीतत्वे उपमा । पिनद्धां बद्धाम् । उत्तरीयराहित्यं द्योतयितुमेकेनेत्युक्तिः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "crosstext:5.15.20:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "śikhām iva vibhāvasoḥ pinaddhāṃ dhūmajālena", "note_ru": "Сита в ашоковой роще «с трудноузнаваемым обликом (mandaprakhyāyamānena rūpeṇa), сияющая подобно пламени огня, скрытому клубами дыма» (V.15.20) — это почти дословно стих о найденной Дамаянти в Нала-упакхьяне: Āraṇyaka 3.65.7 «mandaprakhyāyamānena rūpeṇāpratimena tām / pinaddhāṃ dhūmajālena prabhāmiva vibhāvasoḥ» — «Несравненная красота её пряталась от взоров, словно солнце за облёкшею его завесой дыма». Совпадение целого полустишия (формула «mandaprakhyāyamānena rūpeṇa … pinaddhāṃ dhūmajālena») — яркий случай общего эпического клише для покинутой, измождённой тоской верной жены. Свидетельство: уровень шлоки (сильная формульная параллель).", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.15.20", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparva 3.65.7", "source_links": [], "seq": 18}]}, {"verse_id": "5.15.21", "verse": "21", "sanskrit_iast": "pītenaikena saṃvītāṃ kliṣṭenottamavāsasā । sapaṅkām analaṃkārāṃ vipadmām iva padminīm ॥21॥", "leonov_ru": "Одетую в одно желтое платье, превосходное, [но] изношенное, Покрытую грязью, без украшений, подобную пруду, лишенному лотосов,", "commentary": {"tilaka": "क्लिष्टेन जीर्णेन पांसुष्वास्तरणेन वा क्लिष्टेन । सपङ्कां मलवच्छरीराम् । पद्मिनी लक्ष्मीर्लता च\nपूर्ववदेवाह-- सेयमिति । यातनां राक्षसीभिः संपाद्यमानतीव्रदुःखम् । अनर्थानामापदाम्", "bhusana": "सपङ्कामनलङ्कारां विपद्मामिव पद्मिनीम् ।\n\nव्रीडितां दुःखसंतप्तां परिम्लानां तपस्विनीम्\nसपङ्कां भूमेराविर्भवन्तीमिव स्थिताम् । अनलङ्कारां पङ्कं निवर्त्य अलङ्कुर्वतो ऽसन्निधानादलङ्काररहिताम् । रामागमने ऽप्ययमाश्रयो नोत्सादयितुमर्हतीत्येवं मन्यमानाम् । विपद्मामिव पद्मिनीं पद्मरहितां सरसीमिव स्थिताम् ।। 4.15.21 ।।\n\nग्रहेणाङ्गारकेणेव पीडितामिव रोहिणीम् ।\n\nअश्रुपर्णमुखीं दीनां कृशामनशनेन च", "siromani": "क्लिष्टेन जीर्णतया प्रतीतेन पीतेन एकेन उत्तमवाससा संवीताम् अनलङ्काराम् अलङ्कृतिरहिताम् अत एव विपद्मां पद्मरहितां पद्मिनीं सरसीमिव सपङ्कां मलिनाम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "lexical:5.15.21:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nala", "note_ru": "Нала (nala) — Нала (nala «полый тростник»), архитектор-обезьяна, сын Вишвакармана; в кн. VI строит мост, но в кн. V упоминается в контексте войска. Первое вхождение в кн. V. См. примеч. к I.1.80 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "base", "trigger": "realia", "source": "первое вхождение в кн. V; указатель Гринцера / комментаторы, где процитировано (привязка к стиху, нестрогая)", "source_links": [], "seq": 19}]}, {"verse_id": "5.15.22", "verse": "22", "sanskrit_iast": "pīḍitāṃ duḥkhasaṃtaptāṃ parikṣīṇāṃ tapasvinīm । graheṇāṅgārakeṇeva pīḍitām iva rohiṇīm ॥22॥", "leonov_ru": "Измученную, истерзанную скорбью, исхудавшую страдалицу, Подобную [созвездию] Рохини, которое затмил Марс,", "commentary": {"tilaka": "अङ्गारकेणेव तत्तुल्येन ग्रहेण केतुना पीडितां रोहिणीमिव ।। 5.15.22,23 ।।\n\nप्रियं जनं रामलक्ष्मणसुग्रीवादिरूपं जनम् । श्वगणेन शुनां गणेन\nशीलसंपन्नामीदृशदुःखे ऽपि चारित्र्यप्रच्यवरहिताम् । प्रमथितां प्रमथितामपि । प्रपा पानीयशाला ।। 5.15.22,23 ।।\n\nकाम्यन्त इति कामाः, भुज्यन्त इति भोगाः स्रक्चन्दनादयः, तैस्त्यक्ता तत्समागमकाङ्क्षिणी । \"एति जीवन्तमानन्दो नरं वर्षशतादपि\" इति न्यायेनेति भावः", "bhusana": "ग्रहेण क्रूरग्रहेण । द्वितीय इवशब्दो वाक्यालङ्कारे । अश्र्विति । कृशां दीनामिति पुनःपुनरुक्तिः कार्श्यदैन्ययोरतिशयप्रदर्शनाय । अत्र उपवासकृशां कृशामनशनेनेत्युक्त्या पूर्वकाण्डान्ते इन्द्रदत्तपायसाशनवृत्तान्तः कल्पित इति तत्रैवोक्तम् ।। 5.15.22,23।।\n\nस्वगणेन मृगीं हीनां श्वगणाभिवृतामिव ।\n\nनीलनागाभया वेण्या जघनं गतयैकया\nनीलनागाभया कृष्णसर्पतुल्यया", "siromani": "दुःखसन्तप्तां वियोगजनितदुःखाक्रान्तामत एव अङ्गारकेण भौमेन ग्रहेण पीडितां रोहिणीमिव पीडिताम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.22:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "созвездию Рохини,Которое Марсом затмилось", "kind": "note", "text": "Комм"}], "suggestions": [], "seq": 20}, {"id": "lexical:5.15.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "rohiṇī", "note_ru": "Рохини (Rohiṇī, f.) — «красная» (√ruh- «подниматься, краснеть»): 1) астероним — 4-я лунная стоянка (nakṣatra), отождествляемая с Альдебараном (α Tauri), любимейшее созвездие Луны; 2) имя собственное — возлюбленная Луны. MW: Rohiṇī 'the 4th lunar mansion; the favourite wife of the Moon'. В 15.22 Сита сравнивается с Рохини, угнетаемой Марсом (Aṅgāraka). Астрологический контекст: Марс считался неблагоприятной планетой для накшатры Рохини (т. н. «яма созвездия»); Равана для Ситы — такой же зловредный «Марс». Образ работает только при знании астрологической системы накшатр.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:rohiRI", "source_links": [{"label": "MW rohiRI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=rohiRI"}], "collision_tier1": true, "seq": 21}]}, {"verse_id": "5.15.25", "verse": "25", "sanskrit_iast": "nīlanāgābhayā veṇyā jaghanaṃ gatayaikayā । nīlayā nīradāpāye vanarājyā mahīmiva ॥25॥", "leonov_ru": "С единственной косой, доходящей до бедер, подобной черной змее, Подобную земле в сезон дождей с чернеющей полоской леса,", "commentary": {"tilaka": "जघनं पृष्ठभागं गतया प्राप्तयैकया हरणदिनकृतैकसंस्कारवत्या । यद्वा पुरोभागीयवेणीद्वयराहित्येन पृष्ठलम्बयैकया वेण्या नीलनागाभया नीलसर्पतुल्यया वेण्योपलक्षिताम् अनेन तत्स्पर्शे ऽन्यस्य मरणमेवेति सूचितम् । मेघापाये नीलया वनराज्योपलक्षितां महीमिव स्थिताम् ।। 5.15.25,26 ।।\n\nउपपादिभिः सीतात्वनिश्चयोपपादनसमर्थैः । तत्कारणं प्रत्यभिज्ञानमाह-- ह्रियमाणेति । यथारूपा दृष्टा यादृग्वेषवर्णादिमत्यनुभूता तथारूपेयम् । भेदे हि प्रत्यभिज्ञानमनुपपन्नमिति भावः\nएतदेकहृदयत्वज्ञानादेव रामः प्रभुर्यज्जीवनरूपं दुःखेनावसादनाभावरूपं च दुष्करं कुरुते\nराक्षस्यः राक्षसीरित्यर्थः । एकस्मिंल्लक्ष्ये तिष्ठति तादृशं हृदयं यस्याः सा । किं तदेकं लक्ष्यं तत्राह-- नूनं राममेवेति", "bhusana": "नीलया नीरदापाये वनराज्या महीमिव ।\n\nसुखार्हां दुःखसंतप्तां व्यसनानामकोविदाम्\nनीरदापाये शरदि"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "lexical:5.15.25:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "veṇī", "note_ru": "Вени (veṇī, f.) — «коса, несплетённые волосы» (√vi+√nī-, по народной этимологии, MW: veṇī 'braid of hair, a river before its junction with another'). В эпической иконографии veṇī — единственная коса, которую женщина заплетает только в трауре (противоположность svastika-coiffure из двух кос). Сита носит veṇī как знак вдовьего или заупокойного состояния — сознательный траур по Раме, которого она воспринимает как погибшего или недосягаемого. В 15.25 «единственная коса до бёдер, подобная чёрной змее» — визуализация траурного статуса через телесный символ, который аудитория считала мгновенно. Подстрочник «коса» не передаёт этого ритуального кода.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:veRI", "source_links": [{"label": "MW veRI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=veRI"}], "seq": 22}]}, {"verse_id": "5.15.26", "verse": "26", "sanskrit_iast": "sukhārhāṃ duḥkhasaṃtaptāṃ vyasanānām akovidām । tāṃ vilokya viśālākṣīm adhikaṃ malināṃ kṛśām ॥26॥", "leonov_ru": "Достойную счастья, [но] измученную несчастьем, непривычную к бедам, Глядя на ту широкоглазую, очень грязную и исхудавшую,", "commentary": {"bhusana": "तां समीक्ष्य विशालाक्षीमधिकं मलिनां कृशाम् ।\n\nतर्कयामास सीतेति कारणैरुपपादिभिः\nउपपादिभिः उपपादनशीलैः । मन्दं प्रख्यायमानेनेत्यारभ्य सीतां समीक्ष्य उपपादिभिः कारणैस्सीतेति तर्कयामासेत्यन्वयः", "siromani": "सुखार्हामिति । सुखार्हां सुखयोग्यां व्यसनानां दुःखानाम् अकोविदाम् अविज्ञात्रीं दुःखसंतप्तां तां सीतां विलोक्य उपपादिभिः सीताबोधनसमर्थैः कारणैः इयं सीतेति तर्कयामास । सार्धश्लोक एकान्वयी"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Достойную счастья, но бедами / Непривычными изможденную (sukhārhāṃ duḥkhasaṃtaptāṃ vyasanānām akovidām) – букв. «Достойную счастья, но измученную несчастьями, не знавшую [прежде] бед».", "service": [], "suggestions": [], "seq": 23}]}, {"verse_id": "5.15.27", "verse": "27", "sanskrit_iast": "tarkayām āsa sīteti kāraṇair upapādibhiḥ । hriyamāṇā tadā tena rakṣasā kāmarūpiṇā ॥27॥", "leonov_ru": "Подумал [Хануман]: «Судя по приметам, это Сита. С той, которую уносил тот ракшас, свободно меняющий облик,", "commentary": {"bhusana": "ह्रियमाणा तदा तेन रक्षसा कामरूपिणा ।\n\nयथारूपा हि दृष्टा वै तथारूपेयमङ्गना\nएवं लिङ्गैः सीतेति विचार्य प्रत्यभिज्ञयापि तथा तर्कयामासेत्याह ह्रियमाणेति । इति तर्कयामासेति शेषः", "siromani": "तर्कप्रकारमाह ह्रियमाणेति । तेन रावणेन ह्रियमाणा सा सीता तदा हरणसमये यथारूपा दृष्टा तथारूपैव इयमङ्गना । एतेनेयं सीतैव भवितुमर्हतीति सूचितम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "По явным приметам… (kāraṇair upapādibhiḥ) – в оригинале использовано слово kāraṇa, которое согласно комментарию «Тилака» означает здесь pratyabhijñāna, то есть опознавательный знак.", "service": [], "suggestions": [], "seq": 24}]}, {"verse_id": "5.15.30", "verse": "30", "sanskrit_iast": "sītāṃ padmapalāśākṣīṃ manmathasya ratiṃ yathā । iṣṭāṃ sarvasya jagataḥ pūrṇacandraprabhām iva ॥30॥", "leonov_ru": "Сита лотосоглазая подобна Рати, супруге Манматхи (бога любви), Желанна она всему миру, подобно свету полной луны.", "commentary": {"bhusana": "इष्टां सर्वस्य जगतः पूर्णचन्द्रप्रभामिव ।\n\nभूमौ सुतनुमासीनां नियतामिव तापसीम्", "siromani": "मन्मथस्य संबन्धिनीं रतिं यथा अतिरूपत्वेन तत्सदृशीं सर्वस्य जगतः इष्टां पूज्याम्", "tilaka": "राममेवेत्यत्र बीजमाह भर्ता नामेति । शोभनं शोभा"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Подобна супруге Камы (manmathasya ratiṃ yathā) – букв. «словно Рати, [жена] Манматхи», то есть бога любви Камы.", "service": [], "suggestions": [], "seq": 25}]}, {"verse_id": "5.15.31", "verse": "31", "sanskrit_iast": "bhūmau sutanum āsīnāṃ niyatām iva tāpasīm । niḥśvāsabahulāṃ bhīruṃ bhujagendravadhūm iva ॥31॥", "leonov_ru": "На земле, прекрасная телом, сидит, словно смирившая себя подвижница, Постоянно вздыхающая, робкая, подобная невестке (жене) владыки змей.", "commentary": {"tilaka": "नियतां भूशयनादिरूपनियमवतीम् तापसीमिव भूमावासीनाम्, भुजगेन्द्रवधूसादृश्यं दुष्प्रधृष्यत्वेन रक्षःकुलनाशकत्वेन च\nन केवलमशोक एव शोकजनकश्चन्द्रो ऽपीत्याह-- हिमेति । हिमव्यपायेन वसन्तसमीपप्राक्कालेनोपलक्षितः । यद्वा लङ्कायां हिमव्यपायेन शीताभावेनाभ्युत्थितो ऽतिप्रकाशतया स्थितः, अत एव नैकसहस्ररश्मिरभ्युत्थितः उदयं प्राप्तः । शीतरश्मीश्च शोकं जनयतीत्यनुकर्षः", "siromani": "नियतां यतचित्तां तापसीमिव भूमौ आसीनां भुजगेन्द्रवधूमिव भीरुम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.31:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Сидит, подобно подвижнице (niyatām iva tāpasīm) – в комментарии «Тилака» слово niyatā толкуется как «воздержанная в еде и прочем».", "service": [{"author": "Е. Костина", "lemma_iast": "царица нагов", "kind": "note", "text": "Нужен комм - vadhū не = царица + причины сравнения"}], "suggestions": [], "seq": 26}, {"id": "crosstext:5.15.31:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "tapasvinī", "note_ru": "Сита в плену уподоблена подвижнице (tapasvinī / tāpasī iva) — образ, на который ложится учение Ману о tapas. Manu 11.234 — tapomūlamidaṃ sarvaṃ … «всё это [благо] коренится в подвижничестве». Manu 4.162 особо запрещает причинять вред подвижникам: na hiṃsyādbrāhmaṇān gāśca sarvāṃścaiva tapasvinaḥ «нельзя причинять вред … коровам, брахманам и всем подвижникам»; насилие Раваны над Ситой-tapasvinī прочитывается как нарушение и этой нормы. Кавья-метафора с шастрическим фоном.", "type": "Б", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.15.31", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra (Законы Ману, рус. пер. С.Д. Эльманович / Г.И. Ильин) Manu 11.234 sqq.; 4.162; 6.75–85", "source_links": [], "collision_tier1": true, "seq": 27}]}, {"verse_id": "5.15.32", "verse": "32", "sanskrit_iast": "śokajālena mahatā vitatena na rājatīm । saṃsaktāṃ dhūmajālena śikhām iva vibhāvasoḥ ॥32॥", "leonov_ru": "Из-за великой сети скорби, покрывшей ее, поблекла ее красота (не сияет она) Словно пламя огня, окутанное облаком дыма.", "commentary": {"tilaka": "न राजतीमराजतीम् विभावसोः शिखामिव पातिव्रत्यतेजसा ज्वलन्तीम्\nसीतेयमित्येवेयं सीतैवेति जातबुद्धिस्तामेव बुद्धिं संश्रित्य ततः परानुष्ठेयचिकीर्षया तस्मिंञ्शिशपावृक्ष एव निषसाद तद्रात्रिशेषं परदिनं च स्थित इत्यर्थः । एवं च सरावणान्तःपुरा सर्वापि लङ्का यामत्रयेण समुद्रलङ्घनदिनरात्रावेव विचिता, तुर्ये यामे ऽशोकवनिकाप्रवेश इति बोध्यम्", "bhusana": "न राजतीं न राजन्तीम् । तां प्रसिद्धाम् ।। 4.15.31 ।।\n\nसंसक्तां धूमजालेन शिखामिव विभावसोः ।\n\nतां स्मृतीमिव सन्दिग्धामृद्धिं निपतितामिव\nस्मृतिं मन्वाद्युक्तिम् । सन्दिग्धां सन्दिग्धार्थाम् ।। ऋद्धिं सम्पदम् । निपतितां क्षणाम्", "siromani": "विततेन विस्तृतेन महता शोकजालेन न राजतीम् ईषद्दीप्ताम् अत एव धूमजालेन संसक्तां संबद्धां विभावसोः अग्रेः शिकामिव"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.32:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Поблекла ее красота (vitatena na rājatīm) – букв. «ярко не сияющую» (vitatena na rājatīm).", "service": [], "suggestions": [], "seq": 28}]}, {"verse_id": "5.15.33", "verse": "33", "sanskrit_iast": "tāṃ smṛtīm iva saṃdigdhām ṛddhiṃ nipatitām iva । vihatām iva ca śraddhām āśāṃ pratihatām iva ॥33॥", "leonov_ru": "Она подобна смрити, чей смысл смутен (или «подообна смутному воспоминанию), подобна она утраченному богатству, Подобна она утерянной вере или разрушенной надежде,", "commentary": {"tilaka": "स्मृतीमिवेति दीर्घ आर्षः । सन्दिग्धामर्थसन्देहवतीम् ऋद्धिमैश्वर्यम् निपतिताम् अन्यायवशादिति भावः । विहताम् नास्तिकबुद्ध्येति भावः । प्रतिहताम् स्वविषयालाभादिति भावः", "bhusana": "विहतामिव च श्रद्धामाशां प्रतिहतामिव ।\n\nसोपसर्गां यथा सिद्धिं बुद्धिं सकलुषामिव", "siromani": "संदिग्धाम् अर्थनिश्चयविषयकसंदेहविशिष्टां स्मृतीं स्मृतिमिव संदिग्धां शरीरस्थितिविषयकसंदेहविशिष्टां निपतिता भीत्या चौरादिभिः क्वचिन्निःक्षिप्ताम् ऋद्धिं मण्यादिसमूहमिव विहतां नास्तिकबुद्ध्या अनादृतां श्रद्धामिव प्रतिहतां लाभाभावान्निवृत्ताम् आशामिव"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "lexical:5.15.33:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "smṛti", "note_ru": "Смрити (smṛti, f.) — «память, воспоминание; священный текст, основанный на предании» (√smṛ-, «помнить», Whitney #509). MW: smṛti '1. remembrance, recollection; 2. the body of traditional law (as opp. to śruti)'. В 15.33 Сита сравнивается с «сомнительной smṛti» — текстом, чей смысл стал неясен. Это второй, технический смысл: smṛti как правовой/нормативный корпус (Ману, Яджнавалкья и др.). «Saṃdigdha smṛti» — текст, чья интерпретация вызывает разногласие среди учёных. Метафора описывает Ситу как нечто подлинное и авторитетное, но ставшее трудночитаемым: само её существо — как забытый священный текст.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:smfti", "source_links": [{"label": "MW smfti", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=smfti"}], "seq": 29}]}, {"verse_id": "5.15.36", "verse": "36", "sanskrit_iast": "bāṣpāmbuparipūrṇena kṛṣṇavakrākṣipakṣmaṇā । vadanenāprasannena niḥśvasantīṃ punaḥ punaḥ ॥36॥", "leonov_ru": "С несчастным лицом, залитым слезами, С черными изогнутыми ресницами, вздыхающая снова и снова.", "commentary": {"bhusana": "वदनेनाप्रसन्नेन निःश्वसन्तीं पुनःपुनः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "edition:5.15.36:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.15.36 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.15.36", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.15.36", "iast": "bāṣpāmbuparipūrṇena kṛṣṇavakrākṣipakṣmaṇā । vadanenāprasannena niḥśvasantīṃ punaḥ punaḥ ॥36॥"}], "seq": 30}]}, {"verse_id": "5.15.38", "verse": "38", "sanskrit_iast": "tasya saṃdidihe buddhis tathā sītāṃ nirīkṣya ca । āmnāyānām ayogena vidyāṃ praśithilām iva ॥38॥", "leonov_ru": "При взгляде на Ситу его (Ханумана) разум сомневался, Словно знание священных текстов, ставшее нечетким из-за отсутствия повторения.", "commentary": {"tilaka": "पूर्णचन्द्राननत्वादिगुणवतीं निरीक्ष्य तस्य बुद्धिः सन्दिदिहे इत्यष्टात्रिंशच्छ्लोकेनान्वयः । सुभ्रूं सुभ्रुवम्\nममापि तिर्यग्योनेरपि विषयानभिज्ञस्यापि\nसन्दिदिहे प्रत्यभिज्ञाबाधकात्कार्श्यमालिन्यादितिरोहितरूपत्वात्सन्देहः । आम्नायो ऽभ्यासः", "bhusana": "तस्य सन्दिदिहे बुद्धिर्मुहुः सीतां निरीक्ष्य तु ।\n\nआम्नायानामयोगेन विद्यां प्रशिथिलामिव\nपुनः शीताशब्दो व्यवहितानुस्मरणार्थः । आम्नायानां वेदानाम् । अयोगेन असम्बन्धेन । प्रशिथिलाम् अप्राप्तप्रतिष्ठाम् । विद्यां वेदबाह्यविद्याम् । यद्वा आम्नायानाम् अभ्यासानामभावेन प्रशिथिलाम् अस्थिरपदां विद्यामिव सीतां निरीक्ष्य तस्य हनुमतो बुद्धिः सन्दिदिहे इत्यन्वयः । कार्श्यमालिन्यादिना तिरोहितरूपत्वादिति भावः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.38:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Словно знание священных текстов, |Долго не повторявшихся ((āmnāyānām ayogena vidyāṃ praśithilām iva) – букв.: «словно знание священных текстов, ослабевшее от отсутствия практики».", "service": [], "suggestions": [], "seq": 31}, {"id": "lexical:5.15.38:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āmnāya", "note_ru": "Амная (āmnāya, m.) — «священный текст, передаваемый устно; традиция рецитации Вед» (ā+√mnā-, «помнить, повторять», MW: āmnāya 'sacred tradition, the Vedas'). В 15.38 ум Ханумана уподоблен «vidyā āmnāyānam ayogena praśithilā» — «знанию, ставшему нечётким из-за отсутствия повторения (abhyāsa)». Āmnāya предполагает мнемотехнику устной передачи: без регулярного повторения ведийский текст «размывается». Это точная метафора когнитивного сомнения: Хануман «помнит» черты Ситы, но они стёрлись, как формулы без практики. Двойной сигнификат — знание и узнавание — нераздельны.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:AmnAya", "source_links": [{"label": "MW AmnAya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=AmnAya"}], "collision_tier1": true, "seq": 32}]}, {"verse_id": "5.15.39", "verse": "39", "sanskrit_iast": "duḥkhena bubudhe sītāṃ hanumān analaṃkṛtām । saṃskāreṇa yathā hīnāṃ vācam arthāntaraṃ gatām ॥39॥", "leonov_ru": "С трудом узнал Хануман Ситу, лишенную украшений, Словно речь, утратившую ясность из-за нечеткого изложения.", "commentary": {"tilaka": "बाधकस्याकिञ्चित्करत्वमाह-- दुःखेनेति । दुःखबोध्यत्वे हेतुः-- अनलङ्कृतामिति । संस्कारेणेति स्नानानुलेपनादिरङ्गसंस्कारः । वाचो व्याकरणज्ञानादिजः संस्कारः । देव्या अर्थान्तरगतत्वं देशान्तरगतत्वम् । वाचस्तु विवक्षितार्थादन्यार्थबोधकत्वम् । वाचो ऽर्थो यथा व्याकरणाद्यभ्यासदुःखेन व्युत्पत्तिं संपाद्य बुध्यते, तद्वत्सीतां कष्टेन बुबुधे", "bhusana": "दुःखेन बुबुधे सीतां हनुमाननलङ्कृताम् ।\n\nसंस्कारेण यथा हीनां वाचमर्थान्तरं गताम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.39:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…в столь жалком виде ((analaṃkṛtām) – букв. «неукрашенную».", "service": [{"author": "Е. Костина", "lemma_iast": "речь неясную", "kind": "note", "text": "Нужен комм"}], "suggestions": [], "seq": 33}]}, {"verse_id": "5.15.41", "verse": "41", "sanskrit_iast": "vaidehyā yāni cāṅgeṣu tadā rāmo 'nvakīrtayat । tāny ābharaṇajālāni gātraśobhīny alakṣayat ॥41॥", "leonov_ru": "Заметил он на теле Ситы украшения, украшавшие члены ее тела, О которых рассказывал Рама.", "commentary": {"tilaka": "रामोपरोधो रामसेवाप्रतिबन्धः", "siromani": "रामोपरोधेन रामसेवानिरोधेन व्यथितां रक्षोगणनिपीडितां रक्षःसमूहवद्देशवासेन प्राप्तपीडाम् अत एव कृष्णवक्राक्षिपक्ष्मणा नेत्रेण ततस्ततो वीक्षमाणां पुनः पुनर्निःश्वसन्तीम् ।। 5.15.35,36 ।।\n\nमलपङ्कधरां स्नानाभावादिनिष्पन्नमलरूपपङ्कयुतां मण्डनार्हां शोभायोग्याम् अमण्डितां वियोगेन शोभारहिताम् अत एव कालमेघैरावृतां नक्षत्रराजस्य चन्द्रमसः प्रभामिव आम्रायानाम् अभ्यासानाम् अयोगेन प्रशिथिलां विद्यामिव तां सीतां निरीक्ष्य तस्य हनुमतो बुद्धिः संदिदिहे । सार्धश्लोकदशकमेकान्वयि ।। 5.15.37,38 ।।\n\nदुःखेनेति । संस्कारेण यथोचितस्नानादिरूपसंस्कृत्या हीनाम् अत एव अर्थान्तरं गतां वाचमिव अनलंकृतां सीतां दुःखेन बुबुधे\nतत्प्रकारमाह वैदेह्या इति । तदा प्रस्थानसमये वैदेह्या अङ्गेषु यान्याभरणजालानि रामो ऽन्वकीर्तयत् तानि गात्रशोभीनि अलक्षयत् अपश्यत्", "bhusana": "वैदेह्या यानि चाङ्गेषु तदा रामो ऽन्वकीर्तयत् ।\n\nतान्याभरणजालानि शाखाशोभीन्यलक्षयत्\nवैदेह्या इति । शाखायां शोभन्त इति शाखाशोभीनि । भर्तृविरहकाले भूषणधारणस्यानुचितत्वत् स्वाङ्गेभ्य उन्मुच्य शाखायां न्यस्तानीत्यर्थः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "lexical:5.15.41:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ābharaṇa", "note_ru": "Абхарана (ābharaṇa, n.) — «украшение» (ā+√bhṛ-, «нести», Whitney #148; MW: ābharaṇa 'anything worn as ornament, jewel'). В 15.41–43 Хануман идентифицирует Ситу именно по ābharaṇa, описанным ему Рамой. Это юридически значимая сцена: украшения — передаваемые из рук в руки семейные ценности, уникальные маркеры личности в дарственных и клятвах. Ābharaṇa здесь функционирует как доказательство (pramāṇa) в судебном смысле: они — свидетельства, которые верифицируют личность Ситы через вещественную непрерывность. Подстрочник «украшения» упускает роль вещных доказательств.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:AbharaNa", "source_links": [{"label": "MW AbharaNa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=AbharaNa"}], "seq": 34}, {"id": "phase2:5.15.41:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "gātraśobhīni (v.l. śākhāśobhīni)", "note_ru": "В «Бхушане» здесь читается śākhāśobhīni («украшавшие ветвь») вместо переданного gātraśobhīni («украшавшие тело»): по этому чтению Сита, сняв украшения, сама повесила их на дерево, поскольку во время разлуки с мужем носить украшения не подобает. Перевод следует основному чтению gātraśobhīni — украшения на теле Ситы, которые узнаёт Хануман.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "вариантное чтение с интерпретационными последствиями (украшения на теле Ситы vs. оставленные ею на ветке), не отражённое ни в подстрочнике, ни в собственных примечаниях Леонова/Костиной, ни в Phase-1", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 35}]}, {"verse_id": "5.15.42", "verse": "42", "sanskrit_iast": "sukṛtau karṇaveṣṭau ca śvadaṃṣṭrau ca susaṃsthitau । maṇividrumacitrāṇi hasteṣv ābharaṇāni ca ॥42॥", "leonov_ru": "«Две превосходно сделанные серьги, два «собачьих клыка» великолепной формы, На руках – украшения, расцвеченные драгоценными камнями и кораллами.", "commentary": {"tilaka": "अथ कस्मिन्गात्रे किमाभरणं दृश्यते तत्राह-- सुकृताविति । सुकृतौ निर्मितौ कर्णवेष्टौ कुण्डले । श्वदंष्ट्रौ कर्णाभरणविशेषौ त्रिकर्णकापरनामानौ । सुसंस्थितौ कर्णरूपाङ्गे सुप्रतिष्ठितौ । उपलक्षये इति शेषः । हस्तेषु हस्तावयवेषु च यानि मणिविद्रुमचित्राप्याभरणानि रामेणोक्तानि तथैव सुस्थितान्युपलक्षये", "bhusana": "सुकृतौ कर्णवेष्टौ च श्वदंष्ट्रौ च सुसंस्थितौ ।\n\nमणिविद्रुमचित्राणि हस्तेष्वाभरणानि च ।\n\nश्यामानि चिरयुक्तत्वात्तथा संस्थानवन्ति च\nकर्णवेष्टौ कुण्डले । \" कर्णिका तालपत्रं स्यात्कुण्डलं कर्णवेष्टनम्\" इति सज्जनः । श्वदंष्ट्रः त्रिकर्णकाख्यः पुष्पाकारः कर्णपार्श्वभूषणविशेषः । \"त्रिकर्णकः श्वदंष्ट्रश्च\" इत्यभिधानरत्नमाला । हस्तेषु हस्तावयवेषु । श्यामानि विरहतापौष्ण्यवशाच्छ्यामीभूतानि । तथा चिरयुक्तत्वात् चिरधृतत्वात् संस्थानवन्ति हस्तेषु तत्तदाभरणसंस्थानानि दृश्यन्त इत्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.42:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Два «собачьих клыка»… (śvadaṃṣṭrau) – согласно санскритским комментариям, «собачьи клыки» (śvadaṃṣṭra) в данном случае название украшения для ушей. В комментарии «Таттвадипика» отмечается, что они имеют форму цветка (kusumākāra).", "service": [], "suggestions": [], "seq": 36}]}, {"verse_id": "5.15.45", "verse": "45", "sanskrit_iast": "pītaṃ kanakapaṭṭābhaṃ srastaṃ tad vasanaṃ śubham । uttarīyaṃ nagāsaktaṃ tadā dṛṣṭaṃ plavaṃgamaiḥ ॥45॥", "leonov_ru": "Прекрасное верхнее платье, желтое, словно слиток золота, упавшее Зацепившееся за дерево, увидено было обезьянами.", "commentary": {"siromani": "अन्तरीयवस्त्रमात्रधारणमपि हेतुरिति बोधयन्नाह-- पीतमिति । कनकपट्टस्याभा दीप्तिर्यस्मिन् तत्पीतमुत्तरीयं नगासक्तं वृक्षे संसक्तं प्लवङ्गमैर्वानरैस्तदा आसञ्जनसमये दृष्टम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.45:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Сброшенную накидку (srastaṃ tad vasanaṃ śubham uttarīyaṃ) – таким образом, потеряв верхнее платье, Сита теперь одета так, как подобает отшельнице.", "service": [], "suggestions": [], "seq": 37}]}, {"verse_id": "5.15.46", "verse": "46", "sanskrit_iast": "bhūṣaṇāni ca mukhyāni dṛṣṭāni dharaṇītale । anayaivāpaviddhāni svanavanti mahānti ca ॥46॥", "leonov_ru": "Превосходные украшения были увидены [тогда обезьянами] на земле, Огромные, звенящие, которые были брошены ею (Ситой).", "commentary": {"siromani": "भूषणानीति । अनयैव अपविद्धानि परिक्षिप्तानि भूषणानि दृष्टानि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "tier1:5.15.46:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Когда Равана похитил Ситу и летел с ней в Ланку, она увидела на земле пятерых обезьян и бросила им свои украшения и желтую шелковую накидку, в надежде, что эти обезьяны расскажут о ней Раме. (Рам. III, 54, 2).", "service": [], "suggestions": [], "seq": 38}]}, {"verse_id": "5.15.47", "verse": "47", "sanskrit_iast": "idaṃ ciragṛhītatvād vasanaṃ kliṣṭavattaram । tathāpyanūnaṃ tadvarṇaṃ tathā śrīmad yathetarat ॥47॥", "leonov_ru": "От долгого ношения это платье сильно истерлось, Однако цвет его такой же великолепный, как и у того другого.", "commentary": {"tilaka": "इदानीं सीतात्वोपपादकमाह-- वैदेह्या इति । तदा स्वप्रस्थानसमये । \"गात्रशोभीनि\" इति पाठः कतकसंमतः । येष्वङ्गेषु यान्याभरणजालान्यकीर्तयत्तान्याभरणजालानि तत्तद्गात्रशोभीन्यलक्ष्यदिति प्रत्यभिज्ञाप्रामाण्यं सिद्धम् । तीर्थस्तु-- \"शाखाशोभीनि\" इति पाठं प्रकल्प्य रामविश्लेषसमये भूषणधारणस्यानुचितत्वाद्वैदेह्या भूषणानि स्वाङ्गेभ्य उन्मुच्य शाखायां न्यस्तानीति गम्यत इति व्याचख्यौ, तत्तूत्तरश्लोकयोर्हस्तेष्विति तथा श्यामानि चिरयुक्तत्वादिति पदस्वरसविरुद्धम् । किञ्चैवं तदङ्गे रामोक्ताभरणाभावादसीतत्वमेव स्यात्\nइदं वसनम् अन्तरीयवस्त्रमित्यर्थः । चिरधृतत्वात्क्लिष्टवत्तरं शयनादिना मृदितं तथापि तद्वर्णम् । स पीतो रागः । अनूनमप्रच्युतम् क्लीबत्वमार्षम् । अर्धर्चादिर्वा वर्णशब्दः । तथा श्रीमच्छोभावत् । यथेतरत् अस्मद्गृहीतमुत्तरीयमित्यर्थः", "bhusana": "इदं चिरगृहीतत्वाद्वसनं क्लिष्टवत्तरम् ।\n\nतथापि नूनं तद्वर्णं तथा श्राद्यथेतरत्\nइदमिति । इतरत् उत्सृष्टम् तदुत्तरीयं यथा यादृशवर्णयुक्तं यथा श्रीमत् इदम् इदानीं धार्यमाणं तद्वर्णं तथा श्रीमत् नूनमिति योजना", "siromani": "इदमिति । यद्यपि चिरगृहीतत्वाद्धेतोरिदं वसनं क्लिष्टवत्तरम् अतिबाधिताभं तथापि तद्वर्णं पतिवर्णविशिष्टं तथा श्रीमत् बह्वैश्वर्यलभ्यं यथा इदम् अन्तरीयं तथा इतरत् तद्वृक्षासक्तोत्तरीयमपि"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "phase2:5.15.47:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "gātraśobhīni pāṭhaḥ (Kataka vs. Tīrtha)", "note_ru": "«Тилака» указывает на разногласие предшественников: Катака поддерживает чтение gātraśobhīni (украшения на теле, что и обосновывает узнавание), Тиртха — śākhāśobhīni (украшения сняты и оставлены на ветке). Сам Тилака отвергает чтение Тиртхи: далее в тексте украшения названы «потемневшими от долгого ношения» и находящимися «на руках» — это противоречит версии о снятых и подвешенных украшениях.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "именованный текстологический спор двух предшествующих комментаторов (Катака / Тиртха), сохранённый и разрешённый Тилакой аргументом от внутренней согласованности — за пределами подстрочника и не затронут ни Леоновым/Костиной, ни Phase-1", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 39}]}, {"verse_id": "5.15.49", "verse": "49", "sanskrit_iast": "iyaṃ sā yat kṛte rāmaś caturbhir iha tapyate । kāruṇyenānṛśaṃsyena śokena madanena ca ॥49॥", "leonov_ru": "Вот та, из-за которой Рама четырьмя терзается – Состраданием, мягкосердечием, скорбью и страстью.", "commentary": {"tilaka": "कृष्णानि वक्त्राणि चाक्षिपक्ष्माणि यत्र तेन\nसेयमेव । के चत्वारस्तत्राह कारुण्येनेति", "bhusana": "इयं सा यत्कृते रामश्चतुर्भिः परितप्यते ।\n\nकारुण्येनानृशंस्येन शोकेन मदनेन च\nरामः कारुण्यादिभिश्चतुर्भिः यत्कृते परितप्यते सेयम्", "siromani": "इयमिति । चतुर्भिः कारुण्यादिभिर्यत्कृते यदर्थं रामस्तप्यते सा इयमेव"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "lexical:5.15.49:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kāruṇya", "note_ru": "Карунья (kāruṇya, n.) — «сострадание» (от karuṇa «жалость», √kṛ- или субст. karuṇa + -ya; MW: kāruṇya 'compassion, pity'). В 15.49–50 четыре чувства Рамы перечислены как: kāruṇya, ānṛśaṃsya («мягкосердечие», отсутствие жестокости), śoka («скорбь»), madana («страсть»). Это — тетрада аффектов, соответствующая базовым расам (karuṇa-rasa, śānta, karuna, śṛṅgāra). Хануман формулирует психологический портрет Рамы через rasa-категории. Kāruṇya здесь — не бытовая «жалость», а специфически раса каруна: эстетическое сострадание, близкое к трагическому чувству.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:kAruRya", "source_links": [{"label": "MW kAruRya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=kAruRya"}], "seq": 40}]}, {"verse_id": "5.15.52", "verse": "52", "sanskrit_iast": "asyā devyā manas tasmiṃs tasya cāsyāṃ pratiṣṭhitam । teneyaṃ sa ca dharmātmā muhūrtam api jīvati ॥52॥", "leonov_ru": "Душа той царевны в нем, а его [душа] в ней пребывает. Поэтому она и тот благочестивый (Рама) могут прожить хотя бы миг. (иначе бы они не могли прожить и мгновения).", "commentary": {"tilaka": "अथान्योन्यानुरागमाह अस्या देव्या इति । येनास्याश्चित्तं रामे सक्तं तस्य चास्यां तेनेयं स च जीवति । चित्तसंनिधानेन वियोगाभावादिति भावः । मुहूर्तमपीत्यस्यान्यथेत्यादिः-- न जीवेदिति च शेषः", "bhusana": "अस्या देव्या मनस्तस्मिंस्तस्य चास्यां प्रतिष्ठितम् ।\n\nतेनेयं स च धर्मात्मा मुहूर्तमपि जीवति\nतथा ऽनोयरन्योन्यस्यानुरागमाह अस्या इति । अस्या देव्याः मनस्तस्मिन् रामे प्रतिष्ठितम्, तेन हेतुना इयं मुहूर्तमपि जीवति । तस्य  च मनो ऽस्यां प्रतिष्ठितम्, तेन कारणेन स मुहूर्तमपि जीवति । तयोरन्योन्यं मनोनिवेशनाभावे मुहूर्तजीवनमपि न घटत इति भावः", "siromani": "अस्या इति । अस्याः मनः तस्मिन् रामे तस्य रामस्य च मनः अस्यां तेन हेतुना इयं स च जीवति मुहुर्तमपि अन्यथा न जीवेदित्यर्थः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-15", "notes": [{"id": "lexical:5.15.52:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "manas (parasparapratiṣṭhita)", "note_ru": "Манас (manas, n.) — «ум, сознание, сердце» (√man-, «думать», Whitney #729; MW: manas 'mind, intellect, intelligence; the seat of feeling and volition'). В 15.52 сформулирован высший парадокс любви: «asyā manas tasmiṃs tasya cāsyāṃ pratiṣṭhitam» — «её manas пребывает в нём, его — в ней». Pratiṣṭhita (pra+√sthā-, «стоять», «основаться») — архитектурная метафора: manas одного человека = несущая опора другого. В санскритской психологии manas — не эмоции (bhāva), а «орган воли и внимания»: говорится, что, когда manas двоих взаимно «установлен» в другом, их жизни держатся только этим взаимным укоренением. Стих объясняет, почему они оба ещё живы вопреки страданию.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:manas", "source_links": [{"label": "MW manas", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=manas"}], "seq": 41}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG

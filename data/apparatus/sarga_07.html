инерал, а не «изумруд» и не «ляпис-лазурь»: в классических источниках vaidūrya — кошачий глаз (хризоберилл или феноменальный турмалин), добывавшийся в регионе Видура (Южная Индия). MW: vaidūrya 'a cat's-eye gem; lapis lazuli'. Апте: 'a kind of precious stone, the cat's eye or lapis lazuli'. Примечательно двойственное толкование даже в словарях: в Артхашастре vaidūrya — один из девяти ratna первого ряда. В поэзии Сундараканды этот камень — неотъемлемый атрибут дворцов Раваны, создающий образ синеватого мерцающего блеска (ср. V.9.16 indranīla). Перевод «изумруд» или «ляпис-лазурь» — неточен и различен у переводчиков; минералогическая специфика утрачивается.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vEdUrya+dic_apte:vEdUrya", "source_links": [{"label": "MW vEdUrya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=vEdUrya"}, {"label": "APTE vEdUrya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=vEdUrya"}], "seq": 1}]}, {"verse_id": "5.7.2", "verse": "2", "sanskrit_iast": "niveśanānāṃ vividhāś ca śālāḥ । pradhānaśaṅkhāyudhacāpaśālāḥ । manoharāś cāpi punar viśālā । dadarśa veśmādriṣu candraśālāḥ ॥2॥", "leonov_ru": "В зданиях различные комнаты, Большие комнаты для [хранения] раковин, оружия и луков, И еще прекрасные и широкие Увидел на вершине дворца террасы.", "commentary": {"tilaka": "प्रधानैः प्रशस्तैः शङ्खादिभिः शालन्ते शोभन्ते तादृशीर्निवेशनानां शाला अवान्तरगृहाणि ददर्श । पुनश्च विशालाश्चन्द्रशाला ददर्श । वेश्माद्रिष्वौन्नत्यादद्रितुल्यवेश्मसु । चन्द्रशालाः शिरोगृहाणि, चन्द्रकान्तमणिबद्धशाला वा", "bhusana": "निवेशनानां विविधाश्च शालाः प्रधानशङ्खायुधचापशालाः ।\n\nमनोहराश्चापि पुनर्विशाला ददर्श वेश्माद्रिषु चन्द्रशालाः\nनिवेशनानां शालाः गृहान्तःशालाः । प्रधानैर्मुख्यैः शङ्खायुधचापैः शालन्ते प्रकाशन्त इति प्रधानशङ्खायुधचापशालाः । पचाद्यच् । वेश्मादिषु हर्म्यप्रासादादिषु । चन्द्रशालाः शिरोगृहाणि", "siromani": "निवेशनानामिति । प्रधानैः aiś cāpi supūjitāni । sarvaiś ca doṣaiḥ parivarjitāni । kapir dadarśa svabalārjitāni ॥3॥", "leonov_ru": "Дома, сияющие разнообразными богатствами, Почитаемые даже богами и асурами, Лишенные каких-либо недостатков, Обретенные собственной силой [Раваны], увидела обезьяна.", "commentary": {"tilaka": "वसु धनम् । स्वबलेत्यत्र स्वशब्दो रावणवाची कुबेराद्रावणेन लङ्काया आच्छिद्य गृहीतत्वात् । यद्वा स्वशब्दो हनुमद्वाची । स्वबलेनार्जितानि लब्धप्रवेशानि", "bhusana": "गृहाणि नानावसुराजितानि देवासुरैश्चापि सुपूजितानि ।\n\nसर्वैश्च दोषैः परिवर्जितानि कपिर्ददर्श स्वबलार्जितानि\nनानावसुराजितानि नानारत्नराजितानि", "siromani": "गृहाणीति । नानावसुभिः अनेकविधधनैः राजितानि देवासुरैरपि सुपूजितानि अतिप्रशंसितानि स्वबलार्जितानि रावणबलेन कुबेरात्प्राप्तानि गृहाणि कपिर्ददर्श"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-7", "notes": [{"id": "tier1:5.7.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Добытые силою Раваны (svabalārjitāni) – букв. «обретенные своей силой». Автор «Тилаки» отмечает, что это слово может относиться как к Раване, так и к Хануману. В первом случае речь идет о победе Раваны над Куберой, прежним властителем Ланки. Во втором случае подразумевается сила Ханумана, совершившего разнообразные подвиги, чтобы достичь дворца Раваны.", "service": [], "suggestions": [], "seq": 4}, {"id": "lexical:5.7.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "deva_asura_conflict", "note_ru": "Война богов и асуров (deva–asura saṃgrāma) — циклический мифологический конфликт, структурирующий индуистскую космологию: боги (deva) и антибоги (asura) сражаются за контроль над мирозданием. В «Балаканде» конфликт подробно изложен в связи с рождением Рамы как аватары Вишну (Рам. I.15.14–28). В V.7.3 дома в Ланке характеризуются как «supūjitāni devāsuraiḥ» («почитаемые и богами, и асурами») — парадоксальная фраза: захваченная Равана-демоном Ланка вызывает восхищение обеих враждующих сторон. Гринцер: кн. I, комментарий к гл. 15.", "type": "Г", "subtype": "hist_cultural", "trigger": "myth_background", "source": "MW s.v. deva_asura_conflict; Гринцер, кн. I–III", "source_links": [], "collision_tier1": true, "seq": 5}]}, {"verse_id": "5.7.4", "verse": "4", "sanskrit_iast": "tāni prayatnābhisamāhitāni । mayena sākṣād iva nirmitāni । mahītale sarvaguṇottarāṇi । dadarśa laṅkādhipater gṛhāṇi ॥4॥", "leonov_ru": "Те с тщательностью построенные, Словно бы созданные самим Майей (архитектором асуров), На земле наивысшие по всем качествам Дома владыки Ланки увидел [Хануман].", "commentary": {"bhusana": "तानि प्रयत्नाभिसाहितानि मयेन साक्षादिव निर्मितानि ।\n\nमहीतले सर्वगुणोत्तराणि ददर्श लङ्काधिपतेर्गृहाणि\nप्रचत्नाभिसमाहितानि प्रयत्नेन यथायोगं स्थापितानि । मयेनेति विश्वकर्मा लक्ष्यते । महीतले निर्मितानि । इव शब्देन मयस्य निर्मातृत्वव्याजमात्रम् । रावणप्रयत्नेनैव निर्मितानीत्यर्थः । यद्वा अन्यानि गृहाणि विश्वकर्मनिर्मितानि, इमानि तु मयं व्याजीकृत्य स्वयमुपायप्रदर्शनमुखेन निर्मितानीति पूर्वगृहेभ्यो विशेष उच्यते", "siromani": "तानीति । प्रयत्नेन अभिसमाहितानि चतुर्दिक्षु क्रमेण संनिवेशितानि मयेन साक्षान्निर्मितानीव विश्वकर्मणा निर्मितत्वे ऽपि अनेकमायामयत्वान्मयनिर्मितसदृशानीत्यर्थः, सर्वगुणोत्तराणि सर्वगुणैः श्रेष्ठानि गृहाणि ददर्श"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-7", "notes": [{"id": "lexical:5.7.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "maya", "note_ru": "Майя (maya, m.) — мастер-архитектор асуров, аналог Вишвакармана на стороне демонов. MW: maya 'the Dānava artificer and architect, i.e. the Vulcan of the Hindu mythology'. В эпосе Майе приписывается строительство дворца пандавов Индрапрастхи (Сабхапарва) и подводного дворца иллюзий. Сравнение с Майей — наивысшая похвала архитектурному совершенству: здания Ланки столь безупречны, что кажутся выстроенными не людьми, а архитектором-асуром с его māyā-мастерством. Подстрочник («словно созданные самим Майей») сохраняет имя, но не объясняет культурный ранг фигуры.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:maya", "source_links": [{"label": "MW maya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=maya"}], "seq": 6}, {"id": "phase2:5.7.4:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mayena sākṣād iva nirmitāni", "note_ru": "«Бхушана» и «Широмани» расходятся в том, что означает сравнение с Майей. По «Бхушане», обычные дома Ланки строил Вишвакарман, а этот дворец возведён самим Раваной хитростью, лишь под видом творения Майи; по «Широмани», дворец действительно творение Вишвакармана, но из-за обилия иллюзии лишь кажется творением Майи.", "type": "Б", "source_commentary": ["bhusana", "siromani"], "why_proposed": "контрастное расхождение о том, кто в действительности построил дворец Раваны — вопрос авторства, скрытый за формулой сравнения «словно Майей»", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 7}]}, {"verse_id": "5.7.6", "verse": "6", "sanskrit_iast": "mahītale svargam iva prakīrṇaṃ । śriyā jvalantaṃ bahuratnakīrṇam । nānātarūṇāṃ kusumāvakīrṇaṃ । girer ivāgraṃ rajasāvakīrṇam ॥6॥", "leonov_ru": "Словно небо, спустившееся на землю (рассеянное по земле), Сияющий великолепием, покрытый множеством драгоценных камней, Покрытый цветами различных деревьев, Подобный вершине горы, покрытой пыльцой.", "commentary": {"tilaka": "प्रकीर्णं पातितम्, रत्नकीर्णं रत्नपूर्णम्, रजसा पुष्परजसा", "bhusana": "महीतले स्वर्गमिव प्रकीर्णं श्रिया ज्वलन्तं बहुरत्नकीर्णम् ।\n\nनानातरूणां कुसुमावकीर्णं गिरेरिवाग्रं रजसा ऽवकीर्णम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-7", "notes": [{"id": "tier1:5.7.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "пыльцою усыпанная (rajasāvakīrṇam) – букв. «пылью». В «Тилаке» поясняется, что речь идет о puṣparajas (цветочной пыльце).", "service": [], "suggestions": [], "seq": 8}]}, {"verse_id": "5.7.7", "verse": "7", "sanskrit_iast": "nārīpravekair iva dīpyamānaṃ । taḍidbhir ambhodharam arcyamānam । haṃsapravekair iva vāhyamānaṃ । śriyā yutaṃ khe sukṛtāṃ vimānam ॥7॥", "leonov_ru": "Прекрасными женщинами он сиял, Словно облако, блистающее молниями, Обладал он величием, словно летающая колесница праведных, Влекомая по небу лучшими гусями.", "commentary": {"tilaka": "नारीप्रवेकैर्नारीश्रेष्ठैः इवश्चार्थे । तडिद्भिरर्च्यमानं युज्यमानमम्भोधरं मेघमिव । हंसश्रेष्ठैर्वाह्यमानमूह्यमानं विमानमिव", "bhusana": "नारीप्रवेकैरिव दीप्यमानं तडिद्भिरम्भोदवदर्च्यमानम् ।\n\nहंसप्रवेकैरिव वाह्यमानं श्रिया युतं खे सुकृतां विमानम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-7", "notes": [{"id": "lexical:5.7.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vimāna", "note_ru": "Вимана (vimāna, n.) — «летающий дворец / воздушная колесница», vi+√mā- («отмерять во всех направлениях») → «то, что измерено вовне (за пределами земли)». MW: vimāna 'a heavenly car or chariot, the car of the gods; a palace of the gods'. Термин принципиально двузначен: (1) небесная колесница как транспортное средство; (2) дворец/храм в небесах. В «Сундараканде» оба значения активны одновременно применительно к Пушпаке: это и летящее здание, и резиденция. Древнейшие упоминания vimāna — в Ригведе (1.34.9, об Ашвинах). Позднейшая традиция vimāna-šāstra (трактаты об «аэронавтике богов») выросла из эпических описаний типа Сундараканды.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:vimAna", "source_links": [{"label": "MW vimAna", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=vimAna"}], "seq": 9}]}, {"verse_id": "5.7.8", "verse": "8", "sanskrit_iast": "yathā nagāgraṃ bahudhātucitraṃ । yathā nabhaś ca grahacandracitram । dadarśa yuktīkṛtacārumeghacitraṃ । vimānam bahuratnacitram ॥8॥", "leonov_ru": "Подобную вершине горы, разноцветная благодаря множеству минералов, Подобную небу, сияющее планетами и луной, Красочную, словно скопление разноцветных облаков, Летающую колесницу (Пушпаку) увидел он, сияющую множеством драгоценных камней.", "commentary": {"bhusana": "यथा नगाग्रं बहुधातुचित्रं यथा नभश्च ग्रहचन्द्रचित्रम् ।\n\nददर्श युक्तीकृतमेघचित्रं विमानरत्नं बहुरत्नचित्रम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-7", "notes": [{"id": "tier1:5.7.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Увидел Хануман Пушпаку, всю в самоцветах (dadarśa vimānam bahuratnacitram) – в оригинале просто «виману». Комментаторы поясняют, что в этой строфе начинается описание виманы Пушпаки.", "service": [], "suggestions": [], "seq": 10}]}, {"verse_id": "5.7.9", "verse": "9", "sanskrit_iast": "mahī kṛtā parvatarājipūrṇā । śailāḥ kṛtā vṛkṣavitānapūrṇāḥ । vṛkṣāḥ kṛtāḥ puṣpavitānapūrṇāḥ । puṣpaṃ kṛtaṃ kesarapatrapūrṇam ॥9॥", "leonov_ru": "[На ней] была изображена Земля с горными хребтами, Горы, поросшие множеством деревьев, Деревья с обилием цветов, [И каждый] цветок с тычинками и лепестками.", "commentary": {"tilaka": "यत्र पुष्पके मही अनेकजनानामाधारस्थानं पर्वतराज्या पूर्णम् । प्रवतादयश्चात्र मणिस्वर्णादिनिर्मिताः, न त्विदं चित्ररूपमिति भ्रमितव्यम् अनन्तवानरसेनाया निर्बाधं तत्रावस्थानस्य वक्ष्यमाणत्वात् । किं च स्वामीच्छानुसारेण सङ्कोचविकासौ तस्य वक्ष्यति स्वेच्छया हनुमद्देहवत् । वितानं समूहः । एकावल्यत्रालङ्कारः\nप्रवालजाम्बूनदकृतानि पुष्पाणि पक्षेषु येषाम् । आवर्जिताः सङ्कुचिता जिह्मा वक्राः पक्षा येषां ते । साक्षात्कामस्य पक्षा इव येषां पक्षा भान्ति तदुद्दीपकत्वात् । तादृशा उच्यमानगुणा विहङ्गास्तत्र कृताः", "bhusana": "मही कृता पर्वतराजिपूर्णा शैलाः कृता वृक्षवितानपूर्णाः ।\n\nवृक्षाः कृताः पुष्पवितानपूर्णाः पुष्पं कृतं केसरपत्त्रपूर्णम्\nमहीति । यत्रेति शेषः । यत्र विमाने पर्वतराजिपूर्णा मही कृता चित्ररूपेण लिखिता । एवमुत्तरत्रापि बोध्यम् । अत्र पूर्वपूर्वं प्रत्युत्तरोत्तरस्य विशेषवत्त्वादधिकालङ्कारः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-7", "notes": [{"id": "phase2:5.7.9:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kṛtā", "note_ru": "«Тилака» настаивает, что горы, деревья и цветы на вимане Пушпаке — не простое изображение (citrarūpam), а магически явленная реальность из самоцветов и золота: далее в тексте на этом же пространстве размещается целое войско обезьян, а сама вимана по воле хозяина расширяется и сжимается, как тело Ханумана.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "оспаривает буквальное прочтение «была изображена» (подстрочник передаёт как живопись) — по Тилаке речь о магически овеществлённом ландшафте, а не картине", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 11}]}, {"verse_id": "5.7.13", "verse": "13", "sanskrit_iast": "pravālajāmbūnadapuṣpapakṣāḥ । salīlam āvarjitajihmapakṣāḥ । kāmasya sākṣād iva bhānti pakṣāḥ । kṛtā vihaṃgāḥ sumukhāḥ supakṣāḥ ॥13॥", "leonov_ru": "С цветами из кораллов и золота на крыльях (перьях), Игриво изогнувшие крылья, Чьи перья сияют, словно у самого Камы [на стрелах], Изображены [на вимане] были птицы с прекрасными клювами и крыльями (перьями).", "commentary": {"bhusana": "प्रवालजाम्बूनदपुष्पपक्षाः सलीलमावर्जितजिह्मपक्षः ।\n\nकामस्य साक्षादिव भान्ति पक्षाः कृता विहङ्गाः सुमुखाः सुपक्षाः\nप्रवालजाम्बूनदकृतानि पुष्पाणि पक्षेषु येषां ते प्रवालजाम्बूनदपुष्पपक्षाः । सलीलमावर्जितजिह्मपक्षाः सलीलमालम्बितवक्त्रपक्षाः । कामस्य पाक्षा इव कामस्य सहाया इव", "siromani": "प्रवालेति । प्रवालैः जाम्बूनदपुष्पैश्च युक्ताः पक्षाः येषाम् अत एव सुपक्षाः शोभनपक्षविशिष्टाः सलीलं लीलापूर्वकम् आवर्जिताः शिल्पविशेषेण मक्षिकादिवर्जनक्रियाविशिष्टाः जिह्यपक्षाः येषां ते सुमुखाः विहङ्गाः कृताः अत एव तेषां पक्षाः कामस्य कामाश्रयीभूतमनसः पक्षाः प्रग्रहीतार इव भान्ति तत्पक्षदर्शनमात्रेण विमाने स्थितिः प्रतीयत इत्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-7", "notes": [{"id": "tier1:5.7.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "стрелах Камы", "kind": "note", "text": "По переводам и комментариям (например, Бхушана) эти птицы - как спутники (कामस्य पाक्षा इव कामस्य सहाया इव) Камы"}], "suggestions": [], "seq": 12}]}, {"verse_id": "5.7.14", "verse": "14", "sanskrit_iast": "niyujyamānāś ca gajāḥ suhastāḥ । sakesarāś cotpalapatrahastāḥ । babhūva devī ca kṛtā suhastā । lakṣmīs tathā padmini padmahastā ॥14॥", "leonov_ru": "Изображены были и слоны с прекрасными хоботами, Покрытые тычинками цветов, держащие в хоботах голубые лотосы, И была изображена там прекраснорукая богиня Лакшми среди лотосового пруда с лотосами в руках.", "commentary": {"tilaka": "नियुज्यमाना व्याप्रियमाणाः । वक्ष्यमाणाया लक्ष्म्या अभिषेके इति शेषः । हस्तः शुण्डा । पद्माकरविहारिगजाकारनिर्माणात्सकेसरत्वमुत्पलपत्रहस्तत्वं च तेषां तादृशा गजास्तत्र कृता बभूवुरिति शेषः, पद्मिनि पद्मवत्सरसि", "bhusana": "नियुज्यमानास्तु गजाः सुहस्ताः सकेसराश्चोत्पलपत्रहस्ताः ।\n\nबभूव देवी च कृता सुहस्ता लक्ष्मीस्तथा पद्मिनि पद्महस्ता\nनियुज्यमानाः स्वयमेवात्मानं नियोजयन्तः । कर्मकर्तरि यक् । यत्र विमाने । पद्मिनि पद्माकरे । स्वयमेवोत्पलपत्राभिषेककर्मणि प्रवर्तमानाः । सुहस्ताः शोभनशुण्डादण्डाः । सकेसराः कृतजलावगाहत्वेनाङ्गलग्नकिञ्जल्काः", "siromani": "नियुज्यमाना इति । पद्मिनि पद्मविशिष्टे विमानसरसि उत्पलपत्रहस्ताः अत एव सकेसराः गजा नियुज्यमानाः निर्मिता बभूवुः । पद्महस्ता पद्मयुक्तकरा अत एव सुहस्ता शोभनहस्तविशिष्टाः देवीः अतिप्रकाशविशिष्टा लक्ष्मीः कृता निर्मिता बभूव । बभूवेति वचनविपरिणामेन पूर्वान्वय्यपि"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-7", "notes": [{"id": "tier1:5.7.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…Лакшми, / Среди лотосового пруда, с лотосами в руке (lakṣmīs tathā padmini padmahastā) – вероятно, отсылка к иконографическому изображению богини Лакшми со слонами (Гаджа-Лакшми). Древнейшие подобные изображения относятся к III – II векам до новой эры.", "service": [], "suggestions": [], "seq": 13}, {"id": "lexical:5.7.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "lakṣmī", "note_ru": "Лакшми (lakṣmī, f.) — богиня счастья и процветания; этимология: √lakṣ- («замечать, распознавать», MW) + суфф. -mī, или родственно lakṣaṇa «знак, примета». MW: lakṣmī 'good luck, fortune, prosperity, beauty; the goddess of fortune and beauty'. Иконографически зафиксирована в V.7.14 в точном каноническом образе: padminī «среди лотосов» + padmahastā «с лотосом в руке» — стандартная Гаджа-Лакшми (abhiṣeka-Lakṣmī), где слоны (gaja) поливают её водой из хоботов. Изображение Лакшми на Пушпаке — знак, что вимана несёт śrī («процветание») по природе, не случайно: Пушпака была подарена Брахмой Кубере, богу богатства.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:lakzmI+dic_apte:lakzmI", "source_links": [{"label": "MW lakzmI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=lakzmI"}, {"label": "APTE lakzmI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/AP90Scan/2020/web/webtc/indexcaller.php?key=lakzmI"}], "collision_tier1": true, "seq": 14}]}, {"verse_id": "5.7.15", "verse": "15", "sanskrit_iast": "itīva tad gṛham abhigamya śobhanaṃ । savismayo nagam iva cārukandaram । punaś ca tat paramasugandhi sundaraṃ । himātyaye nagam iva cārukandaram ॥15॥", "leonov_ru": "Так, достигнув прекрасного дворца, Был изумлен [Хануман], подобного горе с прекрасными пещерами, Или же прекрасному благоухающему В начале весны дереву с прекрасными полостями (дуплами).", "commentary": {"siromani": "तत इति । उच्छ्रितमेघस्य रूपमाकार इव रूपं यस्य काञ्चनस्य चारुरूपमिव रूपं यस्य तत् रक्षोधिपस्य रावणस्य आत्मबलानुरूपं तद्बलसदृशम् अत एव अप्रतिरूपम् उपमारहितं रूपं स्वरूपं यस्य तत् महीतले प्रकीर्णं पतितं स्वर्गमिव कुसुमावकीर्णं कुसुमैर्व्याप्तं रक्षोधिपस्य गृहोत्तमम् उत्तमं गृहं रजसा पुष्पाणामिति शेषः, अवकीर्णं व्याप्तं गिरेरग्रमिव ददर्श । श्लोकद्वयमेकान्वयि ।। 5.7.5,6 ।।\n\nनारीति । तडिद्भिरर्च्यमानमम्भोधरं मेघमिव नारीप्रवेकैः नारीश्रेष्ठैर्दीप्यमानं हंसप्रवेकैः हंसश्रेष्ठैः खे वाह्यमानं विमानमिव सुकृतं शोभनं कृतं कृतिः रचना यस्मिन् तत् नगाग्रं शैलाग्रं भागमिव युक्तीकृतेन युक्त्या निर्मितेन चारुमेघेन चित्रं विमानं ददर्श । श्लोकद्वयमेकान्वयि ।। 5.7.7,8 ।।\n\nमहीति । यत्र विमाने मही स्थितिभूमिः पर्वतराजिपूर्णा कृता निर्मितपर्वतैः पूरितेत्यर्थः, शैलास्तु वृक्षवितानैः तरुसमूहैः पूर्णाः कृताः पुष्पं च केसरपत्राभ्यां पूर्णं कृतम् एकावल्यलङ्कृतिः\nइतीवेति । चारुकन्दरं शोभनकोटरविशिष्टं परमसुगन्धि नगं वृक्षमिव सुन्दरं परमसुगन्धि नगं पर्वतमिव तत् गृहं पुनः पुनरभिगम्य सविस्मयः विस्मयसहितः अभवदिति शेषः\nतदेव भङ्ग्यन्तरेणाह-- तत इति । बहुविधेन दास्याद्यनेकप्रकारभावनया भावितः परिशीलितः आत्मा परात्मा रामो येन तस्य अत एव सचक्षुषः अप्राकृतचक्षुर्विशिष्टस्य कृतात्मनः कृतान्वेषणप्रयत्नस्य सुवर्त्मनः शोभनमार्गावलम्बिनः प्रविचरतः जनकसुताम् अपश्यतः महात्मनो हनुमतो मनः अतिदुःखितमभवत्", "tilaka": "इतीवैवंप्रकारं चारुकन्दरं चारुगुहं नगमिव पर्वतमिव चारुदर्शनं तद्गृहमभिगम्य सविस्मयः बभूवेति शेषः । हिमात्ये वसन्ते परमसुगन्धिचारुकन्दरं नगमिव वृक्षमिव कन्दरो ऽत्र कोटरः । पुनश्चाभिगम्य सविस्मयो ऽभूदिति शेषः । परिच्छेदानवगमादिति भावः", "bhusana": "इतीव तद् गृहमभिगम्य शोभनं सविस्मयो नगमिव चारुशोभनम् ।\n\nपुनश्च तत्परमसुगन्धिसुन्दरं हिमात्यये नगमिव चारुकन्दरम्\nइतीवेति । इवशब्दो वाक्यालङ्कारे । तद्गृहं तस्य रावणस्य गृहम् । सविस्मयः, अभूदिति शेषः । नगं पर्वतमिव स्थितम् । शोभनं शोभमानम् । चारुशोभनं चारुमङ्गलम् । इतीवेत्येकनिपातो वा प्रकारार्थः । इतीव तद्गृहम् अभिगम्य अभिगत्य । अद्भुतदर्शनात्पुनश्चाभिगम्य सविस्मयो ऽभूदिति योजना । रुचिरावृत्तमिदम् । \"चतुर्ग्रहैरिह रुचिरा जभस्जगाः\" इति लक्षणात्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-7", "notes": [{"id": "tier1:5.7.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…дереву с чарующими дуплами / В начале весны… (himātyaye nagam iva cārukandaram) – в оригинале вторая и четвертая строки почти идентичны. Однако, как отмечают комментаторы, в первом случае слово naga означает гору, а kandara – пещеру, во втором – дерево и дупло соответственно. В начале весны (himātyaye) – букв. «по прошествии снегов». В «Тилаке» поясняется «весной» (vasante).", "service": [], "suggestions": [], "seq": 15}, {"id": "crosstext:5.7.15:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "himātyaya", "note_ru": "Химатьяя (himātyaye) «с окончанием з

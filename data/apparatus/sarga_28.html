<script>
const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 28, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 23, "verses_with_notes": 12, "notes_by_layer": {"tier1": 7, "lexical": 7, "phase2": 3, "edition": 0, "crosstext": 1}}, "sarga": 28, "verses": [{"verse_id": "5.28.1", "verse": "1", "sanskrit_iast": "sā rākṣasendrasya vaco niśamya । tad rāvaṇasyāpriyamapriyārtā । sītā vitatrāsa yathā vanānte । siṃhābhipannā gajarājakanyā ॥1॥", "leonov_ru": "Услышав речь владыки ракшасов Раваны, измученная разлукой с любимым, Сита задрожала, словно в лесу Дочь царя слонов, на которую напал лев.", "commentary": {"bhusana": "सा राक्षसेन्द्रस्य वचो निशम्य तद्रावणस्याप्रियमप्रियार्ता ।\n\nसीता वितत्रास यथा वनान्ते सिंहाभिपन्ना गजराजकन्या", "siromani": "त्रिजटावचनश्रवणानन्तरकालेरपि रावणोक्तिस्मृतिजनितसीताविलापं वर्णयन्नाह सेत्यादिभिः । रावणस्य तत्परुषम् अत एव अप्रियं वचो निशम्य संस्मृत्य अप्रियार्ता अप्रियेण प्रियसंयोगाभावेन आर्ता दुःखिता सा सीता वितत्रास त्रासं प्राप । तत्र दृष्टान्तः वनान्ते वनमध्ये सिंहाभिपन्ना सिंहवशं प्राप्ता गजराजकन्या यथा"}, "has_tier1": true, "notes": [{"id": "tier1:5.28.1:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Услышав слова повелителя ракшасов / Раваны суровые, разлукой измученная… (sā rākṣasendrasya vaco niśamya tad rāvaṇasyāpriyamapriyārtā) – букв. «Услышав неприятную речь Раваны, повелителя ракшасов, страдающая без любимого». Голдмены переводят apriyārtā как so filled with pain, понимая apriya в значении «неприятное» (см.: Goldman 1984: 187). Мы в переводе следуем комментарию «Широмани»."}]}, {"verse_id": "5.28.2", "verse": "2", "sanskrit_iast": "sā rākṣasī madhyagatā ca bhīrur । vāgbhir bhṛśaṃ rāvaṇatarjitā ca । kāntāramadhye vijane visṛṣṭā । bāleva kanyā vilalāpa sītā ॥2॥", "leonov_ru": "Эта робкая, оказавшаяся в окружении ракшаси, Словами Раваны сильно испуганная, Словно бы брошенная посреди лесной чащи Маленькая девочка, запричитала Сита.", "commentary": {"bhusana": "सा राक्षसीमध्यगता च भीरुर्वाग्भिर्भृशं रावणतर्जिता च ।\n\nकान्तारमध्ये विजने विसृष्टा बालेव कन्या विललाप सीता", "siromani": "सेति । राक्षसीमध्यगता भृशमत्यन्तं वाग्भिः रावणतर्जिता सा सीता विजने जनरहिते कान्तारमध्ये निबिडवनमध्यभागे विसृष्टा त्यक्ता कन्या इव बिललाप"}, "has_tier1": true, "notes": [{"id": "tier1:5.28.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В комментариях «Тилака» и «Таттвадипика» отмечается, что речь идет об обычае оставлять девочек в лесу на верную смерть во время голода."}]}, {"verse_id": "5.28.3", "verse": "3", "sanskrit_iast": "satyaṃ batedaṃ pravadanti loke । nākālamṛtyur bhavatīti santaḥ । yatrāham evaṃ paribhartsyamānā; । jīvāmi yasmāt kṣaṇam apy apuṇyā ॥3॥", "leonov_ru": "Правду, увы, говорят в мире праведные, Что не бывает безвременной смерти, Раз я, так оскорбляемая, Живу хотя бы мгновение, недобродетельная.", "commentary": {"bhusana": "सत्यं बतेदं प्रवदन्ति लोके नाकालमृत्युर्भवतीति सन्तः ।\n\nयत्राहमेवं परिभर्त्स्यमाना जीवामि किंचित्क्षणमप्यपुण्या", "siromani": "तदाकारमाह सत्यमित्यादिभिः । यत्र यस्मात् एवं परिभर्त्स्यमाना अत एव पुण्या स्नानाद्यभावेन शुद्धिरहिता अहं किञ्चित्क्षणमपि जीवामि तस्मात् लोके अकालमृत्युर्न भवतीतीदं सन्तः सत्यं प्रवदन्ति"}, "has_tier1": true, "notes": [{"id": "tier1:5.28.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Все-таки живу, чистоты лишенная (jīvāmi yasmāt kṣaṇam apy apuṇyā) – в оригинале использовано слово apuṇyā. Его можно понять, как «лишенная религиозных заслуг», так и в физическом смысле. Последнее толкование предлагает комментарий «Широмани», в котором отмечено, что Сита лишена чистоты из-за отсутствия омовений и других подобных процедур (snānādyabhāvena śuddhirahitā).[Е. Костина] «kṣaṇam apy» Опущено, как и ранее в аналогичном контексте"}, {"id": "lexical:5.28.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "akālamṛtyu", "note_ru": "Акаламритью (akāla-mṛtyu, m., тат-пуруша) — «несвоевременная смерть»: akāla «не-время» (a- + kāla «время, смерть, Яма») + mṛtyu m. от √mṛ- (класс VI, «умирать», Whitney #761). MW: akāla 'wrong time'; mṛtyu 'death, Yama'. Народно-правовая идея акалам̣ритью зафиксирована в «Законах Ману» (Manusmṛti 5.16 и др.): праведник защищён от досрочной смерти кармической силой своей дхармы. Строка nākālamṛtyur bhavatīti santaḥ («добродетельные говорят: несвоевременной смерти не бывает») — цитата этой поговорки. Иронический парадокс Ситы: аксиома защищает её от смерти, хотя она сама желает умереть — жизнь в страдании оказывается страшнее смерти. Подстрочник «преждевременная смерть» не передаёт ни нормативного дхармического смысла, ни иронии.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:akAla+dic_mw:mftyu", "collision_tier1": true}]}, {"verse_id": "5.28.5", "verse": "5", "sanskrit_iast": "naivāsti nūnaṃ mama doṣam atra । vadhyāham asyāpriyadarśanasya । bhāvaṃ na cāsyāham anupradātum । alaṃ dvijo mantram ivādvijāya ॥5॥", "leonov_ru": "Конечно, нет здесь для меня греха, Я должна быть убита этим [Раваной], чей облик неприятен, И не могу я даровать ему любовь, Как дваждырожденный – мантру недваждырожденному.", "commentary": {"bhusana": "नैवास्ति दोषं मम नूनमत्र वध्या ऽहमस्याप्रियदर्शनस्य ।\n\nभावं न चास्याहमनुप्रदातुमलं द्विजो मन्त्रमिवाद्विजाय", "siromani": "नन्वात्मघातदोषप्रसङ्ग इत्यत आह नैवेति । यतः अप्रियदर्शनस्य रावणस्याहं वध्या अतः अत्रात्मविघाते मम दोषं न ककुद्दोषणी इतिभाष्यप्रयोगात् । लिङ्गमशिष्यं लोकाश्रयत्वाल्लिङ्गस्येति भाष्याच्च दोषशब्दस्य नपुंसकत्वमपि । नन्वस्य प्रार्थनास्वीकारेणात्मविघातं निवारयेत्यत आह-- अस्य रावणस्य भावं ममेहैवावस्थानरूपमभिप्रायं प्रदातुं स्वीकर्तुं नाहमलं समर्था । तत्र दृष्टान्तः-- द्विजः अद्विजाय शूद्राय मन्त्रं वेदमिव"}, "has_tier1": false, "notes": [{"id": "lexical:5.28.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mantra", "note_ru": "Мантра (mantra) — mantra — «священная формула» или «тайный совет» (в политическом контексте man-tra «мысль-инструмент»). В советах на суде Раваны — «совет», «политическое решение».", "type": "А", "subtype": "base", "trigger": "term", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}, {"id": "lexical:5.28.5:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vadhyā", "note_ru": "Вадхья (vadhyā, f., adj.) — «подлежащая казни, обречённая на уничтожение» — герундив (кṛтья) от √vadh- «поражать, убивать» (или от √han- в особой форме, MW указывает vadhya как gerundive to vadh/han). MW: vadhya 'to be killed, deserving death; a criminal to be executed'. Герундив выражает модальное долженствование, а не просто описание: vadhyā — не просто «несчастная», но юридически-ритуально «обречённая». Самообозначение Ситы vadhyāham («я — обречённая на смерть») — беспрецедентное само-осуждение: она принимает статус vadhya-strī, женщины, которой суждено погибнуть, вместо статуса pativratā, за который боролась. Подстрочник «я должна умереть» стирает юридический регистр слова.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:vadhya"}]}, {"verse_id": "5.28.6", "verse": "6", "sanskrit_iast": "tasminn anāgacchati lokanāthe । garbhasthajantor iva śalyakṛntaḥ । nūnaṃ mamāṅgāny acirād anāryaḥ । śastraiḥ śitaiś chetsyati rākṣasendraḥ ॥6॥", "leonov_ru": "Когда не приходит этот владыка мира, Как хирург – плод из утробы Несомненно члены моего тела скоро неблагородный Мечом острым разрубит владыка ракшасов.", "commentary": {"siromani": "तस्मिन्निति । लोकनाथे तस्मिन् रामे अनागच्छति सति अनार्यः क्षुद्रो रावणः ममाङ्गानि गर्भस्थजन्तोः दितिंगर्भस्थपवनस्य अङ्गानि शल्यकृन्त इन्द्र इव छेत्स्यति शल्यकृन्त इत्यत्र शोमुम्बार्षः"}, "has_tier1": true, "notes": [{"id": "tier1:5.28.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "То, как врач вырезает плод из утробы (garbhasthajantor iva śalyakṛntaḥ) – комментарий «Таттвадипика» объясняет слово śalyakṛnta как nāpita (цирюльник), комментарий «Тилака» - как āmbaṣṭhavaidya, то есть врач из числа амбаштха (амбаштха – сын брахмана и женщины из варны вайшьев, такие люди обычно занимались медициной). Комментарий «Широмани» предлагает интерпретацию «Индра», видя здесь отсылку к мифу, изложенному в «Вишну-пуране», о том как Индра раздробил на 49 частей зародыш Дити, дочери бога Дакши, в результате чего на свет появились маруты, божества ветра и бури."}, {"id": "lexical:5.28.6:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "lokanātha", "note_ru": "Локаната (loka-nātha, m., тат-пуруша) — «владыка мира(ов)»: loka «мир, люди, область» (этимология спорна; MW связывает с √lok- «видеть» или с √ruc- «сиять»; Grassmann: IE *leuk- «свет») + nātha «защитник, господин» (√nāth-, MW: 'to seek aid; lord, refuge'). MW: lokanātha 'lord of the world; epithet of Vishnu, Brahmā, Śiva, a Buddhist deity'. Эпитет демонстративно многозначен: он прилагается к Вишну, к Брахме, к буддийским бодхисаттвам — и здесь к Раме. Употребление lokanātha применительно к отсутствующему Раме (tasminn anāgacchati lokanāthe — «когда не приходит владыка мира») создаёт ощущение космической покинутости: хозяин всей вселенной не приходит к своей жене. Подстрочник «господин» не передаёт это бого-царское измерение.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:lokanATa", "collision_tier1": true}]}, {"verse_id": "5.28.8", "verse": "8", "sanskrit_iast": "hā rāma hā lakṣmaṇa hā sumitre । hā rāmamātaḥ saha me jananyaḥ । eṣā vipadyāmy aham alpabhāgyā । mahārṇave naur iva mūḍhavātā ॥8॥", "leonov_ru": "О Рама! О Лакшмана! О Сумитра! О мать Рамы с моей матерью! Вот погибаю я, злосчастная, Словно корабль в огромном море, сбитый с курса ветром. О Рама! О Лакшмана! О Сумитра! О матерь Рамы! О моя матерь! Вот, погибаю я ныне, злосчастная, Словно корабль, попавший в бурю.", "commentary": {"bhusana": "हा राम हा लक्ष्मण हा सुमित्रे हा राममातः सह मे जनन्या ।\n\nएषा विपद्याम्यहमल्पभाग्या माहार्णवे नौरिव मूढवाता\nहा रामेति । मूढो वात्यारूपो वातो यस्यास्सा मूढवाता, वात्याहतेत्यर्थः । \"मूढस्तन्द्रितवात्ययोः\"इति विश्वः", "siromani": "हेति । हा राम एषा त्वत्तो वियुक्ता अत एव अल्पभाग्या ऽहं मूढः चित्तविभ्रामकः वातो यस्यां सा महार्णवे नौरिव सह भवद्भिरिति शेषः । विपद्यामि विनश्यामि"}, "has_tier1": true, "notes": [{"id": "tier1:5.28.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "О мать Рамы! О моя матушка (hā rāmamātaḥ saha me jananyaḥ) – Сита родилась из земли, поэтому у нее нет обычной, человеческой матери. Видимо, здесь имеется в виду жена (в оригинале – жены, но в критическом издании принят вариант jananyā вместо jananyaḥ) царя Джанаки.[Е. Костина] «матушка» А здесь jananyaḥ не мн.ч.?"}]}, {"verse_id": "5.28.9", "verse": "9", "sanskrit_iast": "tarasvinau dhārayatā mṛgasya । sattvena rūpaṃ manujendraputrau । nūnaṃ viśastau mama kāraṇāt tau । siṃharṣabhau dvāv iva vaidyutena ॥9॥", "leonov_ru": "Двое отважных царевича, несомненно, погублены по моей вине мощью принявшего олений облик (то есть Маричи), словно лев и бык – молнией.", "commentary": {"bhusana": "तरस्विनौ धारयता मृगस्य सत्त्वेन रूपं मनुजेन्द्रपुत्रौ ।\n\nनूनं विशस्तौ मम कारणात् तौ सिंहर्षभौ द्वाविव वैद्यतेन\nतरस्विनाविति । मृगस्य रूपं धारयता सत्त्वेन जन्तुना । मम कारणात् मन्निमित्तम् । विशस्तौ हिंसितौ । द्वौ सिंहर्षभाविव द्वौ सिंहाविव द्वौ ऋषभाविवेत्यर्थः । वैद्युतेन अशनिना", "siromani": "तरस्विनाविति । मृगस्य रूपं धारयता वैद्युतेन अशनिना इव सत्त्वेन जन्तुविशेषेण सिंहर्षभौ सिहंश्रेष्ठाविव तरस्विनौ मनुजेन्द्रपुत्रौ मम कारणाद्विशस्तौ हिंसितौ नूनं किम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.28.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Тем, кто принял облик олений (dhārayatā mṛgasya sattvena rūpaṃ) – то есть ракшасой Маричей. См. Рамаяна, III, 42: «В одно мгновение стал ракшаса // Оленем удивительной красоты… // Могучий олень со шкурой, // Расцвеченной яркими лотосами, // Он резвился, где только хотел, // Рядом с обителью Рамы».Словно лев и буйвол – ударом молнии (siṃharṣabhau dvāv iva vaidyutena) – автор комментария «Широмани» понимает siṃharṣabhau dvau как «два наилучших льва» (siṃhaśreṣṭhau). Голдмены переводят это выражение как «a pair of bulls or lions» (см.: Goldman 1984: 188)."}]}, {"verse_id": "5.28.12", "verse": "12", "sanskrit_iast": "ananyadevatvam iyaṃ kṣamā ca । bhūmau ca śayyā niyamaś ca dharme । pativratātvaṃ viphalaṃ mamedaṃ । kṛtaṃ kṛtaghneṣv iva mānuṣāṇām ॥12॥", "leonov_ru": "[То, что] нет для меня иного божества [кроме тебя], и это терпение, И сон на земле, и следование дхарме, Верность мужу – [все] это для меня бесплодно, Словно [нечто], сделанное людьми для неблагодарных.", "commentary": {"bhusana": "सा राक्षसेन्द्रस्येत्यादि\nअनन्यदेवत्वमियं क्षमा च भूमौ च शय्या नियमश्च धर्मे ।\n\nपतिव्रतात्वं विफलं ममेदं कृतं कृतघ्नेष्विव मानुषाणाम्", "siromani": "अनन्येति । मम अनन्यदेवत्वं पत्येकपूजिकात्वं क्षमा रावणापराधसहनं च पतिव्रतात्वं पत्येकनिष्ठत्वं च कृतघ्नेषु मानुषाणां कृतमुपकार इव विफलं विनष्टप्रायम्"}, "has_tier1": false, "notes": [{"id": "crosstext:5.28.12:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "niyama / pativratā", "note_ru": "Сита перечисляет свои обеты — «нет иного божества [кроме мужа], терпение, сон на земле, следование дхарме (niyamaś ca dharme), верность мужу (pativratātvam)» — как формальный кодекс женского подвига. Это эпическая параллель шастрической стрӣ-дхарме: муж как единственное божество жены — норма Ману (ср. 5.154 «patiṃ śuśrūṣate … sā svarge mahīyate» и идеал pativratā 9.5). Сита формулирует свой долг терминами niyama/dharma/pativratā, узнаваемыми из дхармашастры, но горько отмечает их кажущуюся «бесплодность» (viphalam) в плену — драматическая инверсия нормы. Свидетельство: уровень шлоки (мягкое).", "type": "А", "cluster": "dharmashastra", "cluster_label": "Дхармашастра (Ману)", "shloka_ref": "V.28.12", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mānavadharmaśāstra 5.151 и 9.5 (Эльманович–Ильин)"}]}, {"verse_id": "5.28.14", "verse": "14", "sanskrit_iast": "pitur nirdeśaṃ niyamena kṛtvā । vanān nivṛttaś caritavrataś ca । strībhis tu manye vipulekṣaṇābhiḥ । saṃraṃsyase vītabhayaḥ kṛtārthaḥ ॥14॥", "leonov_ru": "Отца повеление как должно исполнив, Из леса вернулся [ты], выполнив [свой] долг, Думаю, с женщинами широкоглазыми Забавляешься ты, беззаботный, довольный (тот, чья цель достигнута).", "commentary": {"bhusana": "पितुर्निदेशं नियमेन कृत्वा वनान्निवृत्तश्चरितव्रतश्च ।\n\nस्त्रीभिस्तु मन्ये विपुलेक्षणाभिस्त्वं रंस्यसे वीतभयः कृतार्थः\nपितुर्निदेशम् आज्ञाम्, नियमेन अविच्छेदेन कृत्वा चरितव्रतः चरितवन्यवृत्तिव्रतः वनान्निवृत्तश्च सन् । स्त्रीभिस्तु मत्तोपि विलक्षणाभिः स्त्रीभिः त्वं रंस्यसे । वीतभयः गतवनवासभयः । कृतार्थः निष्पन्नसर्वपुरुषार्थः । मद्विनाशेन पुनर्बह्वीरूढ्वा रंस्यस इति भावः", "siromani": "निरर्थकत्वमेवोपपादयन्ती आह पितुरिति । वीतभयः निवर्तितऋषित्रासः अत एव कृतार्थस्त्वं विपुलेक्षणाभिः स्त्रीभिः तत्कालिकविवाहविधिनार्जितभार्याभिस्त्वं रंस्यसे इत्यहं मन्ये । एतेन रामस्य भार्यान्तरं नास्तीति सूचितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.28.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Забавляешься ты, беззаботный и радостный (saṃraṃsyase vītabhayaḥ kṛtārthaḥ) – букв. «лишенный страха», «исполнивший дело». Автор комментария «Широмани» интерпретирует vītabhayaḥ как «избавивший риши от страха» (nivartitarṣitrāsaḥ) и потому «исполнивший дело» (kṛtārthaḥ).[Е. Костина] «Повеление отца» Нужен будет комм"}, {"id": "phase2:5.28.14:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vītabhayaḥ kṛtārthaḥ", "note_ru": "По Широмани, ревнивая догадка Ситы о том, что Рама «забавляется с широкоглазыми женщинами», тут же опровергается самим комментатором: словами «etena rāmasya bhāryāntaraṃ nāsti iti sūcitam» он поясняет, что этим стихом подразумевается — у Рамы нет другой жены, а горькая речь Ситы — это её собственное отчаянное предположение, а не факт сюжета.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "уточняет статус слов Ситы как риторического отчаяния, а не сюжетного факта — грань, которую подстрочник и собственное примечание Леонова/Костиной (о vītabhayaḥ) не проводят", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.28.17", "verse": "17", "sanskrit_iast": "śokābhitaptā bahudhā vicintya; sītātha veṇīgrathanaṃ gṛhītvā । udbaddhya veṇyudgrathanena śīghram; ahaṃ gamiṣyāmi yamasya mūlam ॥17॥", "leonov_ru": "Мучаясь горем, разными способами размышляя, Сита тогда взялась за косу: «Повесившись на косе волос, быстро я уйду к Яме [богу смерти].", "commentary": {"bhusana": "इतीव देवी बहुधा विलप्य सर्वात्मना राममनुस्मरन्ती ।\n\nप्रवेपमाना परिशुष्कवक्त्रा नगोत्तमं पुष्पितमाससाद", "siromani": "शोकेति । शोकाभितप्ता सीता बहुधा विचिन्त्य वेणीग्रथनं गृहीत्वा वेण्युद्ग्रथनेन वेणीरूपोद्बन्धनेन उद्बध्य गलं बद्ध्वा यमस्य कालस्यापि नियन्तुः मूलं समीपं शीघ्रमहं गमिष्यामीति चिन्तयामासेति शेषः"}, "has_tier1": false, "notes": [{"id": "lexical:5.28.17:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nirveda", "note_ru": "Нирведа (nirveda, m.) — «отвращение к миру, уныние, отчаяние»: ni- (интенсивная приставка или «прочь») + veda? Нет — MW выводит от ni+√vid- в значении «пресыщаться, испытывать отвращение» (класс VI ?) или от √nir-vṛd. MW: nirveda 'indifference (to worldly objects), disgust'. В нāтьяшāстре Бхараты нирведа — один из тридцати трёх вьябхичāри-бхāв (преходящих эмоциональных состояний, vyabhicāri-bhāva), сопровождающих основные расы. Это технический термин эстетики: он отличается от śoka (горе) и viṣāda (уныние) тем, что подразумевает cognitively loaded разочарование в самом существовании. Двукратное повторение nirvedam avāpa sā tu («она впала в ниrveda») подчёркивает эстетический регистр: Вальмики использует термин расашастры, а не обиходное слово для «отчаяния».", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:nirveda"}, {"id": "lexical:5.28.17:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "veṇīgrathana", "note_ru": "Вени-гратхана (veṇī-grathana, n., тат-пуруша) — «завязывание/заплетение косы»: veṇī f. «заплетённые волосы, коса» (MW: 'a braid of hair; a river at a confluence') + grathana n. «связывание, завязывание» от √granth-/grath- «связывать, нанизывать» (Whitney #757). Культурный контекст критически важен: замужняя индийская женщина в норме носит волосы заплетёнными — veṇī как знак bridal/marital статуса. Сита, находясь в плену и в трауре, носит распущенные волосы (экувেṇī, одна коса без украшений) — знак разлучённой с мужем женщины. Здесь она берётся за косу, чтобы использовать её как верёвку для самоубийства (udbaddhya veṇyudgrathanena), — деталь, понятная только через традиционный символизм veṇī. Подстрочник «взяв косу» скрывает этот трагический семиотический жест.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:veRI+dic_mw:graTana"}]}, {"verse_id": "5.28.18", "verse": "18", "sanskrit_iast": "[itīva sītā bahudhā vilapya; sarvātmanā rāmam anusmarantī । pravepamānā pariśuṣkavaktrā; nagottamaṃ puṣpitam āsasāda] ॥18॥", "leonov_ru": "Так Сита причитала разными способами, всей душою вспоминая Раму. Дрожащая, с пересохшими губами, к высокому цветущему дереву подошла.", "commentary": {"siromani": "इतीवेति । इतीव अनेन प्रकारेण सर्वात्मना राममनुस्मरन्ती प्रेवपमाना अतिदुःखेन प्रकम्पं प्राप्नुवन्ती देवी सीता बहुधा अनेकप्रकारं विलप्य पुष्पितं नगोत्तमं शिंशपाम् आससाद तत्र तस्थौ", "bhusana": "शोकाभितप्ता बहुधा विचिन्त्य सीता ऽथ वेण्युद्ग्रथनं गृहीत्वा ।\n\nउद्बध्य वेण्युद्ग्रथनेन शीघ्रमहं गमिष्यामि यमस्य मूलम्\nशोकेति । वेण्युद्ग्रथनं वेणीबन्धनम् । यमस्य मूलं यमस्य समीपम् । अत्रेतिकरणं बोध्यम् । इति विचिन्त्य नगोत्तमं शिंशुपामाससाद । शिंशुपां तामुपागमदिति पूर्वमुक्तम् । तस्य सामीप्येन गमनमद्योच्यते । पुष्पितं शुभसूचनम् । यद्वा पुष्पितमाससाद अग्निग्रवेशं कुर्वन्तीवेत्यर्थः"}, "has_tier1": false, "notes": [{"id": "phase2:5.28.18:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "nagottamaṃ puṣpitam āsasāda", "note_ru": "По Бхушане, слова «подошла к цветущему дереву» допускают и второе прочтение: «как бы совершая вхождение в огонь» (agnipraveśam kurvantīva) — то есть образ уже здесь предвосхищает будущее огненное испытание Ситы (агнипарикшу).", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "вскрывает нарративное предвосхищение (образ будущей агнипарикши), полностью отсутствующее в подстрочнике и не отмеченное в существующих примечаниях", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.28.20", "verse": "20", "sanskrit_iast": "tasyā viśokāni tadā bahūni । dhairyārjitāni pravarāṇi loke । prādurnimittāni tadā babhūvuḥ । purāpi siddhāny upalakṣitāni ॥20॥", "leonov_ru": "У нее тогда [означающие] прекращение горестей, многочисленные Придающие стойкость, известные в мире, Тогда появились приметы, Еще прежде исполненные и замеченные.", "commentary": {"bhusana": "तस्यास्तु रामं प्रविचिन्तयन्त्या रामानुजं स्वं च कुलं शुभाङ्ग्याः ।\n\nशोकानिमित्तानि तथा बहूनि धैर्यार्जितानि प्रवराणि लोके ।\n\nप्रादुर्निमित्तानि तदा बभूवुः पुरापि सिद्धान्युपलक्षितानि ।\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे अष्टाविंशः सर्गः ।। 5.28।।\n\nतस्यास्त्विति । स्वं च कुलं विचिन्तयन्त्या इत्यनेन दुर्मरणात् भीतत्वं व्यज्यते ।  शोकानिमित्तानि शुभसूचकानीत्यर्थः । धैर्यार्जितानि अर्जितधैर्याणि, धैर्यकराणीत्यर्थः । लोके प्रवराणि लोके प्रसिद्धानीत्यर्थः, प्रवरं हि प्रसिद्धं भवति । प्रादुर्बभूवुरित्यन्वयः । पुरापि सिद्धान्युपलक्षितानि पूर्वमपि फलव्याप्तत्वेन दृष्टानि । तान्युत्तररसर्गे विवरिष्यति"}, "has_tier1": false, "notes": [{"id": "lexical:5.28.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dhairya", "note_ru": "Дхайрья (dhairya, n.) — «стойкость, невозмутимость, выдержка»: от dhīra adj. «твёрдый, мудрый, невозмутимый» (√dhī- «мысль, разум», Whitney #599 + суфф. -ra) → абстрактный суфф. -ya. MW: dhairya 'firmness, constancy, courage'. В эпическом и философском контексте dhairya — специфическая добродетель, противопоставленная kātarya «малодушию»: это устойчивость духа, которая не разрушается ни скорбью, ни страхом. Dhairyārjitāni («добытые стойкостью») — предикат благих знамений Ситы: знаки судьбы прочитываются как вознаграждение именно за dhairya, а не за tapas или dharma. Это концептуальное различие важно: Вальмики выстраивает иерархию добродетелей, где выдержка выше аскезы.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:DAirya"}, {"id": "phase2:5.28.20:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "svaṃ ca kulaṃ pravicintayantyāḥ", "note_ru": "По Бхушане, то, что Сита в этот миг вспоминает о собственном роде, выдаёт её внутренний страх перед «дурной смертью» (durmaraṇāt bhītatvam) — то есть перед грехом самоубийства; добрые приметы являются ей именно в момент, когда она уже готова преступить этот запрет.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "раскрывает психологический подтекст жеста (скрытый страх перед грехом самоубийства), не отражённый ни в подстрочнике, ни в существующем примечании о dhairya, которое касается только этимологии слова", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s28_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

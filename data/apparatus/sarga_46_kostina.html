<script>window.APPARATUS_DATA={"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 46, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 51, "verses_with_notes": 27, "notes_by_layer": {"tier1": 19, "lexical": 10, "phase2": 7, "edition": 1, "crosstext": 3}, "built_for_reviewer": "Костина", "source_hash": "7b4a09db711812e0680ca5e7a48f498bfcbfb40c05a6d0706a39cc81cfc8ae84"}, "sarga": 46, "verses": [{"verse_id": "5.46.1", "verse": "1", "sanskrit_iast": "hatān mantrisutān buddhvā vānareṇa mahātmanā । rāvaṇaḥ saṃvṛtākāraś cakāra matim uttamām ॥1॥", "leonov_ru": "Узнав, что убиты сыновья советников великой духом обезьяной, Равана, скрыв свои чувства, придумал новое решение.", "commentary": {"bhusana": "हतान् मन्त्रिसुतान् बुद्ध्वा वानरेण महात्मना ।\n\nरावणः संवृताकारश्चकार मतिमुत्तमाम्\nहतानित्यादि । संवृताकारः अन्तर्मनाः । मतिं चिन्ताम्", "siromani": "मन्त्रिसुतवधानन्तरकालिकं रावणवृत्तान्तमाह हतानित्यादिभिः । मन्त्रिसुतान्वानरेण हतान् बुद्धा संवृतः आच्छादितः आकारः पूर्वाकृतिर्येन सः भीतियुक्ताकृतिविशिष्ट इत्यर्थः । किंच संवृतः स्वीकृतः आकारः प्राप्तकिंचिद्भीतिहेतुकाकृतिर्येन स रावणः उत्तमां मतिं पुनर्युद्धनिश्चयमित्यर्थः । चकार"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.1:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…скрыв свои чувства (saṃvṛtākāraḥ) – автор комментария «Тилака» уточняет «сдержав внутренний страх» (nigṛhītāntargatabhayaḥ). Такого же мнения придерживается и автор комментария «Таттвадипика». Автор комментария «Бхушана» полагает, что речь идет о гневе.Превосходное принял решение (cakāra matim uttamām) – авторы комментариев «Тилака» и «Таттвадипика» полагают, что речь идет о решительном образе действий."}, {"id": "lexical:5.46.1:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "saṃvṛtākāra", "note_ru": "Самврита-акара (saṃvṛta-ākāra, adj.) — бахуврихи: saṃvṛta «скрытый, прикрытый» (sam+√vṛ-, «покрывать», Whitney #728) + ākāra «внешний вид, выражение лица» (MW). MW: saṃvṛta 'covered, concealed'; ākāra 'form, expression of countenance'. Несёт специфически политическую семантику: скрыть выражение лица — один из базовых навыков раджанити. Ману (7.141) предписывает царю saṃvṛtāmantrin (тайный совет) и самообладание в мимике. Равана, узнав о гибели воинов, применяет именно дхармический ответ царя — контроль проявлений горя и гнева. Подстрочник «скрыв свои чувства» фиксирует смысл, но не раджашастрическую коннотацию.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:saMvftAkAra", "collision_tier1": true}, {"id": "phase2:5.46.1:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "uttamāṃ matim", "note_ru": "Уттамам матим (uttamāṃ matim) — в «Широмани» поясняется конкретнее, чем просто «превосходное решение»: пунар-юддха-нищчая (punaryuddhaniścaya), «решение возобновить войну» — именно это, а не абстрактная решимость, задаёт последующий сбор полководцев.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "уточняет содержание «превосходного решения» Раваны как конкретно решение возобновить войну — нарративная функция, готовящая сбор пяти полководцев", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.46.2", "verse": "2", "sanskrit_iast": "sa virūpākṣayūpākṣau durdharaṃ caiva rākṣasaṃ । praghasaṃ bhāsakarṇaṃ ca pañca senāgranāyakān ॥2॥", "leonov_ru": "Пять полководцев – Вирупакшу и Юпакшу, А также ракшаса Дурдхару, Прагхасу и Бхасакарну", "commentary": {"bhusana": "स विरूपाक्षयूपाक्षौ दुर्धरं चैव राक्षसम् ।\n\nप्रघसं भारकर्णं च पञ्च सेनाग्रनायकान्"}, "has_tier1": false, "notes": [{"id": "crosstext:5.46.2:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "virūpākṣa", "note_ru": "Вирупакша (virūpākṣa) «кривоглазый» — в Сундаре это имя ракшаса-полководца Раваны (V.46.2; ср. V.6.19) и определение «уродливоглазых» ракшаси (V.53.24). В Бала-канде 1.40.13 Virūpākṣa — имя СЛОНА-хранителя одной из сторон света (diśā-gaja), поддерживающего землю. Одно и то же имя у диггаджи и у ракшаса — типичная эпическая омонимия, в подстрочнике не оговариваемая; кн. I даёт «благую», космогоническую референцию имени.\n\nПараллель — Rām. Bāla 1.40.13:\n  «khanyamāne tatastasmin dadṛśuḥ parvatopamam । diśāgajaṃ virūpākṣaṃ dhārayantaṃ mahītalam ॥13॥»\n  И, раскопав его, увидели Хранителя мира Вирупакшу — Слона высотою с гору, Поддерживающего землю.", "type": "В", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.46.2", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.40.13 (Гринцер, пер. изд. I–III)"}]}, {"verse_id": "5.46.3", "verse": "3", "sanskrit_iast": "saṃdideśa daśagrīvo vīrān nayaviśāradān । hanūmadgrahaṇe 'vyagrān vāyuvegasamān yudhi ॥3॥", "leonov_ru": "Отважных, искусных в управлении (войсками), не теряющих спокойствия и быстрых в битве подобно ветру, Послал Дашагрива схватить Ханумана.", "commentary": {"tilaka": "संवृताकारो निगृहीतान्तर्गतभयः । उत्तमां मतिं धैर्यविषयाम् ।। 5.46.1,2 ।।\n\nहनूमद्ग्रहणे सन्दिदेश । व्यग्रान्सर्वत्र कार्ये त्वरावतः", "bhusana": "सन्दिदेश दशग्रीवो वीरान्नयविशारदान् ।\n\nहनुमद्ग्रहणव्यग्रान् वायुवेगसमान् युधि"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «хладнокровных» Нужен комм., они же не просто хладнокровные, а искусные в политике / искусные полководцы"}, {"id": "lexical:5.46.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nayaviśārada", "note_ru": "Найявишарада (naya-viśārada, adj.) — тат-пуруша: naya «политика, тактика, мудрость» (√nī-, «вести», Whitney #609) + viśārada «сведущий, искусный» (vi+śārada; первоначально «прошедший через осень» — связь с śarada «осень» и идеей зрелости). MW: naya 'conduct, behaviour, policy, wisdom'; viśārada 'experienced, skilled'. Naya — ключевой термин артхашастры: разумная политика, основанная на стратегическом видении, в отличие от bala (голой силы). Равана посылает именно nayaviśāradān — знатоков стратегии, а не просто сильных воинов, указывая тем самым на понимание угрозы за пределами обычного противника.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:naya+dic_mw:viSArada", "collision_tier1": true}]}, {"verse_id": "5.46.4", "verse": "4", "sanskrit_iast": "yāta senāgragāḥ sarve mahābalaparigrahāḥ । savājirathamātaṅgāḥ sa kapiḥ śāsyatām iti ॥4॥", "leonov_ru": "«Идите, полководцы все, вместе с великим войском, С конями, колесницами и слонами. Да будет наказана (схвачена) эта обезьяна.", "commentary": {"tilaka": "यात गच्छत", "bhusana": "यात सेनाग्रगाः सर्वे महाबलपरिग्रहाः ।\n\nसवाजिरथमातङ्गाः स कपिः शास्यतामिति\nइति वक्ष्यमाणप्रकारेण", "siromani": "स इति । सः कृतपुनर्युद्धनिश्चयो रावणः अव्यग्रान् धीरान् विरूपाक्षादीन् पञ्च सेनाग्रनायकान् हनुमद्ब्रहणे हनुमतो ग्रहणार्थं संदिदेश श्लोकद्वयमेकान्वयि ।। 5.46.2,3 ।।\n\nआज्ञापनप्रकारमाह-- यातेत्यादिभिः इति । हे सेनाग्रगाः महाबलपरिग्रहाः बृहत्सैन्यग्रहीतारः वाज्यादिसहिताः सन्तो यूयं यात । तत्प्रयोदनमाह कपिः शास्यतां निगृह्यतामित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "И возьмите в плен обезьяну (sa kapiḥ śāsyatām) Ряд переводчиков (Датт, Руссель, Шастри и др.) понимают эту фразу как приказ взять Ханумана в плен (см.: Goldman 1984: 472). Автор комментария «Широмани» глоссирует слово śāsyatām как «да будет схвачен» (nigṛhyatām).[Е. Костина] «.» Комментарий выглядит неполным, поскольку опущена половина дискуссии. Кажется странным, если в основном тексе у нас \"возьмите в плен\", отмечать, что ряд переводчиков понимают эту фразу так же. Чтобы стало понятно, надо добавить дискуссию. Например, в Г-Пресс - поймайте и преподайте урок. У Голдмэнов эта дискуссия есть, но они, кстати, видимо, пользуются англ версией Гита-пресс, потому что дают другой вариант"}]}, {"verse_id": "5.46.5", "verse": "5", "sanskrit_iast": "yattaiś ca khalu bhāvyaṃ syāt tam āsādya vanālayam । karma cāpi samādheyaṃ deśakālāvirodhitam ॥5॥", "leonov_ru": "Должно соблюдать осторожность, приблизившись к тому лесному жителю, И действия, которые будут предприняты [вами], не должны расходиться с местом и временем.", "commentary": {"tilaka": "यत्तैः सावसानैः । किं चात्र देशकालविरोधि कर्म न कार्यमित्याह-- देशकालाविरोधितं तदविरुद्धम् । तदुचितमिति यावत् । समाधेयं कार्यम्", "bhusana": "यत्तैश्च खलु भाव्यं स्यात्तमासाद्य वनालयम् ।\n\nकर्म चापि समाधेयं देशकालविरोधिनम्\nतमेवाह यत्तैरित्यादिना । यत्तैः यतमानैः । अप्रमत्तैरिति यावत् । यतेः कर्तरि क्तः । समाधेयं परिहर्तव्यम् । देशकालविरोधिनं देशकालविरोधीत्यर्थः", "siromani": "यत्नैरिति । वनालयं वानरमासाद्य यत्नैरतिप्रयत्नविशिष्टैर्भवद्भिर्भाव्यं स्यात् । देशकालाविरोधितं देशाद्यनुरोधीत्यर्थः । कर्म समाधेयं च"}, "has_tier1": false, "notes": [{"id": "lexical:5.46.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "deśakāla", "note_ru": "Дешакала (deśa-kāla, n.) — двандва: deśa «место, местность» + kāla «время». MW: deśakāla 'fit place and time'. Пара deśa-kāla — фундаментальный принцип артхашастры и дхармашастры: любое решение оценивается относительно конкретного места и момента, а не по абстрактным правилам. Каутилья (Arthaśāstra 1.15) и Ману (7.100) указывают, что царь должен совмещать deśajñāna и kālajñāna. Равана, инструктируя генералов не нарушать deśakāla (deśakālāvirodhitam), демонстрирует картину идеального военного командования — несмотря на очевидный демонический контекст.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:deSakAla"}, {"id": "phase2:5.46.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "samādheyam", "note_ru": "Самадхеям (samādheyam): в «Тилаке» глоссируется как кāryam «то, что должно быть исполнено» — согласуется с прямым смыслом стиха («действия… должны быть предприняты»); в «Бхушане» же — как парихартавьям, «то, от чего следует воздержаться», то есть ровно обратная полярность. Перевод следует Тилаке.", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "Тилака и Бхушана расходятся в самой полярности глагольного действия (совершить vs. воздержаться) — подстрочник передаёт только чтение Тилаки, расхождение в нём не видно", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.46.6", "verse": "6", "sanskrit_iast": "na hy ahaṃ taṃ kapiṃ manye karmaṇā prati tarkayan । sarvathā tan mahad bhūtaṃ mahābalaparigraham ॥6॥", "leonov_ru": "Ибо размышляя о [его] действиях, не думаю я, что это обезьяна. Судя по всему, это великое существо, наделенное огромной силой.", "commentary": {"tilaka": "यत्तैर्भाव्यमित्यत्र हेतुमाह-- नहीति । तस्य कर्मणां तं प्रति तर्कयंस्तं कपिं न मन्ये । किं तर्हि मन्यसे तत्राह-- सर्वथेति ।। 5.46.6,7 ।।\n\nमहतो भूतस्येह कः प्रसङ्गस्तत्राह-- भवेदिति । सनागेति नागादिसहिता देवादय इत्यर्थः", "bhusana": "न ह्यहं तं कपिं मन्ये कर्मणा प्रतितर्कयन् ।\n\nसर्वथा तन्महद्भूतं महाबलपरिग्रहम् ।\n\nभवेदिन्द्रेण वा सृष्टमस्मदर्थं तपोबलात्", "siromani": "अतिप्रयत्नेन स्थितौ हेतुमाह नहीति । महाबलपरिग्रहं वृतं हतसेनायाः परिग्राहकं विध्वंसकमित्यर्थः । तं कर्मणा तत्क्रियया प्रतितर्कयन्नहं कपिं न मन्ये किंतु भूतमत्र प्राप्तं तत् सर्वथा महदतिश्रेष्ठं मन्ये"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «6» У Голдмэнов отсутствует стих 7, стих 6 заканчивается рассуждением про Индру. Надо будет свериться и отразить в комм"}]}, {"verse_id": "5.46.7", "verse": "7", "sanskrit_iast": "vānaro 'yam iti jñātvā na hi śuddhyati me manaḥ । naivāhaṃ taṃ kapiṃ manye yatheyaṃ prastutā kathā ॥7॥", "leonov_ru": "Узнав, что это обезьяна, не удовлетворен мой ум. Не думаю я, что это обезьяна, как о ней было рассказано.", "commentary": {"siromani": "ननु तर्हि को ऽयमित्यत आह भवेदिति । अस्मदर्थम् अस्मद्विनाशार्थं तपोबलादिन्द्रेण सृष्टं भवेत् । अर्धं पृथक् । तत्र हेतुं वदन्नाह सेति । ये नागादिसहिता महर्षयः मया प्रहितैः प्रेषितैर्युष्माभिः सह एककालावच्छेदेन विनिर्जिताः तैर्नो ऽस्माकं किंचित् व्यलीकमप्रियमवश्यं विधातव्यम् । सार्धश्लोक एकान्वयी ।। 5.46.7,8 ।।\n\nतदिति । तदिन्द्रसृष्टमेव अत्र संदेहो न अतो महाबलपरिग्रहाः अत एव सवाजिरथमातङ्गाः यूयं यात प्रसह्य हठात् परिगृह्यताम् । नन्वेकाकिनस्तस्यार्थे किमर्थमेवं प्रेषणमित्यत आह धीरपराक्रमः कपिर्भवद्भिर्न्नावमान्यः तुच्छबुद्ध्या नानादर्तव्यः । एतेन तस्य महाबलत्वं सूचितम् । श्लोकद्वयं संमिलितान्वयि ।। 5.46.9,10 ।।\n\nननु वानररूपे कथमेवं पराक्रम इत्यत आह दृष्टा इति । विपुलविक्रमाः वाल्यादयो हरयः मया पूर्वं दृष्टाः । सार्धश्लोक एकान्वयी"}, "has_tier1": false, "notes": [{"id": "edition:5.46.7:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.46.7–8 (2 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.46.7–8", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.46.7", "iast": "vānaro 'yam iti jñātvā na hi śuddhyati me manaḥ । naivāhaṃ taṃ kapiṃ manye yatheyaṃ prastutā kathā ॥7॥"}, {"verse_id": "5.46.8", "iast": "bhaved indreṇa vā sṛṣṭam asmadarthaṃ tapobalāt । sanāgayakṣagandharvā devāsuramaharṣayaḥ ॥8॥"}]}]}, {"verse_id": "5.46.8", "verse": "8", "sanskrit_iast": "bhaved indreṇa vā sṛṣṭam asmadarthaṃ tapobalāt । sanāgayakṣagandharvā devāsuramaharṣayaḥ ॥8॥", "leonov_ru": "Или, может быть, Индрой сотворен [он] посредством аскетической силы, ради нас (ради нашей погибели). Девы, асуры и великие риши вместе с нагами, якшами и гандхарвами,", "commentary": {"bhusana": "सनागयक्षगन्धर्वा देवासुरमहर्षयः ।\n\nयुष्माभिः सहितैः सर्वैर्मया सह विनिर्जिताः"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «tapobalāt» Опущено в переводе, нужен комм"}, {"id": "tier1:5.46.8:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Нам на погибель (asmadartham) – букв. «ради нас». В комментарии «Таттвадипика» фраза объясняется как «чтобы нас схватить/покарать» (asmannigrahārtham). В комментарии «Бхушана» выражение indreṇa vā понимается как «Индрой или кем-то другим».[Е. Костина] Пояснение про indreṇa vā непонятно без контекста: к чему МЫ и другие относим vā (как альтернатива стиху 6, видимо)"}, {"id": "lexical:5.46.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tapobalā", "note_ru": "Тапас-бала (tapas-bala, n.) — тат-пуруша: tapas «аскеза, жар» + bala «сила». MW: tapobala 'the power of penance'. Tapobala — «сила аскезы» — в индийской традиции считается мощнее физической или военной силы: именно tapobala позволяет богам и асурам создавать вещи и существа (ср. tapas Брахмы при сотворении мира). Равана рассуждает: Хануман мог быть сотворён Индрой посредством tapobala — это объясняет, почему противника не удаётся охарактеризовать через обычные военные категории. За tapobala стоит сверхъестественный порядок, недоступный военному анализу.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:tapobala", "collision_tier1": true}]}, {"verse_id": "5.46.10", "verse": "10", "sanskrit_iast": "tad eva nātra saṃdehaḥ prasahya parigṛhyatām । yāta senāgragāḥ sarve mahābalaparigrahāḥ ॥10॥", "leonov_ru": "Это оно и есть, нет в том сомнения. Да будет схвачена силой [эта обезьяна]. Идите, полководцы все, вместе с великим войском,", "commentary": {"tilaka": "तस्मात्तदेव तत्सृष्टभूतमेव परिगृह्यतां बद्ध्वानीयताम्\nननु त्वद्दृष्टान्यतम एवायम्, नेत्याह-- नैवेति । यथास्य भीमा गतिः समुद्रप्लवनरूपा तथा तेषां नैव । यथा चास्य तेजआदि तथा तेषां न"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «10» Сверка. У Г. частично отсутствует"}]}, {"verse_id": "5.46.11", "verse": "11", "sanskrit_iast": "savājirathamātaṅgāḥ sa kapiḥ śāsyatām iti । nāvamanyo bhavadbhiś ca kapir dhīraparākramaḥ ॥11॥", "leonov_ru": "С конями, колесницами и слонами. Да будет наказана (схвачена) эта обезьяна. Не должны вы относиться с пренебрежением к этой обезьяне, наделенной стойкой доблестью.", "commentary": {"bhusana": "नावमान्यो भवद्भिश्च हरिर्धीरपराक्रमः ।\n\nदृष्टा हि हरयः पूर्वं मया विपुलविक्रमाः ।। 5.46.9।\n\nवाली च सहसुग्रीवो जाम्बवांश्च महाबलः ।\n\nनीलः सेनापतिश्चैव ये चान्ये द्विविदादयः\nमहत्सत्त्वमिदं ज्ञेयं कपिरूपं व्यवस्थितम् ।\n\nप्रयत्नं महदास्थाय क्रियतामस्य निग्रहः", "tilaka": "सवाजिरथेत्यादिपुनर्वचनं स्थैर्यार्थम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «11» Сверка"}, {"id": "phase2:5.46.11:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "punarvacanam", "note_ru": "По Тилаке, повтор формулы «с конями, колесницами и слонами… да будет схвачена обезьяна» (уже прозвучавшей в 5.46.4) — не случайная избыточность, а пунар-вачана «ради стойкости» (sthairyārtham): повторный приказ призван закрепить решимость полководцев.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "объясняет риторическую функцию дословного повтора приказа из стиха 4 — деталь, невидимая в подстрочнике и не покрытая существующим примечанием о dhīra", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}, {"id": "crosstext:5.46.11:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "dhīra", "note_ru": "Враги-ракшасы предостерегают не презирать обезьяну, «наделённую стойкой доблестью» (dhīraparākrama). Композит соединяет два опорных понятия эпико-этического словаря: dhīra (невозмутимая стойкость, БхГ 2.15) и parākrama (доблесть). Признание dhīra даже из уст врагов подтверждает, что эпитет в Сундараканде функционирует как объективная воинская характеристика Ханумана, а не как похвала союзников. Свидетельство: уровень шлоки (мягкое).", "type": "Б", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.46.11", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bhagavadgītā 2.15 (Семенцов)", "collision_tier1": true}]}, {"verse_id": "5.46.1216", "verse": "1216", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "महदिति । इत्थं महत्सत्त्वं किमपि कपिरूपं सत् व्यवस्थितमिति ज्ञेयमित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.1216:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «умелый» Мб это как раз отсылка к тому, что они не просто хладнокровные (стих 3)", "anchor_verse_id": "5.46.16"}]}, {"verse_id": "5.46.14", "verse": "14", "sanskrit_iast": "na matir na balotsāho na rūpaparikalpanam । mahat sattvam idaṃ jñeyaṃ kapirūpaṃ vyavasthitam ॥14॥", "leonov_ru": "Ни ума (хитроумия), ни мощи, ни способности менять облик. Нужно понять, что это за великое существо, принявшее облик обезьяны.", "commentary": {"tilaka": "रूपपरिकल्पनं यथेप्सितरूपपरिग्रहः\nसत्त्वं चित्तम्"}, "has_tier1": false, "notes": [{"id": "phase2:5.46.14:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sattvam", "note_ru": "Саттвам (sattvam) в «это должно быть познано как великое существо» (mahat sattvam idaṃ jñeyam) — по Тилаке, здесь саттва означает читтам, «ум, сознание», а не «существо» в широком смысле: то, что открывается воинам, — не просто иноприродное тело, а превосходящий разум.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "предлагает альтернативное техническое прочтение sattva как «сознание/ум», меняющее акцент открытия (не «великое тело», а «великий разум») — подстрочник «великое существо» следует иному, более широкому чтению", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.46.15", "verse": "15", "sanskrit_iast": "prayatnaṃ mahad āsthāya kriyatām asya nigrahaḥ । kāmaṃ lokās trayaḥ sendrāḥ sasurāsuramānavāḥ ॥15॥", "leonov_ru": "Приложив великие усилия, захватите его в плен (одолейте его) Конечно, обитатели трех миров с Индрой, богами, асурами и смертными людьми,", "commentary": {"bhusana": "कामं लोकास्त्रयः सेन्द्राः ससुरासुरमानवाः ।\n\nभवतामग्रतः स्थातुं न पर्याप्ता रणाजिरे", "tilaka": "प्रयत्नमित्यार्षं क्लीबत्वम् । कामम् । यद्यपीत्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Трех миров обитатели – / Боги, асуры, люди (kāmaṃ lokās trayaḥ sendrāḥ sasurāsuramānavāḥ) – букв.: «Хотя три мира с Индрой, с богами, асурами и людьми…»."}]}, {"verse_id": "5.46.17", "verse": "17", "sanskrit_iast": "ātmā rakṣyaḥ prayatnena yuddhasiddhir hi cañcalā । te svāmivacanaṃ sarve pratigṛhya mahaujasaḥ ॥17॥", "leonov_ru": "Сам должен порадеть о своей защите, ибо военная удача переменчива». Все они, вняв речи владыки, наделенные мощью,", "commentary": {"bhusana": "ते स्वामिवचनं सर्वे प्रतिगृह्य महौजसः ।\n\nसमुत्पेतुर्महावेगा हुताशसमतेजसः\nतं समीक्ष्यैव ते सर्वे दिक्षु सर्वास्ववस्थिताः ।\n\nतैस्तैः प्रहरणैर्भीमैरभिपेतुस्ततस्ततः"}, "has_tier1": false, "notes": [{"id": "lexical:5.46.17:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "yuddhasiddhi", "note_ru": "Юддха-сиддхи (yuddha-siddhi, f.) — тат-пуруша: yuddha «битва» (√yudh-, «сражаться», Whitney #239) + siddhi «успех, достижение, совершенство» (√sidh-, «преуспевать»). MW: yuddhasiddhi 'success in war'. Равана характеризует yuddhasiddhi как cañcala — «непостоянную» (от √cal-, «колебаться»). Это редкий момент, где демонический царь демонстрирует понимание принципа кшатрийской этики: военная удача по природе нестабильна, и сам полководец должен заботиться о личной защите. Такое знание — отличительный признак dharmarāja (справедливого царя), а не просто грубой силы.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:yudDasidDi"}]}, {"verse_id": "5.46.18", "verse": "18", "sanskrit_iast": "samutpetur mahāvegā hutāśasamatejasaḥ । rathaiś ca mattair nāgaiś ca vājibhiś ca mahājavaiḥ ॥18॥", "leonov_ru": "Двинулись вместе, стремительные, сияющие, подобно огню, С колесницами, разъяренными слонами и конями стремительными,", "commentary": {"bhusana": "रथैर्मत्तैश्च मातङ्गैर्वाजिभिश्च महाजवैः ।\n\nश्स्त्रैश्च विविधैस्तीक्ष्णैः सर्वैश्चोपचिता बलैः"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «огонь» комм - про Агни"}]}, {"verse_id": "5.46.19", "verse": "19", "sanskrit_iast": "śastraiś ca vividhais tīkṣṇaiḥ sarvaiś copahitā balaiḥ । tatas tu dadṛśur vīrā dīpyamānaṃ mahākapim ॥19॥", "leonov_ru": "С разнообразным оружием острым, сопровождаемые всеми видами войск. Тогда увидели отважные великую обезьяну, пылающую,", "commentary": {"bhusana": "ततस्तं ददृशुर्वीरा दीप्यमानं महाकपिम् ।\n\nरश्मिमन्तमिवोद्यन्तं स्वतेजोरश्मिमालिनम्\nस्वतेजोरश्मिमालिनं स्वतेजसा सूर्यम् । रश्मिमन्तमिवेत्यत्र उपमा, अत्र रूपकमिति भिदा"}, "has_tier1": false, "notes": [{"id": "phase2:5.46.19:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "upamā / rūpaka", "note_ru": "«Бхушана» различает фигуры речи внутри одного образа: «подобно восходящему [солнцу]» (raśmimantam iva) — упама, сравнение; а «облачённого в гирлянду собственного блеска» (svatejoraśmimālinam) — рупака, метафора без союза сравнения. Подстрочник передаёт оба выражения одинаково («подобно»), стирая эту риторическую границу.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "вскрывает риторический сдвиг от сравнения к метафоре внутри одного и того же образа (солнце/сияние Ханумана), неразличимый в едином переводе «подобно»", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.46.20", "verse": "20", "sanskrit_iast": "raśmimantam ivodyantaṃ svatejoraśmimālinam । toraṇasthaṃ mahāvegaṃ mahāsattvaṃ mahābalam ॥20॥", "leonov_ru": "Подобно восходящему солнцу, облаченную в гирлянду собственного блеска, Стоящую на арке, стремительную, обладающую великой отвагой и великой силой,", "commentary": {"siromani": "तोरणस्थमिति । तोरणस्यं तं हनूमन्तं समीक्ष्यैव सर्वासु दिक्षु अवस्थिताः ते राक्षसास्तैस्तैः प्रहरणैरायुधैः ततस्ततः स्वस्वाधिष्ठितदिशातः अभिपेतुः । श्लोकद्वयमेकान्वयि ।। 5.46.19,20 ।।\n\nतस्येति । तस्य हनुमतः शिरसि पीतमुखाः स्वर्णपुङ्खा इत्यर्थः । आयसाः पञ्चशराः दुर्धरेण राक्षसेन निपातिताः", "bhusana": "तोरणस्थं महोत्साहं महासत्त्वं महाबलम् ।\n\nमहामतिं महावेगं महाकायं महाबलम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Подобного восходящему / Солнцу в гирлянде лучей (raśmimantam ivodyantaṃ svatejoraśmimālinam) – букв. «подобному восходящему солнцу в гирлянде лучей своего сияния»."}]}, {"verse_id": "5.46.21", "verse": "21", "sanskrit_iast": "mahāmatiṃ mahotsāhaṃ mahākāyaṃ mahābhujam । taṃ samīkṣyaiva te sarve dikṣu sarvāsv avasthitāḥ ॥21॥", "leonov_ru": "Наделенную великим умом, великой выносливостью, огромным телом и огромными руками. Увидев ее, они все встали вокруг (по всем сторонам от Ханумана),", "commentary": {"tilaka": "दिक्षु सर्वास्ववस्थिताः । द्राक्तत्समीपमागन्तुं चकिता इति भावः", "siromani": "ननु तेषामेवायमन्यतमो ऽस्तु नाहं कपिं मन्ये इति कथमुच्यते इत्यत आह नेति । एवं एतादृग् गतिप्रभृतिरेतेषां न अत इदं महत् सत्त्वं विज्ञेयम् । अतो महत्प्रयत्नमास्थाय अस्य निग्रहः क्रियताम् । श्लोकद्वयमेकान्वयि ।। 5.46.12,13 ।।\n\nकाममिति । यद्यपि भवतामग्रतो ऽग्रे रणाजिरे स्थातुमिन्द्रादयो न पर्याप्तस्तथापि न यज्ञेन जनेन आत्मा प्रयत्नेन रक्ष्यः हि यतो युद्धसिद्धिः चञ्चला अव्यवस्थिता । श्लोकद्वयमेकान्वयि ।। 5.46.14,15 ।।\n\nते इति । स्वामिवचनं परिगृह्य रथादिभिरुपहिता युक्तास्ते सेनाग्रगाः समुत्पेतुः । श्लोकद्वयमेकान्वयि ।। 5.46.16,17 ।।\n\nतत इति । उद्यन्तं रश्मिमन्तं सूर्यमिव स्वतेजोरश्मिमालिनम् अत एव दीप्यमानं महाकपिं वीरा ददृशुः"}, "has_tier1": false, "notes": [{"id": "phase2:5.46.21:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "dikṣu sarvāsv avasthitāḥ", "note_ru": "«Все они встали по сторонам» (dikṣu sarvāsv avasthitāḥ) — по Тилаке, за нейтральным описанием построения стоит испуг: ракшасы застыли поодаль, «не решаясь тотчас приблизиться» (cakitāḥ) к Хануману.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "вносит психологический подтекст (страх, нерешительность) в описание, которое подстрочник передаёт как нейтральную тактическую расстановку", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.46.22", "verse": "22", "sanskrit_iast": "tais taiḥ praharaṇair bhīmair abhipetus tatas tataḥ । tasya pañcāyasās tīkṣṇāḥ sitāḥ pītamukhāḥ śarāḥ । śirasy utpalapatrābhā durdhareṇa nipātitāḥ ॥22॥", "leonov_ru": "С тем и этим ужасным оружием набросились [они на Ханумана] со всех сторон. Пять железных острых, ярких, с желтыми остриями стрел, Подобных лотосовым лепесткам, в голову его (Ханумана) пустил Дурдхара.", "commentary": {"bhusana": "तस्य पञ्चायसास्तीक्ष्णाः शिताः पीतमुखाः शराः ।\n\nशिरस्युत्पलपत्राभा दुर्धरेण निपातिताः\nस तैः पञ्चभिराविद्धः शरैः शिरसि वानरः ।\n\nउत्पपात नदन् व्योम्नि दिशो दश विनादयन्\nततस्तु दुर्धरो वीरः सरथः सज्यकार्मुकः ।\n\nकिरन् शरशतैस्तीक्ष्णैरभिपेदे महाबलः\nअर्द्यमानस्ततस्तेन दुर्धरेणानिलात्मजः ।\n\nचकार कदनं भूयो व्यवर्धत च वेगवान्\nकदनं युद्धम्", "tilaka": "तीक्ष्णा मर्मच्छिदः, पीतमुखाः फलभागे स्वर्णरूषिताः । उत्पलपत्राभा एव, न तु तत्पीडार्हा इत्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.22:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Пять острых железных стрел (pañcāyasās tīkṣṇāḥ sitāḥ… śarāḥ) – букв. «пять железных острых белых стрел». В комментарии «Бхушана» слово tīkṣṇāḥ (острые) глоссируется как krūrāḥ (жестокие), а sitāḥ (белые) – как niśitāḥ (острые). Голдмены переводят последнее слово как bright (см.: Goldman 1984: 236). С желтыми остриями (pītamukhāḥ) – в комментарии «Тилака» поясняется, что острия стрел были покрыты золотом. Автор комментария «Таттвадипика» соглашается с ним, однако отмечает, что pīta может также означать «покрытый кровью врагов» (śatruśoṇitarañjita). Подобных лепесткам лотоса (utpalapatrābhāḥ) – по мнению автора «Тилаки», это означает, что эти стрелы не могли причинить вреда Хануману (как и лепестки лотоса). В комментарии «Таттвадипика» также замечается, что сравнение с лотосом может относиться к цвету стрел."}, {"id": "lexical:5.46.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āyasa", "note_ru": "Аяса (āyasa, adj.) — «железный, сделанный из железа», от ayas n. «железо, металл» (ПИЕ корень *ayos, ср. лат. aes «медь/бронза», гот. aiz; в санскрите ayas исторически охватывало как медь, так и железо). MW: āyasa 'made of iron; iron'. Śarā āyasāḥ — «железные стрелы» — в отличие от деревянных или тростниковых. В эпической традиции pañca āyasāḥ śarāḥ (пять железных стрел) — формульное выражение для критического удара, наносящего урон даже сверхъестественным существам. Именно это формульное применение отличает удар Дурдхары от обычного обстрела.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:AyAsa", "collision_tier1": true}]}, {"verse_id": "5.46.25", "verse": "25", "sanskrit_iast": "sa kapir vārayām āsa taṃ vyomni śaravarṣiṇam । vṛṣṭimantaṃ payodānte payodam iva mārutaḥ ॥25॥", "leonov_ru": "Та обезьяна остановила его, мечущего дождь стрел в небо, Как ветер в конце сезона дождей – льющую дождь тучу.", "commentary": {"bhusana": "तं विरूपाक्षयूपाक्षौ दृष्ट्वा निपतितं भुवि ।\n\nसञ्जातरोषौ दुर्धर्षावुत्पेततुररिन्दमौ"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…остановил, / Словно бы ветер – тучу (vārayām āsa… payodānte payodam iva mārutaḥ) – букв.: «остановил, словно в конце сезона дождей тучу ветер»."}]}, {"verse_id": "5.46.27", "verse": "27", "sanskrit_iast": "sa dūraṃ sahasotpatya durdharasya rathe hariḥ । nipapāta mahāvego vidyudrāśir girāv iva ॥27॥", "leonov_ru": "Высоко вдруг взлетев, на колесницу Дурдхары обезьяна Обрушилась, стремительная, словно молния – на гору.", "commentary": {"bhusana": "स दूरं सहसोत्पत्य दुर्धरस्य रथे हरिः ।\n\nनिपपात महवेगो विद्युद्राशिर्गिराविव\nविद्युद्राशिः अशनिः\nस ताभ्यां सहसोत्पत्य विष्ठितो विमले ऽम्बरे ।\n\nमुद्गराभ्यां महाबाहुर्वक्षस्यभिहतः कपिः", "siromani": "स इति । स हनूमान् दूरं विद्यमाने दुर्धरस्य रथे गिरौ विद्युद्राशिरिव निपपात"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Словно на гору – молния (vidyudrāśir girāv iva) – букв. «словно пучок молний на гору»."}, {"id": "lexical:5.46.27:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vidyudrāśi", "note_ru": "Видьюд-раши (vidyut-rāśi, m.) — тат-пуруша: vidyut «молния» (√vid-, «сверкать/блестеть», MW) + rāśi «куча, масса» (√rāś-, «накапливаться»). MW: vidyut 'lightning'; rāśi 'heap, mass, multitude'. Образ vidyudrāśir girāv iva — «словно масса молний на гору» — строится на ведийской иконе грозы: не одна молния, а rāśi (множество, груда) молний одновременно. Усиление до абсолютной деструктивной мощи соответствует ведийскому образу Индры, чья ваджра несёт вспышку тысяч молний.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:vidyut+dic_mw:rASi", "collision_tier1": true}, {"id": "crosstext:5.46.27:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "принято", "lemma_iast": "vega", "note_ru": "«Стремительный налёт» (vegena utpatya / abhipatya) — устойчивая формула атаки батальных парван: в Дронапарве воин «стремительно обрушивался» (utpatantaṃ vegena), и его пришлось удерживать. Сундара 46.27, где Хануман «высоко вдруг взлетев (sahasotpatya), на колесницу Дурдхары обрушился, стремительный (mahāvega), словно молния на гору», — кавья-вариация той же кинетической формулы прыжка-атаки. Общий батальный словарь движения.\n\nПараллель — Droṇaparva 7.134.3:\nСА: tamutpatantaṃ vegena rājā duryodhanaḥ svayam । nyavārayanmahārāja kṛpaśca dvipadāṃ varaḥ ॥3॥\nРУ: И когда он стремительно обрушивался (на Карну), его удержали сам царь Дурьйодхана, о великий царь, и Крипа, наилучший из двуногих.\n\nСвидетельство: уровень шлоки (мягкое, корпусное); требуется проверка.", "type": "Б", "cluster": "mbh_battle", "cluster_label": "", "shloka_ref": "V.46.27", "work_label": "", "verse_address": "", "parallel_sa_iast": "tamutpatantaṃ vegena rājā duryodhanaḥ svayam । nyavārayanmahārāja kṛpaśca dvipadāṃ varaḥ ॥3॥", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Droṇaparva 7.134.3", "collision_tier1": true}]}, {"verse_id": "5.46.29", "verse": "29", "sanskrit_iast": "taṃ virūpākṣayūpākṣau dṛṣṭvā nipatitaṃ bhuvi । tau jātaroṣau durdharṣāv utpetatur ariṃdamau ॥29॥", "leonov_ru": "Вирупакша и Юпакша, видя, что он упал на землю, Оба, объятые яростью, неодолимые губители врагов бросились [в бой].", "commentary": {"bhusana": "स सालवृक्षमासाद्य तमुत्पाट्य च वानरः ।\n\nतावुभौ राक्षसौ वीरौ जघान पवनात्मजः", "siromani": "तमिति । तौ सहैवागतौ विरूपाक्षयूपाक्षौ तं दुर्धरं भुवि निपतितं दृष्ट्वा जातरोषौ सन्तौ उत्पेततुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.29:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Яростно бросились в битву, / Оба неодолимые (tau jātaroṣau durdharṣāv utpetatur ariṃdamau) – букв. «Взлетели оба губителя врагов, охваченные гневом, трудноодолимые»."}]}, {"verse_id": "5.46.31", "verse": "31", "sanskrit_iast": "tayor vegavator vegaṃ vinihatya mahābalaḥ । nipapāta punar bhūmau suparṇa iva vegitaḥ ॥31॥", "leonov_ru": "Этими двумя стремительными стремительно пораженный могучий [Хануман] Опустился снова на землю, стремительный, словно Супарна.", "commentary": {"bhusana": "तयोर्वेगवतोर्वेगं विनिहत्य महाबलः ।\n\nनिपपात पुनर्भूमौ सुपर्णसमविक्रमः", "siromani": "तयोरिति । वेगवतोः तयोः राक्षसयोर्वेगं निहत्य निष्फलीकृत्येत्यर्थः । महाबलो हनूमान् वेगितः सुपर्णो गरुड इव भूमौ पुनर्निपपात"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.31:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…пораженный (vinihatya) – в комментарии «Тилака» отмечается, что удары ракшасов были безвредны для Ханумана, поскольку он имел алмазную грудь (vajravakṣas)."}]}, {"verse_id": "5.46.36", "verse": "36", "sanskrit_iast": "sa tābhyāṃ vikṣatair gātrair asṛgdigdhatanūruhaḥ । abhavad vānaraḥ kruddho bālasūryasamaprabhaḥ ॥36॥", "leonov_ru": "Члены тела его (Ханумана) были ранены теми двумя, шерсть окрасилась кровью. Разгневалась обезьяна, блеском подобная юному (восходящему) солнцу.", "commentary": {"bhusana": "स ताभ्यां विक्षतैर्गात्रैरसृग्दिग्धतनूरुहः ।\n\nअभवद्वानरः क्रुद्धो बालसूर्यसमप्रभः", "siromani": "स इति । ताभ्यां प्रघसभासकर्णाभ्यां विक्षतैः गात्रैरुपलक्षितः अत एव असृजा रुधिरेण दिग्धाः व्याप्ताः तनूरुहा यस्य अत एव बालसूर्यसमप्रभः वानरः क्रुद्धो ऽभवत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.36:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Подобный юному солнцу (bālasūryasamaprabhaḥ) – имеется в виду восходящее солнце."}]}, {"verse_id": "5.46.37", "verse": "37", "sanskrit_iast": "samutpāṭya gireḥ śṛṅgaṃ samṛgavyālapādapam । jaghāna hanumān vīro rākṣasau kapikuñjaraḥ । giriśṛṅgasuniṣpiṣṭau tilaśas tau babhuvatuḥ ॥37॥", "leonov_ru": "Отломив вершину горы с оленями, хищниками и деревьями, Убил отважный Хануман, слон среди обезьян, обоих ракшасов. Вершиной горы были разбиты на кусочки те двое.", "commentary": {"bhusana": "समुत्पाट्य गिरेः शृङ्गं समृगव्यालपादपम् ।\n\nजघान हनुमान् वीरो राक्षसौ कपिकुञ्जरः", "siromani": "समिति । कपिकुञ्जरो हनूमान् समृगव्यालपादपं मृगव्यालपादपसहितं गिरेः शृङ्गं समुत्पाट्य राक्षसौ जघान\nगिरीति । तौ राक्षसौ तिलशः गिरिशृङ्गसुनिष्पिष्टौ बभूवतुः । अर्धं पृथक् । तत इति । तेषु पञ्चसु सेनापतिषु अवसन्नेषु विनष्टेषु सत्सु अवशेषमपि बलं वानरो नाशयामास"}, "has_tier1": false, "notes": [{"id": "lexical:5.46.37:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "giriśṛṅga", "note_ru": "Гири-шрнга (giri-śṛṅga, n.) — тат-пуруша: giri «гора» + śṛṅga «вершина, рог» (√śṛ-, «раздроблять»; само śṛṅga первоначально «рог животного», затем метафорически «горная вершина»). MW: giriśṛṅga 'mountain peak'. Применение giriśṛṅga как оружия — характерный эпический мотив «природного оружия» ванаров. Примечательно: с вершиной летят mṛga (олени), vyāla (хищники) и pādapa (деревья) — вся экосистема вершины превращается в оружие. Эта деталь указывает на нечеловеческий масштаб разрушения.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:giriSfNga"}]}, {"verse_id": "5.46.39", "verse": "39", "sanskrit_iast": "aśvair aśvān gajair nāgān yodhair yodhān rathai rathān । sa kapir nāśayām āsa sahasrākṣa ivāsurān ॥39॥", "leonov_ru": "Лошадями лошадей, слонами слонов, воинами воинов, колесницами колесницы Та обезьяна уничтожала, словно Тысячеокий (Индра) асуров.", "commentary": {"bhusana": "अश्वैरश्वान् गजैर्नागान् योधैर्योधान् रथै रथान् ।\n\nस कपिर्नाशयामास सहस्राक्ष इवासुरान्", "siromani": "विनाशनप्रकारमाह-- अश्वैरिति । असुरान् सहस्राक्ष इव अश्वादिभिरश्वादीन् कपिर्नाशयामास"}, "has_tier1": false, "notes": [{"id": "lexical:5.46.39:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sahasrākṣa", "note_ru": "Сахасракша (sahasra-akṣa, m.) — бахуврихи: sahasra «тысяча» + akṣa «глаз» = «Тысячеглазый» (эпитет Индры). MW: sahasrākṣa 'thousand-eyed, ep. of Indra'. Традиционная этиология: Индра приобрёл тысячу меток/ран на теле в результате проклятия Гаутамы за прелюбодеяние с Ахальей (ср. V.1 «Сундараканды»). В этом сравнении — тонкая ирония: Хануман, сражающийся с демонами, уподоблен Индре, уничтожающему асуров, — но тот же Индра, возможно, и сотворил Ханумана (по версии Раваны, V.46.8). Круговая отсылка активирует оба контекста одновременно.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:sahasrAkza"}]}, {"verse_id": "5.46.41", "verse": "41", "sanskrit_iast": "tataḥ kapis tān dhvajinīpatīn raṇe । nihatya vīrān sabalān savāhanān । tathaiva vīraḥ parigṛhya toraṇaṃ । kṛtakṣaṇaḥ kāla iva prajākṣaye ॥41॥", "leonov_ru": "И вот обезьяна, тех полководцев в бою Убив, отважных, вместе с войсками и колесницами, Тогда отважный [Хануман], взойдя [снова] на арку, Встал в ожидании, словно Время [в ожидании] гибели человечества. (Или – отдыхающий, словно Смерть после гибели человечества).", "commentary": {"tilaka": "ध्वजिनीपतीन्सेनापतीन् । पिरगृह्याश्रित्य स्थित इति शेषः । कृतक्षणो लब्धावसरः", "siromani": "तत इति । कपिर्हनूमान् रणे ध्वजिनीपतीन् निहत्य कृतक्षणः लब्धावसरः सन् तोरणं परिगृह्य प्रजाक्षये काल इव अतिष्ठदिति शेषः", "bhusana": "ततः कपिस्तान् ध्वजिनीपतीन् रणे निहत्य वीरान् सबलान् सवाहनान् ।\n\nसमीक्ष्य वीरः परिगृह्य तोरणं कृतक्षणः काल इव प्रजाक्षये\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे षट्चत्वारिंशः सर्गः ।। 5.46।।\n\nध्वजिनीपतीन् सेनापतीन् । कृतक्षणः दत्तावसरः, अभूदिति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.46.41:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Словно Смерть сама, насытившись жертвами (kṛtakṣaṇaḥ kāla iva prajākṣaye) – букв. «получивший время [для отдыха], словно Смерть после уничтожения живых существ».[Е. Костина] «.» Г-пр трактует иначе: словно смерть, приготовившаяся истреблять народ"}, {"id": "lexical:5.46.41:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kṛtakṣaṇa", "note_ru": "Крита-кшана (kṛta-kṣaṇa, adj.) — бахуврихи: kṛta «сделанный, совершённый» + kṣaṇa «момент, досуг, правильный момент». MW: kṛtakṣaṇa 'one who has made an opportune moment; who is at leisure, awaiting the right moment'. Kṣaṇa — не просто «момент», а концептуальный термин: благоприятный момент для действия (ср. kṣaṇavādin в буддийской философии). Kṛtakṣaṇa = «создавший себе kṣaṇa» = тот, кто выждал правильный момент. Сравнение с Кала (Временем/Смертью) в ожидании prajākṣaya («гибели существ»): Хануман = персонифицированная Неизбежность, поджидающая следующей жертвы.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:kftakzaRa", "collision_tier1": true}, {"id": "phase2:5.46.41:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kṛtakṣaṇaḥ", "note_ru": "Критакшана (kṛtakṣaṇaḥ) — и Тилака (labdhāvasaraḥ), и Бхушана (dattāvasaraḥ) единогласно глоссируют «тот, кто дождался своего часа», то есть Время, готовое (получившее возможность) поразить, а не «уже уничтожающее». Это подтверждает основной перевод Леонова/Костиной против отмеченного ими же альтернативного чтения Гита-Пресс («приготовившаяся истреблять»).", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "разрешает переводческую развилку, которую сама Костина отметила как открытую (Гита-Пресс расходится): традиция ṭīkā единогласно подтверждает чтение «дождавшийся часа», а не «готовая истреблять»", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"Костина",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

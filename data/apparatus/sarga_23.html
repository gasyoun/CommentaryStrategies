 объяснение имени через его же употребление.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:rAvaRa", "collision_tier1": true}]}, {"verse_id": "5.23.2", "verse": "2", "sanskrit_iast": "niṣkrante rākṣasendre tu punar antaḥpuraṃ gate । rākṣasyo bhīmarūpās tāḥ sītāṃ samabhidudruvuḥ ॥2॥", "leonov_ru": "Когда же ушел владыка ракшасов, снова вернувшийся в свои покои, Ракшаси ужасные обликом набросились на Ситу.", "commentary": {"bhusana": "निष्क्रान्ते राक्षसेन्द्रे तु पुनरन्तःपुरं गते ।\n\nराक्षस्यो भीमरूपास्ताः सीतां समभिदुद्रुवुः", "siromani": "निष्क्रन्त इति । निष्क्रन्ते अन्तःपुरान्निर्गते रावणे पुनरन्तःपुरं च गते सति भीमरूपा राक्षस्यः सीतां समभिदुद्रुवुः जग्मुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.23.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «покои» Комм.? Или отсылка на более ранний комм к этому слову"}]}, {"verse_id": "5.23.4", "verse": "4", "sanskrit_iast": "paulastyasya variṣṭhasya rāvaṇasya mahātmanaḥ | । daśagrīvasya bhāryātvaṃ sīte na bahumanyase || ॥4॥", "leonov_ru": "О Сита, ты не ценишь супружества с Пауластьей Раваной, наилучшим, великим духом Дашагривой.", "commentary": {"tilaka": "भार्यात्वं भार्याभावं न बहु मन्यसे मोहादिति शेषः", "siromani": "तद्वचनाकारमाह पौलस्त्यस्येत्यादिभिः । हे सीते पौलस्त्यस्य दशग्रीवस्य भार्या मन्दोदर्यादिः त्वं बहु न मन्यसे तत्कर्तृकपूजां न स्वीकरोषीत्यर्थः, तत्कुतः, तत्कुत इति शेषः । सुबन्तस्य कर्मतया अन्वयान्न द्वितीया यत्तदोरध्याहारो वा", "bhusana": "पौलस्त्यस्य वरिष्ठस्य रावणस्य महात्मनः ।\n\nदशग्रीवस्य भार्यात्वं सीते न बहु मन्यसे"}, "has_tier1": false, "notes": [{"id": "lexical:5.23.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "paulastya", "note_ru": "Пауластья (paulastya, m.) — патронимик: «потомок Пуластьи» (pulastya + суффикс -ya > pauL-). Pula-stya — один из семи мудрецов (saptarṣi), manasa-putra Брахмы (сын, рождённый мыслью). MW: pulastya 'one of the seven Maharshis or great sages'. Ракшаси упоминают Paulastya чтобы подчеркнуть благородное происхождение Раваны: не просто царь демонов, но правнук великого риши. Этот генеалогический аргумент — стратегия «возвеличивания через происхождение» — риторически важен: Сита, аргументируют ракшаси, должна гордиться браком с потомком такой линии.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:paulastya"}]}, {"verse_id": "5.23.5", "verse": "5", "sanskrit_iast": "tatastvekajaṭā nāma rākṣasī vākyamabravīt | । āmantrya krodhatāmrākṣī sītāṃ karatalodarīm || ॥5॥", "leonov_ru": "Тогда же ракшаси по имени Экаджата сказала, С глазами, красными от гнева, бращаясь к Сите, чей живот (гладок) словно ладонь:", "commentary": {"siromani": "ननु राक्षसीकर्तृकपूजामहं न ग्रहीष्यामीत्युत्थापितसीताशङ्कां निवर्तयितुं वचनान्तरमुपक्रमते तत इति । ततः तदुक्त्यनन्तरं करतलोदरीं सूक्ष्मोदरविशिष्टामित्यर्थः, सीतामामन्त्र्य संबोध्य क्रोधताम्राक्षी एकजटानाम राक्षसी अब्रवीत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.23.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…чей гладок живот (karatalodarīm) – букв. «той, чей живот [гладок] словно ладонь»."}]}, {"verse_id": "5.23.6", "verse": "6", "sanskrit_iast": "prajāpatīnāṃ ṣaṇṇāṃ tu caturtho 'ayaṃ prajāpatiḥ | । mānaso brahmaṇaḥ putraḥ pulastya iti viśrutaḥ || ॥6॥", "leonov_ru": "Из шести праджапати четвертый этот праджапати, Сын ума Брахмы, известный (под именем) Пуластья.", "commentary": {"tilaka": "\"मरीचिरत्र्यङ्गिरसौ पुलस्त्यः पुलहः क्रतुः\" इत्यनुक्रान्तषट्प्रजापतीनां चतुर्थः पुलस्त्यः ।। 5.23.6,7 ।।\n\nतस्य पुत्र इत्यनेन कुलीनत्वं सूचितम्", "siromani": "रावणगमनानन्तरकालिकं वृत्तं वर्णयितुमाह इतीति । शत्रुरावणो रावणः मैथिलीमित्युक्त्वा राक्षसीः संदिश्य च निर्जगाम\nतद्वचनाकारमाह प्रजापतीनामित्यादिभिः । पुलस्त्य इति नाम्ना विश्रुतो विख्यातः अयमेतद्वंशप्रवर्तकः ब्रह्मणो मानसः पुत्रः षण्णां \"मरीचिरत्र्यङ्गिरसः पुलस्त्यः पुलहः क्रतुः\" इत्यत्रोक्तानां प्रजापतीनां मध्ये चतुर्थः प्रजापतिः", "bhusana": "प्रजापतीनां षण्णां तु चतुर्थो यः प्रजापतिः ।\n\nमानसो ब्रह्मणः पुत्रः पुलस्त्य इति विश्रुतः"}, "has_tier1": true, "notes": [{"id": "tier1:5.23.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Отпрыск разума» Нужен будет комм"}, {"id": "lexical:5.23.6:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ṣaṭ prajāpatayaḥ", "note_ru": "Шесть Праджапати — в брахманической космогонии класс «прародителей» (prajāpati), рождённых «умом» (mānasa) Брахмы. Согласно Рамаяне, их шесть: Маричи, Атри, Ангирас, Пуластья, Пулаха, Крату. Пуластья — четвёртый из шести (ср. Мбх. I.65.13–14). Это космогоническая рамка, объясняющая, почему Равана при всём своём злодействе обладает легитимным брахманическим происхождением (отец Вишравас — внук Брахмы): конфликт дхармы и происхождения составляет нарративный парадокс образа Раваны. Концепция mānasa-putras Брахмы введена в Рам. I (Гринцер).", "type": "Г", "subtype": "hist_cultural", "trigger": "myth_background", "source": "Rām. VII.9–10 (генеалогия Раваны); Мбх. I.65.12–14", "collision_tier1": true}, {"id": "lexical:5.23.6:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "prajāpati", "note_ru": "Праджапати (prajā-pati, m.) — «повелитель потомства / созданий»: prajā «потомство, люди, создания» (pra+√jan-, «рождать») + pati «господин». В данном контексте — один из шести (или семи) первосозданий Брахмы, создателей человечества и различных существ. MW: prajāpati 'lord of creatures; the progenitor; one of the mind-born sons of Brahma'. Ракшаси выстраивают генеалогию: Брахма → Пуластья (4-й из 6 праджапати) → Вишравас → Равана. Это трёхступенчатая теогоническая линия, возводящая Равана к самому Брахме. Статус «четвёртого праджапати» имеет точную сакральную нумерологию.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:prajApati", "collision_tier1": true}]}, {"verse_id": "5.23.7", "verse": "7", "sanskrit_iast": "pulastyasya tu tejasvī mahārṣir mānasaḥ sutaḥ | । nāmnā sa viśravā nāma prajāpatisamaprabhaḥ || ॥7॥", "leonov_ru": "Ума Пауластьи же сын был сиятельный великий риши По имени Вишравас, величием равный Праджапати.", "commentary": {"bhusana": "पुलस्त्यस्य तु तेजस्वी महर्षिर्मानसः सुतः ।\n\nनाम्ना स विश्रवा नाम प्रजापतिसमप्रभः", "siromani": "पुलस्त्यस्येति । पुलस्त्यस्य मानसः सुतो विश्रवा नाम"}, "has_tier1": false, "notes": [{"id": "lexical:5.23.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "viśravas", "note_ru": "Вишравас (viśravas, m.) — «прославленный, известный»: vi- + śravas «слава, слух» (√śru-, «слышать»; ср. греч. κλέος, авест. sravah-). MW: viśravas 'widely renowned; a Ṛishi and father of Kubera and Rāvaṇa'. Отец как Куберы, так и Раваны (от разных жён). Имя этимологически прозрачно: viśravas = «тот, о ком слышат повсюду (vi = по всему [миру])». Важно: ракшаси намеренно начинают генеалогию с mānasa-sutas (сынов-мысли Брахмы), чтобы показать, что даже духовная линия ведёт к Раване. Контраст: Рама = потомок ikṣvāku (по крови); Равана = потомок Брахмы (через духовную преемственность риши).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:viSravas"}]}, {"verse_id": "5.23.10", "verse": "10", "sanskrit_iast": "vivartya nayane kopān mārjārasadṛśekṣaṇā | । yena devāstrāyastriṃśad devarājaśca nirjatāḥ || ॥10॥", "leonov_ru": "Округлив в гневе глаза, подобные кошачьим: Которым трое богов и тридцать девараджей побеждены", "commentary": {"tilaka": "येनेत्यनेन पराक्रमातिशयसूचनम्", "bhusana": "येन देवास्त्रयस्त्रिंशद्देवराजश्च निर्जिताः ।\n\nभर्त्सयन्ती तदा घोरमिदं वचनमब्रवीत्", "siromani": "तद्वचनाकारमाह येनेत्यादिभिः । येन देवा देवराजश्च निर्जिताः तस्य भार्याः पत्नीः भवितुं पूज्यात्वेन प्राप्तुं त्वमर्हसि"}, "has_tier1": false, "notes": [{"id": "edition:5.23.10:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.23.10 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.23.10", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.23.10", "iast": "vivartya nayane kopān mārjārasadṛśekṣaṇā | । yena devāstrāyastriṃśad devarājaśca nirjatāḥ || ॥10॥"}]}]}, {"verse_id": "5.23.11", "verse": "11", "sanskrit_iast": "tasya tvaṃ rākṣasendrasya bhāryā bhavitumarhasi । vīryotsiktasya śūrasya saṃgrāmeṣv anivartinaḥ । balino vīryayuktasyā bhāryātvaṃ kiṃ na lipsase ॥11॥", "leonov_ru": "Того владыки ракшасов женою должна стать. Гордого своим мужеством героя, в битвах не отступающего, Могучего, доблестного супружество почему ты не желаешь принять?", "commentary": {"tilaka": "न लिप्ससे नेच्छसीत्यर्थः", "siromani": "वीर्येति । वीर्योत्सिक्तस्य उद्धतवीर्यस्य रावणस्य भार्या मन्दोदरीप्रभृतिः किं किमर्थं न लिप्स्यसे वाञ्छसि । द्वितीयानुत्पत्तिः पूर्ववत्", "bhusana": "वीर्योत्सिक्तस्य शूरस्य सङ्ग्रामेष्वनिवर्तिनः ।\n\nबलिनो वीर्ययुक्तस्य भार्यात्वं किं न लप्स्यसे"}, "has_tier1": true, "notes": [{"id": "tier1:5.23.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Почему же ты не желаешь (kiṃ na lipsase) – букв. «не обретешь». В комментарии «Тилака» это слово объясняется как necchasi «не желаешь»."}, {"id": "lexical:5.23.11:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vīryotsikta", "note_ru": "Вирьотсикта (vīrya-utsikta, adj.) — «пьяный от мужества, опьянённый доблестью»: vīrya «мужество, доблесть, мощь» (от vīra «герой») + utsikta (ud+√sic-, «лить через край; быть переполненным») = «переполненный, гордый до предела». MW: utsikta 'overflowing; proud, arrogant'. Буквально: тот, в ком vīrya бьёт через край. Это не комплимент: utsikta несёт коннотацию «слишком много», гибриса. Ракшаси преподносят это как достоинство, но читатель-эпик слышит предупреждение: utsikta = hubris → nemesis. Аналогичная логика в образе гордого śatru- против Рамы.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:utsikta", "collision_tier1": true}]}, {"verse_id": "5.23.12", "verse": "12", "sanskrit_iast": "priyāṃ bahumatāṃ bhāryāṃ tyaktvā rājā mahābalaḥ । sarvāsāṃ ca mahābhāgāṃ tvām upaiṣyati rāvaṇaḥ ॥12॥", "leonov_ru": "Оставив любимую, высоко ценимую жену оставив, наделенную долей, лучшей чем у всех (остальных женщин), могучий царь Равана придет к тебе.", "commentary": {"siromani": "तत्र हेतुमाह प्रियामिति । प्रियामतिप्रीतिविषयीभूतां बहुमतां बहुभिराकाङ्क्षितां भार्यामतिदीप्तिहेतुभूतां राजलक्ष्मीमित्यर्थः, त्यक्त्वा सर्वासां लक्ष्म्यादीनां मध्ये महाभागां त्वां रावण उपैष्यति प्रापयिष्यति", "bhusana": "प्रियां बहुमतां भर्यां त्यक्त्वा राजा महाबलः ।\n\nसर्वासां च महाभागां त्वामुपैष्यति रावणः"}, "has_tier1": true, "notes": [{"id": "tier1:5.23.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Покинув любимую Мандодари (priyāṃ bahumatāṃ bhāryāṃ tyaktvā) – имя Мандодари добавлено по контексту и в соответствии с комментарием «Тилака»."}]}, {"verse_id": "5.23.16", "verse": "16", "sanskrit_iast": "yasya sūryo na tapati bhīto yasya sa mārutaḥ । na vāti smāyatāpāṅge kiṃ tvaṃ tasya na tiṣṭhase ॥16॥", "leonov_ru": "Которого, испугавшись, солнце не светит и ветер Не дует, о ты, уголки глаз которой сияют улыбкой, не уступишь ему?", "commentary": {"tilaka": "यस्य भीतः सूर्यो न तपतीत्यर्थः । न तिष्ठसे वशे इति शेषः", "siromani": "यस्येति । यस्य यस्माद्भीतः सूर्यो न तपति मारुतो न वाति च तस्य पूजायामिति शेषः, त्वं किं किमर्थं न तिष्ठसे आस्थां करोषि", "bhusana": "तस्य सर्वसमृद्धस्य रावणस्य महात्मनः ।\n\nकिमद्य राक्षसेन्द्रस्य भार्यात्वं नेच्छसे ऽधमे ।\n\nततस्तु दुर्मुखी नाम राक्षसी वाक्यमब्रवीत्"}, "has_tier1": false, "notes": [{"id": "lexical:5.23.16:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "smāyatāpāṅga", "note_ru": "Смаятапанга (smāyata-āpāṅga, adj.) — «та, чьи уголки глаз улыбаются/сияют»: smāyata (от √smi-, «улыбаться» + удлинение-усиление) + āpāṅga «угол глаза» (ā+pāṅga; pāṅga — «угол, край»). MW: āpāṅga 'the outer corner of the eye'. Sita описывается через этот нежный эпитет даже в речи угрожающей ракшаси — красота Ситы не сломлена ни горем, ни угрозами: уголки её глаз всё ещё «улыбаются». Это поэтически значимая деталь: красота ситы как константа, не зависящая от ситуации. Подстрочник «уголки глаз которой сияют улыбкой» точен, но уберает несомненное восхищение говорящей.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:ApAGga"}]}, {"verse_id": "5.23.17", "verse": "17", "sanskrit_iast": "puṣpavṛṣṭiṃ ca taravo mumucur yasya vai bhayāt । śailāś susruvuḥ pānīyaṃ jaladāś ca yadecchati ॥17॥", "leonov_ru": "Из страха перед которым деревья проливали дождь из цветов, По воле которого горы и тучи обрушивали потоки вод,", "commentary": {"tilaka": "यदेच्छति तदा सुस्रुवुरित्यर्थः", "bhusana": "यस्य सूर्यो न तपति भीतो यस्य च मारुतः ।\n\nन वाति स्मायतापाङ्गे किं त्वं तस्य न तिष्ठसि\nयस्य यस्मात् । तस्य न तिष्ठसि तस्मै न तिष्ठसे । प्रकाशनार्थेप्यार्षत्वात्परस्मैपदं षष्ठी च\nपुष्पवृष्टिं च तरवो मुमुचुर्यस्य वै भयात् ।\n\nशैलाश्च सुभ्रूः पानीयं जलदाश्च यदेच्छति", "siromani": "पुष्पेति । यस्य भयात् यदा इच्छति तदैव तरवो पुष्पवृष्टिं मुमुचुः शैलाः गिरयः जलदाश्च पानीयं सुस्रुवुः तस्य भार्यार्थे तद्भार्याणां कल्याणार्थं बुद्धिं निश्चयं त्वं किं कथं न कुरुषे । अर्धचतुष्टयमेकान्वयि ।। 5.23.17,18 ।।\n\nसाध्विति । हे भामिनि तत्त्वतः यथार्थं साधु कथितं वाक्यं मद्वचनं साधु गृहाण स्वीकुरु अन्यथा न भविष्यसि राक्षस्यो हनिष्यन्तीत्यर्थः"}, "has_tier1": false, "notes": [{"id": "lexical:5.23.17:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "puṣpavṛṣṭi", "note_ru": "Пушпавришти (puṣpa-vṛṣṭi, f.) — «дождь цветов»: puṣpa «цветок, цветение» + vṛṣṭi «дождь» (√vṛṣ-, «лить, орошать»). MW: vṛṣṭi 'rain, a shower'. Puṣpavṛṣṭi — не только метафора: в эпической и пуранической традиции боги, гандхарвы и само небо «проливают» цветочный дождь как знак божественного одобрения (прежде всего после победы или подвига). Ракшаси описывает, как деревья льют puṣpavṛṣṭi из страха перед Раваной — то есть ритуальный знак почитания извращается в акт страха. Парадокс: обряд восхваления (puṣpavṛṣṭi) производится принудительно, через terror.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:puzpavfzwi"}]}, {"verse_id": "5.23.18", "verse": "18", "sanskrit_iast": "tasya nairṛtarājasya rājarājasya bhāmini । kiṃ tvaṃ na kuruṣe buddhiṃ bhāryārthe rāvaṇasya hi ॥18॥", "leonov_ru": "Того владыку ракшасов, царя царей, о прекрасная, Равану, почему не обратишь мысли к супружеству с ним?", "commentary": {"tilaka": "भार्यार्थे भार्यात्वनिमित्तम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.23.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nairṛtarāja", "note_ru": "Найрритараджа (nairṛta-rāja, m.) — «царь нирритов (ракшасов)»: nairṛta «принадлежащий Нирри́ти» → nairṛta = ракшас (юго-западная сторона света принадлежит Нирри́ти, богине разрушения). MW: nairṛta 'belonging to Nirṛti; a Rākṣasa'. Nirṛti (ni+√ṛ-, «тот, кто разрушает») — ведийское божество-персонификация распада и несчастья. Ракшасы — её «подданные» по космологии стран света. Этот эпитет для Раваны — один из наиболее точных в теологическом смысле: он не просто «царь ракшасов» (rākṣasādhipa), но rāja nairṛtas = повелитель сил деструктуры. Для понимания его роли в Рамаяне это важная космологическая характеристика.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:nairfta"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};

  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

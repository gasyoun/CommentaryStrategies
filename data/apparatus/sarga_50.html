āvaṇa). MW: rāvaṇa 'causing to cry, causing to lament'; от √ru-/√rav- (класс II, Whitney #396, «реветь, кричать») + суфф. -ana. Здесь стих обыгрывает это: «rāvaṇo lokarāvaṇaḥ» — «Равана, чей рёв — во всём мире». Парономасия: имя собственное Rāvaṇa эксплицируется через нарицательное loka-rāvaṇa — стандартный эпический приём этимологии через контекст (nirvacana).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:lokarAvaRa", "collision_tier1": true}]}, {"verse_id": "5.50.2", "verse": "2", "sanskrit_iast": "śaṅkāhṛtātmā dadhyau sa kapīndraṃ tejasā vṛtam । kim eṣa bhagavān nandī bhavet sākṣād ihāgataḥ ॥2॥", "leonov_ru": "Душа его была охвачена сомнениями, и подумал он о владыке обезьян, наделенном величием: «Что если это Господь Нандин (Шива), лично сюда явившийся,", "commentary": {"tilaka": "तेजसा वृतम् । दृष्ट्वेति शेषः । शङ्काहतात्मेत्युक्तां शङ्कामेवाह-- नन्दी वानरमुख एष प्रमथगणाधिपः", "bhusana": "शङ्काहतात्मा दध्यौ स कपान्द्रं तेजसावृतम् ।\n\nकिमेष भगवान्नन्दी भवेत् साक्षादिहागतः"}, "has_tier1": true, "notes": [{"id": "tier1:5.50.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "О блистательном Ханумане (kapīndraṃ tejasā vṛtam) – букв. «об Индре обезьян, покрытом блеском».[Е. Костина] «2» 2 и 3 - сверка"}, {"id": "lexical:5.50.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kapīndra", "note_ru": "Царь обезьян (kapīndra) — эпитет «царь обезьян» (kapi-indra), прилагается к Сугриве или Хануману в зависимости от контекста. Первое вхождение в кн. V.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "collision_tier1": true}, {"id": "lexical:5.50.2:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nandī", "note_ru": "Нандин (Nandī/Nandin, m.) — хранитель-привратник Шивы, «бык Шивы», предводитель ганов; изображается с бычьей головой или как белый бык. MW: Nandī 'name of Śiva's door-keeper (represented as a dwarfish figure with a bull's head)'. Равана гадает: «Уж не сам ли Нандин явился ко мне?» — отсылка к эпизоду в Уттараканде, где Нандин проклял Равану, что обезьяны помогут уничтожить его. Распознавание через страх — нарративная функция отождествления.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:nandI", "collision_tier1": true}, {"id": "edition:5.50.2:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.50.2–3 (2 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.50.2–3", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.50.2", "iast": "śaṅkāhṛtātmā dadhyau sa kapīndraṃ tejasā vṛtam । kim eṣa bhagavān nandī bhavet sākṣād ihāgataḥ ॥2॥"}, {"verse_id": "5.50.3", "iast": "yena śapto ’smi kailāse mayā prahasite purā । so 'yaṃ vānaramūrtiḥ syāt kiṃ svid bāṇo 'pi vāsuraḥ ॥3॥"}], "collision_tier1": true}]}, {"verse_id": "5.50.3", "verse": "3", "sanskrit_iast": "yena śapto ’smi kailāse mayā prahasite purā । so 'yaṃ vānaramūrtiḥ syāt kiṃ svid bāṇo 'pi vāsuraḥ ॥3॥", "leonov_ru": "Которым я был некогда проклят на горе Кайласе, когда я посмеялся над ним? Или, может быть, это асура Бана, принявший облик обезьяны?»", "commentary": {"tilaka": "शप्तः मन्मुखसदृशमुखैस्तव नाशो भविष्यतीति शापः । बलिसुतो बाणो वा महेश्वरभक्तत्वान्नन्दिना प्रेषित इति शङ्का", "siromani": "चिन्ताकारमाह किमित्यादिभिः । पुरा कैलासगमनसमये मया प्रहसिते वानरमुखसदृशमुखवत्त्वेन प्रहासं प्रापिते सति येनाहं शप्तः सन् मुखसदृशमुखैः त्वद्विनाशो भवितेत्युक्तो ऽस्मि स भगवान् एष नन्दी वानरमूर्तिः सन् किमिहागतः स प्रसिद्धो बाणो ऽसुरो वानरमूर्तिः सन् इहागतो वा । सार्धश्लोक एकान्वयी ।। 5.50.2,3 ।।\n\nस इति । राजा स रावणः मन्त्रिसत्तमं प्रहस्तं विपुलं गम्भीरम् अर्थवत् प्रयोजनविशिष्टम् इदमुवाच"}, "has_tier1": true, "notes": [{"id": "tier1:5.50.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Проклял на горе Кайласе (yena śapto ’smi kailāse) – как поясняет автор «Тилаки», проклятие Нандина было таким: «Твоя гибель будет от тех, кто лицом подобен мне».[Е. Костина] «асура Бана,» потом нужен будет комм"}, {"id": "lexical:5.50.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "Bāṇa", "note_ru": "Бана (Bāṇa, m.) — демон-асур, сын Бали, обладавший тысячью рук; эпизод с ним детально разработан в Пуранах (Bhāgavata X.62–63). MW: Bāṇa 'name of a demon (son of Bali, grandson of Virocana)'. Равана перебирает варианты: «Уж не Бана ли это с многими руками?» — демонстрируя свои мифологические познания и страх узнавания. Упоминание Бану здесь — интертекстуальный маркер, соединяющий Рамаяну с более широкой асурической мифологией.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:bARa", "collision_tier1": true}]}, {"verse_id": "5.50.4", "verse": "4", "sanskrit_iast": "sa rājā roṣatāmrākṣaḥ prahastaṃ mantrisattamam । kālayuktam uvācedaṃ vaco vipulam arthavat ॥4॥", "leonov_ru": "Царь, глаза которого покраснели от гнева, к Прахасте, лучшему из советников Обратился с речью, подобающей времени, глубокой и исполненной смысла:", "commentary": {"tilaka": "कालयुक्तं कालोचितम्", "bhusana": "स राजा रोषताम्राक्षः प्रहस्तं मन्त्रिसत्तमम् ।\n\nकालयुक्तमुवाजेदं वचो विपुलमर्थवत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.50.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «vipulam arthavat» опущено, из-за этого непонятно, почему речь - подобающая времени"}, {"id": "lexical:5.50.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nārada", "note_ru": "Нарада (Nārada, m.) — мудрец-странник, вечный посредник между людьми и богами; порой провокатор (MW: Nārada 'name of a divine Ṛṣi, a messenger between gods and men'). Равана допускает, что перед ним Нарада — мудрец, способный принять любой облик. Упоминание Нарады — иронический штрих: Хануман, в отличие от Нарады, не провокатор, а именно посланник (dūta). Путаница Раваны характеризует его психологическое состояние. См. примеч. к I.1.1 (Гринцер; первое вхождение в кн. I–III, уточнить по примеч.).", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:nArada", "collision_tier1": true}]}, {"verse_id": "5.50.5", "verse": "5", "sanskrit_iast": "durātmā pṛcchyatām eṣa kutaḥ kiṃ vāsya kāraṇam । vanabhaṅge ca ko 'syārtho rākṣasīnāṃ ca tarjane ॥5॥", "leonov_ru": "«Спроси этого негодяя, откуда он, по какой причине [пришел сюда], И зачем уничтожил рощу и пугал ракшаси?", "commentary": {"tilaka": "कुतः आगत इति शेषः । किं वा कारणम् को वास्य प्रेषक इत्यर्थः", "bhusana": "दुरात्मा पृच्छ्यतामेष कुतः किं वा ऽस्य कारणम् ।\n\nवनभङ्गे च को ऽस्यार्थो राक्षसीनां च तर्जने"}, "has_tier1": true, "notes": [{"id": "tier1:5.50.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Откуда и зачем он явился (kutaḥ kiṃ vāsya kāraṇam) – в комментарии «Тилака» выражение kiṃ vāsya kāraṇam объясняется как «кем он послан». Так же поясняет это выражение и автор комментария «Бхушана». Автор комментария «Широмани» интерпретирует его как «какова цель его прихода»."}]}, {"verse_id": "5.50.6", "verse": "6", "sanskrit_iast": "matpurīm apradhṛṣyāṃ vai gamane kiṃ prayōjanam । āyodhane vā kiṃ kāryaṃ pṛcchayatām eṣa durmatiḥ ॥6॥", "leonov_ru": "«С какой целью пришел он в мой неприступный город, И ради чего затеял битву [с нами], спроси этого негодяя».", "commentary": {"tilaka": "मत्पुरीम् उद्दिश्येति शेषः । आयोधने किङ्करादिभिर्युद्धे । यद्वा मत्पुरीगमने मत्पुरीप्राप्तावित्यर्थः । आर्षः षष्ठ्यभावः ।। 5.50.6,7 ।।\n\nमोक्ष्यसे बन्धनादिति शेषः", "bhusana": "मत्पुरीमप्रधृष्यां वा ऽ ऽगमने किं प्रयोजनम् ।\n\nआयोधने वा किं कार्यं त्वया कपे", "siromani": "मदिति । मत्पुरीं प्रतीति शेषः । गमने आगमने किं प्रायोजनम् आयोधने युद्धे वा ते किं कार्यम् इत्येष दुर्मतिः पृच्छ्यताम्"}, "has_tier1": false, "notes": [{"id": "edition:5.50.6:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.50.6 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.50.6", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.50.6", "iast": "matpurīm apradhṛṣyāṃ vai gamane kiṃ prayōjanam । āyodhane vā kiṃ kāryaṃ pṛcchayatām eṣa durmatiḥ ॥6॥"}]}]}, {"verse_id": "5.50.8", "verse": "8", "sanskrit_iast": "yadi tāvat tvam indreṇa preṣito rāvaṇālayam । tattvam ākhyāhi mā te bhūd bhayaṃ vānara mokṣyase ॥8॥", "leonov_ru": "Если ты послан Индрой в обитель Раваны, Расскажи правду, не бойся, обезьяна, тебя освободят.", "commentary": {"bhusana": "यदि तावत्त्वमिन्द्रेण प्रेषितो रावणालयम् ।\n\nतत्त्वमाख्याहि मा भूत्ते भयं वानर मोक्ष्यसे", "siromani": "समाश्वासनप्रयोजनमाह यदीत्यादिभिः । यदि तु त्वमिन्द्रेण प्रेषितः तर्हि तत्त्वं यथार्थमाख्याहि । तत्त्वकथने फलमाह त्वं मोक्ष्यसे अस्माभिर्बन्धनादिति शेषः"}, "has_tier1": false, "notes": [{"id": "lexical:5.50.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "teja", "note_ru": "Теджас (tejas, n.) — «огненная энергия, блеск, мощь»; от √tij- / корень tej- («быть острым, пылать»). MW: tejas 'sharpness, the sharp edge (of a knife etc.); heat, glow; fire; vital power, energy, spirit'. Теджас — центральная категория эпической антропологии: накапливается через тапас, передаётся взглядом, излучается телом. Ханумана «окружённого теджасом» (tejasā vṛtam) Равана видит физически — теджас ано, тогда владыке орд ракшасов", "commentary": {"tilaka": "कुत एवं चिन्ता तत्राह-- नहीति । वानरमितीदमर्थाण्णन्तम् ।। 5.50.10,11 ।।\n\nअथ वेति । अथ चेत्यर्थः । यन्निमित्तो यत्प्रयोजनस्तत्कथयस्वेति संबन्धः । एवमुक्तः प्रहस्तेनेति शेषः । रक्षोगणेश्वरं प्रहस्तमलक्षीकृत्य रावणमेव तथाकृत्वा ऽब्रवीदित्युत्तरेणान्वयः", "bhusana": "एवमुक्तो हरिश्रेष्ठस्तदा रक्षोगणेश्वरम्", "siromani": "एवमिति । एवमुक्तः हरिवरो हनूमान् अब्रवीत् । तद्वचनाकारमाह शक्रादन्यतमस्य दूतो ऽहं नास्मि । अर्धद्वयमेकान्वयि"}, "has_tier1": true, "notes": [{"id": "tier1:5.50.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Повелителю ракшасов (rakṣogaṇeśvaram) – комментаторы отмечают, что Хануман ответил не Прахасте, а самому Раване."}]}, {"verse_id": "5.50.18", "verse": "18", "sanskrit_iast": "vimukto 'py aham astreṇa rākṣasais tv abhiveditaḥ । kenacid rāmakaryeṇa āgato 'smi tavāntikam ॥18॥ dūto 'ham iti vijñayo rāghavasyāmitaujasaḥ ॥18॥", "leonov_ru": "Даже освобожденный от божественного оружия, я был доложен [тебе] ракшасами (Хотя я и освободился от божественного оружия, я позволил ракшасам привести меня к тебе и доложить обо мне). По некоему делу Рамы пришел я к тебе.", "commentary": {"bhusana": "विमुक्तो ह्यहमस्त्रेण राक्षसैस्त्वभिपीडितः ।\n\nकेनचिद्राजकार्येण संप्राप्तो ऽस्मि तवान्तिकम्\nदूतो ऽहमिति विज्ञेयो राघवस्यामितौजसः ।\n\nश्रूयतां चापि वचनं मम पथ्यमिदं प्रभो", "tilaka": "रामस्य तव च कः संबन्धस्तत्राह दूत इति । ननु रामदूतेनापि सीतान्वेषणमेव कार्यम् एवंप्रयासेन मद्दर्शने किं फलं तत्राह-- श्रूयतामिति । वचनं सन्देशवचनम् । तत्कथनार्थमयं प्रयास इति भावः"}, "has_tier1": true, "notes": [{"id": "tier1:5.50.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «vimukto ‘py aham astreṇarākṣasais tv abhiveditaḥkenacid rāmakaryeṇaāgato ‘smi tavāntikam 18» комм., далековато от текста"}, {"id": "phase2:5.50.18:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "rāmakāryeṇa / rājakāryeṇa", "note_ru": "В цитате Бхушаны стих читается «kenacid rājakāryeṇa» («по некоему царскому делу») вместо «rāmakāryeṇa» перевода — вариант меняет объяснение Ханумана: не «дело Рамы», а обобщённое «государево дело».", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "текстовый вариант rāja-/rāma-kāryeṇa нигде не отмечен ни в подстрочнике, ни в примечании Костиной (её помета к этому стиху касается другого места — «далековато от текста»), а меняет то, что именно Хануман называет причиной своего прихода.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}, {"id": "edition:5.50.18:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.50.18 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.50.18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.50.18", "iast": "vimukto 'py aham astreṇa rākṣasais tv abhiveditaḥ । kenacid rāmakaryeṇa āgato 'smi tavāntikam ॥18॥ dūto 'ham iti vijñayo rāghavasyāmitaujasaḥ ॥18॥"}], "collision_tier1": true}]}, {"verse_id": "5.50.19", "verse": 19, "sanskrit_iast": "", "leonov_ru": "", "commentary": {}, "has_tier1": false, "notes": [{"id": "lexical:5.50.19:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āgneya", "note_ru": "Агнея (āgneya, adj.) — «относящийся к Агни, огненный»; притяжательное прилагательное от Agni. MW: āgneya 'belonging or sacred to fire or to the god of fire'. В упоминании «āgneyam astraṃ» («огненное оружие») — отсылка к классу divyāstra (божественного оружия), которое призывается именем конкретного бога (Агни). Астра (astra) vs. шастра (śastra): astra = метательно   }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

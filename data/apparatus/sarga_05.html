िव ज्योत्स्नावितानं चन्द्रिकाविस्तारं भुवि उद्वमन्तं कुर्वन्तं गोष्ठे भ्रमन्तं वृषमिव अंशुमन्तं चन्द्रमसं ददर्श । इव उभयान्वयी", "tattvadipika": "तत इति । ततः प्रवेशान्तरम् । मध्यं गतं, गगनस्येति शेषः । यद्वा तारामध्यं गतम् अंशुमन्तं चन्द्रम् । भानुमन्तं दीप्तिमन्तम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.1:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Луну, озарившую светом землю (tataḥ sa madhyaṃgatam aṃśumantaṃ jyotsnāvitānam) – букв. «лучистую, пребывающую среди [звезд], обильную сиянием».", "service": [], "suggestions": [], "seq": 1}, {"id": "phase2:5.5.1:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "madhyaṃ gatam", "note_ru": "По «Бхушане», сцена содержит скрытую временную привязку: поскольку восход луны отмечал вход Ханумана в Ланку (гл. 1), луна в зените здесь означает, что вход во внутренние покои Раваны происходит в полночь (ardharātra).", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "даёт скрытую сюжетную привязку времени (полночь), которую подстрочник и собственное примечание Леонова (этимология muhur udvamantam) не отмечают", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 2}]}, {"verse_id": "5.5.2", "verse": "2", "sanskrit_iast": "lokasya pāpāni vināśayantaṃ । mahodadhiṃ cāpi samedhayantam । bhūtāni sarvāṇi virājayantaṃ । dadarśa śītāṃśum athābhiyāntam ॥2॥", "leonov_ru": "Страдания (исходящие из злых дел) людские уничтожающую, А также океан увеличивающую, Все живые существа освещающую, Увидел [Хануман] хладнолучистую (луну) поднимающуюся.", "commentary": {"tilaka": "पापानि पापजनकदुःखानि नाशयन्तम् लोकाह्लादजनकत्वात् समेधयन्तं वर्धयन्तम् विराजयन्तं प्रकाशयन्तम् अभितो यान्तमन्तःपुरदर्शनसाधनत्वेन खमध्यं प्राप्तम्", "bhusana": "लोकस्य पापानि विनाशयन्तं महोदधिं चापि समेधयन्तम् ।\n\nभूतानि सर्वाणि विराजयन्तं ददर्श शीतांशुमथाभियान्तम्\nपापानि दुःखानि", "siromani": "तदेव भङ्ग्यन्तरेणाह लोकस्येत्यादिभिः । लोकस्य पापानि निशि जायमानचुरादीनि विनाशयन्तं महोदधिं समेधयन्तं भूतानि विराजयन्तं प्रकाशयन्तमभियान्तं शीतांशुं चन्द्रमसं ददर्श", "tattvadipika": "लोकस्येति । पापशब्देन पापफलं दुःखमुच्यते, लोकः ह्लादकत्वाच्चन्द्रस्य दुःखविनाशकत्वम् । यद्वा सूर्यचन्द्रादीनां लोकपावनत्वादिति भावः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Страданья людские уничтожая (lokasya pāpāni vināśayantam) – слово pāpāni, которое обычно переводят как «грехи», «зло», комментаторы объясняют как «страдания, порожденные грехами» (pāpajanakaduḥkhāni в «Тилаке»).", "service": [{"author": "Е. Костина", "lemma_iast": "увеличивая", "kind": "note", "text": "Нужен комм., в каком смысле увеличивая, можно подумать, что речь о расширении"}], "suggestions": [], "seq": 3}, {"id": "phase2:5.5.2:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "lokasya pāpāni vināśayantam", "note_ru": "Наряду с прочитанным у Леонова толкованием «Тилаки» (pāpāni = страдания от грехов), «Таттвадипика» предлагает иное объяснение: луна (как и солнце) уничтожает людские страдания просто в силу своей природы «радующего мир» светила (loka-hlādakatva), а не как возмездие за грех.", "type": "Б", "source_commentary": ["tattvadipika"], "why_proposed": "добавляет второе, не приведённое у Леонова толкование композита — не карающее, а природно-благодатное действие светила", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 4}]}, {"verse_id": "5.5.3", "verse": "3", "sanskrit_iast": "yā bhāti lakṣmīr bhuvi mandarasthā । yathā pradoṣeṣu ca sāgarasthā । tathaiva toyeṣu ca puṣkarasthā । rarāja sā cāruniśākarasthā ॥3॥", "leonov_ru": "Та красота (сияние), которая на земле сияет на горе Мандара, Которая в сумерках пребывает в океане, И та, которая в воде пребывает на лотосах, Сияла, пребывая на прекрасной ночеделательнице (луне).", "commentary": {"tilaka": "भुवि मन्दरस्था भात्यधिकसंनिधाना भवति । पुष्करस्था अह्नीति शेषः । सेदानीं निशाकरस्थेति पर्यायालङ्कारः पादचतुष्टये स्था इत्येकपदयमकं च भुवि मन्दरे प्रदोषे सागरे ऽधिकलक्ष्मीसंनिधानमृषिवचनादेवावसेयम्", "bhusana": "या भाति लक्ष्मीर्भुवि मन्दरस्था तथा प्रदोषेषु च सागरस्था ।\n\nतथैव तोयेषु च पुष्करस्था रराज सा चारुनिशाकरस्था\nभुवि मन्दरो लक्ष्मीवान् । प्रदोषेषु सागरः । तोयेषु पद्मं श्रीमत् । तद्वत्तदानीं चन्द्रो विशिष्टलक्ष्मीको बभूवेत्यर्थः । अत्रान्यस्यान्यत्रासम्बन्धान्मन्दरादिलक्ष्मीरिवास्य लक्ष्मीरिति सादृश्याक्षेपान्निदर्शनालङ्कारः । तदुक्तं काव्यप्रकाशे निदर्शनायाम्--\"अभिमान्यस्तु सम्बन्ध उपमापरिकल्पकः\" इति", "siromani": "येति । भुवि पृथिव्यां मध्ये या लक्ष्मीर्मन्दरस्था सती यथा भाति प्रकाशते प्रदोषेषु च सागरस्था या यथा प्रकाशते तोयेषु च पुष्करस्था सती या यथा प्रकाशते सा चारुनिशाकरस्था सती तथैव रराज । मन्दरसागरयोरधिकलक्ष्मीप्रकाशो महात्मनां प्रत्यक्ष इति गम्यते"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "crosstext:5.5.3:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "mandara", "note_ru": "Лакшми на горе Мандаре — отсылка к пахтанью океана. Описывая лунный свет над Ланкой, поэт нанизывает места, где «сияет красота (lakṣmī)»: «yā bhāti lakṣmīr bhuvi mandarasthā» (V.5.3) — «та красота, что на земле сияет на горе Мандара». Мандара — мутовка богов при пахтанье Молочного океана, откуда и вышла сама Шри-Лакшми; миф изложен в кн. I: «manthānaṃ mandaraṃ kṛtvā mamanthur amitaujasaḥ» (Rām. I.45.18) — «Мутовкой взяли гору Мандару и принялись пахтать океан». Кавья-реминисценция связывает образ лунной lakṣmī с её мифологическим рождением; подстрочник V.5.3 передаёт сравнение без узнавания мифа. Поэтологический слой — подпись Гринцера.", "type": "Б", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.5.3", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bālakāṇḍa (Rām. I) 45.17–18", "source_links": [], "seq": 5}]}, {"verse_id": "5.5.4", "verse": "4", "sanskrit_iast": "haṃso yathā rājatapañjurasthaḥ । siṃho yathā mandarakandarasthaḥ । vīro yathā garvitakuñjarasthaś । candro 'pi babhrāja tathāmbarasthaḥ ॥4॥", "leonov_ru": "Словно гусь, сидящий в серебряной клетке, Словно лев в пещере на горе Мандара, Словно герой, сидящий на горделивом слоне, Так и луна сияла, пребывая в небе.", "commentary": {"tilaka": "अग्रे \"चन्द्रो ऽपि साचिव्यमिवास्य कुर्वस्तारागणैर्मध्यगतो विराजन् । ज्योत्स्नावितानेन निपत्य लोकानुत्तिष्ठते ऽनेकसहस्ररश्मिः ।। शङ्खप्रभाक्षीरमृणालवर्णं ह्युद्गम्यमानं ह्यवभासमानम् । ददर्श चन्द्रं स कपिप्रवीरः पोप्लूयमानं सरसीव हंसम् ।।\" इति श्लोकद्वयं प्रिक्षिप्तम् ।।\n\n1 ।। 2 ।।\n\nततो ऽन्तःपुरप्रेवेशोत्तरं रात्रेः प्रथमयामस्य समाप्तकल्पत्वमत्रेति बोध्यम् । मध्यङ्गतं व्योममध्यं तारामध्यं च प्राप्तम् अंशुमन्तं शीतांशुम् भानुमन्तं सूर्ययोगेन प्रकाशवत्किरणवन्तम् । गोष्ठे भ्रमन्तं मत्तं वृषमिव\nहंसो यथेति । किञ्चिदाधारप्रतिष्ठितशुक्लवस्तुत्वमात्रेणाम्बरस्थचन्द्रे सादृश्यमिति कतकः । कुञ्जरो ऽप्यत्र श्वेत एव अम्बरमपि तत्किरणैरेव श्वेतमिति बोध्यम् । अम्बरस्थो ऽम्बरमध्यस्थः", "bhusana": "हंसो यता राजतपञ्जरस्थः सिंहो यथा मन्दरकन्दरस्थः ।\n\nवीरो यथा गर्वितकृञ्जरस्थश्चन्द्रो विबभ्राज तथा ऽम्बरस्थः\nहंस इति । राजतपञ्जरस्थः गगनगर्भस्य ज्योत्स्नाक्षालितत्वात् । मन्दरकन्दरस्थः तस्य श्वेतगिरित्वात् । गर्वितकुञ्जरस्थः नीलरूपस्य नभस उपर्यवस्थानात् । अत्र पुष्टत्वादीनां साधारणधर्माणामनुपादानाल्लुप्तोपमालङ्कारः", "siromani": "हंस इति । राजतपञ्जरस्थादिः हंसादिरिव अम्बरस्थः चन्द्रो ऽपि बभ्राज"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Словно лебедь, сидящий в серебряной клетке (haṃso yathā rājatapañjurasthaḥ) – луна схожа с лебедем белизной, с серебряной клеткой сравниваются окружающие ее звезды.", "service": [], "suggestions": [], "seq": 6}]}, {"verse_id": "5.5.5", "verse": "5", "sanskrit_iast": "sthitaḥ kakudmān iva tīkṣṇaśṛṅgo । mahācalaḥ śveta ivordhvaśṛṅgaḥ । hastīva jāmbūnadabaddhaśṛṅgo । vibhāti candraḥ paripūrṇaśṛṅgaḥ ॥5॥", "leonov_ru": "Стоя словно горбатый бык с острыми рогами, Словно великая белая гора с высокой вершиной, Словно слон, чьи бивни позолочены, Сияла полная луна со знаком рога.", "commentary": {"tilaka": "परिपूर्णशृङ्गः परिपूर्णकलङ्करूपहरिणशृङ्ग इत्यर्थः । जाम्बूनदबद्धेति स्वरूपकथनमात्रम्", "bhusana": "स्थितः ककुद्मानिव तीक्ष्णशृङ्गो महाचलः श्वेत इवोच्चशृङ्गः ।\n\nहस्तीव जाम्बूनदबद्धशृङ्गो रराज चन्द्रः परिपूर्णशृङ्गः\nस्थित इति । परिपूर्णशृङ्गः परिपूर्णकलः । अत्र शृङ्गशब्दस्य विषाणाद्यर्थभेदे ऽपि बिम्बप्रतिबिम्बभावेनौपम्यम्", "siromani": "स्थित इति । तीक्ष्णशृङ्गः ककुद्मान् वृष इव स्थितः ऊर्ध्वशृङ्गः श्वेतो महाचलः हिमगिरिरिव जाम्बूनदबद्धशृङ्गः सुवर्णबद्धदन्तः हस्तीव परिपूर्णशृङ्गः उत्थितशृङ्गाकारङ्कवान् इत्यर्थः, चन्द्रो विभाति"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Строфа построена на использовании слова śṛṅga в разных значениях (рог; горная вершина; слоновый бивень). « Так сияла луна, рогами отмеченная» (vibhāti candraḥ paripūrṇaśṛṅgaḥ) – в комментарии «Тилака» композит «paripūrṇaśṛṅgaḥ» объясняется как «с пятном, формой подобным рогам антилопы» (paripūrṇakalaṅkarūpahariṇaśṛṅgaḥ). Автор комментария «Бхушана» полагает, что речь идет о полной луне (paripūrṇakalaḥ).", "service": [], "suggestions": [], "seq": 7}]}, {"verse_id": "5.5.6", "verse": "6", "sanskrit_iast": "vinaṣṭaśītāmbutuṣārapaṅko । mahāgrahagrāhavinaṣṭapaṅkaḥ । prakāśalakṣmyāśrayanirmalāṅko । rarāja candro bhagavān śaśāṅkaḥ ॥6॥", "leonov_ru": "Сияла благодатная луна, отмеченная знаком зайца, Утратившая грязь холодной воды и снега, Темнота ее исчезла благодаря собранию лучей солнца, Знак ее был чистым благодаря ясному сиянию.", "commentary": {"tattvadipika": "या लक्ष्मीः मन्दरादिस्थानेषु भाति सा लक्ष्मीः चारुनिशाकरस्था भातीति सम्बन्धः ।। 5.5.3,4 ।।\n\nपरिपूर्णश्रृङ्गः परिपूर्णकलः\nमहाग्रहग्राहविनष्टपङ्कः महाग्रहः सूर्यः तस्य ग्राहणः किरणसंक्रमेण विनष्टः विनाशितः पङ्कस्तमो येन तथोक्तः । चन्द्रस्य सूर्यकिरणसंक्रमणद्वारा तमोविनाशकत्वम् । तदुक्तम्  \"सलिलमये शशिनि रवेर्दीधितयो मूर्च्छितास्तमो नैशम् । क्षपयन्ति दर्पणो दननिहिता इव मन्दिरस्यान्तः ।।\" इति । विनष्टशीताम्बुतुषारपङ्कः शीताम्बु हिमं तस्य तुषाराः पृषतः त एव पङ्कः मालिन्यम्, विनष्टः शीताम्बुतुषारपङ्को यस्मिन् स तथा । एतदपि सूर्यकिरणसंक्रमणादित्यवगन्तव्यम् । प्रकाशलक्ष्म्याश्रयनिर्मलाङ्कः, प्रकाशसमृद्ध्याश्रयत्वात्सुव्यक्तचिह्रः इत्यर्थः ।।\n\n5.5.6,7 ।।\n\nप्रकाशचन्द्रोदयनष्टदोषः प्रकाशचन्द्रोदयेन नष्टः दोषः तिमिररूपदोषो यस्य स तथा । प्रवृद्धरक्षःपिशिताशदोषः प्रवृद्धः रक्षसां पिशितभक्षणरूपदोषो यस्मिन् । पिशितभक्षणस्य दोषत्वमहितजनहिंसाहेतुत्वात् । रामाभिरामेरितचित्तदोषः रामाः कान्ताः अभिरामाः रमणाः स्त्रीभिः कान्तैश्च ईरितः निरस्तः चित्तदोषः प्रणयकलहरूपो येन स तथोक्तः । स्वर्गप्रकाशः सीतान्वेषणस्यानुकूलत्वेनानन्दहेतुतया प्रदोषकालस्य स्वर्गसदृशत्वोक्तिः, अत एव भगवान् पूज्यः, आदरणीय इति यावत् । अत्र विरराजेत्यनुषज्यते ।। 5.5.8,9 ।।\n\nमत्तानि मदजनकद्रव्येण, अत एव प्रमत्तानि अनवहितानि, मत्तप्रमत्तजनयोगात् कुलानि भवनान्यपि तथोच्यन्ते । भद्रा गजाः", "bhusana": "विनष्टशीताम्बुतुषारपङ्को महाग्रहग्राहविनष्टपङ्कः ।\n\nप्रकाशलक्ष्म्याश्रयनिर्मलाङ्को रराज चन्द्रो भगवान् शशाङ्कः\nविनष्टेति । शीताम्बु हिमाम्बु, तुषाराः पृषताः,  पङ्कः तमः, विनष्टाः शीताम्बुतुषारा एव पङ्काः यस्मिन् तथा । \"तुषारः शीकरे हिमे\" इति विश्वः । महाग्राणां शुक्रबृहस्पत्यादीनां ग्राहेण ग्रहणेन आच्छादनेन विनष्टः पङ्को मलं यस्य सः महाग्रहग्राहविनष्टपङ्कः, स्वतेजसा महाग्रहतिरस्कारेण व्यक्तनैर्मल्य इत्यर्थः । यद्वा महाग्रहः सूर्यः तस्य ग्राहेण किरणपरिग्रहेण विनाशितः पङ्कः तमः येन सः । तदा तरणिकिरणसङ्क्रमणेन देदीप्यमानमण्डल इत्यर्थः । तदुक्तं वराहमिहिरेण--\"सलिल (सम)मये शशिनि रवेदीर्धितयो मूर्च्छतास्तमो नैशम् । क्षपयन्ति दर्पणोदरनिहिता इव मन्दिरस्यान्तः ।।\" इति। प्रकाशलक्ष्म्याश्रयनिर्मलाङ्कः तेजस्समृद्धियोगात्स्पष्टकलङ्कः। अतिधवले चन्द्रे परभागयोगेन कलङ्कस्याप्यौज्ज्वल्यं भवतीत्यर्थः। शशाङ्कः इति। भूच्छायामयः शशरूपः अङ्कः यस्य स तथा। \"लोकच्छायामयं लक्ष्म तवाङ्के शशसन्निभम्\" इति हरिवंशोक्तेः। भगवान्महाप्रभाववान्\nप्रकाशेन चन्द्रोदयेन नष्टः दोषः तिमिरं यस्मिन् सः । प्रवृद्धः रक्षसां पिशिताशनानां च दोषः सञ्जारूपो यस्मिन् स तथा । रामाभिः अभिरामैः कान्तैश्च ईरितः त्यक्तः चित्तदोषः कोपाभिमानरूपः यस्मिन् । स्वर्गप्रकाशः स्वर्गतुल्यः, तद्वदानन्दावह इत्यर्थः । भगवान् श्रीमान् । \"भगः श्रीकाममाहात्म्यवीर्ययत्नार्ककीर्तिषु\" इत्यमरः । प्रदोषः गत इति शेषः । 5.5.8 ।।\n\nतन्त्रीस्वनाः कर्णसुखाः प्रवृत्ताः स्वपन्ति नार्यः पतिभिस्सुवृत्ताः ।\n\nनक्तञ्चराश्चापि तथा प्रवृत्ता विहर्तुमत्यद्भुतरौद्रवृत्ताः\nतन्त्रीति स्पष्टम्", "siromani": "विनष्टेति । विनष्टः हिमालयस्य दूरत्वात् अपगतः शीताम्बुतुषाररूपपङ्कः यस्य सः महाग्रहः सूर्यः तस्य ग्राहः किरणसंक्रमः तेन विनष्टः विनाशितः पङ्कस्तम्भो येन । किंच महान्तो ये ग्रहग्राहाः ग्रहवशकर्तारः महाग्रहा इत्यर्थः, ते विनष्टपङ्का निरस्तप्रकाशकत्वगर्वा येन सः प्रकाशलक्ष्म्याश्रयेण प्रकाशरूपसंपत्त्याश्रयेण निर्मलः अङ्को लाञ्छनं यस्य स शशाङ्को रराज"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Чиста от холодной воды и снега (vinaṣṭaśītāmbutuṣārapaṅkaḥ) – в комментарии «Широмани» поясняется, что «загрязнение в виде холодной воды и снега» (śītāmbutuṣārarūpapaṅkaḥ) исчезло из-за того, что луна удалилась от Гималаев (himālayasya dūratvāt). Считалось, что луна находится на голове у Шивы, пребывающего в Гималаях.Озарилась она солнца лучами (mahāgrahagrāhavinaṣṭapaṅkaḥ) – в «Широмани» поясняется, что тьма («грязь») луны исчезла благодаря ее соединению (saṃkrama) с лучами солнца.Знак на ней был отчетливо виден (prakāśalakṣmyāśrayanirmalāṅkaḥ) – букв. «та, чей знак [стал] чистым благодаря явному пребыванию [на ней] сияния».", "service": [{"author": "Е. Костина", "lemma_iast": "6", "kind": "note", "text": "Наверно, надо отметить в комм., что этого и следующего стихов нет в некоторых редакциях"}, {"author": "Е. Костина", "lemma_iast": ".", "kind": "note", "text": "Перевод в тексте и комм не совпадает"}, {"author": "Е. Костина", "lemma_iast": "Знак", "kind": "note", "text": "Комм., что за знак"}], "suggestions": [], "seq": 8}, {"id": "lexical:5.5.6:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śaśāṅka", "note_ru": "Шашанка (śaśāṅka, m.) — «отмеченный зайцем» = луна: śaśa «заяц/кролик» + aṅka «знак, отметина». MW: śaśāṅka 'the moon (rabbit-marked)'. Индийская традиция видит на лунном диске силуэт зайца, а не «человека на луне» западной традиции; отсюда устойчивое имя луны śaśāṅka / śaśin / śaśadhara. В «Рамаяне» луна — постоянный маркер ночных сцен поиска Ситы и её страдания; имя «заяц-на-луне» указывает на конкретный способ смотреть на ночное небо, отличный от европейского.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:SaSANka", "source_links": [{"label": "MW SaSANka", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=SaSANka"}], "collision_tier1": true, "seq": 9}, {"id": "phase2:5.5.6:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "mahāgrahagrāhavinaṣṭapaṅkaḥ", "note_ru": "«Бхушана» подкрепляет астрономическое толкование (тьма луны рассеивается от захвата солнечных лучей) прямой цитатой из Варахамихиры о том, что лучи солнца, растворённые в водянистой луне, гасят ночную тьму, как зеркало в глубине покоев; отдельно поясняет знак на луне (śaśāṅka) не как зайца, а как тень земли, ссылаясь на «Хариванщу».", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "вводит именную научно-поэтическую цитату (Варахамихира) и альтернативную (не зооморфную) этимологию лунного пятна, отсутствующие в примечании Леонова", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 10}, {"id": "edition:5.5.6:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.5.6–7 (2 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.5.6–7", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.5.6", "iast": "vinaṣṭaśītāmbutuṣārapaṅko । mahāgrahagrāhavinaṣṭapaṅkaḥ । prakāśalakṣmyāśrayanirmalāṅko । rarāja candro bhagavān śaśāṅkaḥ ॥6॥"}, {"verse_id": "5.5.7", "iast": "śilātalaṃ prāpya yathā mṛgendro । mahāraṇaṃ prāpya yathā gajendraḥ । rājyaṃ samāsādya yathā narēndras । tathā prakāśo virarāja candraḥ ॥7॥"}], "collision_tier1": true, "seq": 11}]}, {"verse_id": "5.5.8", "verse": "8", "sanskrit_iast": "prakāśacandrodayanaṣṭadoṣaḥ । pravṛddharakṣaḥpiśitāśadoṣaḥ । rāmābhirāmeritacittadoṣaḥ । svargaprakāśo bhagavān pradoṣaḥ ॥8॥", "leonov_ru": "Тот, чья тьма была развеяна взошедшей луной, Тот, чья опасность в виде ракшасов-людоедов возросла, Тот, чьи неприятности в виде любовных ссор были изгнаны, [Настал] благословенный вечер, небеса которого были озарены [луной].", "commentary": {"tilaka": "प्रकाशयुक्तचन्द्रस्योदयेनोर्ध्वमागमनेन नष्टो नाशितो ऽन्तर्गृहे ऽपि दोषस्तिमिरजो येन तथाभूतः प्रदोषो रजनीमुखं यामादूर्ध्वतनम् प्रवृद्धा वर्धिता रक्षसां पिशिताशनरूपा दोषा येन पिशितभक्षणस्य दोषत्वमविहितजीवहिंसाहेतुत्वात् । रामाणामभिरामविषयको रामणविषयक ईरितो निरस्तश्चित्तदोषः प्रणयकलहरूपो येन स्वर्गस्य सुखस्य प्रकाशो यतः, अत एव भगवान्पूज्यो रराजेत्यनुकर्षः", "bhusana": "प्रकाशचन्द्रोदयनष्टदोषः प्रवृद्धरक्षः पिशिताशदोषः ।\n\nरामाभिरामेरितचित्तदोषः स्वर्गप्रकाशो भगवान् प्रदोषः", "siromani": "प्रकाशेति । प्रकाशचन्द्रस्योदयेन नष्टो दोषस्तमो यस्य अत एव रामाणां स्त्रीणामभिरामाय ईरितः प्राप्तः चित्तदोषः पुरुषमनोत्यासक्तिर्यस्मिन् प्रवृद्धा रक्षस्सु पिशिताशदोषा यस्मिन् स्वर्गे ऽपि प्रकाशः शोभनत्वेन प्रख्यातिर्यस्य भगवान् धर्मात्मभ्यः सफलैश्वर्यदातेत्यर्थः, प्रदोषः रराजेत्यनुकृष्यते । यद्वा प्रदोषे चन्द्रनियन्तृत्वमारोप्याह प्रकाशेति । प्रकाशचन्द्रस्य प्रकाशविशिष्टचन्द्रमसः उदयेन नष्टो विनाशितः दोषः स्त्रीविषयकपुरुषदयाभावो येन प्रवृद्धाः रक्षस्सु पिशिताशदोषाः रुधिरपानरूपदुर्गुणाः यस्मिन् रामस्याभिरामाय सीतया सह रमणाय ईरितः चन्द्रो दापनेन प्रापितः चित्तदोषः सीताविषयकराममनोत्यासक्तिरूपदोषो दोषाभासो येन अत एव स्वर्गस्य सुखविशेषस्य प्रकाशः धर्मात्मसुप्रापकः अत एव भगवान् समर्थः प्रदोषो रराजेत्यनुकृष्यते"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "lexical:5.5.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pradoṣa", "note_ru": "Прадоша (pradoṣa, m.) — специфическое ритуально-временнóе обозначение: «первая стража ночи, ранний вечер сразу после захода солнца». MW: pradoṣa 'the first part of the night, early evening'. Pradoṣa — не просто «вечер», а ритуально маркированное время суток: именно в pradoṣa совершается sandhyā-vandana (вечерняя молитва), в pradoṣa выходят ночные существа (ракшасы, naktaṃcara), и в pradoṣa луна начинает свой подъём. Открытие сцены через слово pradoṣa задаёт ритуально-ночной регистр всей главы 5.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:pradoza", "source_links": [{"label": "MW pradoza", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=pradoza"}], "seq": 12}, {"id": "crosstext:5.5.8:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "pradoṣa", "note_ru": "Редкое слово pradoṣa («вечерние сумерки, первая стража ночи») в ярко орнаментальной строфе 5.8 (svargaprakāśo bhagavān pradoṣaḥ, «настал благословенный вечер, чьи небеса озарены [луной]») имеет ближайшего кавья-двойника в описании Алаки: «nityajyotsnāḥ prahitatamovṛttiramyāḥ pradoṣāḥ» (Мегха II.3) — «[там] вечера (pradoṣāḥ) с вечной луной, чарующие изгнанием тьмы». У обоих pradoṣa — лунно-озарённые сумерки идеального города. Параллель — locus classicus кавья-вечера и показывает, что строфа 5.8 написана «городским» мегхадутовским регистром, а не нейтральным эпическим.", "type": "Б", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.5.8", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Meghadūta II.3 (Kālidāsa)", "source_links": [], "seq": 13}]}, {"verse_id": "5.5.9", "verse": "9", "sanskrit_iast": "tantrīsvarāḥ karṇasukhāḥ pravṛttāḥ । svapanti nāryaḥ patibhiḥ suvṛttāḥ । naktaṃcarāś cāpi tathā pravṛttā । vihartum atyadbhutaraudravṛttāḥ ॥9॥", "leonov_ru": "Раздались приятные для уха звуки струн, Спали добродетельные женщины с мужьями, А также вышли бродящие по ночам (ракшасы), Чьи деяния удивительны и ужасны, чтобы развлечься.", "commentary": {"tilaka": "सुपृक्ता भेदग्रहाविषयाः । \"स्ववृत्ताः\" इति पाठे स्वं स्वीयं सहजपातिव्रत्यलक्षणं वृत्तं चारित्रं यासां ताः । नक्तञ्चरा उलूकादयो राक्षसाश्च तथा विहर्तुं प्रवृत्ताः", "siromani": "तन्त्रीति । कर्णसुखाः श्रोत्रानन्दप्रदाः तन्त्रीस्वरा वीणानादाः प्रवृत्ता पतिभिः सुपृक्ताः संयुक्ता नार्यः राक्षसपत्न्यः स्वपन्ति अत्यद्भुतरौद्रवृत्ता नक्तञ्चरा राक्षसा विहर्तुं प्रवृत्ताः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "lexical:5.5.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tantrī", "note_ru": "Тантри (tantrī, f.) — «струна (вины / лютни)». MW: tantrī 'a string (especially of a lute)'. Tantrī обозначает именно струну щипкового инструмента (vīṇā, vipañcī), в отличие от śiras «жильная струна лука». Звук tantrī в ночной сцене — характерная деталь эротической атмосферы: tantrī-svara сопровождает любовные встречи, а не военные действия. Упоминание tantrī наряду с naktaṃcara (ракшасами-ночниками) создаёт жанровый контраст: ночь одновременно эротична и опасна.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:tantrI", "source_links": [{"label": "MW tantrI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=tantrI"}], "seq": 14}, {"id": "lexical:5.5.9:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "naktaṃcara", "note_ru": "Нактамчара (naktaṃcara, m.) — «блуждающий ночью»: naktam (adv. «ночью») + cara (√car- «ходить»). MW: naktaṃcara 'going about at night; a night-wanderer, a rākṣasa'. Это не просто описательный эпитет, но один из ключевых таксономических имён ракшасов в эпосе, наряду с rākṣasa, niśācara, niśāṭa. Ночная природа — онтологическая, а не случайная: ракшасы сильнее ночью (śakti naktaṃcarāṇāṃ), тогда как люди и боги — днём. Выход naktaṃcara в pradoṣa прямо следует из природы данного класса существ.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:naktaMcara", "source_links": [{"label": "MW naktaMcara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=naktaMcara"}], "seq": 15}, {"id": "phase2:5.5.9:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "svavṛttāḥ", "note_ru": "«Тилака» отмечает вариант чтения «svavṛttāḥ» вместо «suvṛttāḥ»: вместо общего «добродетельные» текст в этом случае подчёркивает именно врождённую супружескую верность (sahaja-pātivratya) спящих женщин.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "фиксирует textual variant, меняющий смысловой акцент строки, не отражённый в подстрочнике", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 16}]}, {"verse_id": "5.5.10", "verse": "10", "sanskrit_iast": "mattapramattāni samākulāni । rathāśvabhadrāsanasaṃkulāni । vīraśriyā cāpi samākulāni । dadarśa dhīmān sa kapiḥ kulāni ॥10॥", "leonov_ru": "Увидела та мудрая обезьяна дома Полные хмельными и влюбленными, Наполненные колесницами, конями, золотыми сидениями, Наполненные славой героев.", "commentary": {"tilaka": "ऐश्वर्यादिमत्ताः प्रमत्ता मद्यादिना येषु तानि, अत एव समाकुलानि रक्षसां गृहाणि रथाश्चेति सर्वयानोपलक्षणम् । भद्रासनं स्वर्णपीठम्", "bhusana": "मत्तप्रमत्तानि समाकुलानि रथाश्वभद्रासनसङ्कुलानि ।\n\nवीरश्रिया चापि समाकुलानि ददर्श धीमान् स कपिः कुलानि\nमत्ताः मधुमदक्षीबाः । प्रमत्ताः प्रस्तुतकार्यविस्मारिणः । मत्तप्रमत्तजनयोगात् कुलान्यपि तथोच्यन्ते । कुलानि गृहाणि । समाकुलानि समाकुलजनानि । वीरश्रिया वीरलक्ष्म्या । वीरः इत тина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Обличья разные принимали (rūpāṇi citrāṇi ca vikṣipanti) – в комментарии «Тилака» поясняется: «Чтобы потешить жен».", "service": [], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "термин", "accounted": "не учтено", "text": "Первое появление в кн. V; введено в :", "incomplete": true}], "seq": 18}]}, {"verse_id": "5.5.15", "verse": "15", "sanskrit_iast": "buddhipradhānān rucirābhidhānān । saṃśraddadhānāñ jagataḥ pradhānān । nānāvidhānān rucirābhidhānān । dadarśa tasyāṃ puri yātudhānān ॥15॥", "leonov_ru": "Обладающих превосходным разумом, красноречивых, Твердых в вере, первых в мире, Погруженных в различные занятия, обладающих звучными именами Демонов увидел [Хануман] в том городе.", "commentary": {"tilaka": "बुद्धिः प्रधानं प्रधानगुणो येषाम् रुचिरमभिधानं वचनं येषाम् सम्यक्श्रद्दधानानास्तिकान् रुचिराभिधानान्रुचिरनाम्नः । नानाप्रकारं विधानं वेषादेर्येषां तान्", "bhusana": "बुद्धिप्रधानान् रुचिराभिधानान् संश्रद्धधानान् जगतः प्रधानान् ।\n\nनानाविधानान् रुचिराभिधानन् ददर्श तस्यां पुरि यातुधानान्\nबुद्धिप्रधानान् बुद्थ्या श्रेष्ठान् प्रधानबुद्धीन्वा, उत्तमबुद्धीनित्यर्थः । रुचिराभिधानान् शोभनव्यवहारान् । संश्रद्धधानान् आस्तिकान् । नानाविधानान्नानाकारान् । रुचिराभिधानान् हृद्यनाम्नः", "siromani": "बुद्धीति । बुद्धिप्रधानान् अतिबुद्धिमतः रुचिराभिधानान् शोभनवचनान् संश्रद्दधानान् गुरुवाक्यादौ विश्वासयुक्तान् जगतः इतस्ततो गच्छतः नानाविधान् येषां तान् रुचिराभिधानान् शोभननामयुक्तान् प्रधानान् यातुधानान् तस्यां लङ्कायां ददर्श", "tattvadipika": "रुचिराभिधानात् रुचिरवचनान्, अन्यत्र रुचुरनामधेयान् । नानाविधानान् नानाव्यापारान्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Демонов… красноречивых… с именами звучными (rucirābhidhānān… rucirābhidhānān… yātudhānān) – здесь снова использовано слово yātudhāna, обозначающая ракшасов-жрецов. Слово rucirābhidhāna использовано дважды в разных смыслах: «те, чья речь приятна» и «те, чьи имена приятны».", "service": [], "suggestions": [], "seq": 19}]}, {"verse_id": "5.5.17", "verse": "17", "sanskrit_iast": "tato varārhāḥ suviśuddhabhāvās । teṣāṃ striyas tatra mahānubhāvāḥ । priyeṣu pāneṣu ca saktabhāvā । dadarśa tārā iva susvabhāvāḥ ॥17॥", "leonov_ru": "Тогда прекрасных (достойных лучших украшений), чистых душою, Их женщин там благочестивых, Привязанных душой к любимым и хмельным (возбуждающим) напиткам, Увидел [Хануман], сияющих словно звезды.", "commentary": {"tilaka": "वरार्हाः श्रेष्ठविभूषणादियोग्या उत्तमोत्तमरूपाश्च । भावाः कटाक्षादयः । अनुभावः प्रभावः । भावो ऽन्तःकरणम् । तारास्तारकाः", "bhusana": "ततो वरार्हाः सुविशुद्धभावास्तेषां स्त्रियस्तत्र महानुभावाः ।\n\nप्रियेषु पानेषु च सक्तभावा ददर्श तारा इव सुप्रभावाः\nवराणां श्रेष्ठानाम् अर्हाः वरार्हाः । सुविशुद्धभावाः कान्तेषु निर्मलहृदया । महानुभावाः पातिव्रत्यरूपमहाप्रभावाः । यद्वा महानुभावाः अनुभावाः कटाक्षभुजक्षेपादयः सुप्रभावाः । शोभनवैभवाः", "tattvadipika": "वरार्हाः श्रेष्ठभूषणानुलेपनादियोग्याः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "достойных лучших украшений (varārhāḥ) – букв. «весьма ценных». В «Тилаке» поясняется: «достойных лучших украшений (śreṣṭhavibhūṣaṇādiyogyāḥ)».", "service": [], "suggestions": [], "seq": 20}]}, {"verse_id": "5.5.18", "verse": "18", "sanskrit_iast": "striyo jvalantīs trapayopagūḍhā । niśīthakāle ramaṇopagūḍhāḥ । dadarśa kāś cit pramadopagūḍhā । yathā vihaṃgā vihagopagūḍāḥ ॥18॥", "leonov_ru": "Женщин, ярко сияющих и украшенных (наделенных) стыдливостью, [И других], которых в ночи обнимали возлюбленные, Увидел и некоторых, охваченных страстью, Подобных самкам птиц, которых обняли самцы.", "commentary": {"tilaka": "ज्वलन्ती रूपसंपदा ज्वलन्तीरिव । त्रपा लज्जा । प्रमदेन हर्षेणोपगूढाः संबद्धा यथा विहङ्गाः विहङ्गीरिवेत्यर्थः । इन्द्रनीलमणिमयोर्ध्वगेहेषु नीलतमःसदृशेषु शयनात्तत्सादृश्यम्", "bhusana": "श्रिया ज्वलन्तीस्त्रयोपगूढा निशीथकाले रमणोपगूढाः ।\n\nददर्शकाश्चित्प्रमदोपकूढा यथा विहङ्गाः कुसुमोपगूढाः\nश्रियेति । प्रमदोपगूढाः । विहङ्गाः विहङ्गीः", "siromani": "श्रियेति । श्रिया रूपादिसंपत्त्या ज्वलन्तीः प्रकाशमानाः त्रपया लज्जया उपगूढाः युक्ताः रमणोपगूढाः पत्यालिङ्गिताः अत एव प्रमदोपगूढाः प्रमोदविशिष्टाः काश्चित् स्त्रियः विहगेन पक्षिविशेषेणोपगूढा विहङ्गा इव ददर्श । अत्युन्नतप्रासादेषु शयनादीदृगुपमानोपमेयभावः", "tattvadipika": "प्रमदोपगूढाः हर्षपूर्णाः । विहङ्गाः विहङ्गीरित्यर्थः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "lexical:5.5.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "niśītha", "note_ru": "Нишитха (niśītha, m./n.) — «полночь, глубокая ночь»: специфический термин, означающий именно середину ночи. MW: niśītha 'midnight, the middle of the night'. В отличие от pradoṣa (начало ночи, V.5.8) и niśā (ночь вообще), niśītha — кульминационная точка. В дхармашастрах niśītha — время, когда действие законов приостановлено, а существа лишены защиты ритуала. В kavya niśītha — апогей любовного свидания. Сцена объятий в niśītha в контексте Ланки двусмысленна: Хануман видит не только эротику, но и наиболее уязвимое для разведки время.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:niSITa", "source_links": [{"label": "MW niSITa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=niSITa"}], "seq": 21}, {"id": "phase2:5.5.18:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vihaṃgā vihagopagūḍāḥ", "note_ru": "По «Тилаке», сравнение женщин с самками птиц в объятиях самцов опирается на конкретную архитектурную деталь: птицы гнездятся в верхних покоях, отделанных сапфиром и потому подобных ночному мраку — отсюда и уместность сравнения со спящими в темноте покоев любовниками.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "объясняет механику сравнения через конкретную архитектурную реалию, не считываемую из одного подстрочника", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 22}]}, {"verse_id": "5.5.19", "verse": "19", "sanskrit_iast": "anyāḥ punar harmyatalopaviṣṭās । tatra priyāṅkeṣu sukhopaviṣṭāḥ । bhartuḥ parā dharmaparā niviṣṭā । dadarśa dhīmān madanopaviṣṭāḥ ॥19॥", "leonov_ru": "И других, сидящих на крышах домов Удобно устроившихся в объятиях возлюбленных, Преданных мужу и преданных долгу [перед мужем], Увидел мудрый (Хануман), охваченных любовью.", "commentary": {"tilaka": "भर्तुः परा उत्कृष्टत्वेनाभिमताः । धर्मपरा भर्तृसेवालक्षणधर्मतत्पराः । निविष्टा ऊढाः । \"निवेशः शिबिरोद्वाहविन्यासेषु\" इति कोशः । मदन उपविष्टो यासु मदनाश्रया इत्यर्थः", "bhusana": "अन्याः पुनर्हर्म्यतलोपविष्टास्तत्र प्रियाङ्केषु सुखोपविष्टाः ।\n\nभर्तुः प्रिया धर्मपरा निविष्टा ददर्श धीमान् मदनाभिविष्टाः\nनिविष्टाः ऊढाः पाणिगृहीता इत्यर्थः । \"निवेशः शिबिरोद्वाहविन्यासेषु\" इति विश्वः", "siromani": "अन्या इति । अन्या उक्ताभ्यो भिन्ना हर्म्यतलोपविष्टाः मदनोपविष्टाः कामयुक्ताः अत एव तत्र हर्म्ये प्रियाङ्केषु सुखोपविष्टाः भर्तुः पराः तर्पिकाः तत्र हेतुर्धर्मपरेषु पतिसेवारूपधर्मेषु आनिविष्टाः स्त्रियः धीमान् हनूमान् ददर्श", "tattvadipika": "निविष्टाः ऊढाः, पाणिगृहीता इत्यर्थः । \"निवेशः शिबिरोद्वाहविन्यासेषु\" इत्यमरः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "крышах домов", "kind": "note", "text": "Нужен будет комментарий про индийские крыши"}], "suggestions": [], "seq": 23}, {"id": "lexical:5.5.19:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dharma", "note_ru": "Дхарма (dharma) — dharma — «порядок», «закон», «долг»: в данном контексте сочетает значения космического закона и личного долга. Подстрочник обычно переводит ситуативно («закон», «долг», «добродетель»), скрывая полноту смысла. В «Тилаке» — dharma как один из четырёх puruṣārtha.", "type": "А", "subtype": "base", "trigger": "term", "source": "первое вхождение в кн. V; указатель Гринцера / комментаторы, где процитировано (привязка к стиху, нестрогая)", "source_links": [], "collision_tier1": true, "seq": 24}]}, {"verse_id": "5.5.21", "verse": "21", "sanskrit_iast": "tataḥ priyān prāpya mano'bhirāmān । suprītiyuktāḥ sumano’bhirāmāḥ । gṛheṣu hṛṣṭāḥ paramābhirāmā । haripravīraḥ sa dadarśa rāmāḥ ॥21॥", "leonov_ru": "Тогда обретших [своих] возлюбленных, желанных (соблазнительных), Охваченных радостью, довольных, В домах счастливых, достигших наивысшего наслаждения, Герой среди обезьян увидел прекрасных [женщин].", "commentary": {"siromani": "तत इति । ततो ऽनन्तरं वरार्हाः उत्तमपूजनसामग्रीमतीः सुविशुद्धः भावो ऽन्तःकरणं यासाम् अत एव सुस्वभावाः महानुभावाः अतिप्रभाववतीः प्रियेषु प्रत्युत्पादकेषु पानेषु सक्तः भावो मनो यासां ताः तारा इव तारकासदृशीः तेषां स्त्रियः तत्र लङ्कायां ददर्श\nतत इति । ततो ऽनन्तरं मनोभिरामान् प्रियान् प्राप्य सुप्रीतियुक्ताः अत्यन्तप्रीतिविशिष्टाः सुमनोभिरामाः अत्यन्तमनोभिरामदात्र्यः परमाभिरामाः अतिसुन्दरीः हृष्टाः रामाः गृहेषु ददर्श", "tilaka": "प्रियान्प्राप्य प्रीतियुक्ता आसन् । सुमनोभिः पुष्पैरभिरामाः, अत एव हृष्टाः परमया शोभया ऽभिरामाः स्वस्वकान्तमनोहरा रामा गृहेषु ददर्श । \"प्रसमीक्ष्य रामाः\" इति पाठे प्रियान्प्राप्य तान्समीक्ष्य प्रीतियुक्ता रामस्तैः प्रियै रम्यमाणाः, अत एव गृहेषु हृष्टा रामाः । ददर्शेति शेषः", "bhusana": "ततः प्रियान् प्राप्य मनोभिरामान् सुप्रीतियुक्ताः प्रसमीक्ष्य रामाः ।\n\nगृहेषु हृष्टाः परमाभिरामा हरिप्रवीरः स ददर्श रामाः\nप्रियान्प्राप्य अभिसृत्य सुप्रीतियुक्ताः मनोभिरामाः रामाः प्रसमीक्ष्य गृहेषु रामाश्च ददर्श । अभिसारिकाः कुलपालिकाश्च ददर्शेत्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "своих домах предающихся наслаждениям", "kind": "note", "text": "Это относится к красавицам, но стоит после возлюбленных, поэтому правильное понимание может быть затруднено"}], "suggestions": [], "seq": 25}, {"id": "phase2:5.5.21:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "prasamīkṣya rāmāḥ", "note_ru": "«Тилака» приводит вариант чтения «prasamīkṣya rāmāḥ» («красавицы, глядя [на возлюбленных]») вместо основного, где взгляд принадлежит Хануману; «Бхушана» поясняет, что при этом варианте речь идёт о двух разных группах женщин — тайно спешащих на свидание (abhisārikāḥ) и верных жёнах в своих домах (kulapālikāḥ).", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "контрастная текстологическая развилка меняет субъект взгляда и вводит не считываемое из подстрочника различение двух типов женщин", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true, "seq": 26}]}, {"verse_id": "5.5.22", "verse": "22", "sanskrit_iast": "candraprakāśāś ca hi vaktramālā । vakrāḥ supakṣmāś ca sunetramālāḥ । vibhūṣaṇānāṃ ca dadarśa mālāḥ । śatahradānām iva cārumālāḥ ॥22॥", "leonov_ru": "Гирлянды (множество) лиц, подобных луне, И гирлянды (множество) прекрасных глаз с прекрасными изогнутыми ресницами, И гирлянды (множество) украшений он увидел, Подобных прекрасным гирляндам молний.", "commentary": {"tilaka": "चही पादपूरकौ । वक्रमाला वक्रसमूहाः वक्राः वक्रप्रेक्षणाः । सुपक्ष्माः शोभनपक्ष्मयुक्ता नेत्रमाला ददर्श । शतह्रदानां माला इव भूषणानां माला ददर्श । \"वक्राक्षिपक्ष्मा\" इति पाठे ऽक्षिपदमधिकम् । वक्रपक्ष्मा इत्येवोचितम् । पक्ष्मसु वक्रत्वमपि किमित्यपि चिन्त्यम्", "bhusana": "चन्द्रप्रकाशाश्च हि वक्त्रमाला वक्राक्षिपक्ष्माश्च सुनेत्रमालाः ।\n\nविभूषणानां च ददर्श मालाः शतह्रदानामिव चारुमालाः\nचन्द्रेति । वक्त्रनेत्रदर्शनं मानुषीत्वराक्षसीत्वविवेकार्थम् । आभरणदर्शनं स्वदृष्टसीताभरणतुल्याभरणदर्शनार्थम्", "siromani": "चन्द्रेति । चन्द्रप्रकाशाः चन्द्रसदृशप्रकाशविशिष्टाः वक्त्रमालाः मुखसमूहान् वक्राः कुटिलनिरीक्षणाः सुपक्ष्माः शोभनपक्ष्मविशिष्टाः सुनेत्रमालाश्च शतह्रदानां चारुमाला इव विभूषणानां मालाश्च ददर्श"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "phase2:5.5.22:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vaktramālā… vibhūṣaṇānāṃ mālāḥ", "note_ru": "По «Бхушане», Хануман всматривается в лица и глаза увиденных, чтобы отличить людей от ракшаси (mānuṣītva-rākṣasītva-viveka), а в украшения — чтобы сравнить их с теми, что он видел на самой Сите.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "раскрывает сюжетную функцию перечисления (распознавание облика и поиск примет Ситы), не выраженную в подстрочнике", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 27}]}, {"verse_id": "5.5.23", "verse": "23", "sanskrit_iast": "na tv eva sītāṃ paramābhijātāṃ । pathi sthite rājakule prajātām । latāṃ praphullām iva sādhujātāṃ । dadarśa tanvīṃ manasābhijātām ॥23॥", "leonov_ru": "Но высокородной Ситы, Рожденной в царской семье, стоящей на пути [благочестия], Прекрасной, словно цветущая лиана, Не увидел стройной, умом рожденной.", "commentary": {"tilaka": "विनष्टः शीताम्बुतुषाररूपः शीतलजलबिन्दुसंपर्करूपः पङ्को यस्य तम् । तत्त्वं च वर्षाकालस्यातीतत्वाद्वस्तुतो हिमकाले ऽपि विनष्टः शीतलजलबिन्दुसंपर्करूपः पङ्को यस्य तमित्यर्थः । हिमालयस्यातिदूरत्वादिति भावः । विनष्टेति द्वितीयार्थे प्रथमामङ्गीकृत्येदम् । महाग्रहस्य सूर्यस्य ग्राहेण किरणसङ्क्रमेण विनष्टो विनाशितः पङ्कस्तमो येन सः, अत एव प्रकाशलक्ष्म्याश्रयेण हेतुना निर्मलाङ्को व्यक्तस्फुरल्लाञ्छनो रराज गगनमध्यं प्राप्येति शेषः\nपथि स्थिते धर्ममार्गस्थे । नत्वेव ददर्शेत्यन्वयः । साधुजातामिति लताविशेषणम् । मनसाभिजातां धात्रा मनसा सृष्टाम्", "bhusana": "न त्वेव सीतां परमाभिजातां पथि स्थिते राजकुले प्रजाताम् ।\n\nलतां प्रफुल्लामिव साधुजातां ददर्श तन्वीं मनसा ऽभिजाताम्\nन त्विति । परमाभिजाताम् अत्यन्ताभिरामाम् । साधुजातां सुरूपाम् । मनसा ऽभिजाताम् अयोनिजामित्यर्थः", "tattvadipika": "न त्विति । साधुजातामित्येतल्लताविशेषणम् । परमाभिजाताम् अत्यन्ताभिरूपां मनसाभिजाताम् अयोनिजान्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.23:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Уморожденной (manasābhijātām) – видимо, намек на то, что у Ситы не было человеческой матери. В «Тилаке» также поясняется: «Ту, которую Создатель сотворил умом» (dhātrā manasā sṛṣṭām).", "service": [], "suggestions": [], "seq": 28}]}, {"verse_id": "5.5.24", "verse": "24", "sanskrit_iast": "sanātane vartmani saṃniviṣṭāṃ । rāmekṣaṇīṃ tāṃ madanābhiviṣṭām । bhartur manaḥ śrīmad anupraviṣṭāṃ । strībhyaḥ parābhyaś ca sadā viśiṣṭām ॥24॥", "leonov_ru": "Пребывающую на неизменном (вечном) пути [преданности мужу], Смотрящую [только] на Раму, охваченную любовью, Вошедшую в благородную душу [своего] мужа, И всегда превосходящую [даже] лучших женщин.", "commentary": {"tilaka": "सनातने वर्त्मन्यविच्छेदप्रवृत्ते पातिव्रत्यमार्गे । राममीक्षते ध्यायति रामेक्षणी ताम् मदनेन रामविषयेणाभिविष्टां व्याप्ताम् श्रीमद्भर्तुर्मनो ऽनुप्रविष्टाम् । अनेन परस्परानुरागो ध्वनितः", "bhusana": "सनातने वर्त्मनि सन्निविष्टां रामेक्षणान्तां मदनाभिविष्टाम् ।\n\nभर्तुर्मनः श्रीमदनुप्रविष्टां स्त्रीभ्यो वराभ्यश्च सदा विशिष्टाम्\nसनातन इति । सानातने अविच्छिन्ने वर्त्मनि पातिव्रत्यधर्मे । रामेक्षणे अन्तो निश्चयो यस्यास्ताम् । श्रीमत् सीताचिन्तनश्रीमत् । विशिष्टाम् उत्कृष्टाम्", "tattvadipika": "सनातने वर्त्मनि अविच्छेदेन प्रवृत्ते पातिव्रत्यरूपमार्गे । सन्निविष्टां सम्यङ्निष्ठिताम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.24:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Что не сходит с пути верности мужу (sanātane vartmani saṃniviṣṭām) – букв. «придерживающуся вечного пути». Комментаторы поясняют, что имеется ввиду «путь верности мужу».", "service": [], "suggestions": [], "seq": 29}]}, {"verse_id": "5.5.25", "verse": "25", "sanskrit_iast": "uṣṇārditāṃ sānusṛtāsrakaṇṭhīṃ । purā varārhottamaniṣkakaṇṭhīm । sujātapakṣmām abhiraktakaṇṭhīṃ । vane pravṛttām iva nīlakaṇṭhīm ॥25॥", "leonov_ru": "Измученную страданиями разлуки, ту, чье горло заполнено потоком слез, Прежде носившую на шее драгоценное ожерелье, Имеющую прекрасные ресницы и сладостный голос, Подобную самке павлина, блуждающей по лесу.", "commentary": {"tilaka": "उष्णार्दितां व онанс: (1) буквально — самка павлина (павлин = nīlakaṇṭha «синегорлый», ибо горло самца синее); (2) имплицитный отзвук эпитета Шивы Nīlakaṇṭha — «синегорлого», проглотившего яд kālakūṭa при пахтании океана. Сита, бредущая в лесном одиночестве подобно павлице-nīlakaṇṭhī, тем самым незримо уравнивается с тем, кто поглощает мировой яд ради спасения мира.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:nIlakaNWa", "source_links": [{"label": "MW nIlakaNWa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=nIlakaNWa"}], "collision_tier1": true, "seq": 31}]}, {"verse_id": "5.5.26", "verse": "26", "sanskrit_iast": "avyaktarekhām iva candralekhāṃ । pāṃsupradigdhām iva hemarekhām । kṣataprarūḍhām iva varṇarekhāṃ । vāyuprabhinnām iva megharekhām ॥26॥", "leonov_ru": "Подобную неясному сиянию серпа луны, Подобную полоске золота, запорошенной пылью, Подобную рожденной раной отметине от стрелы, Подобную гряде облаков, прорванной ветром.", "commentary": {"tilaka": "अव्यक्ताभ्रादिना ऽस्पष्टा रेखा रेखाकारो यस्यास्ताम् प्रदिग्धां रूषिताम् क्षतप्ररूढां क्षतेन प्ररूढामुत्पन्नां वर्णरेखां बाणव्रणचिह्नं तद्वद्रामस्येदानीं रावणस्य वा", "bhusana": "अव्यक्तरेखामिव चन्द्ररेखां पांसुप्रदिग्धामिव हेमरेखाम् ।\n\nक्षतप्रूढामिव बाणरेखां वायुप्रभिन्नामिव मेघरेखाम्\nअव्यक्तेति । अव्यक्तरेखाम् अव्यक्तस्वरूपां चन्द्ररेखां चन्द्रकलामिव स्थिताम् । अत्यन्तकृशत्वे कान्तिहीनत्वे च दृष्टान्तो ऽयम् । पांसुप्रदिग्धां पांसुकलुषितां हेमरेखां कनकशलाकामिव स्थिताम् । स्वतः शुद्धस्वभावस्य आगन्तुकमालिन्ये दृष्टान्तोयम् । क्षतप्ररूढां क्षतेन प्ररूढाम् औषधादिना समाहिताम् । अन्तःशल्यदोषवतीं बहिस्समाहिताम् । बाणरेखां बाणक्षतिमिव स्थिताम् । अन्तर्वेदनातिशये दृष्टान्तो ऽयम् । वायुप्रभिन्नामिव मेघरेखाम्, पुनरसमाधेयशैथिल्ये दृ़ष्टन्तो ऽयम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-5", "notes": [{"id": "tier1:5.5.26:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Отметине от зажившей раны (varṇarekhām) – в «Тилаке» этот композит поясняется как «отметина, оставшаяся от раны, нанесенной стрелой» (bāṇavraṇacihnam).", "service": [], "suggestions": [], "seq": 32}, {"id": "lexical:5.5.26:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "candralekhā", "note_ru": "Чандралекха (candra-lekhā, f.) — «черта / серп луны»: candra «луна» + lekhā «линия, черта, тонкий рисунок». MW: candralekhā 'a streak of the moon, the crescent'. Candralekhā — не полная луна (pūrṇacandra), а именно тончайший серп, едва видимый — образ чего-то почти стёртого, но ещё существующего. В шлоке V.5.26 Сита сравнивается с avyakta-rekhā candralekhā («неясной чертой лунного серпа») — то есть красота её существует, но предельно истончена страданием. Сравнение работает только через специфическую астрономическую точность термина.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:candralekA", "source_links": [{"label": "MW candralekA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=candralekA"}], "collision_tier1": true, "seq": 33}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 61, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 27, "verses_with_notes": 17, "notes_by_layer": {"tier1": 14, "lexical": 8, "phase2": 0, "edition": 2, "crosstext": 2}}, "sarga": 61, "verses": [{"verse_id": "5.61.2", "verse": "2", "sanskrit_iast": "prītimantas tataḥ sarve vāyuputrapuraḥsarāḥ । mahendrāgrāt samutpatya pupluvuḥ plavagarṣabhāḥ ॥2॥", "leonov_ru": "И вот все быки среди обезьян, следуя за сыном ветра (Хануманом) Покинув гору Махендру, отправились прыжками [в Кишкиндху].", "commentary": {"bhusana": "प्रीतिमन्तस्ततः सर्वे वायुपुत्रपुरस्सराः ।\n\nमहेन्द्राद्रिं परित्यज्य पुप्लुवुः प्लवगर्षभाः\nप्रीतिमन्त इत्यादि ।। 5.61.2,3 ।।\n\nसभाज्यमानं भूतैस्तमात्मवन्तं महाबलम् ।\n\nहनूमन्तं महावेगं वहन्त इव दृष्टिभिः\nसभाज्यमानं संपूज्यमानम् । वहन्त इव दृष्टिभिरिति । प्रीतिपूर्वकानिमिषदर्शनाद्दृष्टिष्वारोप्य नयन्त इवेत्युत्प्रेक्षा"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «āgrāt» опущено"}, {"id": "tier1:5.61.2:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Полетели» нужен будет комм[Е. Костина] «ivā» опущено"}, {"id": "lexical:5.61.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vāyuputra", "note_ru": "Вайюпутра (vāyu-putra, m.) — тат-пуруша: vāyu «ветер» (ведийское божество, MW: 'the god of wind') + putra «сын». Эпитет Ханумана как сына Вайю. Отличается от синонима anilātmaja (анилātmaja: anila «ветер» + ātmaja «рождённый из сути»): vāyu-putra подчёркивает теологическое сыновство — рождение от бога в его личном аспекте, тогда как anilātmaja акцентирует субстанциальное единство с ветром как стихией. MW: vāyuputra 'son of the wind, ep. of Hanumant'. Выбор эпитета в данном контексте (войско летит по воздуху) создаёт тематическое удвоение: Ханuman буквально «возглавляет» полёт как сын воздушной стихии.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:vAyuputra", "collision_tier1": true}]}, {"verse_id": "5.61.3", "verse": "3", "sanskrit_iast": "merumandarasaṃkāśā mattā iva mahāgajāḥ । chādayanta ivākāśaṃ mahākāyā mahābalāḥ ॥3॥", "leonov_ru": "Подобные Меру и Мандаре, подобные огромным взбешенным слонам, Могучие, с великими телами, они словно бы застилали собой небо.", "commentary": {"bhusana": "मेरुमन्दरसङ्काशा मत्ता इव महागजाः ।\n\nछादयन्त इवाकाशं महाकाया महाबलाः"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}]}, {"verse_id": "5.61.4", "verse": 4, "sanskrit_iast": "", "leonov_ru": "", "commentary": {}, "has_tier1": true, "notes": [{"id": "tier1:5.61.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Словно несли его взглядами (vahanta iva dṛṣṭibhiḥ) - то есть смотрели не отрываясь на летящего впереди Ханумана.Чтимого небожителями (sabhājyamānaṃ bhūtais tam) - букв. “почитаемого существами”. Средневековые комментаторы поясняют, что имеются в виду совершенные существа."}], "verse_not_segmented": true}, {"verse_id": "5.61.5", "verse": "5", "sanskrit_iast": "rāghave cārthanirvṛttiṃ kartuṃ ca paramaṃ yaśaḥ । samādhāya samṛddhārthāḥ karmasiddhibhir unnatāḥ ॥5॥", "leonov_ru": "Сосредоточившись на том, чтобы исполнить намерения Рагхавы и добыть высшую славу, Исполнившие свою задачу, воспрянувшие [духом] благодаря успеху своего дела,", "commentary": {"bhusana": "राघवे चार्थनिर्वृत्तिं कर्तुं च परमं यशः ।\n\nसमाधाय समृद्धार्थाः कर्मसिद्धिभिरुन्नताः\nअर्थनिर्वृत्तिम् अर्थसिद्धिम् । समाधाय निश्चित्य सङ्कल्प्य वा । समृद्धार्थाः सिद्धकार्याः । कर्मसिद्धिभिः कार्यसिद्धिभिः उन्नताः इतरेभ्य उत्कृष्टाः"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И снова воспрянув духом (karmasiddhibhir unnatāḥ) - букв. “те, [чей дух] воспрял благодаря успеху дел”. Комментаторы отмечают, что под “делами” здесь подразумеваются встреча Ханумана с Ситой, сожжение им Ланки и т.п."}, {"id": "lexical:5.61.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "arthanirvṛtti", "note_ru": "Артханирврити (artha-nirvṛtti, f.) — тат-пуруша: artha «цель, дело, смысл» + nirvṛtti (ni+√vṛt-, «вращаться, возвращаться к исходному состоянию»; MW: nirvṛtti 'cessation, completion, accomplishment'). Техническое значение в контексте посольства (dūtya): nirvṛtti означает не просто «успех», но достижение состояния завершённости — когда дело вернулось к исходной точке равновесия (ni- = «вниз, к основанию»). Сочетание artha+nirvṛtti отличается от artha-siddhi (v. 5 то же строфа): siddhi — «успех как достижение», nirvṛtti — «успех как восстановление порядка». Двойное обозначение в одном полустишии — нарочитая риторическая амплификация результата миссии.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:nirvRtti+dic_mw:artha", "collision_tier1": true}]}, {"verse_id": "5.61.6", "verse": "6", "sanskrit_iast": "priyākhyānonmukhāḥ sarve sarve yuddhābhinandinaḥ । sarve rāmapratīkāre niścitārthā manasvinaḥ ॥6॥", "leonov_ru": "Все готовые поведать радостную весть, все рвущиеся в битву, Все полные решимости помочь Раме, бодрые (радостные),", "commentary": {"bhusana": "प्रियाख्यानोन्मुखाः सर्वे सर्वे युद्धाभिनन्दिनः ।\n\nसर्वे रामप्रतीकारे निश्चितार्था मनस्विनः", "siromani": "प्रियेति । सर्वे प्रियाख्याने उन्मुखाः समुत्सुकाः बभूवुः । सर्वे रामप्रतीकारे रामार्थं रावणनिग्रहे निश्चितार्था अत एव सर्वे युद्धाभिनन्दिनश्च बभूवुरिति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Исполненные решимости / Быть Раме надежным подспорьем (sarve rāmapratīkāre niścitārthā manasvinaḥ) - комментаторы поясняют слово rāmapratīkāre niścitārthāḥ как “готовые помочь Раме в борьбе с Раваной”."}, {"id": "lexical:5.61.6:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "priyākhyāna", "note_ru": "Приякхьяна (priya-ākhyāna, n.) — тат-пуруша: priya «приятное, радостное» + ākhyāna «рассказ, весть» (ā+√khyā-, «видеть, объявлять», MW: ākhyāna 'tale, legend, narrative'). Устойчивый жанровый термин эпоса: ākhyāna — нарратив-весть, первоначально «то, что было рассказано» (связан с akhyāti «известность»). Priyākhyāna — «вестник радостного» как социальная роль: в эпическом этикете принёсший хорошую весть получает щедрое вознаграждение (MW: 'bearer of glad tidings'). Здесь все вояки ориентированы лицом к объявлению (unmukhāḥ), что воспроизводит дворцовый ритуал: войско возвращается с вестью — жест ожидания аудиенции и награды.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:AKyAna+dic_mw:priyAKyAna", "collision_tier1": true}]}, {"verse_id": "5.61.8", "verse": "8", "sanskrit_iast": "yat tan madhuvanaṃ nāma sugrīvasyābhirakṣitam । adhṛṣyaṃ sarvabhūtānāṃ sarvabhūtamanoharam ॥8॥", "leonov_ru": "Который назывался Мадхувана (Медовый лес), находился под защитой Сугривы, Был недоступен для всех живых существ, пленял все живые существа,", "commentary": {"bhusana": "यत्तन्मधुवनं नाम सुग्रीवस्याभिरक्षितम् ।\n\nअधृष्यं सर्वभूतानां सर्वभूतमनोहरम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Медовой она называлась (yat tan madhuvanaṃ nāma) - на санскрите Мадхувана, “Медовая роща”.[Е. Костина] «Для всех была недоступной.» непонятно. если она недоступна, как они туда попали?"}, {"id": "crosstext:5.61.8:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "sarva-bhūta-manohara", "note_ru": "madhuvanam … sarvabhūtamanoharam («Медовый лес … пленяющий все живые существа»), заповедный сад Сугривы. Формула manohara/sarvabhūtamanohara для «радующей всякое существо» рощи — общее место эпического описания idyllic vana; ср. махабхаратовский «лучший из лесов, радующий душу любого существа (sarvabhūtamanorame), полный … деревьев … усыпанных цветами» (MBh III.146.1–2), где отдыхают Пандавы. Параллель показывает типовой топос «волшебного сада», разделяемый обеими поэмами.", "type": "А", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.61.8", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparvan III.146.1-2", "collision_tier1": true}]}, {"verse_id": "5.61.9", "verse": "9", "sanskrit_iast": "yad rakṣati mahāvīraḥ sadā dadhimukhaḥ kapiḥ । mātulaḥ kapimukhyasya sugrīvasya mahātmanaḥ ॥9॥", "leonov_ru": "Который защищал всегда великий герой, обезьяна Дадхимукха, Дядя великого духом царя обезьян Сугривы.", "commentary": {"bhusana": "यद्रक्षति महावीर्यः सदा दधिमुखः कपिः ।\n\nमातुलः कपिमुख्यस्य सुग्रीवस्य महात्मनः", "siromani": "यदिति । अभिरक्षितं सर्वतो रक्षायुक्तम् अत एव सर्वभूतानामधृष्यं यत् दधिमुखो नाम सुग्रीवस्य मातुलः रक्षति रक्षयति यच्च सुग्रीवस्य मनःकान्तं महावनम् अनेकवनिकाविशिष्टं मधुवनं नाम वनं तत् उपागम्य प्राप्य ते वानराः परमोत्कटा तत्रत्यमधुपानेनातिमत्ताः बभुवुः । श्लोकत्रयमेकान्वयि ।। 5.61.810 .।\n\nमधुपानप्रकारमाह-- तत इति । मधुपिङ्गलाः मधुवत् पिङ्गलवर्णाः ते वानराः मधुवनं दृष्ट्वा कुमारं तद्रक्षकं मधून्ययाचन्त"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Дядя великого духом / Царя обезьян Сугривы (mātulaḥ kapimukhyasya sugrīvasya mahātmanaḥ) - в оригинале использовано слово mātula “дядя со стороны матери”. Дадхимукха - букв. “с лицом [цвета] свернувшегося молока”."}, {"id": "lexical:5.61.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dadhimukha", "note_ru": "Дадхимукха (dadhimukha) — обезьяна-страж медового сада Сугривы (dadhimukha «творожноликий», вар. dadhivaktra), дядя (mātula) Ангады; жалуется Сугриве на разорение сада вернувшимися ванарами — комический эпизод, косвенно сообщающий об успехе миссии. Первое появление персонажа.", "type": "В", "subtype": "base", "trigger": "realia", "source": "gazetteer (analysis §09б / formulas tt.1-2) — first occurrence in кн. V (verse-level, soft)", "collision_tier1": true}]}, {"verse_id": "5.61.12", "verse": "12", "sanskrit_iast": "tataḥ kumāras tān vṛddhāñ jāmbavatpramukhān kapīn । anumānya dadau teṣāṃ nisargaṃ madhubhakṣaṇe ॥12॥", "leonov_ru": "Тогда царевич (Ангада) с позволения старших обезьян во главе с Джамбаваном (или почтив старших обезьян во главе с Джамбаваном), Дал им разрешение отведать меду.", "commentary": {"bhusana": "ततः कुमारस्तान् वृद्धाञ्जाम्बवत्प्रमुखान् कपीन् ।\n\nअनुमान्य ददौ तेषां निसर्गं मधुभक्षणे\nअनुमान्य अनुमतिं कारयित्वा । निसर्गं विसर्जनम्, अनुमतिमिति यावत्", "siromani": "तत इति । कुमारः जाम्बवत्प्रमुखान् अनुमान्य सत्कृत्य निसर्गं स्वभावसिद्धं मधु पुष्पविशेषरसं तेषां भक्षणे भक्षणार्थं ददौ"}, "has_tier1": false, "notes": [{"id": "lexical:5.61.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nisarga", "note_ru": "Нисарга (nisarga, m.) — «дозволение, дар, естественный порядок», от ni+√sṛj- («выпускать, отпускать»). MW: nisarga 'giving away, abandonment; natural state or condition; nature, instinct'. Термин несёт два смысловых слоя: (1) юридический — nisarga как «разрешение», официальное освобождение от ограничений (ср. dharmaśāstric «nisarga права»); (2) природный — «то, что отпущено на свободу, естественное состояние». В строфе кумар «даровал им nisargam в поедании мёда» — то есть одновременно дал разрешение И вернул в естественное состояние обезьян. Двусмысленность намеренна: обезьяны послушно ждали nisarga, но nisarga же оправдывает их последующую безудержность.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:nisarga"}]}, {"verse_id": "5.61.13", "verse": "13", "sanskrit_iast": "te niḥsṛṣṭāḥ kumāreṇa dhīmatā valisūnunā । harayaḥ samapadyanta drumān madhukarākulān ॥13॥", "leonov_ru": "Получив позволение царевича, мудрого сына Валина, Обезьяны бросились к деревьям, возле которых вились пчелы.", "commentary": {"siromani": "ते इति । कुमारेण वालिसूनुना ऽङ्गदेन च निसृष्टाः प्रेरिताः ते हरयः मधुकरैः आकुलान् व्याप्तान् द्रुमान् समपद्यन्त प्राप्नुवन्"}, "has_tier1": false, "notes": [{"id": "lexical:5.61.13:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "valisūnu", "note_ru": "Валисуну (vali-sūnu, m.) — тат-пуруша: Vālin (имя царя обезьян, убитого Рамой) + sūnu «сын» (от √sū-, «рождать», MW: sūnu 'son, child'). Патронимический эпитет Ангады. Sūnu архаичнее и торжественнее, чем putra или ātmaja: характерен для эпических патронимиков героев (ср. Pāṇḍusūnu = сыновья Панду). Особая коннотация: Vālin — убитый отец, жертва союзника Ангады (Рамы). Эпитет vali-sūnu в сцене, где Ангада командует войском и вершит решения, несёт тихий трагический подтекст: сын убитого царя выступает доверенным лицом убийцы своего отца.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:sUnu"}, {"id": "edition:5.61.13:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.61.13–14 (2 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.61.13–14", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.61.13", "iast": "te niḥsṛṣṭāḥ kumāreṇa dhīmatā valisūnunā । harayaḥ samapadyanta drumān madhukarākulān ॥13॥"}, {"verse_id": "5.61.14", "iast": "bhakṣyantaḥ sugandhīni mulāni ca phalāni ca । jagmuḥ praharṣaṃ te sarve babhuvuś ca madotkaṭāḥ ॥14॥"}]}]}, {"verse_id": "5.61.14", "verse": "14", "sanskrit_iast": "bhakṣyantaḥ sugandhīni mulāni ca phalāni ca । jagmuḥ praharṣaṃ te sarve babhuvuś ca madotkaṭāḥ ॥14॥", "leonov_ru": "Поедая ароматные коренья и плоды Обрадовались они все и захмелели.", "commentary": {"bhusana": "ततश्चानुमताः सर्वे सम्प्रहृष्टा वनौकसः ।\n\nमुदिताः प्रेरिताश्चापि प्रनृत्यन्तो ऽभवंस्ततः\nततश्चेति । पूर्वमेव सीतादर्शनात् प्रहृष्टाः ततः मधुवनभङ्गे अङ्गदेनानुमतास्सन्तस्ततो मुदिताः तत्प्रेरिताः प्रनृत्यन्तो ऽभवन्", "siromani": "भक्षयन्त इति । मूलानि फलानि च भक्षयन्तो वानराः प्रहर्षं जग्मुः मदोत्कटाः बभूवुश्च"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Благоуханных плодов / И кореньев отведав (bhakṣyantaḥ sugandhīni mulāni ca phalāni ca) - во многих рукописях вместо mulāni ca phalāni ca (коренья и плоды) стоит более логичный вариант madhūni ca phalāni ca (меды и плоды)."}]}, {"verse_id": "5.61.16", "verse": "16", "sanskrit_iast": "gāyanti ke cit prahasanti ke cin । nṛtyanti ke cit praṇamanti ke cit । patanti ke cid pracaranti ke cit । plavanti ke cit pralapanti ke cit ॥16॥", "leonov_ru": "Пели одни, смеялись другие, Одни танцевали, другие кланялись, Падали одни, прогуливались другие, Прыгали одни, другие болтали бессвязно.", "commentary": {"bhusana": "गायन्ति केचित् प्रणमन्ति केचिन्नृत्यन्ति केचित् प्रहसन्ति केचित् ।\n\nपतन्ति केचिद्विचरन्ति केचित् प्लवन्ति केचित् प्रलपन्ति केचित्"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…простирались другие (praṇamanti ke cit) - перед Ангадой в знак признательности за позволение попробовать меда (по комментарию “Амритакатака”)."}]}, {"verse_id": "5.61.17", "verse": "17", "sanskrit_iast": "parasparaṃ ke cid upāśrayanti । parasparaṃ ke cid atibruvanti । drumād drumaṃ ke cid abhidravanti । kṣitau nagāgrān nipatanti ke cit ॥17॥", "leonov_ru": "Одни наваливались друг на друга, Другие ругали (оскорбляли) друг друга, Иные бегали с дерева на дерево, Другие прыгали на землю с верхушек деревьев.", "commentary": {"bhusana": "परस्परं केचिदुपाश्रयन्ते परस्परं केचिदुपाक्रमन्ते ।\n\nपरस्परं केचिदुपब्रुवन्ते परस्परं केचिदुपारमन्ते\nद्रुमाद् द्रुमं केचिदभिद्रवन्ते क्षितौ नगाग्रान्निपतन्ति केचित् ।\n\nमहीतलात् केचिदुदीर्णवेगा महाद्रुमाग्राण्यभिसम्पतन्ति", "siromani": "परस्परमिति । अतिब्रुवन्ति विवादं कुर्वन्ति"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Другие же завели перебранки (ke cid atibruvanti) - переведено в соответствии с комментарием “Тилака”, автор которого глоссирует слово atibruvanti как vivādaṃ kurvanti (заводили ссоры)."}]}, {"verse_id": "5.61.18", "verse": "18", "sanskrit_iast": "mahītalāt ke cid udīrṇavegā । mahādrumāgrāṇy abhisampatanti । gāyantam anyaḥ prahasann upaiti । hasantam anyaḥ prarudann upaiti ॥18॥", "leonov_ru": "Иные, чья скорость возросла (с огромной скоростью) с земли Запрыгивали на верхушки высоких деревьев. К поющим подходили другие со смехом, К смеющимся подходили другие с плачем.", "commentary": {"bhusana": "गायन्तमन्यः प्रहसन्नुपैति हसन्तमन्यः प्ररुदन्नुपैति ।\n\nरुदन्तमन्यः प्रणुदन्नुपैति नुदन्तमन्यः प्रणदन्नुपैति", "siromani": "महीतलादिति । उदीर्णवेगाः अतिवेगवन्तः केचित् महीतलात् महाद्रुमाग्राणि अभिसंपतन्ति"}, "has_tier1": false, "notes": [{"id": "crosstext:5.61.18:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "netṛ", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.61.18", "work_label": "Rām", "verse_address": "Rām 5.62.32 (крит. изд.)", "parallel_sa_iast": "jāmbavān yatra netā syād aṅgadaśca baleśvaraḥ |hanūmāṁścāpyadhiṣṭhātā na tasya gatir anyathā ||", "sundara_sa_iast": "jāmbavān yatra netā syād aṅgadasya baleśvaraḥ |hanūmāṁścāpyadhiṣṭhātā na tasya gatir anyathā ||", "quality": "PARTLY", "source": "DCS parallel-search (PARTLY); Rām 5.62.32 (крит. изд.)", "edition_flag": "critical", "shloka_critical": "V.61.18", "verse_address_vulgate": ""}]}, {"verse_id": "5.61.19", "verse": "19", "sanskrit_iast": "tudantam anyaḥ praṇadann upaiti । samākulaṃ tat kapisainyam āsīt । na cātra kaś cin na babhūva matto । na cātra kaś cin na babhūva tṛptaḥ ॥19॥", "leonov_ru": "К дерущимся походили другие с криком. Взволновано было обезьянье войско, Не было здесь никого, кто остался бы трезвым, Не было здесь никого, кто бы ни насытился.", "commentary": {"bhusana": "समाकुलं तत्कपिसैन्यमासीन्मधुप्रपानोत्कटसत्त्वचेष्टम् ।\n\nन चात्र कश्चिन्न बभूव मत्तो न चात्र कश्चिन्न बभूव तृप्तः\nततो वनं तत्परिभक्ष्यमाणं द्रुमांश्च विध्वंसितपत्रपुष्पान् ।\n\nसमीक्ष्य कोपदृधिवक्रनामा निवारयामास कपिः कपींस्तान्", "siromani": "तुदन्तमिति । तुदन्तं व्यथयन्तमन्यः प्रणदन् अतिनादं कुर्वन्नुपैति प्राप्नोति अतः तत् कपिसैन्यं समाकुलं तुमुलमासीत् । तत्र हेतुः-- यो मत्तो न बभूव सो ऽत्र कश्चिन्न अत एव यो दृप्तो न बभूव सो ऽप्यत्र न बभूव"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Не было никого, кто бы не был пьяным (na cātra kaś cin na babhūva dṛptaḥ) - в рукописях встречается вариант tṛptaḥ вместо dṛptaḥ “Здесь не было никого, кто бы не насытился”."}, {"id": "edition:5.61.19:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.61.19 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.61.19", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.61.19", "iast": "tudantam anyaḥ praṇadann upaiti । samākulaṃ tat kapisainyam āsīt । na cātra kaś cin na babhūva matto । na cātra kaś cin na babhūva tṛptaḥ ॥19॥"}], "collision_tier1": true}]}, {"verse_id": "5.61.20", "verse": "20", "sanskrit_iast": "tato vanaṃ tat paribhakṣyamāṇaṃ । drumāṃś ca vidhvaṃsitapatrapuṣpān । samīkṣya kopād dadhivaktranāmā । nivārayām āsa kapiḥ kapīṃs tān ॥20॥", "leonov_ru": "И вот тот лес разоряемый, Где с деревьев были листья и цветы оборваны, Увидев, в гневе обезьяна по имени Дадхивактра (Дадхимукха), Остановил тех обезьян.", "commentary": {"siromani": "तत इति । परिभक्ष्यमाणं वनं विध्वंसितपत्रपुष्पान् द्रुमांश्च समीक्ष्य दधिवक्रनामा कपिः तान् विध्वंसनादिकर्तृ़न् निवारयामास"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "…Дадхивактра (dadhivaktra) - другой вариант имени Дадхимукхи (с тем же значением). Голдмены используют в переводе в обоих случаях вариант “Дадхимукха”, чтобы избежать путаницы (см.: Goldman 1984: 280 – 283).[Е. Костина] «kopād» опущено"}, {"id": "lexical:5.61.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dadhivaktra", "note_ru": "Дадхивактра (dadhi-vaktra, m.) — бахуврихи: dadhi «простокваша, створоженное молоко» + vaktra «лицо, рот» (√vac-, «говорить»). Вариантный эпитет стража леса, которого в гл. 9 этой же главы называют Дадхимукха (dadhi-mukha, то же значение: mukha = «лицо, рот»). MW: dadhi 'coagulated milk, curd'. Зоонимическая логика: морда или мордочка светло-жёлтого, «молочного» цвета — обычная черта окраски некоторых обезьян (Semnopithecus). Чередование mukha/vaktra — стилистический вариант, оба слова взаимозаменяемы в эпосе. Примечательно, что vaktra появляется именно в сцене конфликта (v. 20): vaktra как «рот» несёт дополнительную коннотацию «говорящего» — страж пытается увещевать словами.", "type": "В", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:dadhi+dic_mw:vaktra", "collision_tier1": true}]}, {"verse_id": "5.61.21", "verse": "21", "sanskrit_iast": "sa taiḥ pravṛddhaiḥ paribhartsyamāno । vanasya goptā harivṛddhavīraḥ । cakāra bhūyo matim ugratejā । vanasya rakṣāṃ prati vānarebhyaḥ ॥21॥", "leonov_ru": "Хотя могучие [обезьяны] ему грозили, Хранитель леса, великий (старый) герой между обезьянами, Решил тогда, наделенный грозной мощью, Защитить лес от обезьян.", "commentary": {"bhusana": "स तैः प्रवृद्धैः परिभर्त्स्यमानो वनस्य गोप्ता हरिवीरवृद्धः ।\n\nचकार भूयो मतिमुग्रतेजा वनस्य रक्षां प्रति वानरेभ्यः", "siromani": "स इति । प्रवृद्धैः तैर्वानरैः परिभर्त्स्यमानो वनस्य गोप्ता स दधिवक्रनामा वानरेभ्यो वनस्य रक्षां प्रति भूयो मतिं चकार"}, "has_tier1": true, "notes": [{"id": "tier1:5.61.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…обезьян могучих (taiḥ pravṛddhaiḥ) - автор комментария “Тилака” глоссирует pravṛddhamadaiḥ (очень пьяных)."}]}, {"verse_id": "5.61.23", "verse": "23", "sanskrit_iast": "sa tair madād aprativāryavegair । balāc ca tenāprativāryamāṇaiḥ । pradharṣane tyaktabhayaiḥ sametya । prakṛṣyate cāpy anavekṣya doṣam ॥23॥", "leonov_ru": "От хмеля неукротимыми стали [те обезьяны], Хотя он и пытался смирить их силой. Отбросив страх (бесстрашно) они на него напали, И потащили его, не видя в том дурного.", "commentary": {"bhusana": "स तैर्मदात् सम्परिवार्य वाक्यैर्बलाच्च तेन प्रतिवार्यमाणैः ।\n\nप्रधर्षितस्त्यक्तभयैः समेत्य प्रकृष्यते चाप्यनवेक्ष्य दोषम्", "siromani": "स इति । अप्रतिवार्याः वेगाः येषां तैः अत एव तेन रक्षकेण अप्रतिवार्यमाणैः त्यक्तभयैः तैर्वानरैः उद्धर्षणे रक्षकपराभवे दोषं राजदण्डमनवेक्ष्य अपरिगणय्य समेत्य एकीभूय स रक्षकः बलात् प्रकृष्यते पुच्छादिग्रहणेन इतस्ततो नीयते"}, "has_tier1": false, "notes": [{"id": "lexical:5.61.23:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pradharṣaṇa", "note_ru": "Прадхаршана (pra-dharṣaṇa, n.) — от pra+√dhṛṣ- («дерзать, нападать, преодолевать страх», Whitney #182 дерив.): «нападение, насилие, дерзкое попрание». MW: dharṣaṇa 'overcoming, overpowering; violation, assault'. Юридико-дхармический термин: dharṣaṇa / pradharṣaṇa — специальное слово для нарушения табу и неприкосновенности чужого (ср. strī-dharṣaṇa — «насилие над женщиной» как тяжкое преступление в МС). Здесь применено к охраняемому лесу Сугривы: обезьяны совершают pradharṣaṇa заповедного пространства с полным игнорированием последствий (tyakta-bhayāḥ, «отбросив страх»). Перенос юридического термина насилия на «разграбление леса» создаёт ироническое преувеличение.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:pra-DarzaNa"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};

    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

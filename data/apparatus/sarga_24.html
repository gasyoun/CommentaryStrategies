 "Раскрывает, что «ненавистные миру слова» ракшаси Тилака читает как прямое подстрекательство к измене мужу, а не общую брань — подстрочник даёт только нейтральное «ненавистные».", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 6}]}, {"verse_id": "5.24.8", "verse": "8", "sanskrit_iast": "na mānuṣī rākṣasasya bhāryā bhavitum arhati । kāmaṃ khādata māṃ sarvā na kariṣyāmi vo vacaḥ ॥8॥", "leonov_ru": "Не должна женщина становиться женою ракшаса. Съешьте меня, если хотите, все, не последую вашим словам.", "commentary": {"tilaka": "मानुषो मनुष्यज्ञात्युचितो विधिरनुष्ठानं ते त्वया कृतम् । एतावदेवालमित्यर्थः", "bhusana": "न मानुषी राक्षसस्य भार्या भवितुमर्हति ।\n\nकामं खादत मां सर्वा न करिष्यामि वो वचः", "siromani": "नेति । हे भार्याः हे रावणपत्न्यः मानुषी मनुष्यस्त्री राक्षसस्य पुरे भवितुं नार्हति अतः वो वचः न करिष्यामि अतः सर्वाः यूयं मां खादत"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [], "suggestions": [{"author": "Claude.AI", "strength": "не обязательно", "kind": "кат.8 — поэтика", "accounted": "", "text": "Формульный повтор — ср. V.25.3.", "incomplete": false}], "seq": 7}]}, {"verse_id": "5.24.9", "verse": "9", "sanskrit_iast": "dīno vā rājyahīno vā yo me bhartā sa me guruḥ । taṃ nityaṃ anuraktāsmi yatha sūryaṃ suvarcalā ॥9॥", "leonov_ru": "Печален ли он, лишен ли царства, он мой муж и наставник. К нему я навеки привязана, как к Сурье Суварчала", "commentary": {"bhusana": "दीनो वा राज्यहीनो वा यो मे भर्ता स मे गुरुः ।\n\nतं नित्यमनुरक्ता ऽस्मि यथा सूर्यं सुवर्चला"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "lexical:5.24.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "suvarcalā", "note_ru": "Суварчала (suvarcalā, f.) — супруга Солнца (Sūrya) в одном из ведийских мифографических слоёв. В стихе Сита уподобляет свою верность мужу преданности Суварчалы Сурье: «как Суварчала к Сурье, так и я привязана к моему мужу». MW знает suvarcalā прежде всего как лекарственное растение (Ruta Graveolens), но в эпическом контексте это имя супруги Солнца (ср. MBh). Апте также фиксирует это значение. Выбор именно этой параллели неслучаен: Сурья — вечно движущийся и никогда не оставляющий своей орбиты; верность Суварчалы кодирует неотклонимость, а не просто преданность.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:suvarcalA", "source_links": [{"label": "MW suvarcalA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=suvarcalA"}], "seq": 8}, {"id": "edition:5.24.9:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.24.9–12 (4 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.24.9–12", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.24.9", "iast": "dīno vā rājyahīno vā yo me bhartā sa me guruḥ । taṃ nityaṃ anuraktāsmi yatha sūryaṃ suvarcalā ॥9॥"}, {"verse_id": "5.24.10", "iast": "yathā śacī mahābhāgā śakraṃ samupatiṣṭhati । arundhatī vasiṣṭhaṃ ca rohiṇī śaśinaṃ yathā ॥10॥"}, {"verse_id": "5.24.11", "iast": "lopāmudrā yathāgastyaṃ sukanyā cyavanaṃ yathā । sāvitrī satyavantaṃ ca kapilaṃ śrīmatī yathā ॥11॥"}, {"verse_id": "5.24.12", "iast": "saudāsaṃ madayantīva keśinī sagaraṃ yathā । naiṣadhaṃ damayantīva bhaimī patimanuvratā ॥12॥"}], "seq": 9}]}, {"verse_id": "5.24.10", "verse": "10", "sanskrit_iast": "yathā śacī mahābhāgā śakraṃ samupatiṣṭhati । arundhatī vasiṣṭhaṃ ca rohiṇī śaśinaṃ yathā ॥10॥", "leonov_ru": "Как Шачи, наделенная великой долей, привязана к Шакре, Как Арундати – к Васиштхе, и Рохини – к Месяцу.", "commentary": {"bhusana": "यथा शची महाभागा शक्रं समुपतिष्ठति ।\n\nअरुन्धती वसिष्ठं च रोहिणी शशिनं यथा"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "lexical:5.24.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "rohiṇī", "note_ru": "Рохини (rohiṇī, f.) — «красная», главная из 27 жён Луны (śaśin), с которой нарратив о ревности других жён составляет важный мифологический цикл (MBh, Viṣṇu Pur.). MW: rohiṇī 'a red cow; [later] any cow; [in astron.] the 4th lunar mansion (the favourite wife of the Moon)'. Упоминание пары rohiṇī—śaśin в цепочке верных жён не случайно: Луна многожённа, и именно верность Рохини на фоне ревности других жён делает её образцовым параллелем для Ситы — та тоже противостоит «конкуренции» ракшасий, предлагающих более «выгодного» мужа.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:rohiRI", "source_links": [{"label": "MW rohiRI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=rohiRI"}], "seq": 10}]}, {"verse_id": "5.24.11", "verse": "11", "sanskrit_iast": "lopāmudrā yathāgastyaṃ sukanyā cyavanaṃ yathā । sāvitrī satyavantaṃ ca kapilaṃ śrīmatī yathā ॥11॥", "leonov_ru": "Как Лопамудра как Агастье, как Суканья к Чьяване, Как Савитри к Сатьявану, как Шримати к Капиле.", "commentary": {"bhusana": "लोपामुद्रा यथा ऽगस्त्यं सुकन्या च्यवनं चथा ।\n\nसावित्री सत्यवन्तं च कपिलं श्रीमती यथा"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "lexical:5.24.11:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "lopāmudrā", "note_ru": "Лопамудра (lopāmudrā, f.) — супруга мудреца Агастьи, один из ключевых образцов pativratā в ведийской и эпической традиции. MW: lopāmudrā 'N. of the reputed wife of the sage Agastya (formed by the sage himself and secretly introduced into the palace of the king of Vidarbha)'. Имя объясняется как «та, по образцу (mudrā) которой потеряны (lopita) красивейшие черты животных» — Агастья создал её, взяв лучшие черты у разных созданий. Цепочка верных жён в стихах 10–13 — риторический приём «enumeration of exempla» (dṛṣṭānta-mālā), характерный для защитных речей героинь.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:lopAmudrA", "source_links": [{"label": "MW lopAmudrA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=lopAmudrA"}], "seq": 11}]}, {"verse_id": "5.24.12", "verse": "12", "sanskrit_iast": "saudāsaṃ madayantīva keśinī sagaraṃ yathā । naiṣadhaṃ damayantīva bhaimī patimanuvratā ॥12॥", "leonov_ru": "Как Мадаянти к Саудасе, как Кешини к Сагаре, Как Дамаянти, дочь Бхимы верная мужу – к Нишадцу (Нале).", "commentary": {"bhusana": "तत इत्यादि\nसौदासं मदयन्तीव केशिनी सगरं यथा ।\n\nनैषधं दमयन्तीव भैमी पतिमनुव्रता ।\n\nतथाहमिक्ष्वाकुवरं रामं पतिमनुव्रता"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "lexical:5.24.12:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "saudāsa", "note_ru": "Саудаса (saudāsa, m.) — «(сын) Судасы», царь Мит(ра)саха из рода Икшваку, проклятый мудрецом Васиштхой и ставший на время людоедом (rākṣasa-vṛtti). Подстрочник не объясняет, почему именно Саудаса и Мадаянти включены в список pativratā: Мадаянти сохранила верность мужу именно в период его «нечистого» состояния — прямая параллель к ситуации Ситы при «нечистом» Раване. Это не просто пример преданности, но пример верности в условиях осквернения мужа — единственная из всего списка такая параллель.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:saudAsa", "source_links": [{"label": "MW saudAsa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=saudAsa"}], "seq": 12}, {"id": "crosstext:5.24.12:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "damayantī … sagara … saudāsa", "note_ru": "Хануман ободряет Ситу списком образцовых верных жён: «как Мадаянти к Саудасе, как Кешини к Сагаре, как Дамаянти, дочь Бхимы, верная мужу — к Нишадцу (Нале)» (V.24.12). Все три pativratā-пары — герои именно Араньякапарвы. Сагара — герой кумулятивного сказания Āraṇyaka 3.106 сл. («etatte sarvamākhyātaṃ… sagareṇa vivāsitaḥ»), а Дамаянти, дочь Бхимы (bhaimī) — героиня Нала-упакхьяны (Āraṇyaka 3.50-78), откуда уже извлечены формульные параллели V.15.20 и V.19.17. Таким образом, перечень эталонных жён у Ханумана опирается на тот же повествовательный фонд Vana-parvan, что и описания самой Ситы. Свидетельство: уровень шлоки (мягкое; связь по корпусу имён).", "type": "В", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.24.12", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparva 3.106.10-17 (Sagara) и 3.50-78 (Nala–Damayantī)", "source_links": [], "seq": 13}]}, {"verse_id": "5.24.14", "verse": "14", "sanskrit_iast": "avalīnaḥ sa nirvākyo hanumāñ śiṃśapādrume । sītāṃ saṃtarjayantīs tā rākṣasīr aśṛṇot kapiḥ ॥14॥", "leonov_ru": "Хануман же, вынужденный молчать, прятался на дереве ашока, Слышал обезьяна как те ракшаси угрожают Сите.", "commentary": {"tilaka": "अतिदुःखसमये ऽपि दृढव्रतत्वद्योतनायानेकसाध्वीनामुपन्यासो दृष्टान्तविधयेत्याहुः ।। 5.24.10,11 ।।\n\nभैमी दमयन्ती नैषधं पतिं यथा ऽनुव्रता ।। 5.24.12,13 ।।\n\nअवलीनश्छन्नः । निर्वाक्यो मौनी । शिंशपाद्रुमे स्थित इति शेषः । सीतां तर्जयन्ती राक्षसीस्तद्वाक्यान्यशृणोत्", "bhusana": "अवलीनः स निर्वाक्यो हनुमान् शिंशुपाद्रुमे ।\n\nसीतां सन्तर्जयन्तीस्ता राक्षसीरशृणोत् कपिः\nअवलीनः छन्नः । राक्षसीरश्रृणोत् राक्षसीवाक्यान्यश्रृणोदित्यर्थः", "siromani": "अवेति । शिंशुपाद्रुमे अवलीनः निर्वाक्यः मौनीभूतः स हनूमान् सीतां तर्जयन्तीः राक्षसीः तद्वाक्यानि अशृणोत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "шиншапы", "kind": "note", "text": "Комм. Шиншапа = ашока?"}], "suggestions": [], "seq": 14}, {"id": "phase2:5.24.14:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "avalīnaḥ ... aśṛṇot", "note_ru": "По Тилаке, перечень верных жён (Шачи, Арундхати, Рохини, Лопамудра, Дамаянти и др., ст. 9–13) — не случайный набор примеров, а риторический приём: dṛṣṭānta-vidhi, «показ через примеры», призванный оттенить твёрдость обета Ситы именно в момент крайнего страдания (ati-duḥkha-samaye 'pi dṛḍha-vratatva-dyotanāya).", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Определяет риторическую функцию всего списка примерных жён (ст. 9-13) как единого приёма dṛṣṭānta, а не отдельные глоссы к именам — уровень, недоступный подстрочнику и не покрытый лексическими примечаниями фазы 1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "collision_tier1": true, "seq": 15}]}, {"verse_id": "5.24.15", "verse": "15", "sanskrit_iast": "tām abhikramya saṃrabdhā vepamānāṃ samantataḥ । bhṛśaṃ saṃlilihur dīptān pralambān daśanacchadān ॥15॥", "leonov_ru": "Подступив, возбужденные, к ней, дрожащей, со всех сторон, Часто облизывая жаркие (ярко-красные) отвислые губы.", "commentary": {"tilaka": "वेपमानां तामभिक्रम्य तत्समीपमागत्य संरब्धाः क्रुद्धास्ता राक्षस्यो दशनच्छदाँल्लिलिहुर्लेहनं कुर्वन्ति स्म", "bhusana": "तामभिक्रम्य संक्रुद्धा वेपमानां समन्ततः ।\n\nभृशं संलिलिहुर्दीप्तान् प्रलम्बान् दशनच्छदान्", "siromani": "तामिति । वेपमानां तां सीतां समन्ततो ऽभिक्रम्य प्राप्य दीप्तान् प्रकाशितान् प्रलम्बान् दशनच्छदान् स्वस्वाधरान् भृशं संलिलिहुः संलेहनं चक्रुः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [], "suggestions": [{"author": "Claude.AI", "strength": "желательно", "kind": "термин", "accounted": "не учтено", "text": "пралая — разрушение мира в конце кальпы.", "incomplete": false}], "seq": 16}]}, {"verse_id": "5.24.16", "verse": "16", "sanskrit_iast": "ūcuś ca paramakruddhāḥ pragṛhyāśu paraśvadhān । neyam arhati bhartāraṃ rāvaṇaṃ rākṣasādhipam ॥16॥", "leonov_ru": "И сказали в наивысшем гневе, взяв быстро топоры: «Она не заслуживает быть женою Раваны, владыки ракшасов».", "commentary": {"tilaka": "परश्वधान्गृहीत्वोचुश्च । नेयं रावणं भर्तारमर्हति अपि त्वस्माकं भक्षणमेवार्हतीति भावः", "bhusana": "ऊचुश्च परमक्रुद्धाः प्रगृह्याशु परश्वधान् ।\n\nनेयमर्हति भर्तारं रावणं राक्षसाधिपम्", "siromani": "ऊचुरिति । परमक्रुद्धाः राक्षस्यः आशु शीघ्रं परश्वधान् प्रगृह्य इयं सीता भर्तारमस्मत्पतिं रावणं नार्हति तत्पूजायोग्या न भवति इत्यूचुः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "phase2:5.24.16:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "neyam arhati", "note_ru": "«Она не заслуживает [быть женой Раваны]» — по Тилаке, смысл угрозы шире: neyaṃ rāvaṇaṃ bhartāram arhati api tv asmākaṃ bhakṣaṇam evārhati, «не заслуживает Равану мужем, но заслуживает быть съеденной именно нами». Тилака делает явной садистскую логику, скрытую в фразе: несоответствие Раване оборачивается правом на пожирание.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Вскрывает подразумеваемый Тилакой логический переход «не заслуживает Равану → заслуживает быть съеденной» — угрожающий подтекст, невидимый в нейтральном подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 17}]}, {"verse_id": "5.24.17", "verse": "17", "sanskrit_iast": "sā bhartsyamānā bhīmābhī rākṣasībhir varānanā । sā bāṣpam apamārjantī śiṃśapāṃ tām upāgamat ॥17॥", "leonov_ru": "Она, оскорбляемая ужасными ракшаси, прекрасноликая, Она, отирая слезы, подошла к той ашоке.", "commentary": {"tilaka": "भर्त्स्यमानैवंप्रकारेण पीड्यमाना । अभूदिति शेषः । तां शिंशपां हनूमदधिष्ठितशिंशपाम् । अत्यन्तं तन्मूलसमीपमित्यर्थः", "bhusana": "संभर्त्स्यमाना भीमाभी राक्षसीभिर्वरानना ।\n\nसा बाष्पमुपामार्जन्ती शिंशुपां तामुपागमत्", "siromani": "सेति । राक्षसीभिर्भर्त्स्यमाना सा सीता अभवदिति शेषः, अत एव बाष्पमश्रु अपमार्जन्ती सीता तां हनुमदधिष्ठितदेशसमीपवर्तिनीं शिंशुपां शिंशुपामूलमुमागमत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "sā bhartsyamānā bhīmābhīrākṣasībhir", "kind": "omission", "text": "опущено!"}], "suggestions": [], "seq": 18}]}, {"verse_id": "5.24.19", "verse": "19", "sanskrit_iast": "tāṃ kṛśāṃ dīnavadanāṃ malināmbaravāsinīm । bhartsayāṃ cakrire bhīmā rākṣasyas tāḥ samantataḥ ॥19॥", "leonov_ru": "Ее, исхудавшую, с печальным лицом, одетую в грязные одежды Оскобляли (продолжали оскорблять) ужасные ракшаси со всех сторон.", "commentary": {"siromani": "दीन इति । दीनो राज्यहीनो वा उत्प्रेक्षितदीनत्वादिविशिष्टः यो मे भर्ता स एव गुरुः अत एव तं पतिं सूर्यं सुवर्चला तत्पत्नीव नित्यमनुरक्ता ऽस्मि\nतामिति । तां सीतां राक्षस्यो भर्त्स्ययाञ्चिक्रिरे", "bhusana": "तां कृशां दीनवदनां मलिनाम्बरधारिणीम् ।\n\nभर्त्सयाञ्चक्रिरे सीतां राक्षस्यस्तां समन्ततः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.19:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "bhīmā", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 19}, {"id": "tier1:5.24.19:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Ей, исхудавшей печальнице (» (kṛśāṃ dīnavadanām) – букв.: «исхудавшей, печальноликой».", "service": [], "suggestions": [], "seq": 20}]}, {"verse_id": "5.24.20", "verse": "20", "sanskrit_iast": "tatas tu vinatā nāma rākṣasī bhīmadarśanā । abravīt kupitākārā karālā nirṇatodarī ॥20॥", "leonov_ru": "Тогда ракшаси по имени Вината, ужасная обликом, Сказала, выражая гнев, с широкой пастью, с выступающим брюхом:", "commentary": {"tilaka": "ततस्तन्मूलगमनानन्तरम् ।। 5.24.18,19 ।।\n\nनिर्णतोदर्यतिनिम्नोदरी", "bhusana": "ततस्तां विनता नाम राक्षसी भीमदर्शना ।\n\nअब्रवीत् कुपिताकारा कराला निर्णतोदरी\nततस्तां विनता नामेति । निर्णतोदरी उन्नतोदरी", "siromani": "तत इति । ततस्तस्मिन् समये निर्णतोदरी अतिनिम्नोदरविशिष्टा कुपितः कोपबोधकः आकारो यस्याः सा विनता नाम राक्षसी अब्रवीत्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "phase2:5.24.20:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "nirṇatodarī", "note_ru": "nirṇatodarī («с ... животом») — комментаторы расходятся: Тилака и Широмани читают nirṇata как ati-nimnodarī, «с сильно впалым животом», тогда как Бхушана глоссирует то же слово как unnatodarī, «с выпуклым, выступающим животом» — противоположный образ. Подстрочник Леонова следует чтению Бхушаны («выступающим брюхом»), не отмечая обратного толкования Тилаки и Широмани.", "type": "Б", "source_commentary": ["tilaka", "bhusana", "siromani"], "why_proposed": "Фиксирует прямое разночтение комментаторов в толковании одного эпитета (впалый vs. выпуклый живот) — подстрочник принимает лишь одно из двух противоположных прочтений без оговорки.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 21}]}, {"verse_id": "5.24.21", "verse": "21", "sanskrit_iast": "sīte paryāptam etāvad bhartuḥ snehaḥ pradarśitaḥ । sarvatrātikṛtaṃ bhadre vyasanāyopakalpate ॥21॥", "leonov_ru": "Сита, довольо любовь к мужу (тобой) выказана, Всегда чрезмерность, о прекрасная, приводит к несчастью.", "commentary": {"tilaka": "अतिकृतमतिमात्राचरणम् । श्रीरपि समैव ज्यायसीति लोकोक्तेरिति भावः । व्यसनं दुःखम्", "bhusana": "सीते पर्याप्तमेतावद्भर्तुः स्नेहो निदर्शितः ।\n\nसर्वत्रातिकृतं भद्रे व्यसनायोपकल्पते\nअतिकृतम् अतिमात्रकृतम्", "siromani": "तद्वचनाकारमाह सीते इति । हे सीते भर्तुः स्नेहः पर्याप्तं यथा भवति तथा प्रदर्शितः इतः परं स्नेहं न कुर्वित्यर्थः । तत्र हेतुः-- सर्वत्र सर्वस्मिन् काले अतिकृतम् अत्यन्तं संपादितं स्नेहनं व्यसनाय दुःखाय उपकल्पते"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "phase2:5.24.21:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sarvātikṛtam", "note_ru": "«Всякая чрезмерность (ati-kṛtam) ведёт к беде» — Тилака подкрепляет эту сентенцию народной поговоркой (lokokti): śrīr api samaiva jyāyasī, «даже [богиня] Шри ценится больше, когда её мера умеренна». Ракшаси Вината, упрекая Ситу в избытке любви к мужу, опирается тем самым на расхожую житейскую мудрость, а не только на собственное суждение.", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "Указывает конкретную народную поговорку (lokokti), на которую опирается упрёк ракшаси, — культурная реалия, отсутствующая в подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 22}]}, {"verse_id": "5.24.24", "verse": "24", "sanskrit_iast": "dakṣiṇaṃ tyāgaśīlaṃ ca sarvasya priyavādinam । mānuṣaṃ kṛpaṇaṃ rāmaṃ tyaktvā rāvaṇam āśraya ॥24॥", "leonov_ru": "Учтивого, щедрого, со всеми приятно разговаривающего, Жалкого человека Раму оставив, соединись с Раваной.", "commentary": {"bhusana": "दक्षिणं त्यागशीलं च सर्वस्य प्रियदर्शनम्\nमानुषं कृपणं रामं त्यक्त्वा रावणमाश्रय ।\n\nदिव्याङ्गरागा वैदेहि दिव्याभरणभूषिता", "siromani": "दक्षिणमिति । मानुषं रामं त्यक्त्वा दक्षिणं निपुणं रावणमाश्रयस्व चरणसन्निधिं प्रापय"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.24:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "mānuṣaṃ", "kind": "omission", "text": "опущено, комм?"}], "suggestions": [], "seq": 23}]}, {"verse_id": "5.24.25", "verse": "25", "sanskrit_iast": "divyāṅgarāgā vaidehi divyābharaṇabhūṣitā । adya prabhṛti lokānāṃ sarveṣām īśvarī bhava ॥25॥", "leonov_ru": "Покрытая великолепными притираниями, Вайдехи, украшенная дивными украшениями, Будешь ты с этого момента повелительницей всего мира.", "commentary": {"siromani": "दिव्येति । वैदेही त्वं दिव्याङ्गरागा सती अद्यप्रभृति लोकानाम् ईश्वरी भव", "bhusana": "अद्यप्रभृति सर्वेषां लोकानामीश्वरीभव ।\n\nअग्नेः स्वाहा यथा देवी शचीवेन्द्रस्य शोभने"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "crosstext:5.24.25:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "divya-ābharaṇa-bhūṣita", "note_ru": "divyābharaṇabhūṣitā … sarveṣām īśvarī bhava («украшенная дивными украшениями … будь повелительницей всех») — Равана соблазняет Ситу властью над миром. Формула divyābharaṇa-bhūṣita («убранный божественными украшениями») — общеэпический маркер сверхчеловеческого статуса; в Махабхарате она сопровождает богов и царственных мудрецов «в венках и украшениях», нисходящих в небесных колесницах (ср. сабху Индры, MBh II.7.22 и далее). Параллель оттеняет демоническую иронию сцены: Равана сулит Сите божественные регалии как средство падения, а не возвышения.", "type": "А", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.24.25", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Sabhāparvan II.7.21-26", "source_links": [], "seq": 24}]}, {"verse_id": "5.24.26", "verse": "26", "sanskrit_iast": "agneḥ svāhā yathā devī śacī vendrasya śobhane । kiṃ te rāmeṇa vaidehi kṛpaṇena gatāyuṣā ॥26॥", "leonov_ru": "Подобно богине Свахе, жене бога Агни, или подобно богине Шачи, жене Индры, о прекрасная. К чему тебе, Вайдехи, жалкий Рама, жизнь которого скоро оборвется?", "commentary": {"siromani": "अग्नेरिति । अग्नेः स्वाहेव इन्द्रस्य शचीव रामस्य पत्नी या त्वं तस्यास्ते गतायुषा रामेण किम्", "bhusana": "किं ते रामेण वैदेहि कृपणेन गतायुषा ।\n\nएतदुक्तं च मे वाक्यं यदि त्वं न करिष्यसि ।\n\nअस्मिन् मुहूर्ते सर्वास्त्वां भक्षयिष्यामहे वयम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "lexical:5.24.26:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "svāhā", "note_ru": "Сваха (svāhā, f. и ind.) — ритуальный возглас при жертвенном возлиянии в огонь; одновременно персонифицируется как дочь Дакши и супруга Агни (MW: 'hail to!; the wife of Agni'). Ракшасийя Вина(tā) называет её «богиней» (devī), ставя Ситу в ряд: Сваха при Агни, Шачи при Индре — и т.д. Невидимая для подстрочника деталь: Сваха в ритуальном контексте не просто «жена Агни», она — посредник между жертвователем и богом, та, чьим именем передаётся подношение. Включение её в список — тонкая ирония: ракшасийя предлагает Сите роль «посредника», приближённого к силе через мужа.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:svAhA", "source_links": [{"label": "MW svAhA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=svAhA"}], "seq": 25}]}, {"verse_id": "5.24.30", "verse": "30", "sanskrit_iast": "na ca naḥ kuruṣe vākyaṃ hitaṃ kālapuraskṛtam । ānītāsi samudrasya pāram anyair durāsadam ॥30॥", "leonov_ru": "Но ты не следуешь нашим полезным и своевременным словам. Ты приведена на другой берег океана, труднодоступный для других.", "commentary": {"tilaka": "कालपुरस्कृतं कालोचितं नो वाक्यं न च कुरुषे । नैतत्ते हितमिति शेषः । तदेवोपपादयति-- आनीता ऽसीति", "bhusana": "न च नः कुरुषे वाक्यं हितं कालपुरस्सरम्\nआनीतासि समुद्रस्य पारमन्यैर्दुरासदम् ।\n\nरावणान्तःपुरं घोरं प्रविष्टा चासि मैथिलि", "siromani": "नेति । अन्यैर्दुरासदं समुद्रस्य पारं या त्वमानीता ऽसि अत एव रावणान्तःपुरे प्रविष्टा ऽसि अत एव रावणस्य गृहे अवरुद्धा ऽसि अत एव अस्माभी रक्षिता ऽसि सा त्वं कालपुरस्कृतं कालोचितं हितं नो वाक्यं न कुरुषे अनुचितमेतदित्यर्थः । अर्धचतुष्टयमेकान्वयि ।। 5.24.30,31 ।।\n\nवचनाकरणे दोषमाह नेति । त्वाम् अस्मदनुमतिहीनामित्यर्थः । त्रातुं पुरन्दरो ऽपि न शक्तः अतो मम वचनं कुरुष्व"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "ānītāsi", "kind": "omission", "text": "опущено, из-за этого часть стиха остается непонятной."}], "suggestions": [], "seq": 26}]}, {"verse_id": "5.24.32", "verse": "32", "sanskrit_iast": "na tvāṃ śaktaḥ paritrātum api sākṣāt puraṃdaraḥ । kuruṣva hitavādinyā vacanaṃ mama maithili ॥32॥", "leonov_ru": "Не в силах тебя вызволить даже сам Пурандара (Индра). Последуй словам меня, говорящей полезное, Майтхили.", "commentary": {"bhusana": "कुरुष्व हितवादिन्या वचनं मम मैथिलि ।\n\nअलमश्रुप्रपातेन त्यज शोकमनर्थकम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "lexical:5.24.32:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "purandarā", "note_ru": "Пурандара (purandarā, m.) — эпитет Индры, «разрушающий крепости» (pura + dara от √dṛ-, «разрывать, дробить»). В «Ригведе» это центральный эпитет Индры как бога-завоевателя, сокрушителя асурских городищ. MW: purandara 'destroying castles; N. of Indra'. Угроза ракшасий «не спасёт даже Пурандара» особенно значима: это не просто «даже Индра», но именно «разрушитель крепостей» не сможет разрушить крепость-Ланку. Косвенная игра смыслов: тот, кто разрушал крепости асуров, бессилен перед крепостью Раваны, победившего тех же богов.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:puranDara", "source_links": [{"label": "MW puranDara", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=puranDara"}], "seq": 27}]}, {"verse_id": "5.24.33", "verse": "33", "sanskrit_iast": "alam aśruprapātena tyaja śokam anarthakam । bhaja prītiṃ praharṣaṃ ca tyajantī nityadainyatām ॥33॥", "leonov_ru": "Довольно лить слезы, хватит бесполезной скорби, Наслаждайся радостью и весельем, оставив постоянную печаль.", "commentary": {"siromani": "अलमिति । अश्रुनिपातेन अलम् अतः अनर्थकं शोकं त्यज प्रीतिं प्रहर्षं च भज तां प्रत्यक्षीभूतां नित्यदैन्यतां निरन्तरदैन्यं त्यज । दैन्यताशब्दःस्वार्थिकष्यञन्तः", "bhusana": "भज प्रीतिं प्रहर्षं च त्यजैतां नित्यदैन्यताम् ।\n\nसीते राक्षसराजेन सह क्रीड यथासुखम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.33:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "nitya", "kind": "omission", "text": "опущено, комм?"}], "suggestions": [], "seq": 28}]}, {"verse_id": "5.24.40", "verse": "40", "sanskrit_iast": "rāvaṇena hṛtāṃ dṛṣṭvā daurhṛdo me mahānayam । yakṛtplīhaṃ mahat kroḍaṃ hṛdayam ca sabandham ॥40॥", "leonov_ru": "Плененную Раваной видя, желание (или враждебность) у меня возникло сильное. Печень (ее), селезенку, огромную грудь и сердце с венами и артериями", "commentary": {"siromani": "दौर्हृदमेव प्रकटयति यकृदिति । यकृत्प्लीहं यकृत् दिक्षिणभागस्थः कालखण्डाभिधः मांसविशेषः प्लीहा हृदयवामभागस्थो गुल्माभिधो मांसविशेषः तयोः समाहारद्वन्द्वः अच्प्रत्ययेत्यत्र अजिति योगविभागादच् तत् महत् क्रोडं भुजान्तरं सबन्धनं हृदयनाडीबन्धनसहितं हृदयं च गात्राणि च शीर्षँ च खादेयमिति मे मतिर्निश्चियः", "bhusana": "यकृत्प्लीहमथोत्पीडं हृदयं च सबन्धनम् ।\n\nअन्त्राण्यपि तथा शीर्षं खादेयमिति मे मतिः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "lexical:5.24.40:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "yakṛt-plīha", "note_ru": "Якрит-плиха (yakṛt-plīhan, n.+m.) — «печень и селезёнка» как пара органов. В медицинских текстах (Charaka, Suśruta) yakṛt и plīhan — стандартная анатомическая пара, соответствующая кровеносным органам; их совместное упоминание с hṛdaya (сердце) и baddha (связи/сосуды) формирует анатомически подробный перечень. Подстрочник (Леонов) передаёт это технически; примечательна именно детализация: ракшасийя перечисляет органы в медицинском порядке (периферия → центр: печень, селезёнка, грудь, сердце с сосудами), что указывает на ритуальное расчленение (viviccheda), а не просто поедание — этот ужас эпоса имеет ритуальную подоплёку.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:yakft+dic_mw:plIhan", "source_links": [{"label": "MW yakft", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=yakft"}, {"label": "MW plIhan", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=plIhan"}], "seq": 29}]}, {"verse_id": "5.24.42", "verse": "42", "sanskrit_iast": "kaṇṭham asyā nṛśaṃsāyāḥ pīḍayāmaḥ kim āsyate । nivedyatāṃ tato rājñe mānuṣī sā mṛteti ha ॥42॥", "leonov_ru": "Горло этой жестокосердной мы сдавим, чего медлить? Поведаем потом царю, что человечица эта умерла.", "commentary": {"siromani": "ननु कण्ठपीडनेन किमित्यत आह निवेद्यतामिति । ततः कण्ठपीडनानन्तरं मानुषी सा सीता मृतेति राज्ञे रावणाय निवेद्यतां सः श्रुतवृत्तान्तो राजा यूयं खादतेति वक्ष्यति अत्र कश्चन संदेहो न", "bhusana": "निवेद्यतां ततो राज्ञे मानुषी सा मृतेति ह ।\n\nनात्र कश्चन सन्देहः खादतेति स वक्ष्यति\nमानुषीति । न त्वं जातु भविष्यसि, तस्येति शेषः । मानुषीति हेतुगर्भम् । मानुषी त्वं मानुषं तमिच्छसि\nउद्यानानि च रम्याणि पर्वतोपवनानि च ।\n\nसह राक्षसराजेन चर त्वं मदिरेक्षणे"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "phase2:5.24.42:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kaṇṭham asyā … khādateti", "note_ru": "По свидетельству Тилаки, комментатор Катака (kataka) считал два стиха речи Прагхасы — о сдавливании горла Ситы и донесении Раване о её мнимой смерти (ст. 42–43) — поздней вставкой (prakṣiptam), а не подлинной частью текста.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Сообщает конкретный вердикт традиционного комментатора (Катаки) об интерполяции двух стихов — филологический факт истории текста, отсутствующий в подстрочнике.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch2_draft"}, "seq": 30}]}, {"verse_id": "5.24.43", "verse": "43", "sanskrit_iast": "nātra kaś cana saṃdehaḥ khādateti sa vakṣyati । tatas tv ajāmukhī nāma rākṣasī vākyam abravīt ॥43॥", "leonov_ru": "Нет тут никаких сомнений, он скажет «Съеште ее». Тогда ракшаси по имени Аджамукхи сказала:", "commentary": {"tilaka": "शूर्पणखेयमन्या", "siromani": "तत इति । अजामुखी नाम राक्षसी अब्रवीत् । तदाकारमाह इमां सीतां विशस्य हत्वा पिण्डकान् मांसखण्डान् समान् यथाराक्षसीसमविभागान् कुरु", "bhusana": "ततस्त्वजामुखी नाम राक्षसी वाक्यमब्रवीत् ।\n\nविशस्येमां ततः सर्वाः समान् कुरुत पीलुकान्\nततस्त्वजामुखी नामेत्यादि । पीलुकान् मांसखण्डान्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.43:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Строфы 42 и 43 отсутствуют в бомбейском издании, но имеются в издании «Гита-пресс».", "service": [{"author": "Е. Костина", "lemma_iast": "", "kind": "note", "text": "Другие случаи отсутствия тех или иных строф в других изданиях тогда тоже надо отмечать. Где-то я это фиксирую, но потом надо будет проверить внимательно"}], "suggestions": [], "seq": 31}]}, {"verse_id": "5.24.45", "verse": "45", "sanskrit_iast": "peyam ānīyatāṃ kṣipraṃ mālyaṃ ca vividhaṃ bahu । tataḥ śūrpaṇakhā nāma rākṣasī vākyam abravīt ॥45॥", "leonov_ru": "Выпивку принесите быстро и разные цветочные гирлянды в большом количестве. Затем ракшаси по имени Шурпанакха сказала:", "commentary": {"tilaka": "निकुम्भिला नाम लङ्कायाः पश्चिमभागवर्तिनी भद्रकाली तां नृत्यामस्तत्समीपं गत्वा नृत्यामसुरसुतोपमा देवकन्योपमा रोदित्यरुदत्", "bhusana": "विभजाम ततः सर्वा विवादो मे न रोचते ।\n\nपोयमानीयतां क्षिप्रं लेह्यमुच्चावचं बहु", "siromani": "तत इति । शूर्पनखी नाम राक्षसी अब्रवीत् इयं न रावणभगिनी संज्ञाया अभावान्न ङीब्निषेधादि । तदाकारमाह अजामुख्या यदुक्तं मम तदेव रोचते"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.45:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Выпивку принесите, / И цветочных гирлянд побольше (peyam ānīyatāṃ kṣipraṃ mālyaṃ ca vividhaṃ bahu) – по бомбейскому изданию эти слова принадлежат Прагхасе. Поэтому упоминание Аджамукхи в следующей строфе становится непонятным. Комментарий «Тилака» отождествляет Аджамукхи с Прагхасой.", "service": [], "suggestions": [], "seq": 32}, {"id": "lexical:5.24.45:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śūrpaṇakhā", "note_ru": "Шурпанакха (śūrpaṇakhā, f.) — «чьи ногти (nakha) как веяльные лопаты (śūrpa)». MW: śūrpa 'a winnowing basket or fan'. Имя — говорящее: śūrpa (веяльная корзина) имеет форму большой лопаты, ногти ракшасийи описываются как устрашающе большие и загнутые — предметный образ, понятный слушателям. Принципиально важно: Шурпанакха появляется в этой сцене не в качестве сестры Раваны (что известно читателю), а именно как ракшасийя в ряду других — её имя здесь, по сути, первый её жест в пространстве Сундараканды. Появление в сцене угроз имеет нарративную функцию: именно она «понравилась» предложению поедания (стих 46).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:SUrpaRAKA (составное: SUrpa+nAKa)", "source_links": [{"label": "MW SUrpaRAKA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=SUrpaRAKA"}], "collision_tier1": true, "seq": 33}]}, {"verse_id": "5.24.47", "verse": "47", "sanskrit_iast": "mānuṣaṃ māṃsam āsvādya nṛtyāmo 'tha nikumbhilām । evaṃ saṃbhartsyamānā sā sītā surasutopamā । rākṣasībhiḥ sughorābhir dhairyam utsṛjya roditi ॥47॥", "leonov_ru": "Человечиной насладившись, станцуем перед (богиней) Никумбхилой. Так подвергаемая оскорблениям, Сита, равная дочерям богов, Ракшаси весьма ужасными, утратив стойкость, плачет.", "commentary": {"bhusana": "सुरा चानीयतां क्षिप्रं सर्वशोकविनाशिनी ।\n\nमानुषं मांसमास्वाद्य नृत्यामो ऽथं निकुम्भिलाम्\nनिकुम्भिला नाम लङ्कायाः पश्चिमद्वारप्रदेशवासिनी भद्रकाली", "siromani": "एवमिति । निर्भर्त्स्यमाना सुरसुतोपमा सुरसुतासदृशी सीता धैर्यमुत्सृज्येव रोदिति । एवमिवार्थे"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-24", "notes": [{"id": "tier1:5.24.47:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Станцуем перед Нику́мбхилой (nṛtyāmo 'tha nikumbhilām) – комментарий «Тилака» сообщает, что Никумбхила – одно из имен богини Бхадракали, почитаемой в западной части Ланки.", "service": [], "suggestions": [], "seq": 34}, {"id": "lexical:5.24.47:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nikumbhilā", "note_ru": "Никумбхила (nikumbhilā, f.) — священное место в западной части Ланки, предназначенное для жертвоприношений (MW: nikumbhila 'a place where oblations are offered, esp. a grove at the western gate of Laṅkā for the performance of sacrificial rites'; согласно другой версии — изображение Бхадракали). Ракшасийи говорят, что отпразднуют убийство Ситы, станцевав у Никумбхила: это ритуальное место, не просто «богиня». Никумбхила играет ключевую роль в дальнейшей нарративной дуге Сундараканды и Юддхаканды (именно здесь Индраджит совершает яджню перед последней битвой). Первое появление этого топонима здесь — зловещая антиципация.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:nikumBila", "source_links": [{"label": "MW nikumBila", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=nikumBila"}], "collision_tier1": true, "seq": 35}, {"id": "lexical:5.24.47:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "piśitāśana", "note_ru": "Пишиташана (piśitāśana, m./f.) — «питающийся мясом (piśita)», эпитет ракшасов. piśita — «отрезанное, разделанное мясо» (от √piś-, «резать, украшать»); āśana — «едящий» (√aś-, «есть», + суфф. -ana). MW: piśitāśana 'a flesh-eater; a rākṣasa'. Характерно, что в стихе 34 перечислены именно «пожиратели плоти»: māṃsa («мясо», в том числе в стихах 40–47) последовательно уточняется до «человеческого мяса» (mānuṣaṃ māṃsam, 47). Эпитет piśitāśana — не просто диетическая характеристика, но ритуально-онтологическое определение ракшасов как «нечистых» в противовес brāhmaṇa и devī.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:piSitASana", "source_links": [{"label": "MW piSitASana", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=piSitASana"}], "collision_tier1": true, "seq": 36}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

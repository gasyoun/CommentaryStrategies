const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 16, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 41, "verses_with_notes": 20, "notes_by_layer": {"tier1": 9, "lexical": 9, "phase2": 1, "edition": 0, "crosstext": 3}}, "sarga": 16, "verses": [{"verse_id": "5.16.3", "verse": "3", "sanskrit_iast": "mānyā guruvinītasya lakṣmaṇasya gurupriyā । yadi sītā hi duḥkhārtā kālo hi duratikramaḥ ॥3॥", "leonov_ru": "«Если заслуживающая почтения, возлюбленная старшего брата Лакшманы, обученного наставниками, Сита измучена бедами, то неодолимо время.", "commentary": {"tilaka": "साचिव्यमिव सीतादर्शनादौ प्रभया स्वकान्त्या साचिव्यमिव साहाय्यकमिव दिवा क्वचिदेकान्तप्रदेशे स्थितत्वान्निद्राव्याकुलत्वाच्च न सम्यग्राक्षसीनां सीतायाश्च दर्शनम् रात्रौ चन्द्रोदये सति तु पुनः समीपदेश आगत्य स्थितस्य सम्यक्सर्वदर्शनम्\nशोकभारैर्न्यस्तामधोनीतामिव निमज्जमानामिव", "bhusana": "मान्या गुरुविनीतस्य लक्ष्मणस्य गुरुप्रिया ।\n\nयदि सीतापि दुःखार्ता कालो हि दुरतिक्रमः\nमान्येति । गुरुविनीतस्य गुरुभिः शिक्षितस्य । गुरुप्रिया रामप्रिया । कालो हि दुरतिक्रमः कालो दुरतिक्रम एवेत्ययमर्थः सिद्धो भवतीत्यर्थः । हिशब्धो ऽवधारणे अव्ययानामनेकार्थत्वात् । जगद्रक्षकरामलक्ष्मणगुप्तायास्सीताया अपि यदीदृशं दुःखं प्राप्तं तदा कालो दुरतिक्रम एवेति भावः", "siromani": "तदाकारमाह-- मान्येति । गुरुभिर्विनीतस्य शिक्षितस्य लक्ष्मणस्य गुरुप्रिया गुरोः रामस्य प्रिया सीता यदि दुःखार्ता तर्हि कालः परमात्मसंकेतः दुरतिक्रमः अतिक्रमितुमशक्यः"}, "has_tier1": true, "notes": [{"id": "tier1:5.16.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Обученного наставниками (guruvinītasya). Композит guruvinītasya допускает различные интерпретации. Так, в комментарии Сатьятиртхи он толкуется как bahunamra, то есть «очень покорный». Голдмены в своем комментарии к «Сундараканде» отмечают, что его можно понять как «покорный старшему [брату]» (см.: Goldman 1984: 396). Здесь перевод дан по комментариям «Тилака» и «Таттвадипика».Жена в беде оказалась (mānyā… gurupriyā… sītā) – букв. «чтимая… возлюбленная старшим (имеется в виду Рама)… Сита».[Е. Костина] «,» По комм. Складывается впечатление, что Голдманы выбирают вариант «покорный старшему брату», а они его просто приводят как вариант в комментарии, а останавливаются на том же, что и у нас"}]}, {"verse_id": "5.16.4", "verse": "4", "sanskrit_iast": "rāmasya vyavasāyajñā lakṣmaṇasya ca dhīmataḥ । nātyarthaṃ kṣubhyate devī gaṅgeva jaladāgame ॥4॥", "leonov_ru": "[Но] зная решимость Рамы и мудрого Лакшманы, Царевна волнуется не более, чем Ганга в начале сезона дождей.", "commentary": {"bhusana": "रामस्य व्यवसायज्ञा लक्ष्मणस्य च धीमतः ।\n\nनात्यर्थं क्षुभ्यते देवी गङ्गेव जलदागमे\n.\n\nरामस्येति । व्यवसायज्ञा स्वयत्नं विहाय तद्व्यवसायमेव प्रेक्षमाणा एतद्व्रतं मम । अप्यहं जीवितं जह्याम्' इत्येवं रामव्यवसायं जानन्तीत्यर्थः । लक्ष्मणस्य च धीमतः रामे मायामृगानुसारिण्यपि मारीचो ऽयमिति तदानीमपि निश्चितवतो लक्ष्मणस्य । यद्वा सर्वेश्वरादप्याश्रितसंरक्षणे समुद्युक्तस्य । नात्यर्थं क्षुभ्यते अत्यर्थमिति क्षोभाभावविशेषणम्, क्षोभविशेषणत्त्वे यत्किंचित्क्षोभः प्राप्तः स्यात् । सत्तानाशकाले प्राप्तेपि क्षोभलेशरहितेत्यर्थः । देवी रामेण शिरसा वोढव्याल्लभ्यवती । गङ्गेव जलदागमे, क्षोभहेतौ सत्यपि यथा गङ्गा न क्षुभ्यते तथेत्यर्थः", "siromani": "रामस्येति । देवी सीता यतो रामस्य लक्ष्मणस्य च व्यवसायज्ञा अनिवार्यपराक्रमविज्ञात्री अतो ऽत्यर्थमत्यन्तं न क्षुभ्यते । तत्र दृष्टान्तः जलदागमे वर्षर्तौ गङ्गा प्रयागस्थजाह्नवीव"}, "has_tier1": false, "notes": [{"id": "lexical:5.16.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vyavasāya", "note_ru": "Вьявасая (vyavasāya, m.) — «твёрдое решение, непреклонная воля» (vi+ava+√so-, «отрезать, решать», Whitney #993; MW: vyavasāya 'strenuous effort, determination, resolution'). MW особо отмечает оттенок неотвратимости: vyavasāya — решение, которое уже нельзя отменить, рубикон. В 16.4 Сита «знает vyavasāya Рамы» — это не «намерение», а именно точка невозврата в воле Рамы. Эпитет vyavasāyajñā («знающая vyavasāya») указывает, что Сита понимает: Рама не успокоится, пока не спасёт её — и именно это знание удерживает её от самоубийства. Подстрочник «решимость» — верно, но теряет степень неотвратимости.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:vyavasAya"}]}, {"verse_id": "5.16.5", "verse": "5", "sanskrit_iast": "tulyaśīlavayovṛttāṃ tulyābhijanalakṣaṇām । rāghavo 'rhati vaidehīṃ taṃ ceyam asitekṣaṇā ॥5॥", "leonov_ru": "Рама достоин Вайдехи, которая равна (подобна) ему характером, возрастом, поведением, Равна ему рождением и благими знаками, и его достойна черноглазая (Сита)».", "commentary": {"tilaka": "दिदृक्षमाणः प्रकटतया तां द्रष्टुमिच्छुः\nकर्णप्रावरणामिति विशालकर्णीम् । मस्तकोच्छ्वासनासिकामूर्ध्वमुखनासाम्", "bhusana": "तुल्यशीलवयोवृत्तां तुल्याभिजनलक्षणाम् ।\n\nराघवो ऽर्हति वैदेहीं तं चेयमसितेक्षणा", "siromani": "तुल्येति । तुल्यानि रामशीलादिसदृशानि शीलं वयश्च वृत्तमाचरणं च यस्याः तुल्ये अभिजनः कुलं लक्षणं सामुद्रिकोक्तसुलक्ष्म यस्याः तां वैदेहीं राघव एवार्हति अत एव इयं वैदेही एव तं राघवमर्हति"}, "has_tier1": true, "notes": [{"id": "tier1:5.16.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Равной ему нравом и возрастом (tulyaśīlavayovṛttāṃ) – имеется в виду не то, что Рама и Сита ровесники, а то, что их возрасты идеально подходят для супружеской четы. Согласно представлениям древних индийцев муж должен быть старше жены. Рама же на четыре года старше Ситы."}, {"id": "lexical:5.16.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "abhijana", "note_ru": "Абхиджана (abhijana, m.) — «происхождение, родовая принадлежность» (abhi+jana, «люди / рождение», MW: abhijana 'family, race; nobility of birth'). В 16.5 Хануман перечисляет основания брачного соответствия Рамы и Ситы: tulyaśīla «равный характер», tulyavaya «равный возраст», tulyavṛtta «равное поведение», tulyābhijanalakṣaṇa «равные родовые знаки». Abhijana — последний и решающий критерий: родовое достоинство. Эта классификация совпадает с нормами Ману-смritis о браке в пределах равного варны и рода. Хануман формулирует тезис как правовую/ритуальную норму, а не лирическое чувство.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:abhijana", "collision_tier1": true}, {"id": "phase2:5.16.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tulyaśīlavayovṛttām (vayas)", "note_ru": "«Бхушана» обосновывает «равенство возрастом» (tulyavayas) ссылкой на Вишну-смрити: жених должен быть втрое старше невесты (либо пары 16/12, 24/8 лет), иначе — «нарушение шастры»; иное соотношение возрастов было бы «раздором». Подстрочник верно поясняет фактическую разницу (Рама старше Ситы на четыре года), но не называет норму, которой эта разница удовлетворяет.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "именованная дхармашастрическая цитата (Вишну-смрити) как источник нормы возрастного соответствия, отсутствующая и в подстрочнике, и в примечании Леонова к этому стиху, и в Phase-1 (там — abhijana, о родовитости, не о возрасте); анкоринг: фрагмент сегментатора без pratika_check (текст начинается с 'tulyeti', глоссируя ровно 'tulyaśīlavayovṛttām' стиха 5) — содержательно это несомненное продолжение бхушановского комментария к стиху 5, атрибутировано туда, а не как отдельный стих", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.16.6", "verse": "6", "sanskrit_iast": "tāṃ dṛṣṭvā navahemābhāṃ lokakāntām iva śriyam । jagāma manasā rāmaṃ vacanaṃ cedam abravīt ॥6॥", "leonov_ru": "Увидев ее, подобную новому золоту, любимую миром (людьми) словно богиня Шри, Устремился [Хануман] мыслями к Раме и сказал такие слова:", "commentary": {"tilaka": "अतिकायोत्तमाङ्गीमतिप्रवृद्धोपरिभागदेहवतीम् तनुदीर्घशिरोधराम् अस्थूलदीर्घग्रीवामित्यर्थः । शारीरकैशैः कम्बलधारिणीमिव", "bhusana": "तां दृष्ट्वा नवहेमाभां लोककान्तामिव श्रियम् ।\n\nजगाम मनसा रामं वचनं चेदमब्रवीत्", "siromani": "तामिति । लोकः कान्तः शोभावान् यया यत्कान्त्यैव सर्वः प्रकाशते इत्यर्थः, तां श्रियमिव नवहेमाभां तां सीतां दृष्ट्वा मनसा रामं जगाम इदमब्रवीच्च"}, "has_tier1": true, "notes": [{"id": "tier1:5.16.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…подобную новому золоту (navahemābhāṃ) – комментарий «Тилака» толкует композит navahemābhām как taruṇīṃ hemābhāṃ ca, то есть «юную и сияющую как золото»."}]}, {"verse_id": "5.16.8", "verse": "8", "sanskrit_iast": "virādhaś ca hataḥ saṃkhye rākṣaso bhīmavikramaḥ । vane rāmeṇa vikramya mahendreṇeva śambaraḥ ॥8॥", "leonov_ru": "Был убит в бою и Вирадха, ракшас, грозный своей доблестью. В лесу напал на него Рама, словно великий Индра – на [демона] Шамбару.", "commentary": {"tilaka": "विकटां वक्रशरीराम् । करालां भयङ्करकृष्णवर्णाम्", "bhusana": "विराधश्च हतः सङ्ख्ये राक्षसो भीमविक्रमः ।\n\nवने रामेण विक्रम्य महेन्द्रेणेव शम्बरः", "siromani": "विराध इति । महेन्द्रेण शम्बर इव विराधश्च हतः अस्या हेतोरित्यनुकृष्यते एवमुत्तरेष्वपि"}, "has_tier1": true, "notes": [{"id": "tier1:5.16.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна II. 9. 13: Шамбара (śambara) — демон, который упоминается в «Ригведе» как один из врагов Индры; иногда отождествляется с Вритрой."}]}, {"verse_id": "5.16.9", "verse": "9", "sanskrit_iast": "caturdaśa sahasrāṇi rakṣasāṃ bhīmakarmaṇām । nihatāni janasthāne śarair agniśikhopamaiḥ ॥9॥", "leonov_ru": "Четырнадцать тысяч ракшасов, грозных в деяниях Были убиты в Джанастхане стрелами, подобными языкам пламени.", "commentary": {"tilaka": "विकृतत्वादिगुणाश्च या राक्षस्यस्तत्र स्थितास्ता ददर्शेति वक्ष्यमाणेनान्वयः । कूटो ऽयस्कारकूटाभ आयुधविशेषः", "bhusana": "चतुर्दश सहस्रीणि रक्षसां भीमकर्मणाम् ।\n\nनिहतानि जनस्थाने शरैरग्निशिखोपमैः", "siromani": "चतुरिति । रक्षसां चतुर्दश सहस्राणि निहतानि"}, "has_tier1": false, "notes": [{"id": "crosstext:5.16.9:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.16.9", "work_label": "Rām", "verse_address": "Rām 6.82.14 (крит. изд.)", "parallel_sa_iast": "caturdaśasahasrāṇi rakṣasāṁ bhīmakarmaṇām |nihatāni janasthāne śarair agniśikhopamaiḥ ||", "sundara_sa_iast": "caturdaśasahasrāṇi rakṣasāṁ bhīmakarmaṇām |nihatāni janasthāne śarair agniśikhopamaiḥ ||", "quality": "GOOD", "source": "DCS parallel-search (GOOD); Rām 6.82.14 (крит. изд.)", "edition_flag": "vulgate", "shloka_critical": "V.14.9", "verse_address_vulgate": ""}]}, {"verse_id": "5.16.11", "verse": "11", "sanskrit_iast": "aiśvaryaṃ vānarāṇāṃ ca durlabhaṃ vālipālitam । asyā nimitte sugrīvaḥ prāptavāṃl lokaviśrutaḥ ॥11॥", "leonov_ru": "Царство обезьян, которое нелегко получить, которым правил Валин, Из-за нее (Ситы) обрел Сугрива, прославленный в мире.", "commentary": {"tilaka": "हरिकर्णीः सिंहकर्णीः", "bhusana": "ऐश्वर्यं वानराणां च दुर्लभं वालिपालितम् ।\n\nअस्या निमित्ते सुग्रीवः प्राप्तवान् लोकसत्कृतम्", "siromani": "ऐश्वर्यमिति । वालिपालितम् अत एव दुर्लभम् अन्यैरलभ्यं वानराणामैश्वर्यं वानरनिरूपितेश्वरत्वम् अस्या निमित्ते सुग्रीवः प्राप्तवान्"}, "has_tier1": true, "notes": [{"id": "tier1:5.16.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И обезьянье царство (aiśvaryaṃ vānarāṇāṃ ca durlabhaṃ) – букв. «власть над обезьянами, которую трудно обрести»."}]}, {"verse_id": "5.16.13", "verse": "13", "sanskrit_iast": "yadi rāmaḥ samudrāntāṃ medinīṃ parivartayet । asyāḥ kṛte jagac cāpi yuktam ity eva me matiḥ ॥13॥", "leonov_ru": "Если Рама перевернет [всю] землю, простирающуюся до океана И даже [весь] мир ради нее (Ситы), думаю я, что будет это достойно [его].", "commentary": {"bhusana": "यदि रामः समुद्रान्तां मेदिनीं परिवर्तयेत्त् ।\n\nअस्याः कृते जगच्चापि युक्तमित्येव मे मतिः\nपरिवर्तयेत् अधरोत्तरां कुर्यात् । अस्याः कृते एतदर्थम् । जगच्चापि, न केवलं मेदिनीं सर्वलोकानपि परिवर्तयेदित्यर्थः", "siromani": "यदीति । अस्याः कृते प्राप्तये समुद्रान्तां मेदिनीं जगत् त्रिलोकीं वा परिवर्तयेत् भ्रामयेत् तर्हि युक्तमेव इति मे मतिर्निश्चयः"}, "has_tier1": true, "notes": [{"id": "tier1:5.16.13:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «me matiḥ» Опущено"}]}, {"verse_id": "5.16.14", "verse": "14", "sanskrit_iast": "rājyaṃ vā triṣu lokeṣu sītā vā janakātmajā । trailokyarājyaṃ sakalaṃ sītāyā nāpnuyāt kalām ॥14॥", "leonov_ru": "Власть над тремя мирами или Сита, дочь Джанаки? Вся власть над тремя мирами не стоит и малой части (даже мизинца) Ситы.", "commentary": {"bhusana": "राज्यं वा त्रिषु लोकेषु सीता वा जनकात्मजा ।\n\nत्रैलोक्यराज्यं सकलं सीताया नाप्नुयात् कलाम्\nराज्यं वेति । राज्यमुत्कृष्टं वा सीता उत्कृष्टा वा, इति विचार्यमाणा इति शेषः । कलां लेशम्", "siromani": "तत्र हेतुमाह-- राज्यमिति । त्रिषु लोकेषु राज्यमधिकमिति शेषः, सीता वा ऽधिकेति विचार्यमाणे सतीति शेषः, सकलं त्रैलोक्यराज्यं सीतायाः कलां  शोडशांशमपि नाप्नुयात्"}, "has_tier1": false, "notes": [{"id": "lexical:5.16.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kalā", "note_ru": "Кала (kalā, f.) — «шестнадцатая доля» (от √kal-, «считать», MW: kalā '1/16 of anything; a digit of the moon'). В 16.14 говорится, что власть над тремя мирами «не стоит и kalā Ситы» — не «мизинца» (как иногда переводят), а именно шестнадцатой доли: kalā — наименьшая неделимая мера в системе счисления лунных фаз (moon = 16 kalā; new moon = 1 kalā). Это технический термин квантования ценности: Сита превосходит trilokarājya не в разы, а на принципиально иной шкале — её ценность несопоставима ни с какой политической властью. «Не стоит и калы» = «не достигает даже минимальной единицы».", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:kalA"}]}, {"verse_id": "5.16.15", "verse": "15", "sanskrit_iast": "iyaṃ sā dharmaśīlasya janakasya mahātmanaḥ । sutā maithilarājasya sītā bhartṛdṛḍhavratā ॥15॥", "leonov_ru": "Такова она, дочь праведного Джанаки, великого духом, Царя Митхилы Сита, стойкая в верности мужу.", "commentary": {"bhusana": "इयं सा धर्मशीलस्य मैथिलस्य महात्मनः ।\n\nसुता जनकराजस्य सीता भर्तृदृढव्रता"}, "has_tier1": false, "notes": [{"id": "crosstext:5.16.15:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "dharmaśīla", "note_ru": "Дхармашила (dharmaśīla) — «нравом привязанный к дхарме»: в Бала-канде 1.6.9 эпитет идеальных жителей Айодхьи. В Сундаре (V.16.15) им наделён Джанака, отец Ситы (dharmaśīlasya janakasya). Перенос «идеально-дхармического» эпитета с горожан Рамы на тестя подчёркивает праведность рода Митхилы.\n\nПараллель — Rām. Bāla 1.6.9:\n  «sarve narāśca nāryaśca dharmaśīlāḥ susaṃyatāḥ । uditāḥ śīlavṛttābhyāṃ maharṣaya ivāmalāḥ ॥9॥»\n  Добродетельные мужья и жены Славились своим поведением, Были привязаны друг к другу, Безгрешны, как великие риши.", "type": "А", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.16.15", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.6.9 (Гринцер, пер. изд. I–III)"}]}, {"verse_id": "5.16.16", "verse": "16", "sanskrit_iast": "utthitā medinīṃ bhittvā kṣetre halamukhakṣate । padmareṇunibhaiḥ kīrṇā śubhaiḥ kedārapāṃsubhiḥ ॥16॥", "leonov_ru": "Родилась (вышла) она, разорвав землю на поле, вспаханном плугом, Покрытая благой земной пылью, словно лотосовой пыльцой.", "commentary": {"bhusana": "उत्थिता मेदिनीं भित्त्वा क्षेत्रे हलमुखक्षते ।\n\nपद्मरेणुनिभैः कीर्णा शुभैः केदारपांसुभिः ।। 4.16.16।।\n\nभर्तृदृढव्रता भर्तिरि दृढव्रता । केदारपांसुभिः यज्ञक्षेत्रपांसुभिः ।। 4.16.15.16।।\n\nविक्रान्तस्यार्यशीलस्य संयुगेष्वनिवर्तिनः ।\n\nस्नुषा दशरथस्यैषा ज्येष्ठा राज्ञो यशस्विनी"}, "has_tier1": false, "notes": [{"id": "lexical:5.16.16:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sītā (utthitā medinīm bhittvā)", "note_ru": "Сита рождается из земли (16.16): «utthitā medinīṃ bhittvā kṣetre halamukhakṣate» — «вышедшая, разорвав землю, с поля, вспаханного лемехом». Это единственная в книге V прямая отсылка к рождению Ситы. Имя Sītā — «борозда» (санскр. sītā, f., «борозда плуга», MW: sītā 'a furrow; the goddess of agriculture'). Имя — прямой дейктик на origin: Сита буквально — «та, что вышла из борозды», богиня земледелия, олицетворение плодородной земли. Хануман называет это, чтобы обосновать её ценность: она — порождение самой Земли (Bhūmi), богини-матери. Подстрочник «родилась, разорвав землю» — верно, но не связывает с именем.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:sItA"}]}, {"verse_id": "5.16.1718", "verse": "1718", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "आर्यशीलस्य श्रेष्ठस्वभावस्य"}, "has_tier1": false, "notes": [{"id": "lexical:5.16.1718:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "daśaratha", "note_ru": "Дашаратха (daśaratha) — Дашаратха (daśa-ratha «десять колесниц»), отец Рамы; умер от горя после изгнания сына. см. примеч. к I.1.8 (Гринцер).", "type": "В", "subtype": "base", "trigger": "crossref", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "anchor_verse_id": "5.16.17"}]}, {"verse_id": "5.16.18", "verse": "18", "sanskrit_iast": "dharmajñasya kṛtajñasya rāmasya viditātmanaḥ । iyaṃ sā dayitā bhāryā rākṣasīvaśam āgatā ॥18॥", "leonov_ru": "Благочестивого, знающего, что правильно, прославленного Вот она, возлюбленная жена, попавшая во власть ракшаси.", "commentary": {"bhusana": "धर्मज्ञस्य कृतज्ञस्य रामस्य विदितात्मनः ।\n\nइयं सा दयिता भार्या राक्षसीवशमागता", "siromani": "इयमिति । भर्तृदृढव्रतेयं सीता हलमुखेन क्षते आकृष्टे क्षेत्रे मेदिनीं भित्त्वा पद्मरेणुनिभैः केदारपांसुभिः कीर्णां व्याप्ता सती उत्थिता । श्लोकद्वयमेकान्वयि ।। 5.16.15,16 ।।\n\nविक्रान्तस्येति । विक्रान्तस्य अतिपराक्रमविशिष्टस्य आर्यशीलस्य क्षत्रियपरमधर्मप्रवृत्तिस्वभावस्य अत एव संयुगेषु संग्रामेषु अनिवर्तिनो दशरथस्य एषा ज्येष्ठा स्नुषा धर्मज्ञस्य रामस्य दयिता अतिप्रिया भार्या इयं सीता राक्षसीवशम् आगता प्राप्ता । श्लोकद्वयमेकान्वयि ।। 5.16.17,18 ।।\n\nसर्वानिति । भर्तृस्नेहबलात् सर्वान् भोगान् परित्यज्य कष्टानि अचिन्तयित्वा च कृता सहगमनविषयकप्रयत्नवती सीता वनं प्रविष्टा"}, "has_tier1": true, "notes": [{"id": "tier1:5.16.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Рамы, себя обуздавшего, закон и обычаи знающего (dharmajñasya kṛtajñasya rāmasya viditātmanaḥ) – букв. «знающего Дхарму, знающего правильное поведение Рамы, обуздавшего себя»."}]}, {"verse_id": "5.16.19", "verse": "19", "sanskrit_iast": "sarvān bhogān parityajya bhartṛsnehabalāt kṛtā । acintayitvā kaṣṭāni praviṣṭā nirjanaṃ vanam ॥19॥", "leonov_ru": "Отказавшись от всех наслаждений, влекомая силой любви к мужу, Не подумав о лишениях, вошла [она] в безлюдный лес.", "commentary": {"bhusana": "सर्वान् भोगान् परित्यज्य भर्तृस्नेहबलात्कृता ।\n\nअचिन्तयित्वा दुःखानि प्रविष्टा निर्जनं वनम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.16.19:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bhartṛsneha", "note_ru": "Бхартрисниха (bhartṛ-sneha, m.) — тат-пуруша: bhartṛ «кормилец, муж» (от √bhṛ-, «нести, кормить», Whitney #148; MW: bhartṛ 'a husband; a master') + sneha «маслянистость, липкость → любовь» (√sneh-, MW: sneha 'oiliness; love, affection'). MW фиксирует sneha как любовь через метафору масла: как масло прилипает, так и привязанность «держит» людей вместе. В 16.19 Сита «влекомая balāt bhartṛsneha» — «силой привязанности-масла к мужу» последовала в лес. Etimological image sneha = «маслянистость» создаёт тактильную метафору любви как вязкого вещества, которое удерживает. Подстрочник «силой любви к мужу» — верен, но теряет тактильную физику образа.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:sneha+dic_mw:bhartf"}]}, {"verse_id": "5.16.21", "verse": "21", "sanskrit_iast": "seyaṃ kanakavarṇāṅgī nityaṃ susmitabhāṣiṇī । sahate yātanām etām anarthānām abhāginī ॥21॥", "leonov_ru": "Вот она, чье тело золотого цвета, всегда говорящая с ясной улыбкой, Терпит она эту пытку, не заслуживающая несчастья.", "commentary": {"tilaka": "उत्तमभूषणजशोभाहीनामपि भर्तृवात्सल्येन तत्प्रियत्वेन शोभावतीम् । विनाकृतां रहिताम्", "bhusana": "सेयं कनकवर्णाङ्गी नित्यं सुस्मितभाषिणी ।\n\nसहते यातनामेतामनर्थानामभागिनी\nयातनां तीव्रवेदनाम् । अनर्थानामभागिनी आपदामनर्हेत्यर्थः"}, "has_tier1": false, "notes": [{"id": "crosstext:5.16.21:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "yātanā", "note_ru": "Сита, «золотистая телом … терпящая [эту] пытку (yātanā), не заслужившая несчастья» (16.21), — эпический прообраз кавья-вирахини (жены в разлуке). Канонический её портрет — Якшини «Мегхадуты»: «ādhikṣāmāṃ virahaśayane saṃniṣaṇṇaikapārśvāṃ prācīmūle tanum iva kalāmātraśeṣāṃ himāṃśoḥ» (Мегха II.29) — «исхудалую, на ложе разлуки лежащую на одном боку, как узкий серп луны на востоке». Калидаса доводит до совершенства тип «верная жена, истаявшая в разлуке», эпическим архетипом которого служит именно Сита. Параллель показывает, что описание измученной Ситы — исток кавья-топоса вирахини.", "type": "В", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.16.21", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Meghadūta II.29 (Kālidāsa)"}]}, {"verse_id": "5.16.22", "verse": "22", "sanskrit_iast": "imāṃ tu śīlasaṃpannāṃ draṣṭum icchati rāghavaḥ । rāvaṇena pramathitāṃ prapām iva pipāsitaḥ ॥22॥", "leonov_ru": "Ее, наделенную добродетелью, видеть желает Рагхава, Измученную Раваной, словно жаждущий – источник. (Ее, наделенную добродетелью, измученную Раваной, Видеть желает Рагхава, словно жаждущий – источник).", "commentary": {"tilaka": "पयोदान्ते वर्षान्ते । अनेन दुःखस्यात्यल्पावशिष्टत्वं सूच्यते", "bhusana": "इमां तु शीलसम्पन्नां द्रष्टुमर्हति राघवः ।\n\nरावणेन प्रमथितां प्रपामिव पिपासितः"}, "has_tier1": false, "notes": [{"id": "lexical:5.16.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "prapā", "note_ru": "Прапа (prapā, f.) — «придорожный водоём, цистерна с питьевой водой» (pra+√pā-, «пить», MW: prapā 'a place where water is distributed gratis; a drinking-booth'). Не просто «источник»: prapā — специфически благотворительный объект, dharmic institution: ставить prapā у дороги в жаркий сезон = обязанность состоятельного человека. В 16.22 Рама ищет Ситу «словно жаждущий ищет prapā» — образ строится на dharmic resonance: Сита для Рамы — не вода вообще, а именно prapā, законный источник утоления его духовной жажды. Simile вводит дхармический регистр в то, что выглядит как чисто эмоциональное желание.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:prapA"}]}, {"verse_id": "5.16.26", "verse": "26", "sanskrit_iast": "bhartā nāma paraṃ nāryāḥ śobhanaṃ bhūṣaṇād api । eṣā hi rahitā tena śobhanārhā na śobhate ॥26॥", "leonov_ru": "Воистину, муж для женщины – украшение превыше прочих. Воистину, она, лишившись его, не сияет, [хотя] достойна украшений.", "commentary": {"tilaka": "राघवं नमश्चके इति । भगवतो राघवस्यानुग्रहादेवेयं मया दृष्टेति पुनः पुनः स्मृत्वा नमस्कारः", "bhusana": "भर्ता नाम परं नार्या भूषणं भूषणादपि ।\n\nएषा तु रहिता तेन भूषणार्हा न शोभते", "siromani": "भर्तेति । भर्ता भूषणादप्यधिकं भार्याशोभनं स्त्रीशोभाहेतुः अतः शोभनार्हा ऽपि एषा सीता तेन रामेण रहिता सती न शोभते"}, "has_tier1": false, "notes": [{"id": "lexical:5.16.26:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "bhūṣaṇa (bhartā paraṃ nāryāḥ)", "note_ru": "В 16.26 сформулирован афоризм: «bhartā nāma paraṃ nāryāḥ śobhanaṃ bhūṣaṇād api» — «Воистину муж для женщины — украшение превыше [телесного] украшения». Bhūṣaṇa (n.) — «украшение» (√bhūṣ-, «украшать», MW). Стих строится как силлогизм: Сита «śobhanārhā» («достойная сиять»), но без bhartṛ-bhūṣaṇa не сияет. Bhartṛ здесь осмысляется как метафизическое «украшение»: он придаёт ей статус и свет (śobhā) независимо от физических ābharaṇa. Это философский тезис о dhārmika природе брачного союза: муж = онтологический ornament жены, а не социальная принадлежность.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:BUzaNa+dic_mw:Sobha"}]}, {"verse_id": "5.16.28", "verse": "28", "sanskrit_iast": "imām asitakeśāntāṃ śatapatranibhekṣaṇām । sukhārhāṃ duḥkhitāṃ jñātvā mamāpi vyathitaṃ manaḥ ॥28॥", "leonov_ru": "Черноволосую Ситу, чьи глаза подобны лотосам, Достойную счастья, [но] страдающую узнав, у меня тоже содрогнулась душа. (Когда я понял, что это Сита, чьи глаза подобны лотосам, достойная счастья, [но] страдающая, и моя душа содрогнулась).", "commentary": {"bhusana": "इमामसितकेशान्तां शतपत्रनिभेक्षणाम् ।\n\nसुखार्हां दुःखितां दृष्ट्वा ममापि व्यथितं मनः", "siromani": "इमामिति । असिताः कृष्णाः केशाः यस्याः तां, तां प्रसिद्धां इमां दुःखितां ज्ञात्वा ममापि मनो व्यथितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.16.28:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «sukhārhāṃ» Опущено"}]}, {"verse_id": "5.16.30", "verse": "30", "sanskrit_iast": "himahatanalinīva naṣṭaśobhā । vyasanaparamparayā nipīḍyamānā । sahacararahiteva cakravākī । janakasutā kṛpaṇāṃ daśāṃ prapannā ॥30॥", "leonov_ru": "Словно лотосовый пруд, скованный холодом, погибла ее красота. Терзают ее беды одна за другой. Словно самка чакраваки, лишенная спутника, Дочь Джанаки оказалась в жалком положении.", "commentary": {"tilaka": "क्षामां कृशाम् । विनाभरणशोभिनीमाभरणानुग्रहमनपेक्ष्यैव सौन्दर्येण शोभमानाम्", "bhusana": "हिमहतनलिनीव नष्टशोभा व्यसनपरम्परया ऽतिपीड्यामाना ।\n\nसहचररहितेव चक्रवाकी जनकसुता कृपणां दशां प्रपन्ना\nहिमहतेति । हिमहतेति विशेषणेन नलिन्याः पूर्वं बहुकालशोभितत्वं सिद्धम्, तद्वन्नष्टशोभा द्वादशवर्षं निष्प्रतिबन्धं भोगान् भुञ्जनाया आगन्तुको हि विश्लेषः तेन हि नष्टशोभेत्युक्तम् । व्यसनपरम्परया विरह इव संश्लेषोपि मध्ये नागत्य निवृत्तः व्यसनमेव नैरन्तर्येण वृत्तम् । अतिपीड्यमाना अतिक्रम्य पीड्यमाना, आश्रयाननुरूपं व्यसनमनुभवन्तीत्यर्थः । सहचररहितेव चक्रवाकी लाभकालमवगम्य दुःखं सोढुमसमर्था । चक्रवाकीसाम्येनायमर्थो लभ्यते सा हि रात्रिविरामकालं प्रबुध्य दुःखं सोढुमदक्षेति प्रसिद्धम् । जनकसुता एवं व्यसनं भविष्यतीति ज्ञात्वा न संवर्धिता, केवलं सुखसंवर्धितेत्यर्थः । कृपणां दशां प्रपन्ना । पूर्वोक्तनलिन्यादिकं नोपमानं भवितुमर्हति । किञ्चिदुक्तिमात्रम् । वाङ्मनसा ऽपरिच्छेद्यां दुर्दशां प्राप्तेत्यर्थः", "siromani": "हिमेति । व्यसनस्य दुःखस्य परम्परया निपीड्यमाना अत एव हिमेन हता नलिनी कमलिनी इव जनकसुता सहचरेण चक्रकेण रहिता चक्रवाकीव कृपणां शोचनीयां दशां प्राप्ता"}, "has_tier1": false, "notes": [{"id": "lexical:5.16.30:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "cakravākī", "note_ru": "Чакраваки (cakravākī, f.) — самка чакраваки (Anas casarca). В 16.30 Сита уподоблена «cakravākī, rahitā sahacareṇa» — «самке чакраваки, лишённой спутника». Ср. 14.24 (самцы чакравак в пруду Раваны): там образ вводился как «влюблённые птицы», здесь — как лишённая пары. Двойная отсылка к cakravāka создаёт рамку вокруг «Аśoka-rощи»: войдя, Хануман видит пары (14.24); покидая образ Ситы, он видит её как cakravākī без пары (16.30). Символика разлучённых птиц замыкает главы 14–16 как единый образный цикл.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:cakravAkI"}]}, {"verse_id": "5.16.31", "verse": "31", "sanskrit_iast": "asyā hi puṣpāvanatāgraśākhāḥ । śokaṃ dṛḍhaṃ vai janayaty aśokāḥ । himavyapāyena ca śītaraśmir । abhyutthito naikasahasraraśmiḥ ॥31॥", "leonov_ru": "У нее ашоки, кончики ветвей которых склонились под [тяжестью] цветов Рождают, воистину, [только] глубокую скорбь, И [также рождает скорбь] хладнолучистая (луна) в конце зимы, Поднявшаяся в небо [и сияющая] тысячами лучей».", "commentary": {"bhusana": "अस्या हि पुष्पवनताग्रशाखाः शोकं दृढं वै जनयन्त्यशोकाः ।\n\nहिमव्यपायेन च मन्दरश्मिरभ्युत्थितो नैकसहस्ररश्मिः", "siromani": "अस्या इति । पुष्पैरवनताः अग्रशाखाः येषां ते अस्याः वनिकायाः अशोकाः हिमव्यपायेन अतिहिमस्याभावात् अभ्युत्थितः प्रकाशितः अनेकसहस्ररश्मिः चन्द्रश्च अस्याः सीतायाः दृढं शोकं जनयन्ति"}, "has_tier1": true, "notes": [{"id": "tier1:5.16.31:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «sahasraraśmiḥ» Опущено[Е. Костина] «И луна на исходе зимыБольше не радует душу Ситы».» По Г-пресс - прохладный лунный свет для нее жарок, как солнечный. Не знаю, где они это взяли"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s16_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

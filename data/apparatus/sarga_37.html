ype": "lexical", "trigger": "etymology", "source": "dic_mw:kftAnta", "collision_tier1": true}, {"id": "phase2:5.37.3:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": false, "status": "принято гейтом М.Г. (2026-07-03)", "mg_comment": "важное дополнение Костиной", "lemma_iast": "kṛtāntaḥ parikarṣati", "note_ru": "По Широмани, за общим утверждением о всесильности рока скрыт конкретный намёк: раз судьба одинаково властна и над величием (aiśvarya), и над бедствием (vyasana), из этого следует, что и всемогущество Раваны обречено рухнуть — «этим предвещается неизбежная гибель Раваны» (rāvaṇavidhvaṃso 'vaśyaṃ bhaviteti sūcitam).", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "Вскрывает подтекст-предвестие гибели Раваны за общей сентенцией о роке — экзегетический слой.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}}]}, {"verse_id": "5.37.4", "verse": "4", "sanskrit_iast": "vidhir nūnam asaṃhāryaḥ prāṇināṃ plavagottama । saumitriṃ māṃ ca rāmaṃ ca vyasanaiḥ paśya mohitān ॥4॥", "leonov_ru": "Конечно, судьба неодолима для живых существ, о лучший из обезьян. Посмотри на сына Сумитры, меня и Раму, пребывающих в смятении из-за бед.", "commentary": {"siromani": "हनूमन्तं प्रति सीतोक्तिमाह सेत्यादिभिः । सीता वचनं हनुमद्वाक्यं श्रुत्वा हनूमन्तमुवाच । तदाकारमाह अमृतमित्यादिभिः । हे वानर अन्यमना रामो नेति यत् शोकपरायणो ऽस्तीति यच्च त्वयाभिमाषितं तत् विषसंपृक्तं विषेण संमिश्रम् अमृतं प्रतीयते इति शेषः ।। 5.37.1,2 ।।\n\nइदानीं रावणस्य अत्यैश्वर्यवत्त्वे ऽपि विध्वंसो भविष्यतीति बोधयन्ती आह ऐश्वर्य इति । ऐश्वर्ये व्यसने वा विद्यमानं पुरुषं रज्ज्वा बद्ध्वैव कृतान्तः कालः परिकर्षति । ताभ्यामन्यत्र करोतीत्यर्थः । एतेन रावणविध्वंसो ऽवश्यं भवितेति सूचितम्\nविधिरिति । विधिः परमात्मनियोगः प्राणिनाम् असंहार्यः अपरिहरणीयः अत एव सौमित्रिप्रभृतीन् व्यसनैः वियोगदुःखैः मोहितान् पश्य", "tilaka": "विधिर्दैवम् । असंहार्यो ऽशक्यप्रतिक्रियः । अत्र स्वीयमेव दुःखं दृष्टान्तयति", "bhusana": "विधिर्नूनमसंहार्थः प्राणिनां प्लवगोत्तम ।\n\nसौमित्रिं मां च रामं च व्यसनैः पश्य मोहितान्"}, "has_tier1": false, "notes": [{"id": "lexical:5.37.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vidhi", "note_ru": "Видхи (vidhi, m., √dhā- «устанавливать», vi-√dhā) — «установление, предписание, судьба». MW: vidhi m. 'rule, precept; fate, destiny'. Отличие от kṛtānta: vidhi — безличная норма, тогда как kṛtānta — действующий деятель. Сита использует оба термина в соседних стихах, нарастающий образ тотальной несвободы.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:viDi"}]}, {"verse_id": "5.37.5", "verse": "5", "sanskrit_iast": "śokasyāsya kathaṃ pāraṃ rāghavo 'dhigamiṣyati । plavamānaḥ parikrānto hatanauḥ sāgare yathā ॥5॥", "leonov_ru": "Как Рагхава достигнет другого берега бед, Словно тот, чей корабль разбился, плывущий в океане?", "commentary": {"tilaka": "हतनौः पुरुषः परिक्रान्तः कृतपराक्रमो बाहुभ्यां प्लवमानो यथा सागरे पारमतिक्लेशेनाधिगच्छति तथा राघवो ऽपि कथञ्चित्तमधिगमिष्यति ।। 5.37.5,6 ।।\n\nस रामः ।। 5.37.7,8 ।।\n\nनिर्यातनं पुनः समर्पणम्, न च तत् तस्मिन्नित्यर्थः ।। 5.37.9,10 ।।\n\nकन्या ऽजातपुरुषसंबन्धा । एतद्विभीषणानुनयनम्, इदमेवाग्रे रामश्रुतं विभीषणस्य निःशङ्कपरिग्रहाभिषेकयोर्बीजम् ।। 5.37.11,12 ।।\n\nरामक्षयम् रक्षसां रामात्क्षयं प्राप्तमित्यर्थः\nशरजालेत्यादि परम्परितरूपकमिदम् ।। 5.37.18,19 ।।\n\nमह्यं मम मत्तो वा", "bhusana": "शोकस्यास्य कदा पारं राघवो ऽधिगमिष्यति ।\n\nप्लवमानः परिश्रान्तो हतनौः सागरे यथा", "siromani": "शोकस्येति । सागरे हता विनष्टा नौर्यस्य अत एव प्लवमानः बाहुभ्यां संतरन् परिक्रान्तः अतिपराक्रमवान् पुरुष इव शोकस्य सागरे प्लवमानो राघवः शोकस्य पारं कदा अधिगमिष्यति"}, "has_tier1": false, "notes": [{"id": "lexical:5.37.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "hata-nau", "note_ru": "Хатанау (hata-nau, m.) — «тот, чей корабль разбился» (hata p.p.p. √han- «убивать, уничтожать» + nau f. «лодка, корабль», родит. «разбитый-корабль»). MW: nau f. 'a ship, boat'. Сравнение с hatanauḥ sāgare plavamāna — погибший в открытом море без ориентира. Образ подчёркивает не просто горе, а именно потерю средства спасения: без Рамы у Ситы нет «корабля» для переправы через «океан несчастий».", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:nO"}]}, {"verse_id": "5.37.7", "verse": "7", "sanskrit_iast": "sa vācyaḥ saṃtvarasveti yāvad eva na pūryate । ayaṃ saṃvatsaraḥ kālas tāvad dhi mama jīvitam ॥7॥", "leonov_ru": "Должно сказать ему: «Поспеши», ведь пока не истек Этот год, лишь до той поры я буду жива.", "commentary": {"bhusana": "स वाच्यः सन्त्वरस्वेति यावदेव न पूर्यते ।\n\nअयं संवत्सरः कालस्तावद्धि मम जीवितम्", "siromani": "स इति । संवत्सरः द्वादशमासात्मको ऽयं कालः यावन्न पूर्यते तावदेव मम जीवितम् अतः संत्वरस्वेति स रामः त्वया वाच्यः"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Пока этот год не кончится» Нужен комментарий, почему так. В Сундараканде про изначальный срок нигде не говорилось, фигурировали только 2 месяца, поэтому читателю может быть непонятно (если там, где 2 месяца, не будет разъяснено)"}, {"id": "lexical:5.37.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "saṃvatsara", "note_ru": "Самватсара (saṃvatsara, m.) — «полный год», от sam- + vat + sara; ведийский термин для ритуального счёта времени. MW: saṃvatsara m. 'a full year'. Не просто «год» — а ритуально-юридический срок: samaya (уговор с Раваной) истекает через год. Кульминационный временно́й маркер всей книги V.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:saMvatsara", "collision_tier1": true}]}, {"verse_id": "5.37.10", "verse": "10", "sanskrit_iast": "mama pratipradānaṃ hi rāvaṇasya na rocate । rāvaṇaṃ mārgate saṃkhye mṛtyuḥ kālavaśaṃ gatam ॥10॥", "leonov_ru": "Не по нраву Раване отдавать меня обратно. Равану, попавшего во власть смерти (рока), ищет смерть в бою.", "commentary": {"bhusana": "मम प्रतिप्रदानं हि रावणस्य न रोचते ।\n\nरावणं मार्गते सङ्ख्ये मृत्युः कालवशं गतम्", "siromani": "ममेति । कालवशं गतं रावणं संख्ये संग्रामे मृत्युर्मार्गते अत एव रावणस्य मम प्रतिपदानं न रोचते"}, "has_tier1": false, "notes": [{"id": "lexical:5.37.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pratipradāna", "note_ru": "Прати-прадана (prati-pra-dāna, n.) — «возвращение, отдача обратно» (prati «обратно» + pra-√dā «давать»). MW: pratidāna n. 'a return gift; restoring'. Юридический термин: pratipradāna — «выдача обратно» — используется в контексте спора/выкупа. Равана «не хочет возвращать» — формульное нарушение dharmic обязательства обмена.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:pratidAna"}]}, {"verse_id": "5.37.11", "verse": "11", "sanskrit_iast": "jyeṣṭhā kanyānalā nama vibhīṣaṇasutā kape । tayā mamaitad ākhyātaṃ mātrā prahitayā svayam ॥11॥", "leonov_ru": "Старшая дочь Вибхишаны по имени Каньянала, о обезьяна, Об этом рассказала мне, посланная своею матерью.", "commentary": {"bhusana": "ज्येष्टा कन्या ऽनला नाम विभीषणसुता कपे ।\n\nतया ममेदमाख्यातं मात्रा प्रहितया स्वयम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «kape» Опущено обращение. Я понимаю, почему это делается, но, вероятно, не помешает комментарий. Далее также отмечу на всякий случай"}, {"id": "lexical:5.37.11:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "kanyā", "note_ru": "Кандия-нала: kanyā f. «незамужняя девица, дочь» (к √kan- «сиять»). MW: kanyā f. 'an unmarried girl; daughter'. Значимо, что информатором Ситы служит kanyā (незамужняя) — подчёркивает чистоту источника; дочь — ещё не связанная пиéтетом перед Раваной как тесть.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:kanyA", "collision_tier1": true}]}, {"verse_id": "5.37.12", "verse": "12", "sanskrit_iast": "avindhyo nāma medhāvī vidvān rākṣasapuṃgavaḥ । dhṛtimāñ сhīlavān vṛddho rāvaṇasya susammataḥ ॥12॥", "leonov_ru": "Мудрый и знающий бык среди ракшасов по имени Авиндхья Стойкий и добродетельный старец, чтимый Раваной,", "commentary": {"bhusana": "[अविन्ध्यो नाम मेधावी विद्वान् राक्षसपुङ्गवः ।\n\nद्युतिमाञ्छीलवान् वृद्धो रावणस्य सुसंमतः ।।\n\nरामक्षयमनुप्राप्तं रक्षसां प्रत्यचोदयत् ।\n\nन च तस्य स दुष्टात्मा शृणोति वचनं हितम् ।।]\n\nअसंशयं हरिश्रेष्ठ क्षिप्रं मां प्राप्स्यते पतिः ।\n\nअन्तरात्मा हि मे शुद्धस्तस्मिंश्च बहवो गुणाः"}, "has_tier1": false, "notes": [{"id": "phase2:5.37.12:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": false, "status": "принято гейтом М.Г. (2026-07-03)", "mg_comment": "", "lemma_iast": "avindhyaḥ", "note_ru": "По Тилаке, эпизод с Авиндхьей и Каньяналой — не случайная деталь: он называет его bīja, «семенем», из которого в дальнейшем повествовании вырастет решение Вибхишаны безоговорочно перейти на сторону Рамы и принять от него помазание на царство.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Тилака маркирует эпизод как «семя» будущего перехода Вибхишаны — нарративная связка для читателя целого.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}}]}, {"verse_id": "5.37.14", "verse": "14", "sanskrit_iast": "āśaṃseyaṃ hariśreṣṭha kṣipraṃ māṃ prāpsyate patiḥ । antarātmā hi me śuddhas tasmiṃś ca bahavo guṇāḥ ॥14॥", "leonov_ru": "Надеюсь я, о лучший из обезьян, что скоро обретет меня [мой] господин, Ибо чиста душа моя, и много у него благих достоинств.", "commentary": {"tilaka": "पतिः प्राप्स्यत इत्यत्र हेतुः-- अन्तरात्मेति । तस्मिन्रामे", "siromani": "नन्वेतत्त्वया कथं ज्ञातमित्यत आह ज्येष्ठेति । विभीषणसुता विभीषणादुत्पन्ना अनला नाम ज्येष्ठा कन्या ऽस्तीति शेषः । मात्रा अभिहितया कथितया तया अनलया मम समीपे एतत् स्वयमाख्यातं कथितम्\nननु पृष्ठारोहणमात्रेण कथं दुःखापगमो भविष्यतीत्यत आह त्वामिति । सरावणां रावणसहितां लङ्कां वोढुं हि यतो मे शक्तिरस्ति अतः पृष्ठगतां त्वां कृत्वा सागरं संतरिष्यामि"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.14:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «hariśreṣṭha» Опущено обращение"}, {"id": "lexical:5.37.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "antarātman", "note_ru": "Антаратман (antar-ātman, m.) — «внутренняя душа, совесть»: antar «внутри» + ātman «самость». MW: antarātman m. 'the inmost soul, the internal feelings'. Различается с ātman (самость вообще) и jīva (жизненное начало) — antarātman — именно нравственно-оценивающий внутренний голос. Сита апеллирует к нему как к доказательству своей невиновности: «чиста моя antarātman».", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:antarAtman", "collision_tier1": true}]}, {"verse_id": "5.37.15", "verse": "15", "sanskrit_iast": "utsāhaḥ pauruṣaṃ sattvam ānṛśaṃsyaṃ kṛtajñatā । vikramaś ca prabhāvaś ca santi vānara rāghave ॥15॥", "leonov_ru": "Сила, мужество, энергия, милосердие, благодарность, Доблесть и мощь есть у Рагхавы, о обезьяна.", "commentary": {"bhusana": "उत्साहः पौरुषं सत्त्वमानृशंस्यं कृतज्ञता ।\n\nविक्रमश्च प्रभावश्च सन्ति वानर राघवे", "tilaka": "उत्साहः कार्येषु स्थिरप्रयत्नरूप उद्योगः पौरुषं तज्जन्यं पुरुषव्यापारः सत्त्वं बलम् आनृशंस्यमक्रूरता श्रितजनदाक्षिण्यमिति यावत् । विक्रमः शौर्यम् प्रभावो दिव्यास्त्रसंपज्जन्यो महिमा", "siromani": "गुणानेवाह उत्साह इति । उत्साहादयः राघवे सन्ति"}, "has_tier1": false, "notes": [{"id": "lexical:5.37.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ānṛśaṃsya", "note_ru": "Анришансья (ānṛśaṃsya, n.) — «несвирепость, милосердие» (ā + nṛ + śaṃsa + ya; от nṛśaṃsa «жестокий» с ā-негативом). MW: ānṛśaṃsya n. 'freedom from cruelty, kindness'. Стих перечисляет добродетели Рамы: utsāha, pauruṣa, sattva, ānṛśaṃsya, kṛtajñatā, vikrama, prabhāva — семь качеств. ānṛśaṃsya — необычное слово: это не просто «доброта», но отсутствие жестокости как системное качество.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:AnfSaMsya"}]}, {"verse_id": "5.37.1522", "verse": "1522", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "न स इति । तुलयितु चालयितुम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.37.1522:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "saṃtaraṇa", "note_ru": "Самтарана (saṃ-taraṇa, n.) — «переправа через, одоление» — «переправлюсь через, одолею» (sam + √tṛ- «переправляться через реку/препятствие»). MW: tṝ/tara 'to cross over, to overcome'. sam-√tṛ- = полная переправа с интенсивирующим sam-: Хануман обещает не просто «плыть», а завершить переправу с Ситой на спине. Архаичный глагол, обычный для переправы через космические препятствия (океан, смерть).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:tara", "anchor_verse_id": "5.37.22"}]}, {"verse_id": "5.37.17", "verse": "17", "sanskrit_iast": "na sa śakyas tulayituṃ vyasanaiḥ puruṣarṣabhaḥ । ahaṃ tasyānubhāvajñā śakrasyeva pulomajā ॥17॥", "leonov_ru": "Невозможно сокрушить бедами этого быка среди людей, Я знаю его величие (решимость), как дочь Пуломы (Шачи) – Индры.", "commentary": {"bhusana": "न स शक्यस्तुलयितुं व्यसनैः पुरुषर्षभः ।\n\nअहं तस्य प्रभावज्ञाशक्रस्येव पुलोमजा\nइति संजल्पमानां तां रामार्थे शोककर्शिताम् ।\n\nअश्रुसम्पूर्णनयनामुवाच वचनं कपिः", "siromani": "नेति । स रामः व्यसनैः व्यसनप्रापकराक्षसैः तुलयितुं तोलयितुं न शक्यः शक्रस्य पुलोमजेव तस्य रामस्य अनुभावज्ञाहमस्मि\nअवशिष्टमासं बोधयन्ती आह वर्तत इति । रावणेन यः समयो मम समीपे कृतः तस्य दशमो मासो वर्तते द्वौ तु शेषौ वर्तेते"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Шачи» Комм. про pulomajā[Е. Костина] «kape» Опущено обращение"}, {"id": "lexical:5.37.17:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pulomajā", "note_ru": "Пуломаджā (Pulomajā, f.) — «дочь Пуломы» = Шачи, супруга Индры. Пуломан (Puloman) — асур, отец Шачи; по Махабхарата (Ādiparvan), Пуломан похитил невесту Индры, но Индра вернул её и убил Пуломана. MW: Pulomajā f. 'daughter of Puloman = Śacī, wife of Indra'. Параллель структурная: Сита знает могущество Рамы так же, как Шачи — Индры: это уподобление «законной жены, знающей силу мужа» прописано через прецедент.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:pulomajA", "collision_tier1": true}]}, {"verse_id": "5.37.18", "verse": "18", "sanskrit_iast": "śarajālāṃśumāñ chūraḥ kape rāmadivākaraḥ । śatrurakṣomayaṃ toyam upaśoṣaṃ nayiṣyati ॥18॥", "leonov_ru": "Отважный Рама-солнце, сияющий сетью стрел, о обезьяна, Высушит воду, состоящую из врагов-ракшасов».", "commentary": {"bhusana": "शरजालांशुमाञ्छूरः कपे रामदिवाकरः ।\n\nशत्रुरक्षोमयं तोयमुपशोषं नयिष्यति", "siromani": "शरेति । हे कपे शरजालांशुमान् शरसमूहरूपकिरणविशिष्टः रामदिवाकरः रामसूर्यः शत्रुरक्षोमयं शत्रुरूपाराक्षसप्रचुरं तोयम् उपशोषं नयिष्यति नेष्यति प्रापयिष्यति"}, "has_tier1": false, "notes": [{"id": "lexical:5.37.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "divākara", "note_ru": "Дивакара (divā-kara, m.) — «делающий день» (divā «днём» + kara «делатель», √kṛ-) = эпитет Солнца. MW: divākara m. 'the sun'. Рама как divākara — многозначная метафора: (1) солнце сушит воду («врагов-ракшасов» = rakṣo-maya-toya); (2) солнце рассеивает тьму; (3) солнце одно, незаменимо. Стрелы Рамы = лучи (śara-jāla-aṃśu). Развёрнутое солярное уподобление.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:divAkara"}]}, {"verse_id": "5.37.21", "verse": "21", "sanskrit_iast": "athavā mocayiṣyāmi tvām adyaiva sa rākṣasāt । asmād duḥkhād upāroha mama pṛṣṭham anindite ॥21॥", "leonov_ru": "Или же я освобожу тебя сегодня от вызванной ракшасом (Раваной) Нашей беды. Садись мне на спину, о безупречная.", "commentary": {"bhusana": "त्वां तु पृष्ठगतां कृत्वा सन्तरिष्यामि सागरम् ।\n\nशक्तिरस्ति हि मे वोढुं लङ्कामपि सरावणाम्\nअथवा मोचयिष्यामि त्वामद्यैव वरानने ।\n\nअस्माद्दुःखादुपारोह मम पृष्ठमनिन्दिते", "siromani": "पक्षान्तरमाह-- अथवेति । हे अनिन्दिते मम पृष्ठम् उपारोह अतः सराक्षसात् राक्षससहितात् अस्मात् दुःखात् अद्यैव मोचयिष्यामि । किंच सो ऽहं राक्षसात् राक्षसजन्यात् दुःखात् मोचयिष्यामि"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Или сейчас от беды, / Что терпим мы из-за ракшасы (adyaiva sa rākṣasāt asmād duḥkhād) – в комментарии «Тилака» слово rākṣasāt понимается как rākṣasakṛtāt. Таким образом, rākṣasāt asmād duḥkhāt надо понимать как rākṣasakṛtād asmād duḥkhāt, то есть «из этого несчастья, вызвванного ракшасой».[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}]}, {"verse_id": "5.37.25", "verse": "25", "sanskrit_iast": "tvaddarśanakṛtotsāham āśramasthaṃ mahābalam । puraṃdaram ivāsīnaṃ nāgarājasya mūrdhani ॥25॥", "leonov_ru": "Полному решимости найти тебя, пребывающему в своей обители, обладающему великой силой, Подобно Пурандаре (Индре), восседающему на великом слоне (Айравате).", "commentary": {"tilaka": "नगराजस्य श्रेष्ठस्य प्रस्रवणगिरेरित्यर्थः", "bhusana": "त्वद्दर्शनकृतोत्साहमाश्रमस्थं महाबलम् ।\n\nपुरन्दरमिवासीनं नाकराजस्य मूर्धनि\nत्वद्दर्शनेति । नाकराजस्य मूर्धनि नाकपृष्ठसंज्ञस्य मूर्धनि । नगराजस्येति पाठे मेरोरित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "На вершине владыки гор (nagarājasya mūrdhani) – комментарий «Тилака» поясняет, что речь идет о горе Прасраване. В различных рукописях в качестве первого элемента композита могут стоять слова naga (гора); nāga (слон/наг) или naka (небо). Во втором элементе композита также могут быть разночтения: rājasya или pṛṣṭhasya. Таким образом, композит может переводиться как «на вершине неба», «на голове царя нагов» и т. п. Здесь перевод сделан по бомбейскому изданию.[Е. Костина] «.» Непонятно, почему предпочтение отдано Бомбейскому изданию. Если в качестве основного рассматривается Гита-пресс, отход от него должен как-то аргументироваться[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}, {"id": "phase2:5.37.25:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": false, "status": "принято гейтом М.Г. (2026-07-03)", "mg_comment": "Костина и традиционные комментарии об одном и том же - текстологическом уровне", "lemma_iast": "nāgarājasya mūrdhani", "note_ru": "Леонов передаёт nāgarājasya как «на [спине] великого слона» (namek на Айравату), однако Тилака и Бхушана, ссылаясь на вариант nagarājasya, поясняют иначе: «на вершине лучшей из гор», то есть Рама восседает на вершине [горы] Прасраваны подобно Индре на Меру — расхождение чтений меняет сам образ.", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "Текстологический вариант (nāga-/naga-), меняющий образ (слон Айравата vs вершина горы); перевод следует одному чтению.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}}]}, {"verse_id": "5.37.30", "verse": "30", "sanskrit_iast": "maithilī tu hariśreṣṭhāc chrutvā vacanam adbhutam । harṣavismitasarvāṅgī hanūmantam athābravīt ॥30॥", "leonov_ru": "Майтхили, услышав чудесные слова лучшего из обезьян Затрепетала от радости всем телом и так сказала Хануману.", "commentary": {"bhusana": "हनुमन् दूरमध्वानं कथं मां वोढुमिच्छसि ।\n\nतदेव खलु ते मन्ये कपित्वं हरियूथप\nमैथिली तु हरिश्रेष्ठात् श्रुत्वा वचनमद्भुतम् ।\n\nहर्षविस्मितसर्वाङ्गी हनुमन्तमथाब्रवीत्", "tilaka": "हर्षविस्मितसर्वाङ्गी हर्षपुलकितसर्वाङ्गी", "siromani": "मैथिलीति । अद्भुतं वचनं श्रुत्वा हर्षविस्मितसर्वाङ्गी मैथिली हनूमन्तमब्रीत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.30:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Затрепетала Сита (harṣavismitasarvāṅgī) – букв.: «та, у которой все тело затрепетало от радости» (harṣavismitasarvāṅgī). Автор комментария «Тилака» объясняет слово vismita (изумленный) как pulakita (на котором встали волоски – обычный в древнеиндийской поэзии образ эмоционального возбуждения)."}]}, {"verse_id": "5.37.31", "verse": "31", "sanskrit_iast": "hanūman dūram adhvanaṃ kathaṃ māṃ netum icchasi । tad eva khalu te manye kapitvaṃ hariyūthapa ॥31॥", "leonov_ru": "“Хануман, в дальний путь как меня ты хочешь унести? Это лишь твоя обезьянья природа, думаю я, о вождь обезьян.", "commentary": {"siromani": "तदाकारमाह-- श्रुत्वेति । मह्यं मम वचः क्षुत्वैव राघवः क्षिप्रमेष्यति\nतदाकारमाह-- हनूमन्निति । हे हनूमन् दूरमध्वानं वोढुं मां कथमिच्चसि इच्छा न युक्तेत्यर्थः । तत्र हेतुः यतः तत्प्रसिद्धं कपित्वं कपिसामर्थ्यं लघु मन्ये", "bhusana": "कथं वा ऽल्पशरीरस्त्वं मामितो नेतुमिच्छसि ।\n\nसकाशं मानवेन्द्रस्य भर्तुर्मे प्लवगर्षभ", "tilaka": "तदेव दृश्यमानमेव ।। 5.37.31,32 ।।\n\nनवं परिभवमल्पशरीरो ऽशक्त इत्येवंरूपम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.31:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "…обезьянья природа (kapitvam) – согласно комментарию «Широмани», Сита сомневается в способности Ханумана отнести ее к Раме. Однако более правильной представляется интерпретация Голдменов, которые под kapitvam понимают свойственное обезьянам легкомыслие («простодушную грандиозность мышления») (см.: Goldman 1984: 452). Ср. в строфе V.55.15: prathitaṃ triṣu lokeṣu //kapitvam anavasthitam («известную в трех мирах // свойственную обезьянам непоседливость»).[Е. Костина] «hariyūthapa» Опущено обращение"}]}, {"verse_id": "5.37.33", "verse": "33", "sanskrit_iast": "sītāyās tu vacaḥ śrutvā hanūmān mārutātmajaḥ । cintayām āsa lakṣmīvān navaṃ paribhavaṃ kṛtam ॥33॥", "leonov_ru": "Услышав слова Ситы, Хануман, сын Ветра, Подумал, наделенный удачей, что ему впервые нанесено оскорбление [Ситой].", "commentary": {"bhusana": "इति सञ्चिन्त्य हनुमांस्तदा प्लवगसत्तमः ।\n\nदर्शयामास वैदेह्याः स्वरूपमरिमर्दनः\nस्वरूपं स्वस्य शरीरम्", "siromani": "सीताया इति । सीतायाः वचनं श्रुत्वा कृतं सीतया संपादितं नवं प्रथमं परिभवं स्वानादरं ज्ञात्वेति शेषः । चिन्तयामास"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.33:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Впервые / Она меня оскорбила (navaṃ paribhavaṃ kṛtam) – букв. «сделана [Ситой] новая обида». В комментарии «Широмани» слово navam (новую) глоссируется как prathamam (первую)."}, {"id": "lexical:5.37.33:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "paribhava", "note_ru": "Парибхава (paribhava, m.) — «унижение, оскорбление» (pari- + √bhū- «быть»): состояние, когда тебя «обходят кругом» / не принимают в расчёт. MW: paribhava m. 'disrespect, contempt, humiliation'. Хануман воспринимает сомнение Ситы в его способности как «нового оскорбления» (navaṃ paribhavaṃ): интересно, что первая реакция — не обида, а философская оценка; nava («новый») подчёркивает, что это удивительное, беспрецедентное для него событие.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:paribhava", "collision_tier1": true}]}, {"verse_id": "5.37.35", "verse": "35", "sanskrit_iast": "iti saṃcintya hanumāṃs tadā plavagasattamaḥ । darśayām āsa sītāyāḥ svarūpam arimardanaḥ ॥35॥", "leonov_ru": "Так подумав, Хануман тогда, лучший среди обезьян, Показал Сите свой [истинный] облик, губитель врагов.", "commentary": {"siromani": "तदाकारमाह नेति । मे सत्वं बलं प्रभावं च वैदेही न जानाति तस्माद्धेतोः मम यद्रूपं तत् कामतः स्वेच्छया पश्यतु\nइतीति । प्लवगसत्तमो हनुमान् इति संचिन्य वैदेह्या वैदेह्यै स्वरूपं दर्शयामास"}, "has_tier1": false, "notes": [{"id": "crosstext:5.37.35:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "plavaga-sattama", "note_ru": "plavagasattamaḥ … arimardanaḥ («лучший из обезьян … губитель врагов») — нагнетание превосходных эпитетов Ханумана в момент явления им истинного облика. Техника нанизывания формул-эпитетов «лучший из X» (sattama) роднит Сундараканду с боевыми пассажами Махабхараты; ср. в Рамопакхьяне Ханумана-mārutātmaja, одолевающего Дхумракшу (MBh III.270.14). Параллель иллюстрирует общую для обеих эпопей формульную поэтику героического возвеличивания.", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.37.35", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparvan (Rāmopākhyāna) III.270.14"}]}, {"verse_id": "5.37.36", "verse": "36", "sanskrit_iast": "sa tasmāt pādapād dhīmān āplutya plavagarṣabhaḥ । tato vardhitum ārebhe sītāpratyayakāraṇāt ॥36॥", "leonov_ru": "Спрыгнув с того дерева мудрый бык среди обезьян Тогда начал расти, чтобы убедить Ситу.", "commentary": {"siromani": "स इति । स हनूमान् तस्याः प्रत्ययकारणात् प्रतीतिहेतोः पादपात् आप्लुत्य वर्धितुमारेभे"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.36:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "С дерева спрыгнул мудрый… (sa tasmāt pādapād dhīmān āplutya) – по контексту можно понять, что Хануман уже давно сошел с дерева.[Е. Костина] Нужно сделать здесь отсылку на строфы ранее, где это обсуждается, а там - на эту строфу"}, {"id": "phase2:5.37.36:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": false, "status": "принято гейтом М.Г. (2026-07-03)", "mg_comment": "Комментарий Тилака дополняет Костину, разные грани", "lemma_iast": "pādapād āplutya", "note_ru": "По Тилаке, Хануман нарочно спрыгивает именно с дерева на землю, прежде чем начать увеличиваться в размерах: треск ломающихся под его тяжестью ветвей выдал бы его ракшасини-стражницам, а рост на земле остаётся неслышным — деталь, которую подстрочник не проясняет.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "Объясняет постановочную деталь (спрыгивает, чтобы треск ветвей не выдал) — мотивировка, не проясняемая подстрочником.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}}]}, {"verse_id": "5.37.39", "verse": "39", "sanskrit_iast": "saparvatavanoddeśāṃ sāṭṭaprākāratoraṇām । laṅkām imāṃ sanathāṃ vā nayituṃ śaktir asti me ॥39॥", "leonov_ru": "«Есть у меня сила чтобы унести эту Ланку С ее горами и лесами, с ее башнями, стенами и арками и с ее правителем.", "commentary": {"bhusana": "सपर्वतवनोद्देशां साट्टप्रकारतोरणाम् ।\n\nलङ्कामिमां सनाथां व नयितुं शक्तिरस्ति मे"}, "has_tier1": false, "notes": [{"id": "lexical:5.37.39:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "aṭṭa", "note_ru": "Аṭṭа (aṭṭa, m.) — «башня, укреплённая платформа» (от √aṭ- «ходить кругом»): элемент крепостной архитектуры. MW: aṭṭa m. 'a building, a house; a tower or turret'. prākāra «стена», toraṇa «арка, ворота», aṭṭa «башня»: три элемента средневековой южноазиатской фортификации. Описание Ланки через её архитектуру — указание на её неприступность, которую Хануман берётся преодолеть.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:awwa"}]}, {"verse_id": "5.37.40", "verse": "40", "sanskrit_iast": "tad avasthāpya tāṃ buddhir alaṃ devi vikāṅkṣayā । viśokaṃ kuru vaidehi rāghavaṃ sahalakṣmaṇam ॥40॥", "leonov_ru": "Решайся же, довольно колебаний, царевна. Сделай беспечальными, Вайдехи, Рагхаву с Лакшманой.", "commentary": {"siromani": "तद्वचनाकारमाह-- सेत्यादिभिः । सनाथां रावणसहितामिमां लङ्कां नयितुं मे शक्तिरस्ति\nतदिति । तत् मम सामर्थ्यसत्त्वात् हेतोः बुद्धिर्निश्चयः अवस्थाप्यतां विकाङ्क्षया उपेक्षया अलं न कर्तव्यमित्यर्थः । अत एव राघवं विशोकं कुरु", "tilaka": "अवस्थाप्यतां समर्थो ऽयमिति निश्चीयताम् । विकाङ्क्षया सन्देहेनालम् । विशोकं कुरु मत्पृष्ठेन तत्र गत्वेति शेषः ।। 5.37.40,41 ।।\n\nविजानामि एवंविधत्वद्रूपदर्शनात्प्रागप्यनुमानादिति भावः\nतदेवानुमानं दर्शयति-- प्राकृत इति", "bhusana": "तदवस्थाप्यतां बुद्धिरलं देवि विकाङ्क्षया ।\n\nविशोकं कुरु वैदेहि राघवं सहलक्ष्मणम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.40:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Пора решаться… (tad avasthāpyatāṃ buddhir ) – букв. «да будет [твоя] мысль/разум установлена»."}]}, {"verse_id": "5.37.44", "verse": "44", "sanskrit_iast": "jānāmi gamane śaktiṃ nayane cāpi te mama । avaśyaṃ sāmpradhāryāśu kāryasiddhir ivātmanaḥ ॥44॥", "leonov_ru": "Знаю, что можешь ты улететь [отсюда] и унести меня, [Но] несомненно, должен быть обдуман быстро и успех моего дела.", "commentary": {"bhusana": "जानामि गमने शक्तिं नयने चापि ते मम ।\n\nअवश्यं संप्रधार्याशु कार्यसिद्धिर्महात्मनः\nसंप्रधार्या विचारणीया\nअयुक्तं तु कपिश्रेष्ठ मम गन्तुं त्वया ऽनघ ।\n\nवायुवेगसवेगस्य वेगो मां मोहयेत्तव\nस्वप्रापणे प्रधानं दोषं हृदि कृत्वा आपाततो दोषमाह अयुक्तमिति", "tilaka": "तवेव ममाप्यात्मनः कार्यसिद्धिरवश्यं संप्रधार्या विचार्या, त्वया तु स्वबलवैभवेन विचारिता कार्यसिद्धिः", "siromani": "जानामीति । गमने समुद्रलङ्घने मम नयने च ते शक्तिं जानामि तथापि आत्मनः कार्यसिद्धिः अवश्यं संप्रधार्या विचारणीया"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.44:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «gamane» Опущено"}]}, {"verse_id": "5.37.47", "verse": "47", "sanskrit_iast": "patitā sāgare cāhaṃ timinakrajhaṣākule । bhaveyam āśu vivaśā yādasām annam uttamam ॥47॥", "leonov_ru": "Упав в океан, кишащий китами, крокодилами и рыбами, я Тут же стану, беспомощная, лакомым куском для морских чудовищ.", "commentary": {"bhusana": "पतिता सागरे चाहं तिमिनक्रझषाकुले ।\n\nभवेयमाशु विवशा यादसामन्नमुत्तमम्\nयादसां जलजन्तूनाम्", "siromani": "पतितेति । सागरे पतिता ऽहं विवशा सती यादसां जलजन्तूनामन्नमाशु भवेयम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.37.47:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "timina", "note_ru": "Тимина (timina, m./n.) — мифическое морское чудовище огромных размеров, поедающее «тими» (timinaḥ — «поедатель timiḥ»). MW: timi m. 'a large fish or sea animal'. timingila — ещё большее: «поедатель timiḥ». Тройная пищевая цепь морских чудовищ в тексте: timiḥ → timina → timinagila — усиливает ужас океана. Подстрочник «киты» — приблизительно; подлинный образ = иерархия монстров.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:timi"}]}, {"verse_id": "5.37.5860", "verse": "5860", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "मयीति । तव राजकुलस्य सुग्रीवराजकुलस्य"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.5860:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Сугривы» Комм., в оригинале просто tava", "anchor_verse_id": "5.37.60"}, {"id": "lexical:5.37.5860:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āyatta", "note_ru": "Аяттa (āyatta, adj.) — «зависящий от, находящийся во власти» (ā + p.p.p. √yat- «прилагать усилие, достигать»). MW: āyatta adj. 'resting on, depending on, subject to'. mayi jīvitam āyattam — «от меня зависит жизнь»: āyatta подчёркивает не просто связь, а структуру зависимости — жизнь Рамы и братьев буквально «стоит на» Хануману как на опоре. Мощная риторическая формула убеждения.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:Ayatta", "anchor_verse_id": "5.37.60", "collision_tier1": true}]}, {"verse_id": "5.37.62", "verse": "62", "sanskrit_iast": "bhartur bhaktiṃ puraskṛtya rāmād anyasya vānara । nāhaṃ spraṣṭuṃ svato gātram iccheyaṃ vānarottama ॥62॥", "leonov_ru": "Поставив во главе преданность мужу, ни до кого кроме Рамы, о обезьяна, Я не желаю дотронуться по своей воле, о лучший из обезьян.", "commentary": {"bhusana": "भर्तृमक्तिं पुरस्कृत्य रामादन्यस्य वानर ।\n\nन स्पृशामि शरीरं तु पुंसो वाररपुङ्गवः"}, "has_tier1": false, "notes": [{"id": "crosstext:5.37.62:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "bhakti", "note_ru": "Сита отказывается коснуться кого-либо, кроме Рамы, «поставив во главе преданность мужу» (bhartur bhaktiṃ puraskṛtya). Термин bhakti здесь — супружеская верность, но он принадлежит и ядру вайшнавского богословия Гиты, где bhakti — высший путь (Йамуначарья, «Гитартха-санграха» 24: «bhaktiyogaḥ paraikāntyaprītyā …» — «Бхакти-йога — это пребывание в медитации и т.п., [порожденной из] любви к Высшему Единству. Все три йоги взаимосвязаны»; ГАС 26: «… pratilabhya parāṃ bhaktiṃ …» — «Когда все незнание исчезает, а Атман видится как следующий за Высшим и достигается высшая бхакти, тогда с ее помощью достигается и его местопребывание (tatpadam).»). Параллель важна для рецепции: вайшнавская традиция читала pativratā-bhakti Ситы как образ ananya-bhakti (безраздельной преданности) души к Богу. Помета намечает этот символический пласт, не сводя bhakti к одной супружеской верности. Свидетельство: уровень шлоки (мягкое).", "type": "А", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.37.62", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Gītārthasaṃgraha Yāmunācārya 24 и 26; Bhagavadgītā 9.30"}]}, {"verse_id": "5.37.63", "verse": "63", "sanskrit_iast": "yad ahaṃ gātrasaṃsparśaṃ rāvaṇasya gatā balāt । anīśā kiṃ kariṣyāmi vināthā vivaśā sati ॥63॥", "leonov_ru": "Я была вынуждена коснуться тела Раваны, [Но] что мне было делать, лишенной господина, беззащитной и беспомощной?", "commentary": {"bhusana": "यदहं गात्रसंस्पर्शं रावणस्य बलाद्गता ।\n\nअनीशा किं करिष्यामि विनाथा विवशा सती\nयदि रामो दशग्रीवमिह हत्वा सबान्धवम् ।\n\nमामितो गृह्य गच्छेत तत्तस्य सदृशं भवेत्", "siromani": "अहमिति । यद्यपि सर्वराक्षसान्निहन्तुं त्वं पर्याप्तो ऽसि त्वया शस्तैर्हिंसितैः राक्षसैः राघवस्य यशो ऽपि अहीयेत् न हीयेत् । तथापि रक्षोभिरभितर्जिता ऽहं वा यदि विपद्येयं तदा त्वत्प्रयत्नः निष्फल एव भवेत् । श्लोकद्वयमेकान्वयि ।। 5.37.56,57 ।।\n\nअथवेति । अथवा यदि यत्र हरयो राघवश्च मां न जानीयुः तत्र संवृते आच्छादिते स्थले मामादाय रक्षांसि न्यसेयुः तदा मदर्थो ऽयं तवारम्भः प्रयत्नः निरर्थकः स्यादिति शेषः । अतः त्वया सह रामस्यागमने एव महान् गुणः । श्लोकद्वयमेकान्वयि ।। 5.37.58,59 ।।\n\nस्वलाभाभावे दोषान्तरमाह-- मयीति । राघवादेः जीवितं मयि आयत्तं मल्लाभाधीनमित्यर्थः, अतः मदर्थं शोकसंतापकर्षितौ तौ रामलक्ष्मणौ सर्वर्क्षहरिभिः सह प्राणसंग्रहं प्राणानां रक्षणं त्यक्ष्यतः । श्लोकद्वयमेकान्वयि ।। 5.37.60,61 ।।\n\nहनुमता सह गमनाभावे मुख्यं हेतुमाह-- भर्तुरिति । स्वतः स्वेच्छया रामाज्ञां विनेत्यर्थः, रामादन्यस्य गात्रं स्प्रष्टुं नेच्छेयम्\nयदिति । रावणस्य गात्रसंस्पर्शं बलात् हठात् यदहं गता तत् अनाथा नाथरहिता अत एव अनीशा सामर्थ्यरहिता ऽहं किं करिष्यामि", "tilaka": "अनीशा स्रीत्वात्स्वयमसमर्था, विवशा विचेष्टा, विनाथा ऽसंनिहितरामलक्ष्मणा । हा सीते लक्ष्मणेति मारीचवाक्यं श्रुत्वा रामानर्थशङ्कया लक्ष्मणस्यापि प्रस्थापनादिति भावः"}, "has_tier1": true, "notes": [{"id": "tier1:5.37.63:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Беспомощная, беззащитная (anīśā… vināthā vivaśā sati) – букв. anīśā (бессильная), «лишенная господина» (vināthā) и «беспомощная» (vivaśā). Авторы комментариев «Тилака» и «Таттвадипика» глоссируют последнее слово как viceṣṭā (неподвижная)."}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};

}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

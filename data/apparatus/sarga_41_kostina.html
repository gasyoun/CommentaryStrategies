<script>window.APPARATUS_DATA={"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 41, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 25, "verses_with_notes": 11, "notes_by_layer": {"tier1": 5, "lexical": 7, "phase2": 4, "edition": 3, "crosstext": 0}, "built_for_reviewer": "Костина", "source_hash": "b91ed2e13ddb70500aa435819fd0a67105562f409d036b6d61e254eca25a13b0"}, "sarga": 41, "verses": [{"verse_id": "5.41.2", "verse": "2", "sanskrit_iast": "alpaśeṣam idaṃ kāryaṃ dṛṣṭeyam asitekṣaṇā । trīn upāyān atikramya caturtha iha dṛśyate ॥2॥", "leonov_ru": "«Осталось сделать немного. Нашел я черноглазую. Помимо трех средств (sāman, dana, bheda), вижу здесь четвертое (daṇḍa).", "commentary": {"bhusana": "अल्पशेषमिदं कार्यं दृष्टेयमसितेक्षणा ।\n\nत्रीनुपायानतिक्रम्य चतुर्थ इह दृश्यते\nअल्पेति । \"अभिगम्य तु वैदेहीं निलयं रावणस्य च\" इत्युक्तकार्यद्वये सीतादर्शनरूपं कार्यं जातम् । इदं कार्यं रावणनिलयपरिज्ञानरूपम् । अल्पशेषम् अल्पावशिष्टम् । सान्तःपुरलङ्कायाः सम्यक् परिज्ञातत्वे ऽपि राक्षसबलाबलरावणहृदयाद्यपरिज्ञानात्कार्यस्याल्पशेषत्वोक्तिः । इह राक्षसबलाबलरावणहृदयपरिज्ञानरूपकार्ये । त्रीनुपायानतिक्रम्य सामदानभेदानतिक्रम्य । चतुर्थो लक्ष्यते साधनतया दण्ड एव दृश्यत इत्यर्थः", "siromani": "चिन्ताकारमाह अल्पेत्यादिभिः । इयं सीता दृष्टा प्रधानकार्यं सिद्धमित्यर्थः । इदं परबलदर्शनरूपं कार्यमल्पशेषं स्वल्पं सत् शिष्यते इह परबलदर्शनरूपकार्ये तु यतः त्रीन् सामादीन् उपायान् अतिक्रम्य त्यक्त्वा चतुर्थो दण्ड एव उपायः दृश्यते"}, "has_tier1": true, "notes": [{"id": "tier1:5.41.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…я вижу / Здесь еще и четвертое (caturtha iha dṛśyate) – под четвертым средством подразумевается daṇḍa (наказание, то есть применение силы)."}, {"id": "lexical:5.41.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "upāya (catvāraḥ)", "note_ru": "Четыре упая (upāya, m., букв. «подход, средство») — политическая доктрина, зафиксированная в Артхашастре Каутильи (II–III вв. до н. э., кн. 2): sāma «убеждение/примирение», dāna «дар/подкуп», bheda «разделение/интрига», daṇḍa «сила/наказание» (MW: upāya 'a means, expedient, stratagem'; sāma 'conciliation'; dāna 'gift'; bheda 'division'; daṇḍa 'rod, punishment'). Это канонический политический тетрахотомия: «trīn upāyān atikramya caturtha iha dṛśyate» — Хануман констатирует, что первые три (sāma, dāna, bheda) к ракшасам неприложимы, остаётся только daṇḍa. Важно: Хануман прибегает к rationale артхашастры, а не к bhakti или dharma — это делает его решение интеллектуально обоснованным нравственным выбором, а не слепым насилием.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:upAya+Arthashastra:catvAra_upAyAH+Indological:political_theory", "collision_tier1": true}, {"id": "phase2:5.41.2:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "alpaśeṣam idaṃ kāryam", "note_ru": "По „Бхушане“, «осталось немного» относится не к первоначальному поручению в целом, а к его невыполненной части: Ситу он уже нашёл и обитель Раваны в Ланке уже разведал, но силы ракшасов и настрой самого Раваны ему пока неизвестны — именно это незнание и оправдывает переход к четвёртому средству (daṇḍa).", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "уточняет, что именно осталось невыполненным (не встреча с Ситой, а разведка сил и настроя Раваны) — деталь, отсутствующая в подстрочнике и в существующей заметке Phase-1, которая касается только доктрины четырёх упая", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.41.8", "verse": "8", "sanskrit_iast": "kathaṃ nu khalv adya bhavet sukhāgataṃ । prasahya yuddhaṃ mama rākṣasaiḥ saha । tathaiva khalv ātmabalaṃ ca sāravat । sa mānayen māṃ ca raṇe daśānanaḥ ॥8॥", "leonov_ru": "Как же воистину сегодня будет успешной Жестокая битва моя с ракшасами, Так чтобы воистину собственной могучей силой Почтил меня в бою Десятиликий (Равана)?", "commentary": {"tilaka": "ननु स्वामिसन्दिष्टकार्यातिरिक्तकार्यकरणे दोषः, स्वामिना हि \"अभिगम्य तु वैदेहीं निलयं रावणस्य च इत्येतावदेव सन्दिष्टमित्याशङ्क्य सन्दिष्टकार्याविरोधेन स्वामिहितं कार्यान्तरसाधनं दूतस्यालङ्कार इत्याह-- कार्ये इति । कार्ये प्रधानकार्ये निर्वृत्ते । स कार्यं कर्तुमर्हति, न तु सन्दिष्टमात्रस्य कथञ्चित्साधक इत्याशयः", "siromani": "नन्वभिगम्य तु वैदेहीं निलयं रावणस्य चेत्यादिना दर्शनमात्रनियुक्तेन त्वया नाज्ञापितराक्षसवधः किमर्थमभिकाङ्क्ष्यते इत्यत आह कार्य इति । कार्ये स्वाम्याज्ञप्तकर्तव्ये कर्मणि निर्वृत्ते सिद्धे यो बहूनि कृतकार्यपोषकतया विपुलकार्याणि साधयेत् साधितुमिच्छेत् । सः पूर्वकार्याविरोधेन साधितकार्यप्रातिकूल्यराहित्येन कार्यं कर्तुमर्हति\nउपायमेव चिन्तयति कथमिति । राक्षसैः सह मम युद्धं कथं भवेत् तथा सारवद्बलवत् आत्मबलं स्वसेनां मां च रणे दशाननः स रावणः कथं मानयेत् प्रशंसेत्", "bhusana": "कथं नु खल्वद्य भवेत् सुखागतं प्रसह्य युद्धं मम राक्षसैः सह ।\n\nतथैव खल्वात्मबलं च सारवत् संमानयेन्मां च रणे दशाननः\nकथं न्विति । युद्धं कथं सुखागतं सुखेन प्राप्तं भवेत्तथा कर्तव्यमित्यर्थः । युद्धस्य फलमाह तथैवेत्यादिना सार्द्धश्लोकेन । तथैव खलु युद्धकरणे खलु । सः दशाननः । रणे आत्मबलं स्वपक्षबलं मां च । सारवत् मानयेत्परिच्छिन्द्यात्"}, "has_tier1": true, "notes": [{"id": "tier1:5.41.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Чтобы собственную силу направил (ātmabalaṃ ca sāravat samānayen) – в оригинале ātmabalam, что можно понять как «свою силу» или «свое войско»."}, {"id": "lexical:5.41.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "daśānana", "note_ru": "Десятиликий (daśānana) — эпитет Раваны daśa-ānana «десятиликий» (пара к daśagrīva); подчёркивает его десятиглавый облик. Леонов: «Десятиликий Равана». Первое вхождение формы в кн. V.", "type": "А", "subtype": "base", "trigger": "epithet", "source": "gazetteer (analysis §09б / formulas tt.1-2) — first occurrence in кн. V (verse-level, soft)", "collision_tier1": true}]}, {"verse_id": "5.41.9", "verse": "9", "sanskrit_iast": "tataḥ samāsādya raṇe daśānanaṃ । samantrivargaṃ sabalaṃ sayāyinam । hṛdi sthitaṃ tasya mataṃ balaṃ ca । sukhena mattvāhamitaḥ punar vraje ॥9॥", "leonov_ru": "Тогда, встретив в бою Десятиликого (Равану) С советниками, войском и колесничим, В сердце установленную его мысль (стратегию) и силу, Легко поняв, я отсюда снова улечу.", "commentary": {"tilaka": "ततो मद्बलवशादेव मां रणे समासाद्य वर्तमानं सबलं सयायिनं ससारथिम् । अन्तर्भावितण्यर्थाद्यतिर्णिनौ यापयिता यायी सारथिस्तेन सहितं रावणं ज्ञात्वा हृदि स्थितं तस्य मतमभीष्टं बलं च सुखेनाक्लेशतो मत्वा ज्ञात्वा पुनरितो व्रजे व्रजिष्ये । \"सबलं सयायिनम्\" इति पाठः । \"सबलं प्रयायिनम्\" इत्याधुनिककल्पितः पाठः", "bhusana": "ततः समासाद्य रणे दशाननं समन्त्रिवर्गं सबलप्रयायिनम् ।\n\nहृदि स्थितं तस्य मतं बलं च वै सुखेन मत्वा ऽहमितः पुनर्व्रजे\nबलप्रयायिना सेनान्या सह वर्तत इति सबलप्रयायी तम् । तस्य हृदि स्थितं मतं सीताविषयाध्यवसायं बलं च मत्वा सुखेन इतः अस्मात् स्थानात् पुनः व्रजे व्रजिष्यामि", "siromani": "युद्धेच्छायां प्रयोजनमाह तत इति । ततः तस्मिन् रणे सयायिनं ससारथिं दशाननं समासाद्य प्राप्य तस्य रावणस्य हृदि स्थितं मतमभिप्रायं बलं च मत्वा ज्ञात्वा इतः लङ्कायाः पुनर्व्रजे"}, "has_tier1": false, "notes": [{"id": "lexical:5.41.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mantrivarga", "note_ru": "Мантриварга (mantri-varga, m.) — тат-пуруша: mantrin m. «советник, министр» (от √man-, «думать», + суфф. -trin, «имеющий функцию думающего-для») + varga m. «группа, класс». MW: mantrin 'a counsellor, minister, the prime minister'. В Артхашастре Каутильи mantriparishad («совет министров») — конституционный орган: царь не должен принимать решений без mantri (кн. 1, гл. 15). Хануман проводит разведку боем (V.41.9: «samantrivargaṃ sabalaṃ sayāyinam» — Равана с советниками, войском и стражей) — он оценивает именно государственный аппарат противника, выполняя функцию чары (шпиона) по артхашастровой классификации.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:mantrin (√man-)+Arthashastra:mantriparishad"}, {"id": "phase2:5.41.9:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sabalaṃ sayāyinam", "note_ru": "«Тилака» фиксирует разночтение: правильное чтение — sabalaṃ sayāyinam («с войском, с колесничим»), тогда как sabalaṃ prayāyinam («выступающего с войском») он называет «недавно измышленным» (ādhunika-kalpita) — то есть поздней порчей текста, а не подлинным вариантом. В самой «Бхушане» здесь как раз приведено это отвергаемое чтение.", "type": "Б", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "документирует явный текстологический спор о чтении — Тилака прямо называет альтернативный вариант поздней выдумкой, притом что этот самый вариант фигурирует в тексте Бхушаны в данном своде; ни подстрочник, ни существующие заметки этого разночтения не касаются", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}, {"id": "edition:5.41.9:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.41.9 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.41.9", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.41.9", "iast": "tataḥ samāsādya raṇe daśānanaṃ । samantrivargaṃ sabalaṃ sayāyinam । hṛdi sthitaṃ tasya mataṃ balaṃ ca । sukhena mattvāhamitaḥ punar vraje ॥9॥"}]}]}, {"verse_id": "5.41.11", "verse": "11", "sanskrit_iast": "idaṃ vidhvaṃsayiṣyāmi śuṣkaṃ vanam ivānalaḥ । asmin bhagne tataḥ kopaṃ kariṣyati sa rāvaṇaḥ ॥11॥", "leonov_ru": "Его уничтожу я, как огонь [уничтожает] сухой лес. После этого уничтожения, придет в гнев Равана.", "commentary": {"siromani": "तत इति । ततः वनविध्वंसानन्तरं साश्वमहारथद्विपम् अश्वमहारथद्विपसहितं त्रिशूलादीनि आयुधानि यस्मिन् तन्महद्बलं राक्षसाधिपः समानेष्यति अत एव ततस्तस्मिन् समये महद्युद्धं भविष्यति\nइदमिति । इदं वनं शुष्कं वनमनल इव विध्वंसयिष्यामि अस्मिन् भग्ने सति रावणः कोपं करिष्यति यदि त्वेतच्छ्लोकघटकस्येदमित्यस्य कामदमित्यर्थस्तदा पूर्वस्यापीहैवान्वयः । एवं च पूर्वत्रास्तेरध्याहारस्य न प्रयोजनम्", "bhusana": "इदं विध्वंसयिष्यामि शुष्कं वनमिवानलः ।\n\nअस्मिन् भग्ने ततः कोपं करिष्यति दशाननः"}, "has_tier1": false, "notes": [{"id": "lexical:5.41.11:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dāvānala", "note_ru": "Давана-ла (dāva-anala, m.) — тат-пуруша: dāva m. «лесной пожар, низовой огонь» (от √du/dav-, «гореть», или от dava «огонь в сухом лесу»; MW: dāva 'forest fire, conflagration') + anala m. «огонь» (MW: 'fire, the god of fire'). Образ vanaṃ śuṣkaṃ iva dāvānala («как лесной пожар сухой лес») — парная метафора к V.41.16 (vṛkṣaiḥ mathitaiḥ). Dāva специфичнее агни: это огонь в уже сухом, безжизненном материале — тотальный, неостановимый. Выбор dāvānala, а не агни подчёркивает именно необратимость уничтожения прамадаваны. Вскоре (ch42) этот образ реализуется как буквальный пожар Ланки.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:dAva+dic_mw:anala+Indological:fire_taxonomy"}, {"id": "lexical:5.41.11:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "lankādahana (Агни как космический агент)", "note_ru": "Ланкадахана («сожжение Ланки») — эпизод, приобретающий мифологический статус «огненного очищения» (pāvana). В эпической традиции Агни выступает не только домашним и жертвенным богом, но и агентом космической очистки: огонь, прошедший через Ланку с хвоста Ханумана, отсылает к образу Агни как свидетеля (sākṣin) и судьи. Параллель: Ситу испытывают огнём в Рам. VI (огненное испытание — agni-parīkṣā). Тот же Агни в Рам. I является свидетелем жертвоприношений. Таким образом, сожжение Ланки готовит сюжет к agni-parīkṣā: огонь «метит» Ланку как место, которое подлежит искуплению. Образ Агни как космического агента введён в Рам. I (Гринцер).", "type": "Г", "subtype": "hist_cultural", "trigger": "myth_background", "source": "Rām. I.13–14 (Агни как свидетель); Rām. VI.104 (agni-parīkṣā)"}]}, {"verse_id": "5.41.14", "verse": "14", "sanskrit_iast": "tato mārutavat kruddho mārutir bhīmavikramaḥ । ūruvegena mahatā drumān kṣeptum athārabhat ॥14॥", "leonov_ru": "Тогда подобный ветру, разгневанный сын ветра, наделенный грозной мощью, Великой силой бедер начал тогда валить деревья.", "commentary": {"tilaka": "अथ प्रसह्य रणप्रवर्तनोपायं चिन्तयति-- इदमिति । अस्येदं वनं नेत्रमनःक्रान्तं भवति, अत इदं विध्वंसयामि ।। 5.41.10,11 ।।\n\nसमानेष्यति मां प्रति युद्धाय प्रापयिष्यति । महद्युद्धं मन्मनस्तोषकृत्", "bhusana": "ततो मारुतवत् क्रुद्धो मारुतिर्भीमविक्रमः ।\n\nउरुवेगेन महता द्रुमान् क्षेप्तुमथारभत्\nततः तेन चिन्तितेन हेतुना"}, "has_tier1": false, "notes": [{"id": "lexical:5.41.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "māruta", "note_ru": "Марута (māruta, m./adj.) — от marut m. «буревой бог, бог ветра» (MW: marut 'wind, god of the winds, storm-god'; pl. маруты — 49 ведийских богов бури, сыновья Рудры) + суфф. -а (патронимический/реляционный). Хануман — mārutātmaja («рождённый духом ветра», V.41.14) и mārutasuta («сын Марута»): его отцом считается Вайю/Марут. Эпитет mārutavat («подобный ветру», V.41.14) активирует не только скоростной, но и деструктивный аспект ветра: маруты в Ригведе — боги сокрушительной бури, разбивающие лесами. Хануман уничтожает прамадавану именно в качестве воплощения ведийской бури — это не произвол, а онтологическое соответствие его природе.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:mAruta+dic_mw:marut+Indological:Maruts_RV"}]}, {"verse_id": "5.41.15", "verse": "15", "sanskrit_iast": "tatas tad dhanumān vīro babhañja pramadāvanam । mattadvijasamāghuṣṭaṃ nānādrumalatāyutam ॥15॥", "leonov_ru": "Тогда Хануман отважный, уничтожил царский парк, Который оглашали голоса радостных птиц, где росли разнообразные деревья и лианы.", "commentary": {"tilaka": "तत एवंनिश्चयानन्तरम् ।। 5.41.14,15 ।।\n\nपर्वताग्रैः क्रीडापर्वताग्रैः । उपलक्षितमिति शेषः ।। 5.41.16,17 ।।\n\nव्याकुलं स्रस्तमावरणं यासां ताः, अत एव विह्वलाः स्त्रिय इवा ता लता रेजुः", "siromani": "तत इति । ततो ऽनन्तरं क्रुद्धः आश्रितकोपः भीमविक्रमो मारुतिः महता ऊरुवेगेन मारुतवत् द्रुमान् क्षेप्तुमारभत्\nतत इति । ततो ऽनन्तरं प्रमदावनं प्रमदाकुलवनिकां बभञ्ज", "bhusana": "ततस्तु हनुमान् वीरो बभञ्च प्रमदावनम् ।\n\nमत्तद्विजसमाघुष्टं नानाद्रुमलतायुतम्\nप्रमदावनम् अन्तःपुरवनम् । \"प्रमदावनमन्तः पुरोचितम्\" इत्यमरः"}, "has_tier1": false, "notes": [{"id": "lexical:5.41.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pramadāvana", "note_ru": "Прамадавана (pra-madā-vana, n.) — тат-пуруша: pramadā f. «женщина в расцвете молодости, возлюбленная» (pra-√mad-, «опьяняться, веселиться, быть безрассудным»; MW: pramadā 'a young and wanton woman, any woman') + vana n. «лес, роща, сад» (MW: 'a forest, wood, grove'). Pramadāvana — сад при антахпуре (женских покоях), закрытое пространство, куда вход мужчинам запрещён. MW: pramadāvana 'pleasure-garden of Rāvaṇa'. Уничтожение pramadāvana (V.41.15) — сознательное нарушение сакральной границы антахпуры: Хануман вторгается в запретное женское пространство царя. Это политически провокационный акт, неизбежно вызывающий военный ответ Раваны.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:pramadAvana+dic_mw:pramadA (√mad-)+Indological:antahpura"}]}, {"verse_id": "5.41.16", "verse": "16", "sanskrit_iast": "tad vanaṃ mathitair vṛkṣair bhinnaiś ca salilāśayaiḥ । cūrṇitaiḥ parvatāgraiś ca babhūvāpriyadarśanam ॥16॥", "leonov_ru": "Тот лес с поваленными деревьями, уничтоженными прудами, Разбитыми на куски горными вершинами, стал неприятен на вид.", "commentary": {"bhusana": "तद्वनं मथितैर्वृक्षैर्भिन्नैश्च सलिलाशयैः ।\n\nचूर्णितैः पर्वताग्रैश्च बभूवाप्रियदर्शनम्", "siromani": "तदिति । मथितैः सलिलाशयैर्भिन्नैर्भञ्जितैर्वृक्षैश्च चूर्णितैः पर्वताग्रैश्च तद्वनमप्रियदर्शनं बभूव"}, "has_tier1": true, "notes": [{"id": "tier1:5.41.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "С сокрушенными горками (cūrṇitaiḥ parvatāgraiś ca) – букв. «и с разбитыми вершинами гор». Автор «Тилаки» отмечает, что речь идет о горках для игр (krīḍaparvata)."}]}, {"verse_id": "5.41.17", "verse": "17", "sanskrit_iast": "nānāśakuntavirutaiḥ prabhinnasalilāśayaiḥ । tāmraiḥ kisalayaiḥ klāntaiḥ klāntadrumalatāyutaiḥ ॥17॥", "leonov_ru": "С криками разнообразных птиц, с разрушенными прудами, С изломанными красными веточками, с поваленными деревьями и изорванными лианами,", "commentary": {"bhusana": "नानाशकुन्तविरुतैः प्रभिन्नैः सलिलाशयैः ।\n\nताम्रैः किसलयैः क्लान्तैः क्लान्तद्रुमलतायुतम् ।\n\nन बभौ तद्वनं तत्र दावानलहतं यथा", "siromani": "नानेति । नानाशकुन्तविरुतैः पक्षिणामुत्कटशब्दैः प्रभिन्नसलिसाशयैश्च क्लान्तैर्म्लानैः किसलयैश्च क्लान्तद्रुमलतानामयुतैश्च उपलक्षितं दावानलहतमिव तद्वनं तत्र तस्मिन् समये न बभौ । सार्धश्लोक एकान्वयी"}, "has_tier1": false, "notes": [{"id": "edition:5.41.17:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.41.17–18 (2 шлок) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "range": "5.41.17–18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.41.17", "iast": "nānāśakuntavirutaiḥ prabhinnasalilāśayaiḥ । tāmraiḥ kisalayaiḥ klāntaiḥ klāntadrumalatāyutaiḥ ॥17॥"}, {"verse_id": "5.41.18", "iast": "na babhau tad vanaṃ tatra dāvānalahataṃ yathā । vyākulāvaraṇā rejur vihvalā iva tā latāḥ ॥18॥"}]}]}, {"verse_id": "5.41.18", "verse": "18", "sanskrit_iast": "na babhau tad vanaṃ tatra dāvānalahataṃ yathā । vyākulāvaraṇā rejur vihvalā iva tā latāḥ ॥18॥", "leonov_ru": "Утратил тот лес свою красоту, словно сожженный пожаром. [Его] дрожащие лианы были подобны печальным женщинам.", "commentary": {"tilaka": "तत्र युक्तिमाह-- नेति । ऋजुषु साम फलाय न शूरेषु तदाह-- रक्षःस्विति । बलदर्पिता भेदसाध्या न । भेद उपायः । बलवन्तो हि कुतो ऽप्यनिष्टं न गणयन्तीत्यर्थः", "bhusana": "व्याकुलावरणा रेजुर्विह्वला इव ता लताः\nव्याकुलावरणाः आवरणादुपघ्नाद्व्याकुलाः । विह्वलाः स्त्रियः इव", "siromani": "व्याकुलेति । व्याकुलानि संचलितानि आवरणानि यासां ताः लताः विह्वला नार्य इव रेजुः"}, "has_tier1": true, "notes": [{"id": "tier1:5.41.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И поникшими женами / Казались лианы дрожащие (vyākulāvaraṇā rejur vihvalā iva tā latāḥ) – автор «Тилаки» толкует vyākulāvaraṇā как «те, с которых были сорваны одежды» (srastamāvaraṇaṃ yāsāṃ tāḥ). Такой же трактовки придерживается и автор комментария «Широмани». Голдмены переводят «women in distress» (см.: Goldman 1984: 468)."}]}, {"verse_id": "5.41.20", "verse": "20", "sanskrit_iast": "sā vihvalāśokalatāpratānā । vanasthalī śokalatāpratānā । jātā daśāsyapramadāvanasya । kapērbalāddhi pramadāvanasya ॥20॥", "leonov_ru": "[Прежде] покрытое дрожащими лианами ашоки, Это лесистое место, бывшее местом развлечений для жен Раваны, Стало покрытым лианами печали Благодаря силе обезьяны (Ханумана), защиты женщины (Ситы).", "commentary": {"tilaka": "प्रमदावनस्यान्तःपुरविहारोचितवनस्य । \"स्यादेतदेव प्रमदवनमन्तःपुरोचितम्\" इत्यमरः । दशास्यस्य प्रमदानां स्त्रीणां कामसंवर्धनद्वारावनस्य रक्षकस्यास्य वनस्य सा विह्वलाशोकलताप्रताना चञ्चलाशोकलतासमूहवती, वनस्थली तृणगुल्मलताजलाशयादियुक्ता भूमिः । कपेर्बलाच्छोच्यत इति शोका शोच्यलताप्रताना जाता द्रष्टृचितशोकजनिका जातेत्यर्थः", "bhusana": "सा विह्वला ऽशोकलताप्रताना वनस्थली शोकलताप्रताना ।\n\nजाता दशास्यप्रमदावनस्य कपेर्बलाद्धि प्रमदावनस्य\nसेति । शोच्यत इति शोकः । प्रतानं विततिः । अशोकम् अशोच्यम् लताप्रतानं यस्यास्सा अशोकलताप्रताना । दशास्यप्रमदावनस्य भोगवर्धनेन रावणवनितारक्षकस्य । प्रमदावनस्य अन्तःपुरोद्यानस्य । सा वनस्थली तृणगुल्मलतादिविशिष्टप्रदेशः । कपेर्बलाद्धि विह्वला लुलिता शोकलताप्रताना च जाता । यद्वा शोकलताश्शोकरताः । रलयोरभेदः । अप्प्रतानाः अप्सु प्रतानाः कमलकल्हारादयो ऽस्यां सा शोकलताप्प्रताना । म्लानजलजेति यावत् । दशास्यप्रमदावनस्य रावणप्रमदावनस्य 'ङ्यापोस्संज्ञाच्छान्दसोर्बहुलम्\" इति बहुलवचनाद्ध्रस्वाभावः । दशास्यप्रमदावनस्य वनस्थलीत्यत्र शिलापुत्रकस्य शरीरमितिवदुपचारात् षष्ठी । प्रमदावनस्य सीतारूपप्रमदापालकस्य । वनस्थली कपेर्बलाद्विह्वला शोकलताप्रताना च जाता । अशोकलतेत्युपलक्षणम्", "siromani": "सेति । विह्वलाः अशोकलताप्रतानाः विस्तृताशोकलताः यस्यां सा वनस्थली प्रमदस्य उत्कृष्टमदस्य अवनं रक्षणं यस्मिन् तस्य नित्यं मदविशिष्टस्येत्यर्थः, दशास्यप्रमदावनस्य रावणस्त्रीसमूहस्य कपेर्बलात् शोकरूपलताप्रतानः लताविस्तारो यस्यां सा जाता"}, "has_tier1": true, "notes": [{"id": "tier1:5.41.20:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В оригинале игра слов: pramadāvana – и «роща возле женских покоев» (pramadā + vana) и «защита женщины» (pramadā + avana)"}, {"id": "phase2:5.41.20:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "śokalatāpratānā", "note_ru": "По „Тилаке“, «шокалата» — не просто «лиана скорби», а нарочитый каламбур: сад аруши-дерева (aśoka, «безгорестный») из-за силы обезьяны стал «шоканой» («горестным», śocyā) — поэт заменяет исходное имя сада на его смысловую противоположность.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "вскрывает словесную игру на противоположности aśoka/śoka, которую подстрочник передаёт нейтрально («лианами печали»/«ашоки») и которую иначе русский читатель не заметит; отличается от уже отмеченной в Phase-1 игры слов на pramadāvana", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}, {"id": "edition:5.41.20:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.41.20 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.41.20", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.41.20", "iast": "sā vihvalāśokalatāpratānā । vanasthalī śokalatāpratānā । jātā daśāsyapramadāvanasya । kapērbalāddhi pramadāvanasya ॥20॥"}], "collision_tier1": true}]}, {"verse_id": "5.41.34", "verse": "34", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "उपपत्तिपूर्वकमेतदेव विवृणोति न सामेति । \"अनित्यो विजयो यस्माद्दृश्यते युद्ध्यमानयोः । पराजयश्च संग्रामे तस्माद्युद्धं विसर्जयेत् ।।\" इति युद्धस्य अव्यवस्थितफलकत्वेऽपि सर्वं बलवतः पथ्यम्' इति न्यायेन सर्वातिशायिबलपराक्रमस्य मम पराजयप्रसङ्ग एव नास्तीत्यभिप्रायेणाह पराक्रम इति। मम तु इह रक्षोविषये पराक्रम एव रोचत इति संबन्धः"}, "has_tier1": false, "notes": [{"id": "phase2:5.41.34:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "parākramas tv eṣa mameha rocate", "note_ru": "В „Бхушане“ решение Ханумана обосновано ссылкой на известный политический принцип: «победа в бою переменчива, поэтому войны следует избегать» — но эта осторожность неприменима к нему, поскольку его сила настолько превосходит вражескую, что поражение исключено; отсюда — сила ему «по нраву».", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "приводит доктринальную максиму (война — крайняя мера из-за непредсказуемости исхода) и объясняет, почему она не удерживает Ханумана — довод, отсутствующий в подстрочнике; бандл сегментирован под меткой «5.41.34», но его текст открывается прямой цитатой пратики стиха 3 («на самети»), поэтому содержательно относится к V.41.3, где сама «Бхушана» лишь повторяет текст стиха без пояснения — печатается как примечание к V.41.3", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"Костина",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

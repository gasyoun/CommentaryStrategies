й: “Плод принесли упорство Рамы, рвенье Сугривы и мой великий полет [через океан] благодаря (букв. “приблизившись к”) добродетели Ситы."}]}, {"verse_id": "5.59.3", "verse": "3", "sanskrit_iast": "āryāyāḥ sadṛśaṃ śīlaṃ sītāyāḥ plavagarṣabhāḥ । tapasā dhārayel lokān kruddhā vā nirdahed api ॥3॥", "leonov_ru": "Характер Ситы достоин благородной [женщины], быки между обезьянами, [Своим] тапасом может [она] поддерживать вселенную или даже сжечь [ее] в гневе.", "commentary": {"tilaka": "सदृशम् पतिव्रतानामरुन्धत्यादीनां सदृशमित्यर्थः", "bhusana": "तपसा धारयेल्लोकान् क्रुद्धो वा निर्दहेदपि ।\n\nसर्वथा ऽतिप्रवृद्धो ऽसौ रावणो राक्षसाधिपः ।\n\nतस्य तां स्पृशतो गात्रं तपसा न विनाशितम्\nतर्हि तं दुरात्मानं रावणं स्पृशन्तमेव किमिति नादहदिन्याशङ्क्य तस्यापि तपस्सम्पत्तिसद्भावादित्याह तपसेत्यादिना । यद्वा रावणतपःकथनद्वारा सीतायाः पातिव्रत्यातिशयमाह तपसेत्यादिना । तपसा अतिप्रवृद्ध इत्यन्वयः । कोपप्रसादाभ्यां सर्वलोकनिग्रहानुग्रहसमर्थो ऽसौ रावणः सर्वथा महातपस्संपन्नः । अत एव सीतास्पर्शे ऽप्यविनाशित इत्यर्थः", "siromani": "आर्याया इति । आर्यायाः सीतायाः सदृशं शीलं यस्या अस्ति सेति शेषः, तपसा स्वधर्मबलेन लोकान् धारयेत् वा यदि क्रुद्धा तर्हि निर्दहेदपि"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Достойна ее добродетель / Женщины благородной (āryāyāḥ sadṛśaṃ śīlaṃ sītāyāḥ) - в комментарии “Тилака” эта фраза толкуется как “Добродетель Ситы такова, как у других жен, верных мужу, таким как Арундхати”.[Е. Костина] «plavagarṣabhāḥ» опущено"}, {"id": "lexical:5.59.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tapas (śakti)", "note_ru": "Тапас как оружие (tapasā dhārayel lokān kruddhā vā nirdahed api) — «тапасом может она поддерживать вселенную или в гневе сжечь её». Тапас (tapas, n.) от √tap- (класс I, Whitney #182, «жечь, пылать»): аскетический жар, накапливаемый благочестием. MW: tapas 'warmth; religious austerity; supernatural power acquired by austerity'. В дхармашастрах и эпосе tapa-śakti — сила, способная аннулировать и поддерживать мировой порядок (loka-sthiti). Ключевой момент: Сита не активирует своё тапасное оружие — сила принадлежит ей, но хранится за добровольным воздержанием. Хануман объясняет именно это: Равана жив только потому, что Сита сознательно не действует.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:tapas+warnemyr(tap)", "collision_tier1": true}]}, {"verse_id": "5.59.4", "verse": "4", "sanskrit_iast": "sarvathātiprakṛṣṭo 'sau rāvaṇo rākṣaseṣvaraḥ । yasya tāṃ spṛśato gātraṃ tapasā na vināśitam ॥4॥", "leonov_ru": "Верно, весьма могуществен Равана, владыка ракшасов, Если не погиб от ее тапаса, когда коснулся ее (Ситы) тела.", "commentary": {"siromani": "सर्वथेति । तां सीतां स्पृशतः अपहरणाय स्पर्शं कुर्वतः यस्य रावणस्य गात्रं पाणिः तपसा सीतातपोबलेन न विनाशितं सो ऽसौ रावणः सर्वथा सर्वप्रकारेण अतिप्रकारेण अतिप्रकृष्टः प्रतिभातीति शेषः, एतेनेदं महदाश्चर्यमिति सूचितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.4:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Верно, весьма могуществен (sarvathātiprakṛṣṭo 'sau) - автор комментария “Тилака” поясняет, что речь идет о тапасе, накопленном Раваной."}]}, {"verse_id": "5.59.5", "verse": "5", "sanskrit_iast": "na tad agniśikhā kuryāt saṃspṛṣṭā pāṇinā satī । janakasya sutā kuryād yat krodhakaluṣīkṛtā ॥5॥", "leonov_ru": "Пламя, которого коснулись рукой, не сделает того, Что может сделать дочь Джанаки, охваченная гневом.", "commentary": {"siromani": "तदाकारमाह सफल इत्यादिभिः । सीतायाः शीलं रामैकनिष्ठस्वभावम् आसाद्य विज्ञाय मम मनः प्रीणितं तृप्तम् अत एव राघवोद्योगः सुग्रीवस्य संभ्रमः राघवादरश्च सफलः\nतदेव पोषयन्नाह नेति । क्रोधकलुषीकृता जनकस्य सुता यद्दहनं न कुर्यात्तद्दहनं पाणिसंस्पृष्टा अग्निशिखा न कुर्यात् । एतेन सीतायाः सामर्थ्यातिशयः सूचितः । तेन सीतायाः अधिकः कोपो न जात इति ध्वनितम्", "bhusana": "न तदग्निशिखा कुर्यात् संस्पृष्टा पाणिना सती ।\n\nजनकस्यात्मजा कुर्याद्यत् क्रोधकलुषीकृता\nतर्हि सीताशीलं दुर्बलमस्माकं किमुपकरिष्यतीत्याशङ्क्य नेत्याह न तदिति । सीताशीलमेव बलीयस्त्वादुपकरिष्यतीत्यर्थः । क्रोधकलुषीकृतेति वचनाद्भर्तृमुखेन वैरनिर्यातनं वीरपत्नीधर्मः । अन्यथा महालाघवं भर्तुरित्यद्यापि पारतन्त्र्यपालनाय तादृक्क्रोधाकरणाद्रावणो जीवतीति गम्यते । एतदोवोक्तं प्राक् \"असन्देशात्तु रामस्य तपसश्चानुपालनात् । न त्वां कुर्मि दशग्रीव भस्म भस्मार्ह तेजसा ।।\" इति"}, "has_tier1": false, "notes": [{"id": "lexical:5.59.5:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "satī", "note_ru": "Сати (satī, f.) — «истинная, добродетельная; сама добродетель», f. от sat (p.p.p. от √as-, «быть»; дословно «сущая», «истинная»). MW: satī 'a virtuous woman, faithful wife; a woman who burns herself with her husband's body'. В стихе «agniśikhā saṃspṛṣṭā pāṇinā satī» — «пламя, которого коснулась рукой сати (добродетельная женщина)». Satī здесь — не обряд самосожжения (это более позднее значение), а архаический правовой термин: женщина, чья дхармическая верность создаёт охранную ауру. Контраст: agni-śikhā (пламя) слабее satī — метафизическая иерархия, в которой нравственная сила выше физической стихии.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:satI+dic_apte:satI"}, {"id": "phase2:5.59.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "krodhakaluṣīkṛtā", "note_ru": "Бхушана поясняет ход мысли Ханумана через отсылку к его же более ранним словам, обращённым к Раване: «Не по повелению Рамы и не ради сохранения его подвижничества я не превращаю тебя, достойного испепеления, в пепел своим блеском» — то есть щажение Раваны было волевым самоограничением Ханумана, а не бессилием; тем разительнее гнев Ситы, которая никого не щадит.", "type": "Б", "source_commentary": ["bhusana"], "why_proposed": "подстрочник передаёт лишь сравнение силы гнева Ситы с огнём; Бхушана поясняет логическую связь с более ранним эпизодом (пощада Раваны Хануманом была намеренной, а не вынужденной), усиливающую контраст с безудержным гневом Ситы", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.59.6", "verse": "6", "sanskrit_iast": "jāmbavatpramukhān sarvān anujñāpya mahākapīn । asminnevaṃgate kārye bhavatām ca nivedite । nyāyyam sma saha vaidehyā draṣṭum tau pārthivātmajau ॥6॥", "leonov_ru": "Попросив позволения уйти у всех обезьян во главе с Джамбаваном, После того, как рассказано вам таким образом об этом деле, Должно вместе с Вайдехи [освободив ее от Раваны] увидеть тех двух царевичей.", "commentary": {"bhusana": "जाम्बवत्प्रमुखान् सर्वाननुज्ञाप्य महाहरीन् ।\n\nअस्मिन्नेवंगते कार्ये भवतां च निवेदिते\nन्याय्यं स्म सह वैदेह्या द्रष्टुं तौ पार्थिवात्मजौ", "tilaka": "इदानीं भृत्यजयस्यापि स्वामिसंबन्धित्वसत्त्वेन वयमेव सीतापातिव्रत्यं सहायमासाद्य रावणं जित्वा देव्या सह राघवौ द्रक्ष्यामह इत्याह-- जाम्बवदिति । जाम्बवदादीननुज्ञाप्यानुज्ञां कुर्वन्त्विति संप्रार्थ्य । अस्मिन्कार्ये सीतान्वेषणरूपे । एवंगते उक्तप्रकारं प्राप्ते । तत्प्रकारविशिष्टे च भवतां निवेदिते सति तौ पार्थिवात्मजौ वैदेह्या सन्द्रष्टुं न्याय्यमित्यब्रवीदिति शेषः", "siromani": "जाम्बवदिति । एवमनेन प्रकारेण गते सिद्धिं प्राप्ते अस्मिन् कार्ये भवतां समीपे निवेदिते सति जाम्बवत्प्रमुखान् कपीन् अनुज्ञाप्य तदाज्ञां गृहीत्वेत्यर्थः, वैदेह्या सह पार्थिवात्मजौ द्रष्टुं न्याय्यमस्माकमिति शेषः । सार्धश्लोक एकान्वयी"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В критическом издании строфы 6-17 относятся к следующей (58-й) песни и вложены в уста Ангады (см.: Jhala 1966: 410-413)."}]}, {"verse_id": "5.59.8", "verse": "8", "sanskrit_iast": "kim punaḥ sahito vīrair balavadbhiḥ kṛtātmabhiḥ । kṛtāstraiḥ plavagaiḥ śaktair bhavadbhir vijayaiṣibhiḥ ॥8॥", "leonov_ru": "А тем более – вместе с вами, отважными, могучими, держащими свой дух в узде, Искусными в стрельбе из лука обезьянами, умелыми, жаждущими победы.", "commentary": {"tilaka": "कृतास्त्रैर्देवांशत्वादस्त्रप्रयोगसमर्थैः", "bhusana": "किं पुनः सहितो वीरैर्बलवद्भिः कृतात्मभिः ।\n\nकृतास्त्रैः प्लवगैः शूरैर्भवद्भिर्विजयैषिभिः"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «kṛtātmabhiḥ» опущено"}, {"id": "tier1:5.59.8:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Искусно владеющими оружием (kṛtāstraiḥ) - в комментарии “Тилака” отмечается, что обезьяны владеют оружием благодаря своей полубожественной природе. В комментарии “Амритакатака” это выражение понимается как намек на неуязвимость обезьян."}]}, {"verse_id": "5.59.10", "verse": "10", "sanskrit_iast": "brāhmamastraṃ ca raudraṃ ca vāyavyaṃ vāruṇaṃ tathā । yadi śakrajito’astraṇi durnirīkṣyāṇi samyuge । tāny ahaṃ nihaniṣyāmi vidhamiṣyāmi ca rākṣasān ॥10॥", "leonov_ru": "[Даже] если стрелы Индраджита, которыми владели Брахма, Рудра, Ваю и Варуна, трудно увидеть в битве, Я отобью их и уничтожу ракшасов.", "commentary": {"tilaka": "यद्यपि दुर्निरीक्ष्याणि तथापि तान्यहं निहनिष्यामि ब्रह्मणो वरदानान्निवारयामि । परावृत्तैस्तैरेव राक्षसान्विधमिष्यामि निहनिष्यामि", "bhusana": "ब्राह्ममैन्द्रं च रौद्रं च वायव्यं वारुणं तथा ।\n\nयदि शक्रजितो ऽस्त्राणि दुर्निरीक्षाणि संयुगे", "siromani": "ब्राह्ममिति । ब्रह्मास्त्रादीनि शक्रजितो यदि यान्यस्त्राणि तानि च भवतामभ्यनुज्ञातो ऽहं निहनिष्यामि अत एव राक्षसान् विधमिष्यामि । ननु कथमेवं भवतो निश्चय इत्यत आह-- मे विक्रमः तं रावणं रुणद्धि पीडयतीत्यर्थः । अर्धचतुष्टयमेकान्वयि ।। 5.59.10,11 ।।\n\nमयेति । मया विसृष्टा प्रवर्तिता शैलवृष्टिः देवानपि हन्यात् राक्षसान् हन्यादिति किम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "И Шакраджита стрелы, / Горящие ослепительно (śakrajito’astraṇi durnirīkṣyāṇi) - букв. “на которые трудно смотреть”. Также слово durnirīkṣyāṇi можно понять как “невидимые”. Шакраджит (Победитель Шакры) - другой вариант имени Индраджит."}, {"id": "lexical:5.59.10:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "astraṃ brāhmaṃ", "note_ru": "Брахмастра (brahma-astra, n.) — «оружие [бога] Брахмы»: brahma «Брахма» + astra «метательное оружие» (√as-, «бросать», n. с суфф. -tra). MW: astra 'a missile weapon, arrow'. В стихе Хануман называет четыре категории астр: brahma (Брахмы), raudra (Рудры/Шивы), vāyavya (Ваю) и vāruṇa (Варуны). Астра — не физическая стрела, а наведённое сверхъестественной мантрой оружие, поражающее на любом расстоянии; его «видит» (нирīкшйати) только равный или превосходящий. Список Хануманом четырёх астр — каталог всех стихий (эфир + огонь + ветер + вода): Индраджит покорил все элементарные силы.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:astra+dic_apte:astra", "collision_tier1": true}]}, {"verse_id": "5.59.11", "verse": "11", "sanskrit_iast": "bhavatām abhyanujñāto vikramo me ruṇaddhi tam । mayātulā visṛṣṭā hi śailavṛṣṭirnirantarā ॥11॥", "leonov_ru": "С вашего одобрения сила моя подчинит (сдержит) его. Выпущенный мной несравненный густой дождь камней", "commentary": {"tilaka": "रुणद्धि रोत्स्यति", "bhusana": "तान्यहं विधामिष्यामि निहनिष्यामि राक्षसान् ।\n\nभवतामभ्यनुज्ञातो विक्रमो मे रुणाद्धि तम्\nमया ऽतुला विसृष्टा हि शैलवृष्टिर्निरन्तरा ।\n\nदेवानपि रणे हन्यात् किं पुनस्तान्निशाचरान्"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.11:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "Сдержит его моя сила (vikramo me ruṇaddhi tam) - средневековые комментаторы расходятся в мнении о том, кто здесь имеется в виду. Автор комментария “Таттвадипика” полагает, что речь идет об Индраджите, автор комментария “Широмани” полагает, что подразумевается Равана. Автор комментария “Тилака” отмечает только, что глагол runaddhi передает значение будущего времени (rotsyati).[Е. Костина] «.» \"использован в будущем времени\" - не вполне корректно. Правильнее будет формулировка \"передает значение будущего времени\""}]}, {"verse_id": "5.59.12", "verse": "12", "sanskrit_iast": "devān api raṇe hanyāt kiṃ punas tān niśācarān । bhavatām ananujñāto vikramo me ruṇaddhi mām ॥12॥", "leonov_ru": "В битве убьет даже богов, а тем более тех бродящих по ночам (ракшасов). Если же не будет вашего одобрения, сила моя сдержит меня.", "commentary": {"siromani": "ननु रामसुग्रीवयोर्लङ्कागमनमन्तरा कथमेवं भविष्यतीत्यत आह अहमिति । लङ्कां रावणं च हन्तुम् अहमेकः पर्याप्तो यदि तर्हि भवद्भिः सहितः पर्याप्तश्चेत् किं वक्तव्यम् । अर्धचतुष्टयमेकान्वयि ।। 5.59.7,8 ।।\n\nतान्प्रोत्साहयितुं पुनः स्वपराक्रममाह अहमिति । सैन्यादिविशेषणविशिष्टं रावणं युधि वधिष्यामि\nनन्वेवं सति तत्रैव रावणः कुतो न हतः इत्यत आह-- भवतामिति । भवताम् अननुज्ञात आज्ञात आज्ञाया अभावाद्धेतोर्मे विक्रमो मां रुणद्धि हन्तुं न्यवारयदित्यर्थः । अर्धं पृथक्", "tilaka": "भवतामननुज्ञातः अनुज्ञां विना मे विक्रमो राक्षसवधप्रवृत्तिर्मां रुणद्धीत्यर्थः । अतः पूर्वमेव मया न पराक्रान्तमित्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «vikramo» опущено"}]}, {"verse_id": "5.59.16", "verse": "16", "sanskrit_iast": "sadevāsurayakṣeṣu gandharvoragapakṣiṣu । maindasya pratiyoddhāraṃ śaṃsata dvividasya vā ॥16॥", "leonov_ru": "Скажите, есть ли среди богов, асуров, якшей, гандхарвов, змей и птиц Воин, который мог бы сразиться с Майндой или Двивидой?", "commentary": {"bhusana": "सदेवासुरयक्षेषु गन्धर्वोरगपक्षिषु ।\n\nमैन्दस्य प्रतियोद्धारं शंसत द्विविदस्य वा", "siromani": "सेति । देवादिसहितेषु गन्धर्वादिषु मध्ये मैन्दस्य द्विविदस्य वा प्रतियोद्धारं यूयं शंसत कथयत न को ऽपि प्रतियोद्धा ऽस्तीत्यर्थः"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Майнду и Двивиду» нужен будет комм"}]}, {"verse_id": "5.59.17", "verse": "17", "sanskrit_iast": "aśviputrau mahāvegāvetau plavagasattamau । etayoḥ pratiyoddhāraṃ na paśyāmi raṇājire ॥17॥", "leonov_ru": "Оба сына Ашвинов, лучшие из обезьян, наделены великой быстротой (силой). Не вижу я никого, кто смог бы сразиться с ними на поле боя.", "commentary": {"siromani": "अश्वीति । अश्विपुत्रौ यौ प्लवगसत्तमौ तयोः प्रतियोद्धारं न पश्यामि", "bhusana": "अश्विपुत्रौ महाभागावेतौ प्लवगसत्तमौ ।\n\nएतयोः प्रतियोद्धारं न पश्यामि रणाजिरे"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.17:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Не вижу я никого, / Кто мог бы с ними сразиться (etayoḥ pratiyoddhāraṃ na paśyāmi raṇājire) - букв. “не вижу им достойного противника в сражении”."}]}, {"verse_id": "5.59.18", "verse": "18", "sanskrit_iast": "mayaiva nihatā laṅkā dagdhā bhasmīkṛtā purī । rājamārgeṣu sarveṣu nāma viśrāvitaṃ mayā ॥18॥", "leonov_ru": "Мною уничтожен город Ланка, сожжен и обращен в пепел. На всех царских дорогах прославлено мной имя [Рамы].", "commentary": {"tilaka": "इदानीं सर्वे ऽपि भवन्तस्तद्वधे समर्था इत्याह-- सागरो ऽपीति\nमयैव निहता निहतप्राया । एवं च सर्वैर्मिलित्वा नाशनीयेति किं वाच्यमिति भावः । नामेति सुग्रीवादेरिति शेषः", "bhusana": "पितामहवरोत्सेकात् परमं दर्पमास्थितौ ।\n\nअमृतप्राशिनावेतौ सर्ववानरसत्तमौ"}, "has_tier1": false, "notes": [{"id": "edition:5.59.18:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.59.18 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.59.18", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.59.18", "iast": "mayaiva nihatā laṅkā dagdhā bhasmīkṛtā purī । rājamārgeṣu sarveṣu nāma viśrāvitaṃ mayā ॥18॥"}]}]}, {"verse_id": "5.59.20", "verse": "20", "sanskrit_iast": "ahaṃ kosalarājasya dāsaḥ pavanasambhavaḥ । hanumān iti sarvatra nāma viśrāvitam mayā ॥20॥", "leonov_ru": "Я – слуга правителя Косалы, рожденный ветром, По имени Хануман!» - так мной прославлено имя [Рамы].", "commentary": {"bhusana": "अहं कोसलराजस्य दासः पवनसम्भवः ।\n\nहनुमानिति सर्वत्र नाम विश्रावितं मया\nकरोत्सेकेन मुक्तौ च प्रमथ्य महतीं चमूम् ।\n\nसुराणाममृतं वीरौ पीतवन्तौ प्लवङ्गमौ\nमयैव निहता लङ्कां दग्धा भस्मीकृता पुनः ।\n\nराजमार्गेषु सर्वत्र नाम विश्रावितं मया\nमयैवेति । दग्धत्वेप्यङ्गारावस्था भवति सा ऽपि नास्तीत्याह भस्मीकृतेति\nनामविश्रावणमेवाह जयतीति । जयति सर्वोत्कर्षेण वर्तते । तदुक्तं हरिणा \"जयिर्जयाभिभवयोराद्यर्थे ऽसावकर्मकः । उत्कर्षप्राप्तिराद्यार्थो द्वितीये ऽर्थे सकर्मकः ।।\" इति ।। 5.59.23,24 ।।\n\nअशोकवनिकामध्ये रावणस्य दुरात्मनः ।\n\nअधस्ताच्छिंशुपावृक्षे साध्वी करुणमास्थिता"}, "has_tier1": false, "notes": [{"id": "lexical:5.59.20:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dāsa", "note_ru": "Даса (dāsa, m.) — «слуга, раб», этимология спорна: от имени «дасью» (доарийские жители Индии) или от √dās- («быть враждебным»?). MW: dāsa 'a servant, slave'. Хануман представляется: «ahaṃ kosalarājasya dāsaḥ pavanasambhavaḥ» — «я слуга правителя Косалы, рождённый ветром». Dāsa в устах Ханумана — не социально-правовой статус (раб), а дхармическое самоопределение: bhakti-dāsa, «слуга по любви и преданности». Именно так dāsa понимается в позднейшей бхакти-традиции (особенно вишнуизм). Хануман — прото-тип dāsa-bhakata: великий сам по себе, но самоопределяющийся исключительно через господина.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:dAsa+dic_apte:dAsa"}, {"id": "edition:5.59.20:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.59.20 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.59.20", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.59.20", "iast": "ahaṃ kosalarājasya dāsaḥ pavanasambhavaḥ । hanumān iti sarvatra nāma viśrāvitam mayā ॥20॥"}]}]}, {"verse_id": "5.59.22", "verse": "22", "sanskrit_iast": "rākṣasībhiḥ parivṛtā śokasaṃtāpakarśitā । megharekhāparivṛtā candralekheva niṣprabhā ॥22॥", "leonov_ru": "Окружённая ракшаси, исхудавшая от скорби и страданий, Лишенная [былого] блеска, словно луна, затянутая тучами,", "commentary": {"bhusana": "राक्षसीभिः परिवृता शोकसन्तापकर्शिता ।\n\nमेघलेखापरिवृता चन्द्रलेखेव निष्प्रभा ।\n\nअचिन्तयन्ती वैदेही रावणं बलदर्पितम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.22:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Подобна луне на ущербе, / Скрытой за темными тучами (megharekhāparivṛtā candralekheva niṣprabhā) - букв. “утратившая сияние, подобно 1/16 части лунного диска, скрытого грядой туч”."}, {"id": "lexical:5.59.22:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "megharekhā", "note_ru": "Мегхарекха (megha-rekhā, f.) — «облачная полоска, нить облака»: megha «облако» (√mih-, «мочиться; туманиться», с чередованием) + rekhā «линия, полоска» (√likh-, «царапать, чертить»). MW: rekhā 'a line, streak'. В стихе Сита уподоблена луне, затянутой полоской облака (megharekhāparivṛtā candralekheva niṣprabhā). Megha-rekhā — именно тонкая полоска облака, а не тучи; candralekhā — «серп луны» (реха = полумесяц-черточка). Двойная «линейная» метафора: серп луны = mekhā Ситы, облачко = скорбь/плен, скрывающие свет. Подстрочник передаёт «затянутая тучами»; утрачен образ тонкой полоски, которая скрывает лунный серп, не уничтожая его.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:megha+dic_mw:reKA", "collision_tier1": true}]}, {"verse_id": "5.59.24", "verse": "24", "sanskrit_iast": "anuraktā hi vaidehī rāme sarvātmanā śubhā । ananyacittā rāmeṇa paulomīva puraṃdare ॥24॥", "leonov_ru": "Ибо прекрасная Вайдехи всей душой предана Раме, Не думает она ни о ком, кроме Рамы, словно Пауломи (Шачи) – [ни о ком, кроме] Пурандары (Индры).", "commentary": {"tilaka": "रामेण रामप्रीत्यानन्यचिन्ता पौलोमीव नहुषरुद्धा पौलोमीव", "bhusana": "अनुरक्ता हि वैदेही रामं सर्वात्मना शुभा ।\n\nअनन्यचित्ता रामे च पौलोमीव पुरन्दरे"}, "has_tier1": false, "notes": [{"id": "lexical:5.59.24:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "paulomī", "note_ru": "Пауломи (paulomī, f.) — патронимик от Puloman (демон), отца Шачи: «дочь Пуломана» = Шачи, супруга Индры. MW: paulomī 'daughter of Puloman, wife of Indra'. В сравнении: Сита верна Раме «как Пауломи — Пурандаре (Индре)». Образец супружеской верности в эпосе — пара Шачи–Индра, где преданность Шачи неоднократно описывалась как нерушимая, несмотря на все отлучения Индры (падение в аду и т.д.). Paulomī выбрана не случайно: её отец-демон был убит Индрой, но она всё равно преданна мужу — точная параллель к положению Ситы, чей похититель Равана тоже демон.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:paulomI"}, {"id": "phase2:5.59.24:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "paulomīva puraṃdare", "note_ru": "Тилака уточняет отсылку сравнения: Пауломи (Шачи) хранила верность Индре даже тогда, когда её домогался Нахуша, — миф, стоящий за сравнением и усиливающий его: верность Ситы Раме держится не в спокойных обстоятельствах, а под давлением притязаний похитителя, как верность Шачи под натиском Нахуши.", "type": "В", "source_commentary": ["tilaka"], "why_proposed": "Phase-1 заметка к этому стиху разбирает патроним Пауломи (дочь Пуломана) и общий параллелизм с Шачи-Индрой, но не касается мифа о домогательстве Нахуши; Тилака называет именно этот эпизод как основание сравнения — верность под давлением, а не в покое", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.59.25", "verse": "25", "sanskrit_iast": "tad ekavāsaḥsaṃvītā rajodhvastā tathaiva ca । sā mayā rākṣasīmadhye tarjyamānā muhur muhuḥ ॥25॥", "leonov_ru": "Одетая в одну одежду, покрытая пылью, [Была увидена] мной она в окружении ракшаси, снова и снова подвергающаяся угрозам.", "commentary": {"tilaka": "तदेवाह जयमिति ।। 5.59.19,20 ।।\n\nसीतादुःखविमर्शे ऽपि संप्रत्येव समानेतुमुचितेत्याशयेन तादृशं वर्णयति अशोकेत्यादि ।। 5.59.21,22 ।।\n\nअचिन्तयन्ती योग्यत्वेनागणयन्ती । अगणने हेतुः-- पतिव्रतेति । अगणनाच्चावष्टब्धा निरुढा अस्तीति शेषः\nतदेवाह-- रामसुग्रीवसख्यं चेति । नियतः समुदाचारो दृढपातिव्रत्यं भर्तर्युत्तमा भक्तिश्चास्ति", "bhusana": "सा मया राक्षसीमध्ये तर्ज्यमाना मुहुर्मुहुः ।\n\nराक्षसीभिर्विरूपाभिर्दृष्टा हि प्रमदावने"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «единственномПлатье» нужен будет комм"}]}, {"verse_id": "5.59.27", "verse": "27", "sanskrit_iast": "adhaḥśayyā vivarṇāṅgī padminīva himodaye । rāvaṇād vinivṛttārthā martavyakṛtaniścayā ॥27॥", "leonov_ru": "Спала она на земле, тело ее было бледным, словно лотосовый пруд с наступлением холодов, Отвергнувшая Равану, решилась она умереть.", "commentary": {"siromani": "एकेति । हिमोदये पद्मिनी कमलिनीव विवर्णाङ्गी रावणाद्धेतोर्विनिवृत्तः अर्थो रामसेवा यस्याः सा सीता कथंचित् विश्वासमुपपादिता प्रापिता । श्लोकद्वयमेकान्वयि ।। 5.59.27,28 ।।\n\nतत इति । संभाषिता अत एव सर्वमर्थं प्रकाशिता प्रबुद्धा सीता रामसुग्रीवसख्यं श्रुत्वा प्रीतिमुपागता प्राप्ता", "bhusana": "रावणाद् विनिवृत्तार्था मर्तव्यकृतनिश्चया ।\n\nकथंचिन्मृगशावाक्षी विश्वासमुपपादिता"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «Как лотосовый пруд зимою» комм / отсылка на предыдущий комм по этой теме[Е. Костина] «отвергла» нужен комм., Голдмэны понимают иначе (см. с. 276)"}]}, {"verse_id": "5.59.28", "verse": "28", "sanskrit_iast": "kathaṃ cin mṛgaśāvākṣī viśvāsam upapāditā । tataḥ sambhāṣitā caiva sarvam arthaṃ prakāśitā ॥28॥", "leonov_ru": "С трудом завоевал я доверие ланеокой. Тогда заговорила она со мной, и стало ясно ей все дело.", "commentary": {"tilaka": "कथञ्चिदादौ तूष्णीं रामकथाप्रस्तावेन सर्वमर्थं रामसुग्रीववृत्तान्तम्"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.28:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Обо всем, что случилось с Рамой (sarvam arthaṃ) - букв. “вся суть”. В комментарии “Тилака” поясняется: “То, что случилось с Рамой и Сугривой”."}]}, {"verse_id": "5.59.29", "verse": "29", "sanskrit_iast": "rāmasugrīvasakhyaṃ ca śrutvā prītim upāgatā । niyataḥ samudācāro bhaktir bhartari cottamā ॥29॥", "leonov_ru": "Обрадовалась она, услышав о дружбе Рамы и Сугривы. Неизменным было ее добродетельное поведение, и высочайшей – преданность мужу.", "commentary": {"siromani": "नियत इति । नियतः समुदाचारः सीतासदाचरणं भर्तरि रामे उत्तमा भक्तिश्च यद्यस्माद्दशग्रीवं न हन्ति तस्माद्दशाननो महात्मा प्रतीयते इति शेषः, एतेन रावणो मृतप्राय एवेति सूचितम् । अत एव रामः तस्य रावणस्य वधे निमित्तमात्रं भविष्यति । सार्धश्लोक एकान्वयी ।। 5.59.30,31 ।।\n\nसीतास्वरूपं निर्वक्ति सेति । प्रकृत्यैव तन्वङ्गी सीता तद्वियोगात् रामवियोगजदुःखात् कर्शिता अतिकृशत्वं प्राप्ता अत एव प्रतिपत्पाठशीलस्य जनस्य विद्येव तनुतां गता"}, "has_tier1": false, "notes": [{"id": "phase2:5.59.29:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "niyataḥ samudācāraḥ", "note_ru": "Широмани делает из непоколебимой преданности Ситы вывод о судьбе Раваны: раз Сита, способная испепелить его гневом, воздерживается, значит, гибель Раваны уже предрешена её подвижничеством, — а Рама в его убийстве будет лишь «орудийной причиной» (нимитта-матра), но не подлинным виновником конца.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "подстрочник сообщает лишь о верности и радости Ситы; Широмани строит из этого доктринальный вывод о предрешённости гибели Раваны и о роли Рамы как формальной, а не главной причины — сюжетная функция, не считываемая из перевода", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.59.3033", "verse": "3033", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "प्रमदावने अशोकवनिकायाम् । विनिवृत्तार्था त्यक्तप्रयोजना । रावणप्रलोभनवाक्यैरवशीकृतेत्यर्थः । सर्वमर्थं रामोद्योगादिकम् । दर्शिता बोधिता"}, "has_tier1": true, "notes": [{"id": "tier1:5.59.3033:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Как знание ученика / В первый день половины месяца (pratipatpāṭhaśīlasya vidyeva tanutām gatā) - имеется в виду первый день светлой или темной половины лунного месяца, когда у учеников, изучающих Веды был отдых от занятий.", "anchor_verse_id": "5.59.31"}, {"id": "lexical:5.59.3033:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pratipat", "note_ru": "Пратипат (pratipat, f.) — «первый день [лунной] половины месяца» (prathamā tithi pakṣasya): prati «против, обратно» + √pad- «идти». MW: pratipat 'the first day of a lunar fortnight'. В сравнении: «śīla знания того, кто изучает (Веды) в первый день половины» = в день pratipat луна/Веды только начинают прибывать. Tanūtā (истощение) Ситы сравнивается с «тонкостью» только что нарождающегося лунного серпа. Calendrical simile: pratipat-луна — самая тонкая, едва видимая, почти отсутствующая. Образ Ситы = луна-pratipat: жизнь есть, но едва заметна.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:pratipat+dic_apte:pratipat", "anchor_verse_id": "5.59.31", "collision_tier1": true}, {"id": "edition:5.59.3033:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.59.31 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.59.31", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.59.31", "iast": "sā prakṛtyaiva tanvaṅgī tadviyogāc ca karśitā । pratipatpāṭhaśīlasya vidyeva tanutām gatā ॥31॥"}], "anchor_verse_id": "5.59.31", "collision_tier1": true}]}, {"verse_id": "5.59.32", "verse": "32", "sanskrit_iast": "evam āste mahābhāgā sītā śokaparāyaṇā । yad atra pratikartavyaṃ tat sarvam upakālpyatām ॥32॥", "leonov_ru": "Так сидела (в таком состоянии пребывала) наделенная великой долей Сита, удрученная скорбью. Должно [нам] теперь сделать все, что должно помочь [ей].", "commentary": {"tilaka": "नैतावता सीताशीलं दुर्बलमित्याशङ्क्यमित्याह नेति । यत्क्रुद्धा सीता कुर्यात्तत्स्पृष्टा ऽग्निशिखापि न कुर्यात् । इयं तु भर्तुः पराक्रमकीर्तये नाद्यापि क्रुध्यतीति भावः । अक्रुद्धाया अपि स्पर्शमात्रेण प्राप्तो नाशस्तु रावणतपसा निवारित इति ध्येयम्\nइयत्यापि सामग्र्या यद्दशाननं शापादिना न हन्ति तत्स दशाननो महात्मा तपोबलेन शापायोग्य इति भावः । अथापि सीतावरोधजन्यपापेन मृतप्राय एव स इत्याह-- निमित्तमात्रमिति । अतो ऽस्माभिरपि सुशक्यवध एव स इति भावः", "bhusana": "एवं स्थिते युष्मदनुमत्या भृत्यविजयो ऽपि स्वामिन एवेति कृत्वा सीतारामपदावलम्बादहमेव रावणं निर्जित्य सीतापुरस्कारेणैव रावघौ द्रक्ष्यामीत्याह जाम्बवदिति ।। 5.59.5,6 ।।\n\nअहमेको ऽपि पर्याप्तः सराक्षसगणां पुरीम् ।\n\nतां लङ्कां तपसा हन्तुं रावणं च महाबलम्\nतदेकवासः संवीता रजोध्वस्ता तथैव च ।\n\nशोकसन्तापदीनाङ्गी सीता भर्तृहिते रता\nअथ सीतादुर्दशाविमर्शे ऽपि सम्प्रत्यसौ समानेतव्येत्याशयेन तदृशां दर्शयति अशोकेत्यादिना ।। 5.59.25,26 ।।\n\nपतिव्रता च सुश्रोणी अवष्टब्धा च जानकी"}, "has_tier1": false, "notes": [{"id": "lexical:5.59.32:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mahābhāgā", "note_ru": "Махабхага (mahā-bhāgā, f.) — «наделённая великой долей / великим счастьем»: mahā «великий» + bhāgā f. «доля, удел» (от √bhaj-, «делить, одарять»). MW: mahābhāga 'highly fortunate, eminent'. Bhāga — «то, что выделено» (ср. lak-ṣmī — «богатство судьбы», Fortuna). Mahābhāgā — формульный эпитет в ситуациях, когда велика «обречённость» судьбы: великая доля означает и великое испытание. Он применяется к Сите именно в момент её наибольшего страдания — подчёркивая, что величие судьбы включает испытание, а не отрицает его.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:mahABAga"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};

const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

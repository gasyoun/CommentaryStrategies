<script>
const D = {"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 44, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 25, "verses_with_notes": 12, "notes_by_layer": {"tier1": 6, "lexical": 6, "phase2": 2, "edition": 1, "crosstext": 2}}, "sarga": 44, "verses": [{"verse_id": "5.44.1", "verse": "1", "sanskrit_iast": "saṃdiṣṭo rākṣasendreṇa prahastasya suto balī । jambumālī mahādaṃṣṭro nirjagāma dhanurdharaḥ ॥1॥", "leonov_ru": "По приказу владыки ракшасов могучий сын Прахасты Джамбумалин с огромными клыками, вышел, вооруженный луком.", "commentary": {"bhusana": "सन्दिष्टो राक्षसेन्द्रेण प्रहस्तस्य सुतो बली ।\n\nजम्बुमाली महादंष्ट्रो निर्जगाम धनुर्धरः\nसंदिष्ट इत्यादि"}, "has_tier1": false, "notes": [{"id": "lexical:5.44.1:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mahādaṃṣṭra", "note_ru": "Махадамштра (mahā-daṃṣṭra, adj.) — бахуврихи: mahā «великий» + daṃṣṭrā «клык, выступающий зуб» (от √daṃś- «кусать», Whitney #196). MW: daṃṣṭrā 'a large tooth, a tusk, a fang'. В ракшасской иконографии выступающие клыки (daṃṣṭrā) — обязательный признак нечеловеческой природы, визуальный маркер otherness. Описание Джамбумалина начинается не с оружия, а с bodily marker: mahādaṃṣṭra помещает его в ряд архетипических ракшасов (Вирадха в Аранья-канде, стражи Ланки). Подстрочник «с огромными клыками» передаёт значение, но не эпическую функцию маркера.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:daMzwrA"}]}, {"verse_id": "5.44.2", "verse": "2", "sanskrit_iast": "raktamālyāmbaradharaḥ sragvī rucirakuṇḍalaḥ । mahān vivṛttanayanaś caṇḍaḥ samaradurjayaḥ ॥2॥", "leonov_ru": "В красных гирляндах и одеждах, с венком, с сияющими серьгами Огромный, с округленными глазами, свирепый, трудноодолимый в битве.", "commentary": {"bhusana": "रक्तमाल्याम्बरधरः स्रग्वी रुचिरगुण्डलः ।\n\nमहान् विवृत्तनयनश्चण्डः समरदुर्जयः\nविवृत्तनयनः मण्डलीकृतनयनः"}, "has_tier1": false, "notes": [{"id": "lexical:5.44.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "samaradurjaya", "note_ru": "Самарадурджая (samara-durjaya, adj.) — тат-пуруша: samara «битва» (от sam-√ṛ- «сходиться», √ṛ- «идти», Whitney #24) + dur- (отрицательный префикс «трудно») + jaya (√ji- «побеждать»). MW: samara 'conflict, battle'; durjaya 'hard to be conquered'. Стандартный перевод «труднопобедимый в бою» не раскрывает, что samara — именно «схождение, столкновение» (не yuddhа «борьба» и не raṇa «поле»). Samara подчёркивает динамику встречи противников, а durjaya оказывается нагружен дополнительным смыслом: «тот, кого трудно одолеть именно в момент схождения», — то есть его сила проявляется именно в инициации боя.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:samara+dic_mw:durjaya"}]}, {"verse_id": "5.44.3", "verse": "3", "sanskrit_iast": "dhanuḥ śakradhanuḥprakhyaṃ mahad rucirasāyakam । visphārayāṇo vegena vajrāśanisamasvanam ॥3॥", "leonov_ru": "Лук, подобный луку Шакры, великий, со сверкающими стрелами Натягивающий с силой, звучащий подобно молнии Индры.", "commentary": {"bhusana": "धनुः शक्रधनुः प्रख्यं महद्रुचिरसायकम् ।\n\nविस्फारयानो वेगेन वज्राशनिसमस्वनम्\nरुचिरसायकं रुचिरसायकार्हम् । विस्फारयानः विस्फारयमाणः, ज्याकर्षणं कुर्वन्नित्यर्थः । वज्राशनिसमस्वनमिति विस्फारणक्रियाविशेषणम्"}, "has_tier1": false, "notes": [{"id": "lexical:5.44.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śakradhanus", "note_ru": "Шакрадханус (śakra-dhanus, n.) — «лук Шакры (Индры)»; в народной этимологии śakra- также означает «радуга» (MW: śakradhanus 'Indra's bow, the rainbow'). Описание лука Джамбумалина как «подобного луку Шакры» — двойная семантика: (1) лук настолько велик, что равен оружию царя богов; (2) в сравнении с радугой — визуальное: огромная, ослепительно украшенная дуга. Обе семантики активны в формульном сравнении, тогда как подстрочник «подобный луку Шакры» оставляет выбор читателю.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:SAkraDAnus"}]}, {"verse_id": "5.44.6", "verse": "6", "sanskrit_iast": "taṃ toraṇaviṭaṅkasthaṃ hanūmantaṃ mahākapim । jambumālī mahātejā vivyādha niśitaiḥ śaraiḥ ॥6॥", "leonov_ru": "Стоящего на вершине арки ворот великую обезьяну Ханумана Джамбумалин, наделенный великой мощью, поразил острыми стрелами.", "commentary": {"tilaka": "तोरणविटङ्कस्तोरणस्तम्भयोरुपरितिर्यक्प्रतिष्ठापितकपोतपालिकादारु", "bhusana": "तं तोरणविटङ्कस्थं हनुमन्तं महाकिपम् ।\n\nजम्बुमाली महाबाहुर्विव्याध निशितैः शरैः\nतोरणविटङ्कं तोरणस्य कपोतपालिका । \"कपोतपालिकायां तु विटङ्कं पुन्नपुंसकम्\" इत्यमरः । स्तम्भोपरि तिर्यङ्निहितदार्वित्यर्थः", "siromani": "तमिति । तोरणविटङ्कस्थं तोरणविटङ्कः तोरणस्तम्भयोरुपरि तिर्यक्प्रतिष्ठापितकपोतपालिकाकाष्ठं तत्स्थं हनूमन्तं निशितैः शरैः जम्बुमाली विव्याध"}, "has_tier1": false, "notes": [{"id": "phase2:5.44.6:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "toraṇaviṭaṅka", "note_ru": "«Вершина арки ворот» (toraṇaviṭaṅka) — по Тилаке и Бхушане (со ссылкой на «Амару»), не просто верх арки, а конкретная деревянная перекладина, положенная поперёк двух столбов ворот, — насест для голубей (kapotapālikā). Хануман сидит именно на этой балке, а не абстрактно «на арке».", "type": "В", "source_commentary": ["tilaka", "bhusana"], "why_proposed": "уточняет архитектурную реалию (конкретная перекладина ворот, а не арка вообще), не отражённую ни в подстрочнике, ни в существующих примечаниях.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.44.7", "verse": "7", "sanskrit_iast": "ardhacandreṇa vadane śirasy ekena karṇinā । bāhvor vivyādha nārācair daśabhis tu kapīśvaram ॥7॥", "leonov_ru": "[Одной] стрелой, подобной полумесяцу, в лицо, одной [стрелой] с колючками (с ушами) в голову, В обе руки поразил десятью стрелами владыку обезьян.", "commentary": {"tilaka": "कर्ण्यङ्कुशाकाराग्रशरविशेषः", "bhusana": "अर्धचन्द्रेण वदने शिरस्येकेन कर्णिना ।\n\nबाह्वोर्विव्याध नाराचैर्दशभिस्तं कपीश्वरम्\nएकेनेत्येतदर्धचन्द्रस्यापि विशेषणम् । अर्धचन्द्राकाराग्रशरेणेत्यर्थः । कर्णिना कर्णवच्छरेण"}, "has_tier1": true, "notes": [{"id": "tier1:5.44.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «nārācair» если есть комм. про два других типа стрел, то нужен и про эти"}, {"id": "tier1:5.44.7:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В лицо – стрелой-полумесяцем, / Ушастой стрелою – в голову (ardhacandreṇa vadane śirasy ekena karṇinā) – средневековые комментаторы (в частности, автор комментария «Тилака») поясняют, что ушастой стрелой (karṇin) называется стрела, имеющая наконечник в форме анка. Голдмены переводят «karṇin» как barbed arrow (см.: Goldman 1984: 232). В комментарии «Широмани» сообщается, что «стрела-полумесяц» (ardhacandra) – это стрела, наконечник которой имеет форму полумесяца."}, {"id": "lexical:5.44.7:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "ardhacandra", "note_ru": "Ардхачандра (ardha-candra, m.) — «полумесяц» как тип боевой стрелы с луновидным наконечником (ardhacandra-bāṇa). MW: ardhacandra 'a crescent-shaped arrow-head'. Это специфический тип арсенала, отличный от kṣura (бритвенный), bhalla (широкий) и vatsadanta (зубовидный). Функция ardhacandra — рассекающий удар в лицо (подтверждено контекстом: ārdha-candreṇa vadane). Подстрочник «стрела подобная полумесяцу» не уточняет, что это nomenklaturnoe oружие, а не просто сравнение формы.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:arDacandra", "collision_tier1": true}, {"id": "crosstext:5.44.7:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "принято", "lemma_iast": "nārāca", "note_ru": "Ровно тот же приём — поражение врага железной стрелой nārāca в лицо / между бровей — формульно повторяется в Карнапарве: «Арджуна с силой вонзил железную стрелу между бровей (Ашваттхамана); и с этой стрелой воссиял сын Дроны, словно солнце с устремлённым ввысь лучом». Сундара 44.7 («одной стрелой, подобной полумесяцу, в лицо … десятью стрелами [поразил]») — кавья-вариация той же батальной формулы прицельного выстрела нарача.\n\nПараллель — Karṇaparva 8.12.50-51:\nСА: tato'vidhyadbhruvormadhye nārācenārjuno bhṛśam । sa tena vibabhau drauṇirūrdhvaraśmiryathā raviḥ ॥50॥ atha kṛṣṇau śaraśatairaśvatthāmnārditau bhṛśam । saraśmijālanikarau yugāntārkāvivāsatuḥ ॥51॥\nРУ: Вот Арджуна с силой вонзил железную стрелу между бровей (Ашваттхаману); и с этой (стрелой) воссиял сын Дроны, словно солнце с (единственным) устремленным ввысь лучом. А два Кришны, тоже тяжко израненные сотнями стрел Ашваттхамана, были подобны двум солнцам светопреставления, ощетинившимся множеством лучей.\n\nСвидетельство: уровень шлоки (мягкое, корпусное); требуется проверка.", "type": "Б", "cluster": "mbh_battle", "cluster_label": "", "shloka_ref": "V.44.7", "work_label": "", "verse_address": "", "parallel_sa_iast": "tato'vidhyadbhruvormadhye nārācenārjuno bhṛśam । sa tena vibabhau drauṇirūrdhvaraśmiryathā raviḥ ॥50॥ atha kṛṣṇau śaraśatairaśvatthāmnārditau bhṛśam । saraśmijālanikarau yugāntārkāvivāsatuḥ ॥51॥", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Karṇaparva 8.12.50-51", "collision_tier1": true}]}, {"verse_id": "5.44.8", "verse": "8", "sanskrit_iast": "tasya tac chuśubhe tāmraṃ śareṇābhihataṃ mukham । śaradīvāmbujaṃ phullaṃ viddhaṃ bhāskararaśminā ॥8॥", "leonov_ru": "Его (Ханумана) лицо, медно-красное, пораженное стрелой, стало подобным Раскрытому лотосу осенью, озаренному лучами солнца.", "commentary": {"bhusana": "तस्य तच्छुशुभे ताम्रं शरेणाभिहतं मुखम् ।\n\nशरदीवाम्बुजं फुल्लं विद्धं भास्कररश्मिना\nअम्बुजं रक्तपद्मम् । भास्कररश्मिना विद्धम् अत एव फुल्लमित्यर्थः", "siromani": "तस्येति । शरेण अभिहतं तस्य हनूमतस्ताम्रं मुखं भास्कररश्मिना सूर्यकिरणेन विद्धं विकाशितं फुल्लमम्बुजमिव शुशुभे"}, "has_tier1": true, "notes": [{"id": "tier1:5.44.8:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Казалось лицо Ханумана / Огромным лотосом в небе (śuśubhe mukham yathākāśe mahāpadmaṃ) – сравнение лица с лотосом является традиционным в индийской поэзии. С лучами солнца здесь сравниваются стрелы, вонзившиеся в лицо Ханумана."}]}, {"verse_id": "5.44.9", "verse": "9", "sanskrit_iast": "tattasya raktaṃ raktena rañjitaṅ śuśubhe mukham । yathākāśe mahāpadmaṃ siktaṃ kāñcanabindubhiḥ ॥9॥", "leonov_ru": "Его лицо красное, красным окрашенное, стало подобным Великому лотосу в небе, окропленному золотыми каплями.", "commentary": {"tilaka": "अम्बुजं रक्ताम्बुजम्\nतत्तस्य रक्तम् । स्वत इति शेषः । रक्तेन क्षतजेन रञ्जितं मुखमाकाशे काञ्चनबिन्दुभी रक्ताशोकपुष्परसबिन्दुभिः सिक्तं महापद्मं महत्तरं रक्तपद्ममिवेत्यभूतोपमेयम् । अशोकः काञ्चनाह्वयः ।। 5.44.9,10 ।।\n\nताडयामास बिभेद", "bhusana": "तत्तस्य रक्तं रक्तेन ऱञ्जितं शुशुभे मुखम् ।\n\nयथा ऽ ऽकाशे महापद्मं सिक्तं चन्दनबिन्दुभिः\nरक्तं स्वत एव रक्तम् । रक्तेन शोणितेन । महापद्मं रक्तोत्पलम् । चन्दनबिन्दुभिः रक्तचन्दनबिन्दुभिः"}, "has_tier1": true, "notes": [{"id": "tier1:5.44.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Окропленным золотистыми каплями (siktaṃ kāñcanabindubhiḥ) – в комментарии «Тилака» поясняется, что речь идет о каплях нектара цветка ашоки. Автор комментария «Таттвадипика» дает вариант candanabindubhiḥ и поясняет, что речь идет о каплях красного сандала (raktacandanabindubhiḥ). Голдмены переводят «sprinkled with drops of sandalpaste». (см.: Goldman 1984: 471)."}, {"id": "edition:5.44.9:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.44.9 отсутствует в критическом издании (Барода).", "kind": "single", "range": "5.44.9", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.44.9", "iast": "tattasya raktaṃ raktena rañjitaṅ śuśubhe mukham । yathākāśe mahāpadmaṃ siktaṃ kāñcanabindubhiḥ ॥9॥"}], "collision_tier1": true}]}, {"verse_id": "5.44.12", "verse": "12", "sanskrit_iast": "vipannaṃ karma tad dṛṣṭvā hanūmāṃś caṇḍavikramaḥ । sālaṃ vipulam utpāṭya bhrāmayām āsa vīryavān ॥12॥", "leonov_ru": "Видя, что это дело не удалось, Хануман, наделенный свирепой (неистовой) мощью, Схватив огромное дерево сала, стал вращать [его], могучий.", "commentary": {"tilaka": "अथ जम्बुमाल्यागमनं तद्वधश्च-- सन्दिष्ट इति ।। 5.44.1,2 ।।\n\nधनुर्विस्फारयाणो विस्फारयमाणः विस्फारो ज्याघोषः", "siromani": "तदाकारमाह-- अर्धेति । अर्धचन्द्रेण अर्धचन्द्राकारशरविशेषेण वदने एकेन कर्णिना अङ्कुशाकाराग्रभागकशरविशेषेण शिरसि दशभिर्नाराचैः शरविशेषैर्बाह्वोः कपीश्वरं विव्याध\nविपन्नमिति । चण्डविक्रमो हनूमान् विपन्नं विनष्टं कर्म स्वव्यापारं दृष्ट्वा विपुलं बृहत् शालमुत्पाट्यभ्रामयामास", "bhusana": "विपन्नं कर्म तद् दृष्ट्वा हनुमांश्चण्डविक्रमः ।\n\nसालं विपुलमुत्पाट्य भ्रामयामास वीर्यवान्"}, "has_tier1": true, "notes": [{"id": "tier1:5.44.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "kostina", "note_ru": "[Е. Костина] «сала» комм реалии"}]}, {"verse_id": "5.44.15", "verse": "15", "sanskrit_iast": "sa śaraiḥ pūritatanuḥ krodhena mahatā vṛtaḥ । tameva parighaṃ gṛhya bhrāmayāmāsa vegitaḥ ॥15॥", "leonov_ru": "Он, чье тело было утыкано (наполнено) стрелами, объятый великим гневом Схватив железную балку, стал размахивать [ею], стремительный (возбужденный).", "commentary": {"bhusana": "स शरैः पूरिततनुः क्रोधेन महता वृतः ।\n\nतमेव परिघं गृह्य भ्रामयामास वेगतः", "siromani": "स इति । शरैः पूरिततनुः स हनूमान् तं पूर्वगृहीतं परिघं गृह्य गृहीत्वा भ्रामयामास"}, "has_tier1": false, "notes": [{"id": "lexical:5.44.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "parigha", "note_ru": "Паригха (parigha, m.) — специфическое оружие ближнего боя: железная балка или засов (MW: parigha 'an iron bar or beam used for locking or shutting a gate; a club or crowbar used as a weapon'). Этимология: pari- «вокруг» + √han- «бить» → «то, чем бьют кругом». В эпосе parigha — характерное оружие ракшасов и богатырей-nāga; у богов оружием служит vajra. Смена оружия: Хануман отбрасывает sāla (дерево) и берёт parigha (металлическую балку) — эскалация материала от природного к кованому, перед финальным уничтожением Джамбумалина.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:parigha"}]}, {"verse_id": "5.44.16", "verse": "16", "sanskrit_iast": "ativego 'tivegena bhrāmayitvā balotkaṭaḥ । parighaṃ pātayām āsa jambumāler mahorasi ॥16॥", "leonov_ru": "Очень быстрый очень быстро завращав [ее], могучий, Железную балку швырнул в огромную грудь Джамбумалина.", "commentary": {"bhusana": "अतिवेगो ऽतिवेगेन भ्रामयित्वा बलोत्कटः ।\n\nपरिघं पातयामास जम्बुमालेर्महोरसि", "siromani": "अतीति । मदोत्कटो हनूमान् परिघं भ्रामयित्वा जम्बुमालेर्महोरसि पातयामास"}, "has_tier1": true, "notes": [{"id": "tier1:5.44.16:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В широкую грудь Джамбумалину (jambumāler mahorasi) – в этой строфе вместо формы jambumālin использована форма jambumāli. Эта же форма использована в строфе 19."}]}, {"verse_id": "5.44.17", "verse": "17", "sanskrit_iast": "tasya caiva śiro nāsti na bāhū jānunī na ca । na dhanur na ratho nāśvās tatrādṛśyanta neṣavaḥ ॥17॥", "leonov_ru": "Нет [теперь] у него (Джамбумалина) ни головы, ни рук, ни коленей. Не видно там ни лука, ни колесницы, ни коней (ослов), ни стрел.", "commentary": {"bhusana": "तस्य चैव शिरो नास्ति न बाहू न च जानुनी ।\n\nन धनुर्न रथो नाश्वास्तत्रादृश्यन्त नेषवः", "siromani": "तस्येति । तस्य हनुमता हतस्य जम्बुमालेः शिरः प्रभृतयो नादृश्यन्त विनष्टा इत्यर्थः"}, "has_tier1": false, "notes": [{"id": "phase2:5.44.17:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "na aśvāḥ", "note_ru": "«Не видно там ни коней» (nāśvāḥ) — по Тилаке, здесь словом aśva обозначены не кони, а те же ослы (khara), на которых ранее (V.44.5) была запряжена колесница Джамбумалина: перед читателем не смена упряжки, а то же самое разбитое имущество ракшаса.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "снимает видимое противоречие подстрочника (кони вместо ослов) внутритекстовой ссылкой на стих 5, не отражённой ни в подстрочнике, ни в существующих примечаниях; пратика этого фрагмента сегментатором не подтверждена (merged-range 17-20), но содержание точно соответствует лексике стиха 17 (nāśvāḥ) и явно продолжает пратику «tasya caiva» этого же стиха.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.44.19", "verse": "19", "sanskrit_iast": "jambumāliṃ sunihataṃ kiṃkarāṃś ca mahābalān । cukrodha rāvaṇaḥ śrutvā krodhasaṃraktalocanaḥ ॥19॥", "leonov_ru": "О том, что убиты Джамбумалин и кинкары могучие, Услышав, Равана разгневался, и глаза его покраснели от гнева.", "commentary": {"bhusana": "जम्बुमालिं च निहतं किङ्करांश्च महाबलान् ।\n\nचुक्रोध रावणः श्रुत्वा कोपसंरक्तलोचनः", "siromani": "जम्बुमालिमिति । रावणः जम्बुमालिप्रभृतिं सुनिहतं श्रुत्वा चुक्रोध"}, "has_tier1": false, "notes": [{"id": "lexical:5.44.19:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "jambumālin", "note_ru": "Джамбумалин (jambumālin) — сын Прахасты, ракшаса-воин (jambu-mālin «в гирлянде из роз»), первый полководец, посланный против Ханумана и им убитый; эпитет raṇakovida «искусный в бою». Его гибель открывает череду поединков в роще. Первое появление персонажа.", "type": "В", "subtype": "base", "trigger": "realia", "source": "gazetteer (analysis §09б / formulas tt.1-2) — first occurrence in кн. V (verse-level, soft)"}, {"id": "crosstext:5.44.19:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "krodhasaṃraktalocana", "note_ru": "Кродха-самракта-лочана (krodhasaṃraktalocana) «с глазами, покрасневшими от гнева» — формула ярости: в Бала-канде 1.36.21 так описана проклинающая богов мать (Дити). В Сундаре (V.44.19) тем же оборотом передан гнев Раваны, узнавшего о гибели Джамбумалина. Один формуляр аффекта связывает мифологический гнев и гнев главного антагониста.\n\nПараллель — Rām. Bāla 1.36.21:\n  «samanyuraśapat sarvān krodhasaṃraktalocanā । yasmānnivāritā cāhaṃ saṅgatā putrakāmyayā ॥21॥»\n  Покрасневшими от гнева глазами, Всех их прокляла, негодуя: \"Я так хотела иметь сына, А вы меня его лишили.", "type": "Б", "cluster": "ramayana_grintser", "cluster_label": "Рамаяна I–III (Гринцер) — углубление", "shloka_ref": "V.44.19", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Vālmīki Rāmāyaṇa, Rām. Bāla 1.36.21 (Гринцер, пер. изд. I–III)"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_apparatus_s44_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const STATUS_CLS = s => s==="ожидает гейта М.Г." ? "b-gate" : "b-status";

function commBlock(comm){
  return Object.keys(comm||{}).map(c=>`<div class="comm"><span class="who">${D.labels[c]||c}</span><span class="dev">${esc(comm[c])}</span></div>`).join("");
}

function noteHtml(n,vi,ni){
  const d=dec[n.id]||{};
  const badges=[`<span class="badge b-${n.layer}">${esc(n.layer_label)}</span>`,
    `<span class="badge ${STATUS_CLS(n.status)}">${esc(n.status)}</span>`];
  if(n.layer==="tier1"&&n.editor) badges.push(`<span class="badge b-status">${esc(n.editor)}</span>`);
  if(n.type) badges.push(`<span class="badge b-status">тип ${esc(n.type)}</span>`);
  if(n.cluster_label) badges.push(`<span class="badge b-status">${esc(n.cluster_label)}</span>`);
  if(n.quality) badges.push(`<span class="badge b-status">${esc(n.quality)}</span>`);
  if(n.edition_flag && n.edition_flag!=="vulgate")
    badges.push(`<span class="badge b-crit">⚠ нумерация: ${esc(n.edition_flag)} (${esc(n.shloka_critical)})</span>`);
  let body="";
  if(n.lemma_iast) body+=`<span class="lemma">${esc(n.lemma_iast)}</span> — `;
  body+=esc(n.note_ru||"");
  let extra="";
  if(n.why_proposed) extra+=`<div class="meta"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>`;
  if(n.mg_comment) extra+=`<div class="meta"><b>Ремарка М.Г.:</b> ${esc(n.mg_comment)}</div>`;
  if(n.layer==="crosstext"&&n.parallel_sa_iast){
    extra+=`<div class="par"><b>${esc(n.work_label||"")}</b> ${esc(n.verse_address||"")}${n.verse_address_vulgate?` · ${esc(n.verse_address_vulgate)}`:""}<br><span class="sa">${esc(n.parallel_sa_iast)}</span></div>`;
  }
  if(n.layer==="edition"&&(n.verses_iast||[]).length){
    extra+=`<details><summary>Текст отсутствующих в критическом издании шлок</summary>${
      n.verses_iast.map(v=>`<div class="par"><b>${esc(v.verse_id)}</b> <span class="sa">${esc(v.iast)}</span></div>`).join("")}</details>`;
  }
  if(n.source) extra+=`<div class="meta">Источник: ${esc(n.source)}</div>`;
  if((n.source_commentary||[]).length) extra+=`<div class="meta">Комментаторы: ${n.source_commentary.map(c=>D.labels[c]||c).join(", ")}</div>`;
  const collide=n.collision_tier1?`<div class="collide">⚠ на этом стихе уже есть примечание яруса 1 (Леонов/Костина) — см. выше, проверьте на дублирование</div>`:"";
  const controls=n.votable?`
    <div class="controls">
      <label><input type="radio" name="a_${n.id}" value="accept"> ✅ принять</label>
      <label><input type="radio" name="a_${n.id}" value="edit"> ✏️ править</label>
      <label><input type="radio" name="a_${n.id}" value="reject"> ❌ отклонить</label>
    </div>
    <textarea class="hidden" id="e_${n.id}" rows="3">${esc(d.edited_note||n.note_ru||"")}</textarea>
    <input class="rr hidden" id="r_${n.id}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||"")}">`:"";
  return `<div class="note l-${n.layer} ${d.action?("d-"+d.action):""}" id="n_${n.id}">
    <div>${badges.join("")}</div>
    <div class="ntext">${body}</div>${extra}${collide}${controls}</div>`;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  const m=D._meta, bl=m.notes_by_layer, L=m.sources;
  app.appendChild($(`<div class="legend"><b>Песнь ${D.sarga}</b>: стихов ${m.verses_total}, с примечаниями ${m.verses_with_notes}. Слои: <span class="badge b-tier1">${L.tier1}</span> ${bl.tier1} (без голосования) · <span class="badge b-lexical">${L.lexical}</span> ${bl.lexical} · <span class="badge b-phase2">${L.phase2}</span> ${bl.phase2} · <span class="badge b-edition">${L.edition}</span> ${bl.edition} · <span class="badge b-crosstext">${L.crosstext}</span> ${bl.crosstext}. Статус <span class="badge b-gate">ожидает гейта М.Г.</span> — решение по пилоту (H142) ещё не применено.</div>`));
  D.verses.forEach((v,vi)=>{
    const card=$(`<div class="vcard"></div>`);
    card.innerHTML=`
      <div class="vhead"><b>${v.verse_id}</b>${v.has_tier1?' · <span class="badge b-tier1">есть примечание яруса 1</span>':''}</div>
      <div class="verse">
        <div class="sa dev">${esc(v.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(v.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      ${Object.keys(v.commentary||{}).length?`<details><summary>Санскритские комментаторы к стиху</summary>${commBlock(v.commentary)}</details>`:''}
      ${v.notes.map((n,ni)=>noteHtml(n,vi,ni)).join("")}`;
    app.appendChild(card);
    v.notes.filter(n=>n.votable).forEach(n=>{
      const d=dec[n.id]||{};
      card.querySelectorAll(`input[name="a_${CSS.escape(n.id)}"]`).forEach(r=>{
        if(d.action===r.value) r.checked=true;
        r.onchange=()=>set(n,r.value);
      });
      toggle(n.id,d.action);
    });
  });
  prog();
}
function toggle(id,action){
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  if(e)e.classList.toggle("hidden",action!=="edit");
  if(r)r.classList.toggle("hidden",action!=="reject");
}
function set(n,action){
  const id=n.id,rec=dec[id]||{};
  rec.action=action;
  rec.verse_id=n.verse_id||id.split(":")[1];
  rec.layer=n.layer;
  if(n.lemma_iast)rec.lemma_iast=n.lemma_iast;
  const e=document.getElementById("e_"+id),r=document.getElementById("r_"+id);
  rec.edited_note=e?e.value:"";
  rec.reject_reason=r?r.value:"";
  rec.ts=new Date().toISOString();
  dec[id]=rec;
  if(e)e.oninput=()=>{rec.edited_note=e.value;save();};
  if(r)r.oninput=()=>{rec.reject_reason=r.value;save();};
  const el=document.getElementById("n_"+id);
  el.className=el.className.replace(/\bd-(accept|edit|reject)\b/g,"").trim()+" d-"+action;
  toggle(id,action);save();prog();
}
function allVotable(){const a=[];D.verses.forEach(v=>v.notes.forEach(n=>{if(n.votable)a.push(n);}));return a;}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const all=allVotable();
  const done=all.filter(n=>dec[n.id]&&dec[n.id].action).length;
  const a=all.filter(n=>(dec[n.id]||{}).action==="accept").length;
  const e=all.filter(n=>(dec[n.id]||{}).action==="edit").length;
  const r=all.filter(n=>(dec[n.id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${all.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){
  return JSON.stringify({sarga:D.sarga,generated_by:D._meta.generated_by,
    decisions:dec,reviewed_at:new Date().toISOString()},null,2);
}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="decisions_sarga_"+D.sarga+".json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения по этой песни?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
// verse_id onto each note for the export
D.verses.forEach(v=>v.notes.forEach(n=>n.verse_id=v.verse_id));
render();
</script></body></html>

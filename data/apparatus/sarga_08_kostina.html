<script>window.APPARATUS_DATA={"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 8, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 8, "verses_with_notes": 7, "notes_by_layer": {"tier1": 5, "lexical": 5, "phase2": 3, "edition": 1, "crosstext": 0}, "built_for_reviewer": "Костина", "source_hash": "7349c737ca9e158bb28268872a9d7fdc1edae3a86410ac7b3b7383827e79a06b"}, "sarga": 8, "verses": [{"verse_id": "5.8.1", "verse": "1", "sanskrit_iast": "sa tasya madhye bhavanasya saṃsthito । mahadvimānam maṇiratnacitritam । prataptajāmbūnadajālakṛtrimaṃ । dadarśa dhīmān pavanātmajaḥ kapiḥ ॥1॥", "leonov_ru": "Стоя посреди того дворца Увидел мудрый сын ветра-обезьяна Огромную виману, расцвеченную жемчугом и драгоценными камнями, С искусно сделанными окнами, украшенными расплавленным золотом.", "commentary": {"bhusana": "स तस्य मध्ये भवनस्य संस्थितं महद्विमानं मणिवज्रचित्रितम् ।\n\nप्रतप्तजाम्बूनदजालकृत्रिमं ददर्श वीरः पवनात्मजः कपिः\nपूर्वोक्तविमानवर्णनं विस्तृणीते-- स तस्येत्यादि । प्रतप्तजाम्बूनदजालकृत्रिमं निष्टप्तस्वर्णविशेषकृतकृत्रिमपक्ष्यादिकम्", "siromani": "विमानमेव वर्णयन्नाह स इत्यादिभिः । स हनूमान् प्रतप्तजाम्बूनदजालेन कृत्रिमं रचितं महद्विमानं ददर्श"}, "has_tier1": true, "notes": [{"id": "tier1:5.8.1:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "С прорезанными золотыми окнами (prataptajāmbūnadajālakṛtrimam) – букв. «с окнами из расплавленного золота»."}, {"id": "lexical:5.8.1:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "jāmbūnada", "note_ru": "Джамбунада (jāmbūnada, adj./n.) — «[золото] из реки Джамбу». MW: jāmbūnada 'golden; gold from the Jambū river'. Джамбу-нади — мифологическая река, текущая с горы Меру; по Пуранам, её воды, проходя через золотые скалы, насыщаются золотом исключительного качества (jāmbūnada-svarṇa). В Артхашастре (гл. 2.13) jāmbūnada — высший сорт золота в классификации Каутильи: «цвет жареного лотосового семени, блестящее, мягкое» (V.8.1: prataptajāmbūnada = «расплавленное/нагретое джамбунада-золото»). Перевод «расплавленное золото» нейтрален; за словом стоит конкретная мифо-минералогическая категория, обозначающая золото наивысшего ранга.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:jAmbUnada+dic_apte:jAmbUnada", "collision_tier1": true}, {"id": "edition:5.8.1:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Песнь [южн. 8] (стихи 1–8, 8 шлок) целиком отсутствует в критическом издании (Барода).", "kind": "sarga_absence", "range": "5.8.1–8", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.8.1", "iast": "sa tasya madhye bhavanasya saṃsthito । mahadvimānam maṇiratnacitritam । prataptajāmbūnadajālakṛtrimaṃ । dadarśa dhīmān pavanātmajaḥ kapiḥ ॥1॥"}, {"verse_id": "5.8.2", "iast": "tadaprameyapratikārakṛtrimaṃ । kṛtaṃ svayaṃ sādhviti viśvakarmaṇā । divaṃ gataṃ vāyupathe pratiṣṭhitaṃ । vyarājatādityapathasya lakṣma tat ॥2॥"}, {"verse_id": "5.8.3", "iast": "na tatra kiṃcinna kṛtaṃ prayatnato । na tatra kiṃcinna mahargharatnavat । na te viśeṣā niyatāḥ sureṣvapi । na tatra kiṃcinna mahāviśeṣavat ॥3॥"}, {"verse_id": "5.8.4", "iast": "tapassamādhānaparākramārjitaṃ । manassamādhānavicāracāriṇam । anekasaṃsthānaviṣeṣanirmitaṃ । tatas tatas tulyaviśeṣanirmitam ॥4॥"}, {"verse_id": "5.8.5", "iast": "manaḥ samādhāya tu śīghragāminaṃ । durāsadaṃ mārutatulyagāminam । mahātmanāṃ puṇyakṛtāṃ mahārddhināṃ । yaśasvinām agryamudām ivālayam ॥5॥"}, {"verse_id": "5.8.6", "iast": "viśeṣam ālambya viśeṣasaṃsthitaṃ । vicitrakūṭam bahukūṭamaṇḍitam । mano’abhirāmaṃ śaradindunirmalaṃ । vicitrakūṭaṃ śikharaṃ girer yathā ॥6॥"}, {"verse_id": "5.8.7", "iast": "vahanti yat kuṇḍalaśobhitānanā । mahāśanā vyomacarā niśācarāḥ । vivṛttavidhvastaviśālalocanā । mahājavā bhūtagaṇāḥ sahasraśaḥ ॥7॥"}, {"verse_id": "5.8.8", "iast": "vasantapuṣpotkaracārudarśanaṃ । vasantamāsād api cārudarśanam । sa puṣpakam tatra vimānamuttamaṃ । dadarśa tad vānaravīrasattamaḥ ॥8॥"}], "collision_tier1": true}]}, {"verse_id": "5.8.2", "verse": "2", "sanskrit_iast": "tadaprameyapratikārakṛtrimaṃ । kṛtaṃ svayaṃ sādhviti viśvakarmaṇā । divaṃ gataṃ vāyupathe pratiṣṭhitaṃ । vyarājatādityapathasya lakṣma tat ॥2॥", "leonov_ru": "Она, не имеющая равных себе, украшенная изображениями, Сделав которую, сам Вишвакарман сказал: «Славно», Пребывающая на пути ветра, идущему по небу, Сияла [словно] счастливый знак на пути солнца.", "commentary": {"tilaka": "अप्रमेयप्रतिकारकृत्रिममप्रमेयैरपरिच्छेद्यसौन्दर्यादिभिः प्रतिकारैः प्रतिमादिभिः कृत्रिमं निर्वृत्तचित्रशोभम् । पाठान्तरं त्वसांप्रदायिकमिति कतकः । विश्वकर्मणा च स्वयं साध्विति कृतम् मन्निर्मितेष्विदमतिसाध्वित्यनुमोदितमित्यर्थः । दिवमाकाशं गते वायुपथे प्रतिष्ठितम्, वायुपथस्यैवादित्यपथत्वात्तस्य चिह्नभूतम्", "bhusana": "तदप्रमेया ऽप्रतिकारकृत्रिमं कृतं स्वयं साध्विति विश्वकर्मणा ।\n\nदिवं गतं वायुपथप्रतिष्ठितं व्यराजतादित्यपथस्य लक्ष्मवत्\nतदिति । अप्रतिमेया ऽप्रतिकारकृत्रिमम् अपरिच्छेद्याप्रतिक्रियकृत्रिमम् । तत्र हेतुमाह कृतं स्वयं साध्विति । विश्वकर्मणा स्वयं निर्मात्रा विश्वकर्मणा इदं साधु सुन्दरमिति श्लाघापूर्वं कृतम् । सर्वत्राप्रतिहतसञ्चारं चैतदित्याह दिवं गतम् आकाशगतम् । वायुपथप्रतिष्ठितं वायुमार्गभूतान्तरिक्षस्थितम् । मध्ये भवनस्य संश्थितमिति पूर्वमुक्तत्वात् भूतलप्रत्यासन्नान्तरिक्षस्थितमित्यर्थः । आदित्यपथस्य लक्ष्मवत् लक्ष्म लक्षणं व्यावर्तकम्, व्यराजत प्रचकाश इत्यर्थः", "siromani": "तदिति । अप्रमेयैः सौन्दर्यादिभिः प्रमातुमशक्यैः प्रतिकारैः प्रतिमाभिः कृत्रिमं रचितम् विश्वकर्मणा स्वयं साधु निर्मितमितिहेतोर्दिवङ्गते वायुपथे प्रतिष्ठितम् अत एव आदित्यपथस्य लक्ष्मवत् बोधकमिव तद्विमानं व्यराजत । आदित्यपथ इति वायुपथस्य नामान्तरमिति न विरोधः"}, "has_tier1": true, "notes": [{"id": "tier1:5.8.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Равных ей не было, дивно украшенной (tadaprameyapratikārakṛtrimam) – комментаторы поясняют, что не было ей равных «красотой и тому подобным» (saundaryādibhiḥ)."}, {"id": "lexical:5.8.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "viśvakarman", "note_ru": "Вишвакарман (viśvakarman, m.) — «сотворивший всё», vi+śva+karman (или viśva «всё» + karman «деяние/творение»). MW: viśvakarman 'the all-creating god; the architect and artificer of the gods'. В Ригведе (10.81–82) Вишвакарман — творец вселенной, «видящий всё, знающий всё» (viśvadarśata, viśvavid). В эпосе роль сужается до главного архитектора богов — он строит небесные города (Двараку для Кришны, Ланку — изначально для якшей). Примечательно V.8.2: Вишвакарман, завершив Пушпаку, сказал «sādhu» («отлично, хорошо сделано») — единственный случай в эпосе, когда мастер сам хвалит своё произведение. Это указывает на исключительность вимāны.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:viSvakarman", "collision_tier1": true}, {"id": "phase2:5.8.2:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tadaprameyapratikārakṛtrimam", "note_ru": "По Тилаке, у этого места известен вариант чтения (пāṭхāнтара), но, по замечанию Катаки, он нетрадиционен (асāмпрадāйика); перевод следует основному чтению.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "типовый пример текстологического замечания о варианте чтения с именем ссылающегося авторитета (Катака), отсутствующий в подстрочнике и в собственной заметке Леонова/Костиной.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.8.4", "verse": "4", "sanskrit_iast": "tapassamādhānaparākramārjitaṃ । manassamādhānavicāracāriṇam । anekasaṃsthānaviṣeṣanirmitaṃ । tatas tatas tulyaviśeṣanirmitam ॥4॥", "leonov_ru": "Обретенную аскетическими подвигами и отвагой, Двигавшуюся по воле мысли [своего хозяина], Сделанную из материалов, собранных в разных местах, Повсюду имеющую одинаковое великолепие,", "commentary": {"tilaka": "तपसोपवासादिना समाधानेन भगवति चित्तसमाधानेन लब्धो यः पराक्रमस्तेन रावणार्जितम् । मनःसमाधानेन यत्र विचारो गमनस्य तत्र सञ्चरणशीलं मनःसङ्कल्पितदेशगमनशीलम् । संस्थानविशेषा रचनाविशेषाः । ततस्ततस्तस्मात्तस्मादाहृतेन तुल्येन दिव्यविमाननिर्माणोचितेन विशेषेण विशिष्टपदार्थेन निर्मितम्", "siromani": "तप इति । तपस्समाधानाभ्यां कृच्छ्रचान्द्रायणादिदेवविशेषध्यानाभ्यां जातेन पराक्रमेण अर्जितं रावणेन प्राप्तं मनस्समाधानस्य एकाग्रमनसः विचारेण गमनेनेव चारोगमनमस्त्यस्मिन् तम् अर्धर्चादित्वात्पुंस्त्वं संज्ञापूर्वकविधेरनित्यत्वाल्लुगभावो वा । अनेकैर्बहुभिः संस्थानविशेषैः विलक्षणावयवैः निर्मितं मनोवेगत्वात् विलक्षणवयवविशिष्टत्वाच्च हेतोः तुल्यविशेषयोर्निर्मितं प्रक्षेपो यस्मात् । समाधिकरहितमित्यर्थः"}, "has_tier1": false, "notes": [{"id": "lexical:5.8.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tapas", "note_ru": "Тапас / аскеза (tapas) — tapas — аскетический жар/подвиг; согласно «Тилаке», «разогрев» тела позволяет аскету достичь сверхъестественных способностей. В кн. V — мотив праведности Ситы как аскетки.", "type": "А", "subtype": "base", "trigger": "term", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}, {"id": "lexical:5.8.4:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "tapas_siddhi", "note_ru": "Механизм тапас→сиддхи (tapas «аскеза» → siddhi «совершенство/сверхспособности») — центральный для эпической сотериологии: герой или демон накапливает тапас, боги вынуждены пожаловать ему вару, и тем самым тапас превращается в мирскую силу. Равана накопил тапас, получил вару от Брахмы — это объясняет непобедимость Ланки. В V.8.4 Пушпака-виман описан как «tapassamādhānaparākramārjitaṃ» — «достигнутый через аскезу, сосредоточение и доблесть»: виман как материализация тапаса Раваны. Гринцер разворачивает этот механизм уже в первых страницах к кн. I.", "type": "Г", "subtype": "hist_cultural", "trigger": "myth_background", "source": "MW s.v. tapas_siddhi; Гринцер, кн. I–III"}]}, {"verse_id": "5.8.5", "verse": "5", "sanskrit_iast": "manaḥ samādhāya tu śīghragāminaṃ । durāsadaṃ mārutatulyagāminam । mahātmanāṃ puṇyakṛtāṃ mahārddhināṃ । yaśasvinām agryamudām ivālayam ॥5॥", "leonov_ru": "Стремительно летящую по воле мысли, Недоступную [для грешников], скоростью равную ветру, Словно бы обитель для великих духом, добродетельных, Наделенных богатством (аскезы), наделенных великим счастьем,", "commentary": {"bhusana": "तपः समाधानपराक्रमार्जितं मनःसमाधानविचारचारिणम् ।\n\nअनेकसंश्तानाविशेषनिर्मितं ततस्ततस्तुल्यविशेषदर्शनम्\nतपस्समाधानेत्यादि पञ्चश्लोकी कुलकम् । सर्वत्र ददर्शेति संबन्धः ।\n\nतपस्समाधानपराक्रमार्जितं तपस्समाधानेन तपोनुष्ठानेन पराक्रमेण च अर्जितम् । मनस्समाधानविचारचारिणं समाधानमभिसन्धानम् । कर्मणि चैतत् । विचारो विविदा गतिः । मनोभिसंहितविविधगतिचारिणम् । अनेकसंस्थानविशेषनिर्मितम् । अनेकैस्संस्थानविशेषैः विमानगोपुरादिसन्निवेशैः निर्मितम् । ततस्ततस्तुल्यविशेषदर्शनम् तत्र तत्र तुल्यं विशेषदर्शनं यस्मिन्\nमनस्समाधाय तु शीघ्रगामिनं दुरावरं मारुततुल्यगामिनम् ।\n\nमहात्मनां पुण्यकृतां महर्द्धिनां यशस्विनामग्र्य मुदामिवालयम्\nमनस्समाधाय मन एकाग्रीकृत्य । स्वयं मनस्वीति यावत् । दुरावरं दुर्वारम् । महर्द्धिनां महर्द्धीनाम् । \"अपि माषं मषं कुर्याच्छन्दोभङ्गं न कारयेत्\" इत्युक्तरीत्या वृत्तभङ्गभिया ह्रस्वोच्चारणम् । अग्र्यमुदाम् इन्द्रादीनाम्", "tilaka": "मनःसमाधाय स्वामिमनो ऽनुरुध्य तु शीघ्रगामित्वादिधर्मकं दुरासदम् पापिभिरिति शेषः । \"दुरावरम्\" इति पाठे शत्रुभिर्दुर्निवारमित्यर्थः । महर्द्धिनाम् दीर्घाभावश्छान्दसः । एवं तुल्यगामिनमित्यत्र पुंस्त्वम् । विमानशब्दो ऽर्धर्चादिर्वा । अग्र्यमुदां महासुखानां पुण्यकृतामेवालयमास्पदम् इवशब्द एवार्थे । अत्र तस्याचेतनत्वे ऽपि तदभिमानिदेवतायाश्चित्तज्ञत्वादिति बोध्यम्", "siromani": "मनस्समाधाय स्वामिमनोनुसृत्यैव शीघ्रगामिदुरासदं पराभवितुमशक्यं महर्द्धिनां महत् ऋद्धं तपोवृद्धिरस्ति येषु तेषाम् । एतेन दीर्घाभाव आर्ष इति भट्टोक्तिश्चिन्त्या महात्मनामग्र्यमुदाम् अत्यानन्दानामालयमिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.8.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Богатых аскезой… (mahārddhināṃ) – букв. «обладающих великим богатством». В комментарии «Широмани» поясняется, что имеется в виду богатство накопленных аскетическими подвигами заслуг."}, {"id": "phase2:5.8.5:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "durāsadam / durāvaram", "note_ru": "По Тилаке, чтение durāsadam подразумевает эллипсис «недоступная для грешников»; вариант durāvaram меняет смысл на «неприступная для врагов»; перевод следует основному чтению и его толкованию, что уже отражено в вставке подстрочника «[для грешников]».", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "даёт второй вариант чтения с иным оттенком смысла и показывает, что подстрочник уже следует основному чтению Тилаки, а не варианту.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.8.6", "verse": "6", "sanskrit_iast": "viśeṣam ālambya viśeṣasaṃsthitaṃ । vicitrakūṭam bahukūṭamaṇḍitam । mano’abhirāmaṃ śaradindunirmalaṃ । vicitrakūṭaṃ śikharaṃ girer yathā ॥6॥", "leonov_ru": "Великолепно двигающуюся, великолепно стоящую, С прекрасной вершиной, украшенную множеством выступов, Восхищающую душу, чистую, словно осенняя луна, Подобную вершине горы с чудесными пиками,", "commentary": {"tilaka": "विशेषं गतिविशेषमालम्ब्य । विशेषे व्योमलक्षणदेशविशेषे संस्थितम् विचित्राणामाश्चर्यवस्तूनां कूटं समवायभूतम् बहुभिः कूटैः शालाभिर्मण्डितम् गिरेर्विचित्रावान्तरशृङ्गवच्छिखरमिव", "bhusana": "विशेषमालम्ब्य विशेषसंस्थितं विचित्रकूटं बहुकूटमण्डितम् ।\n\nमनोभिरामं शरदिन्दुनिर्मलं विचित्रकूटं शिखरं गिरेर्यथा\nविशेषमिति । विशेकमालम्ब्य विशेषसंस्थितं विशेषं गृहीत्वा विशेषेण संस्थितम् । सविशेषणविशेषसंस्थितमिति यावत् । सविशेषसंश्थानविशेषविशिष्टमित्यर्थः । कूटानां विचित्रत्वबहुत्वे विशेषणद्वयेन दर्शयति विचित्रेत्यादिना । विचित्रकूटं शिखरं गिरेर्यथा । कूटम् अवान्तरशृङ्गम्, शिखरं महाशृङ्गमिति प्रयोगादवधार्यते", "siromani": "विशेषं विशेषगमनादि आलम्ब्य विशेषे वायुपथे संस्थितं विचित्राणि कूटानि शिखराणि यस्मिन् तत् बहुकूटमण्डितं समीपस्थबहुकूटैः शोभितम् अत एव मनोभिरामं विचित्रकूटं गिरेः शिखरं यथा शृङ्गमिव"}, "has_tier1": true, "notes": [{"id": "tier1:5.8.6:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Превосходно по небу летающую (viśeṣam ālambya viśeṣasaṃsthitaṃ) – комментаторы поясняют, что в первый раз слово viśeṣa обозначает «превосходный в движении и тому подобном», во втором это слово употреблено в значении небо (в комментарии «Широмани» - vāyupathe «на дороге ветра»)."}]}, {"verse_id": "5.8.7", "verse": "7", "sanskrit_iast": "vahanti yat kuṇḍalaśobhitānanā । mahāśanā vyomacarā niśācarāḥ । vivṛttavidhvastaviśālalocanā । mahājavā bhūtagaṇāḥ sahasraśaḥ ॥7॥", "leonov_ru": "Которую несли летающие по небу, не знающие сна, Чьи лица украшены серьгами, едящие много пищи, С бегающими, немигающими, широкими глазами, Наделенные огромной скоростью тысячи бхутов,", "commentary": {"tilaka": "उच्यमानविशेषणा भूतगणा यद्वहन्ति तद्विमानं तत्र ददर्शेत्यन्वयः । विवृत्तानि निघूर्णानि विध्वस्तानि त्यक्तनिमेषाणि विशालानि लोचनानि येषाम् । निशाचरा निशास्वप्यहरविशेषं चरन्ति ते", "bhusana": "वहन्ति यं कुण्डलशोभितानना महाशना व्योमचरा निशाचराः ।\n\nविवृत्तविध्वस्तविशाललोचना महाजवा भूतगणाः सहस्रशः\nवहन्तीति । यं यत् । आर्षो व्यत्ययः । महाशनाः महाकाया इत्यर्थः । व्योमचराः व्योमचरसदृशसंस्थानाः । विवृत्तविध्वस्तविशाललोचनाः विवृत्तानि वर्तुलानि विध्वस्तानि भुग्नानि विशालानि लोचनानि येषां ते तथा । महाजवाः महाजवा इव स्थिताः । भूतगणाः गोपुरवाहका इव प्रतिमारूपेण स्थिताः । अन्यथा रावणान्तःपुरे पुरुषसञ्चारायोगात् कामगस्य विमानस्य वहनासंभवाच्च । यद्वा शिबिकावाहका इव भूतगणा अधोभागे वहन्ति । तद्वारैणैव कामगत्वमपि, चेतनप्रेरणं विना अचेतनसञ्चारस्यात्यन्तमनुचितत्वाच्च", "siromani": "निशाचराः निशायामधिकं चरणशीलाः विवृतानि आघूर्णितानि विध्वस्तानि निमेषरहितानि विशालानि लोचनानि येषां ते सहस्रशो भूतगणा यं वहन्ति तत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.8.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Бессонных (niśācarāḥ) – обычно в «Рамаяне» слово niśācara (ходящий по ночам) обозначает ракшасов. Здесь, согласно комментаторам, оно обозначает способность духов (bhūtaganāḥ) передвигаться не только днем, но и ночью."}, {"id": "phase2:5.8.7:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bhūtagaṇāḥ ... vahanti", "note_ru": "Бхушана поясняет кажущуюся несообразность: бхуты-носильщики изображены не как живые существа, а как изваяния-носители у городских ворот (как на гопурах), поскольку живым мужчинам нельзя находиться во внутренних покоях Раваны, а движение неодушевлённого без разумного движителя неуместно.", "type": "В", "source_commentary": ["bhusana"], "why_proposed": "решает скрытую в подстрочнике несообразность (живые духи в гареме Раваны) через реалию образной системы (статуи-носители), не данную ни в подстрочнике, ни в tier-1.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.8.8", "verse": "8", "sanskrit_iast": "vasantapuṣpotkaracārudarśanaṃ । vasantamāsād api cārudarśanam । sa puṣpakam tatra vimānamuttamaṃ । dadarśa tad vānaravīrasattamaḥ ॥8॥", "leonov_ru": "Прекрасную обликом благодаря множеству весенних цветов, Более прекрасную, чем даже весенняя пора, Ту Пушпаку там, лучшую из виман, Увидел лучший герой среди обезьян.", "commentary": {"tilaka": "अथ विशिष्य पुष्पकं वर्णयितुमाह-- स इति । मणिरत्नैर्मणिश्रेष्ठैश्चित्रितं प्रतप्तजाम्बूनदजालानां तन्मयगवाक्षाणां कृत्रिमं कृतिर्यस्मिंस्तत्तस्य भवनस्य रावणगृहस्य मध्ये महद्विमानं पुष्पकं ददर्श\nवसन्तपुष्पोत्करचारुदर्शनं वसन्तकालिकपुष्पसमूहेन चारुदर्शनम्", "bhusana": "वसन्तपुष्पोत्करचारुदर्शनं वसन्तमासादपि कान्तदर्शनम् ।\n\nस पुष्पकं तत्र विमानमुत्तमं ददर्श तद्वानरवीरसत्तमः\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे अष्टमः सर्गः ।। 5.8।।\n\nइति श्रीगोविन्दराजविरचिते श्रीरामायणभूषणे श्रृङ्गारतिलकाख्याने सुन्दरकाण्डव्याख्याने अष्टमः सर्गः", "siromani": "वसन्तपुष्पोत्करेण वसन्तकालिकपुष्पसमूहेन चारु दर्शनं यस्य अत एव वसन्तमासात् वसन्तकालादपि चारु दर्शनं यस्य तत् विमानसत्तमं पुष्पकं वानरवीरसत्तमो हनूमान् ददर्श । श्लोकपञ्चकमेकान्वयि"}, "has_tier1": false, "notes": [{"id": "lexical:5.8.8:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "puṣpaka", "note_ru": "Пушпака (puṣpaka) — puspaka (пушпака) — воздушная колесница, первоначально принадлежавшая Кубере, захваченная Раваной. «Бхушана»: «движется куда пожелает повелитель» (yathecchagāmī). Первое появление в кн. V.", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"Костина",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

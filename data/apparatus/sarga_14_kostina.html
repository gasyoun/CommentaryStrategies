<script>window.APPARATUS_DATA={"_meta": {"generated_by": "scripts/build_sarga_apparatus.py", "handoff": "H141 — сводный per-sarga аппарат (roadmap §5 п.6, ruling R3)", "sarga": 14, "numbering": "southern vulgate (Leonov); archive cross-text layer remapped from critical via scripts/remap_archive_parallels.py", "sources": {"tier1": "ярус 1 · Леонов/Костина", "lexical": "Фаза 1 · лексич.", "phase2": "Фаза 2 · комментаторы", "edition": "издания · сноска", "crosstext": "cross-text"}, "verses_total": 66, "verses_with_notes": 22, "notes_by_layer": {"tier1": 14, "lexical": 14, "phase2": 5, "edition": 0, "crosstext": 1}, "built_for_reviewer": "Костина", "source_hash": "c46f4c12ee8fd7c64da743500912876b78d3df4eb3f3792aba65368772f3f0b0"}, "sarga": 14, "verses": [{"verse_id": "5.14.1", "verse": "1", "sanskrit_iast": "sa muhūrtam iva dhyatvā manasā cādhigamya tām । avapluto mahātejāḥ prākāraṃ tasya veśmanaḥ ॥1॥", "leonov_ru": "Поразмыслив немного, устремившись душой к той [роще], Запрыгнул могучий (Хануман) на ограду того дворца.", "commentary": {"tilaka": "ध्यात्वोत्प्लवनं निश्चित्य तां सीतां मनसा ऽधिगम्य ध्यात्वा तस्य रावणस्य वेश्मनो वेश्मप्राकारात्प्राकारं वनप्राकारमवप्लुत उत्प्लवनेन प्राप्तः", "bhusana": "स मूहर्तमिव ध्यात्वा मनसा चाधिगम्य ताम् ।\n\nअवप्लुतो महातेजाः प्राकारं तस्य वेश्मनः\nसु मुहूर्तमित्यादि । इवशब्दो वाक्यालङ्कारे । प्राकारम् अशोकवनिकाप्राकारम् । तस्य वेश्मनः रावणस्य गृहात् । अवलुप्तः प्राप्तः", "siromani": "स्वाभाविकतया ऽप्यत्रागमनं तस्याः संभवतीत्याह रामेति । वनेचराणां पक्ष्यादीनां पुरा स्पृश्यते तद्विषयकातिप्रीतिमतीत्यर्थः, अत एव वनवासरता वनवासविषयकप्रीतिमती अत एव वनचारिणी सा सीता एष्यते एष्यति । श्लोकद्वयमेकान्वयि ।। 5.14.47,48 ।।\n\nआगमने हेत्वन्तरमाह संध्येति । संध्याकालः समयो यस्य तस्मिन् स्नानजपादौ मनो यस्याः सा श्यामा नित्यं षोडशवार्षिकीत्वेन प्रतीयमाना जानकी संध्यार्थे सान्ध्यकर्मनिवृत्त्यर्थम् इमां नदीं ध्रुवमेष्यति"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.1:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Устремившись мыслью той роще (manasā cādhigamya tām) – в оригинале сказано просто «к той» или «к ней» (tām). По контексту это скорее относится к роще, однако автор «Тилаки» полагает, что под «ней» подразумевается Сита. Такая же трактовка предлагается в комментарии «Широмани», в то время как автор «Таттвадипики» считает, что в данном случае имеется в виду роща ашоки."}]}, {"verse_id": "5.14.2", "verse": "2", "sanskrit_iast": "sa tu saṃhṛṣṭasarvāṅgaḥ prākārastho mahākapiḥ । puṣpitāgrān vasantādau dadarśa vividhān drumān ॥2॥", "leonov_ru": "Великая обезьяна, все тело которой было охвачено волнением, стоя на стене, Увидела разнообразные деревья, чьи кроны в начале весны были покрыты цветами.", "commentary": {"tilaka": "संहृष्टसर्वाङ्गः पुलकितसर्वाङ्गः । वसन्तादौ वसन्तादिसर्वर्तुषु संनिहितैः पुष्पैः पुष्पिताग्रान्", "bhusana": "स तु संहृष्टसर्वाङ्गः प्राकारस्थो महाकपिः ।\n\nपुष्पिताग्रान् वसन्तादौ ददर्श विविधान् द्रुमान्\nस त्विति । संहृष्टसर्वाङ्गः पुलकितसर्वाङ्गः । वसन्तादौ \"पौर्णमास्या मासान् संपाद्य\" इति पक्षमनुसृत्य फाल्गुनपौर्णमासीप्रपूर्वदिनत्वेन वसन्तादावित्युक्तम्", "siromani": "स इति । प्राकारस्थः स हनूमान् वसन्तादौ चैत्रे किंच वसन्तः आदीयते नित्यं प्रतीयते यस्यां तस्यां भूमौ पुष्पिताग्रान् द्रुमान्ददर्श\nद्रुमाणां नामानि निर्दिशन्नाह-- सालानिति । आम्रवनसंछन्नान् आम्रवनैरावृतान् लताशतसमावृतान् अनेकलताभिः संयुक्तान् शालादीन् ददर्शेत्यनुकृष्यते । सार्धश्लोक एकान्वया"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.2:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В начале весны… (vasantādau) – автор автор «Тилаки» понимает этот композит как «во все времена года, начиная с весны»."}, {"id": "lexical:5.14.2:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "saṃhṛṣṭasarvāṅga", "note_ru": "Самхриштасарванга (saṃhṛṣṭa-sarva-aṅga, adj.) — бахуврихи: saṃhṛṣṭa «охваченный восторгом» (sam+√hṛṣ-, «щетиниться, трепетать», MW: hṛṣ 'to be excited, thrilled') + sarva «весь» + aṅga «член тела». Буквально: «у которого все члены тела встали дыбом». В санскритском эпосе hṛṣita/saṃhṛṣṭa означает физический аффективный отклик — «гусиная кожа» от радостного возбуждения. В подстрочнике: «все тело охвачено волнением»; за этим стоит кинестетическая теория эмоций — hrṣa как телесный знак bhakti/vikrama, а не просто «радость».", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:saMhfzwa+dic_mw:aNga", "collision_tier1": true}, {"id": "crosstext:5.14.2:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "druma", "note_ru": "Хануман со стены видит «разнообразные деревья (drumān), чьи кроны в начале весны покрыты цветами» (14.2, вход в ашоковую рощу). Кавья-описание весеннего цветущего сада с тем же эмоциональным узором (деревья «стыдятся» перед красотой женщин) даёт Ашвагхоша: «bālāśokaś ca nicito dṛśyatām eṣa pallavaiḥ / yo 'smākaṃ hastaśobhābhir lajjamāna iva sthitaḥ» (Буддхачарита IV.48) — «взгляни на этот юный ашока, осыпанный побегами, что стоит, словно стыдясь перед красою наших рук». Та самая ашока, что даёт имя роще (aśoka-vana) и под которой томится Сита, — общий кавья-локус «весенний сад, оживлённый/посрамлённый женской красотой». Параллель освещает литературный фон рощи, в которой развернётся встреча с Ситой.", "type": "А", "cluster": "kavya", "cluster_label": "Кавья (Рагхуванша / Кумарасамбхава / Мегхадута / Буддхачарита / Гитаговинда / Шатакатрая)", "shloka_ref": "V.14.2", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Buddhacarita IV.48 (Aśvaghoṣa)", "collision_tier1": true}]}, {"verse_id": "5.14.3", "verse": "3", "sanskrit_iast": "sālān aśokān bhavyāṃś ca campakāṃś ca supuṣpitān । uddālakān nāgavṛkṣāṃś cūtān kapimukhān api ॥3॥", "leonov_ru": "Прекрасные шала, ашока, бхавья и цветущие чампаки, Уддалаки, нагаврикши, манго и капимукхи.", "commentary": {"tilaka": "भव्यान्न्युजफलान् । उद्दालका वृक्षविशेषाः । नागवृक्षान्नागकेशरवृक्षान् । कपिमुखान्कपिमुखाकारफलवतः । चूतविशेषणमेतत्", "bhusana": "सालान् सर्जकान् । भव्यान् शभानित्यशोकविशोषणम् । यद्वा भवं रुद्रमर्हन्तीति भव्यान् रुद्रप्रियपुष्पान् वृक्षविशेषान् । उद्दलाकान् बहुवारकान् । नागवृक्षान् नागकेसरवृक्षान् । कपिमुखान् मर्कटकान्\nविविधैर्मृगसङ्घैश्च विचित्रां चित्रकाननाम् ।\n\nप्रासादैः सुमहद्भिश्च निर्मितैर्विश्वकर्मणा"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.3:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна II. 10. 13: Чампака (campaka) — растение с желтыми цветами; Michelia campaka."}, {"id": "lexical:5.14.3:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "aśoka", "note_ru": "Ашока (aśoka, m. — Saraca asoca, сем. Fabaceae) — «без-скорби» (a- + śoka, «скорбь», √śuc-). MW: aśoka 'the tree Jonesia Aśoka Roxb., giving no grief'. Народная этимология эксплицитно мотивирует имя дерева: оно «не даёт śoka» — или защищает от него. Именно поэтому роща называется Aśokavanikā, а Сита укрыта под ашокой: дерево «без скорби» обрамляет наибольшую скорбь поэмы. Парономазия śoka / a-śoka — структурная для главы 15 (15.7: «ašoki, śokanaśana» — «ашоки, уносящие скорбь»). Подстрочник переводит нейтральным «ашока»; этимология имени и её сюжетная функция остаются за кадром.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:aSoka", "collision_tier1": true}, {"id": "phase2:5.14.3:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "bhavyāṃś ca", "note_ru": "«Бхавья» Бхушана толкует двояко: либо просто «прекрасные» (эпитет ашоки), либо, по другому чтению (bhavaṃ rudram arhanti), — название особого дерева, «угодного Рудре», чьи цветы посвящают Шиве.", "type": "В", "source_commentary": ["bhusana"], "why_proposed": "раскрывает, что «бхавья» может быть не эпитетом, а названием отдельного культового дерева, связанного с Рудрой, — подстрочник передаёт его как непрозрачное имя без опоры на такое толкование", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.14.4", "verse": "4", "sanskrit_iast": "tathāmravaṇasaṃchannāṃ latāśatasamāvṛtām । jyāmukta iva nārācaḥ pupluve vṛkṣavāṭikām ॥4॥", "leonov_ru": "К окруженной деревьями манго, покрытой сотнями лиан Роще помчался [Хануман], словно стрела, выпущенная из лука.", "commentary": {"tilaka": "ज्यामुक्तः रामेणेति शेषः", "bhusana": "अथाम्रवणसंछन्ना लताशतसमावृताम् ।\n\nज्यामुक्त इव नाराचः पुप्लुवे वृक्षवाटिकाम्", "siromani": "ज्येति । ज्यामुक्तः नाराच इव पुष्पवाटिकां पुप्लुवे"}, "has_tier1": false, "notes": [{"id": "lexical:5.14.4:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nārāca", "note_ru": "Нарача (nārāca, m.) — «железная стрела», специфически — металлический болт без оперения, более тяжёлый и пронизывающий, чем обычная śara. MW: nārāca 'an iron arrow'. Этимология неясна; Апте предполагает связь с nāra («вода», воздух?) + √ac- (Apte: nārāca 'a sort of iron arrow'). В стихе сравнивается движение Ханумана, влетающего в рощу, со стрелой, выпущенной из лука (jyāmukta iva nārācaḥ): образ строится на скорости и прямолинейности полёта тяжёлого снаряда — не лёгкой оперённой стрелы, а именно кованого болта. Тактильная специфика оружия передаёт физическую мощь прыжка.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:nArAca+dic_apte:nArAca"}]}, {"verse_id": "5.14.5", "verse": "5", "sanskrit_iast": "sa praviṣya vicitrāṃ tāṃ vihagair abhināditām । rājataiḥ kāñcanaiś caiva pādapaiḥ sarvato vṛtām ॥5॥", "leonov_ru": "Он, войдя, ту многоцветную, оглашаемую криками птиц, Покрытую повсюду серебряными и золотыми деревьями,", "commentary": {"tilaka": "विचित्रां विचित्रपर्यन्ताम् । राजतै रजतादिसंस्कृतैस्तद्वर्णैर्वा", "bhusana": "स प्रविश्य विचित्रां तां विहगैरभिनादिताम् ।\n\nराजतैः काञ्चनैश्चैव पादपैः सर्वतो वृताम्\nस प्रविश्येत्यादि । काञ्चनैः काञ्चनमयैरिव स्थितैः"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.5:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Изобилующую повсюду серебряными и золотыми деревьями (rājataiḥ kāñcanaiś caiva pādapaiḥ sarvato vṛtām) – согласно комментарию «Тилака», речь идет о том, что деревья украшены серебром и золотом, либо же они серебристого и золотистого цвета."}]}, {"verse_id": "5.14.7", "verse": "7", "sanskrit_iast": "vṛtāṃ nānāvidhair vṛkṣaiḥ puṣpopagaphalopagaiḥ । kokilair bhṛṅgarājaiś ca mattair nityaniṣevitām ॥7॥", "leonov_ru": "Покрытую разнообразными деревьями, на которых росли цветы и плоды, Где постоянно летали радостные (опьяненные страстью) кукушки и пчелы,", "commentary": {"tilaka": "पुष्पोपगफलोपगैः पुष्पफलयुतैः", "bhusana": "वृतां नानाविधैर्वृक्षैः पुष्पोपगफलोपगैः ।\n\nकौकिलैर्भृङ्गराजैश्च मत्तैर्नित्यनिषेविताम्\nपुष्पाण्युपगच्छन्तीति पुष्पोपगाः पुष्पसंपन्नाः तैः, फलोपगैः फलसंपन्नैः"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.7:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в Рамаяна I. 64. 6: Кукушка (kokila) — черная, или индийская, кукушка, весеннее пение которой, согласно индийской поэтической традиции, пробуждает любовную страсть."}, {"id": "tier1:5.14.7:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — строго] [термин] (не учтено) кокила — Eudynamys scolopacea"}]}, {"verse_id": "5.14.11", "verse": "11", "sanskrit_iast": "puṣpāvakīrṇaḥ śuśubhe hanumān mārutātmajaḥ । aśokavanikāmadhye yathā puṣpamayo giriḥ ॥11॥", "leonov_ru": "Осыпанный цветами, Хануман, сын ветра, стал похож На гору из цветов посреди ашоковой рощи.", "commentary": {"bhusana": "पुष्पावकीर्णः शुशुभे हनुमान् मारुतात्मजः ।\n\nअशोकवनिकामध्ये यथा पुष्पमयो गिरिः", "siromani": "पुष्पेति । पुष्पावकीर्णः प्रपतितपुष्पैराछन्नः हनूमान् पुष्पमयो गिरिरिव शुशुभे"}, "has_tier1": false, "notes": [{"id": "lexical:5.14.11:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mārutātmaja", "note_ru": "Марутатмаджа (mārutātmaja, m.) — тат-пуруша: māruta «ветер» (adj./subst. от Marut, ведийский класс богов ветра) + ātmaja «рождённый [из] себя / из духа» (ātman + √jan-). MW: ātmaja 'born from oneself; a son'. Mārutātmaja = «сын Ветра» — стандартный эпитет Ханумана, удостоверяющий его divine parentage. Примечательно, что именно в этом стихе — кульминации сцены «цветочной горы» — ātmaja подчёркивает: рождённый от ветра, Хануман сам стал горой из цветов, которые ветер же поднял. Эпитет этимологически замыкает образ. Подстрочник передаёт «сын ветра» без объяснения семантики ātmaja.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:mArutAtmaja"}]}, {"verse_id": "5.14.12", "verse": "12", "sanskrit_iast": "diśaḥ sarvābhidhāvantaṃ vṛkṣakhaṇḍagataṃ kapim । dṛṣṭvā sarvāṇi bhūtāni vasanta iti menire ॥12॥", "leonov_ru": "Видя обезьяну, которая бегала по роще в разные стороны, Все живые существа решили, что это [сама воплощенная] весна.", "commentary": {"bhusana": "दिशः सर्वाः प्रधावन्तं वृक्षषण्डगतं कपिम् ।\n\nदृष्ट्वा सर्वाणि भूतानि वसन्त इति मेनिरे", "siromani": "दिश इति । सर्वा दिशः अभिधावन्तम् । अत एव वृक्षखण्डगतं वृक्षसमूहेषु प्राप्तं कपिं दृष्ट्वा सर्वाणि भूतानि रक्षांसि वसन्तः कपिरूपेण समागतऋतुराजो ऽयमिति मेनिरे"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.12:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "…весна воплощенная (vasanta iti) – Голдмены переводят как «the spirit of springtime» (см.: Goldman 1984: 150)."}, {"id": "phase2:5.14.12:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "sarvāṇi bhūtāni", "note_ru": "По «Широмани», «все живые существа», принявшие Ханумана за воплощённую весну, — это прежде всего сами ракшасы-стражи Ланки: их обман объясняет, почему разведка Ханумана в саду не вызывает тревоги.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "уточняет сюжетную функцию образа: обмануты не абстрактные «существа», а именно стражи-ракшасы, что объясняет отсутствие тревоги в разгар разведки — подстрочник передаёт лишь общий образ", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.14.15", "verse": "15", "sanskrit_iast": "nirdhūtapatraśikharāḥ śīrṇapuṣpaphaladrumāḥ । nikṣiptavastrābharaṇā dhūrtā iva parājitāḥ ॥15॥", "leonov_ru": "С деревьев, чьи кроны были сотрясены, с которых облетели цветы и плоды, Были подобны проигравшимся игрокам, лишившимся своих одежд и драгоценностей.", "commentary": {"bhusana": "निर्धूतपत्रशिखराः शीर्णपुष्पफलद्रुमाः ।\n\nनिक्षिप्तवस्त्राभरणा धूर्ता इव पराजिताः", "siromani": "निर्धूतेति । निर्धूतानि पत्रशिखराणि मुख्यपत्राणि येषाम् अत एव शीर्णाः पुष्पफलद्रुमाः पुष्पफलपल्लवा येषां ते तरवः पराजिताः अक्षे पराभूताः अत एव निक्षिप्तवस्त्राभरणाः धूर्ता इव आसन् इति शेषः"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Стояли, как игроки, / Промотавшие украшенья с одеждами (nikṣiptavastrābharaṇā dhūrtā iva parājitāḥ) – букв. словно проигравшие игроки (dhūrtāḥ, комментарий «Тилака» уточняет - akṣadhūrtāḥ, игроки в кости), сбросившие одежды и украшения (nikṣiptavastrābharaṇāḥ)."}, {"id": "lexical:5.14.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "dhūrta", "note_ru": "Дхурта (dhūrta, m./adj.) — «мошенник, игрок, проказник» (√dhūrv- «причинять вред, обманывать» или p.p. от √dhur- «везти, тащить»; MW предлагает и народную этимологию dhūrtam = dharita «то, что тащат»). MW: dhūrta 'rogue, cheat, gambler'. В стихе 14.15 деревья после разгрома Ханумана уподоблены «проигравшимся игрокам, лишившимся одежд и украшений» — сравнение строится на dhūrta как habitual loser of dice games: у должника-игрока снимали одежду в счёт проигрыша. Образ вводит в ботаническое описание резкую социальную метафору — мир человеческого азарта и неудачи.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:DUrta", "collision_tier1": true}]}, {"verse_id": "5.14.18", "verse": "18", "sanskrit_iast": "vidhūtakeśī yuvatir yathā mṛditavarṇikā । nipītaśubhadantoṣṭhī nakhair dantaiś ca vikṣatā ॥18॥", "leonov_ru": "Словно девушка с растрепанными волосами, со стертою косметикой, С исцелованными (досл. выпитыми) прекрасными зубами и губами, израненная ногтями и зубами,", "commentary": {"tilaka": "वर्णको विलेपनम् । निपीतः शुभदन्तयुक्त ओष्ठो यस्याः सा", "bhusana": "निर्धूतकेशी युवतिर्यथा मृदितवर्णका ।\n\nनिष्पीतशुभदन्तोष्ठी नखैर्दन्तैश्च विक्षिता", "siromani": "विधूतेति । विधूताः प्रकम्पिताः केशाः यस्याः निपीतौ शुभदन्तौ ओष्ठौ च यस्याः नखैर्दन्तैश्च विक्षता मृदितवर्णका विगताङ्गरागा युवतिर्यथा तथा लाङ्गूलहस्तैः चरणाभ्यां च मर्दिता तथा तेनैव हेतुना भग्नपादपा अशोकवनिका अभवदिति शेषः । श्लोकद्वयमेकान्वयि ।। 5.14.18,19 ।।\n\nमहेति । प्रावृषि मेघजालानि मारुत इव महालतानां दामानि जालानि कपिर्व्यधमत्"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.18:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Отметины от зубов и ногтей (nakhair dantaiś ca vikṣatā) – укусы и царапание тела ногтями считались в древней Индии неотъемлемой частью любовных ласк. См. в частности в «Камасутре» десятую и одиннадцатую главы «О царапинах ногтями» и «Об укусах»."}, {"id": "lexical:5.14.18:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mṛditavarṇikā", "note_ru": "Мридитаварника (mṛdita-varṇikā, f.) — тат-пуруша: mṛdita «растёртая, стёртая» (p.p. от √mṛd-, «тереть, мять», Whitney #748) + varṇikā «косметика, лаковое покрытие» (varṇa + -ikā). MW: varṇikā 'paint, varnish, ink'. В кодексе эпического женского тела varṇikā — нанесённый краситель (нередко жёлтая turmeric-паста или красная синдура), который маркирует статус: украшенная / замужняя / готовая к церемонии. «Растёртая варника» = ритуальный статус стёрт механически, до кожи. Образ 14.18 — первое эротическое сравнение в серии: роща уподоблена девушке после бурной ночи. Подстрочник «стёртая косметика» — верно, но без культурного наполнения.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:mfdita+dic_mw:varRikA", "collision_tier1": true}]}, {"verse_id": "5.14.23", "verse": "23", "sanskrit_iast": "muktāpravālasikatāḥ sphaṭikāntarakuṭṭimāḥ । kāñcanais tarubhiś citrais tīrajair upaśobhitāḥ ॥23॥", "leonov_ru": "С жемчугами и кораллами вместо песка, с мозаичными полами, выложенными хрусталем, Украшенные прекрасными золотыми деревьями, растущими вдоль берега.", "commentary": {"bhusana": "मुक्ताप्रवालसिकताः स्फाटिकान्तरकुट्टिमाः ।\n\nकाञ्चनैस्तरुभिश्चित्रैस्तीरजैरुपशोभिताः"}, "has_tier1": false, "notes": [{"id": "lexical:5.14.23:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "sphaṭika", "note_ru": "Спхатика (sphaṭika, m.) — «горный хрусталь, кварц» (etimología народная: sphuṭ- «лопаться, раскалываться», что указывает на кристаллическую спайность). MW: sphaṭika 'crystal, alum'. В дворцово-парковой топографии «Рамаяны» sphaṭika обозначает природный бесцветный кристалл — эталон прозрачности. Полы из sphāṭika в купальнях Раваны создают иллюзию воды под ногами: человек видит сквозь пол дно пруда (ср. традиция «хрустального пола» в пуранических дворцах). Образ прозрачности — метафора нарочитой роскоши, которая «обманывает» взгляд. Подстрочник передаёт «хрусталь» без этого архитектурного подтекста.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:spfawika"}]}, {"verse_id": "5.14.24", "verse": "24", "sanskrit_iast": "buddhapadmotpalavanāś cakravākopakūjitāḥ । natyūharutasaṃghuṣṭā haṃsasārasanāditāḥ ॥24॥", "leonov_ru": "С купами раскрывшихся (цветущих) лотосов и кувшинок, оглашаемые криками чакравак, Криками натьюх, криками гусей и журавлей.", "commentary": {"tilaka": "नत्यूहो दात्यूहः", "bhusana": "फुल्लपद्मोत्पलवनाश्चक्रवाकोपकूजिताः ।\n\nनत्यूहरुतसंघुष्टा हंससारसनादिताः"}, "has_tier1": false, "notes": [{"id": "lexical:5.14.24:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "cakravāka", "note_ru": "Чакравака (cakravāka, m. — Anas casarca, Ruddy Shelduck) — «круглый гусь» (от cakra «круг, колесо», предположительно по форме шеи или способу полёта). MW: cakravāka 'a kind of bird, the Brahmani duck'. Чакравака — классический символ влюблённых, разлучаемых на ночь: по легенде, пара cakravāka разлучается каждую ночь по проклятию мудреца. В «Рамаяне» упоминание чакравак в саду Раваны — рефлекторная аллюзия на разлуку Рамы и Ситы: пруды, где плавают «несчастные влюблённые птицы», обрамляют обитель женщины, тоскующей о муже. Значение символики полностью закрыто нейтральным «чакраваки».", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:cakravAka"}]}, {"verse_id": "5.14.28", "verse": "28", "sanskrit_iast": "śilāgṛhair avatataṃ nānāvṛkṣasamāvṛtam । dadarśa kapiśārdūlo ramyaṃ jagati parvatam ॥28॥", "leonov_ru": "Тогда гору, с высокой вершиной, подобную облаку, С прекрасным (многоцветным) пиком, окруженную со всех сторон [меньшими] пиками, Покрытую гротами и разнообразными деревьями, [Самую] прекрасную в мире гору увидел тигр среди обезьян.", "commentary": {"tilaka": "जगति लोके रम्यं सुन्दरवस्तुभ्यो ऽपि परमसुन्दरम् । तीर्थस्तु-- जगती पर्वतमित्यर्थः । ह्रस्व आर्षः । मृत्पर्वतमिति यावदिति व्याचक्षाणा उपेक्ष्य एव", "bhusana": "शिलागृहैरवततं नानावृक्षैः समावृतम् ।\n\nददर्श हरिशार्दूलो रम्यं जगति पर्वतम्\nजगति लोके रम्यम्, एतत्सदृशं रम्यं किंचिन्नास्तीत्यर्थः । पर्वतं ददर्शेत्यन्वयः"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.28:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Самую прекрасную в мире (ramyaṃ jagati parvatam) – автор «Тилаки» понимает jagati parvatam как композит jagatīparvatam («гору, [сделанную] из земли»), то есть речь в данном случае идет не о горе, а о горке для игр. Однако такая интерпретация представляется маловероятной, если судить по описанию горы в целом."}]}, {"verse_id": "5.14.37", "verse": "37", "sanskrit_iast": "kāñcanīṃ śiṃśupām ekāṃ dadarśa sa mahākapiḥ । vṛtām hemamayībhis tu vedikābhiḥ samantataḥ ॥37॥", "leonov_ru": "Одно золотое [дерево] шимшупа увидела великая обезьяна, Окруженное со всех сторон возвышениями из золота.", "commentary": {"tilaka": "एकां मुख्यां वृक्षान्तरसंबन्धरहितां च काञ्चनीं तद्वर्णां शिंशपाम् । \"पिच्छिला गुरुशिंशपा\" इति कोशः ।। 5.14.37,38 ।।\n\nमेरोः प्रभया दिवाकर इव, तेषां द्रुमाणां प्रभया काञ्चनो ऽस्मीत्यमन्यत । काञ्चनवर्णमात्मशरीरं वीक्षते स्मेत्यर्थः"}, "has_tier1": false, "notes": [{"id": "lexical:5.14.37:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śiṃśapā", "note_ru": "Шимшапа (śiṃśapā, f. — Dalbergia sissoo, сем. Fabaceae, «палисандр-sissoo») — лиственное дерево тропической Азии с ценной тёмной древесиной. MW: śiṃśapā 'a kind of tree'. Именно под деревом śiṃśapā укрывается Хануман, оттуда наблюдает за Ситой (14.37–41) и находит её у его же корней (15.16). Śiṃśapā — не случайный дендроним: дерево устойчиво ассоциируется в индийских текстах с убежищем и тенью, а его прочная «железная» древесина семантически перекликается с непоколебимостью Ситы. Выбор дерева наблюдателя структурно мотивирован.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:SiMSapA"}]}, {"verse_id": "5.14.38", "verse": "38", "sanskrit_iast": "so 'paśyad bhūmibhāgāṃś ca nagaprasravaṇāni ca । suvarṇavṛkṣān aparān dadarśa śikhisaṃnibhān ॥38॥", "leonov_ru": "Увидел он участки земли и горные потоки, Увидел несравненные золотые деревья, подобные павлинам.", "commentary": {"bhusana": "सो ऽपश्यद्भूमिभागांश्च गर्तप्रस्रवणानि च ।\n\nसुवर्णवृक्षानपरान् ददर्श शिखिसन्निभान्"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.38:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Цветом подобные пламени (śikhisaṃnibhān) – в комментарии композит śikhisaṃnibhān поясняется как agnisadṛśān (подобные огню)."}]}, {"verse_id": "5.14.39", "verse": "39", "sanskrit_iast": "teṣāṃ drumāṇāṃ prabhayā meror iva mahākapiḥ । amanyata tadā vīraḥ kāñcano 'smīti sarvataḥ ॥39॥", "leonov_ru": "В сиянии этих деревьев, подобном сиянию Меру, великая обезьяна Подумала тогда отважная: «Сам я весь словно бы из золота».", "commentary": {"bhusana": "तेषां द्रुमाणां प्रभया मेरोरिव दिवाकरः ।\n\nअमन्यत तदा वीरः काञ्चनो ऽस्मीति वानरः ।", "siromani": "तेषामिति । मेरोरिव द्रुमाणां प्रभयोपलक्षितो महाकपिः अहं काञ्चनो ऽस्मीत्यमन्यत", "tilaka": "तेषां तरुधर्ममप्याह-- सुषुष्पिताग्रानिति । तुणाः कोमला अङ्कुराः पल्लवाश्च येषां तान्दृष्ट्वा विस्मयं प्राप्त इत्यन्वयः । तां यस्याः पर्यन्तवृक्षा एवंभूतास्तामारुह्य । चिन्तयामासेति शेषः"}, "has_tier1": false, "notes": [{"id": "lexical:5.14.39:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "meru", "note_ru": "Меру (Meru, m.) — мифическая золотая гора в центре вселенной, ось мироздания в брахманической космологии (MW: Meru 'the sacred mountain of the gods'). В 14.39 Хануман в сиянии золотых деревьев думает о себе «kāñcano 'smi» («я весь золотой») — сравнение со svetim Меру создаёт апофеоз: обезьяна-посланник уподобляется космической горе. Это не просто симиле декора, а теологическое утверждение: Хануман, залитый золотым светом, становится образом meru — то есть центра и опоры мира. Эпический artha этого сравнения — указание на его космическую миссию.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:meru"}]}, {"verse_id": "5.14.41", "verse": "41", "sanskrit_iast": "supuṣpitāgrāṃ rucirāṃs taruṇāṅkurapallavām । tām āruhya mahāvegaḥ śiṃśapāṃ parṇasaṃvṛtām ॥41॥", "leonov_ru": "На дерево шимшапу с цветущей кроной, прекрасное, с юными побегами И густой листвой, взобрался стремительный [Хануман].", "commentary": {"bhusana": "स पुष्पिताग्रां रुचिरां तरुणाङ्कुरपल्लवाम् ।\n\nतामारुह्य महाबाहुः शिंशुपां पर्णसंवृताम्\nस पुष्पिताग्रामित्याद्यासर्गसमाप्त्येकं वाक्यम्", "siromani": "तामिति । तां शिशुपामारुह्य चिन्तयामासेतिः शेषः । अर्धं पृथक्"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.41:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "[Claude.AI — строго] [термин] (не учтено) шимшапа — Dalbergia sissoo"}]}, {"verse_id": "5.14.43", "verse": "43", "sanskrit_iast": "aśokavanikā ceyaṃ dṛḍhaṃ ramyā durātmanaḥ । candanaiś campakaiś cāpi bakulaiś ca vibhūṣitā ॥43॥", "leonov_ru": "Эта прекрасная роща ашоки, украшенная Сандалом, чампакой и бакулой, принадлежит, несомненно, злобному духом [Раване].", "commentary": {"siromani": "अशोकवनिकान्वेषणमुपक्रमते स इति । स हनूमान् मुहूर्तं ध्यात्वा वनिकागमनप्रकारं संचिन्त्य तां सीतां मनसा अधिगम्य प्राप्य तस्य रावणस्य वेश्मनः वेश्मप्राकारात् प्राकारम् अशोकवनिकाया इति शेषः, अवप्लुतः उत्प्लुत्या प्राप्तः\nअशोकेति । रम्या रमणीयचन्दनादिभिर्विभूषिता यस्यामियं रम्या नलिनी सेयमशोकवनिका शोकनिवर्तिकात्वेन तदभिधा अतः इमां जानकी नूनमेष्यति । एतेनैतन्नामश्रुत्या तत्र गमने ममापि शोकविध्वंसो भवितेति निश्चयवती सीतावश्यं भवेदिति सूचितम् । श्लोकद्वयमेकान्वयि ।। 5.14.43,44 ।।\n\nसेति । वनसंचारकुशला सा जानकी ध्रुवमेष्यति", "tilaka": "रम्येयमशोकवनिका दुरात्मनो रावणस्यैव दृढं ध्रुवम् । राक्षसान्तरस्यैवंविधतदसंभवात्", "bhusana": "अशोकवनिका चेयं दृढं रम्या दुरात्मनः ।\n\nचम्पकैश्चन्दनैश्चापि वकुलैश्च विभूषिता"}, "has_tier1": false, "notes": [{"id": "phase2:5.14.43:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "aśokavanikā", "note_ru": "По «Широмани», само имя рощи — «ашокавана», «отгоняющая горе» (śokanivartikā) — включено в расчёт Ханумана: он полагает, что Сита придёт туда именно потому, что, услышав это название, понадеется утешить свою скорбь. По «Тилаке», уверенность, что роща принадлежит именно Раване, обоснована тем, что такая роскошь немыслима у другого ракшаса.", "type": "Б", "source_commentary": ["siromani", "tilaka"], "why_proposed": "вскрывает игру слов, стоящую за именем рощи и служащую у Ханумана логическим основанием его надежды, — подстрочник передаёт название как нейтральный топоним", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.14.45", "verse": "45", "sanskrit_iast": "sā rāmā rāmamahiṣī rāghavasya priyā satī । vanasaṃcārakuśalā dhrūvam eṣyati jānakī ॥45॥", "leonov_ru": "Прекрасная жена Рамы, возлюбленная Рагхавы добродетельная, Привычная бродить по лесам, несомненно, придет [сюда] Джанаки.", "commentary": {"tilaka": "अरामा रामवियुक्ता । राजमहिषीत्वादेवोद्यानवनसञ्चारकुशला", "bhusana": "सा रामा राममहिषी राघवस्य प्रिया सती ।\n\nवनस़ञ्चारकुशला नूनमेष्यति जानकी"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.45:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "Прекрасная жена Рамы (sā rāmā rāmamahiṣī). В комментарии «Тилака» sāramā понимается как sā + arāma и толкуется как rāmaviyuktā, что можно понять как «разлученная с возлюбленным», «разлученная с Рамой» или «разлученная с радостью»."}]}, {"verse_id": "5.14.46", "verse": "46", "sanskrit_iast": "atha vā mṛgaśāvākṣī vanasyāsya vicakṣaṇā । vanam eṣyati sādyeha rāmacintāsukarśitā ॥46॥", "leonov_ru": "Наверное, ланеокая [Сита] знакома с этой рощей. Придет она в эту рощу сегодня, томящаяся думами о Раме.", "commentary": {"bhusana": "अथवा मृगशावाक्षी वनस्यास्य विचक्षणा ।\n\nवनमेष्यति सा ऽ ऽर्येह रामचिन्तानुकर्शिता\nअथेवेति पक्षान्तरे । विचक्षणा तापापनोदनचतुरा । अस्य वनस्य अशोकवनस्य । इह वनं नलिनीपरिसरवर्तिवनम् । रामचिन्तानुकर्शिता सती एष्यति । रामविश्लेषजनिततापापनोदनार्थमेतद्वनप्रदेशमागमिष्यतीत्यर्थः । सा आर्येति पदच्छेदः", "siromani": "तदेव भङ्ग्यन्तरेणाह अथवेति । रामचिन्तासु कर्षिता अथवा अत एव अस्य वनस्य विचक्षणा वनसंबन्ध्यन्वेषणादिकुशला सा सीता वनमेष्यति । एतेन केनचिद्रूपेण कश्चिद्रामानुचरो मदन्वेषणार्थं तत्रागच्छेदिति सीतासंभावना सूचिता"}, "has_tier1": false, "notes": [{"id": "lexical:5.14.46:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "mṛgaśāvākṣī", "note_ru": "Мригашавакши (mṛgaśāvākṣī, f.) — бахуврихи: mṛga «олень» + śāva «детёныш» (MW: śāva 'young of any animal') + akṣī «глаза» = «чьи глаза [как] оленёнка». В отличие от простого mṛgākṣī («оленеглазая»), эпитет śāva добавляет возраст и уязвимость: не взрослый олень, а олень-детёныш — большие, влажные, испуганные глаза. Эпитет систематически применяется к Сите в момент её страха/беззащитности. MW специально фиксирует mṛgaśāvākṣī как устойчивый женский эпитет. Подстрочник передаёт «ланеокая»; за этим стоит градация беспомощности, не видимая из перевода.", "type": "А", "subtype": "lexical", "trigger": "compound", "source": "dic_mw:mfgaSAvAkzI"}, {"id": "phase2:5.14.46:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "vanasyāsya vicakṣaṇā", "note_ru": "По «Широмани», знакомство Ситы именно с этой рощей подсказывает Хануману и другой довод для надежды: она может прийти сюда в расчёте, что кто-то из людей Рамы явится искать её здесь же.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "добавляет отдельный психологический довод (надежда самой Ситы на поиски со стороны людей Рамы), отличный от игры имени рощи в соседнем стихе, — подстрочник передаёт лишь факт знакомства с рощей", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}}]}, {"verse_id": "5.14.49", "verse": "49", "sanskrit_iast": "saṃdhyākālamanāḥ śyāmā dhruvam eṣyati jānakī । nadīṃ cemāṃ śivajalāṃ saṃdhyārthe varavarṇinī ॥49॥", "leonov_ru": "Помышляя о вечерних обрядах придет, несомненно, смуглая Джанаки К этой реке с чистой водою для совершения омовения, прекрасная.", "commentary": {"tilaka": "सन्ध्या दिनरात्र्योः सन्धिरूपानुष्ठानकालो यस्य कर्मणस्तत्र मनो यस्याः सा, तथा सन्ध्यार्थे सन्ध्याकालक्रियमाणस्नानाद्यर्थे । पूर्ववदेवात्राप्युक्तस्यैवार्थस्यावृत्तिः । रात्रिशेषे हनुमतो ऽस्य वचसः प्रवृत्तेः । सन्ध्याशब्देनात्र प्रातःकालो विवक्षितः । तत्र कर्तव्यस्नानादौ चास्त्येव स्त्रीणामप्यधिकार इति कथं स्त्रीणां सन्ध्यावन्दनमिति परास्तं वेदितव्यम् । किं च सम्यग्भगवद्ध्यानस्यैव सन्ध्यापदार्थत्वेनास्त्येव तत्र स्त्रिया अधिकारः । गायत्रीमन्त्रेण तदर्थस्मरणपूर्वकध्याने तु द्विजस्यैवाधिकार इत्यन्यत्", "bhusana": "सन्ध्याकालमनाः श्यामा ध्रुवमेष्यति जानकी ।\n\nनदीं चेमां शिवजलां सन्ध्यार्थे वरवर्णिनी"}, "has_tier1": true, "notes": [{"id": "tier1:5.14.49:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "принято (печать)", "editor": "Леонов", "note_ru": "В сумерках предрассветных (saṃdhyākālamanāḥ) Также можно понять как «думая о времени [ритуала] сандхья». Ритуал сандхья проводится брахманами на рассвете, в полдень и вечером.Явится юная Джанаки (dhruvam eṣyati jānakī) – в комментарии «Широмани» слово śyamā (смуглая) объясняется как «та, которая всегда [выглядит] шестнадцатилетней»."}, {"id": "lexical:5.14.49:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śiva", "note_ru": "Шива (śiva) — Шива (śiva «благой»); фигурирует в пиршественных/дворцовых описаниях Ланки. Первое вхождение в кн. V.", "type": "В", "subtype": "base", "trigger": "realia", "source": "first occurrence in кн. V; Grintser index / commentators where cited (verse-level, soft)", "collision_tier1": true}, {"id": "lexical:5.14.49:1", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "saṃdhyā", "note_ru": "Самдхья (saṃdhyā, f.) — «сумерки; пограничный ритуал» (sam+√dhā-, «соединять», Whitney #163; saṃdhyā = «со-единение [дня и ночи]»). MW: saṃdhyā 'junction, morning/evening twilight; the religious ceremonies performed at the junction of day and night'. Saṃdhyā — не просто «вечер»: это священный момент перехода, требующий обязательного ритуала (saṃdhyāvandana — медитации и возлияния воде), который в норме совершают трижды в день. Хануман рассуждает: Сита придёт к реке для «saṃdhyārthe» — ради обряда. Её верность ритуальному расписанию даже в плену — маркер dharmaśīlatā. Переводя «вечерние обряды», подстрочник теряет трикратную ритуальную обязанность.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:saMDyA", "collision_tier1": true}, {"id": "phase2:5.14.49:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "saṃdhyākālamanāḥ", "note_ru": "«Тилака» попутно разбирает доктринальный вопрос: вправе ли женщина совершать сандхья-обряд? Ответ — да, в той мере, в какой сандхья означает утреннее омовение (в нём участвовать вправе и женщины); лишь медитация с мантрой гаятри при обряде остаётся привилегией дваждырождённых.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "разбирает отдельный доктринальный вопрос о праве женщины на сандхья-обряд, не затронутый ни подстрочником, ни примечанием Фазы-1 (посвящённым этимологии самого слова)", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "collision_tier1": true}]}, {"verse_id": "5.14.52", "verse": "52", "sanskrit_iast": "evaṃ tu matvā hanumān mahātmā । pratīkṣamāṇo manujendrapatnīm । avekṣamāṇaś ca dadarśa sarvaṃ । supuṣpite parṇaghane nilīnaḥ ॥52॥", "leonov_ru": "Подумав так, великий духом Хануман, Спрятавшись среди цветов и листвы, Ожидая супругу владыки людей (Рамы), Обозревая, видел все [в роще].", "commentary": {"tilaka": "मुक्ताप्रवालरूपा एव सिकता यासाम् । आन्तरकुट्टिमा अभ्यन्तरनिबद्धभूमियुताः", "bhusana": "एवं तु मत्वा हनुमान् महात्मा प्रतीक्षमाणो मनुजेन्द्रपत्नीम् ।\n\nअवेक्षमाणश्च ददर्श सर्वं सुपुष्पिते पर्णघने निलीनः\nपर्णघने पर्णसमूहे । महात्मा स हनुमान् । पुष्पिताग्रत्वादिविशिष्टां तामारुह्य इतो द्रक्ष्यामीत्यारभ्य आगमिष्यति सा ऽवश्यमिमां शिवजलां नदीमित्यन्तेन यः प्रकार उक्तः एवमुक्तप्रकारेण मत्वा मनुजेन्द्रपत्नीं प्रतीक्षमाणः अवेक्षमाणः मार्गमाणः सुपुष्पिते पर्णघने निलीनश्च सन् सर्वं ददर्शेत्यन्वयः", "siromani": "एवमिति । मनुजेन्द्रपत्नीं तदागमनं प्रतीक्षमाणः अत एव अवेक्षमाणः अन्वेषणं कुर्वन् पर्णानि घनानि यस्मिन् तस्मिन् सुपुष्पिते शिंशुपाह्वतरौ निलीनो हनूमान् सर्वं वनं ददर्श"}, "has_tier1": false, "notes": [{"id": "lexical:5.14.52:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nilīna", "note_ru": "Нилина (nilīna, adj.) — «скрытый, затаившийся» (ni+√lī-, «прилипать, таять, прятаться», Whitney #608; MW: nilīna 'hidden, lurking'). Форма nilīna — p.p. в значении активного состояния: не «спрятанный кем-то», а «сам затаившийся». В 14.52 Хануман nilīna среди листьев и цветов — образ разведчика, растворившегося в пространстве. Глагол √lī- несёт в себе семантику «растворения без следа» (ср. vilīna «расплавленный», utlīna). Хануман буквально «растекается» в крону дерева. Это ключевое слово для понимания его разведывательной техники: наблюдение без обнаружения.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:nilIna"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};window.REVIEW_CONFIG={reviewer:"Костина",manifestRevision:window.APPARATUS_DATA._meta.source_hash,sourceHash:window.APPARATUS_DATA._meta.source_hash,apiBase:""};</script>

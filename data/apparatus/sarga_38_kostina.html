lemma_iast": "sneha", "note_ru": "Снеха (sneha, m.) — «смазка, масло; любовь, привязанность» (√snih- «прилипать, быть влажным»). MW: sneha m. 'oiliness, unctuousness; tenderness, love, affection'. Снеха — первичное значение «жидкость, смазывающая материя» → метафора «любовь как то, что скрепляет»: snehapraskannamanasā — «с умом, залитым любовью», образ жидкой субстанции, пропитывающей разум.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:sneha", "source_links": [{"label": "MW sneha", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=sneha"}], "seq": 3}]}, {"verse_id": "5.38.9", "verse": "9", "sanskrit_iast": "icchāmi tvāṃ samānetum adyaiva raghunandinā । gurusnehena bhaktyā ca nānyathā tad udāhṛtam ॥9॥", "leonov_ru": "Хотел я сегодня же соединить тебя с потомком Рагху, Из любви и преданности к [своему] господину, не из-за чего-либо иного, то сказано [мной].", "commentary": {"tilaka": "इच्छामीत्यादिसमुदीरितं मयेति शेषः । रघुनन्दिना रघूंस्तद्वंश्यान्नन्दयति तेन रामेण समानेतुमित्यन्वयः । तदपि गुरो रामस्य स्नेहेन त्वयि भक्त्या चोक्तम्, न तु निजबलगर्वादित्यर्थः", "bhusana": "इच्छामि त्वां समानेतुमद्यैव रघुबन्धुना ।\n\nगुरुस्नेहेन भक्त्या च नान्यथैतदुदाहृतम्", "siromani": "इच्छामीति । रघुनन्दिना रामेण त्वां समानेतुं संयोजयितुम् अद्यैव इच्छामि । अत एव एतत् उदाहृतं कथितम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.9:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "guru", "kind": "omission", "text": "опущено. Комм?"}], "suggestions": [], "seq": 4}, {"id": "lexical:5.38.9:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "raghunandin", "note_ru": "Рагхунандин (Raghu-nandina, m.) — «радость [рода] Рагху» (nandina «доставляющий радость», от √nand- «радоваться»). MW: nandana m. 'gladdening; a son'. Отличается от Rāghava (просто «потомок Рагху»): nandina подчёркивает эмоциональную связь — Рама = гордость и радость рода. Хануман использует именно это имя, когда говорит о страстном желании воссоединить Ситу с Рамой.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:nandana", "source_links": [{"label": "MW nandana", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=nandana"}], "collision_tier1": true, "seq": 5}]}, {"verse_id": "5.38.10", "verse": "10", "sanskrit_iast": "yadi notsahase yātuṃ mayā sārdham anindite । abhijñānaṃ prayaccha tvaṃ jānīyād rāghavo hi yat ॥10॥", "leonov_ru": "Если не можешь ты лететь со мной, о безупречная, Дай мне что-нибудь в качестве свидетельства, которое признал бы Рагхава».", "commentary": {"tilaka": "यदीति । उक्तरीत्यायुक्तत्वपर्यालोचनयेत्यर्थः", "bhusana": "यदि नोत्सहसे यातुं मया सार्धमनिन्दिते ।\n\nअभिज्ञानं प्रयच्छ त्वं जानीयाद्राघवो हि तत्", "siromani": "यदीति । मया सार्धं यातुं यदि नोत्सहसे तर्हि यत् यतः राघवो जानीयात् मत्कर्तृकत्वाद्दर्शनं बुध्येत तदभिज्ञानं चिह्नं त्वं प्रयच्छ"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.10:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Дай тогда тайный знак (abhijñānaṃ prayaccha tvaṃ) – в оригинале использовано слово abhijñāna, «знак, по которому можно опознать». Ср. с I, 1, 74: Прибегнув к тайному знаку // Он заручился ее доверием… (nivedayitvābhijñānaṃ pravṛttiṃ ca nivedya ca…).", "service": [], "suggestions": [], "seq": 6}]}, {"verse_id": "5.38.11", "verse": "11", "sanskrit_iast": "evam uktā hanumatā sītā surasutopamā । uvāca vacanaṃ mandaṃ bāṣpapragrathitākṣaram ॥11॥", "leonov_ru": "Когда Хануман сказал так, Сита, подобная дочери бога, Сказала медленно, и речь ее прерывалась слезами:", "commentary": {"tilaka": "एवमुक्ता प्रत्यभिज्ञां देहीत्युक्ता । मन्दमुपांशु । एकान्तवृत्तान्तस्मरणजो बाष्पः", "bhusana": "एवमुक्ता हनुमता सीता सुरसुतोपमा ।\n\nउवाच वचनं मन्दं बाष्पप्रग्रथिताक्षरम्\nएवमिति । बाष्पप्रग्रथिताक्षरं बाष्पेण विघ्निताक्षरम् । एकान्तवृत्तान्तस्मरणात् बाष्पः", "siromani": "एवमिति । हनुमता एवमुक्ता सीता बाष्पैः प्रग्रथितानि अक्षराणि यस्मिन् तद्वचनं मन्दं शनैरुवाच"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "lexical:5.38.11:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "surasutā", "note_ru": "Сурасута (sura-sutā, f.) — «дочь бога» (sura «бог» + sutā «дочь», от √su- «рождать»). MW: sura m. 'a god, divinity'. Сита уподобляется surasutā: подобно тому, как дочь богов небесна по природе, так Сита — небесного происхождения (она найдена в борозде, т.е. рождена землёй; но в образной системе эпоса — apsaras-quality).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:surasutA", "source_links": [{"label": "MW surasutA", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=surasutA"}], "seq": 7}]}, {"verse_id": "5.38.14", "verse": "14", "sanskrit_iast": "tasyopavanakhaṇḍeṣu nānāpuṣpasugandhiṣu । vihṛtya salile klinno mamāṅke samupāviśaḥ ॥14॥", "leonov_ru": "В рощах, ароматных благодаря разнообразным цветам, После прогулки, влажный от воды, ты лежал в моих объятьях.", "commentary": {"tilaka": "समुपाविष्ठो ऽभूः", "bhusana": "तस्योपवनषण्डेषु नानापुष्पसुगन्धिषु ।\n\nविहृत्य सलिलक्लिन्ना तवाङ्के समुपाविशम्\nरामाय सीतया वक्तव्यं वचनं हनुमन्तं प्रत्युच्यते तस्येत्यादि"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "lexical:5.38.14:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "upavana-khaṇḍa", "note_ru": "Упаванакханда (upavana-khaṇḍa, n.) — «участок рощи» (upa-vana «прилегающий лесок» + khaṇḍa «кусок, участок»). MW: upavana n. 'a small wood, a grove, a garden'; khaṇḍa m./n. 'fragment, portion, section'. Дробление пространства на поэтические «куски» с разными цветочными ароматами — высокое kāvya-чувство в эпическом контексте.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:upavana", "source_links": [{"label": "MW upavana", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=upavana"}], "seq": 8}]}, {"verse_id": "5.38.15", "verse": "15", "sanskrit_iast": "tato māṃsasamāyukto vāyasaḥ paryatuṇḍayat । tam ahaṃ loṣṭam udyamya vārayāmi sma vāyasaṃ ॥15॥", "leonov_ru": "Тогда ворона, жаждущая мяса, стала клевать меня, Я, подняв ком земли, отогнала ворону.", "commentary": {"tilaka": "ततो ऽनन्तरं स त्वदनुभवसिद्धः समायुक्तो विकाराभियुक्तः सन्पर्यतुण्डयत् । स्तनान्तर इति शेषः । यद्वा मांससमायुक्तः मांसेच्छायुक्त इत्यर्थः", "bhusana": "ततो मांससमायुक्तो वायसः पर्यतुण्डयत् ।\n\nतमहं लोष्टमुद्यम्य वारयामि स्म वायसम् ।। 5.38.15।\n\nतत इति । माससमायुक्तः मांसप्रतिलुब्धः । \"आयुक्तकुशलाभ्यां च\" इत्यत्र आयुक्तशब्दस्य तात्पर्यपरतया व्याख्यानात् । लोष्टं मृत्पिण्डम् । पर्यतुण्डयत्पर्यखण्डयत्, स्तनान्तर इति शेषः । \"तुडि तोडने\" इत्ययं धातुश्चौरादिकः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.15:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…до мяса жадный (māṃsasamāyuktaḥ) – букв. «связанный с плотью». Автор комментария «Тилака» глоссирует это слово как «связанный с желанием плоти» (māṃsecchāyuktaḥ).", "service": [], "suggestions": [], "seq": 9}, {"id": "lexical:5.38.15:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vāyasa", "note_ru": "Ваяса (vāyasa, m.) — «ворона» (от vāyu «воздух» или Vāyu «бог ветра» + sa; MW: vāyasa m. 'a crow or raven'). Мифологически: ворона = птица Шани (Сатурна) и птица-посланник смерти. Эпизод с вороной (v.15–32) — отсылка к скрытому мифу: ворона-сын Индры (v.27: putraḥ śakrasya) — птица, мстящая за отца, но терпящая поражение.", "type": "В", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:vAyasa", "source_links": [{"label": "MW vAyasa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=vAyasa"}], "collision_tier1": true, "seq": 10}]}, {"verse_id": "5.38.16", "verse": "16", "sanskrit_iast": "dārayan sa ca māṃ kākas tatraiva parilīyate । na cāpy uparaman māṃsād bhakṣārthī balibhojanaḥ ॥16॥", "leonov_ru": "Та ворона тогда не улетела, клюя меня, Не отказалась она от мяса, жаждущая еды, пожирательница жертв.", "commentary": {"tilaka": "मन्दाकिन्यविदूरतो मन्दाकिनीसमीपे । सिद्धाश्रिते बहुमूलादिमति देशे तापसाश्रमवासिन्या मम यद्वृत्तं तच्छ्रेष्ठमभिज्ञानं त्वं ब्रूया इति संबन्धः\nतत्रैव परिलीयते वार्यमाणो ऽपि न देशान्तरं गच्छति स्म, न च मांसान्मांसविदारणाद्भक्षार्थ्युपारमत् । यद्ययं वस्तुतो न मांसार्थीत्युच्यते तदेत्थं योज्यम् । स वायसो मांसाद्भक्षार्थीव इवाध्याहारः ल्यब्लोपं पञ्चमी मांसमुपगृह्य भक्षार्थीव । यद्वा मांसभोजने भक्षार्थीव पुगःपुनर्विलेखनान्न विरराम", "bhusana": "दारयन् स च मां काकस्तत्रैव परिलीयते ।\n\nन चाप्युपारमन्मांसाद्भक्षार्थी बलिभोजनः\nदारयन्निति । परिलीयते अन्तर्हितो भवति स्म । बलिभोजनः काकः", "siromani": "दारयन्निति । बलिभोजनः स काकः भक्षार्थी मन्मांसभक्षणकाम इव चइवार्थे मां दारयन् दारयितुं तत्रैव परिलीयते पर्यलीयत् मांसान्मांसप्रक्षेपात्तु नोपारमत् उपारमत्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "lexical:5.38.16:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "balibhojana", "note_ru": "Балибходжана (bali-bhojana, m.) — «питающийся жертвенными подношениями» (bali «жертвенная пища, ритуальная доля» + bhojana «питание»). MW: bali m. 'an offering, oblation; tribute'. Ворона называется balibhojana — т.е. это ритуальный потребитель жертвенных остатков: её статус выше обычной птицы, но ниже ṛṣi; атака на Ситу — нарушение ритуального порядка (ворона выступает против законной жены, а не мяса жертвоприношения).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:bali", "source_links": [{"label": "MW bali", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=bali"}], "seq": 11}]}, {"verse_id": "5.38.21", "verse": "21", "sanskrit_iast": "pariśramāc ca suptā ca rāghavāṅke 'smy ahaṃ ciram । paryāyeṇa prasuptaśca mamāṅke bharatāgrajaḥ ॥21॥", "leonov_ru": "От усталости уснула я и долго лежала в объятьях Рагхавы. В свою очередь заснул в моих объятьях и старший брат Бхараты (Рама).", "commentary": {"tilaka": "अथ हे राघव, अहं तवाङ्के परिश्रमात्सुप्तास्मि भरताग्रज, त्वं च पर्यायेण ममाङ्के सुप्तः", "bhusana": "परिश्रमात् प्रसुप्ता च राघवाङ्के ऽप्यहं चिरम् ।\n\nपर्यायेण प्रसुप्तश्च ममाङ्के भरताग्रजः ।\n\nस तत्र पुनरेवाथ वायसः समुपागमत्", "siromani": "परीति । परिश्रमात् हेतोः पर्यायेण क्रमेण हे राघव तवाङ्के ऽहं चिरं प्रसुप्तास्मि ममाङ्के भरताग्रजश्च प्रसुप्तः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.21:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "И старший Бхараты брат / Тоже в сон погрузился (paryāyeṇa prasuptaśca mamāṅke bharatāgrajaḥ) – здесь Сита, говоря о Раме, несколько неожиданно начинает использовать третье лицо вместо второго.", "service": [], "suggestions": [], "seq": 12}, {"id": "lexical:5.38.21:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "paryāya", "note_ru": "Парьяя (paryāya, m.) — «чередование, очерёдность, цикл» (pari + √i- «идти»; paryāya букв. «обход кругом»). MW: paryāya m. 'going round; revolution; regular order, turn'. paryāyeṇa prasuptaś ca — «в свою очередь заснул»: paryāya здесь = «поочерёдно». В āyurveda/kāvya paryāya также = «синоним» (слово, «обходящее вокруг» значения). Указывает на ритмически чередующийся сон — нежная интимная деталь эпизода.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:paryAya", "source_links": [{"label": "MW paryAya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=paryAya"}], "collision_tier1": true, "seq": 13}]}, {"verse_id": "5.38.22", "verse": "22", "sanskrit_iast": "sa tatra punarevātha vāyasaḥ samupāgamat । tataḥ suptaprabuddhāṃ māṃ rāghavāṅkāt samutthitām । vāyasaḥ sahasāgamya vidadāra stanāntare ॥22॥", "leonov_ru": "И вот снова подлетела та ворона. Тогда меня, пробудившуюся, поднявшуюся из объятий Рагхавы, Ворона, внезапно налетев, клюнула в грудь.", "commentary": {"tilaka": "स तत्रेति । त्वयि स्वपति मयि जाग्रत्यामित्यर्थः । सुप्तप्रबुद्धां राघवाङ्के सुप्त्वा ततः प्रबुद्धाम्, अतएव राघवाङ्कादुत्थितां वायसः पुनरागम्य स्तनान्तरे विरराद व्यलिखत्", "bhusana": "ततः सुप्तप्रबुद्धां मां रामस्याङ्कात् समुत्थिताम् ।\n\nवायसः सहसा ऽ ऽगम्य विददार स्तनान्तरे", "siromani": "स इति । स वायसः काकः पुनः समुपागमत् । अर्ध पृथक् । तत इति । सुप्तप्रबुद्धाम् अत एव राघवाङ्कात्समुत्थितां मां वायस आगम्य स्तनान्तरे विरराद भेदनानुकूलव्यापारं चकार । सार्द्धश्लोक एकान्वयी"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "edition:5.38.22:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.38.22–23 (2 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.38.22–23", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.38.22", "iast": "sa tatra punarevātha vāyasaḥ samupāgamat । tataḥ suptaprabuddhāṃ māṃ rāghavāṅkāt samutthitām । vāyasaḥ sahasāgamya vidadāra stanāntare ॥22॥"}, {"verse_id": "5.38.23", "iast": "punaḥ punarathotpatya vidadāra sa māṃ bhṛśam । tataḥ samutthito rāmo muktaiḥ śoṇitabindubhiḥ ॥23॥"}], "seq": 14}]}, {"verse_id": "5.38.24", "verse": "24", "sanskrit_iast": "sa māṃ dṛṣṭvā mahābāhur vitunnāṃ stanayos tadā । āśīviṣa iva kruddhaḥ śvasān vākyam abhāṣata ॥24॥", "leonov_ru": "Меня увидев, мощнорукий, с раненой грудью, тогда Разгневанный, шипя, словно ядовитая змея, обратился он [ко мне].", "commentary": {"bhusana": "स मां दृष्ट्वा महाबाहुर्वितुन्नां स्तनयोस्तदा ।\n\nआशीविष इव क्रुद्धः श्वसन् वाक्यमभाषत\nवितुन्नां दारिताम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "lexical:5.38.24:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "āśīviṣa", "note_ru": "Ашивиша (āśī-viṣa, m.) — «ядовитое дыхание» (āśis «дыхание» или «желание» + viṣa «яд»): тип смертоносной змеи. MW: āśīviṣa m. 'a venomous serpent (the poison of which is in its teeth or fangs)'. Рама описан «шипящим как āśīviṣa» — точная зоологическая деталь: āśīviṣa шипит перед укусом, яд — в зубах. Образ: Рама не агрессивен внешне, но смертоносен точно так же.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:ASIviza", "source_links": [{"label": "MW ASIviza", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ASIviza"}], "seq": 15}]}, {"verse_id": "5.38.25", "verse": "25", "sanskrit_iast": "kena te nāganāsoru vikṣataṃ vai stanāntaram । kaḥ krīḍati saroṣeṇa pañcavaktreṇa bhoginā ॥25॥", "leonov_ru": "«Кем поранена твоя грудь, о прекраснобедрая (досл. та, чьи бедра подобны хоботу слона)? Кто играет с разъяренной змеей с пятью пастями?»", "commentary": {"bhusana": "केन ते नागनासोरु विक्षतं वै स्तनान्तरम् ।\n\nकः क्रीडति सरोषेण पञ्चवक्त्रेण भोगिना"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.25:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Со змеей разъяренной / вздумал играть неразумно? (kaḥ krīḍati saroṣeṇa pañcavaktreṇa bhoginā) – букв. «кто играет с разъяренной змеей с пятью пастями?». Мифологические змеи в индийском искусстве часто изображаются многоглавыми. Однако автор комментария «Бхушана» предлагает для слова pañcavaktreṇa толкование «с распахнутой пастью» (vyāttamukhena).", "service": [], "suggestions": [], "seq": 16}, {"id": "lexical:5.38.25:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "nāganāsa", "note_ru": "Нагана̄са (nāga-nāsa, adj.) — «нос/хобот слона» (nāga «слон/змей» + nāsa «нос», √nas- «дышать»). MW: nāga m. 'a snake; an elephant'; nāsā f. 'nose, nostril'. nāganāsoru = «чьи бёдра (ūru) [мощны] как хобот слона» — устойчивое описание пышных бёдер. Важен эпитет как маркер «нормативной» телесной красоты согласно kāvya-poetics (lakṣaṇa женской красоты).", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:nAga", "source_links": [{"label": "MW nAga", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=nAga"}], "collision_tier1": true, "seq": 17}]}, {"verse_id": "5.38.27", "verse": "27", "sanskrit_iast": "putraḥ kila sa śakrasya vāyasaḥ patatāṃ varaḥ । dharāntaraṃ gataḥ śīghraṃ pavanasya gatau samaḥ ॥27॥", "leonov_ru": "Та ворона, поистине сын Шакры, лучшая из летающих, Влетела внутрь земли (в земляную нору) быстро, в движении подобная ветру.", "commentary": {"bhusana": "पुत्रः किल स शक्रस्य वायसः पततां वरः ।\n\nधरान्तरगतः शीघ्रं पवनस्य गतौ समः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.27:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Был сыном Шакры тот ворон (putraḥ kila sa śakrasya vāyasaḥ) – большинство средневековых комментаторов полагает, что это был сын Индры Джаянта (jayanta).Землю он облетал (dharāntaraṃ gataḥ) Автор комментария «Тилака» понимает это выражение как bhūmibilaṃ prāptaḥ (влетевший в отверстие в земле).", "service": [{"author": "Е. Костина", "lemma_iast": "р.", "kind": "note", "text": "Нужно дополнить комментарий, указав, что имеется в виду под «отверстием в земле»"}], "suggestions": [], "seq": 18}, {"id": "lexical:5.38.27:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "śakra", "note_ru": "Шакра (Śakra, m.) — «могучий» (śakra adj. от √śak- «быть способным»): имя Индры как «могущественного». MW: Śakra m. 'powerful; Indra'. Ворона — «сын Шакры» (putraḥ śakrasya): этот мотив объясняет её особые способности (быстрота, схожая с Ваю, и неуязвимость). Называние отца-Индры — нарративное обоснование того, почему brahmastra необходима против обычной вороны.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:Sakra", "source_links": [{"label": "MW Sakra", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=Sakra"}], "collision_tier1": true, "seq": 19}]}, {"verse_id": "5.38.28", "verse": "28", "sanskrit_iast": "tatas tasmin mahābāhuḥ kopasaṃvartitekṣaṇaḥ । vāyase kṛtavān krūrāṃ matiṃ matimatāṃ varaḥ ॥28॥", "leonov_ru": "Тогда мощнорукий [Рама], глаза которого округлились от гнева, Принял жестокое решение о той вороне, лучший из мудрых.", "commentary": {"tilaka": "कोपेन संवर्तिते विवर्तिते ईक्षणे येन सः", "siromani": "तत इति । महाबाहुः रामस्तस्मिन् वायसे क्रूरां क्रूरात्वेन प्रतीयमानां मतिं कृतवान्\nस इति । स रामः दर्भसंस्तरात् दर्भमयास्तरणतः कोपेन सीताङ्गस्पर्शहेतुकपरमकल्याणप्राकट्यकारकस्वीकृतक्रोधाभासेन संवर्तिते ईक्षणे यस्य स महाबाहुः रामः तस्मिन् वायसे वायसकल्याणार्थं क्रूरां भयकारिणीं कठिनामनिवार्थामित्यर्थो वा मतिं कृतवान् क्रूरौ कठिनभीषणावित्यनेकार्थः ।। [स इति । स रामः दर्भसंस्तरात् दर्भमयास्तरणात् गृह्य गृहीत्वा एकं दर्भमिति शेषः । ब्रह्मणो ऽस्त्रेण अस्त्रत्वसंपादकेन दृष्टिविशेषादिना अयोजयत् स योजितो दर्भः द्विजं वायसमभिमुखः सन् कालाग्निरिव जज्वाल]", "bhusana": "ततस्तस्मिन् महाबाहुः कोपसंवर्तितेक्षणः ।\n\nवायसे कृतवान् क्रूरां मतिं मतिमतां वरः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "crosstext:5.38.28:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "tvad", "note_ru": "", "type": "А", "cluster": "archive_parallels", "cluster_label": "DCS parallel-search (archive.sqlite)", "shloka_ref": "V.38.28", "work_label": "Rām", "verse_address": "Rām 5.65.11 (крит. изд.)", "parallel_sa_iast": "tatastasminmahābāho kopasaṁvartitekṣaṇaḥ |vāyase tvaṁ kṛthāḥ krūrāṁ matiṁ matimatāṁ vara ||", "sundara_sa_iast": "tatastasminmahābāhuḥ kopasaṁvartitekṣaṇaḥ |vāyase kṛtavān krūrāṁ matiṁ matimatāṁ vara ||", "quality": "GOOD", "source": "DCS parallel-search (GOOD); Rām 5.65.11 (крит. изд.)", "source_links": [], "edition_flag": "vulgate", "shloka_critical": "V.36.25", "verse_address_vulgate": "Rām V.67.11 (вульгата)", "seq": 20}]}, {"verse_id": "5.38.2829", "verse": "2829", "sanskrit_iast": "", "leonov_ru": "", "commentary": {"bhusana": "ननु वायसमात्रे किमर्थमस्त्रं मुक्तमित्याशङ्क्याह पुत्रः किलेति । इदं रक्षणानन्तरं तेनैवोक्तमिति ज्ञेयम् । किलेति प्रसिद्धौ । इन्द्रपुत्रत्वेन प्रसिद्धो जयन्त एव वायसरूपेणागत इत्याहुः । वायसरूपो ऽन्यः पुत्र इत्यप्याहुः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.2829:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "…пламя конца времен (kālāgniḥ) – согласно индийской космологии во время всеобщей гибели (пралаи), периодически случающейся каждые 420 000 000 человеческих лет (соответствующих одному «дню Брахмы»), бог Агни сжигает три мира в своем пламени, именуемом Калагни («Огонь [конца] времени»).", "service": [], "suggestions": [], "anchor_verse_id": "5.38.29", "seq": 21}, {"id": "lexical:5.38.2829:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "darbha", "note_ru": "Дарбха (darbha, m.) — «трава дарбха» (Poa cynosuroides или Desmostachya bipinnata): священная трава, используемая в ведийских ритуалах для подстилок, фильтрации сомы. MW: darbha m. 'a kind of grass used at sacrifices (Poa cynosuroides)'. Рама берёт darbha из saṃstara (ложа) и наделяет её brahmastra — акт, который преобразует ритуальный объект в оружие: профанное → sacrum через мантру Брахмы.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:darBa", "source_links": [{"label": "MW darBa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=darBa"}], "anchor_verse_id": "5.38.29", "collision_tier1": true, "seq": 22}]}, {"verse_id": "5.38.32", "verse": "32", "sanskrit_iast": "sa pitrā ca parityaktaḥ sarvaiś ca paramarṣibhiḥ । trīṃl lokān samparikramya tam eva śaraṇaṃ gataḥ ॥32॥", "leonov_ru": "И оставленная [своим] отцом и всеми высшими риши, Три мира облетев, у него (Рамы) лишь нашла прибежище.", "commentary": {"tilaka": "पित्रा परित्यक्तः । स्वर्गे ऽपीति शेषः । पित्रेत्युपलक्षणं ब्रह्मान्तानाम्", "siromani": "स इति । सः स्पपित्रादिसमीपं गतः पित्रा महर्षिभिश्च परित्यक्तः रामबाणभिया अरक्षितः वायसः शरणं सर्वरक्षकं रामं गतः प्राप्तः", "bhusana": "स पित्रा च परित्यक्तः सुरैश्च समहर्षिभिः ।\n\nत्रील्लोकान् संपरिक्रम्य तमेव शरणं गतः\nभगवद्व्यतिरिक्ता बान्धवाभासा न रक्षका इत्याह स पित्रेति । सः पुरुषकारभूतायामपि कृतापराधः सः आर्द्रापराधः । पित्रा च परित्यक्तः अस्त्रक्षतिभीततया प्रथमं पितरं रक्षकं गतः तेन त्रैलोक्याधिपतिना च त्यक्तः । \"इन्द्रो महोन्द्रस्सुरनायको वा\" इति तस्यासमर्थत्वोक्तेः । परित्यक्तः त्यागो ऽपि नापाततः बुद्धिपूर्वं त्यक्तः । \"त्यजेदेकं कुलस्यार्थे ग्रामस्यार्थे कुलं त्यजेत्\" इति न्यायात् । यद्वा परित्यक्तः भार्यापुत्रादिभिस्सह त्यक्तः । चकारेण माता समुच्चीयते । न केवलं हितपरेण पित्रा, प्रियपरया मात्रा च परित्यक्तः, \"सीता नारीजनस्यास्य योगक्षेमं विधास्यति\" इति स्वरक्षकभूतायामपि सापराधत्वादिति भावः । पित्रपेक्षया मातुर्वात्सल्यातिशयात्तमेव प्रथमं गच्छति स्म ततः पितरम् । पित्रा त्यागवचनान्मात्रा त्यागः सिद्ध एवेति चकारेण सूचितम् । पितृभ्यां त्यागे ऽपि बान्धवा न त्यजन्ति । किं पितरौ सर्वथा त्यक्ष्यत इति तैरपि त्यक्त इत्याह सुरैश्च । \"कस्य बिभ्यति देवाश्च जातरोषस्य संयुगे\" इति रामनयने रक्ते ते ऽपि बिभ्यति हि । एवं पूर्वसजातीयैस्त्यक्तत्वे ऽपि परिगृहीतपक्षिरूपसजातीयैः किं त्यक्त इत्यपेक्षायां तथेत्याह चकारेण । \"पक्षिणो ऽपि प्रयाचन्ते सर्वभूतानुकम्पिनम्\" इति पक्षिणामपि शरण्यत्वात्, स्वनायकगरुडस्वामित्वाच्च पक्षिभिरपि परित्यक्तः । समहर्षिभिः पित्रादिबन्धूनामरक्षकत्वे ऽपि आनृशंस्यप्रधाना महर्षयो रक्षिष्यन्तीति गतः, तैरपि प्रकामं दूरदर्शिभिः परित्यक्तः । आनृशंस्यविषयव्यवस्था ऽस्तीति तैस्त्यक्त इत्यर्थः । एतदङ्गीकारे वयमपि संसर्गदोषेण नश्येम । अस्माभिस्त्यागे ऽनन्यगतिकत्वाद्राम एनं स्वीकरिष्यतीति तैस्त्यक्तः । महर्षिभिः 'यो विष्णुं सततं द्वेष्टि तं विद्यादन्त्यरेतसम्\"  इति विष्णुद्वेषेण चण्डालत्वात् \"चण्डालः पक्षिणां काकः\" इत्युक्तेश्च चण्डालो नास्मद्वाटमागच्छेदिति त्यक्तः । एवं रक्षकान्तरादर्शनान्नष्टगजो घटमप्यन्वेषत इति न्यायेन स्वैरविवृतद्वारान्सर्वान् गृहान् गत इत्याह त्रीन् लोकान् संपरिक्रम्य । परिक्रम्य एतदेव नवकृत्वो गतः । संपरिक्रम्य गृहस्थैरविज्ञाततया कवाटमूलेषु लीनश्चेत्यर्थः । अपि कदाचित् कृपैषामुत्पद्येतेति मत्वा पुनः पुनर्गत इत्यर्थः । अमुं निष्कास्य कवाटबन्धनं सर्वैः कृतमित्यर्थः । ततः किं कृतमित्यत्राह तमेव शरणं गतः । रक्षकत्वेन प्राप्तापेक्षया हिंसकत्वेन स्थितस्य मुखमेव शीतलमित्यवस्थितः । अतस्तमेव शरणं गतः । \"यदि वा रावणस्स्वयम्\" इत्येवं स्थितो हि रामः । तमेव सर्वलोकशरण्यमेव । तमेव दोषो यद्यपि न त्यजेयम्' इति स्थितम् । शरणं गतः निवासं गतः । न तूपायतया गतः । \"निवासवृक्षः साधूनाम्\" इत्युक्तेः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.32:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "В комментарии «Бхушана» этот эпизод толкуется как аллегория души, находящей спасения только у Рамы.", "service": [], "suggestions": [], "seq": 23}]}, {"verse_id": "5.38.33", "verse": "33", "sanskrit_iast": "sa taṃ nipatitaṃ bhūmau śaraṇyaḥ śaraṇāgatam । vadhārham api kākutsthaḥ kṛpayā paryapālayat ॥33॥", "leonov_ru": "Ее, упавшую на землю, прилетевшую в поисках убежища, Даже заслуживающую смерти Какутстха защитил из жалости.", "commentary": {"tilaka": "पर्यपालयत् । प्राणरक्षणेनेति शेषः", "siromani": "स इति । शरण्यः शरणहितः स रामः शरणागतम् अत एव भूमौ पतितं वधार्हमपि तं वायसं कृपया पर्यपालयत् सीताङ्गस्पर्शमात्रेण तत्कल्याणप्रकटनमपहाय कोपप्रकटनद्वारा किमर्थं कृतमिति तु न भ्रमितव्यं प्रार्थनयैव परमकल्याणं क्रियत इति स्वाभाविकपरमात्मरीतेः । करुणावानपि व्यक्तं शक्तः स्वाम्यपि देहिनाम् । अप्रार्थितो न गोपायेत् इति तत्प्रार्थनामतिरिति पुराणम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "crosstext:5.38.33:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "śaraṇāgata", "note_ru": "Рассказ Ситы о вороне Какутстха-защитнике формулирует доктрину śaraṇāgati («прихождения за прибежищем»): «śaraṇyaḥ śaraṇāgatam … kṛpayā paryapālayat» — Рама защищает даже заслуживающего смерти, раз тот прибёг к нему (ср. также V.38.32 «tam eva śaraṇaṃ gataḥ» и формулу śaraṇāgatavatsala в V.21.20–21). Это тот самый locus, что в традиции Гиты становится опорой учения о предании себя Богу. Ср. БхГ 18.62 «tam eva śaraṇaṃ gaccha sarvabhāvena bhārata …» — «Только в Нем ищи утешенья всей душою своей, сын Кунти: Его милостью ты достигнешь высшей цели, умиротворенья.». Йамуначарья в «Гитартха-санграхе» 11 прямо выделяет śaraṇāgati как тему седьмой главы: «… śaraṇāgatiḥ bhakta-bhedaḥ …» — «В седьмой главе говорится об истинной природе Бога, о его со- крытости пракрити, о пути прибежища [к Богу], о разделении бхактов, о преимуществе просветленного.». Параллель важна историко-богословски: вишишта-адвайта-вайшнавы (Ямуна, Рамануджа) возводили учение о прападти именно к таким рамаяновским эпизодам защиты прибёгшего. Свидетельство: уровень шлоки (мягкое).", "type": "А", "cluster": "gita", "cluster_label": "Бхагавадгита (+ бхашьи)", "shloka_ref": "V.38.33", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Bhagavadgītā 18.62; Gītārthasaṃgraha Yāmunācārya 11", "source_links": [], "seq": 24}]}, {"verse_id": "5.38.34", "verse": "34", "sanskrit_iast": "paridyūnaṃ vivarṇaṃ ca patamānaṃ tam abravīt । moghaṃ astraṃ na śakyaṃ tu brāhmam kartuṃ tad ucyatām ॥34॥", "leonov_ru": "Утратившей силу, выцветшей (вар. viṣaṇṇa – павшей духом, печальной), падающей ей сказал [Рама]: «Напрасно нельзя использовать оружие Брахмы. Скажи, [что теперь делать]».", "commentary": {"tilaka": "परिद्यूनं क्षीणशक्तिम् । ब्राह्ममस्त्रं मोघं कर्तुं न शक्यमतस्तदुच्यताम् तत्संहार्यं वस्तु भार्गववदुच्यतामित्यर्थः", "bhusana": "स तं निपतितं भूमौ शरण्यः शरणागतम् ।\n\nवधार्हमपि काकुत्स्थः कृपया पर्यपालयत्\nस तामिति । सः रक्षणैकस्वभावः । तं प्रातिकूल्यैकनिरतम् । भूमौ निपतितं देवजगतितया भूमिमस्पृशन्तपि भूमौ पतितम् । भूमौ दुष्पुत्रं पितरि शिक्षमाणे स यथा मातुः पादयोः पतति तथा ऽपतत् । शरण्यः सर्वावस्थास्वपि शरणवरणार्हः । शरणागतम् अनन्यगतिकतया स्वमुपागतम् । वधार्हमपि रामसिद्धान्तेनापि वधार्हम् । काकुत्स्थः कृपया पर्यपालयत् कुलोचितस्वभावेन रक्षितवान् । कृपया अस्मदाद्यारब्धं कार्यं प्रबलकर्मणा न समाप्यते तथा तेनारब्धमपि कृपया न पूर्यत इति भावः\nपरिद्यूनं विषण्णं च स तमायान्तमब्रवीत् ।\n\nमोघं कर्तुं न शक्यं तु ब्राह्ममस्त्रं तदुच्यताम्", "siromani": "परिद्यूनमिति । परिद्यूनं क्षीणसामर्थ्यम् अत एव विवर्णं विकृतवर्णविशिष्टं पतमानं तं वायसं ब्राह्ममस्त्रं मोघं सर्वथा मिथ्या कर्तुं न शक्यं तत्तस्माद्धेतोः उच्यतां तन्मिथ्यात्वाभावोपायः कथ्यतामिति रामो ऽब्रवीत्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.34:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "измученному и жалкому (paridyūnaṃ vivarṇaṃ ca) – букв. «печальному и бледному/бесцветному». Автор комментария «Тилака» глоссирует слово paridyūna как «обессиленный» (kṣīṇaśakti). Слово vivarṇa в комментарии «Широмани» глоссируется как «отличающийся измененным цветом» (vikṛtavarṇaviśiṣṭa). Голдмены переводят как «подавленный и исполненному раскаяния» (dejected and remorseful) (см.: Goldman 1984: 218).Нельзя оружие Брахмы / Использовать понапрасну (moghaṃ astraṃ na śakyaṃ tu brāhmam kartuṃ tad ucyatām) – букв. «Да будет сказано, что нельзя напрасно применять оружие Брахмы». В комментарии «Бхушана» приводится еще одна пада, в которой содержатся слова ворона: «И тогда он сказал: Пусть твоя стрела выбьет [мне] правый глаз» (hinastu dakṣiṇākṣi tvacchara ityatha so ‘bravīt).", "service": [], "suggestions": [], "seq": 25}]}, {"verse_id": "5.38.36", "verse": "36", "sanskrit_iast": "sa rāmāya namaskṛtya rājñe daśarathāya ca । visṛṣṭas tena vīreṇa pratipede svam ālayam ॥36॥", "leonov_ru": "Она (ворона), восхвалив Раму и царя Дашаратху, Отпущенная тем отважным, вернулась к себе домой.", "commentary": {"tilaka": "स जयन्तः", "siromani": "स इति । तेन रामेण विसृष्टः त्यक्तः स वायसः रामाय नमस्कृत्वा स्वः स्वर्गे दशरथाय दशरथमनुकूलयितुं नमस्कृत्वा स्वमालयं प्रतिपेदे । दशरथाय नमस्कत्वेत्यनेन पलायनसमये दशरथोपदेशादेव रामशरणमागत इति ध्वनितं तेन तस्मिन्काले आखेटाद्यन्यतमार्थं तस्यापि साकेतात्त्रिलोकीमध्ये आगमनं जातमिति ध्वनितम् । तेन शक्रादिभिरयमुपदेशो न कृत इति ध्वनितं तेन दशरथस्य सार्वकालिकयाथार्थ्यज्ञानवत्वेन व्यतिरेकालंकारो ध्वनितः । तेन शरणागतरक्षकत्वस्य परंपरयास्मिन्नपि सिद्धत्वमिति सूचितं परंपरया रक्षकत्वं त्वस्मिन्मर्यादापालनायेति बोध्यम्", "bhusana": "स रामाय नमस्कृत्वा राज्ञे दशरथाय च ।\n\nविसृष्टस्तेन वीरेण प्रतिपेदे स्वमालयम्\nदशरथाय स्वलोकस्थतया पूर्वमेव मित्रभूताय"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "phase2:5.38.36:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "daśarathāya namaskṛtya", "note_ru": "В «Широмани» поклон вороны не только Раме, но и (умершему) царю Дашаратхе истолкован как намёк: ворона бежала к Раме именно по совету Дашаратхи, данному ей на небесах, — деталь, которой нет ни в подстрочнике, ни в собственном примечании Леонова/Костиной к этому стиху.", "type": "Б", "source_commentary": ["siromani"], "why_proposed": "поясняет подтекст двойного поклона вороны (Раме и Дашаратхе) мифологической деталью, отсутствующей у Леонова/Костиной.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 26}]}, {"verse_id": "5.38.37", "verse": "37", "sanskrit_iast": "matkṛte kākamātre 'pi brahmāstraṃ samudīritam । kasmād yo māharat tvattaḥ kṣamase taṃ mahīpate ॥37॥", "leonov_ru": "Ради меня ты даже лишь (всего-навсего) против вороны использовал оружие Брахмы. Почему же ты терпишь того, кто отнял меня у тебя, владыка?", "commentary": {"siromani": "मदिति । मत्कृते मत्परितोषार्थं काकमात्रे निखिलकाके ब्रह्मास्त्रं ब्रह्मास्त्रनिष्पाद्यत्वं दक्षिणाक्षिहीनत्वमित्यर्थः । येन त्वया समुदीरितं प्रापितं स त्वं त्वत्तो यो प्रां हरत् अहरत् तं कस्मात् क्षमसे", "bhusana": "मत्कृते काकमात्रे तु ब्रह्मास्त्रं समुदीरितम् ।\n\nकर्माद्यो मां हरत्त्वत्तः क्षमसे तं महीपते\nसमुदीरितं प्रमुक्तम् । हरत् अहरत्", "tilaka": "कस्माद्राक्षसक्षयं न करोतीत्यस्योत्तरम्-- त्वच्छोकेति । त्वद्वियोगजशोकेन सर्वकार्यविमुख इत्यर्थः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "lexical:5.38.37:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "brahmastra", "note_ru": "Брахмастра (brahmastra) — brahmastra — «оружие Брахмы», высшая астра (astra), непреодолимый снаряд, наделённый силой Брахмы. В кн. V связано с пленением Ханумана. Первое вхождение в кн. V.", "type": "В", "subtype": "base", "trigger": "realia", "source": "первое вхождение в кн. V; указатель Гринцера / комментаторы, где процитировано (привязка к стиху, нестрогая)", "source_links": [], "seq": 27}, {"id": "phase2:5.38.37:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "tvacchoka", "note_ru": "По Тилаке, вопрос Ситы «почему ты терпишь похитителя» получает ответ уже в следующем стихе: бездействие Рамы против Раваны объясняется не бессилием, а тем, что горе разлуки (tvacchoka) отвращает его от всех прочих дел — то есть эпизод с вороной вводит психологический мотив, а не только демонстрацию мощи брахмастры.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "объясняет нарративную логику молчаливого вопроса Ситы через мотив горя Рамы, не отражённую ни в подстрочнике, ни у Леонова/Костиной (их В.38.37 касается только термина «брахмастра»).", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 28}]}, {"verse_id": "5.38.38", "verse": "38", "sanskrit_iast": "sa kuruṣva mahotsāhāṃ kṛpāṃ mayi nararṣabha । tvayā nāthavatī nātha hyanāthā iva dṛśyate ॥38॥", "leonov_ru": "Прояви же ко мне сострадание, исполненное великой силы, о бык среди людей. Ибо я, о господин, имея защитника, выгляжу словно беззащитная (кажусь беззащитной).", "commentary": {"tilaka": "मम महोत्साहरूपां मयि कृपां कुरु । त्वया नाथवत्यपि मल्लक्षणा नार्यनाथेव दृश्यत इत्यर्थः", "siromani": "स इति । सः सदा मत्परतोषकस्त्वं महोत्साही अत्युत्साहविशिष्टां मयि कृपां कुरुष्व । तत्र हेतुः त्वयैव नाथवती अनाथा इव दृश्यते मम तनुरिति शेषः", "bhusana": "स कुरुष्व महोत्साहः कृपां मयि नरर्षभ ।\n\nत्वया नाथवती नाथ ह्यनाथा इव दृश्यते"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.38:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "tvayā nāthavatī nātha", "kind": "note", "text": "Комм. букв. перевод?"}], "suggestions": [], "seq": 29}]}, {"verse_id": "5.38.39", "verse": "39", "sanskrit_iast": "ānṛśaṃsyaṃ paro dharmas tvatta eva mayā śrutam । jānāmi tvāṃ mahāvīryaṃ mahotsāhaṃ mahābalam ॥39॥", "leonov_ru": "Милосердие – высший закон (дхарма), слышала я от тебя. Я знаю твое великое мужество, великую мощь и великую силу,", "commentary": {"tilaka": "एवं हनूमते रामैकसंवेद्यमभिज्ञानमुक्त्वा सन्देशान्तरमाह मत्कृते इति । कस्मात्क्षमसे इत्यवान्तरवाक्यान्ते इत्युक्तवतीति ब्रूहीति वाक्यशेषो द्रष्टव्य इति\n\nकतकः । बुद्धिस्थं राममेव सोपालम्भं संबोध्य प्रार्थयते इति तीर्थः । त्वत्तस्त्वत्सकाशाद्यो मा मामहरद्धृतवान्\nआनृशंस्यं दया । न च शक्यो ऽयमर्थ इति चेत्तत्राह जानामीति", "bhusana": "जानामि त्वां महावीर्यं महोत्साहं महाबलम् ।\n\nअपारपारमक्षोभ्यं गाम्भीर्यात् सागरोपमम् ।\n\nभर्तारं ससमुद्रायाधरण्या वासवोपमम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.39:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "eva", "kind": "note", "text": "Опущена эмфаза"}], "suggestions": [], "seq": 30}]}, {"verse_id": "5.38.40", "verse": "40", "sanskrit_iast": "apāravāram akṣobhyaṃ gāmbhīryāt sāgaropamam । bhartāraṃ sasamudrāyā dharaṇyā vāsavopamam ॥40॥", "leonov_ru": "[Знаю, что ты] безграничен, невозмутим, глубиной подобен океану, Владыка земли с океаном, подобный Индре.", "commentary": {"tilaka": "अपारवारं मर्यादारहितम् । देशकालादिपरिच्छेदहीनमित्यर्थः । जानामीत्यनुकर्षः ।। 5.38.40,41 ।।\n\nअथ हनूमन्तं सामान्यतो रामवैभवमाह न नागा इति । प्रतिसमीहितुम् । प्रतिभटतया स्थित्वा निरोद्धुमित्यर्थः । \"प्रतिसमाधितुम्\" इति पाठान्तरम् । तत्रार्षत्वं शरणम् । उक्त एवार्थः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "edition:5.38.40:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.38.40 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.38.40", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.38.40", "iast": "apāravāram akṣobhyaṃ gāmbhīryāt sāgaropamam । bhartāraṃ sasamudrāyā dharaṇyā vāsavopamam ॥40॥"}], "seq": 31}]}, {"verse_id": "5.38.45", "verse": "45", "sanskrit_iast": "yadi tau puruṣavyāghrau vāyvindrasamatejasau । surāṇām api durdharṣo kimarthaṃ mām upekṣataḥ ॥45॥", "leonov_ru": "Если те два тигра среди людей, доблестью подобные Вайю (богу ветра) и Индре, Неодолимые даже для богов, почему мною пренебрегают?", "commentary": {"siromani": "यदीति । पुरुषव्याघ्रौ तौ रामलक्ष्मणौ यदि सुराणामपि दुर्धषौ तर्हि मां किमर्थमुपेक्षतः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.45:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "api", "kind": "note", "text": "Опущена эмфаза"}], "suggestions": [], "seq": 32}]}, {"verse_id": "5.38.49", "verse": "49", "sanskrit_iast": "kathaṃ cid bhavatī dṛṣṭā na kālaḥ pariśocitum । imaṃ muhūrtaṃ duḥkhānām antaṃ drakṣyasi śobhane ॥49॥", "leonov_ru": "Едва (с трудом) найдена [мной] госпожа. Нет времени для скорби. Скоро, прекрасная, увидишь ты конец своих страданий.", "commentary": {"siromani": "कथञ्चिदिति । यस्मात् कथञ्चित् भवती दृष्टा मयेति शेषः । अतः इमं मुहूर्तम् आरभ्येति शेषः । दुःखानामन्तं द्रक्ष्यसि । किंच दुःखानामन्तं विध्वंसकमिममागामिनं मुहूर्तं द्रक्ष्यसि अतः परिशोचितुं कालः समयो न", "bhusana": "कथंचिद्भवती दृष्टा न कालः परिशोचितुम्\nइमं मुहूर्तं दुःखानां द्रक्ष्यस्यन्तमनिन्दिते ।\n\nतावुभौ पुरुषव्याघ्रौ राजपुत्रौ महाबलौ"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "crosstext:5.38.49:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "kāla", "note_ru": "na kālaḥ pariśocitum — «не время скорбеть». Хануман пресекает плач Ситы указанием на kāla как на сжатый момент действия: «kathaṃcid bhavatī dṛṣṭā na kālaḥ pariśocitum» (V.38.49). Та же категория «упущенного, невозвратного срока» — стержень nīti Шантипарвы: «yaḥ kālo hi vyatikrāmet puruṣaṃ kālakāṅkṣiṇam । durlabhaḥ sa punaḥ kālaḥ kāladharmacikīrṣuṇā» (MBh XII.104.20) — «Срок, что минует мужа, выжидающего [свой] час, — вновь труднодостижим такой срок для желающего исполнить долг времени». Параллель показывает, что фраза вестника — не утешительный оборот, а аппликация политической доктрины о kāla-jña «знатоке [верного] времени».", "type": "Б", "cluster": "mbh_gnomic", "cluster_label": "МБх дидактика (Шантипарва / Анушасанапарва)", "shloka_ref": "V.38.49", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Śāntiparvan (MBh XII) 12.104.20", "source_links": [], "seq": 33}]}, {"verse_id": "5.38.51", "verse": "51", "sanskrit_iast": "hatvā ca samarakrūraṃ rāvaṇaṃ sahabāndhavam । rāghavas tvāṃ viśālākṣi svāṃ purīṃ prati neṣyati ॥51॥", "leonov_ru": "Убив жестокого в битвах Равану вместе с его близкими, Рагхава тебя, о широкоглазая, отведет в свой город.", "commentary": {"siromani": "हत्वेति । राघवः रावणं हत्वा त्वां स्वां पुरीं प्रति नेष्यति", "bhusana": "हत्वा च समरे क्रूरं रावणं सहबान्धवम् ।\n\nराघवस्त्वां विशालाक्षि नेष्यति स्वां पुरीं प्रति ।\n\nब्रूहि यद्राघवो वाच्यो लक्ष्मणश्च महाबलः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "lexical:5.38.51:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "viśālākṣī", "note_ru": "Вишалакши (viśāla-akṣī, f.) — «широкоглазая» (viśāla «широкий, просторный» + akṣi «глаз»): стандартный эпитет красавицы. MW: viśāla adj. 'wide, spacious, large'. Глаза — главный маркер красоты в санскритской поэтике (kāvya): широкие глаза уподоблены лотосу (padma-patrā-iva) или рыбам. Viśālākṣī — не просто красивая: «широкий взгляд» также = «мудрость, широта восприятия» в переносном смысле.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:viSAla", "source_links": [{"label": "MW viSAla", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=viSAla"}], "seq": 34}]}, {"verse_id": "5.38.52", "verse": "52", "sanskrit_iast": "brūhi yad rāghavo vācyo lakṣmaṇaś ca mahābalaḥ । sugrīvo vāpi tejasvī harayo 'pi samāgatāḥ ॥52॥", "leonov_ru": "Скажи, что должно быть сказано Рагхаве и могучему Лакшмане, Доблестному Сугриве и собравшимся обезьянам?»", "commentary": {"siromani": "ब्रूहीति । राघवप्रभृतिः यद्वाच्यः तत् समागताः रामसमीपं प्राप्ताः हरयश्च यद्वाच्याः तच्च त्वं ब्रूहि", "bhusana": "सुग्रीवो वापि तेजस्वी हरयो ऽपि समागताः ।\n\nइत्युक्तवति तस्मिंश्च सीता सुरसुतोपमा ।\n\nउवाच सोकसन्तप्ता हनुमन्तं प्लवङ्गमम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "edition:5.38.52:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлока 5.38.52 отсутствует в критическом издании (Барода).", "kind": "single", "scope": "одна шлока", "range": "5.38.52", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.38.52", "iast": "brūhi yad rāghavo vācyo lakṣmaṇaś ca mahābalaḥ । sugrīvo vāpi tejasvī harayo 'pi samāgatāḥ ॥52॥"}], "seq": 35}]}, {"verse_id": "5.38.55", "verse": "55", "sanskrit_iast": "aiśvaryaṃ ca viśālāyāṃ pṛthivyām api durlabham । pitaraṃ mātaraṃ caiva sammānyābhiprasādya ca ॥55॥", "leonov_ru": "И могущество, которое трудно добыть на обширной земле, Отца и мать почтив и умилостивив,", "commentary": {"bhusana": "पितरं मातरं चैव संमान्याभिप्रसाद्य च ।\n\nअनुप्रव्रजितो रामं सुमित्रा येन सुप्रजाः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "lexical:5.38.55:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "aiśvarya", "note_ru": "Айшварья (aiśvarya, n.) — «владычество, верховная власть» (от īśvara «владыка, господь» + ya; īśvara = √īś- «властвовать»). MW: aiśvarya n. 'dominion, sovereignty; the state of being the lord God'. Сита перечисляет то, что осталось у Рамы на земле: aiśvarya как политическая власть / dharmic dominion. В Sāṃkhya / Vedānta aiśvarya — одна из восьми сверхсил (aiśvarya, bala, vīrya, etc.).", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:ESwArya", "source_links": [{"label": "MW ESwArya", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=ESwArya"}], "seq": 36}]}, {"verse_id": "5.38.57", "verse": "57", "sanskrit_iast": "anugacchati kākutsthaṃ bhrātaraṃ pālayan vane । siṃhaskandho mahābāhur manasvī priyadarśanaḥ ॥57॥", "leonov_ru": "Следует за Какутстхой братом, защищая [его] в лесу, Львиноплечий, мощнорукий, мудрый, прекрасный обликом,", "commentary": {"bhusana": "संहस्कन्धो महाबाहुर्मनस्वी प्रियदर्शनः ।\n\nपितृवद्वर्तते रामे मातृवन्मां समाचरन्\nस्रजश्च सर्वरत्नानि प्रिया याश्च वराङ्गनाः ।\n\nऐश्वर्यं च विशालायां पृथिव्यामपि दुर्लभम्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "lexical:5.38.57:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "siṃhaskandha", "note_ru": "Симхаскандха (siṃha-skandha, m.) — «львиноплечий» (siṃha «лев» + skandha «плечо, ствол»). MW: skandha m. 'the shoulder; the trunk of a tree'. siṃhaskandha — стандартный эпический эпитет героя/кшатрия: плечи льва = широкие и мощные. MW также: skandha как «ствол дерева» — Лакшмана = опора (ствол) для Рамы.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:siṃha+dic_mw:skandha", "source_links": [{"label": "MW si", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=si"}, {"label": "MW skandha", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=skandha"}], "seq": 37}, {"id": "crosstext:5.38.57:0", "layer": "crosstext", "layer_label": "cross-text", "votable": true, "status": "review_required", "lemma_iast": "priyadarśana", "note_ru": "priyadarśanaḥ («приятный обликом») — в характеристике Лакшмана (львиноплечий, мощнорукий, мудрый, прекрасный обликом), которую Сита приводит как примету. В Сказании о Савитри тем же эпитетом аттестуют достоинства Сатьявана: «yayātiriva codāraḥ somavat priyadarśanaḥ» (MBh III.278.18) — «благороден, как Яяти, и прекрасен обликом, словно Месяц». Параллель показывает, что priyadarśana — стандартный пункт эпического «паспорта» достойного героя (наряду с udāra, rūpa-sampanna), а не индивидуальная деталь Лакшмана.", "type": "Б", "cluster": "mbh_narrative", "cluster_label": "МБх нарратив (Ади / Сабха / Аранья / Вирата / Удьйога)", "shloka_ref": "V.38.57", "work_label": "", "verse_address": "", "parallel_sa_iast": "", "sundara_sa_iast": "", "quality": "", "source": "Mahābhārata, Āraṇyakaparvan (Sāvitryupākhyāna) III.278.18", "source_links": [], "seq": 38}]}, {"verse_id": "5.38.59", "verse": "59", "sanskrit_iast": "vṛddhopasevī lakṣmīvāñ śakto na bahubhāṣitā । rājaputrapriyaśreṣṭhaḥ sadṛśaḥ śvaśurasya me ॥59॥", "leonov_ru": "Служащий старшим, наделенный удачей, могучий, немногословный, Лучший из любимых царским сыном (то есть Рамой), подобный моему свекру (Дашаратхе).", "commentary": {"tilaka": "शक्तः समर्थः न बहुभाषिता मितभाषीत्यर्थः । राजपुत्रस्य रामस्य प्रियेषु श्रेष्ठः अतिप्रिय इत्यर्थः", "siromani": "मे श्वशुरस्य सदृशः यः रामस्य प्रियतरो भ्राता अत एव मत्तः ममापि प्रियः अतिप्रीतिविषयीभूतः", "bhusana": "वृद्दोपसेवी लक्ष्मीवान् शक्तो न बहु भाषिता ।\n\nराजपुत्रः प्रियः श्रेष्ठः सदृशः श्वशुरस्य मे"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "lexical:5.38.59:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "vṛddhopasevī", "note_ru": "Врудхопасевин (vṛddha-upasevī, m.) — «служащий старшим» (vṛddha «пожилой, старший» + upasevī «служитель», upa-√sev- «служить, почитать»). MW: upasevā f. 'attendance upon, service, worship'. Эпитет Лакшманы подчёркивает одно из главных качеств kṣatriya-сына: служение старшим — dharmic обязательство, а не просто деликатность.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:upasevI", "source_links": [{"label": "MW upasevI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=upasevI"}], "seq": 39}]}, {"verse_id": "5.38.61", "verse": "61", "sanskrit_iast": "yaṃ dṛṣṭvā rāghavo naiva vṛttam āryam anusmarat । sa mamārthāya kuśalaṃ vaktavyo vacanān mama ॥61॥", "leonov_ru": "При взгляде на которого Рама не вспоминает об умершем государе (Дашаратхе). Должно сказать ему, что я спрашиваю о его благополучии.", "commentary": {"tilaka": "वृत्तं प्रमीतम् । पितृवद्रक्षकत्वात्तत्स्मरणाभावः । अनुस्मरदन्वस्मरत् । ममार्थाय मत्प्रयोजनोन्मुखाय । मम वचनाद्वक्तव्यः सीता त्वां कुशलं पृच्छतीति वक्तव्य इत्यर्थः", "bhusana": "यं दृष्ट्वा राघवो नैव वृत्तमार्यमनुस्मरेत् ।\n\nस ममार्थाय कुशलं वक्तव्यो वचनान्मम ।\n\nमृदुर्नित्यं शुचिर्दक्षः प्रियो रामस्य लक्ष्मणः\nयमिति । आर्यं श्वशुरं दशरथं नानुस्मरेत्, पितृवत्सम्यग्रक्षकत्वादिति भावः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.61:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Взглянув на него, забывает / Рама, что нет Дашаратхи (yaṃ dṛṣṭvā rāghavo naiva vṛttam āryam anusmarat) – автор комментария «Тилака» глоссирует vṛttam как pramītam (ушедшего/умершего». Таким образом, буквальный перевод здесь будет «увидев которого Рагхава не вспоминает об умершем благородном». В критическом издании вместо vṛttam стоит vṛddham «старого» (см.: Jhala 1966: 279). В комментарии «Бхушана» поясняется, что под «благородным» (aryaṃ) подразумевается царь Дашаратха.", "service": [], "suggestions": [], "seq": 40}]}, {"verse_id": "5.38.62", "verse": "62", "sanskrit_iast": "mṛdur nityaṃ śucir dakṣaḥ priyo rāmasya lakṣmaṇaḥ । yathā hi vānaraśreṣṭha duḥkhakṣayakaro bhavet ॥62॥", "leonov_ru": "Всегда нежный, чистый, учтивый, любезный Раме, Лакшмана Чтобы был, о лучший из обезьян, [моим] избавителем от страданий,", "commentary": {"tilaka": "हि निश्चये । यथा दुःखक्षयकरो भवेद्दुःखक्षयहेतुप्रवृत्तिपरो भवेत्तथा वाच्य इत्यर्थः", "siromani": "सलक्ष्मणः ममार्थाय यथा दुःखक्षयकरो भवेत् तथा कुशलं वक्तव्यः । सार्धाष्टकमेकान्वयि", "bhusana": "यथा हि वानरश्रेष्ठ दुःखक्षयकरो भवेत् ।\n\nत्वमस्मिन् कार्यनिर्योगे प्रमाणं हरिसत्तम\nरामः यथा दुःखक्षयकरो भवेत्तथा वक्तव्यमित्यर्थः । कार्यनिर्योगे कार्यसङ्घटने । प्रमाणं व्यवस्तापकः\nमम प्रियतरो नित्यं भ्राता रामस्य लक्ष्मणः ।\n\nनियुक्तो धुरि यस्यां तु तामुद्वहति वीर्यवान्"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "edition:5.38.62:0", "layer": "edition", "layer_label": "издания · сноска", "votable": true, "status": "ожидает гейта М.Г.", "note_ru": "Шлоки 5.38.62–63 (2 шлоки) отсутствуют в критическом издании (Барода).", "kind": "verse_range", "scope": "несколько шлок подряд", "range": "5.38.62–63", "confidence": "structural_absence (best_crit_jaccard < 0.25)", "verses_iast": [{"verse_id": "5.38.62", "iast": "mṛdur nityaṃ śucir dakṣaḥ priyo rāmasya lakṣmaṇaḥ । yathā hi vānaraśreṣṭha duḥkhakṣayakaro bhavet ॥62॥"}, {"verse_id": "5.38.63", "iast": "tvam asmin kāryanirvahe pramāṇaṃ hariyūthapa । rāghavas tvatsamārambhān mayi yatnaparo bhavet ॥63॥"}], "seq": 41}]}, {"verse_id": "5.38.63", "verse": "63", "sanskrit_iast": "tvam asmin kāryanirvahe pramāṇaṃ hariyūthapa । rāghavas tvatsamārambhān mayi yatnaparo bhavet ॥63॥", "leonov_ru": "Ты, о вождь обезьян, являешься мерой (главным лицом) в исполнении этого дела. Благодаря твоим стараниям будет Рама радеть обо мне.", "commentary": {"bhusana": "राघवस्त्वत्समारम्भान्मयि यत्नपरो भवेत्\nत्वत्समारम्भात्त्वदुत्साहात्", "siromani": "त्वमिति । हे हरियूथप त्वत्समारभ्मात् त्वदुत्साहनात् राघवः मयि यत्नपरो भवेत् अतः अस्मिन् कार्यनिर्वाहे कार्यसाधने त्वमेव प्रमाणम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.63:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "pramāṇaṃ", "kind": "note", "text": "Комментарий о значении этого слова?"}], "suggestions": [], "seq": 42}, {"id": "tier1:5.38.63:1", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "nāthaṃśūraṃ rāmaṃ", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 43}, {"id": "lexical:5.38.63:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pramāṇa", "note_ru": "Прамана (pramāṇa, n.) — «мера, авторитет, свидетельство» (pra-√mā- «измерять вперёд»). MW: pramāṇa n. 'measure; authority, standard; a means of proof or demonstration'. В эпистемологии Ньяя/Мимансы pramāṇa = источник достоверного знания (pratyakṣa, anumāna, śabda). Сита: «ты — pramāṇa в этом деле» — Хануман = авторитетная мера успеха.", "type": "А", "subtype": "lexical", "trigger": "etymology", "source": "dic_mw:pramARa", "source_links": [{"label": "MW pramARa", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=pramARa"}], "collision_tier1": true, "seq": 44}]}, {"verse_id": "5.38.64", "verse": "64", "sanskrit_iast": "idaṃ brūyāś ca me nāthaṃ śūraṃ rāmaṃ punaḥ punaḥ । jīvitaṃ dhārayiṣyāmi māsaṃ daśarathātmaja । ūrdhvaṃ māsān na jīveyaṃ satyenāhaṃ bravīmi te ॥64॥", "leonov_ru": "Это ты должен говорить моему мужу, отважному Раме, снова и снова: «О сын Дашаратхи, месяц жизни у меня остался. По прошествии месяца не буду жить я, истинно говорю я тебе».", "commentary": {"bhusana": "इदं ब्रूयाश्च मे नाथं शूरं रामं पुनः पुनः ।\n\nजीवितं धारयिष्यामि मासं दशरथात्मज\nऊर्ध्वं मासान्न जीवेयं सत्येनाहं ब्रवीमि ते ।\n\nरावणेनोपरुद्धां मां निकृत्या पापकर्मणा", "siromani": "इदमिति । हे दशरथात्मज मासम् अवधिभूतमासपर्यन्तं जीवितं धारयिष्यामि मासात् ऊर्ध्वं न जीवेयम् इति सत्येन सत्यं ते अहं ब्रवीमि इदं मम वचः मे नाथं रामं त्वं ब्रूयाः सार्धश्लोक एकान्वयी"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.64:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "Месяц мне жизни остался (jīvitaṃ dhārayiṣyāmi māsaṃ) – букв. «буду сохранять жизнь месяц». Ранее Сита говорила о двух месяцах. Возможно, имеется в виду, что она не доживет даже до конца того срока, который отвел ей Равана.", "service": [], "suggestions": [], "seq": 45}]}, {"verse_id": "5.38.65", "verse": "65", "sanskrit_iast": "rāvaṇenoparuddhāṃ māṃ nikṛtyā pāpakarmaṇā । trātum arhasi vīra tvaṃ pātālād iva kauśikīm ॥65॥", "leonov_ru": "«Меня, которую запер, унизив, Равана, чьи грешны (злы) деяния, Должен ты спасти, отважный, как Каушики – из Паталы»", "commentary": {"siromani": "रावणेनेति । पापकर्मणा रावणेनोपरुद्धाम् अत एव निकृत्या राक्षसीकृतपीडयोपलक्षितां मां त्रातुमर्हसि । तत्र दृष्टान्तः पातालात् उद्धृतां कौशिकीं कौशिकगोत्रपृथ्वीमिव यथा वराहः पृथिवीं ररक्ष तथेत्यर्थः", "bhusana": "त्रातुमर्हसि वीर त्वं पातालादिव कौशिकीम् ।\n\nततो वस्त्रगतं मुक्त्वा दिव्यं चूडामणिं शुभम् ।\n\nप्रदेयो राघवायेति सीता हनुमते ददौ\nपातालादिव कौशिकीम् । अत्रेतिकरणं द्रष्टव्यम् । इदं च ब्रूया इति पूर्वेणान्वयः । कौशिकः इन्द्रः तत्सम्बन्धिनी श्रीः कौशिकी तामिव । एवं ब्रह्मपुराणे श्रुयते पुरा  वृत्रवधे ब्रह्महत्याभिभूतं निश्श्रीकमिन्द्रं भगवान्नारायणो देवैस्सह वैष्णवेनाश्वमेघेन निष्कल्मषं कृत्वा त्रैलोक्यराज्ये ऽभिषिच्य पुरातनीं पौरन्दरीं श्रियमुपाह्वयत् । ततो ऽशरीरवाक्याद्गवाक्षतीर्थवर्तिनीं तामुपश्रुत्य स देवदेवो देवाश्च तत्र जग्मुः । ततस्तान् दृष्ट्वा सा श्रीः पातालं प्रविवेश । तत्र प्रवेष्टुमशक्नुवन्तो देवाः पुनरप्यशरीरं वाक्यं युष्मासु सर्वलक्षणसम्पन्नस्तां प्रतिनेतुमर्हतीत्युपश्रुत्य तमेव पुरुषोत्तमं प्रार्थयामासुः । स तत्र प्रविश्य पातालात् तां समुद्धृत्य तैस्सह शक्राय प्रादादिति । महाभारते तु उतथ्यस्य भार्यां यमुनायां स्नान्तीं वरुणो हृत्वा पतालमनयत् । तामुतथ्यो नारदेन याचित्वा तामलब्ध्वा कुपितः पातालह्रदशोषेण तामवापेति श्रूयते । सा कौशिकीति केचित्कथयन्ति"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "lexical:5.38.65:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "pātāla", "note_ru": "Патала (pātāla, n.) — «подземный мир» (от √pat- «падать» + āla «вместилище»; MW не решает этимологию окончательно). MW: pātāla n. 'the underworld, one of the seven regions under the earth'. «Спаси меня как Каушики из Паталы»: аллюзия на миф о Вишвамитре (Каушики = «сын Кушики»), связанном в подземном мире. Без этого мифологического пресуппозита сравнение не имеет смысла.", "type": "А", "subtype": "lexical", "trigger": "realia", "source": "dic_mw:pAtAla", "source_links": [{"label": "MW pAtAla", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=pAtAla"}], "seq": 46}, {"id": "phase2:5.38.65:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "kauśikī", "note_ru": "Кто такая Каушики в сравнении «спаси, как Каушики из Паталы», толкуется у комментаторов по-разному: у «Широмани» — это земля рода Каушика, некогда спасённая Вараха из Паталы; у «Бхушаны» — не земля, а сама царская Шри (удача) Индры, унесённая в Паталу после убийства Вритры и возвращённая Нараяной. Ни то, ни другое отождествление не совпадает с версией лексического примечания (дочь Кушики / миф о Вишвамитре), так что перевод оставляет сравнение открытым, не выбирая version.", "type": "В", "source_commentary": ["siromani", "bhusana"], "why_proposed": "показывает разошедшуюся идентификацию Каушики у двух комментаторов, обе версии отличны от мифологической атрибуции в существующем лексическом примечании.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 47}]}, {"verse_id": "5.38.66", "verse": "66", "sanskrit_iast": "tato vastragataṃ muktvā divyaṃ cūḍāmaṇiṃ śubham । pradeyo rāghavāyeti sītā hanumate dadau ॥66॥", "leonov_ru": "Тогда чудесный, прекрасный камень чудамани, сняв и завернув в [кусок] платья, Дала Сита Хануману, [сказав] «Отдай [это] Рагхаве».", "commentary": {"tilaka": "चूडामणिं शिरोरत्नम्"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.66:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "сняв камень чудесный", "kind": "note", "text": "Нужен комментарий о том, что это за камень (cūḍāmaṇi) и по поводу vastragata: был ли он завернут изначально (например, такой вариант у Г-пресс) или она его завернула и отдала"}], "suggestions": [], "seq": 48}]}, {"verse_id": "5.38.67", "verse": "67", "sanskrit_iast": "pratigṛhya tato vīro maṇiratnam anuttamam । aṅgulyā yojayām āsa na hy asyā prābhavad bhujaḥ ॥67॥", "leonov_ru": "Тогда отважный, взяв несравненный драгоценный камень, Надел его на палец , ибо не налезал он ему на руку.", "commentary": {"tilaka": "अङ्गुल्या योजयामास दधार । चूडामण्यधिष्ठानहेमपुष्पस्य केशप्रवेशार्थं यद्रन्ध्रं तत्राङ्गुलिं प्रवेशयामासेत्यर्थः । ननु तदा सूक्ष्मरूपत्वात्तत्र भुजासञ्जनमेवोचितमत आह-- नहीति । अस्य भुजः सूक्ष्मो ऽपि न प्राभवत् तद्रन्ध्रे न प्राविशदित्यर्थः । निषेधस्य प्रसक्तिमूलकत्वात्प्रसक्तेश्च सूक्ष्मरूप एव संभवात् पूर्वं देव्यै प्रदर्शितं महद्रूपं विहाय सूक्ष्मरूपेणैव स्थित इति गम्यत इति तीर्थः । कतकस्तु अङ्गुल्या योजयामास । सूक्ष्मवासोबद्धमङ्गुल्यां दृढं बबन्धेत्यर्थः । अस्य बन्धेन भुजो न प्राभवत्, व्यक्ततया सर्वानुभवप्रसङ्गाद्गोपनीयत्वाच्च भुजो नोचितो ऽभूदित्यर्थ इत्याह", "siromani": "प्रतीति । वीरो हनूमान् मणिरत्नं प्रतिगृह्य अङ्गुल्या योजयामास । तद्गतच्छिद्रे अङ्गुलिं प्रवेशयामासेत्यर्थः । ननु हनुमद्रूपस्य सुसूक्ष्मत्वात् भुजेनैव कुतो न धृतवानित्यत आह अस्य हनुमतो भुजो न प्राभवत् तच्छिद्रप्रवेशार्हो नाभवदित्यर्थः"}, "has_tier1": true, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "tier1:5.38.67:0", "layer": "tier1", "layer_label": "ярус 1 · Леонов/Костина", "votable": false, "status": "в печатном аппарате перевода", "provenance": "рабочий файл перевода, извлечено 01-07-2026", "note_ru": "", "service": [{"author": "Е. Костина", "lemma_iast": "самоцвет несравненный,И на палец надел", "kind": "note", "text": "Можно ли надеть камень на палец или на руку? По изначальному описанию непонятно, что это за украшение, поэтому читатель может быть удивлен"}, {"author": "Е. Костина", "lemma_iast": "kapivaraḥ", "kind": "omission", "text": "опущено"}], "suggestions": [], "seq": 49}, {"id": "lexical:5.38.67:0", "layer": "lexical", "layer_label": "Фаза 1 · лексич.", "votable": true, "status": "review_required", "lemma_iast": "aṅgulī", "note_ru": "Ангули (aṅgulī / aṅguli, f.) — «палец» (связано с aṅga «часть тела»). MW: aṅgulī f. 'a finger; a toe'. Хануман надевает cūḍāmaṇi на палец (aṅgulyā yojayām āsa), ибо не налезает на руку: юмористическая деталь, подчёркивающая несоответствие масштабов (человеческий jewelry vs. обезьяний размах), — одновременно трогательная, подчёркивающая «бережность» Ханумана.", "type": "А", "subtype": "lexical", "trigger": "gloss", "source": "dic_mw:aNgulI", "source_links": [{"label": "MW aNgulI", "url": "https://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/2020/web/webtc/indexcaller.php?key=aNgulI"}], "collision_tier1": true, "seq": 50}]}, {"verse_id": "5.38.68", "verse": "68", "sanskrit_iast": "maṇiratnaṃ kapivaraḥ pratigṛhyābhivādya ca । sītāṃ pradakṣiṇaṃ kṛtvā praṇataḥ pārśvataḥ sthitaḥ ॥68॥", "leonov_ru": "Взяв драгоценный камень и поблагодарив, лучший из обезьян, Обойдя ее (в знак почтения) слева направо, встал, склонившись, рядом [с ней].", "commentary": {"tilaka": "पार्श्वतः स्थितः सीतासमीपे स्थितः ।। 5.38.68,69 ।।\n\nमहार्हं बहुमूल्यम् । प्रभावात्सामर्थ्यविशेषात् । राक्षसीभिर्यथा न ज्ञायते तथा धृतम् । गिरिवरपवनावधूतमुक्तः पर्वतश्रेष्ठोर्ध्वभागीयपवनकम्पितः, पश्चात्तेन कम्पेन मुक्तः, स इव सुखितमनाः । अयमपि पूर्वं सीताया अदर्शनेन दुःखवशात्कम्पितः, ततस्तद्दर्शनेन ततः कम्पान्मुक्तः, अतः सुखितमनाः प्रतिसङ्क्रमं लङ्कादुर्गप्राकारं प्राप्तुं प्रपेदे । यत्नमारभतेत्यर्थः", "bhusana": "प्रतिगृह्य ततो वीरो मणिरत्नमनुत्तमम् ।\n\nअङ्गुल्या योजयामास न ह्यस्य प्राभवद्भुजः ।\nप्रतिगृह्येति । मणिरत्नं मणिश्रेष्ठम् । अङ्गुल्या योजयामास, चूडामणेरधिष्ठानस्य पृष्ठे या केशसरणिः तत्राङ्गुलिं प्रावेशयदित्यर्थः । एवं तनीयसी किमङ्गुलिरित्यत्राह-- न हीति । अस्य हनुमतः भुजः न प्राभवन्न स्थूलो ऽभवत् । न तदानीं स महाकायः भुजश्च न स्थूलः तेनाङ्गुलिस्तनीयसीत्यर्थः । एतेन देव्यै प्रदर्शितं महद्रूपं विहाय पुरप्रवेशकालिकं सूक्ष्मरूपमङ्गीकृतवानित्यवगम्यते", "siromani": "मणीति । कपिवरो हनूमान् प्रणतः सन् पार्श्वतः पार्श्वे स्थितः"}, "has_tier1": false, "verse_ref": "https://github.com/gasyoun/CommentaryStrategies/blob/main/data/book/sundarakanda_print_master.md#песнь-38", "notes": [{"id": "phase2:5.38.68:0", "layer": "phase2", "layer_label": "Фаза 2 · комментаторы", "votable": true, "status": "ожидает гейта М.Г.", "mg_comment": "", "lemma_iast": "prabhāvāt dhṛtam", "note_ru": "По Тилаке, Сита прятала чудамани «в силу его чудесного свойства» так, что ракшаси её не замечали (rākṣasībhir yathā na jñāyate tathā dhṛtam) — деталь, отвечающая на не закрытый Костиной в её пометке вопрос о том, был ли камень изначально завёрнут в ткань.", "type": "Б", "source_commentary": ["tilaka"], "why_proposed": "даёт причину, почему камень был скрыт (чтобы ракшаси не заметили) — прямой ответ на открытый вопрос Костиной к этому эпизоду, который в её собственной пометке остаётся без ответа.", "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_batch3_draft"}, "seq": 51}]}, {"verse_id": "5.38.70", "verse": "70", "sanskrit_iast": "maṇivaram upagṛhya taṃ mahārhaṃ । janakanṛpātmajayā dhṛtaṃ prabhāvāt । girivarapavanāvadhūtamuktaḥ । sukhitamanāḥ pratisaṃkramaṃ prapede ॥70॥", "leonov_ru": "Взяв тот лучший из драгоценных

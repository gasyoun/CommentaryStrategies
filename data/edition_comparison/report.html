5.9.25", "text": "kva cit prabhinnaiḥ karakaiḥ kva cid āloḍitair ghaṭaiḥ kva cit saṃpṛktamālyāni jalāni ca phalāni ca"}, {"critical": "5.9.31", "text": "śyāmāvadātās tatrānyāḥ kāś cit kṛṣṇā varāṅganāḥ kāś cit kāñcanavarṇāṅgyaḥ pramadā rākṣasālaye"}, {"critical": "5.9.32", "text": "tāsāṃ nidrāvaśatvāc ca madanena vimūrchitam padminīnāṃ prasuptānāṃ rūpam āsīd yathaiva hi"}, {"critical": "5.12.27", "text": "tato 'mbudharasaṃkāśaṃ pravṛddhaśikharaṃ girim vicitrakūṭaṃ kūṭaiś ca sarvataḥ parivāritam"}, {"critical": "5.12.35", "text": "ye ke cit pādapās tatra puṣpopagaphalopagāḥ sacchatrāḥ savitardīkāḥ sarve sauvarṇavedikāḥ"}, {"critical": "5.12.36", "text": "latāpratānair bahubhiḥ parṇaiś ca bahubhir vṛtām kāñcanīṃ śiṃśupām ekāṃ dadarśa sa mahākapiḥ"}, {"critical": "5.13.7", "text": "āmūlapuṣpanicitair aśokaiḥ śokanāśanaiḥ puṣpabhārātibhāraiś ca spṛśadbhir iva medinīm"}, {"critical": "5.13.9", "text": "puṃnāgāḥ saptaparṇāś ca campakoddālakās tathā vivṛddhamūlā bahavaḥ śobhante sma supuṣpitāḥ"}, {"critical": "5.13.10", "text": "śātakumbhanibhāḥ ke cit ke cid agniśikhopamāḥ nīlāñjananibhāḥ ke cit tatrāśokāḥ sahasraśaḥ"}, {"critical": "5.13.11", "text": "nandanaṃ vividhodyānaṃ citraṃ caitrarathaṃ yathā ativṛttam ivācintyaṃ divyaṃ ramyaṃ śriyā vṛtam"}, {"critical": "5.13.12", "text": "dvitīyam iva cākāśaṃ puṣpajyotirgaṇāyutam puṣparatnaśataiś citraṃ pañcamaṃ sāgaraṃ yathā"}, {"critical": "5.13.13", "text": "sarvartupuṣpair nicitaṃ pādapair madhugandhibhiḥ nānāninādair udyānaṃ ramyaṃ mṛgagaṇair dvijaiḥ"}, {"critical": "5.13.14", "text": "anekagandhapravahaṃ puṇyagandhaṃ manoramam śailendram iva gandhāḍhyaṃ dvitīyaṃ gandhamādanam"}, {"critical": "5.13.15", "text": "aśokavanikāyāṃ tu tasyāṃ vānarapuṃgavaḥ sa dadarśāvidūrasthaṃ caityaprāsādam ūrjitam"}, {"critical": "5.13.16", "text": "madhye stambhasahasreṇa sthitaṃ kailāsapāṇḍuram pravālakṛtasopānaṃ taptakāñcanavedikam"}, {"critical": "5.13.17", "text": "muṣṇantam iva cakṣūṃṣi dyotamānam iva śriyā vimalaṃ prāṃśubhāvatvād ullikhantam ivāmbaram"}, {"critical": "5.13.18", "text": "tato malinasaṃvītāṃ rākṣasībhiḥ samāvṛtām upavāsakṛśāṃ dīnāṃ niḥśvasāntīṃ punaḥ punaḥ"}, {"critical": "5.13.25", "text": "tāṃ samīkṣya viśālākṣīm adhikaṃ malināṃ kṛśām tarkayām āsa sīteti kāraṇair upapādibhiḥ"}, {"critical": "5.13.26", "text": "hriyamāṇā tadā tena rakṣasā kāmarūpiṇā yathārūpā hi dṛṣṭā vai tathārūpeyam aṅganā"}, {"critical": "5.13.27", "text": "pūrṇacandrānanāṃ subhrūṃ cāruvṛttapayodharām kurvantīṃ prabhayā devīṃ sarvā vitimirā diśaḥ"}, {"critical": "5.13.28", "text": "tāṃ nīlakeśīṃ bimbauṣṭhīṃ sumadhyāṃ supratiṣṭhitām sītāṃ padmapalāśākṣīṃ manmathasya ratiṃ yathā"}, {"critical": "5.13.29", "text": "iṣṭāṃ sarvasya jagataḥ pūrṇacandraprabhām iva bhūmau sutanum āsīnāṃ niyatām iva tāpasīm"}, {"critical": "5.13.30", "text": "niḥśvāsabahulāṃ bhīruṃ bhujagendravadhūm iva śokajālena mahatā vitatena na rājatīm"}, {"critical": "5.13.31", "text": "saṃsaktāṃ dhūmajālena śikhām iva vibhāvasoḥ tāṃ smṛtīm iva saṃdighdām ṛddhiṃ nipatitām iva"}, {"critical": "5.13.32", "text": "vihatām iva ca śraddhām āśāṃ pratihatām iva sopasargāṃ yathā siddhiṃ buddhiṃ sakaluṣām iva"}, {"critical": "5.13.33", "text": "abhūtenāpavādena kīrtiṃ nipatitām iva rāmoparodhavyathitāṃ rakṣoharaṇakarśitām"}, {"critical": "5.13.51", "text": "duṣkaraṃ kurute rāmo ya imāṃ mattakāśinīm sītāṃ vinā mahābāhur muhūrtam api jīvati"}, {"critical": "5.15.26", "text": "mṛṇālī paṅkadighdeva vibhāti ca na bhāti ca malinena tu vastreṇa parikliṣṭena bhāminīm"}, {"critical": "5.15.27", "text": "saṃvṛtāṃ mṛgaśāvākṣīṃ dadarśa hanumān kapiḥ tāṃ devīṃ dīnavadanām adīnāṃ bhartṛtejasā"}, {"critical": "5.15.28", "text": "rakṣitāṃ svena śīlena sītām asitalocanām tāṃ dṛṣṭvā hanumān sītāṃ mṛgaśāvanibhekṣaṇām"}, {"critical": "5.15.29", "text": "mṛgakanyām iva trastāṃ vīkṣamāṇāṃ samantataḥ dahantīm iva niḥśvāsair vṛkṣān pallavadhāriṇaḥ"}, {"critical": "5.15.30", "text": "saṃghātam iva śokānāṃ duḥkhasyormim ivotthitām tāṃ kṣāmāṃ suvibhaktāṅgīṃ vinābharaṇaśobhinīm"}, {"critical": "5.15.31", "text": "praharṣam atulaṃ lebhe mārutiḥ prekṣya maithilīm harṣajāni ca so 'śrūṇi tāṃ dṛṣṭvā madirekṣaṇām"}, {"critical": "5.15.32", "text": "mumoca hanumāṃs tatra namaś cakre ca rāghavam namaskṛtvā ca rāmāya lakṣmaṇāya ca vīryavān"}, {"critical": "5.17.12", "text": "padminīm iva vidhvastāṃ hataśūrāṃ camūm iva prabhām iva tapodhvastām upakṣīṇām ivāpagām"}, {"critical": "5.17.13", "text": "vedīm iva parāmṛṣṭāṃ śāntām agniśikhām iva paurṇamāsīm iva niśāṃ rāhugrastendumaṇḍalām"}, {"critical": "5.18.22", "text": "pratikarmābhisaṃyuktā dākṣiṇyena varānane bhuṅkṣva bhogān yathākāmaṃ piba bhīru ramasva ca"}, {"critical": "5.19.5", "text": "evam uktvā tu vaidehī rāvaṇaṃ taṃ yaśasvinī rākṣasaṃ pṛṣṭhataḥ kṛtvā bhūyo vacanam abravīt"}, {"critical": "5.19.6", "text": "nāham aupayikī bhāryā parabhāryā satī tava sādhu dharmam avekṣasva sādhu sādhuvrataṃ cara"}, {"critical": "5.19.7", "text": "yathā tava tathānyeṣāṃ rakṣyā dārā niśācara ātmānam upamāṃ kṛtvā sveṣu dāreṣu ramyatām"}, {"critical": "5.20.35", "text": "pratilomānulomaiś ca sāmadānādibhedanaiḥ āvartayata vaidehīṃ daṇḍasyodyamanena ca"}, {"critical": "5.20.36", "text": "iti pratisamādiśya rākṣasendraḥ punaḥ punaḥ kāmamanyuparītātmā jānakīṃ paryatarjayat"}, {"critical": "5.20.37", "text": "upagamya tataḥ kṣipraṃ rākṣasī dhānyamālinī pariṣvajya daśagrīvam idaṃ vacanam abravīt"}, {"critical": "5.21.9", "text": "tato harijaṭā nāma rākṣasī vākyam abravīt vivṛtya nayane kopān mārjārasadṛśekṣaṇā"}, {"critical": "5.21.10", "text": "yena devās trayastriṃśad devarājaś ca nirjitaḥ tasya tvaṃ rākṣasendrasya bhāryā bhavitum arhasi"}, {"critical": "5.22.25", "text": "ānītāsi samudrasya pāram anyair durāsadam rāvaṇāntaḥpuraṃ ghoraṃ praviṣṭā cāsi maithili"}, {"critical": "5.22.26", "text": "rāvaṇasya gṛhe rudhā asmābhis tu surakṣitā na tvāṃ śaktaḥ paritrātum api sākṣāt puraṃdaraḥ"}, {"critical": "5.22.27", "text": "kuruṣva hitavādinyā vacanaṃ mama maithili alam aśruprapātena tyaja śokam anarthakam"}, {"critical": "5.22.28", "text": "bhaja prītiṃ praharṣaṃ ca tyajaitāṃ nityadainyatām sīte rākṣasarājena saha krīḍa yathāsukham"}, {"critical": "5.22.29", "text": "jānāsi hi yathā bhīru strīṇāṃ yauvanam adhruvam yāvan na te vyatikrāmet tāvat sukham avāpnuhi"}, {"critical": "5.22.30", "text": "udyānāni ca ramyāṇi parvatopavanāni ca saha rākṣasarājena cara tvaṃ madirekṣaṇe"}, {"critical": "5.22.31", "text": "strīsahasrāṇi te sapta vaśe sthāsyanti sundari rāvaṇaṃ bhaja bhartāraṃ bhartāraṃ sarvarakṣasām"}, {"critical": "5.22.32", "text": "utpāṭya vā te hṛdayaṃ bhakṣayiṣyāmi maithili yadi me vyāhṛtaṃ vākyaṃ na yathāvat kariṣyasi"}, {"critical": "5.22.33", "text": "tataś caṇḍodarī nāma rākṣasī krūradarśanā bhrāmayantī mahac chūlam idaṃ vacanam abravīt"}, {"critical": "5.22.34", "text": "imāṃ hariṇalokākṣīṃ trāsotkampapayodharām rāvaṇena hṛtāṃ dṛṣṭvā daurhṛdo me mahān abhūt"}, {"critical": "5.22.35", "text": "yakṛtplīham athotpīḍaṃ hṛdayaṃ ca sabandhanam antrāṇy api tathā śīrṣaṃ khādeyam iti me matiḥ"}, {"critical": "5.22.36", "text": "tatas tu praghasā nāma rākṣasī vākyam abravīt kaṇṭham asyā nṛśaṃsāyāḥ pīḍayāmaḥ kim āsyate"}, {"critical": "5.22.37", "text": "nivedyatāṃ tato rājñe mānuṣī sā mṛteti ha nātra kaś cana saṃdehaḥ khādateti sa vakṣyati"}, {"critical": "5.22.38", "text": "tatas tv ajāmukhī nāma rākṣasī vākyam abravīt viśasyemāṃ tataḥ sarvān samān kuruta pīlukān"}, {"critical": "5.22.39", "text": "vibhajāma tataḥ sarvā vivādo me na rocate peyam ānīyatāṃ kṣipraṃ mālyaṃ ca vividhaṃ bahu"}, {"critical": "5.22.40", "text": "tataḥ śūrpaṇakhā nāma rākṣasī vākyam abravīt ajāmukhā yad uktaṃ hi tad eva mama rocate"}, {"critical": "5.22.41", "text": "surā cānīyatāṃ kṣipraṃ sarvaśokavināśinī mānuṣaṃ māṃsam āsādya nṛtyāmo 'tha nikumbhilām"}, {"critical": "5.24.7", "text": "kā ca me jīvite śraddhā sukhe vā taṃ priyaṃ vinā bhartāraṃ sāgarāntāyā vasudhāyāḥ priyaṃ vadam"}, {"critical": "5.24.8", "text": "bhidyatāṃ bhakṣyatāṃ vāpi śarīraṃ visṛjāmy aham na cāpy ahaṃ ciraṃ duḥkhaṃ saheyaṃ priyavarjitā"}, {"critical": "5.24.24", "text": "na hi tābhyāṃ ripur dṛṣṭo muhūtam api jīvati citā dhūmākulapathā gṛdhramaṇḍalasaṃkulā"}, {"critical": "5.24.33", "text": "akāryaṃ ye na jānanti nairṛtāḥ pāpakāriṇaḥ adharmāt tu mahotpāto bhaviṣyati hi sāmpratam"}, {"critical": "5.24.34", "text": "naite dharmaṃ vijānanti rākṣasāḥ piśitāśanāḥ dhruvaṃ māṃ prātarāśārthe rākṣasaḥ kalpayiṣyati"}, {"critical": "5.24.35", "text": "sāhaṃ kathaṃ kariṣyāmi taṃ vinā priyadarśanam rāmaṃ raktāntanayanam apaśyantī suduḥkhitā"}, {"critical": "5.25.9", "text": "tāsāṃ śrutvā tu vacanaṃ rākṣasīnāṃ mukhodgatam uvāca vacanaṃ kāle trijaṭāsvapnasaṃśritam"}, {"critical": "5.25.10", "text": "gajadantamayīṃ divyāṃ śibikām antarikṣagām yuktāṃ vājisahasreṇa svayam āsthāya rāghavaḥ"}, {"critical": "5.25.12", "text": "rāghavaś ca mayā dṛṣṭaś caturdantaṃ mahāgajam ārūḍhaḥ śailasaṃkāśaṃ cacāra sahalakṣmaṇaḥ"}, {"critical": "5.25.13", "text": "tatas tau naraśārdūlau dīpyamānau svatejasā śuklamālyāmbaradharau jānakīṃ paryupasthitau"}, {"critical": "5.25.14", "text": "tatas tasya nagasyāgre ākāśasthasya dantinaḥ bhartrā parigṛhītasya jānakī skandham āśritā"}, {"critical": "5.25.15", "text": "bhartur aṅkāt samutpatya tataḥ kamalalocanā candrasūryau mayā dṛṣṭā pāṇibhyāṃ parimārjatī"}, {"critical": "5.25.17", "text": "pāṇḍurarṣabhayuktena rathenāṣṭayujā svayam śuklamālyāmbaradharo lakṣmaṇena samāgataḥ"}, {"critical": "5.25.18", "text": "vimānāt puṣpakād adya rāvaṇaḥ patito bhuvi kṛṣyapāṇaḥ striyā dṛṣṭo muṇḍaḥ kṛṣṇāmbaraḥ punaḥ"}, {"critical": "5.25.19", "text": "rathena kharayuktena raktamālyānulepanaḥ prayāto dakṣiṇām āśāṃ praviṣṭaḥ kardamaṃ hradam"}, {"critical": "5.25.20", "text": "kaṇṭhe baddhvā daśagrīvaṃ pramadā raktavāsinī kālī kardamaliptāṅgī diśaṃ yāmyāṃ prakarṣati"}, {"critical": "5.25.21", "text": "varāheṇa daśagrīvaḥ śiṃśumāreṇa cendrajit uṣṭreṇa kumbhakarṇaś ca prayāto dakṣiṇāṃ diśam"}, {"critical": "5.29.9", "text": "yathārūpāṃ yathāvarṇāṃ yathālakṣmīṃ viniścitām aśrauṣaṃ rāghavasyāhaṃ seyam āsāditā mayā"}, {"critical": "5.29.10", "text": "virarāmaivam uktvāsau vācaṃ vānarapuṃgavaḥ jānakī cāpi tac chrutvā vismayaṃ paramaṃ gatā"}, {"critical": "5.32.30", "text": "apakṛṣyāśramapadān mṛgarūpeṇa rāghavam śūnye yenāpanītāsi tasya drakṣyasi yat phalam"}, {"critical": "5.32.31", "text": "nacirād rāvaṇaṃ saṃkhye yo vadhiṣyati vīryavān roṣapramuktair iṣubhir jvaladbhir iva pāvakaiḥ"}, {"critical": "5.32.32", "text": "tenāhaṃ preṣito dūtas tvatsakāśam ihāgataḥ tvadviyogena duḥkhārtaḥ sa tvāṃ kauśalam abravīt"}, {"critical": "5.32.33", "text": "lakṣmaṇaś ca mahātejāḥ sumitrānandavardhanaḥ abhivādya mahābāhuḥ so 'pi kauśalam abravīt"}, {"critical": "5.32.35", "text": "nityaṃ smarati rāmas tvāṃ sasugrīvaḥ salakṣmaṇaḥ diṣṭyā jīvasi vaidehi rākṣasī vaśam āgatā"}, {"critical": "5.32.36", "text": "nacirād drakṣyase rāmaṃ lakṣmaṇaṃ ca mahāratham madhye vānarakoṭīnāṃ sugrīvaṃ cāmitaujasaṃ"}, {"critical": "5.32.37", "text": "ahaṃ sugrīvasacivo hanūmān nāma vānaraḥ praviṣṭo nagarīṃ laṅkāṃ laṅghayitvā mahodadhim"}, {"critical": "5.32.38", "text": "kṛtvā mūrdhni padanyāsaṃ rāvaṇasya durātmanaḥ tvāṃ draṣṭum upayāto 'haṃ samāśritya parākramam"}, {"critical": "5.33.18", "text": "catuṣkalaś caturlekhaś catuṣkiṣkuś catuḥsamaḥ caturdaśasamadvandvaś caturdaṣṭaś caturgatiḥ"}, {"critical": "5.33.19", "text": "mahauṣṭhahanunāsaś ca pañcasnigdho 'ṣṭavaṃśavān daśapadmo daśabṛhat tribhir vyāpto dviśuklavān"}, {"critical": "5.33.22", "text": "tvām eva mārgamāṇo tau vicarantau vasuṃdharām dadarśatur mṛgapatiṃ pūrvajenāvaropitam"}, {"critical": "5.33.23", "text": "ṛśyamūkasya pṛṣṭhe tu bahupādapasaṃkule bhrātur bhāryārtam āsīnaṃ sugrīvaṃ priyadarśanam"}, {"critical": "5.33.24", "text": "vayaṃ tu harirājaṃ taṃ sugrīvaṃ satyasaṃgaram paricaryāmahe rājyāt pūrvajenāvaropitam"}, {"critical": "5.33.25", "text": "tatas tau cīravasanau dhanuḥpravarapāṇinau ṛśyamūkasya śailasya ramyaṃ deśam upāgatau"}, {"critical": "5.33.26", "text": "sa tau dṛṣṭvā naravyāghrau dhanvinau vānararṣabhaḥ abhipluto gires tasya śikharaṃ bhayamohitaḥ"}, {"critical": "5.33.27", "text": "tataḥ sa śikhare tasmin vānarendro vyavasthitaḥ tayoḥ samīpaṃ mām eva preṣayām āsa satvaraḥ"}, {"critical": "5.33.28", "text": "tāv ahaṃ puruṣavyāghrau sugrīvavacanāt prabhū rūpalakṣaṇasaṃpannau kṛtāñjalir upasthitaḥ"}, {"critical": "5.33.29", "text": "tau parijñātatattvārthau mayā prītisamanvitau pṛṣṭham āropya taṃ deśaṃ prāpitau puruṣarṣabhau"}, {"critical": "5.33.30", "text": "niveditau ca tattvena sugrīvāya mahātmane tayor anyonyasaṃbhāṣād bhṛśaṃ prītir ajāyata"}, {"critical": "5.33.31", "text": "tatra tau kīrtisaṃpannau harīśvaranareśvarau parasparakṛtāśvāsau kathayā pūrvavṛttayā"}, {"critical": "5.33.32", "text": "taṃ tataḥ sāntvayām āsa sugrīvaṃ lakṣmaṇāgrajaḥ strīhetor vālinā bhrātrā nirastam uru tejasā"}, {"critical": "5.33.33", "text": "tatas tvan nāśajaṃ śokaṃ rāmasyākliṣṭakarmaṇaḥ lakṣmaṇo vānarendrāya sugrīvāya nyavedayat"}, {"critical": "5.33.34", "text": "sa śrutvā vānarendras tu lakṣmaṇeneritaṃ vacaḥ tadāsīn niṣprabho 'tyarthaṃ grahagrasta ivāṃśumān"}, {"critical": "5.33.35", "text": "tatas tvadgātraśobhīni rakṣasā hriyamāṇayā yāny ābharaṇajālāni pātitāni mahītale"}, {"critical": "5.33.37", "text": "tāni rāmāya dattāni mayaivopahṛtāni ca svanavanty avakīrṇanti tasmin vihatacetasi"}, {"critical": "5.33.38", "text": "tāny aṅke darśanīyāni kṛtvā bahuvidhaṃ tataḥ tena devaprakāśena devena paridevitam"}, {"critical": "5.33.57", "text": "teṣāṃ naḥ svāmisaṃdeśān nirāśānāṃ mumūrṣatām kāryahetor ivāyātaḥ śakunir vīryavān mahān"}, {"critical": "5.33.58", "text": "gṛdhrarājasya sodaryaḥ saṃpātir nāma gṛdhrarāṭ śrutvā bhrātṛvadhaṃ kopād idaṃ vacanam abravīt"}, {"critical": "5.33.59", "text": "yavīyān kena me bhrātā hataḥ kva ca vināśitaḥ etad ākhyātum icchāmi bhavadbhir vānarottamāḥ"}, {"critical": "5.33.60", "text": "aṅgado 'kathayat tasya janasthāne mahad vadham rakṣasā bhīmarūpeṇa tvām uddiśya yathātatham"}, {"critical": "5.33.61", "text": "jaṭāyos tu vadhaṃ śrutvā duḥkhitaḥ so 'ruṇātmajaḥ tvām āha sa varārohe vasantīṃ rāvaṇālaye"}, {"critical": "5.33.62", "text": "tasya tadvacanaṃ śrutvā saṃpāteḥ prītivardhanam aṅgadapramukhāḥ sarve tataḥ saṃprasthitā vayam"}, {"critical": "5.33.63", "text": "athāhaṃ harisainyasya sāgaraṃ dṛśya sīdataḥ vyavadhūya bhayaṃ tīvraṃ yojanānāṃ śataṃ plutaḥ"}, {"critical": "5.33.64", "text": "laṅkā cāpi mayā rātrau praviṣṭā rākṣasākulā rāvaṇaś ca mayā dṛṣṭas tvaṃ ca śokanipīḍitā"}, {"critical": "5.33.65", "text": "etat te sarvam ākhyātaṃ yathāvṛttam anindite abhibhāṣasva māṃ devi dūto dāśarather aham"}, {"critical": "5.33.66", "text": "tvaṃ māṃ rāmakṛtodyogaṃ tvannimittam ihāgatam sugrīva sacivaṃ devi budhyasva pavanātmajam"}, {"critical": "5.33.67", "text": "kuśalī tava kākutsthaḥ sarvaśastrabhṛtāṃ varaḥ guror ārādhane yukto lakṣmaṇaś ca sulakṣaṇaḥ"}, {"critical": "5.33.68", "text": "tasya vīryavato devi bhartus tava hite rataḥ aham ekas tu saṃprāptaḥ sugrīvavacanād iha"}, {"critical": "5.33.69", "text": "mayeyam asahāyena caratā kāmarūpiṇā dakṣiṇā dig anukrāntā tvanmārgavicayaiṣiṇā"}, {"critical": "5.33.70", "text": "diṣṭyāhaṃ harisainyānāṃ tvannāśam anuśocatām apaneṣyāmi saṃtāpaṃ tavābhigamaśaṃsanāt"}, {"critical": "5.33.71", "text": "diṣṭyā hi na mama vyarthaṃ devi sāgaralaṅghanam prāpsyāmy aham idaṃ diṣṭyā tvaddarśanakṛtaṃ yaśaḥ"}, {"critical": "5.33.72", "text": "rāghavaś ca mahāvīryaḥ kṣipraṃ tvām abhipatsyate samitrabāndhavaṃ hatvā rāvaṇaṃ rākṣasādhipam"}, {"critical": "5.33.73", "text": "kaurajo nāma vaidehi girīṇām uttamo giriḥ tato gacchati gokarṇaṃ parvataṃ kesarī hariḥ"}, {"critical": "5.34.33", "text": "camūṃ prakarṣan mahatīṃ haryṛṣkagaṇasaṃkulām viṣṭambhayitvā bāṇaughair akṣobhyaṃ varuṇālayam"}, {"critical": "5.36.15", "text": "paryāyeṇa prasuptaś ca mamāṅke bharatāgrajaḥ"}, {"critical": "5.36.22", "text": "āśīviṣa iva kruddhaḥ śvasān vākyam abhāṣathāḥ kena te nāganāsoru vikṣataṃ vai stanāntaram"}, {"critical": "5.36.27", "text": "cikṣepitha pradīptāṃ tām iṣīkāṃ vāyasaṃ prati anusṛṣṭas tadā kālo jagāma vividhāṃ gatim"}, {"critical": "5.36.34", "text": "sa kuruṣva mahotsāhaṃ kṛpāṃ mayi nararṣabha ānṛśaṃsyaṃ paro dharmas tvatta eva mayā śrutaḥ"}, {"critical": "5.36.35", "text": "jānāmi tvāṃ mahāvīryaṃ mahotsāhaṃ mahābalam apārapāram akṣobhyaṃ gāmbhīryāt sāgaropamam"}, {"critical": "5.36.42", "text": "kausalyā lokabhartāraṃ suṣuve yaṃ manasvinī taṃ mamārthe sukhaṃ pṛccha śirasā cābhivādaya"}, {"critical": "5.36.43", "text": "srajaś ca sarvaratnāni priyā yāś ca varāṅganāḥ aiśvaryaṃ ca viśālāyāṃ pṛthivyām api durlabham"}, {"critical": "5.36.44", "text": "pitaraṃ mātaraṃ caiva saṃmānyābhiprasādya ca anupravrajito rāmaṃ sumitrā yena suprajāḥ"}, {"critical": "5.37.5", "text": "sa tatheti pratijñāya mārutir bhīmavikramaḥ śirasāvandya vaidehīṃ gamanāyopacakrame"}, {"critical": "5.37.6", "text": "jñātvā saṃprasthitaṃ devī vānaraṃ mārutātmajam bāṣpagadgadayā vācā maithilī vākyam abravīt"}, {"critical": "5.37.7", "text": "kuśalaṃ hanuman brūyāḥ sahitau rāmalakṣmaṇau sugrīvaṃ ca sahāmātyaṃ vṛddhān sarvāṃś ca vānarān"}, {"critical": "5.38.19", "text": "sa taṃ maṇivaraṃ gṛhya śrīmān plavagasattamaḥ praṇamya śirasā devīṃ gamanāyopacakrame"}, {"critical": "5.38.20", "text": "tam utpātakṛtotsāham avekṣya haripuṃgavam vardhamānaṃ mahāvegam uvāca janakātmajā"}, {"critical": "5.40.33", "text": "sa pannagam ivādāya sphurantaṃ vinatāsutaḥ vicacārāmbare vīraḥ parigṛhya ca mārutiḥ"}, {"critical": "5.41.2", "text": "iti saṃcintya hanumān manasā darśayan balam caityaprāsādam āplutya meruśṛṅgam ivonnatam"}, {"critical": "5.41.12", "text": "āvarta iva gaṅgāyās toyasya vipulo mahān parikṣipya hariśreṣṭhaṃ sa babhau rakṣasāṃ gaṇaḥ"}, {"critical": "5.41.15", "text": "sa rākṣasaśataṃ hatvā vajreṇendra ivāsurān antarikṣasthitaḥ śrīmān idaṃ vacanam abravīt"}, {"critical": "5.41.16", "text": "mādṛśānāṃ sahasrāṇi visṛṣṭāni mahātmanām balināṃ vānarendrāṇāṃ sugrīvavaśavartinām"}, {"critical": "5.41.17", "text": "śataiḥ śatasahasraiś ca koṭībhir ayutair api āgamiṣyati sugrīvaḥ sarveṣāṃ vo niṣūdanaḥ"}, {"critical": "5.44.7", "text": "sanāgayakṣagandharvā devāsuramaharṣayaḥ yuṣmābhiḥ sahitaiḥ sarvair mayā saha vinirjitāḥ"}, {"critical": "5.44.8", "text": "tair avaśyaṃ vidhātavyaṃ vyalīkaṃ kiṃ cid eva naḥ tad eva nātra saṃdehaḥ prasahya parigṛhyatām"}, {"critical": "5.44.9", "text": "nāvamanyo bhavadbhiś ca hariḥ krūraparākramaḥ dṛṣṭā hi harayaḥ śīghrā mayā vipulavikramāḥ"}, {"critical": "5.44.10", "text": "vālī ca saha sugrīvo jāmbavāṃś ca mahābalaḥ nīlaḥ senāpatiś caiva ye cānye dvividādayaḥ"}, {"critical": "5.44.11", "text": "naiva teṣāṃ gatir bhīmā na tejo na parākramaḥ na matir na balotsāho na rūpaparikalpanam"}, {"critical": "5.44.12", "text": "mahat sattvam idaṃ jñeyaṃ kapirūpaṃ vyavasthitam prayatnaṃ mahad āsthāya kriyatām asya nigrahaḥ"}, {"critical": "5.44.13", "text": "kāmaṃ lokās trayaḥ sendrāḥ sasurāsuramānavāḥ bhavatām agrataḥ sthātuṃ na paryāptā raṇājire"}, {"critical": "5.44.14", "text": "tathāpi tu nayajñena jayam ākāṅkṣatā raṇe ātmā rakṣyaḥ prayatnena yuddhasiddhir hi cañcalā"}, {"critical": "5.44.15", "text": "te svāmivacanaṃ sarve pratigṛhya mahaujasaḥ samutpetur mahāvegā hutāśasamatejasaḥ"}, {"critical": "5.44.16", "text": "rathaiś ca mattair nāgaiś ca vājibhiś ca mahājavaiḥ śastraiś ca vividhais tīkṣṇaiḥ sarvaiś copacitā balaiḥ"}, {"critical": "5.44.17", "text": "tatas taṃ dadṛśur vīrā dīpyamānaṃ mahākapim raśmimantam ivodyantaṃ svatejoraśmimālinam"}, {"critical": "5.44.18", "text": "toraṇasthaṃ mahāvegaṃ mahāsattvaṃ mahābalam mahāmatiṃ mahotsāhaṃ mahākāyaṃ mahābalam"}, {"critical": "5.44.19", "text": "taṃ samīkṣyaiva te sarve dikṣu sarvāsv avasthitāḥ tais taiḥ praharaṇair bhīmair abhipetus tatas tataḥ"}, {"critical": "5.45.37", "text": "mahākapir bhūmitale nipīḍya taṃ; cakāra rakṣo'dhipater mahad bhayam"}, {"critical": "5.48.10", "text": "evam ukto harivaras tadā rakṣogaṇeśvaram abravīn nāsmi śakrasya yamasya varuṇasya vā"}, {"critical": "5.48.11", "text": "dhanadena na me sakhyaṃ viṣṇunā nāsmi coditaḥ jātir eva mama tv eṣā vānaro 'ham ihāgataḥ"}, {"critical": "5.48.12", "text": "darśane rākṣasendrasya durlabhe tad idaṃ mayā vanaṃ rākṣasarājasya darśanārthe vināśitam"}, {"critical": "5.48.13", "text": "tatas te rākṣasāḥ prāptā balino yuddhakāṅkṣiṇaḥ rakṣaṇārthaṃ ca dehasya pratiyuddhā mayā raṇe"}, {"critical": "5.48.14", "text": "astrapāśair na śakyo 'haṃ baddhuṃ devāsurair api pitāmahād eva varo mamāpy eṣo 'bhyupāgataḥ"}, {"critical": "5.48.15", "text": "rājānaṃ draṣṭukāmena mayāstram anuvartitam vimukto aham astreṇa rākṣasais tv atipīḍitaḥ"}, {"critical": "5.49.25", "text": "sugrīvo na hi devo 'yaṃ nāsuro na ca mānuṣaḥ na rākṣaso na gandharvo na yakṣo na ca pannagaḥ"}, {"critical": "5.51.9", "text": "lāṅgūlena pradīptena rākṣasāṃs tān apātayat roṣāmarṣaparītātmā bālasūryasamānanaḥ"}, {"critical": "5.51.14", "text": "kāmaṃ bandhaiś ca me bhūyaḥ pucchasyoddīpanena ca pīḍāṃ kurvantu rakṣāṃsi na me 'sti manasaḥ śramaḥ"}, {"critical": "5.51.15", "text": "tatas te saṃvṛtākāraṃ sattvavantaṃ mahākapim parigṛhya yayur hṛṣṭā rākṣasāḥ kapikuñjaram"}, {"critical": "5.51.16", "text": "śaṅkhabherīninādais tair ghoṣayantaḥ svakarmabhiḥ rākṣasāḥ krūrakarmāṇaś cārayanti sma tāṃ purīm"}, {"critical": "5.51.19", "text": "catvareṣu catuṣkeṣu rājamārge tathaiva ca ghoṣayanti kapiṃ sarve cārīka iti rākṣasāḥ"}, {"critical": "5.51.20", "text": "dīpyamāne tatas tasya lāṅgūlāgre hanūmataḥ rākṣasyas tā virūpākṣyaḥ śaṃsur devyās tad apriyam"}, {"critical": "5.51.21", "text": "yas tvayā kṛtasaṃvādaḥ sīte tāmramukhaḥ kapiḥ lāṅgūlena pradīptena sa eṣa pariṇīyate"}, {"critical": "5.51.22", "text": "śrutvā tad vacanaṃ krūram ātmāpaharaṇopamam vaidehī śokasaṃtaptā hutāśanam upāgamat"}, {"critical": "5.51.23", "text": "maṅgalābhimukhī tasya sā tadāsīn mahākapeḥ upatasthe viśālākṣī prayatā havyavāhanam"}, {"critical": "5.51.35", "text": "puradvāraṃ tataḥ śrīmāñ śailaśṛṅgam ivonnatam vibhaktarakṣaḥsaṃbādham āsasādānilātmajaḥ"}, {"critical": "5.51.36", "text": "sa bhūtvā śailasaṃkāśaḥ kṣaṇena punar ātmavān hrasvatāṃ paramāṃ prāpto bandhanāny avaśātayat"}, {"critical": "5.51.37", "text": "vimuktaś cābhavac chrīmān punaḥ parvatasaṃnibhaḥ vīkṣamāṇaś ca dadṛśe parighaṃ toraṇāśritam"}, {"critical": "5.52.10", "text": "tāni kāñcanajālāni muktāmaṇimayāni ca bhavanāny avaśīryanta ratnavanti mahānti ca"}, {"critical": "5.52.11", "text": "tāni bhagnavimānāni nipetur vasudhātale bhavanānīva siddhānām ambarāt puṇyasaṃkṣaye"}, {"critical": "5.52.12", "text": "vajravidrumavaidūryamuktārajatasaṃhitān vicitrān bhavanād dhātūn syandamānān dadarśa saḥ"}, {"critical": "5.52.13", "text": "nāgnis tṛpyati kāṣṭhānāṃ tṛṇānāṃ ca yathā tathā hanūmān rākṣasendrāṇāṃ vadhe kiṃ cin na tṛpyati"}, {"critical": "5.54.9", "text": "tataḥ sa kapiśārdūlaḥ svāmisaṃdarśanotsukaḥ āruroha giriśreṣṭham ariṣṭam arimardanaḥ"}, {"critical": "5.54.10", "text": "tuṅgapadmakajuṣṭābhir nīlābhir vanarājibhiḥ sālatālāśvakarṇaiś ca vaṃśaiś ca bahubhir vṛtam"}, {"critical": "5.54.11", "text": "latāvitānair vitataiḥ puṣpavadbhir alaṃkṛtam nānāmṛgagaṇākīrṇaṃ dhātuniṣyandabhūṣitam"}, {"critical": "5.54.12", "text": "bahuprasravaṇopetaṃ śilāsaṃcayasaṃkaṭam maharṣiyakṣagandharvakiṃnaroragasevitam"}, {"critical": "5.54.13", "text": "latāpādapasaṃbādhaṃ siṃhākulitakandaram vyāghrasaṃghasamākīrṇaṃ svādumūlaphaladrumam"}, {"critical": "5.54.14", "text": "tam ārurohātibalaḥ parvataṃ plavagottamaḥ rāmadarśanaśīghreṇa praharṣeṇābhicoditaḥ"}, {"critical": "5.54.15", "text": "tena pādatalākrāntā ramyeṣu girisānuṣu saghoṣāḥ samaśīryanta śilāś cūrṇīkṛtās tataḥ"}, {"critical": "5.54.16", "text": "sa tam āruhya śailendraṃ vyavardhata mahākapiḥ dakṣiṇād uttaraṃ pāraṃ prārthayaṃl lavaṇāmbhasaḥ"}, {"critical": "5.54.17", "text": "adhiruhya tato vīraḥ parvataṃ pavanātmajaḥ dadarśa sāgaraṃ bhīmaṃ mīnoraganiṣevitam"}, {"critical": "5.54.18", "text": "sa māruta ivākāśaṃ mārutasyātmasaṃbhavaḥ prapede hariśārdūlo dakṣiṇād uttarāṃ diśam"}, {"critical": "5.54.19", "text": "sa tadā pīḍitas tena kapinā parvatottamaḥ rarāsa saha tair bhūtaiḥ prāviśad vasudhātalam"}, {"critical": "5.55.1", "text": "sacandrakumudaṃ ramyaṃ sārkakāraṇḍavaṃ śubham tiṣyaśravaṇakadambam abhraśaivalaśādvalam"}, {"critical": "5.55.2", "text": "punarvasu mahāmīnaṃ lohitāṅgamahāgraham airāvatamahādvīpaṃ svātīhaṃsaviloḍitam"}, {"critical": "5.55.9", "text": "parvatendraṃ sunābhaṃ ca samupaspṛśya vīryavān jyāmukta iva nārāco mahāvego 'bhyupāgataḥ"}, {"critical": "5.55.10", "text": "sa kiṃ cid anusaṃprāptaḥ samālokya mahāgirim mahendrameghasaṃkāśaṃ nanāda haripuṃgavaḥ"}, {"critical": "5.55.28", "text": "tato dṛṣṭeti vacanaṃ mahārtham amṛtopamam niśamya māruteḥ sarve muditā vānarā bhavan"}, {"critical": "5.55.29", "text": "kṣveḍanty anye nadanty anye garjanty anye mahābalāḥ cakruḥ kila kilām anye pratigarjanti cāpare"}, {"critical": "5.55.30", "text": "ke cid ucchritalāṅgūlāḥ prahṛṣṭāḥ kapikuñjarāḥ añcitāyatadīrghāṇi lāṅgūlāni pravivyadhuḥ"}, {"critical": "5.55.31", "text": "apare tu hanūmantaṃ vānarā vāraṇopamam āplutya giriśṛṅgebhyaḥ saṃspṛśanti sma harṣitāḥ"}, {"critical": "5.55.32", "text": "uktavākyaṃ hanūmantam aṅgadas tu tadābravīt sarveṣāṃ harivīrāṇāṃ madhye vācam anuttamām"}, {"critical": "5.55.33", "text": "sattve vīrye na te kaś cit samo vānaravidyate yad avaplutya vistīrṇaṃ sāgaraṃ punar āgataḥ"}, {"critical": "5.55.36", "text": "śrotukāmāḥ samudrasya laṅghanaṃ vānarottamāḥ darśanaṃ cāpi laṅkāyāḥ sītāyā rāvaṇasya ca"}, {"critical": "5.56.2", "text": "taṃ tataḥ pratisaṃhṛṣṭaḥ prītimantaṃ mahākapim jāmbavān kāryavṛttāntam apṛcchad anilātmajam"}, {"critical": "5.56.3", "text": "kathaṃ dṛṣṭā tvayā devī kathaṃ vā tatra vartate tasyāṃ vā sa kathaṃ vṛttaḥ krūrakarmā daśānanaḥ"}, {"critical": "5.56.10", "text": "upasaṃgamya taṃ divyaṃ kāñcanaṃ nagasattamam kṛtā me manasā buddhir bhettavyo 'yaṃ mayeti ca"}, {"critical": "5.56.11", "text": "prahataṃ ca mayā tasya lāṅgūlena mahāgireḥ śikharaṃ sūryasaṃkāśaṃ vyaśīryata sahasradhā"}, {"critical": "5.56.12", "text": "vyavasāyaṃ ca me buddhvā sa hovāca mahāgiriḥ putreti madhurāṃ bāṇīṃ manaḥprahlādayann iva"}, {"critical": "5.56.13", "text": "pitṛvyaṃ c

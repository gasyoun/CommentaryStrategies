:root{--bg:#faf8f4;--card:#fff;--ink:#222;--mut:#777;--line:#e4ddd0;--acc:#7a5c2e;

*{box-sizing:border-box}

.verse{background:#f7f2e8;border-radius:6px;padding:8px 12px;margin:8px 0}

margin:8px 0;font:14px/1.5 system-ui,sans-serif}
.why b{color:var(--edit)}
.note{font-size:17px;margin:10px 0;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
details{margin:8px 0;font-size:14px}
summary{cursor:pointer;color:var(--acc);font:13px system-ui,sans-serif}
.comm{margin:6px 0;padding:6px 10px;background:#f6f6f2;border-radius:5px;font-size:13px;line-height:1.5}
.comm.cited{background:#eef6ee;border-left:3px solid var(--ok)}
.comm .who{font:11px system-ui,sans-serif;color:var(--mut);display:block;margin-bottom:2px}
.dev{font-family:"Nirmala UI","Noto Sans Devanagari",serif}
.p1{font-size:13px;color:#555;background:#fbf0f0;border-radius:5px;padding:6px 10px;margin:6px 0}

border-radius:6px;padding:8px 12px;margin:8px 0}

.controls{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
font:13px system-ui,sans-serif}
.controls label{display:inline-flex;gap:4px;align-items:center;padding:5px 10px;border:1px solid var(--line);
border-radius:20px;cursor:pointer}
.controls input[type=radio]{accent-color:var(--acc)}
textarea,.rr{width:100%;font:14px Georgia,serif;padding:8px;border:1px solid var(--line);border-radius:5px;margin-top:8px}
.hidden{display:none}

<script>
const D = {"generated": "2026-07-01", "stats": {"35": {"verses": 110, "with_commentary": 110, "phase1_notes": 22, "leonov_notes": 25, "proposed": 6}, "36": {"verses": 57, "with_commentary": 57, "phase1_notes": 13, "leonov_notes": 14, "proposed": 6}, "37": {"verses": 80, "with_commentary": 80, "phase1_notes": 16, "leonov_notes": 16, "proposed": 4}}, "notes": [{"verse_id": "5.35.3", "lemma_iast": "bhūyaḥ", "note_ru": "bhūyaḥ («ещё») — по Тилаке, adhikaṃ viśiṣya, «подробнее, во всех частностях»: Сита просит не просто повторить приметы Рамы и Лакшманы, но описать их точнее.", "source_commentary": ["tilaka"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Уточняет bhūyaḥ: не «ещё раз», а «подробнее» — меняет интонацию просьбы Ситы; подстрочник различия не даёт.", "sanskrit_iast": "yāni rāmasya cihnāni lakṣmaṇasya ca vānara । tāni bhūyaḥ samācakṣva na māṃ śokaḥ samāviśet ॥3॥", "leonov_ru": "Поведай мне еще о знаках (приметах) Рамы и Лакшманы, обезьяна, Чтобы не вошла в меня [снова] скорбь.", "commentary_at_verse": {"tilaka": "तां त्विति । आदित्य इवेत्यादिकाम् ।। 5.35.1,2 ।।\n\nतानि रामलक्ष्मणचिह्नानि । भूयो ऽधिकं विशिष्य समाचक्ष्व, येन मां शोको न समाविशेत्", "bhusana": ".\n\nयानि रामस्य लिङ्गानि लक्ष्मणस्य च वानर ।\n\nतानि भूयः समाचक्ष्व न मां शोकः समाविशेत्\nयानीति । लिङ्गानि चिह्नानि", "siromani": "यानीति । चिह्नानि भूयः समाचक्ष्व कथयतो मां शोको न समाविशेत्"}, "neighbours": [{"verse_id": "5.35.1", "leonov_ru": "Услышав же от буйвола среди обезьян этот рассказ о Раме, Вайдехи Сказала мирное слово сладостным голосом:", "commentary": {"bhusana": "तां तु रामकथां श्रुत्वा वैदेही वानरार्षभात् ।\n\nउवाच वचनं सान्त्वमिदं मधुरया गिरा", "siromani": "हनुमद्वचनश्रवणानन्तरकालिकां सीतोक्तिमाह तामिति । वैदेही वानरर्षभात् रामकथां श्रुत्वा सान्त्वं वचनमुवाच"}}, {"verse_id": "5.35.2", "leonov_ru": "«Где ты встретился с Рамой, как познакомился с Лакшманой? Как произошла встреча обезьян и людей?»", "commentary": {"bhusana": "क्व ते रामेण संसर्गः कथं जानासि लक्ष्मणम् ।\n\nवानराणां नराणां च कथमासीत् समागमः"}}, {"verse_id": "5.35.4", "leonov_ru": "Каков его облик? И какова его форма? Какие бедра, какие руки? И у Лакшманы [каков облик], поведай мне.", "commentary": {"bhusana": "कीदृशं तस्य संस्थानं रूपं रामस्य कीदृशम् ।\n\nकथमूरू कथं बाहू लक्ष्मणस्य च शंस मे\nकीदृशमिति । संस्थानम् अवयवसंनिवेशः । रूपम् आकारः वर्णः कान्तिर्वा\nत्वत्कृते तमनिद्रा च शोकश्चिन्ता च राघवम् ।\n\nतापयन्ति महात्मानमग्न्यागारमिवाग्नयः", "siromani": "चिह्नाकारं विभज्य पृच्छति कीदृशमिति । तस्य रामलक्ष्मणस्य च संस्थानमवयवसंनिवेशः रूपं च कीदृशम् ऊरुप्रभृति कथं कीदृशं मे मह्यं शंस कथय\nइषुवत्सविता गच्छतीतिवदुपमेयत्वेन बहुव्रीहिणोपमानत्वेन वा । रामं बोधयन्नाह तेजसेति"}}, {"verse_id": "5.35.5", "leonov_ru": "Хануман, сын Ветра, которому Вайдехи так сказала, Тогда стал рассказывать о Раме все как есть.", "commentary": {"tilaka": "द्वैमात्रः राममात्रापेक्षया द्वितीया माता द्विमाता । तस्या अपत्यमित्यर्थः । भिन्नोदरभ्रातेत्यर्थः । \"वैमात्रः\" इति पाठान्तरम् ।। 5.35.22,23 ।।\n\nअस्माभिः सुग्रीवमन्त्रिभिरित्यर्थः । उक्तमेव विस्तरेणाह-- त्वामेवेति", "bhusana": "एवमुक्तस्तु वैदेह्या हनुमान् मारुतात्मजः ।\n\nततो रामं यथात्त्वमाख्यातुमुपचक्रमे", "siromani": "एवमिति । वैदेह्या एवमुक्तो हनूमान् रामं यथातत्त्वं याथार्थ्यमनतिक्रम्य आख्यातुं कथयितुमपचक्रमे"}}], "phase1_here": [], "leonov_here": []}, {"verse_id": "5.35.11", "lemma_iast": "cāturvarṇyasya rakṣitā", "note_ru": "По Тилаке, стих скрыто (gūḍham) приписывает Раме брахмалакшану — качество творить, поддерживать и разрушать мир (sṛṣṭi-sthiti-saṃhāra-kartṛtva), т.е. читает бытовую характеристику «защитник четырёх варн» как указание на его божественную природу аватары.", "source_commentary": ["tilaka"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Вскрывает скрытый богословский подтекст (аватара) в бытовой формуле «защитник варн» — уровень смысла, невидимый в переводе.", "sanskrit_iast": "rāmo bhāmini lokasya cāturvarṇyasya rakṣitā । maryādānāṃ ca lokasya kartā kārayitā ca saḥ ॥11॥", "leonov_ru": "Рама, о прекрасная, защитник четырех варн. Он исполняет правила мира и заставляет других [выполнять их].", "commentary_at_verse": {"tilaka": "रामो भामिनि लोकस्येति । सर्वस्य कर्ता हर्ता भर्ता चेति शेषः । अनेन सृष्टिस्थितिसंहारकर्तृत्वरूपं ब्रह्मलक्षणं रामस्योक्तं गूढम् । एवं ज्ञानं तत्क्षणं भगवतैव स्वमायातिरस्करिणीनिरासादिति बोध्यम् । लोकस्य मर्यादानां वर्णाश्रममर्यादानां कर्ता, भगवदवतारत्वात् । कारयिता कालात्मना, अवतीर्णरूपेण चातुर्वर्ण्यरक्षिता च", "bhusana": "रामो भामिनि लोकस्य चातुर्वर्ण्यस्य रक्षिता ।\n\nमर्यादानां च लोकस्य कर्ता कारयिता च सः", "siromani": "सहिताविति । सहितौ एकीभूतौ उभौ रामसुग्रीवौ वालिनं हन्तुं तवान्वेषणं प्रति अन्वेषणं कर्तुं च समयं प्रतिज्ञाम् अकुरुताम्"}, "neighbours": [{"verse_id": "5.35.9", "leonov_ru": "Блеском он подобен солнцу, терпением равен земле, Мудростью равен Брихаспати, славою подобен Индре.", "commentary": {"bhusana": "तेजसा ऽ ऽदित्यसङ्काशः क्षमया पृथिवीसमः ।\n\nबृहस्पतिसमो बुद्ध्या यशसा वासवोपमः"}}, {"verse_id": "5.35.10", "leonov_ru": "Он защитник всего живого и своих людей (близких) защитник. Он защитник своей добродетели и дхармы, губитель врагов.", "commentary": {"bhusana": "रक्षिता जीवलोकस्य स्वरजनस्याभिरक्षिता ।\n\nरक्षिता स्वस्य वृत्तस्य धर्मस्य च परन्तपः", "siromani": "रक्षितेति । जीवन्ति जीवयन्तीति च व्युत्पत्त्या जीवशब्देन जीवेश्वरयोर्ग्रहणम् । लोका निखिलब्रह्माण्डानि समाहारद्वन्द्वः तस्य रक्षिता । श्रुतिश्च \"तमीश्वराणां परमं महेश्वरम्\" इत्यादि"}}, {"verse_id": "5.35.12", "leonov_ru": "Сияющий, глубоко почитаемый, твердо следует он обету воздержанности, Знает он, как помогать праведным, знает он, как совершать [свои] обязанности.", "commentary": {"bhusana": "तान्त्वित्यादि\nअर्चिष्मानर्चितो ऽत्यर्थं ब्रह्मचर्यव्रते स्थितः ।\n\nसाधूनामुपकारज्ञः प्रचारज्ञश्च कर्मणाम्\nब्रह्मचर्यव्रते स्थितः गृहस्थस्यास्य ब्रह्मचर्यं नाम ऋतोरन्यत्र स्त्रीसङ्गमत्यागः । तदाह मनुः \"षोडशर्तुनिशाः स्त्रीणां तस्मिन् युग्मासु संविशेत् । ब्रह्मचार्येव पर्वाद्याश्चतस्रश्च विवर्जयेत् ।।\"  प्रचारज्ञः प्रयोगज्ञः। ऐहि कामुष्मिकानां कर्मणां प्रचारं गतिं हेतुफलभावव्यवस्थां तत्त्वतो जानातीत्यर्थ इत्याप्याहुः", "siromani": "अर्चिष्मानिति । अर्चिष्मान् अतिप्रकाशवान् श्रुतिश्च \"तस्य भासा सर्वमिदं विभाति\" अत एव अत्यर्थमत्यन्तमर्चितः ईश्वरैरपि पूजितः ब्रह्मचर्यव्रते स्वकृतमर्यादाहेतुभूतवेदोक्तनियमे स्थितः उपकारज्ञः उपकारमेव जानाति न त्वपकारमित्यर्थः, सः कर्मणां प्रचारज्ञः यथावत्प्रवृत्तिज्ञाता"}}, {"verse_id": "5.35.13", "leonov_ru": "Сведущий в науке правления, почитатель брахманов, Мудрый (наделенный знанием), наделенный добродетелью и ученый (скромный), губитель недругов.", "commentary": {"tilaka": "ब्राह्मणानां वसिष्ठादीनाम्", "bhusana": "राजविद्याविनीतश्च ब्राह्मणानामुपासिता ।\n\nश्रुतवान् शीलसम्पन्नो विनीतश्च परन्तपः\nराजविद्याविनीतश्च । चतस्रो राजविद्याः \"आन्विक्षकी त्रयी वार्ता दण्डनीतिश्च शाश्वती । एता विद्याश्चतस्रस्तु लोकसंस्थितिहेतवः ।\" इत्युक्ताः, तासु विनीतः शिक्षितः । श्रुतवान् अवधृतवान् । शीसम्पन्नः सदाचारसम्पन्नः । पूर्वं यज्ञादिकर्मानुष्टानुष्ठातृत्वमुक्तमिति न पुनरुक्तिः", "siromani": "राजेति । ज्ञानवान् नित्यं निखिलानां विज्ञाता"}}], "phase1_here": [{"lemma": "cāturvarṇya", "note": "Чатурварнья (cātur-varṇya, n.) — «четырёхсословная система», производное от catur «четыре» + varṇa «сословие, цвет». MW: cāturvarṇya «the system of the four castes». Это не просто «все четыре варны» — термин обозначает систему как целое, структурно-нормативный порядок общества, за соблюдение которого отвечает царь. Рама назван rakṣitā cāturvarṇyasya — «охранителем четырёхсословия»: это описание идеального дхармического царя, чья главная обязанность — поддерживать варна-ашрама-дхарму. Подстрочник «всех четырёх сословий» передаёт содержание, но не функцию — слово несёт конституционально-юридическую нагрузку.", "type": "А"}, {"lemma": "maryādā", "note": "Марьяда (maryādā, f.) — «граница, предел, норма, установленный порядок». MW: maryādā «shore, bank; boundary; limit, end; propriety, rectitude». Этимология: maryā (родственно mar «умирать», граница смерти?) + dā (дающий?), или от marya «мужчина, молодой человек» + dā; точная этимология спорна. В социальном значении maryādā — это сакральные межи цивилизации: нормы поведения, нарушение которых разрушает dharmic order. Рама характеризуется как kartā maryādānāṃ — «творец/защитник maryādā». Это ключевое понятие для понимания конфликта: Равана нарушил maryādā, похитив Ситу.", "type": "А"}], "leonov_here": [{"editor": "kostina", "note": "[Е. Костина] «maryādānāṃ» Ср. Нужен будет комм. Про Раму и понятие «Марьяда» (ср. Марьяда-пурушоттама в бхакти)[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}]}, {"verse_id": "5.35.45", "lemma_iast": "agniparvataḥ", "note_ru": "«Огненная гора» (agniparvataḥ) в подстрочнике передана нейтрально как «вулкан», но Тилака, ссылаясь на Бхишмапарву Махабхараты, отождествляет её с горой Малъяват, на вершине которой вечно горит адский огонь по имени Самварта (saṃvartaka).", "source_commentary": ["tilaka"], "kazansky_type": "В", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Реалия: отождествляет «огненную гору» с горой Мальяват и мифом об огне Самварта (реалия + связь с Бхишмапарвой МБх).", "sanskrit_iast": "sa tavādarśanād ārye rāghavaḥ paritapyate । mahatā jvalatā nityam agninevāgniparvataḥ ॥45॥", "leonov_ru": "Из-за разлуки с тобой, благородная, страдает Рагхава. Словно великий вулкан – постоянно бушующем [в нем] пламенем.", "commentary_at_verse": {"siromani": "तवेति । तवादर्शनशोकेन महता भूमिकम्पेन महान् शिलोच्चय इव राघवः परिचाल्यते", "bhusana": "तवादर्शनशोकेन राघवः प्रविचाल्यते ।\n\nमहता  भूमिकम्पने महानिव शिलोच्चयः"}, "neighbours": [{"verse_id": "5.35.43", "leonov_ru": "И долго лежал, охваченный горем, тот великий духом. Я же различными речами с трудом побудил его подняться снова.", "commentary": {"siromani": "स इति । हे आर्ये राघवः तवादर्शनात् ज्वलता अग्निना अग्निपर्वतः कालाग्निनिवासभूतगिरिरिव नित्यं परितप्यते"}}, {"verse_id": "5.35.44", "leonov_ru": "Осмотрев те драгоценности, показывая [на них] снова и снова, Рагхава вместе с Сумитрой отдал [их] Сугриве.", "commentary": {"bhusana": "स तवादर्शनादार्ये राघवः परितप्यते ।\n\nमहता ज्वलता नित्यमग्निनेवाग्निपर्वतः"}}, {"verse_id": "5.35.47", "leonov_ru": "Скорбь, вызванная разлукой с тобой, сотрясает Рагхаву, Словно великое землетрясение – великую гору.", "commentary": {"siromani": "स इति । स राघवः रावणं हत्वा त्वां क्षिप्रं प्राप्स्यति"}}], "phase1_here": [], "leonov_here": []}, {"verse_id": "5.35.81", "lemma_iast": "mālyavān", "note_ru": "Малъяват (mālyavān) — по Тилаке и Бхушане, «лучшая из гор» (girīṇām uttamaḥ), с которой отец Ханумана Кесарин отправился на гору Гокарну; топоним связывает генеалогию Ханумана с той же горной цепью, что уже упомянута в примечании к agniparvataḥ (5.35.45).", "source_commentary": ["tilaka", "bhusana"], "kazansky_type": "В", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Топоним + генеалогия Ханумана; связывает с примечанием к 5.35.45 (та же горная цепь).", "sanskrit_iast": "saputrabāndhavaṃ hatvā rāvaṇaṃ rākṣasādhipam । mālyavān nāma vaidehi girīṇām uttamo giriḥ ॥81॥", "leonov_ru": "Убив владыку ракшасов Равану с его сыновьями и присными. Вайдехи, [есть] величайшая из гор, что зовется Мальяват,", "commentary_at_verse": {"bhusana": "माल्यवान्नाम वैदेहि गिरीणामुत्तमो गिरिः ।\n\nततो गच्छति गोकर्णं पर्वतं केसरी हरिः\nबुद्ध्यस्व पवनात्मजम्' इति पवनात्मजत्वमुक्तम्, तत्कथं वानरस्येत्यपेक्षायामाह माल्यवानिति । गच्छति अगच्छत्"}, "neighbours": [{"verse_id": "5.35.79", "leonov_ru": "Страданию положу я конец вестью о встрече с тобой. К счастью, не напрасно я переправился сюда через океан.", "commentary": {"tilaka": "अधिगमो दर्शनम् ।। 5.35.77,78 ।।\n\nतिर्यग्देहस्य तव कथं पवनात्मजत्वमिति शङ्कामपनयन्नाह-- माल्यवान्नमिति", "siromani": "ननु वानरस्य तव वातात्मजत्वं कथमित्यत आह माल्यवानिति । केसरी हरिर्वानरः माल्यवान्नाम यो गिरिः ततस्तस्माद्गिरेः गोकर्णं पर्वतं गच्छति अगच्छत्"}}, {"verse_id": "5.35.80", "leonov_ru": "Тем, что я нашел тебя, обрету я славу, царевна. И Рагхава могучий скоро придет к тебе,", "commentary": {"bhusana": "राघवश्च महावीर्यः क्षिप्रं त्वामभिपत्स्यते ।\n\nसमित्रबान्धवं हत्वा रावणं राक्षसाधिपम्", "siromani": "स इति । देवर्षिभिर्दिष्टः आज्ञप्तः यस्य हरिणो अनेकवानराधिपतेः क्षेत्रे वातेनाहं जातः स महाकपिर्मम पिता नदीपतेः समुद्रस्य तीर्थे जले शम्बसादनं तदभिधासुरमुद्धरन् अनाशयत् । भूतो ऽपि लटः शतार्ष इति भट्टाः । हरि इत्यत्र व्रीह्यादित्वादिनिः । सार्धश्लोक एकान्वयी\nराघव इति । राघवः रावणं हत्वा त्वामभिपत्स्यते"}}, {"verse_id": "5.35.82", "leonov_ru": "Оттуда пошел к горе Гокарне обезьяна Кесарин (отец Ханумана), И по наставлению божественных риши он, отец мой, великая обезьяна, В тиртхе владыки рек (океана) чистой убил [асуру] Шамбасадану.", "commentary": {"tilaka": "गोकर्णं तदाख्यम् । दिष्टः शम्बसादनाख्यासुरवधायाज्ञप्तः । उद्धरन्नुद्धृतवान् अवधीदित्यर्थः । भूते ऽपि लटः शतार्षः", "bhusana": "स च देवर्षिभिर्दिष्टः पिता मम महाकपिः ।\n\nतार्थे नदीपतेः पुण्ये शम्बसादनमुद्धरत्\nसः गोकर्णं गतः । देवर्षिभिः तत्रत्यैः दिष्टः नियुक्तः । शम्बसादनं तीर्थोपद्रवकारिणमसुरं शम्बसादनाख्यम् । उद्धरत् उदहरत् । देवर्षिप्रार्थनया अवधीदित्यर्थः", "siromani": "अचिरादिति । अचिरात् शीघ्रं राघवस्त्वामितो नयिता नेता"}}, {"verse_id": "5.35.83", "leonov_ru": "У жены (досл. «в поле», см. комментарий Голдмана на стр. 445) той обезьяны я родился посредством Ветра, Майтхили. Хануман я, прославленный в мире своими деяниями.", "commentary": {"tilaka": "स्वेनैवोत्पत्तिकालप्रवृत्तेन कर्मणा पराक्रमेण", "siromani": "हनूमानिति । स्वेन कर्मणा हनूमानिति विख्यातः यो ऽहं तेन मया तव विश्वासार्थं भर्तुर्गुणाः उक्ताः", "bhusana": "तस्याहं हरिणः क्षेत्रे जातो वातेन मैथिलि ।\n\nहनुमानिति विख्यातो लोके स्वेनैव कर्मणा\nहरिणः हरेः केसरिणः क्षेत्रे पत्न्याम् अञ्जनायां जातः पितुर्देशान्तरगमनकाले जातः । अनेनान्यक्षेत्रे कथमनयेनोत्पादनमिति शङ्का पराकृता"}}], "phase1_here": [], "leonov_here": []}, {"verse_id": "5.35.82", "lemma_iast": "śambasādanam", "note_ru": "Шамбасадана (śambasādanam) — асура, чинивший препятствия паломникам у святого брода (tīrtha) на берегу океана; по Бхушане, Кесарин убил его по прямому повелению божественных риши (devarṣibhir diṣṭaḥ), а не по собственной инициативе.", "source_commentary": ["bhusana"], "kazansky_type": "В", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Идентифицирует малоизвестного асуру и мотив (по повелению риши) — реалия, отсутствующая в подстрочнике.", "sanskrit_iast": "tato gacchati gokarṇaṃ parvataṃ kesarī hariḥ । sa ca devarṣibhir diṣṭaḥ pitā mama mahākapiḥ । tīrthe nadīpateḥ puṇye śambasādanam uddharat ॥82॥", "leonov_ru": "Оттуда пошел к горе Гокарне обезьяна Кесарин (отец Ханумана), И по наставлению божественных риши он, отец мой, великая обезьяна, В тиртхе владыки рек (океана) чистой убил [асуру] Шамбасадану.", "commentary_at_verse": {"tilaka": "गोकर्णं तदाख्यम् । दिष्टः शम्बसादनाख्यासुरवधायाज्ञप्तः । उद्धरन्नुद्धृतवान् अवधीदित्यर्थः । भूते ऽपि लटः शतार्षः", "bhusana": "स च देवर्षिभिर्दिष्टः पिता मम महाकपिः ।\n\nतार्थे नदीपतेः पुण्ये शम्बसादनमुद्धरत्\nसः गोकर्णं गतः । देवर्षिभिः तत्रत्यैः दिष्टः नियुक्तः । शम्बसादनं तीर्थोपद्रवकारिणमसुरं शम्बसादनाख्यम् । उद्धरत् उदहरत् । देवर्षिप्रार्थनया अवधीदित्यर्थः", "siromani": "अचिरादिति । अचिरात् शीघ्रं राघवस्त्वामितो नयिता नेता"}, "neighbours": [{"verse_id": "5.35.80", "leonov_ru": "Тем, что я нашел тебя, обрету я славу, царевна. И Рагхава могучий скоро придет к тебе,", "commentary": {"bhusana": "राघवश्च महावीर्यः क्षिप्रं त्वामभिपत्स्यते ।\n\nसमित्रबान्धवं हत्वा रावणं राक्षसाधिपम्", "siromani": "स इति । देवर्षिभिर्दिष्टः आज्ञप्तः यस्य हरिणो अनेकवानराधिपतेः क्षेत्रे वातेनाहं जातः स महाकपिर्मम पिता नदीपतेः समुद्रस्य तीर्थे जले शम्बसादनं तदभिधासुरमुद्धरन् अनाशयत् । भूतो ऽपि लटः शतार्ष इति भट्टाः । हरि इत्यत्र व्रीह्यादित्वादिनिः । सार्धश्लोक एकान्वयी\nराघव इति । राघवः रावणं हत्वा त्वामभिपत्स्यते"}}, {"verse_id": "5.35.81", "leonov_ru": "Убив владыку ракшасов Равану с его сыновьями и присными. Вайдехи, [есть] величайшая из гор, что зовется Мальяват,", "commentary": {"bhusana": "माल्यवान्नाम वैदेहि गिरीणामुत्तमो गिरिः ।\n\nततो गच्छति गोकर्णं पर्वतं केसरी हरिः\nबुद्ध्यस्व पवनात्मजम्' इति पवनात्मजत्वमुक्तम्, तत्कथं वानरस्येत्यपेक्षायामाह माल्यवानिति । गच्छति अगच्छत्"}}, {"verse_id": "5.35.83", "leonov_ru": "У жены (досл. «в поле», см. комментарий Голдмана на стр. 445) той обезьяны я родился посредством Ветра, Майтхили. Хануман я, прославленный в мире своими деяниями.", "commentary": {"tilaka": "स्वेनैवोत्पत्तिकालप्रवृत्तेन कर्मणा पराक्रमेण", "siromani": "हनूमानिति । स्वेन कर्मणा हनूमानिति विख्यातः यो ऽहं तेन मया तव विश्वासार्थं भर्तुर्गुणाः उक्ताः", "bhusana": "तस्याहं हरिणः क्षेत्रे जातो वातेन मैथिलि ।\n\nहनुमानिति विख्यातो लोके स्वेनैव कर्मणा\nहरिणः हरेः केसरिणः क्षेत्रे पत्न्याम् अञ्जनायां जातः पितुर्देशान्तरगमनकाले जातः । अनेनान्यक्षेत्रे कथमनयेनोत्पादनमिति शङ्का पराकृता"}}, {"verse_id": "5.35.84", "leonov_ru": "Для того, чтобы ты доверилась [мне], Вайдехи, рассказал я о качествах [твоего] мужа. Вскоре тебя отсюда, царевна, Рагхава заберет, несомненно».", "commentary": {"tilaka": "भर्तुस्त्वद्भर्तू रामस्य नयिता नेता\nअन्यथा नेति मायाकपिर्नेत्यर्थः", "bhusana": "विश्वासार्थं तु वैदेहि भर्तुरुक्ता मया गुणाः ।\n\nअचिराद् राघवो देवि त्वामितो नयिता ऽनघे\nनयिता नेता"}}], "phase1_here": [], "leonov_here": [{"editor": null, "note": "Шамбасадана (śambasādana) – имя асуры. Риши велели Кесарину убить его, поскольку этот асура совершал постоянные нападения на тиртху."}]}, {"verse_id": "5.35.89", "lemma_iast": "svajanmānuvādaḥ", "note_ru": "По Тилаке, повторное упоминание Ханумана о своём рождении (уже рассказанном в ст. 82–83) служит доводом от противного: ни один ракшас, притворяющийся Хануманом, не смог бы сам назвать себя «сыном обезьяны» (kapiputraḥ) — эта деталь окончательно убеждает Ситу, что перед ней не мнимый (māyā) посланец.", "source_commentary": ["tilaka"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Объясняет, зачем Хануман повторяет рассказ о рождении — логика узнавания против мнимого посланца; снимает вопрос о «лишнем» повторе.", "sanskrit_iast": "etat te sarvamākhyātaṃ samāśvasihi maithili । kiṃ karomi kathaṃ vā te rocate pratiyāmyaham ॥89॥", "leonov_ru": "«Поверь, Майтхили всему тому, что рассказано [мной] тебе. Что мне сделать и как, чтобы тебе [это было] по душе? Возвращаюсь я».", "commentary_at_verse": {"tilaka": "सर्वमुत्तरं सर्वं प्रत्युत्तरमाख्यातमित्यन्वयः । अथ सीतायै चिकीर्षितं पृच्छति-- किं करोमीति । वर्तमानसामीप्ये लटौ । प्रतियामि प्रतियास्ये रामसमीपम्, किं करोमि किं करिष्ये, कथं वा रोचते चिकीर्षितमिति शेषः\nनहि रावण आत्मानं कथमपि कपिपुत्र इति ब्रूयादिति ज्ञापनपूर्वकं कपित्वनिश्चयाय पुनः स्वजन्मानुवादः-- हते ऽसुर इति । ततः शम्बसादनासुरवधप्रीतमहर्षेः प्रसादत इत्यर्थः । तत्प्रतिमः वायुसदृश इत्यर्थः", "bhusana": "एतत्ते सर्वमाख्यातं समाश्वसिहि मैथिलि ।\n\nकिं करोमि कथं वा ते रोचते प्रतियाम्यहम्"}, "neighbours": [{"verse_id": "5.35.87", "leonov_ru": "Прекрасное лицо той широкоглазой с красно-белыми глазами Засияло словно луна, освободившаяся от Раху.", "commentary": {"bhusana": "चारु तद्वदनं तस्यास्ताम्रशुक्लायतेक्षणम् ।\n\nअशोभत विशालाक्ष्या राहुमुक्त इवोडुराट्", "siromani": "तदाकारमाह एतदिति । हे मैथिलि एतत् भवत्या पृष्टं सर्वमाख्यातम् अतः समाश्वसिहि अहं तु प्रतियामि रामसमीपं गमिष्यामि अतः किं करोमि कथं ते रोचते तद्वदित्यर्थः"}}, {"verse_id": "5.35.88", "leonov_ru": "Подумала она, что Хануман – несомненно обезьяна, а не кто-либо иной. Тогда сказал затем Хануман той прекрасной обликом:", "commentary": {"siromani": "हनूमन्तमिति । सा सीता हनूमन्तम् अन्यथा रावणत्वादिना न मन्यते अमन्यत अथानन्तरं प्रियदर्शनां तां सीताम् उत्तरं श्रेष्ठमिदं वचनमुवाच", "bhusana": "हनुमन्तं कपिं व्यक्तं मन्यते नान्यथेति सा ।\n\nअथोवाच हनूमांस्तामुत्तरं प्रियदर्शनाम्"}}, {"verse_id": "5.35.90", "leonov_ru": "«После того, как убил в бою асуру Шамбасадану Герой среди обезьян, побуждаемый великими риши, Тогда я родился от Ветра, Майтхили – Обезьяна, равная ему по мощи».", "commentary": {"siromani": "उपसंहरन्नाह हते इति । कपिप्रवीरेण शम्बसादने असुरे हते सति ततः तस्य क्षेत्रे वायुप्रभवः प्रभावतः तत्प्रतिमः वायुसदृशः वानरो ऽहमस्मि", "bhusana": "हते ऽसुरे संयति शम्बसादने कपिप्रवीरेण महर्षिचोदनात् ।\n\nततो ऽस्मि वायुप्रभवो हि मैथिलि प्रभावतस्तत्प्रतिमश्च वानरः\nइत्यार्षे श्रीरामायणे वाल्मीकीये आदिकाव्ये श्रीमत्सुन्दरकाण्डे पञ्चत्रिंशः सर्गः ।। 5.35।।\n\nदेवीनियुक्तार्थकरणे स्वस्य शक्तिरस्तीति द्योतयितुं स्वमाहात्म्यमाह हत इति । ततः असुरवधोपकरात्"}}], "phase1_here": [], "leonov_here": []}, {"verse_id": "5.36.13", "lemma_iast": "kuśalī yadi kākutsthaḥ", "note_ru": "По Бхушане, здесь возможно и другое прочтение: не риторический довод, а ревнивый попрёк — Сита при после́ Ханумане с горечью упрекает Раму («если он и вправду благополучен, почему не сжёг гневом землю ради меня?»), и лишь после этого укора обращается к прямой мольбе.", "source_commentary": ["bhusana"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Предлагает альтернативное прочтение (ревнивый упрёк vs риторический довод) — расхождение интерпретаций, важное для тона сцены.", "sanskrit_iast": "kuśalī yadi kākutsthaḥ kiṃ na sāgaramekhalām । mahīṃ dahati kopena yugāntāgnir ivotthitaḥ ॥13॥", "leonov_ru": "Если благополучен Какутстха, что же опоясанную океаном Землю не сжигает он в гневе, словно огонь, вспыхивающий в конце юги?", "commentary_at_verse": {"tilaka": "हीमत्यङ्गुलीयसांनिध्ये भर्तृसांनिध्यादिव किञ्चिल्लज्जावती । प्रियं कृत्वा ऽ ऽदरं कृत्वा\nननु केवलं महीमेवेति किमुच्यत इत्याशयेन पक्षान्तरम्-- अथवेति । तथा शक्तिमन्तौ यदि तर्हि किमिति तूष्णीं तिष्ठतस्तत्राह-- ममैवेति । दुःखानां दुःखहेतुपापानां विपर्ययो नाशो नाद्यापि संवृत्त इत्यर्थः", "bhusana": "कुशली यदि काकुत्स्थः किन्नु सागरमेखलाम् ।\n\nमहीं दहति कोपेन युगान्ताग्निरिवोत्थितः\nअथ प्रणयरोषेण दूतसन्निधौ रामं गर्हते  कुशलीति । काकुत्स्थः परपरिभावसहकुले जातः । अनेन परपरिभाव एव परिहरणीयः न स्वीय इति नियमो ऽस्ति किम् । किंनु सागरमेखलां महीं दहति । अत्र काकुत्स्थः दहति किंनु न दहतीत्यर्थः । सागरमेखलामिति विशेषणेन द्रवद्रव्यस्यैकेन कठिनद्रव्यस्य चैकेन बाणेन भवितव्यं किम् । सागरं सलिलमेवं तैलं कृत्वा महीं दग्धुं समर्थो न किमित्यर्थः । यद्वा स्वपत्नीं वा सुरक्षितपरिधानां करोतीति भावः । अनादिकृतभार्यादा मही कथं दग्धुं शक्येत्यत्राह  युगान्तेति । महीमर्यादा तन्नयनरागपर्यन्तैवेति भावः । किं न सागरमेखलामित्यपि पाठः । काकुत्स्थः कुशली यदि तदा किं न दहति । शक्तश्चेद्दहत्येव, न दहति अतो न शक्त इत्यर्थः", "siromani": "कुशलीति । यदि काकुत्स्थः कुशली तर्हि कोपेन ज्ञातपृथिव्यपारधजनितक्रोधेन महीं किं नु न दहति दहत्येवेत्यर्थः । एतेन एवं शक्तिसत्त्वे रावणं कुतो न निहन्तीति सूचितम् । किं च कोपेन रावणापराधज्ञानजनितक्रोधेन महीं लङ्काभूमिं किं नु दहति"}, "neighbours": [{"verse_id": "5.36.11", "leonov_ru": "Ибо не пошлет непобедимый Рама [кого-либо] непроверенного, Не узнав, [что он] доблестен, особенно [не пошлет] ко мне.", "commentary": {"bhusana": "प्रेषयिष्यति दुर्धषो रामो न ह्यपरीक्षितम् ।\n\nपराक्रममविज्ञाय मत्सकाशं विशेषतः", "siromani": "प्रेषयिष्यतीति । दुर्धर्षो रामः विशेषतः विशेषं पराक्रममविज्ञाय अपरीक्षितं परीक्षारहितं दूतं मत्सकाशं न प्रेषयिष्यति"}}, {"verse_id": "5.36.12", "leonov_ru": "К счастью благополучен Рама благочестивый, верный своему слову, И Лакшмана сиятельный, увеличивающий радость Сумитры.", "commentary": {"bhusana": "दिष्ट्या च कुशली रामो धर्मात्मा सत्यसङ्गरः ।\n\nलक्ष्मणश्च महातेजाः सुमित्रानन्दवर्धनः", "siromani": "दिष्ट्येति । कुशली कुशलविशिष्टः"}}, {"verse_id": "5.36.14", "leonov_ru": "Эти двое могут подчинить даже богов, Моим же страданиям, думаю (вижу), нет изменения.", "commentary": {"tilaka": "अथ दृढतरविश्वासाय रामाङ्गुलीयकं दातुमाह-- भूय इति । प्रत्ययो विश्वासः\nमम दुःखक्षय ईषत्करः, अपि तु तस्य सुखावस्थानमेव मृग्यमित्याशयेनाह-- कच्चिदिति । उत्तराणि कार्याणि मद्विमोचनफलानि", "bhusana": "अथवा शक्तिमन्तौ तौ सुराणामपि निग्रहे ।\n\nममैव तु न दुःखानामस्ति मन्ये विपर्ययः\nपक्षान्तरमाह अथवेति", "siromani": "तत्र हेतुमुपलभ्य पक्षान्तरमाह अथवेति । सुराणामपि निग्रहे शक्तिमन्तौ तौ रामलक्ष्मणौ स्त एव तथापि मम दुःखानां विपर्ययो विनाशकालो नैवास्तीत्यहं मन्ये"}}, {"verse_id": "5.36.15", "leonov_ru": "Не дрожит Рама, не страдает, Высшие (необходимые) действия предпринимает лучший из людей?", "commentary": {"bhusana": "कच्चिन्न व्यथितो रामः कच्चिन्न परितप्यते ।\n\nउत्तराणि च कार्याणि कुरुते पुरुषोत्तमः\nकच्चिदिति । न व्यथितः न कृशः । उत्तराणि कार्याणि मत्प्राप्तिसाधकानि कच्चित्कुरुते?"}}], "phase1_here": [{"lemma": "yugānta", "note": "Образ Рамы, готового сжечь землю «словно огонь конца юги» (yugāntāgnir iva), и родственные сравнения (V.47.8 yugāntakālāgnim iva prajākṣaye; V.37.67 yugāntasūryapratima) опираются на космохронологию Ману. Manu 1.68–73 разворачивает счёт «дней и ночей Брахмы», в конце которых наступает растворение мира (pralaya): yugapat tu pralīyante … (Manu 1.54). Эпическая формула yugānta- получает у Ману развёрнутый референт — разрушение, завершающее тысячу веков богов. Кавья-переработка шастрического представления о кальпе.", "type": "Б"}, {"lemma": "yugāntāgni", "note": "Югантагни (yuga-anta-agni, m.) — «огонь конца мировой эпохи», тат-пуруша: yuga «мировая эпоха» + anta «конец» + agni «огонь». MW: yugānta «the end of an age». Сита спрашивает: если Рама в добром здравии, почему он не сжигает море своим гневом, «поднявшись, как yugāntāgni»? Это ключевой образ индийской космологии: в конце каждой кальпы вселенская пралайя сжигает всё сущее огнём. Сита использует этот образ как мерило Рамовой силы — его сдержанность в данной ситуации должна быть объяснена, ибо сила его, по праву, равна вселенской.", "type": "А"}], "leonov_here": []}, {"verse_id": "5.36.17", "lemma_iast": "dvividhaṃ trividhopāyam", "note_ru": "По Тилаке и Широмани, речь о традиционной доктрине четырёх средств политики (upāya) — увещевание (sāma), подкуп (dāna), раскол (bheda) и насилие (daṇḍa): к друзьям применимы первые два («двойное» средство), к врагам — все три или, по другому счёту, оставшиеся («тройное»).", "source_commentary": ["tilaka", "siromani"], "kazansky_type": "В", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Разъясняет шастрическую доктрину четырёх upāya за «двойным/тройным средством» — доктринальная реалия.", "sanskrit_iast": "dvividhaṃ trividhopāyam upāyam api sevate । vijigīṣuḥ suhṛt kaccin mitreṣu ca paraṃtapaḥ ॥17॥", "leonov_ru": "Двойное, тройное, а также [одинарное] средство использует он, Желающий победы, добросердечный к друзьям, губитель врагов?", "commentary_at_verse": {"tilaka": "द्विविधं सौम्यासौम्यरूपप्रकारद्वयवत् । त्रिविधोपायं धर्मार्थकामलक्षणत्रिविधपुरुषार्थानां प्राप्त्युपायभूतमुपायं सामाद्युपायमपि सेवते कच्चित् तथा मित्रेषु च विजिगीषुसुहृत्कच्चित् विजिगीषुसुहृदिति बहुव्रीहिः । तत्पुरुषश्चेति कतकः । सुहृत्परन्तपो रामो विजिगीषुः संस्त्रिविधोपायं सामदानभेदरूपमुपायं दण्डोपायं च मित्रेषु च चादमित्रेषु च द्विविधं यथा भवति तथा सेवते कच्चित् । मित्रेषु सामदाने अमित्रेषु भेददण्डौ चेत्येवं विभज्य प्रयुङ्क्ते कच्चिदित्यर्थ इति तीर्थः", "bhusana": "द्विविधं त्रिविधोपायमुपायमपि सेवते ।\n\nविजिगीषुः सुहृत् कच्चिन्मित्रेषु च परन्तपः\nतान्येवाह द्विविधमिति । परन्तपो रामः मित्रेषु विषये सुहृत्सन् द्विविधं सामदानरूपमुपायमपि सेवते कच्चित् । चकारेणामित्रास्समुच्चीयन्ते । अमित्रेषु विषये विजिगीषुस्सन् त्रिविधोपायं दानभेददण्डान् सेवते प्रयुङ्क्ते कच्चित्? । सुहृत्सु कदाचिदपि भेददण्डौ न कार्यौ, शत्रुषु न सामेति भावः । योजनान्तरे विजिगीषुसुहृत्यपदयोः प्रयोजनं मृग्यम्", "siromani": "द्विविधमिति । मित्रेषु चकारेण अमित्रेषु च सुहृदपि रामः विजिगीषुः सन् द्विविधं द्वौ ऐहिकामुष्मिकपालनधर्मौ विदधाति पालयति तं विविधोपायं त्रयाणां ब्रह्मविष्णुमहेश्वराणां विधाय तत्प्रार्थितनिष्पादकत्वेन पोषणाय उपायं यत्नम् उपायं झटिति मङ्गलप्रापकं यथा भवति तथा सेवते कुरुते कच्चित्"}, "neighbours": [{"verse_id": "5.36.15", "leonov_ru": "Не дрожит Рама, не страдает, Высшие (необходимые) действия предпринимает лучший из людей?", "commentary": {"bhusana": "कच्चिन्न व्यथितो रामः कच्चिन्न परितप्यते ।\n\nउत्तराणि च कार्याणि कुरुते पुरुषोत्तमः\nकच्चिदिति । न व्यथितः न कृशः । उत्तराणि कार्याणि मत्प्राप्तिसाधकानि कच्चित्कुरुते?"}}, {"verse_id": "5.36.16", "leonov_ru": "Не печален он, не растерян и знает он, что необходимо делать, Совершает сын царя все, что в человеческих силах?", "commentary": {"tilaka": "न दीनो न संभ्रान्त इत्यनुषङ्गः । पुरुषकार्याणि पुरुषकारान्", "bhusana": "कच्चिन्न दीनः सम्भ्रान्तः कार्येषु च न मुह्यति ।\n\nकच्चित् पुर्षकार्याणि कुरुते नृपतेः सुतः\nन दीनः कच्चित् सम्भ्रान्तः सन् कार्येषु न मुह्यति कच्चिदित्यन्वयः । पुरुषकार्याणि पुरुषेण कर्तव्यानि"}}, {"verse_id": "5.36.18", "leonov_ru": "Обретает он друзей и ищут [его расположения] недруги? Желают ли добра ему друзья, уважаем ли он друзьями?", "commentary": {"tilaka": "मित्राणि लभते स्वयत्नेनामित्रैश्च स्वयत्नतो ऽभिगम्यते । कल्याणमित्रः सौम्यमित्रः । मित्रैः पुरस्कृतो बहुमतः कच्चित्", "bhusana": "कच्चिन्मित्राणि लभते मित्रैश्चाप्यभिगम्यते ।\n\nकच्चित् कल्याणमित्रश्च मित्रैश्चापि पुरस्कृतः\nअभिगम्यते लभ्यते । मित्रस्य कंचिदुपकारं कृत्वा स्वयमुपकारं मित्रादपेक्षते कच्चिदित्यर्थः । कल्याणमित्रः पुरस्कृतमित्र इत्यर्थः"}}, {"verse_id": "5.36.19", "leonov_ru": "Молит ли богов о милости сын царя? Полагается ли он на человеческие усилия и на судьбу?", "commentary": {"siromani": "कच्चिदिति । रामः कच्चिन्न व्यथते कच्चिन्न परितप्यते वा अत एव कार्याणि कर्तव्याणि उत्तराणि दुःखोत्तारकाणि प्रयतनानि कुरुते\nकच्चिदिति । कच्चिन्न दीनः संभ्रान्तो वा न अत एव कच्चिन्न मुह्यति अत एव पुरुषकार्याणि पुरुषेण कर्तव्यानि कुरुते\nकच्चिदिति । कल्याणं मित्रं यस्य सः अत एव मित्रैः पुरस्कृतः स रामः मित्राणि लभते कच्चित् अमित्रैः रिपुभि अभिगम्यते पराभूतिमूलकशरणप्रार्थनया प्राप्यते कच्चित्\nकच्चिदिति । देवानां प्रसादं तद्रिपुवधजनिततत्प्रसन्नतामाशास्ति आशास्ते इच्छति दैवं देवसंबन्धि पुरुषस्य पुरुषार्थस्य कारं विध्वंसं प्रतिपद्यते स्मृतिविषयत्वेन प्राप्नोति स्मरतीत्यर्थः\nकच्चिदिति । विवासात् हेतोः राघवः मयि विगतस्नेहो न कच्चित् अस्माद्व्यसानात् दुःखहेतुभूतनिरोधान्मोचयिष्यति", "tilaka": "आशास्त्याशास्ते प्रार्थयत इत्यर्थः", "bhusana": "कच्चिदाशास्ति देवानां प्रसादं पार्थिवात्मजः ।\n\nकच्चित् पुरुषकारं च दैवं च प्रतिपद्यते"}}], "phase1_here": [{"lemma": "dvividha trividha upāya", "note": "Двивидха / тривидха упая (dvi-vidha / tri-vidha upāya) — «двойные / тройные упаи» — термины нитишастры. Три классических upāya политической науки: sāman (переговоры), dāna (дары), daṇḍa (принуждение); с bheda (разделением) — четыре. «Двойные» упаи — возможно, pauruṣa (личная воля) + daiva (судьба), или sandhāna (союз) + vigraha (война). Сита формулирует политический вопрос: использует ли Рама правильные стратегии? Её вопрос — не наивный, а вполне в духе нитишастры: она спрашивает о политической компетенции мужа. Этот момент раскрывает Ситу как информированного политического агента.", "type": "А"}], "leonov_here": [{"editor": "kostina", "note": "Двойное средство – примирение (sāma) и дары (dāna). Тройное средство – дары (dāna), сеяние розни среди противника (bheda) и военная сила (букв. «наказание», daṇḍa). Под одинарным средством подразумевается стратегия в целом. В «Артхашастре» говорится: «Примирением следует достигать цели с теми, у кого истощены силы, кто устал от борьбы… Подарками следует достигать цели с тем, кто жаден и слаб… Следует разделять друг от друга ненавидящих взаимно, враждующих между собою… Агенты должны применять оружие, огонь, яд и прочее против горячего, энергичного или потерпевшего поражение врага…» (9.6, стр. 402-405).[Е. Костина] Нужно указать источник, по которому производится толкование"}]}, {"verse_id": "5.36.33", "lemma_iast": "śacīm iva purandaraḥ", "note_ru": "Согласно Тилаке и Широмани, сравнение опирается на миф: Индра медлил забрать похищенную демоном (Анухрадой) Шачи именно потому, что не знал о месте её пребывания, — так и Рама, по мысли Ханумана, не идёт за Ситой лишь по неведению, а не по охлаждению чувств.", "source_commentary": ["tilaka", "siromani"], "kazansky_type": "В", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Раскрывает миф (Индра/Шачи/Анухрада), на который опирается сравнение — иначе троп непрозрачен.", "sanskrit_iast": "na tvām ihasthāṃ jānīte rāmaḥ kamalalocanaḥ । tena tvāṃ nānayatyāśu śacīmiva purandaraḥ ॥33॥", "leonov_ru": "Не знает лотосоглазый Рама, что ты находишься здесь. Потому тебя он не уводит [отсюда] немедленно, как Индра – [богиню] Шачи.", "commentary_at_verse": {"bhusana": "न त्वामिहस्थां जानीते रामः कमललोचने ।\n\nतेन त्वां नानयत्याशु शचीमिव पुरन्दरः\nन त्वामिति । रमः \"न जीवेयं क्षणमपि विना तामसितेक्षणाम्\" इत्यध्यवसायी कथं नागच्छेत् । कमललोचने त्वन्नयनसौन्दर्यं दर्पणतले ऽपि किन्न दृष्टवती भवती । एतत्सैन्दर्यवतीं कथं त्वां विना स तिष्ठेत् । तेन अनेन हेतुना । आशु त्वां नानयति । शचीं पुरन्दर इव । अनुह्लादहस्तगतां शचीमिन्द्रः कञ्चित्कालमविज्ञाय ज्ञानानन्तरं यथा आनीतवान् तथेति भावः"}, "neighbours": [{"verse_id": "5.36.31", "leonov_ru": "После того, как царевна слова, исполненные глубокого смысла И сладостные сказала той великой обезьяне, Чтобы услышать его слова приятные (радующие) О замыслах Рамы остановилась [она], прекрасная.", "commentary": {"tilaka": "रामार्थयुक्तं रामप्रयोजनयुक्तम् । रामरूपाभिधेयेन युक्तं तद्बोधकमिति वा ।। 5.36.31,32 ।।\n\nन जानीते न जानीत इव । अनुह्राददैत्यनीतां शचीं पुरन्दर इव", "bhusana": "इत्थं सन्देशकथनादिना देवीं विश्वास्याभिज्ञानाङ्गुलीयकदानेन दृढं विश्वासयति वानरो ऽहमित्यादिना\nमन्निमित्तेन मानार्हः कच्चिच्छोकेन राघवः ।\n\nकच्चिन्नान्यमना रामः कच्चिन्मां तारयिष्यति\nमन्निमित्तेन मया हेतुना । अन्यमनाः कार्यान्तरासक्तः\nइतीव देवी वचनं महार्थं तं वानरेन्द्रं मधुरार्थमुक्त्वा ।\n\nश्रोतुं पुनस्तस्य वचो ऽभिरामं रामार्थयुक्तं विरराम रामा", "siromani": "मदिति । मन्निमित्तेन शोकेनोपलक्षितः कच्चित् अत एव अन्यमना न कच्चित्\nइतीवेति । देवी सीता इतीव वचनमुक्त्वा रामार्थयुक्तं तस्य हनुमतो वचः श्रोतुं रामा सीता विरराम"}}, {"verse_id": "5.36.32", "leonov_ru": "Услышав слова Ситы, сын Ветра, грозно-доблестный, Смиренно сложив ладони, поднял их к голове, и ответил:", "commentary": {"bhusana": "सीताया वचनं श्रुत्वा मारुतिर्भीमविक्रमः ।\n\nशिरस्यञ्जलिमाधाय वाक्यमुत्तरमब्रवीत्", "siromani": "सीताया इति । मारुतिः सीताया वचनं श्रुत्वा अञ्जलिं शिरसि आधाय उत्तरं श्रेष्ठं वाक्यमब्रवीत्"}}, {"verse_id": "5.36.34", "leonov_ru": "Услышав же мои слова, тут же придет Рагхава, Ведя с собой великое войско обезьян и медведей.", "commentary": {"tilaka": "मह्यं मत्तः", "bhusana": "श्रुत्वैव तु वचो मह्यं क्षिप्रमेष्यति राघवः ।\n\nचमूं प्रकर्षन् महतीं हर्यृक्षगणसङ्कुलाम्\nमह्यं मम । व्यत्यनेन षष्ट्यर्थे चतुर्थी", "siromani": "श्रुत्वेति । मह्यं मम । मह्यं मम वचः श्रुत्वैव राघव एष्यति"}}, {"verse_id": "5.36.35", "leonov_ru": "Остановив (сделав неподвижным) тучами стрел невозмутимую обитель Варуны, Очистит Какутстха город Ланку от ракшасов.", "commentary": {"tilaka": "विष्टम्भयित्वा संस्तभ्य । सेतुं बद्धेति यावत्", "bhusana": "विष्टम्भयित्वा बाणौधैरक्षोभ्यं वरुणालयम् ।\n\nकरिष्यति पुरीं लङ्कां काकुत्स्थः शान्तराक्षसाम्\nसमुद्रं कथमतिक्रमिष्यतीत्यात्राह विष्टम्भयित्वेति । विष्टम्भयित्वा स्तब्धं कृत्वेत्यर्थः", "siromani": "विष्टम्भयित्वेति । वरुणालयं समुद्रं विष्टम्भयित्वा विष्टभ्य संस्तभ्य सेतुं बद्ध्वेत्यर्थः । लङ्कां बाणौघैः शान्तराक्षसां करिष्यति"}}], "phase1_here": [], "leonov_here": [{"editor": null, "note": "Как Индра – богиню Шачи (śacīmiva purandaraḥ) – в комментарии «Бхушана» говорится, что Индра некоторое время не знал, что его супруга, богиня Шачи, похищена Анухладой (anuhlāda, сын дайтьи Хираньякашипу) и поэтому не освобождал ее.[Claude.AI — желательно] [термин] (учтено) Первое появление в кн. V; введено в Рамаяна I. 26. 27: Сокрушитель крепостей асуров (puran-dara) — один из эпитетов Индры, основного героя борьбы богов с асурами, разрушителя их городов, или крепостей."}]}, {"verse_id": "5.36.38", "lemma_iast": "mandareṇa... mūlaphalena ca", "note_ru": "По Тилаке и Бхушане, клятва построена не случайно: Хануман клянётся горами и кореньями-плодами именно потому, что это места его собственного обитания и источники его пропитания, — присяга собственной жизнью, а не отвлечённый перечень святынь.", "source_commentary": ["tilaka", "bhusana"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Показывает, что клятва не случайна (жизнью, не набор святынь) — логика образа.", "sanskrit_iast": "mandareṇa ca te devi śape mūlaphalena ca । malayena ca vindhyena meruṇā dardureṇa ca ॥38॥", "leonov_ru": "Клянусь тебе, царевна, горой Мандарой, кореньями и плодами, Горами Малайя, Виндхья, Меру и Дардура,", "commentary_at_verse": {"bhusana": "मलयेन च विन्ध्येन मेरुणा मन्दरेण च ।\n\nदर्दुरेण च ते देवि शपे मूलफलेन च\nगिरीणां स्वजीवनस्थानत्वात्तैः शपति मलयेनेति । दर्दुरो नाम मलयपरिसरवर्ती चन्दनप्रभवः कश्चित्पर्वतः", "siromani": "अत्र दृढविश्वासार्थमाह मन्दरेणेति"}, "neighbours": [{"verse_id": "5.36.36", "leonov_ru": "Если Смерть, боги вместе с асурами Встанут на пути Рамы, он и их уничтожит.", "commentary": {"tilaka": "तत्र तत्कर्मप्रवृत्तावन्तरा विघ्नत्वेन यदि मृत्युप्रभृतयो ऽपि स्थास्यन्ति तदा तानपि वधिष्यति ।। 5.36.36,37 ।।\n\nस्वोक्ते ऽर्थे देव्या विश्वासार्थं स्ववासस्थानमन्दरादिभिः स्वजीवनसादनैर्मूलफलैश्च शपथं करोति-- मन्दरेण चेति । दर्दुरः पर्वतविशेषः", "bhusana": "तत्र यद्यन्तरा मृत्युर्यदि देवाः सहासुराः ।।\n\nस्थास्यन्ति पथि रामस्य स तानपि वधिष्यति", "siromani": "तत्रेति । तत्र लङ्काविध्वंसनसमये पथि अन्तरा मार्गमध्ये मृत्युः सुरादयो वा यदि स्थास्यन्ति विघ्नकारित्वेनेति शेषः । तदा स रामस्तानपि वधिष्यति"}}, {"verse_id": "5.36.37", "leonov_ru": "О благородная, переполнен он скорбью, рожденной разлукой с тобой, Не обретает покоя Рама, словно слон, истерзанный львами.", "commentary": {"bhusana": "तवादर्शनजेनार्ये शोकेन स परिप्लुतः ।\n\nन शर्म लभते रामः सिंहार्दित इव द्विपः", "siromani": "तवेति । शोकेन परिपूरितो रामः शर्म न लभते"}}, {"verse_id": "5.36.39", "leonov_ru": "Что прекрасноглазое, прекрасное, с устами как плоды бимбы, с прекрасными серьгами Лицо Рамы ты [скоро] увидишь, подобное взошедшей полной луне.", "commentary": {"tilaka": "यथा रामस्य मुखं द्रक्ष्यसि तथा मन्दरादिभिः शपे इत्यन्वयः", "bhusana": "यथा सुनयनं वल्गु बिम्बोष्ठं चारुकुण्डलम् ।\n\nमुखं द्रक्ष्यसि रामस्य पूर्णचन्द्रमिवोदितम्\nयथेति । तथा शप इति पूर्वेणान्वयः", "siromani": "बिम्बावोष्ठौ यस्मिन् तत् रामस्य मुखं यथावत् द्रक्ष्यसि मन्दरादिना शपे अस्मिन् विषये शपथं करोमि । श्लोकद्वयमेकान्वयि"}}, {"verse_id": "5.36.40", "leonov_ru": "Скоро ты увидишь, Вайдехи, Раму на горе Прасравана, Подобно Индре, сидящему на спине слона [Айраваты].", "commentary": {"tilaka": "प्रस्रवणे गिरौ विद्यमानमपीह द्रक्ष्यसीत्यर्थः । नागपृष्टस्य मूर्धन्यैरावतोपरि स्थितमिन्द्रमिव मत्पृष्ठगं रामं द्रक्ष्यसीत्यर्थः । \"नाकपृष्ठस्य\" इति पाठः । स्वर्गस्योपरीत्यर्थ इति तीर्थः", "bhusana": "क्षिप्रं द्रक्ष्यासि वैदेहि रामं प्रस्रवणे गिरौ ।\n\nशतक्रतुमिवासीनं नाकपृष्ठस्य मूर्धनि\nक्षिप्रमिति । नाकपृष्ठो नाम इन्द्रस्यासाधारणस्वर्गस्थानविशेषः", "siromani": "क्षिप्रमिति । नागा गजा पृष्ठे पार्श्वे इत्यर्थः । यस्य तस्य ऐरावतस्य मूर्धनि आसीनं शतक्रतुमिव प्रस्रवणे गिरौ आसीनं रामं क्षिप्रं द्रक्ष्यसि द्रुतमागमिष्यतीत्यर्थः"}}], "phase1_here": [{"lemma": "śape (mandara … meruṇā … dardureṇa)", "note": "Шапе (śape, 1sg.pres. от √śap- «клясться») — «клянусь». Хануман даёт клятву, называя горы: Мандара, Малая, Виндхья, Меру, Дарда. В ведийской и эпической традиции клятва горой (parvata-śapatha) — один из сильнейших типов клятвы: горы вечны и незыблемы, их упоминание призывает svara вечности как свидетеля. Список гор не произволен: Мандара — ось мироздания (мантали-мандара), Меру — космическая гора, Малая — лесная гора, источник сандала. Клятва охватывает все типы гор — космические, лесные, региональные — как стремление призвать максимальную свидетельскую силу.", "type": "А"}], "leonov_here": [{"editor": null, "note": "Клянусь я горою Мандарой / С кореньями и плодами (mandareṇa ca te devi śape mūlaphalena ca) Хануман, как горный житель, клянется местами своего обитания, а также той едой, которая составляет основу рациона обезьян."}]}, {"verse_id": "5.36.40", "lemma_iast": "nāgapṛṣṭhasya mūrdhani", "note_ru": "Чтение неоднозначно: Тилака и Широмани понимают nāgapṛṣṭha как «на спине слона [Айраваты]», тогда как в изводе Бхушаны читается nākapṛṣṭha — «на вершине особой небесной обители Индры»; перевод следует первому варианту.", "source_commentary": ["tilaka", "bhusana", "siromani"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Текстологический вариант (nāga-/nāka-) с расхождением комментаторов; фиксирует, какому чтению следует перевод.", "sanskrit_iast": "kṣipraṃ drakṣyasi vaidehi rāmaṃ prasravaṇe girau । śatakratum ivāsīnaṃ nāgapṛṣṭhasya mūrdhani ॥40॥", "leonov_ru": "Скоро ты увидишь, Вайдехи, Раму на горе Прасравана, Подобно Индре, сидящему на спине слона [Айраваты].", "commentary_at_verse": {"tilaka": "प्रस्रवणे गिरौ विद्यमानमपीह द्रक्ष्यसीत्यर्थः । नागपृष्टस्य मूर्धन्यैरावतोपरि स्थितमिन्द्रमिव मत्पृष्ठगं रामं द्रक्ष्यसीत्यर्थः । \"नाकपृष्ठस्य\" इति पाठः । स्वर्गस्योपरीत्यर्थ इति तीर्थः", "bhusana": "क्षिप्रं द्रक्ष्यासि वैदेहि रामं प्रस्रवणे गिरौ ।\n\nशतक्रतुमिवासीनं नाकपृष्ठस्य मूर्धनि\nक्षिप्रमिति । नाकपृष्ठो नाम इन्द्रस्यासाधारणस्वर्गस्थानविशेषः", "siromani": "क्षिप्रमिति । नागा गजा पृष्ठे पार्श्वे इत्यर्थः । यस्य तस्य ऐरावतस्य मूर्धनि आसीनं शतक्रतुमिव प्रस्रवणे गिरौ आसीनं रामं क्षिप्रं द्रक्ष्यसि द्रुतमागमिष्यतीत्यर्थः"}, "neighbours": [{"verse_id": "5.36.38", "leonov_ru": "Клянусь тебе, царевна, горой Мандарой, кореньями и плодами, Горами Малайя, Виндхья, Меру и Дардура,", "commentary": {"bhusana": "मलयेन च विन्ध्येन मेरुणा मन्दरेण च ।\n\nदर्दुरेण च ते देवि शपे मूलफलेन च\nगिरीणां स्वजीवनस्थानत्वात्तैः शपति मलयेनेति । दर्दुरो नाम मलयपरिसरवर्ती चन्दनप्रभवः कश्चित्पर्वतः", "siromani": "अत्र दृढविश्वासार्थमाह मन्दरेणेति"}}, {"verse_id": "5.36.39", "leonov_ru": "Что прекрасноглазое, прекрасное, с устами как плоды бимбы, с прекрасными серьгами Лицо Рамы ты [скоро] увидишь, подобное взошедшей полной луне.", "commentary": {"tilaka": "यथा रामस्य मुखं द्रक्ष्यसि तथा मन्दरादिभिः शपे इत्यन्वयः", "bhusana": "यथा सुनयनं वल्गु बिम्बोष्ठं चारुकुण्डलम् ।\n\nमुखं द्रक्ष्यसि रामस्य पूर्णचन्द्रमिवोदितम्\nयथेति । तथा शप इति पूर्वेणान्वयः", "siromani": "बिम्बावोष्ठौ यस्मिन् तत् रामस्य मुखं यथावत् द्रक्ष्यसि मन्दरादिना शपे अस्मिन् विषये शपथं करोमि । श्लोकद्वयमेकान्वयि"}}, {"verse_id": "5.36.41", "leonov_ru": "Ни мяса не ест Рагхава, ни меда он не вкушает (не пьет), Он ест только пятую часть еды, предписанную [аскетам] из лесных плодов.", "commentary": {"bhusana": "न मांसं राघवो भुङ्क्ते न चापि मधु सेवते ।\n\nवन्यं सुविहितं नित्यं भक्तमश्नाति पञ्चमम्\nन मांसमिति । \"दृङ्मनः सङ्गसङ्कल्पजागराः कृशता ऽरतिः । ह्रीत्यागोन्मादमूर्च्छान्ता इत्यनङ्गदशा दस ।।\" इति दशावस्थास्वरतिरनेनोच्यत्। मांसाद्यभोजनम् अरत्या ततः पूर्वं तद्भोजनोक्तेः। वन्यं वने भवं कन्दमूलादिकम्। सुविहितं वानप्रस्थयोग्यत्वेन विहितम्। भक्तम् अन्नम्। पञ्चमं प्रातःसङ्गवमध्याह्नापराह्णसायंरूपेषु कालेषु पञ्चमकालिकं शरीरधारणमात्रोपयुक्तं भुङ्क्त इत्यर्थः", "siromani": "नेति । राघवः मांसं सुग्रीवसंसर्गेण वने ऽपि प्राप्तराज्यभोगं न भुङ्क्ते करोति अत एव मधु क्षौद्रं न सेवते किंतु सुविहितं ब्रह्मचर्यविधावुक्तं वन्यं फलादिरूपमन्नं पञ्चमं पूर्वभोज्यापेक्षया पञ्चममश्नाति पञ्चमं कालं सायाह्नं प्राप्येति शेष इति भट्टाः"}}, {"verse_id": "5.36.42", "leonov_ru": "Ни оводов, ни москитов, ни червей, ни змей Рагхава не сгоняет с тела, погруженный в думы о твоем теле.", "commentary": {"bhusana": "नैव दंशान्न मशकान् न कीटान्न सरीसृपान् ।\n\nराघवो ऽपनयेद्गात्रात् त्वद्गतेनान्तरात्मना", "siromani": "नेति । अन्तरात्मना मनसा त्वद्गतेन हेतुना दंशादीन् गात्रान्नापनयेत् अपनयति"}}], "phase1_here": [], "leonov_here": []}, {"verse_id": "5.36.41", "lemma_iast": "bhaktam aśnāti pañcamam", "note_ru": "По Бхушане, «пятая доля пищи» — не количество, а время: Рама ест единожды в день, в пятый из пяти дневных периодов (на закате), — форма аскетического воздержания отшельника, а не буквальная порция еды.", "source_commentary": ["bhusana"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Исправляет вероятное недопонимание: «пятая доля» = время трапезы, не количество — иначе теряется смысл аскезы.", "sanskrit_iast": "na māṃsaṃ rāghavo bhuṅkte na cāpi madhu sevate । vanyaṃ suvihitaṃ nityaṃ bhaktam aśnāti pañcamam ॥41॥", "leonov_ru": "Ни мяса не ест Рагхава, ни меда он не вкушает (не пьет), Он ест только пятую часть еды, предписанную [аскетам] из лесных плодов.", "commentary_at_verse": {"bhusana": "न मांसं राघवो भुङ्क्ते न चापि मधु सेवते ।\n\nवन्यं सुविहितं नित्यं भक्तमश्नाति पञ्चमम्\nन मांसमिति । \"दृङ्मनः सङ्गसङ्कल्पजागराः कृशता ऽरतिः । ह्रीत्यागोन्मादमूर्च्छान्ता इत्यनङ्गदशा दस ।।\" इति दशावस्थास्वरतिरनेनोच्यत्। मांसाद्यभोजनम् अरत्या ततः पूर्वं तद्भोजनोक्तेः। वन्यं वने भवं कन्दमूलादिकम्। सुविहितं वानप्रस्थयोग्यत्वेन विहितम्। भक्तम् अन्नम्। पञ्चमं प्रातःसङ्गवमध्याह्नापराह्णसायंरूपेषु कालेषु पञ्चमकालिकं शरीरधारणमात्रोपयुक्तं भुङ्क्त इत्यर्थः", "siromani": "नेति । राघवः मांसं सुग्रीवसंसर्गेण वने ऽपि प्राप्तराज्यभोगं न भुङ्क्ते करोति अत एव मधु क्षौद्रं न सेवते किंतु सुविहितं ब्रह्मचर्यविधावुक्तं वन्यं फलादिरूपमन्नं पञ्चमं पूर्वभोज्यापेक्षया पञ्चममश्नाति पञ्चमं कालं सायाह्नं प्राप्येति शेष इति भट्टाः"}, "neighbours": [{"verse_id": "5.36.39", "leonov_ru": "Что прекрасноглазое, прекрасное, с устами как плоды бимбы, с прекрасными серьгами Лицо Рамы ты [скоро] увидишь, подобное взошедшей полной луне.", "commentary": {"tilaka": "यथा रामस्य मुखं द्रक्ष्यसि तथा मन्दरादिभिः शपे इत्यन्वयः", "bhusana": "यथा सुनयनं वल्गु बिम्बोष्ठं चारुकुण्डलम् ।\n\nमुखं द्रक्ष्यसि रामस्य पूर्णचन्द्रमिवोदितम्\nयथेति । तथा शप इति पूर्वेणान्वयः", "siromani": "बिम्बावोष्ठौ यस्मिन् तत् रामस्य मुखं यथावत् द्रक्ष्यसि मन्दरादिना शपे अस्मिन् विषये शपथं करोमि । श्लोकद्वयमेकान्वयि"}}, {"verse_id": "5.36.40", "leonov_ru": "Скоро ты увидишь, Вайдехи, Раму на горе Прасравана, Подобно Индре, сидящему на спине слона [Айраваты].", "commentary": {"tilaka": "प्रस्रवणे गिरौ विद्यमानमपीह द्रक्ष्यसीत्यर्थः । नागपृष्टस्य मूर्धन्यैरावतोपरि स्थितमिन्द्रमिव मत्पृष्ठगं रामं द्रक्ष्यसीत्यर्थः । \"नाकपृष्ठस्य\" इति पाठः । स्वर्गस्योपरीत्यर्थ इति तीर्थः", "bhusana": "क्षिप्रं द्रक्ष्यासि वैदेहि रामं प्रस्रवणे गिरौ ।\n\nशतक्रतुमिवासीनं नाकपृष्ठस्य मूर्धनि\nक्षिप्रमिति । नाकपृष्ठो नाम इन्द्रस्यासाधारणस्वर्गस्थानविशेषः", "siromani": "क्षिप्रमिति । नागा गजा पृष्ठे पार्श्वे इत्यर्थः । यस्य तस्य ऐरावतस्य मूर्धनि आसीनं शतक्रतुमिव प्रस्रवणे गिरौ आसीनं रामं क्षिप्रं द्रक्ष्यसि द्रुतमागमिष्यतीत्यर्थः"}}, {"verse_id": "5.36.42", "leonov_ru": "Ни оводов, ни москитов, ни червей, ни змей Рагхава не сгоняет с тела, погруженный в думы о твоем теле.", "commentary": {"bhusana": "नैव दंशान्न मशकान् न कीटान्न सरीसृपान् ।\n\nराघवो ऽपनयेद्गात्रात् त्वद्गतेनान्तरात्मना", "siromani": "नेति । अन्तरात्मना मनसा त्वद्गतेन हेतुना दंशादीन् गात्रान्नापनयेत् अपनयति"}}, {"verse_id": "5.36.43", "leonov_ru": "Постоянно пребывающий в думах, Рамо всегда удручен скорбью, Не думает ни о чем ином [кроме тебя] он, находящийся во власти любви.", "commentary": {"bhusana": "नित्यं ध्यानपरो रामो नित्यं शोकपरायणः ।\n\nनान्यच्चिन्तयते किञ्चित् स तु कामवशं गतः", "siromani": "नित्यमिति । कामवशं त्वद्विषयकोत्कटेच्छाधीनत्वं गतः प्राप्तः अत एव नित्यं शोकपरायण अत एव नित्यं ध्यानपरः त्वद्विषयकस्मृतौ निरतो रामः अन्यं किंचित् पदार्थं न चिन्तयते"}}], "phase1_here": [{"lemma": "vanya bhakta (pañcamam)", "note": "Ванья бхакта (vanya bhakta, n.) — «лесная пища», тат-пуруша: vanya «лесное, дикое» + bhakta «пища, еда» (от √bhaj-). Хануман говорит, что Рама «каждый день на пятой (трапезе) ест должным образом приготовленную лесную пищу (vanyaṃ suvihitaṃ bhaktam aśnāti pañcamam)». «Пятая трапеза» (pañcama bhakta) — технический термин аскетического питания: есть только раз в пять дней. Это форма tapas — добровольного поста, равного аскетической практике. Рама соблюдает строгий постнический режим не из нужды, а как выражение скорби и сосредоточенности на освобождении Ситы.", "type": "А"}], "leonov_here": [{"editor": null, "note": "Мяса Рама не ест (na māṃsaṃ rāghavo bhuṅkte) – Рама не ест мяса, поскольку из-за разлуки с Ситой находится в состоянии «арати» - отвращения к плотским радостям.Ест он плоды лесные, / Как аскетам предписано (bhaktam aśnāti pañcamam) – букв. «ест пятую еду». Это может означать, что Рама ест пятую часть обычного рациона, или же ест только в одну (пятую) часть дня, то есть один раз в сутки (по комментарию «Тилака»: prātaḥsaṅgavamadhyāhnāparāhṇāt pañcamaṃ sāyāhnaṃ prāpyety arthaḥ). Голдмены в комментарии к своему переводу отмечают (ссылаясь на другую версию, приведенную в «Тилаке»), что нормой для человека в древней Индии считалось есть два раза в сутки. Таким образом, Рама пропускает четыре приема пищи (двое суток) и ест только на утро третьего дня (см.: Goldman 1984: 450)."}]}, {"verse_id": "5.37.3", "lemma_iast": "kṛtāntaḥ parikarṣati", "note_ru": "По Широмани, за общим утверждением о всесильности рока скрыт конкретный намёк: раз судьба одинаково властна и над величием (aiśvarya), и над бедствием (vyasana), из этого следует, что и всемогущество Раваны обречено рухнуть — «этим предвещается неизбежная гибель Раваны» (rāvaṇavidhvaṃso 'vaśyaṃ bhaviteti sūcitam).", "source_commentary": ["siromani"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Вскрывает подтекст-предвестие гибели Раваны за общей сентенцией о роке — экзегетический слой.", "sanskrit_iast": "aiśvarye vā suvistīrṇe vyasane vā sudāruṇe । rajjveva puruṣaṃ baddhvā kṛtāntaḥ parikarṣati ॥3॥", "leonov_ru": "В безмерном могуществе или в жестокой беде Ведет судьба человека, словно связав его веревкой.", "commentary_at_verse": {"tilaka": "ऐश्वर्ये व्यसने इति च विषयसप्तमी", "bhusana": "ऐश्वर्ये वा सुविस्तीर्णे व्यसने वा सुदारुणे ।\n\nरज्ज्वेव पुरुषं बद्ध्वा कृतान्तः परिकर्षति\nरामवियोगो न स्वबुद्धिकृत इत्याह ऐश्वर्य इति । कृतान्तः दैवम्"}, "neighbours": [{"verse_id": "5.37.1", "leonov_ru": "Сита, чье лицо подобно полной луне, услышав [эти] слова, Сказала Хануману слова, соединенные с дхармой и пользой:", "commentary": {"tilaka": "वचनं हनूमत इत्यादि", "bhusana": "सीता तद्वचनं श्रुत्वा पूर्णचन्द्रनिभानना ।\n\nहनूमन्तमुवाचेदं धर्मार्थसहितं वचः\nसीतेत्यादि"}}, {"verse_id": "5.37.2", "leonov_ru": "«Нектар (амрита), смешанный с ядом, - твои, обезьяна, слова, О том, что Рама думает по-прежнему [обо мне] и о том, что он целиком погружен в скорбь.", "commentary": {"tilaka": "यच्चानन्यमना इति वाक्यमाख्यायते तदमृतम् । यच्च शोकपरायण इति वाक्यमाख्यायते तद्विषम्", "bhusana": "अमृतं विषसंसृष्टं त्वया वानरभाषितम् ।\n\nयच्च नान्यमना रामो यच्च शोकपरायणः\nअमृतमिति । यच्च नान्यमना इत्यमृतत्वे हेतुः । यच्च शोकपरायण इति विषसंसृष्टत्वे"}}, {"verse_id": "5.37.4", "leonov_ru": "Конечно, судьба неодолима для живых существ, о лучший из обезьян. Посмотри на сына Сумитры, меня и Раму, пребывающих в смятении из-за бед.", "commentary": {"siromani": "हनूमन्तं प्रति सीतोक्तिमाह सेत्यादिभिः । सीता वचनं हनुमद्वाक्यं श्रुत्वा हनूमन्तमुवाच । तदाकारमाह अमृतमित्यादिभिः । हे वानर अन्यमना रामो नेति यत् शोकपरायणो ऽस्तीति यच्च त्वयाभिमाषितं तत् विषसंपृक्तं विषेण संमिश्रम् अमृतं प्रतीयते इति शेषः ।। 5.37.1,2 ।।\n\nइदानीं रावणस्य अत्यैश्वर्यवत्त्वे ऽपि विध्वंसो भविष्यतीति बोधयन्ती आह ऐश्वर्य इति । ऐश्वर्ये व्यसने वा विद्यमानं पुरुषं रज्ज्वा बद्ध्वैव कृतान्तः कालः परिकर्षति । ताभ्यामन्यत्र करोतीत्यर्थः । एतेन रावणविध्वंसो ऽवश्यं भवितेति सूचितम्\nविधिरिति । विधिः परमात्मनियोगः प्राणिनाम् असंहार्यः अपरिहरणीयः अत एव सौमित्रिप्रभृतीन् व्यसनैः वियोगदुःखैः मोहितान् पश्य", "tilaka": "विधिर्दैवम् । असंहार्यो ऽशक्यप्रतिक्रियः । अत्र स्वीयमेव दुःखं दृष्टान्तयति", "bhusana": "विधिर्नूनमसंहार्थः प्राणिनां प्लवगोत्तम ।\n\nसौमित्रिं मां च रामं च व्यसनैः पश्य मोहितान्"}}, {"verse_id": "5.37.5", "leonov_ru": "Как Рагхава достигнет другого берега бед, Словно тот, чей корабль разбился, плывущий в океане?", "commentary": {"tilaka": "हतनौः पुरुषः परिक्रान्तः कृतपराक्रमो बाहुभ्यां प्लवमानो यथा सागरे पारमतिक्लेशेनाधिगच्छति तथा राघवो ऽपि कथञ्चित्तमधिगमिष्यति ।। 5.37.5,6 ।।\n\nस रामः ।। 5.37.7,8 ।।\n\nनिर्यातनं पुनः समर्पणम्, न च तत् तस्मिन्नित्यर्थः ।। 5.37.9,10 ।।\n\nकन्या ऽजातपुरुषसंबन्धा । एतद्विभीषणानुनयनम्, इदमेवाग्रे रामश्रुतं विभीषणस्य निःशङ्कपरिग्रहाभिषेकयोर्बीजम् ।। 5.37.11,12 ।।\n\nरामक्षयम् रक्षसां रामात्क्षयं प्राप्तमित्यर्थः\nशरजालेत्यादि परम्परितरूपकमिदम् ।। 5.37.18,19 ।।\n\nमह्यं मम मत्तो वा", "bhusana": "शोकस्यास्य कदा पारं राघवो ऽधिगमिष्यति ।\n\nप्लवमानः परिश्रान्तो हतनौः सागरे यथा", "siromani": "शोकस्येति । सागरे हता विनष्टा नौर्यस्य अत एव प्लवमानः बाहुभ्यां संतरन् परिक्रान्तः अतिपराक्रमवान् पुरुष इव शोकस्य सागरे प्लवमानो राघवः शोकस्य पारं कदा अधिगमिष्यति"}}], "phase1_here": [{"lemma": "kṛtānta", "note": "Кританта (kṛtānta, m., букв. «делающий конец», kṛta- p.p.p. √kṛ- + anta «конец») — судьба, смерть, персонификация Ямы. MW: kṛtānta m. 'fate; Yama (god of death); established rule'. Подстрочник «судьба» — нейтрально; но kṛtānta — не абстрактное понятие, а личная сила — «делатель конца»: образ существа, которое физически «тянет» человека верёвкой (rajjveva... parikarṣati).", "type": "А"}], "leonov_here": [{"editor": "kostina", "note": "[Е. Костина] «Судьба» Нужно примечание по толкованию kṛtāntaḥ Широмани - कृतान्तः कालः Бхушана - कृतान्तः दैवम्"}]}, {"verse_id": "5.37.12", "lemma_iast": "avindhyaḥ", "note_ru": "По Тилаке, эпизод с Авиндхьей и Каньяналой — не случайная деталь: он называет его bīja, «семенем», из которого в дальнейшем повествовании вырастет решение Вибхишаны безоговорочно перейти на сторону Рамы и принять от него помазание на царство.", "source_commentary": ["tilaka"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Тилака маркирует эпизод как «семя» будущего перехода Вибхишаны — нарративная связка для читателя целого.", "sanskrit_iast": "avindhyo nāma medhāvī vidvān rākṣasapuṃgavaḥ । dhṛtimāñ сhīlavān vṛddho rāvaṇasya susammataḥ ॥12॥", "leonov_ru": "Мудрый и знающий бык среди ракшасов по имени Авиндхья Стойкий и добродетельный старец, чтимый Раваной,", "commentary_at_verse": {"bhusana": "[अविन्ध्यो नाम मेधावी विद्वान् राक्षसपुङ्गवः ।\n\nद्युतिमाञ्छीलवान् वृद्धो रावणस्य सुसंमतः ।।\n\nरामक्षयमनुप्राप्तं रक्षसां प्रत्यचोदयत् ।\n\nन च तस्य स दुष्टात्मा शृणोति वचनं हितम् ।।]\n\nअसंशयं हरिश्रेष्ठ क्षिप्रं मां प्राप्स्यते पतिः ।\n\nअन्तरात्मा हि मे शुद्धस्तस्मिंश्च बहवो गुणाः"}, "neighbours": [{"verse_id": "5.37.10", "leonov_ru": "Не по нраву Раване отдавать меня обратно. Равану, попавшего во власть смерти (рока), ищет смерть в бою.", "commentary": {"bhusana": "मम प्रतिप्रदानं हि रावणस्य न रोचते ।\n\nरावणं मार्गते सङ्ख्ये मृत्युः कालवशं गतम्", "siromani": "ममेति । कालवशं गतं रावणं संख्ये संग्रामे मृत्युर्मार्गते अत एव रावणस्य मम प्रतिपदानं न रोचते"}}, {"verse_id": "5.37.11", "leonov_ru": "Старшая дочь Вибхишаны по имени Каньянала, о обезьяна, Об этом рассказала мне, посланная своею матерью.", "commentary": {"bhusana": "ज्येष्टा कन्या ऽनला नाम विभीषणसुता कपे ।\n\nतया ममेदमाख्यातं मात्रा प्रहितया स्वयम्"}}, {"verse_id": "5.37.13", "leonov_ru": "Предупреждает о гибели, что ждет ракшасов от Рамы, Но этот испорченный душою [Равана] не слушает его слов полезных.", "commentary": {"bhusana": "चतुर्दश सहस्राणि राक्षसानां जघान यः ।\n\nजनस्थाने विना भ्रात्रा शत्रुः कस्तस्य नोद्विजेत्"}}, {"verse_id": "5.37.14", "leonov_ru": "Надеюсь я, о лучший из обезьян, что скоро обретет меня [мой] господин, Ибо чиста душа моя, и много у него благих достоинств.", "commentary": {"tilaka": "पतिः प्राप्स्यत इत्यत्र हेतुः-- अन्तरात्मेति । तस्मिन्रामे", "siromani": "अविन्ध्य इति । रावणस्य सुसंमतः मेघावित्वादिविशिष्टः अविन्ध्यो नाम राक्षसः रामात् रक्षसां प्राप्तं क्षयं प्रत्यचोदयत् अकथयत् । एतेन सीतां रामाय समर्पयेति तेन प्रार्थितमिति सूचितम् । सुदुष्टात्मा रावणस्तु हितं तस्य वचनं न शृणोति । श्लोकद्वयमेकान्वयि ।। 5.37.12,13 ।।\n\nआशंसेयमिति । हि यतः मे अन्तरात्मा शुद्धः तस्मिन् रामे च बहवो गुणाः अतः पतिः रामः क्षिप्रं संप्राप्स्यते\nनन्वेतत्त्वया कथं ज्ञातमित्यत आह ज्येष्ठेति । विभीषणसुता विभीषणादुत्पन्ना अनला नाम ज्येष्ठा कन्या ऽस्तीति शेषः । मात्रा अभिहितया कथितया तया अनलया मम समीपे एतत् स्वयमाख्यातं कथितम्\nननु पृष्ठारोहणमात्रेण कथं दुःखापगमो भविष्यतीत्यत आह त्वामिति । सरावणां रावणसहितां लङ्कां वोढुं हि यतो मे शक्तिरस्ति अतः पृष्ठगतां त्वां कृत्वा सागरं संतरिष्यामि"}}], "phase1_here": [], "leonov_here": []}, {"verse_id": "5.37.25", "lemma_iast": "nāgarājasya mūrdhani", "note_ru": "Леонов передаёт nāgarājasya как «на [спине] великого слона» (namek на Айравату), однако Тилака и Бхушана, ссылаясь на вариант nagarājasya, поясняют иначе: «на вершине лучшей из гор», то есть Рама восседает на вершине [горы] Прасраваны подобно Индре на Меру — расхождение чтений меняет сам образ.", "source_commentary": ["tilaka", "bhusana"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Текстологический вариант (nāga-/naga-), меняющий образ (слон Айравата vs вершина горы); перевод следует одному чтению.", "sanskrit_iast": "tvaddarśanakṛtotsāham āśramasthaṃ mahābalam । puraṃdaram ivāsīnaṃ nāgarājasya mūrdhani ॥25॥", "leonov_ru": "Полному решимости найти тебя, пребывающему в своей обители, обладающему великой силой, Подобно Пурандаре (Индре), восседающему на великом слоне (Айравате).", "commentary_at_verse": {"tilaka": "नगराजस्य श्रेष्ठस्य प्रस्रवणगिरेरित्यर्थः", "bhusana": "त्वद्दर्शनकृतोत्साहमाश्रमस्थं महाबलम् ।\n\nपुरन्दरमिवासीनं नाकराजस्य मूर्धनि\nत्वद्दर्शनेति । नाकराजस्य मूर्धनि नाकपृष्ठसंज्ञस्य मूर्धनि । नगराजस्येति पाठे मेरोरित्यर्थः"}, "neighbours": [{"verse_id": "5.37.23", "leonov_ru": "Я сейчас же к Рагхаве, который находится на [горе] Прасравана, Майтхили, Принесу [тебя] как огонь – сожженную жертву [приносит] Шакре.", "commentary": {"siromani": "अहमिति । प्रस्रवणस्थाय राघवाय त्वामिति शेषः । शक्राय हुतं हव्यमनल इव प्रापयिष्यामि"}}, {"verse_id": "5.37.24", "leonov_ru": "Сейчас же ты увидишь, Вайдехи, Рагхаву вместе с Лакшманой, Исполненному решимости подобно Вишну в битве с дайтьями,", "commentary": {"tilaka": "दैत्यवधे व्यवसाययुक्तं विष्णुमिव स्थितम्", "siromani": "द्रक्ष्यसीति । दैत्यवधे व्यवसायसगायुक्तमुत्साहसहितं विष्णुमिव त्वद्दर्शने कृतः उत्साहो येन तं गिरिराजस्य मूर्धनि आसीनं पुरन्दरमिव आश्रमस्थं रागवमद्यैव द्रक्ष्यसि । श्लोकद्वयमेकान्वयि ।। 5.37.24,25 ।।\n\nपृष्ठमिति । हे देवि शशाङ्केन रोहिणी इव रामेण योगमन्विच्छ निश्चिनु । अत एव पृष्ठमारोह मा विकाङ्क्षस्व औदासीन्यं नोत्पादय", "bhusana": "द्रक्ष्यस्यद्यैव वैदेहि राघवं सह लक्ष्मणम् ।\n\nव्यवसायसमायुक्तं विष्णुं दैत्यवदे यथा"}}, {"verse_id": "5.37.26", "leonov_ru": "Садись мне на спину, царевна, не раздумывай, прекрасная. Пожелай соединения с Рамой, словно Рохини с Луной.", "commentary": {"bhusana": "पृष्ठमारोह मे देवि मा विकाङ्क्षस्व शोभने ।\n\nयोगमन्विच्छ रामेण शशाङ्केनेव रोहिणी\nमा विकाङ्क्षस्व मोपेक्षिष्ठाः", "tilaka": "मा विकाह्क्षस्व मोपेक्षां कुर्वित्यर्थः"}}, {"verse_id": "5.37.27", "leonov_ru": "Словно Рохини, говорящая с Луной, ты соединишься [с Рамой], Поднимайся на мою спину, пересеки небо и великий океан.", "commentary": {"bhusana": "कथयन्तीव चन्द्रेण सूर्येण च महार्चिषा ।\n\nमत्पृष्टमधिरुह्य त्वं तराकाशमहार्णवौ", "tilaka": "कथयन्तीव सङ्गन्तव्यो राम इति वचनं कथयन्तीव । शशिना रोहिणीव सङ्गमिष्यसीत्यन्वयः । एतद्वचनसमकालमेव रामसमीपं प्रापयिष्यामीत्यर्थः । यथा तद्वचने न प्रयासः, एवमनायासेन त्वां नयामीत्यर्थो वा । आकाशं तन्मार्गमवलम्ब्य महार्णवं तरेत्यन्वयः ।। 5.37.27,28 ।।\n\nत्वामुद्यम्य पृष्ठे कृत्वा विहायसं यास्यामि पश्य", "siromani": "पौलोमीति । मत्पृष्ठमधिरोह अत एव महार्णवमिवाकाशं तर\nनहीति । इतस्त्वां नयतो मे गतिमनुगन्तुं सर्वे लङ्कानिवासिनो न शक्ताः"}}], "phase1_here": [], "leonov_here": [{"editor": "kostina", "note": "На вершине владыки гор (nagarājasya mūrdhani) – комментарий «Тилака» поясняет, что речь идет о горе Прасраване. В различных рукописях в качестве первого элемента композита могут стоять слова naga (гора); nāga (слон/наг) или naka (небо). Во втором элементе композита также могут быть разночтения: rājasya или pṛṣṭhasya. Таким образом, композит может переводиться как «на вершине неба», «на голове царя нагов» и т. п. Здесь перевод сделан по бомбейскому изданию.[Е. Костина] «.» Непонятно, почему предпочтение отдано Бомбейскому изданию. Если в качестве основного рассматривается Гита-пресс, отход от него должен как-то аргументироваться[Claude.AI — желательно] [термин] (не учтено) Первое появление в кн. V; введено в :"}]}, {"verse_id": "5.37.36", "lemma_iast": "pādapād āplutya", "note_ru": "По Тилаке, Хануман нарочно спрыгивает именно с дерева на землю, прежде чем начать увеличиваться в размерах: треск ломающихся под его тяжестью ветвей выдал бы его ракшасини-стражницам, а рост на земле остаётся неслышным — деталь, которую подстрочник не проясняет.", "source_commentary": ["tilaka"], "kazansky_type": "Б", "subtype": "commentator", "review_required": true, "provenance": {"model": "claude-sonnet-5", "tier": "Sonnet", "step": "phase2_pilot_draft"}, "why_proposed": "Объясняет постановочную деталь (спрыгивает, чтобы треск ветвей не выдал) — мотивировка, не проясняемая подстрочником.", "sanskrit_iast": "sa tasmāt pādapād dhīmān āplutya plavagarṣabhaḥ । tato vardhitum ārebhe sītāpratyayakāraṇāt ॥36॥", "leonov_ru": "Спрыгнув с того дерева мудрый бык среди обезьян Тогда начал расти, чтобы убедить Ситу.", "commentary_at_verse": {"siromani": "स इति । स हनूमान् तस्याः प्रत्ययकारणात् प्रतीतिहेतोः पादपात् आप्लुत्य वर्धितुमारेभे"}, "neighbours": [{"verse_id": "5.37.34", "leonov_ru": "«Не знает силу мою и мощь черноглазая. Тогда пусть увидит Вайдехи, как форма моя [изменяется] по [моему] желанию».", "commentary": {"tilaka": "कामत इच्चाकृतम् ।। 5.37.34,35 ।।\n\nतस्मात्पादपाच्छिंशपातः । शरीरवृद्धौ तद्भारजातशाखाभङ्गध्वनिना राक्षस्यो ज्ञास्यन्तीति तत आप्लुतिः", "bhusana": "न मे जानाति सत्त्वं वा प्रभावं वा ऽसितेक्षणा ।\n\nतस्मात् पश्यतु वैदही यद्रूपं मम कामतः\nन मे जानाति सत्त्वं वा प्रभावं वा ऽसितेक्षणा । तस्मात्पश्यतु वैदेही यद्रूपं मम कामतः । इति पाठः । अन्यथापाठे वक्ष्यमाणेन विरोधस्स्यात्\nस तस्मात् पादपाद्धीमानाप्लुत्य प्लवगर्षभः ।\n\nततो वर्धितुमारेभे सीताप्रत्ययकारणात्\nएतदेवाह स तस्मादिति । अयं श्लोको वर्धनार्थं वृक्षादवरोहणं दर्शयति स्म । अनेन सो ऽवतीर्य द्रुमादिति पूर्वं द्रुमाग्रात्सीतासमीपस्थशाखायामवतरणमुक्तम्, अत्र भूमाविति बोध्यम्"}}, {"verse_id": "5.37.35", "leonov_ru": "Так подумав, Хануман тогда, лучший среди обезьян, Показал Сите свой [истинный] облик, губитель врагов.", "commentary": {"siromani": "तदाकारमाह नेति । मे सत्वं बलं प्रभावं च वैदेही न जानाति तस्माद्धेतोः मम यद्रूपं तत् कामतः स्वेच्छया पश्यतु\nइतीति । प्लवगसत्तमो हनुमान् इति संचिन्य वैदेह्या वैदेह्यै स्वरूपं दर्शयामास"}}, {"verse_id": "5.37.37", "leonov_ru": "Стал он, подобный пылающему огню, подобен [горам] Меру и Мандаре, И встал перед Ситой бык среди обезьян.", "commentary": {"tilaka": "अग्रतो व्यवतस्थे योग्यपुरोदेशे स्थितः ।। 5.37.37,38 ।।\n\nसनाथां सरावणाम् । नयितुं नेतुम्", "bhusana": "मेरुमन्दरसङ्काशो बभौ दीप्तानलप्रभः ।\n\nअग्रतो व्यवतस्थे च सीताया वानरोत्तमः", "siromani": "मेर्विति । वानर्षभो हनूमान् मेरुमन्दरसंकाशः सन् बभौ सीताया अग्रतो ऽग्रे व्यवतस्थे च"}}, {"verse_id": "5.37.38", "leonov_ru": "Обезьяна гороподобная, с темно-красной мордой, наделенная великой силой, С клыками и когтями словно из алмаза, устрашающий, сказал [Хануман] Вайдехи:", "commentary": {"bhusana": "हरिः पर्वतसङ्काशस्ताम्रवक्त्रो महाबलः ।\n\nवज्रदंष्ट्रनखो भीमो वैदेहीमिदमब्रवीत्\nतं दृष्ट्वा भीमसङ्काशमुवाच जनकात्मजा ।\n\nपद्मपत्रविशालाक्षी मारुतस्यौरसं सुतम्", "siromani": "हरिरिति । वज्रवत् दंष्ट्रा नखानि यस्य स हनूमान् वैदेहीमिदमब्रवीत्"}}], "phase1_here": [], "leonov_here": [{"editor": "kostina", "note": "С дерева спрыгнул мудрый… (sa tasmāt pādapād dhīmān āplutya) – по контексту можно понять, что Хануман уже давно сошел с дерева.[Е. Костина] Нужно сделать здесь отсылку на строфы ранее, где это обсуждается, а там - на эту строфу"}]}], "labels": {"tilaka": "Тилака", "bhusana": "Бхушана", "siromani": "Широмани"}};
const KEY = "sundara_pilot_decisions_v1";
const dec = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function commBlock(comm, cited){
  return Object.keys(comm||{}).map(c=>{
    const isC = (cited||[]).includes(c);
    return `<div class="comm ${isC?'cited':''}"><span class="who">${D.labels[c]||c}${isC?' · использован':''}</span><span class="dev">${esc(comm[c])}</span></div>`;
  }).join("");
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  // per-sarga stat header
  Object.keys(D.stats).sort((a,b)=>a-b).forEach(s=>{
    const st=D.stats[s];
    app.appendChild($(`<div class="stat">Песнь ${s}: стихов ${st.verses} · с санскр. комментарием ${st.with_commentary} · <b>собственных примечаний Леонова/Костиной ${st.leonov_notes||0}</b> · наш аппарат фазы 1 ${st.phase1_notes} · <b>предложено сейчас ${st.proposed}</b></div>`));
  });
  D.notes.forEach((n,i)=>{
    const d=dec[n.verse_id]||{};
    const card=$(`<div class="card ${d.action?('d-'+d.action):''}" id="c${i}"></div>`);
    card.innerHTML=`
      <div class="vid">${n.verse_id}
        <span class="badges"><span class="badge">${n.kazansky_type}</span>
        <span class="badge">${(n.source_commentary||[]).map(c=>D.labels[c]||c).join(', ')}</span></span></div>
      <div class="verse">
        <div class="sa dev">${esc(n.sanskrit_iast)||'<i>—</i>'}</div>
        <div class="ru">${esc(n.leonov_ru)||'<i>подстрочник не найден</i>'}</div>
      </div>
      <div class="why"><b>Зачем предложено:</b> ${esc(n.why_proposed)}</div>
      ${n.leonov_here.length?`<div class="leo"><b>⚠ Леонов/Костина УЖЕ комментируют этот стих</b> — проверьте на дублирование:${
        n.leonov_here.map(l=>`<div><span class="who">${l.editor||'Леонов'}:</span> ${esc(l.note).slice(0,260)}</div>`).join("")
      }</div>`:''}
      <div class="note" contenteditable="false">${esc(n.note_ru)}</div>
      <details><summary>Санскритский источник (все комментаторы к этому стиху)</summary>${commBlock(n.commentary_at_verse,n.source_commentary)}</details>
      ${n.neighbours.length?`<details><summary>Соседние стихи (±2) — что рядом комментируется</summary>${
        n.neighbours.map(nb=>`<div class="p1"><b>${nb.verse_id}</b> ${esc(nb.leonov_ru).slice(0,140)}</div>${commBlock(nb.commentary,[])}`).join("")
      }</details>`:''}
      ${n.phase1_here.length?`<div class="p1"><b>Уже есть (фаза 1) на этом стихе:</b> ${n.phase1_here.map(p=>esc(p.lemma)+' — '+esc(p.note).slice(0,120)).join(' · ')}</div>`:''}
      <div class="controls">
        <label><input type="radio" name="a${i}" value="accept"> ✅ принять</label>
        <label><input type="radio" name="a${i}" value="edit"> ✏️ править</label>
        <label><input type="radio" name="a${i}" value="reject"> ❌ отклонить</label>
      </div>
      <textarea class="hidden" id="e${i}" rows="3">${esc(d.edited_note||n.note_ru)}</textarea>
      <input class="rr hidden" id="r${i}" placeholder="Причина отклонения / замечание…" value="${esc(d.reject_reason||'')}">
    `;
    app.appendChild(card);
    // wire
    card.querySelectorAll(`input[name=a${i}]`).forEach(r=>{
      if(d.action===r.value) r.checked=true;
      r.onchange=()=>set(i,n.verse_id,r.value);
    });
    toggle(i,d.action);
  });
  prog();
}
function toggle(i,action){
  document.getElementById("e"+i).classList.toggle("hidden",action!=="edit");
  document.getElementById("r"+i).classList.toggle("hidden",action!=="reject");
}
function set(i,vid,action){
  const rec=dec[vid]||{};
  rec.action=action;
  rec.edited_note=document.getElementById("e"+i).value;
  rec.reject_reason=document.getElementById("r"+i).value;
  rec.ts=new Date().toISOString();
  dec[vid]=rec;
  document.getElementById("e"+i).oninput=()=>{rec.edited_note=document.getElementById("e"+i).value;save();};
  document.getElementById("r"+i).oninput=()=>{rec.reject_reason=document.getElementById("r"+i).value;save();};
  document.getElementById("c"+i).className="card d-"+action;
  toggle(i,action);save();prog();
}
function save(){localStorage.setItem(KEY,JSON.stringify(dec));}
function prog(){
  const done=D.notes.filter(n=>dec[n.verse_id]&&dec[n.verse_id].action).length;
  const a=D.notes.filter(n=>(dec[n.verse_id]||{}).action==="accept").length;
  const e=D.notes.filter(n=>(dec[n.verse_id]||{}).action==="edit").length;
  const r=D.notes.filter(n=>(dec[n.verse_id]||{}).action==="reject").length;
  document.getElementById("progress").innerHTML=`<b>${done}/${D.notes.length}</b> решено · ✅ ${a} · ✏️ ${e} · ❌ ${r}`;
}
function payload(){return JSON.stringify({generated:D.generated,reviewer_decisions:dec,
  reviewed_at:new Date().toISOString()},null,2);}
function dl(){const b=new Blob([payload()],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download="commentarystrategies-sundarakanda-commentaries_35-37_decisions.json";a.click();URL.revokeObjectURL(u);}
function cp(){navigator.clipboard.writeText(payload()).then(()=>alert("JSON скопирован в буфер обмена"));}
function reset(){if(confirm("Сбросить все решения?")){localStorage.removeItem(KEY);for(const k in dec)delete dec[k];render();}}
render();
</script></body></html>
